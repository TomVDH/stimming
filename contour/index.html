<style>
/* Contour map: a survey sheet; press to raise the land. */
:root { --stage: oklch(0.14 0.012 250); }
.stage--contour { background: var(--stage); cursor: none; }
.stage--contour canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  touch-action: none;
}
.stage--contour canvas.ct-sheet { opacity: 0; transition: opacity 0.8s ease; }
.stage--contour canvas.ct-sheet.on { opacity: 1; }
.stage--contour canvas.ct-ink { pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .stage--contour canvas.ct-sheet { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Contour map</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--contour" id="stage" tabindex="0" role="application" aria-label="A topographic map sheet seen from above: a coast with green lowlands, tan hills and pale peaks, brown contour lines every 20 metres and a bolder index line every 100 metres with its height written on it, and a blue sea with depth lines. Press and hold to raise a hill under the pointer; drag to raise a ridge. Dig with the right button, with Alt held, or with the Dig pick; Smooth softens the land. The lines move and split as the land changes. The sea floods in where the land drops below zero; a dug hollow fills as a lake, and a full lake spills a river to the sea. Peaks carry a survey triangle and their height. The Brush slider sets the hill's width. Press N for a new land.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Contour map</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
