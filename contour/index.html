<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.14 0.012 250); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contour map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./terrain.js">
<link rel="modulepreload" href="./labels.js">
<link rel="modulepreload" href="./render.js">
<link rel="modulepreload" href="./sound.js">
<link rel="modulepreload" href="../shared/detail.js">
<link rel="modulepreload" href="../shared/gl.js">
<style>
/* Contour map: a survey sheet; press to raise the land. */
:root { --stage: oklch(0.14 0.012 250); }
.stage--contour { background: var(--stage); cursor: none; }
.stage--contour canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  touch-action: none;
}
.stage--contour canvas.ct-sheet { opacity: 0; transition: opacity 0.8s ease; }
.stage--contour canvas.ct-sheet.on { opacity: 1; }
.stage--contour canvas.ct-ink { pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .stage--contour canvas.ct-sheet { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Contour map</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--contour" id="stage" tabindex="0" role="application" aria-label="A topographic map sheet seen from above: a coast with green lowlands, tan hills and pale peaks, brown contour lines every 20 metres and a bolder index line every 100 metres with its height written on it, and a blue sea with depth lines. Press and hold to raise a hill under the pointer; drag to raise a ridge. Dig with the right button, with Alt held, or with the Dig pick. The lines move and split as the land changes, and the sea floods in where the land drops below zero. The Brush slider sets the hill's width. Press N for a new land.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Contour map</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
