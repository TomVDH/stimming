<title>Stimming</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600&display=swap">
<style>
/* Layout: title, then the toys standing in one row (two on narrow screens). */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --sketch: oklch(0.52 0.025 275);
  --focus: oklch(0.84 0.13 205);
  --pick: oklch(0.7 0.18 320 / 0.35);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: oklch(0.965 0.006 255); --fg: oklch(0.2 0.02 270); --muted: oklch(0.5 0.02 265);
    --sketch: oklch(0.62 0.02 260); --focus: oklch(0.52 0.17 255);
    --pick: oklch(0.7 0.18 320 / 0.25); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: oklch(0.965 0.006 255); --fg: oklch(0.2 0.02 270); --muted: oklch(0.5 0.02 265);
  --sketch: oklch(0.62 0.02 260); --focus: oklch(0.52 0.17 255);
  --pick: oklch(0.7 0.18 320 / 0.25); color-scheme: light;
}
body {
  background: var(--bg); color: var(--fg); font: 500 16px/1.3 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--pick); }
.defs { position: absolute; width: 0; height: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: clamp(28px, 5vw, 56px) 64px; display: grid; gap: clamp(28px, 6vw, 80px); }
h1 { margin: 0; font-size: clamp(30px, 4.2vw, 48px); font-weight: 600; letter-spacing: -0.025em; line-height: 1; }
.shelf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 3vw, 40px); max-width: 1000px; margin: 0; padding: 0; list-style: none; }
@media (max-width: 560px) { .shelf { column-gap: 8px; row-gap: 28px; } .name { font-size: 14px; } }
.toy { display: grid; justify-items: center; gap: clamp(8px, 1.4vw, 16px); color: inherit; text-decoration: none; border-radius: 20px; }
a.toy { cursor: pointer; }
a.toy:focus-visible { outline: 2px solid var(--focus); outline-offset: 6px; }
.obj { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; display: grid; place-items: center; }
.obj svg { width: 70%; height: 70%; overflow: visible; }
.name { font-size: clamp(16px, 1.5vw, 19px); letter-spacing: -0.01em; }
.toy:not(a) .name { color: var(--muted); }
.sketch { fill: none; stroke: var(--sketch); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-morph" x1="0" y1="0" x2="1" y2="1">
      <stop id="morph-a" offset="0" style="stop-color: #f7b65b"/>
      <stop id="morph-b" offset="1" style="stop-color: #d23c34"/>
    </linearGradient>
    <linearGradient id="g-knob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.89 0.13 88)"/>
      <stop offset="1" style="stop-color: oklch(0.64 0.17 48)"/>
    </linearGradient>
    <linearGradient id="g-cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.92 0.1 165)"/>
      <stop offset="1" style="stop-color: oklch(0.64 0.13 225)"/>
    </linearGradient>
    <linearGradient id="g-sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.9 0.05 85)"/>
      <stop offset="1" style="stop-color: oklch(0.76 0.07 62)"/>
    </linearGradient>
    <linearGradient id="g-stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.5 0.015 250)"/>
      <stop offset="1" style="stop-color: oklch(0.22 0.01 260)"/>
    </linearGradient>
    <linearGradient id="g-fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" style="stop-color: oklch(0.9 0.14 85)"/>
      <stop offset="0.45" style="stop-color: oklch(0.74 0.19 55)"/>
      <stop offset="1" style="stop-color: oklch(0.56 0.21 30)"/>
    </linearGradient>
    <linearGradient id="g-fire-core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" style="stop-color: oklch(0.98 0.05 95)"/>
      <stop offset="1" style="stop-color: oklch(0.88 0.15 80)"/>
    </linearGradient>
    <clipPath id="tray-clip"><rect x="12" y="20" width="104" height="88" rx="18"/></clipPath>
  </defs>
</svg>

<div class="wrap">
  <h1>Stimming</h1>
  <main>
    <ul class="shelf">
      <li>
        <a class="toy" id="morphset" href="morphset/index.html">
          <span class="obj">
            <svg viewBox="0 0 128 128" aria-hidden="true">
              <path id="morph-shape" fill="url(#g-morph)"/>
              <use href="#morph-shape" fill="url(#lit)"/>
              <use href="#morph-shape" fill="none" stroke="url(#rim)" stroke-width="2"/>
            </svg>
          </span>
          <span class="name">Morphset</span>
        </a>
      </li>
      <li>
        <a class="toy" id="fidget" href="fidget/index.html">
          <span class="obj">
            <svg viewBox="0 0 128 128" aria-hidden="true">
              <g id="dial-ticks" class="sketch"></g>
              <circle cx="64" cy="64" r="44" fill="url(#g-knob)"/>
              <circle cx="64" cy="64" r="44" fill="url(#lit)"/>
              <circle cx="64" cy="64" r="44" fill="none" stroke="url(#rim)" stroke-width="2"/>
              <g id="dial-knob">
                <circle cx="64" cy="64" r="34" fill="none" stroke="oklch(0.55 0.12 50 / 0.35)" stroke-width="1.5"/>
                <line x1="64" y1="27" x2="64" y2="42" stroke="oklch(0.36 0.08 45)" stroke-width="5" stroke-linecap="round"/>
              </g>
            </svg>
          </span>
          <span class="name">Fidget board</span>
        </a>
      </li>
      <li>
        <a class="toy" id="pop" href="pop/index.html">
          <span class="obj">
            <svg viewBox="0 0 128 128" aria-hidden="true">
              <g id="pop-cells"></g>
            </svg>
          </span>
          <span class="name">Pop field</span>
        </a>
      </li>
      <li>
        <a class="toy" id="sand" href="sand/index.html">
          <span class="obj">
            <svg viewBox="0 0 128 128" aria-hidden="true">
              <rect x="12" y="20" width="104" height="88" rx="18" fill="url(#g-sand)"/>
              <g id="sand-grooves" clip-path="url(#tray-clip)" fill="none" stroke="oklch(0.68 0.06 62 / 0.8)" stroke-width="2"></g>
              <rect x="12" y="20" width="104" height="88" rx="18" fill="url(#lit)"/>
              <rect x="12" y="20" width="104" height="88" rx="18" fill="none" stroke="url(#rim)" stroke-width="2"/>
              <g id="sand-stone">
                <ellipse cx="76" cy="58" rx="12" ry="9.5" fill="url(#g-stone)"/>
                <ellipse cx="76" cy="58" rx="12" ry="9.5" fill="url(#lit)"/>
              </g>
            </svg>
          </span>
          <span class="name">Zen sand</span>
        </a>
      </li>
      <li>
        <a class="toy" id="fire" href="fire/index.html">
          <span class="obj">
            <svg viewBox="0 0 128 128" aria-hidden="true">
              <path id="fire-outer" fill="url(#g-fire)"/>
              <path id="fire-inner" fill="url(#g-fire-core)"/>
              <use href="#fire-outer" fill="none" stroke="url(#rim)" stroke-width="2"/>
            </svg>
          </span>
          <span class="name">Fire</span>
        </a>
      </li>
      <li>
        <div class="toy" id="slime" role="group" aria-label="Slime, not built yet">
          <span class="obj">
            <svg viewBox="0 0 128 128" aria-hidden="true">
              <g id="slime-body" class="sketch">
                <path d="M28 94C20 70 34 44 60 40C88 36 106 58 102 84C100 98 88 104 66 104C46 104 32 102 28 94Z"/>
                <path d="M86 104C87 108 88 110 88 112"/>
                <circle cx="88" cy="117" r="3.5"/>
              </g>
            </svg>
          </span>
          <span class="name" aria-hidden="true">Slime</span>
        </div>
      </li>
      <li>
        <a class="toy" id="domino" href="domino/index.html">
          <span class="obj">
            <svg viewBox="0 0 128 128" aria-hidden="true">
              <line class="sketch" x1="10" y1="98" x2="118" y2="98"/>
              <g id="domino-tiles"></g>
            </svg>
          </span>
          <span class="name">Domino run</span>
        </a>
      </li>
      <li>
        <div class="toy" id="cube" role="group" aria-label="Infinity cube, not built yet">
          <span class="obj">
            <svg viewBox="0 0 128 128" aria-hidden="true">
              <g id="cube-all" class="sketch">
                <g id="cube-top">
                  <rect x="38" y="38" width="24" height="24" rx="3"/>
                  <rect x="66" y="38" width="24" height="24" rx="3"/>
                </g>
                <rect x="38" y="66" width="24" height="24" rx="3"/>
                <rect x="66" y="66" width="24" height="24" rx="3"/>
              </g>
            </svg>
          </span>
          <span class="name" aria-hidden="true">Infinity cube</span>
        </div>
      </li>
      <li>
        <div class="toy" id="magnet" role="group" aria-label="Magnet balls, not built yet">
          <span class="obj">
            <svg viewBox="0 0 128 128" aria-hidden="true">
              <g id="magnet-balls" class="sketch"></g>
            </svg>
          </span>
          <span class="name" aria-hidden="true">Magnet balls</span>
        </div>
      </li>
    </ul>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/MorphSVGPlugin.min.js"></script>
<script>
(() => {
  const { gsap, MorphSVGPlugin } = window;
  gsap.registerPlugin(MorphSVGPlugin);
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };
  const d = pts => 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + 'Z';
  const ring = (n, r, rot = -Math.PI / 2, cx = 64, cy = 64) =>
    Array.from({ length: n }, (_, k) => [cx + r * Math.cos(rot + (k * TAU) / n), cy + r * Math.sin(rot + (k * TAU) / n)]);
  const polar = fn => Array.from({ length: 120 }, (_, k) => {
    const a = (k / 120) * TAU, r = fn(a);
    return [64 + r * Math.sin(a), 64 - r * Math.cos(a)];
  });


  // Each toy has a looping timeline while active and a way back to rest.
  const toys = {};

  // Shapes and colours come from Morphset's own marks: Prism, Twist, Bloom, Wave, Fuse.
  const morphPath = document.getElementById('morph-shape');
  const stopA = document.getElementById('morph-a'), stopB = document.getElementById('morph-b');
  const marks = [
    [d(ring(3, 54, -Math.PI / 2, 64, 70)), '#f7b65b', '#d23c34'],
    [d(Array.from({ length: 10 }, (_, k) => ring(10, k % 2 ? 22 : 54, -Math.PI / 2, 64, 67)[k])), '#dd9ff2', '#8b3fd1'],
    [d(polar(a => 22 + 30 * Math.abs(Math.cos(3 * a)) ** 0.55)), '#f7a1c4', '#d63b6e'],
    [d(polar(a => 30 + 8 * Math.cos(2 * a))), '#8fd0f2', '#3b63d6'],
    [d(polar(() => 44)), '#c4ec7a', '#3fae5e'],
  ];
  morphPath.setAttribute('d', marks[0][0]);
  const to = (tl, [shape, a, b], dur, ease, at) => tl
    .to(morphPath, { morphSVG: shape, duration: dur, ease }, at)
    .to(stopA, { stopColor: a, duration: dur, ease }, '<')
    .to(stopB, { stopColor: b, duration: dur, ease }, '<');
  toys.morphset = {
    play() {
      const tl = gsap.timeline({ repeat: -1 });
      marks.slice(1).concat([marks[0]]).forEach(m => to(tl, m, 0.7, 'expo.inOut', '+=0.25'));
      return tl;
    },
    rest() { to(gsap.timeline(), marks[0], 0.5, 'power3.out'); },
  };

  const ticks = document.getElementById('dial-ticks'), knob = document.getElementById('dial-knob');
  for (let k = 0; k < 24; k++) {
    const a = (k / 24) * TAU, r0 = k % 3 ? 53 : 50;
    el('line', { x1: 64 + r0 * Math.sin(a), y1: 64 - r0 * Math.cos(a), x2: 64 + 57 * Math.sin(a), y2: 64 - 57 * Math.cos(a) }, ticks);
  }
  toys.fidget = {
    // The knob steps one 30° detent at a time and stays where it stops.
    play() {
      return gsap.timeline({ repeat: -1 })
        .to(knob, { rotation: '+=30', svgOrigin: '64 64', duration: 0.3, ease: 'back.out(3)' })
        .to({}, { duration: 0.16 });
    },
    rest() {},
  };

  const cellsG = document.getElementById('pop-cells');
  const cells = [[64, 64], ...ring(6, 31, -Math.PI / 3)].map(([x, y]) => {
    const g = el('g', {}, cellsG), hex = d(ring(6, 16, -Math.PI / 2, x, y));
    el('path', { d: hex, fill: 'url(#g-cell)' }, g);
    el('path', { d: hex, fill: 'url(#lit)' }, g);
    el('path', { d: hex, fill: 'none', stroke: 'url(#rim)', 'stroke-width': 1.5 }, g);
    return g;
  });
  toys.pop = {
    play() {
      const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.4 });
      [1, 2, 3, 4, 5, 6, 0].forEach((k, i) => {
        const c = cells[k], at = i * 0.22;
        tl.to(c, { scaleX: 1.14, scaleY: 0.8, transformOrigin: '50% 50%', duration: 0.12, ease: 'power2.out' }, at)
          .to(c, { scale: 0.3, opacity: 0.25, duration: 0.12, ease: 'power3.in' }, at + 0.12)
          .to(c, { scale: 1, opacity: 1, duration: 0.9, ease: 'elastic.out(1, 0.45)' }, at + 0.6);
      });
      return tl;
    },
    rest() { gsap.to(cells, { scale: 1, opacity: 1, duration: 0.4, ease: 'power3.out', overwrite: true }); },
  };

  const grooves = document.getElementById('sand-grooves'), stone = document.getElementById('sand-stone');
  const rings = [19, 26, 34, 43, 53, 65].map(r => el('ellipse', { cx: 76, cy: 58, rx: r, ry: r * 0.82, pathLength: 100, 'stroke-dasharray': '100 100' }, grooves));
  toys.sand = {
    // Grooves are raked again from the stone outward.
    play() {
      return gsap.timeline({ repeat: -1, repeatDelay: 0.3 })
        .to(rings, { strokeDashoffset: 100, duration: 0.35, ease: 'power2.in', stagger: 0.05 })
        .fromTo(rings, { strokeDashoffset: -100 }, { strokeDashoffset: 0, duration: 0.9, ease: 'power2.inOut', stagger: 0.12 })
        .to(stone, { x: 2, y: -1.5, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
    },
    rest() {
      gsap.to(rings, { strokeDashoffset: 0, duration: 0.4, ease: 'power2.out', overwrite: true });
      gsap.to(stone, { x: 0, y: 0, duration: 0.4, overwrite: true });
    },
  };

  // Flame tongues sway between three outlines.
  const fireOuter = document.getElementById('fire-outer'), fireInner = document.getElementById('fire-inner');
  const flame = (x, y, s) => `M${x} ${y}C${x + 8 + s} ${y + 26} 96 56 94 84C92 104 80 114 64 114C48 114 36 104 34 86C32 66 44 58 50 44C52 54 56 60 60 62C58 46 ${x - 6 + s} ${y + 20} ${x} ${y}Z`;
  const core = (x, y) => `M${x} ${y}C${x + 6} ${y + 18} 80 82 79 94C78 106 72 112 64 112C56 112 49 106 49 95C49 84 ${x - 6} ${y + 16} ${x} ${y}Z`;
  const flames = [[flame(64, 10, 0), core(64, 56)], [flame(58, 16, -4), core(61, 60)], [flame(70, 12, 4), core(67, 57)]];
  fireOuter.setAttribute('d', flames[0][0]);
  fireInner.setAttribute('d', flames[0][1]);
  toys.fire = {
    play() {
      const tl = gsap.timeline({ repeat: -1 });
      [1, 2, 0].forEach(k => tl
        .to(fireOuter, { morphSVG: flames[k][0], duration: 0.24, ease: 'sine.inOut' })
        .to(fireInner, { morphSVG: flames[k][1], duration: 0.24, ease: 'sine.inOut' }, '<'));
      return tl;
    },
    rest() {
      gsap.to(fireOuter, { morphSVG: flames[0][0], duration: 0.3 });
      gsap.to(fireInner, { morphSVG: flames[0][1], duration: 0.3 });
    },
  };

  const slime = document.getElementById('slime-body');
  toys.slime = {
    // The blob squashes and springs back like putty.
    play() {
      return gsap.timeline({ repeat: -1, repeatDelay: 0.2 })
        .to(slime, { scaleX: 1.12, scaleY: 0.86, transformOrigin: '50% 82%', duration: 0.35, ease: 'power2.out' })
        .to(slime, { scaleX: 0.94, scaleY: 1.08, duration: 0.3, ease: 'power2.inOut' })
        .to(slime, { scaleX: 1, scaleY: 1, duration: 0.6, ease: 'elastic.out(1, 0.4)' });
    },
    rest() { gsap.to(slime, { scaleX: 1, scaleY: 1, duration: 0.4, overwrite: true }); },
  };

  // Tiles run through the series hues, like the toy's rainbow chain.
  const tiles = [22, 41, 60, 79, 98].map((x, k) => el('rect', {
    x: x - 4.5, y: 62, width: 9, height: 36, rx: 2,
    style: `fill: oklch(0.74 0.16 ${28 + k * 62})`, stroke: 'url(#rim)', 'stroke-width': 1.2,
  }, document.getElementById('domino-tiles')));
  toys.domino = {
    // Tiles topple in turn from the left.
    play() {
      return gsap.timeline({ repeat: -1, repeatDelay: 0.5 })
        .to(tiles, { rotation: 58, transformOrigin: '100% 100%', duration: 0.32, ease: 'power2.in', stagger: 0.14 })
        .to(tiles, { rotation: 0, duration: 0.4, ease: 'power3.out', stagger: { each: 0.05, from: 'end' } }, '+=0.5');
    },
    rest() { gsap.to(tiles, { rotation: 0, duration: 0.3, overwrite: true }); },
  };

  const cubeTop = document.getElementById('cube-top'), cubeAll = document.getElementById('cube-all');
  toys.cube = {
    // The top half folds down, then the cube turns a quarter.
    play() {
      return gsap.timeline({ repeat: -1 })
        .to(cubeTop, { scaleY: -1, transformOrigin: '50% 100%', duration: 0.45, ease: 'power2.inOut' })
        .to(cubeTop, { scaleY: 1, duration: 0.45, ease: 'power2.inOut' })
        .to(cubeAll, { rotation: '+=90', svgOrigin: '64 64', duration: 0.4, ease: 'back.out(2)' });
    },
    rest() { gsap.to(cubeTop, { scaleY: 1, duration: 0.3, overwrite: true }); },
  };

  const pile = [[50, 74], [64, 70], [78, 76], [57, 86], [72, 88], [44, 62], [86, 62]];
  const balls = pile.map(([x, y]) => el('circle', { cx: x, cy: y, r: 7 }, document.getElementById('magnet-balls')));
  toys.magnet = {
    // Balls snap from a loose pile into a ring and back.
    play() {
      const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.6 });
      balls.forEach((b, k) => {
        const a = -Math.PI / 2 + (k * TAU) / balls.length;
        tl.to(b, { attr: { cx: 64 + 26 * Math.cos(a), cy: 64 + 26 * Math.sin(a) }, duration: 0.3, ease: 'back.out(2.4)' }, k * 0.07);
      });
      return tl.to(balls, { attr: { cx: k => pile[k][0], cy: k => pile[k][1] }, duration: 0.5, ease: 'power3.inOut', stagger: 0.04 }, '+=0.7');
    },
    rest() { gsap.to(balls, { attr: { cx: k => pile[k][0], cy: k => pile[k][1] }, duration: 0.3, overwrite: true }); },
  };

  // Hover or focus plays a toy; touch screens play toys while they are in view.
  const running = new Map();
  function start(t) {
    if (running.has(t)) return;
    t.classList.add('on');
    running.set(t, reduce ? null : toys[t.id].play());
  }
  function stop(t) {
    if (!running.has(t)) return;
    t.classList.remove('on');
    running.get(t)?.kill();
    running.delete(t);
    toys[t.id].rest();
  }
  const all = [...document.querySelectorAll('.toy')];
  if (matchMedia('(hover: hover)').matches) {
    all.forEach(t => {
      t.addEventListener('pointerenter', () => start(t));
      t.addEventListener('pointerleave', () => stop(t));
      t.addEventListener('focusin', () => start(t));
      t.addEventListener('focusout', () => stop(t));
    });
  } else {
    const io = new IntersectionObserver(es => es.forEach(e => (e.isIntersecting ? start(e.target) : stop(e.target))), { threshold: 0.6 });
    all.forEach(t => io.observe(t));
  }
})();
</script>
