<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Window seat compare</title>
<style>
  :root { --bg: oklch(0.14 0.01 260); --fg: oklch(0.9 0.01 260); --mute: oklch(0.6 0.01 260); --line: oklch(0.3 0.01 260); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 12px/1.2 ui-monospace, monospace; letter-spacing: 0.06em; text-transform: uppercase; }
  body { display: grid; grid-template-rows: auto 1fr; }
  nav { display: flex; gap: 6px; padding: 10px 16px; flex-wrap: wrap; align-items: center; }
  nav button { background: none; color: var(--mute); border: 1px solid var(--line); padding: 6px 10px; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
  nav button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 8px 8px; min-height: 0; }
  figure { margin: 0; display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  figcaption { padding: 4px 8px 6px; color: var(--mute); }
  iframe { width: 100%; height: 100%; border: 0; background: #000; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>
</head>
<body>
<nav id="hours"></nav>
<main>
  <figure><figcaption>Classic: raw WebGL2</figcaption><iframe id="a" title="Classic Window seat"></iframe></figure>
  <figure><figcaption>Fresh: three.js</figcaption><iframe id="b" title="Fresh Window seat"></iframe></figure>
</main>
<script>
// Both frames load together, so their clocks and banks match.
const HOURS = ['dawn', 'morning', 'noon', 'golden', 'dusk', 'blue', 'night'];
const nav = document.getElementById('hours');
const a = document.getElementById('a'), b = document.getElementById('b');
function show(h) {
  a.src = `./legacy.html?hour=${h}`;
  b.src = `./index.html?hour=${h}`;
  nav.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.h === h)));
  history.replaceState(null, '', `?hour=${h}`);
}
HOURS.forEach(h => {
  const btn = document.createElement('button');
  btn.textContent = h; btn.dataset.h = h; btn.type = 'button';
  btn.onclick = () => show(h);
  nav.append(btn);
});
show(new URLSearchParams(location.search).get('hour') || 'morning');
</script>
</body>
</html>
