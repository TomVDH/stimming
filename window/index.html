<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.14 0.01 260); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Window seat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Window seat: a night flight, seen through one cabin window. */
:root { --stage: oklch(0.1 0.01 260); }
.stage--window { cursor: grab; touch-action: none; }
.stage--window.dragging { cursor: grabbing; }
/* The Dim chip shows its level as four small pips. */
#dimBtn .pips { display: inline-flex; gap: 3px; margin-left: 7px; }
#dimBtn .pips i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0.22; }
#dimBtn[data-level="1"] .pips i:nth-child(-n+1), #dimBtn[data-level="2"] .pips i:nth-child(-n+2),
#dimBtn[data-level="3"] .pips i:nth-child(-n+3), #dimBtn[data-level="4"] .pips i { opacity: 0.95; }
.stage--window canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--window canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--window canvas { transition: none; } }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.012 275 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Window seat</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--window" id="stage" tabindex="0" role="application" aria-label="A cabin window on a night flight, the wing below. Towns glow on the ground; storms flash inside the clouds. Drag to peer around, dim the glass, tap a storm to make it flash.">
      <p class="fail" hidden>Window seat needs WebGL2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" id="hour" role="group" aria-label="Hour">
        <button class="chip" type="button" data-value="dusk" aria-pressed="true">Dusk</button>
        <button class="chip" type="button" data-value="night" aria-pressed="false">Midnight</button>
        <button class="chip" type="button" data-value="dawn" aria-pressed="false">Dawn</button>
      </div>
      <label class="slider"><span>Storm</span><input type="range" id="storm" min="0" max="1" step="0.01" value="0" aria-label="Storm: how many cells and how often they flash"></label>
      <div class="actions">
        <button class="chip" id="dimBtn" type="button" data-level="0" aria-label="Dim the glass: clear">Dim<span class="pips" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
      </div>
      <div class="edge">
        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings">
            <div class="group"><span>Cloud</span><div class="choices" id="cloud" role="group" aria-label="Cloud">
              <button class="chip" type="button" data-value="0.62" aria-pressed="false">Clear</button>
              <button class="chip" type="button" data-value="0.5" aria-pressed="true">Broken</button>
              <button class="chip" type="button" data-value="0.38" aria-pressed="false">Deck</button>
            </div></div>
            <div class="group"><span>Towns</span><div class="choices" id="towns" role="group" aria-label="Towns">
              <button class="chip" type="button" data-value="0.5" aria-pressed="false">Sparse</button>
              <button class="chip" type="button" data-value="1" aria-pressed="true">Some</button>
              <button class="chip" type="button" data-value="1.7" aria-pressed="false">Dense</button>
            </div></div>
            <div class="group"><span>Sights</span><div class="choices" id="sights" role="group" aria-label="Call a sight now">
              <button class="chip" type="button" data-sight="meteor">Meteor</button>
              <button class="chip" type="button" data-sight="fireball">Fireball</button>
              <button class="chip" type="button" data-sight="rocket">Rocket</button>
              <button class="chip" type="button" data-sight="jet">Jet</button>
              <button class="chip" type="button" data-sight="boom">Impact</button>
            </div></div>
            <div class="group"><span>Rain</span><div class="choices" id="rain" role="group" aria-label="Rain on the window">
              <button class="chip" type="button" data-value="0" aria-pressed="true">Off</button>
              <button class="chip" type="button" data-value="0.5" aria-pressed="false">Light</button>
              <button class="chip" type="button" data-value="1" aria-pressed="false">Heavy</button>
            </div></div>
            <div class="group"><span>Aurora</span><div class="choices" id="aurora" role="group" aria-label="Aurora at midnight">
              <button class="chip" type="button" data-value="off" aria-pressed="false">Off</button>
              <button class="chip" type="button" data-value="on" aria-pressed="true">On</button>
            </div></div>
          </div>
        </div>
        <dl class="how" aria-label="How to play">
          <div><dt>Drag</dt><dd>lean and peer</dd></div>
          <div><dt><span class="fine">Scroll</span><span class="touch">Pinch</span></dt><dd>lean closer</dd></div>
          <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>a storm flashes</dd></div>
        </dl>
      </div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Window seat</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, choices, fitCanvas, whenVisible, reduced, onReducedChange, linFit, quality, onQuality, qualitySetting } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import { QUAD_VS, outsideFS, cabinFS } from './shader.js';
import { bake, lookup, horizonEl, NU, NV } from './sky.js';
import { bakeNoise } from './noise3d.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });
initPage({ id: 'window' });

const PI = Math.PI, TAU = PI * 2, D2R = PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.window.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.window.${k}`, String(v)); } catch { /* storage is optional */ } };
const num = (k, d) => { const v = saved(k); return v != null && isFinite(+v) ? +v : d; };
const opts = {
  hour: saved('hour') || 'dusk',
  storm: num('storm', 0),
  cloud: num('cloud', 0.5),
  towns: num('towns', 1),
  dim: num('dim', 0),
  aurora: saved('aurora') || 'on',
  rain: +(saved('rain') || 0),
};
// A test hook sets values from the address, for screenshots.
const qs = new URLSearchParams(location.search);
for (const k of Object.keys(opts)) if (qs.has(k)) opts[k] = typeof opts[k] === 'number' ? +qs.get(k) : qs.get(k);
let reduce = reduced();
onReducedChange(v => { reduce = v; });

const ALT = 11;            // cruise height in km
const SPEED = 0.25;        // ground speed in km/s, real cruise
const HOR = horizonEl(ALT);
// Each hour places one light: the sun at dusk and dawn, the moon at midnight.
// az: bearing from straight out, toward the nose positive, in degrees.
// rel: height above the eye's horizon, in degrees; the horizon dips 3.4.
// E: light strength for the sky bake. disc: disc brightness.
// tint: a small OKLCH grade for the hour.
const HOURS = {
  dusk: { cabin: [0.017, 0.012, 0.009], moon: false, az: 30, rel: -0.7, E: 13, disc: 0, r: 0.4, stars: 0.45, flare: 0, tint: [0.8, 0.06, 330], floor: [0.0004, 0.0004, 0.0009] },
  night: { cabin: [0.0055, 0.0062, 0.016], moon: true, az: 14, rel: 9, E: 0.5, skyK: 0.45, disc: 1.5, r: 0.5, stars: 1, flare: 0.25, tint: [0.8, 0.05, 255], floor: [0.0005, 0.0007, 0.0014] },
  dawn: { cabin: [0.016, 0.0105, 0.012], moon: false, az: 10, rel: 1.6, E: 4, disc: 5, r: 0.4, stars: 0.12, flare: 0.5, tint: [0.85, 0.05, 70], floor: [0.0003, 0.0003, 0.0006] },
};
const lum = c => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
// The baked sky and the light terms that follow from it.
let sky = null;
function buildSky() {
  const h = HOURS[opts.hour] || HOURS.dusk;
  const el = HOR + h.rel * D2R, az = h.az * D2R;
  const b = bake(ALT, el, h.E);
  // Night eyes see little colour: moonlit haze goes grey-blue.
  if (h.moon) for (let i = 0; i < b.L.length; i += 4) {
    const y = lum([b.L[i], b.L[i + 1], b.L[i + 2]]);
    for (let c = 0; c < 3; c++) b.L[i + c] = (y + (b.L[i + c] - y) * 0.35) * [0.8, 0.95, 1.25][c];
  }
  const sun = [Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)];
  const sunR = h.r * D2R;
  // The part of the disc above the eye's horizon.
  const up = clamp(0.5 + (el - HOR) / (2 * sunR));
  const Tsun = lookup(b.T, el, 0, HOR);
  // Moonlight reads blue to night eyes.
  const shift = h.moon ? [0.8, 0.95, 1.25] : [1, 1, 1];
  const sunL = Tsun.map((v, i) => v * h.E * 1.5 * up * shift[i]);
  // Mean sky light over the upper dome, scaled to the shading constants.
  const amb = [0, 0, 0]; let n = 0;
  for (const e of [5, 15, 30, 50, 75]) for (let a = 0; a < 180; a += 20) {
    const v = lookup(b.L, e * D2R, a * D2R, HOR), w = Math.cos(e * D2R);
    for (let c = 0; c < 3; c++) amb[c] += v[c] * w;
    n += w;
  }
  // The glow that falls into the cabin, low along the window's bearing.
  const out = Math.abs(az), glow = [0, 0, 0];
  for (const e of [1, 4, 8]) { const v = lookup(b.L, HOR + e * D2R, out, HOR); for (let c = 0; c < 3; c++) glow[c] += v[c]; }
  // The sky itself can dim without dimming the light on the clouds.
  if (h.skyK) for (let i = 0; i < b.L.length; i += 4) for (let c = 0; c < 3; c++) b.L[i + c] *= h.skyK;
  const t = linFit(...h.tint), tl = lum(t);
  sky = {
    h, b, sun, sunR, up, sunL,
    sunAz: [Math.sin(az), Math.cos(az)],
    amb: amb.map((v, i) => v / n * 12 + h.floor[i]), glow: glow.map(v => v),
    disc: (h.moon ? [1, 0.97, 0.92] : [1, 1, 1]).map(v => v * h.disc),
    squash: 0.8 + 0.2 * clamp((el - HOR) / (3 * D2R)),
    tint: t.map(v => 1 + (v / tl - 1) * 0.35),
    flareCol: norm(Tsun.map((v, i) => v * shift[i] + 1e-4)).map(v => v * 1.2),
  };
}
const FOV = 64 * D2R;      // field of view across the short side
const ROLL = -6 * D2R;     // the camera tilts a little: a slanted, close look
// The window in the cabin wall, in metres: a tall, wide airliner window.
// The glass you see through is about 27 by 47 cm.
// Local frame: x to the nose, y up, z out through the glass.
const WIN = {
  out: [0.2, 0.31], rOut: 0.19,     // the rim, where the bezel meets the wall
  inn: [0.16, 0.265], rIn: 0.15,    // the pane, at the bottom of the recess
  depth: 0.07, slot: 0.026,         // pane depth and the old shade slot
  // Behind the scratch pane: the inner pane, then the outer pane in the skin.
  zIn: 0.082, zOut: 0.106,
  skin: [0.146, 0.248], rSkin: 0.136, // the skin opening, a little smaller
};
// The eye sits close, a little aft and above the window.
// The head moves within a box around the rest pose, in metres.
const EYE = [-0.04, 0.06, -0.33];
const AIM = [0.03, 0.0, 0.05];
const REACH = { x: [-0.22, 0.2], y: [-0.1, 0.16], z: [-0.14, 0.17] };

/* ---------- WebGL2 ---------- */
const stage = document.getElementById('stage');
const canvas = document.createElement('canvas');
canvas.setAttribute('aria-hidden', 'true');
stage.prepend(canvas);
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
const fail = () => { stage.querySelector('.fail').hidden = false; markReady(); throw new Error('no webgl2'); };
if (!gl) fail();

function program(vs, fs, attrs) {
  const p = gl.createProgram();
  [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(([type, src]) => {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(sh)); fail(); }
    gl.attachShader(p, sh);
  });
  attrs.forEach((name, i) => gl.bindAttribLocation(p, i, name));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); fail(); }
  const u = {};
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(p, i).name; u[n] = gl.getUniformLocation(p, n); }
  return { p, u };
}
const MAXCELL = 6, MAXFL = 4;
const P1 = program(QUAD_VS, outsideFS({ ALT, WIN, MAXCELL, MAXFL }), ['aPos']);
const P2 = program(QUAD_VS, cabinFS({ ALT, WIN }), ['aPos']);
// Pass 1 needs a float target for its bright lamps and discs.
const floatOK = !!gl.getExtension('EXT_color_buffer_float');
function texture(w, h, data = null) {
  const tx = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tx);
  if (data || floatOK) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.FLOAT, data);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tx;
}
const skyTex = { L: null, T: null };
function uploadSky() {
  for (const k of ['L', 'T']) { if (skyTex[k]) gl.deleteTexture(skyTex[k]); skyTex[k] = texture(NU, NV, sky.b[k]); }
}
// The cloud noise volume: 64 cubed, tiling, with mipmaps for far cloud.
const NOISE_N = 64;
const noiseTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_3D, noiseTex);
gl.texImage3D(gl.TEXTURE_3D, 0, gl.RGBA8, NOISE_N, NOISE_N, NOISE_N, 0, gl.RGBA, gl.UNSIGNED_BYTE, bakeNoise(NOISE_N));
gl.generateMipmap(gl.TEXTURE_3D);
gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
for (const w of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T, gl.TEXTURE_WRAP_R]) gl.texParameteri(gl.TEXTURE_3D, w, gl.REPEAT);
// The outside buffer: half size on Standard, three quarters on High.
const outBuf = { fb: gl.createFramebuffer(), tex: null, w: 0, h: 0 };
const outScale = () => (quality() === 'high' ? 0.75 : 0.5);
function sizeOut() {
  const w = Math.max(1, Math.round(W * outScale())), h = Math.max(1, Math.round(H * outScale()));
  if (w === outBuf.w && h === outBuf.h) return;
  if (outBuf.tex) gl.deleteTexture(outBuf.tex);
  outBuf.tex = texture(w, h);
  outBuf.w = w; outBuf.h = h;
  gl.bindFramebuffer(gl.FRAMEBUFFER, outBuf.fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, outBuf.tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
// The recess march takes more steps on High.
const marchSteps = () => (quality() === 'high' ? 28 : 14);
const quadVao = gl.createVertexArray();
gl.bindVertexArray(quadVao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

/* ---------- the aircraft ---------- */
// Aircraft frame: x to the nose, y up, z out of the left window.
// Units are metres from the eye; the seat sits behind the wing.
// The seat sits over the wing, so the wing fills the lower view.
// The wing flexes up at cruise: dihedral plus a bend that grows outboard.
const flex = z => { const s = z - 1.2; return -2.6 + 0.06 * s + 0.0018 * s * s; };
// Wing stations, root to tip: leading edge x, trailing edge x, span z.
// After the 787 planform: leading edge swept about 28 degrees.
// The inboard trailing edge runs straight to a kink at the engine, then sweeps back.
const ST = [[9.5, -1.2, 1.2], [5.93, -1.2, 8.0], [3.3, -2.2, 13], [0.68, -3.2, 18], [-1.42, -4.0, 22], [-3.0, -4.6, 25]];
const WS = ST.map(([l, t, z]) => [[l, flex(z), z], [t, flex(z), z]]);
// Each panel runs leading edge root, leading edge tip, trailing edge tip, trailing edge root.
const PANELS = WS.slice(1).map((w, i) => [WS[i][0], w[0], w[1], WS[i][1]]);
const SPAN = ST.map(w => (w[2] - ST[0][2]) / (ST[5][2] - ST[0][2]));
// The winglet rises from the tip and sweeps back.
const YT = flex(25.0);
const LET = [[-3.0, YT, 25.0], [-4.1, YT + 2.1, 25.6], [-4.75, YT + 2.1, 25.6], [-4.6, YT, 25.0]];
const TIP = [-4.4, YT + 2.05, 25.6];
// The trailing edge x at span z.
function teAt(z) {
  for (let i = 1; i < ST.length; i++) if (z <= ST[i][2]) { const f = (z - ST[i - 1][2]) / (ST[i][2] - ST[i - 1][2]); return ST[i - 1][1] + (ST[i][1] - ST[i - 1][1]) * f; }
  return ST[ST.length - 1][1];
}
// The engine hangs under the wing, its inlet ahead of the leading edge.
const NAC = { a: [4.2, -3.85, 7.5], b: [8.6, -3.85, 7.5], r: 1.45 };
// Three flap-track fairings sit under the trailing edge.
// Each is a nose under the wing and a thin tail aft of it.
const FAIRS = [10, 14.5, 19].map((z, j) => {
  const te = [teAt(z), flex(z), z], k = 1 - 0.18 * j;
  return { a: [te[0] + 2.0 * k, te[1] - 0.33 * k, z, 0.3 * k], b: [te[0] - 1.3 * k, te[1] - 0.46 * k, z, 0.045 * k] };
});
const sub = (a, b) => a.map((v, i) => v - b[i]);
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a); return a.map(v => v / l); };
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
// Each quad's normal faces the eye side, so the edge test agrees.
function quadNormal(v) {
  const n = norm(cross(sub(v[1], v[0]), sub(v[3], v[0])));
  return dot(n, v[0]) > 0 ? n.map(x => -x) : n;
}

let W = 1, H = 1, dpr = 1, t = 0;
// The plane banks gently left; the roll drifts slowly.
let bank = 6 * D2R;

    for (const f of flashes) if (f.cell === c && (!best || f.level > best.level)) best = f;
    // The mushroom glows from its fireball, low in the stem.
    if (c === bc) twC.set([c.x, c.top * 0.35, c.z, 3 * EV.boom.flash + 0.3 * EV.boom.crater], i * 4);
    else twC.set(best ? [best.x, best.y, best.z, best.level] : [c.x, 6, c.z, 0], i * 4);
  });
  return near.length;
}

/* ---------- size ---------- */
function resize(force = false) {
  const fit = fitCanvas(canvas, { budget: 1.6e6 });
  if (!force && fit.W === W && fit.H === H) return;
  W = fit.W; H = fit.H; dpr = fit.dpr;
  if (ready) render();
}

/* ---------- input ---------- */
const toPx = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * dpr, H - (e.clientY - r.top) * dpr]; };
// A tap on a tower lights it at that spot; elsewhere it lights the deck.
function tapAt(x, y) {
  setBasis();
  const d = norm([0, 1, 2].map(i => basis.F[i] * basis.focal + basis.R[i] * (x - W / 2) + basis.U[i] * (y - H / 2)));
  // The nearest tower under the tap flashes where the tap meets it.
  let hit = null;
  for (const c of cells) {
    if (c.s < 0.2) continue;
    const h = towerHit(c, d);
    if (h && (!hit || h.t < hit.h.t)) hit = { c, h };
  }
  if (hit) {
    const { c, h } = hit;
    flash(cam.x + d[0] * h.t, cam.z + d[2] * h.t, 1.2, c, clamp(h.y, 3, c.top - 0.8));
    return;
  }
  const Rr = 6371, b = (Rr + ALT) * d[1], c = (ALT - 2) * (2 * Rr + ALT + 2), disc = b * b - c;
  if (disc < 0 || b > 0) return;
  const tt = -b - Math.sqrt(disc);
  flash(cam.x + d[0] * tt, cam.z + d[2] * tt, 1.2);
}
let drag = null;
// Two touches pinch to lean; the map holds each live pointer.
const touches = new Map();
let pinch = 0;
const spread = () => { const [a, b] = [...touches.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture?.(e.pointerId);
  const [x, y] = toPx(e);
  touches.set(e.pointerId, [x, y]);
  if (touches.size === 2) { pinch = spread(); if (drag) drag.moved = true; return; }
  drag = { x0: x, y0: y, x, y, moved: false };
  stage.classList.add('dragging');
});
stage.addEventListener('pointermove', e => {
  const [x, y] = toPx(e);
  if (e.pointerType === 'mouse') { head.thx = clamp(x / W * 2 - 1, -1, 1); head.thy = clamp(y / H * 2 - 1, -1, 1); }
  if (touches.has(e.pointerId)) touches.set(e.pointerId, [x, y]);
  if (touches.size === 2) {
    // Fingers apart lean in; together lean back.
    const s2 = spread();
    moveHead(0, 0, (s2 - pinch) / Math.min(W, H) * 0.3);
    pinch = s2;
    return;
  }
  if (!drag) return;
  if (Math.hypot(x - drag.x0, y - drag.y0) > 6 * dpr) drag.moved = true;
  // The head follows the drag: right moves toward the nose, up rises.
  const k = 0.42 / Math.min(W, H);
  moveHead((x - drag.x) * k, (y - drag.y) * k, 0);
  drag.x = x; drag.y = y;
});
function release(e) {
  touches.delete(e.pointerId);
  if (touches.size) return;
  if (drag && !drag.moved) tapAt(drag.x0, drag.y0);
  drag = null;
  stage.classList.remove('dragging');
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', e => { touches.delete(e.pointerId); drag = null; stage.classList.remove('dragging'); });
stage.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { head.thx = 0; head.thy = 0; } });
// The wheel leans toward the glass or back into the seat.
stage.addEventListener('wheel', e => { e.preventDefault(); moveHead(0, 0, -e.deltaY * 0.0004); }, { passive: false });
// Arrow keys move the head; plus and minus lean.
stage.addEventListener('keydown', e => {
  const m = { ArrowLeft: [-0.02, 0, 0], ArrowRight: [0.02, 0, 0], ArrowUp: [0, 0.02, 0], ArrowDown: [0, -0.02, 0], '+': [0, 0, 0.02], '=': [0, 0, 0.02], '-': [0, 0, -0.02] }[e.key];
  if (!m) return;
  e.preventDefault();
  moveHead(...m);
});

/* ---------- bar ---------- */
function popover(box, btn) {
  const set = on => { box.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!box.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
const stormEl = document.getElementById('storm');
stormEl.value = String(opts.storm);
stormEl.addEventListener('input', () => { opts.storm = +stormEl.value; save('storm', opts.storm); });
choices(document.getElementById('hour'), v => { opts.hour = v; save('hour', v); buildSky(); uploadSky(); render(); }).set(opts.hour);
choices(document.getElementById('cloud'), v => { opts.cloud = +v; save('cloud', v); render(); }).set(String(opts.cloud));
choices(document.getElementById('towns'), v => { opts.towns = +v; save('towns', v); render(); }).set(String(opts.towns));
choices(document.getElementById('aurora'), v => { opts.aurora = v; save('aurora', v); render(); }).set(opts.aurora);
choices(document.getElementById('rain'), v => { opts.rain = +v; save('rain', v); render(); }).set(String(opts.rain));
// Quality sets the canvas size, the pass 1 size and the march steps.
qualitySetting(document.getElementById('sets'));
onQuality(() => resize(true));
// Sights: each chip calls its sight now.
document.getElementById('sights').addEventListener('click', e => {
  const b = e.target.closest('[data-sight]');
  if (b) startEvent(b.dataset.sight);
});
// Dim steps through five levels, then back to clear.
const dimBtn = document.getElementById('dimBtn');
const showDim = () => {
  dimBtn.dataset.level = String(opts.dim);
  dimBtn.setAttribute('aria-label', opts.dim ? `Dim the glass: level ${opts.dim} of 4` : 'Dim the glass: clear');
};
showDim();
dimBtn.addEventListener('click', () => { opts.dim = (opts.dim + 1) % 5; save('dim', opts.dim); showDim(); });

/* ---------- start ---------- */
// The flight opens with a few cells already standing.
for (let i = 0; i < Math.round(opts.storm * MAXCELL); i++) { const c = newCell(false); c.age = rnd(20, 40); c.s = 1; cells.push(c); }
window.__ws = { cells, flashes, EV, newMeteor, cam };
buildSky();
uploadSky();
new ResizeObserver(() => resize()).observe(stage);
resize();
render();
// One finished frame folds shader work into the intro.
gl.finish();
ready = true;
markReady();
requestAnimationFrame(() => canvas.classList.add('on'));
whenVisible(stage, v => { visible = v; if (v) wake(); });
wake();
</script>
</body>
</html>
