<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.14 0.01 260); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Window seat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Window seat: a night flight, seen through one cabin window. */
:root { --stage: oklch(0.1 0.01 260); }
.stage--window { cursor: grab; touch-action: none; }
.stage--window.dragging { cursor: grabbing; }
.stage--window.on-shade { cursor: ns-resize; }
.stage--window canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--window canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--window canvas { transition: none; } }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.012 275 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Window seat</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--window" id="stage" tabindex="0" role="application" aria-label="A cabin window on a night flight, the wing below. Towns glow on the ground; storms flash inside the clouds. Drag to drift along, pull the shade, tap a storm to make it flash.">
      <p class="fail" hidden>Window seat needs WebGL2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" id="hour" role="group" aria-label="Hour">
        <button class="chip" type="button" data-value="dusk" aria-pressed="true">Dusk</button>
        <button class="chip" type="button" data-value="night" aria-pressed="false">Midnight</button>
        <button class="chip" type="button" data-value="dawn" aria-pressed="false">Dawn</button>
      </div>
      <label class="slider"><span>Storm</span><input type="range" id="storm" min="0" max="1" step="0.01" value="0.5" aria-label="Storm: how many cells and how often they flash"></label>
      <div class="actions">
        <button class="chip" id="shadeBtn" type="button">Shade</button>
      </div>
      <div class="edge">
        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings">
            <div class="group"><span>Cloud</span><div class="choices" id="cloud" role="group" aria-label="Cloud">
              <button class="chip" type="button" data-value="0.62" aria-pressed="false">Clear</button>
              <button class="chip" type="button" data-value="0.5" aria-pressed="true">Broken</button>
              <button class="chip" type="button" data-value="0.38" aria-pressed="false">Deck</button>
            </div></div>
            <div class="group"><span>Towns</span><div class="choices" id="towns" role="group" aria-label="Towns">
              <button class="chip" type="button" data-value="0.5" aria-pressed="false">Sparse</button>
              <button class="chip" type="button" data-value="1" aria-pressed="true">Some</button>
              <button class="chip" type="button" data-value="1.7" aria-pressed="false">Dense</button>
            </div></div>
          </div>
        </div>
        <dl class="how" aria-label="How to play">
          <div><dt>Drag</dt><dd>drift along</dd></div>
          <div><dt>Shade</dt><dd>drag it up or down</dd></div>
          <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>a storm flashes</dd></div>
        </dl>
      </div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Window seat</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, choices, fitCanvas, whenVisible, reduced, onReducedChange, linFit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });
initPage({ id: 'window' });

const PI = Math.PI, TAU = PI * 2, D2R = PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.window.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.window.${k}`, String(v)); } catch { /* storage is optional */ } };
const num = (k, d) => { const v = saved(k); return v != null && isFinite(+v) ? +v : d; };
const opts = {
  hour: saved('hour') || 'dusk',
  storm: num('storm', 0.5),
  cloud: num('cloud', 0.5),
  towns: num('towns', 1),
};
// A test hook sets values from the address, for screenshots.
const qs = new URLSearchParams(location.search);
for (const k of Object.keys(opts)) if (qs.has(k)) opts[k] = typeof opts[k] === 'number' ? +qs.get(k) : qs.get(k);
let reduce = reduced();
onReducedChange(v => { reduce = v; });

// Each hour is one sky palette in OKLCH: zenith, band, horizon, ambient.
// The band sits between zenith and horizon, where the afterglow turns.
const HOURS = {
  dusk: { zen: [0.17, 0.07, 275], band: [0.36, 0.13, 335], hor: [0.62, 0.15, 48], amb: [0.42, 0.1, 300], gain: 1 },
  night: { zen: [0.12, 0.035, 265], band: [0.2, 0.05, 250], hor: [0.34, 0.07, 228], amb: [0.4, 0.07, 250], gain: 0.55 },
  dawn: { zen: [0.2, 0.06, 255], band: [0.46, 0.09, 205], hor: [0.74, 0.11, 62], amb: [0.5, 0.07, 220], gain: 1.1 },
};
const hourLin = () => {
  const h = HOURS[opts.hour] || HOURS.dusk;
  return { zen: linFit(...h.zen), band: linFit(...h.band), hor: linFit(...h.hor), amb: linFit(...h.amb), gain: h.gain };
};

const ALT = 11;            // cruise height in km
const SPEED = 2.4;         // ground speed in km/s, sped up about ten times
const FOV = 64 * D2R;      // field of view across the short side
const ROLL = -9 * D2R;     // the camera tilts: a slanted, close look
// The window in the cabin wall, in metres.
// Local frame: x to the nose, y up, z out through the glass.
const WIN = {
  out: [0.165, 0.23], rOut: 0.135,  // the rim, where the bezel meets the wall
  inn: [0.118, 0.175], rIn: 0.1,    // the pane, at the bottom of the recess
  depth: 0.06, slot: 0.024,         // pane depth and shade depth
};
// The eye sits close, a little aft and above the window.
const EYE = [-0.19, 0.09, -0.33];
const AIM = [0.03, 0.0, 0.05];

/* ---------- WebGL2 ---------- */
const stage = document.getElementById('stage');
const canvas = document.createElement('canvas');
canvas.setAttribute('aria-hidden', 'true');
stage.prepend(canvas);
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
const fail = () => { stage.querySelector('.fail').hidden = false; markReady(); throw new Error('no webgl2'); };
if (!gl) fail();

const QUAD_VS = `#version 300 es
in vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;
const MAXCELL = 6, MAXFL = 4;
const W2 = v => `vec2(${v[0].toFixed(4)}, ${v[1].toFixed(4)})`;
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime, uDpr, uTowns;
uniform vec2 uCam;
uniform vec3 uF, uR, uU; uniform float uFocal;
uniform vec3 uEye; uniform vec2 uBank; uniform float uShade, uFlash, uCover;
uniform vec3 uZen, uBand, uHor, uAmb; uniform float uGain;
uniform vec3 uWing[4], uLet[4], uWingN, uLetN, uTip; uniform float uStrobe;
uniform vec4 uTw[${MAXCELL}]; uniform vec4 uTwB[${MAXCELL}]; uniform vec4 uTwC[${MAXCELL}]; uniform int uNTw;
uniform vec4 uFl[${MAXFL}];
out vec4 o;
const float R = 6371.0, H = ${ALT.toFixed(1)};
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p) { return vec2(hash12(p), hash12(p + 19.19)); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p, int n) { float a = 0.5, s = 0.0; for (int i = 0; i < 6; i++) { if (i >= n) break; s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }

// A ray from the eye hits the sphere at height hl, from above.
float hitLayer(vec3 d, float hl) {
  float b = (R + H) * d.y, c = (H - hl) * (2.0 * R + H + hl), disc = b * b - c;
  return (disc < 0.0 || b > 0.0) ? -1.0 : -b - sqrt(disc);
}

// The sky: zenith, an afterglow band, then the horizon glow.
// The glow is strongest toward the set sun, behind the tail.
vec3 skyCol(vec3 d) {
  float el = d.y + 0.058;
  float sunSide = 0.55 + 0.45 * dot(normalize(vec2(d.x, d.z) + 1e-5), vec2(-0.8, 0.6));
  vec3 c = mix(uBand, uZen, smoothstep(0.02, 0.45, el));
  c = mix(uHor * (0.55 + 0.6 * sunSide), c, smoothstep(-0.01, 0.14, el));
  c *= 0.35 * uGain;
  c += uHor * 0.25 * uGain * exp(-abs(el) * 60.0) * sunSide;
  return c;
}

// Towns: one site per 16 km cell, with a size and a street angle.
// x: town density, y: street angle of the strongest site.
vec2 towns(vec2 w) {
  vec2 g = w / 16.0, i = floor(g);
  float T = 0.0, best = 0.0, ang = 0.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 c = i + vec2(x, y);
    vec2 site = (c + 0.15 + 0.7 * hash22(c)) * 16.0;
    float sz = pow(hash12(c + 11.3), 2.6) * uTowns;
    float r = 1.0 + 6.5 * sz;
    vec2 q = w - site;
    float v = (0.3 + sz) * exp(-dot(q, q) / (r * r));
    T += v;
    if (v > best) { best = v; ang = hash12(c + 2.7) * 3.1416; }
  }
  // Ragged edges: towns spill along valleys, not in discs.
  T *= 0.45 + 1.1 * fbm(w / 2.2, 3);
  return vec2(T, ang);
}

// One lamp per cell, at a random spot, lit with chance p.
float lamps(vec2 w, float s, float p, float fw, float seed, out float hue) {
  vec2 gp = w / s, id = floor(gp), f = fract(gp);
  hue = hash12(id + seed + 9.3);
  float on = step(hash12(id + seed), p);
  vec2 at = 0.2 + 0.6 * hash22(id + seed + 3.1);
  float r = max(0.08, fw / s * 0.7);
  vec2 q = f - at;
  float b = 0.012 / (r * r) * exp(-dot(q, q) / (r * r)) * on * (0.5 + hash12(id + seed + 5.5));
  // Far away, lamps blend into their average glow.
  return mix(p * 0.04, b, smoothstep(0.9, 0.25, fw / s));
}

vec3 ground(vec2 w, float fw) {
  vec3 sodium = vec3(1.0, 0.5, 0.16), led = vec3(0.8, 0.88, 1.0);
  // Fields: a patchwork that catches the sky light.
  vec2 fp = floor(vec2(w.x * 1.7 + w.y * 0.4, w.y * 2.4 - w.x * 0.3));
  float parcel = 0.45 + 0.9 * hash12(fp);
  vec3 g = uAmb * 0.005 * uGain * parcel * (0.7 + 0.6 * fbm(w / 9.0, 3));
  vec2 tw = towns(w);
  float T = tw.x;
  float dense = smoothstep(0.08, 0.5, T);
  // The town glow: warm haze over the roofs.
  g += sodium * T * 0.035;
  float hue;
  // Lamps gather in blocks, with dark gaps for parks and yards.
  float blocks = smoothstep(0.2, 0.8, vnoise(w / 0.45));
  float a = lamps(w, 0.13, dense * (0.25 + 0.65 * blocks), fw, 0.0, hue);
  g += mix(sodium, led, step(0.9, hue)) * a;
  // Highways: long white lines between towns, with a few lamps out in the dark.
  vec2 hw = w / 22.0 + 0.9 * vec2(vnoise(w / 30.0), vnoise(w / 30.0 + 7.3));
  float ridge = abs(vnoise(hw) - 0.5);
  float hwW = max(0.02, fw * 0.6) / 22.0;
  float road = exp(-ridge * ridge / (hwW * hwW * 4.0)) * 0.012 / max(0.02, fw * 0.6) * (0.5 + 0.5 * vnoise(w / 3.0));
  g += mix(led, sodium, 0.5) * road * 0.18;
  float rural = lamps(w, 0.9, 0.08 * uTowns, fw, 41.0, hue);
  g += sodium * rural * 0.6;
  return g;
}

// Lightning lights the cloud around each flash from inside.
vec3 flashAt(vec2 w, float dens) {
  float f = 0.0;
  for (int i = 0; i < ${MAXFL}; i++) {
    vec4 l = uFl[i];
    if (l.z <= 0.0) continue;
    vec2 q = w - l.xy;
    f += l.z * exp(-dot(q, q) / (l.w * l.w));
  }
  return vec3(0.72, 0.74, 1.0) * f * (0.1 + dens * 1.5);
}

vec3 outside(vec3 d) {
  vec3 sky = skyCol(d);
  // Stars show only high up, where the glow has faded.
  vec2 sp = vec2(atan(d.x, d.z) * 160.0, d.y * 160.0);
  vec2 si = floor(sp), sf = fract(sp) - 0.5;
  float st = step(0.985, hash12(si)) * exp(-dot(sf, sf) * 40.0) * smoothstep(0.08, 0.3, d.y);
  sky += vec3(0.8, 0.85, 1.0) * st * (0.2 + hash12(si + 3.0)) * 0.12;

  float tg = hitLayer(d, 0.0);
  if (tg < 0.0) return sky;
  vec2 w = uCam + (vec3(0.0, R + H, 0.0) + d * tg).xz;
  // Ground footprint of one pixel, in km, grows at grazing angles.
  float fw = tg / uFocal / max(-d.y, 0.03);
  vec3 g = ground(w, fw);

  // Cloud deck at 2 km: lit by the sky above and the towns below.
  float tc = hitLayer(d, 2.0);
  vec2 wc = uCam + (vec3(0.0, R + H, 0.0) + d * tc).xz;
  float n = fbm(wc / 22.0 + vec2(uTime * 0.004, 0.0), 5);
  float cd = smoothstep(uCover, uCover + 0.22, n);
  float under = towns(wc).x;
  float lump = fbm(wc / 3.0, 3);
  vec3 cc = uAmb * 0.03 * uGain * (0.5 + 1.2 * lump) + vec3(1.0, 0.5, 0.2) * under * 0.02 + flashAt(wc, cd);
  // Toward the sun side the cloud tops pick up the horizon colour.
  cc += uHor * 0.02 * uGain * lump * smoothstep(0.0, 1.0, dot(normalize(d.xz), vec2(-0.8, 0.6)));
  g = mix(g, cc, cd * 0.94);

  // Aerial haze: the far ground melts into the horizon glow.
  float fog = 1.0 - exp(-tg / 220.0);
  g = mix(g, mix(uBand, uHor, 0.35) * 0.06 * uGain, fog);
  return g;
}

// Storm towers: each cell stands as a column with an anvil.
// uTw: base xy, top xy in pixels. uTwB: seed, strength, haze, half width.
// uTwC: flash u, flash v, flash level.
vec3 towers(vec2 px, vec3 c) {
  for (int i = 0; i < ${MAXCELL}; i++) {
    if (i >= uNTw) break;
    vec4 a = uTw[i], b = uTwB[i], f = uTwC[i];
    vec2 ax = a.zw - a.xy; float L2 = dot(ax, ax);
    vec2 p = px - a.xy;
    vec2 q = vec2((ax.x * p.y - ax.y * p.x) / sqrt(L2) / b.w, dot(p, ax) / L2);
    q.x = -q.x;
    if (q.y < -0.1 || q.y > 1.25 || abs(q.x) > 3.2) continue;
    float sd = b.x;
    float bil = fbm(vec2(q.x * 1.6, q.y * 3.2) + sd, 5);
    float anv = smoothstep(0.76, 0.93, q.y);
    // The anvil leans downwind, so it spreads further to one side.
    float qx = q.x - anv * 0.6;
    float hw = 0.62 - 0.22 * smoothstep(0.0, 0.75, q.y) + 0.5 * (bil - 0.5) + anv * (1.3 + 0.5 * fbm(vec2(q.x * 0.7 + sd, 3.0), 3));
    float top = 0.94 + 0.08 * (fbm(vec2(q.x * 2.0 + sd, 1.0), 3) - 0.5) - 0.1 * smoothstep(0.6, 1.9, abs(qx));
    float shape = smoothstep(0.1, -0.1, abs(qx) - hw) * smoothstep(0.04, -0.06, q.y - top) * smoothstep(-0.1, 0.08, q.y);
    float dens = shape * b.y;
    if (dens <= 0.0) continue;
    float lumps = fbm(vec2(q.x * 4.0, q.y * 9.0) + sd * 3.0 - vec2(uTime * 0.01, 0.0), 5);
    // The sky lights the tops; the sunward side catches the afterglow.
    vec3 col = uAmb * 0.03 * uGain * (0.6 + 2.4 * lumps * lumps * (0.4 + 0.8 * q.y));
    col += uHor * 0.05 * uGain * smoothstep(0.3, 1.0, q.y) * smoothstep(-0.6, 1.0, -qx) * lumps;
    col += vec3(1.0, 0.5, 0.2) * 0.012 * (1.0 - smoothstep(0.0, 0.5, q.y)) * (0.5 + lumps);
    vec2 fq = (q - f.xy) * vec2(1.0, 1.8);
    float glow = f.z * (exp(-dot(fq, fq) * 5.0) * 2.2 + exp(-dot(fq, fq) * 0.8) * 0.5) * (0.5 + lumps);
    col += vec3(0.72, 0.74, 1.0) * glow;
    col = mix(col, skyCol(vec3(0.0, -0.02, 1.0)) * 0.9, b.z);
    c = mix(c, col, dens);
  }
  return c;
}

// A ray hits a flat convex quad: the wing or its winglet.
// Returns the hit distance, or -1; uv gives chord and span from 0 to 1.
float quad(vec3 d, vec3 v[4], vec3 n, out vec2 uv) {
  float dn = dot(d, n);
  if (abs(dn) < 1e-4) return -1.0;
  float t = dot(v[0], n) / dn;
  if (t <= 0.0) return -1.0;
  vec3 p = d * t;
  // Inside a convex quad, every edge test has the same sign.
  float s0 = 0.0;
  for (int i = 0; i < 4; i++) {
    vec3 e = v[(i + 1) % 4] - v[i];
    float s = dot(cross(e, p - v[i]), n);
    if (i == 0) s0 = s;
    else if (s * s0 < 0.0) return -1.0;
  }
  // Span runs root to tip; chord runs leading to trailing edge.
  vec3 le = v[1] - v[0];
  float sp = clamp(dot(p - v[0], le) / dot(le, le), 0.0, 1.0);
  vec3 a = mix(v[0], v[1], sp), b = mix(v[3], v[2], sp);
  uv = vec2(clamp(dot(p - a, b - a) / dot(b - a, b - a), 0.0, 1.0), sp);
  return t;
}
// The wing is painted grey; its top mirrors the sky at a grazing angle.
// uv.x runs leading to trailing edge; uv.y runs root to tip.
vec3 wingCol(vec3 d, vec3 n, vec2 uv, float t, float E) {
  // A satin finish blurs the mirror toward the horizon glow.
  vec3 r = reflect(d, n);
  vec3 env = skyCol(normalize(vec3(r.x, max(r.y, -0.02) * 0.45, r.z)));
  // Grey paint keeps half the sky's colour.
  env = mix(vec3(dot(env, vec3(0.3, 0.5, 0.2))), env, 0.5);
  float fres = 0.05 + 0.6 * pow(1.0 - abs(dot(d, n)), 4.0);
  // Diffuse light from the whole sky dome on grey paint.

// Screen pixels per metre of shade travel, near the lip.
function shadeScale() {
  const a = toScreen([0, 0.1, WIN.slot]), b = toScreen([0, -0.1, WIN.slot]);
  return Math.hypot(a[0] - b[0], a[1] - b[1]) / 0.2;
}
// A tap on a tower lights it at that spot; elsewhere it lights the deck.
function tapAt(x, y) {
  for (const c of cells) {
    const sc = c.screen;
    if (!sc || c.s < 0.2) continue;
    const ax = [sc.tx - sc.x, sc.ty - sc.y], L2 = ax[0] ** 2 + ax[1] ** 2, p = [x - sc.x, y - sc.y];
    const v = (p[0] * ax[0] + p[1] * ax[1]) / L2, uu = -(ax[0] * p[1] - ax[1] * p[0]) / Math.sqrt(L2) / sc.w;
    if (Math.abs(uu) < 1.2 && v > 0 && v < 1) { flash(c.x, c.z, 1.2, c, uu, v); return; }
  }
  setBasis();
  const d = norm([0, 1, 2].map(i => basis.F[i] * basis.focal + basis.R[i] * (x - W / 2) + basis.U[i] * (y - H / 2)));
  const Rr = 6371, b = (Rr + ALT) * d[1], c = (ALT - 2) * (2 * Rr + ALT + 2), disc = b * b - c;
  if (disc < 0 || b > 0) return;
  const tt = -b - Math.sqrt(disc);
  flash(cam.x + d[0] * tt, cam.z + d[2] * tt, 1.2);
}
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture?.(e.pointerId);
  const [x, y] = toPx(e);
  drag = { x0: x, y0: y, x, t: performance.now(), moved: false, shade: onLip(x, y), s0: shade.target };
  stage.classList.add('dragging');
});
stage.addEventListener('pointermove', e => {
  const [x, y] = toPx(e);
  if (e.pointerType === 'mouse') { head.tx = clamp(x / W * 2 - 1, -1, 1); head.ty = clamp(y / H * 2 - 1, -1, 1); }
  if (!drag) { stage.classList.toggle('on-shade', onLip(x, y)); return; }
  if (Math.hypot(x - drag.x0, y - drag.y0) > 6 * dpr) drag.moved = true;
  if (drag.shade) { shade.target = clamp(drag.s0 - (y - drag.y0) / shadeScale() / (2 * WIN.inn[1] + 0.04)); return; }
  // Dragging toward the tail pushes the plane on; the view runs right to left.
  const now = performance.now(), dts = Math.max(0.008, (now - drag.t) / 1000);
  cam.push = clamp(cam.push - (x - drag.x) / dpr / dts * 0.05, -SPEED * 3, SPEED * 6);
  drag.x = x; drag.t = now;
});
function release() {
  if (drag && !drag.moved && !drag.shade) tapAt(drag.x0, drag.y0);
  drag = null;
  stage.classList.remove('dragging');
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', () => { drag = null; stage.classList.remove('dragging'); });
stage.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { head.tx = 0; head.ty = 0; } });

/* ---------- bar ---------- */
function popover(box, btn) {
  const set = on => { box.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!box.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
const stormEl = document.getElementById('storm');
stormEl.value = String(opts.storm);
stormEl.addEventListener('input', () => { opts.storm = +stormEl.value; save('storm', opts.storm); });
choices(document.getElementById('hour'), v => { opts.hour = v; save('hour', v); render(); }).set(opts.hour);
choices(document.getElementById('cloud'), v => { opts.cloud = +v; save('cloud', v); render(); }).set(String(opts.cloud));
choices(document.getElementById('towns'), v => { opts.towns = +v; save('towns', v); render(); }).set(String(opts.towns));
document.getElementById('shadeBtn').addEventListener('click', () => { shade.target = shade.target > 0.5 ? 0.05 : 0.92; });

/* ---------- start ---------- */
// The flight opens with a few cells already standing.
for (let i = 0; i < Math.round(opts.storm * MAXCELL); i++) { const c = newCell(false); c.age = rnd(12, 40); c.s = 1; cells.push(c); }
window.__ws = { cells, flashes };
new ResizeObserver(() => resize()).observe(stage);
resize();
render();
// One finished frame folds shader work into the intro.
gl.finish();
ready = true;
markReady();
requestAnimationFrame(() => canvas.classList.add('on'));
whenVisible(stage, v => { visible = v; if (v) wake(); });
wake();
</script>
