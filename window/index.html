<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.14 0.01 260); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Window seat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Window seat: a night flight, seen through one cabin window. */
:root { --stage: oklch(0.1 0.01 260); }
.stage--window { cursor: grab; touch-action: none; }
.stage--window.dragging { cursor: grabbing; }
.stage--window.on-shade { cursor: ns-resize; }
.stage--window canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--window canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--window canvas { transition: none; } }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.012 275 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Window seat</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--window" id="stage" tabindex="0" role="application" aria-label="A cabin window on a night flight. Towns glow below; storms flash inside the clouds. Drag to drift along, pull the shade, tap a storm to make it flash.">
      <p class="fail" hidden>Window seat needs WebGL2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" id="route" role="group" aria-label="Route">
        <button class="chip" type="button" data-value="low" aria-pressed="true">Low Countries</button>
        <button class="chip" type="button" data-value="nile" aria-pressed="false">Nile</button>
        <button class="chip" type="button" data-value="coast" aria-pressed="false">Seaboard</button>
      </div>
      <label class="slider"><span>Storm</span><input type="range" id="storm" min="0" max="1" step="0.01" value="0.5" aria-label="Storm: how many cells and how often they flash"></label>
      <div class="actions">
        <button class="chip" id="shadeBtn" type="button">Shade</button>
      </div>
      <div class="edge">
        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings">
            <div class="group"><span>Cloud</span><div class="choices" id="cloud" role="group" aria-label="Cloud">
              <button class="chip" type="button" data-value="0.62" aria-pressed="false">Clear</button>
              <button class="chip" type="button" data-value="0.5" aria-pressed="true">Broken</button>
              <button class="chip" type="button" data-value="0.38" aria-pressed="false">Deck</button>
            </div></div>
            <div class="group"><span>Moon</span><div class="choices" id="moon" role="group" aria-label="Moon">
              <button class="chip" type="button" data-value="0" aria-pressed="false">New</button>
              <button class="chip" type="button" data-value="0.5" aria-pressed="true">Half</button>
              <button class="chip" type="button" data-value="1" aria-pressed="false">Full</button>
            </div></div>
          </div>
        </div>
        <dl class="how" aria-label="How to play">
          <div><dt>Drag</dt><dd>drift along</dd></div>
          <div><dt>Shade</dt><dd>drag it up or down</dd></div>
          <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>a storm flashes</dd></div>
        </dl>
      </div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Window seat</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, choices, fitCanvas, whenVisible, reduced, onReducedChange } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(8000)])]) });
initPage({ id: 'window' });

const PI = Math.PI, TAU = PI * 2, D2R = PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.window.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.window.${k}`, String(v)); } catch { /* storage is optional */ } };
const num = (k, d) => { const v = saved(k); return v != null && isFinite(+v) ? +v : d; };
const opts = {
  route: saved('route') || 'low',
  storm: num('storm', 0.5),
  cloud: num('cloud', 0.5),
  moon: num('moon', 0.5),
};
// A test hook sets values from the address, for screenshots.
const qs = new URLSearchParams(location.search);
for (const k of Object.keys(opts)) if (qs.has(k)) opts[k] = typeof opts[k] === 'number' ? +qs.get(k) : qs.get(k);
let reduce = reduced();
onReducedChange(v => { reduce = v; });

// Each route sets a start point and a heading; the seat is on the left.
const ROUTES = {
  low: { lat: 50.25, lon: 3.6, head: 40 },
  nile: { lat: 24.6, lon: 33.15, head: 352 },
  coast: { lat: 38.4, lon: -77.6, head: 38 },
};
const ALT = 11;           // cruise height in km
const SPEED = 2.4;        // ground speed in km/s, sped up about ten times
const PITCH = -17 * D2R;  // the view looks a little down
const FOV = 72 * D2R;     // vertical field of the outside view

/* ---------- WebGL2 ---------- */
const stage = document.getElementById('stage');
const canvas = document.createElement('canvas');
canvas.setAttribute('aria-hidden', 'true');
stage.prepend(canvas);
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
const fail = () => { stage.querySelector('.fail').hidden = false; markReady(); throw new Error('no webgl2'); };
if (!gl) fail();

const QUAD_VS = `#version 300 es
in vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;
const MAXCELL = 6, MAXFL = 4;
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime, uDpr;
uniform vec2 uCam; uniform float uLat0, uLon0, uCosLat;
uniform vec3 uF, uR, uU; uniform float uFocal;
uniform vec4 uWin; uniform vec2 uPar; uniform float uShade, uFlash, uCover, uMoon;
uniform vec4 uTw[${MAXCELL}]; uniform vec4 uTwB[${MAXCELL}]; uniform vec4 uTwC[${MAXCELL}]; uniform int uNTw;
uniform vec4 uFl[${MAXFL}];
uniform sampler2D uNight;
out vec4 o;
const float R = 6371.0, H = ${ALT.toFixed(1)};
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p, int n) { float a = 0.5, s = 0.0; for (int i = 0; i < 6; i++) { if (i >= n) break; s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }

// A ray from the eye hits the sphere at height hl, from above.
float hitLayer(vec3 d, float hl) {
  float b = (R + H) * d.y, c = (H - hl) * (2.0 * R + H + hl), disc = b * b - c;
  return (disc < 0.0 || b > 0.0) ? -1.0 : -b - sqrt(disc);
}
// World km to texture coordinates: an equirectangular map.
vec2 mapUv(vec2 w) {
  float lat = uLat0 + w.y / 111.2, lon = uLon0 + w.x / (111.2 * uCosLat);
  return vec2(lon / 360.0 + 0.5, 0.5 - lat / 180.0);
}
// The map is moonlit land in blue; only towns carry red.
float lightsOf(vec3 t) { return max(t.r - 0.035, 0.0) * 3.0; }

// Lightning lights the cloud around each flash from inside.
vec3 flashAt(vec2 w, float dens) {
  float f = 0.0;
  for (int i = 0; i < ${MAXFL}; i++) {
    vec4 l = uFl[i];
    if (l.z <= 0.0) continue;
    vec2 q = w - l.xy;
    f += l.z * exp(-dot(q, q) / (l.w * l.w));
  }
  return vec3(0.78, 0.82, 1.0) * f * (0.12 + dens * 1.4);
}

vec3 outside(vec2 px) {
  vec3 d = normalize(uF * uFocal + uR * (px.x - uRes.x * 0.5) + uU * (px.y - uRes.y * 0.5));
  vec3 moonCol = vec3(0.004, 0.0055, 0.009) * (0.2 + uMoon * 1.6);
  // Sky: deep blue, a lit band of haze at the horizon, then stars.
  float el = d.y + 0.058;
  vec3 sky = mix(vec3(0.004, 0.005, 0.009), vec3(0.0012, 0.0016, 0.003), smoothstep(0.0, 0.5, el));
  sky += vec3(0.016, 0.009, 0.005) * exp(-max(el, 0.0) * 30.0);
  sky += moonCol * 0.8 * exp(-max(el, 0.0) * 6.0);
  vec2 sp = vec2(atan(d.x, d.z) * 160.0, d.y * 160.0);
  vec2 si = floor(sp), sf = fract(sp) - 0.5;
  float st = step(0.985, hash12(si)) * exp(-dot(sf, sf) * 40.0) * smoothstep(0.0, 0.15, el);
  sky += vec3(0.8, 0.85, 1.0) * st * (0.2 + hash12(si + 3.0)) * 0.25;

  float tg = hitLayer(d, 0.0);
  if (tg < 0.0) return sky;
  vec3 p = vec3(0.0, R + H, 0.0) + d * tg;
  vec2 w = uCam + p.xz;
  // Ground: moonlit land, then the lights of the towns.
  vec3 tex = texture(uNight, mapUv(w)).rgb;
  float D = lightsOf(tex);
  // Towns cluster, with ribbons of houses along the roads between them.
  float town = fbm(w / 3.2, 4);
  // Ridges of warped noise make long roads, not rings.
  vec2 rw = w / 6.0 + vec2(vnoise(w / 9.0), vnoise(w / 9.0 + 5.2)) * 1.6;
  float rid = 1.0 - abs(fbm(rw, 2) * 2.0 - 0.75);
  float ribbon = smoothstep(0.93, 0.99, rid) * min(D * 2.5, 1.0);
  float Dl = D * (smoothstep(0.56 - D * 0.08, 0.7 - D * 0.08, town) * 2.6 + ribbon * 1.6);
  vec3 g = moonCol * tex.b * 2.2;
  g += vec3(1.0, 0.55, 0.22) * (D * 0.12 + Dl * 0.88) * 0.045;
  // Street lights: points in a grid, as many as the map's glow allows.
  float fw = length(fwidth(w));
  for (int k = 0; k < 3; k++) {
    float s = k == 0 ? 1.1 : k == 1 ? 0.36 : 0.13;
    vec2 gp = w / s, id = floor(gp), f = fract(gp);
    float h = hash12(id + s * 31.7);
    vec2 at = 0.25 + 0.5 * vec2(hash12(id + 3.1), hash12(id + 7.7));
    float on = step(h, Dl * (k == 0 ? 0.6 : k == 1 ? 0.7 : 0.6));
    float r = max(0.07, fw / s * 0.7);
    vec2 q = f - at;
    float b = 0.012 / (r * r) * exp(-dot(q, q) / (r * r)) * on;
    float detail = smoothstep(0.9, 0.25, fw / s);
    vec3 lc = hash12(id + 9.3) < 0.62 ? vec3(1.0, 0.58, 0.2) : vec3(0.85, 0.9, 1.0);
    g += lc * mix(D * 0.03, b, detail) * (0.6 + 0.8 * hash12(id + 5.5));
  }
  float fog = 1.0 - exp(-tg / 170.0);
  vec3 haze = vec3(0.01, 0.006, 0.0038) + moonCol * 0.7;

  // Lower deck: broken cloud at 2 km, lit by the towns from below.
  float tc = hitLayer(d, 2.0);
  vec2 wc = uCam + (vec3(0.0, R + H, 0.0) + d * tc).xz;
  float n = fbm(wc / 22.0 + vec2(uTime * 0.004, 0.0), 5);
  float cd = smoothstep(uCover, uCover + 0.22, n);
  float under = lightsOf(textureLod(uNight, mapUv(wc), 3.0).rgb);
  vec3 cc = vec3(1.0, 0.6, 0.3) * under * 0.03 + moonCol * (0.9 + 2.2 * fbm(wc / 3.0, 3)) + flashAt(wc, cd);
  g = mix(g, cc, cd * 0.94);

  g = mix(g, haze, fog);
  return g;
}

// Storm towers: each cell stands as a projected column with an anvil.
// uTw: base x, base y, half width, height, in pixels.
// uTwB: seed, strength, fog, unused. uTwC: flash u, flash v, flash level.
vec3 towers(vec2 px, vec3 c) {
  vec3 moonCol = vec3(0.004, 0.0055, 0.009) * (0.2 + uMoon * 1.6);
  vec3 haze = vec3(0.01, 0.006, 0.0038) + moonCol * 0.7;
  for (int i = 0; i < ${MAXCELL}; i++) {
    if (i >= uNTw) break;
    vec4 a = uTw[i], b = uTwB[i], f = uTwC[i];
    vec2 q = vec2((px.x - a.x) / a.z, (px.y - a.y) / a.w);
    if (q.y < -0.1 || q.y > 1.25 || abs(q.x) > 3.0) continue;
    float sd = b.x;
    // The outline: a billowing column that flares into an anvil near the top.
    // Billows: round bumps along the edge, larger low down.
    float bil = fbm(vec2(q.x * 1.6, q.y * 3.2) + sd, 5);
    float anv = smoothstep(0.76, 0.93, q.y);
    // The anvil leans downwind, so it spreads further to one side.
    float qx = q.x - anv * 0.6;
    // A broad base, a column that narrows a little, then the flat anvil.
    float hw = 0.62 - 0.22 * smoothstep(0.0, 0.75, q.y) + 0.5 * (bil - 0.5) + anv * (1.3 + 0.5 * fbm(vec2(q.x * 0.7 + sd, 3.0), 3));
    float top = 0.94 + 0.08 * (fbm(vec2(q.x * 2.0 + sd, 1.0), 3) - 0.5) - 0.1 * smoothstep(0.6, 1.9, abs(qx));
    float shape = smoothstep(0.1, -0.1, abs(qx) - hw) * smoothstep(0.04, -0.06, q.y - top) * smoothstep(-0.1, 0.08, q.y);
    float dens = shape * b.y;
    if (dens <= 0.0) continue;
    // Moonlight from the upper left; the billows shade each other.
    float lumps = fbm(vec2(q.x * 4.0, q.y * 9.0) + sd * 3.0 - vec2(uTime * 0.01, 0.0), 5);
    vec3 col = moonCol * (1.5 + 7.0 * lumps * lumps * (0.5 + 0.6 * q.y) * (1.0 - 0.35 * qx));
    // The towns below light the cloud base orange.
    col += vec3(1.0, 0.55, 0.25) * 0.012 * (1.0 - smoothstep(0.0, 0.5, q.y)) * (0.5 + lumps);
    // Lightning glows from inside and bleeds to the soft edges.
    vec2 fq = (q - f.xy) * vec2(1.0, 1.8);
    float glow = f.z * (exp(-dot(fq, fq) * 5.0) * 2.2 + exp(-dot(fq, fq) * 0.8) * 0.5) * (0.5 + lumps);
    col += vec3(0.75, 0.8, 1.0) * glow;
    col = mix(col, haze, b.z);
    c = mix(c, col, dens);
  }
  return c;
}

// A rounded box: the shape of the window.
float sdBox(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }

void main() {
  vec2 px = gl_FragCoord.xy;
  vec3 view = towers(px, outside(px));
  // The opening sits deeper than the wall, so the head moves it less.
  vec2 cIn = uWin.xy + uPar * 0.55, cOut = uWin.xy + uPar;
  vec2 hb = uWin.zw;
  float rIn = hb.x * 0.86, bez = hb.x * 0.3;
  float sIn = sdBox(px - cIn, hb, rIn);
  float sOut = sdBox(px - cOut, hb + bez, rIn + bez);
  float aa = 1.2 * uDpr;
  // Light from outside reaches into the cabin; flashes light it all.
  float E = 0.004 + uFlash * 0.07;
  vec3 eCol = mix(vec3(0.5, 0.45, 0.5), vec3(0.75, 0.8, 1.0), clamp(uFlash * 3.0, 0.0, 1.0));
  vec3 cabin = vec3(0.009, 0.0105, 0.016);
  float alb = 0.42;

  // Inner pane: frost grows in from the lower corners and glows when lit.
  vec2 lp = (px - cIn) / hb;
  float edge = -sIn / hb.x;
  float fr = fbm(px / (2.2 * uDpr), 4) * 0.7 + fbm(px / (14.0 * uDpr), 3) * 0.5;
  float frost = smoothstep(0.26, 0.0, edge) * smoothstep(-0.2, -0.85, lp.y) * smoothstep(0.62, 0.8, fr + 0.3 * (0.26 - edge));
  view += eCol * frost * (0.0015 + E * 0.35);
  // A soft sheen: the cabin seen faintly in the glass.
  view += vec3(0.0012, 0.0014, 0.002) * smoothstep(0.9, -0.2, lp.x + lp.y * 0.4);
  // The breather hole: a small dark dot low on the pane.
  float bh = length(px - (cIn + vec2(0.0, -hb.y * 0.7))) / uDpr;
  view = mix(view, vec3(0.0), smoothstep(2.6, 1.6, bh) * 0.8);
  view += vec3(1.0) * E * smoothstep(1.0, 0.0, abs(bh - 2.6)) * 0.4;

  // The shade comes down from the top of the opening.
  float yShade = cIn.y + hb.y - uShade * hb.y * 2.0;
  float above = px.y - yShade;
  vec3 shade = alb * 1.2 * (cabin * (0.6 + 0.8 * smoothstep(-hb.y, hb.y, px.y - cIn.y)) + eCol * E * 0.12);
  // Its lip: a dark groove, then a lit edge.
  shade *= 1.0 - 0.55 * smoothstep(14.0 * uDpr, 0.0, above) * smoothstep(0.0, 4.0 * uDpr, above);
  shade += alb * smoothstep(3.0 * uDpr, 0.0, abs(above - 2.0 * uDpr)) * (cabin * 1.5 + eCol * E * 0.8);
  float isShade = smoothstep(-aa, aa, above) * step(0.001, uShade);
  // The shade casts a short soft shadow onto the pane below its lip.
  view *= 1.0 - 0.5 * smoothstep(-12.0 * uDpr, 0.0, above) * step(0.001, uShade);
  vec3 win = mix(view, shade, isShade);

  // Bezel: a plastic slope from the wall down into the opening.
  float tb = clamp(sIn / max(sIn - sOut, 1e-3), 0.0, 1.0);
  vec2 gIn = normalize(vec2(dFdx(sIn), dFdy(sIn)) + 1e-6);
  float up = 0.5 + 0.5 * gIn.y;
  vec3 bezel = alb * (cabin * (0.5 + up) + eCol * E * 1.6 * pow(1.0 - tb, 2.0));
  bezel *= 0.75 + 0.25 * smoothstep(0.0, 0.25, tb);
  // A crisp rim where the slope meets the wall.
  bezel += alb * cabin * 1.5 * smoothstep(1.5 * uDpr, 0.0, abs(sOut + 1.0 * uDpr)) * (0.3 + up);

  // Wall: curved plastic panels, lit from above and by the window.
  float wx = (px.x - cOut.x) / uRes.y;
  vec3 wall = alb * cabin * (0.5 + 0.9 * smoothstep(-0.2, 1.0, px.y / uRes.y)) * (1.0 - 0.35 * wx * wx);
  wall += alb * eCol * E * 0.9 * exp(-max(sOut, 0.0) / (hb.x * 0.6));
  // Soft occlusion at the rim of the recess.
  wall *= 1.0 - 0.45 * exp(-max(sOut, 0.0) / (6.0 * uDpr));

  vec3 c = wall;
  c = mix(c, bezel, smoothstep(aa, -aa, sOut));
  c = mix(c, win, smoothstep(aa, -aa, sIn));
  c = 1.0 - exp(-c * 3.2);
  c += (hash12(px + fract(uTime * 7.13) * 911.0) - 0.5) * 0.006;
  c = pow(max(c, 0.0), vec3(1.0 / 2.2));
  o = vec4(c, 1.0);
}`;

function program(vs, fs, attrs) {
  const p = gl.createProgram();
  [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(([type, src]) => {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(sh)); fail(); }
    gl.attachShader(p, sh);
  });
  attrs.forEach((name, i) => gl.bindAttribLocation(p, i, name));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); fail(); }
  const u = {};
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(p, i).name; u[n] = gl.getUniformLocation(p, n); }
  return { p, u };
}
const P = program(QUAD_VS, FS, ['aPos']);
const quadVao = gl.createVertexArray();
gl.bindVertexArray(quadVao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// The night map: mipmapped, with anisotropy for the low view.
const nightTex = gl.createTexture();
function loadNight() {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      gl.bindTexture(gl.TEXTURE_2D, nightTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      const an = gl.getExtension('EXT_texture_filter_anisotropic');
      if (an) gl.texParameterf(gl.TEXTURE_2D, an.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(an.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
      res(true);
    };
    img.onerror = () => { console.warn('night map failed to load'); res(false); };
    img.src = 'night.jpg';
  });
}
// One dark texel stands in until the map arrives.
gl.bindTexture(gl.TEXTURE_2D, nightTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([4, 8, 16, 255]));

/* ---------- flight ---------- */
let W = 1, H = 1, dpr = 1, t = 0;
// The plane flies on a flat local map, in km from the route's start.
const cam = { x: 0, z: 0, v: SPEED, push: 0 };
let route = ROUTES[opts.route] || ROUTES.low;
const hdg = () => route.head * D2R;
const fwd = () => [Math.sin(hdg()), Math.cos(hdg())];
// The left window looks 90 degrees left of the heading.
const look = () => [-Math.cos(hdg()), Math.sin(hdg())];
const basis = { F: [0, 0, 1], R: [1, 0, 0], U: [0, 1, 0], focal: 600 };
function setBasis(yaw = 0, pitch = 0) {
  const az = hdg() - PI / 2 + yaw, el = PITCH + pitch;
  const F = [Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)];
  const Rv = [Math.cos(az), 0, -Math.sin(az)];
  const U = [F[1] * Rv[2] - F[2] * Rv[1], F[2] * Rv[0] - F[0] * Rv[2], F[0] * Rv[1] - F[1] * Rv[0]];
  basis.F = F; basis.R = Rv; basis.U = U;
  basis.focal = H / 2 / Math.tan(FOV / 2);
}

// Storm cells live on the map; new ones form ahead as old ones fall behind.
const cells = [];
function newCell(ahead) {
  const [fx, fz] = fwd(), [lx, lz] = look();
  // Cells form ahead and inside the window's view, so they pass through it.
  const side = rnd(25, 160), a = (ahead ? rnd(70, 160) : rnd(-20, 140)) + side * rnd(-0.3, 0.3);
  return { x: cam.x + fx * a + lx * side, z: cam.z + fz * a + lz * side, r: rnd(9, 22), s: 0, life: rnd(60, 160), age: 0, seed: rnd(0, 100), top: rnd(11.5, 14) };
}
function stepCells(dt) {
  const want = Math.round(opts.storm * MAXCELL);
  const [fx, fz] = fwd();
  for (let i = cells.length - 1; i >= 0; i--) {
    const c = cells[i];
    c.age += dt;
    // Cells grow in and die back over tens of seconds.
    c.s = clamp(Math.min(c.age / 12, (c.life - c.age) / 12));
    const along = (c.x - cam.x) * fx + (c.z - cam.z) * fz;
    if (c.age > c.life || along < -120 || i >= want) cells.splice(i, 1);
  }
  while (cells.length < want) cells.push(newCell(true));
}
// A flash is a burst of strokes within about a second.
const flashes = [];
// A flash inside a tower sits at (u, v) in the tower's own frame.
function flash(x, z, big = 1, cell = null, u = rnd(-0.3, 0.3), v = rnd(0.2, 0.75)) {
  const strokes = [0];
  const n = 1 + Math.floor(Math.random() * 4);
  for (let i = 1; i < n; i++) strokes.push(strokes[i - 1] + rnd(0.05, 0.22));
  flashes.push({ x, z, r: rnd(4, 9) * big, k: rnd(0.6, 1.3) * big, strokes, age: 0, cell, u, v });
  if (flashes.length > MAXFL) flashes.shift();
}
function flashLevel(f) {
  let s = 0;
  for (const st of f.strokes) { const a = f.age - st; if (a >= 0) s += Math.exp(-a / 0.07) * (a < 0.02 ? a / 0.02 : 1); }
  return s * f.k;
}
function stepFlashes(dt) {
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    f.age += dt;
    if (f.age > f.strokes[f.strokes.length - 1] + 0.6) flashes.splice(i, 1);
  }
  for (const c of cells) {
    if (Math.random() < c.s * (0.15 + opts.storm * 0.5) * dt) {
      const a = rnd(0, TAU), r = Math.sqrt(Math.random()) * c.r * 0.7;
      flash(c.x + Math.cos(a) * r, c.z + Math.sin(a) * r, 1, c);
    }
  }
}

/* ---------- head and shade ---------- */
// The head drifts with the pointer, so the frame shifts against the view.
const head = { x: 0, y: 0, tx: 0, ty: 0 };
const shade = { v: 0.16, target: 0.16 };
const win = { x: 0, y: 0, w: 1, h: 1 };
function layout() {
  // The window stands tall in the stage, above the bar.
  const hh = Math.min(H * 0.34, (W * 0.36) / 0.64);
  win.h = hh; win.w = hh * 0.64;
  win.x = W / 2; win.y = H * 0.54;
}

/* ---------- loop ---------- */
let raf = 0, last = 0, visible = true, ready = false;
const fl = new Float32Array(MAXFL * 4), tw = new Float32Array(MAXCELL * 4), twB = new Float32Array(MAXCELL * 4), twC = new Float32Array(MAXCELL * 4);
function frameFn(now) {
  raf = 0;
  const dt = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60;
  last = now;
  step(dt);
  render();
  if (visible) raf = requestAnimationFrame(frameFn);
}
function wake() { if (visible && ready && !raf) { last = 0; raf = requestAnimationFrame(frameFn); } }
function step(dt) {
  t += dt;
  // Drag adds a push that fades back to cruise.
  cam.push *= Math.exp(-dt / 1.2);
  const v = (reduce ? SPEED * 0.4 : SPEED) + cam.push;
  const [fx, fz] = fwd();
  cam.x += fx * v * dt; cam.z += fz * v * dt;
  const k = 1 - Math.exp(-dt / 0.35);
  head.x += (head.tx - head.x) * k; head.y += (head.ty - head.y) * k;
  shade.v += (shade.target - shade.v) * (1 - Math.exp(-dt / 0.12));
  stepCells(dt);
  stepFlashes(dt);
}
function render() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(P.p); gl.bindVertexArray(quadVao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, nightTex);
  const u = P.u;
  gl.uniform1i(u.uNight, 0);
  gl.uniform2f(u.uRes, W, H);
  gl.uniform1f(u.uTime, t);
  gl.uniform1f(u.uDpr, dpr);
  gl.uniform1f(u.uCosLat, Math.cos(route.lat * D2R));
  setBasis();
  gl.uniform3fv(u.uF, basis.F); gl.uniform3fv(u.uR, basis.R); gl.uniform3fv(u.uU, basis.U);
  gl.uniform1f(u.uFocal, basis.focal);
  gl.uniform4f(u.uWin, win.x, win.y, win.w, win.h);
  gl.uniform2f(u.uPar, head.x * 26 * dpr, head.y * 18 * dpr);
  gl.uniform1f(u.uShade, shade.v);
  gl.uniform1f(u.uCover, opts.cloud);
  gl.uniform1f(u.uMoon, opts.moon);
  fl.fill(0); tw.fill(0); twB.fill(0); twC.fill(0);
  let sum = 0;
  flashes.forEach((f, i) => { f.level = flashLevel(f); sum += f.level; fl.set([f.x - cam.x, f.z - cam.z, f.level, f.r], i * 4); });
  const n = towerUniforms();
  gl.uniform4fv(u['uTw[0]'], tw); gl.uniform4fv(u['uTwB[0]'], twB); gl.uniform4fv(u['uTwC[0]'], twC);
  gl.uniform1i(u.uNTw, n);
  // Cell and flash positions go in relative to the plane, for precision.
  gl.uniform2f(u.uCam, 0, 0);
  gl.uniform1f(u.uLat0, route.lat + cam.z / 111.2);
  gl.uniform1f(u.uLon0, route.lon + cam.x / (111.2 * Math.cos(route.lat * D2R)));
  gl.uniform4fv(u['uFl[0]'], fl);
  gl.uniform1f(u.uFlash, Math.min(1.2, sum * 0.35));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// Project a point given in km from the plane: side, along, height.
function project(dx, dz, h) {
  const dist = Math.hypot(dx, dz);
  // Earth's curve drops far points below the flat plane.
  const y = h - ALT - dist * dist / (2 * 6371);
  const P = [dx, y, dz];
  const z = P[0] * basis.F[0] + P[1] * basis.F[1] + P[2] * basis.F[2];
  if (z < 1) return null;
  return {
    x: W / 2 + (P[0] * basis.R[0] + P[1] * basis.R[1] + P[2] * basis.R[2]) / z * basis.focal,
    y: H / 2 + (P[0] * basis.U[0] + P[1] * basis.U[1] + P[2] * basis.U[2]) / z * basis.focal,
    z, dist,
  };
}
// Towers go in far to near, so near ones cover far ones.
function towerUniforms() {
  const list = [];
  for (const c of cells) {
    const dx = c.x - cam.x, dz = c.z - cam.z;
    const b = project(dx, dz, 2), tp = project(dx, dz, c.top);
    if (!b || !tp) continue;
    const half = c.r * 0.55 / b.z * basis.focal;
    if (b.x + half * 3 < 0 || b.x - half * 3 > W) continue;
    c.screen = { x: b.x, y: b.y, w: half, h: tp.y - b.y };
    let fu = 0, fv = 0.5, fk = 0;
    for (const f of flashes) if (f.cell === c && f.level > fk) { fk = f.level; fu = f.u; fv = f.v; }
    list.push({ c, b, half, hgt: tp.y - b.y, fu, fv, fk });
  }
  list.sort((a, b) => b.b.dist - a.b.dist);
  list.slice(0, MAXCELL).forEach((o, i) => {
    tw.set([o.b.x, o.b.y, o.half, o.hgt], i * 4);
    twB.set([o.c.seed, o.c.s, 1 - Math.exp(-o.b.dist / 170), 0], i * 4);
    twC.set([o.fu, o.fv, o.fk, 0], i * 4);
  });
  return Math.min(list.length, MAXCELL);
}

/* ---------- size ---------- */
function resize() {
  const fit = fitCanvas(canvas, { budget: 1.6e6 });
  if (fit.W === W && fit.H === H) return;
  W = fit.W; H = fit.H; dpr = fit.dpr;
  layout();
  if (ready) render();
}

/* ---------- input ---------- */
const toPx = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * dpr, H - (e.clientY - r.top) * dpr]; };
// The shade's lip is the grab zone for the shade.
function onLip(x, y) {
  const cx = win.x + head.x * 26 * dpr * 0.55;
  const lipY = win.y + head.y * 18 * dpr * 0.55 + win.h - shade.v * win.h * 2;
  return Math.abs(x - cx) < win.w && Math.abs(y - lipY) < 22 * dpr;
}
// A tap aims a flash at the storm layer under the pointer.
function tapAt(x, y) {
  setBasis();
  // A tap on a tower lights it at that spot.
  for (const c of cells) {
    const sc = c.screen;
    if (!sc || c.s < 0.2) continue;
    const u = (x - sc.x) / sc.w, v = (y - sc.y) / sc.h;
    if (Math.abs(u) < 1.2 && v > 0 && v < 1) { flash(c.x, c.z, 1.2, c, u, v); return; }
  }
  const d = [0, 1, 2].map(i => basis.F[i] * basis.focal + basis.R[i] * (x - W / 2) + basis.U[i] * (y - H / 2));
  const l = Math.hypot(...d); d.forEach((v, i) => (d[i] = v / l));
  const Rr = 6371, b = (Rr + ALT) * d[1], c = (ALT - 8) * (2 * Rr + ALT + 8), disc = b * b - c;
  if (disc < 0 || b > 0) return;
  const tt = -b - Math.sqrt(disc);
  flash(cam.x + d[0] * tt, cam.z + d[2] * tt, 1.2);
}
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture?.(e.pointerId);
  const [x, y] = toPx(e);
  drag = { x0: x, y0: y, x, t: performance.now(), moved: false, shade: onLip(x, y), s0: shade.target };
  stage.classList.add('dragging');
});
stage.addEventListener('pointermove', e => {
  const [x, y] = toPx(e);
  if (e.pointerType === 'mouse') { head.tx = clamp(x / W * 2 - 1, -1, 1); head.ty = clamp(y / H * 2 - 1, -1, 1); }
  if (!drag) { stage.classList.toggle('on-shade', onLip(x, y)); wake(); return; }
  if (Math.hypot(x - drag.x0, y - drag.y0) > 6 * dpr) drag.moved = true;
  if (drag.shade) { shade.target = clamp(drag.s0 - (y - drag.y0) / (win.h * 2)); return; }
  // Dragging toward the tail pushes the plane on; the view runs right to left.
  const now = performance.now(), dts = Math.max(0.008, (now - drag.t) / 1000);
  cam.push = clamp(cam.push - (x - drag.x) / dpr / dts * 0.05, -SPEED * 3, SPEED * 6);
  drag.x = x; drag.t = now;
});
function release() {
  if (drag && !drag.moved && !drag.shade) tapAt(drag.x0, drag.y0);
  drag = null;
  stage.classList.remove('dragging');
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', () => { drag = null; stage.classList.remove('dragging'); });
stage.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { head.tx = 0; head.ty = 0; } });

/* ---------- bar ---------- */
function popover(box, btn) {
  const set = on => { box.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!box.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
const stormEl = document.getElementById('storm');
stormEl.value = String(opts.storm);
stormEl.addEventListener('input', () => { opts.storm = +stormEl.value; save('storm', opts.storm); });
function setRoute(v) {
  route = ROUTES[v] || ROUTES.low;
  cam.x = 0; cam.z = 0; cam.push = 0;
  cells.length = 0; flashes.length = 0;
  for (let i = 0; i < Math.round(opts.storm * MAXCELL); i++) { const c = newCell(false); c.age = rnd(12, 40); c.s = 1; cells.push(c); }
}
choices(document.getElementById('route'), v => { opts.route = v; save('route', v); setRoute(v); render(); }).set(opts.route);
choices(document.getElementById('cloud'), v => { opts.cloud = +v; save('cloud', v); render(); }).set(String(opts.cloud));
choices(document.getElementById('moon'), v => { opts.moon = +v; save('moon', v); render(); }).set(String(opts.moon));
document.getElementById('shadeBtn').addEventListener('click', () => { shade.target = shade.target > 0.5 ? 0.16 : 0.92; wake(); });

/* ---------- start ---------- */
setRoute(opts.route);
window.__ws = { cells, cam, flashes, look, fwd };
new ResizeObserver(() => resize()).observe(stage);
resize();
loadNight().then(() => {
  render();
  // One finished frame folds shader work into the intro.
  gl.finish();
  ready = true;
  markReady();
  requestAnimationFrame(() => canvas.classList.add('on'));
  whenVisible(stage, v => { visible = v; if (v) wake(); });
  wake();
});
</script>
</body>
</html>
