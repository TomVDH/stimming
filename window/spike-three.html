  const st = opts.storm;
  UG.uniform1f(u.uCover, opts.cloud + (Math.min(opts.cloud, 0.34) - opts.cloud) * st);
  UG.uniform1f(u.uStorm, st);
  UG.uniform1f(u.uFog, fog.level);
  // Wisp noise repeats every 3264 m in x, 63 m in z.

  spr.fill(0);

  UG.uniform4fv(u['uSpr[0]'], spr);
  // Cirrus thickens as the deck closes.
  UG.uniform1f(u.uCirrus, clamp(1.4 - opts.cloud * 1.5, 0.3, 1) * (1 - st) + st);

  UG.uniform1i(u.uLightSteps, quality() === 'high' ? 4 : 3);
  // The mid layer fills in as the deck closes.
  UG.uniform1f(u.uMid, clamp(1.6 - opts.cloud * 2.1, 0.2, 1) * (1 - st) + st);
  UG.tex(u.uNoise, noiseTex);
  UG.uniform1f(u.uFlash, flash);
  // At midnight the aurora glows over the clouds and tints their tops green.
  // A storm's overcast hides the aurora.
  const aur = auroraOn() * (1 - smooth(0, 0.6, opts.storm));
  UG.uniform1f(u.uAurora, aur);
  UG.uniform3fv(u.uAmb, sky.amb.map((v, i) => v + [0.0004, 0.004, 0.0018][i] * aur)); UG.uniform3fv(u.uSunL, sky.sunL); UG.uniform3fv(u.uFloor, sky.h.floor);
  // The wing goes in world space, so it banks with the cabin.
  UG.uniform3fv(u['uWP[0]'], WS.flatMap(w => w.map(toWorld)).flat());
  UG.uniform3fv(u['uWN[0]'], PANELS.map(q => quadNormal(q.map(toWorld))).flat());
  UG.uniform1fv(u['uWS[0]'], SPAN);
  // Straight reference edges, root to tip, for the panel lines.
  // The trailing edge line runs on from the outboard part, past the kink.
  UG.uniform4f(u.uWL, ST[0][0], ST[0][2], ST[5][0], ST[5][2]);
  UG.uniform2f(u.uWT, ST[1][1] - (ST[5][1] - ST[1][1]) / (ST[5][2] - ST[1][2]) * (ST[1][2] - ST[0][2]), ST[5][1]);
  const let_ = LET.map(toWorld);
  UG.uniform3fv(u['uLet[0]'], let_.flat()); UG.uniform3fv(u.uLetN, quadNormal(let_));
  // Aircraft axes in the world: chord runs aft, up, and span runs out the window.
  UG.uniform3fv(u.uChord, toWorld([-1, 0, 0])); UG.uniform3fv(u.uUpA, toWorld([0, 1, 0])); UG.uniform3fv(u.uSpan, toWorld([0, 0, 1]));
  UG.uniform3fv(u.uNacA, toWorld(NAC.a)); UG.uniform3fv(u.uNacB, toWorld(NAC.b)); UG.uniform1f(u.uNacR, NAC.r);
  UG.uniform4fv(u['uFairA[0]'], FAIRS.flatMap(f => [...toWorld(f.a), f.a[3]]));
  UG.uniform4fv(u['uFairB[0]'], FAIRS.flatMap(f => [...toWorld(f.b), f.b[3]]));
  const n = towerUniforms();
  UG.uniform1i(u.uTowSteps, quality() === 'high' ? 64 : 40);
  UG.uniform1i(u.uTowOct, 3);
  UG.uniform1f(u.uTowStep, quality() === 'high' ? 0.3 : 0.5);
  UG.uniform4fv(u['uTw[0]'], tw); UG.uniform4fv(u['uTwB[0]'], twB); UG.uniform4fv(u['uTwC[0]'], twC);
  UG.uniform1i(u.uNTw, n);
  UG.uniform4fv(u['uFl[0]'], fl);
  const b0 = EV.boom;
  UG.uniform4fv(u.uBoom, b0 ? [b0.x, b0.z, b0.ring || 0, b0.ringK || 0] : [0, 0, 0, 0]);
  UG.uniform2fv(u.uBoomL, b0 ? [b0.flash || 0, b0.crater || 0] : [0, 0]);

  airportUniforms(u);
  const nTr = trailUniforms();
  // Both rows go up as one 128 by 2 float texture.
  trailData.set(trA, 0); trailData.set(trB, TRAIL_N * 4);

  UG.tex(u.uTrail, trailTex); UG.uniform1i(u.uTrN, nTr);
  renderer.setRenderTarget(outRT);
  renderer.clear();
  // The aircraft goes first; the outside then fills only the uncovered pixels.
  wing3.update({ basis, bank, sky, HOR, W, H, t, flash, strobe: reduce ? 0 : strobe(), tip: toWorld(TIP), turb: 0.4 + opts.storm, bolt: lastBolt, fogLevel: fog.level });
  renderer.render(wing3.scene, wing3.cam);
  renderer.render(P1.scene, quadCam);
  // Bolts add their light over the outside; the wing's depth hides them.
  // A thick bank swallows them.
  lastBolt = bolts.update({ flashes, camXZ: [cam.x, cam.z], H: ALT, wingCam: wing3.cam, outW: outBuf.w, outH: outBuf.h, cover: opts.cloud, haze: smooth(0.3, 0.9, fog.level) });
  renderer.render(bolts.scene, bolts.cam);
  // Resolve into the next history target; the cabin pass reads that.

  const [prev, next] = frameN % 2 ? [hist[1], hist[0]] : [hist[0], hist[1]];
  UG.tex(PR.u.uCur, outRT.texture); UG.tex(PR.u.uHist, prev.texture);
  UG.uniform2f(PR.u.uTexel, 1 / outBuf.w, 1 / outBuf.h);
  UG.uniform1f(PR.u.uK, histFresh || reduce ? 1 : 0.25);
  renderer.setRenderTarget(next);
  renderer.render(PR.scene, quadCam);
  histFresh = false; frameN++;

  // Pass 2: the cabin, the frame and the glass, to the screen.

  shared(u);
  UG.tex(u.uOut, lit.texture);
  UG.uniform1f(u.uDpr, dpr);
  UG.uniform1f(u.uDimE, dim.edge); UG.uniform1f(u.uDimC, dim.core);
  UG.uniform1f(u.uFlash, flash);
  UG.uniform1i(u.uSteps, marchSteps());
  // The storm brings rain to the window, up to heavy.
  UG.uniform1f(u.uRain, Math.max(opts.rain, smooth(0.2, 0.9, opts.storm)));
  UG.uniform1f(u.uStorm, opts.storm);
  // Less window light reaches the cabin through dimmed glass, and it turns blue.
  const tg = dimT((dim.edge + dim.core) / 2);
  UG.uniform3fv(u.uCabin, sky.cabin);
  UG.uniform3fv(u.uGlow, sky.glow.map((v, i) => (v + [0.004, 0.05, 0.022][i] * aur) * tg[i])); UG.uniform3fv(u.uDisc, sky.disc); UG.uniform3fv(u.uTint, sky.tint);
  UG.uniform1f(u.uSunR, sky.sunR); UG.uniform1f(u.uSquash, sky.squash);
  UG.uniform1f(u.uMoon, sky.h.moon ? 1 : 0); UG.uniform1f(u.uStars, sky.h.stars);
  const m = EV.meteor;
  UG.uniform3fv(u.uMetA, m ? m.A : [0, 0, 1]); UG.uniform3fv(u.uMetB, m ? m.B : [0, 0, 1]);
  UG.uniform4fv(u.uMet, m ? [m.p, m.tail, m.b, m.train] : [0, 0, 0, 0]);
  UG.uniform4fv(u.uMetF, m ? [m.fire ? 1 : 0, m.seed, m.trainAge, m.hue] : [0, 0, 0, 0]);
  flareUniforms(u);
  pointUniforms(u);
  renderer.setRenderTarget(null);
  renderer.setViewport(0, 0, W, H);
  renderer.render(P2.scene, quadCam);
}
/* ---------- lens flare ---------- */
// A world direction to screen pixels; null when it is behind the camera.
function screenOf(v) {
  const z = dot(v, basis.F);
  if (z < 0.05) return null;
  return [W / 2 + dot(v, basis.R) / z * basis.focal, H / 2 + dot(v, basis.U) / z * basis.focal];
}
// World to aircraft frame: undo the bank.
const toAir = v => [v[0], v[1] * Math.cos(bank) + v[2] * Math.sin(bank), -v[1] * Math.sin(bank) + v[2] * Math.cos(bank)];
function sdBox2(x, y, bx, by, rr) {
  const qx = Math.abs(x) - bx + rr, qy = Math.abs(y) - by + rr;
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - rr;
}
// How much of a source shows through the glass, from 0 to 1.
// The ray must clear the rim and the pane's edges.
// rad is the source's angular radius; points get a 4 mm soft edge.
function seen(dirA, rad = 0) {
  const e = basis.eye;
  if (dirA[2] <= 1e-4) return 0;
  let cover = 1;
  for (const z of [0, WIN.slot, WIN.depth, WIN.zOut]) {
    const k = clamp(z / WIN.depth), tt = (z - e[2]) / dirA[2];
    const x = e[0] + dirA[0] * tt, y = e[1] + dirA[1] * tt;
    const bx = WIN.out[0] + (WIN.inn[0] - WIN.out[0]) * k, by = WIN.out[1] + (WIN.inn[1] - WIN.out[1]) * k;
    let sd = z === WIN.zOut ? sdBox2(x, y, WIN.skin[0], WIN.skin[1], WIN.rSkin) : sdBox2(x, y, bx, by, WIN.rOut + (WIN.rIn - WIN.rOut) * k);
    // The disc's radius on this plane, in metres.
    const rr = Math.max(rad * tt, 0.002);
    cover = Math.min(cover, clamp(0.5 - sd / (2 * rr)));
  }

}
// True when a world ray from the eye meets the wing or winglet.
function onWing(d) {
  for (const q of [...PANELS, LET]) {
    const v = q.map(toWorld), n = quadNormal(v), dn = dot(d, n);
    if (Math.abs(dn) < 1e-4) continue;
    const tt = dot(v[0], n) / dn;
    if (tt <= 0) continue;
    const p = d.map(c => c * tt);
    let s0 = 0, inside = true;
    for (let i = 0; i < 4; i++) {
      const s = dot(cross(sub(v[(i + 1) % 4], v[i]), sub(p, v[i])), n);
      if (i === 0) s0 = s; else if (s * s0 < 0) { inside = false; break; }
    }

  }
  return false;
}
// A world ray from the eye against one tower, by its shape without billows.
// It returns the hit distance and height in km, or null.
function towerHit(c, d) {
  const C = [c.x - cam.x, c.z - cam.z], a2 = d[0] * d[0] + d[2] * d[2];
  const g = towerGeom(c), [ax, az] = g.ax, u = g.lean + g.len * 0.45;
  // Column first, then the anvil fan near the top.
  const parts = [[C[0] + ax * g.lean * 0.4, C[1] + az * g.lean * 0.4, g.rc * 1.15, g.base, g.top],
    [C[0] + ax * u, C[1] + az * u, (g.r1 + g.r2) * 0.45, g.top - 2.2 * g.anv, g.top]];
  for (const [cx, cz, rr, lo, hi] of parts) {
    const t = (d[0] * cx + d[2] * cz) / a2;
    if (t <= 0) continue;
    const m = Math.hypot(d[0] * t - cx, d[2] * t - cz);
    const y = Math.hypot(d[0] * t, 6371 + ALT + d[1] * t, d[2] * t) - 6371;
    if (m < rr && y > lo && y < hi) return { t, y };

}
// How much the storm towers hide a world direction, from 0 to 1.
function towerCover(d) {
  let hide = 0;
  for (const c of cells) if (c.s > 0 && towerHit(c, d)) hide = Math.max(hide, c.s);
  return hide;
}
// Ten flare slots: sun or moon, lightning, strobe, nav light, meteor, rocket, a jet's two lights, and the impact's two.
const FLARES = 10;
const flr = new Float32Array(FLARES * 4), flrC = new Float32Array(FLARES * 4);
const flareSeen = new Array(FLARES).fill(0);
function flareUniforms(u) {
  flr.fill(0); flrC.fill(0);

  const tc = dimT(dim.core), tl = lum(tc);

  const put = (i, dirW, gain, size, col, rad = 0, streak = 0) => {

    const vis = sp ? seen(norm(toAir(dirW)), rad) : 0;
    // Visibility eases, so a source does not pop at the rim.
    flareSeen[i] += (vis - flareSeen[i]) * 0.35;
    if (!sp || gain * flareSeen[i] < 1e-3) return;
    flr.set([sp[0], sp[1], gain * flareSeen[i], size], i * 4);

  const clear = sky.up * (onWing(sky.sun) ? 0 : 1) * (1 - towerCover(sky.sun)) * (1 - 0.7 * opts.storm) * (1 - fog.level);
  put(0, sky.sun, sky.h.flare * clear ** 3, 0.5 + 0.5 * clear, sky.flareCol, sky.sunR, sky.h.moon ? 0 : 0.4);

  const tipW = norm(toWorld(sub(TIP, basis.eye)));
  put(2, tipW, reduce ? 0 : strobe() * 0.5, 0.5, [0.9, 0.95, 1.0], 0, 0.6);
  put(3, tipW, 0.08, 0.35, [1.0, 0.1, 0.05]);

// Towers go in far to near, so near ones cover far ones.
function towerUniforms() {
  const all = cells.filter(c => c.s > 0.01);
  const bc = EV.boom && boomCell(EV.boom);
  if (bc) all.push(bc);
  const list = all.map(c => ({ c, dist: Math.hypot(c.x - cam.x, c.z - cam.z) }));
  list.sort((a, b) => b.dist - a.dist);
  const near = list.slice(-MAXCELL);
  near.forEach(({ c }, i) => {
    tw.set([c.x, c.z, c.r, c.top], i * 4);
    twB.set([c.seed, c.s, c.shear, c.glow * opts.towns * sky.h.lit], i * 4);
    // The brightest flash inside this cell lights it from within.
    let best = null;
    for (const f of flashes) if (f.cell === c && (!best || f.level > best.level)) best = f;
    // The mushroom glows from its fireball, low in the stem.
    if (c === bc) twC.set([c.x, c.top * 0.35, c.z, 3 * EV.boom.flash + 0.3 * EV.boom.crater], i * 4);
    else twC.set(best ? [best.x, best.y, best.z, best.level] : [c.x, 6, c.z, 0], i * 4);
  });
  return near.length;
}

/* ---------- size ---------- */
function resize(force = false) {
  const fit = fitCanvas(canvas, { budget: 1.6e6 });
  if (!force && fit.W === W && fit.H === H) return;
  W = fit.W; H = fit.H; dpr = fit.dpr;
  if (ready) render();
}

/* ---------- input ---------- */
const toPx = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * dpr, H - (e.clientY - r.top) * dpr]; };
// A tap on a tower lights it at that spot; elsewhere it lights the deck.
function tapAt(x, y) {
  setBasis();
  const d = norm([0, 1, 2].map(i => basis.F[i] * basis.focal + basis.R[i] * (x - W / 2) + basis.U[i] * (y - H / 2)));
  // The nearest tower under the tap flashes where the tap meets it.
  let hit = null;
  for (const c of cells) {
    if (c.s < 0.2) continue;
    const h = towerHit(c, d);
    if (h && (!hit || h.t < hit.h.t)) hit = { c, h };
  }
  if (hit) {
    const { c, h } = hit;
    flash(cam.x + d[0] * h.t, cam.z + d[2] * h.t, 1.2, c, clamp(h.y, 3, c.top - 0.8));
    return;
  }
  const Rr = 6371, b = (Rr + ALT) * d[1], c = (ALT - 2) * (2 * Rr + ALT + 2), disc = b * b - c;
  if (disc < 0 || b > 0) return;
  const tt = -b - Math.sqrt(disc);
  flash(cam.x + d[0] * tt, cam.z + d[2] * tt, 1.2);
}
let drag = null;
// Two touches pinch to lean; the map holds each live pointer.
const touches = new Map();
let pinch = 0;
const spread = () => { const [a, b] = [...touches.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture?.(e.pointerId);
  const [x, y] = toPx(e);
  touches.set(e.pointerId, [x, y]);
  if (touches.size === 2) { pinch = spread(); if (drag) drag.moved = true; return; }
  drag = { x0: x, y0: y, x, y, moved: false };
  stage.classList.add('dragging');
});
stage.addEventListener('pointermove', e => {
  const [x, y] = toPx(e);
  if (e.pointerType === 'mouse') { head.thx = clamp(x / W * 2 - 1, -1, 1); head.thy = clamp(y / H * 2 - 1, -1, 1); }
  if (touches.has(e.pointerId)) touches.set(e.pointerId, [x, y]);
  if (touches.size === 2) {
    // Fingers apart lean in; together lean back.
    const s2 = spread();
    moveHead(0, 0, (s2 - pinch) / Math.min(W, H) * 0.3);
    pinch = s2;
    return;
  }
  if (!drag) return;
  if (Math.hypot(x - drag.x0, y - drag.y0) > 6 * dpr) drag.moved = true;
  // The head follows the drag: right moves toward the nose, up rises.
  const k = 0.42 / Math.min(W, H);
  moveHead((x - drag.x) * k, (y - drag.y) * k, 0);
  drag.x = x; drag.y = y;
});
function release(e) {
  touches.delete(e.pointerId);
  if (touches.size) return;
  if (drag && !drag.moved) tapAt(drag.x0, drag.y0);
  drag = null;
  stage.classList.remove('dragging');
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', e => { touches.delete(e.pointerId); drag = null; stage.classList.remove('dragging'); });

// The wheel leans toward the glass or back into the seat.
stage.addEventListener('wheel', e => { e.preventDefault(); moveHead(0, 0, -e.deltaY * 0.0004); }, { passive: false });
// Arrow keys move the head; plus and minus lean.
stage.addEventListener('keydown', e => {
  const m = { ArrowLeft: [-0.02, 0, 0], ArrowRight: [0.02, 0, 0], ArrowUp: [0, 0.02, 0], ArrowDown: [0, -0.02, 0], '+': [0, 0, 0.02], '=': [0, 0, 0.02], '-': [0, 0, -0.02] }[e.key];
  if (!m) return;
  e.preventDefault();
  moveHead(...m);
});

/* ---------- bar ---------- */
if (!HOURS[opts.hour]) opts.hour = 'dusk';
const pick3 = (a, b, c) => [{ value: a[0], label: a[1] }, { value: b[0], label: b[1] }, { value: c[0], label: c[1] }];
const ui = initPage({
  id: 'window',
  bar: {
    choice: {
      label: 'Time of day', display: 'stepper', value: opts.hour,
      options: Object.keys(HOURS).map(k => ({ value: k, label: HOUR_NAMES[k] })),
      onPick: v => { opts.hour = v; save('hour', v); buildSky(); uploadSky(); histFresh = true; render(); },
    },
    slider: { label: 'Storm', min: 0, max: 1, step: 0.01, value: opts.storm, onInput: v => { opts.storm = v; save('storm', v); } },
    // Dim steps the glass through five levels, then back to clear.
    actions: [{ verb: 'dim', label: 'Dim', key: 'D', onPress: () => { opts.dim = (opts.dim + 1) % 5; save('dim', opts.dim); } }],
    settings: [
      { type: 'choice', id: 'cloud', label: 'Cloud', value: String(opts.cloud), options: pick3(['0.62', 'Clear'], ['0.5', 'Broken'], ['0.38', 'Deck']), onPick: v => { opts.cloud = +v; save('cloud', v); render(); } },
      { type: 'choice', id: 'towns', label: 'Towns', value: String(opts.towns), options: pick3(['0.5', 'Sparse'], ['1', 'Some'], ['1.7', 'Dense']), onPick: v => { opts.towns = +v; save('towns', v); render(); } },
      { type: 'choice', id: 'rain', label: 'Rain', value: String(opts.rain), options: pick3(['0', 'Off'], ['0.5', 'Light'], ['1', 'Heavy']), onPick: v => { opts.rain = +v; save('rain', v); render(); } },
      { type: 'toggle', id: 'aurora', label: 'Aurora', value: opts.aurora === 'on', onToggle: on => { opts.aurora = on ? 'on' : 'off'; save('aurora', opts.aurora); render(); } },
      // Sights: each option calls its sight now.
      { type: 'choice', id: 'falling', label: 'Falling', value: '', options: [{ value: 'meteor', label: 'Meteor' }, { value: 'fireball', label: 'Fireball' }, { value: 'boom', label: 'Impact' }], onPick: v => startEvent(v) },
      { type: 'choice', id: 'flying', label: 'Flying', value: '', options: [{ value: 'rocket', label: 'Rocket' }, { value: 'jet', label: 'Jet' }], onPick: v => startEvent(v) },
    ],
    quality: true,
    keys: [['drag', 'lean and peer'], ['scroll', 'lean closer'], ['click', 'a storm flashes'], ['D', 'dim the glass']],
  },
});
// Quality sets the canvas size, the pass 1 size and the march steps.
onQuality(() => resize(true));

/* ---------- start ---------- */
// The flight opens with a few cells already standing.
if (window.__reseed) window.__reseed();
for (let i = 0; i < Math.round(opts.storm * MAXCELL); i++) { const c = newCell(false); c.age = rnd(20, 40); c.s = 1; cells.push(c); }
window.__ws = { cells, flashes, EV, newMeteor, cam, apList, render, gl, flash };
buildSky();
uploadSky();
new ResizeObserver(() => resize()).observe(stage);
resize();
render();
// One finished frame folds shader work into the intro.
gl.finish();
ready = true;
markReady();
requestAnimationFrame(() => canvas.classList.add('on'));
whenVisible(stage, v => { visible = v; if (v) wake(); });
wake();
</script>
