<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fidget board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Fidget board: a dark tray of soft panels, one control group per panel.
   The controls are lit from the top left; the JS draws their shading. */
:root { --stage: oklch(0.15 0.012 275); }
/* The gap resolves to pixels on the board, so plates inherit one size. */
@property --gap { syntax: "<length>"; inherits: true; initial-value: 8px; }

/* ---------- the slab: plates fill the stage, cut apart by gaps ---------- */
.stage--fidget { container: stage / size; }
.board {
  position: absolute; inset: 0; display: grid;
  --gap: clamp(5px, 1.6cqmin, 14px);
  --pad: calc(var(--gap) * 1.5);
  --gi: calc(var(--gap) * 1.2);
  padding: var(--gap); gap: var(--gap);
  /* Wide: the big part leads; the row and bands to its right; six small below. */
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-template-rows: minmax(0, 3fr) minmax(0, 2fr) minmax(0, 2fr) minmax(0, 4fr);
  grid-template-areas:
    "big big big big row row row row row row row row"
    "big big big big band1 band1 band1 band1 band1 band1 band1 band1"
    "big big big big band2 band2 band2 band2 band2 band2 band2 band2"
    "s1 s1 s2 s2 s3 s3 s4 s4 s5 s5 s6 s6";
}

/* ---------- slots: each sits a little proud of the tray ---------- */
.cell {
  container-type: size; position: relative; display: grid; place-items: center;
  min-width: 0; min-height: 0;
  background: linear-gradient(170deg, oklch(0.275 0.022 var(--hue)), oklch(0.215 0.018 var(--hue)));
  box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.08), inset 0 -1px 0 oklch(0 0 0 / 0.35);
  border-radius: max(6px, calc(20px - var(--gap)));
  /* The inner margin shrinks on thin panels. */
  --p: min(var(--pad), 8cqmin);
  --hue: 270;
}
.s-big { grid-area: big; --hue: 255; }
.s-row { grid-area: row; --hue: 280; }
.s-band1 { grid-area: band1; --hue: 265; }
.s-band2 { grid-area: band2; --hue: 250; }
.s-s1 { grid-area: s1; --hue: 285; }
.s-s2 { grid-area: s2; --hue: 260; }
.s-s3 { grid-area: s3; --hue: 275; }
.s-s4 { grid-area: s4; --hue: 290; }
.s-s5 { grid-area: s5; --hue: 245; }
.s-s6 { grid-area: s6; --hue: 270; }
/* A rolled part shrinks out, then springs in. */
.cell > * { transition: opacity 0.14s ease-out, transform 0.32s cubic-bezier(0.3, 1.6, 0.5, 1); }
.cell.out > * { opacity: 0; transform: scale(0.82); transition-duration: 0.14s; }

/* A group fits its plate: one row of items, all one height. */
.grp {
  display: grid; grid-auto-flow: column; align-items: center; justify-content: center; gap: var(--gi);
  --rows: 1; --n: 1; --sr: 1;
  --h: min((100cqh - 2 * var(--p) - (var(--rows) - 1) * var(--gi)) / var(--rows), (100cqw - 2 * var(--p) - (var(--n) - 1) * var(--gi)) / var(--sr));
}
.grp > .ctl { height: var(--h); width: auto; aspect-ratio: var(--ar); }
/* Each part sets its item count and summed aspect for the fit. */
.p-keys .grp { --n: 4; --sr: 4; }
.p-tog .grp { --n: 3; --sr: 1.3065; }
.p-safe .grp { --sr: 0.641; }
.p-rock .grp { --n: 2; --sr: 1.2308; }
.p-wheel .grp { --sr: 0.3333; }
/* The bands stretch to their plate; their tracks follow the length. */
.wide { width: calc(100cqw - 2 * var(--p)); height: calc(100cqh - 2 * var(--p)); }

/* ---------- controls ---------- */
.ctl {
  display: block; position: relative; margin: 0; padding: 0; border: 0; background: none;
  color: inherit; font: inherit; cursor: pointer; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
.ctl svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ctl:focus-visible, .safety .hit:focus-visible { outline: 2px solid var(--focus); outline-offset: 5px; }
.dial { --ar: 1; border-radius: 50%; cursor: grab; }
.joy { --ar: 1; border-radius: 50%; cursor: grab; }
.key { --ar: 1; border-radius: 20%; }
.toggle { --ar: 54 / 124; border-radius: 999px; }
.safety { --ar: 100 / 156; border-radius: 14px; }
.rocker { --ar: 64 / 104; border-radius: 14px; }
.wheel { --ar: 60 / 180; border-radius: 14px; cursor: grab; }
.fader, .abacus { border-radius: 10px; cursor: grab; }
.held { cursor: grabbing; }
/* The safety's buttons only carry focus; the face takes the pointer. */
.safety .hit {
  position: absolute; inset: 0; margin: 0; padding: 0; border: 0; background: none;
  border-radius: inherit; pointer-events: none;
}
.safety .arm { inset: 25.6% 34% 11.5%; border-radius: 999px; }

/* ---------- the die: its pips change as it tumbles ---------- */
.die { display: inline-flex; align-items: center; gap: 0.45em; }
.die svg { width: 1.25em; height: 1.25em; overflow: visible; }
.die rect { fill: none; stroke: currentColor; stroke-width: 1.7; }
.die circle { fill: currentColor; }
.die.tumble svg { animation: tumble 0.6s cubic-bezier(0.3, 1.4, 0.5, 1); }
@keyframes tumble { 0% { transform: rotate(0) scale(1); } 45% { transform: rotate(250deg) scale(1.25); } 100% { transform: rotate(360deg) scale(1); } }

/* ---------- layouts by stage shape; these come last to win ---------- */
/* Squarish: the big part and four small on top, then row, bands, two small. */
@container stage (aspect-ratio < 1.42) {
  .board {
    grid-template-rows: minmax(0, 3fr) minmax(0, 3fr) minmax(0, 2.2fr) minmax(0, 1.8fr) minmax(0, 1.8fr) minmax(0, 3.4fr);
    grid-template-areas:
      "big big big big big big s1 s1 s1 s2 s2 s2"
      "big big big big big big s3 s3 s3 s4 s4 s4"
      "row row row row row row row row row row row row"
      "band1 band1 band1 band1 band1 band1 band1 band1 band1 band1 band1 band1"
      "band2 band2 band2 band2 band2 band2 band2 band2 band2 band2 band2 band2"
      "s5 s5 s5 s5 s5 s5 s6 s6 s6 s6 s6 s6";
  }
}
/* Tall: the big part beside two small, then row, bands and four small. */
@container stage (aspect-ratio < 0.95) {
  .board {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: minmax(0, 115fr) minmax(0, 115fr) minmax(0, 70fr) minmax(0, 52fr) minmax(0, 52fr) minmax(0, 105fr);
    grid-template-areas:
      "big big big s1"
      "big big big s2"
      "row row row row"
      "band1 band1 band1 band1"
      "band2 band2 band2 band2"
      "s3 s4 s5 s6";
  }
}
@media (prefers-reduced-motion: reduce) {
  .cell > *, .die.tumble svg { transition: none; animation: none; }
}
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/fidget.svg)"></span><span class="intro-name">Fidget board</span><span class="intro-sub">Stimming No. 03</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--fidget" role="group" aria-label="Fidget board">
      <div class="board" id="board"></div>
    </div>
    <div class="bar bar--below">
      <div class="actions">
        <button class="chip die" id="roll" type="button" aria-label="Roll new controls"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><g class="pips"></g></svg><span>Roll</span></button>
        <button class="chip" id="shuffle" type="button">Shuffle</button>
        <button class="chip" id="reset" type="button">Reset</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>switches and keys</dd></div>
        <div><dt>Drag</dt><dd>dials, sliders and beads</dd></div>
        <div><dt>Roll</dt><dd>deals new controls</dd></div>
        <div><dt>Arm and latch</dt><dd>then a key launches</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Fidget board</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module">
import { initPage } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import { board, snd, reduce, sleep, pruneLight, rnd } from './kit.js';
import PARTS from './parts/index.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
initPage({ id: 'fidget' });

/* ---------- bento: ten slots, one part in each ---------- */
const SLOTS = [['big', 'big'], ['row', 'row'], ['band1', 'band'], ['band2', 'band'], ...[1, 2, 3, 4, 5, 6].map(n => [`s${n}`, 'small'])];
const boardEl = document.getElementById('board');
const cells = SLOTS.map(([name, kind]) => {
  const c = document.createElement('div');
  c.className = `cell s-${name}`;
  c.dataset.kind = kind;
  boardEl.append(c);
  return c;
});
const byId = new Map(PARTS.map(p => [p.id, p]));
const mounted = new Map(), styled = new Set();
function mount(cell, part) {
  // A part's own styles load once, on its first mount.
  if (part.css && !styled.has(part.id)) {
    styled.add(part.id);
    const st = document.createElement('style');
    st.textContent = part.css;
    document.head.append(st);
  }
  cell.classList.add('p-' + part.id);
  const inst = part.mount(cell);
  mounted.set(cell, { part, inst });
  inst.bodies.forEach(b => b.draw());
}
function unmount(cell) {
  const m = mounted.get(cell);
  if (!m) return;
  m.inst.destroy?.();
  m.inst.bodies.forEach(sleep);
  cell.classList.remove('p-' + m.part.id);
  cell.replaceChildren();
  mounted.delete(cell);
}
const allMoves = () => [...mounted.values()].flatMap(m => m.inst.moves);

/* ---------- deals: which part sits in which slot ---------- */
const DEFAULT = ['dial', 'keys', 'fader', 'abacus', 'joy', 'tog', 'safe', 'rock', 'wheel', 'arcade'];
const KEY = 'stimming.fidget.deal';
const shuffled = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
// A slot keeps a given id only if it fits and is not used twice.
// Empty slots then take the first free part of their kind.
function settle(ids) {
  const used = new Set(), out = SLOTS.map(([, kind], i) => {
    const p = byId.get(ids?.[i]);
    if (p && p.slot === kind && !used.has(p.id)) { used.add(p.id); return p.id; }
    return null;
  });
  return out.map((id, i) => {
    if (id) return id;
    const p = PARTS.find(q => q.slot === SLOTS[i][1] && !used.has(q.id));
    if (p) used.add(p.id);
    return p ? p.id : null;
  });
}
// A roll deals fresh parts; each slot avoids the part it just held.
function deal(prev) {
  const pools = {};
  shuffled([...PARTS]).forEach(p => (pools[p.slot] ||= []).push(p.id));
  return SLOTS.map(([, kind], i) => {
    const pool = pools[kind] || [];
    let j = pool.findIndex(id => id !== prev[i]);
    if (j < 0) j = 0;
    return pool.length ? pool.splice(j, 1)[0] : null;
  });
}
const store = {
  get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } },
  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch { /* storage is optional */ } },
};
let current = settle(store.get() || DEFAULT);
cells.forEach((cell, i) => { if (current[i]) mount(cell, byId.get(current[i])); });

/* ---------- the die ---------- */
const rollBtn = document.getElementById('roll'), pips = rollBtn.querySelector('.pips');
const P = { c: 12, l: 7.5, r: 16.5 };
const FACES = [
  [[P.c, P.c]],
  [[P.l, P.l], [P.r, P.r]],
  [[P.l, P.l], [P.c, P.c], [P.r, P.r]],
  [[P.l, P.l], [P.r, P.l], [P.l, P.r], [P.r, P.r]],
  [[P.l, P.l], [P.r, P.l], [P.c, P.c], [P.l, P.r], [P.r, P.r]],
  [[P.l, P.l], [P.r, P.l], [P.l, P.c], [P.r, P.c], [P.l, P.r], [P.r, P.r]],
];
function face(n) {
  pips.innerHTML = FACES[n].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.9"/>`).join('');
}
face(4);
// The rattle: a handful of quick clacks on a tray.
const rattle = () => snd.play('roll', 0.3, 0.5, (t, P, G) => {
  for (let k = 0; k < 5; k++) {
    const at = t + k * 0.055 + Math.random() * 0.02, g = G * (1 - k * 0.15);
    snd.hiss(at, 'bandpass', rnd(1800, 3200) * P, 2, 0.012, 0.32 * g);
    snd.ring(at, rnd(700, 1100) * P, rnd(650, 1000) * P, 0.03, 0.07 * g);
  }
});
let rolling = false;
function roll() {
  if (rolling) return;
  rolling = true;
  rattle();
  rollBtn.classList.remove('tumble');
  void rollBtn.offsetWidth;
  rollBtn.classList.add('tumble');
  // The pips flicker while the die tumbles, then land.
  let n = 0;
  const flick = setInterval(() => face((Math.random() * 6) | 0), 70);
  setTimeout(() => { clearInterval(flick); face((Math.random() * 6) | 0); }, reduce ? 0 : 520);
  const next = deal(current), gap = reduce ? 0 : 45, out = reduce ? 0 : 150;
  cells.forEach((cell, i) => setTimeout(() => {
    cell.classList.add('out');
    setTimeout(() => {
      unmount(cell);
      if (next[i]) mount(cell, byId.get(next[i]));
      requestAnimationFrame(() => requestAnimationFrame(() => cell.classList.remove('out')));
      if (++n === cells.length) { pruneLight(); rolling = false; }
    }, out);
  }, i * gap));
  current = next;
  store.set(next);
}
rollBtn.addEventListener('click', roll);

/* ---------- shuffle and reset ---------- */
// Each move fires in a wave from left to right across the board.
let wave = [];
// The return value is the wave's length in ms.
function sweep(kind, skip) {
  wave.forEach(clearTimeout);
  const list = allMoves().filter(m => m[kind] && !skip?.has(m.el)).map(m => {
    const r = m.el.getBoundingClientRect();
    return { m, at: r.left + r.width / 2 + 0.35 * (r.top + r.height / 2) };
  }).sort((a, b) => a.at - b.at);
  const gap = reduce ? 25 : 55;
  wave = list.map(({ m }, i) => setTimeout(() => m[kind](), i * gap));
  return list.length * gap;
}
document.getElementById('shuffle').addEventListener('click', () => sweep('shuffle'));
document.getElementById('reset').addEventListener('click', () => sweep('reset'));

/* ---------- launch ---------- */
// The run laps the dial, then a shuffle wave crosses the board.
// Spent, the board disarms: the switch drops, the latched key pops.
const moveOf = el => allMoves().find(m => m.el === el);
let fuse = [];
board.fire = () => {
  if (!board.keys || !board.safety) return;
  board.firing = true;
  board.dial?.prime();
  snd.launch();
  board.dial?.run();
  const keep = new Set([...board.keys.els, board.safety.el]);
  fuse.forEach(clearTimeout);
  fuse = [setTimeout(() => {
    const t = sweep('shuffle', keep);
    fuse.push(
      setTimeout(() => { if (board.safety) moveOf(board.safety.el)?.reset(); }, t + 250),
      setTimeout(() => {
        if (board.keys) moveOf(board.keys.latch)?.reset();
        board.firing = false;
        board.dial?.prime();
      }, t + 520),
    );
  }, reduce ? 0 : 440)];
};

// Hidden, the loop pauses, so any scrape stops with it.
document.addEventListener('visibilitychange', () => { if (document.hidden) snd.hush(); });
</script>
</body>
</html>
