<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fidget board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Fidget board: a live blueprint. Each plate is a framed drawing sheet.
   Parts are wireframes: paper fill, ink edge, dashed hidden edges, hatched when pressed. */
:root {
  --stage: oklch(0.22 0.06 258);
  --ink: oklch(0.93 0.03 225); --faint: oklch(0.72 0.06 240); --hot: oklch(0.76 0.17 52);
}
/* The gap resolves to pixels on the board, so plates inherit one size. */
@property --gap { syntax: "<length>"; inherits: true; initial-value: 8px; }

/* ---------- the sheet: a drafting grid under framed plates ---------- */
.stage--fidget {
  container: stage / size;
  --g1: oklch(0.8 0.06 235 / 0.06); --g2: oklch(0.8 0.06 235 / 0.12);
  background:
    linear-gradient(var(--g2) 1px, transparent 1px) -1px -1px / 60px 60px,
    linear-gradient(90deg, var(--g2) 1px, transparent 1px) -1px -1px / 60px 60px,
    linear-gradient(var(--g1) 1px, transparent 1px) -1px -1px / 12px 12px,
    linear-gradient(90deg, var(--g1) 1px, transparent 1px) -1px -1px / 12px 12px,
    var(--stage);
}
.board {
  position: absolute; inset: 0; display: grid;
  --gap: clamp(6px, 1.8cqmin, 16px);
  --pad: calc(var(--gap) * 1.5);
  --gi: calc(var(--gap) * 1.2);
  padding: var(--gap); gap: var(--gap);
  /* Wide: the dial leads; bands to its right; a bank of switches below. */
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr) minmax(0, 3fr) minmax(0, 6fr) minmax(0, 4fr);
  grid-template-rows: minmax(0, 3fr) minmax(0, 2fr) minmax(0, 2fr) minmax(0, 4fr);
  grid-template-areas:
    "dial dial keys keys keys"
    "dial dial fader fader fader"
    "dial dial abacus abacus abacus"
    "joy tog safe rock wheel";
}

/* ---------- plates: a hairline frame with crop marks at each corner ---------- */
.cell {
  container-type: size; position: relative; display: grid; place-items: center;
  min-width: 0; min-height: 0;
  /* The top band holds the part tag and the readout. */
  padding-top: 15px;
  --c: var(--ink); --m: 9px;
  background:
    linear-gradient(var(--c), var(--c)) 0 0 / var(--m) 1.5px, linear-gradient(var(--c), var(--c)) 0 0 / 1.5px var(--m),
    linear-gradient(var(--c), var(--c)) 100% 0 / var(--m) 1.5px, linear-gradient(var(--c), var(--c)) 100% 0 / 1.5px var(--m),
    linear-gradient(var(--c), var(--c)) 0 100% / var(--m) 1.5px, linear-gradient(var(--c), var(--c)) 0 100% / 1.5px var(--m),
    linear-gradient(var(--c), var(--c)) 100% 100% / var(--m) 1.5px, linear-gradient(var(--c), var(--c)) 100% 100% / 1.5px var(--m),
    oklch(0.24 0.06 258 / 0.7);
  background-repeat: no-repeat;
  outline: 1px solid oklch(0.85 0.05 230 / 0.2); outline-offset: -1px;
  /* The inner margin shrinks on thin panels. */
  --p: min(var(--pad), 8cqmin);
}
/* Part tag on the left, live readout on the right. */
.tag, .ro {
  position: absolute; top: 4px; font-size: 9.5px; line-height: 1; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--faint); white-space: nowrap; pointer-events: none;
}
.tag { left: 8px; font-weight: 600; }
.tag b { color: var(--ink); font-weight: 800; margin-right: 0.5em; }
.ro { right: 8px; font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.02em; color: var(--ink); }
.ro.hot { color: var(--hot); }
/* Narrow plates keep the part number and drop the name. */
@container (width < 190px) { .tag span { display: none; } }
.c-dial { grid-area: dial; }
.c-keys { grid-area: keys; }
.c-fader { grid-area: fader; }
.c-abacus { grid-area: abacus; }
.c-joy { grid-area: joy; }
.c-tog { grid-area: tog; }
.c-safe { grid-area: safe; }
.c-rock { grid-area: rock; }
.c-wheel { grid-area: wheel; }

/* A group fits its plate: one row of items, all one height. */
.grp {
  display: grid; grid-auto-flow: column; align-items: center; justify-content: center; gap: var(--gi);
  --rows: 1; --n: 1; --sr: 1;
  --h: min((100cqh - 2 * var(--p) - (var(--rows) - 1) * var(--gi)) / var(--rows), (100cqw - 2 * var(--p) - (var(--n) - 1) * var(--gi)) / var(--sr));
}
.grp > .ctl { height: var(--h); width: auto; aspect-ratio: var(--ar); }
.c-keys .grp { --n: 4; --sr: 4; }
.c-tog .grp { --n: 3; --sr: 1.3065; }
.c-safe .grp { --sr: 0.641; }
.c-rock .grp { --n: 2; --sr: 1.2308; }
.c-wheel .grp { --sr: 0.3333; }
/* The bands stretch to their plate; their tracks follow the length. */
.wide { width: calc(100cqw - 2 * var(--p)); height: calc(100cqh - 2 * var(--p)); }

/* ---------- controls ---------- */
.ctl {
  display: block; position: relative; margin: 0; padding: 0; border: 0; background: none;
  color: inherit; font: inherit; cursor: pointer; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
.ctl svg { display: block; width: 100%; height: 100%; overflow: visible; }
/* Strokes hold one pixel width at any plate size. */
.ctl svg :is(path, line, circle, rect, ellipse, polyline, polygon):not(pattern *) { vector-effect: non-scaling-stroke; }
.ctl:focus-visible, .safety .hit:focus-visible { outline: 2px solid var(--focus); outline-offset: 5px; }
.dial { --ar: 1; border-radius: 50%; cursor: grab; }
.joy { --ar: 1; border-radius: 50%; cursor: grab; }
.key { --ar: 1; border-radius: 20%; }
.toggle { --ar: 54 / 124; border-radius: 999px; }
.safety { --ar: 100 / 156; border-radius: 14px; }
.rocker { --ar: 64 / 104; border-radius: 14px; }
.wheel { --ar: 60 / 180; border-radius: 14px; cursor: grab; }
.fader, .abacus { border-radius: 10px; cursor: grab; }
.held { cursor: grabbing; }
/* The safety's buttons only carry focus; the face takes the pointer. */
.safety .hit {
  position: absolute; inset: 0; margin: 0; padding: 0; border: 0; background: none;
  border-radius: inherit; pointer-events: none;
}
.safety .arm { inset: 25.6% 34% 11.5%; border-radius: 999px; }

/* ---------- layouts by stage shape; these come last to win ---------- */
/* Squarish: the dial, safety and keys on top, both bands, then the bank. */
@container stage (aspect-ratio < 1.42) {
  .board {
    grid-template-columns: repeat(13, minmax(0, 1fr));
    grid-template-rows: minmax(0, 6fr) minmax(0, 2fr) minmax(0, 2fr) minmax(0, 4.4fr);
    grid-template-areas:
      "dial dial dial dial dial safe safe safe keys keys keys keys keys"
      "fader fader fader fader fader fader fader fader fader fader fader fader fader"
      "abacus abacus abacus abacus abacus abacus abacus abacus abacus abacus abacus abacus abacus"
      "joy joy joy tog tog tog tog rock rock rock rock wheel wheel";
  }
  .c-keys .grp { --rows: 2; --n: 2; --sr: 2; grid-auto-flow: row; grid-template-columns: repeat(2, auto); }
}
/* Tall: the dial beside the stick and safety, bands stacked, the bank last. */
@container stage (aspect-ratio < 0.95) {
  .board {
    grid-template-columns: minmax(0, 75fr) minmax(0, 66fr) minmax(0, 66fr) minmax(0, 126fr);
    grid-template-rows: minmax(0, 115fr) minmax(0, 115fr) minmax(0, 70fr) minmax(0, 52fr) minmax(0, 52fr) minmax(0, 105fr);
    grid-template-areas:
      "dial dial dial joy"
      "dial dial dial safe"
      "keys keys keys keys"
      "fader fader fader fader"
      "abacus abacus abacus abacus"
      "wheel tog tog rock";
  }
  .c-keys .grp { --rows: 1; --n: 4; --sr: 4; grid-auto-flow: column; grid-template-columns: none; }
}
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/fidget.svg)"></span><span class="intro-name">Fidget board</span><span class="intro-sub">Stimming No. 03</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--fidget" role="group" aria-label="Fidget board">
      <div class="board">
        <div class="cell c-dial"><i class="tag" aria-hidden="true"><b>01</b><span>Dial</span></i><span class="ro" data-ro="dial" aria-hidden="true"></span><div class="grp">
          <div class="ctl dial" id="dial" tabindex="0" role="slider" aria-label="Dial" aria-valuemin="0" aria-valuemax="23" aria-valuenow="0"></div>
        </div></div>
        <div class="cell c-keys"><i class="tag" aria-hidden="true"><b>02</b><span>Keys</span></i><span class="ro" data-ro="keys" aria-hidden="true"></span><div class="grp" role="group" aria-label="Keys">
          <button class="ctl key" type="button" aria-label="Key 1"></button>
          <button class="ctl key" type="button" aria-label="Key 2"></button>
          <button class="ctl key" type="button" aria-label="Key 3"></button>
          <button class="ctl key" type="button" aria-label="Latching key" aria-pressed="false"></button>
        </div></div>
        <div class="cell c-fader"><i class="tag" aria-hidden="true"><b>03</b><span>Slider</span></i><span class="ro" data-ro="fader" aria-hidden="true"></span>
          <div class="ctl fader wide" id="fader" tabindex="0" role="slider" aria-label="Slider" aria-valuemin="1" aria-valuemax="5" aria-valuenow="3"></div>
        </div>
        <div class="cell c-abacus"><i class="tag" aria-hidden="true"><b>04</b><span>Abacus</span></i><span class="ro" data-ro="abacus" aria-hidden="true"></span>
          <div class="ctl abacus wide" id="abacus" tabindex="0" role="slider" aria-label="Abacus" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"></div>
        </div>
        <div class="cell c-joy"><i class="tag" aria-hidden="true"><b>05</b><span>Stick</span></i><span class="ro" data-ro="joy" aria-hidden="true"></span><div class="grp">
          <div class="ctl joy" id="joy" tabindex="0" role="group" aria-roledescription="joystick" aria-label="Joystick"></div>
        </div></div>
        <div class="cell c-tog"><i class="tag" aria-hidden="true"><b>06</b><span>Switches</span></i><span class="ro" data-ro="tog" aria-hidden="true"></span><div class="grp" role="group" aria-label="Switches">
          <button class="ctl toggle" type="button" role="switch" aria-checked="true" aria-label="Switch 1"></button>
          <button class="ctl toggle" type="button" role="switch" aria-checked="false" aria-label="Switch 2"></button>
          <button class="ctl toggle" type="button" role="switch" aria-checked="true" aria-label="Switch 3"></button>
        </div></div>
        <div class="cell c-safe"><i class="tag" aria-hidden="true"><b>07</b><span>Safety</span></i><span class="ro" data-ro="safe" aria-hidden="true"></span><div class="grp">
          <div class="ctl safety" id="safety" role="group" aria-label="Safety switch">
            <button class="hit" type="button" aria-label="Safety cover" aria-expanded="false" aria-controls="arm"></button>
            <button class="hit arm" id="arm" type="button" role="switch" aria-label="Armed switch" aria-checked="false" aria-disabled="true"></button>
          </div>
        </div></div>
        <div class="cell c-rock"><i class="tag" aria-hidden="true"><b>08</b><span>Rockers</span></i><span class="ro" data-ro="rock" aria-hidden="true"></span><div class="grp" role="group" aria-label="Rockers">
          <button class="ctl rocker" type="button" role="switch" aria-checked="true" aria-label="Rocker 1"></button>
          <button class="ctl rocker" type="button" role="switch" aria-checked="false" aria-label="Rocker 2"></button>
        </div></div>
        <div class="cell c-wheel"><i class="tag" aria-hidden="true"><b>09</b><span>Wheel</span></i><span class="ro" data-ro="wheel" aria-hidden="true"></span><div class="grp">
          <div class="ctl wheel" id="wheel" tabindex="0" role="slider" aria-orientation="vertical" aria-label="Thumb wheel" aria-valuemin="0" aria-valuemax="19" aria-valuenow="0"></div>
        </div></div>
      </div>
    </div>
    <div class="bar bar--below">
      <div class="actions">
        <button class="chip" id="shuffle" type="button">Shuffle</button>
        <button class="chip" id="reset" type="button">Reset</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>switches and keys</dd></div>
        <div><dt><span class="fine">Drag</span><span class="touch">Drag</span></dt><dd>dials, sliders and beads</dd></div>
        <div><dt>Flick</dt><dd>the dial and the wheel</dd></div>
        <div><dt>Arm and latch</dt><dd>then a key launches</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Fidget board</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module">
import { initPage, sound, audioKit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
initPage({ id: 'fidget' });

const NS = 'http://www.w3.org/2000/svg';
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; });
const TAU = Math.PI * 2, PI = Math.PI, D2R = PI / 180, R2D = 180 / PI;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (a, n) => ((a % n) + n) % n;
const f2 = v => Math.round(v * 100) / 100;
const f3 = v => Math.round(v * 1000) / 1000;
const rnd = (a, b) => a + Math.random() * (b - a);
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > PI) d -= TAU; else if (d < -PI) d += TAU; return d; };
const KEYS = [' ', 'Enter'];

/* ---------- drawing kit: a technical drawing in three inks ---------- */
const INK = 'oklch(0.93 0.03 225)', FAINT = 'oklch(0.72 0.06 240)', HOT = 'oklch(0.76 0.17 52)';
// Paper matches the plate, so a part hides what lies behind it.
const PAPER = 'oklch(0.235 0.06 258)';
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function set(e, k, v) {
  const c = e.__c || (e.__c = {});
  if (c[k] !== v) { c[k] = v; e.setAttribute(k, v); }
}
let ids = 0;
const nid = p => `fb-${p}${++ids}`;
// Hatch tiles keep one pixel spacing at any plate size.
const tiles = new Map();
const fitTiles = new ResizeObserver(es => es.forEach(e => {
  const svg = e.target, k = svg.viewBox.baseVal.height / Math.max(1, e.contentRect.height);
  for (const t of tiles.get(svg)) {
    const g = f3(t.gap * k);
    set(t.p, 'width', g); set(t.p, 'height', g);
    set(t.l, 'x1', f3(g / 2)); set(t.l, 'x2', f3(g / 2)); set(t.l, 'y2', g);
    set(t.l, 'stroke-width', f3(t.w * k));
  }
}));
function hatchIn(svg, col, gap, w) {
  const id = nid('h'), p = el('pattern', { id, patternUnits: 'userSpaceOnUse', width: gap, height: gap, patternTransform: 'rotate(45)' }, svg.k.defs);
  const l = el('line', { x1: gap / 2, y1: 0, x2: gap / 2, y2: gap, stroke: col, 'stroke-width': w }, p);
  tiles.get(svg).push({ p, l, gap, w });
  return `url(#${id})`;
}
// Each svg gets a hot hatch and an ink hatch.
function svgIn(host, vb) {
  const svg = el('svg', { viewBox: vb, 'aria-hidden': 'true', focusable: 'false' }, host);
  svg.k = { defs: el('defs', {}, svg) };
  tiles.set(svg, []);
  svg.k.hot = hatchIn(svg, HOT, 4.5, 1.2);
  svg.k.ink = hatchIn(svg, INK, 5, 0.8);
  fitTiles.observe(svg);
  return svg;
}
// A solid part: paper hides what lies behind; ink draws the edge.
const part = (p, tag, a, w = 1.5, col = INK) => el(tag, { fill: PAPER, stroke: col, 'stroke-width': w, 'stroke-linejoin': 'round', ...a }, p);
// A hidden edge: faint and dashed, as on a drawing.
const hid = (p, tag, a) => el(tag, { fill: 'none', stroke: FAINT, 'stroke-width': 1, 'stroke-dasharray': '3 3', ...a }, p);
const line = (p, a, w = 1.5, col = INK) => el('line', { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round', ...a }, p);
// A centre mark: a small cross in faint ink.
function centre(p, x, y, r) {
  line(p, { x1: x - r, y1: y, x2: x + r, y2: y }, 1, FAINT);
  line(p, { x1: x, y1: y - r, x2: x, y2: y + r }, 1, FAINT);
}
// A hatch layer copies a shape; its opacity sets the strength.
const shade = (p, tag, a, fill) => el(tag, { ...a, fill, stroke: 'none', opacity: 0 }, p);
// A readout writes its text only when the text changes.
function readout(id) {
  const n = document.querySelector(`[data-ro="${id}"]`);
  let t = null, h = null;
  return (txt, hot = false) => {
    if (txt !== t) { t = txt; n.textContent = txt; }
    if (hot !== h) { h = hot; n.classList.toggle('hot', hot); }
  };
}
const pad = (n, k = 2) => String(n).padStart(k, '0');

/* ---------- physics loop ---------- */
// One rAF loop runs only while some body is still moving.
const live = new Set();
let raf = 0, last = 0;
function wake(b) {
  live.add(b);
  if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  // Substeps at 120 Hz keep stiff springs stable.
  const n = Math.max(1, Math.ceil(dt * 120)), h = dt / n;
  for (const b of live) {
    for (let i = 0; i < n; i++) b.step(h);
    b.draw();
    if (!b.busy()) { b.draw(); live.delete(b); }
  }
  raf = live.size ? requestAnimationFrame(frame) : 0;
  // A still board lets the audio context sleep.
  if (!raf) snd.nap();
}
const S = (x = 0) => ({ x, v: 0, t: x });
// Semi-implicit Euler: velocity first, then position.
function spring(s, k, z, h) {
  if (reduce) { s.x = s.t; s.v = 0; return; }
  s.v += (k * (s.t - s.x) - 2 * z * Math.sqrt(k) * s.v) * h;
  s.x += s.v * h;
}
// A spring close enough to its target snaps there and stops.
function rest(s, e = 1e-3) {
  if (Math.abs(s.t - s.x) > e || Math.abs(s.v) > e * 20) return false;
  s.x = s.t; s.v = 0;
  return true;
}
const bodies = [];
// Each control lists its Shuffle and Reset moves here.
const moves = [];
// An armed safety and a latched key prime the board.
// A plain key then fires the launch.
const board = {
  armed: false, latched: false, firing: false, dial: null, fire: null,
  get primed() { return this.armed && this.latched && !this.firing; },
  set(k, v) { this[k] = v; this.dial?.prime(); this.show?.(); },
};

/* ---------- sound: synthesised, started by the first gesture ---------- */
const snd = (() => {
  const MAXV = 12;
  const GO = new Set([' ', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End']);
  // The shell kit owns the context, the compressor and the noise.
  const kit = audioKit({ gain: 0.6, keys: GO, noiseSeconds: 0.5, sleepMs: 2000 });
  const ends = [], last = Object.create(null), drones = new Set();
  // Pitch wanders 4% and gain 10%, so repeats never match.
  const jit = x => 1 + (Math.random() * 2 - 1) * x;
  // Once the board is still, the context sleeps until the next gesture.
  const nap = () => kit.rest(() => !raf && !drones.size);
  // Each voice is rate limited by name, then capped at twelve.
  function claim(key, gap, dur) {
    const a = kit.live();
    if (!a) return -1;
    const now = performance.now();
    if (now - (last[key] || -1e9) < gap * 1000) return -1;
    last[key] = now;
    const t = a.currentTime;
    for (let i = ends.length - 1; i >= 0; i--) if (ends[i] <= t) ends.splice(i, 1);
    if (ends.length >= MAXV) return -1;
    ends.push(t + dur);
    nap();
    return t;
  }
  // Filtered noise with a sharp attack and an exponential tail.
  function hiss(t, type, f, q, d, g) {
    const ac = kit.ac, src = ac.createBufferSource(), flt = ac.createBiquadFilter(), amp = ac.createGain();
    src.buffer = kit.noise;
    flt.type = type; flt.frequency.value = f; flt.Q.value = q;
    amp.gain.setValueAtTime(1e-4, t);
    amp.gain.exponentialRampToValueAtTime(Math.max(g, 2e-4), t + 0.0006);
    amp.gain.exponentialRampToValueAtTime(1e-4, t + d);
    src.connect(flt); flt.connect(amp); amp.connect(kit.out);
    src.start(t, Math.random() * 0.35);
    src.stop(t + d + 0.005);
  }
  // A pitched body that bends as it decays.
  function ring(t, f, f2, d, g, type = 'sine') {
    const ac = kit.ac, o = ac.createOscillator(), amp = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2 !== f) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    amp.gain.setValueAtTime(1e-4, t);
    amp.gain.exponentialRampToValueAtTime(Math.max(g, 2e-4), t + 0.002);

  bodies.push(body);
});

/* ---------- thumb wheel ---------- */
// A ribbed drum in a slot, side on; its ribs crowd toward the edges.
// One hot rib marks the zero.
const wheelEl = document.getElementById('wheel');
bodies.push((() => {
  const svg = svgIn(wheelEl, '0 0 60 180');
  const N = 20, STEP = TAU / N, CY = 90, RR = 80;
  hid(svg, 'rect', { x: 0, y: 6, width: 60, height: 180, rx: 8 });
  part(svg, 'rect', { x: 0.5, y: 0.5, width: 59, height: 179, rx: 8 });
  part(svg, 'rect', { x: 9, y: 9, width: 42, height: 162, rx: 4 }, 1.2);
  el('line', { x1: 30, y1: 2, x2: 30, y2: 178, stroke: FAINT, 'stroke-width': 1, 'stroke-dasharray': '8 3 2 3' }, svg);
  const g = el('g', { stroke: INK, 'stroke-linecap': 'round' }, svg), ribs = [];
  for (let k = 0; k < N; k++) ribs.push(el('line', { x1: 13, x2: 47, stroke: k ? INK : HOT }, g));
  const ro = readout('wheel');
  const s = { th: 0, w: 0, a: 0, T: 0, mode: 'rest', near: 0, pid: null, y0: 0, t0: 0, k: 0, trail: [] };
  // Drag follow, rib detents, flick friction, settle spring.
  const KD = 1500, CD = 70, AD = 50, AS = 30, CF = 1.6, MU = 9, WCAP = 3, KS = 600, CS = 26;
  const body = {
    step(h) {
      if (reduce) {
        if (s.mode === 'spin') { s.mode = 'settle'; s.T = Math.round(s.th / STEP) * STEP; }
        if (s.mode !== 'rest') { s.th = s.T; s.w = 0; s.a = 0; }
      } else {
        let a = 0;
        if (s.mode === 'drag') a = KD * (s.T - s.th) - CD * s.w - AD * Math.sin(N * s.th);
        else if (s.mode === 'spin') {
          // A light drum: friction drains a flick fast.
          a = -AS * Math.sin(N * s.th) - CF * s.w - MU * Math.sign(s.w);
          if (Math.abs(s.w) < WCAP) {
            s.mode = 'settle';
            s.T = (s.w > 0 ? Math.ceil(s.th / STEP) : Math.floor(s.th / STEP)) * STEP;
          }
        } else if (s.mode === 'settle') a = KS * (s.T - s.th) - CS * s.w;
        s.a = a;
        s.w += a * h;
        s.th += s.w * h;
      }
      // Each rib that rolls past the slot edge ticks.
      const r = Math.round(s.th / STEP);
      if (r !== s.near) { s.near = r; snd.rib(clamp(Math.abs(s.w) / 20)); }
    },
    busy() {
      if (s.mode === 'drag') return Math.abs(s.w) > 1e-3 || Math.abs(s.a) > 1e-2;
      if (s.mode === 'spin') return true;
      if (s.mode === 'settle') {
        if (Math.abs(s.T - s.th) > 2e-4 || Math.abs(s.w) > 2e-3) return true;
        // At rest the angle folds back into one turn.
        const k = mod(Math.round(s.T / STEP), N);
        s.th = s.T = k * STEP; s.w = 0; s.mode = 'rest'; s.near = k;
      }
      return false;
    },
    draw() {
      for (let k = 0; k < N; k++) {
        const a = s.th + k * STEP, c = Math.cos(a), rib = ribs[k];
        if (c < 0.05) { set(rib, 'opacity', 0); continue; }
        // Ribs crowd and thin toward the drum's edges.
        const y = f2(CY + RR * Math.sin(a));
        set(rib, 'y1', y); set(rib, 'y2', y);
        set(rib, 'stroke-width', f2((k ? 0.5 : 1.2) + 1.4 * c)); set(rib, 'opacity', f2(Math.min(1, 1.6 * c)));
      }
      const T = s.mode === 'settle' || s.mode === 'rest' ? s.T : s.th;
      set(wheelEl, 'aria-valuenow', mod(-Math.round(T / STEP), N));
      ro(pad(mod(-Math.round(T / STEP), N)));
    },
  };
  wheelEl.addEventListener('pointerdown', e => {
    if (s.pid != null || e.button > 0) return;
    s.pid = e.pointerId;
    try { wheelEl.setPointerCapture(e.pointerId); } catch {}
    // The drum surface moves with the finger.
    s.k = 180 / wheelEl.getBoundingClientRect().height / RR;
    s.y0 = e.clientY; s.t0 = s.T = s.th;
    s.mode = 'drag'; s.trail = [[e.timeStamp, s.th]];
    wheelEl.classList.add('held');
    wake(body);
  });
  wheelEl.addEventListener('pointermove', e => {
    if (e.pointerId !== s.pid) return;
    s.T = s.t0 + (e.clientY - s.y0) * s.k;
    s.trail.push([e.timeStamp, s.T]);
    while (s.trail.length > 2 && e.timeStamp - s.trail[0][0] > 120) s.trail.shift();
    wake(body);
  });
  function end(e) {
    if (e.pointerId !== s.pid) return;
    s.pid = null; wheelEl.classList.remove('held');
    const t = e.timeStamp, q = s.trail.filter(p => t - p[0] < 100);
    let w = 0;
    if (q.length > 1 && t - q[q.length - 1][0] < 50) {
      const dt = (q[q.length - 1][0] - q[0][0]) / 1000;
      if (dt > 0.008) w = (q[q.length - 1][1] - q[0][1]) / dt;
    }
    if (!reduce && Math.abs(w) > 4) { s.mode = 'spin'; s.w = clamp(w, -40, 40); }
    else { s.mode = 'settle'; s.T = Math.round((reduce ? s.T : s.th) / STEP) * STEP; }
    wake(body);
  }
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => wheelEl.addEventListener(t, end));
  // Up rolls the drum away from you and counts up.
  wheelEl.addEventListener('keydown', e => {
    if (s.pid != null) return;
    const d = { ArrowUp: -1, ArrowRight: -1, ArrowDown: 1, ArrowLeft: 1, PageUp: -5, PageDown: 5 }[e.key];
    const base = s.mode === 'settle' ? s.T : Math.round(s.th / STEP) * STEP;
    if (d) { s.mode = 'settle'; s.T = base + d * STEP; }
    else if (e.key === 'Home') { s.mode = 'settle'; s.T = Math.round(s.th / TAU) * TAU; }
    else if (KEYS.includes(e.key)) {
      const dir = e.shiftKey ? 1 : -1;
      if (reduce) { s.mode = 'settle'; s.T = base + dir * STEP; }
      else { s.mode = 'spin'; s.w = clamp(s.w + dir * 16, -40, 40); }
    } else return;
    e.preventDefault();
    wake(body);
  });
  moves.push({
    el: wheelEl,
    shuffle() {
      if (s.pid != null) return;
      const dir = Math.random() < 0.5 ? -1 : 1;
      if (reduce) { s.mode = 'settle'; s.T = Math.round(s.th / STEP) * STEP + dir * Math.round(rnd(3, 9)) * STEP; }
      else { s.mode = 'spin'; s.w = dir * rnd(18, 34); }
      wake(body);
    },
    reset() {
      if (s.pid != null) return;
      s.mode = 'settle'; s.T = Math.round(s.th / TAU) * TAU;
      wake(body);
    },
  });
  return body;
})());

/* ---------- shuffle and reset ---------- */
// Each move fires in a wave from left to right across the board.
let wave = [];
// The return value is the wave's length in ms.
function sweep(kind, skip) {
  wave.forEach(clearTimeout);
  const list = moves.filter(m => m[kind] && !skip?.has(m.el)).map(m => {
    const r = m.el.getBoundingClientRect();
    return { m, at: r.left + r.width / 2 + 0.35 * (r.top + r.height / 2) };
  }).sort((a, b) => a.at - b.at);
  const gap = reduce ? 25 : 55;
  wave = list.map(({ m }, i) => setTimeout(() => m[kind](), i * gap));
  return list.length * gap;
}
document.getElementById('shuffle').addEventListener('click', () => sweep('shuffle'));
document.getElementById('reset').addEventListener('click', () => sweep('reset'));

/* ---------- launch ---------- */
// The run laps the dial, then a shuffle wave crosses the board.
// Spent, the board disarms: the switch drops, the latched key pops.
const latchEl = document.querySelector('.key[aria-pressed]');
const keep = new Set([...document.querySelectorAll('.key'), safeEl]);
const moveOf = el => moves.find(m => m.el === el);
let fuse = [];
board.fire = () => {
  board.firing = true;
  board.dial.prime(); board.show();
  snd.launch();
  board.dial.run();
  fuse.forEach(clearTimeout);
  fuse = [setTimeout(() => {
    const t = sweep('shuffle', keep);
    fuse.push(
      setTimeout(() => moveOf(safeEl).reset(), t + 250),
      setTimeout(() => { moveOf(latchEl).reset(); board.firing = false; board.dial.prime(); board.show(); }, t + 520),
    );
  }, reduce ? 0 : 440)];
};

// Hidden, the loop pauses, so any scrape stops with it.
document.addEventListener('visibilitychange', () => { if (document.hidden) snd.hush(); });

bodies.forEach(b => b.draw());
</script>
</body>
</html>
