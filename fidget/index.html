<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fidget board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Layout: header; dial over the switch strip; cluster over the spinner. */
:root {
  --well: oklch(0.12 0.01 275);
  --tick: oklch(0.4 0.018 275);
  --flash: oklch(0.88 0.14 84);
}
.defs { position: absolute; width: 0; height: 0; }
/* The board sits on the page ground: no panel, no card. */
.board {
  display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr);
  grid-template-areas: "dial cluster" "lower spin"; column-gap: clamp(32px, 7vw, 88px); row-gap: clamp(40px, 5vw, 64px);
}
.ctl {
  display: block; position: relative; margin: 0; padding: 0; border: 0; background: none;
  color: inherit; font: inherit; cursor: pointer; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
.ctl svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ctl:focus-visible { outline-offset: 6px; }
.dial { grid-area: dial; width: 100%; aspect-ratio: 1; border-radius: 50%; cursor: grab; }
.held { cursor: grabbing; }
.cluster {
  grid-area: cluster; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; align-content: space-between;
  grid-template-areas: "sw joy" "keys keys" "fader fader" "abacus abacus"; row-gap: clamp(26px, 2.8vw, 36px);
}
.switches { grid-area: sw; display: flex; gap: clamp(14px, 2.4vw, 28px); }
.toggle { width: clamp(42px, 4.6vw, 54px); aspect-ratio: 48 / 124; border-radius: 999px; }
.joy { grid-area: joy; width: clamp(118px, 13vw, 156px); aspect-ratio: 1; border-radius: 50%; cursor: grab; }
.keys { grid-area: keys; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 18px); }
.key { aspect-ratio: 1; border-radius: 22%; }
.fader { grid-area: fader; aspect-ratio: 500 / 120; border-radius: 12px; cursor: grab; }
/* The strip under the dial spans its width, edge to edge. */
.lower { grid-area: lower; align-self: start; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.rockers { display: flex; gap: clamp(10px, 1.6vw, 18px); }
.safety { flex: none; width: clamp(56px, 6vw, 76px); aspect-ratio: 80 / 136; border-radius: 19px; }
/* The safety's buttons only carry focus; the face takes the pointer. */
.safety .hit {
  position: absolute; inset: 0; margin: 0; padding: 0; border: 0; background: none;
  border-radius: inherit; pointer-events: none;
}
.safety .arm { inset: 23% 29% 7%; border-radius: 999px; }
.safety .hit:focus-visible { outline-offset: 3px; }
.rocker { width: clamp(50px, 5.6vw, 70px); aspect-ratio: 64 / 104; border-radius: 14px; }
.abacus { grid-area: abacus; aspect-ratio: 500 / 100; border-radius: 12px; cursor: grab; }
.spinner { grid-area: spin; justify-self: end; width: clamp(200px, 28vw, 340px); aspect-ratio: 1; border-radius: 50%; cursor: grab; }
.wheel { flex: none; width: clamp(42px, 4.6vw, 56px); aspect-ratio: 60 / 180; border-radius: 16px; cursor: grab; }
.pen { flex: none; width: clamp(36px, 3.8vw, 46px); aspect-ratio: 48 / 240; border-radius: 999px; }
.well { fill: var(--well); stroke: var(--line); stroke-width: 1.5; }
.tick { fill: none; stroke: var(--tick); stroke-linecap: round; }
.flash { stroke: var(--flash); stroke-linecap: round; }
.lit { stroke: var(--fg); stroke-linecap: round; }
@media (max-width: 820px) {
  .board { grid-template-columns: minmax(0, 1fr); grid-template-areas: "dial" "cluster" "lower" "spin"; }
  .dial { width: min(100%, 520px); justify-self: center; }
  .cluster, .lower { width: min(100%, 560px); justify-self: center; }
  .spinner { justify-self: center; }
}
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Fidget board</span><span class="intro-sub">Stimming No. 03</span></div></div>
</div>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

<div class="wrap">
  <header data-shell></header>
  <main class="board">
    <div class="ctl dial" id="dial" tabindex="0" role="slider" aria-label="Dial" aria-valuemin="0" aria-valuemax="23" aria-valuenow="0"></div>
    <div class="cluster">
      <div class="switches" role="group" aria-label="Switches">
        <button class="ctl toggle" type="button" role="switch" aria-checked="true" aria-label="Green switch" data-hue="150"></button>
        <button class="ctl toggle" type="button" role="switch" aria-checked="false" aria-label="Teal switch" data-hue="200"></button>
        <button class="ctl toggle" type="button" role="switch" aria-checked="true" aria-label="Blue switch" data-hue="252"></button>
      </div>
      <div class="ctl joy" id="joy" tabindex="0" role="group" aria-roledescription="joystick" aria-label="Joystick"></div>
      <div class="keys" role="group" aria-label="Keys">
        <button class="ctl key" type="button" aria-label="Key 1"></button>
        <button class="ctl key" type="button" aria-label="Key 2"></button>
        <button class="ctl key" type="button" aria-label="Key 3"></button>
        <button class="ctl key" type="button" aria-label="Latching key" aria-pressed="false"></button>
      </div>
      <div class="ctl fader" id="fader" tabindex="0" role="slider" aria-label="Slider" aria-valuemin="1" aria-valuemax="5" aria-valuenow="3"></div>
      <div class="ctl abacus" id="abacus" tabindex="0" role="slider" aria-label="Abacus" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"></div>
    </div>
    <div class="lower">
      <div class="ctl safety" id="safety" role="group" aria-label="Safety switch">
        <button class="hit" type="button" aria-label="Safety cover" aria-expanded="false" aria-controls="arm"></button>
        <button class="hit arm" id="arm" type="button" role="switch" aria-label="Armed switch" aria-checked="false" aria-disabled="true"></button>
      </div>
      <div class="rockers" role="group" aria-label="Rockers">
        <button class="ctl rocker" type="button" role="switch" aria-checked="true" aria-label="Light rocker"></button>
        <button class="ctl rocker" type="button" role="switch" aria-checked="false" aria-label="Dark rocker" data-tone="dark"></button>
      </div>
      <div class="ctl wheel" id="wheel" tabindex="0" role="slider" aria-orientation="vertical" aria-label="Thumb wheel" aria-valuemin="0" aria-valuemax="19" aria-valuenow="0"></div>
      <button class="ctl pen" id="pen" type="button" aria-label="Pen" aria-pressed="false"></button>
    </div>
    <div class="ctl spinner" id="spinner" tabindex="0" role="button" aria-label="Spinner"></div>
  </main>
  <div class="bar">
    <dl class="how" aria-label="How to play">
      <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>switches and keys</dd></div>
      <div><dt>Drag</dt><dd>dials and sliders</dd></div>
      <div><dt>Flick</dt><dd>the spinner</dd></div>
    </dl>
  </div>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Fidget board</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module">
import { initPage, sound } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
initPage({ id: 'fidget' });

const NS = 'http://www.w3.org/2000/svg';
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; });
const TAU = Math.PI * 2, PI = Math.PI, D2R = PI / 180, R2D = 180 / PI;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (a, n) => ((a % n) + n) % n;
const f2 = v => Math.round(v * 100) / 100;
const f3 = v => Math.round(v * 1000) / 1000;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > PI) d -= TAU; else if (d < -PI) d += TAU; return d; };
const KEYS = [' ', 'Enter'];

// Served locally, the home link opens the repo copy instead of the Artifact.
if (location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
  document.querySelectorAll('a[data-local]').forEach(a => { a.href = a.dataset.local; a.removeAttribute('target'); });
}

/* ---------- colour: OKLCH in, sRGB hex out ---------- */
function lin(L, C, h) {
  const a = C * Math.cos(h * D2R), b = C * Math.sin(h * D2R);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
  ];
}
const gam = x => (x = clamp(x), x <= 0.0031308 ? 12.92 * x : 1.055 * x ** (1 / 2.4) - 0.055);
function rgb([L, C, h]) {
  let c = lin(L, C, h);
  // Chroma shrinks until the colour fits sRGB.
  for (let i = 0; i < 24 && (Math.min(c[0], c[1], c[2]) < -1e-4 || Math.max(c[0], c[1], c[2]) > 1.0001); i++) c = lin(L, (C *= 0.9), h);
  return [gam(c[0]), gam(c[1]), gam(c[2])];
}
const hx = v => ((v * 255 + 0.5) | 0).toString(16).padStart(2, '0');
function css(lch, a) {
  const [r, g, b] = rgb(lch);
  return a == null ? '#' + hx(r) + hx(g) + hx(b) : `rgba(${(r * 255) | 0},${(g * 255) | 0},${(b * 255) | 0},${a})`;
}
function mixLch(A, B, t, raw) {
  // Raw palettes keep their written hue direction instead of the shortest arc.
  const dh = raw ? B[2] - A[2] : (((B[2] - A[2]) % 360) + 540) % 360 - 180;
  return [lerp(A[0], B[0], t), lerp(A[1], B[1], t), A[2] + dh * t];
}

/* ---------- svg helpers ---------- */
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function set(e, k, v) {
  const c = e.__c || (e.__c = {});
  if (c[k] !== v) { c[k] = v; e.setAttribute(k, v); }
}
const svgIn = (host, vb) => el('svg', { viewBox: vb, 'aria-hidden': 'true', focusable: 'false' }, host);

/* ---------- the shared fill recipe: base gradient, light, rim ---------- */
// Stops sit where Morphset puts them on its 128 box.
function grad(defs, id, [x, y, w, h]) {
  const g = el('linearGradient', { id: id + 'g', gradientUnits: 'userSpaceOnUse', x1: f2(x + (w * 18) / 128), y1: f2(y + (h * 14) / 128), x2: f2(x + (w * 110) / 128), y2: f2(y + (h * 114) / 128) }, defs);
  const gs = [0, 0.55, 1].map(o => el('stop', { offset: o }, g));
  const l = el('radialGradient', { id: id + 'l', gradientUnits: 'userSpaceOnUse', cx: f2(x + (w * 42) / 128), cy: f2(y + (h * 34) / 128), r: f2((Math.max(w, h) * 58) / 128) }, defs);
  const ls = [el('stop', { offset: 0, 'stop-opacity': 0.85 }, l), el('stop', { offset: 1, 'stop-opacity': 0 }, l)];
  return { g, gs, l, ls };
}
function skin(defs, parent, id, tag, attrs, box, rim = 'rim') {
  const G = grad(defs, id, box);
  const s = el(tag, { id: id + 's', ...attrs }, defs);
  const clip = el('clipPath', { id: id + 'c' }, defs);
  el('use', { href: '#' + id + 's' }, clip);
  const grp = el('g', {}, parent);
  el('use', { href: '#' + id + 's', fill: `url(#${id}g)` }, grp);
  el('use', { href: '#' + id + 's', fill: `url(#${id}l)` }, grp);
  el('use', { href: '#' + id + 's', fill: 'none', stroke: `url(#${rim})`, 'stroke-width': 3, 'clip-path': `url(#${id}c)` }, grp);
  return { ...G, s, grp };
}
// Tones are cached in 48 steps between rest and pressed.
function tone(pal, t) {
  const q = Math.round(clamp(t) * 48), c = pal.c || (pal.c = []);
  return c[q] || (c[q] = [0, 1, 2, 3].map(k => css(mixLch(pal.rest[k], pal.down[k], q / 48))));
}
function paint(G, pal, t) {
  const c = tone(pal, t);
  for (let k = 0; k < 3; k++) set(G.gs[k], 'stop-color', c[k]);
  set(G.ls[0], 'stop-color', c[3]);
  set(G.ls[1], 'stop-color', c[3]);

/* ---------- palettes: three gradient stops, then the light ---------- */
const pal = (rest, dl = 0.09) => ({ rest, down: rest.map(([L, C, h]) => [L - dl, C, h]) });
const hued = h => [[0.86, 0.12, h - 14], [0.72, 0.16, h], [0.58, 0.17, h + 16], [0.96, 0.05, h - 20]];
const CAP = pal([[0.89, 0.13, 88], [0.77, 0.16, 68], [0.64, 0.17, 48], [0.97, 0.05, 95]]);
const SKIRT = pal([[0.8, 0.14, 76], [0.67, 0.16, 58], [0.53, 0.15, 42], [0.94, 0.07, 88]]);
const PLASTIC = pal([[0.93, 0.008, 275], [0.83, 0.012, 275], [0.69, 0.018, 275], [0.99, 0.004, 275]], 0.1);
const SIDE = pal([[0.76, 0.014, 275], [0.63, 0.018, 275], [0.5, 0.022, 275], [0.88, 0.01, 275]], 0.08);
const VIOLET = pal(hued(298), 0.1);
const VIOLET_SIDE = pal([[0.68, 0.13, 290], [0.55, 0.16, 298], [0.43, 0.15, 308], [0.86, 0.06, 285]], 0.08);
const RED = pal([[0.8, 0.13, 26], [0.65, 0.2, 25], [0.51, 0.19, 20], [0.95, 0.04, 35]], 0.1);
const GRAPHITE = pal([[0.52, 0.014, 275], [0.4, 0.016, 275], [0.3, 0.018, 275], [0.68, 0.012, 275]], 0.06);
const AMBER = pal(hued(70));
const TEAL = pal(hued(190), 0.1);
const INK = pal(hued(262), 0.08);
const BEADS = [300, 268, 236, 204, 172].map(h => pal(hued(h), 0.1));

/* ---------- physics loop ---------- */
// One rAF loop runs only while some body is still moving.
const live = new Set();
let raf = 0, last = 0;
function wake(b) {
  live.add(b);
  if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  // Substeps at 120 Hz keep stiff springs stable.
  const n = Math.max(1, Math.ceil(dt * 120)), h = dt / n;
  for (const b of live) {
    for (let i = 0; i < n; i++) b.step(h);
    b.draw();
    if (!b.busy()) { b.draw(); live.delete(b); }
  }
  raf = live.size ? requestAnimationFrame(frame) : 0;
}
const S = (x = 0) => ({ x, v: 0, t: x });
// Semi-implicit Euler: velocity first, then position.
function spring(s, k, z, h) {
  if (reduce) { s.x = s.t; s.v = 0; return; }
  s.v += (k * (s.t - s.x) - 2 * z * Math.sqrt(k) * s.v) * h;
  s.x += s.v * h;
}
// A spring close enough to its target snaps there and stops.
function rest(s, e = 1e-3) {
  if (Math.abs(s.t - s.x) > e || Math.abs(s.v) > e * 20) return false;
  s.x = s.t; s.v = 0;
  return true;
}
const bodies = [];

/* ---------- sound: synthesised, started by the first gesture ---------- */
const snd = (() => {
  const MAXV = 12, GO = /^( |Enter|Arrow\w+|Page\w+|Home|End)$/;
  let ac = null, out = null, noise = null, askedAt = -1e9, napT = 0;
  const ends = [], last = Object.create(null), drones = new Set();
  // Pitch wanders 4% and gain 10%, so repeats never match.
  const jit = x => 1 + (Math.random() * 2 - 1) * x;
  function audio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { ac = new AC(); } catch (err) { return; }
      // The compressor keeps stacked clicks from clipping.
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 5;
      comp.attack.value = 0.002; comp.release.value = 0.12;
      out = ac.createGain();
      out.gain.value = 0.6;
      out.connect(comp);
      comp.connect(ac.destination);
      // Half a second of white noise feeds every transient.
      noise = ac.createBuffer(1, ac.sampleRate >> 1, ac.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state !== 'running') { askedAt = performance.now(); ac.resume()?.catch(() => {}); }
  }
  function unlock(e) {
    if (!sound.on || (e.type === 'keydown' && !GO.test(e.key))) return;
    // A touch counts as a gesture only once the finger lifts.
    if (!ac && e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
    audio();
  }
  // Touchend is the gesture iOS needs.
  ['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));
  // A context still waking queues sounds for a moment.
  function live() {
    if (!sound.on || !ac || ac.state === 'closed') return null;
    return ac.state === 'running' || performance.now() - askedAt < 250 ? ac : null;
  }
  // Once the board is still, the context sleeps until the next gesture.
  function nap() {
    clearTimeout(napT);
    napT = setTimeout(() => {
      if (raf || drones.size) nap();
      else if (ac && ac.state === 'running') ac.suspend()?.catch(() => {});
    }, 2000);
  }
  // Each voice is rate limited by name, then capped at twelve.
  function claim(key, gap, dur) {
    const a = live();
    if (!a) return -1;
    const now = performance.now();
    if (now - (last[key] || -1e9) < gap * 1000) return -1;
    last[key] = now;
    const t = a.currentTime;
    for (let i = ends.length - 1; i >= 0; i--) if (ends[i] <= t) ends.splice(i, 1);
    if (ends.length >= MAXV) return -1;
    ends.push(t + dur);
    nap();
    return t;
  }
  // Filtered noise with a sharp attack and an exponential tail.
  function hiss(t, type, f, q, d, g) {
    const src = ac.createBufferSource(), flt = ac.createBiquadFilter(), amp = ac.createGain();
    src.buffer = noise;
    flt.type = type; flt.frequency.value = f; flt.Q.value = q;
    amp.gain.setValueAtTime(1e-4, t);
    amp.gain.exponentialRampToValueAtTime(Math.max(g, 2e-4), t + 0.0006);
    amp.gain.exponentialRampToValueAtTime(1e-4, t + d);
    src.connect(flt); flt.connect(amp); amp.connect(out);
    src.start(t, Math.random() * 0.35);
    src.stop(t + d + 0.005);
  }
  // A pitched body that bends as it decays.
  function ring(t, f, f2, d, g, type = 'sine') {
    const o = ac.createOscillator(), amp = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2 !== f) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    amp.gain.setValueAtTime(1e-4, t);
    amp.gain.exponentialRampToValueAtTime(Math.max(g, 2e-4), t + 0.002);
    amp.gain.exponentialRampToValueAtTime(1e-4, t + d);
    o.connect(amp); amp.connect(out);
    o.start(t); o.stop(t + d + 0.01);
    return o;
  }
  // Busy moments soften each voice; the compressor catches the rest.
  function play(key, gap, dur, fn) {
    const t = claim(key, gap, dur);
    if (t >= 0) fn(t, jit(0.04), jit(0.1) / (1 + 0.06 * ends.length));
  }
  // A looping noise bed whose level and colour follow motion.
  function drone(q, pulse) {
    let src = null, flt = null, amp = null, lfo = null;
    const d = {
      set(g, f, rate = 0) {
        const a = g > 0.002 ? live() : null;
        if (!a) { if (src) d.stop(); return; }
        const t = a.currentTime;
        if (!src) {
          src = a.createBufferSource(); src.buffer = noise; src.loop = true;
          flt = a.createBiquadFilter(); flt.type = 'bandpass'; flt.Q.value = q; flt.frequency.value = f;
          amp = a.createGain(); amp.gain.value = 0;
          src.connect(flt); flt.connect(amp);
          if (pulse) {
            // Each passing arm swells the whir.
            const trem = a.createGain(), depth = a.createGain();
            trem.gain.value = 0.6; depth.gain.value = 0.4;
            lfo = a.createOscillator(); lfo.frequency.value = rate;
            lfo.connect(depth); depth.connect(trem.gain);
            amp.connect(trem); trem.connect(out);
            lfo.start(t);
          } else amp.connect(out);
          src.start(t, Math.random() * 0.35);
          drones.add(d);
        }
        amp.gain.setTargetAtTime(g, t, 0.04);
        flt.frequency.setTargetAtTime(f, t, 0.04);
        if (lfo) lfo.frequency.setTargetAtTime(rate, t, 0.05);
      },
      stop() {
        if (!src) return;
        const t = ac.currentTime;
        amp.gain.setTargetAtTime(0, t, 0.03);
        src.stop(t + 0.2);

    release();
  });
  penEl.addEventListener('blur', () => { if (s.kb) { s.kb = false; release(); } });
  penEl.addEventListener('click', e => {
    if (e.detail !== 0 || s.kb || s.pid != null || performance.now() - s.keyAt < 300) return;
    press();
    setTimeout(release, 140);
  });
  return body;
})());

// Hidden, the loop pauses, so any hum stops with it.
document.addEventListener('visibilitychange', () => { if (document.hidden) snd.hush(); });

bodies.forEach(b => b.draw());
</script>
</body>
