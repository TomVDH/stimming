<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fidget board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Fidget board: five controls straight on the stage, no panels.
   The controls are lit from the top left; the JS draws their shading. */
:root { --stage: oklch(0.15 0.012 275); }
/* The gap resolves to pixels on the board, so cells inherit one size. */
@property --gap { syntax: "<length>"; inherits: true; initial-value: 8px; }

/* ---------- the board: the big dial leads, the cluster sits to its right ---------- */
.stage--fidget { container: stage / size; }
.board {
  position: absolute; inset: 0; display: grid;
  --gap: clamp(6px, 1.8cqmin, 16px);
  --pad: calc(var(--gap) * 1.5);
  --gi: calc(var(--gap) * 1.6);
  /* The top row clears the corner chips; the bottom row clears the key strip too. */
  --edge: clamp(12px, 4cqmin, 48px);
  padding: max(var(--edge), calc(var(--chip, 26px) + 22px)) var(--edge) max(var(--edge), calc(var(--chip, 26px) + 56px)); column-gap: clamp(16px, 5cqw, 72px); row-gap: var(--gap);
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.57fr) minmax(0, 0.43fr);
  grid-template-rows: minmax(0, 3fr) minmax(0, 2.2fr) minmax(0, 1.4fr);
  grid-template-areas:
    "dial tog joy"
    "dial keys keys"
    "dial fader fader";
}
/* A narrow stage stacks the dial over the cluster. */
@container stage (aspect-ratio < 1.15) {
  .board {
    column-gap: var(--gap);
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 4fr) minmax(0, 2.2fr) minmax(0, 1.6fr) minmax(0, 1.1fr);
    grid-template-areas:
      "dial dial"
      "tog joy"
      "keys keys"
      "fader fader";
  }
}

/* ---------- cells: one part each, sized by the cell ---------- */
.cell {
  container-type: size; position: relative; display: grid; place-items: center;
  min-width: 0; min-height: 0;
  /* The inner margin shrinks on thin cells. */
  --p: min(var(--pad), 8cqmin);
}
.s-dial { grid-area: dial; }
.s-tog { grid-area: tog; }
.s-joy { grid-area: joy; }
.s-keys { grid-area: keys; }
.s-fader { grid-area: fader; }

/* A group fits its cell: one row of items, all one height. */
.grp {
  display: grid; grid-auto-flow: column; align-items: center; justify-content: center; gap: var(--gi);
  --rows: 1; --n: 1; --sr: 1;
  --h: min((100cqh - 2 * var(--p) - (var(--rows) - 1) * var(--gi)) / var(--rows), (100cqw - 2 * var(--p) - (var(--n) - 1) * var(--gi)) / var(--sr));
}
.grp > .ctl { height: var(--h); width: auto; aspect-ratio: var(--ar); }
/* Each part sets its item count and summed aspect for the fit. */
.p-keys .grp { --n: 4; --sr: 4; }
.p-tog .grp { --n: 3; --sr: 1.3065; }
/* The slider stretches to its cell; its track follows the length. */
.wide { width: calc(100cqw - 2 * var(--p)); height: calc(100cqh - 2 * var(--p)); }

/* ---------- controls ---------- */
.ctl {
  display: block; position: relative; margin: 0; padding: 0; border: 0; background: none;
  color: inherit; font: inherit; cursor: pointer; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
.ctl svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ctl:focus-visible { outline: 2px solid var(--focus); outline-offset: 5px; }
.dial { --ar: 1; border-radius: 50%; cursor: grab; }
.joy { --ar: 1; border-radius: 50%; cursor: grab; }
.key { --ar: 1; border-radius: 20%; }
.toggle { --ar: 54 / 124; border-radius: 999px; }
.fader { border-radius: 10px; cursor: grab; }
.held { cursor: grabbing; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/fidget.svg)"></span><span class="intro-name">Fidget board</span><span class="intro-sub">Stimming No. 03</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--fidget" role="group" aria-label="Fidget board">
      <div class="board" id="board"></div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Fidget board</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module">
import { initPage } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import { snd, reduce, board } from './kit.js';
import PARTS from './parts/index.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
// The sweeps bind once the parts have mounted.
// The stick's nub is the Shuffle button; S is its key.
const act = { shuffle() {}, reset() {} };
initPage({ id: 'fidget', bar: {
  actions: [{ verb: 'reset', key: 'R', onPress: () => act.reset() }],
  keys: [['click', 'flip and press'], ['drag', 'turn, slide, flick'], ['click stick', 'shuffle'], ['s', 'shuffle']],
} });
// S follows the shell's key rules: no modifiers, no text fields, no sheets.
document.addEventListener('keydown', e => {
  if (e.key.toLowerCase() !== 's' || e.metaKey || e.ctrlKey || e.altKey || e.repeat || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable], .s2-sheet')) return;
  e.preventDefault();
  act.shuffle();
});

/* ---------- the board: one cell per part ---------- */
// The registry in parts/ holds every part; the board mounts these five.
// Add a part here and give its cell a grid area to grow the board.
const BOARD = ['dial', 'tog', 'joy', 'keys', 'fader'];
const boardEl = document.getElementById('board');
const byId = new Map(PARTS.map(p => [p.id, p]));
const mounted = [];
// Modules load one at a time; a small local server drops bursts.
for (const id of BOARD) {
  const part = (await byId.get(id).load()).default;
  const cell = document.createElement('div');
  cell.className = `cell s-${id} p-${id}`;
  boardEl.append(cell);
  // A part's own styles load once, with the part.
  if (part.css) {
    const st = document.createElement('style');
    st.textContent = part.css;
    document.head.append(st);
  }
  const inst = part.mount(cell);
  inst.bodies.forEach(b => b.draw());
  mounted.push(inst);
}
const allMoves = () => mounted.flatMap(m => m.moves);

/* ---------- shuffle and reset ---------- */
// Reset runs in a wave from left to right across the board.
// Shuffle runs outward from the stick.
let wave = [];
const centre = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
function sweep(kind, from) {
  wave.forEach(clearTimeout);
  const o = from && centre(from);
  const list = allMoves().filter(m => m[kind]).map(m => {
    const [x, y] = centre(m.el);
    return { m, at: o ? Math.hypot(x - o[0], y - o[1]) : x + 0.35 * y };
  }).sort((a, b) => a.at - b.at);
  const gap = reduce ? 25 : 55;
  wave = list.map(({ m }, i) => setTimeout(() => m[kind](), i * gap));
}
const stick = document.getElementById('joy');
act.shuffle = () => sweep('shuffle', stick);
act.reset = () => sweep('reset');
board.shuffle = act.shuffle;

// Hidden, the loop pauses, so any scrape stops with it.
document.addEventListener('visibilitychange', () => { if (document.hidden) snd.hush(); });
</script>
</body>
</html>
