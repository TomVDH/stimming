<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fidget board</title>
<!-- share: tools/ogtags.mjs writes this block -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Stimming">
<meta property="og:title" content="Fidget board">
<meta property="og:description" content="Your hands were busy anyway">
<meta property="og:url" content="https://tomvdh.github.io/stimming/fidget/">
<meta property="og:image" content="https://tomvdh.github.io/stimming/shared/cards/fidget.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Fidget board: the Stimming share card">
<meta name="twitter:card" content="summary_large_image">
<!-- /share -->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./kit.js">
<link rel="modulepreload" href="./parts/index.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm">
<style>
/* Fidget board: five controls straight on the stage, no panels.
   The controls are lit from the top left; the JS draws their shading. */
:root { --stage: oklch(0.15 0.012 275); }
/* The gap resolves to pixels on the board, so cells inherit one size. */
@property --gap { syntax: "<length>"; inherits: true; initial-value: 8px; }

/* ---------- the board: the big dial leads, the cluster sits to its right ---------- */
.stage--fidget { container: stage / size; }
.board {
  position: absolute; inset: 0; display: grid;
  --gap: clamp(6px, 1.8cqmin, 16px);
  --pad: calc(var(--gap) * 1.5);
  --gi: calc(var(--gap) * 1.6);
  /* The page script sets the bar's two strips on the stage. */
  /* The fallback is one row of Bar v3, before it mounts. */
  --edge: clamp(12px, 4cqmin, 48px);
  padding: max(var(--edge), calc(var(--cover-top, 56px) + 10px)) var(--edge) max(var(--edge), calc(var(--cover-bottom, 56px) + 10px)); column-gap: clamp(16px, 5cqw, 72px); row-gap: var(--gap);
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.57fr) minmax(0, 0.43fr);
  grid-template-rows: minmax(0, 3fr) minmax(0, 2.2fr) minmax(0, 1.4fr);
  grid-template-areas:
    "dial tog joy"
    "dial keys keys"
    "dial fader fader";
}
/* A narrow stage stacks the dial over the cluster. */
@container stage (aspect-ratio < 1.15) {
  .board {
    column-gap: var(--gap);
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 4fr) minmax(0, 2.2fr) minmax(0, 1.6fr) minmax(0, 1.1fr);
    grid-template-areas:
      "dial dial"
      "tog joy"
      "keys keys"
      "fader fader";
  }
}

/* ---------- cells: one part each, sized by the cell ---------- */
.cell {
  container-type: size; position: relative; display: grid; place-items: center;
  min-width: 0; min-height: 0;
  /* The inner margin shrinks on thin cells. */
  --p: min(var(--pad), 8cqmin);
}
.s-dial { grid-area: dial; }
.s-tog { grid-area: tog; }
.s-joy { grid-area: joy; }
.s-keys { grid-area: keys; }
.s-fader { grid-area: fader; }

/* A group fits its cell: one row of items, all one height. */
.grp {
  display: grid; grid-auto-flow: column; align-items: center; justify-content: center; gap: var(--gi);
  --rows: 1; --n: 1; --sr: 1;
  --h: min((100cqh - 2 * var(--p) - (var(--rows) - 1) * var(--gi)) / var(--rows), (100cqw - 2 * var(--p) - (var(--n) - 1) * var(--gi)) / var(--sr));
}
.grp > .ctl { height: var(--h); width: auto; aspect-ratio: var(--ar); }
/* Each part sets its item count and summed aspect for the fit. */
.p-keys .grp { --n: 4; --sr: 4; }
.p-tog .grp { --n: 3; --sr: 1.3065; }
/* The slider stretches to its cell; its track follows the length. */
.wide { width: calc(100cqw - 2 * var(--p)); height: calc(100cqh - 2 * var(--p)); }

/* ---------- controls ---------- */
.ctl {
  display: block; position: relative; margin: 0; padding: 0; border: 0; background: none;
  color: inherit; font: inherit; cursor: pointer; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
.ctl svg { display: block; width: 100%; height: 100%; overflow: visible; }
.dial { --ar: 1; border-radius: 50%; cursor: grab; }
.joy { --ar: 1; border-radius: 50%; cursor: grab; }
.key { --ar: 1; border-radius: 20%; }
.toggle { --ar: 54 / 124; border-radius: 999px; }
.fader { border-radius: 10px; cursor: grab; }
.held { cursor: grabbing; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/fidget.svg)"></span><span class="intro-name">Fidget board</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--fidget" role="group" aria-label="A board with a dial, three switches, a joystick, four keys and a slider. Drag the dial to turn it. Click a switch to flip it. Drag the joystick to move the light. Click the joystick to shuffle the board. Click a key to press it. Drag the slider to move it. Press Tab to select a control. Press the arrow keys to move it. Press Space to press it. Press S to shuffle the board. Press R to reset the toy.">
      <div class="board" id="board"></div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Fidget board</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module">
import { initPage, stage, pageReady } from '../shared/stim.js';
stage('libs');
import { intro as playIntro } from '../shared/intro.js';
import { snd, reduce, board } from './kit.js';
import PARTS from './parts/index.js';
// The intro holds for the page, the font and the board.
playIntro({ ready: pageReady() });
// The sweeps bind once the parts have mounted.
// A click on the joystick shuffles the board; S is its key.
const act = { shuffle() {}, reset() {} };
const ui = initPage({ id: 'fidget', bar: {
  // Reset sits in Settings; the toy binds its R key.
  reset: () => act.reset(),
  keys: [['drag', 'turn the dial'], ['click', 'flip a switch'], ['click joystick', 'shuffle the board'], ['s', 'shuffle the board']],
  // Bar v3 lists every input in How to play: one instruction per row.
  help: [['drag', 'Turn the dial'], ['drag fast', 'Spin the dial'], ['click', 'Flip a switch'], ['drag', 'Flip a switch'],
    ['drag', 'Move the joystick'], ['click joystick', 'Shuffle the board'], ['click', 'Press a key'], ['click', 'Lock the mint key'],
    ['drag', 'Move the slider'], ['click', 'Move the slider to a notch'],
    ['tab', 'Select the next control'], ['S', 'Shuffle the board'], ['R', 'Reset the toy']],
} });
// S and R follow the shell's key rules: no modifiers, no text fields, no sheets.
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((k !== 's' && k !== 'r') || e.metaKey || e.ctrlKey || e.altKey || e.repeat || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable], .s2-sheet')) return;
  e.preventDefault();
  if (k === 's') act.shuffle(); else act.reset();
});

/* ---------- keep clear of the bar ---------- */
// The board's padding reads the two strips from the stage.
const stageEl = document.querySelector('.stage--fidget');
function keepClear() {
  const c = ui.cover();
  // Bar v3 mounts late; until then the CSS fallback holds.
  if (!c.rects.length) {
    stageEl.style.removeProperty('--cover-top');
    stageEl.style.removeProperty('--cover-bottom');
    return;
  }
  stageEl.style.setProperty('--cover-top', `${Math.ceil(c.top)}px`);
  stageEl.style.setProperty('--cover-bottom', `${Math.ceil(c.bottom)}px`);
}
keepClear();
ui.onCover(keepClear);

/* ---------- the board: one cell per part ---------- */
// The registry in parts/ holds every part; the board mounts these five.
// Add a part here and give its cell a grid area to grow the board.
const BOARD = ['dial', 'tog', 'joy', 'keys', 'fader'];
const boardEl = document.getElementById('board');
const byId = new Map(PARTS.map(p => [p.id, p]));
const mounted = [];
stage('build');
// Modules load one at a time; a small local server drops bursts.
for (const id of BOARD) {
  const part = (await byId.get(id).load()).default;
  const cell = document.createElement('div');
  cell.className = `cell s-${id} p-${id}`;
  boardEl.append(cell);
  // A part's own styles load once, with the part.
  if (part.css) {
    const st = document.createElement('style');
    st.textContent = part.css;
    document.head.append(st);
  }
  const inst = part.mount(cell);
  inst.bodies.forEach(b => b.draw());
  mounted.push(inst);
}
stage('first-frame');
const allMoves = () => mounted.flatMap(m => m.moves);

/* ---------- shuffle and reset ---------- */
// Reset runs in a wave from left to right across the board.
// Shuffle runs outward from the stick.
let wave = [];
const centre = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
function sweep(kind, from) {
  wave.forEach(clearTimeout);
  const o = from && centre(from);
  const list = allMoves().filter(m => m[kind]).map(m => {
    const [x, y] = centre(m.el);
    return { m, at: o ? Math.hypot(x - o[0], y - o[1]) : x + 0.35 * y };
  }).sort((a, b) => a.at - b.at);
  const gap = reduce ? 25 : 55;
  wave = list.map(({ m }, i) => setTimeout(() => m[kind](), i * gap));
}
const stick = document.getElementById('joy');
act.shuffle = () => sweep('shuffle', stick);
act.reset = () => sweep('reset');
board.shuffle = act.shuffle;

// Hidden, the loop pauses, so any scrape stops with it.
document.addEventListener('visibilitychange', () => { if (document.hidden) snd.hush(); });
</script>
</body>
</html>
