<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>East Van</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
html, body { margin: 0; height: 100%; background: oklch(0.14 0.02 280); overflow: hidden; }
body { font: 500 13px/1 "Gabarito", system-ui, sans-serif; color: oklch(0.92 0.01 280); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.top { position: fixed; left: 14px; top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; gap: 10px; align-items: center; }
.name { font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; color: inherit; text-decoration: none; }
.name:hover, .name:focus-visible { opacity: 1; }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: oklch(0.18 0.02 280 / 0.72); backdrop-filter: blur(8px); }
.seg button { font: inherit; font-weight: 600; color: inherit; background: none; border: 0; border-radius: 999px; padding: 9px 13px; min-height: 34px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: oklch(0.93 0.02 90); color: oklch(0.2 0.03 280); }
.seg button:focus-visible { outline: 2px solid oklch(0.85 0.12 85); outline-offset: 1px; }
.foot {
  position: fixed; left: 14px; right: 14px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: space-between; gap: 12px; pointer-events: none; opacity: 0.78;
  text-shadow: 0 1px 6px oklch(0.1 0.02 280 / 0.7);
}
.read { font-variant-numeric: tabular-nums; white-space: nowrap; }
.credit { position: fixed; right: 14px; top: calc(16px + env(safe-area-inset-top, 0px)); max-width: 46vw; text-align: right; font-size: 11px; line-height: 1.3; color: inherit; opacity: 0.6; }
.credit:hover, .credit:focus-visible { opacity: 1; }
[hidden] { display: none !important; }
.keys kbd { font: inherit; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: oklch(0.2 0.02 280 / 0.7); margin-left: 8px; }
@media (max-width: 640px) {
  .keys { display: none; }
  .top .name { display: none; }
  .seg button { padding: 9px 8px; font-size: 12px; }
  /* On a phone the credit sits above the readout, clear of the buttons. */
  .credit { top: auto; bottom: calc(34px + env(safe-area-inset-bottom, 0px)); left: 14px; right: 14px; max-width: none; text-align: left; }
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
</head>
<body>
<canvas id="c" aria-label="East Van house lot"></canvas>
<div class="top">
  <a class="name" href="../index.html?lab" aria-label="Back to the Lab">East Van</a>
  <div class="seg" id="stops" role="group" aria-label="Place"></div>
</div>
<a class="credit" id="credit" href="https://opendata.vancouver.ca/pages/licence/" target="_blank" rel="noopener" hidden>Contains information licensed under the Open Government Licence – Vancouver</a>
<div class="foot">
  <span class="read" id="read"></span>
  <span class="keys"><kbd>CLICK</kbd> poke <kbd>DRAG</kbd> turn <kbd>SCROLL</kbd> zoom <kbd>1–5</kbd> place <kbd>S</kbd> solo</span>
</div>
<script type="module">
// East Van: the Toy-town house lot. town.js builds it; lens.js draws it.
// This page owns the camera, the pointer and the frame loop.
import * as THREE from 'three';
import { gsap } from 'gsap';
import { pixelRatio, whenVisible, css, reduced, idle } from '../shared/stim.js';
import { buildTown, buildStage, buildModule } from './town.js';
import { wireY } from './lot.js';
import * as house from './modules/house.js';
import * as yard from './modules/yard.js';
import * as lane from './modules/lane.js';
import * as run from './modules/run.js';
import * as drive from './modules/drive.js';
import { houseLife, laneLife, runLife, buildCrow } from './life.js';
import { layWalk, near, stopWorld } from './walk.js';
import { createLens } from './lens.js';

const canvas = document.getElementById('c'), read = document.getElementById('read');
const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ---------- sky: a dusk gradient behind the plinth ---------- */
const SKY = [[0, [0.9, 0.08, 75]], [0.3, [0.84, 0.1, 48]], [0.42, [0.68, 0.11, -5]], [0.55, [0.5, 0.1, -55]], [0.75, [0.36, 0.08, -95]], [1, [0.28, 0.07, -100]]];
function skyAt(v) {
  let i = 1;
  while (i < SKY.length - 1 && SKY[i][0] < v) i++;
  const [v0, a] = SKY[i - 1], [v1, b] = SKY[i], t = clamp((v - v0) / (v1 - v0), 0, 1);
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
}
function skyTexture(v0, v1) {
  const cv = document.createElement('canvas');
  cv.width = 4; cv.height = 512;
  const g = cv.getContext('2d'), grad = g.createLinearGradient(0, 512, 0, 0);
  for (let i = 0; i <= 24; i++) grad.addColorStop(i / 24, css(skyAt(lerp(v0, v1, i / 24))));
  g.fillStyle = grad; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ---------- scene, lens, camera ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const sky = skyTexture(0.2, 0.8), lens = createLens(renderer);
const cam = new THREE.PerspectiveCamera(22, 1, 5, 160);
const still = () => reduced();

/* ---------- the walk: modules in order, built when the camera comes near ---------- */
// Each entry: the module file, its life, and its label on the place buttons.
const WALK = [[house, houseLife, 'House'], [yard, null, 'Yard'], [lane, laneLife, 'Lane'], [run, runLife, 'Run'], [drive, null, 'Drive']];
const PLACED = layWalk(WALK.map(([m]) => m), [0, house.ORIGIN[2]]);
const STOPS = WALK.map(([m], i) => stopWorld(m.STOP, PLACED[i]));
const stage = buildStage(sky), built = [], building = [];
// The crow flies from the street wire at the house to the lane wire.
const laneTop = lane.WIRES[1], awayX = 1.5, awayLocal = [awayX, wireY(laneTop, awayX), laneTop.a[2]];
const awayWorld = new THREE.Vector3(...awayLocal).add(new THREE.Vector3(...PLACED[2].offset));
const crow = buildCrow(stage.scene, house.CROW.home, awayWorld.toArray());
// Builds a module once. A second call waits on the first.
function build(i) {
  if (built[i]) return Promise.resolve(built[i]);
  return (building[i] ||= Promise.resolve().then(async () => {
    // A module with load() reads its parts on the first visit.
    const [m, life] = WALK[i], data = m.load ? { ...m, ...(await m.load()) } : m, mod = buildModule(data, PLACED[i], life);
    stage.scene.add(mod.group);
    built[i] = mod;
    return mod;
  }));
}

/* ---------- the Corner: the disc round Commercial and East 4th ---------- */
// It is a place of its own, outside the walk. It loads on the first visit.
const CORNER = { at: [0, 4, 0], yaw: -Math.PI / 2 + 0.38, pitch: 0.72, w: 130, tall: 122, h: 78, band: 24, range: 64 };
let corner = null, inCorner = false;

/* ---------- camera state ---------- */
const view = { yaw: 0.5, pitch: 0.3, zoom: 1, ty: 0.5, tp: 0.3, tz: 1, fit: 50, zmax: 1.9 };
const TARGET = new THREE.Vector3(0, 2.6, 0), goal = new THREE.Vector3(0, 2.6, 0);
let cur = 0, stop = STOPS[0], solo = false, gliding = null, wantGo = 0;
function fitFor(st) {
  const w = Math.max(2, canvas.clientWidth || innerWidth), h = Math.max(2, canvas.clientHeight || innerHeight), t = Math.tan(cam.fov * Math.PI / 360);
  return Math.max(st.h / (2 * t), (w < h ? st.tall : st.w) / (2 * t * (w / h)));
}
function refit() { if (stop) view.fit = fitFor(stop); boundsZoom(); }
// The bounds of every built module, in the world.
const bounds = { c: new THREE.Vector3(), w: 14, d: 14 };
function boundsZoom() {
  const ps = built.map((m, i) => m && PLACED[i]).filter(Boolean);
  if (!ps.length || inCorner) { view.zmax = 1.9; return; }
  const x0 = Math.min(...ps.map(p => p.centre[0] - p.size[0] / 2)), x1 = Math.max(...ps.map(p => p.centre[0] + p.size[0] / 2));
  const z0 = Math.min(...ps.map(p => p.centre[2] - p.size[1] / 2)), z1 = Math.max(...ps.map(p => p.centre[2] + p.size[1] / 2));
  bounds.c.set((x0 + x1) / 2, 2, (z0 + z1) / 2); bounds.w = x1 - x0; bounds.d = z1 - z0;
  // Scrolled fully out, the frame holds the whole built walk.
  const span = Math.hypot(bounds.w, bounds.d) + 4;
  view.zmax = Math.max(1.9, fitFor({ w: span * 0.8, tall: span * 0.8, h: span * 0.55 }) / view.fit);
}
// The shadow box covers the active set.
function fitSunTo(idx) {
  const ps = idx.map(i => PLACED[i]);
  const x0 = Math.min(...ps.map(p => p.centre[0] - p.size[0] / 2)), x1 = Math.max(...ps.map(p => p.centre[0] + p.size[0] / 2));
  const z0 = Math.min(...ps.map(p => p.centre[2] - p.size[1] / 2)), z1 = Math.max(...ps.map(p => p.centre[2] + p.size[1] / 2));
  const half = Math.max(x1 - x0, z1 - z0) / 2 + 2;
  stage.fitSun(new THREE.Vector3((x0 + x1) / 2, 2, (z0 + z1) / 2), [half, half]);
}
// Only the module in view and its neighbours move, cast shadows and take pokes.
function activate(i) {
  const set = near(i, WALK.length);
  built.forEach((m, j) => m && m.setActive(set.includes(j)));
  for (const [j, m] of built.entries()) if (m) m.group.visible = !solo || j === i;
  fitSunTo(set);
  // The Drive module is built from city data: its licence asks for this credit.
  document.getElementById('credit').hidden = !set.some(j => WALK[j][0].ID === 'drive');
}
function setButtons() {
  for (const b of document.getElementById('stops').children) b.setAttribute('aria-pressed', String(inCorner ? b.dataset.v === 'corner' : +b.dataset.v === cur));
}
function aimAt(st, snap) {
  stop = st;
  const fit = fitFor(st);
  lens.uniforms.lens.uBand.value = st.band; lens.uniforms.lens.uRange.value = st.range;
  // Turn the short way round to the stop's side.
  const yaw = view.ty + Math.atan2(Math.sin(st.yaw - view.ty), Math.cos(st.yaw - view.ty)), pitch = st.pitch ?? 0.3;
  gliding?.kill(); gliding = null;
  if (snap || still()) {
    goal.set(...st.at); TARGET.copy(goal); view.ty = view.yaw = yaw; view.tp = view.pitch = pitch; view.fit = fit; view.tz = view.zoom = 1;
  } else {
    // The glide moves the target, the turn and the framing together.
    const g = { x: TARGET.x, y: TARGET.y, z: TARGET.z, yaw: view.yaw, pitch: view.pitch, fit: view.fit, zoom: view.zoom };
    gliding = gsap.to(g, {
      x: st.at[0], y: st.at[1], z: st.at[2], yaw, pitch, fit, zoom: 1, duration: 1.1, ease: 'power2.inOut',
      onUpdate() { goal.set(g.x, g.y, g.z); TARGET.copy(goal); view.ty = view.yaw = g.yaw; view.tp = view.pitch = g.pitch; view.fit = g.fit; view.tz = view.zoom = g.zoom; wake(); },
      onComplete() { gliding = null; },
    });
  }
  boundsZoom();
  wake();
}
// Goes to module i of the walk: builds it and its neighbours first.
async function goTo(i, { snap = false } = {}) {
  i = Math.max(0, Math.min(WALK.length - 1, i));
  const ticket = ++wantGo;
  await Promise.all(near(i, WALK.length).map(build));
  // A later key press wins.
  if (ticket !== wantGo) return;
  inCorner = false; cur = i;
  activate(i);
  setButtons();
  aimAt(STOPS[i], snap);
  // The next modules along build in idle time.
  for (const j of [i + 2, i - 2]) if (j >= 0 && j < WALK.length && !built[j]) idle().then(() => build(j).then(() => { activate(cur); boundsZoom(); }));
}
async function goCorner() {
  const ticket = ++wantGo;
  corner ||= await buildTown(sky, [await (await import('./drive.js')).loadDrive()]);
  if (ticket !== wantGo) return;
  inCorner = true;
  // The Corner is built from city data: its licence asks for this credit.
  document.getElementById('credit').hidden = false;
  setButtons();
  aimAt(CORNER, true);
}
function toggleSolo() {
  solo = !solo;
  if (!inCorner) activate(cur);
  wake();
}

/* ---------- place buttons ---------- */
const stopsEl = document.getElementById('stops');
stopsEl.innerHTML = WALK.map(([, , label], i) => `<button type="button" data-v="${i}">${label}</button>`).join('') + '<button type="button" data-v="corner">Corner</button>';
stopsEl.addEventListener('click', e => { const b = e.target.closest('button'); if (b) (b.dataset.v === 'corner' ? goCorner() : goTo(+b.dataset.v)); });

function resize() {
  const w = Math.max(2, canvas.clientWidth || innerWidth), h = Math.max(2, canvas.clientHeight || innerHeight);
  renderer.setPixelRatio(pixelRatio(w, h, { maxDpr: 2 }));
  renderer.setSize(w, h, false);
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  lens.resize(size.x, size.y, renderer.getPixelRatio());
  cam.aspect = w / h;
  refit();
}
const look = new THREE.Vector3();
function aim() {
  if (!gliding) {
    view.yaw = lerp(view.yaw, view.ty, 0.18); view.pitch = lerp(view.pitch, view.tp, 0.18); view.zoom = lerp(view.zoom, view.tz, 0.18);
    TARGET.lerp(goal, 0.1);
  }
  // Past the stop's own framing, the view drifts to the middle of the walk.
  const out = inCorner ? 0 : clamp((view.zoom - 1) / Math.max(0.01, view.zmax - 1), 0, 1);
  look.copy(TARGET).lerp(bounds.c, out * out);
  const d = view.fit * view.zoom, cp = Math.cos(view.pitch);
  cam.position.set(look.x + Math.sin(view.yaw) * cp * d, look.y + Math.sin(view.pitch) * d, look.z + Math.cos(view.yaw) * cp * d);
  cam.lookAt(look);
  const span = (stop ? stop.w * 0.9 : 24) + out * (bounds.w + bounds.d);
  cam.near = Math.max(3, d - span - 20); cam.far = d + span + 40;
  cam.updateProjectionMatrix();
  cam.updateMatrixWorld();
  return d;
}

/* ---------- pokes: the nearest target under the pointer ---------- */
// Every built module's pokes, and the crow's. Each knows its module.
function pokeList() {
  if (inCorner) return corner ? corner.pokes.map(q => ({ q, i: -1 })) : [];
  const list = built[0] && built[0].group.visible ? [{ q: crow.poke, i: -1 }] : [];
  built.forEach((m, i) => { if (m && m.group.visible) for (const q of m.pokes) list.push({ q, i }); });
  return list;
}
const v = new THREE.Vector3();
function pokeAt(x, y) {
  const r = canvas.getBoundingClientRect();
  let best = null, bestD = Infinity;
  for (const it of pokeList()) {
    v.copy(it.q.pos).applyMatrix4(cam.matrixWorldInverse);
    if (v.z > -0.1) continue;
    const reach = it.q.r * r.height / (2 * Math.tan(cam.fov * Math.PI / 360) * -v.z);
    v.applyMatrix4(cam.projectionMatrix);
    const d = Math.hypot((v.x * 0.5 + 0.5) * r.width - (x - r.left), (0.5 - v.y * 0.5) * r.height - (y - r.top));
    if (d < Math.max(reach, 18) * 1.25 && d < bestD) { best = it; bestD = d; }
  }
  return best;
}
// A poke on a module far from the view travels there instead of firing.
function press(it) {
  if (it.i >= 0 && !built[it.i].active) goTo(it.i);
  else it.q.fire();
}
let drag = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t: performance.now(), moved: false };
  wake();
});
canvas.addEventListener('pointermove', e => {
  wake();
  if (!drag) { if (e.pointerType === 'mouse') canvas.style.cursor = pokeAt(e.clientX, e.clientY) ? 'pointer' : 'grab'; return; }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 6) drag.moved = true;
  if (!drag.moved || gliding) return;
  view.ty -= dx * 0.006;
  view.tp = clamp(view.tp + dy * 0.005, 0.06, 0.95);
});
canvas.addEventListener('pointerup', e => {
  if (drag && !drag.moved && performance.now() - drag.t < 500) { const it = pokeAt(e.clientX, e.clientY); if (it) press(it); }
  drag = null;
});
canvas.addEventListener('pointercancel', () => { drag = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); if (gliding) return; view.tz = clamp(view.tz * Math.exp(e.deltaY * 0.0012), 0.45, view.zmax); wake(); }, { passive: false });
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = +e.key;
  if (e.key >= '1' && e.key <= '9' && n <= WALK.length) goTo(n - 1);
  else if (e.key === '0') goCorner();
  else if (e.key === 'ArrowRight') goTo(inCorner ? WALK.length - 1 : cur + 1);
  else if (e.key === 'ArrowLeft') goTo(inCorner ? WALK.length - 1 : cur - 1);
  else if (e.key.toLowerCase() === 's') toggleSolo();
});

/* ---------- frame loop ---------- */
let raf = 0, visible = true, lastInput = performance.now(), last = 0, fps = 60, readAt = 0;
function frame(now) {
  raf = 0;
  // A wake can stamp a time just after this frame's, so dt keeps a floor.
  const dt = Math.min(0.1, Math.max(1 / 240, (now - last) / 1000 || 0.016));
  last = now;
  fps = lerp(fps, 1 / dt, 0.08);
  const d = aim();
  if (inCorner && corner) {
    corner.update(now / 1000, dt);
    lens.render(corner.scene, cam, d, corner.noInk);
  } else if (built.some(Boolean)) {
    for (const m of built) m?.update(now / 1000, dt);
    // The crow lives on the house's wire, so it shows with the house.
    crow.visible(!!built[0] && built[0].group.visible);
    crow.update(now / 1000);
    lens.render(stage.scene, cam, d, built.flatMap(m => (m ? m.noInk : [])));
  }
  if (now - readAt > 300) {
    readAt = now;
    read.textContent = `${Math.round(fps)} fps · ${renderer.info.render.calls} calls · ${(renderer.info.render.triangles / 1000).toFixed(1)}k tris`;
  }
  // The loop sleeps 60 s after the last input.
  if (visible && now - lastInput < 60000) raf = requestAnimationFrame(frame);
}
function wake() {
  lastInput = performance.now();
  if (!raf && visible) { last = lastInput; raf = requestAnimationFrame(frame); }
}
whenVisible(canvas, on => { visible = on; if (on) wake(); });
// The pane can open at zero size, so the canvas itself reports its size.
new ResizeObserver(() => { resize(); wake(); }).observe(canvas);
resize();
// With ?dev the walk's state is open to the console.
if (new URLSearchParams(location.search).has('dev')) window.eastvan = { built, PLACED, STOPS, goTo, pokeList };
// ?at=corner opens the Corner; ?at=2 opens module 2, counted from 1.
const at = new URLSearchParams(location.search).get('at');
if (at === 'corner' || at === 'drive') goCorner(); else goTo(Math.max(0, (+at || 1) - 1), { snap: true });
</script>
</body>
</html>
