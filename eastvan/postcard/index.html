<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>East Van postcards</title>
<!-- share: tools/ogtags.mjs writes this block -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Stimming">
<meta property="og:title" content="East Van postcards">
<meta property="og:description" content="Wish you were here, bring an umbrella">
<meta property="og:url" content="https://tomvdh.github.io/stimming/eastvan/postcard/">
<meta property="og:image" content="https://tomvdh.github.io/stimming/shared/cards/postcard.jpg?v=f81297ea">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="East Van postcards: the Stimming share card">
<meta name="twitter:card" content="summary_large_image">
<!-- /share -->
<link rel="stylesheet" href="../../shared/stim.css">
<link rel="stylesheet" href="../../shared/intro.css">
<style>
:root { --stage: oklch(0.1 0.01 275); }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; opacity: 0; transition: opacity 0.35s ease; }
.stage canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">East Van postcards</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage" id="stage" tabindex="0" role="application" aria-label="Postcards of East Vancouver. Press 1 to 9 to pick a postcard. Press the left arrow to show the last postcard. Press the right arrow to show the next postcard.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">East Van postcards</h1></section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage } from '../../shared/stim.js';
import { intro as playIntro } from '../../shared/intro.js';
import { start } from './kit.js';
import * as lot from './scenes/lot.js';
import * as drive from './scenes/drive.js';
import * as alley from './scenes/alley.js';
import * as cut from './scenes/cut.js';
import * as store from './scenes/store.js';
import * as port from './scenes/port.js';
import * as lake from './scenes/lake.js';
import * as station from './scenes/station.js';
import * as coaster from './scenes/coaster.js';
import * as pool from './scenes/pool.js';
import * as snow from './scenes/snow.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
// The kit marks the canvas "on" after its first drawn frame.
const firstFrame = new Promise(r => {
  const mo = new MutationObserver(() => { if (document.querySelector('#stage canvas.on')) { mo.disconnect(); r(); } });
  mo.observe(document.getElementById('stage'), { subtree: true, attributes: true, attributeFilter: ['class'] });
});
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ id: 'postcard', ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });

const MODS = [lot, drive, alley, cut, store, port, lake, station, coaster, pool, snow];
// The kit lists the cards in this same order.
const CARDS = MODS.flatMap(m => m.cards);
const stage = document.getElementById('stage');
// The address hash names the card, from 1.
let at = Math.min(CARDS.length, Math.max(1, parseInt(location.hash.slice(1), 10) || 1)) - 1;
let kit = null;
// The shell builds every control from this one spec.
// Each option's label is the card's caption.
const ui = initPage({ id: 'postcard', home: '../../index.html', silent: true, bar: {
  choice: { label: 'Postcard', value: String(at + 1), options: CARDS.map((c, i) => ({
    value: String(i + 1), label: c.cap, key: i < 9 ? String(i + 1) : undefined,
  })), onPick: v => pick(+v - 1) },
  keys: [['1-9', 'pick a postcard'], ['← →', 'step through the postcards']],
  // Bar v3 lists every input in How to play: one instruction per row.
  help: [['1-9', 'Pick a postcard'], ['←', 'Show the last postcard'], ['→', 'Show the next postcard']],
} });
try {
  kit = start(stage, MODS);
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  // Without WebGL 2 the controls take no input.
  ui.choice.disabled = true;
  throw err;
}
function pick(i) {
  if (!kit || !kit.cards[i]) return;
  kit.pick(i);
  at = i;
  ui.choice.set(String(i + 1));
  history.replaceState(null, '', '#' + (i + 1));
}
// The arrows step and wrap; the shell holds them while a sheet is open.
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented || !kit) return;
  const n = kit.cards.length;
  if (e.key === 'ArrowRight') pick((at + 1) % n);
  else if (e.key === 'ArrowLeft') pick((at + n - 1) % n);
});
pick(at);
</script>
</body>
</html>
