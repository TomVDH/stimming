<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>East Van postcards: realistic</title>
<meta name="robots" content="noindex">
<style>
@font-face { font-family: "Iosevka Term Slab"; font-weight: 500; font-display: swap; src: url(../../../shared/fonts/IosevkaTermSlab-Medium.woff2) format("woff2"); }
html, body { height: 100%; margin: 0; background: oklch(0.16 0.012 275); color: oklch(0.84 0.012 275); }
.card {
  position: fixed; inset: 0; box-sizing: border-box; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 6px;
  padding: clamp(10px, 2.4vmin, 28px) clamp(10px, 2.4vmin, 28px) clamp(4px, 1vmin, 12px);
}
.stage { position: relative; overflow: hidden; border-radius: 5px; background: oklch(0.1 0.01 275); }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; opacity: 0; transition: opacity 0.35s ease; }
.stage canvas.on { opacity: 1; }
.fail { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; }
.fail[hidden] { display: none; }
.foot {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 12px; min-height: 34px;
  font: 500 12px/16px "Iosevka Term Slab", ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase;
}
.tools { display: flex; align-items: center; gap: 10px; position: relative; z-index: 2; background: oklch(0.16 0.012 275); }
.picks { display: flex; gap: 2px; }
.picks button { all: unset; display: grid; place-items: center; width: 30px; height: 34px; cursor: pointer; color: oklch(0.6 0.012 275); }
.picks button[aria-pressed="true"] { color: oklch(0.96 0.02 90); box-shadow: inset 0 -2px 0 currentColor; }
.picks button:focus-visible { outline: 2px solid oklch(0.8 0.1 250); outline-offset: -2px; }
.flip { all: unset; display: grid; place-items: center; height: 34px; padding: 0 8px; cursor: pointer; color: oklch(0.6 0.012 275); }
.flip[aria-pressed="true"] { color: oklch(0.96 0.02 90); box-shadow: inset 0 -2px 0 currentColor; }
.flip:focus-visible { outline: 2px solid oklch(0.8 0.1 250); outline-offset: -2px; }
/* The block-out page lies over this one; it takes no clicks. */
.blockout { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
.blockout[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
</style>
</head>
<body>
<div class="card">
  <div class="stage" id="stage" role="img" aria-label="Realistic postcards of East Vancouver.">
    <p class="fail" hidden>This page needs WebGL 2.</p>
  </div>
  <div class="foot">
    <span id="cap"></span>
    <div class="tools">
      <div class="picks" role="group" aria-label="Scene"></div>
      <button class="flip" type="button" aria-pressed="false">B · Block-out</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { start } from './rkit.js';
import * as lot from './lot.js';

const stage = document.getElementById('stage'), cap = document.getElementById('cap'), flip = document.querySelector('.flip'), picks = document.querySelector('.picks');
let page, frame = null, now = 0;
try {
  page = start(stage, [lot], {
    onScene(i, card) {
      now = i; cap.textContent = card.cap;
      for (const b of picks.children) b.setAttribute('aria-pressed', String(+b.dataset.card === i));
      // The block-out page follows the scene.
      if (frame) frame.src = '../index.html#' + card.blockout;
    },
  });
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  throw err;
}
page.cards.forEach((c, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.card = i; b.textContent = i + 1; b.setAttribute('aria-pressed', 'false');
  picks.append(b);
});
function pick(i) {
  if (!page.cards[i]) return;
  page.pick(i);
  history.replaceState(null, '', '#' + (i + 1));
}
// B lays the block-out card over this page, on the same lens.
function toggle() {
  if (!frame) {
    frame = document.createElement('iframe');
    frame.className = 'blockout'; frame.src = '../index.html#' + page.cards[now].blockout; frame.tabIndex = -1; frame.title = 'Block-out postcard'; frame.hidden = true;
    document.body.append(frame);
  }
  frame.hidden = !frame.hidden;
  flip.setAttribute('aria-pressed', String(!frame.hidden));
  flip.textContent = frame.hidden ? 'B · Block-out' : 'B · Realistic';
}
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'b' || e.key === 'B') toggle();
  else if (e.key >= '1' && e.key <= '9') pick(+e.key - 1);
});
flip.addEventListener('click', toggle);
picks.addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick(+b.dataset.card); });
pick(Math.min(page.cards.length, Math.max(1, parseInt(location.hash.slice(1), 10) || 1)) - 1);
</script>
</body>
</html>
