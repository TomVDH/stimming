<!doctype html>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}/* The how-to line is as quiet as the home link. */

<style>
/* Layout: header row, the stage at full width, one chip row. */
:root {
  --bg: oklch(0.16 0.012 275);
  --surface: oklch(0.195 0.014 275);
  --line: oklch(0.29 0.016 275);
  --fg: oklch(0.94 0.008 275);
  --muted: oklch(0.64 0.02 275);
  --focus: oklch(0.84 0.13 205);
  --pick: oklch(0.7 0.18 320 / 0.35);
  --space: oklch(0.15 0.035 285);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
::selection { background: var(--pick); }

.wrap { max-width: 1160px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: clamp(20px, 3.4vw, 40px); }

.home { font-size: 14px; color: var(--muted); text-decoration: none; border-radius: 4px; transition: color 0.2s ease; }
.home:hover { color: var(--fg); }
/* The sound toggle sits as quietly as the home link. */
.snd {
  display: grid; place-items: center; width: 28px; height: 28px; margin-block: -4px; padding: 0;
  color: var(--muted); background: none; border: 0; border-radius: 6px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: color 0.2s ease;

  position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: max(320px, calc(100svh - 176px));

}
.stage canvas.on { opacity: 1; }

  position: absolute; inset: 0; margin: 0; padding: 16px; display: grid; place-items: center; text-align: center;
  font-size: 14px; color: oklch(0.64 0.02 275);
}

  display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; cursor: pointer;
  font: inherit; font-size: 13px; color: var(--muted);
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  -webkit-tap-highlight-color: transparent;

<body>

<div class="wrap">
  <header>
    <h1>Orbits</h1>
    <div class="tools">
      <button class="snd" id="snd" type="button" aria-label="Sound" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 8h2.6l3.9-3.2v10.4L5.6 12H3z"/>
          <path class="on" d="M12.8 8.1a3 3 0 0 1 0 3.8M15.1 6.1a6 6 0 0 1 0 7.8"/>
          <path class="off" d="M13.2 8l4 4M17.2 8l-4 4"/>
        </svg>
      </button>
      <a class="home" href="../index.html">Stimming</a>
    </div>
  </header>
  <main>
    <div class="stage" id="stage" tabindex="0" role="application" aria-label="A singing solar system around a glowing sun. Drag and release to fling a planet into orbit, or tap the sun to pulse it. Space launches a random planet, Enter pulses the sun, C clears.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Orbits needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="foot">
      <div class="ctl">
        <button class="chip" id="seed" type="button">Seed</button>
        <button class="chip" id="clear" type="button" aria-keyshortcuts="C">Clear</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag and release</dt><dd>launch a planet</dd></div>
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span> the sun</dt><dd>pulse</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>random planet</dd></div>
        <div class="fine"><dt><kbd>C</kbd></dt><dd>clear</dd></div>
      </dl>
    </div>
  </main>
</div>

<script type="module">
const panel = document.getElementById('stage'), canvas = panel.querySelector('canvas');
const seedB = document.getElementById('seed'), clearB = document.getElementById('clear');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; wake(); });
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const wrapA = a => a - TAU * Math.floor((a + Math.PI) / TAU);
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));
const nextFrame = () => new Promise(r => requestAnimationFrame(r));

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
function lin(L, C, h) {
  const a = C * Math.cos(h * D2R), b = C * Math.sin(h * D2R);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,

}
// Chroma shrinks until the colour fits sRGB.
function linear(L, C, h) {
  let c = lin(L, C, h);
  for (let i = 0; i < 24 && (Math.min(...c) < -1e-4 || Math.max(...c) > 1.0001); i++) c = lin(L, (C *= 0.9), h);
  return c.map(v => clamp(v));
}
// Ruby, citrine, emerald, aquamarine, sapphire, amethyst, tourmaline, topaz, peridot, tanzanite.
const JEWELS = [[0.64, 0.22, 20], [0.85, 0.16, 90], [0.74, 0.19, 155], [0.8, 0.13, 210], [0.62, 0.2, 260], [0.65, 0.21, 305], [0.72, 0.2, 352], [0.75, 0.17, 50], [0.86, 0.19, 128], [0.6, 0.19, 283]];
let bag = [];
// A shuffled bag keeps neighbouring launches in different colours.
function jewel() {
  if (!bag.length) bag = JEWELS.map((_, i) => i).sort(() => Math.random() - 0.5);
  return JEWELS[bag.pop()].slice();
}

/* ---------- sound: synthesised, started by the first gesture ---------- */
const SKEY = 'stimming.orbits.sound', MAXV = 28, LEAD = 0.03;
let soundOn = true;
try { soundOn = localStorage.getItem(SKEY) !== '0'; } catch (err) { /* storage is optional */ }
let ac = null, out = null, mix = null, noise = null, drone = null, askedAt = -1e9, voices = 0, restT = 0;
let tokens = 5, tokenAt = 0;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.05 * voices);
// D major pentatonic: inner orbits take the higher degrees.
const PENTA = [0, 2, 4, 7, 9], ROOT = 146.83, NDEG = 16;
const freq = d => ROOT * 2 ** ((12 * Math.floor(d / 5) + PENTA[((d % 5) + 5) % 5]) / 12);
// The sun hums an open fifth whose root walks D, B, G, A.
const ROOTS = [146.83, 123.47, 98, 110];
let rootI = 0;

function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (err) { return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;
    out = ac.createGain();
    out.gain.value = 0.55;
    out.connect(comp);
    comp.connect(ac.destination);

    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    mix = ac.createGain();
    const verb = ac.createConvolver(), send = ac.createGain();

    send.gain.value = 0.45;

    mix.connect(send).connect(verb).connect(out);

  }

  if (!visible()) { ac.suspend()?.catch(() => {}); return; }
  if (ac.state !== 'running') { askedAt = performance.now(); ac.resume()?.catch(() => {}); }
}
// A context still waking queues sounds for a moment.
function live() {
  if (!soundOn || !ac || ac.state === 'closed') return null;
  return ac.state === 'running' || performance.now() - askedAt < 250 ? ac : null;
}
function track(src, ...tails) {
  voices++;
  src.onended = () => { voices--; tails.forEach(n => n.disconnect()); };
}
// Once the stage empties, the context sleeps until the next gesture.
function rest() {
  clearTimeout(restT);
  if (!ac || ac.state !== 'running') return;
  restT = setTimeout(() => {
    if (!raf && ac.state === 'running') ac.suspend()?.catch(() => {});
  }, 4000);
}
const GESTURE_KEYS = new Set([' ', 'Enter', 'c', 'C']);
function unlock(e) {
  if (!soundOn || (e.type === 'keydown' && !GESTURE_KEYS.has(e.key))) return;
  // A touch counts as a gesture only once the finger lifts.
  if (!ac && e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
  audio();
}
// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// A stereo hall: decaying noise whose highs fade first.
function hall(dur) {
  const sr = ac.sampleRate, n = Math.round(sr * dur), b = ac.createBuffer(2, n, sr);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    let lp = 0;
    for (let i = 0; i < n; i++) {
      const t = i / sr;
      lp += (Math.random() * 2 - 1 - lp) * (0.12 + 0.8 * Math.exp(-t / 0.5));
      d[i] = lp * Math.exp(-t / 0.62) * Math.min(1, t / 0.015);

  return b;
}
function makeDrone() {
  const g = ac.createGain(), lp = ac.createBiquadFilter();
  g.gain.value = 0;
  lp.type = 'lowpass';
  lp.frequency.value = 560;
  lp.Q.value = 0.4;
  g.connect(lp).connect(mix);
  const os = [[0.5, 'sine', 0.4], [1, 'sine', 0.5], [1.5, 'sine', 0.26], [2.003, 'triangle', 0.16]].map(([r, type, v]) => {
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = type;
    o.frequency.value = ROOTS[rootI] * r;
    og.gain.value = v;
    o.connect(og).connect(g);
    o.start();
    return [o, r];

  const lfo = ac.createOscillator(), lg = ac.createGain();
  lfo.frequency.value = 0.07;
  lg.gain.value = 180;
  lfo.connect(lg).connect(lp.frequency);
  lfo.start();
  drone = { g, os };
}
// The hum grows with the number of planets.
function droneLevel(n) {
  if (!drone) return;
  drone.g.gain.setTargetAtTime(n < 2 ? 0 : 0.075 * Math.min(1, (n - 1) / 5), ac.currentTime, 1.6);
}
// The root glides to its next step.
function droneStep() {
  rootI = (rootI + 1) % ROOTS.length;
  if (drone) for (const [o, r] of drone.os) o.frequency.setTargetAtTime(ROOTS[rootI] * r, ac.currentTime, 1.4);
}

// Each voice pans with its place on the stage.
function bus(a, x) {
  const p = a.createStereoPanner ? a.createStereoPanner() : a.createGain();
  if (p.pan) p.pan.value = clamp(x, -1, 1) * 0.7;
  p.connect(mix);
  return p;
}
// A soft bell: small bodies ring glassy, big ones round and long.
function bell(a, dst, t, f, g, size, tails) {
  const glass = clamp(1 - (size - 0.014) / 0.034);
  const tau = clamp(1.5 * (330 / f) ** 0.35, 0.55, 2.6) * (1.2 - 0.35 * glass);
  const parts = [[1, 1, 1], [2, 0.26 + 0.2 * glass, 0.42], [3.01, 0.07 + 0.1 * glass, 0.24], [4.17, 0.04 + 0.12 * glass, 0.15]];
  if (glass < 0.5 && f > 150) parts.push([0.5, 0.3 * (1 - 2 * glass), 1.25]);
  let long = null, end = 0;
  for (const [r, v, k] of parts) {
    if (f * r > 9000) continue;
    const o = a.createOscillator(), og = a.createGain(), stop = t + 0.02 + tau * k * 6;
    o.frequency.value = f * r * jit(0.0015);
    og.gain.setValueAtTime(0, t);
    og.gain.linearRampToValueAtTime(v * g, t + 0.006);
    og.gain.setTargetAtTime(0, t + 0.006, tau * k);
    o.connect(og).connect(dst);
    o.start(t);
    o.stop(stop);
    tails.push(og);
    if (stop > end) { end = stop; long = o; }
  }
  return long;
}
function chime(f, size, x, at = 0, amp = 1) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD + Math.max(0, at), d = bus(a, x), tails = [d];
  const src = bell(a, d, t, f * jit(0.003), 0.07 * amp * level() * (330 / f) ** 0.22 * jit(0.06), size, tails);

// A bucket refills four orbit chimes a second, so crowds thin out.
function take() {
  const a = live();
  if (!a) return false;
  tokens = Math.min(5, tokens + (a.currentTime - tokenAt) * 4);
  tokenAt = a.currentTime;
  if (tokens < 1) return false;
  tokens--;
  return true;
}
function burst(a, dst, t, type, f0, f1, q, g, rise, tau, len) {
  const src = a.createBufferSource(), fl = a.createBiquadFilter(), ng = a.createGain();

  src.loop = true;

  fl.frequency.exponentialRampToValueAtTime(f1, t + len);
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(g, t + rise);
  ng.gain.setTargetAtTime(0, t + rise, tau);
  src.connect(fl).connect(ng).connect(dst);
  src.onended = () => { fl.disconnect(); ng.disconnect(); };

  const o = a.createOscillator(), og = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + glide);
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(g, t + rise);
  og.gain.setTargetAtTime(0, t + rise, tau);
  o.connect(og).connect(dst);
  o.start(t);
  o.stop(t + rise + tau * 7);
  tails.push(og);
  return o;
}
// A conjunction: a strummed chord over a slow, warm swell.
function chord(fs, x) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD, d = bus(a, x), tails = [d], g = (0.03 * level()) / Math.sqrt(fs.length);
  let src = null;
  for (const f of fs) {
    for (const det of [0.997, 1.003]) {
      const o = a.createOscillator(), og = a.createGain(), lp = a.createBiquadFilter();

      o.frequency.value = f * det;
      lp.type = 'lowpass';
      lp.frequency.value = Math.min(5000, f * 2.5);
      og.gain.setValueAtTime(0, t);
      og.gain.linearRampToValueAtTime(g, t + 0.45);
      og.gain.setTargetAtTime(0, t + 0.6, 0.85);
      o.connect(lp).connect(og).connect(d);
      o.start(t);
      o.stop(t + 6.6);
      tails.push(lp, og);
      src = src || o;
    }

  fs.forEach((f, i) => chime(f, 0.03, x, 0.045 * i, 0.5));

// A merger: a soft low thump, a sparkle and both notes at once.
function mergeSound(f1, f2, f3, size, x) {
  const a = live();
  if (!a || voices >= MAXV) return;

  track(o, ...tails);

  chime(f2, size, x, 0.025, 0.6);

// Swallowed: a falling whoosh, the note sinking and the sun's low swell.
function swallowSound(f, x) {
  const a = live();
  if (!a || voices >= MAXV) return;

// Escaping: the note drifts down and fades into the dark.

  const a = live();
  if (!a || voices >= MAXV) return;

// The sun's pulse: a deep soft boom with a breath of air.
function pulseSound() {
  const a = live();
  if (!a || voices >= MAXV) return;

  track(o, ...tails);
}
// A launch: a short airy swish that rises with speed.
function launchSound(speed, x) {
  const a = live();

  if (!lowDpr && ++frames > 30) {
    slow = raw > 0.024 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 40) { lowDpr = true; fit(); }
  }
  // Reduced motion runs the system at under half speed.
  update(dt * (reduce ? 0.45 : 1));
  for (const g of ptrs.values()) {
    g.grow = Math.min(1, g.grow + dt / 0.3);
    predict(g);
  }
  draw();
  showClear();
  if (busy()) raf = requestAnimationFrame(frame);
  else rest();
}
// Off screen or hidden, the system pauses and goes quiet.
function sync() {
  if (visible()) {
    wake();
    if (soundOn && ac && ac.state !== 'running' && bodies.length) audio();
  } else {
    cancelAnimationFrame(raf);
    raf = 0;
    if (ac && ac.state === 'running') ac.suspend()?.catch(() => {});
  }
}

/* ---------- input ---------- */
addEventListener('scroll', () => { rect = null; }, { passive: true });
function local(e) {
  const r = rect || (rect = panel.getBoundingClientRect());
  return [(e.clientX - r.left - SW / 2) / U, -(e.clientY - r.top - SH / 2) / U];
}
panel.addEventListener('pointerdown', e => {
  if (!ready || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const [x, y] = local(e);
  // The sun takes taps; anywhere else starts a launch.
  if (Math.hypot(x, y) < Math.max(SUN_R * 1.7, 24 / U)) return pulse();
  if (ptrs.size >= 4) return;
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  const size = pickSize(nearHost(x, y)), col = jewel();
  ptrs.set(e.pointerId, {
    x, y, px: x, py: y, size, col, ring: size > 0.035 && Math.random() < 0.5 ? [rand(0.3, 0.42), rand(-0.6, 0.6)] : null,
    rgb: linear(...col), trail: linear(Math.min(0.9, col[0] + 0.05), col[1], col[2]), grow: 0, n: 0, pts: null, end: 0, seed: Math.random(),
  });
  tick(x / HW);
  wake();
});
panel.addEventListener('pointermove', e => {
  const g = ptrs.get(e.pointerId);
  if (g) [g.px, g.py] = local(e);
});
panel.addEventListener('pointerup', e => {
  const g = ptrs.get(e.pointerId);
  if (!g) return;
  ptrs.delete(e.pointerId);
  [g.px, g.py] = local(e);
  fling(g);
});
['pointercancel', 'lostpointercapture'].forEach(t => panel.addEventListener(t, e => ptrs.delete(e.pointerId)));
panel.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const k = e.key;
  if (k === ' ' || k === 'Enter') {
    // Buttons and links keep Space and Enter for themselves.
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (e.repeat) return;
    if (k === ' ') randomPlanet();
    else pulse();
  } else if ((k === 'c' || k === 'C') && !e.repeat) clearAll();
});
seedB.addEventListener('click', () => seed());
clearB.addEventListener('click', () => { if (clearB.getAttribute('aria-disabled') !== 'true') clearAll(); });
const sndB = document.getElementById('snd');
const showSound = () => sndB.setAttribute('aria-pressed', String(soundOn));
showSound();
sndB.addEventListener('click', () => {
  soundOn = !soundOn;
  showSound();
  try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (err) { /* storage is optional */ }
  if (soundOn) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});

/* ---------- start: shaders link while the system runs ahead ---------- */
function failed() {
  ready = false;
  cancelAnimationFrame(raf);
  raf = 0;
  canvas.hidden = true;
  panel.querySelector('.fail').hidden = false;
  seedB.setAttribute('aria-disabled', 'true');
  clearB.setAttribute('aria-disabled', 'true');
}
canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  ready = false;
  cancelAnimationFrame(raf);
  raf = 0;
});
canvas.addEventListener('webglcontextrestored', async () => {
  try {
    scene = null;
    await initGL();
    slotLo.fill(0);
    slotHi.fill(CAP - 1);
    allocScene();
    ready = true;
    draw();
    wake();
  } catch (err) { console.error(err); failed(); }
});
async function boot() {
  await idle();
  fit();
  if (!SW) {
    SW = 1160;
    SH = 652;
    U = SH / 2;
    HW = SW / 2 / U;
    canvas.width = SW;
    canvas.height = SH;
  }
  const gate = initGL();
  gate.catch(() => {});
  await idle();
  // Sixteen seconds have already run, so the rosettes have begun.
  seed(true);
  for (let i = 0; i < 960; i++) update(1 / 60);
  try { await gate; } catch (err) { console.error(err); failed(); return; }
  slotLo.fill(0);
  slotHi.fill(CAP - 1);
  allocScene();
  ready = true;
  new ResizeObserver(fit).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; sync(); }).observe(panel);
  document.addEventListener('visibilitychange', sync);
  draw();
  wake();
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
</body>
