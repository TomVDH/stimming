  const plastic = new THREE.MeshStandardMaterial({ color: new THREE.Color(...oklin(0.76, 0.12, 352)), roughness: 0.3, metalness: 0 });
  ringGroup = new THREE.Group();
  const scaled = new THREE.Group();
  scaled.add(new THREE.Mesh(new THREE.TorusGeometry(1, 0.075, 12, 72), plastic));
  const ha = -0.9, handle = new THREE.Mesh(new THREE.CapsuleGeometry(0.085, 1.6, 4, 10), plastic);
  handle.position.set(Math.cos(ha) * 1.92, Math.sin(ha) * 1.92, 0);
  handle.rotation.z = ha - Math.PI / 2;
  scaled.add(handle);
  ringGroup.add(scaled);
  top.add(ringGroup);

  panel.prepend(canvas);
  fitRenderer(renderer, panel, 1.5, (w, h) => {
    sizeAir(w, h);
    camera.left = 0; camera.right = w; camera.top = h; camera.bottom = 0;
    camera.updateProjectionMatrix();
    const bw = canvas.width, bh = canvas.height;
    sceneRT.setSize(bw, bh);
    bgRT.setSize(bw, bh);
    filmU.uRes.value.set(bw, bh);
    filmU.uView.value.set(w, h);
    scaled.scale.setScalar(R0);
    paintBack();
    if (ready) { draw(); wake(); }
  }, 1.4e6);
  wand.x = rest.x;
  wand.y = rest.y;
  resetForm();
  shape(1);
  // Async compile keeps shader builds off the main thread.
  renderer.setRenderTarget(sceneRT);
  const c1 = renderer.compileAsync(scene, camera);
  renderer.setRenderTarget(null);
  await Promise.all([c1, renderer.compileAsync(top, camera), renderer.compileAsync(post, quadCam)]);
  ready = true;
  draw();
  requestAnimationFrame(() => canvas.classList.add('on'));
  // On arrival the resting wand breathes out one short stream.
  if (!reduce) setTimeout(() => { if (wand.auto && !puff.on) { blowStart(); puff.held = false; } }, 700);
}
start().catch(err => { console.error(err); failed(); });
</script>
