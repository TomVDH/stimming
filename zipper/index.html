  c.closePath();
  c.fillStyle = bandG;
  c.fill();
  line(c, arr, sg, cb + tb * 0.38, RIB, 1);
  c.setLineDash([0.34 * P, 0.2 * P]);
  c.lineCap = 'round';
  line(c, arr, sg, cb + tb * 0.74, THREAD, Math.max(1.2, 0.05 * P));
  c.setLineDash([]);
  c.lineCap = 'butt';
  line(c, arr, sg, cb + tb, HAIR, 1);
  // The inner edge catches light on the side that faces it.
  const lit = sg * si * LS[0] - sg * co * LS[1] > 0;
  line(c, arr, sg, 0, lit ? EDGE_LIT : EDGE_DIM, 1.5);
}
// Device-pixel box around a local rectangle, clipped to the canvas.
function devBox(u0, u1, y0, y1) {
  let xa = Infinity, ya = Infinity, xb = -Infinity, yb = -Infinity;
  for (const [u, y] of [[u0, y0], [u1, y0], [u0, y1], [u1, y1]]) {
    const [X, Y] = L2S(u, y);
    xa = Math.min(xa, X); xb = Math.max(xb, X); ya = Math.min(ya, Y); yb = Math.max(yb, Y);
  }
  const a = Math.max(0, Math.floor(xa * dpr) - 2), b = Math.max(0, Math.floor(ya * dpr) - 2);
  const w = Math.min(cv.width, Math.ceil(xb * dpr) + 2) - a, h = Math.min(cv.height, Math.ceil(yb * dpr) + 2) - b;
  return w > 0 && h > 0 ? [a, b, w, h] : null;
}
function draw() {
  if (!ready) return;
  const c = ctx, z = s + 0.15 * slen;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1;
  c.drawImage(base, 0, 0);
  // The opening shows the lining underneath.
  let mT = 0, mB = 0, li = 0;
  for (let i = 0; i < nN && NU[i] < z; i++) { mT = Math.max(mT, wT[i]); mB = Math.max(mB, wB[i]); li = i; }
  if (mT + mB > 0.3) {
    local(c);
    c.save();
    c.beginPath();
    let n = 0;
    for (let i = 0; i <= li; i++) { XS[n] = NU[i]; YS[n++] = -wT[i]; }
    XS[n] = z; YS[n++] = 0;
    curve(c, n, false, true);
    n = 0;
    for (let i = 0; i <= li; i++) { XS[n] = NU[i]; YS[n++] = wB[i]; }
    XS[n] = z; YS[n++] = 0;
    curve(c, n, true, false);
    c.closePath();
    c.clip();
    const bb = devBox(uTop, z, -mT - 2, mB + 2);
    c.setTransform(1, 0, 0, 1, 0, 0);
    if (bb) c.drawImage(lining, bb[0], bb[1], bb[2], bb[3], bb[0], bb[1], bb[2], bb[3]);
    c.restore();
  }
  local(c);
  tape(c, wT, -1);
  tape(c, wB, 1);
  // Past the teeth, the two tapes meet in a seam.
  c.beginPath();
  c.moveTo(-ext, 0); c.lineTo(uTop - 0.6 * P, 0);
  c.moveTo(uBot + 0.9 * P, 0); c.lineTo(Ltot + ext, 0);
  c.strokeStyle = HAIR;
  c.lineWidth = 1.2;
  c.stroke();
  c.translate(uTop, 0);
  blit(stopsS);
  local(c);
  c.translate(uBot, 0);
  blit(boxS);
  for (let j = 0; j < nT; j++) {
    const u = TU[j], sg = TS[j];
    let y = 0, a = 0;
    if (TR[j] !== 2) {
      const arr = sg < 0 ? wT : wB;
      y = sg * wAt(arr, u);
      a = Math.atan((sg * (wAt(arr, u + du) - wAt(arr, u - du))) / (2 * du));
    }
    y += sg * OO[j];
    a += RR[j] * D2R;
    const A = th + a, ca = Math.cos(A) * dpr, sa = Math.sin(A) * dpr;
    c.setTransform(ca, sa, -sa, ca, (ox0 + u * co - y * si) * dpr, (oy0 + u * si + y * co) * dpr);
    blit(sg < 0 ? toothT : toothB);
  }
  local(c);
  c.translate(s, 0);
  blit(sliderS);
  // The pull is lit in screen space as it turns.
  const [px, py] = L2S(s, 0), cp = Math.cos(psi), sp = Math.sin(psi);
  c.setTransform(cp * dpr, sp * dpr, -sp * dpr, cp * dpr, px * dpr, py * dpr);
  gloss(c, tabPath, tabBox, CHROME, [LS[0] * cp + LS[1] * sp, -LS[0] * sp + LS[1] * cp], Math.max(2.4, 0.08 * P), 'evenodd');
}
function aria() {
  const p = travel > 0 ? Math.round((100 * (s - sMin)) / travel) : 0;
  if (p === ariaP) return;
  ariaP = p;
  panel.setAttribute('aria-valuenow', String(p));
  panel.setAttribute('aria-valuetext', p === 0 ? 'Closed' : p === 100 ? 'Open' : p + '% open');
}

/* ---------- one loop, only while something moves ---------- */
let raf = 0, last = 0, accT = 0, quiet = 0, onScreen = true, slow = 0;
function wake() {
  quiet = 0;
  if (!raf && ready && onScreen && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function busy() {
  if (drag || keyDir || Math.abs(v) > 0.5) return true;
  // Friction may hold the pull a hair off plumb.
  if (Math.abs(psiV) > 0.03 || Math.abs(angDiff(psi, PI / 2)) > HINGE / (reduce ? 36 : 49) + 0.005) return true;
  for (let j = 0; j < nT; j++) if (RR[j] || OO[j]) return true;
  for (let i = 1; i < nN - 1; i++) if (Math.abs(vT[i]) + Math.abs(vB[i]) > 0.6) return true;
  return false;
}
function frame(ms) {
  raf = 0;
  const raw = Math.max(0, (ms - last) / 1000), dt = Math.min(raw, 1 / 30);
  last = ms;
  // Sustained slow frames drop the pixel ratio to 1.
  if (!lowDpr) {
    slow = raw > 0.03 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 24) { lowDpr = true; layout(); }
  }
  // While held, the pull points at a distant finger.
  if (drag) {
    const [px, py] = L2S(s, 0), dx = drag.X - px, dy = drag.Y - py;
    drag.steer = Math.hypot(dx, dy) > 0.45 * lt ? Math.atan2(dy, dx) : null;
  }
  accT += dt;
  const n = Math.min(8, Math.floor(accT / HS));
  accT = n === 8 ? 0 : accT - n * HS;
  for (let k = 0; k < n; k++) step(HS);
  draw();
  aria();
  let e = 0;
  for (let i = 1; i < nN - 1; i++) e += Math.abs(vT[i]) + Math.abs(vB[i]);
  whoosh(e / (2 * nN) / (7 * P) + Math.abs(v) / (6 * travel));
  quiet = busy() ? 0 : quiet + 1;
  if (quiet < 4) {
    if (onScreen && !document.hidden) raf = requestAnimationFrame(frame);
  } else {
    v = vLast = acc = psiV = 0;
    vT.fill(0);
    vB.fill(0);
    whoosh(0);
    rest();
  }
}

/* ---------- input ---------- */
function pt(e) {
  const r = cv.getBoundingClientRect();
  const X = ((e.clientX - r.left) * W) / r.width, Y = ((e.clientY - r.top) * H) / r.height;
  const dx = X - ox0, dy = Y - oy0;
  return { X, Y, u: dx * co + dy * si };
}
function segDist(x, y, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay, t = clamp(((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy || 1));
  return Math.hypot(x - ax - vx * t, y - ay - vy * t);
}
cv.addEventListener('pointerdown', e => {
  if (!ready || drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const p = pt(e), [sx, sy] = L2S(s, 0);
  const ex = sx + lt * Math.cos(psi), ey = sy + lt * Math.sin(psi), k = e.pointerType === 'mouse' ? 1 : 1.35;
  // The slider and its pull keep their grip; elsewhere pulls it over.
  const onIt = Math.hypot(p.X - sx, p.Y - sy) < 1.7 * P * k || segDist(p.X, p.Y, sx, sy, ex, ey) < 0.75 * P * k;
  drag = { id: e.pointerId, off: onIt ? s - p.u : 0, target: 0, X: p.X, Y: p.Y, steer: null, trail: [[e.timeStamp, p.u]] };
  drag.target = clamp(p.u + drag.off, sMin - P, sMax + P);
  keyDir = 0;
  keyName = '';
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  panel.classList.add('held');
  wake();
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = pt(e);
  drag.target = clamp(p.u + drag.off, sMin - P, sMax + P);
  drag.X = p.X;
  drag.Y = p.Y;
  drag.trail.push([e.timeStamp, p.u]);
  if (drag.trail.length > 12) drag.trail.shift();
  wake();
});
// Release keeps the pointer's last 100 ms of speed: a flick throws.
function letGo(e, fling) {
  if (!drag || e.pointerId !== drag.id) return;
  const tr = drag.trail, end = tr[tr.length - 1];
  drag = null;
  panel.classList.remove('held');
  if (fling && e.timeStamp - end[0] < 80) {
    const first = tr.find(q => end[0] - q[0] <= 100) || end, dt = (end[0] - first[0]) / 1000;
    if (dt > 0.008) v = clamp((end[1] - first[1]) / dt, -4 * travel, 4 * travel);
  }
  wake();
}
cv.addEventListener('pointerup', e => letGo(e, true));
cv.addEventListener('pointercancel', e => letGo(e, false));
cv.addEventListener('lostpointercapture', e => letGo(e, true));

// Space runs the slider to whichever end is farther.
function run(open) {
  if (!ready || drag) return;
  if (open == null) open = s - sMin < travel / 2;
  keyDir = 0;
  keyName = '';
  const d = open ? sMax - s : s - sMin;
  if (d < 1) return;
  v = (open ? 1 : -1) * launch(d, 0.42 * travel);
  wake();
}
const DIRS = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
addEventListener('keydown', e => {
  if (!ready || e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target !== panel && e.target !== document.body && e.target !== document.documentElement) return;
  const d = DIRS[e.key];
  if (d) {
    e.preventDefault();
    if (keyName !== e.key && !drag) {
      keyDir = d;
      keyName = e.key;
      // A tap still moves the slider a tooth or two.
      if (v * d < 0.2 * travel) v = 0.2 * travel * d;
      wake();
    }
  } else if (e.key === ' ' || e.key === 'Home' || e.key === 'End') {
    e.preventDefault();
    if (!e.repeat) run(e.key === ' ' ? null : e.key === 'End');
  }
});
addEventListener('keyup', e => {
  if (e.key !== keyName) return;
  keyDir = 0;
  keyName = '';
  wake();
});
addEventListener('blur', () => { keyDir = 0; keyName = ''; });

const sndB = document.getElementById('snd');
const showSound = () => sndB.setAttribute('aria-pressed', String(soundOn));
showSound();
sndB.addEventListener('click', () => {
  soundOn = !soundOn;
  showSound();
  try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (err) { /* storage is optional */ }
  if (soundOn) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(panel);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { keyDir = 0; keyName = ''; } else wake();
});

/* ---------- start ---------- */
layout();
new ResizeObserver(() => { const was = ready; layout(); if (was) wake(); }).observe(panel);
requestAnimationFrame(() => cv.classList.add('on'));
// On arrival the slider glides a third of the way open.
if (!reduce) {
  setTimeout(() => {
    if (ready && !drag && !keyDir && s - sMin < 1) { v = launch(0.36 * travel, 0); wake(); }
  }, 450);
}
})();
</script>
