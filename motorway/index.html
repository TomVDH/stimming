const BORDER_M = BORDER.map(([lo, la]) => geoRaw(lo, la));
// Point in polygon, by ray crossing.
function inBelgium(x, z) {
  let c = false;
  for (let i = 0, j = BORDER_M.length - 1; i < BORDER_M.length; j = i++) {
    const [xi, zi] = BORDER_M[i], [xj, zj] = BORDER_M[j];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) c = !c;
  }
  return c;
}

/* ---------- network ---------- */
// Lamps stand every 50 m; the ribbon samples every 40 m.
const LAMP_GAP = 50, STEP = 40, HEAD_H = 12, HEAD_OFF = 4;
const dense = ROADS.map(({ p: pts, ring }) => {
  const curve = new THREE.CatmullRomCurve3(pts.map(([lo, la]) => { const [x, z] = geoRaw(lo, la); return new THREE.Vector3(x, 0, z); }), ring, 'centripetal');
  const len = curve.getLength();
  curve.arcLengthDivisions = Math.max(200, Math.ceil(len / 200));
  curve.updateArcLengths();
  const n = Math.max(2, Math.ceil(curve.getLength() / STEP));
  const p = curve.getSpacedPoints(n);
  const s = [0];
  for (let i = 1; i < p.length; i++) s.push(s[i - 1] + p[i].distanceTo(p[i - 1]));
  return { p, s };
});

  g.instanceCount = JUNCS.length;
  const m = new THREE.Mesh(g, padMat);
  m.frustumCulled = false;
  m.renderOrder = 1;
  return m;
})();
scene.add(pads);

/* ---------- the close set ---------- */
// Local frame at the hero lamp: x along the road, z to the right side, y up.
const set = new THREE.Group();
set.rotation.y = -Math.atan2(HT.z, HT.x);
scene.add(set);
const concrete = new THREE.MeshStandardMaterial({ color: 0x8a8a88, roughness: 0.92 });
const steel = new THREE.MeshStandardMaterial({ color: 0x6d7076, roughness: 0.55, metalness: 0.4 });
const box = (w, h, d, x, y, z, m = concrete) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); set.add(b); return b; };
// The overpass crosses at x = 13.3; the camera stands on its deck.
const OVER = 13.3;
box(12, 1.4, 74, OVER, 6.8, 0);
box(0.3, 1.1, 74, OVER - 5.85, 8.05, 0);
box(0.3, 1.1, 74, OVER + 5.85, 8.05, 0);
box(1.6, 6.1, 1.0, OVER, 3.05, 0);
for (const z of [-19, 19]) box(1.2, 6.1, 1.2, OVER, 3.05, z);
for (const z of [-31, 31]) box(13, 7.5, 12, OVER, 3.75, z, new THREE.MeshStandardMaterial({ color: 0x3a3f36, roughness: 1 }));

// Poles, arms and housings for the lamps near the hero, as instances.
const NEAR = LAMPS.filter(l => l.r === 0 && Math.hypot(l.x, l.z) < 1500);
const poleGeo = mergeGeometries([
  new THREE.CylinderGeometry(0.09, 0.14, HEAD_H + 0.3, 8).translate(0, (HEAD_H + 0.3) / 2, 0),
  ...[-1, 1].map(sd => new THREE.BoxGeometry(0.08, 0.08, HEAD_OFF).rotateX(sd * 0.08).translate(0, HEAD_H + 0.3, sd * HEAD_OFF / 2)),
  ...[-1, 1].map(sd => new THREE.BoxGeometry(0.42, 0.22, 1.25).translate(0, HEAD_H + 0.08, sd * (HEAD_OFF - 0.2))),
]);
const refrGeo = mergeGeometries([-1, 1].map(sd => new THREE.PlaneGeometry(0.32, 1.05).rotateX(Math.PI / 2).translate(0, HEAD_H - 0.04, sd * (HEAD_OFF - 0.2))));
const poles = new THREE.InstancedMesh(poleGeo, steel, NEAR.length);
const refrMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(...SOD).multiplyScalar(5), side: THREE.DoubleSide });
const refrs = new THREE.InstancedMesh(refrGeo, refrMat, NEAR.length);
const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), yAx = new THREE.Vector3(0, 1, 0);
NEAR.forEach((l, i) => {
  q4.setFromAxisAngle(yAx, -Math.atan2(l.tz, l.tx));
  m4.compose(new THREE.Vector3(l.x, 0, l.z), q4, new THREE.Vector3(1, 1, 1));
  poles.setMatrixAt(i, m4);
  refrs.setMatrixAt(i, m4);
});
scene.add(poles, refrs);
// The central barrier, in 40 m pieces near the hero.
{
  const near = [];
  const { p } = dense[0];
  for (let i = 1; i < p.length; i++) if (Math.hypot(p[i].x, p[i].z) < 900) near.push(i);
  const bar = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 0.9, 0.6).translate(0, 0.45, 0), concrete, near.length);
  near.forEach((i, j) => {
    const a = p[i - 1], b = p[i];
    q4.setFromAxisAngle(yAx, -Math.atan2(b.z - a.z, b.x - a.x));
    m4.compose(new THREE.Vector3((a.x + b.x) / 2, 0, (a.z + b.z) / 2), q4, new THREE.Vector3(a.distanceTo(b), 1, 1));
    bar.setMatrixAt(j, m4);
  });
  scene.add(bar);
}
// Point lights at the eight heads nearest the hero light the solids.
const HEADS = [];
NEAR.forEach(l => [-1, 1].forEach(sd => HEADS.push(new THREE.Vector3(l.x - l.tz * sd * HEAD_OFF, HEAD_H - 0.2, l.z + l.tx * sd * HEAD_OFF))));
HEADS.sort((a, b) => a.lengthSq() - b.lengthSq());
const LIGHT_I = 1.6 * 144 * Math.PI;
const lights = HEADS.slice(0, 8).map(h => {
  const L = new THREE.PointLight(new THREE.Color(...SOD), LIGHT_I, 0, 2);
  L.position.copy(h);
  scene.add(L);
  return L;
});
scene.add(new THREE.HemisphereLight(new THREE.Color(...linFit(0.3, 0.05, 262)), 0x000000, 0.06));

/* ---------- camera path ---------- */
// The hero head the camera looks at, on the right-hand carriageway side.
const HEAD = HN.clone().multiplyScalar(HEAD_OFF).setY(HEAD_H);
// Look back along -T, turned 25 degrees toward the reserve.
const yawFrom = turn => { const f = HT.clone().multiplyScalar(-Math.cos(turn)).addScaledVector(HN, -Math.sin(turn)); return Math.atan2(f.z, f.x); };
// Portrait hangs over the road, facing the overpass; the lamp row runs up the frame.
const YAW0 = yawFrom(0.436), YAW0P = yawFrom(Math.PI - 0.12);
// The country's centre and its long axis, Ostend to Arlon.
const CENTRE = (() => { const [x, z] = geo(4.42, 50.66); return new THREE.Vector3(x, 0, z); })();
const AXIS = (() => { const [x0, z0] = geo(5.82, 49.68), [x1, z1] = geo(2.92, 51.21); return Math.atan2(z1 - z0, x1 - x0); })();
const D0 = 15;
let Dfar = 4.4e5, yawFar = -Math.PI / 2;
const PITCH = [[0, 0.2], [0.1, 0.06], [0.25, -0.36], [0.5, -0.85], [0.75, -1.1], [1, -1.22]];
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const table = (T, z) => {
  for (let i = 1; i < T.length; i++) if (z <= T[i][0]) return T[i - 1][1] + (T[i][1] - T[i - 1][1]) * ss(T[i - 1][0], T[i][0], z);
  return T[T.length - 1][1];
};
const angLerp = (a, b, t) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return a + d * t; };
const look = { yaw: 0, pitch: 0 };
const tgt = new THREE.Vector3();
function place(z) {
  const portrait = camera.aspect < 0.8, near = 1 - ss(0, 0.25, z);
  // Portrait hangs higher over the road and looks down along it.
  const d0 = portrait ? D0 * 3 : D0;
  const D = d0 * Math.pow(Dfar / d0, z);
  const pitch = table(PITCH, z) + look.pitch * (1 - z) - (portrait ? 0.4 * near : 0);
  // A small orbit in the middle of the climb gives parallax.
  const yaw = angLerp((portrait ? YAW0P : YAW0) + 0.3 * Math.sin(Math.PI * Math.min(1, z / 0.55)), yawFar, ss(0.5, 1, z)) + look.yaw;
  tgt.lerpVectors(HEAD, CENTRE, ss(0.42, 0.97, z));
  // Portrait aims below the head, so the head sits in the upper third.
  if (portrait) tgt.y -= 3 * near;
  const f = new THREE.Vector3(Math.cos(pitch) * Math.cos(yaw), Math.sin(pitch), Math.cos(pitch) * Math.sin(yaw));
  camera.position.copy(tgt).addScaledVector(f, -D);
  camera.up.set(0, 1, 0);
  camera.lookAt(tgt);
  camera.near = Math.max(0.3, D * 0.03);
  camera.far = Math.max(60000, D * 5);
  camera.updateProjectionMatrix();
  return D;
}
// Fit the far shot to the border, in the camera's ground frame.
function fitFar() {
  const portrait = camera.aspect < 0.8;
  yawFar = portrait ? AXIS : -Math.PI / 2;
  const fx = Math.cos(yawFar), fz = Math.sin(yawFar);
  let u0 = 1e9, u1 = -1e9, v0 = 1e9, v1 = -1e9;
  BORDER_M.forEach(([x, z]) => {
    const dx = x - CENTRE.x, dz = z - CENTRE.z, u = dx * fx + dz * fz, v = -dx * fz + dz * fx;
    u0 = Math.min(u0, u); u1 = Math.max(u1, u); v0 = Math.min(v0, v); v1 = Math.max(v1, v);
  });
  const tv = Math.tan((camera.fov * Math.PI) / 360);
  const hu = Math.max(Math.abs(u0), Math.abs(u1)) * Math.sin(1.22), hv = Math.max(Math.abs(v0), Math.abs(v1));
  Dfar = Math.max(hu / tv, hv / (tv * camera.aspect)) * (portrait ? 0.92 : 0.94);
}

/* ---------- post ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// Tilt-shift: a round disc blur grows away from a sharp band through the centre.
const tilt0 = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uPx: { value: new THREE.Vector2() }, uMax: { value: 6 }, uBand: { value: 0.1 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform vec2 uPx; uniform float uMax, uBand;
    varying vec2 vUv;
    void main() {
      float r = uMax * smoothstep(uBand, uBand + 0.42, abs(vUv.y - 0.5));
      // A clamp keeps hot cores from blowing the bloom into boxes.
      vec4 c = min(texture2D(tDiffuse, vUv), vec4(5.0));
      if (r < 0.3) { gl_FragColor = c; return; }
      vec4 acc = c; float wsum = 1.0;
      // A Vogel spiral of 28 taps gives round bokeh.
      for (int i = 1; i < 28; i++) {
        float fi = float(i), rr = sqrt(fi / 28.0), a = fi * 2.39996;
        acc += min(texture2D(tDiffuse, vUv + vec2(cos(a), sin(a)) * rr * r * uPx), vec4(5.0));
        wsum += 1.0;
      }
      gl_FragColor = acc / wsum;
    }`,
});
composer.addPass(tilt0);
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.7, 0.4, 0.7);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uSeed: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uSeed;
    varying vec2 vUv;
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 q = vUv - 0.5;
      c.rgb *= 1.0 - dot(q, q) * 0.9;
      float g = fract(sin(dot(vUv * 913.0 + uSeed, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
      c.rgb += g * 0.004;
      gl_FragColor = c;
    }`,
});
composer.addPass(grade);
composer.addPass(new OutputPass());

/* ---------- air ---------- */
// Density per metre, scale height, sprite size, halo level, ribbon glow.
const AIR = {
  clear: { d: 0.00003, h: 500, size: 4, halo: 0.02, glow: 0.03, wide: 18, stars: 1 },
  haze: { d: 0.00016, h: 300, size: 7, halo: 0.1, glow: 0.07, wide: 28, stars: 0.4 },
  fog: { d: 0.0011, h: 90, size: 16, halo: 0.22, glow: 0.18, wide: 60, stars: 0 },
};
const air = { ...AIR.haze };
let airTo = AIR.haze;

/* ---------- state ---------- */
let z = ui.slider?.value ?? 0, zTo = z, tilt = ui.setting('tilt')?.value ?? 0.6;
const size = { w: 1, h: 1 };
let rung = 0;
function resize() {
  const r = stage.getBoundingClientRect();
  size.w = Math.max(1, Math.round(r.width)); size.h = Math.max(1, Math.round(r.height));
  const pr = pixelRatio(size.w, size.h, { maxDpr: 2, budget: 1.8e6, low: rung > 0 });
  renderer.setPixelRatio(pr);
  renderer.setSize(size.w, size.h, false);
  composer.setPixelRatio(pr);
  composer.setSize(size.w, size.h);
  const b = rung > 1 ? 0.35 : 0.5;
  bloom.resolution.set(size.w * pr * b, size.h * pr * b);
  camera.aspect = size.w / size.h;
  camera.fov = camera.aspect < 0.8 ? 58 : 40;
  U.uPxK.value = (2 * Math.tan((camera.fov * Math.PI) / 360)) / size.h;
  tilt0.uniforms.uPx.value.set(1 / size.w, 1 / size.h);
  fitFar();
  draw();
}

// Exposure by zoom: the country needs more than the close lamp.
const EXPO = [[0, 0.9], [0.3, 1.1], [0.6, 1.6], [1, 2.1]];
function draw() {
  const t = nowS();
  U.uNow.value = t;
  const D = place(z);
  // Air eases toward the chip.
  ribMat.uniforms.uHalf.value = 60 + air.wide * 2;
  ribMat.uniforms.uGlow.value = air.glow;
  ribMat.uniforms.uWide.value = air.wide;
  sprMat.uniforms.uSize.value = air.size;
  sprMat.uniforms.uHaloI.value = air.halo;
  sprMat.uniforms.uCore.value = 0.35 / air.size;
  U.uFogD.value = air.d; U.uFogH.value = air.h;
  // The fog colour: night blue, lit orange where the air is thick.
  const lvl = U.uOn.value ? 1 : 0;
  const glow = Math.min(1, air.d / 0.0011) * (1 - z * 0.7) * lvl;
  // Sky glow over a lit country never goes fully dark.
  const sg = 0.012 * lvl + 0.06 * glow;
  U.uFogC.value.set(0.005 + SOD[0] * sg, 0.006 + SOD[1] * sg, 0.012 + SOD[2] * sg);
  sky.material.uniforms.uStars.value = air.stars;
  renderer.toneMappingExposure = table(EXPO, z);
  // Ripple speed grows with altitude, so the country lights in seconds.
  U.uRipV.value = Math.max(500, D * 0.25);
  // The near heads follow the global switch.
  const st = jsLamp(t);
  refrMat.color.setRGB(...st.c).multiplyScalar(5 * st.l);
  lights.forEach(L => { L.color.setRGB(...st.c); L.intensity = LIGHT_I * st.l; });
  tilt0.uniforms.uMax.value = tilt * (9 + 5 * z);
  tilt0.uniforms.uBand.value = 0.06 + 0.08 * z;
  // From orbit the ribbons need a lift to read.
  // A phone draws the country smaller, so its strips need more lift.
  ribMat.uniforms.uFar.value = 1 + (camera.aspect < 0.8 ? 170 : 100) * ss(0.3, 0.9, z);
  padMat.uniforms.uFar.value = 1 + 40 * ss(0.3, 0.9, z);
  grade.uniforms.uSeed.value = (t * 7.31) % 1;
  sky.material.uniforms.uInvVP.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse).invert();
  composer.render();
}
// The JS twin of lampState, for the near heads.
function jsLamp(t) {
  if (!U.uOn.value) { const k = 1 - Math.min(1, Math.max(0, (t - U.uOffT.value) / 0.35)); return { c: SOD, l: k * k }; }
  const tt = t - U.uSwT.value - 0.3;
  if (tt < 0) return { c: PINK, l: 0 };
  const h = U.uHot.value, w = h + (1 - h) * (1 - (1 - Math.min(1, tt / 6)) ** 3);
  const mix = (a, b, f) => a.map((v, i) => v + (b[i] - v) * f);
  const c = w < 0.45 ? mix(PINK, SALMON, ss(0, 0.45, w)) : mix(SALMON, SOD, ss(0.45, 0.9, w));
  return { c, l: 0.1 + 0.9 * w * w };
}

/* ---------- frame loop ---------- */
let raf = 0, lastT = 0, visible = true, lastInput = performance.now(), busyUntil = 0;
function tick(now) {
  raf = 0;
  const dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0.016;
  lastT = now;
  let moving = false;
  try {
    if (Math.abs(zTo - z) > 1e-4) { z = reduced() ? zTo : z + (zTo - z) * (1 - Math.exp(-dt * 4)); moving = true; } else z = zTo;
    for (const k of ['d', 'h', 'size', 'halo', 'glow', 'wide', 'stars']) {
      const d = airTo[k] - air[k];
      if (Math.abs(d) > Math.abs(airTo[k]) * 1e-3) { air[k] += d * (1 - Math.exp(-dt * 2.5)); moving = true; } else air[k] = airTo[k];
    }
    draw();
    watch(now);
  } finally {
    if (visible && !document.hidden && (moving || press || performance.now() < busyUntil)) raf = requestAnimationFrame(tick);
    else lastT = 0;
  }
}
function wake() {
  lastInput = performance.now();
  if (!raf && visible && !document.hidden) raf = requestAnimationFrame(tick);
}
/* Performance ladder: slow frames step quality down a rung, never back up. */
let watchFrom = 0, watchN = 0, watchSum = 0, prevDraw = 0;
function watch(now) {
  const gap = now - prevDraw;
  prevDraw = now;
  if (gap > 200) { watchFrom = now; watchN = watchSum = 0; return; }
  if (!watchFrom) watchFrom = now;
  if (now - watchFrom < 4000) return;
  watchN++; watchSum += gap;
  if (watchN < 2 || now - watchFrom < 6000) return;
  if (watchSum / watchN > 1000 / 38 && rung < 2) { rung++; resize(); }
  watchFrom = now - 4000; watchN = watchSum = 0;
}
whenVisible(stage, vis => {
  visible = vis;
  if (!vis) { cancelAnimationFrame(raf); raf = 0; lastT = 0; return; }
  draw();
  wake();
});
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
onReducedChange(() => wake());

/* ---------- input ---------- */
const setZoom = (v, fromSlider = false) => {
  zTo = Math.min(1, Math.max(0, v));
  if (!fromSlider) ui.slider?.set(zTo);
  wake();
};
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const k = e.deltaMode === 1 ? 0.02 : 0.0006;
  setZoom(zTo + e.deltaY * k);
}, { passive: false });
// A press turns into a drag after 8 px; two fingers pinch the zoom.
let press = null;
const pts = new Map();
let pinch = null;
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: zTo };
    press = null;
  } else press = { id: e.pointerId, x: e.clientX, y: e.clientY, drag: false, yaw: look.yaw, pitch: look.pitch };
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && pts.size >= 2) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    setZoom(pinch.z - Math.log(d / pinch.d) * 0.22);
    return;
  }
  if (!press || e.pointerId !== press.id) return;
  if (!press.drag && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { press.drag = true; stage.classList.add('held'); }
  if (!press.drag) return;
  const s = 1.6 / Math.max(size.w, size.h);
  look.yaw = Math.max(-0.5, Math.min(0.5, press.yaw - (e.clientX - press.x) * s));
  look.pitch = Math.max(-0.2, Math.min(0.2, press.pitch + (e.clientY - press.y) * s * 0.5));
  wake();
});
const end = e => {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (press && e.pointerId === press.id) { press = null; stage.classList.remove('held'); }
  wake();
};
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);
stage.addEventListener('keydown', e => {
  if (e.key === '+' || e.key === '=' || e.key === 'ArrowUp') { setZoom(zTo + 0.05); e.preventDefault(); }
  if (e.key === '-' || e.key === 'ArrowDown') { setZoom(zTo - 0.05); e.preventDefault(); }
});

/* ---------- bar ---------- */
act.zoom = v => setZoom(v, true);
act.air = v => { airTo = AIR[v] ?? AIR.haze; wake(); };
act.tilt = v => { tilt = v; draw(); };
act.near = on => { land.material.uniforms.uNear.value = on ? 1 : 0; draw(); };
// Switch: all lamps die, or strike again in a ripple from the view centre.
act.sw = () => {
  const t = nowS();
  if (U.uOn.value) { U.uOn.value = 0; U.uOffT.value = t; busyUntil = performance.now() + 600; }
  else {
    // A lamp that went out moments ago is still hot and restrikes orange.
    U.uHot.value = Math.exp(-(t - U.uOffT.value) / 20);
    U.uOn.value = 1; U.uSwT.value = t; U.uRip.value.set(tgt.x, tgt.z);
    busyUntil = performance.now() + 1000 * (8 + 300000 / U.uRipV.value);
  }
  wake();
};
act.reset = () => {
  ui.choice?.set('haze'); airTo = AIR.haze;
  ui.setting('tilt')?.set(0.6); tilt = 0.6;
  look.yaw = look.pitch = 0;
  if (!U.uOn.value) act.sw();
  setZoom(0);
};
act.air(ui.choice?.value ?? 'haze');
Object.assign(air, airTo);
act.near(ui.setting('near')?.value ?? true);

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  markReady();
}, () => { canvas.classList.add('on'); markReady(); });
</script>
</body>
</html>
