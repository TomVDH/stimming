<!doctype html>
<html lang="en">
<head>

<title>Lit motorway</title>

<style>
/* Lit motorway: one sodium lamp, then the whole lit network from above. */
:root { --stage: oklch(0.08 0.012 262); }
.stage--motorway { touch-action: none; cursor: grab; }
.stage--motorway.held { cursor: grabbing; }
.stage--motorway canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--motorway canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--motorway canvas { transition: none; } }
/* Overlays read like a printed map: plain type on the map, a tight dark halo, hairlines. No boxes, no glow. */
.mk-layer {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden; --flag: oklch(0.9 0.12 72); --glow: transparent;
  --ink: oklch(0.95 0.005 260); --mute: oklch(0.78 0.01 260); --jam: oklch(0.72 0.17 32);
  --halo: 0 0 1px oklch(0.07 0.01 260), 0 0 2px oklch(0.07 0.01 260), 0 0 4px oklch(0.07 0.01 260 / 0.85);
  font-family: Gabarito, system-ui, sans-serif; color: var(--ink); text-shadow: var(--halo);
}
/* Cities: a dot and a name; the other languages sit quieter below. */
.mk { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; will-change: transform, opacity; --s: 1; }
.mk .dot { position: absolute; left: -2.5px; top: -2.5px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 1.5px oklch(0.07 0.01 260); }
.mk .nm { position: absolute; left: 9px; top: -9px; transform: scale(var(--s)); transform-origin: 0 50%; white-space: nowrap; line-height: 1.1; }
.mk .nm b { display: block; font-weight: 500; font-size: 16px; }
.mk .nm small { display: block; font-size: 10.5px; font-style: italic; color: var(--mute); }
/* Jam points: hairline circles sized by queue; the worst three get a leader line and a label. */
.pc { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; will-change: transform, opacity; }
.pc i { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid var(--jam); box-shadow: 0 0 0 1px oklch(0.07 0.01 260 / 0.6); }
.pc .lbl { position: absolute; top: -7px; white-space: nowrap; font-size: 12px; opacity: 0; transition: opacity 0.25s ease; }
.pc .lbl::before { content: ''; position: absolute; right: calc(100% + 3px); top: 7px; width: 8px; border-top: 1px solid var(--ink); }
.pc .lbl.on { opacity: 1; }
.pc .lbl em { font-style: normal; font-weight: 600; color: var(--jam); font-variant-numeric: tabular-nums; }
.tip { position: absolute; left: 0; top: 0; width: 170px; pointer-events: none; opacity: 0; font-size: 11px; line-height: 1.35; }
.tip.on { opacity: 1; }
.tip b { display: block; font-weight: 600; font-size: 13px; }
.tip span { color: var(--mute); }
.tip svg { display: block; width: 100%; height: 34px; margin-top: 4px; overflow: visible; }
.tip path { fill: none; stroke: var(--jam); stroke-width: 1.25; }
.tip line { stroke: var(--ink); stroke-width: 0.75; }
/* The study: type set on the map, and the day as a bare line along the bottom. */
.study { position: absolute; left: 18px; top: 66px; width: min(340px, calc(100% - 36px)); opacity: 0; pointer-events: none; }
.study.on, .strip.on { opacity: 1; }
.study .lede { margin: 0; font-size: 15px; color: var(--mute); }
.study .lede .k { display: block; font-size: 46px; line-height: 1; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.study .lede .t { color: var(--ink); font-variant-numeric: tabular-nums; }
.study .dek { margin: 6px 0 14px; font-size: 15px; max-width: 26ch; }
.study .rank { list-style: none; margin: 0; padding: 0; font-size: 12.5px; line-height: 1.55; }
.study .rank li { display: flex; gap: 16px; width: 220px; white-space: nowrap; }
.study .rank li span:first-child { flex: none; }
.study .rank li span:last-child { margin-left: auto; color: var(--jam); font-variant-numeric: tabular-nums; }
.study .rail { margin: 12px 0 0; font-size: 12.5px; color: var(--mute); max-width: 30ch; }
.study .rail .v { color: var(--ink); font-variant-numeric: tabular-nums; }
.strip { position: absolute; left: 18px; right: 18px; bottom: 74px; height: 92px; opacity: 0; pointer-events: none; }
.strip.on { pointer-events: auto; }
.strip svg { display: block; width: 100%; height: 70px; overflow: visible; touch-action: none; cursor: ew-resize; }
.strip .base { stroke: var(--ink); stroke-opacity: 0.5; stroke-width: 0.75; }
.strip .tick text { fill: var(--mute); font-size: 10px; }
.strip .tick line { stroke: var(--ink); stroke-opacity: 0.4; }
.strip .line { fill: none; stroke: var(--jam); stroke-width: 1.5; }
.strip .note circle { fill: var(--ink); }
.strip .note text { fill: var(--ink); font-size: 11px; }
.strip .cursor line { stroke: var(--ink); stroke-width: 0.75; }
.strip .cursor circle { fill: var(--ink); }
.strip .cap { display: flex; gap: 12px; align-items: baseline; margin-top: 6px; font-size: 10.5px; color: var(--mute); }
.strip .cap button { pointer-events: auto; background: none; border: 0; padding: 0; font: 600 11px Gabarito, system-ui, sans-serif; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; text-shadow: var(--halo); }
@media (max-width: 640px) {
  .study { top: 52px; }
  .study .lede .k { font-size: 34px; }
  .study .rank, .study .rail { display: none; }
  .strip { bottom: 104px; left: 12px; right: 12px; }
  .strip .cap span:last-child { display: none; }
}
@media (prefers-reduced-motion: reduce) { .pc .lbl { transition: none; } }
/* The map credit stays small and quiet. */
.about .credit { font-size: 12px; opacity: 0.55; margin: 0.4em 0 0; }
.about .credit a { color: inherit; }

<body>
<div class="intro" aria-hidden="true">

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

const stage = document.getElementById('stage');
// Bar handlers bind once the scene exists.

const QS = new URLSearchParams(location.search);

const ui = initPage({ id: 'motorway', bar: {
  choice: { label: 'Style', value: 'sodium', options: [

  ], onPick: v => act.style(v) },
  slider: { label: 'Zoom', min: 0, max: 1, step: 0.001, value: QS.has('z') ? +QS.get('z') : 1, onInput: v => act.zoom(v) },
  actions: [
    { verb: 'switch', key: 'S', onPress: () => act.sw() },

  ],
  settings: [
    { type: 'choice', id: 'air', label: 'Air', value: 'haze', persist: true, onPick: v => act.air(v),
      options: [{ value: 'clear', label: 'Clear' }, { value: 'haze', label: 'Haze' }, { value: 'fog', label: 'Fog' }] },
    { type: 'slider', id: 'tilt', label: 'Tilt-shift', min: 0, max: 1, step: 0.01, value: 0.6, persist: true, onInput: v => act.tilt(v) },
    { type: 'toggle', id: 'near', label: 'Neighbours', value: true, persist: true, onToggle: on => act.near(on) },
    { type: 'toggle', id: 'atlas', label: 'Atlas', value: false, persist: true, onToggle: on => act.atlas(on) },

let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));

}

const canvas = renderer.domElement;
stage.prepend(canvas);

/* ---------- geography ---------- */
// Equirectangular projection around 50.6 N, 4.5 E, in metres.
// x runs east and z runs south.
const LAT0 = 50.6, LON0 = 4.5;
const KX = 111320 * Math.cos(LAT0 * Math.PI / 180), KY = 110570;
const geoRaw = (lon, lat) => [(lon - LON0) * KX, -(lat - LAT0) * KY];

// The coast, west to north-east. The sea lies to its left.
const COAST = [[1.2, 50.85], [2.0, 51.0], [2.54, 51.09], [3.37, 51.37], [3.6, 51.5], [3.9, 51.7], [4.1, 52.0], [4.6, 52.6]];
// Towns: lon, lat, radius in km, level. Inside the border they glow warm.
const TOWNS = [
  [4.36, 50.85, 9, 1], [4.41, 51.22, 7, 0.9], [3.72, 51.05, 5, 0.7], [5.57, 50.63, 6, 0.75], [4.44, 50.41, 6, 0.7],
  [3.22, 51.21, 3.5, 0.5], [4.87, 50.47, 3.5, 0.45], [4.7, 50.88, 3, 0.45], [3.95, 50.45, 3, 0.4], [4.48, 51.03, 3, 0.4],
  [5.34, 50.93, 3, 0.4], [3.26, 50.83, 3.5, 0.45], [2.92, 51.22, 3, 0.45], [4.04, 50.94, 2.5, 0.35], [5.5, 50.96, 3, 0.35],
  [3.39, 50.61, 2.5, 0.3], [5.86, 50.59, 2.5, 0.3], [5.82, 49.68, 2, 0.25], [4.3, 51.28, 6, 0.5],
  [4.14, 51.165, 2.5, 0.35], [3.12, 50.945, 2.2, 0.3], [4.95, 51.32, 2.2, 0.3], [4.19, 50.48, 3, 0.4], [4.32, 50.6, 2, 0.25],
  [4.61, 50.715, 2, 0.25], [5.24, 50.52, 1.8, 0.22], [5.19, 50.815, 2, 0.25], [2.88, 50.85, 2, 0.25], [4.1, 51.03, 2, 0.25],
  [4.48, 50.9, 2, 0.35], [3.8, 51.11, 3.5, 0.35], [5.0, 51.16, 2, 0.25], [4.93, 50.8, 1.8, 0.2],
  [3.06, 50.63, 10, 0.8], [5.69, 50.85, 4, 0.45], [6.08, 50.78, 6, 0.6], [5.47, 51.44, 6, 0.6], [4.78, 51.59, 5, 0.5],
  [6.13, 49.61, 5, 0.5], [3.52, 50.36, 4, 0.4], [2.37, 51.03, 5, 0.5], [4.48, 51.92, 10, 0.8], [6.95, 50.94, 12, 0.9],
  [3.83, 51.33, 3, 0.3], [4.3, 51.49, 3, 0.35], [6.17, 49.12, 6, 0.5],
];
// The hero lamp stands on the E19 by Mechelen.
const HERO_LL = [4.4495, 51.0175];

// Roads and border come from OpenStreetMap, simplified offline into roads.json.
// Classes: 0 motorway, 1 trunk, 2 primary, 3 a neighbour's motorway, 4 a slip road.
let DATA;
try {
  const r = await fetch('./roads.json');
  if (!r.ok) throw new Error(`roads.json ${r.status}`);
  DATA = await r.json();
} catch (err) {
  const f = stage.querySelector('.fail');
  f.textContent = 'Lit motorway could not load its road map. Reload to try again.';
  f.hidden = false; ui.hideControls?.(); markReady();
  throw err;
}
const decode = a => {
  const out = [];
  let x = 0, y = 0;
  for (let i = 0; i < a.length; i += 2) { x += a[i]; y += a[i + 1]; out.push(geoRaw(x / DATA.q, y / DATA.q)); }
  return out;
};
const ROADS = DATA.roads.map(r => ({ c: r[0], o: r[1] === 1, p: decode(r.slice(2)) }));

/* ---------- network ---------- */
// Lamps stand every 50 m on fast roads and every 40 m on main roads.
const HEAD_H = 12, HEAD_OFF = 4;
const GAP = [50, 50, 40, 50, 40], STEP = [40, 60, 110, 220, 25];
// Hermite curves smooth each polyline; samples fall evenly along it.
// A baked per-point value F rides along, linearly, into fo.
function sample(P, step, F = null, fo = null) {
  const out = [], n = P.length;
  const L = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]) || 1e-6;
  for (let i = 0; i < n - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(n - 1, i + 2)];
    const l1 = L(p1, p2), k1 = l1 / (L(p0, p1) + l1), k2 = l1 / (l1 + L(p2, p3));
    // Tangents scale to the segment, so short segments do not overshoot.
    const m1 = [(p2[0] - p0[0]) * k1, (p2[1] - p0[1]) * k1], m2 = [(p3[0] - p1[0]) * k2, (p3[1] - p1[1]) * k2];
    const k = Math.max(1, Math.ceil(l1 / step));
    for (let j = 0; j < k; j++) {
      const t = j / k, t2 = t * t, t3 = t2 * t;
      const h00 = 2 * t3 - 3 * t2 + 1, h10 = t3 - 2 * t2 + t, h01 = -2 * t3 + 3 * t2, h11 = t3 - t2;
      out.push([h00 * p1[0] + h10 * m1[0] + h01 * p2[0] + h11 * m2[0], h00 * p1[1] + h10 * m1[1] + h01 * p2[1] + h11 * m2[1]]);
      if (F) fo.push((F[i] + (F[i + 1] - F[i]) * t) / 100);
    }
  }
  out.push(P[n - 1].slice());
  if (F) fo.push(F[n - 1] / 100);
  return out;
}
// Light per sample: 1 at home; past the border the baked fade.
const dense = ROADS.map((R, r) => {
  const F = DATA.fade[r] || null, lit = F ? [] : null;
  const p = sample(R.p, STEP[R.c], F, lit), s = [0];
  for (let i = 1; i < p.length; i++) s.push(s[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
  return { p, s, lit };
});
const tangent = (p, i) => {
  const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)];
  const l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
  return [(b[0] - a[0]) / l, (b[1] - a[1]) / l];
};

// The hero carriageway: the motorway sample nearest the hero lon, lat.
const [hx, hz] = geoRaw(...HERO_LL);
let hA = -1, hAi = 0, hd = Infinity;
dense.forEach((d, r) => {
  if (ROADS[r].c !== 0) return;
  d.p.forEach((q, i) => { const e = Math.hypot(q[0] - hx, q[1] - hz); if (e < hd) { hd = e; hA = r; hAi = i; } });
});
const TA = tangent(dense[hA].p, hAi), PA = dense[hA].p[hAi].slice();
// n is the right-hand side of travel; the other carriageway lies to the left.
const NA = [-TA[1], TA[0]];
// The other carriageway: the nearest motorway segment that runs the other way.
let hB = -1, hBs = 0, sep = 18;
{
  let best = 80;
  dense.forEach((d, r) => {
    if (r === hA || ROADS[r].c !== 0) return;
    const { p, s } = d;
    for (let i = 0; i < p.length - 1; i++) {
      const a = p[i], b = p[i + 1], dx = b[0] - a[0], dz = b[1] - a[1], l2 = dx * dx + dz * dz || 1;
      const t = Math.max(0, Math.min(1, ((PA[0] - a[0]) * dx + (PA[1] - a[1]) * dz) / l2));
      const e = Math.hypot(a[0] + dx * t - PA[0], a[1] + dz * t - PA[1]);
      if (e < best && (dx * TA[0] + dz * TA[1]) / Math.sqrt(l2) < -0.8) { best = e; hB = r; hBs = s[i] + Math.sqrt(l2) * t; sep = e; }
    }
  });
}
sep = Math.min(40, Math.max(12, sep));
// The reserve's centre at the hero lamp is the world origin, for precision.
const ORIGIN = [PA[0] - NA[0] * sep / 2, PA[1] - NA[1] * sep / 2];
dense.forEach(d => d.p.forEach(q => { q[0] -= ORIGIN[0]; q[1] -= ORIGIN[1]; }));
const geo = (lon, lat) => { const [x, z] = geoRaw(lon, lat); return [x - ORIGIN[0], z - ORIGIN[1]]; };
const shift = pts => pts.map(([x, z]) => [x - ORIGIN[0], z - ORIGIN[1]]);
const BORDER_M = shift(decode(DATA.border));
const OUTLINE = DATA.outline.map(a => shift(decode(a)));
const HT = new THREE.Vector3(TA[0], 0, TA[1]);
const HN = new THREE.Vector3(NA[0], 0, NA[1]);
// Lamp phase per road; both hero carriageways put a lamp at the hero station.
const PHASE = dense.map(() => 0);
PHASE[hA] = dense[hA].s[hAi] % GAP[0];
if (hB >= 0) PHASE[hB] = hBs % GAP[0];
// Heads hang left of travel on a carriageway; two-way roads hang them right.
const HOFF = ROADS.map(R => (R.c === 4 ? -3.5 : R.o ? 5 : -5));

if (hB >= 0) HOFF[hB] = sep / 2 - HEAD_OFF;

// Point in polygon, by ray crossing; only the towns ask.
function inBelgium(x, z) {
  let c = false;
  for (let i = 0, j = BORDER_M.length - 1; i < BORDER_M.length; j = i++) {
    const [xi, zi] = BORDER_M[i], [xj, zj] = BORDER_M[j];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) c = !c;
  }
  return c;
}

// A lamp's random seed; the ribbon shader hashes the same way.
const hash = (k, r, side) => { const v = Math.sin(k * 12.9898 + r * 78.233 + side * 37.719) * 43758.5453; return v - Math.floor(v); };

// A typical weekday, baked: the usual Belgian jam points and rush-hour shapes.
// Each hotspot: lon, lat, radius in km, severity, and the city it feeds.
const FEEDS = { bxl: [4.36, 50.85], ant: [4.41, 51.21], gnt: [3.72, 51.05], lie: [5.57, 50.63], crl: [4.44, 50.41], kor: [3.26, 50.83] };
const HOT = [
  [4.27, 50.87, 8, 1.0, 'bxl', 'R0 GROOT-BIJGAARDEN'], [4.43, 50.91, 7, 1.0, 'bxl', 'R0 MACHELEN'], [4.55, 50.865, 8, 0.8, 'bxl', 'E40 KRAAINEM'],
  [4.46, 50.97, 9, 0.9, 'bxl', 'E19 MECHELEN'], [4.12, 50.9, 12, 0.9, 'bxl', 'E40 AALST'], [4.55, 50.75, 8, 0.7, 'bxl', 'E411 OVERIJSE'],
  [4.4, 51.2, 7, 1.0, 'ant', 'R1 KENNEDY'], [4.3, 51.2, 7, 0.85, 'ant', 'E17 ZWIJNDRECHT'], [4.65, 51.19, 9, 0.7, 'ant', 'E313 RANST'],
  [4.45, 51.13, 6, 0.7, 'ant', 'E19 KONTICH'], [4.37, 51.08, 6, 0.5, 'ant', 'A12 BOOM'], [3.7, 51.02, 7, 0.8, 'gnt', 'E40 ZWIJNAARDE'],
  [5.48, 50.67, 7, 0.6, 'lie', 'E40 LONCIN'], [4.44, 50.43, 6, 0.4, 'crl', 'R3 CHARLEROI'], [3.27, 50.82, 5, 0.4, 'kor', 'E17 KORTRIJK'],
].map(([lo, la, r, sev, f, name]) => { const [x, z] = geo(lo, la), [fx, fz] = geo(...FEEDS[f]); return { x, z, r: r * 1000, sev, fx, fz, name }; });

function resize() {
  const r = stage.getBoundingClientRect();
  size.w = Math.max(1, Math.round(r.width)); size.h = Math.max(1, Math.round(r.height));
  const pr = pixelRatio(size.w, size.h, { maxDpr: 2, budget: 1.8e6, low: rung > 0 });
  renderer.setPixelRatio(pr);
  renderer.setSize(size.w, size.h, false);
  composer.setPixelRatio(pr);
  composer.setSize(size.w, size.h);
  const b = rung > 1 ? 0.35 : 0.5;
  bloom.resolution.set(size.w * pr * b, size.h * pr * b);
  camera.aspect = size.w / size.h;
  camera.fov = camera.aspect < 0.8 ? 58 : 40;
  U.uPxK.value = (2 * Math.tan((camera.fov * Math.PI) / 360)) / size.h;
  tilt0.uniforms.uPx.value.set(1 / size.w, 1 / size.h);
  fitFar();
  draw();
}

// Exposure by zoom: the country needs more than the close lamp.
const EXPO = [[0, 0.9], [0.3, 1.1], [0.6, 1.6], [1, 2.1]];
function draw() {
  const t = nowS();
  U.uNow.value = t;
  const D = place(z);
  if (z < 0.3) stepDeck(t);
  // Air eases toward the chip.
  ribMat.uniforms.uHalf.value = 60 + air.wide * 2;
  ribMat.uniforms.uGlow.value = air.glow;
  ribMat.uniforms.uWide.value = air.wide;
  // Belgian roads are damp at night; fog soaks them.
  ribMat.uniforms.uWet.value = 0.45 + 0.55 * Math.min(1, air.d / 0.0011);
  sprMat.uniforms.uSize.value = air.size;
  sprMat.uniforms.uHaloI.value = air.halo;
  sprMat.uniforms.uCore.value = 0.35 / air.size;
  U.uFogD.value = air.d; U.uFogH.value = air.h;
  // The fog colour: night blue, lit orange where the air is thick.
  const lvl = U.uOn.value ? 1 : 0;
  const glow = Math.min(1, air.d / 0.0011) * (1 - z * 0.7) * lvl;
  // Sky glow over a lit country never goes fully dark.
  const sg = 0.012 * lvl + 0.06 * glow;
  const sun = U.uSun.value;
  const fb = look_.fog;
  U.uFogC.value.set(fb[0] + SOD[0] * sg * (1 - sun) + 0.05 * sun, fb[1] + SOD[1] * sg * (1 - sun) + 0.058 * sun, fb[2] + SOD[2] * sg * (1 - sun) + 0.07 * sun);
  sky.material.uniforms.uStars.value = air.stars;
  renderer.toneMappingExposure = table(EXPO, z);
  lastD = D;
  U.uHour.value = clock.h;
  // Daylight: dawn about 08:00, dusk about 17:00, in November.
  U.uSun.value = clock.day ? ss(7.5, 8.7, clock.h) * (1 - ss(16.3, 17.5, clock.h)) : 0;
  // The near heads follow the global switch.
  const st = jsLamp(t);
  refrMat.color.setRGB(...st.c).multiplyScalar(5 * st.l);
  lights.forEach(L => { L.color.setRGB(...st.c); L.intensity = LIGHT_I * st.l; });
  // From orbit thin lines would alias in a wide blur; the tilt eases off.
  tilt0.uniforms.uMax.value = tilt * (9 + 5 * z) * (1 - 0.65 * ss(0.55, 1, z));
  // The bloom spreads wider and softer from orbit, so thin lines glow round.
  bloom.radius = 0.4 + 0.45 * ss(0.4, 1, z);
  bloom.strength = 0.7 + 0.15 * ss(0.4, 1, z);
  tilt0.uniforms.uBand.value = 0.06 + 0.08 * z;
  // From orbit the ribbons need a lift to read.
  // A phone draws the country smaller, so its strips need more lift.
  ribMat.uniforms.uFar.value = 1 + (camera.aspect < 0.8 ? 60 : 36) * ss(0.35, 1, z) + 22 * ss(0.9, 1, z);
  padMat.uniforms.uFar.value = 1 + 40 * ss(0.3, 0.9, z);
  // The border line shows only once the climb is high.
  // At boot the outline draws in bright, then settles as the roads light.
  const bt = boot.t0 === null ? 0 : t - boot.t0;
  borderLine.material.uniforms.uLine.value = (0.06 * ss(0.35, 0.85, z) + 0.12 * (1 - ss(3, 9, bt))) * ss(0, 1.4, bt);
  // Traffic lights up behind the lamps.
  // By day car lamps barely show; the map styles keep their traffic.
  carMat.uniforms.uBoot.value = ss(4, 9, bt) * (look_.cars ? 1 : 0) * (1 - 0.85 * U.uSun.value);
  U.uBootK.value = ss(1.4, 7, bt);
  U.uVol.value = hourly(VOL, clock.h);
  // From high up the strips carry the light; the sprites add nothing but work.
  sprites.visible = z < 0.72 && look_.sprites;
  pads.visible = look_.sprites;
  // Lamp tiles far past the view's depth are sub-pixel and fogged; skip them.
  if (sprites.visible) {
    const reach = Math.max(6000, D * 3);
    sprites.children.forEach(m => { const b = m.geometry.boundingSphere; m.visible = camera.position.distanceTo(b.center) - b.radius < reach; });
  }
  // Streaks lengthen with altitude, like a longer exposure.
  carMat.uniforms.uExpo.value = 0.04 * Math.pow(500, z);
  // From orbit the cars stay a faint shimmer; jams show as red brake light.
  carMat.uniforms.uFar.value = 1 + 14 * ss(0.35, 1, z);
  carMat.uniforms.uHeadK.value = 2.2 - 1.7 * ss(0.4, 1, z);
  carMat.uniforms.uHeadAt.value = 0.55 + 0.4 * ss(0.4, 1, z);
  ribMat.uniforms.uAm.value = hourly(AM, clock.h);
  ribMat.uniforms.uPm.value = hourly(PM, clock.h);
  ribMat.uniforms.uJamK.value = ss(0.45, 0.85, z);
  placeMarks(frameDt);
  trainMat.uniforms.uFar.value = 1 + 10 * ss(0.35, 1, z);
  // Rail lines read clearer from altitude.
  railLines.material.uniforms.uRailK.value = (0.03 + 0.05 * ss(0.4, 1, z)) * (1 + U.uSun.value);
  grade.uniforms.uSeed.value = (t * 7.31) % 1;
  sky.material.uniforms.uInvVP.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse).invert();
  composer.render();
}
// The JS twin of lampState, for the near heads.
function jsLamp(t) {
  const n = jsNight(t);
  if (!U.uRush.value) return n;
  const h = U.uHour.value;
  if (h > 8.1 && h < 16.9) return { c: n.c, l: n.l * (1 - ss(8.1, 8.16, h)) };
  if (h >= 16.9) { const w = U.uInstant.value ? 1 : ss(16.9, 17.6, h); return { c: n.c, l: n.l * (0.1 + 0.9 * w * w) }; }
  return n;
}
function jsNight(t) {
  if (!U.uOn.value) { const k = 1 - Math.min(1, Math.max(0, (t - U.uOffT.value) / 0.35)); return { c: SOD, l: k * k }; }
  const tt = t - U.uSwT.value - 0.3;
  if (tt < 0) return { c: PINK, l: 0 };
  const h = U.uHot.value, w = h + (1 - h) * (1 - (1 - Math.min(1, tt / 6)) ** 3);
  const mix = (a, b, f) => a.map((v, i) => v + (b[i] - v) * f);
  const c = w < 0.45 ? mix(PINK, SALMON, ss(0, 0.45, w)) : mix(SALMON, SOD, ss(0.45, 0.9, w));
  return { c, l: 0.1 + 0.9 * w * w };
}

/* ---------- styles ---------- */
// Each style swaps lamp colours, the ground, the flags and what draws.
const STYLES = {
  sodium: { lamp: [0.72, 0.17, 62], pink: [0.5, 0.17, 12], salmon: [0.62, 0.15, 35], instant: 0, sprites: true, cars: true, scan: 0,
    fog: [0.005, 0.006, 0.012], zen: [0.12, 0.03, 262], line: [0.8, 0.04, 245, 1], flag: 'oklch(0.9 0.12 72)', glow: 'oklch(0.7 0.18 58 / 0.8)' },
  led: { lamp: [0.86, 0.03, 240], instant: 1, sprites: true, cars: true, scan: 0,
    fog: [0.006, 0.007, 0.013], zen: [0.12, 0.03, 255], line: [0.8, 0.04, 245, 1], flag: 'oklch(0.95 0.03 240)', glow: 'oklch(0.78 0.07 240 / 0.8)' },
  tactical: { lamp: [0.85, 0.13, 195], instant: 1, sprites: false, cars: true, scan: 1, rail: [0.85, 0.15, 85],
    fog: [0.002, 0.008, 0.01], zen: [0.1, 0.03, 210], line: [0.85, 0.13, 195, 2.5], flag: 'oklch(0.9 0.12 190)', glow: 'oklch(0.72 0.14 200 / 0.85)' },
  thermal: { lamp: [0.8, 0.17, 55], instant: 1, sprites: false, cars: false, scan: 0, rail: [0.7, 0.12, 290],
    fog: [0.006, 0.002, 0.01], zen: [0.08, 0.04, 310], line: [0.6, 0.2, 330, 1.6], flag: 'oklch(0.93 0.13 95)', glow: 'oklch(0.68 0.2 40 / 0.8)' },
};
let look_ = STYLES.sodium;
act.style = v => {
  look_ = STYLES[v] ?? STYLES.sodium;
  SOD = linFit(...look_.lamp);
  PINK = look_.pink ? linFit(...look_.pink) : SOD;
  SALMON = look_.salmon ? linFit(...look_.salmon) : SOD;
  U.uSod.value.set(...SOD); U.uPink.value.set(...PINK); U.uSalmon.value.set(...SALMON);
  U.uInstant.value = look_.instant;
  U.uStyle.value = ['sodium', 'led', 'tactical', 'thermal'].indexOf(v) < 0 ? 0 : ['sodium', 'led', 'tactical', 'thermal'].indexOf(v);
  sky.material.uniforms.uZen.value.set(...linFit(...look_.zen));
  borderLine.material.uniforms.uLineC.value.set(...linFit(...look_.line.slice(0, 3))).multiplyScalar(look_.line[3]);
  grade.uniforms.uScan.value = look_.scan;
  railLines.material.uniforms.uRailC.value.set(...linFit(...(look_.rail ?? [0.75, 0.06, 170])));
  markLayer.style.setProperty('--flag', look_.flag);
  markLayer.style.setProperty('--glow', look_.glow);
  try { localStorage.setItem('stimming.motorway.style', v); } catch {}
  wake(); draw();
};

/* ---------- boot ---------- */
// The page opens on the dark outline; the network then strikes up from Brussels.
const boot = { t0: null };
U.uOn.value = 1; U.uHot.value = 0; U.uSwT.value = 1e6;
function bootUp() {
  boot.t0 = nowS();
  U.uSwT.value = boot.t0 + 1.4;
  U.uRipV.value = 60000;
  U.uRip.value.set(...geo(4.352, 50.847));
  busyUntil = performance.now() + 16000;
  wake();
}

/* ---------- frame loop ---------- */
let raf = 0, lastT = 0, visible = true, lastInput = performance.now(), busyUntil = 0, frameDt = 0.016, lastDraw = 0;
// Traffic drifts for 60 s after the last input, then eases to a stop over 2 s.
const awake = now => now - lastInput < 62000;
function tick(now) {
  raf = 0;
  const dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0.016;
  lastT = now;
  let moving = false;
  try {
    if (Math.abs(zTo - z) > 1e-4) { z = reduced() ? zTo : z + (zTo - z) * (1 - Math.exp(-dt * 4)); moving = true; } else z = zTo;
    for (const k of ['d', 'h', 'size', 'halo', 'glow', 'wide', 'stars']) {
      const d = airTo[k] - air[k];
      if (Math.abs(d) > Math.abs(airTo[k]) * 1e-3) { air[k] += d * (1 - Math.exp(-dt * 2.5)); moving = true; } else air[k] = airTo[k];
    }
    traffic = 1 - ss(60000, 62000, now - lastInput);
    if (Math.abs(panTo.x - pan.x) + Math.abs(panTo.z - pan.z) > 0.01) { pan.lerp(panTo, reduced() ? 1 : 1 - Math.exp(-dt * 4)); moving = true; } else pan.copy(panTo);
    const lively = moving || press || now < busyUntil || clock.day;
    // Drifting traffic draws at 30 fps.
    if (!lively && now - lastDraw < 31) return;
    frameDt = lastDraw ? Math.min(0.1, (now - lastDraw) / 1000) : dt;
    lastDraw = now;
    // The study's day plays on a loop, or holds where it was scrubbed.
    if (clock.day) {
      if (study.playing) { clock.h += clock.rate * frameDt; if (clock.h >= 28) clock.h -= 24; }
      if (now - jamAt > 200) { jamAt = now; measureJams(); }
    }
    localFade = 1 - ss(0.22, 0.4, z);
    if (traffic > 0 || clock.day) { stepTraffic(frameDt, z > 0.5 ? 4 : 1); if (atlas) stepTrains(frameDt); }
    draw();
    watch(now, lively);
  } finally {
    const t = performance.now();
    if (visible && !document.hidden && (moving || press || t < busyUntil || awake(t) || clock.day)) raf = requestAnimationFrame(tick);
    else lastT = 0;
  }
}
function wake() {
  lastInput = performance.now();
  if (!raf && visible && !document.hidden) raf = requestAnimationFrame(tick);
}
/* Performance ladder: slow frames step quality down a rung, never back up. */
let watchFrom = 0, watchN = 0, watchSum = 0, prevDraw = 0;
function watch(now, lively) {
  const gap = now - prevDraw;
  prevDraw = now;
  if (gap > 200) { watchFrom = now; watchN = watchSum = 0; return; }
  if (!watchFrom) watchFrom = now;
  if (now - watchFrom < 4000) return;
  watchN++; watchSum += gap;
  if (watchN < 2 || now - watchFrom < 6000) return;
  if (watchSum / watchN > (lively ? 1000 / 38 : 1000 / 22) && rung < 2) { rung++; resize(); }
  watchFrom = now - 4000; watchN = watchSum = 0;
}
whenVisible(stage, vis => {
  visible = vis;
  if (!vis) { cancelAnimationFrame(raf); raf = 0; lastT = 0; return; }
  draw();
  wake();
});
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
onReducedChange(() => wake());

/* ---------- input ---------- */
const setZoom = (v, fromSlider = false) => {
  v = Math.min(1, Math.max(0, v));
  // Zooming in draws the pan home, so the last step lands on the jam shot.
  if (v < zTo) panTo.multiplyScalar(Math.min(1, ss(0.02, 0.3, v) / Math.max(1e-3, ss(0.02, 0.3, zTo))));
  zTo = v;
  if (!fromSlider) ui.slider?.set(zTo);
  wake();
};
// The ground point under a client position, or null above the horizon.
const ray = new THREE.Raycaster(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), ndc = new THREE.Vector2();
function groundAt(cx, cy) {
  const r = stage.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.ray.intersectPlane(ground, new THREE.Vector3());
}
// Pan stays within reach of the country.
const PAN_BOX = (() => {
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  BORDER_M.forEach(([x, z]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); });
  return { x0: x0 - 40000, x1: x1 + 40000, z0: z0 - 40000, z1: z1 + 40000 };
})();
function clampPan(v) {
  const base = new THREE.Vector3().lerpVectors(AIM, CENTRE, ss(0.42, 0.97, zTo));
  v.x = Math.min(PAN_BOX.x1, Math.max(PAN_BOX.x0, base.x + v.x)) - base.x;
  v.z = Math.min(PAN_BOX.z1, Math.max(PAN_BOX.z0, base.z + v.z)) - base.z;
  v.y = 0;
  return v;
}
// Zooming moves toward the pointer: the ground under it stays put.
function zoomAt(nz, cx, cy) {
  nz = Math.min(1, Math.max(0, nz));
  const p = groundAt(cx, cy);
  if (p && camera.position.distanceTo(p) < lastD * 6) {
    const k = 1 - Math.pow(Dfar / D0, nz - zTo);
    panTo.addScaledVector(p.sub(tgt).setY(0), k);
    clampPan(panTo);
  }
  setZoom(nz);
}
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const k = e.deltaMode === 1 ? 0.02 : 0.0006;
  zoomAt(zTo + e.deltaY * k, e.clientX, e.clientY);
}, { passive: false });
// A press turns into a drag after 8 px; two fingers pinch the zoom.
let press = null;
const pts = new Map();
let pinch = null;
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: zTo };
    press = null;
  } else press = { id: e.pointerId, x: e.clientX, y: e.clientY, drag: false, hit: groundAt(e.clientX, e.clientY), pan: pan.clone() };
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && pts.size >= 2) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    zoomAt(pinch.z - Math.log(d / pinch.d) * 0.22, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    return;
  }
  if (!press || e.pointerId !== press.id) return;
  if (!press.drag && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { press.drag = true; stage.classList.add('held'); }
  if (!press.drag) return;
  // Grab the ground: the point pressed follows the pointer.
  if (!press.hit) return;
  pan.copy(press.pan); place(z);
  const now = groundAt(e.clientX, e.clientY);
  if (!now) return;
  pan.copy(press.pan).add(press.hit).sub(now);
  clampPan(pan);
  panTo.copy(pan);
  wake();
});
const end = e => {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (press && e.pointerId === press.id) { press = null; stage.classList.remove('held'); }
  wake();
};
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);
stage.addEventListener('keydown', e => {
  if (e.key === '+' || e.key === '=' || e.key === 'ArrowUp') { setZoom(zTo + 0.05); e.preventDefault(); }
  if (e.key === '-' || e.key === 'ArrowDown') { setZoom(zTo - 0.05); e.preventDefault(); }
  // In the study, left and right step the hour by 15 minutes.
  if (study.on && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    study.playing = false; playBtn.textContent = 'Play';
    clock.h = Math.min(28, Math.max(4, clock.h + (e.key === 'ArrowRight' ? 0.25 : -0.25)));
    measureJams(); wake(); e.preventDefault();
  }
});

/* ---------- bar ---------- */
act.zoom = v => setZoom(v, true);
act.air = v => { airTo = AIR[v] ?? AIR.haze; wake(); };
act.tilt = v => { tilt = v; draw(); };
act.near = on => { land.material.uniforms.uNear.value = sky.material.uniforms.uNear.value = on ? 1 : 0; draw(); };
// Switch: all lamps die, or strike again in a ripple from the view centre.
act.sw = () => {
  const t = nowS();
  if (U.uOn.value) { U.uOn.value = 0; U.uOffT.value = t; busyUntil = performance.now() + 600; }
  else {
    // A lamp that went out moments ago is still hot and restrikes orange.
    U.uHot.value = Math.exp(-(t - U.uOffT.value) / 20);
    // Ripple speed grows with altitude, so the country lights in seconds.
    U.uRipV.value = Math.max(500, lastD * 0.25);
    U.uOn.value = 1; U.uSwT.value = t; U.uRip.value.set(tgt.x, tgt.z);
    busyUntil = performance.now() + 1000 * (8 + 300000 / U.uRipV.value);
  }
  wake();
};
// Rush opens the study and plays a weekday from 04:00; pressed again, it closes.
function endDay() {
  clock.day = false; clock.h = 17.2; study.on = false;
  measureJams();
  U.uRush.value = 0;
  panel.classList.remove('on'); strip.classList.remove('on'); tip.classList.remove('on');
}
act.rush = () => {
  if (clock.day) { endDay(); wake(); return; }
  if (!study.curves) { dayCurves(); buildChart(); }
  clock.day = true; clock.h = 4; study.on = true; study.playing = true; playBtn.textContent = 'Pause';
  U.uRush.value = 1;
  measureJams();
  if (atlas) { panel.classList.add('on'); strip.classList.add('on'); buildChart(); }
  wake();
};
act.atlas = on => {
  atlas = on; markLayer.hidden = !on; trains.visible = on;
  panel.classList.toggle('on', on && clock.day); strip.classList.toggle('on', on && clock.day);
  if (on && clock.day) buildChart();
  draw(); wake();
};
act.reset = () => {
  if (clock.day) endDay();
  pan.set(0, 0, 0); panTo.set(0, 0, 0);
  ui.setting('air')?.set('haze'); airTo = AIR.haze;
  ui.setting('tilt')?.set(0.6); tilt = 0.6;
  look.yaw = look.pitch = 0;
  if (!U.uOn.value) act.sw();
  setZoom(1);
};
act.air(ui.setting('air')?.value ?? 'haze');
// The style is remembered per viewer.
{
  let v = 'sodium';
  try { v = localStorage.getItem('stimming.motorway.style') || 'sodium'; } catch {}
  if (!STYLES[v]) v = 'sodium';
  ui.choice?.set(v);
  act.style(v);
}
Object.assign(air, airTo);
act.near(ui.setting('near')?.value ?? true);
act.atlas(ui.setting('atlas')?.value ?? false);

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  markReady();
  // The boot starts as the intro clears.
  setTimeout(bootUp, reduced() ? 0 : 1200);
}, () => { canvas.classList.add('on'); markReady(); bootUp(); });
</script>
</body>
</html>
