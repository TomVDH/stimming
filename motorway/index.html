<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.1 0.015 262); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lit motorway</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Lit motorway: one sodium lamp, then the whole lit network from above. */
:root { --stage: oklch(0.08 0.012 262); }
.stage--motorway { touch-action: none; cursor: grab; }
.stage--motorway.held { cursor: grabbing; }
.stage--motorway canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--motorway canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--motorway canvas { transition: none; } }
/* The map credit stays small and quiet. */
.about .credit { font-size: 12px; opacity: 0.55; margin: 0.4em 0 0; }
.about .credit a { color: inherit; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Lit motorway</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--motorway" id="stage" tabindex="0" role="application" aria-label="A sodium lamp over a motorway at night. Zoom out to see the whole lit motorway network of the country.">
      <p class="fail" hidden>Lit motorway needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Lit motorway</h1>
    <p class="credit">Roads and border © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, ODbL.</p>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { initPage, whenVisible, pixelRatio, onQuality, linFit, reduced, onReducedChange } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const stage = document.getElementById('stage');
// Bar handlers bind once the scene exists.
const act = { air() {}, zoom() {}, sw() {}, tilt() {}, near() {}, reset() {} };
const QS = new URLSearchParams(location.search);
const T0 = performance.now();
const nowS = () => (performance.now() - T0) / 1000;
const ui = initPage({ id: 'motorway', bar: {
  choice: { label: 'Air', value: 'haze', options: [
    { value: 'clear', label: 'Clear' }, { value: 'haze', label: 'Haze' }, { value: 'fog', label: 'Fog' },
  ], onPick: v => act.air(v) },
  slider: { label: 'Zoom', min: 0, max: 1, step: 0.001, value: QS.has('z') ? +QS.get('z') : 0, onInput: v => act.zoom(v) },
  actions: [
    { verb: 'switch', key: 'S', onPress: () => act.sw() },
    { verb: 'rush', key: 'R', onPress: () => {} },
  ],
  settings: [
    { type: 'slider', id: 'tilt', label: 'Tilt-shift', min: 0, max: 1, step: 0.01, value: 0.6, persist: true, onInput: v => act.tilt(v) },
    { type: 'toggle', id: 'near', label: 'Neighbours', value: true, persist: true, onToggle: on => act.near(on) },
  ],
  reset: () => act.reset(),
  quality: true,
  keys: [['scroll', 'zoom'], ['drag', 'look']],
} });
// Traffic comes in Task 3.
if (ui.action('rush')) ui.action('rush').disabled = true;

let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  if (!renderer.capabilities.isWebGL2) throw new Error('no WebGL 2');
} catch (err) {
  stage.querySelector('.fail').hidden = false; ui.hideControls?.(); markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const canvas = renderer.domElement;
stage.prepend(canvas);

/* ---------- geography ---------- */
// Equirectangular projection around 50.6 N, 4.5 E, in metres.
// x runs east and z runs south.
const LAT0 = 50.6, LON0 = 4.5;
const KX = 111320 * Math.cos(LAT0 * Math.PI / 180), KY = 110570;
const geoRaw = (lon, lat) => [(lon - LON0) * KX, -(lat - LAT0) * KY];

// The coast, west to north-east. The sea lies to its left.
const COAST = [[1.2, 50.85], [2.0, 51.0], [2.54, 51.09], [3.37, 51.37], [3.6, 51.5], [3.9, 51.7], [4.1, 52.0], [4.6, 52.6]];
// Towns: lon, lat, radius in km, level. Inside the border they glow warm.
const TOWNS = [
  [4.36, 50.85, 9, 1], [4.41, 51.22, 7, 0.9], [3.72, 51.05, 5, 0.7], [5.57, 50.63, 6, 0.75], [4.44, 50.41, 6, 0.7],
  [3.22, 51.21, 3.5, 0.5], [4.87, 50.47, 3.5, 0.45], [4.7, 50.88, 3, 0.45], [3.95, 50.45, 3, 0.4], [4.48, 51.03, 3, 0.4],
  [5.34, 50.93, 3, 0.4], [3.26, 50.83, 3.5, 0.45], [2.92, 51.22, 3, 0.45], [4.04, 50.94, 2.5, 0.35], [5.5, 50.96, 3, 0.35],
  [3.39, 50.61, 2.5, 0.3], [5.86, 50.59, 2.5, 0.3], [5.82, 49.68, 2, 0.25], [4.3, 51.28, 6, 0.5],
  [4.14, 51.165, 2.5, 0.35], [3.12, 50.945, 2.2, 0.3], [4.95, 51.32, 2.2, 0.3], [4.19, 50.48, 3, 0.4], [4.32, 50.6, 2, 0.25],
  [4.61, 50.715, 2, 0.25], [5.24, 50.52, 1.8, 0.22], [5.19, 50.815, 2, 0.25], [2.88, 50.85, 2, 0.25], [4.1, 51.03, 2, 0.25],
  [4.48, 50.9, 2, 0.35], [3.8, 51.11, 3.5, 0.35], [5.0, 51.16, 2, 0.25], [4.93, 50.8, 1.8, 0.2],
  [3.06, 50.63, 10, 0.8], [5.69, 50.85, 4, 0.45], [6.08, 50.78, 6, 0.6], [5.47, 51.44, 6, 0.6], [4.78, 51.59, 5, 0.5],
  [6.13, 49.61, 5, 0.5], [3.52, 50.36, 4, 0.4], [2.37, 51.03, 5, 0.5], [4.48, 51.92, 10, 0.8], [6.95, 50.94, 12, 0.9],
  [3.83, 51.33, 3, 0.3], [4.3, 51.49, 3, 0.35], [6.17, 49.12, 6, 0.5],
];
const HERO_LL = [3.965, 50.95];

// Roads and border come from OpenStreetMap, simplified offline into roads.json.
// Classes: 0 motorway, 1 trunk, 2 primary, 3 a neighbour's motorway.
let DATA;
try {
  const r = await fetch('./roads.json');
  if (!r.ok) throw new Error(`roads.json ${r.status}`);
  DATA = await r.json();
} catch (err) {
  const f = stage.querySelector('.fail');
  f.textContent = 'Lit motorway could not load its road map. Reload to try again.';
  f.hidden = false; ui.hideControls?.(); markReady();
  throw err;
}
const decode = a => {
  const out = [];
  let x = 0, y = 0;
  for (let i = 0; i < a.length; i += 2) { x += a[i]; y += a[i + 1]; out.push(geoRaw(x / DATA.q, y / DATA.q)); }
  return out;
};
const ROADS = DATA.roads.map(r => ({ c: r[0], o: r[1] === 1, p: decode(r.slice(2)) }));

/* ---------- network ---------- */
// Lamps stand every 50 m on fast roads and every 40 m on main roads.
const HEAD_H = 12, HEAD_OFF = 4;
const GAP = [50, 50, 40, 50], STEP = [40, 60, 110, 220];
// Hermite curves smooth each polyline; samples fall evenly along it.
// A baked per-point value F rides along, linearly, into fo.
function sample(P, step, F = null, fo = null) {
  const out = [], n = P.length;
  const L = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]) || 1e-6;
  for (let i = 0; i < n - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(n - 1, i + 2)];
    const l1 = L(p1, p2), k1 = l1 / (L(p0, p1) + l1), k2 = l1 / (l1 + L(p2, p3));
    // Tangents scale to the segment, so short segments do not overshoot.
    const m1 = [(p2[0] - p0[0]) * k1, (p2[1] - p0[1]) * k1], m2 = [(p3[0] - p1[0]) * k2, (p3[1] - p1[1]) * k2];
    const k = Math.max(1, Math.ceil(l1 / step));
    for (let j = 0; j < k; j++) {
      const t = j / k, t2 = t * t, t3 = t2 * t;
      const h00 = 2 * t3 - 3 * t2 + 1, h10 = t3 - 2 * t2 + t, h01 = -2 * t3 + 3 * t2, h11 = t3 - t2;
      out.push([h00 * p1[0] + h10 * m1[0] + h01 * p2[0] + h11 * m2[0], h00 * p1[1] + h10 * m1[1] + h01 * p2[1] + h11 * m2[1]]);
      if (F) fo.push((F[i] + (F[i + 1] - F[i]) * t) / 100);
    }
  }
  out.push(P[n - 1].slice());
  if (F) fo.push(F[n - 1] / 100);
  return out;
}
// Light per sample: 1 at home; past the border the baked fade.
const dense = ROADS.map((R, r) => {
  const F = DATA.fade[r] || null, lit = F ? [] : null;
  const p = sample(R.p, STEP[R.c], F, lit), s = [0];
  for (let i = 1; i < p.length; i++) s.push(s[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
  return { p, s, lit };
});
const tangent = (p, i) => {
  const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)];
  const l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
  return [(b[0] - a[0]) / l, (b[1] - a[1]) / l];
};

// The hero carriageway: the motorway sample nearest the hero lon, lat.
const [hx, hz] = geoRaw(...HERO_LL);
let hA = -1, hAi = 0, hd = Infinity;
dense.forEach((d, r) => {
  if (ROADS[r].c !== 0) return;
  d.p.forEach((q, i) => { const e = Math.hypot(q[0] - hx, q[1] - hz); if (e < hd) { hd = e; hA = r; hAi = i; } });
});
const TA = tangent(dense[hA].p, hAi), PA = dense[hA].p[hAi].slice();
// n is the right-hand side of travel; the other carriageway lies to the left.
const NA = [-TA[1], TA[0]];
// The other carriageway: the nearest motorway segment that runs the other way.
let hB = -1, hBs = 0, sep = 18;
{
  let best = 80;
  dense.forEach((d, r) => {
    if (r === hA || ROADS[r].c !== 0) return;
    const { p, s } = d;
    for (let i = 0; i < p.length - 1; i++) {
      const a = p[i], b = p[i + 1], dx = b[0] - a[0], dz = b[1] - a[1], l2 = dx * dx + dz * dz || 1;
      const t = Math.max(0, Math.min(1, ((PA[0] - a[0]) * dx + (PA[1] - a[1]) * dz) / l2));
      const e = Math.hypot(a[0] + dx * t - PA[0], a[1] + dz * t - PA[1]);
      if (e < best && (dx * TA[0] + dz * TA[1]) / Math.sqrt(l2) < -0.8) { best = e; hB = r; hBs = s[i] + Math.sqrt(l2) * t; sep = e; }
    }
  });
}
sep = Math.min(40, Math.max(12, sep));
// The reserve's centre at the hero lamp is the world origin, for precision.
const ORIGIN = [PA[0] - NA[0] * sep / 2, PA[1] - NA[1] * sep / 2];
dense.forEach(d => d.p.forEach(q => { q[0] -= ORIGIN[0]; q[1] -= ORIGIN[1]; }));
const geo = (lon, lat) => { const [x, z] = geoRaw(lon, lat); return [x - ORIGIN[0], z - ORIGIN[1]]; };
const shift = pts => pts.map(([x, z]) => [x - ORIGIN[0], z - ORIGIN[1]]);
const BORDER_M = shift(decode(DATA.border));
const OUTLINE = DATA.outline.map(a => shift(decode(a)));
const HT = new THREE.Vector3(TA[0], 0, TA[1]);
const HN = new THREE.Vector3(NA[0], 0, NA[1]);
// Lamp phase per road; both hero carriageways put a lamp at the hero station.
const PHASE = dense.map(() => 0);
PHASE[hA] = dense[hA].s[hAi] % GAP[0];
if (hB >= 0) PHASE[hB] = hBs % GAP[0];
// Heads hang left of travel on a carriageway; two-way roads hang them right.
const HOFF = ROADS.map(R => (R.o ? 5 : -5));
HOFF[hA] = sep / 2 - HEAD_OFF;
if (hB >= 0) HOFF[hB] = sep / 2 - HEAD_OFF;

// Point in polygon, by ray crossing; only the towns ask.
function inBelgium(x, z) {
  let c = false;
  for (let i = 0, j = BORDER_M.length - 1; i < BORDER_M.length; j = i++) {
    const [xi, zi] = BORDER_M[i], [xj, zj] = BORDER_M[j];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) c = !c;
  }
  return c;
}

// A lamp's random seed; the ribbon shader hashes the same way.
const hash = (k, r, side) => { const v = Math.sin(k * 12.9898 + r * 78.233 + side * 37.719) * 43758.5453; return v - Math.floor(v); };

/* ---------- shared GLSL ---------- */
const COMMON = /* glsl */`
uniform float uNow, uSwT, uOffT, uOn, uHot, uRipV;
uniform vec2 uRip;
uniform vec3 uSod, uPink, uSalmon;
uniform float uFogD, uFogH;
uniform vec3 uFogC;
float hash3(float k, float r, float side) { return fract(sin(k * 12.9898 + r * 78.233 + side * 37.719) * 43758.5453); }
// A lamp's colour and level from its switch time.
vec4 lampState(vec2 xz, float rnd) {
  if (uOn < 0.5) {
    float k = 1.0 - clamp((uNow - uOffT) / 0.35, 0.0, 1.0);
    return vec4(uSod, k * k);
  }
  float t = uNow - uSwT - rnd * 1.4 - length(xz - uRip) / uRipV;
  if (t < 0.0) return vec4(uPink, 0.0);
  // A cold lamp starts on neon, pink-red; sodium takes over as it warms.
  float w = uHot + (1.0 - uHot) * (1.0 - pow(1.0 - clamp(t / 6.0, 0.0, 1.0), 3.0));
  vec3 c = w < 0.45 ? mix(uPink, uSalmon, smoothstep(0.0, 0.45, w)) : mix(uSalmon, uSod, smoothstep(0.45, 0.9, w));
  return vec4(c, 0.1 + 0.9 * w * w);
}
// Transmittance through exponential height fog, camera to w.
float fogT(vec3 w) {
  vec3 r = w - cameraPosition;
  float L = length(r);
  float h0 = max(cameraPosition.y, 0.0), h1 = max(w.y, 0.0), dh = h1 - h0;
  float tau = abs(dh) < 1.0 ? uFogD * L * exp(-h0 / uFogH)
    : uFogD * L * uFogH / dh * (exp(-h0 / uFogH) - exp(-h1 / uFogH));
  return exp(-tau);
}
`;

/* ---------- scene ---------- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.3, 60000);
const SOD = linFit(0.72, 0.17, 62), PINK = linFit(0.5, 0.17, 12), SALMON = linFit(0.62, 0.15, 35);
const U = {
  uNow: { value: 0 }, uSwT: { value: -100 }, uOffT: { value: -100 }, uOn: { value: 1 }, uHot: { value: 1 },
  uRipV: { value: 2000 }, uRip: { value: new THREE.Vector2() },
  uSod: { value: new THREE.Vector3(...SOD) }, uPink: { value: new THREE.Vector3(...PINK) }, uSalmon: { value: new THREE.Vector3(...SALMON) },
  uFogD: { value: 0.00015 }, uFogH: { value: 300 }, uFogC: { value: new THREE.Vector3() },
  // Metres per CSS pixel, per metre of view depth.
  uPxK: { value: 0.001 },
};

/* sky: a full-screen triangle behind everything */
const sky = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.ShaderMaterial({
  uniforms: { ...U, uInvVP: { value: new THREE.Matrix4() }, uZen: { value: new THREE.Vector3(...linFit(0.12, 0.03, 262)) }, uStars: { value: 1 } },
  vertexShader: /* glsl */`
    varying vec2 vNdc;
    void main() { vNdc = position.xy; gl_Position = vec4(position.xy, 1.0, 1.0); }`,
  fragmentShader: /* glsl */`
    ${COMMON}
    uniform mat4 uInvVP; uniform vec3 uZen; uniform float uStars;
    varying vec2 vNdc;
    void main() {
      vec4 a = uInvVP * vec4(vNdc, -1.0, 1.0), b = uInvVP * vec4(vNdc, 1.0, 1.0);
      vec3 d = normalize(b.xyz / b.w - a.xyz / a.w);
      float e = max(d.y, 0.0);
      vec3 c = mix(uFogC, uZen, smoothstep(0.0, 0.35, pow(e, 0.6)));
      // Faint stars where the sky is clear.
      vec2 g = floor(vec2(atan(d.z, d.x) * 300.0, asin(clamp(d.y, -1.0, 1.0)) * 300.0));
      float h = fract(sin(dot(g, vec2(12.9898, 78.233))) * 43758.5453);
      c += step(0.9975, h) * smoothstep(0.05, 0.4, e) * uStars * 0.04;
      gl_FragColor = vec4(c, 1.0);
    }`,
  depthWrite: false, depthTest: false,
}));
sky.geometry.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
sky.frustumCulled = false;
sky.renderOrder = -2;
scene.add(sky);

/* land: one dark plane with towns and the sea */
const coastM = COAST.map(([lo, la]) => new THREE.Vector2(...geo(lo, la)));
const townsIn = TOWNS.map(([lo, la, r, l]) => { const [x, z] = geo(lo, la); return { v: new THREE.Vector4(x, z, r * 1000, l), home: inBelgium(x, z) }; });
const land = new THREE.Mesh(new THREE.PlaneGeometry(1.4e6, 1.4e6).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  uniforms: {
    ...U,
    uTown: { value: townsIn.map(t => t.v) },
    uHome: { value: townsIn.map(t => (t.home ? 1 : 0)) },
    uCoast: { value: coastM },
    uWarm: { value: new THREE.Vector3(...linFit(0.78, 0.12, 64)) },
    uCool: { value: new THREE.Vector3(...linFit(0.86, 0.03, 250)) },
    uNear: { value: 1 },
    uTownK: { value: 0.03 },
  },
  vertexShader: /* glsl */`
    varying vec3 vW;
    void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: /* glsl */`
    ${COMMON}
    #define NT ${TOWNS.length}
    #define NC ${COAST.length}
    uniform vec4 uTown[NT];
    uniform float uHome[NT];
    uniform vec2 uCoast[NC];
    uniform vec3 uWarm, uCool;
    uniform float uNear, uTownK;
    varying vec3 vW;
    float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float vnoise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + 1.0), f.x), f.y);
    }
    // Signed distance to the coast; negative on the sea side.
    float coast(vec2 p) {
      float best = 1e9, sgn = 1.0;
      for (int i = 0; i < NC - 1; i++) {
        vec2 a = uCoast[i], b = uCoast[i + 1], ab = b - a;
        float t = clamp(dot(p - a, ab) / dot(ab, ab), 0.0, 1.0);
        float d = length(p - a - ab * t);
        if (d < best) { best = d; sgn = sign(ab.x * (p.y - a.y) - ab.y * (p.x - a.x)); }
      }
      return best * sgn;
    }
    void main() {
      vec2 p = vW.xz;
      float fw = max(fwidth(p.x), fwidth(p.y));
      // Fields and woods, faint, fading to flat where they alias.
      float n = vnoise(p / 900.0) * 0.6 + vnoise(p / 230.0) * 0.4;
      n = mix(n, 0.5, smoothstep(60.0, 300.0, fw));
      vec3 col = vec3(0.005, 0.0065, 0.01) * (0.45 + 1.1 * n);
      float sea = smoothstep(max(40.0, fw), -max(40.0, fw), coast(p));
      col = mix(col, vec3(0.0006, 0.0009, 0.002), sea);
      // Towns: a soft dome and a speckle of streets.
      vec3 glow = vec3(0.0);
      float sp = smoothstep(0.62, 0.86, vnoise(p / 55.0)) * (0.5 + vnoise(p / 400.0));
      sp = mix(sp, 0.16, smoothstep(12.0, 80.0, fw));

// Portrait hangs over the road, facing the overpass; the lamp row runs up the frame.
const YAW0 = yawFrom(0.436), YAW0P = yawFrom(Math.PI - 0.12);
// The country's centre and its long axis, Ostend to Arlon.
const CENTRE = (() => { const [x, z] = geo(4.42, 50.66); return new THREE.Vector3(x, 0, z); })();
const AXIS = (() => { const [x0, z0] = geo(5.82, 49.68), [x1, z1] = geo(2.92, 51.21); return Math.atan2(z1 - z0, x1 - x0); })();
const D0 = 15;
let Dfar = 4.4e5, yawFar = -Math.PI / 2;
const PITCH = [[0, 0.2], [0.1, 0.06], [0.25, -0.36], [0.5, -0.85], [0.75, -1.1], [1, -1.22]];
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const table = (T, z) => {
  for (let i = 1; i < T.length; i++) if (z <= T[i][0]) return T[i - 1][1] + (T[i][1] - T[i - 1][1]) * ss(T[i - 1][0], T[i][0], z);
  return T[T.length - 1][1];
};
const angLerp = (a, b, t) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return a + d * t; };
const look = { yaw: 0, pitch: 0 };
const tgt = new THREE.Vector3();
function place(z) {
  const portrait = camera.aspect < 0.8, near = 1 - ss(0, 0.25, z);
  // Portrait hangs higher over the road and looks down along it.
  const d0 = portrait ? D0 * 3 : D0;
  const D = d0 * Math.pow(Dfar / d0, z);
  const pitch = table(PITCH, z) + look.pitch * (1 - z) - (portrait ? 0.4 * near : 0);
  // A small orbit in the middle of the climb gives parallax.
  const yaw = angLerp((portrait ? YAW0P : YAW0) + 0.3 * Math.sin(Math.PI * Math.min(1, z / 0.55)), yawFar, ss(0.5, 1, z)) + look.yaw;
  tgt.lerpVectors(HEAD, CENTRE, ss(0.42, 0.97, z));
  // Portrait aims below the head, so the head sits in the upper third.
  if (portrait) tgt.y -= 3 * near;
  const f = new THREE.Vector3(Math.cos(pitch) * Math.cos(yaw), Math.sin(pitch), Math.cos(pitch) * Math.sin(yaw));
  camera.position.copy(tgt).addScaledVector(f, -D);
  camera.up.set(0, 1, 0);
  camera.lookAt(tgt);
  camera.near = Math.max(0.3, D * 0.03);
  camera.far = Math.max(60000, D * 5);
  camera.updateProjectionMatrix();
  return D;
}
// Fit the far shot to the border, in the camera's ground frame.
function fitFar() {
  const portrait = camera.aspect < 0.8;
  yawFar = portrait ? AXIS : -Math.PI / 2;
  const fx = Math.cos(yawFar), fz = Math.sin(yawFar);
  let u0 = 1e9, u1 = -1e9, v0 = 1e9, v1 = -1e9;
  BORDER_M.forEach(([x, z]) => {
    const dx = x - CENTRE.x, dz = z - CENTRE.z, u = dx * fx + dz * fz, v = -dx * fz + dz * fx;
    u0 = Math.min(u0, u); u1 = Math.max(u1, u); v0 = Math.min(v0, v); v1 = Math.max(v1, v);
  });
  const tv = Math.tan((camera.fov * Math.PI) / 360);
  const hu = Math.max(Math.abs(u0), Math.abs(u1)) * Math.sin(1.22), hv = Math.max(Math.abs(v0), Math.abs(v1));
  Dfar = Math.max(hu / tv, hv / (tv * camera.aspect)) * (portrait ? 0.92 : 0.94);
}

/* ---------- post ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// Tilt-shift: a round disc blur grows away from a sharp band through the centre.
const tilt0 = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uPx: { value: new THREE.Vector2() }, uMax: { value: 6 }, uBand: { value: 0.1 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform vec2 uPx; uniform float uMax, uBand;
    varying vec2 vUv;
    void main() {
      float r = uMax * smoothstep(uBand, uBand + 0.42, abs(vUv.y - 0.5));
      // A clamp keeps hot cores from blowing the bloom into boxes.
      vec4 c = min(texture2D(tDiffuse, vUv), vec4(5.0));
      if (r < 0.3) { gl_FragColor = c; return; }
      vec4 acc = c; float wsum = 1.0;
      // A Vogel spiral of 28 taps gives round bokeh.
      for (int i = 1; i < 28; i++) {
        float fi = float(i), rr = sqrt(fi / 28.0), a = fi * 2.39996;
        acc += min(texture2D(tDiffuse, vUv + vec2(cos(a), sin(a)) * rr * r * uPx), vec4(5.0));
        wsum += 1.0;
      }
      gl_FragColor = acc / wsum;
    }`,
});
composer.addPass(tilt0);
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.7, 0.4, 0.7);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uSeed: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uSeed;
    varying vec2 vUv;
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 q = vUv - 0.5;
      c.rgb *= 1.0 - dot(q, q) * 0.9;
      float g = fract(sin(dot(vUv * 913.0 + uSeed, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
      c.rgb += g * 0.004;
      gl_FragColor = c;
    }`,
});
composer.addPass(grade);
composer.addPass(new OutputPass());

/* ---------- air ---------- */
// Density per metre, scale height, sprite size, halo level, ribbon glow.
const AIR = {
  clear: { d: 0.00003, h: 500, size: 4, halo: 0.02, glow: 0.03, wide: 18, stars: 1 },
  haze: { d: 0.00016, h: 300, size: 7, halo: 0.1, glow: 0.07, wide: 28, stars: 0.4 },
  fog: { d: 0.0011, h: 90, size: 16, halo: 0.22, glow: 0.18, wide: 60, stars: 0 },
};
const air = { ...AIR.haze };
let airTo = AIR.haze;

/* ---------- state ---------- */
let z = ui.slider?.value ?? 0, zTo = z, tilt = ui.setting('tilt')?.value ?? 0.6;
const size = { w: 1, h: 1 };
let rung = 0;
function resize() {
  const r = stage.getBoundingClientRect();
  size.w = Math.max(1, Math.round(r.width)); size.h = Math.max(1, Math.round(r.height));
  const pr = pixelRatio(size.w, size.h, { maxDpr: 2, budget: 1.8e6, low: rung > 0 });
  renderer.setPixelRatio(pr);
  renderer.setSize(size.w, size.h, false);
  composer.setPixelRatio(pr);
  composer.setSize(size.w, size.h);
  const b = rung > 1 ? 0.35 : 0.5;
  bloom.resolution.set(size.w * pr * b, size.h * pr * b);
  camera.aspect = size.w / size.h;
  camera.fov = camera.aspect < 0.8 ? 58 : 40;
  U.uPxK.value = (2 * Math.tan((camera.fov * Math.PI) / 360)) / size.h;
  tilt0.uniforms.uPx.value.set(1 / size.w, 1 / size.h);
  fitFar();
  draw();
}

// Exposure by zoom: the country needs more than the close lamp.
const EXPO = [[0, 0.9], [0.3, 1.1], [0.6, 1.6], [1, 2.1]];
function draw() {
  const t = nowS();
  U.uNow.value = t;
  const D = place(z);
  // Air eases toward the chip.
  ribMat.uniforms.uHalf.value = 60 + air.wide * 2;
  ribMat.uniforms.uGlow.value = air.glow;
  ribMat.uniforms.uWide.value = air.wide;
  sprMat.uniforms.uSize.value = air.size;
  sprMat.uniforms.uHaloI.value = air.halo;
  sprMat.uniforms.uCore.value = 0.35 / air.size;
  U.uFogD.value = air.d; U.uFogH.value = air.h;
  // The fog colour: night blue, lit orange where the air is thick.
  const lvl = U.uOn.value ? 1 : 0;
  const glow = Math.min(1, air.d / 0.0011) * (1 - z * 0.7) * lvl;
  // Sky glow over a lit country never goes fully dark.
  const sg = 0.012 * lvl + 0.06 * glow;
  U.uFogC.value.set(0.005 + SOD[0] * sg, 0.006 + SOD[1] * sg, 0.012 + SOD[2] * sg);
  sky.material.uniforms.uStars.value = air.stars;
  renderer.toneMappingExposure = table(EXPO, z);
  // Ripple speed grows with altitude, so the country lights in seconds.
  U.uRipV.value = Math.max(500, D * 0.25);
  // The near heads follow the global switch.
  const st = jsLamp(t);
  refrMat.color.setRGB(...st.c).multiplyScalar(5 * st.l);
  lights.forEach(L => { L.color.setRGB(...st.c); L.intensity = LIGHT_I * st.l; });
  tilt0.uniforms.uMax.value = tilt * (9 + 5 * z);
  tilt0.uniforms.uBand.value = 0.06 + 0.08 * z;
  // From orbit the ribbons need a lift to read.
  // A phone draws the country smaller, so its strips need more lift.
  ribMat.uniforms.uFar.value = 1 + (camera.aspect < 0.8 ? 60 : 36) * ss(0.35, 1, z) + 22 * ss(0.9, 1, z);
  padMat.uniforms.uFar.value = 1 + 40 * ss(0.3, 0.9, z);
  // The border line shows only once the climb is high.
  borderLine.material.uniforms.uLine.value = 0.06 * ss(0.35, 0.85, z);
  // From high up the strips carry the light; the sprites add nothing but work.
  sprites.visible = z < 0.72;
  // Lamp tiles far past the view's depth are sub-pixel and fogged; skip them.
  if (sprites.visible) {
    const reach = Math.max(6000, D * 3);
    sprites.children.forEach(m => { const b = m.geometry.boundingSphere; m.visible = camera.position.distanceTo(b.center) - b.radius < reach; });
  }
  grade.uniforms.uSeed.value = (t * 7.31) % 1;
  sky.material.uniforms.uInvVP.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse).invert();
  composer.render();
}
// The JS twin of lampState, for the near heads.
function jsLamp(t) {
  if (!U.uOn.value) { const k = 1 - Math.min(1, Math.max(0, (t - U.uOffT.value) / 0.35)); return { c: SOD, l: k * k }; }
  const tt = t - U.uSwT.value - 0.3;
  if (tt < 0) return { c: PINK, l: 0 };
  const h = U.uHot.value, w = h + (1 - h) * (1 - (1 - Math.min(1, tt / 6)) ** 3);
  const mix = (a, b, f) => a.map((v, i) => v + (b[i] - v) * f);
  const c = w < 0.45 ? mix(PINK, SALMON, ss(0, 0.45, w)) : mix(SALMON, SOD, ss(0.45, 0.9, w));
  return { c, l: 0.1 + 0.9 * w * w };
}

/* ---------- frame loop ---------- */
let raf = 0, lastT = 0, visible = true, lastInput = performance.now(), busyUntil = 0;
function tick(now) {
  raf = 0;
  const dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0.016;
  lastT = now;
  let moving = false;
  try {
    if (Math.abs(zTo - z) > 1e-4) { z = reduced() ? zTo : z + (zTo - z) * (1 - Math.exp(-dt * 4)); moving = true; } else z = zTo;
    for (const k of ['d', 'h', 'size', 'halo', 'glow', 'wide', 'stars']) {
      const d = airTo[k] - air[k];
      if (Math.abs(d) > Math.abs(airTo[k]) * 1e-3) { air[k] += d * (1 - Math.exp(-dt * 2.5)); moving = true; } else air[k] = airTo[k];
    }
    draw();
    watch(now);
  } finally {
    if (visible && !document.hidden && (moving || press || performance.now() < busyUntil)) raf = requestAnimationFrame(tick);
    else lastT = 0;
  }
}
function wake() {
  lastInput = performance.now();
  if (!raf && visible && !document.hidden) raf = requestAnimationFrame(tick);
}
/* Performance ladder: slow frames step quality down a rung, never back up. */
let watchFrom = 0, watchN = 0, watchSum = 0, prevDraw = 0;
function watch(now) {
  const gap = now - prevDraw;
  prevDraw = now;
  if (gap > 200) { watchFrom = now; watchN = watchSum = 0; return; }
  if (!watchFrom) watchFrom = now;
  if (now - watchFrom < 4000) return;
  watchN++; watchSum += gap;
  if (watchN < 2 || now - watchFrom < 6000) return;
  if (watchSum / watchN > 1000 / 38 && rung < 2) { rung++; resize(); }
  watchFrom = now - 4000; watchN = watchSum = 0;
}
whenVisible(stage, vis => {
  visible = vis;
  if (!vis) { cancelAnimationFrame(raf); raf = 0; lastT = 0; return; }
  draw();
  wake();
});
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
onReducedChange(() => wake());

/* ---------- input ---------- */
const setZoom = (v, fromSlider = false) => {
  zTo = Math.min(1, Math.max(0, v));
  if (!fromSlider) ui.slider?.set(zTo);
  wake();
};
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const k = e.deltaMode === 1 ? 0.02 : 0.0006;
  setZoom(zTo + e.deltaY * k);
}, { passive: false });
// A press turns into a drag after 8 px; two fingers pinch the zoom.
let press = null;
const pts = new Map();
let pinch = null;
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: zTo };
    press = null;
  } else press = { id: e.pointerId, x: e.clientX, y: e.clientY, drag: false, yaw: look.yaw, pitch: look.pitch };
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && pts.size >= 2) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    setZoom(pinch.z - Math.log(d / pinch.d) * 0.22);
    return;
  }
  if (!press || e.pointerId !== press.id) return;
  if (!press.drag && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { press.drag = true; stage.classList.add('held'); }
  if (!press.drag) return;
  const s = 1.6 / Math.max(size.w, size.h);
  look.yaw = Math.max(-0.5, Math.min(0.5, press.yaw - (e.clientX - press.x) * s));
  look.pitch = Math.max(-0.2, Math.min(0.2, press.pitch + (e.clientY - press.y) * s * 0.5));
  wake();
});
const end = e => {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (press && e.pointerId === press.id) { press = null; stage.classList.remove('held'); }
  wake();
};
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);
stage.addEventListener('keydown', e => {
  if (e.key === '+' || e.key === '=' || e.key === 'ArrowUp') { setZoom(zTo + 0.05); e.preventDefault(); }
  if (e.key === '-' || e.key === 'ArrowDown') { setZoom(zTo - 0.05); e.preventDefault(); }
});

/* ---------- bar ---------- */
act.zoom = v => setZoom(v, true);
act.air = v => { airTo = AIR[v] ?? AIR.haze; wake(); };
act.tilt = v => { tilt = v; draw(); };
act.near = on => { land.material.uniforms.uNear.value = on ? 1 : 0; draw(); };
// Switch: all lamps die, or strike again in a ripple from the view centre.
act.sw = () => {
  const t = nowS();
  if (U.uOn.value) { U.uOn.value = 0; U.uOffT.value = t; busyUntil = performance.now() + 600; }
  else {
    // A lamp that went out moments ago is still hot and restrikes orange.
    U.uHot.value = Math.exp(-(t - U.uOffT.value) / 20);
    U.uOn.value = 1; U.uSwT.value = t; U.uRip.value.set(tgt.x, tgt.z);
    busyUntil = performance.now() + 1000 * (8 + 300000 / U.uRipV.value);
  }
  wake();
};
act.reset = () => {
  ui.choice?.set('haze'); airTo = AIR.haze;
  ui.setting('tilt')?.set(0.6); tilt = 0.6;
  look.yaw = look.pitch = 0;
  if (!U.uOn.value) act.sw();
  setZoom(0);
};
act.air(ui.choice?.value ?? 'haze');
Object.assign(air, airTo);
act.near(ui.setting('near')?.value ?? true);

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  markReady();
}, () => { canvas.classList.add('on'); markReady(); });
</script>
</body>
</html>
