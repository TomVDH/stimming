    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">

<style>
/* Steel line: a whole steelworks cut open in one slice, ore to coils. */
:root { --stage: oklch(0.08 0.012 255); }
.stage--steelline { background: var(--stage); cursor: grab; }
.stage--steelline.is-dragging { cursor: grabbing; }
.stage--steelline canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--steelline canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--steelline canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Steel line</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--steelline" id="stage" tabindex="0" role="application" aria-label="A whole steelworks at night, cut open in one side slice like an ant farm. Ore trains tip into a pit at the left; a belt carries ore under the stockpiles to a blast furnace, whose skip cars climb the incline to its top. Inside the furnace the burden sinks and melts; at each tap the iron runs to a torpedo car. The car takes it to the converter shop, where a crane pours it into the converter and an oxygen blow throws a flame and sparks into the hood. The steel goes to the caster, which draws a glowing strand down an arc and cuts it into slabs. In the rolling mill the slabs are reheated, rolled back and forth, then race through six stands as thin red strip onto a coiler. Coils stack in the yard until a train takes them away. Tiny workers walk the gantries. Drag to pan along the line. Tap a building to rush it. Hold on the ore yard, or press Space, to bring a train. The Shift speed slider sets the pace of the works.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Steel line</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
