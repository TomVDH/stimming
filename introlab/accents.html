<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Toy accents</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* One tile per toy: its emblem and a bar in the accent from toys.json. */
body { margin: 0; padding: 20px; background: oklch(0.12 0.012 275); color: oklch(0.95 0.008 275); font: 500 13px/1.3 "Gabarito", system-ui, sans-serif; }
h1 { margin: 0 0 14px; font-size: 18px; font-weight: 800; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.tile { display: grid; justify-items: center; gap: 6px; padding: 14px 8px 10px; border: 1px solid oklch(0.3 0.015 275); border-radius: 8px; text-align: center; }
.mark { width: 56px; aspect-ratio: 1; background: var(--ink); mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.name { font-size: 17px; font-weight: 800; letter-spacing: -0.03em; }
.bar { width: 100%; height: 6px; border-radius: 3px; background: var(--ink); }
code { color: oklch(0.62 0.02 275); font-size: 10px; }
</style>
</head>
<body>
<h1>Toy accents</h1>
<div class="grid" id="grid"></div>
<script type="module">
const toys = await fetch('../toys.json', { cache: 'no-cache' }).then(r => r.json());
const grid = document.getElementById('grid');
for (const [id, t] of Object.entries(toys)) {
  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.style.setProperty('--ink', t.accent || '#fff');
  if (t.emblem) tile.style.setProperty('--emblem', `url(../${t.emblem})`);
  tile.innerHTML = `${t.emblem ? '<span class="mark"></span>' : ''}<span class="name"></span><span class="bar"></span><code></code>`;
  tile.querySelector('.name').textContent = t.name;
  tile.querySelector('code').textContent = id;
  grid.append(tile);
}
</script>
</body>
</html>
