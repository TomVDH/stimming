<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Intro layouts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=B612:wght@400;700&display=swap">
<link rel="stylesheet" href="../shared/intro.css?v=20">
<style>
@font-face { font-family: 'Iosevka Term Slab'; font-weight: 500; src: url(../shared/fonts/IosevkaTermSlab-Medium.woff2) format('woff2'); }
html, body { margin: 0; background: oklch(0.1 0.01 275); color: #fff; font: 14px Gabarito, system-ui, sans-serif; }
.top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: oklch(0.1 0.01 275); }
.top select { font: inherit; color: #fff; background: oklch(0.2 0.012 275); border: 1px solid oklch(1 0 0 / 0.2); border-radius: 6px; padding: 6px 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: 28px 20px; padding: 4px 16px 40px; }
.card h2 { margin: 0 0 8px; font-size: 15px; font-weight: 700; }
.pair { display: flex; gap: 10px; align-items: flex-start; }
.slot { flex: none; overflow: hidden; outline: 1px solid oklch(1 0 0 / 0.16); }

/* The previews keep the real sizes: each frame renders full size, then scales down. */
.pv.intro {
  position: relative; inset: auto; transform-origin: 0 0; animation: none; backdrop-filter: none; -webkit-backdrop-filter: none;
  background: radial-gradient(60% 50% at 35% 25%, oklch(0.3 0.09 30), transparent), oklch(0.13 0.012 275);
  --intro-display: B612, sans-serif; --intro-nl: Gabarito, sans-serif; --intro-tag: 'Iosevka Term Slab', monospace; --intro-tag-nl: Gabarito, sans-serif;
}
.pv .intro-text { opacity: 1; }
.pv .intro-snd svg { display: block; }

/* B: one meta line, a rule, then the subtitle group. */
.meta { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 0 0.6em; margin-top: var(--g-s); max-width: 92cqw; }
.meta > * { margin: 0 !important; }
.meta > * + *::before { content: "·"; margin-right: 0.6em; opacity: 0.5; font-weight: 400; letter-spacing: 0; }
.rule { width: min(44ch, 60cqw); border-top: 1px solid oklch(1 0 0 / 0.28); margin-top: var(--g-m); }
.rule + .intro-tag { margin-top: var(--g-m); }

/* C and F: a group pinned to the foot of the screen. */
.foot { position: absolute; left: 0; right: 0; bottom: max(24px, 4cqh); display: grid; justify-items: center; text-align: center; padding-inline: 16px; color: #fff; font-family: var(--sans, Gabarito, sans-serif); font-size: var(--copy); line-height: 1.3; }
.foot > :first-child { margin-top: 0; }
.corner { position: absolute; bottom: max(16px, 2.4cqh); color: #fff; font-size: var(--copy); line-height: 1.3; display: flex; gap: 0.8em; align-items: baseline; }
.corner > * { margin: 0 !important; }
.corner.l { left: 20px; } .corner.r { right: 20px; }
.has-corners .foot { bottom: max(60px, 8cqh); }

/* D: every line starts at the logo's left edge. */
[data-l="D"] .intro-text { justify-items: start; text-align: left; padding-left: calc(50% - var(--logo-box) / 2); box-sizing: border-box; width: 100%; }
[data-l="D"] .intro-mark { justify-items: stretch; padding-inline: 0; }
[data-l="D"] .intro-badge { padding-left: var(--pad); margin-left: 0; }
[data-l="D"] .intro-name { max-width: calc(50cqw + var(--logo-box) / 2 - 16px); }

/* E: two columns on a spine, one column when the screen is narrow. */
.spine { display: grid; grid-template-columns: 1fr 1fr; width: min(760px, 92cqw); margin-top: var(--g-m); }
.spine > div { display: grid; align-content: start; padding-inline: 1.2em; }
.spine > div:first-child { justify-items: end; text-align: right; border-right: 1px solid oklch(1 0 0 / 0.28); }
.spine > div:last-child { justify-items: start; text-align: left; }
.spine > div > :first-child { margin-top: 0; }
@container (max-width: 560px) {
  .spine { grid-template-columns: 1fr; gap: var(--g-m); }
  .spine > div, .spine > div:first-child, .spine > div:last-child { justify-items: center; text-align: center; border: 0; }
}

/* F: the title runs larger. */
[data-l="F"] .intro-name { font-size: calc(var(--title) * 1.3); }
</style>
</head>
<body>
<div class="top"><label for="toy">Toy</label><select id="toy"></select></div>
<div class="grid" id="grid"></div>
<script type="module">
// Shows the six layouts below the logo, with real type, at two screen sizes.
const toys = await fetch('../toys.json').then(r => r.json());
const LIST = toys.toys || toys;
const SND = '<span class="intro-snd"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3" fill="none" stroke="currentColor" stroke-width="2.6"/><rect x="2.5" y="13.5" width="5" height="8" rx="1.2" fill="currentColor"/><rect x="16.5" y="13.5" width="5" height="8" rx="1.2" fill="currentColor"/></svg>Best with sound</span>';
const SIZES = [[1280, 800], [375, 812]];
const LAYOUTS = {
  A: 'A. Centred stack (now)',
  B: 'B. One meta line',
  C: 'C. Pinned to the foot',
  D: "D. Flush to the logo's left edge",
  E: 'E. Two columns on a spine',
  F: 'F. English up, Dutch down',
};
const sel = document.getElementById('toy'), grid = document.getElementById('grid');
for (const [id, t] of Object.entries(LIST)) if (t.emblem) sel.append(new Option(t.name, id));

// Builds each line once per frame, so a layout can place it anywhere.
function lines(t) {
  const nl = `<span class="intro-nl">${t.nl || 'Vertaling'} <span class="ipa">/${t.ipa || 'vərˈtaːlɪŋ'}/</span></span>`;
  return {
    cls: '<span class="intro-classic">&lt; CLASSIC &gt;</span>',
    name: `<span class="intro-name">${t.name}</span>`,
    nl,
    num: `<span class="intro-num">#${t.number ?? 1}</span>`,
    tag: `<span class="intro-tag">${t.tag || 'Subtitle line'}</span>`,
    tagNl: `<span class="intro-tag intro-tag--nl">${t.tagNl || 'Subtitle translation line'}</span>`,
    snd: SND,
  };
}
// Each layout returns the column under the logo and anything pinned outside it.
function compose(l, x) {
  if (l === 'A') return [x.cls + x.name + x.nl + x.num + x.tag + x.tagNl + x.snd, ''];
  if (l === 'B') return [x.name + `<div class="meta">${x.nl}${x.num}${x.cls}</div><div class="rule"></div>` + x.tag + x.tagNl + x.snd, ''];
  if (l === 'C') return [x.name + x.nl, `<div class="foot">${x.tag}${x.tagNl}</div><div class="corner l">${x.num}${x.cls}</div><div class="corner r">${x.snd}</div>`];
  if (l === 'D') return [x.name + x.nl + x.num + x.tag + x.tagNl + x.snd + x.cls.replace('intro-classic', 'intro-classic" style="margin:var(--g-m) 0 0'), ''];
  if (l === 'E') return [x.name + `<div class="spine"><div>${x.nl}${x.num}${x.cls.replace('intro-classic', 'intro-classic" style="margin:var(--g-s) 0 0')}</div><div>${x.tag.replace('intro-tag"', 'intro-tag"')}${x.tagNl}${x.snd}</div></div>`, ''];
  return [`<div class="meta" style="margin:0 0 var(--g-s)">${x.cls}${x.num}</div>` + x.name + x.tag, `<div class="foot">${x.nl}${x.tagNl}${x.snd}</div>`];
}
function draw() {
  const t = LIST[sel.value], x = lines(t), emblem = new URL('../' + t.emblem, location.href).href;
  grid.innerHTML = '';
  // The scale fits one desktop frame and one phone frame in a card.
  const cols = innerWidth > 1180 ? 2 : 1, room = (innerWidth - 32 - (cols - 1) * 20) / cols - 10, k = Math.min(0.5, room / (SIZES[0][0] + SIZES[1][0]));
  for (const [l, label] of Object.entries(LAYOUTS)) {
    const [col, pinned] = compose(l, x);
    const frames = SIZES.map(([w, h]) => `<div class="slot" style="width:${w * k}px;height:${h * k}px"><div class="intro is-live pv${pinned.includes('corner') ? ' has-corners' : ''}" data-l="${l}" style="width:${w}px;height:${h}px;transform:scale(${k})"><div class="intro-mark"><div class="intro-text"><div class="intro-badge"><span class="intro-emblem" style="--emblem:url(${emblem})"></span></div>${col}</div></div>${pinned}</div></div>`).join('');
    grid.insertAdjacentHTML('beforeend', `<section class="card"><h2>${label}</h2><div class="pair">${frames}</div></section>`);
  }
}
sel.value = new URLSearchParams(location.search).get('toy') || 'morpher';
sel.addEventListener('change', draw);
addEventListener('resize', draw);
document.fonts.ready.then(draw);
draw();
</script>
</body>
</html>
