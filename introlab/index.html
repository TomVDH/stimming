<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<style>html { background: oklch(0.16 0.012 275); }</style>
<title>Intro lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/intro.css?v=33">
<style>
/* Intro lab: replay the toy intro and tune each beat live. */
:root {
  --bg: oklch(0.16 0.012 275); --fg: oklch(0.95 0.008 275); --muted: oklch(0.62 0.02 275);
  --line: oklch(0.3 0.015 275); --sans: "Gabarito", system-ui, sans-serif;
  --mono: "Iosevka Term Slab Nerd Font", ui-monospace, monospace; --tuned: oklch(0.86 0.15 128);
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; background: var(--bg); color: var(--fg); font: 500 13px/1.3 var(--sans); }
/* A busy backdrop shows what the glass blurs. */
.backdrop {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(40% 50% at 30% 40%, oklch(0.62 0.18 30) 0, transparent 70%),
    radial-gradient(35% 45% at 70% 60%, oklch(0.6 0.16 250) 0, transparent 70%),
    radial-gradient(25% 30% at 55% 25%, oklch(0.8 0.15 95) 0, transparent 70%),
    var(--bg);
}
.panel {
  position: fixed; right: 16px; top: 16px; bottom: 16px; z-index: 200; width: min(340px, calc(100vw - 32px));
  overflow: auto; padding: 14px; display: grid; align-content: start; gap: 10px;
  background: oklch(0.14 0.012 275 / 0.94); border: 1px solid var(--line); border-radius: 10px;
}
.panel h1 { margin: 0; font-size: 18px; font-weight: 800; }
.panel p { margin: 0; color: var(--muted); font-size: 12px; }
/* One line per knob: label, slider, value. */
.row { display: grid; grid-template-columns: 7.6em minmax(0, 1fr) auto; gap: 0 8px; align-items: center; min-height: 22px; }
.row label { grid-column: 1; grid-row: 1; color: var(--muted); font-size: 12px; line-height: 1.15; }
.row output { grid-column: 3; grid-row: 1; font: 500 11px var(--mono); font-variant-numeric: tabular-nums; min-width: 3.4em; text-align: right; }
.row input[type=range] { grid-column: 2; grid-row: 1; width: 100%; height: 14px; margin: 0; accent-color: var(--fg); }
.row select { grid-column: 2 / -1; grid-row: 1; min-width: 0; width: 100%; }
.row input:disabled { opacity: 0.35; }
select, button {
  font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px;
}
button { cursor: pointer; }
button:hover { border-color: var(--fg); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
.pauses { display: flex; flex-wrap: wrap; gap: 6px 14px; }
#go { border-color: var(--fg); font-weight: 700; }
.vrow { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; }
.vrow select { min-width: 0; }
.step { width: 28px; padding: 5px 0; }
.group { border-top: 1px solid var(--line); padding-top: 8px; }
.group summary { cursor: pointer; font: 700 11px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; list-style: none; display: flex; justify-content: space-between; }
/* A group with a tuned knob marks its heading. */
.group:has(.is-tuned) summary { color: var(--tuned); }
.group summary::-webkit-details-marker { display: none; }
.group summary::after { content: "+"; color: var(--muted); }
.group[open] summary::after { content: "–"; }
.group .rows { display: grid; gap: 5px; padding-top: 8px; }
/* A tuned knob shows a dot; double-click its label to reset it. */
.row.is-tuned label::after { content: " •"; color: var(--tuned); }
.row label { cursor: default; user-select: none; }
.row.is-idle { opacity: 0.4; }
/* The timeline: one block per beat, sized by its share of the run. */
.tl { display: grid; gap: 6px; }
.tl-bar { position: relative; display: flex; height: 18px; border-radius: 5px; overflow: hidden; background: var(--line); }
.tl-bar i { display: block; height: 100%; min-width: 2px; border-right: 1px solid oklch(0.14 0.012 275); }
.tl-head { position: absolute; top: -2px; bottom: -2px; width: 2px; left: 0; background: #fff; opacity: 0; }
.tl-keys { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-keys span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 2px; background: var(--c); }
.tl-total { font-size: 12px; font-variant-numeric: tabular-nums; }
.spk { display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; margin-left: auto; color: var(--muted); }
.spk svg { width: 16px; height: 16px; }
@keyframes snd-nudge { 0%, 100% { transform: none; } 15%, 45%, 75% { transform: scale(1.35); } 30%, 60% { transform: scale(1); } }
#snd.is-nudge { animation: snd-nudge 2.2s steps(22, jump-end); color: var(--fg); }
@media (max-width: 640px) { .panel { top: auto; height: 48svh; } }
/* The intro plays in the space beside the panel. */
@media (min-width: 641px) { .intro { right: 372px; } }
@media (max-width: 640px) { .intro { bottom: 48svh; } }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<aside class="panel" aria-label="Intro lab">
  <h1>Intro lab</h1>
  <div class="vrow"><button type="button" class="step" id="prev" aria-label="Previous variety">‹</button><select id="variety" aria-label="Variety"></select><button type="button" class="step" id="next" aria-label="Next variety">›</button></div>
  <p id="took">Run time: –</p>
  <div class="tl" id="tl" aria-label="Timeline"><div class="tl-total" id="tl-total"></div><div class="tl-bar" id="tl-bar"></div><div class="tl-keys" id="tl-keys"></div></div>
  <div class="row"><label for="toy">Toy</label><select id="toy"></select></div>
  <div id="fonts" hidden>
    <div class="row"><label for="fd">Title font</label><select id="fd"></select></div>
    <div class="row"><label for="fn">Translation font</label><select id="fn"></select></div>
    <div class="row"><label for="fs">Subtitle font</label><select id="fs"></select></div>
    <label class="check"><input type="checkbox" id="fsame"> Subtitle translation in the same font</label>
    <div class="row"><label for="fsn">Sub. translation font</label><select id="fsn"></select></div>
  </div>
  <div id="knobs"></div>
  <details class="group" id="options"><summary>Options</summary><div class="rows">
  <label class="check"><input type="checkbox" id="static"> Static: hold every line on screen</label>
  <label class="check"><input type="checkbox" id="loop"> Loop</label>
  <label class="check"><input type="checkbox" id="replay"> Replay on change</label>
  <label class="check"><input type="checkbox" id="nameflash"> Name in flash (try-out)</label>
  <label class="check"><input type="checkbox" id="textflash"> Text flash: the title wipes in as a box with the flash</label>
  <label class="check"><input type="checkbox" id="classic"> Classic notice</label>
  <div class="row"><label for="snote">Audio notice</label><select id="snote">
    <option value="off">Off</option>
    <option value="glyph">Headphones</option>
    <option value="glyph|Ears on">Headphones + Ears on</option>
    <option value="glyph|Oren open">Headphones + Oren open</option>
    <option value="glyph|Best with sound">Headphones + Best with sound</option>
    <option value="glyph|Listen">Headphones + Listen</option>
    <option value="|Ears on">Ears on (no glyph)</option>
  </select></div>
  <div class="row"><label for="numat">Number</label><select id="numat">
    <option value="">Off</option>
    <option value="box">In the square</option>
    <option value="subs">Among the subtitles</option>
    <option value="bottom">Bottom of the page</option>
  </select></div>
  <label class="check"><input type="checkbox" id="nudge"> Pulse the speaker after the intro <button type="button" id="snd" aria-pressed="false" aria-label="Sound off" class="spk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l4 6M21 9l-4 6" stroke="currentColor" stroke-width="2"/></svg></button></label>
  </div></details>
  <p>Pause at</p>
  <div id="pauses" class="pauses"></div>
  <div class="actions">
    <button type="button" id="play">Play</button>
    <button type="button" id="go" hidden>Continue</button>
    <button type="button" id="reset">Reset variety</button>
    <button type="button" id="copy">Copy table</button>
  </div>
</aside>

<script type="module">
// The version query skips a stale cached copy of the engine.
import { intro, fitIntro, popFit, tableOf, TIMING, PHASES, VARIETIES, DEFAULT_VARIETY } from '../shared/intro.js?v=33';

// Knobs by group. Each: [min, max, step, unit]. Frames step by 1, milliseconds by 10.
const GROUPS = {
  Layout: { nameY: [-25, 25, 0.25, 'vh'], nlY: [-25, 25, 0.25, 'vh'], tagY: [-25, 25, 0.25, 'vh'], tagNlY: [-25, 25, 0.25, 'vh'], sndY: [-25, 25, 0.25, 'vh'], clsY: [-25, 25, 0.25, 'vh'], gapK: [0, 3, 0.05, 'x'] },
  Type: { nameK: [0.5, 2, 0.05, 'x'], nlK: [0.5, 2, 0.05, 'x'], tagK: [0.5, 2, 0.05, 'x'], tagNlK: [0.5, 2, 0.05, 'x'], sndK: [0.5, 2, 0.05, 'x'], clsK: [0.5, 2, 0.05, 'x'] },
  Box: { logoK: [0.5, 2, 0.05, 'x'], padK: [0.3, 2, 0.05, 'x'], popScale: [1, 5, 0.1, 'x'] },
  Glass: { blur: [0, 80, 1, 'px'], dim: [0.1, 1, 0.01, ''] },
  Timing: { lead: [0, 20, 1, 'f'], pop: [0, 10, 1, 'f'], flash: [0, 30, 1, 'f'], unfurl: [50, 1500, 10, 'ms'], clsLag: [0, 15, 1, 'f'], nlLag: [0, 15, 1, 'f'], tagLag: [0, 15, 1, 'f'], tagNlLag: [0, 15, 1, 'f'], sndLag: [0, 15, 1, 'f'], subLag: [0, 15, 1, 'f'], readBase: [0, 3000, 50, 'ms'], readPer: [0, 60, 1, 'ms'], readCap: [0, 5000, 50, 'ms'], hold: [500, 6000, 50, 'ms'], wipe: [50, 1500, 10, 'ms'], fade: [50, 2000, 10, 'ms'] },
};
// Knobs read in plain words; the lines go by their names.
const LABEL = {
  lead: 'Lead-in', pop: 'Pop', popScale: 'Pop size', flash: 'Flash hold',
  logoK: 'Logo', padK: 'Box padding', blur: 'Blur', dim: 'Brightness', nameK: 'Main title', nlK: 'Translation', tagK: 'Subtitle', tagNlK: 'Sub. translation', sndK: 'Audio notice', clsK: 'Classic notice', gapK: 'Line spacing',
  unfurl: 'Line reveal', nlLag: 'Translation delay', tagLag: 'Subtitle delay', tagNlLag: 'Sub. translation delay',
  clsY: 'Classic notice Y', nameY: 'Main title Y', nlY: 'Translation Y', tagY: 'Subtitle Y', tagNlY: 'Sub. translation Y', sndY: 'Audio notice Y',
  sndLag: 'Audio notice delay', clsLag: 'Classic notice delay', subLag: 'Lab tag delay',
  readBase: 'Read base', readPer: 'Read per char', readCap: 'Read cap', hold: 'Fixed hold', wipe: 'Exit', fade: 'Fade',
};
const RANGE = Object.assign({}, ...Object.values(GROUPS));
const KEY = 'stimming.introlab';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (err) { return {}; } };
const saved = load();
// Saved tuning applies only while the shipped tables are unchanged.
const STAMP = JSON.stringify([TIMING, Object.fromEntries(Object.keys(VARIETIES).map(k => [k, tableOf(k)]))]);
// tune[variety] holds only the knobs moved away from that variety's own table.
const tune = saved.stamp === STAMP ? saved.tune || {} : {};
const pauses = new Set(saved.pauses || []);
let tlReady = false;
const save = () => {
  if (tlReady) drawTL();
  try {
    localStorage.setItem(KEY, JSON.stringify({ stamp: STAMP, tune, toy: toySel.value, pauses: [...pauses], fonts: own.fonts, fsame: own.fsame, lock: lockBox.checked, note: noteSel.value, nudge: nudgeBox.checked, variety: varSel.value, replay: replayBox.checked, isStatic: staticBox.checked, loop: loopBox.checked, nameFlash: flashBox.checked, textFlash: textBox.checked, numAt: numSel.value }));
  } catch (err) {}
};

const knobs = document.getElementById('knobs'), toySel = document.getElementById('toy');
// Four font slots, each a CSS token on the page root.
const FSEL = { fd: '--intro-display', fn: '--intro-nl', fs: '--intro-tag', fsn: '--intro-tag-nl' };
for (const k of Object.keys(FSEL)) FSEL[k] = Object.assign(document.getElementById(k), { token: FSEL[k] });
const fsame = document.getElementById('fsame');
const varSel = document.getElementById('variety'), took = document.getElementById('took');
// Varieties sit in their groups; Snap ships.
const vgroups = {};
for (const [k, v] of Object.entries(VARIETIES)) {
  const g = vgroups[v.group] ||= varSel.appendChild(Object.assign(document.createElement('optgroup'), { label: v.group }));
  g.append(new Option(k === DEFAULT_VARIETY ? `${v.label} (default)` : v.label, k));
}
// ?v=<variety> picks the variety from a link; it wins over the saved one.
const askV = new URLSearchParams(location.search).get('v');
varSel.value = VARIETIES[askV] ? askV : VARIETIES[saved.variety] ? saved.variety : DEFAULT_VARIETY;
const V = () => VARIETIES[varSel.value];
const base = () => tableOf(varSel.value);
// The lock keeps every beat on the variety's own table.
const lockBox = Object.assign(document.createElement('input'), { type: 'checkbox', id: 'lock', checked: saved.lock ?? true });
const BEATS = new Set(Object.keys(GROUPS.Timing));
const tuned = () => Object.fromEntries(Object.entries(tune[varSel.value] || {}).filter(([k]) => !(lockBox.checked && BEATS.has(k))));
const T = () => ({ ...base(), ...tuned() });

const noteSel = document.getElementById('snote'), nudgeBox = document.getElementById('nudge');
noteSel.value = saved.note || 'glyph';
nudgeBox.checked = saved.nudge ?? true;
[noteSel, nudgeBox].forEach(el => el.addEventListener('change', () => { save(); replay(); }));
const soundNote = () => {
  const [g, words] = noteSel.value === 'off' ? ['', ''] : noteSel.value.split('|');
  return { glyph: g === 'glyph', words: words || null, nudge: nudgeBox.checked };
};
const staticBox = document.getElementById('static');
staticBox.checked = !!saved.isStatic;
staticBox.addEventListener('change', () => { save(); run(); });
const loopBox = document.getElementById('loop'), replayBox = document.getElementById('replay');
const textBox = document.getElementById('textflash'), flashBox = document.getElementById('nameflash'), numSel = document.getElementById('numat'), classicBox = document.getElementById('classic');
classicBox.addEventListener('change', () => { save(); replay(); });
numSel.value = ['box', 'subs', 'bottom'].includes(saved.numAt) ? saved.numAt : '';
numSel.addEventListener('change', () => { save(); replay(); });
replayBox.checked = saved.replay ?? true;
loopBox.checked = !!saved.loop;
flashBox.checked = !!saved.nameFlash;
textBox.checked = !!saved.textFlash;
replayBox.addEventListener('change', save);
loopBox.addEventListener('change', () => { save(); if (loopBox.checked && !playing) run(); });
flashBox.addEventListener('change', () => { save(); replay(); });
textBox.addEventListener('change', () => { save(); replay(); });
// Any change replays at once; a running intro gives way.
const replay = () => { if (replayBox.checked) run(); };

// One folding group per stage; each knob shows its value and marks a change.
const rows = {};
const fmt = (k, v) => {
  const unit = RANGE[k][3];
  if (unit === 'f') return `${v} f · ${Math.round((v * 1000) / 30)} ms`;
  if (unit === 'x') return `${(+v).toFixed(2)}×`;
  return `${v} ${unit}`;
};
for (const [group, list] of Object.entries(GROUPS)) {
  const det = document.createElement('details');
  det.className = 'group';
  det.open = (saved.open ?? ['Layout', 'Type', 'Box', 'Glass']).includes(group);
  det.innerHTML = `<summary>${group}</summary><div class="rows"></div>`;
  det.addEventListener('toggle', () => { saved.open = [...knobs.querySelectorAll('details[open] summary')].map(s => s.textContent); try { localStorage.setItem(KEY, JSON.stringify({ ...load(), open: saved.open })); } catch (err) {} });
  knobs.append(det);
  for (const [k, [lo, hi, step]] of Object.entries(list)) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<label for="k-${k}" title="Double-click to reset">${LABEL[k] || k}</label><output></output><input type="range" id="k-${k}" min="${lo}" max="${hi}" step="${step}">`;
    det.querySelector('.rows').append(row);
    const input = row.querySelector('input');
    input.addEventListener('input', () => {
      const v = +input.value, own = tune[varSel.value] ||= {};
      if (v === base()[k]) delete own[k]; else own[k] = v;
      paint(k);
      save();
      if (POSE[k]) pose(POSE[k]);
    });
    // Timing knobs replay on release; pose knobs already show live.
    input.addEventListener('change', () => { if (!POSE[k]) replay(); });
    row.querySelector('label').addEventListener('dblclick', () => { delete tune[varSel.value]?.[k]; paint(k); save(); POSE[k] ? pose(POSE[k]) : replay(); });
    rows[k] = row;
  }
}
// The font slots sit in the Type group, under the sizes.
const groupRows = name => [...knobs.querySelectorAll('summary')].find(el => el.textContent === name).nextElementSibling;
groupRows('Type').append(...document.getElementById('fonts').children);
document.getElementById('fonts').remove();
const lockLab = Object.assign(document.createElement('label'), { className: 'check' });
lockLab.append(lockBox, ' Lock timing to the variety’s table');
groupRows('Timing').prepend(lockLab);
lockBox.addEventListener('change', () => { paintAll(); save(); replay(); });
// Rows the variety does not use stay dim.
function paint(k) {
  const t = T(), row = rows[k];
  row.querySelector('input').value = t[k];
  row.querySelector('output').textContent = fmt(k, t[k]);
  row.classList.toggle('is-tuned', k in tuned());
  if (BEATS.has(k)) row.querySelector('input').disabled = lockBox.checked;
  const read = !!V().read;
  row.classList.toggle('is-idle', (k === 'hold' && read) || (/^read/.test(k) && !read));
}
const paintAll = () => Object.keys(RANGE).forEach(paint);
paintAll();

const pick = v => { varSel.value = v; paintAll(); lookFonts(); save(); run(); };
varSel.addEventListener('change', () => pick(varSel.value));
const ids = Object.keys(VARIETIES);
const stepV = d => pick(ids[(ids.indexOf(varSel.value) + d + ids.length) % ids.length]);
document.getElementById('prev').addEventListener('click', () => stepV(-1));
document.getElementById('next').addEventListener('click', () => stepV(1));

// Font candidates by kind. Each entry: family, then its weights on Google Fonts.
// Iosevka faces come from Fontsource on jsDelivr ('fs:' plus the package name).
const FONTS = {
  House: [['Gabarito', '400;500;600;700;800;900']],
  // B612 is the face Airbus drew for cockpit displays.
  Cockpit: [['B612', '400;700'], ['B612 Mono', '400;700']],
  Stencil: [['Big Shoulders Stencil Display', '400;600;700;800;900'], ['Saira Stencil One', '400'], ['Stardos Stencil', '400;700']],
  Grotesque: [
    ['Archivo Black', '400'], ['Archivo', '400;600;700;800;900'], ['Inter Tight', '400;600;700;800;900'], ['Manrope', '400;600;700;800'],
    ['Hanken Grotesk', '400;600;700;800;900'], ['Onest', '400;600;700;800;900'], ['Geist', '400;600;700;800;900'],
    ['Host Grotesk', '400;600;700;800'], ['Funnel Display', '400;600;700;800'], ['Albert Sans', '400;600;700;800;900'],
    ['Space Grotesk', '400;600;700'], ['Familjen Grotesk', '400;600;700'], ['Schibsted Grotesk', '400;600;700;800;900'],
    ['Instrument Sans', '400;600;700'], ['Bricolage Grotesque', '400;600;700;800'], ['Darker Grotesque', '400;600;700;800;900'],
    ['Anybody', '400;600;700;800;900'], ['Unbounded', '400;600;700;800;900'], ['Syne', '400;600;700;800'], ['Sora', '400;600;700;800'],
  ],
  Humanist: [
    ['Source Sans 3', '400;600;700;800;900'], ['Fira Sans', '400;600;700;800;900'], ['Alegreya Sans', '400;500;700;800;900'],
    ['Commissioner', '400;600;700;800;900'], ['Figtree', '400;600;700;800;900'], ['Nunito Sans', '400;600;700;800;900'],
    ['Red Hat Display', '400;600;700;800;900'], ['Atkinson Hyperlegible Next', '400;600;700;800'], ['Lexend', '400;600;700;800;900'],
  ],
  Serif: [
    ['Fraunces', '400;600;700;800;900'], ['Instrument Serif', '400'], ['DM Serif Display', '400'], ['Playfair Display', '400;600;700;800;900'],
    ['Newsreader', '400;600;700;800'], ['Young Serif', '400'], ['Gloock', '400'], ['Bodoni Moda', '400;600;700;800;900'],
    ['Libre Caslon Display', '400'], ['Crimson Pro', '400;600;700;800;900'],
  ],
  Slab: [
    ['local:IosevkaTermSlab|Iosevka Term Slab Nerd Font', ''],
    ['fs:iosevka-curly-slab|Iosevka Curly Slab', ''], ['fs:iosevka-etoile|Iosevka Etoile', ''], ['Roboto Slab', '400;600;700;800;900'],
    ['Zilla Slab', '400;600;700'], ['Alfa Slab One', '400'], ['Arvo', '400;700'],
  ],
  Mono: [
    ['fs:iosevka|Iosevka', ''], ['fs:iosevka-aile|Iosevka Aile', ''], ['JetBrains Mono', '400;600;700;800'], ['Space Mono', '400;700'],
    ['IBM Plex Mono', '400;600;700'], ['Geist Mono', '400;600;700;800'], ['DM Mono', '400;500'], ['Martian Mono', '400;600;700;800'],
  ],
};
const familyOf = key => key.includes('|') ? key.split('|')[1] : key;
const weightsOf = Object.fromEntries(Object.values(FONTS).flat().map(([k, w]) => [familyOf(k), [k, w]]));
const loaded = new Set(['Gabarito']);
function useFont(family, prop) {
  if (!loaded.has(family) && weightsOf[family]) {
    loaded.add(family);
    const [key, w] = weightsOf[family];
    const add = href => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; document.head.append(l); };
    if (key.startsWith('local:')) {
      // A self-hosted face in shared/fonts: Latin and IPA only.
      const names = w => [`${family} ${w}`, `IosevkaTermSlabNerdFont-${w}`, `IosevkaTermSlab NF ${w}`, `Iosevka Term Slab ${w}`, `IosevkaTermSlab-${w}`].map(n => `local('${n}')`).join(', ');
      const css = [['Regular', 400], ['Medium', 500], ['Bold', 700], ['ExtraBold', 800]].map(([w, n]) => `@font-face { font-family: '${family}'; font-weight: ${n}; src: ${names(w)}, url(../shared/fonts/IosevkaTermSlab-${w}.woff2) format('woff2'); }`).join('');
      document.head.append(Object.assign(document.createElement('style'), { textContent: css }));
    } else if (key.startsWith('fs:')) {
      const pkg = key.slice(3).split('|')[0];
      for (const wt of [400, 700, 800]) add(`https://cdn.jsdelivr.net/npm/@fontsource/${pkg}@5.3.0/${wt}.css`);
    } else add(`https://fonts.googleapis.com/css2?family=${family.replace(/ /g, '+')}:wght@${w}&display=swap`);
  }
  document.documentElement.style.setProperty(prop, `"${family}", system-ui, sans-serif`);
}
for (const sel of Object.values(FSEL)) {
  for (const [kind, list] of Object.entries(FONTS)) {
    const g = document.createElement('optgroup');
    g.label = kind;
    for (const [k] of list) g.append(new Option(familyOf(k), familyOf(k)));
    sel.append(g);
  }
}
// Old saves kept a name font and a detail font.
const sf = saved.fonts || { fd: saved.fd, fn: saved.ft, fs: saved.fd };
for (const [k, sel] of Object.entries(FSEL)) sel.value = sf[k] && weightsOf[sf[k]] ? sf[k] : 'Gabarito';
fsame.checked = saved.fsame ?? true;
// own keeps the user's font picks while a look shows its own fonts.
const own = { fonts: Object.fromEntries(Object.entries(FSEL).map(([k, el]) => [k, el.value])), fsame: fsame.checked };
// The Dutch subtitle follows the subtitle font while the box is ticked.
const applyFonts = () => {
  for (const sel of Object.values(FSEL)) useFont(sel.value, sel.token);
  FSEL.fsn.disabled = fsame.checked;
  FSEL.fsn.closest('.row').classList.toggle('is-idle', fsame.checked);
  if (fsame.checked) document.documentElement.style.removeProperty('--intro-tag-nl');
};
// A look fills the four slots with its fonts; other varieties get the user's picks back.
function lookFonts() {
  const f = V().fonts || own.fonts;
  for (const [k, sel] of Object.entries(FSEL)) sel.value = f[k];
  fsame.checked = V().fonts ? false : own.fsame;
  applyFonts();
}
lookFonts();
[...Object.values(FSEL), fsame].forEach(el => el.addEventListener('change', () => {
  // A font tried on a look is not saved as the user's pick.
  if (!V().fonts) Object.assign(own, { fonts: Object.fromEntries(Object.entries(FSEL).map(([k, el]) => [k, el.value])), fsame: fsame.checked });
  applyFonts(); save(); held ? applyPose() : replay();
}));

// One toggle per phase; a paused phase waits for Continue.
const pauseBox = document.getElementById('pauses'), go = document.getElementById('go');
for (const ph of PHASES) {
  const lab = document.createElement('label');
  lab.className = 'check';
  lab.innerHTML = `<input type="checkbox" ${pauses.has(ph) ? 'checked' : ''}> ${ph}`;
  lab.querySelector('input').addEventListener('change', e => { e.target.checked ? pauses.add(ph) : pauses.delete(ph); save(); });
  pauseBox.append(lab);
}
let resume = null;
const gate = ph => pauses.has(ph) ? new Promise(res => {
  go.hidden = false;
  go.textContent = `Continue (${ph})`;
  resume = () => { go.hidden = true; resume = null; res(); };
}) : null;
go.addEventListener('click', () => resume?.());

// Size and place knobs pose the intro: it holds at their beat and follows the slider.
const POSE = { popScale: 'pop', logoK: 'lines', nameK: 'lines', nlK: 'lines', tagK: 'lines', tagNlK: 'lines', sndK: 'lines', clsK: 'lines', gapK: 'lines', padK: 'lines', blur: 'lines', dim: 'lines', clsY: 'lines', nameY: 'lines', nlY: 'lines', tagY: 'lines', tagNlY: 'lines', sndY: 'lines' };
const LINE_Y = { clsY: '.intro-classic', nameY: '.intro-name', nlY: '.intro-nl', tagY: '.intro-tag:not(.intro-tag--nl)', tagNlY: '.intro-tag--nl', sndY: '.intro-snd' };
// Static mode runs the beats at once and fills every line.
const FAST = { lead: 0, pop: 0, flash: 0, unfurl: 50, clsLag: 0, nlLag: 0, subLag: 0, tagLag: 0, tagNlLag: 0, sndLag: 0 };
const FILL = { nl: 'Vertaling', ipa: 'vərˈtaːlɪŋ', tag: 'Subtitle line', tagNl: 'Subtitle translation line', sound: true };
let holdAt = null, held = null;
// Sets the held beat's size and place from the current knobs.
function applyPose() {
  const t = T(), badge = document.querySelector('.intro-badge'), emblem = document.querySelector('.intro-emblem');
  if (!held || !badge || !emblem) return;
  if (held === 'pop') {
    // The same cap as the engine: a clear margin on every side.
    const el = flashBox.checked ? document.querySelector('.intro-text') : badge;
    el.style.transform = `scale(${popFit(document.querySelector('.intro'), badge, t.popScale)})`;
  }
  if (held === 'lines') {
    fitIntro(document.querySelector('.intro'), t);
    for (const [k, sel] of Object.entries(LINE_Y)) {
      const el = document.querySelector(sel);
      if (el) el.style.translate = t[k] ? `0 ${t[k]}cqh` : '';
    }
  }
}
addEventListener('resize', applyPose);
function pose(ph) {
  if (held === ph) applyPose();
  else if (holdAt !== ph) run({ hold: ph });
}

const toys = await fetch('../toys.json').then(r => r.json());
for (const [id, t] of Object.entries(toys)) toySel.add(new Option(`${t.name}${t.number ? ` · ${t.number}` : ''}`, id));
toySel.value = saved.toy && toys[saved.toy] ? saved.toy : 'morpher';
tlReady = true;
toySel.addEventListener('change', () => { save(); replay(); });

// Each play builds a fresh intro block, as a toy page carries it.
// A new play replaces the running one at once.
// The old run stops at its next beat and never resumes.
let playing = false, gen = 0, loopTimer = 0;
async function run({ hold = null } = {}) {
  const still = staticBox.checked;
  hold ||= still ? 'lines' : null;
  const my = ++gen;
  clearTimeout(loopTimer);
  playing = true;
  holdAt = hold;
  held = null;
  resume = null;
  go.hidden = true;
  took.textContent = hold ? `Holding at ${hold}…` : 'Playing…';
  document.querySelector('.intro')?.remove();
  const t = toys[toySel.value], root = document.createElement('div');
  root.className = 'intro';
  root.setAttribute('aria-hidden', 'true');
  if (numSel.value) root.dataset.numAt = numSel.value;
  const emblem = t.emblem ? '<span class="intro-emblem"></span>' : '';
  const subSpan = t.sub ? '<span class="intro-sub"></span>' : '';
  root.innerHTML = `<div class="intro-mark"><div class="intro-text">${emblem}<span class="intro-name"></span>${subSpan}</div></div>`;
  document.body.prepend(root);
  const t0 = performance.now();
  runStart = t0;
  drawTL();
  // A replaced run waits here for good; the held beat waits for the next play.
  const beat = ph => {
    if (my !== gen) return new Promise(() => {});
    if (ph === holdAt) {
      held = ph;
      applyPose();
      took.textContent = `Held at ${ph}. Space plays.`;
      return new Promise(() => {});
    }
    return gate(ph);
  };
  await intro({ id: toySel.value, timing: { ...tuned(), ...(still ? FAST : {}) }, gate: beat, soundNote: still ? { ...soundNote(), glyph: true } : soundNote(), variety: varSel.value, nameFlash: flashBox.checked, textFlash: textBox.checked, classic: classicBox.checked, fill: still ? FILL : null });
  if (my !== gen) return;
  playing = false;
  took.textContent = `Run time: ${((performance.now() - t0) / 1000).toFixed(2)} s (${V().label.split(':')[0]}, ${t.name})${pauses.size ? ', with pauses' : ''}`;
  if (loopBox.checked) loopTimer = setTimeout(() => { if (my === gen) run(); }, 600);
}
document.getElementById('play').addEventListener('click', () => run());

// The timeline estimates each beat from the knobs, the variety and the toy's text.
// Frames run at 30 fps; line reveals and exits follow the engine's own rules.
const SEGS = [['glass', 'oklch(0.5 0.03 275)'], ['pop', 'oklch(0.85 0.14 85)'], ['flash', 'oklch(0.72 0.16 40)'], ['lines', 'oklch(0.72 0.13 200)'], ['hold', 'oklch(0.6 0.08 260)'], ['exit', 'oklch(0.7 0.16 330)'], ['fade', 'oklch(0.45 0.05 300)']];
const F = n => (n * 1000) / 30;
// Startup and frame rounding add about this many ms to a measured run.
const STARTUP = 120;
let runStart = 0, tlTotal = 1;
function beats() {
  const t = T(), v = V(), info = toys[toySel.value] || {};
  const note = soundNote(), hasSnd = !!info.sound && (note.glyph || !!note.words);
  const lines = [[!!info.emblem, 0], [classicBox.checked, t.clsLag], [!!info.nl, t.nlLag], [!!info.number && numSel.value === 'subs', t.nlLag], [!!info.sub, t.subLag], [!!info.tag, t.tagLag], [!!info.tagNl, t.tagNlLag], [hasSnd, t.sndLag], [!!info.number && numSel.value === 'bottom', t.sndLag]].filter(([on]) => on);
  const lags = lines.slice(1).reduce((a, [, lag]) => a + F(lag), 0);
  const open = { type: F(Math.min(20, Math.max(4, (info.tagNl || info.tag || info.name || '').length))), stamp: F(3), glitch: F(4) }[v.reveal] ?? t.unfurl;
  const seg = {};
  seg.glass = F(t.lead);
  seg.pop = F(t.pop) + (v.land === 'stamp' ? F(3) : 0);
  seg.flash = v.flash === 'jitter' ? F(Math.max(5, t.flash)) : F(t.flash);
  seg.lines = lags + open;
  const chars = [info.tag, info.tagNl].join('').length;
  seg.hold = v.read ? Math.min(t.readCap, t.readBase + t.readPer * chars) : Math.max(0, t.hold - seg.glass - seg.pop - seg.flash - seg.lines);
  const n = lines.length + 1, ex = v.exit || 'wipe';
  seg.exit = ['erase', 'drop', 'fold'].includes(ex) ? t.wipe + F(n - 1) : ['blow', 'glitch'].includes(ex) ? F(4) : t.wipe;
  seg.fade = t.fade;
  return seg;
}
function drawTL() {
  const seg = beats();
  tlTotal = Object.values(seg).reduce((a, b) => a + b, 0) + STARTUP;
  document.getElementById('tl-total').textContent = `Total ≈ ${(tlTotal / 1000).toFixed(2)} s`;
  document.getElementById('tl-bar').innerHTML = SEGS.map(([k, c]) => `<i style="flex: ${seg[k]} 0 0; background: ${c}" title="${k} ${Math.round(seg[k])} ms"></i>`).join('') + '<b class="tl-head" id="tl-head"></b>';
  document.getElementById('tl-keys').innerHTML = SEGS.map(([k, c]) => `<span style="--c: ${c}">${k} ${Math.round(seg[k])}</span>`).join('');
}
// The playhead runs while a play is live and stops at a held beat.
(function head() {
  const el = document.getElementById('tl-head');
  if (el) {
    const live = playing && !held && !resume;
    el.style.opacity = live ? 1 : 0;
    if (live) el.style.left = `${Math.min(100, ((performance.now() - runStart) / tlTotal) * 100)}%`;
  }
  requestAnimationFrame(head);
})();
drawTL();
document.getElementById('reset').addEventListener('click', () => { delete tune[varSel.value]; paintAll(); save(); held ? applyPose() : replay(); });
// Copy gives the shipped table for the default, or a variety's timing line.
document.getElementById('copy').addEventListener('click', async e => {
  const t = T(), v = varSel.value;
  const diff = Object.fromEntries(Object.entries(t).filter(([k, x]) => x !== TIMING[k]));
  const obj = o => JSON.stringify(o, null, 2).replace(/"(\w+)":/g, '$1:');
  const text = v === DEFAULT_VARIETY ? `export const TIMING = ${obj(t)};` : `${v}: timing ${obj(diff)}`;
  try { await navigator.clipboard.writeText(text); e.target.textContent = 'Copied'; } catch (err) { e.target.textContent = 'Copy failed'; }
  setTimeout(() => { e.target.textContent = 'Copy table'; }, 1200);
});
// Space plays or continues; the arrow keys step through the varieties.
addEventListener('keydown', e => {
  if (e.target.closest('input, select, button')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); stepV(e.key === 'ArrowLeft' ? -1 : 1); return; }
  if (e.key !== ' ') return;
  e.preventDefault();
  resume ? resume() : run();
});
run();
</script>
</body>
</html>
