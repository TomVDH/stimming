<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.06 0.008 70); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar loop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./sun.js">
<link rel="modulepreload" href="./render.js">
<link rel="modulepreload" href="./sound.js">
<link rel="modulepreload" href="../shared/gl.js">
<link rel="modulepreload" href="../shared/glow.js">
<style>
/* Solar loop: the sun's edge in extreme-ultraviolet light; loops, and a flare on a tap. */
:root { --stage: oklch(0.06 0.008 70); }
.stage--solarloop { background: var(--stage); cursor: crosshair; }
.stage--solarloop canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--solarloop canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--solarloop canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Solar loop</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--solarloop" id="stage" tabindex="0" role="application" aria-label="The edge of the sun in extreme-ultraviolet light. Loops of glowing plasma arc above the edge, brighten and drain back. Tap an active region to flare it: bright ribbons flash, a rope of plasma lifts off, and a new arcade of loops forms and cools. Drag to turn the sun.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Solar loop</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
