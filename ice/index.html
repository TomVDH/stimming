<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.08 0.008 250); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ice tray</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">
<style>
/* Ice tray: a tray of ice on a dark table, under one cool light. */
:root { --stage: oklch(0.08 0.008 250); }
.stage--ice canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--ice canvas.on { opacity: 1; }
.stage--ice { cursor: ew-resize; }
@media (prefers-reduced-motion: reduce) { .stage--ice canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Ice tray</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--ice" id="stage" tabindex="0" role="application" aria-label="A tray of ice cubes on a dark table. Drag sideways to twist the tray. Click to knock it.">
      <p class="fail" hidden>Ice tray needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Ice tray</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, whenVisible, pixelRatio, onQuality, quality, reduced, onReducedChange, linFit, stage as mark, pageReady } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const col = (L, C, h) => new THREE.Color().setRGB(...linFit(L, C, h), THREE.LinearSRGBColorSpace);

/* ---------- the tray ---------- */
// Units: one cube edge. The table is y = 0.
// Cells sit P apart; walls are T thick and H tall.
const P = 1.22, WALL = 0.11, H = 0.95, BASE = 0.14, CUBE = 0.96;
// The tray twists about its long axis at this height.
const PIVOT = 0.45;
// The twist follows the pointer through a spring, to 40 degrees each way.
const MAXT = 40 * Math.PI / 180, OMEGA = 18, ZETA = 0.7;
const twist = { T: 0, v: 0, target: 0 };

playIntro({ ready: pageReady(9000) });
mark('build');

/* ---------- bar ---------- */
// The handlers bind once the scene exists.
const act = { dump() {}, refill() {}, reset() {} };
const ui = initPage({ id: 'ice', bar: {
  choice: { label: 'Ice', value: 'cloudy', options: [
    { value: 'cloudy', label: 'Cloudy', key: '1' },
    { value: 'clear', label: 'Clear', key: '2' },
    { value: 'juice', label: 'Juice', key: '3' },
  ], onPick: v => { setIce(v); live(); } },
  actions: [
    { verb: 'dump', key: 'D', onPress: () => act.dump() },
    { verb: 'refill', key: 'R', onPress: () => act.refill() },
  ],
  settings: [
    { type: 'choice', id: 'cubes', label: 'Cubes', value: '12', persist: true,
      options: [{ value: '12', label: '12' }, { value: '16', label: '16' }, { value: '24', label: '24' }], onPick: v => { cubeCount = +v; build(); live(); } },
    { type: 'choice', id: 'table', label: 'Table', value: 'wet', persist: true,
      options: [{ value: 'wet', label: 'Wet' }, { value: 'dry', label: 'Dry' }], onPick: v => { setTable(v); live(); } },
  ],
  reset: () => act.reset(),
  quality: true,
  keys: [['drag', 'twist the tray'], ['click', 'knock'], ['d', 'dump'], ['r', 'refill']],
} });
let cubeCount = +(ui.setting('cubes')?.value ?? 12);

/* ---------- renderer ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  ui.hideControls?.();
  mark('first-frame');
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const canvas = renderer.domElement;
stage.prepend(canvas);

const BG = col(0.08, 0.008, 250);
const scene = new THREE.Scene();
scene.background = BG;
scene.fog = new THREE.Fog(BG, 16, 34);
// Faint room reflections give the ice its glints.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;

/* ---------- lights ---------- */
// One cool key from the upper back rims the cubes and casts the shadows.
const key = new THREE.SpotLight(col(0.92, 0.03, 235), 900, 40, 0.3, 1, 2);
// High enough that its glare on the table lands behind the tray.
key.position.set(-1.5, 14, -8);
key.target.position.set(0, 0, 0.6);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
// A faint warm fill from the front keeps the tray's face readable.
const fill = new THREE.DirectionalLight(col(0.85, 0.04, 70), 0.35);
fill.position.set(4, 3, 8);
// A low cool rim from the back right lights the far edges of the ice.
const rim = new THREE.DirectionalLight(col(0.9, 0.04, 225), 1.6);
rim.position.set(4, 2.5, -7);
scene.add(key, key.target, fill, rim);

/* ---------- table ---------- */
const tableMat = new THREE.MeshStandardMaterial({ color: col(0.12, 0.008, 250), roughness: 0.38, metalness: 0 });
const table = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), tableMat);
table.rotation.x = -Math.PI / 2;
table.receiveShadow = true;
scene.add(table);
// Task 3 adds the wet mirror; Dry only roughens the table for now.
function setTable(v) {
  tableMat.roughness = v === 'dry' ? 0.8 : 0.38;
  tableMat.needsUpdate = true;
}
setTable(ui.setting('table')?.value ?? 'wet');

/* ---------- ice ---------- */
// Transmission ice. Task 3 adds the core, bubbles, frost and cracks.
const ICE = {
  cloudy: { color: col(0.99, 0.005, 230), att: col(0.95, 0.03, 220), dist: 1.6, rough: 0.12, trans: 1 },
  clear: { color: col(0.99, 0.005, 220), att: col(0.96, 0.02, 210), dist: 5, rough: 0.02, trans: 1 },
  juice: { color: col(0.92, 0.08, 55), att: col(0.6, 0.18, 40), dist: 0.9, rough: 0.06, trans: 1 },
};
const iceMat = new THREE.MeshPhysicalMaterial({ ior: 1.31, thickness: 1.2, metalness: 0, specularIntensity: 1, envMapIntensity: 2.2 });
function setIce(v) {
  const k = ICE[v] || ICE.cloudy;
  iceMat.color.copy(k.color);
  iceMat.attenuationColor.copy(k.att);
  iceMat.attenuationDistance = k.dist;
  iceMat.roughness = k.rough;
  iceMat.transmission = k.trans;
  iceMat.needsUpdate = true;
}
setIce(ui.choice?.value ?? 'cloudy');
const cubeGeo = new RoundedBoxGeometry(CUBE, CUBE, CUBE, 3, 0.12);
let cubes = null;

/* ---------- tray mesh ---------- */
// One merged mesh of boxes; long parts carry segments, so the twist bends them.
// A smoky indigo polymer, so the ice is the brightest thing on the table.
const trayMat = new THREE.MeshPhysicalMaterial({ color: col(0.24, 0.06, 268), roughness: 0.38, clearcoat: 0.6, clearcoatRoughness: 0.25 });
const trayGroup = new THREE.Group();
scene.add(trayGroup);
let trayMesh = null, basePos = null, baseNrm = null, L = 1, W = 1, rows = 2, cols = 6;
function box(w, h, d, x, y, z, segX = 1) {
  const g = new THREE.BoxGeometry(w, h, d, segX, 1, 1);
  g.translate(x, y, z);
  return g;
}
function buildTray() {
  L = cols * P + WALL;
  W = rows * P + WALL;
  const seg = cols * 8, parts = [];
  parts.push(box(L, BASE, W, 0, BASE / 2, 0, seg));
  for (const s of [-1, 1]) parts.push(box(L, H, WALL, 0, H / 2, s * (W - WALL) / 2, seg));
  for (const s of [-1, 1]) parts.push(box(WALL, H, W, s * (L - WALL) / 2, H / 2, 0));
  for (let r = 1; r < rows; r++) parts.push(box(L - 2 * WALL, H * 0.92, WALL, 0, H * 0.46, -W / 2 + WALL / 2 + r * P, seg));
  for (let c = 1; c < cols; c++) parts.push(box(WALL, H * 0.92, W - 2 * WALL, -L / 2 + WALL / 2 + c * P, H * 0.46, 0));
  const geo = mergeGeometries(parts);
  parts.forEach(p => p.dispose());
  if (trayMesh) { trayGroup.remove(trayMesh); trayMesh.geometry.dispose(); }
  trayMesh = new THREE.Mesh(geo, trayMat);
  trayMesh.castShadow = trayMesh.receiveShadow = true;
  trayMesh.frustumCulled = false;
  trayGroup.add(trayMesh);
  basePos = geo.attributes.position.array.slice();
  baseNrm = geo.attributes.normal.array.slice();
}
// Rotate every vertex about the long axis by its own angle.
function bendTray() {
  const pos = trayMesh.geometry.attributes.position, nrm = trayMesh.geometry.attributes.normal;
  const pa = pos.array, na = nrm.array;
  for (let i = 0; i < pa.length; i += 3) {
    const x = basePos[i], th = twist.T * x / L, c = Math.cos(th), s = Math.sin(th);
    const y = basePos[i + 1] - PIVOT, z = basePos[i + 2];
    pa[i] = x;
    pa[i + 1] = y * c - z * s + PIVOT;
    pa[i + 2] = y * s + z * c;
    const ny = baseNrm[i + 1], nz = baseNrm[i + 2];
    na[i] = baseNrm[i];
    na[i + 1] = ny * c - nz * s;
    na[i + 2] = ny * s + nz * c;
  }
  pos.needsUpdate = nrm.needsUpdate = true;
}

/* ---------- cubes ---------- */
// A cube either rides its cell or lies loose on the table.
let cells = [], loose = [];
const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), S = new THREE.Vector3(1, 1, 1), X = new THREE.Vector3(1, 0, 0);
// Seeded random keeps the first frame the same on every load.
let seed = 4111;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function layoutCells() {
  cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      // Each cube sits a hair off square, as frozen water does.
      cells.push({ x: (c - (cols - 1) / 2) * P, z: (r - (rows - 1) / 2) * P, yaw: (rnd() - 0.5) * 0.06, full: true });
    }
  }
}
// The first frame: two cubes already out, lying on the table by the tray.
function firstLoose() {
  loose = [];
  const out = [Math.min(cells.length - 1, cols + 2), Math.min(cells.length - 1, cols + 4)];
  out.forEach((ci, i) => {
    cells[ci].full = false;
    const p = narrow ? new THREE.Vector3(-0.9 + i * 1.7, CUBE / 2, L / 2 + 1.4 + i * 0.4) : new THREE.Vector3(1.2 + i * 1.6, CUBE / 2, W / 2 + 1.3 + i * 0.3);
    const q = new THREE.Quaternion().setFromAxisAngle(THREE.Object3D.DEFAULT_UP, 0.4 + i * 0.9);
    loose.push({ p, q });
  });
}
function buildCubes() {
  if (cubes) { scene.remove(cubes); cubes.dispose(); }
  cubes = new THREE.InstancedMesh(cubeGeo, iceMat, cells.length);
  cubes.castShadow = true;
  cubes.frustumCulled = false;
  scene.add(cubes);
}
// Cubes in cells take the tray's twist at their own x.
function placeCubes() {
  trayGroup.updateMatrixWorld();
  let n = 0;
  for (const c of cells) {
    if (!c.full) continue;
    const th = twist.T * c.x / L, co = Math.cos(th), si = Math.sin(th);
    const y = BASE + CUBE / 2 - PIVOT;
    V.set(c.x, y * co - c.z * si + PIVOT, y * si + c.z * co);
    Q.setFromAxisAngle(X, th).multiply(new THREE.Quaternion().setFromAxisAngle(THREE.Object3D.DEFAULT_UP, c.yaw));
    M.compose(V, Q, S).premultiply(trayGroup.matrixWorld);
    cubes.setMatrixAt(n++, M);
  }
  for (const l of loose) cubes.setMatrixAt(n++, M.compose(l.p, l.q, S));
  cubes.count = n;
  cubes.instanceMatrix.needsUpdate = true;
}

/* ---------- K2: bloom ---------- */
// Bloom on a float target; only bright sources cross the threshold.
// Copied from Spark wheel, which lifted it from Fireworks.
function makeBloom(strength, radius, threshold) {
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), strength, radius, threshold);
  const full = bloom.setSize.bind(bloom);
  // Full size on High, 0.7 on Standard, half on the ladder's rung 2.
  bloom.setSize = (w, h) => { const m = rung >= 2 ? 0.5 : quality() === 'high' ? 1 : 0.7; full(Math.max(1, w * m), Math.max(1, h * m)); };
  // The stock blur has sigma equal to its radius: a near box, so bright stars bloom square.
  // A sigma of radius / 2.5 gives each layer a round falloff.
  for (const m of bloom.separableBlurMaterials) {
    const r = m.defines.KERNEL_RADIUS, sg = r / 2.5;
    m.uniforms.gaussianCoefficients.value = Array.from({ length: r }, (_, i) => Math.exp(-0.5 * i * i / (sg * sg)));
  }
  // Bilinear upsampling of the small mips draws square feathers.
  // A cubic B-spline read of each mip keeps the glow round.
  const cm = bloom.compositeMaterial;
  cm.fragmentShader = cm.fragmentShader
    .replace('void main() {', /* glsl */`vec4 bsw(float v) {
      vec4 n = vec4(1.0, 2.0, 3.0, 4.0) - v, s = n * n * n;
      float x = s.x, y = s.y - 4.0 * s.x, z = s.z - 4.0 * s.y + 6.0 * s.x;
      return vec4(x, y, z, 6.0 - x - y - z) / 6.0;
    }
    vec4 bic(sampler2D t, vec2 uv) {
      vec2 ts = vec2(textureSize(t, 0)), p = uv * ts - 0.5, fp = fract(p);
      p -= fp;
      vec4 xc = bsw(fp.x), yc = bsw(fp.y);
      vec4 c = p.xxyy + vec2(-0.5, 1.5).xyxy, w = vec4(xc.xz + xc.yw, yc.xz + yc.yw);
      vec4 o = (c + vec4(xc.yw, yc.yw) / w) / ts.xxyy;
      float sx = w.x / (w.x + w.y), sy = w.z / (w.z + w.w);
      return mix(mix(texture2D(t, o.yw), texture2D(t, o.xw), sx), mix(texture2D(t, o.yz), texture2D(t, o.xz), sx), sy);
    }
    void main() {`)
    .replace(/texture2D\(blurTexture([1-5]), vUv\)/g, 'bic(blurTexture$1, vUv)');
  cm.needsUpdate = true;
  return bloom;
}
/* ---------- end K2 ---------- */

/* ---------- K2: grade ---------- */
// Linear grade before tone mapping: haze lift, vignette, fixed grain.
function makeGrade({ tint, vig, vigIn, grain }) {
  return new ShaderPass({
    uniforms: {
      tDiffuse: { value: null },
      uRes: { value: new THREE.Vector2(1, 1) },
      uTint: { value: new THREE.Vector3(...tint) },
      uVig: { value: vig },
      uVigIn: { value: vigIn },
      uGrain: { value: grain },
    },
    vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform vec2 uRes;
    uniform vec3 uTint;
    uniform float uVig, uVigIn, uGrain;
    varying vec2 vUv;
    // An integer hash per pixel; float hashes draw faint stripes here.
    float h(vec2 p) {
      uvec2 q = uvec2(p);
      uint n = (q.x * 1597334677u) ^ (q.y * 3812015801u);
      n *= 1597334677u; n ^= n >> 16; n *= 2246822519u; n ^= n >> 13;
      return float(n) / 4294967295.0;
    }
    void main() {
      vec3 c = texture2D(tDiffuse, vUv).rgb + uTint;
      vec2 q = (vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
      c *= 1.0 - uVig * smoothstep(uVigIn, 1.1, length(q));
      float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c *= 1.0 + (h(gl_FragCoord.xy) - 0.5) * uGrain * (0.6 + 0.4 * smoothstep(0.0, 0.3, lum)) * 2.0;
      gl_FragColor = vec4(max(c, 0.0), 1.0);
    }`,
  });
}
/* ---------- end K2 ---------- */

/* ---------- post chain ---------- */
const POST = { bloom: [0.55, 0.4, 0.92], tint: [0.0008, 0.0009, 0.0013], vig: 0.5, vigIn: 0.35, grain: 0.03 };
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 2 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = makeBloom(...POST.bloom);
composer.addPass(bloomPass);
const grade = makeGrade(POST);
composer.addPass(grade);
composer.addPass(new OutputPass());

/* ---------- layout ---------- */
// Wide stages lay the tray across; tall ones turn it to run up the screen.
const SHAPES = { wide: { 12: [2, 6], 16: [2, 8], 24: [3, 8] }, narrow: { 12: [3, 4], 16: [4, 4], 24: [4, 6] } };
let size = { w: 1, h: 1, dpr: 1 }, narrow = false;
function frameShot() {
  const asp = size.w / size.h;
  camera.aspect = asp;
  narrow = asp < 0.9;
  if (!narrow) {
    camera.fov = 28;
    camera.position.set(0, 5.4, 12.5);
    camera.lookAt(0, 0.35, 0.6);
  } else {
    camera.fov = 34;
    camera.position.set(0, 17, 14);
    camera.lookAt(0.2, 0, 1.2);
  }
  camera.updateProjectionMatrix();
  trayGroup.rotation.y = narrow ? Math.PI / 2 - 0.22 : 0.18;
}
// Build or rebuild the tray and its cubes for this shape and count.
let shapeKey = '';
function build(force = false) {
  const [r, c] = SHAPES[narrow ? 'narrow' : 'wide'][cubeCount] || [2, 6];
  const k = `${r}x${c}`;
  if (!force && k === shapeKey) return;
  shapeKey = k;
  rows = r; cols = c;
  seed = 4111;
  buildTray();
  layoutCells();
  firstLoose();
  buildCubes();
  bendTray();
  placeCubes();
}
function resize() {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  // Rung 1 of the ladder drops the pixel ratio; rung 2 shrinks the bloom.
  size = { w, h, dpr: pixelRatio(w, h, { maxDpr: 2, budget: 2e6, low: rung >= 1 }) };
  frameShot();
  build();
  renderer.setPixelRatio(size.dpr);
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  grade.uniforms.uRes.value.set(w * size.dpr, h * size.dpr);
}

/* ---------- render ---------- */
function draw() {
  composer.render();
}

/* ---------- frame loop ---------- */
// Lively while the tray moves; asleep when it rests.
let raf = 0, last = 0, visible = !document.hidden, dragging = false;
const live = () => wake();
function wake() {
  if (!raf && visible && ready) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
const moving = () => Math.abs(twist.T - twist.target) > 1e-4 || Math.abs(twist.v) > 1e-3;
const lively = () => dragging || moving();
function frame(now) {
  raf = 0;
  let again = true;
  try {
    const raw = (now - last) / 1000;
    if (raw < 0.1) watchdog(raw);
    const dt = Math.min(0.05, raw);
    last = now;
    // The spring runs in small steps, so it stays stable at any frame rate.
    const n = Math.ceil(dt / (1 / 240));
    for (let i = 0; i < n; i++) {
      const h = dt / n;
      const a = -OMEGA * OMEGA * (twist.T - twist.target) - 2 * ZETA * OMEGA * twist.v;
      twist.v += a * h;
      twist.T += twist.v * h;
    }
    if (!moving() && !dragging) { twist.T = twist.target; twist.v = 0; }
    bendTray();
    placeCubes();
    draw();
    again = lively();
  } finally {
    if (again && visible) raf = requestAnimationFrame(frame);
  }
}

/* ---------- performance ladder ---------- */
// After 4 s of frames, an average above 1/38 s for 2 s steps down one rung.
// Rungs: pixel ratio down, then a half-size bloom.
let runFor = 0, slowFor = 0, avgDt = 1 / 60;
function watchdog(raw) {
  runFor += raw;
  avgDt += (raw - avgDt) * 0.1;
  if (runFor < 4 || rung >= 2) return;
  slowFor = avgDt > 1 / 38 ? slowFor + raw : 0;
  if (slowFor < 2) return;
  rung++;
  slowFor = 0;
  runFor = 2;
  avgDt = 1 / 60;
  resize();
}

/* ---------- pointer ---------- */
// A press becomes a drag after 8 px, or a hold after 260 ms.
// A release that is neither is a tap, and a tap knocks the tray.
// A sideways drag of 30 % of the stage gives the full twist.
let ptr = null, holdTo = 0;
function down(e) {
  if (ptr || e.button > 0) return;
  try { canvas.setPointerCapture(e.pointerId); } catch { /* A synthetic pointer has no capture. */ }
  ptr = { id: e.pointerId, x0: e.clientX, y0: e.clientY, mode: 'press', t0: twist.target };
  holdTo = setTimeout(() => { if (ptr?.mode === 'press') ptr.mode = 'hold'; }, 260);
  dragging = true;
  live();
}
function move(e) {
  if (!ptr || e.pointerId !== ptr.id) return;
  if (ptr.mode !== 'drag' && Math.hypot(e.clientX - ptr.x0, e.clientY - ptr.y0) > 8) {
    clearTimeout(holdTo);
    ptr.mode = 'drag';
  }
  if (ptr.mode === 'drag') twist.target = clamp((e.clientX - ptr.x0) / (size.w * 0.3), -1, 1) * MAXT;
  live();
}
function up(e) {
  if (!ptr || (e && e.pointerId !== ptr.id)) return;
  clearTimeout(holdTo);
  const tap = ptr.mode === 'press' && e?.type === 'pointerup';
  ptr = null;
  dragging = false;
  // The tray springs back flat.
  twist.target = 0;
  if (tap) knock();
  live();
}
// A knock sets the tray rocking about its long axis.
function knock(k = 1) {
  twist.v += (rnd() < 0.5 ? -1 : 1) * 2.2 * k;
  live();
}
// Task 2 builds Dump and Refill; for now Dump knocks hard and Refill fills the tray.
act.dump = () => knock(2.5);
act.refill = () => { cells.forEach(c => { c.full = true; }); loose = []; placeCubes(); draw(); live(); };
act.reset = () => { twist.T = twist.v = twist.target = 0; build(true); draw(); live(); };

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
let ready = false;
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  ready = true;
  mark('first-frame');
}, () => { canvas.classList.add('on'); ready = true; mark('first-frame'); });

canvas.addEventListener('pointerdown', down);
canvas.addEventListener('pointermove', move);
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
canvas.addEventListener('lostpointercapture', up);

new ResizeObserver(() => { resize(); if (ready) draw(); }).observe(stage);
onQuality(() => { rung = 0; runFor = slowFor = 0; resize(); if (ready) draw(); });
onReducedChange(() => { if (ready) draw(); });
// A hidden tab stops the loop.
whenVisible(stage, v => {
  visible = v;
  if (!v) { cancelAnimationFrame(raf); raf = 0; return; }
  wake();
});
</script>
</body>
