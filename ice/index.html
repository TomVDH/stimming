<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.08 0.008 250); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ice tray</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">
<style>
/* Ice tray: a tray of ice on a dark table, under one cool light. */
:root { --stage: oklch(0.08 0.008 250); }
.stage--ice canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--ice canvas.on { opacity: 1; }
.stage--ice { cursor: ew-resize; }
@media (prefers-reduced-motion: reduce) { .stage--ice canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Ice tray</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--ice" id="stage" tabindex="0" role="application" aria-label="A tray of ice cubes on a dark table. Drag sideways to twist the tray. Click to knock it.">
      <p class="fail" hidden>Ice tray needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Ice tray</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, whenVisible, pixelRatio, onQuality, quality, reduced, onReducedChange, linFit, audioKit, stage as mark, pageReady } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const col = (L, C, h) => new THREE.Color().setRGB(...linFit(L, C, h), THREE.LinearSRGBColorSpace);

/* ---------- the tray ---------- */
// Units: one cube edge. The table is y = 0.
// Cells sit P apart; walls are T thick and H tall.
const P = 1.22, WALL = 0.11, H = 0.95, BASE = 0.14, CUBE = 0.96;
// The tray twists about its long axis at this height.
const PIVOT = 0.45;
// The twist follows the pointer through a spring, to 40 degrees each way.
const MAXT = 40 * Math.PI / 180, OMEGA = 18, ZETA = 0.7;
const twist = { T: 0, v: 0, target: 0 };

playIntro({ ready: pageReady(9000) });
mark('build');

/* ---------- bar ---------- */
// The handlers bind once the scene exists.
const act = { dump() {}, refill() {}, reset() {} };
const ui = initPage({ id: 'ice', bar: {
  choice: { label: 'Ice', value: 'cloudy', options: [
    { value: 'cloudy', label: 'Cloudy', key: '1' },
    { value: 'clear', label: 'Clear', key: '2' },
    { value: 'juice', label: 'Juice', key: '3' },
  ], onPick: v => { setIce(v); live(); } },
  actions: [
    { verb: 'dump', key: 'D', onPress: () => act.dump() },
    { verb: 'refill', key: 'R', onPress: () => act.refill() },
  ],
  settings: [
    { type: 'choice', id: 'cubes', label: 'Cubes', value: '12', persist: true,
      options: [{ value: '12', label: '12' }, { value: '16', label: '16' }, { value: '24', label: '24' }], onPick: v => { cubeCount = +v; frameShot(); build(); placeCubes(); draw(); live(); } },
    { type: 'choice', id: 'table', label: 'Table', value: 'wet', persist: true,
      options: [{ value: 'wet', label: 'Wet' }, { value: 'dry', label: 'Dry' }], onPick: v => { setTable(v); live(); } },
  ],
  reset: () => act.reset(),
  quality: true,
  keys: [['drag', 'twist the tray'], ['click', 'knock'], ['d', 'dump'], ['r', 'refill']],
} });
let cubeCount = +(ui.setting('cubes')?.value ?? 12);

/* ---------- renderer ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  ui.hideControls?.();
  mark('first-frame');
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const canvas = renderer.domElement;
stage.prepend(canvas);

const BG = col(0.08, 0.008, 250);
const scene = new THREE.Scene();
scene.background = BG;
scene.fog = new THREE.Fog(BG, 16, 34);
// Faint room reflections give the ice its glints.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;

/* ---------- lights ---------- */
// One cool key from the upper back rims the cubes and casts the shadows.
const key = new THREE.SpotLight(col(0.92, 0.03, 235), 900, 40, 0.3, 1, 2);
// High enough that its glare on the table lands behind the tray.
key.position.set(-1.5, 14, -8);
key.target.position.set(0, 0, 0.6);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
// A faint warm fill from the front keeps the tray's face readable.
const fill = new THREE.DirectionalLight(col(0.85, 0.04, 70), 0.35);
fill.position.set(4, 3, 8);
// A low cool rim from the back right lights the far edges of the ice.
const rim = new THREE.DirectionalLight(col(0.9, 0.04, 225), 1.6);
rim.position.set(4, 2.5, -7);
scene.add(key, key.target, fill, rim);

/* ---------- table ---------- */
const tableMat = new THREE.MeshStandardMaterial({ color: col(0.12, 0.008, 250), roughness: 0.38, metalness: 0 });
const table = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), tableMat);
table.rotation.x = -Math.PI / 2;
table.receiveShadow = true;
scene.add(table);
// The wet table mirrors the tray and the cubes: dim copies flipped under it, added after the table.
// They draw before the real ones, so the real tray and cubes cover them.
const mirror = new THREE.Group();
mirror.scale.y = -1;
scene.add(mirror);
// A ghost fades with depth below the table, as a wet reflection does, and keeps a rim.
const ghostMat = (c, k) => new THREE.ShaderMaterial({
  uniforms: { uCol: { value: c.clone().multiplyScalar(k) } },
  vertexShader: /* glsl */`
    varying float vF;
    varying vec3 vN, vV;
    void main() {
      mat4 m = modelMatrix;
      #ifdef USE_INSTANCING
        m = modelMatrix * instanceMatrix;
      #endif
      vec4 wp = m * vec4(position, 1.0);
      vF = exp(wp.y * 1.4);
      vN = normalize(mat3(m) * normal);
      vV = normalize(cameraPosition - wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uCol;
    varying float vF;
    varying vec3 vN, vV;
    void main() {
      float rim = pow(1.0 - abs(dot(normalize(vN), vV)), 2.0);
      gl_FragColor = vec4(uCol * vF * (0.35 + rim), 1.0);
    }`,
  depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
});
let tableKind = 'wet';
function setTable(v) {
  tableKind = v;
  tableMat.roughness = v === 'dry' ? 0.8 : 0.38;
  // The ladder's second rung drops the mirror, whatever the table.
  mirror.visible = v !== 'dry' && rung < 2;
}

/* ---------- ice ---------- */
// Transmission ice. A short march through each cube draws what lies inside:
// the cloudy core, bubble trails, the clear-ice air band and a crack sheet.
// core: core strength. tint: core colour. bubbles: trail strength. band: clear ice's bottom air.
// glint: caustic strength on the table.
const ICE = {
  cloudy: { color: col(0.99, 0.005, 230), att: col(0.95, 0.03, 220), dist: 1.6, rough: 0.1, core: 1, tint: col(0.84, 0.015, 230), bubbles: 1, band: 0, glint: 0.3 },
  clear: { color: col(0.99, 0.005, 220), att: col(0.96, 0.02, 210), dist: 5, rough: 0.02, core: 0, tint: col(0.95, 0.015, 230), bubbles: 0.25, band: 0.7, glint: 0.65 },
  juice: { color: col(0.95, 0.07, 62), att: col(0.74, 0.15, 52), dist: 1.6, rough: 0.06, core: 0.85, tint: col(0.66, 0.16, 45), bubbles: 0.5, band: 0, glint: 0.45 },
};
let iceKind = ICE.cloudy;
const iceU = {
  uTime: { value: 0 }, uCore: { value: 1 }, uTint: { value: new THREE.Color() },
  uBubbles: { value: 1 }, uBand: { value: 0 }, uFlash: { value: 1 },
};
const iceMat = new THREE.MeshPhysicalMaterial({ ior: 1.31, thickness: 1.2, metalness: 0, specularIntensity: 1, envMapIntensity: 2.2, transmission: 1 });
iceMat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, iceU);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', `#include <common>
      attribute vec4 aIce;
      attribute vec4 aCrack;
      varying vec3 vLoc, vCamLoc;
      varying vec4 vIce, vCrack;`)
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      // The march runs in the cube's own space, so the camera moves into it.
      mat4 toWorld = modelMatrix;
      #ifdef USE_INSTANCING
        toWorld = modelMatrix * instanceMatrix;
      #endif
      vLoc = position;
      vCamLoc = (inverse(toWorld) * vec4(cameraPosition, 1.0)).xyz;
      vIce = aIce;
      vCrack = aCrack;`);
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
      uniform float uTime, uCore, uBubbles, uBand, uFlash;
      uniform vec3 uTint;
      varying vec3 vLoc, vCamLoc;
      varying vec4 vIce, vCrack;
      float iceHash(float n) { return fract(sin(n * 127.1) * 43758.5453); }
      float iceNoise(vec3 p) {
        vec3 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float n = dot(i, vec3(1.0, 57.0, 113.0));
        return mix(mix(mix(iceHash(n), iceHash(n + 1.0), f.x), mix(iceHash(n + 57.0), iceHash(n + 58.0), f.x), f.y),
                   mix(mix(iceHash(n + 113.0), iceHash(n + 114.0), f.x), mix(iceHash(n + 170.0), iceHash(n + 171.0), f.x), f.y), f.z);
      }`)
    .replace('#include <color_fragment>', `#include <color_fragment>
      // Ten steps from the surface to the far side of the cube.
      vec3 rd = normalize(vLoc - vCamLoc);
      vec3 tq = (sign(rd) * ${(CUBE / 2).toFixed(3)} - vLoc) / rd;
      float tEx = max(0.0, min(min(tq.x, tq.y), tq.z));
      float stepL = tEx / 10.0, dens = 0.0, sheet = 0.0, sd = vIce.x;
      for (int i = 0; i < 10; i++) {
        vec3 p = vLoc + rd * stepL * (float(i) + 0.5);
        float nz = iceNoise(p * 7.0 + sd * 13.0);
        // Water freezes from the outside in and pushes its air to the middle.
        // The core is a soft column with fine streaks, not a ball.
        float streak = iceNoise(p * vec3(14.0, 4.0, 14.0) + sd * 7.0);
        dens += smoothstep(0.34, 0.0, length(p * vec3(1.0, 0.75, 1.0)) + (nz - 0.5) * 0.12 + (streak - 0.5) * 0.18) * uCore;
        // Ice frozen from one side leaves its air in a band at the bottom.
        dens += uBand * smoothstep(-0.34, -0.44, p.y) * (0.4 + 0.6 * nz);
        for (int k = 0; k < 4; k++) {
          float fk = float(k);
          vec2 c = vec2(iceHash(sd + fk) - 0.5, iceHash(sd + fk + 7.1) - 0.5) * 0.55;
          vec3 a = vec3(c.x, 0.38, c.y), ba = vec3(c.x * 0.3, 0.02, c.y * 0.3) - a, pa = p - a;
          float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
          dens += uBubbles * smoothstep(0.016, 0.004, length(pa - ba * h)) * 3.0;
        }
      }
      // The crack is one plane: find where the view ray meets it inside the cube.
      if (vCrack.w > -5.0) {
        float dn = dot(rd, vCrack.xyz);
        float tc = (vCrack.w - dot(vLoc, vCrack.xyz)) / (abs(dn) > 1e-3 ? dn : 1e-3);
        if (tc > 0.0 && tc < tEx) {
          vec3 pc = vLoc + rd * tc;
          // A sheet seen edge-on looks brighter; its edge frays with noise.
          float fray = smoothstep(0.35, 0.6, iceNoise(pc * 9.0 + sd));
          sheet = clamp(0.25 / max(abs(dn), 0.25), 0.0, 1.0) * (0.4 + 0.6 * fray);
        }
      }
      float cloud = 1.0 - exp(-dens * stepL * 6.0);
      float sheetA = sheet;
      // A crack flashes once, then stays as a faint white sheet.
      float flash = vIce.z > -5.0 ? exp(-max(uTime - vIce.z, 0.0) * 10.0) * uFlash : 0.0;
      // Fresh cubes carry frost on the top face.
      float frost = 0.55 * vIce.y * smoothstep(0.42, 0.47, vLoc.y) * (0.5 + 0.5 * iceNoise(vLoc * 40.0));
      float iceCloud = clamp(cloud + sheetA * 0.6 + frost, 0.0, 1.0);
      diffuseColor.rgb = mix(diffuseColor.rgb, uTint, cloud);
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.86, 0.9, 0.95), clamp(sheetA * 0.7 + frost, 0.0, 1.0));
      vec3 iceGlow = uTint * cloud * 0.05 + vec3(0.85, 0.93, 1.0) * sheetA * (0.04 + 5.0 * flash);`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
      roughnessFactor = mix(roughnessFactor, 0.75, clamp(frost + cloud * 0.4, 0.0, 1.0));`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      totalEmissiveRadiance += iceGlow;`)
    .replace('#include <transmission_fragment>', THREE.ShaderChunk.transmission_fragment
      .replace('material.transmissionAlpha = 1.0;', `material.transmissionAlpha = 1.0;
      // Cloud, frost and cracks scatter light instead of passing it.
      material.transmission *= 1.0 - iceCloud * 0.9;`));
};
function setIce(v) {
  const k = iceKind = ICE[v] || ICE.cloudy;
  iceMat.color.copy(k.color);
  iceMat.attenuationColor.copy(k.att);
  iceMat.attenuationDistance = k.dist;
  iceMat.roughness = k.rough;
  iceU.uCore.value = k.core;
  iceU.uTint.value.copy(k.tint);
  iceU.uBubbles.value = k.bubbles;
  iceU.uBand.value = k.band;
}
setIce(ui.choice?.value ?? 'cloudy');
setTable(ui.setting('table')?.value ?? 'wet');
// Per-cube look: x seed, y frost, z crack time; and the crack plane (normal, offset).
const MAXCUBES = 32;
const cubeGeo = new RoundedBoxGeometry(CUBE, CUBE, CUBE, 3, 0.12);
const aIce = new THREE.InstancedBufferAttribute(new Float32Array(MAXCUBES * 4), 4);
const aCrack = new THREE.InstancedBufferAttribute(new Float32Array(MAXCUBES * 4), 4);
aIce.setUsage(THREE.DynamicDrawUsage);
aCrack.setUsage(THREE.DynamicDrawUsage);
cubeGeo.setAttribute('aIce', aIce);
cubeGeo.setAttribute('aCrack', aCrack);
let cubes = null;

/* ---------- tray mesh ---------- */
// One merged mesh of boxes; long parts carry segments, so the twist bends them.
// A smoky indigo polymer, so the ice is the brightest thing on the table.
const trayMat = new THREE.MeshPhysicalMaterial({ color: col(0.24, 0.06, 268), roughness: 0.38, clearcoat: 0.6, clearcoatRoughness: 0.25 });
// The tray hangs from a hinge on its front long edge, so Dump can flip it.
const trayGroup = new THREE.Group(), trayFlip = new THREE.Group(), trayInner = new THREE.Group();
trayGroup.add(trayFlip);
trayFlip.add(trayInner);
scene.add(trayGroup);
let trayMesh = null, trayGhost = null, basePos = null, baseNrm = null, L = 1, W = 1, rows = 2, cols = 6;
function box(w, h, d, x, y, z, segX = 1) {
  const g = new THREE.BoxGeometry(w, h, d, segX, 1, 1);
  g.translate(x, y, z);
  return g;
}
function buildTray() {
  L = cols * P + WALL;
  W = rows * P + WALL;
  const seg = cols * 8, parts = [];
  parts.push(box(L, BASE, W, 0, BASE / 2, 0, seg));
  for (const s of [-1, 1]) parts.push(box(L, H, WALL, 0, H / 2, s * (W - WALL) / 2, seg));
  for (const s of [-1, 1]) parts.push(box(WALL, H, W, s * (L - WALL) / 2, H / 2, 0));
  for (let r = 1; r < rows; r++) parts.push(box(L - 2 * WALL, H * 0.92, WALL, 0, H * 0.46, -W / 2 + WALL / 2 + r * P, seg));
  for (let c = 1; c < cols; c++) parts.push(box(WALL, H * 0.92, W - 2 * WALL, -L / 2 + WALL / 2 + c * P, H * 0.46, 0));
  const geo = mergeGeometries(parts);
  parts.forEach(p => p.dispose());
  if (trayMesh) { trayInner.remove(trayMesh); trayMesh.geometry.dispose(); }
  trayMesh = new THREE.Mesh(geo, trayMat);
  trayMesh.castShadow = trayMesh.receiveShadow = true;
  // The real tray draws after its mirror copy, so it covers it.
  trayMesh.renderOrder = 2;
  trayMesh.frustumCulled = false;
  trayInner.add(trayMesh);
  if (trayGhost) mirror.remove(trayGhost);
  trayGhost = new THREE.Mesh(geo, ghostMat(col(0.5, 0.06, 268), 0.06));
  trayGhost.matrixAutoUpdate = false;
  trayGhost.frustumCulled = false;
  trayGhost.renderOrder = 1;
  mirror.add(trayGhost);
  trayFlip.position.z = W / 2;
  trayInner.position.z = -W / 2;
  basePos = geo.attributes.position.array.slice();
  baseNrm = geo.attributes.normal.array.slice();
}
// Rotate every vertex about the long axis by its own angle.
function bendTray() {
  const pos = trayMesh.geometry.attributes.position, nrm = trayMesh.geometry.attributes.normal;
  const pa = pos.array, na = nrm.array;
  for (let i = 0; i < pa.length; i += 3) {
    const x = basePos[i], th = twist.T * x / L, c = Math.cos(th), s = Math.sin(th);
    const y = basePos[i + 1] - PIVOT, z = basePos[i + 2];
    pa[i] = x;
    pa[i + 1] = y * c - z * s + PIVOT;
    pa[i + 2] = y * s + z * c;
    const ny = baseNrm[i + 1], nz = baseNrm[i + 2];
    na[i] = baseNrm[i];
    na[i + 1] = ny * c - nz * s;
    na[i + 2] = ny * s + nz * c;
  }
  pos.needsUpdate = nrm.needsUpdate = true;
}

/* ---------- cubes ---------- */
// A cube either rides its cell or lies loose as a rigid body.
let cells = [], bodies = [];
const UP = THREE.Object3D.DEFAULT_UP, X = new THREE.Vector3(1, 0, 0);
const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), Q2 = new THREE.Quaternion(), V = new THREE.Vector3(), S = new THREE.Vector3();
// Seeded random keeps the first frame the same on every load.
let seed = 4111;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
// Each cell's bond breaks when its strain passes it for 80 ms.
function layoutCells() {
  cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      // Each cube sits a hair off square, as frozen water does.
      cells.push({ r, x: (c - (cols - 1) / 2) * P, z: (r - (rows - 1) / 2) * P, yaw: (rnd() - 0.5) * 0.06, full: true, bond: 0.55 + 0.35 * rnd(), over: 0, cracked: false, peak: 0, popAt: 0, grow: 1, look: newLook() });
    }
  }
}
// A fresh cube: its own seed, frost from now, no crack.
function newLook() { return { seed: rnd() * 100, frostAt: time, crack: null }; }
function makeBody(p, q, v = new THREE.Vector3(), w = new THREE.Vector3(), look = newLook()) {
  return { p, q, v, w, still: 0, asleep: false, held: false, scale: 1, look };
}
// The first frame: two cubes already out, lying on the table by the tray.
function firstLoose() {
  bodies = [];
  const out = [Math.min(cells.length - 1, cols + 2), Math.min(cells.length - 1, cols + 4)];
  out.forEach((ci, i) => {
    cells[ci].full = false;
    const p = narrow ? new THREE.Vector3(-0.9 + i * 1.7, CUBE / 2, L / 2 + 1.4 + i * 0.4) : new THREE.Vector3(1.2 + i * 1.6, CUBE / 2, W / 2 + 1.3 + i * 0.3);
    const b = makeBody(p, new THREE.Quaternion().setFromAxisAngle(UP, 0.4 + i * 0.9));
    // These have sat out a while: their frost is gone.
    b.look.frostAt = -100;
    b.asleep = true;
    bodies.push(b);
  });
}
function buildCubes() {
  if (cubes) { scene.remove(cubes); mirror.remove(cubeGhost); }
  cubes = new THREE.InstancedMesh(cubeGeo, iceMat, cells.length);
  cubes.castShadow = true;
  cubes.frustumCulled = false;
  cubes.renderOrder = 2;
  scene.add(cubes);
  // The mirror copy shares the cubes' matrices.
  cubeGhost = new THREE.InstancedMesh(cubeGeo, ghostMat(col(0.9, 0.02, 225), 0.12), cells.length);
  cubeGhost.instanceMatrix = cubes.instanceMatrix;
  cubeGhost.frustumCulled = false;
  cubeGhost.renderOrder = 1;
  mirror.add(cubeGhost);
}
let cubeGhost = null;

// Bloom on a float target; only bright sources cross the threshold.

    .replace(/texture2D\(blurTexture([1-5]), vUv\)/g, 'bic(blurTexture$1, vUv)');

// Strain grows with the twist and toward the ends of the tray.

        const nrm = new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).normalize();

  sfx('pop', V, 1);
  c.full = false;
  const side = rows === 1 ? 1 : c.r < (rows - 1) / 2 ? -1 : c.r > (rows - 1) / 2 ? 1 : (rnd() < 0.5 ? -1 : 1);
  const out = new THREE.Vector3(0, 0, side).transformDirection(trayInner.matrixWorld).multiplyScalar(3 + 1.5 * rnd());
  const v = out.add(new THREE.Vector3((rnd() - 0.5) * 1.2, 5 + 2 * rnd(), 0));
  const w = new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).multiplyScalar(reduced() ? 0 : 9);
  c.look.frostAt = time;
  bodies.push(makeBody(V.clone(), Q.clone(), v, w, c.look));
}

/* ---------- dump and refill ---------- */
// Dump flips the tray over its front edge, lets the cubes fall, and sets it back.
// Refill melts the loose cubes away, then the cells fill.
const dump = { t: 0 }, refill = { t: 0 };
const DUMP_UP = 0.45, DUMP_HOLD = 0.25, DUMP_DOWN = 0.6, FLIP = 2.3;
const ease = x => x * x * (3 - 2 * x);
function dumpStep(dt) {
  if (dump.t <= 0) return;
  dump.t += dt;
  const t = dump.t;
  const prev = trayFlip.rotation.x;
  trayFlip.rotation.x = t < DUMP_UP ? FLIP * ease(t / DUMP_UP) : t < DUMP_UP + DUMP_HOLD ? FLIP : FLIP * (1 - ease(Math.min(1, (t - DUMP_UP - DUMP_HOLD) / DUMP_DOWN)));
  // Past vertical, every cube in a cell falls out with the tray's swing.
  if (trayFlip.rotation.x > 1.5 && cells.some(c => c.full)) {
    trayGroup.updateMatrixWorld();
    const spin = (trayFlip.rotation.x - prev) / Math.max(dt, 1e-3);
    const axis = new THREE.Vector3(1, 0, 0).transformDirection(trayGroup.matrixWorld);
    const hinge = new THREE.Vector3().setFromMatrixPosition(trayFlip.matrixWorld);
    for (const c of cells) {
      if (!c.full) continue;
      cellMatrix(c, M).decompose(V, Q, S);
      // The swing throws each cube; a little scatter breaks up the grid.
      const v = new THREE.Vector3().crossVectors(axis, V.clone().sub(hinge)).multiplyScalar(spin * 0.6)
        .add(new THREE.Vector3((rnd() - 0.5) * 3, rnd() * 1.5, (rnd() - 0.5) * 2));
      c.full = false;
      c.look.frostAt = time;
      bodies.push(makeBody(V.clone(), Q.clone(), v, new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).multiplyScalar(reduced() ? 0 : 6), c.look));
    }
  }
  if (t >= DUMP_UP + DUMP_HOLD + DUMP_DOWN) { dump.t = 0; trayFlip.rotation.x = 0; }
}
function refillStep(dt) {
  if (refill.t <= 0) return;
  refill.t += dt;
  const t = refill.t;
  for (const b of bodies) b.scale = Math.max(0, 1 - t / 0.6);
  if (t >= 0.6 && bodies.length) {
    bodies = [];
    for (const c of cells) if (!c.full) { c.full = true; c.cracked = false; c.over = 0; c.popAt = 0; c.grow = 0; c.bond = 0.55 + 0.35 * rnd(); c.look = newLook(); }
  }
  if (t >= 0.6) for (const c of cells) c.grow = Math.min(1, Math.max(c.grow, (t - 0.6) / 0.4));
  if (t >= 1.0) { refill.t = 0; cells.forEach(c => { c.grow = 1; }); }
}

/* ---------- frame loop ---------- */
// Lively while the tray or a cube moves; asleep when all rest.
let raf = 0, last = 0, visible = !document.hidden, dragging = false, time = 0;
const live = () => wake();
function wake() {
  if (!raf && visible && ready) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
const moving = () => Math.abs(twist.T - twist.target) > 1e-4 || Math.abs(twist.v) > 1e-3;
const lively = () => dragging || moving() || dump.t > 0 || refill.t > 0 || time < flashEnd
  || bodies.some(b => !b.asleep) || cells.some(c => c.cracked && c.full);
function frame(now) {
  raf = 0;
  let again = true;
  try {
    const raw = (now - last) / 1000;
    if (raw < 0.1) watchdog(raw);
    const dt = Math.min(0.05, raw);
    last = now;
    time += dt;
    // Springs and bodies run in small fixed steps, stable at any frame rate.
    const n = Math.ceil(dt / (1 / 240));
    for (let i = 0; i < n; i++) {
      const h = dt / n;
      const a = -OMEGA * OMEGA * (twist.T - twist.target) - 2 * ZETA * OMEGA * twist.v;
      twist.v += a * h;
      twist.T += twist.v * h;
    }
    if (!moving() && !dragging) { twist.T = twist.target; twist.v = 0; }
    dumpStep(dt);
    refillStep(dt);
    bendTray();
    trayGroup.updateMatrixWorld();
    trayInv.copy(trayInner.matrixWorld).invert();
    bonds(dt);
    const m = Math.ceil(dt / (1 / 120));
    slideSum = 0;
    for (let i = 0; i < m; i++) {
      for (const b of bodies) stepBody(b, dt / m);
      collide();
    }
    audioStep(dt);
    placeCubes();
    draw();
    again = lively();
  } finally {
    if (again && visible) raf = requestAnimationFrame(frame);
    else kit.rest(() => !raf);
  }
}

/* ---------- performance ladder ---------- */
// After 4 s of frames, an average above 1/38 s for 2 s steps down one rung.
// Rungs: pixel ratio down; then half-size bloom and transmission, and no mirror; then smaller shadows and no caustics.
let runFor = 0, slowFor = 0, avgDt = 1 / 60;
function watchdog(raw) {
  runFor += raw;
  avgDt += (raw - avgDt) * 0.1;
  if (runFor < 4 || rung >= 3) return;
  slowFor = avgDt > 1 / 38 ? slowFor + raw : 0;
  if (slowFor < 2) return;
  rung++;
  slowFor = 0;
  runFor = 2;
  avgDt = 1 / 60;
  applyRung();
  resize();
}
function applyRung() {
  renderer.transmissionResolutionScale = rung >= 2 ? 0.5 : 1;
  setTable(tableKind);
  const sm = rung >= 3 ? 512 : 1024;
  if (key.shadow.mapSize.x !== sm) {
    key.shadow.mapSize.set(sm, sm);
    key.shadow.map?.dispose();
    key.shadow.map = null;
  }
  causMesh.visible = rung < 3;
}

/* ---------- sound ---------- */
// Every voice is synthesized on the kit: noise bursts and short decaying sines.
const kit = audioKit();
const jit = x => 1 + (Math.random() * 2 - 1) * x;
const tP = new THREE.Vector3();
// Each sound pans with its source on the screen.
const panAt = p => clamp(tP.copy(p).project(camera).x * 0.85, -1, 1);
const nextAt = { crack: 0, pop: 0, clink: 0, knock: 0 };
const GAP = { crack: 1 / 20, pop: 1 / 25, clink: 1 / 35, knock: 1 / 30 };
let slideSum = 0, bed = null;
function burst(ac, at, { f, q = 1.5, dur, level, pan = 0, type = 'bandpass' }) {
  const src = ac.createBufferSource();
  src.buffer = kit.noise;
  const flt = ac.createBiquadFilter();
  flt.type = type;
  flt.frequency.value = f * jit(0.12);
  flt.Q.value = q;
  const g = ac.createGain();
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(level * jit(0.2), at + 0.001);
  g.gain.exponentialRampToValueAtTime(1e-4, at + dur);
  const pn = ac.createStereoPanner();
  pn.pan.value = pan;
  src.connect(flt).connect(g).connect(pn).connect(kit.out);
  src.start(at, Math.random() * (kit.noise.duration - dur - 0.02), dur + 0.02);
}
function blip(ac, at, { f, dur, level, pan = 0 }) {
  const o = ac.createOscillator();
  o.frequency.value = f * jit(0.05);
  const g = ac.createGain();
  g.gain.setValueAtTime(level * jit(0.2), at);
  g.gain.exponentialRampToValueAtTime(1e-4, at + dur);
  const pn = ac.createStereoPanner();
  pn.pan.value = pan;
  o.connect(g).connect(pn).connect(kit.out);
  o.start(at);
  o.stop(at + dur + 0.02);
}
// One voice per event; each kind keeps its own rate cap.
function sfx(kind, p, k) {
  const ac = kit.live();
  if (!ac || !kit.noise) return;
  const at = ac.currentTime + 0.01;
  if (at < nextAt[kind]) return;
  nextAt[kind] = at + GAP[kind] * jit(0.3);
  const pan = panAt(p);
  if (kind === 'crack') {
    // A sharp snap, then the high ring of stressed ice.
    burst(ac, at, { f: 2500, type: 'highpass', q: 0.7, dur: 0.012, level: 0.55, pan });
    blip(ac, at + 0.002, { f: 3000 + 3000 * Math.random(), dur: 0.09, level: 0.09, pan });
  } else if (kind === 'pop') {
    // A soft, hollow tock as the cube leaves its cell.
    blip(ac, at, { f: 380 + 140 * Math.random(), dur: 0.06, level: 0.28, pan });
    burst(ac, at, { f: 900, q: 2, dur: 0.025, level: 0.18, pan });
  } else if (kind === 'clink') {
    // Ice on ice: two inharmonic partials.
    const f = 2200 + 1600 * Math.random();
    blip(ac, at, { f, dur: 0.12, level: 0.16 * k, pan });
    blip(ac, at, { f: f * 2.76, dur: 0.06, level: 0.07 * k, pan });
  } else if (kind === 'knock') {
    // A dull knock on the table.
    blip(ac, at, { f: 150 + 60 * Math.random(), dur: 0.07, level: 0.3 * k, pan });
    burst(ac, at, { f: 800, type: 'lowpass', q: 0.7, dur: 0.03, level: 0.2 * k, pan });
  }
}
// Two looped beds: the tray's creak and the cubes' slide hiss.
function bedChain(ac) {
  const loopNoise = () => { const s = ac.createBufferSource(); s.buffer = kit.noise; s.loop = true; s.start(); return s; };
  const creakF = ac.createBiquadFilter();
  creakF.type = 'bandpass';
  creakF.frequency.value = 900;
  creakF.Q.value = 9;
  const creak = ac.createGain();
  creak.gain.value = 0;
  loopNoise().connect(creakF).connect(creak).connect(kit.out);
  const hissF = ac.createBiquadFilter();
  hissF.type = 'highpass';
  hissF.frequency.value = 3000;
  const hiss = ac.createGain();
  hiss.gain.value = 0;
  loopNoise().connect(hissF).connect(hiss).connect(kit.out);
  return { creak, creakF, hiss };
}
let wander = 0;
function audioStep(dt) {
  const ac = kit.live();
  if (!ac || !kit.noise) return;
  bed ||= bedChain(ac);
  const now = ac.currentTime;
  // The creak follows how fast the tray twists; its pitch wanders slowly.
  wander += dt * (0.7 + Math.random());
  bed.creak.gain.setTargetAtTime(0.35 * clamp(Math.abs(twist.v) / 3), now, 0.04);
  bed.creakF.frequency.setTargetAtTime(700 + 350 * Math.sin(wander) + 150 * clamp(Math.abs(twist.T) / MAXT), now, 0.08);
  bed.hiss.gain.setTargetAtTime(0.06 * clamp(slideSum / Math.max(dt, 1e-3) / 20), now, 0.05);
}
// Refill: running water, then a sparse tinkle as the frost creeps in.
function pour() {
  const ac = kit.live();
  if (!ac || !kit.noise) return;
  const at = ac.currentTime + 0.01;
  burst(ac, at, { f: 1200, type: 'lowpass', q: 0.5, dur: 0.8, level: 0.25 });
  for (let i = 0; i < 7; i++) blip(ac, at + 0.6 + i * 0.07 + 0.05 * Math.random(), { f: 4000 + 3000 * Math.random(), dur: 0.05, level: 0.04, pan: Math.random() * 1.2 - 0.6 });
}

/* ---------- pointer ---------- */
// A press becomes a drag after 8 px, or a hold after 260 ms.
// A press on a loose cube grabs it; anywhere else, a sideways drag twists the tray.
// A tap on a cube flicks it; a tap elsewhere knocks the tray.
// A sideways drag of 30 % of the stage gives the full twist.
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), grabPlane = new THREE.Plane(UP, -HALF), hitP = new THREE.Vector3();
let ptr = null, holdTo = 0;
function aim(e) {
  const r = stage.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
// The nearest loose cube under the pointer, by its bounding sphere.
function pick() {
  let best = null, bt = Infinity;
  for (const b of bodies) {
    if (b.scale < 1) continue;
    tX.subVectors(b.p, ray.ray.origin);
    const t = tX.dot(ray.ray.direction), d2 = tX.lengthSq() - t * t;
    if (d2 < 0.6 * 0.6 && t < bt) { bt = t; best = b; }
  }
  return best;
}
function down(e) {
  if (ptr || e.button > 0) return;
  try { canvas.setPointerCapture(e.pointerId); } catch { /* A synthetic pointer has no capture. */ }
  aim(e);
  const cube = dump.t > 0 || refill.t > 0 ? null : pick();
  ptr = { id: e.pointerId, x0: e.clientX, y0: e.clientY, mode: 'press', cube };
  if (cube) { cube.held = true; cube.asleep = false; }
  holdTo = setTimeout(() => { if (ptr?.mode === 'press') ptr.mode = 'hold'; }, 260);
  dragging = true;
  live();
}
function move(e) {
  if (!ptr || e.pointerId !== ptr.id) return;
  if (ptr.mode !== 'drag' && Math.hypot(e.clientX - ptr.x0, e.clientY - ptr.y0) > 8) {
    clearTimeout(holdTo);
    ptr.mode = 'drag';
  }
  if (ptr.mode === 'drag') {
    if (ptr.cube) {
      // The cube chases the pointer across the table; its speed is the flick.
      aim(e);
      if (ray.ray.intersectPlane(grabPlane, hitP)) {
        const b = ptr.cube;
        b.v.set((hitP.x - b.p.x) * 14, b.v.y, (hitP.z - b.p.z) * 14).clampLength(0, VMAX);
      }
    } else if (dump.t <= 0) twist.target = clamp((e.clientX - ptr.x0) / (size.w * 0.3), -1, 1) * MAXT;
  }
  live();
}
function up(e) {
  if (!ptr || (e && e.pointerId !== ptr.id)) return;
  clearTimeout(holdTo);
  const tap = ptr.mode === 'press' && e?.type === 'pointerup';
  const b = ptr.cube;
  ptr = null;
  dragging = false;
  if (b) {
    b.held = false;
    // A tap flicks the cube away from the camera's side of it, with a spin.
    if (tap) {
      tX.subVectors(b.p, camera.position).setY(0).normalize();
      b.v.addScaledVector(tX, 4).setY(2);
      if (!reduced()) b.w.set(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).multiplyScalar(10);
    }
  } else {
    // The tray springs back flat.
    twist.target = 0;
    if (tap) knock();
  }
  live();
}
// A knock sets the tray rocking about its long axis.
function knock(k = 1) {
  twist.v += (rnd() < 0.5 ? -1 : 1) * 2.2 * k;
  live();
}
act.dump = () => {
  if (dump.t > 0 || refill.t > 0) return;
  twist.target = twist.T = twist.v = 0;
  if (reduced()) {
    // Reduced motion: the cubes appear on the table, no flip.
    trayGroup.updateMatrixWorld();
    for (const c of cells) {
      if (!c.full) continue;
      cellMatrix(c, M).decompose(V, Q, S);
      c.full = false;
      c.look.frostAt = time;
      const b = makeBody(V.clone().add(new THREE.Vector3(0, 0, W).transformDirection(trayGroup.matrixWorld).multiplyScalar(W)), Q.clone(), undefined, undefined, c.look);
      bodies.push(b);
    }
  } else dump.t = 1e-4;
  // Cubes in front of the tray slide clear of its swing.
  trayGroup.updateMatrixWorld();
  const fwd = new THREE.Vector3(0, 0, 1).transformDirection(trayGroup.matrixWorld);
  bodies.forEach(b => { b.asleep = false; b.v.addScaledVector(fwd, 3); });
  live();
};
act.refill = () => {
  if (dump.t > 0 || refill.t > 0) return;
  refill.t = reduced() ? 0.999 : 1e-4;
  pour();
  live();
};
act.reset = () => { twist.T = twist.v = twist.target = 0; dump.t = refill.t = 0; trayFlip.rotation.x = 0; build(true); draw(); live(); };

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
let ready = false;
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  ready = true;
  mark('first-frame');
}, () => { canvas.classList.add('on'); ready = true; mark('first-frame'); });

canvas.addEventListener('pointerdown', down);
canvas.addEventListener('pointermove', move);
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
canvas.addEventListener('lostpointercapture', up);

new ResizeObserver(() => { resize(); if (ready) draw(); }).observe(stage);
onQuality(() => { rung = 0; runFor = slowFor = 0; applyRung(); resize(); if (ready) draw(); });
onReducedChange(() => { if (ready) draw(); });
// A hidden tab stops the loop.
whenVisible(stage, v => {
  visible = v;
  if (!v) { cancelAnimationFrame(raf); raf = 0; kit.rest(() => true); return; }
  wake();
});
</script>
</body>
</html>
