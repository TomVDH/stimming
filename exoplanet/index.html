<style>
/* Exoplanet: a spectrograph waterfall of one star, folded by hand. */
:root { --stage: oklch(0.08 0.01 230); }
.stage--exoplanet canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--exoplanet canvas.on { opacity: 1; }
.stage--exoplanet { cursor: ew-resize; }
.stage--exoplanet.fold { cursor: grabbing; }
/* The readout: one line of instrument telemetry under the top corners. */
.stage--exoplanet .read {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
  font: 500 11px/1 "Iosevka Term Slab", ui-monospace, monospace; letter-spacing: 0.08em;
  color: oklch(0.72 0.01 230 / 0.55); white-space: nowrap; pointer-events: none; z-index: 2;
  font-variant-numeric: tabular-nums;
}
.stage--exoplanet .read.lock { color: oklch(0.85 0.08 200 / 0.9); }
/* On a phone the readout drops under the top corners. */
@media (max-width: 640px) { .stage--exoplanet .read { top: 50px; font-size: 10px; } }
@media (prefers-reduced-motion: reduce) { .stage--exoplanet canvas { transition: none; } }
</style>

<script type="importmap">
{
  "imports": {

}

<script type="module">
import { initPage, whenVisible, fitCanvas, onQuality, linFit, reduced, audioKit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const stage = document.getElementById('stage'), readEl = document.getElementById('read');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

/* ---------- targets ---------- */
// Each target is a seed and a few numbers. Names are catalog-shaped, not real.
// vsini broadens the lines. K is the wobble in stage pixels at 1280 px.
// P is in days. depth is the drawn transit depth. kind wrong never folds.
const TARGETS = [
  { id: 't1', name: 'TOI-4811', type: 'G2', lines: 52, depth: 0.7, vsini: 2, P: 3.52, K: 4.5, dip: 0.3, kind: 'planet' },
  { id: 't2', name: 'HD 219134 c', type: 'K3', lines: 60, depth: 0.85, vsini: 1, P: 6.76, K: 2.5, dip: 0.14, kind: 'planet' },
  { id: 't3', name: 'WASP-1207', type: 'F6', lines: 34, depth: 0.45, vsini: 9, P: 1.09, K: 6, dip: 0.34, kind: 'planet' },
  { id: 't4', name: 'KIC 8462852', type: 'F3', lines: 30, depth: 0.4, vsini: 12, P: 0, K: 0, dip: 0, kind: 'wrong' },
  { id: 't5', name: 'GJ 3470', type: 'M1', lines: 60, depth: 0.9, vsini: 1, P: 12.4, K: 2, dip: 0.16, kind: 'planet' },
  { id: 't6', name: 'HAT-P-2219', type: 'K0', lines: 56, depth: 0.75, vsini: 3, P: 2.21, K: 4, dip: 0.26, ecc: 0.35, kind: 'planet' },
  { id: 't7', name: 'EPIC 204278916', type: 'K5', lines: 58, depth: 0.8, vsini: 2, P: 0, K: 0, dip: 0, kind: 'wrong' },
  { id: 't8', name: 'TOI-700 d', type: 'M2', lines: 60, depth: 0.9, vsini: 1, P: 18.7, K: 1.6, dip: 0.1, kind: 'planet' },
];
const TYPES = ['F3', 'F6', 'G0', 'G2', 'K0', 'K3', 'K5', 'M1', 'M2'];
// A random target. One in four is wrong.
function shuffled(seed) {
  const r = mulberry(seed);
  const ti = Math.floor(r() * TYPES.length), type = TYPES[ti], hot = ti / (TYPES.length - 1);
  const wrong = r() < 0.25;
  const n = Math.floor(2000 + r() * 7000);
  return {
    id: 'rnd', name: `TOI-${n}`, type, seed,
    lines: Math.round(30 + 30 * hot), depth: 0.4 + 0.5 * hot, vsini: 1 + (1 - hot) * 12 * r(),
    P: wrong ? 0 : Math.exp(Math.log(0.7) + r() * (Math.log(16) - Math.log(0.7))),
    K: wrong ? 0 : 1.6 + r() * 4.4, dip: wrong ? 0 : 0.1 + r() * 0.24,

/* ---------- state ---------- */
const N = 256, TW = 4096, WIN = 12;
let target = TARGETS[0], shuffleSeed = 7;
let exposure = 0.33, tell = 1, cosmic = 1, logStretch = 0;
// Trial period P in days; 0 means time order. lock holds while folded true.
let P = 0, locked = false;
// The pointer press in flight, and the row the cut shows.
let press = null, holdT = 0, cutRow = -1, cutUntil = Infinity;
let time = 0;

const act = { shuffle() {}, reset() {}, exposure() {}, pick() {} };
const ui = initPage({ id: 'exoplanet', bar: {
  choice: { label: 'Target', value: 't1', display: 'stepper',
    options: TARGETS.map((t, i) => ({ value: t.id, label: t.name, key: String(i + 1) })),
    onPick: v => act.pick(v) },
  slider: { label: 'Exposure', min: 0, max: 1, step: 0.01, value: exposure, onInput: v => act.exposure(v) },
  actions: [{ verb: 'shuffle', key: ' ', onPress: () => act.shuffle() }],
  settings: [
    { type: 'toggle', id: 'tell', label: 'Tellurics', value: true, persist: true, onToggle: v => { tell = v ? 1 : 0; live(); } },
    { type: 'toggle', id: 'cosmic', label: 'Cosmic rays', value: true, persist: true, onToggle: v => { cosmic = v ? 1 : 0; live(); } },
    { type: 'choice', id: 'stretch', label: 'Stretch', value: 'linear', persist: true,
      options: [{ value: 'linear', label: 'Linear' }, { value: 'log', label: 'Log' }], onPick: v => { logStretch = v === 'log' ? 1 : 0; live(); } },
  ],
  reset: () => act.reset(),
  quality: true,
  keys: [['drag', 'fold'], ['scroll', 'fine'], ['tap', 'cut'], ['1-8', 'target']],
} });
{
  const v = k => ui.setting(k)?.value;
  tell = v('tell') === false ? 0 : 1;
  cosmic = v('cosmic') === false ? 0 : 1;
  logStretch = v('stretch') === 'log' ? 1 : 0;
}

let markReady;
const glReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, glReady]) });

/* ---------- templates ---------- */
// The stellar template: one continuum with Gaussian lines, broadened by rotation.
// Units are template pixels; the window is WIN nm across TW pixels.
const star = new Float32Array(TW), tellu = new Float32Array(TW), work = new Float32Array(TW);
// Line cores: where the strongest lines sit, for the Rossiter bump and the cut.
let lineCores = [], cols = [0.3, 0.7];
function template(t) {
  const r = mulberry(t.seed ?? seedOf(t.name));
  star.fill(1);
  lineCores = [];
  cols = [0.1 + r() * 0.8, 0.1 + r() * 0.8];
  const pxPerNm = TW / WIN;
  for (let i = 0; i < t.lines; i++) {
    const c = r() * TW;
    const strong = r() < 0.12;
    const d = (strong ? 0.75 + r() * 0.25 : Math.pow(r(), 0.8) * 0.8) * t.depth;
    const sig = (strong ? 0.014 + r() * 0.01 : 0.005 + r() * 0.01) * pxPerNm;
    const lo = Math.max(0, Math.floor(c - sig * 5)), hi = Math.min(TW - 1, Math.ceil(c + sig * 5));
    for (let x = lo; x <= hi; x++) {
      const z = (x - c) / sig;
      // Strong lines keep Lorentz wings; weak ones are Gaussian.
      const prof = strong ? 0.7 * Math.exp(-z * z * 0.5) + 0.3 / (1 + z * z) : Math.exp(-z * z * 0.5);
      star[x] *= 1 - d * prof;
    }
    if (d > 0.45 * t.depth) lineCores.push(c / TW);
  }
  // Rotation: a half-ellipse kernel, its half-width from vsini.
  const hw = Math.max(1, Math.round(0.004 * t.vsini * pxPerNm));
  if (hw > 1) {
    const k = [];
    let sum = 0;
    for (let i = -hw; i <= hw; i++) { const v = Math.sqrt(Math.max(0, 1 - (i / hw) ** 2)); k.push(v); sum += v; }
    work.set(star);
    for (let x = 0; x < TW; x++) {
      let acc = 0;
      for (let i = -hw; i <= hw; i++) acc += work[clamp(x + i, 0, TW - 1)] * k[i + hw];
      star[x] = acc / sum;
    }
  }
}
// Earth's air: a few narrow fixed lines, mostly in the right half of the window.
function telluric() {
  const r = mulberry(0x5eed);
  tellu.fill(1);
  const pxPerNm = TW / WIN;
  for (let i = 0; i < 11; i++) {
    const c = (0.35 + r() * 0.62) * TW, d = 0.12 + r() * 0.42, sig = (0.003 + r() * 0.003) * pxPerNm;
    const lo = Math.max(0, Math.floor(c - sig * 5)), hi = Math.min(TW - 1, Math.ceil(c + sig * 5));
    for (let x = lo; x <= hi; x++) { const z = (x - c) / sig; tellu[x] *= 1 - d * Math.exp(-z * z * 0.5); }
  }
}

/* ---------- exposures ---------- */
// Parallel arrays, one record per exposure. Index 0 is the oldest.
const E = {
  t: new Float32Array(N), rv: new Float32Array(N), flux: new Float32Array(N), seed: new Float32Array(N),
  transit: new Float32Array(N), gap: new Float32Array(N), rm: new Float32Array(N), age: new Float32Array(N),
  y: new Float32Array(N), yTo: new Float32Array(N),
};
const order = new Int32Array(N), rank = new Float32Array(N);
let tNow = 0, rndE = mulberry(1);
// A wrong star dims in events, never on a period.
let events = [];
function fluxAt(t) {
  if (target.kind === 'planet') {
    const ph = ((t / target.P) % 1 + 1) % 1, dur = 0.035 + 0.02 * Math.cbrt(target.P / 3), d = ph > 0.5 ? ph - 1 : ph;
    if (Math.abs(d) > dur) return { f: 1, tr: -1 };
    const u = d / dur, edge = 0.18;
    const k = clamp((1 - Math.abs(u)) / edge);
    return { f: 1 - target.dip * k, tr: (u + 1) / 2 };
  }
  let f = 1 + 0.02 * Math.sin(t * 0.21) + 0.012 * Math.sin(t * 0.83 + 1.3);
  for (const ev of events) {
    if (t < ev.t0 || t > ev.t0 + ev.dur) continue;
    const u = (t - ev.t0) / ev.dur;
    // A slow ingress and a fast egress.
    const k = u < ev.split ? Math.pow(u / ev.split, 1.6) : Math.pow(1 - (u - ev.split) / (1 - ev.split), 0.6);
    f -= ev.depth * k;
  }
  return { f: Math.max(0.05, f), tr: -1 };
}
function rvAt(t) {
  if (target.kind !== 'planet') return 0;
  const th = TAU * t / target.P;
  const e = target.ecc || 0;
  return target.K * (Math.sin(th) + e * Math.sin(2 * th) * 0.8);
}
// Writes one exposure at slot i for time t.
function expose(i, t) {
  E.t[i] = t;
  const { f, tr } = fluxAt(t);
  E.rv[i] = rvAt(t) + 0.6 * Math.sin(TAU * t / 365) + (rndE() - 0.5) * 0.35;
  // Sky transparency jitters a little from row to row.
  E.flux[i] = f * (0.985 + rndE() * 0.03);
  E.transit[i] = tr;
  E.rm[i] = tr >= 0 ? (tr * 2 - 1) : 0;
  E.gap[i] = rndE() < 1 / 14 ? 1 : 0;
  E.seed[i] = Math.floor(rndE() * 65535);
}
function newEvents() {
  events = [];
  if (target.kind !== 'wrong') return;
  let t = rndE() * 6;
  while (t < 400) {
    const dur = 0.6 + rndE() * 3.2;
    events.push({ t0: t, dur, depth: 0.15 + rndE() * 0.25, split: 0.55 + rndE() * 0.3 });
    t += dur + 2 + rndE() * 12 * (rndE() < 0.3 ? 0.2 : 1);
  }
}
// A full stack for a new target. The sweep runs top to bottom over 1.5 s.
function restack(sweep = true) {
  rndE = mulberry((target.seed ?? seedOf(target.name)) ^ 0x9e37);
  newEvents();
  tNow = 0;
  for (let i = 0; i < N; i++) { tNow += 0.28 + rndE() * 0.18; expose(i, tNow); }
  reorder();
  periodogram();
  for (let i = 0; i < N; i++) { E.y[i] = E.yTo[i]; E.age[i] = sweep ? -(1 - rank[i] / N) * 1.5 - 0.1 : 1; }
}
// One more exposure. The oldest slot takes it.
let oldest = 0;
function arrive() {
  tNow += 0.28 + rndE() * 0.18;
  const i = oldest;
  oldest = (oldest + 1) % N;
  expose(i, tNow);
  E.age[i] = 0;
  reorder();
  if (settling()) sfx.shutter();
  // A new row starts where its slot is, so it sweeps in, not slides in.
  E.y[i] = E.yTo[i];
  periodogramDirty = true;
}
// Rank every exposure: by time, or by phase when folded.
function reorder() {
  for (let i = 0; i < N; i++) order[i] = i;
  if (P > 0) {
    const ph = rank;
    for (let i = 0; i < N; i++) { const p = (E.t[i] / P) % 1; ph[i] = p + 0.5 > 1 ? p - 0.5 : p + 0.5; }
    order.sort((a, b) => ph[a] - ph[b]);
  } else {
    order.sort((a, b) => E.t[b] - E.t[a]);
  }
  for (let k = 0; k < N; k++) { rank[order[k]] = k; E.yTo[order[k]] = k; }
}
let periodogramDirty = false;

/* ---------- periodogram ---------- */
// Trial periods run log-spaced from PMIN to PMAX days.
const NPG = 400, PMIN = 0.5, PMAX = 20, LMIN = Math.log(PMIN), LMAX = Math.log(PMAX);
const power = new Float32Array(NPG), lsP = new Float32Array(NPG), blsP = new Float32Array(NPG);
const pgPos = p => clamp((Math.log(p) - LMIN) / (LMAX - LMIN));
const pgPeriod = k => Math.exp(LMIN + (k / (NPG - 1)) * (LMAX - LMIN));
const bins = new Float32Array(24), binN = new Float32Array(24);
// Lomb-Scargle on the wobble, box fit on the brightness, summed.
function periodogram() {
  let mv = 0, mf = 0;
  for (let i = 0; i < N; i++) { mv += E.rv[i]; mf += E.flux[i]; }
  mv /= N; mf /= N;
  let vv = 0, vf = 0;
  for (let i = 0; i < N; i++) { vv += (E.rv[i] - mv) ** 2; vf += (E.flux[i] - mf) ** 2; }
  vv = Math.max(vv / N, 1e-6); vf = Math.max(vf / N, 1e-6);
  for (let k = 0; k < NPG; k++) {
    const p = pgPeriod(k), w = TAU / p;
    let s2 = 0, c2 = 0;
    for (let i = 0; i < N; i++) { s2 += Math.sin(2 * w * E.t[i]); c2 += Math.cos(2 * w * E.t[i]); }
    const tau = Math.atan2(s2, c2) / (2 * w);

    bins.fill(0); binN.fill(0);

      const a = w * (E.t[i] - tau), c = Math.cos(a), sn = Math.sin(a), y = E.rv[i] - mv;
      yc += y * c; ys += y * sn; cc += c * c; ss += sn * sn;
      const b = Math.floor((((E.t[i] / p) % 1) + 1) % 1 * 24) % 24;

    // The box: the deepest bin's depth, weighted by its share of points.
    let best = 0;
    for (let b = 0; b < 24; b++) {
      if (binN[b] < 2) continue;
      const depth = -bins[b] / binN[b];
      if (depth <= 0) continue;
      const v = depth * depth * (binN[b] / N) / vf;
      if (v > best) best = v;
    }
    blsP[k] = best * 1.2;

// The power at a period, interpolated between bins.
function powerAt(p) {

  return power[k] * (1 - f) + power[Math.min(NPG - 1, k + 1)] * f;

/* ---------- fold ---------- */
// The trial period moves on a log scale. Near a peak the dial stiffens.
function scrub(dlog) {
  if (P <= 0) P = 3;
  const gain = 1 / (1 + 6 * powerAt(P));
  stir = Math.min(1.5, stir + Math.abs(dlog) * 12);
  setPeriod(Math.exp(clamp(Math.log(P) + dlog * gain, LMIN, LMAX)));
}
function setPeriod(p) {
  P = p;
  const near = target.kind === 'planet' ? Math.abs(P / target.P - 1) : 1;
  const was = locked;
  locked = near < 0.004;
  if (locked && !was) onLock();
  reorder();
  readout();

// Inside 1.5 % the fold eases the last stretch itself.
function pull(dt, strength) {
  if (target.kind !== 'planet' || P <= 0) return;
  const near = Math.abs(P / target.P - 1);
  if (near >= 0.015 || near < 1e-6) return;
  const k = 1 - Math.exp(-dt / 0.25 * strength);
  setPeriod(P + (target.P - P) * k);
  if (Math.abs(P / target.P - 1) < 1e-4) setPeriod(target.P);

let lockAt = -1e9;
function onLock() { lockAt = performance.now(); }

/* ---------- shaders ---------- */
// Strips: one instance per exposure, in device pixels from the bottom left.
const STRIP_VS = `#version 300 es
layout(location=0) in vec2 aC;
layout(location=1) in vec4 aA;
layout(location=2) in vec4 aB;
uniform vec2 uRes;
uniform vec4 uBox;
uniform float uRowH;
out vec2 vUV;
flat out vec4 vA;
flat out vec4 vB;
void main() {
  // Snap strip edges to whole pixels; overlap one pixel so eased rows leave no seam.
  float y0 = floor(uBox.w - (aA.x + 1.0) * uRowH + 0.5);
  float y1 = floor(uBox.w - aA.x * uRowH + 0.5) + 1.0;
  vec2 p = vec2(mix(uBox.x, uBox.z, aC.x), mix(y0, y1, aC.y));
  gl_Position = vec4(p / uRes * 2.0 - 1.0, 0.0, 1.0);
  vUV = vec2(aC.x, mix(y0, y1, aC.y));
  vA = aA;
  vB = aB;
}`;
const STRIP_FS = `#version 300 es
precision highp float;
precision highp int;
in vec2 vUV;
flat in vec4 vA;
flat in vec4 vB;
uniform sampler2D uStar;
uniform sampler2D uTell;
uniform vec2 uRes;
uniform vec4 uBox;
uniform float uDpr;
uniform float uTell1;
uniform float uCosmic;
uniform float uLog;
uniform float uNoise;
uniform float uRm;
uniform float uTime;
uniform vec3 uGrey;
uniform vec3 uBg;
uniform vec2 uCols;
out vec4 o;
// A PCG hash: one integer in, one float in 0..1 out.
uint pcg(uint v) { v = v * 747796405u + 2891336453u; uint w = ((v >> ((v >> 28u) + 4u)) ^ v) * 277803737u; return (w >> 22u) ^ w; }

  float rvN = vA.y * uDpr * (widthPx / (1280.0 * uDpr)) / widthPx;
  float s = texture(uStar, vec2(u - rvN, 0.5)).r;
  float tl = mix(1.0, texture(uTell, vec2(u, 0.5)).r, uTell1);
  float f = s * tl;
  // Rossiter: the hidden strip of the disc stops absorbing at its own velocity.
  if (vB.x >= 0.0) {
    float off = vB.z * uRm / widthPx;
    float sh = texture(uStar, vec2(u - rvN - off, 0.5)).r;
    f += (1.0 - sh) * 0.3 * tl;

  // The blaze: an order is brightest at its centre.

    o.frequency.exponentialRampToValueAtTime(34, t + 0.35);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.32, t + 0.015);
    g.gain.exponentialRampToValueAtTime(1e-4, t + 0.45);
    o.connect(g).connect(kit.out);
    o.start(t); o.stop(t + 0.5);
  },
};
// Per frame: levels follow the stage; the cursor drives the tone and the thud.
function soundFrame(dt) {
  onTargetT += dt;
  // The cursor runs one orbit in 8 s, folded or not.
  const prev = phase;
  phase = (phase + dt / 8) % 1;
  const row = Math.floor(phase * N);
  const b = voices();
  if (b) {
    const t = b.ac.currentTime, set = (p, v, k = 0.08) => p.setTargetAtTime(v, t, k);
    // A wrong star pulls the hum's two sines apart the longer it stays.
    const spread = target.kind === 'wrong' ? 0.4 + 1.6 * clamp(onTargetT / 60) : locked ? 0.15 : 0.4;
    set(b.hum2.frequency, 54 + spread, 0.5);
    set(b.hissG.gain, 0.01 + 0.09 * Math.pow(1 - exposure, 2.2), 0.2);
    set(b.stirG.gain, clamp(stir) * 0.16, 0.05);
    if (locked) {
      // The tone bends with the star's velocity at the cursor's phase.
      const th = TAU * phase, rv = Math.sin(th) + (target.ecc || 0) * 0.8 * Math.sin(2 * th);
      set(b.tone.frequency, 220 * Math.pow(2, rv * 0.25), 0.05);
      set(b.toneG.gain, 0.07, 0.3);
      set(b.toneP.pan, rv * 0.5, 0.05);
      if (prev > phase) sfx.thud();
    } else set(b.toneG.gain, 0, 0.15);
    // The growl swells for 2 s each time the cursor meets a dip, at no set interval.
    if (target.kind === 'wrong' && P > 0 && row !== lastCursorRow && growlT <= 0) {
      const i = order[row], j = order[(row + N - 1) % N];
      const dip = k => E.gap[k] < 0.5 && E.flux[k] < 0.8;
      if (dip(i) && !dip(j)) growlT = 2;
    }
    growlT = Math.max(0, growlT - dt);
    const sw = growlT > 1.7 ? (2 - growlT) / 0.3 : growlT / 1.7;
    set(b.growlG.gain, 0.22 * sw, 0.08);
  }
  lastCursorRow = row;
  stir = Math.max(0, stir - dt * 2.5);
}

/* ---------- performance ladder ---------- */
// After 4 s of lively run time, 2 s of slow frames steps down one rung.
// Rungs: pixel ratio, then grain, then half the rows drawn.
let runT = 0, slowT = 0, ftAvg = 1 / 60;
function watchdog(raw, lively) {
  if (!lively || raw > 0.25) return;
  runT += raw;
  ftAvg += (raw - ftAvg) * 0.1;
  if (runT < 4 || rung >= 3) return;
  slowT = ftAvg > 1 / 38 ? slowT + raw : 0;
  if (slowT < 2) return;
  rung++;
  slowT = 0;
  ftAvg = 1 / 60;
  layout();
}

/* ---------- frame loop ---------- */
// Lively at full rate, drifting at 30 fps, asleep 60 s after the last input.
let raf = 0, last = 0, lastDraw = 0, visible = true, rested = false, lastInput = performance.now();
const SLEEP = 60000, EASE = 2000;
function live() { lastInput = performance.now(); wake(); }
function wake() {
  if (!raf && visible && Pg) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(now) {
  raf = 0;
  const raw = (now - last) / 1000, dt = Math.min(0.05, raw);
  const lively = settling();
  watchdog(raw, lively);
  last = now;
  const idle = now - lastInput;
  try {
    // The shutter closes over the last 2 s before sleep.
    const flow = clamp((SLEEP + EASE - idle) / EASE);
    time += dt;
    step(dt * (lively ? 1 : flow));
    soundFrame(dt);
    if (lively || now - lastDraw >= 31) { render(); lastDraw = now; }
  } finally {
    if (visible && (lively || idle < SLEEP + EASE)) raf = requestAnimationFrame(frame);
    // Once the stage settles, the audio context sleeps.
    if (!lively && !rested) { rested = true; kit.rest(() => !settling()); }
    if (lively) rested = false;
  }
}

/* ---------- boot ---------- */
try {
  telluric();
  template(target);
  await initGL();
  layout();
  // The first frame is a full stack in time order, no sweep.
  restack(false);
  render();
  gl.finish();
  canvas.classList.add('on');
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  readEl.hidden = true;
  ui.hideControls?.();
  markReady();
  throw err;
}
markReady();
wake();

/* ---------- pointer ---------- */
// A press turns into a fold after 8 px, or a hold after 260 ms. Else it is a tap.
const KX = 1 / 180, KY = 1 / 1400;
canvas.addEventListener('pointerdown', e => {
  if (press) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* a synthetic pointer has no capture */ }
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, fold: false, hold: false };
  holdT = setTimeout(() => { if (press && !press.fold) { press.hold = true; cut(e.clientX, e.clientY, true); } }, 260);
  live();
});
canvas.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) { if (!press && e.pointerType === 'mouse') cut(e.clientX, e.clientY, false); return; }
  // A hold that moves on becomes a fold; the cut goes away.
  if (!press.fold && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) {
    press.fold = true;
    press.hold = false;
    clearTimeout(holdT);
    uncut();
    press.lx = e.clientX; press.ly = e.clientY;
    stage.classList.add('fold');
  }
  if (press.fold) {
    // Across is the coarse dial; up and down is the fine one.
    scrub((e.clientX - press.lx) * KX - (e.clientY - press.ly) * KY);
    press.lx = e.clientX; press.ly = e.clientY;
  } else if (press.hold) cut(e.clientX, e.clientY, true);
  live();
});
function endPress(e) {
  if (!press || (e && e.pointerId !== press.id)) return;
  clearTimeout(holdT);
  if (!press.fold && !press.hold && e?.type === 'pointerup') cut(e.clientX, e.clientY, true);
  press = null;
  stage.classList.remove('fold');
  live();
}
canvas.addEventListener('pointerup', endPress);
canvas.addEventListener('pointercancel', endPress);
canvas.addEventListener('lostpointercapture', endPress);
canvas.addEventListener('pointerleave', () => { if (!press) uncut(); });
// The wheel is the fine dial on mouse devices.
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  scrub(-dy * 0.00035);
  live();
}, { passive: false });
// The cut: one row's spectrum, drawn across the top of the frame.
// Hover shows it while the pointer rests; a tap holds it for 2 s.
function cut(cx, cy, sticky) {
  const r = canvas.getBoundingClientRect();
  const x = (cx - r.left) * G.dpr, y = G.H - (cy - r.top) * G.dpr;
  const [x0, y0, x1, y1] = G.box;
  if (x < x0 || x > x1 || y < y0 || y > y1) { if (!sticky) uncut(); return; }
  const k = clamp(Math.floor((y1 - y) / G.rowH), 0, N - 1);
  cutRow = order[k];
  cutUntil = sticky ? performance.now() + 2000 : Infinity;
  live();
}
function uncut() { if (cutUntil === Infinity) cutRow = -1; }

window.__exo = () => ({ press, P, locked, raf, visible, target: target.name, kind: target.kind, lastInput: performance.now() - lastInput, ac: kit.ac?.state ?? 'none', cutRow, phase, stir, growlT, dbg: cutRow >= 0 ? { flux: E.flux[cutRow], gap: E.gap[cutRow], y: E.y[cutRow], rank: rank[cutRow], star: [star[100], star[1000], star[2000]], box: G.box, rowH: G.rowH, top: canvas.getBoundingClientRect().top, nMarks } : null });
new ResizeObserver(() => { layout(); if (Pg) render(); }).observe(stage);
onQuality(() => { rung = 0; slowT = 0; layout(); if (Pg) render(); });
// A hidden tab stops the loop and the exposure clock with it.
whenVisible(stage, v => {
  visible = v;
  if (!v) { cancelAnimationFrame(raf); raf = 0; if (kit.ac?.state === 'running') kit.ac.suspend().catch(() => {}); return; }
  wake();
});
</script>
