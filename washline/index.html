<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Washing line</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Washing line: a pulley line across a place, in a wide shot. */
:root { --stage: oklch(0.62 0.08 70); }
.stage--washline { touch-action: none; cursor: ew-resize; }
.stage--washline.on-peg { cursor: pointer; }
.stage--washline.on-cloth { cursor: grab; }
.stage--washline.held { cursor: grabbing; }
.stage--washline canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage--washline canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--washline canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Washing line</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--washline" id="stage" tabindex="0" role="application" aria-label="A pulley line crosses a narrow street between two windows, with washing pegged on it. Drag sideways to reel the line. Move the Sun slider behind the line and the cloth glows.">
      <p class="fail" hidden>Washing line needs WebGL 2, which this browser doesn't have.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Washing line</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { initPage, whenVisible, reduced, onReducedChange, oklchLinear, pixelRatio, onQuality } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import { H, WIND, makeLine, makePiece, hang, reel, stepWorld, unpeg, roomAtNear, cull, ropeAt } from './core.js';
import { makeLook } from './cloth.js';
import alley from './places/alley.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });

const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lin = ([L, C, h]) => oklchLinear(L, C, h).map(v => Math.max(0, v));
const v3 = a => new THREE.Vector3(...a);

/* ---------- the bar ---------- */
const PLACES = { alley };
// Handlers bind once the scene exists.
const act = { place() {}, sun() {}, wind() {}, add() {}, release() {} };
const ui = initPage({ id: 'washline', silent: true, bar: {
  choice: { label: 'Place', value: 'alley', options: Object.values(PLACES).map(p => ({ value: p.id, label: p.name })), onPick: v => act.place(v) },
  slider: { label: 'Sun', min: 0, max: 1, step: 0.001, value: 0.95, onInput: v => act.sun(v) },
  settings: [
    { type: 'choice', id: 'wind', label: 'Wind', value: 'breeze', persist: true, onPick: v => act.wind(v),
      options: [{ value: 'calm', label: 'Calm' }, { value: 'breeze', label: 'Breeze' }, { value: 'blowy', label: 'Blowy' }] },
  ],
  actions: [
    { verb: 'add', noun: 'Piece', onPress: () => act.add() },
    { verb: 'release', onPress: () => act.release() },
  ],
  quality: true,
  keys: [['click', 'unclip'], ['drag', 'pull'], ['drag line', 'reel']],
} });

const stage = document.getElementById('stage');
let reduce = reduced();
onReducedChange(v => { reduce = v; });
const st = { wind: ui.settings?.get?.('wind')?.value || 'breeze', sun: 0.95, windScale: 1, t: 0, lastInput: performance.now() };
if (!WIND[st.wind]) st.wind = 'breeze';

/* ---------- renderer ---------- */
const canvas = document.createElement('canvas');
stage.prepend(canvas);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
} catch {
  stage.querySelector('.fail').hidden = false;
  ui.hideControls?.();
  markReady();
  throw new Error('no WebGL 2');
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 900);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.3, 0.5, 1.4);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- sky ---------- */
// A gradient by ray height, a sun disc and a soft glow around it.
const skyU = {
  uInv: { value: new THREE.Matrix4() }, uSun: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Vector3() },
  uZen: { value: new THREE.Vector3() }, uHor: { value: new THREE.Vector3() }, uB: { value: 0 },
};
const sky = new THREE.Mesh(
  new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3)),
  new THREE.ShaderMaterial({ uniforms: skyU, depthTest: false, depthWrite: false,
    vertexShader: /* glsl */ `varying vec2 vP; void main() { vP = position.xy; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: /* glsl */ `
      varying vec2 vP;
      uniform mat4 uInv; uniform vec3 uSun, uSunCol, uZen, uHor; uniform float uB;
      void main() {
        vec4 w = uInv * vec4(vP, 1.0, 1.0);
        vec3 ray = normalize(w.xyz / w.w - cameraPosition);
        float e = max(ray.y, 0.0), cs = max(dot(ray, uSun), 0.0);
        vec3 col = mix(uHor, uZen, pow(e, 0.45));
        // A low sun warms the sky around it and along the horizon.
        col = mix(col, col * vec3(1.12, 0.94, 0.78), uB * 0.6 * (1.0 - e));
        col += uSunCol * uB * (0.06 * pow(cs, 4.0) + 0.22 * pow(cs, 40.0)) * (1.0 - 0.6 * e);
        col += uSunCol * (0.08 * pow(cs, 6.0) + 0.35 * pow(cs, 60.0) + 12.0 * smoothstep(0.99955, 0.9998, cs));
        gl_FragColor = vec4(col, 1.0);
      }` }));
sky.frustumCulled = false;
sky.renderOrder = -10;
scene.add(sky);

/* ---------- light ---------- */
const sunLight = new THREE.DirectionalLight(0xffffff, 3);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -16, right: 16, top: 20, bottom: -20, near: 1, far: 140 });
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.03;
const hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 1);
scene.add(sunLight, sunLight.target, hemi);
const SUN = { dir: new THREE.Vector3(), col: new THREE.Vector3(), b: 0 };
const WARM = v3(lin([0.9, 0.11, 60])), WHITE = v3(lin([0.98, 0.025, 85]));

/* ---------- the place ---------- */
const P = { place: null, set: null, line: null, look: null, d: 12 };
function buildPlace(id) {
  const pl = PLACES[id] || alley;
  if (P.set) { scene.remove(P.set); P.look.dispose(); }
  P.place = pl;
  skyU.uZen.value.copy(v3(lin(pl.sky.zen)));
  skyU.uHor.value.copy(v3(lin(pl.sky.hor)));
  scene.fog = new THREE.Fog(new THREE.Color().setRGB(...lin(pl.sky.haze)), ...(pl.fog || [30, 420]));
  hemi.color.setRGB(...lin(pl.sky.zen)).lerp(new THREE.Color(1, 1, 1), 0.5);
  hemi.groundColor.setRGB(...lin(pl.amb.lo));
  P.line = makeLine(pl.anchors.a, pl.anchors.b, { windDir: pl.windDir });
  P.look = makeLook(scene, P.line, { cord: pl.cord, peg: lin([0.62, 0.08, 65]), amb: { hi: lin(pl.amb.hi), lo: lin(pl.amb.lo) } });
  // The set builds after the look, so its still cloth can glow too.
  P.set = pl.build(scene, P.look);
  P.flyers = [];
  P.pending = null;
  // The wardrobe hangs left to right with small gaps.
  let s = pl.hangFrom ?? 0.3;
  for (const it of pl.wash.slice(0, pl.start ?? pl.wash.length)) { hangPiece(it, s); s += it.w + 0.14; }
  syncBar();
  setSun(st.sun);
  settle(2.5);
}

const GAP = 0.14, MAX_ON = 6;
function hangPiece(it, s0) {
  const c = makePiece({ w: it.w, h: it.h, col: 0 });
  hang(P.line, c, s0);
  P.look.addPiece(c, { alb: lin(it.c), tr: lin([Math.min(0.95, it.c[0] + 0.05), it.c[1] * 1.4, it.c[2]]) });
  return c;
}
// A new piece takes a size from the wardrobe and a colour from the palette.
function newPiece() {
  const pl = P.place, base = pl.wash[Math.floor(Math.random() * pl.wash.length)], k = 0.85 + Math.random() * 0.3;
  const pal = pl.palette || pl.wash.map(w => w.c);
  return { w: Math.min(1.6, base.w * k), h: base.h * k, c: pal[Math.floor(Math.random() * pal.length)] };
}
const onLine = () => P.line.pieces.filter(c => c.pegs.length).length;
function syncBar() {
  const add = ui.action?.('add'), rel = ui.action?.('release');
  if (add) add.disabled = !!P.pending || onLine() >= MAX_ON || roomAtNear(P.line, 0.9, GAP) === Infinity;
  if (rel) rel.disabled = !P.line.pieces.some(c => c.pegs.length);
}

function setSun(s) {
  st.sun = s;
  const pl = P.place;
  SUN.dir.copy(v3(pl.sun.front)).lerp(v3(pl.sun.back), s).normalize();
  const el = Math.asin(clamp(SUN.dir.y, -1, 1));
  SUN.col.copy(WARM).lerp(WHITE, smooth(0.2, 0.9, el)).multiplyScalar(2.6);
  SUN.b = smooth(0.45, 0.9, s);
}

/* ---------- draw ---------- */
const view = { w: 1, h: 1 };
function syncLight() {
  P.look.setSun(SUN.dir, SUN.col, SUN.b);
  skyU.uSun.value.copy(SUN.dir);
  skyU.uSunCol.value.copy(SUN.col);
  skyU.uB.value = SUN.b;
  bloom.strength = 0.3 + 0.12 * SUN.b;
  sunLight.target.position.set(0, 6, -8);
  sunLight.position.copy(sunLight.target.position).addScaledVector(SUN.dir, 60);
  sunLight.color.setRGB(SUN.col.x, SUN.col.y, SUN.col.z).multiplyScalar(1 / 2.6);
  sunLight.intensity = 3.2;
  hemi.intensity = 1.35 - 0.3 * SUN.b;
  renderer.toneMappingExposure = 1 - 0.3 * SUN.b;
  camera.updateMatrixWorld();
  skyU.uInv.value.copy(camera.matrixWorld).multiply(camera.projectionMatrixInverse);
}
// Per frame: the reel for a new piece, loose pegs, and pieces that leave.
function tick(dt) {
  if (P.pending) {
    const need = roomAtNear(P.line, P.pending.w, GAP);
    if (need === Infinity) P.pending = null;
    else if (need <= 1e-4) { hangPiece(P.pending, 0); P.pending = null; }
    else reel(P.line, Math.min(need, 3.2 * dt));
    if (!P.pending) syncBar();
  }
  for (const f of P.flyers) {
    f.vy -= 9.8 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
    f.rx += f.sx * dt; f.rz += f.sz * dt; f.age += dt;
  }
  P.flyers = P.flyers.filter(f => f.y > 0.15 && f.age < 4);
  const gone = cull(P.line, { r: 45, floor: -1 });
  if (gone.length) { for (const c of gone) P.look.removePiece(c); syncBar(); }
}
function draw() {
  P.look.sync(camera, view.h, P.flyers);
  syncLight();
  composer.render();
  if (!canvas.classList.contains('on')) { canvas.classList.add('on'); markReady(); }
}

/* ---------- size ---------- */
function resize() {
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  view.w = w; view.h = h;
  const dpr = pixelRatio(w, h, { maxDpr: 2 });
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
  P.place.frame(camera, w / h);
  kick();
}
const wind = () => ({ ...WIND[st.wind], scale: st.windScale * (reduce ? 0.3 : 1) });
// The first frame shows washing already moving in the wind.
function settle(sec) {
  for (let i = 0, n = Math.round(sec / H); i < n; i++) { st.t += H; stepWorld(P.line, st.t, wind()); }
}

/* ---------- frame loop ---------- */
// Lively after input: every frame; drifting in the wind: 30 fps.
// 60 s after the last input the wind eases to calm over 3 s; then the loop sleeps.
let raf = 0, visible = true, lastT = 0, lastDraw = 0, accum = 0, still = 0;
function kick() { if (!raf && visible) raf = requestAnimationFrame(frame); }
function wake() { st.lastInput = performance.now(); still = 0; kick(); }
function frame(now) {
  raf = 0;
  let busy = true;
  try {
    const idle = now - st.lastInput;
    if (idle > 1500 && now - lastDraw < 31) return;
    const dt = lastT ? Math.min(1 / 15, (now - lastT) / 1000) : 1 / 60;
    lastT = now;
    st.windScale = 1 - smooth(60000, 63000, idle);
    accum += dt;
    const w = wind();
    while (accum >= H) { accum -= H; st.t += H; stepWorld(P.line, st.t, w); }
    tick(dt);
    draw();
    lastDraw = now;
    // Calm air for one second puts the loop to sleep.
    const moving = P.flyers.length || P.pending || P.line.pieces.some(c => !c.pegs.length);
    if (st.windScale === 0 && !moving) { still += dt; busy = still < 1; } else still = 0;
  } finally {
    if (busy) kick(); else { lastT = 0; accum = 0; }
  }
}
whenVisible(stage, v => { visible = v; if (v) kick(); else { cancelAnimationFrame(raf); raf = 0; lastT = 0; accum = 0; } });

/* ---------- hands ---------- */
// Tap a peg to unclip it; drag cloth to pull it; drag elsewhere to reel.
const pa = new THREE.Vector3(), pb = new THREE.Vector3(), sv = new THREE.Vector3(), ray = new THREE.Vector3(), fwd = new THREE.Vector3();
const o3 = [0, 0, 0];
const coarse = matchMedia('(pointer: coarse)');
let drag = null;
function lineScreen() {
  pa.set(...P.line.a).project(camera); pb.set(...P.line.b).project(camera);
  const dx = (pb.x - pa.x) * view.w / 2, dy = (pa.y - pb.y) * view.h / 2;
  const px = Math.hypot(dx, dy) || 1;
  // Metres of line per pixel of drag along it.
  return { ux: dx / px, uy: dy / px, mpp: P.line.len / px };
}
function toScreen(x, y, z) {
  sv.set(x, y, z).project(camera);
  return [(sv.x + 1) / 2 * view.w, (1 - sv.y) / 2 * view.h];
}
function local(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
// Pegs win over cloth; a pegged corner is never grabbed.
function pick(px, py) {
  const pegR = coarse.matches ? 30 : 20, clothR = coarse.matches ? 26 : 16;
  let best = null, bd = pegR;
  for (const c of P.line.pieces) c.pegs.forEach((g, i) => {
    ropeAt(P.line.rope, g.s, o3);
    const [sx, sy] = toScreen(o3[0], o3[1] - 0.02, o3[2]), d = Math.hypot(sx - px, sy - py);
    if (d < bd) { bd = d; best = { kind: 'peg', c, i }; }
  });
  if (best) return best;
  bd = clothR;
  for (const c of P.line.pieces) for (let p = 0; p < c.n; p++) {
    if (!c.inv[p]) continue;
    const [sx, sy] = toScreen(c.x[p], c.y[p], c.z[p]), d = Math.hypot(sx - px, sy - py);
    if (d < bd) { bd = d; best = { kind: 'cloth', c, p }; }
  }
  return best;
}
// The pointer's point at a given depth along the view.
function atDepth(px, py, depth, out) {
  ray.set(px / view.w * 2 - 1, 1 - py / view.h * 2, 0.5).unproject(camera).sub(camera.position).normalize();
  camera.getWorldDirection(fwd);
  return out.copy(camera.position).addScaledVector(ray, depth / Math.max(0.05, ray.dot(fwd)));
}
function popPeg(c, i) {
  ropeAt(P.line.rope, c.pegs[i].s, o3);
  const r = Math.random;
  P.flyers.push({ x: o3[0], y: o3[1], z: o3[2], vx: (r() - 0.5) * 1.6, vy: 1.4 + r(), vz: 0.6 + r(), rx: 0, ry: r() * 6, rz: 0, sx: 8 + r() * 8, sz: (r() - 0.5) * 14, age: 0 });
  unpeg(c, i);
  syncBar();
}
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target !== canvas) return;
  const [px, py] = local(e), hit = pick(px, py);
  stage.setPointerCapture(e.pointerId);
  wake();
  if (hit?.kind === 'peg') { popPeg(hit.c, hit.i); return; }
  if (hit?.kind === 'cloth') {
    const { c, p } = hit;
    camera.getWorldDirection(fwd);
    const depth = sv.set(c.x[p], c.y[p], c.z[p]).sub(camera.position).dot(fwd);
    c.inv[p] = 0;
    drag = { id: e.pointerId, kind: 'cloth', c, p, depth };
    stage.classList.add('held');
    return;
  }
  drag = { id: e.pointerId, kind: 'reel', x: e.clientX, y: e.clientY, ...lineScreen() };
});
stage.addEventListener('pointermove', e => {
  if (!drag) {
    // Hover shows what a press would do.
    if (e.pointerType === 'mouse') {
      const [px, py] = local(e), hit = pick(px, py);
      stage.classList.toggle('on-peg', hit?.kind === 'peg');
      stage.classList.toggle('on-cloth', hit?.kind === 'cloth');
    }
    return;
  }
  if (e.pointerId !== drag.id) return;
  if (drag.kind === 'cloth') {
    const { c, p } = drag, [px, py] = local(e);
    atDepth(px, py, drag.depth, sv);
    c.px[p] = c.x[p]; c.py[p] = c.y[p]; c.pz[p] = c.z[p];
    c.x[p] = sv.x; c.y[p] = sv.y; c.z[p] = sv.z;
  } else {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    reel(P.line, (dx * drag.ux + dy * drag.uy) * drag.mpp);
  }
  wake();
});
const end = e => {
  if (!drag || e.pointerId !== drag.id) return;
  // A released corner swings free unless a peg holds it.
  if (drag.kind === 'cloth' && !drag.c.pegs.some(g => g.p === drag.p)) drag.c.inv[drag.p] = 1;
  drag = null;
  stage.classList.remove('held');
};
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);

/* ---------- controls ---------- */
act.place = v => { buildPlace(v); resize(); wake(); };
act.sun = v => { setSun(v); wake(); };
act.wind = v => { if (WIND[v]) st.wind = v; wake(); };
// + Piece reels the line out until the near end is free, then hangs it.
act.add = () => {
  if (P.pending || onLine() >= MAX_ON) return;
  const it = newPiece();
  if (roomAtNear(P.line, it.w, GAP) === Infinity) return;
  P.pending = it;
  syncBar();
  wake();
};
// Release takes every peg off at once.
act.release = () => {
  for (const c of P.line.pieces) while (c.pegs.length) popPeg(c, c.pegs.length - 1);
  wake();
};

buildPlace('alley');
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
resize();
P.look.sync(camera, view.h);
syncLight();
await renderer.compileAsync(scene, camera);
draw();
</script>
</body>
</html>
