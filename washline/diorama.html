<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}

<script type="module">

import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { createNoise3D } from 'simplex-noise';
import { initPage, whenVisible, reduced, onReducedChange, oklchLinear, pixelRatio, onQuality, quality } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(8000)])]) });

const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- the bar ---------- */
// Handlers bind once the scene exists.
// Themes appear here one by one, each signed off before the next.
const SCENES = [['prairie', 'Prairie'], ['winter', 'Winter']];
const firstScene = (() => {
  const q = new URLSearchParams(location.search).get('scene');
  let saved = null;
  try { saved = localStorage.getItem('stimming.washline.dscene'); } catch { /* storage can be blocked */ }
  return [q, saved].find(v => SCENES.some(([id]) => id === v)) || 'prairie';
})();
const act = { scene() {}, wind() {}, sun() {}, add() {}, release() {}, fabric() {}, line() {}, view() {} };
const ui = initPage({ id: 'washline', silent: true, bar: {
  choice: { label: 'Scene', value: firstScene, options: SCENES.map(([value, label]) => ({ value, label })), onPick: v => act.scene(v) },
  slider: { label: 'Sun', min: 0, max: 1, step: 0.001, value: 0.3, onInput: v => act.sun(v) },
  actions: [
    { verb: 'add', noun: 'Sheet', onPress: () => act.add() },
    { verb: 'release', onPress: () => act.release() },
  ],
  settings: [
    { type: 'choice', id: 'wind', label: 'Wind', value: 'gusty', onPick: v => act.wind(v),
      options: [{ value: 'breeze', label: 'Breeze' }, { value: 'gusty', label: 'Gusty' }, { value: 'gale', label: 'Gale' }] },
    { type: 'choice', id: 'fabric', label: 'Fabric', value: 'cotton', persist: true, onPick: v => act.fabric(v),
      options: [{ value: 'cotton', label: 'Cotton' }, { value: 'linen', label: 'Linen' }, { value: 'silk', label: 'Silk' }] },
    { type: 'choice', id: 'view', label: 'View', value: 'wide', persist: true, onPick: v => act.view(v),
      options: [{ value: 'wide', label: 'Wide' }, { value: 'iso', label: 'Iso' }] },
    { type: 'choice', id: 'line', label: 'Line', value: 'slack', persist: true, onPick: v => act.line(v),
      options: [{ value: 'slack', label: 'Slack' }, { value: 'taut', label: 'Taut' }] },
  ],
  quality: true,
  keys: [['click', 'unclip'], ['drag', 'pull'], ['tap sky', 'gust'], ['space', 'sheet']],
} });

const stage = document.getElementById('stage');
let reduce = reduced();
onReducedChange(v => { reduce = v; });

/* ---------- K4: Verlet rope ---------- */
// Lifted from balloons/ (physics: verlet strings); Pull chain is not built yet.
// This copy adds a z array, so ropes move in 3D.
// It adds cloth: a grid of Verlet points pinned to a rope at its pegs.
const K4 = {
  // A rope is a chain of points with one rest length per segment.
  makeRope(n, x0, y0, x1, y1, len, mass) {
    const r = {
      n, seg: len / (n - 1), mass,
      x: new Float32Array(n), y: new Float32Array(n), z: new Float32Array(n),
      px: new Float32Array(n), py: new Float32Array(n), pz: new Float32Array(n),
      fx: new Float32Array(n), fy: new Float32Array(n), fz: new Float32Array(n),
      pin: new Uint8Array(n),
    };
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      r.x[i] = r.px[i] = lerp(x0, x1, t);
      r.y[i] = r.py[i] = lerp(y0, y1, t);
    }
    r.pin[0] = r.pin[n - 1] = 1;
    return r;
  },
  // Gravity and the loads in fx, fy, fz move each free point.
  stepRope(r, h, damp) {
    const h2 = h * h, im = 1 / r.mass;
    for (let i = 0; i < r.n; i++) {
      if (r.pin[i]) continue;
      const vx = (r.x[i] - r.px[i]) * damp, vy = (r.y[i] - r.py[i]) * damp, vz = (r.z[i] - r.pz[i]) * damp;
      r.px[i] = r.x[i]; r.py[i] = r.y[i]; r.pz[i] = r.z[i];
      r.x[i] += vx + r.fx[i] * im * h2;
      r.y[i] += vy + (r.fy[i] * im - 9.8) * h2;
      r.z[i] += vz + r.fz[i] * im * h2;
    }
  },
  // One pass pulls each segment back to its rest length.
  solveRope(r) {
    const x = r.x, y = r.y, z = r.z, pin = r.pin;
    for (let i = 0; i < r.n - 1; i++) {
      const dx = x[i + 1] - x[i], dy = y[i + 1] - y[i], dz = z[i + 1] - z[i];
      const d = Math.hypot(dx, dy, dz) || 1e-9;
      const wa = pin[i] ? 0 : 1, wb = pin[i + 1] ? 0 : 1, ws = wa + wb;
      if (!ws) continue;
      const k = (d - r.seg) / (d * ws);
      x[i] += dx * k * wa; y[i] += dy * k * wa; z[i] += dz * k * wa;
      x[i + 1] -= dx * k * wb; y[i + 1] -= dy * k * wb; z[i + 1] -= dz * k * wb;
    }
  },
  // A cloth is a grid of points with structural, shear and bend links.
  // A mask(u, v) cuts a garment shape out of the grid.
  makeCloth(w, h, cols, rows, x0, y0, z0, mask = null) {
    const n = cols * rows, dx = w / (cols - 1), dy = h / (rows - 1);
    const c = {
      w, h, cols, rows, n,
      x: new Float32Array(n), y: new Float32Array(n), z: new Float32Array(n),
      px: new Float32Array(n), py: new Float32Array(n), pz: new Float32Array(n),
      ax: new Float32Array(n), ay: new Float32Array(n), az: new Float32Array(n),
      inv: new Float32Array(n).fill(1),
    };
    for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
      const p = i * cols + j;
      c.x[p] = c.px[p] = x0 + j * dx;
      c.y[p] = c.py[p] = y0 - i * dy;
      c.z[p] = c.pz[p] = z0 + 0.002 * Math.sin(j * 1.7 + i * 0.9);
    }
    c.act = new Uint8Array(n);
    c.uv = new Float32Array(n * 2);
    for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
      const p = i * cols + j, u = j / (cols - 1), v = i / (rows - 1);
      c.uv[p * 2] = u; c.uv[p * 2 + 1] = v;
      c.act[p] = !mask || mask(u, v) ? 1 : 0;
    }
    // The grid grows one point past the shape; the shader cuts the exact edge.
    const raw = c.act.slice();
    for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
      let on = 0;
      for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
        const ii = i + a, jj = j + b;
        if (ii >= 0 && jj >= 0 && ii < rows && jj < cols && raw[ii * cols + jj]) on = 1;
      }
      c.act[i * cols + j] = on;
      if (!on) c.inv[i * cols + j] = 0;
    }
    c.na = c.act.reduce((s, a) => s + a, 0);
    const A = [], B = [], R = [], K = [];
    const link = (a, b, k) => { if (!c.act[a] || !c.act[b]) return; A.push(a); B.push(b); R.push(Math.hypot(c.x[a] - c.x[b], c.y[a] - c.y[b])); K.push(k); };
    for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
      const p = i * cols + j;
      if (j < cols - 1) link(p, p + 1, 1);
      if (i < rows - 1) link(p, p + cols, 1);
      if (i < rows - 1 && j < cols - 1) { link(p, p + cols + 1, 0.9); link(p + 1, p + cols, 0.9); }
      // Bend links span two points; their stiffness is the fabric's.
      if (j < cols - 2) link(p, p + 2, -1);
      if (i < rows - 2) link(p, p + 2 * cols, -1);
    }
    c.a = Int32Array.from(A); c.b = Int32Array.from(B); c.rest = Float32Array.from(R); c.k = Float32Array.from(K);
    const T = [];
    for (let i = 0; i < rows - 1; i++) for (let j = 0; j < cols - 1; j++) {
      const p = i * cols + j;
      const on = q => c.act[q];
      if (on(p) && on(p + cols) && on(p + 1)) T.push(p, p + cols, p + 1);
      if (on(p + 1) && on(p + cols) && on(p + cols + 1)) T.push(p + 1, p + cols, p + cols + 1);
    }
    c.tris = Uint16Array.from(T);
    return c;
  },
  // Gravity and the accelerations in ax, ay, az move each free point.
  // Each step moves a point 0.05 units at most, so a yank cannot blow up.
  stepCloth(c, h, damp) {
    const h2 = h * h, MAX = 0.05;
    for (let p = 0; p < c.n; p++) {
      if (!c.inv[p]) continue;
      let sx = (c.x[p] - c.px[p]) * damp + c.ax[p] * h2;
      let sy = (c.y[p] - c.py[p]) * damp + (c.ay[p] - 9.8) * h2;
      let sz = (c.z[p] - c.pz[p]) * damp + c.az[p] * h2;
      const s = Math.hypot(sx, sy, sz);
      if (s > MAX) { const f = MAX / s; sx *= f; sy *= f; sz *= f; }
      c.px[p] = c.x[p]; c.py[p] = c.y[p]; c.pz[p] = c.z[p];
      c.x[p] += sx; c.y[p] += sy; c.z[p] += sz;
    }
  },
  // One pass over every link; bend links take the fabric's stiffness.
  solveCloth(c, bend) {
    const x = c.x, y = c.y, z = c.z, inv = c.inv, A = c.a, B = c.b, R = c.rest, K = c.k;
    for (let i = 0, m = A.length; i < m; i++) {
      const a = A[i], b = B[i], wa = inv[a], wb = inv[b], ws = wa + wb;
      if (!ws) continue;
      const dx = x[b] - x[a], dy = y[b] - y[a], dz = z[b] - z[a];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-9;
      const k = ((d - R[i]) / (d * ws)) * (K[i] < 0 ? bend : K[i]);
      x[a] += dx * k * wa; y[a] += dy * k * wa; z[a] += dz * k * wa;
      x[b] -= dx * k * wb; y[b] -= dy * k * wb; z[b] -= dz * k * wb;
    }
  },
};
/* ---------- end K4 ---------- */


/* ---------- wind ---------- */
// Gusts are noise that scrolls downwind, so they travel along the line.
const noise3D = createNoise3D(() => 0.4127);
const WIND = {
  breeze: { u: 1.1, gust: 0.5, turb: 0.35 },
  gusty: { u: 1.9, gust: 0.95, turb: 0.5 },
  gale: { u: 4.2, gust: 0.6, turb: 0.75 },
};
const DIR_X = 0.55, DIR_Z = 0.835;
const RHO_C = 1.2 * 0.8;
const st = { wind: 'gusty', sun: 0.86, windScale: 1, scroll: 0, drift: 0, t: 0, lastInput: performance.now() };
// A tap on the sky sends one gust in from that side.
const gusts = [];
const windOut = [0, 0, 0];
function windAt(x, y, t, free) {
  const w = WIND[st.wind], U = w.u * st.windScale * (reduce ? 0.3 : 1);
  const s = x * 0.2 - st.scroll;
  const k = Math.max(0.05, 1 + w.gust * noise3D(s, y * 0.15, t * 0.07));
  const tw = noise3D(s * 3.1 + 11, y * 0.9, t * 0.6) * w.turb;
  let wx = U * (k * DIR_X + tw * 0.4), wy = U * tw * 0.3, wz = U * (k * DIR_Z + tw * 0.3);
  for (const g of gusts) {
    const age = t - g.t0, front = g.x0 + g.dir * 3.4 * age, d = (x - front) / 1.5;
    const b = g.amp * Math.exp(-d * d) * smooth(0, 0.3, age) * (1 - smooth(4, 6, age));
    wx += g.dir * b * 0.8; wy += b * 0.2; wz += b * 0.6;
  }
  // Loose cloth rides an updraft and sails downwind.
  if (free) { wx = wx * 1.4 + 0.9 * g1(); wy += U * 1.1 + 1.5; wz *= 0.3; }
  windOut[0] = wx; windOut[1] = wy; windOut[2] = wz;
  return windOut;
}
const g1 = () => (WIND[st.wind].u > 3 ? 1.6 : 1);


/* ---------- the washing ---------- */
const lin = (L, C, h) => oklchLinear(L, C, h).map(v => Math.max(0, v));
const okl = ([L, C, h], a = 1) => `oklch(${L} ${C} ${h} / ${a})`;
const COLOURS = {
  white: [0.97, 0.006, 95], cream: [0.93, 0.03, 88], sky: [0.8, 0.08, 236], navy: [0.4, 0.09, 262],
  denim: [0.5, 0.085, 252], red: [0.6, 0.18, 27], coral: [0.74, 0.13, 36], yellow: [0.88, 0.14, 95],
  mint: [0.86, 0.08, 165], sage: [0.7, 0.06, 145], pink: [0.83, 0.07, 8], lilac: [0.76, 0.08, 305],
  charcoal: [0.36, 0.012, 260], khaki: [0.74, 0.05, 82], lemon: [0.9, 0.15, 100],
  mustard: [0.8, 0.13, 84], powder: [0.85, 0.05, 228],
};
const ANY = Object.keys(COLOURS);
// Each item: size in metres, peg spots, weight, shape, colours, patterns.
// Shapes take u across and v down, from the pegged edge.
const ITEMS = {
  sheet: { w: [1.15, 1.3], h: [0.95, 1.1], pegs: [0, 0.5, 1], kg: 1, cols: ['white', 'cream', 'sky', 'mint', 'pink', 'yellow'], pats: [0, 0, 1] },
  towel: { w: [0.85, 1.05], h: [0.5, 0.62], pegs: [0, 1], kg: 2.4, cols: ANY, pats: [2, 2, 0], weave: 'terry' },
  tee: { w: [0.88, 0.98], h: [0.7, 0.78], pegs: [0.3, 0.7], kg: 1.1, cols: ANY, pats: [0, 0, 9, 1], weave: 'jersey',
    // Hung by the shoulders: a neck at the top, sleeves out to the sides.
    mask(u, v) {
      const a = Math.min(u, 1 - u);
      if (a >= 0.2) return (u - 0.5) ** 2 / 0.017 + v * v / 0.0064 > 1;
      return v > (0.2 - a) * 0.45 && v < 0.36 + (0.2 - a) * 0.15;
    } },
  trousers: { w: [0.42, 0.48], h: [0.92, 1.02], pegs: [0, 1], kg: 2.4, cols: ['denim', 'denim', 'navy', 'charcoal', 'khaki'], pats: [0], weave: 'twill',
    // Hung by the waist: two legs part below the seat and taper.
    mask(u, v) { const a = Math.abs(u - 0.5); return a < 0.5 - 0.07 * v && (v < 0.32 || a > 0.015 + 0.07 * (v - 0.32) / 0.68); } },
  dress: { w: [0.72, 0.85], h: [0.95, 1.1], pegs: [0.3, 0.7], kg: 0.9, cols: ['red', 'yellow', 'lilac', 'sky', 'mint', 'coral', 'navy'], pats: [0, 3, 4],
    // Hung by the straps: bodice, waist, then a flared skirt.
    mask(u, v) {
      const a = Math.abs(u - 0.5);
      if (v < 0.12) return a > 0.15 && a < 0.23;
      if (v < 0.42) return a < 0.25 - 0.06 * (v - 0.12) / 0.3;
      return a < 0.19 + 0.31 * (v - 0.42) / 0.58;
    } },
  pillow: { w: [0.62, 0.72], h: [0.44, 0.5], pegs: [0, 1], kg: 1, cols: ['white', 'cream', 'sky', 'pink', 'yellow'], pats: [0, 3] },
  cloth: { w: [0.42, 0.48], h: [0.62, 0.7], pegs: [0, 1], kg: 1.3, cols: ['white', 'cream'], pats: [3, 1] },
  sock: { w: [0.12, 0.14], h: [0.36, 0.42], pegs: [0.3], kg: 1.6, cols: ANY, pats: [0, 2], weave: 'jersey',
    // Hung by the cuff: the leg, then the foot turns out.
    mask(u, v) { return v < 0.72 ? u < 0.56 : !(u > 0.82 && v > 0.9 && (u - 0.82) ** 2 + (v - 0.9) ** 2 > 0.012); } },
};
ITEMS.longjohns = { w: [0.72, 0.82], h: [1.3, 1.45], pegs: [0.32, 0.68], kg: 2.6, cols: ['red'], pats: [0], weave: 'jersey',
  // Hung by the shoulders: long sleeves, a buttoned front, two legs.
  mask(u, v) {
    const a = Math.min(u, 1 - u), c = Math.abs(u - 0.5);
    if (a >= 0.22) {
      if (c * c / 0.012 + v * v / 0.004 <= 1) return false;
      if (v > 0.56) return c > 0.012 + 0.05 * (v - 0.56) / 0.44 && c < 0.28 - 0.05 * (v - 0.56) / 0.44;
      return true;
    }
    return a > 0.03 && v > (0.22 - a) * 0.3 && v < 0.5 - (0.22 - a) * 0.25;
  } };
ITEMS.flannel = { w: [0.95, 1.05], h: [0.78, 0.86], pegs: [0.3, 0.7], kg: 1.6, cols: ['red', 'navy', 'sage', 'khaki', 'red'], pats: [10], weave: 'twill', mask: ITEMS.tee.mask };
const MIX = ['sheet', 'towel', 'tee', 'trousers', 'dress', 'pillow', 'cloth', 'sock', 'tee'];
// A mirrored copy flips the shape and the pegs, as in a reflection.
const itemMask = it => (it.I.mask ? (it.flip ? (u, v) => it.I.mask(1 - u, v) : it.I.mask) : null);
function rollItem(kind = pick(T ? T.mix : MIX)) {
  const I = ITEMS[kind];
  const a = pick(I.cols);
  let b = pick(['white', 'cream', 'red', 'navy', 'sky']);
  for (let k = 0; k < 8 && b === a; k++) b = pick(['white', 'cream', 'red', 'navy', 'sky']);
  return { kind, I, w: rnd(...I.w), h: rnd(...I.h), alb: COLOURS[a], alb2: COLOURS[b], pat: pick(I.pats), freq: rnd(5, 8) };
}
const FABRICS = {
  cotton: { bend: 0.25, damp: 0.992, kgm2: 0.2, tau: 0.62, rough: 0.9, sheen: 0.9 },
  linen: { bend: 0.55, damp: 0.99, kgm2: 0.26, tau: 0.45, rough: 0.95, sheen: 0.6 },
  silk: { bend: 0.05, damp: 0.996, kgm2: 0.08, tau: 0.85, rough: 0.38, sheen: 0.35 },
};
let FABRIC = FABRICS.cotton;
const SLACK = { slack: 1.03, taut: 1.008 };
let slack = SLACK.slack;

/* ---------- the field ---------- */

    at.set(r.x[i], r.y[i] + 0.012, r.z[i]);

    at.y -= 0.016;
    springMesh.setMatrixAt(k++, mtx.compose(at, q, one));
  }
  for (const f of sim.flyers) {
    if (k >= PEG_MAX) break;
    q.setFromAxisAngle(zAxis, f.a);
    at.set(f.x, f.y, f.z);
    pegMesh.setMatrixAt(k, mtx.compose(at, q, one));
    springMesh.setMatrixAt(k++, mtx.compose(at, q, one));
  }
  pegMesh.count = springMesh.count = k;
  pegMesh.instanceMatrix.needsUpdate = springMesh.instanceMatrix.needsUpdate = true;
}
function syncLight() {
  skyU.uB.value = SUN.b;
  clothU.uTrans.value = FABRIC.tau * (0.15 + 0.85 * SUN.b);
  renderer.toneMappingExposure = T.exp * lerp(1.05, 0.85, SUN.b);
  camera.updateMatrixWorld();
  skyU.uInv.value.copy(camera.matrixWorld).multiply(camera.projectionMatrixInverse);
  skyU.uDrift.value.set(st.drift, st.drift * 0.25);
  skyU.uLift.value = 0.03;
  grassU.uTime.value = st.t;
  grassU.uWind.value = WIND[st.wind].u * st.windScale * (reduce ? 0.3 : 1);
  grassU.uScroll.value = st.scroll;
  if (fan) fan.rotation.z = -st.t * (0.6 + WIND[st.wind].u * 0.5) * st.windScale;
  if (snow.visible) {
    snowU.uTime.value = st.t;
    snowU.uWind.value = WIND[st.wind].u * st.windScale;
    // An orthographic view has no depth to scale by; a fixed size stands in.
    snowU.uPx.value = camera.isOrthographicCamera ? view.h * renderer.getPixelRatio() * 0.9 : (view.h * renderer.getPixelRatio()) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  }
  grassU.uGlow.value.copy(SUN.col).multiplyScalar(0.22 * SUN.b);
  // The sharp band follows the middle of the washing on screen.
  ndc.set(0, LINE_Y - 0.45, 0).project(camera);
  tiltH.uniforms.uFocus.value = tiltV.uniforms.uFocus.value = ndc.y * 0.5 + 0.5;
}
function draw() {
  syncScene();
  syncLight();
  composer.render();
  if (!canvas.classList.contains('on')) { canvas.classList.add('on'); markReady(); }
}

/* ---------- free cloth and flying pegs ---------- */
const ndc = new THREE.Vector3();
function loose(dt) {
  for (let i = sim.flyers.length - 1; i >= 0; i--) {
    const f = sim.flyers[i];
    if (f.rest) { f.t += dt; if (f.t > 12) sim.flyers.splice(i, 1); continue; }
    f.vy -= 9.8 * dt;
    f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt; f.a += f.w * dt; f.t += dt;
    // A peg that lands on the lawn lies there a while.
    if (f.y < 0.012 && onLawn(f.x, f.z)) { f.y = 0.012; f.rest = true; f.a = Math.PI / 2 * Math.sign(f.w); f.t = 0; }
    else if (f.y < -4) sim.flyers.splice(i, 1);
  }
  for (const c of [...sim.sheets]) {
    if (!c.free) continue;
    const mid = c.mid;
    ndc.set(c.x[mid], c.y[mid], c.z[mid]).project(camera);
    const age = st.t - c.freeT, held = grab && grab.c === c;
    const out = Math.abs(ndc.x) > 1.4 || ndc.y > 1.3 || ndc.z > 1 || c.z[mid] > camera.position.z - 0.5;
    if (!held && (reduce || age > 20)) c.mesh.material.opacity = 1;
    if (!held && (out || (reduce && age > 1.2) || age > 22)) { removeSheet(c); updateActions(); }
  }
}

/* ---------- camera ---------- */
// One fixed shot, the line slightly below eye level, its ends past the frame on a phone.
const view = { w: 1, h: 1 };
function frameCamera() {
  const a = view.w / view.h, narrow = a < 1;
  if (viewMode === 'iso') {
    // True isometric: 45 degrees round, 35.26 degrees down, no perspective.
    const h = narrow ? 11 : 8.4, w = h * a;
    Object.assign(isoCam, { left: -w / 2, right: w / 2, top: h / 2, bottom: -h / 2 });
    isoCam.position.set(0.3 - 30 * 0.57735, 0.9 + 30 * 0.57735, 30 * 0.57735);
    isoCam.lookAt(0.3, 0.9, 0);
    camera = isoCam;
  } else {
    // A wide lens, level and set back: the line crosses the frame on a gentle slant.
    persp.fov = narrow ? 72 : 54;
    persp.aspect = a;
    persp.position.set(VIEW.x, 1.25, VIEW.z);
    persp.lookAt(narrow ? 0.4 : 0.9, 1.4, -0.5);
    camera = persp;
  }
  renderPass.camera = camera;
  // Iso reads as a model: a soft tilt-shift band through the line.
  tiltH.enabled = tiltV.enabled = viewMode === 'iso';
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
}
function resize() {
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  view.w = w; view.h = h;
  const dpr = pixelRatio(w, h, { maxDpr: 2 });
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
  for (const p of [tiltH, tiltV]) p.uniforms.uRes.value.set(w * dpr, h * dpr);
  frameCamera();
  kick();
}
function settle(sec) {
  for (let i = 0, n = Math.round(sec / H); i < n; i++) { st.t += H; advance(H); step(st.t); }
}
function advance(dt) {
  const U = WIND[st.wind].u * st.windScale;
  st.scroll += U * DIR_X * 0.16 * dt;
  st.drift += U * 0.004 * dt;
}

/* ---------- frame loop ---------- */
// Lively after input: every frame. Drifting in the wind: 30 fps.
// 60 s after the last input the wind eases to calm over 3 s; then the loop sleeps.
let raf = 0, visible = true, lastT = 0, lastDraw = 0, accum = 0, still = 0;
function kick() { if (!raf && visible) raf = requestAnimationFrame(frame); }
function wake() { st.lastInput = performance.now(); still = 0; kick(); }
function frame(now) {
  raf = 0;
  let busy = true;
  try {
    const idle = now - st.lastInput;
    const lively = idle < 1500 || press || sim.flyers.some(f => !f.rest) || sim.sheets.some(c => c.free);
    if (!lively && now - lastDraw < 31) return;
    const dt = lastT ? Math.min(1 / 15, (now - lastT) / 1000) : 1 / 60;
    lastT = now;
    st.windScale = 1 - smooth(60000, 63000, idle);
    advance(dt);
    accum += dt;
    while (accum >= H) { accum -= H; st.t += H; step(st.t); }
    loose(dt);
    draw();
    lastDraw = now;
    if (st.windScale === 0 && !lively) { still += dt; busy = still < 1; } else still = 0;
  } finally {
    if (busy) kick(); else { lastT = 0; accum = 0; }
  }
}
whenVisible(stage, v => { visible = v; if (v) kick(); else { cancelAnimationFrame(raf); raf = 0; lastT = 0; accum = 0; } });

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(), ptrN = new THREE.Vector2(), plane = new THREE.Plane(), hitV = new THREE.Vector3(), fwd = new THREE.Vector3();
const local = e => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
function toScreen(x, y, z) { ndc.set(x, y, z).project(camera); return [(ndc.x + 1) * view.w / 2, (1 - ndc.y) * view.h / 2]; }
function aim(p) { ptrN.set((p.x / view.w) * 2 - 1, 1 - (p.y / view.h) * 2); ray.setFromCamera(ptrN, camera); }
function pickPeg(p, reach) {
  let best = null, bd = reach;
  for (const pg of sim.pegs) {
    const r = sim.rope, [sx, sy] = toScreen(r.x[pg.ri], r.y[pg.ri], r.z[pg.ri]), d = Math.hypot(sx - p.x, sy - p.y);
    if (d < bd) { bd = d; best = pg; }
  }
  return best;
}
function pickCloth(p) {
  aim(p);
  const hits = ray.intersectObjects(sim.sheets.map(c => c.mesh), false);
  if (!hits.length) return null;
  const h = hits[0], c = h.object.userData.cloth;
  let best = -1, bd = Infinity;
  for (const i of [h.face.a, h.face.b, h.face.c]) {
    if (c.pegs.some(pg => pg.p === i)) continue;
    const d = Math.hypot(c.x[i] - h.point.x, c.y[i] - h.point.y, c.z[i] - h.point.z);
    if (d < bd) { bd = d; best = i; }
  }
  return best < 0 ? null : { c, p: best, point: h.point.clone() };
}
function pickLine(p, reach) {
  const r = sim.rope;
  let best = -1, bd = reach, prev = toScreen(r.x[0], r.y[0], r.z[0]);
  for (let i = 1; i < r.n; i++) {
    const cur = toScreen(r.x[i], r.y[i], r.z[i]);
    const ex = cur[0] - prev[0], ey = cur[1] - prev[1], L2 = ex * ex + ey * ey || 1;
    const t = clamp(((p.x - prev[0]) * ex + (p.y - prev[1]) * ey) / L2);
    const d = Math.hypot(prev[0] + ex * t - p.x, prev[1] + ey * t - p.y);
    if (d < bd && !r.pin[t < 0.5 ? i - 1 : i]) { bd = d; best = t < 0.5 ? i - 1 : i; }
    prev = cur;
  }
  return best < 0 ? null : best;
}
function target(p, g) {
  aim(p);
  if (ray.ray.intersectPlane(plane, hitV)) { g.tx = hitV.x; g.ty = hitV.y; g.tz = hitV.z; }
}
function holdPlane(x, y, z) { camera.getWorldDirection(fwd); plane.setFromNormalAndCoplanarPoint(fwd, hitV.set(x, y, z)); }

/* ---------- pointer ---------- */
// A press becomes a drag after 8 px, or a hold after 260 ms; else a tap.
let press = null, grab = null, pluck = null;
function begin() {
  const p = press;
  if (p.cloth) {
    const c = p.cloth.c;
    grab = { c, p: p.cloth.p };
    c.inv[grab.p] = 0;
    holdPlane(c.x[grab.p], c.y[grab.p], c.z[grab.p]);
    target(p.now, grab);
  } else if (p.line != null) {
    const r = sim.rope;
    pluck = { i: p.line };
    r.pin[pluck.i] = 1;
    holdPlane(r.x[pluck.i], r.y[pluck.i], r.z[pluck.i]);
    target(p.now, pluck);
  }
  stage.classList.toggle('held', !!(grab || pluck));
}
function endGesture() {
  if (grab) { const c = grab.c; if (!c.pegs.some(pg => pg.p === grab.p)) c.inv[grab.p] = 1; grab = null; }
  if (pluck) { sim.rope.pin[pluck.i] = 0; pluck = null; }
  stage.classList.remove('held');
}
function tap(p) {
  const touch = p.type !== 'mouse';
  if (p.peg) { unclip(p.peg); return; }
  if (p.cloth) {
    const { c, point } = p.cloth;
    for (let i = 0; i < c.n; i++) {
      const d = Math.hypot(c.x[i] - point.x, c.y[i] - point.y);
      if (d < 0.3 && c.inv[i]) c.pz[i] += 0.025 * (1 - d / 0.3);
    }
    return;
  }
  const li = pickLine(p.now, touch ? 24 : 16);
  if (li != null) { for (let i = Math.max(1, li - 3); i <= Math.min(ROPE_N - 2, li + 3); i++) sim.rope.py[i] += 0.02; return; }
  const dir = p.now.x < view.w / 2 ? 1 : -1;
  gusts.push({ x0: -dir * (POST_X + 1.5), dir, t0: st.t, amp: 2.2 + WIND[st.wind].u * 0.8 });
}
stage.addEventListener('pointerdown', e => {
  if (press || e.button > 0) return;
  try { stage.setPointerCapture(e.pointerId); } catch { /* synthetic pointers cannot capture */ }
  const p = local(e), touch = e.pointerType !== 'mouse';
  press = { id: e.pointerId, type: e.pointerType, x0: p.x, y0: p.y, now: p, drag: false,
    peg: pickPeg(p, touch ? 30 : 22), cloth: pickCloth(p), line: pickLine(p, touch ? 24 : 16) };
  press.timer = setTimeout(() => { if (press && !press.drag) { press.drag = true; begin(); } }, 260);
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  const p = local(e);
  press.now = p;
  if (!press.drag && Math.hypot(p.x - press.x0, p.y - press.y0) > 8) { press.drag = true; clearTimeout(press.timer); begin(); }
  if (grab) target(p, grab);
  if (pluck) target(p, pluck);
  wake();
});
function endPointer(e) {
  if (!press || e.pointerId !== press.id) return;
  clearTimeout(press.timer);
  if (!press.drag) tap(press);
  press = null;
  endGesture();
  wake();
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('lostpointercapture', endPointer);
document.addEventListener('keydown', e => {
  if (e.key !== ' ' || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target !== document.body && e.target !== stage) return;
  e.preventDefault();
  act.add();
});

/* ---------- themes ---------- */
// Each theme: sky, sun, haze, ground, grass, set, wardrobe and weather.
const THEMES = {
  prairie: {
    sky: { zen: [0.56, 0.12, 248], mid: [0.72, 0.085, 238], hor: [0.9, 0.035, 85], haze: [0.84, 0.04, 80], cloud: [0.98, 0.012, 85], shade: [0.76, 0.035, 250] },
    warm: [0.95, 0.08, 68], white: [0.99, 0.02, 88], sunK: 3, glow: 1, exp: 1, shadow: 1,
    fog: [[0.88, 0.03, 85], 22, 160], hemi: [[0.82, 0.06, 240], [0.62, 0.07, 85], 1.0],
    ground: 'prairie', grass: { n: 1, h: [0.12, 0.42], cols: [[0.66, 0.1, 95], [0.78, 0.09, 80], [0.5, 0.09, 125]] },
    wind: 'gusty', sun: 0.3, stiff: 1, frost: 0, snow: 0, daisies: 1,
    mix: ['sheet', 'tee', 'trousers', 'towel', 'dress', 'tee', 'sock', 'towel', 'cloth', 'sock'], build: buildPrairie,
  },
  winter: {
    sky: { zen: [0.79, 0.02, 255], mid: [0.86, 0.012, 250], hor: [0.93, 0.006, 250], haze: [0.92, 0.006, 250], cloud: [0.9, 0.01, 250], shade: [0.85, 0.012, 252] },
    warm: [0.95, 0.02, 250], white: [0.97, 0.01, 250], sunK: 1.3, glow: 0.12, exp: 0.97, shadow: 0.35,
    fog: [[0.93, 0.006, 250], 8, 80], hemi: [[0.95, 0.01, 250], [0.9, 0.012, 250], 1.7],
    ground: 'snow', grass: { n: 0.022, h: [0.15, 0.5], cols: [[0.55, 0.05, 70], [0.62, 0.06, 80], [0.45, 0.04, 60]] },
    wind: 'breeze', sun: 0.35, stiff: 3, frost: 1, snow: 1, daisies: 0,
    mix: ['longjohns', 'sheet', 'flannel', 'sock', 'sock', 'towel', 'flannel', 'sheet'], build: buildWinter,
  },
};
let T = null, setGroup = null;
function disposeTree(o) {
  o.traverse(n => {
    n.geometry?.dispose();
    for (const mt of [n.material].flat()) if (mt && mt !== woodMat) mt.dispose();
  });
}
function applyTheme(id) {
  T = THEMES[id] || THEMES.prairie;
  for (const k of ['zen', 'mid', 'hor', 'haze', 'cloud', 'shade']) SKY[k].set(...lin(...T.sky[k]));
  SKY.warm.set(...lin(...T.warm));
  SKY.white.set(...lin(...T.white));
  skyU.uGlowK.value = T.glow;
  scene.fog.color.setRGB(...lin(...T.fog[0]));
  scene.fog.near = T.fog[1]; scene.fog.far = T.fog[2];
  hemi.color.setRGB(...lin(...T.hemi[0]));
  hemi.groundColor.setRGB(...lin(...T.hemi[1]));
  hemi.intensity = T.hemi[2];
  sunLight.shadow.intensity = T.shadow;
  ground.material.map?.dispose();
  ground.material.map = groundTex(T.ground);
  ground.material.needsUpdate = true;
  if (setGroup) { if (basketObj) setGroup.remove(basketObj); scene.remove(setGroup); disposeTree(setGroup); }
  fan = null;
  setGroup = new THREE.Group();
  T.build(setGroup);
  scene.add(setGroup);
  if (daisies) daisies.visible = !!T.daisies;
  snow.visible = !!T.snow;
  plantGrass();
  st.wind = T.wind;
  ui.setting('wind')?.set(T.wind);
  setSun(T.sun);
  ui.slider?.set(T.sun);
}
act.scene = v => {
  if (!THEMES[v]) return;
  applyTheme(v);
  try { localStorage.setItem('stimming.washline.dscene', v); } catch { /* storage can be blocked */ }
  endGesture();
  build();
  settle(3);
  frameCamera();
  wake();
};

/* ---------- controls ---------- */
act.wind = v => { if (WIND[v]) st.wind = v; wake(); };
act.sun = v => { setSun(v); wake(); };
act.add = () => {
  const onLine = sim.sheets.filter(c => !c.free).length;
  if (onLine >= MAX_SHEETS) return;
  const spot = freeSpot(0.14);
  if (!spot) return;
  const room = (spot[1] - spot[0]) * sim.seg;
  let it = rollItem();
  for (let k = 0; k < 14 && it.w > room; k++) it = rollItem();
  if (it.w > room) it = rollItem('sock');
  const span = Math.round(it.w / sim.seg);
  hang(Math.round((spot[0] + spot[1] - span) / 2), it, true);
  updateActions();
  wake();
};
act.release = () => {
  for (const pg of [...sim.pegs]) unclip(pg, true);
  gusts.push({ x0: -(POST_X + 1.5), dir: 1, t0: st.t, amp: 2.5 + WIND[st.wind].u });
  updateActions();
  wake();
};
act.fabric = v => {
  FABRIC = FABRICS[v] || FABRICS.cotton;
  for (const c of sim.sheets) {
    c.mass = c.area * FABRIC.kgm2 * c.it.I.kg;
    c.mesh.material.roughness = FABRIC.rough;
    c.mesh.material.sheen = FABRIC.sheen;
  }
  wake();
};
act.view = v => {
  viewMode = v === 'iso' ? 'iso' : 'wide';
  plantGrass();
  frameCamera();
  wake();
};
act.line = v => {
  slack = SLACK[v] || SLACK.slack;
  if (sim.rope) sim.rope.seg = (POST_X * 2 * slack) / (ROPE_N - 1);
  wake();
};
onQuality(() => {
  sunLight.shadow.mapSize.set(shadowSize(), shadowSize());
  sunLight.shadow.map?.dispose();
  sunLight.shadow.map = null;
  plantGrass();
  resize();
});

applyTheme(firstScene);
FABRIC = FABRICS[ui.setting('fabric')?.value] || FABRICS.cotton;
slack = SLACK[ui.setting('line')?.value] || SLACK.slack;
build();
settle(3);
new ResizeObserver(() => resize()).observe(stage);
resize();
syncScene();
syncLight();
await renderer.compileAsync(scene, camera);
draw();
</script>
