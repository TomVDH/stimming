<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { initPage, whenVisible, pixelRatio, onQuality, linFit, oklchLinear, reduced, onReducedChange, quality } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const stage = document.getElementById('stage');
// Handlers bind once the scene exists.
const act = { sauce() {}, wind() {}, drop() {}, shake() {}, fill() {}, neon() {}, tilt() {}, traffic() {}, moths() {}, reset() {} };
const QS = new URLSearchParams(location.search);

/* ---------- sauces and neon ---------- */
const SAUCES = [
  { value: 'mayo', label: 'Mayonnaise', lch: [0.93, 0.05, 95] },
  { value: 'andalouse', label: 'Andalouse', lch: [0.72, 0.13, 50] },
  { value: 'samurai', label: 'Samurai', lch: [0.66, 0.17, 38] },
  { value: 'stoof', label: 'Stoofvlees', lch: [0.34, 0.06, 45] },
  { value: 'curry', label: 'Curry ketchup', lch: [0.5, 0.17, 28] },
  { value: 'tartaar', label: 'Tartaar', lch: [0.88, 0.04, 120] },
  { value: 'pickles', label: 'Pickles', lch: [0.78, 0.15, 92] },
];
// Each neon gas glows in its own colour.
const NEON = { red: [0.66, 0.24, 28], blue: [0.62, 0.17, 255], green: [0.8, 0.2, 145] };

const ui = initPage({ id: 'frietkot', bar: {
  choice: { label: 'Sauce', display: 'stepper', value: 'mayo', onPick: v => act.sauce(v),
    options: SAUCES.map(s => ({ value: s.value, label: s.label, dot: `oklch(${s.lch.join(' ')})` })) },
  slider: { label: 'Wind', min: 0, max: 1, step: 0.01, value: 0.3, onInput: v => act.wind(v) },
  actions: [
    { verb: 'drop', key: 'F', onPress: () => act.drop() },
    { verb: 'shake', key: 'S', onPress: () => act.shake() },
    { verb: 'fill', key: 'C', onPress: () => act.fill() },
  ],
  settings: [
    { type: 'choice', id: 'neon', label: 'Neon', value: 'red', persist: true, onPick: v => act.neon(v),
      options: [{ value: 'red', label: 'Red' }, { value: 'blue', label: 'Blue' }, { value: 'green', label: 'Green' }] },
    { type: 'slider', id: 'tilt', label: 'Tilt-shift', min: 0, max: 1, step: 0.01, value: 0.6, persist: true, onInput: v => act.tilt(v) },
    { type: 'toggle', id: 'traffic', label: 'Traffic', value: true, persist: true, onToggle: on => act.traffic(on) },
    { type: 'toggle', id: 'moths', label: 'Moths', value: true, persist: true, onToggle: on => act.moths(on) },
  ],
  reset: () => act.reset(),
  quality: true,
  keys: [['click', 'drop fries'], ['hold', 'shake'], ['drag', 'look round']],
} });

// Seeded random keeps the square the same on every load.
let seed = 4021;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; ui.hideControls?.(); markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 1200);
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;
const V3 = (a) => new THREE.Vector3(...a);

/* ---------- the shack's measures, in metres ---------- */
// The front faces +z. The service window is an opening in the front wall.
const S = {
  w: 3.4, d: 2.4, floor: 0.25, top: 2.6,
  ap: [-1.3, 1.3, 1.05, 2.05],   // window x0, x1, y0, y1
  apZ: 1.2,                      // front wall plane
  lamp: [0, 2.5, -0.1],          // ceiling tube, inside
  neonA: [-1.72, 2.645, 1.3], neonB: [1.72, 2.645, 1.3],
  strip: [0, 2.0, 1.42],         // warm tube under the awning
  vent: [1.1, 3.5, -0.7],
};
// The oil sits at a working height above the shack floor.
const OIL_Y = 1.12, WELL_Z = 0.3, WELLS = [-0.72, 0.72];

/* ---------- light ---------- */
// One uniform set feeds every surface, the shaft and the steam.
const U = {
  uLamp: { value: V3(S.lamp) },
  uLampCol: { value: new THREE.Vector3() },
  uAp: { value: new THREE.Vector4(...S.ap) },
  uApZ: { value: S.apZ },
  uWin: { value: new THREE.Vector3() },
  uStrip: { value: V3(S.strip) },
  uStripCol: { value: new THREE.Vector3() },
  uNeonA: { value: V3(S.neonA) },
  uNeonB: { value: V3(S.neonB) },
  uNeonCol: { value: new THREE.Vector3() },
  uSky: { value: new THREE.Vector3(...linFit(0.3, 0.04, 262)).multiplyScalar(0.05) },
  uGround: { value: new THREE.Vector3(...linFit(0.3, 0.03, 60)).multiplyScalar(0.02) },
  uHaze: { value: new THREE.Vector3(...linFit(0.2, 0.03, 50)).multiplyScalar(0.3) },
  uHazeK: { value: 0.009 },
  uTime: { value: 0 },
  uFlare: { value: 0 },
  // Outside, the window light reads brighter than the lamp's falloff gives.
  uOut: { value: 9 },
};
// The window's warm light; a drop flares it for a moment.
const LAMP = new THREE.Vector3(...oklchLinear(0.9, 0.07, 70));
function setLight() {
  const f = 1 + 0.7 * U.uFlare.value;
  U.uLampCol.value.copy(LAMP).multiplyScalar(5 * f);
  // What the lens sees through the window: the lit back wall and steam.
  U.uWin.value.copy(LAMP).multiplyScalar(1.4 * f);
  U.uStripCol.value.copy(LAMP).multiplyScalar(0.9);
}
let neonKey = 'red';
const neonLin = new THREE.Vector3();
function setNeon(k) {
  neonKey = NEON[k] ? k : 'red';
  neonLin.set(...linFit(...NEON[neonKey]));
  U.uNeonCol.value.copy(neonLin).multiplyScalar(0.7);
  neonMat.color.setRGB(neonLin.x * 4, neonLin.y * 4, neonLin.z * 4);
  for (const m of electrodeMats) m.color.setRGB(neonLin.x * 6, neonLin.y * 6, neonLin.z * 6);
}

const LIGHT = /* glsl */`
uniform vec3 uLamp, uLampCol, uWin, uStrip, uStripCol, uNeonA, uNeonB, uNeonCol, uSky, uGround, uHaze;
uniform vec4 uAp;
uniform float uApZ, uHazeK, uOut;
// Light from the ceiling tube passes the window opening only.
// The tube has length, so the edge grows soft with distance.
float apMask(vec3 p) {
  if (p.z <= uApZ) return 0.0;
  float t = (uApZ - uLamp.z) / (p.z - uLamp.z);
  vec2 q = uLamp.xy + t * (p.xy - uLamp.xy);
  vec2 s = vec2(0.55, 0.12) * (1.0 - t) + 0.01;
  float mx = smoothstep(uAp.x - s.x, uAp.x + s.x, q.x) * (1.0 - smoothstep(uAp.y - s.x, uAp.y + s.x, q.x));
  float my = smoothstep(uAp.z - s.y, uAp.z + s.y, q.y) * (1.0 - smoothstep(uAp.w - s.y, uAp.w + s.y, q.y));
  return mx * my;
}
// A soft box test on the window plane, for reflections.
float rectSoft(vec2 q, vec4 r, float w) {
  return smoothstep(r.x - w, r.x + w, q.x) * (1.0 - smoothstep(r.y - w, r.y + w, q.x))
       * smoothstep(r.z - w, r.z + w, q.y) * (1.0 - smoothstep(r.w - w, r.w + w, q.y));
}
// Closest point on the neon strip.
vec3 neonPt(vec3 p) {
  vec3 ba = uNeonB - uNeonA;
  return uNeonA + ba * clamp(dot(p - uNeonA, ba) / dot(ba, ba), 0.0, 1.0);
}
// inside: 1 for surfaces in the shack, 0 for the world outside.
// gloss: 0 matte, 1 a damp polished stone.
vec3 shade(vec3 p, vec3 n, vec3 v, vec3 alb, float gloss, float inside) {
  vec3 c = vec3(0.0);
  // The ceiling tube.
  vec3 L = uLamp - p;
  float d2 = dot(L, L);
  vec3 l = L * inversesqrt(d2);
  float m = mix(apMask(p) * uOut, 1.0, inside);
  float nl = max(dot(n, l), 0.0);
  c += alb * uLampCol * m * nl / (d2 + 0.05);
  // The tube under the awning lights the counter and the ground in front.
  vec3 Ls = uStrip - p;
  float ds2 = dot(Ls, Ls);
  vec3 ls = Ls * inversesqrt(ds2);
  float front = (1.0 - inside) * smoothstep(uApZ - 0.05, uApZ + 0.1, p.z);
  c += alb * uStripCol * front * max(dot(n, ls), 0.0) / (ds2 + 0.3);
  // The neon strip is a line light.
  vec3 Ln = neonPt(p) - p;
  float dn2 = dot(Ln, Ln);
  vec3 ln = Ln * inversesqrt(dn2);
  c += alb * uNeonCol * (1.0 - inside) * max(dot(n, ln), 0.0) / (dn2 + 0.08);
  // Sky and ground bounce.
  c += alb * mix(uGround, uSky, 0.5 + 0.5 * n.y);
  if (gloss > 0.0) {
    // Fresnel for wet stone.
    float fr = 0.02 + 0.98 * pow(1.0 - max(dot(n, v), 0.0), 5.0);
    vec3 r = reflect(-v, n);
    vec3 spec = vec3(0.0);
    if (r.z < -0.01 && p.z > uApZ) {
      float t = (uApZ - p.z) / r.z;
      vec3 q = p + r * t;
      float w = 0.02 + t * (1.0 - gloss) * 0.35;
      spec += uWin * rectSoft(q.xy, uAp, w);
      // The neon tube is thin; a blurred image of it is dimmer.
      float tn = (uNeonA.z - p.z) / r.z;
      vec3 qn = p + r * tn;
      float wn = 0.03 + tn * (1.0 - gloss) * 0.3;
      float band = exp(-pow((qn.y - uNeonA.y) / wn, 2.0)) * step(abs(qn.x), uNeonB.x) * 0.03 / wn;
      spec += uNeonCol * 3.0 * band;
    }
    c += spec * fr * gloss * 0.6;
  }
  return c;
}
vec3 haze(vec3 c, vec3 p) {
  float d = length(p - cameraPosition);
  return mix(c, uHaze, 1.0 - exp(-d * uHazeK));
}
`;

const NOISE = /* glsl */`
float hash12(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
`;

const VS = /* glsl */`
varying vec3 vP, vN;
void main() {
  vec4 w = modelMatrix * vec4(position, 1.0);
  vP = w.xyz;
  vN = normalize(mat3(modelMatrix) * normal);
  gl_Position = projectionMatrix * viewMatrix * w;
}`;

/* ---------- the square ---------- */
// Belgian setts in running bond, damp on top, rough in the joints.
const groundMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: VS,
  fragmentShader: /* glsl */`
  ${LIGHT}
  ${NOISE}
  varying vec3 vP, vN;
  void main() {
    vec2 g = vP.xz;
    // A sett is 17 by 13 cm; each row shifts at random.
    float row = floor(g.y / 0.13);
    float cx = g.x / 0.17 + hash12(vec2(row, 3.0));
    vec2 id = vec2(floor(cx), row);
    vec2 hs = vec2(0.085, 0.065);
    vec2 f = vec2(fract(cx) * 0.17, fract(g.y / 0.13) * 0.13) - hs;
    float sd = length(max(abs(f) - hs + 0.02, 0.0)) - 0.014;
    // Fine detail fades out where a pixel covers several setts.
    float fw = length(fwidth(g));
    float detail = 1.0 - smoothstep(0.015, 0.06, fw);
    float stone = mix(0.8, 1.0 - smoothstep(-0.012, 0.002, sd), detail);
    float r1 = hash12(id), r2 = hash12(id + 7.7);
    // Each sett is a low dome with its own tilt.
    vec2 grad = (f / (hs * hs) * 0.0012 + (vec2(r1, r2) - 0.5) * vec2(0.02, 0.05)) * stone * detail;
    vec3 n = normalize(vec3(-grad.x, 1.0, -grad.y));
    vec3 v = normalize(cameraPosition - vP);
    vec3 alb = mix(vec3(0.09, 0.09, 0.1), vec3(0.2, 0.19, 0.17), r1) * (0.85 + 0.3 * fbm(g * 0.7));
    alb = mix(alb * 0.5, alb, stone);
    // Damp patches shine more; joints stay rough.
    float wet = 0.55 + 0.45 * smoothstep(0.35, 0.65, fbm(g * 0.25 + 4.0));
    float gloss = stone * wet * mix(0.55, 0.85, r2);
    vec3 c = shade(vP, n, v, alb, gloss, 0.0);
    gl_FragColor = vec4(haze(c, vP), 1.0);
  }`,
});
groundMat.extensions = { derivatives: true };
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600).rotateX(-Math.PI / 2), groundMat);
scene.add(ground);

/* ---------- surfaces ---------- */
// One material maker for every lit box.
// ribs: corrugation on painted panels; tiles: a grid on the back wall.
function surface({ alb, inside = 0, gloss = 0, ribs = 0, tiles = 0 }) {
  return new THREE.ShaderMaterial({
    uniforms: { ...U, uAlb: { value: new THREE.Vector3(...alb) }, uIn: { value: inside }, uGloss: { value: gloss }, uRibs: { value: ribs }, uTiles: { value: tiles } },
    vertexShader: VS,
    fragmentShader: /* glsl */`
    ${LIGHT}
    uniform vec3 uAlb;
    uniform float uIn, uGloss, uRibs, uTiles;
    varying vec3 vP, vN;
    void main() {
      vec3 n = normalize(vN);
      vec3 alb = uAlb;
      if (uRibs > 0.0) {
        // Vertical ribs run across walls that face front, back or sideways.
        float u = abs(n.z) > 0.5 ? vP.x : vP.z;
        float s = sin(u * 6.2832 / 0.14);
        if (abs(n.y) < 0.5) n = normalize(n + (abs(n.z) > 0.5 ? vec3(1, 0, 0) : vec3(0, 0, 1)) * s * 0.25 * uRibs);
        alb *= 0.92 + 0.08 * s;
      }
      if (uTiles > 0.0) {
        // Grout lines, filtered so they do not shimmer.
        vec2 g = vec2(vP.x + vP.z, vP.y) / 0.15;
        vec2 t = abs(fract(g) - 0.5), fw = fwidth(g) + 1e-4;
        vec2 line = 1.0 - smoothstep(0.47 - fw, 0.47 + fw, t);
        alb *= mix(0.72, 1.0, line.x * line.y);
      }
      vec3 v = normalize(cameraPosition - vP);
      vec3 c = shade(vP, n, v, alb, uGloss, uIn);
      gl_FragColor = vec4(haze(c, vP), 1.0);
    }`,
    extensions: { derivatives: true },
  });
}
const lin = (L, C, h) => linFit(L, C, h);
const M = {
  paint: surface({ alb: lin(0.62, 0.03, 85), ribs: 1 }),
  trim: surface({ alb: lin(0.32, 0.02, 260) }),
  plinth: surface({ alb: lin(0.18, 0.01, 260) }),
  steelOut: surface({ alb: lin(0.6, 0.01, 250), gloss: 0.5 }),
  awning: surface({ alb: lin(0.55, 0.12, 25) }),
  inWall: surface({ alb: lin(0.4, 0.06, 195), inside: 1, tiles: 1 }),
  inPlain: surface({ alb: lin(0.36, 0.04, 200), inside: 1 }),
  steel: surface({ alb: lin(0.62, 0.01, 250), inside: 1 }),
  dark: surface({ alb: lin(0.14, 0.01, 260), inside: 1 }),
  gable: surface({ alb: lin(0.2, 0.012, 260) }),
};
const shack = new THREE.Group();
scene.add(shack);
// A box from its corner bounds.
function box(x0, x1, y0, y1, z0, z1, mat, parent = shack) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  parent.add(m);
  return m;
}
{
  const [ax0, ax1, ay0, ay1] = S.ap, hw = S.w / 2, hd = S.d / 2, t = 0.06, Z = S.apZ;
  // Plinth, set back so the shack floats a little.
  box(-hw + 0.12, hw - 0.12, 0, S.floor, -hd + 0.12, hd - 0.12, M.plinth);
  // Shell: front wall in four pieces round the window, two sides, the back.
  box(-hw, hw, S.floor, ay0, Z - t, Z, M.paint);
  box(-hw, hw, ay1, S.top, Z - t, Z, M.paint);
  box(-hw, ax0, ay0, ay1, Z - t, Z, M.paint);
  box(ax1, hw, ay0, ay1, Z - t, Z, M.paint);
  box(-hw, -hw + t, S.floor, S.top, -hd, Z - t, M.paint);
  box(hw - t, hw, S.floor, S.top, -hd, Z - t, M.paint);
  box(-hw, hw, S.floor, S.top, -hd, -hd + t, M.paint);
  // Roof slab with a small overhang, and its dark edge band.
  box(-hw - 0.06, hw + 0.06, S.top, S.top + 0.08, -hd - 0.06, Z + 0.08, M.trim);
  // Inside: back wall tiles, side walls, ceiling, floor.
  box(-hw + t, hw - t, S.floor, S.top, -hd + t, -hd + t + 0.01, M.inWall);
  box(-hw + t, -hw + t + 0.01, S.floor, S.top, -hd + t, Z - t, M.inPlain);
  box(hw - t - 0.01, hw - t, S.floor, S.top, -hd + t, Z - t, M.inPlain);
  box(-hw + t, hw - t, S.top - 0.01, S.top, -hd + t, Z - t, M.inPlain);
  // The prep counter along the back, its hood above.
  box(-1.5, 1.5, S.floor, 0.95, -hd + t, -0.5, M.steel);
  box(-1.5, 1.5, 1.95, 2.3, -hd + t, -0.55, M.steel);
  // The fryer stands just inside the window, so the queue sees it boil.
  box(-1.5, 1.5, S.floor, OIL_Y - 0.005, WELL_Z - 0.26, WELL_Z + 0.26, M.steel);
  // A raised rim round each well.
  for (const x of WELLS) {
    box(x - 0.45, x + 0.45, OIL_Y - 0.01, OIL_Y + 0.03, WELL_Z + 0.2, WELL_Z + 0.24, M.steel);
    box(x - 0.45, x + 0.45, OIL_Y - 0.01, OIL_Y + 0.03, WELL_Z - 0.24, WELL_Z - 0.2, M.steel);
  }
  // The serving shelf inside, and the ledge outside.
  box(-hw + t, hw - t, 1.0, 1.05, 0.85, Z - t, M.steel);
  box(ax0 - 0.1, ax1 + 0.1, 1.02, 1.07, Z, Z + 0.28, M.steelOut);
  // Roof box for the neon glyph.
  box(-1.15, 1.15, S.top + 0.08, S.top + 0.72, 0.9, 1.14, M.trim);
  // Roof vent.
  const vent = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.82, 12), M.trim);
  vent.position.set(S.vent[0], S.top + 0.08 + 0.41, S.vent[2]);
  shack.add(vent);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.12, 0.08, 12), M.trim);
  cap.position.set(S.vent[0], S.vent[1] + 0.04, S.vent[2]);
  shack.add(cap);
  // The awning flap, hinged at the window top and propped up 25°.
  const flap = new THREE.Group();
  flap.position.set(0, ay1 + 0.03, Z + 0.04);
  flap.rotation.x = Math.PI / 2 - 0.44;
  box(ax0 - 0.12, ax1 + 0.12, 0, 0.95, -0.02, 0.02, M.awning, flap);
  shack.add(flap);
}

/* ---------- fryer ---------- */
// Belgian fries cook twice: a blanch near 150 °C, then a crisp near 180 °C.
// r0: peak boil; tau: how fast the fry surface dries; cook: seconds in the oil.
const FRY = [{ r0: 1.0, tau: 2.5, cook: 6.0 }, { r0: 1.2, tau: 1.5, cook: 4.5 }];
// Raw, blanched and golden.
const FRIES_COL = [linFit(0.9, 0.035, 95), linFit(0.87, 0.075, 92), linFit(0.74, 0.14, 72)];
// The basket hangs this high above the oil, or sinks this low into it.
const UP = 0.3, IN = -0.04, LIFT = 0.1;
// Simmer: hot oil with nothing in it still beads a little.
const SIMMER = 0.04;

// Oil, seen only at glancing angles through the window.
const oilMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: VS,
  fragmentShader: /* glsl */`
  uniform vec3 uLampCol;
  varying vec3 vP, vN;
  void main() { gl_FragColor = vec4(vec3(0.32, 0.17, 0.03) * uLampCol * 0.06, 1.0); }`,
});

// The foam crown: a dome of bubbles that rises with the boil.
const VOR = /* glsl */`
// F1 and F2 distances to the nearest bubble centres.
vec2 vor(vec2 p) {
  vec2 i = floor(p), f = fract(p), d = vec2(8.0);
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 g = vec2(x, y), o = vec2(hash12(i + g), hash12(i + g + 19.7));
    float r = length(g + o - f);
    if (r < d.x) d = vec2(r, d.x); else if (r < d.y) d.y = r;
  }
  return d;
}`;
function foamMat(seed) {
  return new THREE.ShaderMaterial({
    uniforms: { ...U, uFoam: { value: 0 }, uSeed: { value: seed } },
    transparent: true, depthWrite: false,
    vertexShader: /* glsl */`
    uniform float uTime, uFoam, uSeed;
    varying vec3 vP, vN;
    // Lumps that roll over the crown as it boils.
    float wob(vec3 p) {
      return sin(p.x * 7.0 + uTime * 5.0 + uSeed) * sin(p.z * 9.0 - uTime * 4.0)
           + 0.5 * sin(p.x * 15.0 - uTime * 7.0 + uSeed * 2.0) * sin(p.z * 13.0 + uTime * 6.0);
    }
    void main() {
      vec3 p = position;
      p.xz *= 1.0 + 0.1 * wob(p) * p.y;
      p.y *= 1.0 + 0.35 * wob(p.zyx + 3.0);
      vec4 w = modelMatrix * vec4(p, 1.0);
      vP = w.xyz;
      vN = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
    fragmentShader: /* glsl */`
    ${NOISE}
    ${VOR}
    uniform vec3 uLampCol;
    uniform float uFoam, uTime, uSeed;
    varying vec3 vP, vN;
    void main() {
      vec3 n = normalize(vN), v = normalize(cameraPosition - vP);
      // Bubbles shrink as the fries dry, so the cells get finer as foam falls.
      float scale = mix(70.0, 34.0, uFoam);
      vec2 uv = vec2(vP.x + vP.z * 0.6, vP.y - ${OIL_Y.toFixed(3)}) * scale;
      uv.y -= uTime * (2.0 + 6.0 * uFoam) + uSeed * 9.0;
      vec2 d = vor(uv);
      float rim = 1.0 - smoothstep(0.0, 0.12, d.y - d.x);
      // A glint where a bubble wall faces the lamp.
      float glint = pow(1.0 - d.x, 8.0) * step(0.82, hash12(floor(uv) + uSeed));
      vec3 cream = vec3(1.0, 0.9, 0.68);
      // Lit from the ceiling tube: bright on top, shaded low down.
      float top = 0.55 + 0.45 * max(n.y, 0.0);
      vec3 c = cream * uLampCol * 0.16 * top * (0.7 + 0.3 * rim) + uLampCol * glint * 0.35 * uFoam;
      // The crown's edge breaks up into loose bubbles.
      float edge = smoothstep(0.05, 0.45, abs(dot(n, v)));
      float a = edge * mix(0.8, 1.0, rim) * smoothstep(0.0, 0.08, uFoam);
      gl_FragColor = vec4(c, a);
    }`,
  });
}

// Wire baskets read as dark see-through boxes at this distance.
const wireMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0x0b0c0f), transparent: true, opacity: 0.55, depthWrite: false });
const gripMat = M.dark;
const wells = WELLS.map((x, i) => {
  const oil = new THREE.Mesh(new THREE.PlaneGeometry(0.85, 0.4).rotateX(-Math.PI / 2), oilMat);
  oil.position.set(x, OIL_Y, WELL_Z);
  shack.add(oil);
  const crown = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 12, 0, Math.PI * 2, 0, Math.PI / 2), foamMat(i * 3.7 + 1));
  crown.position.set(x, OIL_Y, WELL_Z);
  crown.scale.set(0.44, 0.01, 0.2);
  crown.renderOrder = 1;
  crown.visible = false;
  shack.add(crown);
  // The basket: wire box, fries inside, a long handle to the front.
  const g = new THREE.Group();
  g.position.set(x, OIL_Y, WELL_Z);
  const friesMat = surface({ alb: FRIES_COL[0], inside: 1 });
  const fries = new THREE.Group();
  fries.add(box(-0.15, 0.15, -0.06, 0.04, -0.12, 0.12, friesMat, fries));
  // Loose sticks poke up out of the heap.
  for (let k = 0; k < 14; k++) {
    const st = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.012, 0.1), friesMat);
    st.position.set((rnd() - 0.5) * 0.26, 0.05 + rnd() * 0.02, (rnd() - 0.5) * 0.18);
    st.rotation.set((rnd() - 0.5) * 1.2, rnd() * Math.PI, (rnd() - 0.5) * 0.8);
    fries.add(st);
  }
  fries.visible = false;
  g.add(fries);
  box(-0.17, 0.17, -0.08, 0.08, -0.14, 0.14, wireMat, g).renderOrder = 2;
  const handle = new THREE.Group();
  // The handle points back, to the cook.
  handle.position.set(0, 0.07, -0.14);
  handle.rotation.x = 0.5;
  box(-0.012, 0.012, -0.012, 0.012, -0.32, 0, M.steel, handle);
  box(-0.02, 0.02, -0.02, 0.02, -0.34, -0.22, gripMat, handle);
  g.add(handle);
  shack.add(g);
  return {
    x, crown, g, fries, friesMat,
    boil: SIMMER, foam: SIMMER,
    // fry: -1 empty, 0 raw, 1 blanched, 2 golden. stage: the fry under way.
    fry: -1, stage: 0, inOil: false, t: 0,
    y: UP, vy: 0, shake: 0, dip: 0,
  };
});

/* ---------- spatter ---------- */
// Droplets of oil jump from the boil and glint in the lamp light.
const DROPS = 160;
const drops = Array.from({ length: DROPS }, () => ({ p: new THREE.Vector3(), v: new THREE.Vector3(), live: false }));
const dropGeo = new THREE.BufferGeometry();
const dropPos = new THREE.BufferAttribute(new Float32Array(DROPS * 3), 3);
dropGeo.setAttribute('position', dropPos);
const dropMat = new THREE.ShaderMaterial({
  uniforms: { ...U, uPx: { value: 400 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
  uniform float uPx;
  void main() {
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_Position = projectionMatrix * mv;
    // A 6 mm droplet, never under 1.5 px.
    gl_PointSize = max(1.5, 0.006 * uPx / -mv.z);
  }`,
  fragmentShader: /* glsl */`
  uniform vec3 uLampCol;
  void main() {
    float r = length(gl_PointCoord - 0.5) * 2.0;
    gl_FragColor = vec4(uLampCol * 0.6 * smoothstep(1.0, 0.0, r), 1.0);
  }`,
});
const spatter = new THREE.Points(dropGeo, dropMat);
spatter.frustumCulled = false;
spatter.renderOrder = 3;
scene.add(spatter);
let dropsLive = 0, spatAcc = 0;
function spit(w, n) {
  for (const d of drops) {
    if (n <= 0) break;
    if (d.live) continue;
    d.live = true; n--;
    d.p.set(w.x + (rnd() - 0.5) * 0.7, OIL_Y + 0.02, WELL_Z + (rnd() - 0.5) * 0.3);
    // A jump of 5 to 30 cm.
    d.v.set((rnd() - 0.5) * 0.6, Math.sqrt(2 * 9.8 * (0.05 + rnd() * 0.25)), (rnd() - 0.5) * 0.5);
  }
}
function stepSpatter(dt) {
  dropsLive = 0;
  const P = dropPos.array;
  drops.forEach((d, i) => {
    if (d.live) {
      d.v.y -= 9.8 * dt;
      d.p.addScaledVector(d.v, dt);
      if (d.p.y < OIL_Y && d.v.y < 0) d.live = false;
      else dropsLive++;
    }
    if (d.live) P.set([d.p.x, d.p.y, d.p.z], i * 3);
    else P.set([0, -10, 0], i * 3);
  });
  dropPos.needsUpdate = true;
}

/* ---------- the boil ---------- */
const smooth01 = x => { const t = Math.min(1, Math.max(0, x)); return t * t * (3 - 2 * t); };
function stepFryer(dt, now) {
  for (const w of wells) {
    if (w.inOil) {
      w.t += dt;
      const F = FRY[w.stage];
      // Water at the fry surface flashes to steam, then dries off.
      const surge = 1 - Math.exp(-w.t / 0.12);
      const target = SIMMER + F.r0 * surge * Math.exp(-w.t / F.tau) + w.dip;
      w.boil += (target - w.boil) * (1 - Math.exp(-dt / 0.05));
      // The fries colour while they cook.
      const k = smooth01(w.t / F.cook);
      w.friesMat.uniforms.uAlb.value.set(...FRIES_COL[w.stage].map((c, j) => c + (FRIES_COL[w.stage + 1][j] - c) * k));
      if (w.t > F.cook) lift(w);
    } else {
      w.boil += (SIMMER - w.boil) * (1 - Math.exp(-dt / 0.3));
    }
    w.dip *= Math.exp(-dt / 0.5);
    // Foam lags the boil a little.
    w.foam += (w.boil - w.foam) * (1 - Math.exp(-dt / 0.25));
    // Bubbles spit oil; more as the boil grows.
    spatAcc += dt * (reduced() ? 30 : 90) * Math.max(0, w.boil - 0.15) ** 2;
    while (spatAcc >= 1) { spatAcc -= 1; spit(w, 1); }
    // The basket rides a stiff spring between the hook and the oil.
    const ty = w.inOil ? (w.shake > 0.05 ? IN + LIFT : IN) : UP;
    w.vy += (160 * (ty - w.y) - 16 * w.vy) * dt;
    w.y += w.vy * dt;
    w.shake = Math.max(0, w.shake - dt / 0.9);
  }
  stepSpatter(dt);
}
function poseFryer(time) {
  for (const w of wells) {
    const h = 0.015 + 0.5 * w.foam;
    // The crown roils: its height jitters with the boil.
    const roil = 1 + 0.18 * w.foam * Math.sin(time * 13 + w.x * 5) * Math.sin(time * 7.3 + w.x);
    w.crown.scale.y = h * roil;
    w.crown.visible = w.foam > 0.05;
    w.crown.material.uniforms.uFoam.value = Math.min(1, w.foam);
    const a = (reduced() ? 0.4 : 1) * w.shake;
    const s = Math.sin(time * 50 + w.x);
    w.g.position.set(w.x + s * 0.03 * a, OIL_Y + w.y + Math.abs(s) * 0.025 * a, WELL_Z);
    // A hanging basket tips forward on its hook.
    w.g.rotation.x = smooth01((w.y - IN) / (UP - IN)) * 0.35;
    w.g.rotation.z = s * 0.08 * a;
    w.fries.visible = w.fry >= 0;
  }
  // The foam's glare flares the window.
  const glare = wells.reduce((m, w) => m + Math.max(0, w.foam - SIMMER), 0);
  return Math.min(1, glare * 0.55);
}
function fryerBusy() {
  return dropsLive > 0 || wells.some(w => w.inOil || w.boil > SIMMER + 0.01 || w.foam > 0.06 || w.shake > 0 || Math.abs(w.vy) > 1e-3 || Math.abs(w.y - (w.inOil ? IN : UP)) > 1e-3);
}
// Out of the oil: a fry that ran most of its time counts.
function lift(w) {
  if (!w.inOil) return;
  w.inOil = false;
  if (w.t > FRY[w.stage].cook * 0.6) w.fry = w.stage + 1;
  w.shake = Math.max(w.shake, 0.6);
  syncActions();
}

/* ---------- neon ---------- */
const neonMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const electrodeMats = [];
const tube = (pts, r = 0.016) => new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(V3), false, 'catmullrom', 0), pts.length * 8, r, 8, false);
{
  // The long strip along the roof edge.
  shack.add(new THREE.Mesh(tube([S.neonA, S.neonB], 0.018), neonMat));
  // Its electrodes glow a little brighter at each end.
  for (const p of [S.neonA, S.neonB]) {
    const m = new THREE.MeshBasicMaterial({ color: 0xffffff });
    electrodeMats.push(m);
    const e = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.07, 8).rotateZ(Math.PI / 2), m);
    e.position.set(...p);
    e.position.x += Math.sign(p[0]) * -0.02;
    shack.add(e);
  }
  // The glyph on the roof box: a cone, and fries standing up out of it.
  const z = 1.165, y0 = S.top + 0.14;
  const cone = [[-0.2, y0 + 0.44, z], [0, y0, z], [0.2, y0 + 0.44, z], [-0.2, y0 + 0.44, z]];
  shack.add(new THREE.Mesh(tube(cone), neonMat));
  const friesMat = new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(...linFit(0.86, 0.17, 88).map(v => v * 7)) });
  for (const [x, h] of [[-0.11, 0.14], [-0.04, 0.2], [0.04, 0.16], [0.11, 0.12]]) {
    shack.add(new THREE.Mesh(tube([[x, y0 + 0.47, z], [x + x * 0.25, y0 + 0.47 + h, z]], 0.013), friesMat));
  }
  // The warm tube under the awning.
  const stripMat = new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(...LAMP.toArray().map(v => v * 6)) });
  shack.add(new THREE.Mesh(tube([[-1.1, S.strip[1] + 0.05, S.apZ + 0.12], [1.1, S.strip[1] + 0.05, S.apZ + 0.12]], 0.014), stripMat));
}

/* ---------- the far side of the square ---------- */
// A row of dark gables, a few late windows, and a church tower in the haze.
const lateWins = [];
{
  const geos = [];
  let x = -130;
  while (x < 130) {
    const w = 5 + rnd() * 3.5, h = 6 + rnd() * 4, roof = w * (0.45 + rnd() * 0.25), z = -95 - rnd() * 4;
    const s = new THREE.Shape();
    s.moveTo(0, 0); s.lineTo(w, 0); s.lineTo(w, h); s.lineTo(w / 2, h + roof); s.lineTo(0, h); s.closePath();
    const g = new THREE.ExtrudeGeometry(s, { depth: 9, bevelEnabled: false });
    g.translate(x, 0, z - 9);
    geos.push(g);
    // About one house in five has a lit window.
    if (rnd() < 0.22 && Math.abs(x) > 4) lateWins.push([x + w * (0.25 + rnd() * 0.5), 1.6 + rnd() * (h - 3), z + 0.02, rnd() < 0.3]);
    x += w + (rnd() < 0.15 ? 3 + rnd() * 6 : 0);
  }
  // The church: a tower and a spire, far back on the left.
  const tower = new THREE.BoxGeometry(7, 26, 7).translate(-40, 13, -110);
  const spire = new THREE.ConeGeometry(5.2, 16, 4).rotateY(Math.PI / 4).translate(-40, 34, -110);
  geos.push(tower, spire);
  scene.add(new THREE.Mesh(mergeGeometries(geos.map(g => (g.index ? g.toNonIndexed() : g))), M.gable));
  // Late windows: warm lamps, and one cool screen glow.
  for (const [wx, wy, wz, tv] of lateWins) {
    const c = tv ? linFit(0.7, 0.08, 250) : linFit(0.82, 0.1, 70);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.3), new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(...c.map(v => v * 0.9)) }));
    m.position.set(wx, wy, wz);
    scene.add(m);
  }
}

/* ---------- sky ---------- */
// Deep blue-black above; the glow of far towns along the horizon.
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    uZen: { value: new THREE.Vector3(...linFit(0.12, 0.03, 262)) },
    uHor: { value: new THREE.Vector3(...linFit(0.27, 0.04, 55)) },
    uHaze: U.uHaze,
  },
  vertexShader: /* glsl */`varying vec3 vD; void main() { vD = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: /* glsl */`
  ${NOISE}
  uniform vec3 uZen, uHor, uHaze;
  varying vec3 vD;
  void main() {
    vec3 d = normalize(vD);
    float h = d.y;
    vec3 c = mix(uHor, uZen, smoothstep(-0.02, 0.45, h));
    c += uHor * 0.35 * exp(-max(h, 0.0) * 22.0);
    // Few stars: town glow washes most of them out.
    vec2 sp = vec2(atan(d.z, d.x) * 220.0, h * 260.0);
    vec2 cell = floor(sp);
    float r = hash12(cell);
    float star = step(0.996, r) * smoothstep(0.35, 0.0, length(fract(sp) - 0.5)) * smoothstep(0.05, 0.35, h);
    c += vec3(0.7, 0.75, 0.9) * star * (r - 0.996) * 40.0;
    c = mix(c, uHaze, smoothstep(0.02, -0.04, h));
    gl_FragColor = vec4(c, 1.0);
  }`,
}));
sky.frustumCulled = false;
sky.renderOrder = -1;
scene.add(sky);

/* ---------- the light shaft ---------- */
// Haze glows where the window light passes: a short ray march in a box.
const SHAFT = { lo: [-8, 0.0, S.apZ], hi: [8, 2.4, 10] };
const shaftMat = new THREE.ShaderMaterial({
  uniforms: { ...U, uLo: { value: V3(SHAFT.lo) }, uHi: { value: V3(SHAFT.hi) }, uDens: { value: 0.006 } },
  side: THREE.BackSide, depthTest: false, depthWrite: false, transparent: true,
  blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`varying vec3 vP; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: /* glsl */`
  ${LIGHT}
  ${NOISE}
  uniform vec3 uLo, uHi;
  uniform float uDens, uTime;
  varying vec3 vP;
  void main() {
    vec3 ro = cameraPosition, rd = normalize(vP - ro);
    vec3 t0 = (uLo - ro) / rd, t1 = (uHi - ro) / rd;
    vec3 tn = min(t0, t1), tf = max(t0, t1);
    float a = max(max(max(tn.x, tn.y), tn.z), 0.0), b = min(min(tf.x, tf.y), tf.z);
    if (b <= a) discard;
    float dt = (b - a) / 16.0;
    float t = a + dt * hash12(gl_FragCoord.xy);
    vec3 acc = vec3(0.0);
    for (int i = 0; i < 16; i++) {
      vec3 p = ro + rd * t;

      // Forward scatter: the haze glows most toward the window.
      float mu = dot(rd, -L * inversesqrt(d2));
      float g = 0.45;
      float ph = (1.0 - g * g) / pow(1.0 + g * g - 2.0 * g * mu, 1.5);
      float dens = 0.6 + 0.8 * fbm(p.xz * 0.6 + vec2(uTime * 0.05, p.y * 0.4));
      acc += uLampCol * uOut * apMask(p) * ph * dens / (d2 + 0.2);

    }
    gl_FragColor = vec4(acc * dt * uDens, 1.0);
  }`,
});
{
  const s = new THREE.Vector3(...SHAFT.hi).sub(V3(SHAFT.lo));
  const m = new THREE.Mesh(new THREE.BoxGeometry(s.x, s.y, s.z), shaftMat);
  m.position.set(...new THREE.Vector3(...SHAFT.hi).add(V3(SHAFT.lo)).multiplyScalar(0.5).toArray());
  m.renderOrder = 2;
  m.frustumCulled = false;
  scene.add(m);
}

/* ---------- steam ---------- */
// Soft puffs. Each rises by buoyancy, cools, grows, and drifts with the wind.
const PUFFS = 320;
const puff = Array.from({ length: PUFFS }, () => ({ p: new THREE.Vector3(), v: new THREE.Vector3(), T: 0, age: 1e9, life: 1, size: 0.1, seed: Math.random() }));
const steamGeo = new THREE.InstancedBufferGeometry();
steamGeo.index = new THREE.PlaneGeometry(1, 1).index;
steamGeo.setAttribute('position', new THREE.PlaneGeometry(1, 1).getAttribute('position'));
const aPos = new THREE.InstancedBufferAttribute(new Float32Array(PUFFS * 4), 4);
const aFade = new THREE.InstancedBufferAttribute(new Float32Array(PUFFS * 2), 2);
steamGeo.setAttribute('aPos', aPos);
steamGeo.setAttribute('aFade', aFade);
steamGeo.instanceCount = PUFFS;
const steamMat = new THREE.ShaderMaterial({
  uniforms: U,
  transparent: true, depthWrite: false,
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  vertexShader: /* glsl */`
  attribute vec4 aPos;
  attribute vec2 aFade;
  varying vec3 vP;
  varying vec2 vUv, vF;
  void main() {
    vUv = position.xy + 0.5;
    vF = aFade;
    // Billboards face the lens.
    vec3 right = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
    vec3 up = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
    vP = aPos.xyz + (right * position.x + up * position.y) * aPos.w;
    gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0);
  }`,
  fragmentShader: /* glsl */`
  ${LIGHT}
  ${NOISE}
  uniform float uTime;
  varying vec3 vP;
  varying vec2 vUv, vF;
  void main() {
    vec2 q = vUv - 0.5;
    float r = length(q) * 2.0;
    float n = fbm(vUv * 3.0 + vF.y * 17.0 + uTime * 0.08);
    float a = smoothstep(1.0, 0.2, r) * smoothstep(0.25, 0.75, n) * vF.x;
    if (a < 0.003) discard;
    vec3 v = normalize(cameraPosition - vP);
    // Window light scatters forward through the steam.
    vec3 L = uLamp - vP;
    float d2 = dot(L, L);
    float mu = dot(-v, -L * inversesqrt(d2));
    float g = 0.6;
    float ph = (1.0 - g * g) / pow(1.0 + g * g - 2.0 * g * mu, 1.5);
    vec3 c = uLampCol * uOut * apMask(vP) * ph * 0.08 / (d2 + 0.3);
    vec3 Ln = neonPt(vP) - vP;
    float dn2 = dot(Ln, Ln);
    float mun = dot(-v, -Ln * inversesqrt(dn2));
    float phn = (1.0 - g * g) / pow(1.0 + g * g - 2.0 * g * mun, 1.5);
    c += uNeonCol * phn * 0.03 / (dn2 + 0.3);
    c += uSky * 4.0 + uHaze * 0.4;
    c = haze(c, vP);
    gl_FragColor = vec4(c * a, a);
  }`,
});
const steam = new THREE.Mesh(steamGeo, steamMat);
steam.frustumCulled = false;
steam.renderOrder = 3;
scene.add(steam);
let wind = 0.3, emitAcc = 0;
// Wind grows with height above the square, as in a log profile.
const windAt = y => wind * 1.6 * Math.log(1 + Math.max(0, y) / 0.3) / Math.log(1 + 10 / 0.3);
function emit(src, n, { speed = 0.3, spread = 0.06, size = 0.12, life = 6 } = {}) {
  for (let k = 0; k < n; k++) {
    const q = puff.find(o => o.age >= o.life);
    if (!q) return;
    q.p.set(src[0] + (rnd() - 0.5) * spread, src[1], src[2] + (rnd() - 0.5) * spread);
    q.v.set((rnd() - 0.5) * 0.05, speed * (0.7 + rnd() * 0.6), (rnd() - 0.5) * 0.05);
    q.T = 1; q.age = 0; q.life = life * (0.7 + rnd() * 0.6); q.size = size; q.seed = rnd();
  }
}
function stepSteam(dt) {
  // The vent breathes a thin plume all the time.
  emitAcc += dt * 9;
  while (emitAcc >= 1) { emitAcc -= 1; emit([S.vent[0], S.vent[1] + 0.06, S.vent[2]], 1); }
  for (const q of puff) {
    if (q.age >= q.life) continue;
    q.age += dt;
    // Lift follows the excess heat; the puff cools as it mixes.
    q.T *= Math.exp(-dt / 1.4);
    const drag = 0.9 + q.size * 1.5;
    q.v.y += (0.9 * q.T - drag * q.v.y * 0.5) * dt;
    q.v.x += (windAt(q.p.y) - q.v.x) * drag * dt * 0.8;
    q.v.z += (-q.v.z * drag * 0.5 + windAt(q.p.y) * 0.15) * dt;
    q.p.addScaledVector(q.v, dt);
    q.size += dt * (0.08 + 0.18 * (1 - q.T));
  }
}
function writeSteam() {
  const P = aPos.array, F = aFade.array;
  puff.forEach((q, i) => {
    const live = q.age < q.life;
    const u = live ? q.age / q.life : 1;
    P.set([q.p.x, q.p.y, q.p.z, live ? q.size : 0], i * 4);
    // Clear at the source, white once it condenses, gone as it mixes.
    F[i * 2] = live ? smooth(0.03, 0.12, u) * (1 - smooth(0.45, 1, u)) * 0.8 : 0;
    F[i * 2 + 1] = q.seed;
  });
  aPos.needsUpdate = aFade.needsUpdate = true;
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

/* ---------- K2: bloom ---------- */
// Lifted from Canal at dusk: bloom on a float target; only bright sources cross the threshold.
function makeBloom(strength, radius, threshold) {
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), strength, radius, threshold);
  const full = bloom.setSize.bind(bloom);
  // Full size on High, 0.7 on Standard, half on the ladder's rung 2.
  bloom.setSize = (w, h) => { const m = rung >= 2 ? 0.5 : quality() === 'high' ? 1 : 0.7; full(Math.max(1, w * m), Math.max(1, h * m)); };
  // A sigma of radius / 2.5 gives each blur layer a round falloff.
  for (const m of bloom.separableBlurMaterials) {
    const r = m.defines.KERNEL_RADIUS, sg = r / 2.5;
    m.uniforms.gaussianCoefficients.value = Array.from({ length: r }, (_, i) => Math.exp(-0.5 * i * i / (sg * sg)));
  }
  return bloom;
}
/* ---------- end K2 ---------- */

/* ---------- K2: grade ---------- */
// Lifted from Canal at dusk: linear grade before tone mapping, vignette, fixed grain.
function makeGrade({ tint, vig, vigIn, grain }) {
  return new ShaderPass({
    uniforms: {
      tDiffuse: { value: null },
      uRes: { value: new THREE.Vector2(1, 1) },
      uTint: { value: new THREE.Vector3(...tint) },
      uVig: { value: vig },
      uVigIn: { value: vigIn },
      uGrain: { value: grain },
    },
    vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform vec2 uRes;
    uniform vec3 uTint;
    uniform float uVig, uVigIn, uGrain;
    varying vec2 vUv;
    // An integer hash per pixel; float hashes draw faint stripes here.
    float h(vec2 p) {
      uvec2 q = uvec2(p);
      uint n = (q.x * 1597334677u) ^ (q.y * 3812015801u);
      n *= 1597334677u; n ^= n >> 16; n *= 2246822519u; n ^= n >> 13;
      return float(n) / 4294967295.0;
    }
    void main() {
      vec3 c = texture2D(tDiffuse, vUv).rgb + uTint;
      vec2 q = (vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
      c *= 1.0 - uVig * smoothstep(uVigIn, 1.1, length(q));
      float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c *= 1.0 + (h(gl_FragCoord.xy) - 0.5) * uGrain * (0.6 + 0.4 * smoothstep(0.0, 0.3, lum)) * 2.0;
      gl_FragColor = vec4(max(c, 0.0), 1.0);
    }`,
  });
}
/* ---------- end K2 ---------- */

/* ---------- tilt-shift ---------- */
// A sharp band on the shack; the blur grows above and below it.
// Two passes, across then down, nine taps each.
const tiltPass = d => {
  const p = new ShaderPass({
    uniforms: {
      tDiffuse: { value: null },
      uStep: { value: new THREE.Vector2() },
      uFocus: { value: 0.4 }, uBand: { value: 0.1 }, uRamp: { value: 0.4 }, uMax: { value: 8 },
    },
    vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform vec2 uStep;
    uniform float uFocus, uBand, uRamp, uMax;
    varying vec2 vUv;
    void main() {
      float r = uMax * smoothstep(uBand, uBand + uRamp, abs(vUv.y - uFocus));
      vec3 acc = vec3(0.0);
      float w = 0.0;
      for (int i = -4; i <= 4; i++) {
        float f = float(i), k = exp(-f * f / 8.0);
        acc += texture2D(tDiffuse, vUv + uStep * f * r * 0.25).rgb * k;
        w += k;
      }
      gl_FragColor = vec4(acc / w, 1.0);
    }`,
  });
  p.dir = d;
  return p;
};

/* ---------- post chain ---------- */
const POST = { bloom: [0.45, 0.45, 0.95], tint: [0.0004, 0.0005, 0.0009], vig: 0.55, vigIn: 0.4, grain: 0.035 };
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(makeBloom(...POST.bloom));
const tilts = [tiltPass([1, 0]), tiltPass([0, 1])];
for (const p of tilts) composer.addPass(p);
const grade = makeGrade(POST);
composer.addPass(grade);
composer.addPass(new OutputPass());
let tiltK = 0.6;

/* ---------- camera and size ---------- */
let size = { w: 1, h: 1, dpr: 1 };
// Look offsets from a drag; they ease toward the target.
const look = { yaw: 0, pitch: 0, ty: 0, tp: 0 };
const focusPt = new THREE.Vector3(0, 1.6, 0.6);
function frame() {
  const portrait = size.w < size.h * 0.9;
  camera.aspect = size.w / size.h;
  // A low, wide lens on the cobbles; the shack sits right of centre.
  // Phones step in, centre the shack, and keep sky above for the plume.
  const T = portrait ? new THREE.Vector3(0.1, 3.6, 0) : new THREE.Vector3(-2.3, 2.2, 0);
  const P = portrait ? new THREE.Vector3(-0.8, 0.95, 16) : new THREE.Vector3(-1.4, 1.05, 15.5);
  camera.fov = portrait ? 58 : 38;
  // A drag swings the lens round the shack a little.
  const off = P.clone().sub(T);
  off.applyAxisAngle(new THREE.Vector3(0, 1, 0), look.yaw);
  camera.position.copy(T).add(off);
  camera.position.y = Math.max(0.35, P.y + look.pitch * 6);
  camera.lookAt(T);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  // The sharp band sits on the shack.
  const f = focusPt.clone().project(camera);
  for (const p of tilts) {
    p.uniforms.uFocus.value = f.y * 0.5 + 0.5;
    p.uniforms.uBand.value = portrait ? 0.09 : 0.08;
    p.uniforms.uRamp.value = portrait ? 0.35 : 0.3;
    p.uniforms.uMax.value = 18 * size.dpr * tiltK;
  }
  // Droplet size in pixels per metre at unit depth.
  dropMat.uniforms.uPx.value = size.h * size.dpr * camera.projectionMatrix.elements[5] / 2;
}
function resize() {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  // Rung 1 of the ladder drops the pixel ratio.
  size = { w, h, dpr: pixelRatio(w, h, { maxDpr: 2, budget: 1.8e6, low: rung >= 1 }) };
  renderer.setPixelRatio(size.dpr);
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  const W = w * size.dpr, H = h * size.dpr;
  grade.uniforms.uRes.value.set(W, H);
  tilts[0].uniforms.uStep.value.set(1 / W, 0);
  tilts[1].uniforms.uStep.value.set(0, 1 / H);
  frame();
  draw();
}
let visible = !document.hidden;
function draw() {
  if (!visible) return;
  writeSteam();
  composer.render();
}

/* Frame loop: full rate while something moves, then sleep. */
// QA can shorten the sleep with ?sleep=<ms>.
const SLEEP = +QS.get('sleep') || 60000;
let raf = 0, lastT = 0, lastDraw = 0, lastInput = performance.now(), simT = 0, flare = 0, lastShake = 0;
const busy = () => !!press || Math.abs(look.ty - look.yaw) + Math.abs(look.tp - look.pitch) > 1e-4 || U.uFlare.value > 0.003 || fryerBusy();
function tick(now) {
  raf = 0;
  if (!visible || document.hidden) { lastT = 0; return; }
  const dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0;
  lastT = now;
  const lively = busy();
  try {
    simT += dt;
    U.uTime.value = simT;
    // A hold on the shack keeps the basket shaking.
    if (press?.hold && now - lastShake > 700) act.shake();
    stepFryer(dt);
    flare *= Math.exp(-dt / 0.35);
    U.uFlare.value = Math.max(flare, poseFryer(simT));
    setLight();
    const k = 1 - Math.exp(-dt * (reduced() ? 6 : 10));
    look.yaw += (look.ty - look.yaw) * k;
    look.pitch += (look.tp - look.pitch) * k;
    if (lively || now - lastDraw >= 31) {
      frame();
      draw();
      watch(now, lively);
      lastDraw = now;
    }
  } finally {
    if (visible && lively) raf = requestAnimationFrame(tick);
    else lastT = 0;
  }
}
function wake() {
  lastInput = performance.now();
  if (!raf && visible && !document.hidden) raf = requestAnimationFrame(tick);
}
/* Performance ladder: slow frames step quality down a rung, never back up. */
let watchFrom = 0, watchN = 0, watchSum = 0, prevDraw = 0;
function watch(now, lively) {
  const gap = now - prevDraw;
  prevDraw = now;
  if (gap > 200) { watchFrom = now; watchN = watchSum = 0; return; }
  if (!watchFrom) watchFrom = now;
  if (now - watchFrom < 4000) return;
  watchN++; watchSum += gap;
  if (watchN < 2 || now - watchFrom < 6000) return;
  if (watchSum / watchN > (lively ? 1000 / 38 : 1000 / 22) && rung < 2) { rung++; resize(); }
  watchFrom = now - 4000; watchN = watchSum = 0;
}
whenVisible(stage, vis => {
  visible = vis;
  if (!vis) { cancelAnimationFrame(raf); raf = 0; lastT = 0; return; }
  draw();
  wake();
});
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
onReducedChange(() => wake());

/* Pointer: a press turns into a drag after 8 px, or a hold after 260 ms. */
let press = null;
// The shack's screen box, for taps and holds.
const SHACK_BOX = [[-1.8, 0, -1.3], [1.8, 3.4, 1.5]];
function onShack(cx, cy) {
  const r = stage.getBoundingClientRect();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const v = new THREE.Vector3();
  for (const x of [0, 1]) for (const y of [0, 1]) for (const z of [0, 1]) {
    v.set(SHACK_BOX[x][0], SHACK_BOX[y][1], SHACK_BOX[z][2]).project(camera);
    const px = (v.x * 0.5 + 0.5) * r.width, py = (0.5 - v.y * 0.5) * r.height;
    x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py);
  }
  const px = cx - r.left, py = cy - r.top;
  return px > x0 - 12 && px < x1 + 12 && py > y0 - 12 && py < y1 + 12;
}
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture(e.pointerId);
  const hit = onShack(e.clientX, e.clientY);
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, at: performance.now(), drag: false, hold: false, hit, yaw: look.ty, pitch: look.tp };
  // A hold on the shack shakes the basket.
  if (hit) press.timer = setTimeout(() => { if (press && !press.drag) { press.hold = true; act.shake(); } }, 260);
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  if (!press.drag && !press.hold && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { press.drag = true; stage.classList.add('held'); }
  if (!press.drag) return;
  // Drag swings the lens round the shack, a little each way.
  if (reduced()) return;
  const s = 1.2 / Math.max(size.w, size.h);
  look.ty = Math.max(-0.35, Math.min(0.35, press.yaw - (e.clientX - press.x) * s));
  look.tp = Math.max(-0.08, Math.min(0.12, press.pitch + (e.clientY - press.y) * s * 0.4));
  wake();
});
const end = e => {
  if (!press || e.pointerId !== press.id) return;
  clearTimeout(press.timer);
  press = null;
  stage.classList.remove('held');
  wake();
};
stage.addEventListener('pointerup', e => {
  if (press && e.pointerId === press.id && press.hit && !press.drag && !press.hold) act.drop();
  end(e);
});
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);

/* ---------- bar ---------- */
// Drop needs a free basket: empty, or holding blanched fries.
// Fill needs golden fries on the hook.
function syncActions() {
  ui.action('drop').disabled = !wells.some(w => !w.inOil && (w.fry === -1 || w.fry === 1));
  ui.action('fill').disabled = !wells.some(w => !w.inOil && w.fry === 2);
}
act.drop = () => {
  const w = wells.find(o => !o.inOil && o.fry === 1) ?? wells.find(o => !o.inOil && o.fry === -1);
  if (!w) { flare = Math.max(flare, 0.2); wake(); return; }
  if (w.fry === -1) w.fry = 0;
  w.stage = w.fry;
  w.inOil = true;
  w.t = 0;
  w.vy = -1.5;
  w.friesMat.uniforms.uAlb.value.set(...FRIES_COL[w.stage]);
  spit(w, reduced() ? 8 : 26);
  flare = 1;
  syncActions();
  wake();
};
act.shake = () => {
  lastShake = performance.now();
  // In the oil: lift a little, shake, drop back; the boil kicks up again.
  const w = wells.filter(o => o.inOil).sort((a, b) => a.t - b.t)[0] ?? wells.find(o => o.fry >= 0);
  if (!w) { flare = Math.max(flare, 0.2); wake(); return; }
  w.shake = 1;
  if (w.inOil) { w.dip = 0.35; spit(w, reduced() ? 4 : 12); }
  wake();
};
act.fill = () => {
  const w = wells.find(o => !o.inOil && o.fry === 2);
  if (!w) return;
  w.fry = -1;
  w.shake = 0.5;
  syncActions();
  wake();
};
act.sauce = () => wake();
act.wind = v => { wind = v; wake(); };
act.neon = v => { setNeon(v); draw(); };
act.tilt = v => { tiltK = v; frame(); draw(); };
act.traffic = () => {};
act.moths = () => {};
act.reset = () => {
  for (const w of wells) Object.assign(w, { fry: -1, stage: 0, inOil: false, t: 0, boil: SIMMER, foam: SIMMER, y: UP, vy: 0, shake: 0, dip: 0 });
  for (const d of drops) d.live = false;
  wind = 0.3; ui.slider.set(0.3); ui.choice.set('mayo');
  syncActions();
  wake();
};
syncActions();
wind = ui.slider?.value ?? 0.3;
tiltK = ui.setting('tilt')?.value ?? 0.6;
setNeon(ui.setting('neon')?.value ?? 'red');
setLight();
// The vent plume starts 6 s old, so the first frame is a picture.
for (let i = 0; i < 180; i++) stepSteam(1 / 30);
stepSpatter(0);
poseFryer(0);

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  markReady();
}, () => { canvas.classList.add('on'); markReady(); });
</script>
