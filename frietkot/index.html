{

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { initPage, whenVisible, pixelRatio, onQuality, linFit, oklchLinear, reduced, onReducedChange, quality, audioKit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import { FIG_GLSL } from './figures.js';

const stage = document.getElementById('stage');
// Handlers bind once the scene exists.
const act = { sauce() {}, wind() {}, drop() {}, shake() {}, fill() {}, neon() {}, tilt() {}, traffic() {}, moths() {}, people() {}, weather() {}, camcorder() {}, reset() {} };
const QS = new URLSearchParams(location.search);

/* ---------- sauces and neon ---------- */
const SAUCES = [
  { value: 'mayo', label: 'Mayonnaise', lch: [0.93, 0.05, 95] },
  { value: 'andalouse', label: 'Andalouse', lch: [0.72, 0.13, 50] },
  { value: 'samurai', label: 'Samurai', lch: [0.66, 0.17, 38] },
  { value: 'stoof', label: 'Stoofvlees', lch: [0.34, 0.06, 45] },
  { value: 'curry', label: 'Curry ketchup', lch: [0.5, 0.17, 28] },
  { value: 'tartaar', label: 'Tartaar', lch: [0.88, 0.04, 120] },
  { value: 'pickles', label: 'Pickles', lch: [0.78, 0.15, 92] },
];
// Each neon gas glows in its own colour.
const NEON = { red: [0.66, 0.24, 28], blue: [0.62, 0.17, 255], green: [0.8, 0.2, 145] };

const ui = initPage({ id: 'frietkot', bar: {
  choice: { label: 'Sauce', display: 'stepper', value: 'mayo', onPick: v => act.sauce(v),
    options: SAUCES.map(s => ({ value: s.value, label: s.label, dot: `oklch(${s.lch.join(' ')})` })) },
  slider: { label: 'Wind', min: 0, max: 1, step: 0.01, value: 0.3, onInput: v => act.wind(v) },
  actions: [
    { verb: 'drop', key: 'F', onPress: () => act.drop() },
    { verb: 'shake', key: 'S', onPress: () => act.shake() },
    { verb: 'fill', key: 'C', onPress: () => act.fill() },
  ],
  settings: [
    { type: 'choice', id: 'neon', label: 'Neon', value: 'red', persist: true, onPick: v => act.neon(v),
      options: [{ value: 'red', label: 'Red' }, { value: 'blue', label: 'Blue' }, { value: 'green', label: 'Green' }] },
    { type: 'slider', id: 'tilt', label: 'Tilt-shift', min: 0, max: 1, step: 0.01, value: 0.6, persist: true, onInput: v => act.tilt(v) },
    { type: 'toggle', id: 'traffic', label: 'Traffic', value: true, persist: true, onToggle: on => act.traffic(on) },
    { type: 'toggle', id: 'camcorder', label: 'Camcorder', value: true, persist: true, onToggle: on => act.camcorder(on) },
    { type: 'choice', id: 'weather', label: 'Weather', value: 'shift', persist: true, onPick: v => act.weather(v),
      options: [{ value: 'shift', label: 'Shifting' }, { value: 'dry', label: 'Dry' }, { value: 'drizzle', label: 'Drizzle' }, { value: 'rain', label: 'Rain' }, { value: 'fog', label: 'Fog' }] },
    { type: 'choice', id: 'people', label: 'People', value: 'ink', persist: true, onPick: v => act.people(v),
      options: [{ value: 'ink', label: 'Ink' }, { value: 'line', label: 'Line' }, { value: 'haze', label: 'Haze' }] },
    { type: 'toggle', id: 'moths', label: 'Moths', value: true, persist: true, onToggle: on => act.moths(on) },
  ],
  reset: () => act.reset(),
  quality: true,
  keys: [['click', 'drop fries'], ['hold', 'shake'], ['drag', 'look round'], ['scroll', 'zoom']],
} });

// Seeded random keeps the square the same on every load.
let seed = 4021;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; ui.hideControls?.(); markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 1200);
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;
const V3 = (a) => new THREE.Vector3(...a);

/* ---------- the shack's measures, in metres ---------- */
// The front faces +z. The service window is an opening in the front wall.
const S = {
  x0: -2.5, x1: 2.5, z0: -2.4, floor: 0.25, top: 2.7,
  ap: [-2.0, 0.9, 1.05, 2.05],   // window x0, x1, y0, y1
  apZ: 1.2,                      // front wall plane
  lamp: [-0.55, 2.6, -0.2],      // ceiling tube, inside
  neonA: [-2.52, 2.745, 1.3], neonB: [2.52, 2.745, 1.3],
  strip: [-0.55, 2.0, 1.42],     // warm tube under the awning
  vent: [1.7, 3.6, -1.7],
};
// The seating room on the right: lower, with steamed-up windows.
// Its roof falls from the kiosk side (topL) to the far end (topR).
const A = { x0: 2.5, x1: 6.0, z0: -1.6, z1: 1.0, top: 2.62, topL: 2.62, topR: 2.2, wins: [[2.9, 4.1], [4.4, 5.6]], wy: [0.95, 1.95] };
const annexTop = x => A.topL + (A.topR - A.topL) * (x - A.x0) / (A.x1 - A.x0);
// The oil sits at a working height above the shack floor.
const OIL_Y = 1.12, WELL_Z = 0.3, WELLS = [-1.45, -0.5];
// The sign box's lit face, for its reflection: depth and x0, x1, y0, y1.
const SIGN_REF = { z: 1.15, r: [-2.2, 1.3, S.top + 0.12, S.top + 0.74].map(v => v.toFixed(2)).join(', ') };

/* ---------- light ---------- */
// One uniform set feeds every surface, the shaft and the steam.
const U = {
  uLamp: { value: V3(S.lamp) },
  uLampCol: { value: new THREE.Vector3() },
  uAp: { value: new THREE.Vector4(...S.ap) },
  uApZ: { value: S.apZ },
  uWin: { value: new THREE.Vector3() },
  uStrip: { value: V3(S.strip) },
  uStripCol: { value: new THREE.Vector3() },
  uNeonA: { value: V3(S.neonA) },
  uNeonB: { value: V3(S.neonB) },
  uNeonCol: { value: new THREE.Vector3() },
  uSky: { value: new THREE.Vector3(...linFit(0.3, 0.04, 262)).multiplyScalar(0.05) },
  uGround: { value: new THREE.Vector3(...linFit(0.3, 0.03, 60)).multiplyScalar(0.02) },
  uHaze: { value: new THREE.Vector3(...linFit(0.2, 0.03, 50)).multiplyScalar(0.3) },
  uHazeK: { value: 0.009 },
  uTime: { value: 0 },
  uFlare: { value: 0 },
  // Outside, the window light reads brighter than the lamp's falloff gives.
  uOut: { value: 6.5 },
  uVeh0: { value: new THREE.Vector4() },
  uPartyP: { value: new THREE.Vector3(-24, 2.2, -60.5) },
  uPartyCol: { value: new THREE.Vector3() },
  uRefSign: { value: new THREE.Vector3() },
  uSodium: { value: new THREE.Vector3(...linFit(0.78, 0.16, 62)).multiplyScalar(14) },
  uStreet: { value: [[-12, 5.8, -38], [8, 5.8, -46], [22, 5.8, -36], [-39, 5.8, -55]].map(v => new THREE.Vector3(...v)) },
  uRefCone: { value: new THREE.Vector3() },
  uRefBox: { value: new THREE.Vector3(1.0, 0.7, 0.45).multiplyScalar(0.55) },
  uVeh1: { value: new THREE.Vector4() },
  uWet: { value: 0 },
  uRipple: { value: 0 },
  uAnnexP: { value: new THREE.Vector3((A.x0 + A.x1) / 2, 1.45, A.z1 - 0.1) },
  uAnnexCol: { value: new THREE.Vector3() },
};
// The window's warm light; a drop flares it for a moment.
const LAMP = new THREE.Vector3(...oklchLinear(0.9, 0.07, 70));
function setLight() {
  const f = 1 + 0.7 * U.uFlare.value;
  U.uLampCol.value.copy(LAMP).multiplyScalar(7 * f);
  // What the lens sees through the window: the lit back wall and steam.
  U.uWin.value.copy(LAMP).multiplyScalar(1.4 * f);
  U.uStripCol.value.copy(LAMP).multiplyScalar(0.9);
  U.uAnnexCol.value.copy(LAMP).multiplyScalar(1.1);
}
let neonKey = 'red';
const neonLin = new THREE.Vector3();
function setNeon(k) {
  neonKey = NEON[k] ? k : 'red';
  neonLin.set(...linFit(...NEON[neonKey]));
  U.uNeonCol.value.copy(neonLin).multiplyScalar(0.7);
  neonMat.color.setRGB(neonLin.x * 4, neonLin.y * 4, neonLin.z * 4);
  signMat.uniforms.uCol.value.copy(neonLin);
  U.uRefSign.value.copy(neonLin).multiplyScalar(1.3);
  for (const m of electrodeMats) m.color.setRGB(neonLin.x * 6, neonLin.y * 6, neonLin.z * 6);
}

const LIGHT = /* glsl */`
uniform vec3 uLamp, uLampCol, uWin, uStrip, uStripCol, uNeonA, uNeonB, uNeonCol, uSky, uGround, uHaze, uAnnexP, uAnnexCol;
uniform vec4 uAp;
uniform float uApZ, uHazeK, uOut;
uniform vec4 uVeh0, uVeh1;
uniform vec3 uPartyP, uPartyCol, uRefSign, uRefCone, uRefBox, uSodium;
uniform vec3 uStreet[4];
// A vehicle's headlights: x, z, heading, power.
vec3 veh(vec3 p, vec4 v) {
  if (v.w <= 0.0) return vec3(0.0);
  vec3 L = vec3(v.x, 0.7, v.y) - p;
  float d2 = dot(L, L);
  float spot = smoothstep(0.8, 0.95, dot(-L * inversesqrt(d2), normalize(vec3(v.z, -0.1, 0.0))));
  return vec3(1.0, 0.92, 0.78) * v.w * spot / (d2 + 0.5);
}
// Light from the ceiling tube passes the window opening only.
// The tube has length, so the edge grows soft with distance.
float apMask(vec3 p) {
  if (p.z <= uApZ) return 0.0;
  float t = (uApZ - uLamp.z) / (p.z - uLamp.z);
  vec2 q = uLamp.xy + t * (p.xy - uLamp.xy);
  vec2 s = vec2(0.55, 0.12) * (1.0 - t) + 0.01;
  float mx = smoothstep(uAp.x - s.x, uAp.x + s.x, q.x) * (1.0 - smoothstep(uAp.y - s.x, uAp.y + s.x, q.x));
  float my = smoothstep(uAp.z - s.y, uAp.z + s.y, q.y) * (1.0 - smoothstep(uAp.w - s.y, uAp.w + s.y, q.y));
  return mx * my;
}
// A soft box test on the window plane, for reflections.
// w: blur across and blur up; wet ground smears a reflection upward.
float rectSoft(vec2 q, vec4 r, vec2 w) {
  return smoothstep(r.x - w.x, r.x + w.x, q.x) * (1.0 - smoothstep(r.y - w.x, r.y + w.x, q.x))
       * smoothstep(r.z - w.y, r.z + w.y, q.y) * (1.0 - smoothstep(r.w - w.y, r.w + w.y, q.y));
}
// A lit rectangle at depth z, as it lies in a wet surface.
vec3 reflRect(vec3 p, vec3 r, float gloss, float z, vec4 rc, vec3 col) {
  if (r.z > -0.01 || p.z <= z) return vec3(0.0);
  float t = (z - p.z) / r.z;
  vec3 q = p + r * t;
  float w = 0.06 + t * (1.0 - gloss) * 0.5;
  return col * rectSoft(q.xy, rc, vec2(w, w * 4.0 + 0.1)) / (1.0 + t * 0.15);
}
// Closest point on the neon strip.
vec3 neonPt(vec3 p) {
  vec3 ba = uNeonB - uNeonA;
  return uNeonA + ba * clamp(dot(p - uNeonA, ba) / dot(ba, ba), 0.0, 1.0);
}
// inside: 1 for surfaces in the shack, 0 for the world outside.
// gloss: 0 matte, 1 a damp polished stone.
vec3 shade(vec3 p, vec3 n, vec3 v, vec3 alb, float gloss, float inside) {
  vec3 c = vec3(0.0);
  // The ceiling tube.
  vec3 L = uLamp - p;
  float d2 = dot(L, L);
  vec3 l = L * inversesqrt(d2);
  float m = mix(apMask(p) * uOut, 1.0, inside);
  float nl = max(dot(n, l), 0.0);
  c += alb * uLampCol * m * nl / (d2 + 0.05);
  // The tube under the awning lights the counter and the ground in front.
  vec3 Ls = uStrip - p;
  float ds2 = dot(Ls, Ls);
  vec3 ls = Ls * inversesqrt(ds2);
  float front = (1.0 - inside) * smoothstep(uApZ - 0.05, uApZ + 0.1, p.z);
  c += alb * uStripCol * front * max(dot(n, ls), 0.0) / (ds2 + 0.3);
  // The neon strip is a line light.
  vec3 Ln = neonPt(p) - p;
  float dn2 = dot(Ln, Ln);
  vec3 ln = Ln * inversesqrt(dn2);
  c += alb * uNeonCol * (1.0 - inside) * max(dot(n, ln), 0.0) / (dn2 + 0.08);
  // The seating room's windows wash the square in front of them.
  vec3 La = uAnnexP - p;
  float da2 = dot(La, La);
  c += alb * uAnnexCol * (1.0 - inside) * step(uAnnexP.z, p.z) * max(dot(n, La * inversesqrt(da2)), 0.0) / (da2 + 0.5);
  // Headlights sweep over the square.
  vec3 Lv0 = normalize(vec3(uVeh0.x, 0.7, uVeh0.y) - p), Lv1 = normalize(vec3(uVeh1.x, 0.7, uVeh1.y) - p);
  c += alb * (1.0 - inside) * (veh(p, uVeh0) * max(dot(n, Lv0), 0.0) + veh(p, uVeh1) * max(dot(n, Lv1), 0.0));
  // The far streetlights each light a pool on the road.
  for (int i = 0; i < 4; i++) {
    vec3 Lst = uStreet[i] - p;
    float ds = dot(Lst, Lst);
    c += alb * uSodium * (1.0 - inside) * max(dot(n, Lst * inversesqrt(ds)), 0.0) / (ds + 2.0);
  }
  // The party's coloured light spills out of the hall.
  vec3 Lp = uPartyP - p;
  c += alb * uPartyCol * (1.0 - inside) * max(dot(n, normalize(Lp)), 0.0) / (dot(Lp, Lp) + 3.0);
  // Sky and ground bounce.
  c += alb * mix(uGround, uSky, 0.5 + 0.5 * n.y);
  if (gloss > 0.0) {
    // Reflections see a calmer surface: the setts break them up, not into tiles.
    vec3 nr = normalize(mix(vec3(0.0, 1.0, 0.0), n, 0.3));
    float fr = 0.02 + 0.98 * pow(1.0 - max(dot(nr, v), 0.0), 5.0);
    vec3 r = reflect(-v, nr);
    vec3 spec = vec3(0.0);
    if (r.z < -0.01 && p.z > uApZ) {
      float t = (uApZ - p.z) / r.z;
      vec3 q = p + r * t;
      // Soft edges that widen with distance; the streak smears upward more than across.
      float w = 0.06 + t * (1.0 - gloss) * 0.5;
      float win = rectSoft(q.xy, uAp, vec2(w, w * 4.0 + 0.1));
      // The image fades along its length, as a wet surface scatters more far off.
      spec += uWin * win / (1.0 + t * 0.15);
      // The neon tube is thin; a blurred image of it is dimmer.
      float tn = (uNeonA.z - p.z) / r.z;
      vec3 qn = p + r * tn;
      float wn = 0.05 + tn * (1.0 - gloss) * 0.35;
      float band = exp(-pow((qn.y - uNeonA.y) / wn, 2.0)) * smoothstep(uNeonB.x + wn, uNeonB.x - wn, abs(qn.x)) * 0.03 / wn;
      spec += uNeonCol * 3.0 * band / (1.0 + tn * 0.15);
    }
    // The sign, the fries, the seating room's light box and windows also lie in the wet.
    spec += reflRect(p, r, gloss, ${SIGN_REF.z}, vec4(${SIGN_REF.r}), uRefSign);
    spec += reflRect(p, r, gloss, ${(S.apZ + 0.03).toFixed(2)}, vec4(1.35, 2.05, 1.2, 2.25), uRefCone);
    spec += reflRect(p, r, gloss, ${(A.z1 + 0.03).toFixed(2)}, vec4(${(A.x0 + 0.25).toFixed(2)}, ${(A.x1 - 0.35).toFixed(2)}, ${(A.topL + 0.16).toFixed(2)}, ${(A.topL + 0.48).toFixed(2)}), uRefBox);
    spec += reflRect(p, r, gloss, ${A.z1.toFixed(2)}, vec4(${A.wins[0][0]}, ${A.wins[0][1]}, ${A.wy[0]}, ${A.wy[1]}), uRefBox * 0.35);
    spec += reflRect(p, r, gloss, ${A.z1.toFixed(2)}, vec4(${A.wins[1][0]}, ${A.wins[1][1]}, ${A.wy[0]}, ${A.wy[1]}), uRefBox * 0.35);
    c += spec * fr * gloss * 0.55;
  }
  return c;
}
vec3 haze(vec3 c, vec3 p) {
  float d = length(p - cameraPosition);
  return mix(c, uHaze, 1.0 - exp(-d * uHazeK));
}
`;

const NOISE = /* glsl */`
float hash12(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
`;

const VS = /* glsl */`
varying vec3 vP, vN;
void main() {
  vec4 w = modelMatrix * vec4(position, 1.0);
  vP = w.xyz;
  vN = normalize(mat3(modelMatrix) * normal);
  gl_Position = projectionMatrix * viewMatrix * w;
}`;

/* ---------- the square ---------- */
// Belgian setts in running bond, damp on top, rough in the joints.
const groundMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: VS,
  fragmentShader: /* glsl */`
  ${LIGHT}
  ${NOISE}
  uniform float uWet, uRipple, uTime;
  varying vec3 vP, vN;
  void main() {
    vec2 g = vP.xz;
    // A sett is 17 by 13 cm; each row shifts at random.
    float row = floor(g.y / 0.13);
    float cx = g.x / 0.17 + hash12(vec2(row, 3.0));
    vec2 id = vec2(floor(cx), row);
    vec2 hs = vec2(0.085, 0.065);
    vec2 f = vec2(fract(cx) * 0.17, fract(g.y / 0.13) * 0.13) - hs;
    float sd = length(max(abs(f) - hs + 0.02, 0.0)) - 0.014;
    // Fine detail fades out where a pixel covers several setts.
    float fw = length(fwidth(g));
    float detail = 1.0 - smoothstep(0.015, 0.06, fw);
    float stone = mix(0.8, 1.0 - smoothstep(-0.012, 0.002, sd), detail);
    float r1 = hash12(id), r2 = hash12(id + 7.7);
    // Each sett is a low dome with its own tilt.
    vec2 grad = (f / (hs * hs) * 0.0012 + (vec2(r1, r2) - 0.5) * vec2(0.02, 0.05)) * stone * detail;
    vec3 n = normalize(vec3(-grad.x, 1.0, -grad.y));
    vec3 v = normalize(cameraPosition - vP);

/* ---------- fryer ---------- */
// Belgian fries cook twice: a blanch near 150 °C, then a crisp near 180 °C.

const FRY = [{ r0: 1.0, tau: 2.5, cook: 6.0 }, { r0: 1.2, tau: 1.5, cook: 4.5 }];

// The foam crown: a dome of bubbles that rises with the boil.
const VOR = /* glsl */`
// F1 and F2 distances to the nearest bubble centres.
vec2 vor(vec2 p) {
  vec2 i = floor(p), f = fract(p), d = vec2(8.0);
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 g = vec2(x, y), o = vec2(hash12(i + g), hash12(i + g + 19.7));

function foamMat(seed) {

    uniforms: { ...U, uFoam: { value: 0 }, uSeed: { value: seed } },

    vertexShader: /* glsl */`
    uniform float uTime, uFoam, uSeed;
    varying vec3 vP, vN;
    // Lumps that roll over the crown as it boils.
    float wob(vec3 p) {

    }
    void main() {
      vec3 p = position;
      p.xz *= 1.0 + 0.1 * wob(p) * p.y;
      p.y *= 1.0 + 0.35 * wob(p.zyx + 3.0);
      vec4 w = modelMatrix * vec4(p, 1.0);
      vP = w.xyz;
      vN = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
    fragmentShader: /* glsl */`
    ${NOISE}
    ${VOR}
    uniform vec3 uLampCol;
    uniform float uFoam, uTime, uSeed;
    varying vec3 vP, vN;
    void main() {
      vec3 n = normalize(vN), v = normalize(cameraPosition - vP);
      // Bubbles shrink as the fries dry, so the cells get finer as foam falls.
      float scale = mix(70.0, 34.0, uFoam);
      vec2 uv = vec2(vP.x + vP.z * 0.6, vP.y - ${OIL_Y.toFixed(3)}) * scale;
      uv.y -= uTime * (2.0 + 6.0 * uFoam) + uSeed * 9.0;
      vec2 d = vor(uv);
      float rim = 1.0 - smoothstep(0.0, 0.12, d.y - d.x);
      // A glint where a bubble wall faces the lamp.
      float glint = pow(1.0 - d.x, 8.0) * step(0.82, hash12(floor(uv) + uSeed));

      float top = 0.55 + 0.45 * max(n.y, 0.0);

      float edge = smoothstep(0.05, 0.45, abs(dot(n, v)));
      float a = edge * mix(0.8, 1.0, rim) * smoothstep(0.0, 0.08, uFoam);
      gl_FragColor = vec4(c, a);
    }`,
  });
}

// Wire baskets read as dark see-through boxes at this distance.

/* ---------- spatter ---------- */
// Droplets of oil jump from the boil and glint in the lamp light.
const DROPS = 160;
const drops = Array.from({ length: DROPS }, () => ({ p: new THREE.Vector3(), v: new THREE.Vector3(), live: false }));
const dropGeo = new THREE.BufferGeometry();
const dropPos = new THREE.BufferAttribute(new Float32Array(DROPS * 3), 3);
dropGeo.setAttribute('position', dropPos);
const dropMat = new THREE.ShaderMaterial({
  uniforms: { ...U, uPx: { value: 400 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
  uniform float uPx;
  void main() {
    vec4 mv = modelViewMatrix * vec4(position, 1.0);

  fragmentShader: /* glsl */`
  uniform vec3 uLampCol;
  void main() {

  }`,

const spatter = new THREE.Points(dropGeo, dropMat);
spatter.frustumCulled = false;
spatter.renderOrder = 3;
scene.add(spatter);
let dropsLive = 0, spatAcc = 0;
function spit(w, n) {
  for (const d of drops) {
    if (n <= 0) break;
    if (d.live) continue;
    d.live = true; n--;
    d.p.set(w.x + (rnd() - 0.5) * 0.7, OIL_Y + 0.02, WELL_Z + (rnd() - 0.5) * 0.3);
    // A jump of 5 to 30 cm.
    d.v.set((rnd() - 0.5) * 0.6, Math.sqrt(2 * 9.8 * (0.05 + rnd() * 0.25)), (rnd() - 0.5) * 0.5);
  }
}
function stepSpatter(dt) {
  dropsLive = 0;
  const P = dropPos.array;
  drops.forEach((d, i) => {
    if (d.live) {
      d.v.y -= 9.8 * dt;
      d.p.addScaledVector(d.v, dt);
      if (d.p.y < OIL_Y && d.v.y < 0) d.live = false;
      else dropsLive++;
    }
    if (d.live) P.set([d.p.x, d.p.y, d.p.z], i * 3);

}

/* ---------- the boil ---------- */
const smooth01 = x => { const t = Math.min(1, Math.max(0, x)); return t * t * (3 - 2 * t); };

      const surge = 1 - Math.exp(-w.t / 0.12);
      const target = SIMMER + F.r0 * surge * Math.exp(-w.t / F.tau) + w.dip;
      w.boil += (target - w.boil) * (1 - Math.exp(-dt / 0.05));
      // The fries colour while they cook.
      const k = smooth01(w.t / F.cook);
      w.friesMat.uniforms.uAlb.value.set(...FRIES_COL[w.stage].map((c, j) => c + (FRIES_COL[w.stage + 1][j] - c) * k));

    } else {
      w.boil += (SIMMER - w.boil) * (1 - Math.exp(-dt / 0.3));
    }
    w.dip *= Math.exp(-dt / 0.5);

    const ty = w.inOil ? (w.shake > 0.05 ? IN + LIFT : IN) : UP;
    w.vy += (160 * (ty - w.y) - 16 * w.vy) * dt;
    w.y += w.vy * dt;

}

    const s = Math.sin(time * 50 + w.x);
    w.g.position.set(w.x + s * 0.03 * a, OIL_Y + w.y + Math.abs(s) * 0.025 * a, WELL_Z);

    w.g.rotation.x = smooth01((w.y - IN) / (UP - IN)) * 0.35;
    w.g.rotation.z = s * 0.08 * a;
    w.fries.visible = w.fry >= 0;
  }

}

/* ---------- neon ---------- */
// Glass tube: a hot core where the gas glows face-on, the colour thinning at the edges.

// The wall sign burns steady; rain gets into it and it sputters.
let sputter = 0;
function stepFrySign(t, dt) {

  else if (Math.random() < dt * wx.rain * 2.5) sputter = 0.05 + Math.random() * 0.2;
  const on = sputter > 0 ? 0.15 + 0.2 * Math.random() : 1;

const neonMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const electrodeMats = [];

{
  // The long strip along the roof edge.

    e.position.set(...p);

// A row of dark gables, a few late windows, and a church tower in the haze.

// Sodium streetlights in the distance: a pole, an arm, an orange head and its pool on the road.

// Late windows: one instanced mesh; each window fades on or off by itself.
const winMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.9, 1.3), new THREE.MeshBasicMaterial({ color: 0xffffff }), lateWins.length);
{
  const m4 = new THREE.Matrix4();
  lateWins.forEach((w, i) => { m4.makeTranslation(w.x, w.y, w.z); winMesh.setMatrixAt(i, m4); w.k = w.on ? 1 : 0; });

}
// Each lit window also lights the wall round it, so it sits in a house.
const haloMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`varying vec2 vUv; varying vec3 vC; void main() { vUv = uv; vC = instanceColor; gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`varying vec2 vUv; varying vec3 vC; void main() { vec2 q = (vUv - 0.5) * 2.0; gl_FragColor = vec4(vC * 0.07 * exp(-dot(q, q) * 2.2), 1.0); }`,
});
const haloMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(2.6, 3.0), haloMat, lateWins.length);
{
  const m4 = new THREE.Matrix4();
  lateWins.forEach((w, i) => { m4.makeTranslation(w.x, w.y, w.z - 0.01); haloMesh.setMatrixAt(i, m4); haloMesh.setColorAt(i, new THREE.Color(0, 0, 0)); });
  scene.add(haloMesh);
}
const WARM = new THREE.Color().setRGB(...linFit(0.82, 0.1, 70).map(v => v * 0.9));
const SCREEN = new THREE.Color().setRGB(...linFit(0.7, 0.08, 250).map(v => v * 0.8));
const OFF = new THREE.Color().setRGB(0.004, 0.004, 0.006);
const tmpC = new THREE.Color();
function paintWins() {
  lateWins.forEach((w, i) => {
    tmpC.copy(OFF).lerp(w.tv ? SCREEN : WARM, w.k);
    // A screen flickers as the picture changes.
    if (w.tv && w.k > 0) tmpC.multiplyScalar(0.75 + 0.25 * Math.sin(simT * 3.1 + i) * Math.sin(simT * 1.3 + i * 2));
    winMesh.setColorAt(i, tmpC);
    haloMesh.setColorAt(i, tmpC);
  });
  winMesh.instanceColor.needsUpdate = true;
  haloMesh.instanceColor.needsUpdate = true;
}
let winFlip = 3;
// Now and then a light goes on or off across the square.
function stepWins(dt) {
  winFlip -= dt;
  if (winFlip <= 0) {
    winFlip = 2 + rnd() * 6;
    const w = lateWins[Math.floor(rnd() * lateWins.length)];
    if (w) w.on = !w.on;
  }
  for (const w of lateWins) w.k += ((w.on ? 1 : 0) - w.k) * Math.min(1, dt * (w.on ? 6 : 3));
  paintWins();
}

const HALL = { x0: -31, x1: -17, z: -62, d: 11, h: 5.2, wins: 5, beat: 126 / 60 };
const HALL_WINS = HALL.wins, HALL_X0 = HALL.x0, HALL_X1 = HALL.x1;
// The parish hall's brick: lit by its own windows, its door and a lamp over the door,
// so the building reads round the light and nothing seems to float.
const hallMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: VS,
  fragmentShader: /* glsl */`
  ${NOISE}
  uniform vec3 uPartyCol, uHaze, uSky;
  uniform float uHazeK;
  varying vec3 vP, vN;
  void main() {
    vec3 n = normalize(vN);
    // Brick courses, dark red-brown.
    vec2 b = vec2(vP.x * 4.0 + floor(vP.y * 13.0) * 0.5, vP.y * 13.0);
    float mortar = smoothstep(0.08, 0.0, min(fract(b.x), fract(b.y)));
    vec3 alb = mix(vec3(0.16, 0.07, 0.05), vec3(0.09, 0.08, 0.07), mortar) * (0.8 + 0.4 * hash12(floor(b)));
    vec3 c = alb * uSky * 3.0;
    float front = step(0.5, n.z);
    // Each tall window throws its colour on the wall round it.
    for (int i = 0; i < ${HALL_WINS}; i++) {
      vec2 w = vec2(${HALL_X0.toFixed(1)} + 1.5 + float(i) * 3.0, 2.3);
      vec2 dv = (vP.xy - w) / vec2(1.4, 1.9);
      c += alb * uPartyCol * 1.4 * exp(-dot(dv, dv)) * front;
    }
    // The open door and the lamp over it.
    vec2 dd = (vP.xy - vec2(${(HALL_X1 - 1.4).toFixed(1)}, 2.9)) / vec2(1.6, 1.4);
    c += alb * vec3(1.0, 0.7, 0.4) * 3.0 * exp(-dot(dd, dd)) * front;
    // The roof edge holds a little sky.
    c += alb * uSky * 6.0 * smoothstep(0.3, 1.0, n.y);
    float dist = length(vP - cameraPosition);
    gl_FragColor = vec4(mix(c, uHaze, 1.0 - exp(-dist * uHazeK)), 1.0);
  }`,
});
// The parish hall across the square: a party is on. Tall windows flash in colour on the beat.
{
  const g = new THREE.BoxGeometry(HALL.x1 - HALL.x0, HALL.h, HALL.d).translate((HALL.x0 + HALL.x1) / 2, HALL.h / 2, HALL.z - HALL.d / 2);
  const sh = new THREE.Shape();
  const w = HALL.x1 - HALL.x0;
  sh.moveTo(0, 0); sh.lineTo(HALL.d, 0); sh.lineTo(HALL.d / 2, 3.2); sh.closePath();
  const roof = new THREE.ExtrudeGeometry(sh, { depth: w, bevelEnabled: false });
  // The roof ridge runs along the hall, parallel to the square.
  roof.rotateY(Math.PI / 2).translate(HALL.x0, HALL.h, HALL.z);
  scene.add(new THREE.Mesh(mergeGeometries([g.toNonIndexed(), roof.index ? roof.toNonIndexed() : roof]), hallMat));
}
const partyMat = new THREE.ShaderMaterial({
  uniforms: { uTime: U.uTime, uBeat: { value: HALL.beat } },
  vertexShader: /* glsl */`varying vec2 vUv; varying float vX; void main() { vUv = uv; vX = (modelMatrix * vec4(position, 1.0)).x; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform float uTime, uBeat;
  varying vec2 vUv;
  varying float vX;
  vec3 hue(float h) { return clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0); }
  float hash(vec2 p) { return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }
  void main() {
    float i = floor(vX / 3.0);
    float beat = fract(uTime * uBeat);
    // Each window takes its own colour; all of them punch on the beat.
    vec3 c = hue(fract(uTime * 0.11 + i * 0.23 + floor(uTime * uBeat / 8.0) * 0.37));
    float pulse = 0.3 + 0.7 * exp(-beat * 6.0);
    // Mirror-ball specks drift across the glass.
    vec2 g = vec2(vUv.x * 7.0 + uTime * 0.35, vUv.y * 12.0 - uTime * 0.1);
    float speck = step(0.9, hash(floor(g) + i)) * smoothstep(0.45, 0.1, length(fract(g) - 0.5));
    // Glazing bars and dancers, soft dark shapes bobbing against the light.
    float bars = step(0.06, abs(fract(vUv.x * 2.0) - 0.5) * 2.0 - 0.0) * step(0.04, abs(vUv.y - 0.55));
    float bob = sin(uTime * uBeat * 3.1416 + i * 1.7);
    float dancers = smoothstep(0.32, 0.18, length((vUv - vec2(0.3 + 0.1 * sin(uTime * 0.7 + i), 0.18 + 0.03 * bob)) / vec2(0.9, 1.6)))
                  + smoothstep(0.28, 0.15, length((vUv - vec2(0.72, 0.15 - 0.03 * bob)) / vec2(0.9, 1.7)));
    vec3 col = (c * 0.7 * pulse + vec3(1.0, 0.95, 0.9) * speck * 0.8) * bars * (1.0 - 0.75 * clamp(dancers, 0.0, 1.0));
    gl_FragColor = vec4(col, 1.0);
  }`,
});
for (let i = 0; i < HALL.wins; i++) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 2.6), partyMat);
  m.position.set(HALL.x0 + 1.5 + i * 3.0, 2.3, HALL.z + 0.02);

}
// The door stands open: warm light, and a couple outside for a smoke.
{
  // The door: a warm corridor seen through a dark frame; now and then someone crosses it.
  const door = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 2.5), new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime },
    vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
    uniform float uTime;
    varying vec2 vUv;
    void main() {
      vec2 q = vUv;
      float deep = smoothstep(0.0, 0.6, 1.0 - abs(q.x - 0.5) * 2.0) * smoothstep(1.0, 0.15, q.y);
      vec3 c = vec3(1.0, 0.6, 0.3) * (0.08 + 0.45 * deep);
      float px = fract(uTime * 0.06) * 1.8 - 0.4;
      c *= 1.0 - 0.75 * smoothstep(0.1, 0.04, abs(q.x - px)) * step(q.y, 0.72);
      float inner = step(0.08, q.x) * step(q.x, 0.92) * step(q.y, 0.94);
      gl_FragColor = vec4(mix(vec3(0.02, 0.015, 0.012), c, inner), 1.0);
    }`,
  }));
  door.position.set(HALL.x1 - 1.4, 1.25, HALL.z + 0.03);
  scene.add(door);
  // A small lamp over the door.
  const lamp = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.18), new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(...linFit(0.9, 0.08, 75).map(v => v * 2.5)) }));
  lamp.position.set(HALL.x1 - 1.4, 2.85, HALL.z + 0.06);
  scene.add(lamp);
  // A step under the door, and the warm light it throws on the pavement.
  const step = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.16, 0.6), M.gable);
  step.position.set(HALL.x1 - 1.4, 0.08, HALL.z + 0.3);
  scene.add(step);
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(4, 3).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`varying vec2 vUv; void main() { vec2 q = (vUv - vec2(0.5, 0.85)) * vec2(1.6, 1.4); gl_FragColor = vec4(vec3(1.0, 0.6, 0.3) * 0.05 * exp(-dot(q, q) * 3.0), 1.0); }`,
  }));
  pool.position.set(HALL.x1 - 1.4, 0.02, HALL.z + 1.5);
  scene.add(pool);
}
// The colour the hall throws onto the square, on the beat.
const partyCol = new THREE.Color();
function stepParty(t) {
  const i = Math.floor(t * HALL.beat / 8);
  partyCol.setHSL((t * 0.11 + i * 0.37) % 1, 1, 0.5);
  const pulse = 0.3 + 0.7 * Math.exp(-((t * HALL.beat) % 1) * 6);
  U.uPartyCol.value.set(partyCol.r, partyCol.g, partyCol.b).multiplyScalar(2.2 * pulse);
}

// The seating room: up to five come in by the far door, sit, eat, talk, get up and go.
const SEATS = [3.2, 3.75, 4.7, 5.25];
const sitters = [];
let sitIn = 4;
function stepSitters(dt) {
  sitIn -= dt;
  const free = SEATS.filter(x => !sitters.some(o => o.seat === x));
  if (sitIn <= 0 && free.length && sitters.length < SIT_N) {
    sitters.push({ x: 5.85, seat: free[Math.floor(rnd() * free.length)], up: 1, a: 0, state: 'in', t: 25 + rnd() * 50, lean: 0, ph: rnd() * 6 });
    sitIn = 6 + rnd() * 10;
  }
  for (const o of sitters) {
    o.ph += dt;
    o.lean = 0.05 * Math.sin(o.ph * 0.6) + 0.03 * Math.sin(o.ph * 1.7);
    if (o.state === 'in') {
      o.a = Math.min(1, o.a + dt * 2);
      o.x += Math.sign(o.seat - o.x) * Math.min(Math.abs(o.seat - o.x), dt * 0.9);
      if (Math.abs(o.x - o.seat) < 0.01) o.state = 'sit';
    } else if (o.state === 'sit') {
      o.up = Math.max(0, o.up - dt * 1.5);
      if ((o.t -= dt) <= 0) o.state = 'rise';
    } else if (o.state === 'rise') {
      o.up = Math.min(1, o.up + dt * 1.5);
      if (o.up >= 1) o.state = 'out';
    } else {
      o.x += Math.min(5.95 - o.x, dt * 0.9);
      if (o.x > 5.8) o.a -= dt * 2;
    }
  }
  for (let i = sitters.length - 1; i >= 0; i--) if (sitters[i].a < 0) sitters.splice(i, 1);
  sitU.forEach((u, i) => { const o = sitters[i]; u.set(o?.x ?? 0, o?.up ?? 0, o?.a ?? 0, o?.lean ?? 0); });
}
// Two already sit when the night starts.
sitters.push({ x: 3.2, seat: 3.2, up: 0, a: 1, state: 'sit', t: 40, lean: 0, ph: 1 }, { x: 4.7, seat: 4.7, up: 0, a: 1, state: 'sit', t: 70, lean: 0, ph: 3 });

// The tower clock: an open dial. Only the marks and the hands are lit; the stone shows between.
const clockMat = new THREE.ShaderMaterial({
  uniforms: { uH: { value: 0 }, uM: { value: 0 } },
  transparent: true, depthWrite: false,
  vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform float uH, uM;
  varying vec2 vUv;
  float hand(vec2 p, float a, float len, float w, float aa) {
    vec2 d = vec2(sin(a), cos(a));
    float t = clamp(dot(p, d), -0.06, len);
    return smoothstep(w + aa, w - aa, length(p - d * t));
  }
  // A radial bar on the dial: k marks round, from r0 to r1, w wide.
  float bars(vec2 p, float k, float r0, float r1, float w, float aa) {
    float r = length(p), a = atan(p.x, p.y);
    float s = abs(fract(a / 6.2832 * k + 0.5) - 0.5) * 6.2832 / k * r;
    return smoothstep(w + aa, w - aa, s) * smoothstep(r0 - aa, r0 + aa, r) * smoothstep(r1 + aa, r1 - aa, r);
  }
  void main() {
    vec2 p = (vUv - 0.5) * 2.0;
    float r = length(p), aa = fwidth(r) * 1.2;
    // Twelve bold bars; the quarters run longer.
    float ink = max(bars(p, 12.0, 0.66, 0.92, 0.05, aa), bars(p, 4.0, 0.5, 0.92, 0.06, aa));
    ink = max(ink, max(hand(p, uH, 0.5, 0.055, aa), hand(p, uM, 0.78, 0.035, aa)));
    ink = max(ink, smoothstep(0.07 + aa, 0.07 - aa, r));
    if (ink < 0.01) discard;
    gl_FragColor = vec4(vec3(1.0, 0.88, 0.62) * 2.2 * ink, ink);
  }`,
});
const clock = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 3.4), clockMat);
clock.position.set(TOWER.x, TOWER.clockY, TOWER.z + 0.03);
scene.add(clock);
function setClock() {
  const d = new Date(), m = d.getMinutes() + d.getSeconds() / 60, h = (d.getHours() % 12) + m / 60;
  clockMat.uniforms.uH.value = h / 12 * Math.PI * 2;
  clockMat.uniforms.uM.value = m / 60 * Math.PI * 2;
}
setClock();

/* ---------- sky ---------- */
// Deep blue-black above; the glow of far towns along the horizon.
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    uZen: { value: new THREE.Vector3(...linFit(0.12, 0.03, 262)) },
    uHor: { value: new THREE.Vector3(...linFit(0.27, 0.04, 55)) },
    uHaze: U.uHaze,
  },
  vertexShader: /* glsl */`varying vec3 vD; void main() { vD = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: /* glsl */`
  ${NOISE}
  uniform vec3 uZen, uHor, uHaze;
  varying vec3 vD;
  void main() {
    vec3 d = normalize(vD);
    float h = d.y;
    vec3 c = mix(uHor, uZen, smoothstep(-0.02, 0.45, h));
    c += uHor * 0.35 * exp(-max(h, 0.0) * 22.0);
    // Few stars: town glow washes most of them out.
    vec2 sp = vec2(atan(d.z, d.x) * 220.0, h * 260.0);
    vec2 cell = floor(sp);
    float r = hash12(cell);
    float star = step(0.996, r) * smoothstep(0.35, 0.0, length(fract(sp) - 0.5)) * smoothstep(0.05, 0.35, h);
    c += vec3(0.7, 0.75, 0.9) * star * (r - 0.996) * 40.0;
    c = mix(c, uHaze, smoothstep(0.02, -0.04, h));
    gl_FragColor = vec4(c, 1.0);
  }`,
}));
sky.frustumCulled = false;
sky.renderOrder = -1;
scene.add(sky);

/* ---------- the light shaft ---------- */
// Haze glows where the window light passes: a short ray march in a box.
const SHAFT = { lo: [-11, 0.0, S.apZ], hi: [9, 2.4, 12] };
const shaftMat = new THREE.ShaderMaterial({
  uniforms: { ...U, uLo: { value: V3(SHAFT.lo) }, uHi: { value: V3(SHAFT.hi) }, uDens: { value: 0.0022 } },
  side: THREE.BackSide, depthTest: false, depthWrite: false, transparent: true,
  blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`varying vec3 vP; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: /* glsl */`
  ${LIGHT}
  ${NOISE}
  uniform vec3 uLo, uHi;
  uniform float uDens, uTime;
  varying vec3 vP;
  void main() {
    vec3 ro = cameraPosition, rd = normalize(vP - ro);
    vec3 t0 = (uLo - ro) / rd, t1 = (uHi - ro) / rd;
    vec3 tn = min(t0, t1), tf = max(t0, t1);
    float a = max(max(max(tn.x, tn.y), tn.z), 0.0), b = min(min(tf.x, tf.y), tf.z);
    if (b <= a) discard;
    float dt = (b - a) / 16.0;
    float t = a + dt * hash12(gl_FragCoord.xy);
    vec3 acc = vec3(0.0);
    for (int i = 0; i < 16; i++) {
      vec3 p = ro + rd * t;
      vec3 L = uLamp - p;
      float d2 = dot(L, L);
      // Forward scatter: the haze glows most toward the window.
      float mu = dot(rd, L * inversesqrt(d2));
      float g = 0.45;
      float ph = (1.0 - g * g) / pow(1.0 + g * g - 2.0 * g * mu, 1.5);
      float dens = 0.6 + 0.8 * fbm(p.xz * 0.6 + vec2(uTime * 0.05, p.y * 0.4));
      acc += uLampCol * uOut * apMask(p) * ph * dens / (d2 + 0.2);
      t += dt;
    }
    gl_FragColor = vec4(acc * dt * uDens, 1.0);
  }`,
});
{
  const s = new THREE.Vector3(...SHAFT.hi).sub(V3(SHAFT.lo));
  const m = new THREE.Mesh(new THREE.BoxGeometry(s.x, s.y, s.z), shaftMat);
  m.position.set(...new THREE.Vector3(...SHAFT.hi).add(V3(SHAFT.lo)).multiplyScalar(0.5).toArray());
  m.renderOrder = 2;
  m.frustumCulled = false;
  scene.add(m);
}

/* ---------- steam ---------- */
// Soft puffs. Each rises by buoyancy, cools, grows, and drifts with the wind.
const PUFFS = 400;
const puff = Array.from({ length: PUFFS }, () => ({ p: new THREE.Vector3(), v: new THREE.Vector3(), T: 0, age: 1e9, life: 1, size: 0.1, seed: Math.random(), kind: 0 }));
const steamGeo = new THREE.InstancedBufferGeometry();
steamGeo.index = new THREE.PlaneGeometry(1, 1).index;
steamGeo.setAttribute('position', new THREE.PlaneGeometry(1, 1).getAttribute('position'));
const aPos = new THREE.InstancedBufferAttribute(new Float32Array(PUFFS * 4), 4);
const aFade = new THREE.InstancedBufferAttribute(new Float32Array(PUFFS * 2), 2);
steamGeo.setAttribute('aPos', aPos);
steamGeo.setAttribute('aFade', aFade);
steamGeo.instanceCount = PUFFS;
const steamMat = new THREE.ShaderMaterial({
  uniforms: U,
  transparent: true, depthWrite: false,
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  vertexShader: /* glsl */`
  attribute vec4 aPos;
  attribute vec2 aFade;
  varying vec3 vP;
  varying vec2 vUv, vF;
  void main() {
    vUv = position.xy + 0.5;
    vF = aFade;
    // Billboards face the lens.
    vec3 right = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
    vec3 up = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
    vP = aPos.xyz + (right * position.x + up * position.y) * aPos.w;
    gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0);
  }`,
  fragmentShader: /* glsl */`
  ${LIGHT}
  ${NOISE}
  uniform float uTime;
  varying vec3 vP;
  varying vec2 vUv, vF;
  void main() {
    vec2 q = vUv - 0.5;
    float r = length(q) * 2.0;
    float n = fbm(vUv * 3.0 + vF.y * 17.0 + uTime * 0.08);
    float a = smoothstep(1.0, 0.2, r) * smoothstep(0.25, 0.75, n) * vF.x;
    if (a < 0.003) discard;
    vec3 v = normalize(cameraPosition - vP);
    // Window light scatters forward through the steam.
    vec3 L = uLamp - vP;
    float d2 = dot(L, L);

  // A hold on the shack shakes the basket.
  if (hit) press.timer = setTimeout(() => { if (press && !press.drag) { press.hold = true; act.shake(); } }, 260);
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  if (!press.drag && !press.hold && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { press.drag = true; stage.classList.add('held'); }
  if (!press.drag || pinch) return;
  // Drag swings the lens round the shack, a little each way.
  if (reduced()) return;
  const s = 1.2 / Math.max(size.w, size.h);
  // A small swing only: the set is built for this frame.
  look.ty = Math.max(-0.1, Math.min(0.1, press.yaw - (e.clientX - press.x) * s * 0.4));
  look.tp = Math.max(-0.03, Math.min(0.05, press.pitch + (e.clientY - press.y) * s * 0.2));
  wake();
});
const end = e => {
  if (!press || e.pointerId !== press.id) return;
  clearTimeout(press.timer);
  press = null;
  stage.classList.remove('held');
  wake();
};
stage.addEventListener('pointerup', e => {
  if (press && e.pointerId === press.id && press.hit && !press.drag && !press.hold) act.drop();
  end(e);
});
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);

/* ---------- sound ---------- */
// Sound is muted by default and starts on a gesture.
// The kit sleeps when the toy settles.
// Beds: neon hum, fryer, road, rain, wind and the party.
// Each vehicle carries its own engine voice.
const kit = audioKit({ keys: new Set(['f', 'F', 's', 'S', 'c', 'C', ' ']) });
let SND = null;
const sndVoices = new Set();
let sndPend = 0;
const jit = (x, k) => x * (1 + (Math.random() - 0.5) * 2 * k);
const sndPending = () => (kit.ac ? kit.ac.currentTime < sndPend : false);
function sndTrack(node, end) { sndVoices.add(node); sndPend = Math.max(sndPend, end); node.onended = () => sndVoices.delete(node); }
function impulse(ac, sec, decay) {
  const n = Math.round(ac.sampleRate * sec), b = ac.createBuffer(2, n, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
  return b;
}
function noiseLoop(ac, rate) {
  const n = ac.createBufferSource();
  n.buffer = kit.noise; n.loop = true; n.playbackRate.value = rate;
  n.start(0, Math.random());
  return n;
}
const sndProj = new THREE.Vector3();
// A voice's pan from its place on screen.
function panAt(x, y, z) {
  sndProj.set(x, y, z).project(camera);
  return Math.max(-0.95, Math.min(0.95, sndProj.x * 0.85));
}
function graph() {
  const ac = kit.live();
  if (!ac) return null;
  if (SND?.ac === ac) return SND;
  const bus = ac.createGain();
  bus.connect(kit.out);
  // A short village-square reverb: walls close by, open sky above.
  const verb = ac.createConvolver();
  verb.buffer = impulse(ac, 2.2, 3);
  const verbG = ac.createGain(); verbG.gain.value = 0.35;
  verb.connect(verbG).connect(bus);
  const bed = (rate, type, f, q, pan = 0) => {
    const g = ac.createGain(); g.gain.value = 0;
    const flt = ac.createBiquadFilter(); flt.type = type; flt.frequency.value = f; flt.Q.value = q;
    const pn = ac.createStereoPanner(); pn.pan.value = pan;
    noiseLoop(ac, rate).connect(flt).connect(g).connect(pn).connect(bus);
    return { g, flt };
  };
  // Mains at 50 Hz makes the transformer hum at 100 Hz.
  const humG = ac.createGain(); humG.gain.value = 0;
  const humF = ac.createBiquadFilter(); humF.type = 'lowpass'; humF.frequency.value = 700;
  const humP = ac.createStereoPanner(); humP.pan.value = panAt(0, 2.7, 1.3);
  for (const [f, a] of [[100, 1], [300, 0.35], [500, 0.15]]) {
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = 'sine'; o.frequency.value = f; og.gain.value = a;
    o.connect(og).connect(humF); o.start();
  }
  humF.connect(humG).connect(humP).connect(bus);
  const fry = bed(1, 'bandpass', 3800, 0.7, panAt(-1, 1.2, 0.3));
  const road = bed(0.25, 'lowpass', 140, 0.7);
  const rainB = bed(1, 'bandpass', 4200, 0.35);
  const windB = bed(0.3, 'lowpass', 260, 0.8);
  // The party, muffled by the hall wall: a murmur of voices.
  const crowd = bed(0.6, 'bandpass', 520, 1.2, panAt(HALL.x1 - 5, 2, HALL.z));
  SND = { ac, bus, verb, humG, fry, road, rainB, windB, crowd, nextBeat: ac.currentTime + 0.1, engines: new Map(), crackAcc: 0 };
  return SND;
}
// A distant kick drum from the parish hall, low-passed by the brick.
function partyKick(g, t) {
  const ac = g.ac, o = ac.createOscillator(), e = ac.createGain(), lp = ac.createBiquadFilter(), pn = ac.createStereoPanner();
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
  e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(0.09, t + 0.005); e.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  lp.type = 'lowpass'; lp.frequency.value = 180;
  pn.pan.value = panAt(HALL.x0 + 7, 2, HALL.z);
  o.connect(lp).connect(e).connect(pn).connect(g.bus);
  o.start(t); o.stop(t + 0.32);
  sndTrack(o, t + 0.32);
}
// One fat bubble bursting in the oil: a tick through a narrow band.
function crackle(g, t, x, level) {
  const ac = g.ac, n = ac.createBufferSource(), bp = ac.createBiquadFilter(), e = ac.createGain(), pn = ac.createStereoPanner();
  n.buffer = kit.noise; n.playbackRate.value = jit(1, 0.3);
  bp.type = 'bandpass'; bp.frequency.value = jit(2600, 0.5); bp.Q.value = 2.5;
  e.gain.setValueAtTime(jit(0.12, 0.6) * level, t); e.gain.exponentialRampToValueAtTime(0.0001, t + jit(0.02, 0.5));
  pn.pan.value = panAt(x, 1.2, WELL_Z);
  n.connect(bp).connect(e).connect(pn).connect(g.bus);
  n.start(t, Math.random() * 0.8); n.stop(t + 0.05);
  sndTrack(n, t + 0.05);
}
// A rain drop on the cobbles.
function drip(g, t) {
  const ac = g.ac, o = ac.createOscillator(), e = ac.createGain(), pn = ac.createStereoPanner();
  const f = 1500 * Math.pow(2.4, Math.random());
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.8, t + 0.04);
  e.gain.setValueAtTime(0.0001, t); e.gain.linearRampToValueAtTime(jit(0.012, 0.5), t + 0.002); e.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  pn.pan.value = (Math.random() - 0.5) * 1.6;
  o.connect(e).connect(pn).connect(g.bus);
  o.start(t); o.stop(t + 0.06);
  sndTrack(o, t + 0.06);
}
// A car hums low, a motorbike growls, a brommer buzzes.
function engineFor(g, f) {
  const ac = g.ac, o = ac.createOscillator(), o2 = ac.createOscillator(), lp = ac.createBiquadFilter(), e = ac.createGain(), pn = ac.createStereoPanner();
  const tyre = ac.createBufferSource(), tf = ac.createBiquadFilter(), tg = ac.createGain();
  const car = f.kind === 8, bike = f.kind === 1;
  o.type = 'sawtooth'; o2.type = 'square';
  const base = car ? 42 : f.scale ? 118 : 70;
  o.frequency.value = base; o2.frequency.value = base * 1.5;
  lp.type = 'lowpass'; lp.frequency.value = car ? 260 : 900;
  e.gain.value = 0;
  const o2g = ac.createGain(); o2g.gain.value = bike ? 0 : 0.25;
  tyre.buffer = kit.noise; tyre.loop = true; tf.type = 'bandpass'; tf.frequency.value = bike ? 1800 : 900; tf.Q.value = 0.6; tg.gain.value = bike ? 0.5 : 0.35;
  o.connect(lp); o2.connect(o2g).connect(lp);
  tyre.connect(tf).connect(tg).connect(e);
  if (!bike) lp.connect(e);
  e.connect(pn).connect(g.bus);
  o.start(); o2.start(); tyre.start(0, Math.random());
  return { o, o2, e, pn, tyre, base, px: f.x, bike };
}
function soundTick(dt) {
  const g = graph();
  if (!g) return;
  const ac = g.ac, t = ac.currentTime;
  // Hum: steady, with a buzz when the wall sign sputters.
  g.humG.gain.setTargetAtTime(sputter > 0 ? 0.03 : 0.012, t, 0.02);
  // The fryer: simmer always, a roar of sizzle with the boil.
  const boil = wells.reduce((a, w) => a + Math.max(0, w.boil - SIMMER), 0);
  g.fry.g.gain.setTargetAtTime(0.012 + 0.16 * Math.min(1.4, boil), t, 0.08);
  g.fry.flt.frequency.setTargetAtTime(3000 + 2200 * Math.min(1, boil), t, 0.1);
  g.crackAcc += dt * (4 + 60 * Math.min(1.5, boil));
  while (g.crackAcc >= 1) { g.crackAcc -= 1; const w = wells[Math.floor(Math.random() * 2)]; crackle(g, t + Math.random() * dt, w.x, 0.4 + boil); }
  g.road.g.gain.setTargetAtTime(0.03, t, 1);
  g.rainB.g.gain.setTargetAtTime(0.14 * wx.rain, t, 0.5);
  g.windB.g.gain.setTargetAtTime(0.02 + 0.07 * wind * gust, t, 0.5);
  g.crowd.g.gain.setTargetAtTime(0.012, t, 1);
  for (let n = wx.rain * 30 * dt; n > 0; n--) if (Math.random() < n) drip(g, t + Math.random() * dt);
  // The party's beat, scheduled a little ahead on the audio clock.
  while (g.nextBeat < t + 0.2) { if (g.nextBeat > t) partyKick(g, g.nextBeat); g.nextBeat += 1 / HALL.beat; }
  // Each engine follows its vehicle: level, pan, pitch and Doppler.
  const live = new Set();
  for (const f of people) {
    if (!(f.kind === 8 || f.kind === 6 || (f.kind === 1 && f.speed > 3))) continue;
    live.add(f);
    let v = g.engines.get(f);
    if (!v) { v = engineFor(g, f); g.engines.set(f, v); }
    const d = Math.hypot(f.x - camera.position.x, f.z - camera.position.z);
    const vx = dt > 0 ? (f.x - v.px) / dt : 0;
    v.px = f.x;
    // Approaching sounds higher, leaving lower: 343 m/s.
    const toward = -vx * Math.sign(f.x - camera.position.x || 1);
    const dop = 343 / Math.max(200, 343 - toward);
    const rev = 0.7 + 0.5 * Math.min(1, f.speed / (SPEED[f.kind] || 8));
    v.o.frequency.setTargetAtTime(v.base * rev * dop, t, 0.05);
    v.o2.frequency.setTargetAtTime(v.base * 1.5 * rev * dop, t, 0.05);
    v.e.gain.setTargetAtTime((v.bike ? 0.05 : 0.14) / (1 + d * 0.12), t, 0.05);
    v.pn.pan.setTargetAtTime(panAt(f.x, 0.8, f.z), t, 0.05);
  }
  for (const [f, v] of g.engines) {
    if (live.has(f)) continue;
    v.e.gain.setTargetAtTime(0, t, 0.1);
    v.o.stop(t + 0.5); v.o2.stop(t + 0.5); v.tyre.stop(t + 0.5);
    g.engines.delete(f);
  }
}
// A drop: wet fries hit the oil with a crash of sizzle.
function sfxDrop(x) {
  const g = graph();
  if (!g) return;
  const ac = g.ac, t = ac.currentTime + 0.005, n = ac.createBufferSource(), hp = ac.createBiquadFilter(), e = ac.createGain(), pn = ac.createStereoPanner();
  n.buffer = kit.noise; hp.type = 'highpass'; hp.frequency.value = jit(1800, 0.2);
  e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(0.5, t + 0.02); e.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
  pn.pan.value = panAt(x, 1.2, WELL_Z);
  n.connect(hp).connect(e).connect(pn).connect(g.bus);
  e.connect(g.verb);
  n.start(t, Math.random() * 0.5); n.stop(t + 1.2);
  sndTrack(n, t + 1.2);
}
// The wire basket rattles against the rim, never twice the same.
function sfxShake(x) {
  const g = graph();
  if (!g) return;
  const ac = g.ac;
  for (let i = 0; i < 9; i++) {
    const t = ac.currentTime + 0.01 + i * jit(0.07, 0.35), o = ac.createOscillator(), e = ac.createGain(), pn = ac.createStereoPanner();
    o.type = 'triangle'; o.frequency.value = jit(2300, 0.25);
    e.gain.setValueAtTime(jit(0.05, 0.5), t); e.gain.exponentialRampToValueAtTime(0.0001, t + jit(0.06, 0.4));
    pn.pan.value = panAt(x, 1.3, WELL_Z);
    o.connect(e).connect(pn).connect(g.bus);
    o.start(t); o.stop(t + 0.08);
    sndTrack(o, t + 0.08);
    crackle(g, t, x, 1.2);
  }
}
// The cone: a paper rustle, then the soft slap of sauce.
function sfxCone() {
  const g = graph();
  if (!g) return;
  const ac = g.ac, t = ac.currentTime + 0.01;
  const n = ac.createBufferSource(), bp = ac.createBiquadFilter(), e = ac.createGain(), pn = ac.createStereoPanner();
  n.buffer = kit.noise; bp.type = 'bandpass'; bp.frequency.value = 1600; bp.Q.value = 0.8;
  e.gain.setValueAtTime(0.0001, t); e.gain.linearRampToValueAtTime(0.06, t + 0.05); e.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  pn.pan.value = panAt(CONE_AT.x, CONE_AT.y, CONE_AT.z);
  n.connect(bp).connect(e).connect(pn).connect(g.bus);
  n.start(t, Math.random()); n.stop(t + 0.45);
  sndTrack(n, t + 0.45);
  const o = ac.createOscillator(), oe = ac.createGain(), ts = t + 0.75;
  o.frequency.setValueAtTime(180, ts); o.frequency.exponentialRampToValueAtTime(70, ts + 0.08);
  oe.gain.setValueAtTime(0.0001, ts); oe.gain.exponentialRampToValueAtTime(0.08, ts + 0.005); oe.gain.exponentialRampToValueAtTime(0.0001, ts + 0.12);
  o.connect(oe).connect(pn);
  o.start(ts); o.stop(ts + 0.14);
  sndTrack(o, ts + 0.14);
}
// Each kick of the dud moped gives one engine cough.
function sfxCough(x, z) {
  const g = graph();
  if (!g) return;
  const ac = g.ac, t = ac.currentTime + 0.01, o = ac.createOscillator(), e = ac.createGain(), lp = ac.createBiquadFilter(), pn = ac.createStereoPanner();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(jit(90, 0.2), t); o.frequency.exponentialRampToValueAtTime(40, t + 0.25);
  lp.type = 'lowpass'; lp.frequency.value = 500;
  e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(0.07, t + 0.02); e.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  pn.pan.value = panAt(x, 0.5, z);
  o.connect(lp).connect(e).connect(pn).connect(g.bus);
  o.start(t); o.stop(t + 0.32);
  sndTrack(o, t + 0.32);
}
// A hidden stage cuts every engine and scheduled sound.
function sndHush() {
  for (const n of sndVoices) { try { n.stop(); } catch (err) { /* already stopped */ } }
  sndVoices.clear();
  if (SND) { for (const [, v] of SND.engines) { try { v.o.stop(); v.o2.stop(); v.tyre.stop(); } catch (err) { /* stopped */ } } SND.engines.clear(); }
  kit.rest();
}

/* ---------- bar ---------- */
// Drop needs a free basket: empty, or holding blanched fries.
// Fill needs golden fries on the hook.
function syncActions() {
  ui.action('drop').disabled = !wells.some(w => !w.inOil && (w.fry === -1 || w.fry === 1));
  ui.action('fill').disabled = !wells.some(w => !w.inOil && w.fry === 2);
}
act.drop = () => {
  const w = wells.find(o => !o.inOil && o.fry === 1) ?? wells.find(o => !o.inOil && o.fry === -1);
  if (!w) { flare = Math.max(flare, 0.2); wake(); return; }
  if (w.fry === -1) w.fry = 0;
  w.stage = w.fry;
  w.inOil = true;
  w.t = 0;
  w.vy = -1.5;
  w.friesMat.uniforms.uAlb.value.set(...FRIES_COL[w.stage]);
  spit(w, reduced() ? 8 : 26);
  sfxDrop(w.x);
  // Wet fries flash a burst of steam.
  emitWell(w, reduced() ? 8 : 22, { speed: 0.8 });
  flare = 1;
  syncActions();
  wake();
};
act.shake = () => {
  lastShake = performance.now();
  // In the oil: lift a little, shake, drop back; the boil kicks up again.
  const w = wells.filter(o => o.inOil).sort((a, b) => a.t - b.t)[0] ?? wells.find(o => o.fry >= 0);
  if (!w) { flare = Math.max(flare, 0.2); wake(); return; }
  w.shake = 1;
  sfxShake(w.x);
  if (w.inOil) { w.dip = 0.35; spit(w, reduced() ? 4 : 12); }
  // The shake throws a cloud toward the window.
  emitWell(w, reduced() ? 12 : (w.inOil ? 46 : 18), { speed: 0.7, size: 0.16, life: 7.5, out: w.inOil ? 0.5 : 0.25 });
  wake();
};
act.fill = () => {
  const w = wells.find(o => !o.inOil && o.fry === 2);
  if (!w) return;
  w.fry = -1;
  w.shake = 0.5;
  emitWell(w, 6, { speed: 0.4, size: 0.1 });
  fillCone(ui.choice?.value ?? 'mayo');
  sfxCone();
  syncActions();
  wake();
};
act.sauce = v => { setDollop(v); wake(); };
// The neon dollop takes the colour of the sauce picked.
function setDollop(v) { const sc = SAUCES.find(o => o.value === v) ?? SAUCES[0]; const d = FRY_SIGN.find(o => o.role === 'dollop'); if (d) d.m.uniforms.uCol.value.set(...linFit(...sc.lch)).multiplyScalar(1.2); }
setDollop(ui.choice?.value ?? 'mayo');
act.wind = v => { wind = v; wake(); };
act.neon = v => { setNeon(v); draw(); };
act.tilt = v => { tiltK = v; frame(); draw(); };
act.traffic = on => { traffic = on; wake(); };
// Camcorder: the handheld sway and the tape look of the late nineties.
act.camcorder = on => { camcorder = on; grade.uniforms.uDV.value = on ? 1 : 0; frame(); draw(); };
act.weather = v => { setWeather(v); wake(); draw(); };
setWeather(ui.setting('weather')?.value ?? 'shift');
// Three looks for the people, for Tom to pick from.
const LOOKS = { ink: 0, line: 1, haze: 2 };
act.people = v => { figMat.uniforms.uStyle.value = LOOKS[v] ?? 0; draw(); };

act.people(QS.get('people') ?? ui.setting('people')?.value ?? 'ink');
act.moths = on => { mothsOn = on; mothMesh.visible = on; wake(); };
act.moths(ui.setting('moths')?.value ?? true);
act.reset = () => {
  for (const w of wells) Object.assign(w, { fry: -1, stage: 0, inOil: false, t: 0, boil: SIMMER, foam: SIMMER, y: UP, vy: 0, shake: 0, dip: 0 });
  for (const d of drops) d.live = false;
  coneG.visible = false; coneState.t = -1; coneState.taker = null;
  // The view returns to the opening frame.
  look.ty = look.tp = 0; zoomT = 1;
  wind = 0.3; ui.slider.set(0.3); ui.choice.set('mayo');
  setDollop('mayo');
  syncActions();
  wake();
};
syncActions();
wind = ui.slider?.value ?? 0.3;
tiltK = ui.setting('tilt')?.value ?? 0.6;
setNeon(ui.setting('neon')?.value ?? 'red');
traffic = ui.setting('traffic')?.value ?? true;
act.camcorder(ui.setting('camcorder')?.value ?? true);
setLight();
// The vent plume starts 6 s old, so the first frame is a picture.
for (let i = 0; i < 180; i++) stepSteam(1 / 30);
stepSpatter(0);
poseFryer(0);
paintWins();

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
resize();
Promise.all([renderer.compileAsync(scene, camera), loadSign()]).then(() => {
  draw();
  canvas.classList.add('on');
  markReady();
}, () => { canvas.classList.add('on'); markReady(); });
</script>
