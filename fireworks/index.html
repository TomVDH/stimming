<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.14 0.014 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fireworks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Fireworks: shells over a dark bay at night. */
:root { --stage: oklch(0.1 0.015 265); }
.stage--fireworks canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--fireworks canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--fireworks canvas { transition: none; } }
/* Shell is one stepper pill: an arrow each side of the name. */
.stepper {
  display: inline-flex; align-items: center; color: var(--fg); font-size: 13px;
  border: 1px solid var(--line); border-radius: 999px;
  background-color: oklch(0.15 0.012 275 / 0.84); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
/* The arrows drop their own ring and backing, so the pill matches a chip's height. */
#shell .chip { border: 0; background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
#shell .chip svg { stroke-width: 1.8; stroke-linecap: round; }
/* The longest name sets the width, so the arrows never move. */
.stepper .name { display: grid; text-align: center; white-space: nowrap; }
.stepper .name > * { grid-area: 1 / 1; }
.stepper .sizer { visibility: hidden; }
.stepper output.from-next { animation: name-in 0.22s ease-out; --from: 8px; }
.stepper output.from-prev { animation: name-in 0.22s ease-out; --from: -8px; }
@keyframes name-in { from { opacity: 0; transform: translateX(var(--from)); } }
@media (prefers-reduced-motion: reduce) { .stepper output { animation: none !important; } }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.012 275 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Fireworks</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--fireworks" id="stage" tabindex="0" role="application" aria-label="A dark bay at night. Press the sky to launch a shell.">
      <p class="fail" hidden>Fireworks needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="stepper" id="shell" role="group" aria-label="Shell" tabindex="-1">
        <button class="chip icon" type="button" data-step="-1" aria-label="Previous shell" title="Previous shell"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
        <span class="name"><output aria-live="polite">Mix</output><span class="sizer" aria-hidden="true">Chrysanthemum</span></span>
        <button class="chip icon" type="button" data-step="1" aria-label="Next shell" title="Next shell"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button>
      </div>
      <label class="slider"><span>Distance</span><input type="range" id="dist" min="0" max="1" step="0.01" value="0.5" aria-label="Distance: 300 to 1,500 metres"></label>
      <div class="actions">
        <button class="chip" id="finale" type="button">+ Finale</button>
      </div>
      <div class="edge">
        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings">
            <div class="group"><span>Smoke</span><div class="choices" id="smoke" role="group" aria-label="Smoke">
              <button class="chip" type="button" data-value="thin" aria-pressed="true">Thin</button>
              <button class="chip" type="button" data-value="thick" aria-pressed="false">Thick</button>
            </div></div>
            <div class="group"><span>Water</span><div class="choices" id="water" role="group" aria-label="Water">
              <button class="chip" type="button" data-value="calm" aria-pressed="true">Calm</button>
              <button class="chip" type="button" data-value="ripple" aria-pressed="false">Ripple</button>
            </div></div>
          </div>
        </div>
        <dl class="how" aria-label="How to play">
          <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>launch</dd></div>
          <div><dt>Hold</dt><dd>bigger shell</dd></div>
          <div class="fine"><dt><kbd>Space</kbd></dt><dd>shell</dd></div>
        </dl>
      </div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Fireworks</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createNoise2D } from 'simplex-noise';
import { initPage, choices, whenVisible, pixelRatio, onQuality, qualitySetting, linFit, reduced, onReducedChange, quality } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

initPage({ id: 'fireworks' });
qualitySetting(document.getElementById('sets'));
const stage = document.getElementById('stage');

// Seeded random keeps the bay the same on every load.
let seed = 4242;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 1, 20000);
camera.position.set(0, 12, 0);
// Layer 1 holds what the water mirrors.
const LIGHT = 1;
const SHORE_Z = -1500;
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;

/* ---------- burst lights ---------- */
// Eight burst lights; every lit shader reads this array.
const LN = 8;
const U = {
  uL: { value: Array.from({ length: LN }, () => new THREE.Vector4()) },
  uLC: { value: Array.from({ length: LN }, () => new THREE.Vector3()) },
  uLN: { value: 0 },
  uCool: { value: new THREE.Vector3(0.35, 0.45, 0.62) },
  uHaze: { value: 0.00045 },
  uHazeH: { value: 140 },
  uTime: { value: 0 },
};
const LIGHTS_GLSL = /* glsl */`
uniform vec4 uL[${LN}];
uniform vec3 uLC[${LN}];
uniform int uLN;
// Light that a point gets from every live burst; r sets the reach.
vec3 burstLit(vec3 P, float r) {
  vec3 s = vec3(0.0);
  for (int i = 0; i < ${LN}; i++) {
    if (i >= uLN) break;
    vec3 d = uL[i].xyz - P;
    s += uLC[i] * uL[i].w / (1.0 + dot(d, d) / (r * r));
  }
  return s;
}
// Glow that a view ray collects in the haze round each burst.
vec3 burstGlow(vec3 dir) {
  vec3 s = vec3(0.0);
  float up = max(dir.y, 0.0);
  for (int i = 0; i < ${LN}; i++) {
    if (i >= uLN) break;
    vec3 v = uL[i].xyz - cameraPosition;
    float dist = length(v);
    float c = dot(dir, v / dist) - 1.0;
    // A tight core, a mid halo, and a wide lift of the low haze.
    float g = 0.22 * exp(c * 2500.0) + 0.1 * exp(c * 60.0) + 0.05 * exp(c * 5.0) * exp(-up * 7.0);
    s += uLC[i] * uL[i].w * g * (900.0 / dist);
  }
  return s;
}`;
// Flash in 30 ms, fall with tau 0.35 s, then a glow tail with tau 1.5 s.
const flash = (age, rise = 0.03) => (age < 0 ? 0 : Math.min(1, age / rise) * (0.78 * Math.exp(-age / 0.35) + 0.22 * Math.exp(-age / 1.5)));
/* ---------- end burst lights ---------- */

/* ---------- K2: noise ---------- */
// Lifted from Night viaduct, Port.
const K2_NOISE = /* glsl */`
float k2hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float k2noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(k2hash(i), k2hash(i + vec2(1, 0)), u.x), mix(k2hash(i + vec2(0, 1)), k2hash(i + vec2(1, 1)), u.x), u.y);
}
float k2fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * k2noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s;
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: sky ---------- */
// Clear night sky: dark zenith, a cool low band, few faint stars.
// Port's cloud ceiling and amber dome are cut here.
const K2_SKY = /* glsl */`
uniform vec3 uCool;
float k2stars(vec3 dir) {
  vec2 q = vec2(atan(dir.x, -dir.z) * 260.0, dir.y * 260.0);
  vec2 i = floor(q), f = fract(q) - 0.5;
  float h = k2hash(i);
  // About one cell in two hundred holds a star.
  float on = step(0.995, h);
  vec2 o = vec2(k2hash(i + 7.1), k2hash(i + 3.3)) - 0.5;
  return on * exp(-dot(f - o * 0.6, f - o * 0.6) * 60.0) * (0.02 + 0.05 * k2hash(i + 1.7));
}
vec3 k2sky(vec3 dir) {
  float up = max(dir.y, 0.0);
  vec3 col = vec3(0.0016, 0.0021, 0.0045) + uCool * 0.016 * exp(-up * 9.0);
  col += vec3(0.85, 0.9, 1.0) * k2stars(dir) * smoothstep(0.03, 0.25, dir.y);
  return col + burstGlow(dir);
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: haze ---------- */
// Height haze along the view ray; burst light lifts its colour.
// Port's fog bank round the port is cut here.
const K2_HAZE = /* glsl */`
uniform float uHaze;
uniform float uHazeH;
float k2hazeAmount(vec3 P) {
  vec3 v = P - cameraPosition;
  float dist = length(v);
  float k = 1.0 / uHazeH;
  float h0 = max(cameraPosition.y, 0.0), h1 = max(P.y, 0.0), dh = h1 - h0;
  // Exponential height fog integrated along the ray.
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);
  return 1.0 - exp(-dist * uHaze * max(avg, 0.0));
}
vec3 k2hazeColor(vec3 dir) { return uCool * 0.01 + burstGlow(dir) * 0.8; }
vec3 k2haze(vec3 c, vec3 P) {
  return mix(c, k2hazeColor(normalize(P - cameraPosition)), k2hazeAmount(P));
}`;
/* ---------- end K2 ---------- */
const HEAD = `${LIGHTS_GLSL}\n${K2_NOISE}\n${K2_SKY}\n${K2_HAZE}`;

/* ---------- sky dome ---------- */
const sky = new THREE.Mesh(new THREE.SphereGeometry(15000, 32, 16), new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false,
  vertexShader: /* glsl */`varying vec3 vP; void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`varying vec3 vP; ${HEAD} void main() { gl_FragColor = vec4(k2sky(normalize(vP - cameraPosition)), 1.0); }`,
}));
sky.renderOrder = -1;
scene.add(sky);

/* ---------- land: beach, hills and the far range ---------- */
// A height field behind a wandering waterline; normals give the relief.
const noise = createNoise2D(rnd);
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const shoreZ = x => SHORE_Z + 120 * noise(x * 0.0004, 7.7);
// Height at x, b metres inland from the waterline.
function landH(x, b) {
  if (b < 0) return -2 + b * 0.05;
  const beach = 1.2 + 1.5 * smooth(0, 90, b);
  // Three ridged octaves cut spurs and gullies into the range.
  const r1 = 1 - Math.abs(noise(x * 0.00035, b * 0.0006 + 3.3));
  const r2 = 1 - Math.abs(noise(x * 0.0013, b * 0.0019 + 7.1));
  const r3 = 1 - Math.abs(noise(x * 0.0042, b * 0.0052 + 1.9));
  const m = 45 + 170 * r1 * r1 * (0.6 + 0.4 * noise(x * 0.0001, 1.7)) + 60 * r2 * r2 * r1 + 18 * r3 * r2 + 5 * noise(x * 0.012, b * 0.014);
  return beach + smooth(70, 650, b) * Math.max(0, m);
}
// A point on the land: x across, b inland, lifted by y.
const landAt = (x, b, y = 0) => new THREE.Vector3(x, landH(x, b) + y, shoreZ(x) - b);
function landGeometry() {
  const NX = 760, NB = 96, pos = [], bb = [], idx = [];
  for (let j = 0; j <= NB; j++) {
    // Rows bunch up near the shore, where the beach sits.
    const b = -30 + 1630 * Math.pow(j / NB, 1.6);
    for (let i = 0; i <= NX; i++) {
      const x = -9000 + 18000 * (i / NX);
      pos.push(x, landH(x, b), shoreZ(x) - b);
      bb.push(b);
    }
  }
  for (let j = 0; j < NB; j++) for (let i = 0; i < NX; i++) {
    const a = j * (NX + 1) + i, c = a + NX + 1;
    idx.push(a, a + 1, c, a + 1, c + 1, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aB', new THREE.Float32BufferAttribute(bb, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ---------- festival: campfires and light dots on the beach ---------- */
const FN = 16;
const FIRE = linFit(0.74, 0.17, 52);
const fires = [];
for (const [cx, n] of [[-700, 4], [-330, 2], [90, 3], [520, 4], [880, 2], [-1050, 1]]) {
  for (let i = 0; i < n && fires.length < FN; i++) fires.push(landAt(cx + (rnd() - 0.5) * 140, 18 + rnd() * 50, 1));
}
// Fire flicker, shared by the flames and the light they cast.
const FIRE_GLSL = /* glsl */`
uniform vec4 uF[${FN}];
uniform float uTime;
uniform vec3 uFireCol;
uniform float uPace;
float fireFlick(float seed) {
  float t = uTime;
  float f = sin(t * 7.3 + seed * 11.0) * 0.5 + sin(t * 13.1 + seed * 5.0) * 0.3 + sin(t * 23.7 + seed * 3.0) * 0.2;
  return 0.8 + 0.2 * f * uPace;
}
// Light from every campfire onto a surface with normal N.
vec3 fireLit(vec3 P, vec3 N) {
  vec3 s = vec3(0.0);
  for (int i = 0; i < ${FN}; i++) {
    vec3 L = uF[i].xyz + vec3(0.0, 1.5, 0.0) - P;
    float d2 = dot(L, L);
    s += vec3(max(dot(N, L * inversesqrt(d2)), 0.0) * fireFlick(uF[i].w) / (1.0 + d2 / 500.0));
  }
  return s * uFireCol;
}`;
const FU = {
  uF: { value: fires.map((f, i) => new THREE.Vector4(f.x, f.y, f.z, i * 1.37)) },
  uFireCol: { value: new THREE.Vector3(...FIRE) },
  uPace: { value: 1 },
};

// The land's height on a regular grid; shaders march it for shadows.
const HB = { x0: -4500, z0: -3400, w: 9000, d: 2000, nx: 768, nz: 192 };
function heightTexture() {
  const data = new Uint16Array(HB.nx * HB.nz);
  for (let j = 0; j < HB.nz; j++) for (let i = 0; i < HB.nx; i++) {
    const x = HB.x0 + HB.w * (i / (HB.nx - 1)), z = HB.z0 + HB.d * (j / (HB.nz - 1));
    data[j * HB.nx + i] = THREE.DataUtils.toHalfFloat(landH(x, shoreZ(x) - z));
  }
  const t = new THREE.DataTexture(data, HB.nx, HB.nz, THREE.RedFormat, THREE.HalfFloatType);
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
}
// One uniform set serves the full land and its cheap mirror copy.
const LU = { ...U, ...FU, tHeight: { value: heightTexture() }, uHB: { value: new THREE.Vector4(HB.x0, HB.z0, 1 / HB.w, 1 / HB.d) } };
const landMat = mirror => new THREE.ShaderMaterial({
  uniforms: LU, defines: mirror ? { MIRROR: 1 } : {},
  vertexShader: /* glsl */`attribute float aB; varying vec3 vP; varying vec3 vN; varying float vB;
  void main() { vB = aB; vN = normal; vP = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`varying vec3 vP; varying vec3 vN; varying float vB; ${HEAD} ${FIRE_GLSL}
  uniform sampler2D tHeight;
  uniform vec4 uHB;
  float landY(vec2 xz) {
    vec2 uv = (xz - uHB.xy) * uHB.zw;
    return (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) ? -10.0 : texture2D(tHeight, uv).r;
  }
  // Soft shadow: march toward the light and test the height field.
  float shade(vec3 P, vec3 Lp) {
    vec3 d = Lp - P;
    float len = length(d), s = 1.0;
    for (int k = 1; k <= 10; k++) {
      float t = float(k) / 10.0;
      t = t * t * 0.5;
      vec3 q = P + d * t;
      s = min(s, clamp((q.y - landY(q.xz)) / (t * len * 0.025 + 1.0), 0.0, 1.0));
    }
    return s;
  }
  void main() {
    vec3 N = normalize(vN), V = normalize(cameraPosition - vP);
    // Pale sand on the beach; dark scrub, then darker rock on steep slopes.
    float sand = 1.0 - smoothstep(40.0, 140.0, vB);
    vec3 alb = mix(vec3(0.07, 0.066, 0.06), vec3(0.24, 0.21, 0.17), sand);
    alb *= 1.0 - 0.55 * smoothstep(0.2, 0.6, 1.0 - N.y);
    // Each burst lights the slopes that face it; the rest stay dark.
    vec3 lit = vec3(0.0);
    for (int i = 0; i < ${LN}; i++) {
      if (i >= uLN) break;
      vec3 L = uL[i].xyz - vP;
      float d2 = dot(L, L);
      L *= inversesqrt(d2);
      float ndl = max(dot(N, L), 0.0);
      // Slopes that graze the light catch a bright rim.
      float rim = pow(1.0 - max(dot(N, V), 0.0), 2.0) * smoothstep(0.0, 0.4, ndl);
      // The two brightest lights cast shadows over the ridges.
      float sh = 1.0;
      #ifndef MIRROR
      if (i < 2 && ndl > 0.0 && uL[i].w > 0.05) sh = shade(vP + N * 2.0, uL[i].xyz);
      #endif
      lit += uLC[i] * uL[i].w * (ndl + 0.8 * rim) * sh / (1.0 + d2 / 1.4e6);
    }
    // Faint sky light from above keeps the shapes readable.
    vec3 amb = uCool * 0.006 * (0.3 + 0.7 * N.y);
    // Campfires reach only the beach; the mirror skips them.
    vec3 fl = vec3(0.0);
    #ifndef MIRROR
    if (vB < 300.0) fl = fireLit(vP, N) * 1.2;
    #endif
    vec3 c = alb * (amb + lit * 1.7 + fl);
    gl_FragColor = vec4(k2haze(c, vP), 1.0);
  }`,
});
// The main camera sees the full land; the mirror sees the cheap copy.
const land = new THREE.Mesh(landGeometry(), landMat(false));
const landMirror = new THREE.Mesh(land.geometry, landMat(true));
landMirror.layers.set(LIGHT);
scene.add(land, landMirror);

// Light dots: string lights, lanterns, torches and a few homes up the hill.
const dots = { pos: [], col: [], k: [] };
const WARM = linFit(0.86, 0.09, 75), AMBER = linFit(0.78, 0.15, 60), COOLW = linFit(0.9, 0.04, 240);

  }
  if (press?.seed) live.push({ pos: press.seed, col: SEED, I: 0.02 + 0.1 * press.charge });
  live.sort((a, b) => b.I - a.I);
  const n = Math.min(LN, live.length);
  for (let i = 0; i < n; i++) {
    const L = live[i];
    U.uL.value[i].set(L.pos.x, L.pos.y, L.pos.z, L.I);
    U.uLC.value[i].set(L.col[0], L.col[1], L.col[2]);
  }
  U.uLN.value = n;
}

/* ---------- launch ---------- */
const saved = k => { try { return localStorage.getItem(`stimming.fireworks.${k}`); } catch { return null; } };
const save = (k, val) => { try { localStorage.setItem(`stimming.fireworks.${k}`, String(val)); } catch { /* storage is optional */ } };
const opts = { shell: SHELL_LIST.some(([id]) => id === saved('shell')) ? saved('shell') : 'mix', dist: saved('dist') != null ? +saved('dist') : 0.5, smoke: saved('smoke') === 'thick' ? 'thick' : 'thin' };
let simT = 0, horizonNdc = -0.28;
// The slider maps 0 to 1 onto 300 to 1,500 m; far shells are larger.
const shellDist = () => 300 + 1200 * opts.dist;
const shellScale = () => 0.6 + 0.6 * opts.dist;
const ray = new THREE.Raycaster(), ndcV = new THREE.Vector2();
// Map a screen point onto the altitude band that keeps the burst in view.
function burstPoint(ndc, cal, out = new THREE.Vector3()) {
  const d = shellDist(), R = 50 * cal * shellScale();
  const at = y => {
    ray.setFromCamera(ndcV.set(ndc.x, y), camera);
    const t = (-d - camera.position.z) / ray.ray.direction.z;
    return ray.ray.origin.clone().addScaledVector(ray.ray.direction, t);
  };
  const top = at(0.92).y, lo = Math.max(R * 0.9, 50), hi = Math.max(lo, top - R * 1.1);
  const u = THREE.MathUtils.clamp((ndc.y - horizonNdc) / (0.92 - horizonNdc), 0, 1);
  const pt = at(Math.max(ndc.y, horizonNdc + 0.02));
  return out.set(pt.x, lo + (hi - lo) * u, -d);
}
// Comet styles; dark comets climb unseen and carry bigger shells.
const COMETS = ['gold', 'gold', 'glitter', 'colour', 'dark', 'spin', 'crackle'];
// A comet climbs from the water and the shell bursts at its apex.
function fire(pos, t0, type, cal, style = pick(COMETS)) {
  // Strong drag: the comet leaves fast and slows near the apex, about 3 s up.
  const s = shellScale(), k = 1.2;
  if (style === 'dark') cal *= 1.3;
  const { v0, T } = climb(pos.y - 1, k);
  // The mortar leans up to about 9 degrees; drag eases the drift too.
  const dx = (rnd() - 0.5) * 0.3 * pos.y, vx = (dx * k) / (1 - Math.exp(-k * T));
  const base = new THREE.Vector3(pos.x - dx, 1, pos.z), up = new THREE.Vector3(vx, v0, 0);
  const col = pick(COLOURS);
  // The tail is a stream of embers shed along the climb, not one rigid streak.
  // Each ember cools white, then to its colour, then to red, and fades.
  const pv = new THREE.Vector3();
  const embers = (n, ramp, kind, gain, life, size) => {
    for (let i = 0; i < n; i++) {
      // Most embers come early, where the comet runs fastest.
      const ts = T * Math.pow((i + rnd()) / n, 1.4);
      posAt(base, up, k, ts, p);
      velAt(up, k, ts, pv);
      q.copy(pv).multiplyScalar(0.06).add(v.set((rnd() - 0.5) * 4, -1 - rnd() * 3, (rnd() - 0.5) * 4));
      writeStar(p, t0 + ts, q, 2.0, ramp, life * (0.6 + rnd() * 0.8), 0.14, size * (0.6 + rnd() * 0.6), kind, gain);
    }
  };
  // The head: short, bright, and it dims as the comet slows at the top.
  const head = (ramp, kind, gain, size) => writeStar(base, t0, up, k, ramp, T, 0.07, size, kind, gain);
  if (style === 'gold') { head(GOLD, COMET, 1.3, 2.0); embers(130, GOLD, 0, 0.35, 0.9, 1.3); }
  if (style === 'glitter') { head(WHITE, COMET, 1.1, 1.8); embers(140, WHITE, GLITTER, 0.5, 1.0, 1.1); }
  if (style === 'colour') { head(col, COMET, 1.4, 2.2); embers(110, col, 0, 0.4, 0.6, 1.4); }
  if (style === 'dark') { head(ORANGE, COMET, 0.12, 1.0); embers(20, ORANGE, 0, 0.08, 0.4, 1.0); }
  if (style === 'spin') { const c = pick([WHITE, GOLD, AQUA]); head(c, FISH, 1.2, 2.0); embers(90, c, 0, 0.35, 0.6, 1.2); }
  if (style === 'crackle') {
    head(GOLD, COMET, 1.1, 1.8);
    embers(80, GOLD, 0, 0.3, 0.6, 1.2);
    embers(40, WHITE, 0, 1.2, 0.09, 2.0);
  }
  smokeTrail(base, up, k, t0, T);
  const [ramp, gain] = SHELLS[type](pos, t0 + T, cal, s);
  // A dark comet ends in a huge flash.
  addLight(pos, ramp, t0 + T, gain * lightK(cal) * (style === 'dark' ? 1.7 : 1));
  smokeBurst(pos, t0 + T, cal, s);
}
function launch(ndc, cal) {
  const type = opts.shell === 'mix' ? pick(MIX) : opts.shell;
  if (type === 'barrage') {
    // Sixteen small shells fan out across the sky, 0.11 s apart.
    for (let i = 0; i < 16; i++) {
      const at = new THREE.Vector2(ndc.x + (i / 15 - 0.5) * 0.9, ndc.y - 0.12 + rnd() * 0.24);
      fire(burstPoint(at, 0.7), simT + i * 0.11, pick(['peony', 'ring', 'strobe', 'crackle', 'pistil']), 0.7 * cal, pick(['gold', 'colour', 'glitter']));
    }
  } else fire(burstPoint(ndc, cal), simT, type, cal);
  commitStars();
  commitSmoke();
  wake();
}
function orbList() {
  const list = live.slice(0, 3).map(L => ({ pos: L.pos, size: 1.4, color: L.col, k: L.I * 0.12 }));
  for (const f of fires.slice(0, 6)) list.push({ pos: f, size: 0.1, color: FIRE, k: 0.006 });
  return list;
}

/* ---------- frame and draw ---------- */
let size = { w: 1, h: 1, dpr: 1 };
// The horizon sits low; portrait widens the lens to keep the sky tall.
function frame() {
  const portrait = size.w < size.h;
  camera.fov = portrait ? 56 : 36;
  camera.aspect = size.w / size.h;
  const hf = portrait ? 0.72 : 0.64;
  horizonNdc = 1 - 2 * hf;
  camera.rotation.set(Math.atan((2 * hf - 1) * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))), 0, 0);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
}
function resize() {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  // Rung 1 of the ladder drops the pixel ratio; rung 2 shrinks the mirror.
  size = { w, h, dpr: pixelRatio(w, h, { maxDpr: 1.5, budget: 1.6e6, low: rung >= 1 }) };
  renderer.setPixelRatio(size.dpr);
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  // The mirror runs at full size on High, 0.6 on Standard.
  const m = rung >= 2 ? 0.4 : quality() === 'high' ? 1 : 0.6;
  mirrorRT.setSize(Math.max(1, Math.round(w * size.dpr * m)), Math.max(1, Math.round(h * size.dpr * m)));
  grade.uniforms.uRes.value.set(w * size.dpr, h * size.dpr);
  starMat.uniforms.uRes.value.set(w * size.dpr, h * size.dpr);
  starMat.uniforms.uDpr.value = size.dpr;
  dotMat.uniforms.uDpr.value = size.dpr;
  frame();
  draw();
}
// A page that loads hidden may get no visibility event before input.
let visible = !document.hidden;
function draw() {
  if (!visible) return;
  renderMirror();
  placeOrbs(orbPass, orbList());
  composer.render();
}

/* Frame loop: full rate in a show, 30 fps while fires flicker, then sleep. */
// QA can shorten the sleep with ?sleep=<ms>.
const SLEEP = +new URLSearchParams(location.search).get('sleep') || 60000;
let raf = 0, lastT = 0, lastDraw = 0, lastInput = performance.now(), pace = reduced() ? 0 : 1;
const busy = () => !!press || simT < lastDeath || simT < smokeEnd || lights.length > 0;
function tick(now) {
  raf = 0;
  if (!visible || document.hidden) { lastT = 0; return; }
  // Closed-form stars allow long steps; slow frames do not slow the show.
  const dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0;
  lastT = now;
  // Ambient flicker eases out over 2 s once idle, and stays off in reduced motion.
  const awake = !reduced() && now - lastInput < SLEEP;
  pace = awake ? Math.min(1, pace + dt / 2) : Math.max(0, pace - dt / 2);
  FU.uPace.value = pace;
  const lively = busy();
  try {
    simT += dt;
    U.uTime.value = simT;
    if (press) {
      press.charge = Math.min(1, (performance.now() - press.at) / 1500);
      press.seed = burstPoint(press.ndc, 1 + press.charge, press.seed || new THREE.Vector3());
    }
    if (lively || now - lastDraw >= 31) {
      updateLights();
      draw();
      watch(now, lively);
      lastDraw = now;
    }
  } finally {
    if (visible && (lively || pace > 0)) raf = requestAnimationFrame(tick);
    else { lastT = 0; updateLights(); draw(); }
  }
}
function wake() {
  lastInput = performance.now();
  if (!raf && visible && !document.hidden) raf = requestAnimationFrame(tick);
}
/* Performance ladder: slow frames step quality down a rung, never back up. */
let watchFrom = 0, watchN = 0, watchSum = 0, prevDraw = 0;
function watch(now, lively) {
  const gap = now - prevDraw;
  prevDraw = now;
  if (gap > 200) { watchFrom = now; watchN = watchSum = 0; return; }
  if (!watchFrom) watchFrom = now;
  if (now - watchFrom < 4000) return;
  watchN++; watchSum += gap;
  if (watchN < 2 || now - watchFrom < 6000) return;
  if (watchSum / watchN > (lively ? 1000 / 38 : 1000 / 22) && rung < 2) { rung++; resize(); }
  watchFrom = now - 4000; watchN = watchSum = 0;
}
whenVisible(stage, vis => {
  visible = vis;
  if (!vis) { cancelAnimationFrame(raf); raf = 0; lastT = 0; return; }
  draw();
  wake();
});
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
onReducedChange(on => { starMat.uniforms.uSteady.value = on ? 1 : 0; SU.uDrift.value = on ? 0.5 : 1; wake(); });

/* Pointer: press grows a seed light; release launches; hold sets the calibre. */
let press = null;
const ndcOf = e => {
  const r = stage.getBoundingClientRect();
  return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
};
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture(e.pointerId);
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, at: performance.now(), ndc: ndcOf(e), charge: 0, seed: null, moved: false };
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  // After 8 px of travel the seed follows the pointer.
  if (!press.moved && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) press.moved = true;
  if (press.moved) press.ndc = ndcOf(e);
});
stage.addEventListener('pointerup', e => {
  if (!press || e.pointerId !== press.id) return;
  const held = (performance.now() - press.at) / 1000, ndc = press.ndc;
  press = null;
  // A tap is calibre 1; a hold reaches calibre 2 at 1.5 s.
  launch(ndc, held < 0.26 ? 1 : 1 + Math.min(1, held / 1.5));
});
const cancel = e => { if (press && e.pointerId === press.id) { press = null; wake(); } };
stage.addEventListener('pointercancel', cancel);
stage.addEventListener('lostpointercapture', cancel);
// Space launches a shell at a random point in the sky.
stage.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  launch(new THREE.Vector2((rnd() - 0.5) * 1.2, horizonNdc + (0.3 + rnd() * 0.55) * (0.92 - horizonNdc)), 1 + rnd() * 0.6);
});

/* ---------- bar ---------- */
function popover(box, btn) {
  const set = on => { box.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!box.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
// The stepper walks the shell list and wraps at each end.
const shellBox = document.getElementById('shell'), shellName = shellBox.querySelector('output');
let shellAt = Math.max(0, SHELL_LIST.findIndex(([id]) => id === opts.shell));
function stepShell(d) {
  shellAt = (shellAt + d + SHELL_LIST.length) % SHELL_LIST.length;
  const [id, name] = SHELL_LIST[shellAt];
  opts.shell = id; save('shell', id);
  shellName.textContent = name;
  if (!d) return;
  // The name slides in from the side of the pressed arrow.
  shellName.classList.remove('from-next', 'from-prev');
  void shellName.offsetWidth;
  shellName.classList.add(d > 0 ? 'from-next' : 'from-prev');
}
stepShell(0);
shellBox.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => stepShell(+b.dataset.step)));
// Left and right arrows step while the stepper has focus.
shellBox.addEventListener('keydown', e => {
  const d = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
  if (!d) return;
  e.preventDefault(); e.stopPropagation(); stepShell(d);
});
const distEl = document.getElementById('dist');
distEl.value = String(opts.dist);
distEl.addEventListener('input', () => { opts.dist = +distEl.value; save('dist', opts.dist); });
choices(document.getElementById('smoke'), val => { opts.smoke = val; save('smoke', val); SU.uSmokeK.value = val === 'thick' ? 1.5 : 1.0; }).set(opts.smoke);
SU.uSmokeK.value = opts.smoke === 'thick' ? 1.5 : 1.0;
choices(document.getElementById('water'), v => { water.material.uniforms.uRipple.value = v === 'ripple' ? 2 : 1; draw(); });

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  markReady();
  wake();
}, () => { canvas.classList.add('on'); markReady(); });
</script>
</body>
</html>
