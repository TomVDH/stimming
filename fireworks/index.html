/* Fireworks: shells over a dark bay at night. */
:root { --stage: oklch(0.1 0.015 265); }
.stage--fireworks canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--fireworks canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--fireworks canvas { transition: none; } }
/* The bill: a cheeky running cost of the show, under the top-right cluster. */
.bill {
  position: absolute; top: calc(12px + var(--chip, 26px) + 12px); right: 14px; z-index: 3; padding: 5px 10px; border: 0; border-radius: 999px;
  font: 700 15px/1 inherit; font-family: inherit; font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  color: oklch(0.74 0.19 25); background: oklch(0.14 0.012 275 / 0.62);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); cursor: pointer;
}
.bill[hidden] { display: none; }
.bill.ka { animation: bill-ka 0.32s ease-out; }
@keyframes bill-ka { 30% { transform: scale(1.14); color: oklch(0.86 0.17 30); } }
@media (prefers-reduced-motion: reduce) { .bill.ka { animation: none; } }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",

  }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { createNoise2D } from 'simplex-noise';
import { initPage, whenVisible, pixelRatio, onQuality, linFit, reduced, onReducedChange, quality, setQuality, audioKit, sound } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const stage = document.getElementById('stage');

// Seeded random keeps the bay the same on every load.
let seed = 4242;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// The scene: the festival bay, a lonesome winter island, or a harbour city.
// For now only the lake (the bay) ships (Tom, 2026-11-09); ?scene= still opens the others for work.
const SCENES = ['bay', 'island', 'city'];
const SCENE = (() => { const q = new URLSearchParams(location.search).get('scene'); return SCENES.includes(q) ? q : 'bay'; })();
const SC_ID = SCENES.indexOf(SCENE);
const rescene = (() => { try { const v = sessionStorage.getItem('stimming.fireworks.rescene') === '1'; sessionStorage.removeItem('stimming.fireworks.rescene'); return v; } catch { return false; } })();

let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
if (rescene) document.querySelector('.intro')?.remove();
else playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 1, 20000);
camera.position.set(0, 12, 0);
// Layer 1 holds what the water mirrors.
const LIGHT = 1;
const SHORE_Z = -1500;
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;
/* ---------- look knobs ---------- */
// Every tunable look value; the dev panel (?dev) edits them live.
// Each row: key, label, default, min, max, step.
const FX_ROWS = [
  ['Bloom', [
    ['bloom', 'Strength', 0.9, 0, 3, 0.01], ['bloomRadius', 'Radius', 0.5, 0, 1, 0.01],
    ['bloomThreshold', 'Threshold', 0.9, 0, 4, 0.01], ['bloomScale', 'Resolution', 1, 0.25, 1, 0.05],
    ['orbs', 'Orbs', 1, 0, 3, 0.01],
  ]],
  ['Flare streak', [
    ['flare', 'Streak', 1, 0, 3, 0.01], ['flareLength', 'Length', 0.35, 0.02, 1.5, 0.01],
    ['flareThin', 'Thinness', 160, 20, 600, 1], ['flareWarmth', 'Warmth', 0.2, -1, 1, 0.01],
    ['streakFade', 'Fade (s)', 0.12, 0.02, 1, 0.005], ['streakTail', 'Tail share', 0.15, 0, 1, 0.01],
    ['streakTailFade', 'Tail fade (s)', 0.6, 0.05, 4, 0.01],
  ]],
  ['Flare ghosts', [
    ['ghosts', 'Ghosts', 1, 0, 3, 0.01], ['ghostSpread', 'Spread', 1, 0.3, 2, 0.01],
    ['ghostFade', 'Fade (s)', 0.25, 0.02, 2, 0.005],
  ]],
  ['Clouds', [
    ['cloudCover', 'Cloudy cover', 0.52, 0.3, 0.8, 0.005], ['cloudBase', 'Base (m)', 260, 120, 600, 5],
    ['cloudDepth', 'Depth (m)', 300, 50, 600, 5], ['cloudGlow', 'Glow', 0.38, 0, 1.5, 0.01],
  ]],
  ['Night', [
    ['ambient', 'Ambient', 1, 0, 3, 0.01], ['haze', 'Haze', 0.45, 0, 2, 0.01],
    ['bolt', 'Lightning', 1, 0, 4, 0.01], ['boltRate', 'Lightning rate', 1, 0, 4, 0.01],
  ]],
  ['Grade', [
    ['vignette', 'Vignette', 0.5, 0, 1, 0.01], ['grain', 'Grain', 0.03, 0, 0.12, 0.001], ['lift', 'Lift', 1, 0, 4, 0.01],
  ]],
];
const FX_DEF = Object.fromEntries(FX_ROWS.flatMap(([, rows]) => rows.map(r => [r[0], r[2]])));
const DEV = new URLSearchParams(location.search).has('dev');
// Saved tweaks load only in dev mode, so the shipped look never drifts.
const FX = { ...FX_DEF, ...(DEV ? (() => { try { return JSON.parse(localStorage.getItem('stimming.fireworks.fx')) || {}; } catch { return {}; } })() : {}) };
/* ---------- end look knobs ---------- */

/* ---------- burst lights ---------- */
// Eight burst lights; every lit shader reads this array.
const LN = 8;
const U = {
  uL: { value: Array.from({ length: LN }, () => new THREE.Vector4()) },
  uLC: { value: Array.from({ length: LN }, () => new THREE.Vector3()) },
  uLN: { value: 0 },
  uCool: { value: new THREE.Vector3(0.47, 0.6, 0.83) },
  uHaze: { value: 0.00045 },
  uHazeH: { value: 140 },
  uTime: { value: 0 },
  // Cloud deck: base, depth, cover, fade; the offset carries the wind.
  // The fade runs from 0 (no deck) to 1, so the deck eases in and out.
  uCloud: { value: new THREE.Vector4(260, 300, 0.52, 0) },
  uCloudO: { value: new THREE.Vector2() },
  // The torn sky: opening, rim glow, eye, age; then the seam and the eye.
  uTear: { value: new THREE.Vector4() },
  uTP: { value: Array.from({ length: 8 }, () => new THREE.Vector2()) },
  uEye: { value: new THREE.Vector3() },
  // A city's light dome: azimuth, width, strength; then its colour.
  uDome: { value: new THREE.Vector3(0, 1, 0) },
  uDomeC: { value: new THREE.Vector3(1, 0.62, 0.42) },
};
// The moon: its direction, then its strength; only the island has one.
U.uMoon = { value: new THREE.Vector4(0, 0, -1, 0) };
if (SCENE === 'island') { const az = 0.21, el = 0.13; U.uMoon.value.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el), 1); }
// The city's sodium and LED glow sits low over downtown.
if (SCENE === 'city') U.uDome.value.set(0.12, 1.4, 0.011);
// Snowfall follows the cloud: none under a clear sky.
const snowAmt = { value: 0 };
// The island's night is colder and brighter: moonlight on snow.
if (SCENE === 'island') U.uCool.value.multiply(new THREE.Vector3(0.95, 1.12, 1.45));
const LIGHTS_GLSL = /* glsl */`
uniform vec4 uL[${LN}];
uniform vec3 uLC[${LN}];
uniform int uLN;
// Light that a point gets from every live burst; r sets the reach.
vec3 burstLit(vec3 P, float r) {
  vec3 s = vec3(0.0);
  for (int i = 0; i < ${LN}; i++) {
    if (i >= uLN) break;
    vec3 d = uL[i].xyz - P;
    s += uLC[i] * uL[i].w / (1.0 + dot(d, d) / (r * r));
  }
  return s;
}
// Glow that a view ray collects in the haze round each burst.
vec3 burstGlow(vec3 dir) {
  vec3 s = vec3(0.0);
  float up = max(dir.y, 0.0);
  for (int i = 0; i < ${LN}; i++) {
    if (i >= uLN) break;
    vec3 v = uL[i].xyz - cameraPosition;
    float dist = length(v);
    float c = dot(dir, v / dist) - 1.0;
    // A tight core, a mid halo, and a wide lift of the low haze.
    float g = 0.22 * exp(c * 2500.0) + 0.1 * exp(c * 60.0) + 0.05 * exp(c * 5.0) * exp(-up * 7.0);
    s += uLC[i] * uL[i].w * g * (900.0 / dist);
  }
  return s;
}`;
// Flash in 30 ms, fall with tau 0.35 s, then a glow tail with tau 1.5 s.
const flash = (age, rise = 0.03) => (age < 0 ? 0 : Math.min(1, age / rise) * (0.78 * Math.exp(-age / 0.35) + 0.22 * Math.exp(-age / 1.5)));
/* ---------- end burst lights ---------- */

/* ---------- K2: noise ---------- */
// Lifted from Night viaduct, Port.
const K2_NOISE = /* glsl */`
float k2hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float k2noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(k2hash(i), k2hash(i + vec2(1, 0)), u.x), mix(k2hash(i + vec2(0, 1)), k2hash(i + vec2(1, 1)), u.x), u.y);
}
float k2fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * k2noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s;
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: sky ---------- */
// Clear night sky: dark zenith, a cool low band, few faint stars.
// Port's cloud ceiling and amber dome are cut here.
const K2_SKY = /* glsl */`
uniform vec3 uCool;
uniform vec4 uTear;
uniform vec2 uTP[8];
uniform vec3 uEye;
uniform vec3 uDome;
uniform vec3 uDomeC;
uniform vec4 uMoon;
// The city's light dome: a low, wide band along the horizon.
vec3 domeAt(vec3 dir) {
  float up = max(dir.y, 0.0), da = (atan(dir.x, -dir.z) - uDome.x) / uDome.y;
  return uDomeC * uDome.z * exp(-up * 14.0 - da * da);
}
// The moon: a lit disc with dark seas, a tight halo and a wide one.
vec3 moonSky(vec3 dir) {
  if (uMoon.w <= 0.0) return vec3(0.0);
  float cd = dot(dir, uMoon.xyz);
  if (cd < 0.9) return vec3(0.0);
  float ang = acos(min(cd, 1.0));
  vec3 t1 = normalize(cross(uMoon.xyz, vec3(0.0, 1.0, 0.0))), t2 = cross(t1, uMoon.xyz);
  vec2 m = vec2(dot(dir, t1), dot(dir, t2)) / 0.0105;
  float r = length(m);
  float seas = 1.0 - 0.28 * smoothstep(0.55, 0.15, length(m - vec2(-0.25, 0.2))) - 0.2 * smoothstep(0.4, 0.1, length(m - vec2(0.3, -0.25))) - 0.12 * k2noise(m * 3.0 + 7.0);
  float disc = smoothstep(1.0, 0.94, r) * (0.75 + 0.25 * sqrt(max(1.0 - r * r, 0.0))) * seas;
  vec3 c = vec3(0.98, 0.97, 1.0) * 1.05 * disc + vec3(0.55, 0.62, 0.8) * (0.025 * exp(-ang / 0.025) + 0.01 * exp(-ang / 0.22));
  return c * uMoon.w;
}
// Stars on the sky grid; q is azimuth and height, as for the seam.
float k2starsQ(vec2 q) {
  q *= 260.0;
  vec2 i = floor(q), f = fract(q) - 0.5;
  float h = k2hash(i);
  // About one cell in two hundred holds a star.
  float on = step(0.995, h);
  vec2 o = vec2(k2hash(i + 7.1), k2hash(i + 3.3)) - 0.5;
  return on * exp(-dot(f - o * 0.6, f - o * 0.6) * 60.0) * (0.02 + 0.05 * k2hash(i + 1.7));
}
// Nearest point on the seam: distance, side, place along it, normal.
float tearAt(vec2 q, out float side, out float along, out vec2 nrm) {
  float best = 1e9;
  side = 1.0; along = 0.0; nrm = vec2(0.0, 1.0);
  for (int i = 0; i < 7; i++) {
    vec2 a = uTP[i], ab = uTP[i + 1] - a;
    float t = clamp(dot(q - a, ab) / dot(ab, ab), 0.0, 1.0);
    vec2 pq = q - a - ab * t;
    float d = length(pq);
    if (d < best) {
      best = d; along = (float(i) + t) / 7.0;
      nrm = normalize(vec2(-ab.y, ab.x));
      side = dot(pq, nrm) < 0.0 ? -1.0 : 1.0;
    }
  }
  return best;
}
// Behind the seam: a red-black void with slow currents and an eye.
vec3 tearVoid(vec2 q) {
  float t = uTear.w * 0.15;
  float n = k2fbm(q * 30.0 + vec2(t, -t * 0.7));
  vec3 c = vec3(0.004, 0.0, 0.002) + vec3(0.09, 0.006, 0.012) * pow(n, 3.0);
  // Strange stars, red and cold, deeper than ours.
  c += vec3(1.0, 0.25, 0.3) * k2starsQ(q * 1.7 + 3.1) * 4.0;
  if (uTear.z > 0.001) {
    vec2 e = (q - uEye.xy) / uEye.z;
    float r = length(e);
    // The lids open with uTear.z; outside them the void stays dark.
    float lid = uTear.z * sqrt(max(1.0 - e.x * e.x, 0.0)) * 0.62;
    if (abs(e.y) < lid && r < 1.0) {
      float a = atan(e.y, e.x);
      float fib = 0.6 + 0.4 * k2noise(vec2(a * 9.0, r * 3.0));
      vec3 iris = mix(vec3(0.5, 0.05, 0.0), vec3(1.0, 0.55, 0.05), smoothstep(0.85, 0.35, r)) * fib;
      // A slit pupil, wide at the centre, sharp at the ends.
      float slit = smoothstep(0.02, 0.0, abs(e.x) - 0.11 * (1.0 - e.y * e.y));
      iris *= 1.0 - slit;
      iris += vec3(1.0, 0.9, 0.8) * exp(-dot(e - vec2(-0.25, 0.22), e - vec2(-0.25, 0.22)) * 220.0) * 2.0;
      c = mix(c, iris * 0.9, smoothstep(lid, lid - 0.05, abs(e.y)) * smoothstep(1.0, 0.94, r));
    }
  }
  return c;
}
vec3 k2sky(vec3 dir) {
  float up = max(dir.y, 0.0);
  vec3 col = vec3(0.0016, 0.0021, 0.0045) + uCool * 0.016 * exp(-up * 9.0);
  vec2 q = vec2(atan(dir.x, -dir.z), dir.y);
  col += domeAt(dir);
  float sk = smoothstep(0.03, 0.25, dir.y);
  if (uTear.x > 0.0005) {
    float side, along;
    vec2 nrm;
    float d = tearAt(q, side, along, nrm);
    // Each lip tears on its own ragged line.
    float rag = k2noise(vec2(along * 70.0, side * 4.0 + 1.0)) * 0.7 + k2noise(vec2(along * 190.0, side * 9.0)) * 0.3;
    float hw = 0.5 * uTear.x * pow(max(sin(3.14159 * along), 0.0), 0.7) * (0.35 + 1.3 * rag);
    // The sky slides apart: nearby stars shift away from the seam.
    float pull = hw * exp(-max(d - hw, 0.0) / 0.12);
    if (d < hw) col = tearVoid(q);
    else col += vec3(0.85, 0.9, 1.0) * k2starsQ(q - side * nrm * pull) * sk;
    // The rim burns white-hot, then orange, then a wide magenta bruise.
    float e = abs(d - hw);
    col += (vec3(1.0, 0.8, 0.6) * exp(-e * e / 8e-7) * 1.4 + vec3(1.0, 0.32, 0.08) * exp(-e / 0.0025) * 0.28
      + vec3(0.5, 0.04, 0.2) * exp(-e / 0.04) * 0.035) * uTear.y * smoothstep(0.0, 0.08, sin(3.14159 * along));
  } else col += vec3(0.85, 0.9, 1.0) * k2starsQ(q) * sk;
  return col + moonSky(dir) + burstGlow(dir);
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: haze ---------- */
// Height haze along the view ray; burst light lifts its colour.
// Port's fog bank round the port is cut here.
const K2_HAZE = /* glsl */`
uniform float uHaze;
uniform float uHazeH;
float k2hazeAmount(vec3 P) {
  vec3 v = P - cameraPosition;
  float dist = length(v);
  float k = 1.0 / uHazeH;
  float h0 = max(cameraPosition.y, 0.0), h1 = max(P.y, 0.0), dh = h1 - h0;
  // Exponential height fog integrated along the ray.
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);
  return 1.0 - exp(-dist * uHaze * max(avg, 0.0));
}
vec3 k2hazeColor(vec3 dir) { return uCool * 0.01 + burstGlow(dir) * 0.8 + domeAt(vec3(dir.x, 0.0, dir.z)) * 0.8; }
vec3 k2haze(vec3 c, vec3 P) {
  return mix(c, k2hazeColor(normalize(P - cameraPosition)), k2hazeAmount(P));
}`;
/* ---------- end K2 ---------- */

/* ---------- cloud deck ---------- */
// A broken deck of low cloud; bursts inside it light it from within.
const CLOUD_SIGMA = 0.024;
// Coverage noise scale across and along the bay.
const CLOUD_F = [0.0017, 0.0029];
const CLOUD_GLSL = /* glsl */`
uniform vec4 uCloud;
uniform vec2 uCloudO;
// Cloud cover over the ground at xz: 0 is clear, 1 is full.
float cloudD(vec2 xz) {
  float n = k2fbm((xz + uCloudO) * vec2(${CLOUD_F[0]}, ${CLOUD_F[1]}) + vec2(3.7, 1.9));
  return smoothstep(1.0 - uCloud.z, 1.16 - uCloud.z, n);
}
// A column's floor and roof: dense parts hang lower and pile higher.
vec2 cloudCol(float D) { return vec2(uCloud.x + 110.0 * (1.0 - D), uCloud.x + uCloud.y * D); }
// The part of a point's light that comes through the deck to the eye.
float cloudVeil(vec3 P) {
  if (uCloud.w < 0.001 || P.y <= uCloud.x) return 1.0;
  vec3 v = P - cameraPosition;
  if (v.y < 1.0) return 1.0;
  float mid = 0.5 * (uCloud.x + min(P.y, uCloud.x + uCloud.y));
  vec3 X = cameraPosition + v * ((mid - cameraPosition.y) / v.y);
  float D = cloudD(X.xz);
  vec2 c = cloudCol(D);
  return mix(1.0, exp(-D * max(min(P.y, c.y) - c.x, 0.0) * length(v) / v.y * ${CLOUD_SIGMA}), uCloud.w);
}`;
// The same density on the CPU, in float32 steps, for lights and orbs.
const f32 = Math.fround, fr = x => x - Math.floor(x);
function chash(x, y) {
  x = fr(f32(x * 123.34)); y = fr(f32(y * 456.21));
  const d = f32(x * (x + 45.32) + y * (y + 45.32));
  return fr(f32((x + d) * (y + d)));
}
function cnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = chash(ix, iy), b = chash(ix + 1, iy), c = chash(ix, iy + 1), d = chash(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a + (a - b + d - c) * ux) * uy;
}
function cloudD(x, z) {
  const C = U.uCloud.value, O = U.uCloudO.value;
  let px = (x + O.x) * CLOUD_F[0] + 3.7, py = (z + O.y) * CLOUD_F[1] + 1.9, s = 0, a = 0.5;
  for (let i = 0; i < 5; i++) { s += a * cnoise(px, py); px = px * 2.03 + 17.1; py = py * 2.03 + 9.2; a *= 0.5; }
  const t = Math.min(1, Math.max(0, (s - (1 - C.z)) / 0.16));
  return t * t * (3 - 2 * t);
}
// Light through the deck: to the ground (from above) or to the eye.

  cube: () => { const a = [[-7, -4], [5, -8], [10, -1], [-2, 3]], b = a.map(([x, y]) => [x, y + 11]); const e = (p, q) => ln(p[0], p[1], q[0], q[1], IC.W, 1.1); return [0, 1, 2, 3].map(i => e(a[i], a[(i + 1) % 4]) + e(b[i], b[(i + 1) % 4]) + e(a[i], b[i])).join(''); },
  jelly: () => `<path d="M-11 0A11 10 0 0 1 11 0" fill="none" stroke="${IC.A}" stroke-width="1.5" stroke-dasharray="0.1 2.3" stroke-linecap="round"/>` + [-8, -4, 0, 4, 8].map(x => `<path d="M${x} 1q2 3 0 6t0 6" fill="none" stroke="${IC.P}" stroke-width="1.1" stroke-linecap="round"/>`).join(''),
  swarm: () => [[-8, -6], [6, -8], [10, 2], [-3, 9], [-10, 5], [2, -1], [7, 9], [-5, 0]].map(([x, y], i) => dt(x, y, 1.4, IC.G) + `<path d="M${x} ${y}q${i % 2 ? 2 : -2} 2 0 4" fill="none" stroke="${IC.O}" stroke-width="0.8"/>`).join(''),
};
// The disc behind each drawing is the night sky.
const shellIcon = id => `<svg viewBox="-17 -17 34 34" aria-hidden="true"><circle r="16.5" fill="oklch(0.14 0.03 275)" stroke="oklch(1 0 0 / 0.08)"/>${(DRAW[id] || DRAW.mix)()}</svg>`;
/* ---------- end shell drawings ---------- */

/* ---------- bar ---------- */
const setShell = id => { opts.shell = id; save('shell', id); };
const setDist = v => { opts.dist = v; save('dist', v); placeBarges(); draw(); };
const setSmoke = v => { opts.smoke = v; save('smoke', v); SU.uSmokeK.value = v === 'thick' ? 1.15 : 0.75; };
const setBill = v => { save('bill', v); billEl.hidden = v !== 'on'; shown = spent; billEl.textContent = money(spent); };
const setWater = v => { water.material.uniforms.uRipple.value = v === 'ripple' ? 2 : 1; draw(); };
const ui = initPage({ id: 'fireworks', bar: {
  choice: { label: 'Shell', display: 'tray', value: opts.shell,
    options: SHELL_LIST.map(([value, label]) => ({ value, label, icon: shellIcon(value) })),
    onPick: v => { setShell(v); stage.focus({ preventScroll: true }); } },
  slider: { label: 'Distance', min: 0, max: 1, step: 0.01, value: opts.dist, onInput: setDist },
  actions: [{ verb: 'showtime', label: 'Showtime', key: 'S', onPress: () => showtime() }],
  settings: [
    { type: 'choice', id: 'weather', label: 'Sky', value: opts.sky, options: [{ value: 'drift', label: 'Drift' }, { value: 'clear', label: 'Clear' }, { value: 'cloud', label: 'Cloud' }], onPick: v => { setSky(v); save('weather', v); updateLights(); draw(); } },
    { type: 'choice', id: 'smoke', label: 'Smoke', value: opts.smoke, options: [{ value: 'thin', label: 'Thin' }, { value: 'thick', label: 'Thick' }], onPick: setSmoke },
    { type: 'choice', id: 'water', label: 'Water', value: 'calm', options: [{ value: 'calm', label: 'Calm' }, { value: 'ripple', label: 'Ripple' }], onPick: setWater },
    { type: 'choice', id: 'bill', label: 'Bill', value: saved('bill') === 'on' ? 'on' : 'off', options: [{ value: 'off', label: 'Off' }, { value: 'on', label: 'On' }], onPick: setBill },
  ],
  quality: true,
  keys: [['click', 'launch'], ['hold', 'bigger shell'], ['space', 'random shell'], ['← →', 'shell']],
} });
placeBarges();
SU.uSmokeK.value = opts.smoke === 'thick' ? 1.15 : 0.75;
/* ---------- weather ---------- */
// On Drift the sky starts clear and turns cloudy now and then, at random.
// A change takes two and a half to four minutes and eases in and out.
// Weights for the cloudy states: broken, cloudy, overcast.
const WX_CLOUDY = [[0.35, 0.5], [0.8, 0.35], [1, 0.15]];
const pickCloudy = (not = -1) => {
  const pool = WX_CLOUDY.filter(([w]) => w !== not), sum = pool.reduce((s, [, p]) => s + p, 0);
  let r = Math.random() * sum;
  for (const [w, p] of pool) if ((r -= p) <= 0) return w;
  return pool[0][0];
};
// Clear holds two to seven minutes; cloud holds one to three and a half.
const holdFor = w => (w > 0.01 ? 60 + Math.random() * 150 : 120 + Math.random() * 300) * 1000;
const wx = { w: 0, from: 0, to: 0, p: 0, dur: 0, next: performance.now() + holdFor(0), last: 0 };
// Cover from the weather: 0 is clear, 0.8 is the tuned deck, 1 is overcast.
function applyCover() {
  const w = opts.sky === 'clear' ? 0 : opts.sky === 'cloud' ? 0.8 : wx.w;
  U.uCloud.value.z = 0.36 + ((FX.cloudCover - 0.36) * w) / 0.8;
  // The first wisps fade in, so the deck never pops on or off.
  const t = Math.min(1, w / 0.2);
  U.uCloud.value.w = t * t * (3 - 2 * t);
  cloud.visible = w > 0.002;
  if (SCENE === 'island') U.uMoon.value.w = 1 - 0.97 * U.uCloud.value.w;
  snowAmt.value = Math.min(1, Math.max(0, (w - 0.2) / 0.5));
}
/* Heat lightning: silent flickers deep in far cloud, only under a thick deck. */
const BOLT_COL = linFit(0.9, 0.06, 285);
let bolt = null, boltNext = 0;
// A flash is two to five pulses: each strikes fast and decays in 60 ms.
function strike() {
  const C = U.uCloud.value, p = new THREE.Vector3();
  // Try a few far spots; the flash needs cloud to live in.
  for (let k = 0; k < 10; k++) {
    const a = (Math.random() - 0.5) * 1.3, d = 4500 + Math.random() * 4500;
    p.set(camera.position.x + Math.sin(a) * d, C.x + 40 + Math.random() * C.y * 0.6, camera.position.z - Math.cos(a) * d);
    if (cloudD(p.x, p.z) > 0.45) break;
    if (k === 9) return;
  }
  const n = 2 + Math.floor(Math.random() * 4), pulses = [];
  let t = 0;
  for (let i = 0; i < n; i++) { pulses.push([t, (i ? 0.4 + Math.random() * 0.6 : 1) * (0.7 + Math.random() * 0.3)]); t += 0.06 + Math.random() * 0.18; }
  bolt = { pos: p, t0: simT, pulses, end: t + 0.4 };
}
function boltI() {
  if (!bolt) return 0;
  const a = simT - bolt.t0;
  if (a > bolt.end) { bolt = null; return 0; }
  let I = 0;
  for (const [t, amp] of bolt.pulses) if (a >= t) I += amp * Math.min(1, (a - t) / 0.012) * Math.exp(-(a - t) / 0.06);
  return I * 14 * FX.bolt;
}
function weatherTick(now) {
  const dt = wx.last ? Math.min(1, (now - wx.last) / 1000) : 0;
  wx.last = now;
  // Lightning needs a heavy deck: cover past 0.5, cloudy or overcast.
  const C = U.uCloud.value;
  if (SCENE !== 'island' && C.w > 0.5 && C.z > 0.5 && FX.boltRate > 0 && !reduced()) {
    if (!boltNext) boltNext = now + 8000 + Math.random() * 15000;
    if (now > boltNext && !bolt) {
      strike();
      // Heavier cloud flashes more often: every 8 to 30 s when overcast.
      const heavy = Math.min(1, (C.z - 0.5) / 0.06);
      boltNext = now + ((8 + Math.random() * 22) * 1000) / (FX.boltRate * (0.5 + 0.5 * heavy));
    }
  } else boltNext = 0;
  if (opts.sky !== 'drift') return;
  if (wx.dur) {
    // A change under way eases along a smoothstep.
    wx.p = Math.min(1, wx.p + dt / wx.dur);
    wx.w = wx.from + (wx.to - wx.from) * wx.p * wx.p * (3 - 2 * wx.p);
    applyCover();
    if (wx.p >= 1) { wx.dur = 0; wx.next = now + holdFor(wx.to); }
  } else if (now > wx.next) {
    // Cloud mostly clears; now and then it thickens or thins instead.
    wx.from = wx.w;
    wx.to = wx.w < 0.01 ? pickCloudy() : Math.random() < 0.75 ? 0 : pickCloudy(wx.w);
    wx.p = 0; wx.dur = 150 + Math.random() * 90;
  }
}
const setSky = v => { opts.sky = v; applyCover(); };
billEl.hidden = saved('bill') !== 'on';
setSky(opts.sky);
/* ---------- end weather ---------- */

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  markReady();
  wake();
}, () => { canvas.classList.add('on'); markReady(); });

/* ---------- dev panel ---------- */
// ?dev opens a panel of look knobs; the backquote key toggles it.
const COOL = U.uCool.value.clone();
function applyFX() {
  bloomPass.strength = FX.bloom; bloomPass.radius = FX.bloomRadius; bloomPass.threshold = FX.bloomThreshold;
  flarePass.uniforms.uSt.value.set(FX.flare, FX.flareLength, FX.flareThin, FX.flareWarmth);
  flarePass.uniforms.uGh.value.set(FX.ghosts, FX.ghostSpread);
  U.uCloud.value.x = FX.cloudBase; U.uCloud.value.y = FX.cloudDepth;
  applyCover();
  CU.uGlow.value = FX.cloudGlow;
  U.uCool.value.copy(COOL).multiplyScalar(FX.ambient);
  U.uHaze.value = FX.haze * 0.001;
  grade.uniforms.uVig.value = FX.vignette;
  grade.uniforms.uGrain.value = FX.grain;
  grade.uniforms.uTint.value.set(...POST.tint.map(v => v * FX.lift));
}
applyFX();
let devBox = null, devFrames = 0;
const devRender = composer.render.bind(composer);
composer.render = (...a) => { devFrames++; devRender(...a); };
function devPanel() {
  const css = document.createElement('style');
  css.textContent = `
  .fxdev { position: fixed; top: 12px; right: 12px; z-index: 50; width: 300px; max-width: calc(100vw - 24px); max-height: calc(100dvh - 24px); overflow: auto;
    padding: 10px 12px 12px; border-radius: 10px; background: oklch(0.14 0.012 275 / 0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: oklch(0.92 0.01 275); font: 500 12px/1.3 Gabarito, system-ui, sans-serif; box-shadow: 0 8px 30px oklch(0 0 0 / 0.5); }
  .fxdev[hidden] { display: none; }
  .fxdev header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .fxdev header b { flex: 1; font-size: 13px; letter-spacing: 0.04em; }
  .fxdev header output { color: oklch(0.65 0.02 275); font-variant-numeric: tabular-nums; }
  .fxdev button { font: inherit; color: inherit; background: oklch(0.24 0.015 275); border: 0; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  .fxdev button:hover { background: oklch(0.3 0.02 275); }
  .fxdev button[aria-pressed="true"] { background: oklch(0.82 0.13 80); color: oklch(0.16 0.012 275); }
  .fxdev .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .fxdev h3 { margin: 10px 0 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(0.65 0.02 275); }
  .fxdev .snd { margin: 0 0 4px; color: oklch(0.65 0.02 275); }
  .fxdev .takes button { padding: 3px 6px; font-size: 11px; }
  .fxdev label { display: grid; grid-template-columns: 82px 1fr 46px; align-items: center; gap: 8px; padding: 1px 0; }
  .fxdev label.mod span { color: oklch(0.84 0.13 80); }
  .fxdev input[type=range] { width: 100%; accent-color: oklch(0.82 0.13 80); }
  .fxdev input[type=number] { width: 46px; font: inherit; color: inherit; background: transparent; border: 0; text-align: right; font-variant-numeric: tabular-nums; }`;
  document.head.append(css);
  const box = document.createElement('aside');
  box.className = 'fxdev';
  box.setAttribute('aria-label', 'Look knobs');
  box.innerHTML = `<header><b>Look</b><output></output><button data-a="close" aria-label="Close">×</button></header>
    <div class="acts"><button data-q="standard">Standard</button><button data-q="high">High</button><button data-a="fire">Fire</button><button data-a="finale">Showtime</button><button data-a="tear">Tear</button><button data-a="bolt">Bolt</button><button data-a="copy">Copy</button><button data-a="reset">Reset</button></div>
    <h3>Sounds</h3><p class="snd"><output></output></p><div class="acts takes">${Object.keys(SFX_GAIN).map(n => `<button data-take="${n}">${n}</button>`).join('')}</div>
    ${FX_ROWS.map(([name, rows]) => `<h3>${name}</h3>` + rows.map(([k, label, , min, max, step]) =>
      `<label data-k="${k}"><span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}"><input type="number" min="${min}" max="${max}" step="${step}"></label>`).join('')).join('')}`;
  document.body.append(box);
  const fps = box.querySelector('header output');
  const show = () => {
    box.querySelectorAll('label[data-k]').forEach(l => {
      const k = l.dataset.k, [r, n] = l.querySelectorAll('input');
      r.value = n.value = FX[k];
      l.classList.toggle('mod', FX[k] !== FX_DEF[k]);
    });
    box.querySelectorAll('[data-q]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.q === quality())));
  };
  const store = () => { try { localStorage.setItem('stimming.fireworks.fx', JSON.stringify(changed())); } catch { /* storage is optional */ } };
  const changed = () => Object.fromEntries(Object.entries(FX).filter(([k, v]) => v !== FX_DEF[k]));
  const set = (k, v) => {
    FX[k] = v;
    applyFX();
    if (k === 'bloomScale') resize();
    updateLights(); draw(); store(); show();
  };
  box.addEventListener('input', e => {
    const l = e.target.closest('label[data-k]');
    if (l && e.target.value !== '') set(l.dataset.k, +e.target.value);
  });
  box.addEventListener('click', e => {
    const q = e.target.dataset.q, a = e.target.dataset.a, tk = e.target.dataset.take;
    // A take button plays that recording dry, straight to the output.
    if (tk) {
      const ac = kit.wake();
      if (ac) { bus(ac); if (has(tk)) smp(ac, tk, ac.currentTime + 0.02, kit.out, 0.6); }
    }
    if (q) { setQuality(q); show(); }
    if (a === 'close') box.hidden = true;
    if (a === 'fire') launch(new THREE.Vector2((rnd() - 0.5) * 1.2, horizonNdc + (0.3 + rnd() * 0.55) * (0.92 - horizonNdc)), 1 + rnd() * 0.6);
    if (a === 'finale') showtime();
    if (a === 'bolt') { strike(); wake(); }
    if (a === 'tear' && !tear) overcharge(new THREE.Vector2((rnd() - 0.5) * 0.6, horizonNdc + 0.6 * (0.92 - horizonNdc)));
    if (a === 'copy') navigator.clipboard?.writeText(JSON.stringify(changed(), null, 2));
    if (a === 'reset') { Object.assign(FX, FX_DEF); applyFX(); resize(); try { localStorage.removeItem('stimming.fireworks.fx'); } catch { /* storage is optional */ } show(); }
  });
  // Frames drawn per second; the loop sleeps when idle, so 0 is normal.
  setInterval(() => { if (!box.hidden) {
      fps.textContent = `${devFrames * 2} fps · r${rung} · sky ${wx.w.toFixed(2)}→${wx.to} · crowd ${crowd.E.toFixed(2)}`;
      box.querySelector('.snd output').textContent = `${Object.keys(sfx || {}).length}/${Object.keys(SFX_GAIN).length} takes loaded · sound ${kit.ac?.state || 'off'} · last ${lastTake || 'none'}`;
    } devFrames = 0; }, 500);
  show();
  return box;
}
if (DEV) devBox = devPanel();
addEventListener('keydown', e => {
  if (e.key !== '`' || e.target.closest?.('input, textarea')) return;
  if (!devBox) devBox = devPanel(); else devBox.hidden = !devBox.hidden;
});
/* ---------- end dev panel ---------- */
</script>
