<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.14 0.014 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fireworks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Fireworks: shells over a dark bay at night. */
:root { --stage: oklch(0.1 0.015 265); }
.stage--fireworks canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--fireworks canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--fireworks canvas { transition: none; } }
/* Shell is one stepper pill: an arrow each side of the name. */
.stepper {
  display: inline-flex; align-items: center; color: var(--fg); font-size: 13px;
  border: 1px solid var(--line); border-radius: 999px;
  background-color: oklch(0.15 0.012 275 / 0.84); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
/* The arrows drop their own ring and backing, so the pill matches a chip's height. */
#shell .chip { border: 0; background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
#shell .chip svg { stroke-width: 1.8; stroke-linecap: round; }
/* The longest name sets the width, so the arrows never move. */
.stepper .name { display: grid; text-align: center; white-space: nowrap; }
.stepper .name > * { grid-area: 1 / 1; }
.stepper .sizer { visibility: hidden; }
.stepper output.from-next { animation: name-in 0.22s ease-out; --from: 8px; }
.stepper output.from-prev { animation: name-in 0.22s ease-out; --from: -8px; }
@keyframes name-in { from { opacity: 0; transform: translateX(var(--from)); } }
@media (prefers-reduced-motion: reduce) { .stepper output { animation: none !important; } }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.012 275 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Fireworks</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--fireworks" id="stage" tabindex="0" role="application" aria-label="A dark bay at night. Press the sky to launch a shell.">
      <p class="fail" hidden>Fireworks needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="stepper" id="shell" role="group" aria-label="Shell" tabindex="-1">
        <button class="chip icon" type="button" data-step="-1" aria-label="Previous shell" title="Previous shell"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
        <span class="name"><output aria-live="polite">Mix</output><span class="sizer" aria-hidden="true">Chrysanthemum</span></span>
        <button class="chip icon" type="button" data-step="1" aria-label="Next shell" title="Next shell"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button>
      </div>
      <label class="slider"><span>Distance</span><input type="range" id="dist" min="0" max="1" step="0.01" value="0.5" aria-label="Distance: 300 to 1,500 metres"></label>
      <div class="actions">
        <button class="chip" id="finale" type="button">+ Finale</button>
      </div>
      <div class="edge">
        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings">
            <div class="group"><span>Smoke</span><div class="choices" id="smoke" role="group" aria-label="Smoke">
              <button class="chip" type="button" data-value="thin" aria-pressed="true">Thin</button>
              <button class="chip" type="button" data-value="thick" aria-pressed="false">Thick</button>
            </div></div>
            <div class="group"><span>Sky</span><div class="choices" id="sky" role="group" aria-label="Sky">
              <button class="chip" type="button" data-value="clear" aria-pressed="false">Clear</button>
              <button class="chip" type="button" data-value="cloud" aria-pressed="true">Cloud</button>
            </div></div>
            <div class="group"><span>Water</span><div class="choices" id="water" role="group" aria-label="Water">
              <button class="chip" type="button" data-value="calm" aria-pressed="true">Calm</button>
              <button class="chip" type="button" data-value="ripple" aria-pressed="false">Ripple</button>
            </div></div>
          </div>
        </div>
        <dl class="how" aria-label="How to play">
          <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>launch</dd></div>
          <div><dt>Hold</dt><dd>bigger shell</dd></div>
          <div class="fine"><dt><kbd>Space</kbd></dt><dd>shell</dd></div>
        </dl>
      </div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Fireworks</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createNoise2D } from 'simplex-noise';
import { initPage, choices, whenVisible, pixelRatio, onQuality, qualitySetting, linFit, reduced, onReducedChange, quality, setQuality, audioKit, sound } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

initPage({ id: 'fireworks' });
qualitySetting(document.getElementById('sets'));
const stage = document.getElementById('stage');

// Seeded random keeps the bay the same on every load.
let seed = 4242;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 1, 20000);
camera.position.set(0, 12, 0);
// Layer 1 holds what the water mirrors.
const LIGHT = 1;
const SHORE_Z = -1500;
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;
/* ---------- look knobs ---------- */
// Every tunable look value; the dev panel (?dev) edits them live.
// Each row: key, label, default, min, max, step.
const FX_ROWS = [
  ['Bloom', [
    ['bloom', 'Strength', 0.9, 0, 3, 0.01], ['bloomRadius', 'Radius', 0.5, 0, 1, 0.01],
    ['bloomThreshold', 'Threshold', 0.9, 0, 4, 0.01], ['bloomScale', 'Resolution', 1, 0.25, 1, 0.05],
    ['orbs', 'Orbs', 1, 0, 3, 0.01],
  ]],
  ['Flare streak', [
    ['flare', 'Streak', 1, 0, 3, 0.01], ['flareLength', 'Length', 0.35, 0.02, 1.5, 0.01],
    ['flareThin', 'Thinness', 160, 20, 600, 1], ['flareWarmth', 'Warmth', 0.2, -1, 1, 0.01],
    ['streakFade', 'Fade (s)', 0.12, 0.02, 1, 0.005], ['streakTail', 'Tail share', 0.15, 0, 1, 0.01],
    ['streakTailFade', 'Tail fade (s)', 0.6, 0.05, 4, 0.01],
  ]],
  ['Flare ghosts', [
    ['ghosts', 'Ghosts', 1, 0, 3, 0.01], ['ghostSpread', 'Spread', 1, 0.3, 2, 0.01],
    ['ghostFade', 'Fade (s)', 0.25, 0.02, 2, 0.005],
  ]],
  ['Clouds', [
    ['cloudCover', 'Cover', 0.52, 0.3, 0.8, 0.005], ['cloudBase', 'Base (m)', 260, 120, 600, 5],
    ['cloudDepth', 'Depth (m)', 300, 50, 600, 5], ['cloudGlow', 'Glow', 0.38, 0, 1.5, 0.01],
  ]],
  ['Night', [
    ['ambient', 'Ambient', 1, 0, 3, 0.01], ['haze', 'Haze', 0.45, 0, 2, 0.01],
  ]],
  ['Grade', [
    ['vignette', 'Vignette', 0.5, 0, 1, 0.01], ['grain', 'Grain', 0.03, 0, 0.12, 0.001], ['lift', 'Lift', 1, 0, 4, 0.01],
  ]],
];
const FX_DEF = Object.fromEntries(FX_ROWS.flatMap(([, rows]) => rows.map(r => [r[0], r[2]])));
const DEV = new URLSearchParams(location.search).has('dev');
// Saved tweaks load only in dev mode, so the shipped look never drifts.
const FX = { ...FX_DEF, ...(DEV ? (() => { try { return JSON.parse(localStorage.getItem('stimming.fireworks.fx')) || {}; } catch { return {}; } })() : {}) };
/* ---------- end look knobs ---------- */

/* ---------- burst lights ---------- */
// Eight burst lights; every lit shader reads this array.
const LN = 8;
const U = {
  uL: { value: Array.from({ length: LN }, () => new THREE.Vector4()) },
  uLC: { value: Array.from({ length: LN }, () => new THREE.Vector3()) },
  uLN: { value: 0 },
  uCool: { value: new THREE.Vector3(0.47, 0.6, 0.83) },
  uHaze: { value: 0.00045 },
  uHazeH: { value: 140 },
  uTime: { value: 0 },
  // Cloud deck: base, depth, cover, on; the offset carries the wind.
  uCloud: { value: new THREE.Vector4(260, 300, 0.52, 1) },
  uCloudO: { value: new THREE.Vector2() },
};
const LIGHTS_GLSL = /* glsl */`
uniform vec4 uL[${LN}];
uniform vec3 uLC[${LN}];
uniform int uLN;
// Light that a point gets from every live burst; r sets the reach.
vec3 burstLit(vec3 P, float r) {
  vec3 s = vec3(0.0);
  for (int i = 0; i < ${LN}; i++) {
    if (i >= uLN) break;
    vec3 d = uL[i].xyz - P;
    s += uLC[i] * uL[i].w / (1.0 + dot(d, d) / (r * r));
  }
  return s;
}
// Glow that a view ray collects in the haze round each burst.
vec3 burstGlow(vec3 dir) {
  vec3 s = vec3(0.0);
  float up = max(dir.y, 0.0);
  for (int i = 0; i < ${LN}; i++) {
    if (i >= uLN) break;
    vec3 v = uL[i].xyz - cameraPosition;
    float dist = length(v);
    float c = dot(dir, v / dist) - 1.0;
    // A tight core, a mid halo, and a wide lift of the low haze.
    float g = 0.22 * exp(c * 2500.0) + 0.1 * exp(c * 60.0) + 0.05 * exp(c * 5.0) * exp(-up * 7.0);
    s += uLC[i] * uL[i].w * g * (900.0 / dist);
  }
  return s;
}`;
// Flash in 30 ms, fall with tau 0.35 s, then a glow tail with tau 1.5 s.
const flash = (age, rise = 0.03) => (age < 0 ? 0 : Math.min(1, age / rise) * (0.78 * Math.exp(-age / 0.35) + 0.22 * Math.exp(-age / 1.5)));
/* ---------- end burst lights ---------- */

/* ---------- K2: noise ---------- */
// Lifted from Night viaduct, Port.
const K2_NOISE = /* glsl */`
float k2hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float k2noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(k2hash(i), k2hash(i + vec2(1, 0)), u.x), mix(k2hash(i + vec2(0, 1)), k2hash(i + vec2(1, 1)), u.x), u.y);
}
float k2fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * k2noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s;
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: sky ---------- */
// Clear night sky: dark zenith, a cool low band, few faint stars.
// Port's cloud ceiling and amber dome are cut here.
const K2_SKY = /* glsl */`
uniform vec3 uCool;
float k2stars(vec3 dir) {
  vec2 q = vec2(atan(dir.x, -dir.z) * 260.0, dir.y * 260.0);
  vec2 i = floor(q), f = fract(q) - 0.5;
  float h = k2hash(i);
  // About one cell in two hundred holds a star.
  float on = step(0.995, h);
  vec2 o = vec2(k2hash(i + 7.1), k2hash(i + 3.3)) - 0.5;
  return on * exp(-dot(f - o * 0.6, f - o * 0.6) * 60.0) * (0.02 + 0.05 * k2hash(i + 1.7));
}
vec3 k2sky(vec3 dir) {
  float up = max(dir.y, 0.0);
  vec3 col = vec3(0.0016, 0.0021, 0.0045) + uCool * 0.016 * exp(-up * 9.0);
  col += vec3(0.85, 0.9, 1.0) * k2stars(dir) * smoothstep(0.03, 0.25, dir.y);
  return col + burstGlow(dir);
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: haze ---------- */
// Height haze along the view ray; burst light lifts its colour.
// Port's fog bank round the port is cut here.
const K2_HAZE = /* glsl */`
uniform float uHaze;
uniform float uHazeH;
float k2hazeAmount(vec3 P) {
  vec3 v = P - cameraPosition;
  float dist = length(v);
  float k = 1.0 / uHazeH;
  float h0 = max(cameraPosition.y, 0.0), h1 = max(P.y, 0.0), dh = h1 - h0;
  // Exponential height fog integrated along the ray.
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);
  return 1.0 - exp(-dist * uHaze * max(avg, 0.0));
}
vec3 k2hazeColor(vec3 dir) { return uCool * 0.01 + burstGlow(dir) * 0.8; }
vec3 k2haze(vec3 c, vec3 P) {
  return mix(c, k2hazeColor(normalize(P - cameraPosition)), k2hazeAmount(P));
}`;
/* ---------- end K2 ---------- */

/* ---------- cloud deck ---------- */
// A broken deck of low cloud; bursts inside it light it from within.
const CLOUD_SIGMA = 0.024;
// Coverage noise scale across and along the bay.
const CLOUD_F = [0.0017, 0.0029];
const CLOUD_GLSL = /* glsl */`
uniform vec4 uCloud;
uniform vec2 uCloudO;
// Cloud cover over the ground at xz: 0 is clear, 1 is full.
float cloudD(vec2 xz) {
  float n = k2fbm((xz + uCloudO) * vec2(${CLOUD_F[0]}, ${CLOUD_F[1]}) + vec2(3.7, 1.9));
  return smoothstep(1.0 - uCloud.z, 1.16 - uCloud.z, n);
}
// A column's floor and roof: dense parts hang lower and pile higher.
vec2 cloudCol(float D) { return vec2(uCloud.x + 110.0 * (1.0 - D), uCloud.x + uCloud.y * D); }
// The part of a point's light that comes through the deck to the eye.
float cloudVeil(vec3 P) {
  if (uCloud.w < 0.5 || P.y <= uCloud.x) return 1.0;
  vec3 v = P - cameraPosition;
  if (v.y < 1.0) return 1.0;
  float mid = 0.5 * (uCloud.x + min(P.y, uCloud.x + uCloud.y));
  vec3 X = cameraPosition + v * ((mid - cameraPosition.y) / v.y);
  float D = cloudD(X.xz);
  vec2 c = cloudCol(D);
  return exp(-D * max(min(P.y, c.y) - c.x, 0.0) * length(v) / v.y * ${CLOUD_SIGMA});
}`;
// The same density on the CPU, in float32 steps, for lights and orbs.
const f32 = Math.fround, fr = x => x - Math.floor(x);
function chash(x, y) {
  x = fr(f32(x * 123.34)); y = fr(f32(y * 456.21));
  const d = f32(x * (x + 45.32) + y * (y + 45.32));
  return fr(f32((x + d) * (y + d)));
}
function cnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = chash(ix, iy), b = chash(ix + 1, iy), c = chash(ix, iy + 1), d = chash(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a + (a - b + d - c) * ux) * uy;
}
function cloudD(x, z) {
  const C = U.uCloud.value, O = U.uCloudO.value;
  let px = (x + O.x) * CLOUD_F[0] + 3.7, py = (z + O.y) * CLOUD_F[1] + 1.9, s = 0, a = 0.5;
  for (let i = 0; i < 5; i++) { s += a * cnoise(px, py); px = px * 2.03 + 17.1; py = py * 2.03 + 9.2; a *= 0.5; }
  const t = Math.min(1, Math.max(0, (s - (1 - C.z)) / 0.16));
  return t * t * (3 - 2 * t);
}
// Light through the deck: to the ground (from above) or to the eye.
function cloudT(P, eye) {
  const C = U.uCloud.value;
  if (C.w < 0.5 || P.y <= C.x) return 1;
  const depth = D => Math.max(Math.min(P.y, C.x + C.y * D) - (C.x + 110 * (1 - D)), 0);
  if (!eye) { const D = cloudD(P.x, P.z); return 0.3 + 0.7 * Math.exp(-D * depth(D) * CLOUD_SIGMA); }
  const o = camera.position, vy = P.y - o.y, t = (0.5 * (C.x + Math.min(P.y, C.x + C.y)) - o.y) / vy;
  const D = cloudD(o.x + (P.x - o.x) * t, o.z + (P.z - o.z) * t);
  return Math.exp(-D * depth(D) * P.distanceTo(o) / vy * CLOUD_SIGMA);
}
/* ---------- end cloud deck ---------- */
const HEAD = `${LIGHTS_GLSL}\n${K2_NOISE}\n${CLOUD_GLSL}\n${K2_SKY}\n${K2_HAZE}`;

/* ---------- sky dome ---------- */
const sky = new THREE.Mesh(new THREE.SphereGeometry(15000, 32, 16), new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false,
  vertexShader: /* glsl */`varying vec3 vP; void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`varying vec3 vP; ${HEAD} void main() { gl_FragColor = vec4(k2sky(normalize(vP - cameraPosition)), 1.0); }`,
}));
sky.renderOrder = -1;
scene.add(sky);

// The deck: four stacked sheets; a sheet shows where its column reaches it.
const CU = { uLR: { value: new Array(LN).fill(0) }, uWarm: { value: new THREE.Vector3() }, uGlow: { value: 0.38 } };
const SHEETS = [500, 420, 345, 275];
const cloudGeo = new THREE.InstancedBufferGeometry().copy(new THREE.PlaneGeometry(30000, 16000).rotateX(Math.PI / 2).translate(0, 0, -7000));
// Top sheet first, so each lower sheet draws over the one above.
cloudGeo.setAttribute('aH', new THREE.InstancedBufferAttribute(new Float32Array(SHEETS), 1));
cloudGeo.instanceCount = SHEETS.length;
const cloud = new THREE.Mesh(cloudGeo, new THREE.ShaderMaterial({
  uniforms: { ...U, ...CU }, side: THREE.DoubleSide, transparent: true, depthWrite: false,
  // Premultiplied, like the smoke; the alpha channel stays the mirror's land mask.
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
  vertexShader: /* glsl */`attribute float aH; varying vec3 vP; varying float vK;
  void main() { vP = position + vec3(0.0, aH, 0.0); vK = aH * 0.01; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`varying vec3 vP; varying float vK; uniform float uLR[${LN}]; uniform vec3 uWarm; uniform float uGlow; ${HEAD}
  void main() {
    vec3 v = vP - cameraPosition;
    if (v.y < 1.0) discard;
    vec3 V = normalize(v);
    float fade = 1.0 - smoothstep(4000.0, 11000.0, length(v.xz));
    float D = cloudD(vP.xz);
    if (D * fade < 0.01) discard;
    vec2 c = cloudCol(D);
    float inside = smoothstep(c.x - 30.0, c.x + 30.0, vP.y) * (1.0 - smoothstep(c.y - 50.0, c.y + 10.0, vP.y));
    // Billows break each sheet into lumps; each sheet has its own.
    vec2 q = (vP.xz + uCloudO) * vec2(0.006, 0.009);

whenVisible(stage, vis => {
  visible = vis;
  // A hidden tab cancels pending sounds; the show resumes silent.
  if (!vis) { cancelAnimationFrame(raf); raf = 0; lastT = 0; stopAll(); return; }
  draw();
  wake();
});
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
onReducedChange(on => { starMat.uniforms.uSteady.value = on ? 1 : 0; SU.uDrift.value = on ? 0.5 : 1; wake(); });

/* Pointer: press grows a seed light; release launches; hold sets the calibre. */
let press = null;
const ndcOf = e => {
  const r = stage.getBoundingClientRect();
  return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
};
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture(e.pointerId);
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, at: performance.now(), ndc: ndcOf(e), charge: 0, seed: null, moved: false };
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  // After 8 px of travel the seed follows the pointer.
  if (!press.moved && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) press.moved = true;
  if (press.moved) press.ndc = ndcOf(e);
});
stage.addEventListener('pointerup', e => {
  if (!press || e.pointerId !== press.id) return;
  const held = (performance.now() - press.at) / 1000, ndc = press.ndc;
  press = null;
  // A tap is calibre 1; a hold reaches calibre 2 at 1.5 s.
  launch(ndc, held < 0.26 ? 1 : 1 + Math.min(1, held / 1.5));
});
const cancel = e => { if (press && e.pointerId === press.id) { press = null; wake(); } };
stage.addEventListener('pointercancel', cancel);
stage.addEventListener('lostpointercapture', cancel);
// Space launches a shell at a random point in the sky.
stage.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  launch(new THREE.Vector2((rnd() - 0.5) * 1.2, horizonNdc + (0.3 + rnd() * 0.55) * (0.92 - horizonNdc)), 1 + rnd() * 0.6);
});

/* ---------- bar ---------- */
function popover(box, btn) {
  const set = on => { box.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!box.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
document.getElementById('finale').addEventListener('click', finale);
// The stepper walks the shell list and wraps at each end.
const shellBox = document.getElementById('shell'), shellName = shellBox.querySelector('output');
let shellAt = Math.max(0, SHELL_LIST.findIndex(([id]) => id === opts.shell));
function stepShell(d) {
  shellAt = (shellAt + d + SHELL_LIST.length) % SHELL_LIST.length;
  const [id, name] = SHELL_LIST[shellAt];
  opts.shell = id; save('shell', id);
  shellName.textContent = name;
  if (!d) return;
  // The name slides in from the side of the pressed arrow.
  shellName.classList.remove('from-next', 'from-prev');
  void shellName.offsetWidth;
  shellName.classList.add(d > 0 ? 'from-next' : 'from-prev');
}
stepShell(0);
shellBox.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => stepShell(+b.dataset.step)));
// Left and right arrows step while the stepper has focus.
shellBox.addEventListener('keydown', e => {
  const d = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
  if (!d) return;
  e.preventDefault(); e.stopPropagation(); stepShell(d);
});
const distEl = document.getElementById('dist');
distEl.value = String(opts.dist);
distEl.addEventListener('input', () => { opts.dist = +distEl.value; save('dist', opts.dist); });
choices(document.getElementById('smoke'), val => { opts.smoke = val; save('smoke', val); SU.uSmokeK.value = val === 'thick' ? 1.15 : 0.75; }).set(opts.smoke);
SU.uSmokeK.value = opts.smoke === 'thick' ? 1.15 : 0.75;
const setSky = v => { opts.sky = v; U.uCloud.value.w = v === 'cloud' ? 1 : 0; cloud.visible = v === 'cloud'; };
choices(document.getElementById('sky'), v => { setSky(v); save('sky', v); updateLights(); draw(); }).set(opts.sky);
setSky(opts.sky);
choices(document.getElementById('water'), v => { water.material.uniforms.uRipple.value = v === 'ripple' ? 2 : 1; draw(); });

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  markReady();
  wake();
}, () => { canvas.classList.add('on'); markReady(); });

/* ---------- dev panel ---------- */
// ?dev opens a panel of look knobs; the backquote key toggles it.
const COOL = U.uCool.value.clone();
function applyFX() {
  bloomPass.strength = FX.bloom; bloomPass.radius = FX.bloomRadius; bloomPass.threshold = FX.bloomThreshold;
  flarePass.uniforms.uSt.value.set(FX.flare, FX.flareLength, FX.flareThin, FX.flareWarmth);
  flarePass.uniforms.uGh.value.set(FX.ghosts, FX.ghostSpread);
  U.uCloud.value.x = FX.cloudBase; U.uCloud.value.y = FX.cloudDepth; U.uCloud.value.z = FX.cloudCover;
  CU.uGlow.value = FX.cloudGlow;
  U.uCool.value.copy(COOL).multiplyScalar(FX.ambient);
  U.uHaze.value = FX.haze * 0.001;
  grade.uniforms.uVig.value = FX.vignette;
  grade.uniforms.uGrain.value = FX.grain;
  grade.uniforms.uTint.value.set(...POST.tint.map(v => v * FX.lift));
}
applyFX();
let devBox = null, devFrames = 0;
const devRender = composer.render.bind(composer);
composer.render = (...a) => { devFrames++; devRender(...a); };
function devPanel() {
  const css = document.createElement('style');
  css.textContent = `
  .fxdev { position: fixed; top: 12px; right: 12px; z-index: 50; width: 300px; max-width: calc(100vw - 24px); max-height: calc(100dvh - 24px); overflow: auto;
    padding: 10px 12px 12px; border-radius: 10px; background: oklch(0.14 0.012 275 / 0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: oklch(0.92 0.01 275); font: 500 12px/1.3 Gabarito, system-ui, sans-serif; box-shadow: 0 8px 30px oklch(0 0 0 / 0.5); }
  .fxdev[hidden] { display: none; }
  .fxdev header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .fxdev header b { flex: 1; font-size: 13px; letter-spacing: 0.04em; }
  .fxdev header output { color: oklch(0.65 0.02 275); font-variant-numeric: tabular-nums; }
  .fxdev button { font: inherit; color: inherit; background: oklch(0.24 0.015 275); border: 0; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  .fxdev button:hover { background: oklch(0.3 0.02 275); }
  .fxdev button[aria-pressed="true"] { background: oklch(0.82 0.13 80); color: oklch(0.16 0.012 275); }
  .fxdev .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .fxdev h3 { margin: 10px 0 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(0.65 0.02 275); }
  .fxdev label { display: grid; grid-template-columns: 82px 1fr 46px; align-items: center; gap: 8px; padding: 1px 0; }
  .fxdev label.mod span { color: oklch(0.84 0.13 80); }
  .fxdev input[type=range] { width: 100%; accent-color: oklch(0.82 0.13 80); }
  .fxdev input[type=number] { width: 46px; font: inherit; color: inherit; background: transparent; border: 0; text-align: right; font-variant-numeric: tabular-nums; }`;
  document.head.append(css);
  const box = document.createElement('aside');
  box.className = 'fxdev';
  box.setAttribute('aria-label', 'Look knobs');
  box.innerHTML = `<header><b>Look</b><output></output><button data-a="close" aria-label="Close">×</button></header>
    <div class="acts"><button data-q="standard">Standard</button><button data-q="high">High</button><button data-a="fire">Fire</button><button data-a="finale">Finale</button><button data-a="copy">Copy</button><button data-a="reset">Reset</button></div>
    ${FX_ROWS.map(([name, rows]) => `<h3>${name}</h3>` + rows.map(([k, label, , min, max, step]) =>
      `<label data-k="${k}"><span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}"><input type="number" min="${min}" max="${max}" step="${step}"></label>`).join('')).join('')}`;
  document.body.append(box);
  const fps = box.querySelector('header output');
  const show = () => {
    box.querySelectorAll('label[data-k]').forEach(l => {
      const k = l.dataset.k, [r, n] = l.querySelectorAll('input');
      r.value = n.value = FX[k];
      l.classList.toggle('mod', FX[k] !== FX_DEF[k]);
    });
    box.querySelectorAll('[data-q]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.q === quality())));
  };
  const store = () => { try { localStorage.setItem('stimming.fireworks.fx', JSON.stringify(changed())); } catch { /* storage is optional */ } };
  const changed = () => Object.fromEntries(Object.entries(FX).filter(([k, v]) => v !== FX_DEF[k]));
  const set = (k, v) => {
    FX[k] = v;
    applyFX();
    if (k === 'bloomScale') resize();
    updateLights(); draw(); store(); show();
  };
  box.addEventListener('input', e => {
    const l = e.target.closest('label[data-k]');
    if (l && e.target.value !== '') set(l.dataset.k, +e.target.value);
  });
  box.addEventListener('click', e => {
    const q = e.target.dataset.q, a = e.target.dataset.a;
    if (q) { setQuality(q); show(); }
    if (a === 'close') box.hidden = true;
    if (a === 'fire') launch(new THREE.Vector2((rnd() - 0.5) * 1.2, horizonNdc + (0.3 + rnd() * 0.55) * (0.92 - horizonNdc)), 1 + rnd() * 0.6);
    if (a === 'finale') finale();
    if (a === 'copy') navigator.clipboard?.writeText(JSON.stringify(changed(), null, 2));
    if (a === 'reset') { Object.assign(FX, FX_DEF); applyFX(); resize(); try { localStorage.removeItem('stimming.fireworks.fx'); } catch { /* storage is optional */ } show(); }
  });
  // Frames drawn per second; the loop sleeps when idle, so 0 is normal.
  setInterval(() => { if (!box.hidden) fps.textContent = `${devFrames * 2} fps · r${rung}`; devFrames = 0; }, 500);
  show();
  return box;
}
if (DEV) devBox = devPanel();
addEventListener('keydown', e => {
  if (e.key !== '`' || e.target.closest?.('input, textarea')) return;
  if (!devBox) devBox = devPanel(); else devBox.hidden = !devBox.hidden;
});
/* ---------- end dev panel ---------- */
</script>
</body>
</html>
