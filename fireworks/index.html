<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.14 0.014 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fireworks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Fireworks: shells over a dark bay at night. */
:root { --stage: oklch(0.1 0.015 265); }
.stage--fireworks canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--fireworks canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--fireworks canvas { transition: none; } }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.012 275 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Fireworks</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--fireworks" id="stage" tabindex="0" role="application" aria-label="A dark bay at night. Press the sky to launch a shell.">
      <p class="fail" hidden>Fireworks needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" id="shell" role="group" aria-label="Shell">
        <button class="chip" type="button" data-value="peony" aria-pressed="true">Peony</button>
        <button class="chip" type="button" data-value="willow" aria-pressed="false">Willow</button>
        <button class="chip" type="button" data-value="crossette" aria-pressed="false">Crossette</button>
        <button class="chip" type="button" data-value="ring" aria-pressed="false">Ring</button>
        <button class="chip" type="button" data-value="strobe" aria-pressed="false">Strobe</button>
      </div>
      <label class="slider"><span>Distance</span><input type="range" id="dist" min="0" max="1" step="0.01" value="0.5" aria-label="Distance: 300 to 1,500 metres"></label>
      <div class="actions">
        <button class="chip" id="finale" type="button">+ Finale</button>
      </div>
      <div class="edge">
        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings">
            <div class="group"><span>Smoke</span><div class="choices" id="smoke" role="group" aria-label="Smoke">
              <button class="chip" type="button" data-value="thin" aria-pressed="true">Thin</button>
              <button class="chip" type="button" data-value="thick" aria-pressed="false">Thick</button>
            </div></div>
            <div class="group"><span>Water</span><div class="choices" id="water" role="group" aria-label="Water">
              <button class="chip" type="button" data-value="calm" aria-pressed="true">Calm</button>
              <button class="chip" type="button" data-value="ripple" aria-pressed="false">Ripple</button>
            </div></div>
          </div>
        </div>
        <dl class="how" aria-label="How to play">
          <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>launch</dd></div>
          <div><dt>Hold</dt><dd>bigger shell</dd></div>
          <div class="fine"><dt><kbd>Space</kbd></dt><dd>shell</dd></div>
        </dl>
      </div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Fireworks</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createNoise2D } from 'simplex-noise';
import { initPage, choices, whenVisible, pixelRatio, onQuality, qualitySetting, linFit, reduced, onReducedChange } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

initPage({ id: 'fireworks' });
qualitySetting(document.getElementById('sets'));
const stage = document.getElementById('stage');

// Seeded random keeps the bay the same on every load.
let seed = 4242;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 1, 20000);
camera.position.set(0, 3, 0);
// Layer 1 holds what the water mirrors.
const LIGHT = 1;
const SHORE_Z = -2300;

/* ---------- burst lights ---------- */
// Eight burst lights; every lit shader reads this array.
const LN = 8;
const U = {
  uL: { value: Array.from({ length: LN }, () => new THREE.Vector4()) },
  uLC: { value: Array.from({ length: LN }, () => new THREE.Vector3()) },
  uLN: { value: 0 },
  uCool: { value: new THREE.Vector3(0.35, 0.45, 0.62) },
  uHaze: { value: 0.00045 },
  uHazeH: { value: 140 },
  uTime: { value: 0 },
};
const LIGHTS_GLSL = /* glsl */`
uniform vec4 uL[${LN}];
uniform vec3 uLC[${LN}];
uniform int uLN;
// Light that a point gets from every live burst; r sets the reach.
vec3 burstLit(vec3 P, float r) {
  vec3 s = vec3(0.0);
  for (int i = 0; i < ${LN}; i++) {
    if (i >= uLN) break;
    vec3 d = uL[i].xyz - P;
    s += uLC[i] * uL[i].w / (1.0 + dot(d, d) / (r * r));
  }
  return s;
}
// Glow that a view ray collects in the haze round each burst.
vec3 burstGlow(vec3 dir) {
  vec3 s = vec3(0.0);
  float up = max(dir.y, 0.0);
  for (int i = 0; i < ${LN}; i++) {
    if (i >= uLN) break;
    vec3 v = uL[i].xyz - cameraPosition;
    float dist = length(v);
    float c = dot(dir, v / dist) - 1.0;
    // A tight core, a mid halo, and a wide lift of the low haze.
    float g = 0.22 * exp(c * 2500.0) + 0.1 * exp(c * 60.0) + 0.05 * exp(c * 5.0) * exp(-up * 7.0);
    s += uLC[i] * uL[i].w * g * (900.0 / dist);
  }
  return s;
}`;
// Flash in 30 ms, fall with tau 0.35 s, then a glow tail with tau 1.5 s.
const flash = (age, rise = 0.03) => (age < 0 ? 0 : Math.min(1, age / rise) * (0.78 * Math.exp(-age / 0.35) + 0.22 * Math.exp(-age / 1.5)));
/* ---------- end burst lights ---------- */

/* ---------- K2: noise ---------- */
// Lifted from Night viaduct, Port.
const K2_NOISE = /* glsl */`
float k2hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float k2noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(k2hash(i), k2hash(i + vec2(1, 0)), u.x), mix(k2hash(i + vec2(0, 1)), k2hash(i + vec2(1, 1)), u.x), u.y);
}
float k2fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * k2noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s;
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: sky ---------- */
// Clear night sky: dark zenith, a cool low band, few faint stars.
// Port's cloud ceiling and amber dome are cut here.
const K2_SKY = /* glsl */`
uniform vec3 uCool;
float k2stars(vec3 dir) {
  vec2 q = vec2(atan(dir.x, -dir.z) * 260.0, dir.y * 260.0);
  vec2 i = floor(q), f = fract(q) - 0.5;
  float h = k2hash(i);
  // About one cell in two hundred holds a star.
  float on = step(0.995, h);
  vec2 o = vec2(k2hash(i + 7.1), k2hash(i + 3.3)) - 0.5;
  return on * exp(-dot(f - o * 0.6, f - o * 0.6) * 60.0) * (0.02 + 0.05 * k2hash(i + 1.7));
}
vec3 k2sky(vec3 dir) {
  float up = max(dir.y, 0.0);
  vec3 col = vec3(0.0016, 0.0021, 0.0045) + uCool * 0.016 * exp(-up * 9.0);
  col += vec3(0.85, 0.9, 1.0) * k2stars(dir) * smoothstep(0.03, 0.25, dir.y);
  return col + burstGlow(dir);
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: haze ---------- */
// Height haze along the view ray; burst light lifts its colour.
// Port's fog bank round the port is cut here.
const K2_HAZE = /* glsl */`
uniform float uHaze;
uniform float uHazeH;
float k2hazeAmount(vec3 P) {
  vec3 v = P - cameraPosition;
  float dist = length(v);
  float k = 1.0 / uHazeH;
  float h0 = max(cameraPosition.y, 0.0), h1 = max(P.y, 0.0), dh = h1 - h0;
  // Exponential height fog integrated along the ray.
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);
  return 1.0 - exp(-dist * uHaze * max(avg, 0.0));
}
vec3 k2hazeColor(vec3 dir) { return uCool * 0.01 + burstGlow(dir) * 0.8; }
vec3 k2haze(vec3 c, vec3 P) {
  return mix(c, k2hazeColor(normalize(P - cameraPosition)), k2hazeAmount(P));
}`;
/* ---------- end K2 ---------- */
const HEAD = `${LIGHTS_GLSL}\n${K2_NOISE}\n${K2_SKY}\n${K2_HAZE}`;

/* ---------- sky dome ---------- */
const sky = new THREE.Mesh(new THREE.SphereGeometry(15000, 32, 16), new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false,
  vertexShader: /* glsl */`varying vec3 vP; void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`varying vec3 vP; ${HEAD} void main() { gl_FragColor = vec4(k2sky(normalize(vP - cameraPosition)), 1.0); }`,
}));
sky.renderOrder = -1;
scene.add(sky);

/* ---------- ridge: one low far shore ---------- */
// A vertical strip whose top follows simplex noise.
const noise = createNoise2D(rnd);
function ridgeGeometry() {
  const N = 480, X0 = -9000, X1 = 9000, pos = [], uv = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const x = X0 + (X1 - X0) * (i / N);
    const top = 34 + 52 * (0.5 + 0.5 * noise(x * 0.00042, 0.3)) + 14 * noise(x * 0.0021, 4.1) + 4 * noise(x * 0.011, 9.7);
    const z = SHORE_Z + 120 * noise(x * 0.0004, 7.7);
    pos.push(x, -2, z, x, top, z);
    uv.push(i / N, 0, i / N, 1);
    if (i < N) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}
const ridge = new THREE.Mesh(ridgeGeometry(), new THREE.ShaderMaterial({
  uniforms: U, side: THREE.DoubleSide,
  vertexShader: /* glsl */`varying vec3 vP; varying float vH; void main() { vH = uv.y; vP = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`varying vec3 vP; varying float vH; ${HEAD}
  void main() {
    // Near-black land; burst light rims the crest.
    vec3 c = vec3(0.0009, 0.001, 0.0015);
    c += burstLit(vP, 700.0) * (0.05 + 0.9 * smoothstep(0.8, 1.0, vH));
    gl_FragColor = vec4(k2haze(c, vP), 1.0);
  }`,
}));
ridge.layers.enable(LIGHT);
scene.add(ridge);

/* ---------- village lights ---------- */
// Two small clusters of warm lamps at the water's edge.
const lamps = [];
for (const [cx, n, spread] of [[-1150, 9, 260], [620, 6, 160]]) {
  for (let i = 0; i < n; i++) {
    const x = cx + (rnd() - 0.5) * spread * 2;
    lamps.push({ x, y: 2 + rnd() * 9, z: SHORE_Z + 120 * noise(x * 0.0004, 7.7) + 40, k: 0.5 + rnd() * 0.8 });
  }
}
const SODIUM = linFit(0.8, 0.13, 72);
const lampGeo = new THREE.BufferGeometry();
lampGeo.setAttribute('position', new THREE.Float32BufferAttribute(lamps.flatMap(l => [l.x, l.y, l.z]), 3));
lampGeo.setAttribute('aK', new THREE.Float32BufferAttribute(lamps.map(l => l.k), 1));
const lampMat = new THREE.ShaderMaterial({
  uniforms: { ...U, uDpr: { value: 1 }, uCol: { value: new THREE.Vector3(...SODIUM) } },
  transparent: true, depthWrite: false,
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
  blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
  vertexShader: /* glsl */`attribute float aK; uniform float uDpr; varying float vK; varying vec3 vP;
  void main() { vK = aK; vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_PointSize = 3.0 * uDpr; }`,
  fragmentShader: /* glsl */`uniform vec3 uCol; varying float vK; varying vec3 vP; ${HEAD}
  void main() {
    vec2 q = gl_PointCoord - 0.5;
    float a = exp(-dot(q, q) * 18.0);
    gl_FragColor = vec4(uCol * vK * 2.2 * a * (1.0 - k2hazeAmount(vP) * 0.6), 0.0);
  }`,
});
const lampPts = new THREE.Points(lampGeo, lampMat);
lampPts.layers.enable(LIGHT);
scene.add(lampPts);

/* ---------- K6: burst particles ---------- */
// A ring buffer of star slots on one instanced streak quad.
// Each frame moves only uTime; a burst writes its stars once.
const CAP = 48000;
const G = new THREE.Vector3(0, -9.8, 0);
const RAMPS = [
  linFit(0.62, 0.24, 25), // strontium red
  linFit(0.75, 0.2, 150), // barium green
  linFit(0.6, 0.15, 255), // copper blue, dim on purpose
  linFit(0.82, 0.16, 80), // sodium gold
  linFit(0.97, 0.02, 90), // magnesium white
];
const EMBER = linFit(0.5, 0.17, 35);
const starGeo = new THREE.InstancedBufferGeometry();
// x runs tail (0) to head (1); y runs across the streak.
starGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, -1, 0, 1, -1, 0, 1, 1, 0, 0, 1, 0], 3));
starGeo.setIndex([0, 1, 2, 0, 2, 3]);
const slot = name => {
  const a = new THREE.InstancedBufferAttribute(new Float32Array(CAP * 4), 4);
  a.setUsage(THREE.DynamicDrawUsage);
  starGeo.setAttribute(name, a);
  return a;
};
const aA = slot('aA'), aB = slot('aB'), aC = slot('aC'), aD = slot('aD');
starGeo.instanceCount = 0;
const starMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: U.uTime, uRes: { value: new THREE.Vector2(1, 1) }, uDpr: { value: 1 }, uSteady: { value: reduced() ? 1 : 0 },
    uG: { value: G }, uRamp: { value: RAMPS.map(c => new THREE.Vector3(...c)) }, uEmber: { value: new THREE.Vector3(...EMBER) },
  },
  transparent: true, depthWrite: false,
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
  blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
  vertexShader: /* glsl */`
  attribute vec4 aA, aB, aC, aD;
  uniform float uTime, uDpr, uSteady;
  uniform vec2 uRes;
  uniform vec3 uG, uRamp[5], uEmber;
  varying vec3 vCol;
  varying vec2 vQ;
  // Linear drag, a = G - k v, in closed form: no stored state.
  vec3 starPos(vec3 p0, vec3 v0, float k, float t) {
    vec3 vt = uG / k;
    return p0 + vt * t + (v0 - vt) * (1.0 - exp(-k * t)) / k;
  }
  float hash11(float x) { return fract(sin(x * 12.9898) * 43758.5453); }
  void main() {
    float age = uTime - aA.w, life = aC.y;
    if (age < 0.0 || age > life) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    float f = age / life;
    vec3 head = starPos(aA.xyz, aB.xyz, aB.w, age);
    vec3 tail = starPos(aA.xyz, aB.xyz, aB.w, max(age - aC.z, 0.0));
    vec4 ch = projectionMatrix * viewMatrix * vec4(head, 1.0);
    vec4 ct = projectionMatrix * viewMatrix * vec4(tail, 1.0);
    vec2 d = (ch.xy / ch.w - ct.xy / ct.w) * uRes;
    float len = length(d);
    vec2 dir = len > 1e-3 ? d / len : vec2(0.0, 1.0);
    float w = aC.w * uDpr * (1.0 - 0.5 * f);
    vec4 c = position.x > 0.5 ? ch : ct;
    // Caps extend past both ends by the half-width.
    vec2 off = vec2(-dir.y, dir.x) * position.y * w + dir * (position.x * 2.0 - 1.0) * w;
    c.xy += off * 2.0 / uRes * c.w;
    gl_Position = c;
    vQ = vec2(position.x, position.y);
    // aD: x kind (1 strobe, 2 willow, 3 comet), y seed, w gain.
    vec3 chem = uRamp[int(aC.x + 0.5)];
    vec3 col = chem * 0.8;
    float b = 1.0 - smoothstep(0.75, 1.0, f);
    if (aD.x < 2.5) {
      // White-hot first, then the chemical colour, then an ember red.
      col = mix(vec3(1.0, 0.95, 0.85) * 1.6, chem, smoothstep(0.02, 0.12, f));
      col = mix(col, uEmber * 0.5, smoothstep(0.6, 1.0, f));
    }
    // Strobe stars blink at 12 Hz; reduced motion holds them steady.
    if (abs(aD.x - 1.0) < 0.5) b *= mix(step(0.45, hash11(aD.y + floor(age * 12.0))), 0.7, uSteady);
    if (abs(aD.x - 2.0) < 0.5) b *= 0.85 + 0.15 * hash11(aD.y + floor(age * 30.0));
    vCol = col * 4.0 * aD.w * b;
  }`,
  fragmentShader: /* glsl */`
  varying vec3 vCol;
  varying vec2 vQ;
  void main() {
    float a = exp(-vQ.y * vQ.y * 3.5) * (0.08 + 0.92 * vQ.x * vQ.x * vQ.x);
    gl_FragColor = vec4(vCol * a, 0.0);
  }`,
});
const stars = new THREE.Mesh(starGeo, starMat);
stars.frustumCulled = false;
stars.layers.enable(LIGHT);
scene.add(stars);
let head = 0, dirtyFrom = -1, dirtyN = 0, lastDeath = 0;
// Write one star into the next slot; the oldest slot gives way.
function writeStar(p0, t0, v0, k, ramp, life, trail, size, kind = 0, gain = 1) {
  const i = head;
  head = (head + 1) % CAP;
  if (dirtyFrom < 0) dirtyFrom = i;
  dirtyN = Math.min(CAP, dirtyN + 1);
  aA.setXYZW(i, p0.x, p0.y, p0.z, t0);
  aB.setXYZW(i, v0.x, v0.y, v0.z, k);
  aC.setXYZW(i, ramp, life, trail, size);
  aD.setXYZW(i, kind, rnd() * 100, 0, gain);
  starGeo.instanceCount = Math.max(starGeo.instanceCount, i + 1);
  lastDeath = Math.max(lastDeath, t0 + life);
}
// Upload only the slots a launch wrote; a wrap gives two ranges.
function commitStars() {
  if (dirtyFrom < 0) return;
  const a = dirtyFrom, n = dirtyN, run = Math.min(n, CAP - a);
  for (const at of [aA, aB, aC, aD]) {
    at.clearUpdateRanges();
    at.addUpdateRange(a * 4, run * 4);
    if (n > run) at.addUpdateRange(0, (n - run) * 4);
    at.needsUpdate = true;
  }

  if (e.code !== 'Space') return;
  e.preventDefault();
  launch(new THREE.Vector2((rnd() - 0.5) * 1.2, horizonNdc + (0.3 + rnd() * 0.55) * (0.92 - horizonNdc)), 1 + rnd() * 0.6);
});

/* ---------- bar ---------- */
function popover(box, btn) {
  const set = on => { box.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!box.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
choices(document.getElementById('shell'), val => { opts.shell = val; save('shell', val); }).set(opts.shell);
const distEl = document.getElementById('dist');
distEl.value = String(opts.dist);
distEl.addEventListener('input', () => { opts.dist = +distEl.value; save('dist', opts.dist); });
choices(document.getElementById('smoke'), () => {});
choices(document.getElementById('water'), v => { water.material.uniforms.uRipple.value = v === 'ripple' ? 2 : 1; draw(); });

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  markReady();
}, () => { canvas.classList.add('on'); markReady(); });
</script>
</body>
</html>
