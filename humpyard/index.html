<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.08 0.012 255); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hump yard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./main.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">
<style>
/* Hump yard: a shunting yard at night under floodlights. */
:root { --stage: oklch(0.08 0.012 255); }
.stage--humpyard { background: var(--stage); }
.stage--humpyard canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--humpyard canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--humpyard canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Hump yard</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--humpyard" id="stage" tabindex="0" role="application" aria-label="A railway shunting yard at night under sodium floodlights, seen from high behind the hump. A shunting engine pushes a freight train slowly up the hump. At the crest each cut of one to three wagons uncouples and rolls down on its own. Below, a ladder of seven switches splits the track into eight sorting tracks, each marked by a coloured lamp; every wagon carries a plate in the colour of its track. Retarders grip the wheels with a scream and a spray of sparks, and each cut couples onto the cuts already on its track with a clank. When the train is sorted, the new trains roll away into the dark and the next train comes. Click a switch to throw it, or a track to send the next cut there. Keys 1 to 8 route the next cut. A lets the yard throw the points by itself. The Hump speed slider sets how fast the engine pushes.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Hump yard</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
