<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.15 0.012 250); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wind map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Wind map: a chart with no land, and the wind drawn in silk. */
:root { --stage: oklch(0.17 0.015 250); }
.stage--windmap { cursor: crosshair; }
.stage--windmap canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--windmap canvas.on { opacity: 1; }
/* The chart layer draws over the wind and lets the pointer through. */
.stage--windmap canvas.chart { pointer-events: none; }
/* While + Cyclone is armed, the pointer reads as a placing tool. */
.stage--windmap.placing { cursor: cell; }
@media (prefers-reduced-motion: reduce) { .stage--windmap canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/windmap.svg)"></span><span class="intro-name">Wind map</span><span class="intro-sub">Stimming No. 34</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--windmap" id="stage" tabindex="0" role="application" aria-label="A wind chart with no land. Silk lines trace the wind. Circle to spin up a storm; tap for a gust.">
      <p class="fail" hidden>Wind map needs WebGL2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Wind map</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, audioKit, fitCanvas, whenVisible, reduced, onReducedChange, linFit, css, quality, onQuality } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });

const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.windmap.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.windmap.${k}`, String(v)); } catch { /* storage is optional */ } };
const opts = {
  look: saved('look') || 'silk',
  wind: saved('wind') != null ? +saved('wind') : 0.5,
  count: saved('count') || 'some',
  trail: saved('trail') || 'long',
  hemi: saved('hemi') || 'north',
  iso: saved('iso') === '1',
  chart: saved('chart') === '1',
  marks: saved('marks') === '1',
  proj: saved('proj') === 'globe' ? 'globe' : 'chart',
};
const GLOBE = () => opts.proj === 'globe';
const COUNT_OPTS = [{ value: 'few', label: 'Few' }, { value: 'some', label: 'Some' }, { value: 'many', label: 'Many' }];
// The shell builds the bar; settings rows persist under stimming.windmap.<id>.
const ui = initPage({ id: 'windmap', bar: {
  choice: { label: 'Look', value: opts.look, options: [
    { value: 'silk', label: 'Silk', dot: 'oklch(0.95 0.01 250)' },
    { value: 'heat', label: 'Heat', dot: 'oklch(0.8 0.15 110)' },
    { value: 'dye', label: 'Dye', dot: 'conic-gradient(oklch(0.78 0.13 20), oklch(0.78 0.13 140), oklch(0.78 0.13 260), oklch(0.78 0.13 20))' },
  ], onPick: v => setLook(v) },
  slider: { label: 'Wind', min: 0, max: 1, step: 0.01, value: opts.wind, onInput: v => setWind(v) },
  actions: [{ verb: 'add', noun: 'Cyclone', onPress: () => setPlacing(!placing) }, { verb: 'clear', onPress: () => clearAll() }],
  settings: [
    { type: 'choice', id: 'count', label: 'Particles', value: opts.count, options: COUNT_OPTS, persist: true, onPick: v => setCount(v) },
    { type: 'choice', id: 'trail', label: 'Trails', value: opts.trail, options: [{ value: 'short', label: 'Short' }, { value: 'long', label: 'Long' }], persist: true, onPick: v => { opts.trail = v; wake(); } },
    { type: 'choice', id: 'hemi', label: 'Hemisphere', value: opts.hemi, options: [{ value: 'north', label: 'North' }, { value: 'south', label: 'South' }], persist: true, onPick: v => { opts.hemi = v; wake(); } },
    { type: 'toggle', id: 'iso', label: 'Isobars', value: opts.iso, persist: true, onToggle: on => { opts.iso = on; render(); wake(); } },
    { type: 'toggle', id: 'chart', label: 'Chart', value: opts.chart, persist: true, onToggle: on => { opts.chart = on; render(); wake(); } },
    { type: 'toggle', id: 'marks', label: 'Marks', value: opts.marks, persist: true, onToggle: on => { opts.marks = on; render(); wake(); } },
    { type: 'choice', id: 'proj', label: 'Projection', value: opts.proj, options: [{ value: 'chart', label: 'Chart' }, { value: 'globe', label: 'Globe' }], persist: true, onPick: v => setProj(v) },
  ],
  quality: true,
  keys: [['drag', 'circle to spin a storm'], ['click', 'gust'], ['hold', 'high'], ['space', 'cyclone']],
} });
let reduce = reduced();
onReducedChange(v => { reduce = v; wake(); });

// State texture sizes per Particles setting.
const COUNTS = { few: [128, 128], some: [256, 128], many: [256, 256] };
// Trail decay times in seconds.
const TRAILS = { short: 0.6, long: 2.5 };
// Reduced motion keeps trails long and slows particles to 40 %.
const tau = () => (reduce ? TRAILS.long : TRAILS[opts.trail]);
const pace = () => (reduce ? 0.4 : 1);
// The base wind in world units per second.
const windU = () => lerp(0.025, 0.16, opts.wind);
// Speed at the top of the colour ramp, in world units per second.
const VREF = 0.3;
// Particles live 2 to 6 s; Dye lives 6 to 14 s, so the mixing shows.
const lifeSpan = () => (opts.look === 'dye' ? [6, 8] : [2, 4]);
// Twelve storms live at once; four more slots let the weakest fade out.
const MAXV = 16, MAXLIVE = 12, MAXG = 4, MAXJ = 4;
// A high's top circulation, and its outflow per unit of circulation.
const HIGH_G = 0.08, HIGH_Q = 1.33;
// Jet core speed in world units per second, and its half-width.
const JET_V = 0.35, JET_W = 0.04;

/* ---------- WebGL2 ---------- */
const stage = document.getElementById('stage');
const canvas = document.createElement('canvas');
canvas.setAttribute('aria-hidden', 'true');
stage.prepend(canvas);
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
const fail = () => { stage.querySelector('.fail').hidden = false; ui.hideControls?.(); markReady(); throw new Error('no webgl2'); };
if (!gl) fail();
// Float targets hold particle state and smooth trails.
const FLOAT = !!gl.getExtension('EXT_color_buffer_float');
// Without them, a smaller swarm moves on the CPU over a velocity grid.
const CPU = !FLOAT;

const QUAD_VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

/* ---------- K1: accumulation and decay ---------- */
// Copied from Star trails; Kelvin dropper can copy SEG_TEX_VS from here.
// Two float targets ping-pong; each frame fades the plate by exp(-dt/tau).
const DECAY = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform float uK, uEps; in vec2 vUv; out vec4 o;
void main() { vec4 c = texture(uSrc, vUv) * uK; o = max(c - uEps, 0.0); }`;
// A segment draws as a soft line with ramped ends.
// Adjacent segments overlap their ramps, so joins add up to one.
const SEG_VS = `#version 300 es
in vec2 aCorner; in vec4 aSeg; in vec4 aCol;
uniform vec2 uRes;
out vec2 vP; flat out vec4 vSeg; flat out vec4 vCol;
void main() {
  vec2 a = aSeg.xy, b = aSeg.zw; float w = aCol.a;
  vec2 d = b - a; float L = length(d);
  vec2 t = L > 1e-3 ? d / L : vec2(1, 0), n = vec2(-t.y, t.x);
  float r = w * 3.0 + 1.0;
  vec2 p = mix(a, b, aCorner.x * 0.5 + 0.5) + t * aCorner.x * r + n * aCorner.y * r;
  vP = p; vSeg = aSeg; vCol = aCol;
  gl_Position = vec4(p / uRes * 2.0 - 1.0, 0.0, 1.0);
}`;
// GPU particles: point a is the old state, point b the new state.
// Each instance reads its own texel; a respawn draws nothing.
const SEG_TEX_VS = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 aCorner;
uniform sampler2D uA, uB, uRamp;
uniform int uTW; uniform vec2 uRes; uniform float uScale, uW, uGain, uDt, uVRef, uDye, uPass;
out vec2 vP; flat out vec4 vSeg; flat out vec4 vCol;
void main() {
  ivec2 ij = ivec2(gl_InstanceID % uTW, gl_InstanceID / uTW);
  vec4 sa = texelFetch(uA, ij, 0), sb = texelFetch(uB, ij, 0);
  // A respawn resets the age, so the new age is below the old one.
  if (sb.z <= sa.z || uDt <= 0.0) { gl_Position = vec4(-2.0, -2.0, 0.0, 1.0); return; }
  // A step across the globe's seam unwraps beside the old point.
  // The second pass draws the same step again beside the new point.
  vec2 wa = sa.xy, wb = sb.xy;
  float jump = wb.x - wa.x, crosses = step(1.0, abs(jump));
  wb.x -= 2.0 * sign(jump) * crosses;
  if (uPass > 0.5) {
    if (crosses < 0.5) { gl_Position = vec4(-2.0, -2.0, 0.0, 1.0); return; }
    wa.x += 2.0 * sign(jump); wb.x += 2.0 * sign(jump);
  }
  vec2 a = wa * uScale, b = wb * uScale; float w = uW;
  float life = mod(sb.w, 16.0), dye = floor(sb.w / 16.0) / 255.0;
  float sp = clamp(length(wb - wa) / uDt / uVRef, 0.0, 1.0);
  // The ramp row holds colour by speed; Dye reads it by spawn hue.
  vec3 rgb = texture(uRamp, vec2(mix(sp, dye, uDye), 0.5)).rgb * mix(1.0, 0.25 + 0.75 * sqrt(sp), uDye);
  float env = smoothstep(0.0, 0.5, sb.z) * smoothstep(life, life - 0.8, sb.z);
  // A few bright threads stand out over many faint ones.
  float h = fract(sin(float(gl_InstanceID) * 12.9898) * 43758.5453);
  env *= 0.12 + 3.0 * h * h * h * h * h * h;
  vec2 d = b - a; float L = length(d);
  // Short segments overlap, so they carry less energy each.
  // A still particle draws nothing, so stagnant air stays dark.
  float e = uGain * env * clamp(L / (2.0 * w), 0.0, 1.0);
  vec2 t = L > 1e-3 ? d / L : vec2(1, 0), n = vec2(-t.y, t.x);
  float r = w * 3.0 + 1.0;
  vec2 p = mix(a, b, aCorner.x * 0.5 + 0.5) + t * aCorner.x * r + n * aCorner.y * r;
  vP = p; vSeg = vec4(a, b); vCol = vec4(rgb * e, w);
  gl_Position = vec4(p / uRes * 2.0 - 1.0, 0.0, 1.0);
}`;
const SEG_FS = `#version 300 es
precision highp float;
in vec2 vP; flat in vec4 vSeg; flat in vec4 vCol; out vec4 o;
void main() {
  vec2 a = vSeg.xy, b = vSeg.zw; float w = vCol.a;
  vec2 d = b - a; float L = length(d);
  float k;
  if (L < 0.05) { float r = length(vP - a) / w; k = exp(-r * r); }
  else {
    vec2 t = d / L; float s = dot(vP - a, t); float q = dot(vP - a, vec2(-t.y, t.x)) / w;
    float h = w * 1.2;
    k = exp(-q * q) * clamp((s + h) / (2.0 * h), 0.0, 1.0) * clamp((L + h - s) / (2.0 * h), 0.0, 1.0);
  }
  o = vec4(vCol.rgb * k, 1.0);
}`;

function program(vs, fs, attrs) {
  const p = gl.createProgram();
  [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(([type, src]) => {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(sh)); fail(); }
    gl.attachShader(p, sh);
  });
  attrs.forEach((name, i) => gl.bindAttribLocation(p, i, name));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); fail(); }
  const u = {};
  // Array uniforms answer to their bare name.
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(p, i).name; u[n.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, n); }
  return { p, u };
}

const corners = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
const quadVao = gl.createVertexArray();
gl.bindVertexArray(quadVao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, corners, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// Segment data: a.xy, b.xy in pixels, then rgb energy and width.
// The CPU path fills it; the GPU path reads textures instead.
const MAXSEG = 8000;
const inst = new Float32Array(MAXSEG * 8);
const segVao = gl.createVertexArray();
gl.bindVertexArray(segVao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, corners, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const instBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
gl.bufferData(gl.ARRAY_BUFFER, inst.byteLength, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(1);
gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 0);
gl.vertexAttribDivisor(1, 1);
gl.enableVertexAttribArray(2);
gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16);
gl.vertexAttribDivisor(2, 1);
gl.bindVertexArray(null);

function target(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (FLOAT) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
  [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fb, w, h };
}
const drop = t => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); };
let acc = [], ai = 0;
const clearAcc = () => acc.forEach(a => { gl.bindFramebuffer(gl.FRAMEBUFFER, a.fb); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); });

function decayPass(dt) {
  const src = acc[ai], dst = acc[1 - ai];
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, dst.w, dst.h);
  gl.useProgram(P.decay.p); gl.bindVertexArray(quadVao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(P.decay.u.uSrc, 0);
  gl.uniform1f(P.decay.u.uK, Math.exp(-dt / tau()));
  gl.uniform1f(P.decay.u.uEps, FLOAT ? 0.0004 * dt : 0.6 / 255);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ai = 1 - ai;
}
function segPass(dst, count) {
  if (!count) return;
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, dst.w, dst.h);
  gl.useProgram(P.seg.p); gl.bindVertexArray(segVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst, 0, count * 8);
  gl.uniform2f(P.seg.u.uRes, dst.w, dst.h);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
  gl.disable(gl.BLEND);
}
/* ---------- end K1 ---------- */

/* ---------- the field ---------- */
// Simplex noise 3D: Ian McEwan, Ashima Arts, and Stefan Gustavson.
// Copyright (C) 2011 Ashima Arts. MIT License.
// https://github.com/ashima/webgl-noise and https://github.com/stegu/webgl-noise
const SNOISE = `
vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v) {
  const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0) * 2.0 + 1.0;
  vec4 s1 = floor(b1) * 2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x), p1 = vec3(a0.zw, h.y), p2 = vec3(a1.xy, h.z), p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
}`;
// The base stream function is noise in two octaves.
// Velocity is its curl, so the flow has no divergence.
// Each vortex is Lamb-Oseen, with a small inflow near the eye.
const FIELD = `
const float HIGH_G = ${HIGH_G.toFixed(4)}, HIGH_Q = ${HIGH_Q.toFixed(4)}, JET_V = ${JET_V.toFixed(4)}, JET_W = ${JET_W.toFixed(4)};
uniform float uU, uA, uT, uWrap;
uniform vec4 uVort[${MAXV}]; uniform int uNV;
uniform vec4 uGust[${MAXG}]; uniform int uNG;
uniform vec4 uJet[${MAXJ * 8}]; uniform int uNJ;
${SNOISE}
// On the globe x wraps at 2, so offsets take the short way round.
vec2 wd(vec2 d) { if (uWrap > 0.5) d.x -= 2.0 * floor(d.x * 0.5 + 0.5); return d; }
// Nearest segment of jet j: distance, unit tangent, signed normal distance,
// and how far the point lies beyond the jet's ends.
void jetAt(vec2 p, int j, out float best, out vec2 tb, out float sd, out float over) {
  best = 1e9; tb = vec2(1.0, 0.0); sd = 0.0; over = 0.0;
  for (int i = 0; i < 7; i++) {
    vec2 a = uJet[j * 8 + i].xy, ab = uJet[j * 8 + i + 1].xy - a, pa = wd(p - a);
    float la = max(length(ab), 1e-6), hr = dot(pa, ab) / (la * la), h = clamp(hr, 0.0, 1.0);
    vec2 dd = pa - ab * h; float dl = length(dd);
    if (dl < best) {
      best = dl; tb = ab / la;
      // The along-line offset, not the endpoint distance, sets the side.
      sd = dot(pa - ab * hr, vec2(-tb.y, tb.x));
      over = i == 0 ? max(0.0, -hr) * la : (i == 6 ? max(0.0, hr - 1.0) * la : 0.0);
    }
  }

/* ---------- size ---------- */
// On High the first rung falls back to Standard, not to 1x.
function fitStage() {
  if (!rung) return fitCanvas(canvas, { budget: 2.2e6 });
  return quality() === 'high' ? fitCanvas(canvas, { budget: 2.2e6, quality: 'standard' }) : fitCanvas(canvas, { budget: 2.2e6, maxDpr: 1 });
}
// keep skips the storm rescale; a projection switch places storms itself.
function resize(force = false, keep = false) {
  const fit = fitStage();
  if (fit.W === W && fit.H === H && acc.length && !force) return;
  W = fit.W; H = fit.H; dpr = fit.dpr;
  const wx = AX, wy = AY;
  S = Math.min(W, H);
  if (GLOBE()) {
    // The globe's plate is a 2 to 1 map; watchdog rung 1 halves it.
    AX = 2; AY = 1; PW = rung >= 1 ? 1024 : 2048; PH = PW / 2; PS = PW / 2;
  } else { AX = W / S; AY = H / S; PW = W; PH = H; PS = S; }
  areaK = clamp((W / dpr) * (H / dpr) / (1250 * 680), 0.15, 1);
  acc.forEach(drop);
  acc = [target(PW, PH), target(PW, PH)]; ai = 0;
  // The globe's plate wraps east to west, so the seam samples clean.
  acc.forEach(a => { gl.bindTexture(gl.TEXTURE_2D, a.tex); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, GLOBE() ? gl.REPEAT : gl.CLAMP_TO_EDGE); });
  if (frame) drop(frame);
  frame = target(W, H);
  chart.canvas.width = W; chart.canvas.height = H;
  makeBloom();
  // Storms keep their place relative to the frame width.
  if (!keep && !GLOBE()) vortices.forEach(v => { v.x *= AX / wx; v.y *= AY / wy; });
  cpu.at = -1;
  if (!seeded) { seedState(); seedCyclone(); seeded = true; }
  preroll(ready ? 1 : 3);
  if (ready) { render(); wake(); }
}

/* ---------- bar ---------- */
function setLook(v) { opts.look = v; save('look', v); bakeRamp(); wake(); }
function setWind(v) { opts.wind = v; save('wind', v); wake(); }
function setCount(v) { opts.count = v; seedState(); clearAcc(); preroll(1); render(); wake(); }
function clearAll() { vortices.forEach(v => { v.dying = true; v.held = false; }); gusts.length = 0; jets.length = 0; clearAcc(); wake(); }
// + Cyclone arms placement: each tap on the map drops a storm there.
// It stays armed until + Cyclone is pressed again or Escape.
let placing = false, hoverW = null;
const addChip = () => [...document.querySelectorAll('.stim-ui .s2-chip')].find(b => /cyclone/i.test(b.textContent));
function setPlacing(on) {
  placing = on;
  addChip()?.setAttribute('aria-pressed', String(on));
  stage.classList.toggle('placing', on);
}
addEventListener('keydown', e => { if (e.key === 'Escape' && placing) setPlacing(false); });
// A placed storm spins the hemisphere's way; a ring marks the spot at once.
function placeCyclone(w) {
  spawnCyclone(w[0], w[1], (0.12 + 0.05 * Math.random()) * spin(), 0.045 + 0.015 * Math.random());
  flash(w[0], w[1], 'merge');
  wake();
}
// Space with no pointer on the map finds open air instead.
function addCyclone() {
  let best = null, room = -1;
  for (let k = 0; k < 12; k++) {
    // Candidates come from the visible stage, so the globe's far side is skipped.
    const w = pxToWorld(W * (0.2 + 0.6 * Math.random()), H * (0.2 + 0.6 * Math.random()));
    if (!w) continue;
    const d = live().reduce((m, v) => Math.min(m, Math.hypot(wdx(v.x - w[0]), v.y - w[1])), 9);
    if (d > room) { room = d; best = w; }
  }
  if (!best) return;
  spawnCyclone(best[0], best[1], (0.12 + 0.05 * Math.random()) * spin(), 0.045 + 0.015 * Math.random());
  wake();
}

/* ---------- input ---------- */
// The press start sorts the gesture: a core is grabbed, open air waits.
// Open air: 8 px of travel spins a storm; 260 ms still builds a high.
// A spin that ends straight and long becomes a jet; a bare release is a gust.
let press = null;
// Pointer to world; null off the globe's disc.
function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  return pxToWorld((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
}
// Device pixels per CSS pixel, for the globe's hand turn.
const devPx = () => W / Math.max(1, canvas.getBoundingClientRect().width);
const HOLD_MS = 260;
function startSpin() {
  const p = press;
  p.mode = 'spin';
  p.v = spawnCyclone(p.w0[0], p.w0[1], 0, 0.045, true);
  p.c = [p.v.x, p.v.y]; p.r = 0.05; p.wl = p.w0; p.tl = performance.now();
  p.path = [p.w0];
}
function startHigh() {
  const p = press;
  p.mode = 'high';
  p.v = spawnHigh(p.w0[0], p.w0[1]);
  highDrone(true);
}
// Each move adds the angle the pointer swept around the seed.
function feed(w, now) {
  const p = press, v = p.v;
  const rx = wdx(p.wl[0] - v.x), ry = p.wl[1] - v.y, r2 = rx * rx + ry * ry;
  const dx = wdx(w[0] - p.wl[0]), dy = w[1] - p.wl[1];
  if (r2 > 0.015 * 0.015) {
    const dth = (rx * dy - ry * dx) / r2;
    v.g = clamp(v.g + 0.013 * dth, -G_MAX, G_MAX);
  }
  // The centre eases toward the middle of the drawn path.
  const k = 1 - Math.exp(-(now - p.tl) / 1500);
  p.c[0] = wrapX(p.c[0] + wdx(w[0] - p.c[0]) * k); p.c[1] += (w[1] - p.c[1]) * k;
  v.x = wrapX(v.x + wdx(p.c[0] - v.x) * 0.5); v.y += (p.c[1] - v.y) * 0.5;
  // Tight circles make a tight core.
  p.r += (Math.sqrt(r2) - p.r) * Math.min(1, k * 2);
  v.rc = clamp(p.r * 0.7, 0.04, 0.1);
  p.wl = w; p.tl = now;
  // The path stays continuous across the seam.
  const last = p.path[p.path.length - 1];
  p.path.push([last[0] + wdx(w[0] - last[0]), w[1]]);
}
// A grabbed storm or high follows the pointer; its speed is smoothed over 0.1 s.
function drag(w, now) {
  const p = press, v = p.v, dt = Math.max(1e-3, (now - p.tl) / 1000);
  if (p.mode === 'grab') {
    const k = 1 - Math.exp(-dt / 0.1);
    p.vel[0] += (wdx(w[0] - p.wl[0]) / dt - p.vel[0]) * k;
    p.vel[1] += ((w[1] - p.wl[1]) / dt - p.vel[1]) * k;
  }
  v.x = wrapX(w[0] + p.off[0]); v.y = w[1] + p.off[1];
  p.wl = w; p.tl = now;
}
// Straight, long and spin-free: the drag paints a jet.
function isJet(p) {
  const P = p.path;
  if (P.length < 3 || Math.abs(p.v.g) >= 0.03) return false;
  let len = 0;
  for (let i = 1; i < P.length; i++) len += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
  const chord = Math.hypot(P[P.length - 1][0] - P[0][0], P[P.length - 1][1] - P[0][1]);
  return len >= 0.25 && chord / len >= 0.85;
}
function endPress(tap) {
  const p = press;
  if (!p) return;
  press = null;
  if (p.mode === 'spin') {
    if (tap && isJet(p)) {
      vortices.splice(vortices.indexOf(p.v), 1);
      addJet(p.path);
      jetSweep(p.path);
    } else p.v.held = false;
  } else if (p.mode === 'grab') {
    p.v.held = false;
    // A throw caps at 0.5 world/s, so a storm stays on the chart.
    // A hand that rests 80 ms before release places the storm, not throws it.
    if (performance.now() - p.tl >= 80) p.vel = [0, 0];
    const sp = Math.hypot(...p.vel), k = sp > 0.5 ? 0.5 / sp : 1;
    if (tap) { p.v.vx = p.vel[0] * k; p.v.vy = p.vel[1] * k; if (sp > 0.15) whoosh(p.v.x, 1.6); }
  } else if (p.mode === 'high') {
    p.v.held = false;
    highDrone(false);
  } else if (p.mode === 'turn') {
    // A release carries the turn on, slowing with tau 1.5 s.
    // A hand that rests 80 ms before release throws nothing.
    const fresh = performance.now() - p.tl < 80, cap = v => clamp(v, -1.5, 1.5);
    if (tap && fresh) { globe.vy = cap(p.tv[0]); globe.vp = cap(p.tv[1]); }
  } else if (tap) {
    if (placing) placeCyclone(p.w0); else gust(p.w0[0], p.w0[1]);
  }
  wake();
}
// The hold timer runs on frame time, so it stays in step with the sim.
function checkHold(now) {
  if (press?.mode === 'press' && now - press.t0 >= HOLD_MS) startHigh();
}
stage.addEventListener('pointerdown', e => {
  if (e.button > 0 || press) return;
  try { stage.setPointerCapture(e.pointerId); } catch { /* synthetic pointers cannot capture */ }
  const w = toWorld(e), now = performance.now();
  press = { id: e.pointerId, x0: e.clientX, y0: e.clientY, hx: e.clientX, hy: e.clientY, w0: w, wl: w, tl: now, t0: now, mode: 'press' };
  // Off the globe's disc, a drag turns the globe.
  if (!w) { Object.assign(press, { mode: 'turn', xl: e.clientX, yl: e.clientY, tv: [0, 0] }); globe.vy = globe.vp = 0; wake(); return; }
  // A press inside a storm's core, or a high's calm centre, grabs it.
  const core = live().find(v => Math.hypot(wdx(v.x - w[0]), v.y - w[1]) < Math.max(0.03, 1.5 * v.rc));
  if (core) {
    Object.assign(press, { mode: 'grab', v: core, off: [core.x - w[0], core.y - w[1]], vel: [0, 0] });
    core.held = true; core.vx = core.vy = 0;
  }
  wake();
});
stage.addEventListener('pointermove', e => {
  // Space drops a storm under a hovering pointer.
  if (e.pointerType === 'mouse') hoverW = toWorld(e);
  if (!press || e.pointerId !== press.id) return;
  const now = performance.now();
  if (press.mode === 'turn') {
    // The surface follows the hand: a drag left brings the east into view.
    const dt = Math.max(1e-3, (now - press.tl) / 1000), r = discR() / devPx();
    const dyaw = -(e.clientX - press.xl) / r, dpitch = (e.clientY - press.yl) / r;
    globe.yaw += dyaw; globe.pitch = clamp(globe.pitch + dpitch, -Math.PI / 3, Math.PI / 3);
    // The throw speed is smoothed over about 0.1 s.
    const k = 1 - Math.exp(-dt / 0.1);
    press.tv = [press.tv[0] + (dyaw / dt - press.tv[0]) * k, press.tv[1] + (dpitch / dt - press.tv[1]) * k];
    press.xl = e.clientX; press.yl = e.clientY; press.tl = now;
    wake(); return;
  }
  let w = toWorld(e);
  // A drag that slips off the disc keeps its last point on the globe.
  if (!w) w = press.wl;
  if (press.mode === 'press') {
    // Only a still press builds a high: 3 px of travel restarts the hold.
    if (Math.hypot(e.clientX - press.hx, e.clientY - press.hy) > 3) { press.t0 = now; press.hx = e.clientX; press.hy = e.clientY; }
    checkHold(now);
    if (press.mode === 'press' && Math.hypot(e.clientX - press.x0, e.clientY - press.y0) > 8) startSpin();
  }
  if (press.mode === 'spin') feed(w, now);
  else if (press.mode === 'grab') drag(w, now);
  else if (press.mode === 'high') { press.off ||= [0, 0]; drag(w, now); }
  wake();
});
stage.addEventListener('pointerup', e => { if (press && e.pointerId === press.id) endPress(true); });
stage.addEventListener('pointercancel', () => endPress(false));
stage.addEventListener('pointerleave', () => { hoverW = null; });
stage.addEventListener('lostpointercapture', () => endPress(false));
stage.addEventListener('keydown', e => {
  wake();
  if (e.key !== ' ') return;
  e.preventDefault();
  if (!e.repeat) { if (hoverW) placeCyclone(hoverW); else addCyclone(); }
});

/* ---------- start ---------- */
bakeRamp();
new ResizeObserver(() => resize()).observe(stage);
// A new quality choice clears the ladder.
onQuality(() => { rung = 0; runT = 0; resize(true); });
resize();
render();
gl.finish();
ready = true;
markReady();
requestAnimationFrame(() => canvas.classList.add('on'));
whenVisible(stage, v => { visible = v; if (v) resume(); else hush(); });
wake();
</script>
</body>
</html>
