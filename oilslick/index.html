<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.13 0.01 250); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oil slick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Oil slick: one dark puddle under a thin film of oil. */
:root { --stage: oklch(0.08 0.008 250); }
.stage--oilslick { cursor: crosshair; }
.stage--oilslick canvas { touch-action: none; }
.stage--oilslick canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--oilslick canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--oilslick canvas { transition: none; } }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.01 250 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Oil slick</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--oilslick" id="stage" tabindex="0" role="application" aria-label="A dark puddle under a thin film of oil. Drag to swirl the rainbow bands; hold to thin the film.">
      <p class="fail" hidden>Oil slick needs WebGL2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" id="sky" role="group" aria-label="Sky">
        <button class="chip" type="button" data-value="grey" aria-pressed="true"><span class="dot" style="background:oklch(0.82 0.02 240)"></span>Grey</button>
        <button class="chip" type="button" data-value="dusk" aria-pressed="false"><span class="dot" style="background:oklch(0.72 0.13 50)"></span>Dusk</button>
        <button class="chip" type="button" data-value="lamp" aria-pressed="false"><span class="dot" style="background:oklch(0.86 0.09 85)"></span>Lamp</button>
      </div>
      <label class="slider"><span>Film</span><input type="range" id="film" min="0" max="1" step="0.01" value="0.45" aria-label="Film: thin to thick"></label>
      <div class="actions">
        <button class="chip" id="drop" type="button">+ Drop</button>
        <button class="chip" id="shuffle" type="button"><svg viewBox="0 0 16 16" aria-hidden="true" width="14" height="14" style="vertical-align:-2px;margin-right:5px"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5.6" cy="5.6" r="1.1" fill="currentColor"/><circle cx="10.4" cy="10.4" r="1.1" fill="currentColor"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/></svg>Shuffle</button>
        <button class="chip" id="clear" type="button">Clear</button>
      </div>
      <div class="edge">
        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings"></div>
        </div>
        <dl class="how" aria-label="How to play">
          <div><dt>Drag</dt><dd>swirl the bands</dd></div>
          <div><dt>Hold</dt><dd>thin the film</dd></div>
          <div><dt>+ Drop</dt><dd>add oil</dd></div>
        </dl>
      </div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Oil slick</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, choices, fitCanvas, whenVisible, reduced, onReducedChange, linFit, quality, qualitySetting, onQuality, audioKit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });
initPage({ id: 'oilslick' });
// Settings holds the site-wide Quality choice.
qualitySetting(document.getElementById('sets'));

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
let reduce = reduced();
onReducedChange(v => { reduce = v; });

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.oilslick.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.oilslick.${k}`, String(v)); } catch { /* storage is optional */ } };
const opts = {
  sky: saved('sky') || 'grey',
  film: saved('film') != null ? +saved('film') : 0.45,
};
// Each sky: a key glow, a fill and the key's size.
const SKIES = {
  grey: { key: [0.96, 0.015, 240], keyI: 2.4, fill: [0.55, 0.03, 245], fillI: 0.1, size: 2.4 },
  dusk: { key: [0.82, 0.12, 55], keyI: 2.6, fill: [0.45, 0.1, 295], fillI: 0.14, size: 2.2 },
  lamp: { key: [0.93, 0.07, 80], keyI: 4.0, fill: [0.3, 0.04, 255], fillI: 0.05, size: 4.0 },
};
// The first slick: one seed and a vortex pair from an old drag.
const slick = { seed: 11, swA: [-0.3, 0.1], swB: [-0.08, -0.12] };

/* ---------- spectrum ---------- */
// Sixteen wavelengths span the visible band.
const NS = 16;
const LAM = Float32Array.from({ length: NS }, (_, i) => 400 + i * 20);
// Two-sided gaussians fit the CIE 1931 matching curves.
const g = (l, m, a, b) => { const t = (l - m) / (l < m ? a : b); return Math.exp(-0.5 * t * t); };
const cmf = l => [
  1.056 * g(l, 599.8, 37.9, 31.0) + 0.362 * g(l, 442.0, 16.0, 26.7) - 0.065 * g(l, 501.1, 20.4, 26.2),
  0.821 * g(l, 568.8, 46.9, 40.5) + 0.286 * g(l, 530.9, 16.3, 31.1),
  1.217 * g(l, 437.0, 11.8, 36.0) + 0.681 * g(l, 459.0, 26.0, 13.8),
];
// Each wavelength gets a linear sRGB weight; a flat spectrum sums to white.
const WEIGHTS = (() => {
  const w = new Float32Array(NS * 3), sum = [0, 0, 0];
  for (let i = 0; i < NS; i++) {
    const [X, Y, Z] = cmf(LAM[i]);
    const rgb = [3.2406 * X - 1.5372 * Y - 0.4986 * Z, -0.9689 * X + 1.8758 * Y + 0.0415 * Z, 0.0557 * X - 0.204 * Y + 1.057 * Z];
    for (let c = 0; c < 3; c++) { w[i * 3 + c] = rgb[c]; sum[c] += rgb[c]; }
  }
  for (let i = 0; i < NS; i++) for (let c = 0; c < 3; c++) w[i * 3 + c] /= sum[c];
  return w;
})();

/* ---------- WebGL2 ---------- */
const stage = document.getElementById('stage');
const canvas = document.createElement('canvas');
canvas.setAttribute('aria-hidden', 'true');
stage.prepend(canvas);
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
const fail = () => { stage.querySelector('.fail').hidden = false; markReady(); throw new Error('no webgl2'); };
if (!gl) fail();
if (!gl.getExtension('EXT_color_buffer_float') && !gl.getExtension('EXT_color_buffer_half_float')) fail();
function renderable(fmt) {
  const t = gl.createTexture(), fb = gl.createFramebuffer();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, 1, fmt, 4, 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(fb); gl.deleteTexture(t);
  return ok;
}
if (!renderable(gl.RGBA16F)) fail();
// Narrow formats save bandwidth where the driver allows them.
const FMT = { vel: renderable(gl.RG16F) ? gl.RG16F : gl.RGBA16F, one: renderable(gl.R16F) ? gl.R16F : gl.RGBA16F };

// One big triangle covers the target.
const TRI = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const HEAD = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
out vec4 o;
`;
const NOISE = `
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p + 7.1; a *= 0.5; } return s / 0.97; }
`;

/* ---------- K5: 2D fluid ---------- */
// Lifted from Marbling: advect, divergence, Jacobi and gradient passes.
const JACOBI = 24;
// Thick water: velocity carries itself, spreads a little and dies away.
const ADV_FS = HEAD + `
uniform sampler2D uVel;
uniform vec2 uTex;
uniform float uA, uDt, uDamp, uVisc;
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy), s = textureSize(uVel, 0);
  if (c.x == 0 || c.y == 0 || c.x == s.x - 1 || c.y == s.y - 1) { o = vec4(0.0); return; }
  vec2 v = texture(uVel, vUv).xy, b = vUv - uDt * v / vec2(uA, 1.0);
  vec2 n = texture(uVel, b).xy;
  vec2 avg = 0.25 * (texture(uVel, b + vec2(uTex.x, 0.0)).xy + texture(uVel, b - vec2(uTex.x, 0.0)).xy
    + texture(uVel, b + vec2(0.0, uTex.y)).xy + texture(uVel, b - vec2(0.0, uTex.y)).xy);
  o = vec4(mix(n, avg, uVisc) * uDamp, 0.0, 1.0);
}`;
const DIV_FS = HEAD + `
uniform sampler2D uVel;
uniform vec2 uH;
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy), s = textureSize(uVel, 0) - 1;
  float L = texelFetch(uVel, clamp(c - ivec2(1, 0), ivec2(0), s), 0).x;
  float R = texelFetch(uVel, clamp(c + ivec2(1, 0), ivec2(0), s), 0).x;
  float B = texelFetch(uVel, clamp(c - ivec2(0, 1), ivec2(0), s), 0).y;
  float T = texelFetch(uVel, clamp(c + ivec2(0, 1), ivec2(0), s), 0).y;
  o = vec4(0.5 * ((R - L) / uH.x + (T - B) / uH.y), 0.0, 0.0, 1.0);
}`;
// One Jacobi sweep; clamped reads keep the walls closed.
const JAC_FS = HEAD + `
uniform sampler2D uP, uDiv;
uniform vec2 uH;
uniform float uKeep;
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy), s = textureSize(uP, 0) - 1;
  float L = texelFetch(uP, clamp(c - ivec2(1, 0), ivec2(0), s), 0).x;
  float R = texelFetch(uP, clamp(c + ivec2(1, 0), ivec2(0), s), 0).x;
  float B = texelFetch(uP, clamp(c - ivec2(0, 1), ivec2(0), s), 0).x;
  float T = texelFetch(uP, clamp(c + ivec2(0, 1), ivec2(0), s), 0).x;
  vec2 k = 1.0 / (uH * uH);
  float p = (((L + R) * k.x + (B + T) * k.y) * uKeep - texelFetch(uDiv, c, 0).x) / (2.0 * (k.x + k.y));
  o = vec4(p, 0.0, 0.0, 1.0);
}`;
const GRAD_FS = HEAD + `
uniform sampler2D uP, uVel;
uniform vec2 uH;
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy), s = textureSize(uP, 0) - 1;
  if (c.x == 0 || c.y == 0 || c.x == s.x || c.y == s.y) { o = vec4(0.0); return; }
  float L = texelFetch(uP, c - ivec2(1, 0), 0).x, R = texelFetch(uP, c + ivec2(1, 0), 0).x;
  float B = texelFetch(uP, c - ivec2(0, 1), 0).x, T = texelFetch(uP, c + ivec2(0, 1), 0).x;
  o = vec4(texelFetch(uVel, c, 0).xy - 0.5 * vec2((R - L) / uH.x, (T - B) / uH.y), 0.0, 1.0);
}`;
const CUBIC = `
// Catmull-Rom from nine bilinear taps: far less smear than one.
vec4 cubic(sampler2D t, vec2 q) {
  vec2 sz = vec2(textureSize(t, 0)), s = q / vec2(uA, 1.0) * sz, t1 = floor(s - 0.5) + 0.5, f = s - t1;
  vec2 w0 = f * (-0.5 + f * (1.0 - 0.5 * f)), w1 = 1.0 + f * f * (-2.5 + 1.5 * f);
  vec2 w2 = f * (0.5 + f * (2.0 - 1.5 * f)), w3 = f * f * (-0.5 + 0.5 * f), w12 = w1 + w2;
  vec2 p0 = (t1 - 1.0) / sz, p3 = (t1 + 2.0) / sz, p12 = (t1 + w2 / w12) / sz;
  return (texture(t, vec2(p0.x, p0.y)) * w0.x + texture(t, vec2(p12.x, p0.y)) * w12.x + texture(t, vec2(p3.x, p0.y)) * w3.x) * w0.y
    + (texture(t, vec2(p0.x, p12.y)) * w0.x + texture(t, vec2(p12.x, p12.y)) * w12.x + texture(t, vec2(p3.x, p12.y)) * w3.x) * w12.y
    + (texture(t, vec2(p0.x, p3.y)) * w0.x + texture(t, vec2(p12.x, p3.y)) * w12.x + texture(t, vec2(p3.x, p3.y)) * w3.x) * w3.y;
}`;
/* ---------- end K5 ---------- */

/* ---------- film ---------- */
const MAXS = 6, MAXP = 8;
// Fingers drag the water toward their own speed; a slow breeze drifts it.
const FORCE_FS = HEAD + NOISE + `
uniform sampler2D uVel;
uniform float uA, uK, uDt, uT, uBreeze;
uniform int uN;
uniform vec4 uSeg[${MAXS}];
uniform vec4 uSegV[${MAXS}];
float seg(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a, ba = b - a;
  return length(pa - ba * clamp(dot(pa, ba) / max(dot(ba, ba), 1e-10), 0.0, 1.0));
}
// The breeze is the curl of slow noise, so it never piles water up.
vec2 breeze(vec2 p) {
  vec2 e = vec2(0.01, 0.0), m = p * 1.3 + vec2(uT * 0.02, uT * 0.013);
  float dx = vnoise(m + e.xy) - vnoise(m - e.xy), dy = vnoise(m + e.yx) - vnoise(m - e.yx);
  return vec2(dy, -dx) / 0.02 / 1.3;
}
void main() {
  vec2 v = texture(uVel, vUv).xy, p = vUv * vec2(uA, 1.0);
  for (int i = 0; i < ${MAXS}; i++) {
    if (i >= uN) break;
    float d = seg(p, uSeg[i].xy, uSeg[i].zw) / uSegV[i].z;
    v = mix(v, uSegV[i].xy, uK * uSegV[i].w * exp(-d * d));
  }
  v += uDt * uBreeze * breeze(p);
  o = vec4(v, 0.0, 1.0);
}`;
// The film rides the water; pushes spread it, and drops feed it.
const FILM_FS = HEAD + `
uniform sampler2D uD, uVel;
uniform float uA, uDt;
uniform int uNP;
uniform vec4 uPush[${MAXP}];
uniform vec4 uSrc[${MAXP}];
${CUBIC}
void main() {
  vec2 p = vUv * vec2(uA, 1.0);
  vec2 v = texture(uVel, vUv).xy;
  float dv = 0.0;
  // A push is a radial flow; its divergence thins the middle into a rim.
  for (int i = 0; i < ${MAXP}; i++) {
    if (i >= uNP) break;
    vec4 P = uPush[i];
    vec2 d = p - P.xy;
    float r2 = dot(d, d) / (P.z * P.z), e = exp(-r2);
    v += P.w * d * e;
    dv += P.w * e * (2.0 - 2.0 * r2);
  }
  float d = max(cubic(uD, p - uDt * v).x, 0.0) * exp(-uDt * dv);
  for (int i = 0; i < ${MAXP}; i++) {
    if (i >= uNP) break;
    vec4 S = uSrc[i];
    vec2 q = p - S.xy;
    d += uDt * S.w * exp(-dot(q, q) / (S.z * S.z));
  }
  o = vec4(clamp(d, 0.0, 4.0), 0.0, 0.0, 1.0);
}`;
// A fresh slick: domain-warped noise, swirled once, in a frayed patch.
const SEED_FS = HEAD + NOISE + `
uniform vec2 uRes, uSwA, uSwB, uLong;
uniform float uSeed;
vec2 swirl(vec2 q, vec2 c, float k, float r) {
  vec2 d = q - c;
  float a = k * exp(-dot(d, d) / (r * r));
  float cs = cos(a), sn = sin(a);
  return c + mat2(cs, sn, -sn, cs) * d;
}
void main() {
  float S = min(uRes.x, uRes.y);
  vec2 q = (vUv * uRes - 0.5 * uRes) / S;
  vec2 p = swirl(swirl(q, uSwA, 5.0, 0.2), uSwB, -4.4, 0.18);
  // Two domain warps stretch the noise into slick streaks.
  vec2 w = vec2(fbm(p * 1.4 + uSeed), fbm(p * 1.4 + uSeed + 5.2));
  vec2 w2 = vec2(fbm(p * 1.9 + w * 2.6 + 1.7), fbm(p * 1.9 + w * 2.6 + 9.2));
  float f = fbm(p * 1.2 + w2 * 2.0 + uSeed * 0.37);
  // The slick is one frayed patch; its edge thins to nothing.
  float blob = fbm(q * 1.1 + uSeed + 20.0) + 0.12 - 0.6 * length(q * uLong);
  o = vec4(smoothstep(0.22, 0.4, blob) * (0.3 + 1.1 * f), 0.0, 0.0, 1.0);
}`;
const COPY_FS = HEAD + `
uniform sampler2D uSrc;
void main() { o = texture(uSrc, vUv); }`;

/* ---------- the puddle ---------- */
// The puddle: wet asphalt, a mirror of the sky and the oil film on top.
const PUDDLE_FS = HEAD + NOISE + `
#define NS ${NS}
uniform sampler2D uD, uVel;
uniform vec2 uRes, uKeyC;
uniform float uFilm, uKeySize;
uniform vec3 uKey, uFill, uBase;
uniform float uLam[NS];
uniform vec3 uW[NS];
// The sky as the puddle mirrors it: one soft key glow and a fill.
vec3 sky(vec2 h) {
  vec2 k = h - uKeyC;
  float key = exp(-dot(k, k) * uKeySize);
  float fill = 0.25 + 0.75 * smoothstep(-1.4, 1.2, dot(h, normalize(uKeyC)));
  return uKey * key + uFill * fill;
}
void main() {
  float S = min(uRes.x, uRes.y);
  vec2 q = (vUv * uRes - 0.5 * uRes) / S;
  // Slow swell and moving water tilt the surface, so the sky wavers.
  vec2 tilt = (vec2(vnoise(q * 3.0 + 2.0), vnoise(q * 3.0 + 6.0)) - 0.5) * 0.04 + texture(uVel, vUv).xy * 0.06;
  vec3 env = sky(q + tilt);
  float d = texture(uD, vUv).x * uFilm;
  // Oil on water: one phase flip, so a bare film reads dark.
  float fade = exp(-d / 2600.0);
  vec3 film = vec3(0.0);
  for (int i = 0; i < NS; i++) {
    float I = 0.5 - 0.5 * cos(12.566 * 1.47 * d / uLam[i]);
    film += mix(0.5, I, fade) * uW[i];
  }
  // A small lift in colour keeps the bands vivid on the dark water.
  float lum = dot(film, vec3(0.2126, 0.7152, 0.0722));
  film = max(lum + (film - lum) * 1.45, 0.0);
  float oil = smoothstep(0.0, 25.0, d);
  // Wet asphalt shows through as grit under the water.
  float grit = 0.75 + 0.5 * hash12(floor(vUv * uRes / 2.0)) * vnoise(q * 40.0);
  vec3 c = uBase * grit + env * (0.01 + oil * film * 0.14);
  vec2 v = vUv - 0.5;
  c *= 1.0 - dot(v * vec2(1.0, 1.3), v) * 0.8;
  c = 1.0 - exp(-c * 1.5);
  c += (hash12(vUv * uRes + 3.0) - 0.5) * 0.008;
  o = vec4(pow(max(c, 0.0), vec3(1.0 / 2.2)), 1.0);
}`;

function compile(vs, fs) {
  const p = gl.createProgram();
  [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(([type, src]) => {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(sh)); fail(); }
    gl.attachShader(p, sh);
  });
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); fail(); }
  const u = {};
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(p, i).name; u[n.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, n); }
  return { p, u };
}
const P = {
  adv: compile(TRI, ADV_FS), div: compile(TRI, DIV_FS), jac: compile(TRI, JAC_FS), grad: compile(TRI, GRAD_FS),
  force: compile(TRI, FORCE_FS), film: compile(TRI, FILM_FS), seed: compile(TRI, SEED_FS), copy: compile(TRI, COPY_FS),
  puddle: compile(TRI, PUDDLE_FS),
};
gl.bindVertexArray(gl.createVertexArray());
gl.disable(gl.BLEND);

function target(w, h, fmt) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, fmt, w, h);
  [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
  [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const t = { tex, fb, w, h };
  wipe(t);
  return t;
}
const pair = (w, h, fmt) => ({ r: target(w, h, fmt), w: target(w, h, fmt), swap() { [this.r, this.w] = [this.w, this.r]; } });
function free(t) {
  if (!t) return;
  if (t.r) { free(t.r); free(t.w); return; }
  gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb);
}
function wipe(t) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
}
function bind(prog, name, unit, t) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, t.tex);
  gl.uniform1i(prog.u[name], unit);
}
function draw(dst) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst ? dst.fb : null);
  gl.viewport(0, 0, dst ? dst.w : W, dst ? dst.h : H);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------- grids ---------- */
// The film grid is finer than the water grid.
let W = 1, H = 1, A = 1, film = null, vel = null, pres = null, div = null, DW = 0, DH = 0, SW = 0, SH = 0;
function alloc() {
  A = W / H;
  const dh = Math.round(clamp(H * 0.55 * (rung ? 0.7 : 1), 220, 760)), dw = Math.max(1, Math.round(dh * A));
  const sh = Math.round(clamp(dh / 3, 80, 220)), sw = Math.max(1, Math.round(sh * A));
  if (dw !== DW || dh !== DH) {
    const nf = pair(dw, dh, FMT.one);
    // A resize stretches the old film onto the new grid.
    if (film) { gl.useProgram(P.copy.p); bind(P.copy, 'uSrc', 0, film.r); draw(nf.r); }
    free(film); film = nf; DW = dw; DH = dh;
    if (!vel) seed();
  }
  if (sw !== SW || sh !== SH) {
    free(vel); free(pres); free(div);
    vel = pair(sw, sh, FMT.vel); pres = pair(sw, sh, FMT.one); div = target(sw, sh, FMT.one);
    SW = sw; SH = sh;
  }
}
// The layout keeps the vortex pair left of centre; tall stages turn it.
function layout() {
  const S = Math.min(W, H), ax = W / S, ay = H / S, tall = W < H;
  const at = p => (tall ? [-p[1] * 1.2, p[0] * ay * 0.62] : [p[0] * ax * 0.62, p[1]]);
  return { swA: at(slick.swA), swB: at(slick.swB), key: [ax * 0.42, ay * 0.42], long: tall ? [1, 0.75] : [0.75, 1] };
}
function seed() {
  const L = layout(), u = P.seed.u;
  gl.useProgram(P.seed.p);
  gl.uniform2f(u.uRes, DW, DH);
  gl.uniform2fv(u.uSwA, L.swA);
  gl.uniform2fv(u.uSwB, L.swB);
  gl.uniform2fv(u.uLong, L.long);
  gl.uniform1f(u.uSeed, slick.seed);
  draw(film.r);
}

/* ---------- one frame of fluid ---------- */
const segA = new Float32Array(MAXS * 4), segV = new Float32Array(MAXS * 4);
const pushA = new Float32Array(MAXP * 4), srcA = new Float32Array(MAXP * 4);
let nSeg = 0, nPush = 0, t = 0;
function simStep(dt) {
  const hx = A / SW, hy = 1 / SH;
  const f = P.force;
  gl.useProgram(f.p);
  bind(f, 'uVel', 0, vel.r);
  gl.uniform1f(f.u.uA, A);
  gl.uniform1f(f.u.uK, 1 - Math.exp(-dt * 40));
  gl.uniform1f(f.u.uDt, dt);
  gl.uniform1f(f.u.uT, t);
  gl.uniform1f(f.u.uBreeze, reduce ? 0 : 0.006 * rate);
  gl.uniform1i(f.u.uN, nSeg);
  gl.uniform4fv(f.u.uSeg, segA);
  gl.uniform4fv(f.u.uSegV, segV);
  draw(vel.w); vel.swap();
  const a = P.adv;
  gl.useProgram(a.p);
  bind(a, 'uVel', 0, vel.r);
  gl.uniform2f(a.u.uTex, 1 / SW, 1 / SH);
  gl.uniform1f(a.u.uA, A);
  gl.uniform1f(a.u.uDt, dt);
  // Swirls linger a few seconds, as on a still puddle.
  gl.uniform1f(a.u.uDamp, Math.exp(-dt / 2.5));
  gl.uniform1f(a.u.uVisc, 1 - Math.exp(-dt * 2));
  draw(vel.w); vel.swap();
  gl.useProgram(P.div.p);
  bind(P.div, 'uVel', 0, vel.r);
  gl.uniform2f(P.div.u.uH, hx, hy);
  draw(div);
  const j = P.jac;
  gl.useProgram(j.p);
  bind(j, 'uDiv', 1, div);
  gl.uniform2f(j.u.uH, hx, hy);
  for (let i = 0; i < JACOBI; i++) {
    bind(j, 'uP', 0, pres.r);
    gl.uniform1f(j.u.uKeep, i ? 1 : 0.8);
    draw(pres.w); pres.swap();
  }
  const gr = P.grad;
  gl.useProgram(gr.p);
  bind(gr, 'uP', 0, pres.r);
  bind(gr, 'uVel', 1, vel.r);
  gl.uniform2f(gr.u.uH, hx, hy);
  draw(vel.w); vel.swap();
  const m = P.film;
  gl.useProgram(m.p);
  bind(m, 'uD', 0, film.r);
  bind(m, 'uVel', 1, vel.r);
  gl.uniform1f(m.u.uA, A);
  gl.uniform1f(m.u.uDt, dt);
  gl.uniform1i(m.u.uNP, nPush);
  gl.uniform4fv(m.u.uPush, pushA);
  gl.uniform4fv(m.u.uSrc, srcA);
  draw(film.w); film.swap();
}

/* ---------- render ---------- */
function render() {
  const L = layout(), K = SKIES[opts.sky], u = P.puddle.u;
  gl.useProgram(P.puddle.p);
  bind(P.puddle, 'uD', 0, film.r);
  bind(P.puddle, 'uVel', 1, vel.r);
  gl.uniform2f(u.uRes, W, H);
  gl.uniform2fv(u.uKeyC, L.key);
  gl.uniform1f(u.uKeySize, K.size);
  gl.uniform1f(u.uFilm, 120 + opts.film * 520);
  gl.uniform3fv(u.uKey, linFit(...K.key).map(x => x * K.keyI));
  gl.uniform3fv(u.uFill, linFit(...K.fill).map(x => x * K.fillI));
  gl.uniform3fv(u.uBase, linFit(0.16, 0.006, 250));
  gl.uniform1fv(u.uLam, LAM);
  gl.uniform3fv(u.uW, WEIGHTS);
  draw(null);
}

/* ---------- sound ---------- */
// Space and Enter add drops, so they count as gestures.
const kit = audioKit({ keys: new Set([' ', 'Enter']) });
let V = null, T = null, toneLoad = null;
// The hum follows the busiest finger: its speed, its hold and its place.
const hum = { drive: 0, hold: 0, x: 0.5 };
const LEAD = 0.005;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// The first live call loads Tone; voices answer once it lands.
function voices() {
  if (!kit.live()) return null;
  if (V) return V;
  toneLoad ||= kit.tone().then(m => {
    toneLoad = null;
    if (m && !V) { T = m; V = buildVoices(); }
  });
  return null;
}
function buildVoices() {
  const pan = new T.Panner(0).connect(kit.out);
  // The hum runs at zero gain; a moving or held finger opens it.
  const hg = new T.Gain(0).connect(pan);
  // Brown noise through a wobbling band sounds like water sloshing.
  const wf = new T.Filter({ type: 'bandpass', Q: 1.4, frequency: 260 }).connect(hg);
  const wob = new T.LFO({ frequency: 4.2, min: 0.75, max: 1.25 }).start();
  const wobG = new T.Multiply(260).connect(wf.frequency);
  wob.connect(wobG);
  new T.Noise('brown').connect(wf).start();
  // A low sine with a slow drift carries the hum itself.
  const sub = new T.Oscillator({ type: 'sine', frequency: 58 }).start();
  const subG = new T.Gain(0.5).connect(hg);
  sub.connect(subG);
  new T.LFO({ frequency: 0.7, min: 55, max: 61 }).start().connect(sub.frequency);
  // The drop: a rising plip over a soft low blob.
  const plip = new T.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.002, decay: 0.09, sustain: 0, release: 0.03 }, volume: -10 }).connect(pan);
  const blob = new T.MembraneSynth({ pitchDecay: 0.03, octaves: 1.5, envelope: { attack: 0.002, decay: 0.14, sustain: 0, release: 0.05 }, volume: -18 }).connect(pan);
  return { pan, hg, wobG, sub, subG, plip, blob };
}
// Fast drags open the hum and brighten it; a hold darkens it.
function humTick() {
  if (!voices() || !kit.ac) return;
  const t = kit.ac.currentTime;
  V.hg.gain.setTargetAtTime(Math.min(0.32, hum.drive * 0.26 + hum.hold * 0.12), t, 0.05);
  V.wobG.factor.setTargetAtTime(Math.max(120, 200 + hum.drive * 420 - hum.hold * 90), t, 0.08);
  V.subG.gain.setTargetAtTime(0.4 + hum.hold * 0.5, t, 0.1);
  V.pan.pan.setTargetAtTime((hum.x * 2 - 1) * 0.6, t, 0.05);
}
function hush() { if (V && kit.ac) V.hg.gain.setTargetAtTime(0, kit.ac.currentTime, 0.03); }
function plip(x) {
  const v = voices();
  if (!v) return;
  const t = kit.ac.currentTime + LEAD, f = 520 * jit(0.12);
  v.pan.pan.setValueAtTime((x / A * 2 - 1) * 0.6, t);
  v.plip.triggerAttackRelease(f, 0.09, t, 0.6 * jit(0.15));
  v.plip.frequency.setValueAtTime(f, t);
  v.plip.frequency.exponentialRampToValueAtTime(f * 2.6, t + 0.05);
  v.blob.triggerAttackRelease(85 * jit(0.08), 0.14, t + 0.004, 0.5 * jit(0.2));
}

/* ---------- touch ---------- */
// Each pointer: its last spot, its speed and how long it has held still.
const pointers = new Map(), drops = [];
const toP = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * A, 1 - (e.clientY - r.top) / r.height]; };
canvas.addEventListener('pointerdown', e => {
  try { canvas.setPointerCapture(e.pointerId); } catch { /* synthetic pointers have no capture */ }
  const p = toP(e);
  pointers.set(e.pointerId, { p, prev: p, v: [0, 0], hold: 0, still: 0 });
  stage.focus({ preventScroll: true });
  poke();
});
canvas.addEventListener('pointermove', e => {
  const s = pointers.get(e.pointerId);
  if (!s) return;
  s.p = toP(e);
  poke();
});
const up = e => { pointers.delete(e.pointerId); poke(); };
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
// Pointer state turns into strokes, pushes and sources once per frame.
function gather(dt) {
  nSeg = 0; nPush = 0;
  pushA.fill(0); srcA.fill(0);
  let drive = 0, hold = 0, hx = hum.x;
  for (const s of pointers.values()) {
    const dx = s.p[0] - s.prev[0], dy = s.p[1] - s.prev[1];
    const k = dt > 0 ? 1 / dt : 0, sp = Math.hypot(dx, dy) * k;
    s.v = [lerp(s.v[0], dx * k, 0.5), lerp(s.v[1], dy * k, 0.5)];
    const vm = Math.hypot(...s.v), cap = vm > 2.5 ? 2.5 / vm : 1;
    // A still finger grows its push; a moving one lets it go.
    s.hold = clamp(sp < 0.12 ? s.hold + dt / 0.6 : s.hold - dt / 0.2);
    const dr = clamp(vm / 1.5);
    if (dr + s.hold > drive + hold) hx = s.p[0] / A;
    drive = Math.max(drive, dr); hold = Math.max(hold, s.hold);
    if (nSeg < MAXS && sp > 0.01) {
      segA.set([s.prev[0], s.prev[1], s.p[0], s.p[1]], nSeg * 4);
      segV.set([s.v[0] * cap, s.v[1] * cap, 0.03, 1], nSeg * 4);
      nSeg++;
    }
    if (nPush < MAXP && s.hold > 0) {
      pushA.set([s.p[0], s.p[1], 0.045, 1.6 * s.hold], nPush * 4);
      srcA.set([0, 0, 1, 0], nPush * 4);
      nPush++;
    }
    s.prev = s.p;
  }
  hum.drive = drive; hum.hold = hold; hum.x = hx;
  // A fresh drop feeds the film at first, then spreads it outward.
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.age += dt;
    if (d.age > 3) { drops.splice(i, 1); continue; }
    if (nPush >= MAXP) continue;
    pushA.set([d.x, d.y, 0.03 + 0.04 * Math.min(d.age, 1), Math.exp(-d.age / 0.6)], nPush * 4);
    srcA.set([d.x, d.y, 0.032, d.age < 0.45 ? 8 : 0], nPush * 4);
    nPush++;
  }
}
function addDrop(x = rand(0.15, A - 0.15), y = rand(0.15, 0.85)) {
  drops.push({ x, y, age: 0 });
  plip(x);
  poke();
}
// Space or Enter on the stage adds a drop.
stage.addEventListener('keydown', e => {
  if (e.target !== stage || (e.key !== ' ' && e.key !== 'Enter')) return;
  e.preventDefault();
  addDrop();
});

/* ---------- loop ---------- */
let raf = 0, last = 0, visible = true, ready = false, lastInput = performance.now(), rate = 1;
// Lively frames run at full rate; drifting frames at 30 fps.
const lively = () => pointers.size > 0 || drops.length > 0 || performance.now() - lastInput < 3000;
function frameFn(now) {
  raf = 0;
  const live = lively();
  if (!live && last && now - last < 31) { raf = requestAnimationFrame(frameFn); return; }
  const dt = last ? Math.min(1 / 30, (now - last) / 1000) : 1 / 60;
  last = now;
  let more = false;
  try { more = step(dt, now); render(); }
  finally {
    if (visible && (live || more)) raf = requestAnimationFrame(frameFn);
    else { hush(); kit.rest(() => !raf); }
  }
}
function wake() { if (visible && ready && !raf) { last = 0; raf = requestAnimationFrame(frameFn); } }
// Any input wakes the loop and resets the sleep clock.
function poke() { lastInput = performance.now(); rate = 1; wake(); }
function step(dt, now) {
  t += dt;
  // After a minute without input, the drift eases to a stop over 2 s.
  const idle = (now - lastInput) / 1000;
  rate = reduce ? clamp(1 - (idle - 2) / 2) : clamp(1 - (idle - 60) / 2);
  gather(dt);
  simStep(dt);
  humTick();
  if (lively()) watchdog(dt);
  return rate > 0;
}

/* ---------- performance ---------- */
// Slow frames step quality down one rung; it never steps back up.
let runT = 0, avg = 1 / 60, slowT = 0, rung = 0;
function watchdog(dt) {
  if (!dt || rung >= 2) return;
  runT += dt;
  avg = lerp(avg, dt, 0.1);
  if (runT < 4) return;
  slowT = avg > 1 / 38 ? slowT + dt : 0;
  if (slowT > 2) { rung++; slowT = 0; resize(true); }
}

/* ---------- size ---------- */
function fit() {
  if (!rung) return fitCanvas(canvas, { budget: 2.2e6 });
  // On High the first rung falls back to Standard, not to 1x.
  return quality() === 'high' && rung < 2 ? fitCanvas(canvas, { budget: 2.2e6, quality: 'standard' }) : fitCanvas(canvas, { budget: 1.4e6, maxDpr: 1 });
}
function resize(force = false) {
  const f = fit();
  if (f.W === W && f.H === H && film && !force) return;
  W = f.W; H = f.H;
  alloc();
  render();
}

/* ---------- bar ---------- */
function popover(box, btn) {
  const set = on => { box.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!box.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
const filmEl = document.getElementById('film');
filmEl.value = String(opts.film);
filmEl.addEventListener('input', () => { opts.film = +filmEl.value; save('film', opts.film); if (!raf) render(); });
choices(document.getElementById('sky'), v => { opts.sky = v; save('sky', v); if (ready && !raf) render(); }).set(opts.sky);
document.getElementById('drop').addEventListener('click', () => addDrop());
// Shuffle pours a new slick; Clear leaves the bare puddle.
document.getElementById('shuffle').addEventListener('click', () => {
  slick.seed = rand(0, 100);
  slick.swA = [rand(-0.5, 0), rand(-0.25, 0.25)];
  slick.swB = [slick.swA[0] + rand(0.15, 0.3), slick.swA[1] + rand(-0.25, 0.25)];
  drops.length = 0;
  [vel.r, vel.w, pres.r, pres.w].forEach(wipe);
  seed();
  poke();
});
document.getElementById('clear').addEventListener('click', () => {
  drops.length = 0;
  [film.r, film.w, vel.r, vel.w, pres.r, pres.w].forEach(wipe);
  poke();
});

/* ---------- start ---------- */
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => { rung = 0; resize(true); });
resize();
gl.finish();
ready = true;
markReady();
requestAnimationFrame(() => canvas.classList.add('on'));
whenVisible(stage, v => {
  visible = v;
  if (v) wake();
  else { if (raf) { cancelAnimationFrame(raf); raf = 0; } hush(); }
});
wake();
</script>
