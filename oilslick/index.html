<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.13 0.01 250); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oil slick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Oil slick: one dark puddle under a thin film of oil. */
:root { --stage: oklch(0.08 0.008 250); }
.stage--oilslick { cursor: crosshair; }
.stage--oilslick canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--oilslick canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--oilslick canvas { transition: none; } }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.01 250 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Oil slick</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--oilslick" id="stage" tabindex="0" role="application" aria-label="A dark puddle under a thin film of oil. Drag to swirl the rainbow bands; hold to thin the film.">
      <p class="fail" hidden>Oil slick needs WebGL2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" id="sky" role="group" aria-label="Sky">
        <button class="chip" type="button" data-value="grey" aria-pressed="true"><span class="dot" style="background:oklch(0.82 0.02 240)"></span>Grey</button>
        <button class="chip" type="button" data-value="dusk" aria-pressed="false"><span class="dot" style="background:oklch(0.72 0.13 50)"></span>Dusk</button>
        <button class="chip" type="button" data-value="lamp" aria-pressed="false"><span class="dot" style="background:oklch(0.86 0.09 85)"></span>Lamp</button>
      </div>
      <label class="slider"><span>Film</span><input type="range" id="film" min="0" max="1" step="0.01" value="0.45" aria-label="Film: thin to thick"></label>
      <div class="actions">
        <button class="chip" id="drop" type="button">+ Drop</button>
        <button class="chip" id="shuffle" type="button"><svg viewBox="0 0 16 16" aria-hidden="true" width="14" height="14" style="vertical-align:-2px;margin-right:5px"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5.6" cy="5.6" r="1.1" fill="currentColor"/><circle cx="10.4" cy="10.4" r="1.1" fill="currentColor"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/></svg>Shuffle</button>
        <button class="chip" id="clear" type="button">Clear</button>
      </div>
      <div class="edge">
        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings"></div>
        </div>
        <dl class="how" aria-label="How to play">
          <div><dt>Drag</dt><dd>swirl the bands</dd></div>
          <div><dt>Hold</dt><dd>thin the film</dd></div>
          <div><dt>+ Drop</dt><dd>add oil</dd></div>
        </dl>
      </div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Oil slick</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, choices, fitCanvas, linFit, qualitySetting, onQuality } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

// Blockout: still frames only; no loop, no input, no sound.
const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });
initPage({ id: 'oilslick' });
// Settings holds the site-wide Quality choice.
qualitySetting(document.getElementById('sets'));

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.oilslick.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.oilslick.${k}`, String(v)); } catch { /* storage is optional */ } };
const opts = {
  sky: saved('sky') || 'grey',
  film: saved('film') != null ? +saved('film') : 0.45,
};
// Each sky: a key glow, a fill and the key's size.
const SKIES = {
  grey: { key: [0.96, 0.015, 240], keyI: 2.4, fill: [0.55, 0.03, 245], fillI: 0.1, size: 2.4 },
  dusk: { key: [0.82, 0.12, 55], keyI: 2.6, fill: [0.45, 0.1, 295], fillI: 0.14, size: 2.2 },
  lamp: { key: [0.93, 0.07, 80], keyI: 4.0, fill: [0.3, 0.04, 255], fillI: 0.05, size: 4.0 },
};
// The still: a vortex pair from one drag, one held hole and the drops.
const MAXD = 6;
const scene = { seed: 11, on: 1, swA: [-0.3, 0.1], swB: [-0.08, -0.12], hold: [0.42, -0.2], drops: [[0.22, 0.26, 0.085, 1]] };
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------- spectrum ---------- */
// Sixteen wavelengths span the visible band.
const NS = 16;
const LAM = Float32Array.from({ length: NS }, (_, i) => 400 + i * 20);
// Two-sided gaussians fit the CIE 1931 matching curves.
const g = (l, m, a, b) => { const t = (l - m) / (l < m ? a : b); return Math.exp(-0.5 * t * t); };
const cmf = l => [
  1.056 * g(l, 599.8, 37.9, 31.0) + 0.362 * g(l, 442.0, 16.0, 26.7) - 0.065 * g(l, 501.1, 20.4, 26.2),
  0.821 * g(l, 568.8, 46.9, 40.5) + 0.286 * g(l, 530.9, 16.3, 31.1),
  1.217 * g(l, 437.0, 11.8, 36.0) + 0.681 * g(l, 459.0, 26.0, 13.8),
];
// Each wavelength gets a linear sRGB weight; a flat spectrum sums to white.
const WEIGHTS = (() => {
  const w = new Float32Array(NS * 3), sum = [0, 0, 0];
  for (let i = 0; i < NS; i++) {
    const [X, Y, Z] = cmf(LAM[i]);
    const rgb = [3.2406 * X - 1.5372 * Y - 0.4986 * Z, -0.9689 * X + 1.8758 * Y + 0.0415 * Z, 0.0557 * X - 0.204 * Y + 1.057 * Z];
    for (let c = 0; c < 3; c++) { w[i * 3 + c] = rgb[c]; sum[c] += rgb[c]; }
  }
  for (let i = 0; i < NS; i++) for (let c = 0; c < 3; c++) w[i * 3 + c] /= sum[c];
  return w;
})();

/* ---------- WebGL2 ---------- */
const stage = document.getElementById('stage');
const canvas = document.createElement('canvas');
canvas.setAttribute('aria-hidden', 'true');
stage.prepend(canvas);
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
const fail = () => { stage.querySelector('.fail').hidden = false; markReady(); throw new Error('no webgl2'); };
if (!gl) fail();

const QUAD_VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
const NOISE = `
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p + 7.1; a *= 0.5; } return s / 0.97; }
`;

function program(vs, fs, attrs) {
  const p = gl.createProgram();
  [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(([type, src]) => {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(sh)); fail(); }
    gl.attachShader(p, sh);
  });
  attrs.forEach((name, i) => gl.bindAttribLocation(p, i, name));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); fail(); }
  const u = {};
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(p, i).name.replace('[0]', ''); u[n] = gl.getUniformLocation(p, n); }
  return { p, u };
}

const quadVao = gl.createVertexArray();
gl.bindVertexArray(quadVao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

/* ---------- the puddle ---------- */
// The puddle: wet asphalt, a mirror of the sky and the oil film on top.
const PUDDLE_FS = `#version 300 es
precision highp float;
#define NS ${NS}
#define MAXD ${MAXD}
uniform vec2 uRes, uSwA, uSwB, uHold, uKeyC, uLong;
uniform float uSeed, uOn, uFilm, uKeySize;
uniform vec3 uKey, uFill, uBase;
uniform vec4 uDrop[MAXD];
uniform int uDrops;
uniform float uLam[NS];
uniform vec3 uW[NS];
in vec2 vUv; out vec4 o;
${NOISE}
// A vortex turns the film around its centre; the turn fades with distance.
vec2 swirl(vec2 q, vec2 c, float k, float r) {
  vec2 d = q - c;
  float a = k * exp(-dot(d, d) / (r * r));
  float cs = cos(a), sn = sin(a);
  return c + mat2(cs, sn, -sn, cs) * d;
}
// Film thickness in nanometres.
float thickness(vec2 q) {
  vec2 p = swirl(swirl(q, uSwA, 5.0, 0.2), uSwB, -4.4, 0.18);
  // Two domain warps stretch the noise into slick streaks.
  vec2 w = vec2(fbm(p * 1.4 + uSeed), fbm(p * 1.4 + uSeed + 5.2));
  vec2 w2 = vec2(fbm(p * 1.9 + w * 2.6 + 1.7), fbm(p * 1.9 + w * 2.6 + 9.2));
  float f = fbm(p * 1.2 + w2 * 2.0 + uSeed * 0.37);
  // The slick is one frayed patch; its edge thins to nothing.
  float blob = fbm(q * 1.1 + uSeed + 20.0) + 0.12 - 0.6 * length(q * uLong);
  float d = uOn * smoothstep(0.22, 0.4, blob) * uFilm * (0.3 + 1.1 * f);
  // A held finger pushes the oil aside into a thick rim.
  float r = length(q - uHold);
  float hole = exp(-r * r / 0.006);
  d = d * (1.0 - 0.97 * hole) + uOn * uFilm * 0.9 * exp(-(r - 0.11) * (r - 0.11) / 0.002);
  // A fresh drop is a thick lens that spreads into rings.
  for (int i = 0; i < MAXD; i++) {
    if (i >= uDrops) break;
    vec4 D = uDrop[i];
    float t = length(q - D.xy) / D.z;
    d += D.w * 650.0 * pow(max(1.0 - t * t, 0.0), 0.6);
  }
  return d;
}
// The sky as the puddle mirrors it: one soft key glow and a fill.
vec3 sky(vec2 h) {
  vec2 k = h - uKeyC;
  float key = exp(-dot(k, k) * uKeySize);
  float fill = 0.25 + 0.75 * smoothstep(-1.4, 1.2, dot(h, normalize(uKeyC)));
  return uKey * key + uFill * fill;
}
void main() {
  float S = min(uRes.x, uRes.y);
  vec2 q = (vUv * uRes - 0.5 * uRes) / S;
  // Slow swell tilts the water, so the sky wavers in it.
  vec2 tilt = (vec2(vnoise(q * 3.0 + 2.0), vnoise(q * 3.0 + 6.0)) - 0.5) * 0.04;
  vec3 env = sky(q + tilt);
  float d = thickness(q);
  // Oil on water: one phase flip, so a bare film reads dark.
  float fade = exp(-d / 2600.0);
  vec3 film = vec3(0.0);
  for (int i = 0; i < NS; i++) {
    float I = 0.5 - 0.5 * cos(12.566 * 1.47 * d / uLam[i]);
    film += mix(0.5, I, fade) * uW[i];
  }
  // A small lift in colour keeps the bands vivid on the dark water.
  float lum = dot(film, vec3(0.2126, 0.7152, 0.0722));
  film = max(lum + (film - lum) * 1.45, 0.0);
  float oil = smoothstep(0.0, 25.0, d);
  // Wet asphalt shows through as grit under the water.
  float grit = 0.75 + 0.5 * hash12(floor(vUv * uRes / 2.0)) * vnoise(q * 40.0);
  vec3 c = uBase * grit + env * (0.01 + oil * film * 0.14);
  vec2 v = vUv - 0.5;
  c *= 1.0 - dot(v * vec2(1.0, 1.3), v) * 0.8;
  c = 1.0 - exp(-c * 1.5);
  c += (hash12(vUv * uRes + 3.0) - 0.5) * 0.008;
  o = vec4(pow(max(c, 0.0), vec3(1.0 / 2.2)), 1.0);
}`;
const P = { puddle: program(QUAD_VS, PUDDLE_FS, ['aPos']) };

/* ---------- render ---------- */
let W = 1, H = 1;
// The layout keeps the drag left of centre and the key glow top right.
function layout() {
  const S = Math.min(W, H), ax = W / S, ay = H / S, tall = W < H;
  // A tall stage turns the layout a quarter turn.
  const at = p => (tall ? [-p[1] * 1.2, p[0] * ay * 0.62] : [p[0] * ax * 0.62, p[1]]);
  return {
    swA: at(scene.swA), swB: at(scene.swB), hold: at(scene.hold),
    drops: scene.drops.map(d => [...at(d), d[2], d[3]]),
    key: [ax * 0.42, ay * 0.42],
    long: tall ? [1, 0.75] : [0.75, 1],
  };
}
function render() {
  const L = layout(), K = SKIES[opts.sky], u = P.puddle.u;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(P.puddle.p); gl.bindVertexArray(quadVao);
  gl.uniform2f(u.uRes, W, H);
  gl.uniform2fv(u.uSwA, L.swA);
  gl.uniform2fv(u.uSwB, L.swB);
  gl.uniform2fv(u.uHold, L.hold);
  gl.uniform2fv(u.uKeyC, L.key);
  gl.uniform2fv(u.uLong, L.long);
  gl.uniform1f(u.uKeySize, K.size);
  gl.uniform1f(u.uSeed, scene.seed);
  gl.uniform1f(u.uOn, scene.on);
  gl.uniform1f(u.uFilm, 120 + opts.film * 520);
  gl.uniform3fv(u.uKey, linFit(...K.key).map(x => x * K.keyI));
  gl.uniform3fv(u.uFill, linFit(...K.fill).map(x => x * K.fillI));
  gl.uniform3fv(u.uBase, linFit(0.16, 0.006, 250));
  const dr = new Float32Array(MAXD * 4);
  L.drops.slice(0, MAXD).forEach((d, i) => dr.set(d, i * 4));
  gl.uniform4fv(u.uDrop, dr);
  gl.uniform1i(u.uDrops, Math.min(L.drops.length, MAXD));
  gl.uniform1fv(u.uLam, LAM);
  gl.uniform3fv(u.uW, WEIGHTS);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- size ---------- */
function resize() {
  const fit = fitCanvas(canvas, { budget: 2.2e6 });
  W = fit.W; H = fit.H;
  render();
}

/* ---------- bar ---------- */
function popover(box, btn) {
  const set = on => { box.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!box.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
const filmEl = document.getElementById('film');
filmEl.value = String(opts.film);
filmEl.addEventListener('input', () => { opts.film = +filmEl.value; save('film', opts.film); render(); });
choices(document.getElementById('sky'), v => { opts.sky = v; save('sky', v); render(); }).set(opts.sky);
// + Drop shows one more fresh drop; the oldest goes past the limit.
document.getElementById('drop').addEventListener('click', () => {
  scene.on = 1;
  scene.drops.push([rand(-0.5, 0.5), rand(-0.35, 0.35), rand(0.06, 0.1), 1]);
  if (scene.drops.length > MAXD) scene.drops.shift();
  render();
});
// Shuffle shows a new slick; Clear shows the bare puddle.
document.getElementById('shuffle').addEventListener('click', () => {
  scene.on = 1; scene.seed = rand(0, 100);
  scene.swA = [rand(-0.5, 0), rand(-0.25, 0.25)];
  scene.swB = [scene.swA[0] + rand(0.15, 0.3), scene.swA[1] + rand(-0.25, 0.25)];
  scene.hold = [rand(0.15, 0.55), rand(-0.3, 0.3)];
  scene.drops = [[rand(-0.4, 0.4), rand(-0.3, 0.3), rand(0.06, 0.1), 1]];
  render();
});
document.getElementById('clear').addEventListener('click', () => { scene.on = 0; scene.drops = []; render(); });

/* ---------- start ---------- */
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
resize();
gl.finish();
markReady();
requestAnimationFrame(() => canvas.classList.add('on'));
</script>
</body>
</html>
