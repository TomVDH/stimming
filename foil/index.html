<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.14 0.006 70); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crinkle foil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Crinkle foil: one sheet of foil under one strip light. */
:root { --stage: oklch(0.1 0.005 70); }
.stage--foil { cursor: grab; touch-action: none; }
.stage--foil.is-drag { cursor: grabbing; }
.stage--foil canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--foil canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--foil canvas { transition: none; } }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.008 70 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.chip .dot.holo { background: conic-gradient(oklch(0.8 0.14 20), oklch(0.85 0.14 120), oklch(0.8 0.13 220), oklch(0.8 0.14 320), oklch(0.8 0.14 20)); }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Crinkle foil</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--foil" id="stage" tabindex="0" role="application" aria-label="A sheet of foil under a strip light. Drag to scrunch it; smooth it flat again.">
      <p class="fail" hidden>Crinkle foil needs WebGL2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" id="metal" role="group" aria-label="Foil">
        <button class="chip" type="button" data-value="silver" aria-pressed="true"><span class="dot" style="background:oklch(0.88 0.005 250)"></span>Silver</button>
        <button class="chip" type="button" data-value="gold" aria-pressed="false"><span class="dot" style="background:oklch(0.82 0.12 85)"></span>Gold</button>
        <button class="chip" type="button" data-value="holo" aria-pressed="false"><span class="dot holo"></span>Holo</button>
      </div>
      <label class="slider"><span>Creases</span><input type="range" id="creases" min="0" max="1" step="0.01" value="0.5" aria-label="Creases: coarse to fine"></label>
      <div class="actions">
        <button class="chip" id="smooth" type="button">Smooth</button>
        <button class="chip" id="shuffle" type="button"><svg viewBox="0 0 16 16" aria-hidden="true" width="14" height="14" style="vertical-align:-2px;margin-right:5px"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5.6" cy="5.6" r="1.1" fill="currentColor"/><circle cx="10.4" cy="10.4" r="1.1" fill="currentColor"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/></svg>Shuffle</button>
      </div>
      <div class="edge">
        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings"></div>
        </div>
        <dl class="how" aria-label="How to play">
          <div><dt>Drag</dt><dd>scrunch the foil</dd></div>
          <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>pinch a pucker</dd></div>
          <div><dt>Smooth</dt><dd>press it flat</dd></div>
        </dl>
      </div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Crinkle foil</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, choices, fitCanvas, whenVisible, reduced, onReducedChange, linFit, quality, qualitySetting, onQuality, audioKit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });
initPage({ id: 'foil' });
// Settings holds the site-wide Quality choice.
qualitySetting(document.getElementById('sets'));

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
let reduce = reduced();

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.foil.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.foil.${k}`, String(v)); } catch { /* storage is optional */ } };
const opts = {
  metal: saved('metal') || 'silver',
  creases: saved('creases') != null ? +saved('creases') : 0.5,
};
// Each foil has one base reflectance; Holo adds a hue per facet.
const METALS = {
  silver: { f0: [0.9, 0.006, 250], holo: 0 },
  gold: { f0: [0.8, 0.13, 82], holo: 0 },
  holo: { f0: [0.88, 0.01, 250], holo: 1 },
};
// Fine creases are short; coarse creases reach further.
const reachK = () => 1.35 - opts.creases * 0.7;

/* ---------- WebGL2 ---------- */
const stage = document.getElementById('stage');
const canvas = document.createElement('canvas');
canvas.setAttribute('aria-hidden', 'true');
stage.prepend(canvas);
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
const fail = () => { stage.querySelector('.fail').hidden = false; markReady(); throw new Error('no webgl2'); };
if (!gl) fail();
// The crease field holds signed slopes, so it needs float targets.
if (!gl.getExtension('EXT_color_buffer_float')) fail();

const QUAD_VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
const NOISE = `
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y); }
`;

function program(vs, fs, attrs) {
  const p = gl.createProgram();
  [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(([type, src]) => {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(sh)); fail(); }
    gl.attachShader(p, sh);
  });
  attrs.forEach((name, i) => gl.bindAttribLocation(p, i, name));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); fail(); }
  const u = {};
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(p, i).name; u[n] = gl.getUniformLocation(p, n); }
  return { p, u };
}

const corners = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
const quadVao = gl.createVertexArray();
gl.bindVertexArray(quadVao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, corners, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// Stamp data: centre and crease normal, then reach, slope and amount.
const MAXF = 4096;
const inst = new Float32Array(MAXF * 8);
let nInst = 0;
const stampVao = gl.createVertexArray();
gl.bindVertexArray(stampVao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, corners, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const instBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
gl.bufferData(gl.ARRAY_BUFFER, inst.byteLength, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(1);
gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 0);
gl.vertexAttribDivisor(1, 1);
gl.enableVertexAttribArray(2);
gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16);
gl.vertexAttribDivisor(2, 1);
gl.bindVertexArray(null);

function target(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
  [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fb, w, h };
}
const drop = t => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); };

/* ---------- the crease field ---------- */
// Sheet units: the short side of the stage spans one unit, y points up.
// A stamp draws one fold: a straight crease that fades with distance.
const STAMP_VS = `#version 300 es
in vec2 aCorner; in vec4 aF; in vec4 aB;
uniform vec2 uRes;
out vec2 vQ; flat out vec4 vF; flat out vec4 vB;
void main() {
  float S = min(uRes.x, uRes.y);
  vec2 q = aF.xy + aCorner * aB.x * 2.4;
  vQ = q; vF = aF; vB = aB;
  gl_Position = vec4(q * S * 2.0 / uRes, 0.0, 1.0);
}`;
const STAMP_FS = `#version 300 es
precision highp float;
uniform float uEps;
in vec2 vQ; flat in vec4 vF; flat in vec4 vB; out vec4 o;
void main() {
  vec2 dq = vQ - vF.xy;
  float w = exp(-dot(dq, dq) / (vB.x * vB.x));
  float d = dot(dq, vF.zw);
  o = vec4(vB.y * w * d * inversesqrt(d * d + uEps) * vF.zw, vB.z * w, 0.0);
}`;
// Smoothing scales the field by the share of the press each texel saw.
// A texel sits in the band while the front runs from x to x + uW.
const MUL_FS = `#version 300 es
precision highp float;
uniform float uA, uB, uW, uK; in vec2 vUv; out vec4 o;
void main() {
  float e = max(0.0, min(uB, vUv.x + uW) - max(uA, vUv.x)) / uW;
  o = vec4(pow(uK, e));
}`;
// A resize copies the field across in sheet units.
const COPY_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uNew, uOld; in vec2 vUv; out vec4 o;
void main() {
  vec2 q = (vUv - 0.5) * uNew / min(uNew.x, uNew.y);
  vec2 ou = q * min(uOld.x, uOld.y) / uOld + 0.5;
  o = all(greaterThanEqual(ou, vec2(0.0))) && all(lessThanEqual(ou, vec2(1.0))) ? texture(uSrc, ou) : vec4(0.0);
}`;

/* ---------- the sheet ---------- */
// The sheet: field creases, fine crinkles, a mirror finish and a ceiling of lights.
const SHEET_FS = `#version 300 es
precision highp float;
uniform sampler2D uField;
uniform vec2 uRes, uHalf, uStripC, uSoftC;
uniform float uHolo, uStripA, uFine;
uniform vec3 uF0, uTable;
in vec2 vUv; out vec4 o;
${NOISE}
// Fine crinkles: one short random fold per grid cell.
vec2 crinkle(vec2 q, float k, float seed) {
  vec2 p = q * k, i = floor(p), g = vec2(0.0);
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 c = i + vec2(x, y), h = hash22(c + seed), h2 = hash22(c + seed + 19.7);
    vec2 dq = p - c - h;
    float a = h2.x * 3.1416;
    vec2 nn = vec2(cos(a), sin(a));
    float d = dot(dq, nn);
    g += (h2.y * 2.0 - 1.0) * exp(-dot(dq, dq) / 0.6) * d * inversesqrt(d * d + 4e-4) * nn;
  }
  return g;
}
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
float sdBox(vec2 p, vec2 b) { vec2 d = abs(p) - b; return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0); }
// The ceiling: one strip light, one soft box and a dim room.
vec3 env(vec2 q, vec3 r) {
  float rz = max(r.z, 0.06);
  vec2 hit = q + r.xy / rz * 1.2;
  vec2 s = rot(-uStripA) * (hit - uStripC);
  float strip = (1.0 - smoothstep(0.55, 0.8, abs(s.x))) * (1.0 - smoothstep(0.018, 0.045, abs(s.y)));
  vec2 b = hit - uSoftC;
  float soft = exp(-dot(b, b) * 5.0);
  // The room is dim and uneven, so each facet finds its own shade.
  float m = vnoise(hit * 0.9 + 4.0);
  float room = 0.004 + 0.07 * m * m * m + 0.03 * (1.0 - smoothstep(0.2, 0.9, rz));
  return vec3(1.0, 0.95, 0.87) * strip * 7.0 + vec3(0.55, 0.62, 0.8) * soft * 0.1 + vec3(room);
}
void main() {
  float S = min(uRes.x, uRes.y);
  vec2 q = (vUv * uRes - 0.5 * uRes) / S;
  vec4 f = texture(uField, vUv);
  // Slopes saturate, as real foil only folds so far.
  vec2 gf = f.xy / (1.0 + 0.35 * length(f.xy));
  float A = 1.0 - exp(-f.z * 1.3);
  float mem = 0.04 + 0.96 * A;
  // Scrunched foil pulls its edge in and roughens it.
  float edge = sdBox(q, uHalf) + A * 0.05 + A * (vnoise(q * 13.0) - 0.5) * 0.06;
  float aa = 1.5 / S;
  float cover = 1.0 - smoothstep(-aa, aa, edge);
  // Big folds fade where the foil holds little scrunch.
  vec2 g = gf * (0.15 + 0.85 * A) + (crinkle(q, 9.0 * uFine, 3.0) * 0.34 + crinkle(q, 22.0 * uFine, 6.0) * 0.22) * mem;
  // A broad sag keeps even the flat sheet from a perfect mirror.
  g += (vec2(vnoise(q * 2.2 + 3.0), vnoise(q * 2.2 + 8.0)) - 0.5) * 0.05;
  g += (vec2(vnoise(q * 90.0), vnoise(q * 90.0 + 5.0)) - 0.5) * 0.006;
  vec3 n = normalize(vec3(-g, 1.0));
  vec3 r = reflect(vec3(0.0, 0.0, -1.0), n);
  // Holo shifts the hue with the facet tilt.
  float hue = fract(dot(g, vec2(1.1, 0.7)) + dot(q, vec2(0.22, 0.12)));
  vec3 pal = 0.5 + 0.5 * cos(6.2832 * (hue + vec3(0.0, 0.33, 0.67)));
  vec3 F0 = mix(uF0, uF0 * (0.5 + 0.6 * pal), uHolo);
  vec3 F = mix(F0, vec3(1.0), pow(1.0 - n.z, 5.0) * 0.5);
  vec3 c = env(q, r) * F + F0 * 0.006;
  // The table: flat dark, with a soft shadow under the sheet.
  float sh = 1.0 - 0.6 * (1.0 - smoothstep(-0.02, 0.06, sdBox(q - vec2(0.012, -0.018), uHalf) + A * 0.05));
  o = vec4(mix(uTable * sh, c, cover), 1.0);
}`;
// The bright pass keeps only light above a soft threshold.
const BRIGHT_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; in vec2 vUv; out vec4 o;
void main() { vec3 c = texture(uSrc, vUv).rgb; float l = max(c.r, max(c.g, c.b)); o = vec4(c * smoothstep(0.5, 2.5, l), 1.0); }`;
// A nine-tap blur runs once per axis.
const BLUR_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uDir; in vec2 vUv; out vec4 o;
void main() {
  vec3 s = texture(uSrc, vUv).rgb * 0.227;
  s += (texture(uSrc, vUv + uDir * 1.385).rgb + texture(uSrc, vUv - uDir * 1.385).rgb) * 0.316;
  s += (texture(uSrc, vUv + uDir * 3.231).rgb + texture(uSrc, vUv - uDir * 3.231).rgb) * 0.070;
  o = vec4(s, 1.0);
}`;
// The final pass: glow, vignette, grain and output curve.
const OUT_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc, uBloom, uWide; uniform vec2 uRes;
in vec2 vUv; out vec4 o;
${NOISE}
void main() {
  vec3 c = texture(uSrc, vUv).rgb + texture(uBloom, vUv).rgb * 0.35 + texture(uWide, vUv).rgb * 0.18;
  vec2 q = vUv - 0.5;
  c *= 1.0 - dot(q * vec2(1.0, 1.3), q) * 0.7;
  c = 1.0 - exp(-c * 1.4);
  c += (hash12(vUv * uRes) - 0.5) * 0.006;
  o = vec4(pow(max(c, 0.0), vec3(1.0 / 2.2)), 1.0);
}`;
const P = {
  stamp: program(STAMP_VS, STAMP_FS, ['aCorner', 'aF', 'aB']),
  mul: program(QUAD_VS, MUL_FS, ['aPos']),
  copy: program(QUAD_VS, COPY_FS, ['aPos']),
  sheet: program(QUAD_VS, SHEET_FS, ['aPos']),
  bright: program(QUAD_VS, BRIGHT_FS, ['aPos']),
  blur: program(QUAD_VS, BLUR_FS, ['aPos']),
  out: program(QUAD_VS, OUT_FS, ['aPos']),
};

let W = 1, H = 1, field = null, frame = null, bl = [], wd = [];
function quad(dst, prog) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst ? dst.fb : null);
  gl.viewport(0, 0, dst ? dst.w : W, dst ? dst.h : H);
  gl.useProgram(prog.p); gl.bindVertexArray(quadVao);
}
const bind = (unit, tex, loc) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(loc, unit); };

/* ---------- stamps ---------- */
function push(x, y, a, reach, slope, amt) {
  if (nInst >= MAXF) flush();
  inst.set([x, y, Math.cos(a), Math.sin(a), reach, slope, amt, 0], nInst * 8);
  nInst++;
}
// Queued stamps add into the field in one draw.
function flush() {
  if (!nInst || !field) { nInst = 0; return; }
  gl.bindFramebuffer(gl.FRAMEBUFFER, field.fb); gl.viewport(0, 0, field.w, field.h);
  gl.useProgram(P.stamp.p); gl.bindVertexArray(stampVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst, 0, nInst * 8);
  gl.uniform2f(P.stamp.u.uRes, field.w, field.h);
  // The crease is about one field texel wide.
  gl.uniform1f(P.stamp.u.uEps, (1 / Math.min(field.w, field.h)) ** 2);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nInst);
  gl.disable(gl.BLEND);
  nInst = 0;
}
function clearField() { nInst = 0; gl.bindFramebuffer(gl.FRAMEBUFFER, field.fb); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }
const sign = R => (R() < 0.5 ? -1 : 1);
const gauss = R => Math.sqrt(-2 * Math.log(R() + 1e-9)) * Math.cos(6.2832 * R());
// A seeded random stream makes the first view the same each time.
function rng(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// A full scrunch: big, mid and small folds round one centre.
function scrunchAt(cx, cy, R = Math.random) {
  const k = reachK();
  for (let i = 0; i < 80; i++) {
    const big = i < 10, mid = i < 35;
    const sp = big ? 0.24 : mid ? 0.22 : 0.2;
    const x = cx + gauss(R) * sp, y = cy + gauss(R) * sp * 0.85;
    const a = R() < 0.3 ? R() * Math.PI : Math.atan2(y - cy, x - cx) + (R() - 0.5) * 2.1;
    const reach = (big ? 0.42 : mid ? 0.2 : 0.09) * k * (0.7 + 0.6 * R());
    push(x, y, a, reach, (big ? 0.32 : mid ? 0.26 : 0.2) * sign(R) * (0.6 + 0.8 * R()), 0);
  }
  push(cx, cy, 0, 0.36, 0, 1.4);
}
// A drag step: creases form across the direction of the pull.
function scrunchStep(x, y, ux, uy, speed) {
  const R = Math.random, k = reachK(), dir = Math.atan2(uy, ux);
  for (let i = 0; i < 3; i++) {
    const a = R() < 0.25 ? R() * Math.PI : dir + (R() - 0.5) * 1.4;
    const reach = (0.03 + 0.1 * R() * R()) * k * (1 + Math.min(speed, 3) * 0.15);
    push(x + gauss(R) * 0.05, y + gauss(R) * 0.05, a, reach, sign(R) * (0.08 + 0.14 * R()), 0);
  }
  push(x, y, 0, 0.11, 0, 0.07);
}
// A tap pinches a star of creases round one point.
function pinch(x, y) {
  const R = Math.random, k = reachK(), n = 12, a0 = R() * 6.2832;
  for (let i = 0; i < n; i++) {
    const th = a0 + (i + (R() - 0.5) * 0.6) * 6.2832 / n, r = 0.025 + 0.05 * R();
    push(x + Math.cos(th) * r, y + Math.sin(th) * r, th + Math.PI / 2, (0.04 + 0.04 * R()) * k, sign(R) * (0.12 + 0.12 * R()), 0);
  }
  push(x, y, 0, 0.09, 0, 0.3);
}

/* ---------- smoothing ---------- */
// The press sweeps left to right; creases keep a faint memory.
const PRESS_T = 0.7, PRESS_W = 0.15, PRESS_K = 0.06;
const smooth = { on: false, x: 0 };
// The front moves from a to b this frame.
function mulBand(a, b, w, k) {
  quad(field, P.mul);
  gl.uniform1f(P.mul.u.uA, a); gl.uniform1f(P.mul.u.uB, b); gl.uniform1f(P.mul.u.uW, w); gl.uniform1f(P.mul.u.uK, k);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ZERO, gl.SRC_COLOR);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.disable(gl.BLEND);
}
function smoothStep(dt) {
  if (!smooth.on) return;
  flush();
  if (reduce) { mulBand(-1, 2, 0.5, PRESS_K); smooth.on = false; return; }
  const x0 = smooth.x;
  smooth.x = Math.min(1 + PRESS_W, x0 + Math.min(dt, 0.05) * (1 + PRESS_W) / PRESS_T);
  mulBand(x0, smooth.x, PRESS_W, PRESS_K);
  if (smooth.x >= 1 + PRESS_W) smooth.on = false;
}

/* ---------- light ---------- */
// The layout keeps the signed-off framing; the lights drift round it.
let t = 0;
function lights() {
  const S = Math.min(W, H), ax = W / S, ay = H / S, tall = W < H;
  const m = tall ? 0.07 : 0.09;
  const sx = Math.sin(t * 0.23), sy = Math.sin(t * 0.31 + 1.1), sa = Math.sin(t * 0.17 + 0.4);
  return {
    half: [ax * 0.5 - m, ay * 0.5 - m],
    strip: tall ? [0.02 + sx * 0.25, -ay * 0.02 + sy * ay * 0.3] : [ax * 0.04 + sx * ax * 0.3, -0.03 + sy * 0.22],
    stripA: (tall ? 1.2 : -0.38) + sa * 0.45,
    soft: tall ? [-0.4 + sy * 0.2, -ay * 0.4 + sx * 0.3] : [ax * 0.42 - sy * 0.3, 0.42 - sx * 0.15],
  };
}
// The first view puts the scrunch where the blockout had it.
function homeScrunch() {
  const S = Math.min(W, H), ax = W / S, ay = H / S;
  return W < H ? [0, ay * 0.18] : [-ax * 0.2, 0.03];
}

/* ---------- render ---------- */
function blur(pair) {
  quad(pair[1], P.blur); bind(0, pair[0].tex, P.blur.u.uSrc); gl.uniform2f(P.blur.u.uDir, 1 / pair[0].w, 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  quad(pair[0], P.blur); bind(0, pair[1].tex, P.blur.u.uSrc); gl.uniform2f(P.blur.u.uDir, 0, 1 / pair[0].h); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function render() {
  flush();
  const L = lights(), M = METALS[opts.metal];
  quad(frame, P.sheet);
  const u = P.sheet.u;
  bind(0, field.tex, u.uField);
  gl.uniform2f(u.uRes, W, H);
  gl.uniform2fv(u.uHalf, L.half);
  gl.uniform2fv(u.uStripC, L.strip);
  gl.uniform1f(u.uStripA, L.stripA);
  gl.uniform2fv(u.uSoftC, L.soft);
  gl.uniform1f(u.uFine, 0.7 + opts.creases * 0.6);
  gl.uniform1f(u.uHolo, M.holo);
  gl.uniform3fv(u.uF0, linFit(...M.f0));
  gl.uniform3fv(u.uTable, linFit(0.1, 0.005, 70));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // Two blur sizes give a tight glint and a wide bloom.
  quad(bl[0], P.bright); bind(0, frame.tex, P.bright.u.uSrc); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  blur(bl);
  quad(wd[0], P.bright); bind(0, bl[0].tex, P.bright.u.uSrc); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  blur(wd); blur(wd);
  quad(null, P.out);
  bind(0, frame.tex, P.out.u.uSrc); bind(1, bl[0].tex, P.out.u.uBloom); bind(2, wd[0].tex, P.out.u.uWide);
  gl.uniform2f(P.out.u.uRes, W, H);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- sound ---------- */
// Crinkle: short filtered noise ticks over a rustle that follows speed.
const kit = audioKit({ gain: 0.6 });
let V = null, tickBudget = 0;
function voice() {
  const ac = kit.live();
  if (!ac || !kit.noise) return null;
  if (V) return V;
  const src = ac.createBufferSource(); src.buffer = kit.noise; src.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 0.5;
  const g = ac.createGain(); g.gain.value = 0;
  src.connect(bp).connect(g).connect(kit.out);
  src.start();
  V = { bp, g };
  return V;
}
function tick(level) {
  const ac = kit.live();
  if (!ac || !kit.noise || tickBudget <= 0) return;
  tickBudget--;
  const now = ac.currentTime + Math.random() * 0.02, dur = 0.006 + Math.random() * 0.03;
  const src = ac.createBufferSource(); src.buffer = kit.noise;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = 1800 + Math.random() * 6500; bp.Q.value = 0.8 + Math.random() * 1.5;
  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(level * (0.3 + 0.7 * Math.random()), now + 0.0015);
  g.gain.exponentialRampToValueAtTime(0.0005, now + dur);
  src.connect(bp).connect(g).connect(kit.out);
  src.start(now, Math.random() * (kit.noise.duration - 0.1), dur + 0.01);
}
function rustle(speed) {
  const v = voice();
  if (!v) return;
  const at = kit.ac.currentTime;
  v.g.gain.setTargetAtTime(Math.min(0.12, speed * 0.05), at, 0.04);
  v.bp.frequency.setTargetAtTime(1800 + Math.min(speed, 4) * 900, at, 0.06);
}
// The press makes one soft sweep of hiss.
function hiss() {
  const ac = kit.live();
  if (!ac || !kit.noise) return;
  const now = ac.currentTime, src = ac.createBufferSource(); src.buffer = kit.noise; src.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
  bp.frequency.setValueAtTime(5200, now); bp.frequency.exponentialRampToValueAtTime(1400, now + 0.7);
  const g = ac.createGain();
  g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.09, now + 0.08); g.gain.exponentialRampToValueAtTime(0.0005, now + 0.8);
  src.connect(bp).connect(g).connect(kit.out);
  src.start(now); src.stop(now + 0.85);
}
function hush() { if (V && kit.ac) V.g.gain.setTargetAtTime(0, kit.ac.currentTime, 0.03); }

/* ---------- input ---------- */
let drag = null, speed = 0;
function toQ(e) {
  const r = canvas.getBoundingClientRect(), S = Math.min(r.width, r.height);
  return [(e.clientX - r.left - r.width / 2) / S, -(e.clientY - r.top - r.height / 2) / S];
}
stage.addEventListener('pointerdown', e => {
  if (e.button > 0 || drag) return;
  try { stage.setPointerCapture(e.pointerId); } catch { /* capture is optional */ }
  const [x, y] = toQ(e);
  drag = { id: e.pointerId, x, y, x0: x, y0: y, t0: performance.now(), tm: performance.now(), run: 0, moved: false };
  stage.classList.add('is-drag');
  poke();
});
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const [x, y] = toQ(e), now = performance.now();
  const dx = x - drag.x, dy = y - drag.y, d = Math.hypot(dx, dy);
  if (d < 1e-4) return;
  const dt = Math.max(0.004, (now - drag.tm) / 1000);
  speed = lerp(speed, d / dt, 0.4);
  if (Math.hypot(x - drag.x0, y - drag.y0) > 0.012) drag.moved = true;
  // One step per hundredth of a unit keeps density even at any speed.
  const ux = dx / d, uy = dy / d;
  let run = drag.run + d, s = 0;
  while (run >= 0.01) {
    run -= 0.01; s += 0.01;
    const px = drag.x + ux * s, py = drag.y + uy * s;
    scrunchStep(px, py, ux, uy, speed);
    if (Math.random() < Math.min(0.9, speed * 0.6)) tick(0.12 + Math.min(speed, 3) * 0.06);
  }
  drag.run = run; drag.x = x; drag.y = y; drag.tm = now;
  poke();
});
function end(e) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  if (!drag.moved && performance.now() - drag.t0 < 350) {
    pinch(drag.x0, drag.y0);
    for (let i = 0; i < 6; i++) tick(0.22);
  }
  drag = null; speed = 0;
  stage.classList.remove('is-drag');
  poke();
}
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);

/* ---------- loop ---------- */
let raf = 0, last = 0, visible = true, ready = false, lastInput = performance.now(), rate = 1;
// Dragging and pressing run at full rate; the drifting light at 30 fps.
const lively = () => !!drag || smooth.on;
function frameFn(now) {
  raf = 0;
  const live = lively();
  if (!live && last && now - last < 31) { raf = requestAnimationFrame(frameFn); return; }
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
  last = now;
  let more = false;
  try { more = step(dt, now); render(); }
  finally {
    if (visible && (live || more)) raf = requestAnimationFrame(frameFn);
    else { hush(); kit.rest(() => !raf); }
  }
}
function wake() { if (visible && ready && !raf) { last = 0; raf = requestAnimationFrame(frameFn); } }
// Any input wakes the loop and resets the sleep clock.
function poke() { lastInput = performance.now(); rate = 1; wake(); }
function step(dt, now) {
  // After a minute without input, the light eases to a stop over 2 s.
  rate = reduce ? 0 : clamp(1 - ((now - lastInput) / 1000 - 60) / 2);
  t += dt * rate;
  tickBudget = Math.min(6, tickBudget + dt * 90);
  if (drag && now - drag.tm > 60) speed *= Math.exp(-dt / 0.05);
  rustle(drag ? speed : 0);
  smoothStep(dt);
  if (lively()) watchdog(dt);
  return rate > 0;
}

/* ---------- performance ---------- */
// Slow frames step quality down one rung; it never steps back up.
let runT = 0, avg = 1 / 60, slowT = 0, rung = 0;
function watchdog(dt) {
  if (!dt || rung >= 2) return;
  runT += dt;
  avg = lerp(avg, dt, 0.1);
  if (runT < 4) return;
  slowT = avg > 1 / 38 ? slowT + dt : 0;
  if (slowT > 2) { rung++; slowT = 0; resize(true); }
}

/* ---------- size ---------- */
function fit() {
  if (!rung) return fitCanvas(canvas, { budget: 2.2e6 });
  // On High the first rung falls back to Standard, not to 1x.
  return quality() === 'high' && rung === 1 ? fitCanvas(canvas, { budget: 2.2e6, quality: 'standard' }) : fitCanvas(canvas, { budget: 2.2e6, maxDpr: 1 });
}
function resize(force = false) {
  const f = fit();
  if (f.W === W && f.H === H && field && !force) return;
  const old = field, oW = W, oH = H;
  W = f.W; H = f.H;
  [...bl, ...wd].forEach(drop); if (frame) drop(frame);
  frame = target(W, H);
  // The field runs at half size; the crinkles add the fine detail.
  field = target(Math.max(1, (W + 1) >> 1), Math.max(1, (H + 1) >> 1));
  const sh = rung >= 2 ? 3 : 2;
  const bw = Math.max(1, W >> sh), bh = Math.max(1, H >> sh);
  bl = [target(bw, bh), target(bw, bh)];
  wd = [target(Math.max(1, bw >> 2), Math.max(1, bh >> 2)), target(Math.max(1, bw >> 2), Math.max(1, bh >> 2))];
  if (old) {
    quad(field, P.copy);
    bind(0, old.tex, P.copy.u.uSrc);
    gl.uniform2f(P.copy.u.uNew, W, H); gl.uniform2f(P.copy.u.uOld, oW, oH);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    drop(old);
  } else {
    const [cx, cy] = homeScrunch();
    scrunchAt(cx, cy, rng(37));
  }
  render();
}

/* ---------- bar ---------- */
function popover(box, btn) {
  const set = on => { box.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!box.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
const creasesEl = document.getElementById('creases');
creasesEl.value = String(opts.creases);
creasesEl.addEventListener('input', () => { opts.creases = +creasesEl.value; save('creases', opts.creases); poke(); });
choices(document.getElementById('metal'), v => { opts.metal = v; save('metal', v); poke(); }).set(opts.metal);
document.getElementById('smooth').addEventListener('click', () => { smooth.on = true; smooth.x = 0; hiss(); poke(); });
// Shuffle drops the old creases and scrunches one or two new spots.
document.getElementById('shuffle').addEventListener('click', () => {
  smooth.on = false;
  clearField();
  const S = Math.min(W, H), ax = W / S, ay = H / S;
  const spots = Math.random() < 0.5 ? 1 : 2;
  for (let i = 0; i < spots; i++) scrunchAt((Math.random() - 0.5) * ax * 0.7, (Math.random() - 0.5) * ay * 0.6);
  for (let i = 0; i < 6; i++) tick(0.2);
  poke();
});

/* ---------- start ---------- */
onReducedChange(v => { reduce = v; poke(); });
whenVisible(stage, v => { visible = v; if (v) wake(); else if (raf) { cancelAnimationFrame(raf); raf = 0; hush(); } });
new ResizeObserver(() => { resize(); poke(); }).observe(stage);
onQuality(() => { rung = 0; resize(true); poke(); });
resize();
gl.finish();
ready = true;
markReady();
wake();
requestAnimationFrame(() => canvas.classList.add('on'));
</script>
</body>
</html>
