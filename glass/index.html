<style>
/* Glass: a pane in a frame before a night city. */
:root { --stage: oklch(0.17 0.03 292); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
#tools .chip svg, .picker .chip svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.picker .chip svg .solid { fill: currentColor; stroke: none; }
/* The glass stepper: an arrow each side of the name. */
.picker { position: relative; display: flex; align-items: center; gap: 2px; }
.picker > .chip { justify-content: center; }
.picker > .step { padding-inline: 7px; }
.picker > #glassBtn { min-width: 112px; }
/* The name opens a tray of all the glasses, from the bar's left edge. */
.tray {
  position: absolute; left: 0; bottom: calc(100% + 10px); z-index: 20;
  display: grid; grid-template-columns: repeat(3, auto); gap: 6px; padding: 8px;
  background: oklch(0.19 0.012 275 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.tray .chip { justify-content: flex-start; }
.picker.is-open .tray { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
/* Phones: stepper, Rewind and (i) on one row, the tools on the next. */
@media (max-width: 520px) {
  .bar { column-gap: 12px; }
  #tools { order: 3; flex-basis: 100%; }
  .picker > #glassBtn { min-width: 100px; }
  .tray { grid-template-columns: repeat(2, auto); }
}
@media (prefers-reduced-motion: reduce) { .tray { transition: none; transform: none; } }
</style>
</head>

<script type="importmap">
{

    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",

    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"

<script type="module">
import { initPage, audioKit, choices, linFit, qualitySetting, onQuality, pixelRatio } from '../shared/stim.js';
initPage({ id: 'glass' });
// Settings holds the site-wide Quality choice.
qualitySetting();
// Three glasses: each breaks its own way.
const KINDS = ['annealed', 'tempered', 'laminated', 'armored', 'reeded', 'dichroic', 'shuttle', 'stained', 'rice'];
// Each glass breaks like one of five; several share annealed or armored breaks.
const MODE = {
  annealed: 'annealed', tempered: 'tempered', laminated: 'laminated', armored: 'armored', reeded: 'annealed',
  dichroic: 'annealed', shuttle: 'armored', stained: 'annealed', rice: 'rice',
};
let glass = 'annealed';
const mode = () => MODE[glass];
try { const v = localStorage.getItem('stimming.glass.kind'); if (KINDS.includes(v)) glass = v; } catch (err) { /* storage is optional */ }
const panel = document.getElementById('stage');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; });
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));

/* ---------- sound: the shared kit owns the context; Tone.js plays the shot ---------- */
const MAXV = 24, LEAD = 0.004;
let out = null, noise = null, voices = 0, tinkNext = 0, Tone = null;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.06 * voices);
const GESTURE_KEYS = new Set(['r', 'R', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter', '1', '2', '3']);
const kit = audioKit({ keys: GESTURE_KEYS });
// A live context, or null while muted; the first call loads Tone and the shot.
function live() {
  const a = kit.live();
  if (!a) return null;
  out = kit.out;
  noise = kit.noise;
  if (!Tone) loadTone();
  return a;
}
function track(src, ...tails) {
  voices++;
  src.onended = () => { voices--; tails.forEach(n => n.disconnect()); };
}
// Once the pane settles, the context sleeps until the next gesture.
const rest = () => kit.rest(() => !raf && ptr < 0);
// The first sound waits one frame, so the crack draws first.
const afterPaint = fn => requestAnimationFrame(() => setTimeout(fn, 0));
const sfx = fn => (kit.ac ? fn() : afterPaint(fn));

// Each voice pans with its place on the pane.
function bus(a, x) {
  const p = a.createStereoPanner ? a.createStereoPanner() : a.createGain();
  if (p.pan) p.pan.value = clamp(x, -1, 1) * 0.6;
  p.connect(out);
  return p;
}
// A noise burst through one filter; it tidies itself up.
function burst(a, dst, t, type, f, q, g, tau, len) {
  const src = a.createBufferSource(), fl = a.createBiquadFilter(), ng = a.createGain();
  src.buffer = noise;
  fl.type = type;
  fl.frequency.value = f;
  fl.Q.value = q;
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(g, t + 0.0005);
  ng.gain.setTargetAtTime(0, t + 0.0005, tau);
  src.connect(fl).connect(ng).connect(dst);
  src.onended = () => ng.disconnect();
  src.start(t, Math.random() * 0.8, len);
}
// Inharmonic partials ring like a struck plate.
function partials(a, dst, t, f0, ratios, gains, decays, g, swell = 0) {
  const gs = [];
  let first = null;
  ratios.forEach((r, k) => {
    const o = a.createOscillator(), og = a.createGain(), end = swell ? t + swell : t + decays[k] * 6;
    o.frequency.value = f0 * r * jit(0.004);
    if (swell) {
      // Reversed: the ring grows out of silence and stops dead.
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(gains[k] * g, end - 0.012);
      og.gain.linearRampToValueAtTime(0, end);
    } else {
      og.gain.setValueAtTime(0, t);
      og.gain.linearRampToValueAtTime(gains[k] * g, t + 0.002);
      og.gain.setTargetAtTime(0, t + 0.002, decays[k]);
    }
    o.connect(og).connect(dst);
    o.start(t);
    o.stop(end + 0.01);
    gs.push(og);
    if (!first) first = o;
  });
  return [first, gs];
}
const RING = [1, 1.593, 2.135, 2.917, 4.15], RING_G = [0.07, 0.05, 0.04, 0.028, 0.02], RING_D = [0.42, 0.28, 0.2, 0.12, 0.07];

// Each glass voices a crack: pitch, ring length, knock and snap.
// Tempered rings high and long; the laminate's interlayer deadens it.
const VOICE = {
  annealed: { f: 1, ring: 1, knock: 1, snap: 1 },
  tempered: { f: 1.45, ring: 1.5, knock: 0.5, snap: 0.9 },
  laminated: { f: 0.78, ring: 0.28, knock: 1.4, snap: 0.75 },
  armored: { f: 0.62, ring: 0.2, knock: 1.8, snap: 0.55 },
  rice: { f: 0.7, ring: 0.06, knock: 1.3, snap: 1.25 },
};
// A crack: a sharp snap, a dull knock and a glassy ring.
// Ticks follow the crack as it runs.
function crackSound(x, hard, ticks, kind = mode()) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const V = VOICE[kind], t = a.currentTime + LEAD, g = level() * (hard ? 1 : 0.78), d = bus(a, x), k = (hard ? 1.35 : 1) * V.ring;
  burst(a, d, t, 'bandpass', 3400 * V.f * jit(0.1), 0.8, 1.1 * g * V.snap, hard ? 0.009 : 0.006, 0.08);
  burst(a, d, t, 'highpass', 7000, 0.7, 0.6 * g * V.snap, 0.0025, 0.03);
  burst(a, d, t, 'lowpass', hard ? 240 : 380, 0.9, (hard ? 0.9 : 0.45) * g * V.knock, 0.03, 0.2);
  const [o, gs] = partials(a, d, t + 0.001, (hard ? 1500 : 2100) * V.f * jit(0.12), RING, RING_G, RING_D.map(v => v * k), g);

  track(o, ...gs, d);
}
// Tempered glass crazes: one bang, then a crackle runs across the pane.
function crazeSound(x, dur) {
  crackSound(x, true, [], 'tempered');
  const a = live();
  if (!a) return;
  const t = a.currentTime + LEAD, g = level(), d = bus(a, x);
  burst(a, d, t + 0.003, 'bandpass', 5200, 0.5, 0.7 * g, dur * 0.5, dur + 0.1);
  for (let i = 0; i < 40; i++) {
    burst(a, d, t + dur * (i / 40) ** 0.7 + Math.random() * 0.01, 'highpass', rnd(4800, 9000), 0.8, rnd(0.08, 0.22) * g, 0.0012, 0.015);
  }
  setTimeout(() => d.disconnect(), (dur + 0.6) * 1000);
}
// The dice pour out: a gritty hiss under a falling patter.
function pourSound(dur) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD, g = level(), d = bus(a, 0);
  const src = a.createBufferSource(), bp = a.createBiquadFilter(), ng = a.createGain();
  src.buffer = noise;
  src.loop = true;
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(6200, t);
  bp.frequency.exponentialRampToValueAtTime(3000, t + dur);
  bp.Q.value = 0.7;
  ng.gain.setValueAtTime(0.0001, t);
  ng.gain.exponentialRampToValueAtTime(0.16 * g, t + 0.12);
  ng.gain.setTargetAtTime(0, t + 0.3, dur / 3);
  src.connect(bp).connect(ng).connect(d);
  src.start(t);
  src.stop(t + dur * 1.6);
  for (let i = 0; i < 36; i++) {
    burst(a, d, t + dur * Math.random() ** 1.4, 'highpass', rnd(5000, 9000), 0.8, rnd(0.05, 0.16) * g, 0.0015, 0.02);
  }
  track(src, bp, ng, d);
}
// The laminate stretches: a dry crunch and a low creak.
function popSound(x, k) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD, g = level() * (0.55 + 0.25 * k), d = bus(a, x);
  burst(a, d, t, 'highpass', rnd(5600, 8000), 0.8, 0.4 * g, 0.0015, 0.02);
  burst(a, d, t, 'bandpass', rnd(800, 1100), 4, 0.8 * g, 0.03, 0.12);
  burst(a, d, t + 0.004, 'lowpass', 170 + 40 * k, 1.2, 0.8 * g, 0.05, 0.25);
  const [o, gs] = partials(a, d, t + 0.001, 1500 * jit(0.1), RING, RING_G.map(v => v * 0.6), RING_D.map(v => v * 0.22), g);
  track(o, ...gs, d);
}
// Shards landing: a tiny tick and a short high ring.
// Smaller shards ring higher.
function tinkle(size, sp, x) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t0 = a.currentTime + LEAD, t = Math.max(t0, tinkNext);
  // A rush of hits thins to a patter instead of a wall.
  if (t - t0 > 0.07) return;
  tinkNext = t + 0.01 + Math.random() * 0.014;
  const g = level() * clamp(sp / 3, 0.12, 0.8) * jit(0.2), d = bus(a, x), s = clamp(size / 0.1, 0.6, 1.6);

    burst(a, d, t, 'lowpass', 300, 1, 0.4 * g, 0.02, 0.06);
    setTimeout(() => d.disconnect(), 300);
    return;
  }
  burst(a, d, t, 'highpass', 6000, 0.7, 0.35 * g, 0.0015, 0.02);
  const [o, gs] = partials(a, d, t, clamp(4200 * (0.1 / size) ** 0.35, 2400, 8500) * jit(0.08), [1, 1.47, 2.09], [0.1, 0.07, 0.045], [0.08 * s, 0.05 * s, 0.03 * s], g);
  track(o, ...gs, d);
}
// The burst: a hard crack, a wide crash and rings scattering.
function shatterSound(x) {
  crackSound(x, true, []);
  const a = live();
  if (!a) return;
  const t = a.currentTime + LEAD, g = level(), d = bus(a, x);
  burst(a, d, t + 0.004, 'bandpass', 2600, 0.45, 0.9 * g, 0.09, 0.6);
  burst(a, d, t + 0.01, 'highpass', 5500, 0.5, 0.5 * g, 0.05, 0.5);
  let first = null;
  const all = [];
  for (let k = 0; k < 9 && voices + k < MAXV; k++) {
    const [o, gs] = partials(a, d, t + 0.012 + k * 0.022 + Math.random() * 0.03, rnd(2600, 7200), [1, 1.47, 2.09], [0.06, 0.04, 0.03], [0.09, 0.06, 0.035], g);

}
// A soft clipper gives the synthesised shot its punch.
const drive = new Float32Array(1024).map((_, i) => Math.tanh(((i / 1023) * 2 - 1) * 3.2) / Math.tanh(3.2));
// Tone.js gives the gun a room and plays the recorded shot.
let room = null, shotBuf = null, toneAsked = false;
function loadTone() {
  if (toneAsked) return;
  toneAsked = true;
  kit.tone().then(T => {
    if (!T) { toneAsked = false; return; }
    Tone = T;
    room = new T.Gain(0.3).connect(new T.Reverb({ decay: 1.3, preDelay: 0.006, wet: 1 }).connect(kit.out));
    shotBuf = new T.ToneAudioBuffer('gunshot.wav');
  }).catch(() => { toneAsked = false; });
}
// A shot: the recording, pitched a touch for variety, then the casing.
function gunSound(x, auto = false) {
  const a = live();
  if (!a) return;
  if (shotBuf?.loaded) return playShot(a, x, auto);
  if (voices >= MAXV - 2) return;
  const t = a.currentTime + LEAD, g = level() * (auto ? 0.8 : 1), d = bus(a, x);
  const sh = a.createWaveShaper(), pre = a.createGain();
  sh.curve = drive;
  pre.gain.value = 1.6;
  pre.connect(sh).connect(d);
  if (room) Tone.connect(sh, room);
  burst(a, pre, t, 'highpass', 5000, 0.7, 0.9 * g, 0.0012, 0.01);
  burst(a, pre, t + 0.0008, 'bandpass', 2600 * jit(0.08), 0.6, 1.4 * g, 0.009, 0.05);
  burst(a, pre, t + 0.001, 'lowpass', 900, 0.7, 1.1 * g, 0.035, 0.2);
  const o = a.createOscillator(), og = a.createGain();
  o.frequency.setValueAtTime(170 * jit(0.06), t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
  og.gain.setValueAtTime(0.0001, t);
  og.gain.exponentialRampToValueAtTime(1.3 * g, t + 0.003);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  o.connect(og).connect(pre);
  o.start(t);
  o.stop(t + 0.24);
  track(o, og, pre, sh, d);

    ({ RoundedBoxGeometry } = await import('three/addons/geometries/RoundedBoxGeometry.js'));
    [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'), import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'), import('three/addons/postprocessing/OutputPass.js'),
    ]);
  } catch (err) {
    console.error(err);
    return failed();
  }
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (err) {
    console.error(err);
    return failed();
  }
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.setClearColor(CLEAR);
  const canvas = renderer.domElement;
  canvas.setAttribute('aria-hidden', 'true');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 16 / 9, 0.1, 100);
  ray = new THREE.Raycaster();
  ndc = new THREE.Vector2();
  hitV = new THREE.Vector3();
  tmpV = new THREE.Vector3();
  dbs = new THREE.Vector2();
  paneP = new THREE.Plane(new THREE.Vector3(0, 0, 1), -T / 2);
  floorP = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  await idle();

  // The room lights the frame and mirrors in the glass.
  const room = new RoomEnvironment();
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(room, 0.04).texture;
  const cubeRT = new THREE.WebGLCubeRenderTarget(128, { type: THREE.HalfFloatType });
  new THREE.CubeCamera(0.1, 100, cubeRT).update(renderer, room);
  room.dispose();
  pm.dispose();
  await idle();

  const V3 = c => new THREE.Vector3(...c), town = city();
  // Jewel tones for stained glass, as transmission colours.
  const PAL = [lin(0.7, 0.2, 25), lin(0.64, 0.17, 262), lin(0.78, 0.16, 150), lin(0.88, 0.15, 82), lin(0.66, 0.17, 310), lin(0.96, 0.025, 95)];
  wallMat = new THREE.ShaderMaterial({
    vertexShader: WORLD_VS, fragmentShader: WALL_FS,
    uniforms: {
      uSkyTop: { value: V3(lin(0.12, 0.024, 272)) }, uSkyLow: { value: V3(lin(0.2, 0.035, 292)) }, uHaze: { value: V3(lin(0.5, 0.075, 58, 0.6)) },
      uFar: { value: V3(lin(0.21, 0.03, 285)) }, uMid: { value: V3(lin(0.16, 0.024, 282)) }, uNear: { value: V3(lin(0.115, 0.016, 278)) },
      uWinA: { value: V3(lin(0.84, 0.09, 75, 0.32)) }, uWinB: { value: V3(lin(0.86, 0.04, 222, 0.26)) }, uWinC: { value: V3(lin(0.9, 0.02, 100, 0.3)) },
      uFarR: { value: town.far }, uMidR: { value: town.mid }, uNearR: { value: town.near },
    },
  });
  wall = new THREE.Mesh(new THREE.PlaneGeometry(400, 200), wallMat);
  wall.position.z = WALLZ;
  floorMat = new THREE.ShaderMaterial({
    vertexShader: WORLD_VS, fragmentShader: FLOOR_FS,
    uniforms: {
      uBase: { value: V3(lin(0.15, 0.012, 280)) }, uPool: { value: V3(lin(0.27, 0.02, 285)) }, uSpill: { value: V3(lin(0.36, 0.08, 40, 0.8)) },
      uPoolC: { value: new THREE.Vector2() }, uPoolR: { value: 1 }, uWallZ: { value: WALLZ },
    },
  });
  floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.z = WALLZ + 200;
  // The city's lights: one instanced quad per light.
  const quad = new THREE.PlaneGeometry(2, 2), bg = new THREE.InstancedBufferGeometry();
  bg.setIndex(quad.index);
  bg.setAttribute('position', quad.getAttribute('position'));
  bg.setAttribute('aA', new THREE.InstancedBufferAttribute(new Float32Array(town.A), 4));
  bg.setAttribute('aB', new THREE.InstancedBufferAttribute(new Float32Array(town.B), 4));
  bg.setAttribute('aTw', new THREE.InstancedBufferAttribute(new Float32Array(town.TW), 1));
  bg.instanceCount = town.TW.length;
  bokehMat = new THREE.ShaderMaterial({
    vertexShader: BOKEH_VS, fragmentShader: BOKEH_FS, uniforms: { uT: { value: 0 } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  bokeh = new THREE.Mesh(bg, bokehMat);
  bokeh.frustumCulled = false;
  frameMat = new THREE.MeshPhysicalMaterial({ roughness: 0.46, clearcoat: 0.4, clearcoatRoughness: 0.32, envMapIntensity: 0.8 });
  beadMat = new THREE.MeshPhysicalMaterial({ roughness: 0.5, clearcoat: 0.3, clearcoatRoughness: 0.4, envMapIntensity: 0.7 });
  frameShader(frameMat, seamU);
  frameShader(beadMat, seamU);
  frameG = new THREE.Group();
  // A key light from the upper left; the city glow rims the frame from behind.
  const key = new THREE.DirectionalLight(new THREE.Color(...lin(0.97, 0.02, 85)), 1.7);
  key.position.set(-0.45, 0.75, 0.5);
  const back = new THREE.DirectionalLight(new THREE.Color(...lin(0.8, 0.09, 60)), 0.9);
  back.position.set(0.25, 0.35, -1);
  scene.add(wall, floor, bokeh, frameG, key, back);

  backRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
  // The screen shows the backdrop target on one quad behind the glass.
  bgMat = new THREE.ShaderMaterial({
    vertexShader: BACK_VS, fragmentShader: BACK_FS, depthTest: false, depthWrite: false,
    uniforms: { tBack: { value: backRT.texture }, uRes: { value: new THREE.Vector2(1, 1) } },
  });
  bgQuad = new THREE.Mesh(quad, bgMat);
  bgQuad.frustumCulled = false;
  bgQuad.renderOrder = -1;
  scene.add(bgQuad);
  crackRT = new THREE.WebGLRenderTarget(256, 144, { depthBuffer: false });
  flashU.value = new THREE.Vector4(0, 0, 0, 0);
  flashS.value = new THREE.Vector2(0.02, 0);
  const glassU = () => ({
    tBack: { value: backRT.texture }, tCrack: { value: crackRT.texture }, tEnv: { value: cubeRT.texture },
    uRes: { value: new THREE.Vector2(1, 1) }, uTexel: { value: new THREE.Vector2(1 / 256, 1 / 144) }, uPane: { value: new THREE.Vector2(PW, PH) },
    uRefr: { value: 0.25 }, uOpacity: { value: 1 }, uCrackK: { value: 1 }, uEdge: { value: 1 }, uEnvI: { value: 0.4 },
    uWallZ: { value: WALLZ }, uLine: { value: 1 }, uDisp: { value: 0.18 }, uBend: { value: 0.7 },
    uAbs: { value: new THREE.Vector3(0.07, 0.016, 0.05) }, uQuench: { value: 0 }, uReed: { value: 0 }, uDich: { value: 0 }, uArmor: { value: 0 },
    uStain: { value: 0 }, uRice: { value: 0 }, uCells: { value: Array.from({ length: NCELL }, () => new THREE.Vector3(99, 99, 0)) }, uPal: { value: PAL.map(c => V3(c)) },
    uFlash: flashU, uFlashS: flashS, uFlashC: { value: V3(lin(0.96, 0.035, 80, 1)) },
    uBoxA: { value: new THREE.Vector4() }, uBoxB: { value: new THREE.Vector4() }, uKey: { value: V3(lin(0.97, 0.025, 80, 0.6)) },
  });
  paneMat = new THREE.ShaderMaterial({ vertexShader: PANE_VS, fragmentShader: GLASS_FS, transparent: true, uniforms: {
    ...glassU(), uFlex: { value: new THREE.Vector4(0, 0, 0, 1) }, uSag: { value: 0 },
    uDent: { value: Array.from({ length: 8 }, () => new THREE.Vector4(0, 0, 0, 1)) },
  } });
  pane = new THREE.Mesh(new THREE.BufferGeometry(), paneMat);
  xfTex = new THREE.DataTexture(new Float32Array(CAPS * 8), CAPS * 2, 1, THREE.RGBAFormat, THREE.FloatType);
  xfTex.needsUpdate = true;
  shardMat = new THREE.ShaderMaterial({ vertexShader: SHARD_VS, fragmentShader: GLASS_FS, transparent: true, uniforms: { ...glassU(), tXf: { value: xfTex } } });
  shardMat.uniforms.uRefr.value = 0.07;
  shardMat.uniforms.uEdge.value = 0;
  shardMat.uniforms.uLine.value = 0.6;
  shardMat.uniforms.uDisp.value = 0.12;
  shardMat.uniforms.uBend.value = 0.25;
  // One stand-in triangle lets the shard shader compile up front.
  const stand = new THREE.BufferGeometry();
  stand.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 0.01, 0, 0, 0, 0.01, 0], 3));
  stand.setAttribute('normal', new THREE.Float32BufferAttribute([0, 0, 1, 0, 0, 1, 0, 0, 1], 3));
  stand.setAttribute('aPuv', new THREE.Float32BufferAttribute([0, 0, 0, 0, 0, 0], 2));
  stand.setAttribute('aSid', new THREE.Float32BufferAttribute([0, 0, 0], 1));
  stand.setAttribute('aSide', new THREE.Float32BufferAttribute([0, 0, 0], 1));
  shardMesh = new THREE.Mesh(stand, shardMat);
  shardMesh.frustumCulled = pane.frustumCulled = false;
  // The keyboard aim ring keeps the dark-theme focus colour.
  mark = new THREE.Mesh(new THREE.RingGeometry(0.028, 0.038, 40), new THREE.MeshBasicMaterial({ color: 0x40e2f3, toneMapped: false, depthTest: false, transparent: true }));
  mark.renderOrder = 2;
  mark.visible = false;
  scene.add(pane, shardMesh, mark);
  crackScene = new THREE.Scene();
  crackCam = new THREE.OrthographicCamera(-1, 1, 1, -1, -1, 1);
  crackMat = new THREE.ShaderMaterial({
    vertexShader: CRACK_VS, fragmentShader: CRACK_FS, uniforms: { uTime: { value: 0 } },
    depthTest: false, depthWrite: false,
    blending: THREE.CustomBlending, blendEquation: THREE.MaxEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
  });
  crackMesh = new THREE.Mesh(new THREE.BufferGeometry(), crackMat);
  crackMesh.frustumCulled = false;
  const hg = new THREE.InstancedBufferGeometry();
  hg.setIndex(quad.index);
  hg.setAttribute('position', quad.getAttribute('position'));
  hg.setAttribute('aHole', new THREE.InstancedBufferAttribute(new Float32Array(HOLES * 4), 4).setUsage(THREE.DynamicDrawUsage));
  hg.instanceCount = 0;
  holeMesh = new THREE.Mesh(hg, new THREE.ShaderMaterial({
    vertexShader: HOLE_VS, fragmentShader: HOLE_FS, uniforms: { uTime: crackMat.uniforms.uTime },
    depthTest: false, depthWrite: false,
    blending: THREE.CustomBlending, blendEquation: THREE.MaxEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
  }));
  holeMesh.frustumCulled = false;
  crackScene.add(crackMesh, holeMesh);
  // A plain clay brick with mottled colour.
  const brickMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(...lin(0.44, 0.08, 36)), roughness: 0.92 });
  brickMat.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vLoc;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvLoc = position;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vLoc;').replace('#include <color_fragment>', `#include <color_fragment>
  vec3 c = floor(vLoc * 140.0);
  diffuseColor.rgb *= 0.8 + 0.3 * fract(sin(dot(c, vec3(12.9898, 78.233, 37.719))) * 43758.5453);`);
  };
  brickMesh = new THREE.Mesh(new RoundedBoxGeometry(BX, BY, BZ, 2, 0.008), brickMat);
  brickMesh.visible = false;
  // The flash sits between the eye and the pane and lights the frame.
  const add = { transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending };
  const plane = new THREE.PlaneGeometry(1, 1);
  flashCore = new THREE.Mesh(plane, new THREE.ShaderMaterial({
    vertexShader: FLASH_VS, fragmentShader: FLASH_FS, ...add,
    uniforms: { uSeed: { value: 0 }, uK: { value: 1 }, uCore: { value: new THREE.Color(...lin(0.99, 0.06, 100, 4)) }, uRay: { value: new THREE.Color(...lin(0.9, 0.15, 90, 3)) } },
  }));
  flashMesh = new THREE.Group();
  flashMesh.add(flashCore);
  flashMesh.children.forEach(m => { m.renderOrder = 3; m.frustumCulled = false; });
  flashMesh.visible = false;
  flashLight = new THREE.PointLight(new THREE.Color(...lin(0.96, 0.03, 80)), 0, 0, 2);
  scene.add(brickMesh, flashMesh, flashLight);

  panel.prepend(canvas);
  // The backdrop draws only into its target.
  wall.visible = floor.visible = bokeh.visible = false;
  // The scene renders linear, then bloom, then tone mapping on output.
  // Only highlights above the threshold bloom: speculars, the flash, lit cracks.
  composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.6, 0.42, 0.72);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  fitRenderer(renderer, panel, 2, onSize, 4.2e6);
  // A panel with no size yet still gets a frame.
  if (!built) onSize(16, 9);
  await idle();
  shardMesh.visible = brickMesh.visible = flashMesh.visible = true;
  // Async compile keeps the shader builds off the main thread.
  await renderer.compileAsync(scene, camera);
  await renderer.compileAsync(crackScene, crackCam);
  shardMesh.visible = brickMesh.visible = flashMesh.visible = false;
  applyLook();
  renderCracks();
  ready = true;
  draw();
  stir();
  requestAnimationFrame(() => canvas.classList.add('on'));
}
start().catch(err => { console.error(err); failed(); });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
</body>
</html>
