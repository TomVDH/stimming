<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<style>
/* Glass: a dark pane on a dark table. */
:root { --stage: oklch(0.21 0.008 265); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Glass</h1>
    <div class="tools">
      <button class="snd" id="snd" type="button" aria-label="Sound" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 8h2.6l3.9-3.2v10.4L5.6 12H3z"/>
          <path class="on" d="M12.8 8.1a3 3 0 0 1 0 3.8M15.1 6.1a6 6 0 0 1 0 7.8"/>
          <path class="off" d="M13.2 8l4 4M17.2 8l-4 4"/>
        </svg>
      </button>
      <a class="home" href="../index.html">Stimming</a>
    </div>
  </header>
  <main>
    <div class="stage stage--glass" id="stage" tabindex="0" role="application" aria-label="A pane of glass in a frame. Tap to crack it; keep tapping or hold to shatter it. Space taps, arrow keys move the tap point, R rewinds.">
      <p class="fail" hidden>Glass needs WebGL, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="actions">
        <button class="chip" id="rewind" type="button" aria-keyshortcuts="R" aria-disabled="true">Rewind</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>crack</dd></div>
        <div><dt>Hold</dt><dd>shatter</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>tap</dd></div>
        <div class="fine"><dt><kbd>R</kbd></dt><dd>rewind</dd></div>
      </dl>
    </div>
    <section class="vignette" hidden aria-label="About Glass"></section>
  </main>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">

panel.addEventListener('pointermove', e => {
  if (e.pointerId === ptr && Math.hypot(e.clientX - downX, e.clientY - downY) > 14) clearTimeout(holdT);
});
const lift = e => { if (e.pointerId === ptr) { ptr = -1; clearTimeout(holdT); } };
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => panel.addEventListener(t, lift));
// The aim ring shows only for keyboard use.
panel.addEventListener('focus', () => { kbd = panel.matches(':focus-visible'); if (ready) draw(); });
panel.addEventListener('blur', () => { kbd = false; if (ready) draw(); });
const ARROWS = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const k = e.key;
  if (k === 'r' || k === 'R') { if (!e.repeat) rewind(); }
  else if (k === ' ') {
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (e.repeat || !ready) return;
    kbd = true;
    tap(aim.x, aim.y);
    clearTimeout(spaceT);
    spaceT = setTimeout(() => press(aim.x, aim.y), 480);
    draw();
  } else if (ARROWS[k]) {
    e.preventDefault();
    if (!ready) return;
    kbd = true;
    const st = S * 0.06;
    aim.x = clamp(aim.x + ARROWS[k][0] * st, -PW / 2 + 0.02, PW / 2 - 0.02);
    aim.y = clamp(aim.y + ARROWS[k][1] * st, -PH / 2 + 0.02, PH / 2 - 0.02);
    draw();
  }
});
addEventListener('keyup', e => { if (e.key === ' ') clearTimeout(spaceT); });
rewindB.addEventListener('click', rewind);
sound.onChange(on => {
  if (on) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(panel);
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

/* ---------- start: WebGL setup in idle slices ---------- */
function failed() {
  panel.querySelector('.fail').hidden = false;
}
async function start() {
  let RoomEnvironment;
  try {
    THREE = await import('three');
    ({ RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js'));
  } catch (err) {
    console.error(err);
    return failed();
  }
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (err) {
    console.error(err);
    return failed();
  }
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.setClearColor(CLEAR);
  const canvas = renderer.domElement;
  canvas.setAttribute('aria-hidden', 'true');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 16 / 9, 0.1, 100);
  ray = new THREE.Raycaster();
  ndc = new THREE.Vector2();
  hitV = new THREE.Vector3();
  tmpV = new THREE.Vector3();
  dbs = new THREE.Vector2();
  paneP = new THREE.Plane(new THREE.Vector3(0, 0, 1), -T / 2);
  floorP = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  await idle();

  // The room lights the frame and mirrors in the glass.
  const room = new RoomEnvironment();
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(room, 0.04).texture;
  const cubeRT = new THREE.WebGLCubeRenderTarget(128, { type: THREE.HalfFloatType });
  new THREE.CubeCamera(0.1, 100, cubeRT).update(renderer, room);
  room.dispose();
  pm.dispose();
  await idle();

  const CL = c => new THREE.Color(c);
  wallMat = new THREE.ShaderMaterial({
    vertexShader: WORLD_VS, fragmentShader: WALL_FS,
    uniforms: { uTop: { value: CL('#24273a') }, uLow: { value: CL('#121320') }, uCol: { value: BLOBS.map(b => CL(b[4])) }, uBlob: { value: BLOBS.map(() => new THREE.Vector4()) } },
  });
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(400, 200), wallMat);
  wall.position.z = WALLZ;
  floorMat = new THREE.ShaderMaterial({
    vertexShader: WORLD_VS, fragmentShader: FLOOR_FS,
    uniforms: {
      uBase: { value: CL('#101116') }, uPool: { value: CL('#2b2c35') }, uSpill: { value: CL('#2c2742') },
      uPoolC: { value: new THREE.Vector2() }, uPoolR: { value: 1 }, uWallZ: { value: WALLZ },
    },
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.z = WALLZ + 200;
  frameMat = new THREE.MeshStandardMaterial({ color: 0x34363e, metalness: 0.6, roughness: 0.36 });
  frameG = new THREE.Group();
  scene.add(wall, floor, frameG);

  backRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
  crackRT = new THREE.WebGLRenderTarget(256, 144, { depthBuffer: false });
  const glassU = () => ({
    tBack: { value: backRT.texture }, tCrack: { value: crackRT.texture }, tEnv: { value: cubeRT.texture },
    uRes: { value: new THREE.Vector2(1, 1) }, uTexel: { value: new THREE.Vector2(1 / 256, 1 / 144) }, uPane: { value: new THREE.Vector2(PW, PH) },
    uRefr: { value: 0.25 }, uOpacity: { value: 1 }, uCrackK: { value: 1 }, uEdge: { value: 1 }, uEnvI: { value: 0.55 },
    uWallZ: { value: WALLZ }, uLine: { value: 1 },
  });
  paneMat = new THREE.ShaderMaterial({ vertexShader: PANE_VS, fragmentShader: GLASS_FS, transparent: true, uniforms: { ...glassU(), uFlex: { value: new THREE.Vector4(0, 0, 0, 1) } } });
  pane = new THREE.Mesh(new THREE.BufferGeometry(), paneMat);
  xfTex = new THREE.DataTexture(new Float32Array(CAPS * 8), CAPS * 2, 1, THREE.RGBAFormat, THREE.FloatType);
  xfTex.needsUpdate = true;
  shardMat = new THREE.ShaderMaterial({ vertexShader: SHARD_VS, fragmentShader: GLASS_FS, transparent: true, uniforms: { ...glassU(), tXf: { value: xfTex } } });
  shardMat.uniforms.uRefr.value = 0.07;
  shardMat.uniforms.uEdge.value = 0;
  shardMat.uniforms.uLine.value = 0.6;
  // One stand-in triangle lets the shard shader compile up front.
  const stand = new THREE.BufferGeometry();
  stand.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 0.01, 0, 0, 0, 0.01, 0], 3));
  stand.setAttribute('normal', new THREE.Float32BufferAttribute([0, 0, 1, 0, 0, 1, 0, 0, 1], 3));
  stand.setAttribute('aPuv', new THREE.Float32BufferAttribute([0, 0, 0, 0, 0, 0], 2));
  stand.setAttribute('aSid', new THREE.Float32BufferAttribute([0, 0, 0], 1));
  stand.setAttribute('aSide', new THREE.Float32BufferAttribute([0, 0, 0], 1));
  shardMesh = new THREE.Mesh(stand, shardMat);
  shardMesh.frustumCulled = pane.frustumCulled = false;
  // The keyboard aim ring keeps the dark-theme focus colour.
  mark = new THREE.Mesh(new THREE.RingGeometry(0.028, 0.038, 40), new THREE.MeshBasicMaterial({ color: 0x40e2f3, toneMapped: false, depthTest: false, transparent: true }));
  mark.renderOrder = 2;
  mark.visible = false;
  scene.add(pane, shardMesh, mark);
  crackScene = new THREE.Scene();
  crackCam = new THREE.OrthographicCamera(-1, 1, 1, -1, -1, 1);
  crackMat = new THREE.ShaderMaterial({
    vertexShader: CRACK_VS, fragmentShader: CRACK_FS, uniforms: { uTime: { value: 0 } },
    depthTest: false, depthWrite: false,
    blending: THREE.CustomBlending, blendEquation: THREE.MaxEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
  });
  crackMesh = new THREE.Mesh(new THREE.BufferGeometry(), crackMat);
  crackMesh.frustumCulled = false;
  crackScene.add(crackMesh);

  panel.prepend(canvas);
  fitRenderer(renderer, panel, 1.5, onSize, 1.4e6);
  // A panel with no size yet still gets a frame.
  if (!built) onSize(16, 9);
  await idle();
  shardMesh.visible = true;
  // Async compile keeps the shader builds off the main thread.
  await renderer.compileAsync(scene, camera);
  shardMesh.visible = false;
  renderCracks();
  ready = true;
  draw();
  requestAnimationFrame(() => canvas.classList.add('on'));
}
start().catch(err => { console.error(err); failed(); });
</script>
</body>
</html>
