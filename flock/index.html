<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murmuration</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Murmuration: the dusk sky at full width under the shared header. */
:root {
  --dusk-top: oklch(0.29 0.08 288);
  --dusk-low: oklch(0.74 0.11 45);
  --reeds: oklch(0.14 0.025 296);
  --stage: linear-gradient(var(--dusk-top), var(--dusk-low) 68%, var(--reeds) 76%);
}
/* The hawk replaces the mouse cursor. */
@media (hover: hover) { .stage.live { cursor: none; } }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
/* On the dusk sky the fail line keeps a pale tone. */
.stage--flock .fail { color: oklch(0.94 0.02 300); }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Murmuration</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--flock" id="stage" tabindex="0" role="application" aria-label="A flock of starlings over a reedbed at dusk. Move the pointer, or drag, to hunt them as a hawk; click or tap to clap. Arrow keys move the hawk; Space claps.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Murmuration needs WebGL 2 with float textures, which this browser lacks.</p>
    </div>
    <div class="bar">
      <div class="actions">
        <button class="chip" id="roost" type="button">Roost</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt><span class="fine">Move</span><span class="touch">Drag</span></dt><dd>hawk</dd></div>
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>clap</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>clap</dd></div>
        <div class="fine"><dt><kbd>Arrows</kbd></dt><dd>move the hawk</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Murmuration</h1><div class="vignette" hidden></div></section>
</div>

<script type="module">
import { initPage, sound } from '../shared/stim.js';
initPage({ id: 'flock' });
const panel = document.getElementById('stage'), canvas = panel.querySelector('canvas');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; poke(); });
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));
const nextFrame = () => new Promise(r => requestAnimationFrame(r));

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
function lin(L, C, h) {
  const a = C * Math.cos(h * D2R), b = C * Math.sin(h * D2R);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
  ];
}
// Chroma shrinks until the colour fits sRGB.
function linear(L, C, h) {
  let c = lin(L, C, h);
  for (let i = 0; i < 24 && (Math.min(...c) < -1e-4 || Math.max(...c) > 1.0001); i++) c = lin(L, (C *= 0.9), h);
  return c.map(v => clamp(v));
}
const COL = {
  Sky0: linear(0.87, 0.09, 72),
  Sky1: linear(0.77, 0.125, 46),
  Sky2: linear(0.62, 0.14, 352),
  Sky3: linear(0.45, 0.125, 310),
  Sky4: linear(0.27, 0.085, 287),
  Sun: linear(0.93, 0.11, 80),
  CloudLo: linear(0.85, 0.12, 60),
  CloudHi: linear(0.7, 0.16, 356),
  CloudSh: linear(0.42, 0.085, 314),
  Hill: linear(0.46, 0.075, 318),
  Water: linear(0.32, 0.065, 296),
  ReedFar: linear(0.2, 0.045, 306),
  ReedNear: linear(0.13, 0.026, 296),
  Plume: linear(0.24, 0.045, 20),
  Rim: linear(0.82, 0.13, 60),
  Ink: linear(0.12, 0.022, 292),
  InkFar: linear(0.27, 0.06, 316),
  Star: linear(0.96, 0.03, 280),
};

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 10, LEAD = 0.004;
let ac = null, out = null, noise = null, askedAt = -1e9, voices = 0, restT = 0, clapNext = 0, rushNext = 0;
let wingG = null, wingF = null, wingP = null, chatG = null, sndAt = 0;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.1 * voices);

function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (err) { return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;
    out = ac.createGain();
    out.gain.value = 0.55;
    out.connect(comp);
    comp.connect(ac.destination);
    // One second of white noise feeds every burst.
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    bed();
  }
  // Off screen, the flock stays silent until the sky returns.
  if (!running) { ac.suspend()?.catch(() => {}); return; }
  if (ac.state !== 'running') { askedAt = performance.now(); ac.resume()?.catch(() => {}); }
}
// A context still waking queues sounds for a moment.
function live() {
  if (!sound.on || !ac || ac.state === 'closed') return null;
  return ac.state === 'running' || performance.now() - askedAt < 250 ? ac : null;
}
function track(src, ...tails) {
  voices++;
  src.onended = () => { voices--; tails.forEach(n => n.disconnect()); };
}
// Once the flock roosts, the context sleeps until the next gesture.
function rest() {
  clearTimeout(restT);
  if (!ac || ac.state !== 'running') return;
  restT = setTimeout(() => {
    if (!raf && ac.state === 'running') ac.suspend()?.catch(() => {});
  }, 1500);
}
const GESTURE_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter']);
function unlock(e) {
  if (!sound.on || (e.type === 'keydown' && !GESTURE_KEYS.has(e.key))) return;
  // A touch counts as a gesture only once the finger lifts.
  if (!ac && e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
  audio();
}
// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// Scales a buffer channel to a target loudness.
function norm(d, rms) {
  let s = 0;
  for (let i = 0; i < d.length; i++) s += d[i] * d[i];
  const k = rms / Math.sqrt(s / d.length || 1);
  for (let i = 0; i < d.length; i++) d[i] *= k;
}
// Each voice pans with its place in the sky.
function bus(a, x) {
  const p = a.createStereoPanner ? a.createStereoPanner() : a.createGain();
  if (p.pan) p.pan.value = clamp(x, -1, 1) * 0.6;
  p.connect(out);
  return p;
}
// A noise burst through one filter.
function burst(a, dst, t, type, f, q, g, tau, len) {
  const src = a.createBufferSource(), fl = a.createBiquadFilter(), ng = a.createGain();
  src.buffer = noise;
  fl.type = type;
  fl.frequency.value = f;
  fl.Q.value = q;
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(g, t + 0.0006);
  ng.gain.setTargetAtTime(0, t + 0.0006, tau);
  src.connect(fl).connect(ng).connect(dst);
  src.onended = () => ng.disconnect();
  src.start(t, Math.random() * 0.8, len);
  return src;
}
// Distant chatter: clicks, chirps and whistles from far birds.
function chatterBuffer() {
  const sr = ac.sampleRate, len = Math.round(sr * 9.7), buf = ac.createBuffer(2, len, sr);
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  const add = (at, n, fn, amp, pan) => {
    for (let i = 0; i < n && at + i < len; i++) {
      const v = fn(i) * amp;
      L[at + i] += v * (1 - pan);
      R[at + i] += v * pan;
    }
  };
  for (let e = 0; e < 9.7 * 34; e++) {
    const at = Math.floor(Math.random() * len), amp = 0.03 + 0.5 * Math.random() ** 3, pan = Math.random(), kind = Math.random();
    if (kind < 0.55) {
      // A chirp: a quick sine sweep.
      const n = Math.round(sr * rand(0.012, 0.06)), f0 = rand(2300, 5600), f1 = f0 * rand(0.6, 1.5);
      let ph = 0;
      add(at, n, i => { const u = i / n; ph += (TAU * (f0 + (f1 - f0) * u)) / sr; return Math.sin(ph) * Math.sin(Math.PI * u) ** 2; }, amp, pan);
    } else if (kind < 0.8) {
      // A rattle: a few dry clicks.
      const k = 3 + Math.floor(Math.random() * 5), gap = Math.round(sr * rand(0.012, 0.024)), f = (TAU * rand(3000, 6000)) / sr, n = Math.round(sr * 0.003);
      for (let j = 0; j < k; j++) add(at + j * gap, n, i => Math.sin(f * i) * Math.exp(-i / (n * 0.3)), amp * 0.8, pan);
    } else {
      // A whistle: a falling tone with a fast trill.
      const n = Math.round(sr * rand(0.08, 0.2)), f0 = rand(3000, 4600);
      let ph = 0;
      add(at, n, i => { const u = i / n; ph += (TAU * f0 * (1 - 0.3 * u) * (1 + 0.03 * Math.sin((TAU * 32 * i) / sr))) / sr; return Math.sin(ph) * Math.sin(Math.PI * u); }, amp * 0.6, pan);
    }
  }
  norm(L, 0.07);
  norm(R, 0.07);
  return buf;
}
// The bed: a wing rush steered by the flock, and far chatter.
function bed() {
  const sr = ac.sampleRate;
  const pink = ac.createBuffer(2, Math.round(sr * 4.3), sr);
  for (let c = 0; c < 2; c++) {
    const d = pink.getChannelData(c);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < d.length; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99765 * b0 + w * 0.099046;
      b1 = 0.963 * b1 + w * 0.2965164;
      b2 = 0.57 * b2 + w * 1.0526913;
      d[i] = b0 + b1 + b2 + w * 0.1848;
    }
    norm(d, 0.25);
  }
  const loop = (buf, rate, off) => {
    const s = ac.createBufferSource();
    s.buffer = buf;
    s.loop = true;
    s.playbackRate.value = rate;
    s.start(0, off);
    return s;
  };
  const filter = (type, f, q) => {
    const b = ac.createBiquadFilter();
    b.type = type;
    b.frequency.value = f;
    b.Q.value = q;
    return b;
  };
  const gain = v => { const g = ac.createGain(); g.gain.value = v; return g; };
  const lfo = (f, depth, param) => {
    const o = ac.createOscillator();
    o.frequency.value = f;
    o.connect(gain(depth)).connect(param);
    o.start();
  };
  // Thousands of wingbeats blur into a soft, fluttering rush.
  const bp = filter('bandpass', 850, 0.6), flut = gain(1), wg = gain(0);
  lfo(13.3, 0.16, flut.gain);
  lfo(8.7, 0.1, flut.gain);
  let end = out;
  if (ac.createStereoPanner) {
    const p = ac.createStereoPanner();
    p.connect(out);
    wingP = p.pan;
    end = p;
  }
  loop(pink, 1, 0).connect(bp).connect(filter('lowpass', 2600, 0.5)).connect(flut).connect(wg).connect(end);
  wingG = wg.gain;
  wingF = bp.frequency;
  const chat = chatterBuffer(), cg = gain(0), swell = gain(1), hp = filter('highpass', 1500, 0.5), lp = filter('lowpass', 5000, 0.5);
  hp.connect(lp).connect(swell).connect(cg).connect(out);
  loop(chat, 1, 0).connect(hp);
  loop(chat, 0.91, 4.3).connect(hp);
  lfo(0.071, 0.3, swell.gain);
  chatG = cg.gain;
}
// A hand clap: three quick slaps and a short room tail.
function clapSound(x) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < clapNext) return;
  clapNext = t + 0.08;
  const d = bus(a, x), g = level() * jit(0.05), f = 1250 * jit(0.06);
  [0, 0.0085, 0.0165].forEach((o, i) => burst(a, d, t + o + Math.random() * 0.002, 'bandpass', f * (1 + 0.05 * i), 1.5, (0.95 - 0.24 * i) * g, 0.0045, 0.03));
  burst(a, d, t, 'lowpass', 320, 0.7, 0.45 * g, 0.012, 0.06);
  const tail = burst(a, d, t + 0.02, 'bandpass', f * 0.8, 0.7, 0.2 * g, 0.06, 0.32);
  track(tail, d);
}
// Wings erupting: a fluttering surge of filtered noise.
function rush(x, amt, dur = 1.3) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < rushNext) return;
  rushNext = t + 0.12;
  const d = bus(a, x), src = a.createBufferSource(), bp = a.createBiquadFilter(), g = a.createGain(), fl = a.createGain(), o = a.createOscillator(), og = a.createGain();
  src.buffer = noise;
  src.loop = true;
  bp.type = 'bandpass';
  bp.Q.value = 0.9;
  bp.frequency.setValueAtTime(420 * jit(0.1), t);
  bp.frequency.exponentialRampToValueAtTime(1400 * jit(0.08), t + 0.22);
  bp.frequency.exponentialRampToValueAtTime(560, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.32 * amt * level() * jit(0.06), t + 0.06);
  g.gain.setTargetAtTime(0, t + 0.1, dur / 4);
  // The surge flutters at a wingbeat rate.
  o.frequency.value = 15 * jit(0.1);
  og.gain.value = 0.35;
  fl.gain.value = 1;
  o.connect(og).connect(fl.gain);
  src.connect(bp).connect(fl).connect(g).connect(d);
  src.start(t, Math.random() * 0.5);
  src.stop(t + dur + 0.3);
  o.start(t);
  o.stop(t + dur + 0.3);
  track(src, bp, fl, g, og, d);
}
let swell = 0;
// The rush follows the birds near the hawk; chatter follows the whole flock.
function soundTick(now) {
  if (!wingG || now - sndAt < 66) return;
  const a = live();
  if (!a) return;
  sndAt = now;
  const t = a.currentTime, air = clamp(probe.air), near = hawk.a * (1 - Math.exp(-probe.near / 420));
  const quiet = reduce ? 0.8 : 1, roosting = roostT >= 0 ? clamp(1 - (roostT - 8) / 3.5) : 1;
  wingG.setTargetAtTime((0.03 * air + 0.55 * near + 0.18 * swell) * quiet * roosting, t, 0.12);
  wingF.setTargetAtTime(650 + 750 * near + 500 * clamp(probe.alarmNear * 3), t, 0.2);
  wingP?.setTargetAtTime(clamp(hawk.x / A, -1, 1) * 0.6 * hawk.a, t, 0.25);
  const roostBuzz = roostT >= 0 ? Math.sin(Math.PI * clamp(roostT / 11.5)) : 0;
  chatG.setTargetAtTime((0.045 * air + 0.05 * roostBuzz + 0.05 * clamp(probe.alarm * 4)) * quiet * roosting, t, 0.5);
}

/* ---------- the sky's geometry ---------- */
// World units: the sky is two units tall at depth zero.
// The camera sits at z = CZ and looks down negative z.
// Bird state lives in TW-wide float textures.
const TW = 128, ROWS_MAX = 156, CZ = 4, CELL = 0.07, GZ = 16, TX = 4, TY = 4, TAU_E = 0.2;
const SPAN = 0.0165, HAWK_Z = 0.35, KEY_SPEED = 1.1;
let W = 0, H = 0, A = 16 / 9;
let rows = 64, GX = 0, GY = 0, AW = 0, AH = 0, fieldA = 0;
const GMIN = [0, 0, 0];

/* ---------- WebGL ---------- */
const HEAD = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
`;
const TRI = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const HASH = `
uint ih(uint x) {
  x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16;
  return x;
}
float h01(uint x) { return float(ih(x) >> 8) / 16777216.0; }
`;
// Field lookups: the 3D grid is tiled as slices in a 2D atlas.
const FIELD = `
uniform vec3 uGMin, uGf;
uniform float uCell;
uniform vec2 uAtlas;
vec4 fs(sampler2D t, vec3 p) {
  vec3 g = clamp((p - uGMin) / uCell - 0.5, vec3(0.0), uGf - 1.0);
  float z0 = floor(g.z), fz = g.z - z0, z1 = min(z0 + 1.0, uGf.z - 1.0);
  vec2 t0 = vec2(mod(z0, ${TX}.0), floor(z0 / ${TX}.0)) * uGf.xy;
  vec2 t1 = vec2(mod(z1, ${TX}.0), floor(z1 / ${TX}.0)) * uGf.xy;
  return mix(texture(t, (t0 + g.xy + 0.5) / uAtlas), texture(t, (t1 + g.xy + 0.5) / uAtlas), fz);
}
`;
// Each bird adds its velocity, a count and its alarm to one cell.
const SPLAT_VS = `${HEAD}
uniform sampler2D uPos, uVel, uAux;
uniform vec3 uGMin, uGf;
uniform float uCell;
uniform vec2 uAtlas;
out vec4 vV;
out float vE;
void main() {
  ivec2 ij = ivec2(gl_VertexID % ${TW}, gl_VertexID / ${TW});
  vec4 P = texelFetch(uPos, ij, 0), V = texelFetch(uVel, ij, 0);
  vec3 g = floor((P.xyz - uGMin) / uCell);
  gl_PointSize = 1.0;
  vV = vec4(V.xyz, 1.0);
  vE = exp(-V.w / ${TAU_E});
  if (texelFetch(uAux, ij, 0).z > 0.5 || any(lessThan(g, vec3(0.0))) || any(greaterThanEqual(g, uGf))) {
    gl_Position = vec4(2.0, 2.0, 0.0, 1.0);
    return;
  }
  vec2 px = vec2(mod(g.z, ${TX}.0), floor(g.z / ${TX}.0)) * uGf.xy + g.xy + 0.5;
  gl_Position = vec4(px / uAtlas * 2.0 - 1.0, 0.0, 1.0);
}`;
const SPLAT_FS = `${HEAD}
in vec4 vV;
in float vE;
layout(location = 0) out vec4 o0;
layout(location = 1) out vec4 o1;
void main() {
  o0 = vV;
  o1 = vec4(vE, 0.0, 0.0, 0.0);
}`;
// A five-tap blur along one grid axis, within the atlas tiles.
const BLUR_FS = `${HEAD}
uniform sampler2D uA, uB;
uniform ivec3 uStep, uG;
layout(location = 0) out vec4 oA;
layout(location = 1) out vec4 oB;
void main() {
  ivec2 p = ivec2(gl_FragCoord.xy), tile = p / uG.xy;
  ivec3 c = ivec3(p - tile * uG.xy, tile.x + tile.y * ${TX});
  oA = vec4(0.0);
  oB = vec4(0.0);
  if (c.z >= uG.z) return;
  for (int k = -2; k <= 2; k++) {
    ivec3 q = c + uStep * k;
    if (any(lessThan(q, ivec3(0))) || any(greaterThanEqual(q, uG))) continue;
    float w = k == 0 ? 0.375 : (k == 1 || k == -1) ? 0.25 : 0.0625;
    ivec2 t = ivec2(q.z % ${TX}, q.z / ${TX}) * uG.xy + q.xy;
    oA += texelFetch(uA, t, 0) * w;
    oB += texelFetch(uB, t, 0) * w;
  }
}`;
// One step of flight for every bird.
const UPDATE_FS = `${HEAD}
uniform sampler2D uPos, uVel, uAux, uF0, uF1;
${FIELD}
uniform float uDt, uTime, uA, uStretch, uRoostT;
uniform vec2 uWake;
uniform vec3 uM, uC0, uC1, uC2;
uniform vec4 uHawk, uClap, uSeed, uRoost;
uniform vec2 uOrigin;
uniform uint uFrame;
layout(location = 0) out vec4 oPos;
layout(location = 1) out vec4 oVel;
layout(location = 2) out vec4 oAux;
${HASH}
const float CZ = ${CZ}.0, RHO = 18.0, V0 = 0.55;
float dn(vec3 p) { return fs(uF0, p).w; }
// A slow, divergence-free swirl stretches and folds the flock.
vec3 mode(vec3 p, vec3 k, vec3 a, float w) { return cross(k, a) * sin(dot(k, p) + w); }
vec3 flow(vec3 p, float t) {
  return (mode(p, vec3(1.9, 0.7, 0.9), vec3(0.2, 1.0, -0.4), t * 0.17)

  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, probeT.fb);
  gl.viewport(0, 0, 2, 1);
  gl.useProgram(P.probe.p);
  gridUniforms(P.probe);
  bindTex(3, FB.t0);
  bindTex(4, FB.t1);
  gl.uniform2f(P.probe.u.uHawk, hawk.x, hawk.y);
  gl.uniform2i(P.probe.u.uAt, AW, AH);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // A fresh buffer per read keeps Chrome's readback path quiet.
  gl.deleteBuffer(pbo);
  pbo = gl.createBuffer();
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo);
  gl.bufferData(gl.PIXEL_PACK_BUFFER, 32, gl.STREAM_READ);
  gl.readPixels(0, 0, 2, 1, gl.RGBA, gl.FLOAT, 0);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
  fence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

/* ---------- one loop, running while the flock flies ---------- */
let raf = 0, last = 0, running = false, onScreen = false, lowDpr = false, slow = 0, frames = 0;
function tick(dt, now) {
  const sdt = dt * (reduce ? 0.5 : 1);
  hawkStep(dt, now);
  if (roostT < 0 && now - lastInput > IDLE()) startRoost();
  if (roostT >= 0) roostT += dt;
  if (wakeT >= 0 && (wakeT += sdt) > 3) wakeT = -1;
  swell *= Math.exp(-dt * 1.5);
  // Now and then a bird startles by itself, and a wave runs.
  if (roostT < 0 && simT > nextSeed) {
    const L = LEADERS[Math.floor(Math.random() * 3)];
    seedQ = [L[0], L[1], L[2], 0.16];
    origin = [L[0], L[1]];
    nextSeed = simT + rand(4, 9);
  }
  simT += sdt;
  leaders(simT);
  // While roosting, the flock hangs over the roost, tight and low.
  if (roostT >= 0) {
    const k = clamp(roostT / 2);
    M[0] = lerp(M[0], roostX, k);
    M[1] = lerp(M[1], 0.18, k);
    stretch *= 1 - k;
  }
  drawT += sdt;
  simStep(sdt);
}
function frame(now) {
  raf = 0;
  if (!running || !ready) return;
  const raw = Math.max(0, (now - last) / 1000), dt = Math.min(raw, 1 / 30);
  last = now;
  // Sustained slow frames drop the pixel ratio, then halve the flock.
  if (++frames > 40) {
    slow = raw > 0.024 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 45) {
      slow = 0;
      if (!lowDpr) { lowDpr = true; fit(); } else if (rows > 64) rows = 64;
    }
  }
  tick(dt, now);
  draw();
  readProbe();
  soundTick(now);
  if (frames === 2) canvas.classList.add('on');
  // Once every bird has settled, the loop stops until the next input.
  if (roostT > 12) {
    asleep = true;
    rest();
    return;
  }
  raf = requestAnimationFrame(frame);
}
function kick() {
  if (!running || !ready || raf) return;
  asleep = false;
  last = performance.now();
  raf = requestAnimationFrame(frame);
  // A flock woken by a mere hover wakes the sleeping context too.
  if (sound.on && ac && ac.state !== 'running') audio();
}
// Off screen or hidden, the flock pauses and goes quiet.
function sync() {
  const run = ready && onScreen && !document.hidden;
  if (run === running) return;
  running = run;
  if (run) {
    if (!asleep) kick();
    if (sound.on && ac && ac.state !== 'running' && !asleep) audio();
  } else {
    cancelAnimationFrame(raf);
    raf = 0;
    if (ac && ac.state === 'running') ac.suspend()?.catch(() => {});
  }
}
function fit() {
  const w = panel.clientWidth, h = panel.clientHeight;
  if (!w || !h) return;
  rect = null;
  const p = Math.min(devicePixelRatio || 1, lowDpr ? 1 : 2, Math.sqrt(1.4e6 / (w * h)));
  const cw = Math.round(w * p), ch = Math.round(h * p);
  W = w;
  H = h;
  A = w / h;
  if (canvas.width !== cw || canvas.height !== ch) {
    canvas.width = cw;
    canvas.height = ch;
  }
  if (!ready) return;
  allocField();
  allocBirds();
  // A resized canvas is blank until drawn, so draw now.
  if (running) draw();
}

/* ---------- input ---------- */
let rect = null;
addEventListener('scroll', () => { rect = null; }, { passive: true });
function local(e) {
  const r = rect || (rect = panel.getBoundingClientRect());
  return [e.clientX - r.left, e.clientY - r.top];
}
const toSky = (x, y) => [(x / W * 2 - 1) * A, 1 - (y / H) * 2];
function aim(sx, sy, src) {
  // A visible hawk swoops over; a gone one appears in place.
  if (hawk.a < 0.05) { hawk.x = sx; hawk.y = sy; hawk.vx = 0; hawk.vy = 0; }
  hawk.tx = sx;
  hawk.ty = sy;
  hawk.on = true;
  hawk.src = src;
}
const taps = new Map();
panel.addEventListener('pointerdown', e => {
  if (!ready || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const [x, y] = local(e), [sx, sy] = toSky(x, y);
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  poke();
  aim(sx, sy, e.pointerType);
  if (e.pointerType === 'mouse') clap(sx, sy);
  else taps.set(e.pointerId, { x, y, t: e.timeStamp, moved: false });
});
panel.addEventListener('pointermove', e => {
  if (!ready) return;
  const tp = taps.get(e.pointerId);
  if (e.pointerType !== 'mouse' && !tp) return;
  const [x, y] = local(e);
  if (tp && Math.hypot(x - tp.x, y - tp.y) > 12) tp.moved = true;
  const [sx, sy] = toSky(x, y);
  aim(sx, sy, e.pointerType);
  poke();
});
function lift(e) {
  const tp = taps.get(e.pointerId);
  if (!tp) return;
  taps.delete(e.pointerId);
  // A short touch that stays put is a clap.
  if (e.type === 'pointerup' && !tp.moved && e.timeStamp - tp.t < 350) clap(...toSky(tp.x, tp.y));
  if (!taps.size) hawk.on = false;
}
panel.addEventListener('pointerup', lift);
panel.addEventListener('pointercancel', lift);
panel.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && hawk.src === 'mouse') hawk.on = false; });
panel.addEventListener('contextmenu', e => e.preventDefault());

// Space claps under a nearby hawk, or else at the flock's heart.
function spaceClap() {
  if (hawk.on && hawk.a > 0.3 && Math.hypot(hawk.x - probe.x, hawk.y - probe.y) < 0.6) clap(hawk.x, hawk.y);
  else clap(probe.x + rand(-0.08, 0.08), probe.y + rand(-0.06, 0.06));
}
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    if (!ready) return;
    if (!keys.size && (!hawk.on || hawk.src !== 'key')) {
      // The keyboard hawk starts where it is, or above the flock.
      const seen = hawk.a > 0.3;
      hawk.tx = seen ? hawk.x : clamp(probe.x, -A + 0.1, A - 0.1);
      hawk.ty = seen ? hawk.y : Math.min(0.85, probe.y + 0.4);
      if (!seen) { hawk.x = hawk.tx; hawk.y = hawk.ty; hawk.vx = 0; hawk.vy = 0; }
      hawk.on = true;
      hawk.src = 'key';
    }
    keys.add(e.key);
    poke();
  } else if (e.key === ' ') {
    // Buttons and links keep Space for themselves.
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (!e.repeat && ready) {
      poke();
      spaceClap();
    }
  }
});
addEventListener('keyup', e => keys.delete(e.key));
addEventListener('blur', () => keys.clear());

const roostB = document.getElementById('roost');
roostB.addEventListener('click', () => {
  if (!ready) return;
  if (roostT >= 0) poke();
  else {
    lastInput = performance.now();
    startRoost();
    kick();
  }
});
sound.onChange(on => {
  if (on) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});

/* ---------- start: shaders link while the page settles ---------- */
function failed() {
  ready = false;
  sync();
  canvas.hidden = true;
  panel.querySelector('.fail').hidden = false;
  panel.classList.remove('live');
  roostB.disabled = true;
}
async function prepare() {
  await initGL();
  allocField();
  allocBirds();
  seedFlock();
  // A few seconds of flight run before the first paint.
  for (let k = 0; k < 6; k++) {
    for (let j = 0; j < 30; j++) {
      simT += 1 / 60;
      leaders(simT);
      simStep(1 / 60);
    }
    await nextFrame();
  }
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; sync(); });
canvas.addEventListener('webglcontextrestored', async () => {
  try {
    await prepare();
    ready = true;
    sync();
  } catch (err) { console.error(err); failed(); }
});
async function boot() {
  await idle();
  fit();
  if (!W) {
    W = 1160;
    H = 652;
    A = W / H;
    canvas.width = W;
    canvas.height = H;
  }
  rows = matchMedia('(pointer: coarse)').matches || (navigator.hardwareConcurrency || 8) < 6 ? 64 : ROWS_MAX;
  try { await prepare(); } catch (err) { console.error(err); failed(); return; }
  ready = true;
  lastInput = performance.now();
  panel.classList.add('live');
  new ResizeObserver(fit).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; sync(); }).observe(panel);
  document.addEventListener('visibilitychange', sync);
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
