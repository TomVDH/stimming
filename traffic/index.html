<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.09 0.008 260); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traffic wave</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./sim.js">
<link rel="modulepreload" href="./render.js">
<link rel="modulepreload" href="./sound.js">
<link rel="modulepreload" href="../shared/glow.js">
<link rel="modulepreload" href="../shared/detail.js">
<link rel="modulepreload" href="../shared/gl.js">
<style>
/* Traffic wave: a ring road at night, seen from high above. */
:root { --stage: oklch(0.09 0.008 260); }
.stage--traffic { background: var(--stage); }
.stage--traffic canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--traffic canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--traffic canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Traffic wave</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--traffic" id="stage" tabindex="0" role="application" aria-label="A ring road at night, seen from high above. About twenty cars drive round it in one lane, headlights on, like the real ring-road experiment of 2008. Beside the ring, a strip plots each car's place on the ring against time: free cars draw steady lines. Tap a car and it brakes hard; the cars behind brake in turn, their brake lights glow red, and the jam slides backward round the ring long after the first car drives on. The strip draws the jam as a red band leaning back. Hold a car to keep it stopped. The Cars slider sets how many cars share the ring: past about twenty-five the flow jams by itself. Press Space to brake the car at the start line and E to space the cars out evenly.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Traffic wave</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
