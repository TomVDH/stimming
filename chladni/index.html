<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chladni plate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Chladni plate: a coloured steel plate, sand and a tuning rail. */
:root { --stage: oklch(0.17 0.012 262); }
.stage { cursor: ns-resize; }
.stage.grip { cursor: grab; }
.stage.gripping { cursor: grabbing; }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
/* On the dark stage the fail line keeps a pale tone. */
.fail { color: oklch(0.74 0.02 285); cursor: default; }
/* Each finish chip shows its plate and its sand, split diagonally. */
.chip i { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--pl) 50%, var(--sd) 50%); }
.chip[data-hue="steel"] { --pl: oklch(0.4 0.018 250); --sd: oklch(0.92 0.035 86); }
.chip[data-hue="cobalt"] { --pl: oklch(0.42 0.16 264); --sd: oklch(0.92 0.15 97); }
.chip[data-hue="vermilion"] { --pl: oklch(0.6 0.2 33); --sd: oklch(0.19 0.015 30); }
/* The live pitch sits above the rail in fixed-width figures. */
.hz {
  position: absolute; z-index: 1; margin: 0; pointer-events: none;
  font: 500 12px/1 ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums;
  color: var(--muted); transition: color 0.3s ease;
}
.hz.on { color: var(--fg); }
@media (prefers-reduced-motion: reduce) { .stage canvas, .hz { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/chladni.svg)"></span><span class="intro-name">Chladni plate</span><span class="intro-sub">Stimming No. 15</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--chladni" id="stage" tabindex="0" role="application" aria-label="A coloured steel plate covered in sand, seen at an angle: drag up or down, or slide the cap on the right edge, to tune it, and tap to toss sand. Arrow keys step between patterns, Space spreads the sand again, Enter tosses it and C changes the finish.">
      <canvas aria-hidden="true"></canvas>
      <p class="hz" aria-hidden="true"></p>
      <p class="fail" hidden>Chladni plate needs WebGL 2 with float textures, which this browser lacks.</p>
    </div>
    <div class="bar">
      <div class="choices">
        <button class="chip" type="button" data-hue="steel" aria-pressed="true" aria-keyshortcuts="C"><i></i>Steel</button>
        <button class="chip" type="button" data-hue="cobalt" aria-pressed="false" aria-keyshortcuts="C"><i></i>Cobalt</button>
        <button class="chip" type="button" data-hue="vermilion" aria-pressed="false" aria-keyshortcuts="C"><i></i>Vermilion</button>
      </div>
      <div class="actions">
        <button class="chip" id="scatter" type="button" aria-keyshortcuts="Space">Reset</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag up or down</dt><dd>tune</dd></div>
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>toss sand</dd></div>
        <div class="fine"><dt><kbd>Arrows</kbd></dt><dd>next pattern</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>reset sand</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Chladni plate</h1><div class="vignette" hidden></div></section>
</div>

<script type="module">
import { initPage, sound } from '../shared/stim.js';
initPage({ id: 'chladni' });
const panel = document.getElementById('stage'), canvas = panel.querySelector('canvas');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; });
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);

const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));

const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

/* ---------- vectors and matrices, column-major ---------- */
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];

  const z = unit(sub(e, c)), x = unit(cross(up, z)), y = cross(z, x);

  const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10, b02 = a00 * a13 - a03 * a10;
  const b03 = a01 * a12 - a02 * a11, b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12;
  const b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30, b08 = a20 * a33 - a23 * a30;
  const b09 = a21 * a32 - a22 * a31, b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;
  const d = 1 / (b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06);
  return [
    (a11 * b11 - a12 * b10 + a13 * b09) * d, (a02 * b10 - a01 * b11 - a03 * b09) * d,
    (a31 * b05 - a32 * b04 + a33 * b03) * d, (a22 * b04 - a21 * b05 - a23 * b03) * d,
    (a12 * b08 - a10 * b11 - a13 * b07) * d, (a00 * b11 - a02 * b08 + a03 * b07) * d,
    (a32 * b02 - a30 * b05 - a33 * b01) * d, (a20 * b05 - a22 * b02 + a23 * b01) * d,
    (a10 * b10 - a11 * b08 + a13 * b06) * d, (a01 * b08 - a00 * b10 - a03 * b06) * d,
    (a30 * b04 - a31 * b02 + a33 * b00) * d, (a21 * b02 - a20 * b04 - a23 * b00) * d,
    (a11 * b07 - a10 * b09 - a12 * b06) * d, (a00 * b09 - a01 * b07 + a02 * b06) * d,
    (a31 * b01 - a30 * b03 - a32 * b00) * d, (a20 * b03 - a21 * b01 + a22 * b00) * d,

const xf = (m, [x, y, z]) => [
  m[0] * x + m[4] * y + m[8] * z + m[12], m[1] * x + m[5] * y + m[9] * z + m[13],
  m[2] * x + m[6] * y + m[10] * z + m[14], m[3] * x + m[7] * y + m[11] * z + m[15],
];

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
function lin(L, C, h) {
  const a = C * Math.cos(h * D2R), b = C * Math.sin(h * D2R);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,

}
// Chroma shrinks until the colour fits sRGB.
function linear(L, C, h, k = 1) {
  let c = lin(L, C, h);
  for (let i = 0; i < 24 && (Math.min(...c) < -1e-4 || Math.max(...c) > 1.0001); i++) c = lin(L, (C *= 0.9), h);
  return c.map(v => clamp(v) * k);
}
// Each finish: plate, band, face, bolt, rail cap and four sand tones.
// The second sand tone is the sand's body colour.
const HUES = {
  steel: {
    plate: [0.4, 0.018, 250], hi: [0.47, 0.022, 250], face: [0.27, 0.015, 255], nut: [0.62, 0.012, 250], cap: [0.92, 0.035, 86],
    g: [[0.97, 0.02, 92], [0.92, 0.035, 86], [0.86, 0.045, 78], [0.78, 0.05, 70]],
  },
  cobalt: {
    plate: [0.42, 0.16, 264], hi: [0.5, 0.16, 262], face: [0.29, 0.12, 266], nut: [0.74, 0.03, 250], cap: [0.92, 0.15, 97],
    g: [[0.96, 0.11, 102], [0.92, 0.15, 97], [0.87, 0.17, 90], [0.8, 0.16, 82]],
  },
  vermilion: {
    plate: [0.6, 0.2, 33], hi: [0.67, 0.19, 38], face: [0.42, 0.16, 30], nut: [0.84, 0.012, 60], cap: [0.66, 0.2, 35],
    g: [[0.25, 0.02, 30], [0.19, 0.015, 30], [0.15, 0.012, 300], [0.31, 0.03, 40]],
  },
};
const ORDER = Object.keys(HUES);
const PALS = {};
for (const k of ORDER) {
  const h = HUES[k];
  PALS[k] = {
    g: new Float32Array(h.g.flatMap(c => linear(...c))), sand: linear(...h.g[1]),
    plate: linear(...h.plate), hi: linear(...h.hi), face: linear(...h.face), nut: linear(...h.nut), cap: linear(...h.cap),
  };
}
const STAGE = { uStage: linear(0.17, 0.012, 262), uSlot: linear(0.11, 0.01, 262), uNotch: linear(0.38, 0.015, 262) };

/* ---------- the mode ladder ---------- */
// Each rung: n, m, the sign between the terms, a MIDI note.
// The notes walk a D minor pentatonic scale.
const LADDER = [
  [1, 2, 1, 50], [2, 3, -1, 53], [2, 4, 1, 55], [3, 4, -1, 57], [2, 5, -1, 60], [3, 5, 1, 62], [2, 6, 1, 65],
  [3, 6, -1, 67], [4, 6, 1, 69], [4, 7, -1, 72], [5, 7, 1, 74], [4, 8, -1, 77], [6, 8, 1, 79],
];
const K = LADDER.length, START = 2, WIDTH = 0.42, DETENT = 0.8, SMIN = -0.45, SMAX = K - 0.55;
const kOf = i => Math.PI * Math.sqrt((LADDER[i][0] ** 2 + LADDER[i][1] ** 2) / 2);
// The pitch lingers near each rung, so resonance is easy to find.
const ease = t => t - (DETENT * Math.sin(TAU * t)) / TAU;
function semis(s) {
  if (s <= 0) return LADDER[0][3] + s * 2.5;
  if (s >= K - 1) return LADDER[K - 1][3] + (s - K + 1) * 2.5;
  const k = Math.floor(s);
  return lerp(LADDER[k][3], LADDER[k + 1][3], ease(s - k));
}
const resp = (st, k) => 1 / (1 + ((st - LADDER[k][3]) / WIDTH) ** 2);

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 10, LEAD = 0.004;
let ac = null, out = null, noise = null, sand = null, askedAt = -1e9, voices = 0, restT = 0;
let tone = null, tossNext = 0, pourNext = 0, chimeNext = 0;
const jit = x => 1 + (Math.random() * 2 - 1) * x;

function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (err) { return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;
    out = ac.createGain();
    out.gain.value = 0.55;
    out.connect(comp);
    comp.connect(ac.destination);
    // One second of white noise feeds the rosin rasp.
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    sand = sandBuffer();
    voice();
  }
  if (ac.state !== 'running') { askedAt = performance.now(); ac.resume()?.catch(() => {}); }
}
// A context still waking queues sounds for a moment.
function live() {
  if (!sound.on || !ac || ac.state === 'closed') return null;
  return ac.state === 'running' || performance.now() - askedAt < 250 ? ac : null;
}
function track(src, ...tails) {
  voices++;
  src.onended = () => { voices--; tails.forEach(n => n.disconnect()); };
}
// Once the plate rests, the context sleeps until the next gesture.
function rest() {
  clearTimeout(restT);
  if (!ac || ac.state === 'closed') return;
  restT = setTimeout(() => {
    if (!raf && !ptrs.size && ac.state === 'running') ac.suspend()?.catch(() => {});
  }, 1500);
}
const GESTURE_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter', 'c', 'C']);
function unlock(e) {
  if (!sound.on || (e.type === 'keydown' && !GESTURE_KEYS.has(e.key))) return;
  // A touch counts as a gesture only once the finger lifts.
  if (!ac && e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
  audio();
}
// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// Scales a buffer channel to a target loudness.
function norm(d, rms) {
  let s = 0;
  for (let i = 0; i < d.length; i++) s += d[i] * d[i];
  const k = rms / Math.sqrt(s / d.length || 1);
  for (let i = 0; i < d.length; i++) d[i] *= k;
}
// Sand: a faint wash under thousands of tiny grain ticks.
function sandBuffer() {
  const sr = ac.sampleRate, len = Math.round(sr * 2.3), buf = ac.createBuffer(2, len, sr);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.04;
    for (let n = Math.round(2.3 * 2400), k = 0; k < n; k++) {
      const at = Math.floor(Math.random() * (len - 64)), amp = 0.04 + 0.5 * Math.random() ** 4, dec = rand(3, 12);
      for (let i = 0; i < 48; i++) d[at + i] += amp * (Math.random() * 2 - 1) * Math.exp(-i / dec);

// A bowed string's spectrum: every harmonic, falling away gently.
function bowWave() {

  return ac.createPeriodicWave(re, im);
}
const gainOf = v => { const g = ac.createGain(); g.gain.value = v; return g; };

  const b = ac.createBiquadFilter();
  b.type = type;
  b.frequency.value = f;
  b.Q.value = q;
  return b;
}
// One continuous voice: sine, beating twin, octave and bowed tone.
// A looped sand bed hisses under it.
function voice() {

  bow.frequency.value = 196;

  twin.connect(gainOf(0.22)).connect(tg);

// The voice follows the plate; small changes skip the automation queue.
function sing(f, lvl, bowAmt, vib, rosin, hiss) {
  if (!tone || !ac || ac.state !== 'running') return;
  const t = ac.currentTime, v = [f, lvl, bowAmt, vib, rosin, hiss], L = tone.last;
  const moved = (i, eps) => L[i] === undefined || Math.abs(v[i] - L[i]) > eps;

    tone.twin.frequency.setTargetAtTime(f * 1.0026, t, 0.03);
    tone.oct.frequency.setTargetAtTime(f * 2, t, 0.03);
    tone.bow.frequency.setTargetAtTime(f, t, 0.03);

  if (moved(1, 0.002)) { tone.tg.gain.setTargetAtTime(lvl, t, 0.06); L[1] = lvl; }

// Each voice pans with its place on the plate.
function bus(a, x) {
  const p = a.createStereoPanner ? a.createStereoPanner() : a.createGain();
  if (p.pan) p.pan.value = clamp(x, -1, 1) * 0.6;
  p.connect(out);

// A thrown handful: a quick whoosh, then the patter of landing.
function tossSound(x) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < tossNext) return;
  tossNext = t + 0.08;
  const dst = bus(a, x);
  [[0, 3400, 0.24, 0.07, 0.4], [0.2, 5200, 0.12, 0.16, 0.7]].forEach(([at, f, g, tau, len]) => {
    const src = a.createBufferSource(), bp = a.createBiquadFilter(), ng = a.createGain();

    bp.type = 'bandpass';
    bp.frequency.value = f * jit(0.06);
    bp.Q.value = 0.8;
    ng.gain.setValueAtTime(0, t + at);
    ng.gain.linearRampToValueAtTime(g * jit(0.1), t + at + 0.012);
    ng.gain.setTargetAtTime(0, t + at + 0.012, tau);
    src.connect(bp).connect(ng).connect(dst);
    src.start(t + at, Math.random() * 1.5);
    src.stop(t + at + len);
    track(src, bp, ng, ...(at ? [dst] : []));

}
// Scattering pours sand over the whole plate.
function pourSound() {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < pourNext) return;
  pourNext = t + 0.4;
  const src = a.createBufferSource(), bp = a.createBiquadFilter(), g = a.createGain();
  src.buffer = sand;
  src.playbackRate.value = jit(0.05);
  bp.type = 'bandpass';
  bp.Q.value = 0.7;
  bp.frequency.setValueAtTime(2600 * jit(0.05), t);
  bp.frequency.exponentialRampToValueAtTime(5400, t + 1.1);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.3 * jit(0.08), t + 0.16);
  g.gain.setTargetAtTime(0, t + 0.55, 0.28);
  src.connect(bp).connect(g).connect(out);
  src.start(t, Math.random() * 0.8);
  src.stop(t + 2.2);
  track(src, bp, g);
}
// A new colour rings a small glassy bell at the plate's pitch.
function chime(f) {
  const a = live();
  if (!a || voices > MAXV - 3) return;
  const t = a.currentTime + LEAD;
  if (t < chimeNext) return;
  chimeNext = t + 0.12;
