<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}/* The how-to line is as quiet as the home link. */
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 28px; }

  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin: 0 0 0 auto;
  font-size: 13px; color: var(--muted);
}

<title>Chladni plate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600&display=swap">
<style>
/* Layout: header row, the plate at full width, one chip row. */
:root {
  --bg: oklch(0.16 0.012 275);
  --surface: oklch(0.195 0.014 275);
  --line: oklch(0.29 0.016 275);
  --fg: oklch(0.94 0.008 275);
  --muted: oklch(0.64 0.02 275);
  --focus: oklch(0.84 0.13 205);
  --pick: oklch(0.7 0.18 320 / 0.35);
  --studio: oklch(0.15 0.025 272);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
::selection { background: var(--pick); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: clamp(20px, 3.4vw, 40px); }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.tools { display: flex; align-items: center; gap: 8px; }
.home { font-size: 14px; color: var(--muted); text-decoration: none; border-radius: 4px; transition: color 0.2s ease; }
.home:hover { color: var(--fg); }
/* The sound toggle sits as quietly as the home link. */
.snd {
  display: grid; place-items: center; width: 28px; height: 28px; margin-block: -4px; padding: 0;
  color: var(--muted); background: none; border: 0; border-radius: 6px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: color 0.2s ease;
}
.snd:hover { color: var(--fg); }
.snd svg {
  width: 18px; height: 18px; fill: none; stroke: currentColor;
  stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
}
.snd[aria-pressed="true"] .off, .snd[aria-pressed="false"] .on { display: none; }
@media (pointer: coarse) { .snd { width: 40px; height: 40px; margin-block: -10px; } }
main { display: grid; gap: 14px; min-width: 0; }
/* The stage is 16:9, 4:5 on phones. */
.stage {
  position: relative; width: 100%; aspect-ratio: 16 / 9;
  max-height: max(320px, calc(100vh - 176px)); max-height: max(320px, calc(100svh - 176px));
  border-radius: 18px; overflow: hidden; background: var(--studio); cursor: ns-resize;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
.stage.grip { cursor: grab; }
.stage.gripping { cursor: grabbing; }
.stage:focus-visible { outline-offset: 3px; }
@media (max-width: 640px) { .stage { aspect-ratio: 4 / 5; } }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
/* On the dark stage the line keeps a pale tone. */
.fail {
  position: absolute; inset: 0; margin: 0; padding: 16px; display: grid; place-items: center; text-align: center;
  font-size: 14px; color: oklch(0.74 0.02 285); cursor: default;
}
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; cursor: pointer;
  font: inherit; font-size: 13px; color: var(--muted);
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.2s ease, border-color 0.2s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.chip:hover { color: var(--fg); border-color: var(--muted); }
.chip[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
.chip:active { transform: scale(0.94); transition-duration: 0.08s; }
.chip:disabled { opacity: 0.45; cursor: default; }
/* Each colour chip carries a small flat swatch. */
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--sw); }
.chip[data-hue="white"] { --sw: oklch(0.97 0.004 250); }
.chip[data-hue="gold"] { --sw: oklch(0.84 0.15 82); }
.chip[data-hue="ice"] { --sw: oklch(0.82 0.12 222); }
#scatter { margin-left: 8px; }
@media (pointer: coarse) { .chip { padding: 10px 16px; } }
@media (prefers-reduced-motion: reduce) { .chip, .home, .snd, .stage canvas { transition: none; } }
</style>

<body>

<div class="wrap">
  <header>
    <h1>Chladni plate</h1>
    <div class="tools">
      <button class="snd" id="snd" type="button" aria-label="Sound" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 8h2.6l3.9-3.2v10.4L5.6 12H3z"/>
          <path class="on" d="M12.8 8.1a3 3 0 0 1 0 3.8M15.1 6.1a6 6 0 0 1 0 7.8"/>
          <path class="off" d="M13.2 8l4 4M17.2 8l-4 4"/>
        </svg>
      </button>
      <a class="home" href="../index.html">Stimming</a>
    </div>
  </header>
  <main>
    <div class="stage" id="stage" tabindex="0" role="application" aria-label="A glowing plate covered in sand: drag up or down, or slide the dot on the right edge, to tune it, and tap to toss sand. Arrow keys step between patterns, Space scatters the sand, Enter tosses it and C changes its colour.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Chladni plate needs WebGL 2 with float textures, which this browser lacks.</p>
    </div>
    <div class="foot">
      <div class="ctl">
        <button class="chip" type="button" data-hue="white" aria-pressed="true"><i></i>White</button>
        <button class="chip" type="button" data-hue="gold" aria-pressed="false"><i></i>Gold</button>
        <button class="chip" type="button" data-hue="ice" aria-pressed="false"><i></i>Ice</button>
        <button class="chip" id="scatter" type="button" aria-keyshortcuts="Space">Scatter</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag up or down</dt><dd>tune</dd></div>
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>toss sand</dd></div>
        <div class="fine"><dt><kbd>Arrows</kbd></dt><dd>next pattern</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>scatter</dd></div>
        <div class="fine"><dt><kbd>C</kbd></dt><dd>colour</dd></div>
      </dl>
    </div>
  </main>
</div>

<script type="module">
const panel = document.getElementById('stage'), canvas = panel.querySelector('canvas');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; });
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));
const nextFrame = () => new Promise(r => requestAnimationFrame(r));

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
function lin(L, C, h) {
  const a = C * Math.cos(h * D2R), b = C * Math.sin(h * D2R);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,

}
// Chroma shrinks until the colour fits sRGB.
function linear(L, C, h, k = 1) {
  let c = lin(L, C, h);
  for (let i = 0; i < 24 && (Math.min(...c) < -1e-4 || Math.max(...c) > 1.0001); i++) c = lin(L, (C *= 0.9), h);
  return c.map(v => clamp(v) * k);
}
// Each colour: four grain tones, a glow tint and a stage wash.
const HUES = {
  white: { g: [[0.99, 0.004, 250], [0.95, 0.012, 245], [0.9, 0.02, 235], [0.85, 0.03, 262]], glow: [0.84, 0.05, 240], wash: [0.55, 0.08, 255] },
  gold: { g: [[0.95, 0.07, 98], [0.87, 0.15, 86], [0.79, 0.16, 70], [0.71, 0.16, 55]], glow: [0.76, 0.16, 68], wash: [0.5, 0.11, 60] },
  ice: { g: [[0.96, 0.04, 205], [0.87, 0.11, 215], [0.78, 0.13, 232], [0.7, 0.15, 258]], glow: [0.76, 0.13, 232], wash: [0.48, 0.11, 245] },
};
const ORDER = Object.keys(HUES);
const PALS = {};
for (const k of ORDER) {
  const h = HUES[k];
  PALS[k] = { g: new Float32Array(h.g.flatMap(c => linear(...c))), glow: linear(...h.glow), wash: linear(...h.wash) };
}
const STAGE = {
  uStage: linear(0.15, 0.025, 272), uPlateC: linear(0.19, 0.045, 258),
  uEdge: linear(0.62, 0.13, 248), uLine: linear(0.4, 0.03, 260), uHot: linear(0.99, 0.01, 250),
};

/* ---------- the mode ladder ---------- */
// Each rung: n, m, the sign between the terms, a MIDI note.
// The notes walk a D minor pentatonic scale.
const LADDER = [
  [1, 2, 1, 50], [2, 3, -1, 53], [2, 4, 1, 55], [3, 4, -1, 57], [2, 5, -1, 60], [3, 5, 1, 62], [2, 6, 1, 65],
  [3, 6, -1, 67], [4, 6, 1, 69], [4, 7, -1, 72], [5, 7, 1, 74], [4, 8, -1, 77], [6, 8, 1, 79],
];
const K = LADDER.length, START = 2, WIDTH = 0.42, DETENT = 0.8, SMIN = -0.45, SMAX = K - 0.55;
const kOf = i => Math.PI * Math.sqrt((LADDER[i][0] ** 2 + LADDER[i][1] ** 2) / 2);
// The pitch lingers near each rung, so resonance is easy to find.
const ease = t => t - (DETENT * Math.sin(TAU * t)) / TAU;
function semis(s) {
  if (s <= 0) return LADDER[0][3] + s * 2.5;
  if (s >= K - 1) return LADDER[K - 1][3] + (s - K + 1) * 2.5;
  const k = Math.floor(s);
  return lerp(LADDER[k][3], LADDER[k + 1][3], ease(s - k));
}
const resp = (st, k) => 1 / (1 + ((st - LADDER[k][3]) / WIDTH) ** 2);

/* ---------- sound: synthesised, started by the first gesture ---------- */
const SKEY = 'stimming.chladni.sound', MAXV = 10, LEAD = 0.004;
let soundOn = true;
try { soundOn = localStorage.getItem(SKEY) !== '0'; } catch (err) { /* storage is optional */ }
let ac = null, out = null, noise = null, sand = null, askedAt = -1e9, voices = 0, restT = 0;
let tone = null, tossNext = 0, pourNext = 0, chimeNext = 0;
const jit = x => 1 + (Math.random() * 2 - 1) * x;

function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (err) { return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;
    out = ac.createGain();
    out.gain.value = 0.55;
    out.connect(comp);
    comp.connect(ac.destination);
    // One second of white noise feeds the rosin rasp.
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    sand = sandBuffer();
    voice();
  }
  if (ac.state !== 'running') { askedAt = performance.now(); ac.resume()?.catch(() => {}); }
}
// A context still waking queues sounds for a moment.
function live() {
  if (!soundOn || !ac || ac.state === 'closed') return null;
  return ac.state === 'running' || performance.now() - askedAt < 250 ? ac : null;
}
function track(src, ...tails) {
  voices++;
  src.onended = () => { voices--; tails.forEach(n => n.disconnect()); };
}
// Once the plate rests, the context sleeps until the next gesture.
function rest() {
  clearTimeout(restT);
  if (!ac || ac.state === 'closed') return;
  restT = setTimeout(() => {
    if (!raf && !ptrs.size && ac.state === 'running') ac.suspend()?.catch(() => {});
  }, 1500);
}
const GESTURE_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter', 'c', 'C']);
function unlock(e) {
  if (!soundOn || (e.type === 'keydown' && !GESTURE_KEYS.has(e.key))) return;
  // A touch counts as a gesture only once the finger lifts.
  if (!ac && e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
  audio();
}
// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// Scales a buffer channel to a target loudness.
function norm(d, rms) {
  let s = 0;
  for (let i = 0; i < d.length; i++) s += d[i] * d[i];
  const k = rms / Math.sqrt(s / d.length || 1);
  for (let i = 0; i < d.length; i++) d[i] *= k;
}
// Sand: a faint wash under thousands of tiny grain ticks.
function sandBuffer() {
  const sr = ac.sampleRate, len = Math.round(sr * 2.3), buf = ac.createBuffer(2, len, sr);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.04;
    for (let n = Math.round(2.3 * 2400), k = 0; k < n; k++) {
      const at = Math.floor(Math.random() * (len - 64)), amp = 0.04 + 0.5 * Math.random() ** 4, dec = rand(3, 12);
      for (let i = 0; i < 48; i++) d[at + i] += amp * (Math.random() * 2 - 1) * Math.exp(-i / dec);
    }
    norm(d, 0.2);
  }
  return buf;
}
// A bowed string's spectrum: every harmonic, falling away gently.
function bowWave() {
  const n = 24, re = new Float32Array(n), im = new Float32Array(n);
  for (let i = 1; i < n; i++) im[i] = (i % 2 ? 1 : 0.6) / i ** 1.25;
  return ac.createPeriodicWave(re, im);
}
const gainOf = v => { const g = ac.createGain(); g.gain.value = v; return g; };
function filterOf(type, f, q) {
  const b = ac.createBiquadFilter();
  b.type = type;
  b.frequency.value = f;
  b.Q.value = q;
  return b;
}
// One continuous voice: sine, beating twin, octave and bowed tone.
// A looped sand bed hisses under it.
function voice() {
  const osc = (type, f) => { const o = ac.createOscillator(); o.type = type; o.frequency.value = f; return o; };

  bow.setPeriodicWave(bowWave());
  bow.frequency.value = 196;

  sine.connect(gainOf(0.6)).connect(tg);
  twin.connect(gainOf(0.22)).connect(tg);
  oct.connect(gainOf(0.06)).connect(tg);
  bow.connect(lp).connect(gBow).connect(tg);
  tg.connect(out);
  const vib = osc('sine', 5.1), vibG = gainOf(1.5);
  vib.connect(vibG);
  [sine, twin, bow].forEach(o => vibG.connect(o.detune));

  ros.buffer = noise;
  ros.loop = true;
  ros.connect(rosF).connect(rosG).connect(out);

  bed.buffer = sand;
  bed.loop = true;
  bed.connect(filterOf('highpass', 1800, 0.5)).connect(filterOf('bandpass', 5200, 0.6)).connect(hissG).connect(out);

}
// The voice follows the plate; small changes skip the automation queue.
function sing(f, lvl, bowAmt, vib, rosin, hiss) {
  if (!tone || !ac || ac.state !== 'running') return;
  const t = ac.currentTime, v = [f, lvl, bowAmt, vib, rosin, hiss], L = tone.last;
  const moved = (i, eps) => L[i] === undefined || Math.abs(v[i] - L[i]) > eps;
  if (moved(0, f * 0.0005)) {
    tone.sine.frequency.setTargetAtTime(f, t, 0.03);
    tone.twin.frequency.setTargetAtTime(f * 1.0026, t, 0.03);
    tone.oct.frequency.setTargetAtTime(f * 2, t, 0.03);
    tone.bow.frequency.setTargetAtTime(f, t, 0.03);
    tone.lp.frequency.setTargetAtTime(f * 3 + 500, t, 0.05);
    L[0] = f;
  }
  if (moved(1, 0.002)) { tone.tg.gain.setTargetAtTime(lvl, t, 0.06); L[1] = lvl; }
  if (moved(2, 0.01)) { tone.gBow.gain.setTargetAtTime(bowAmt, t, 0.1); L[2] = bowAmt; }
  if (moved(3, 0.2)) { tone.vibG.gain.setTargetAtTime(vib, t, 0.25); L[3] = vib; }
  if (moved(4, 0.001)) { tone.rosG.gain.setTargetAtTime(rosin, t, 0.05); L[4] = rosin; }

// Each voice pans with its place on the plate.
function bus(a, x) {
  const p = a.createStereoPanner ? a.createStereoPanner() : a.createGain();
  if (p.pan) p.pan.value = clamp(x, -1, 1) * 0.6;
  p.connect(out);
  return p;
}
// A thrown handful: a quick whoosh, then the patter of landing.
function tossSound(x) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < tossNext) return;
  tossNext = t + 0.08;
  const dst = bus(a, x);
  [[0, 3400, 0.24, 0.07, 0.4], [0.2, 5200, 0.12, 0.16, 0.7]].forEach(([at, f, g, tau, len]) => {

    src.buffer = sand;
    src.playbackRate.value = jit(0.05);
    bp.type = 'bandpass';
    bp.frequency.value = f * jit(0.06);
    bp.Q.value = 0.8;
    ng.gain.setValueAtTime(0, t + at);
    ng.gain.linearRampToValueAtTime(g * jit(0.1), t + at + 0.012);
    ng.gain.setTargetAtTime(0, t + at + 0.012, tau);
    src.connect(bp).connect(ng).connect(dst);
    src.start(t + at, Math.random() * 1.5);
    src.stop(t + at + len);
    track(src, bp, ng, ...(at ? [dst] : []));
  });

// Scattering pours sand over the whole plate.
function pourSound() {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < pourNext) return;
  pourNext = t + 0.4;
  const src = a.createBufferSource(), bp = a.createBiquadFilter(), g = a.createGain();
  src.buffer = sand;
  src.playbackRate.value = jit(0.05);

  bp.Q.value = 0.7;
  bp.frequency.setValueAtTime(2600 * jit(0.05), t);
  bp.frequency.exponentialRampToValueAtTime(5400, t + 1.1);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.3 * jit(0.08), t + 0.16);
  g.gain.setTargetAtTime(0, t + 0.55, 0.28);
  src.connect(bp).connect(g).connect(out);
  src.start(t, Math.random() * 0.8);
  src.stop(t + 2.2);
  track(src, bp, g);
}
// A new colour rings a small glassy bell at the plate's pitch.
function chime(f) {
  const a = live();
  if (!a || voices > MAXV - 3) return;
  const t = a.currentTime + LEAD;
  if (t < chimeNext) return;
  chimeNext = t + 0.12;
  const base = f * 2 * jit(0.01);
  [[1, 0.07, 1.4], [2.76, 0.025, 0.6], [5.4, 0.01, 0.3]].forEach(([m, g, d]) => {
    const o = a.createOscillator(), e = a.createGain();
    o.frequency.value = base * m;
    e.gain.setValueAtTime(0, t);
    e.gain.linearRampToValueAtTime(g * jit(0.1), t + 0.005);
    e.gain.setTargetAtTime(0, t + 0.005, d / 4);

  F.k = (r0 * kOf(k0) + r1 * kOf(k1)) / sum;

  F.amp = D * Math.min(1, sum) ** 1.3 * (gripping ? 1 : 0.94);
  freq = 440 * 2 ** ((st - 69) / 12);
  const dom = r0 >= r1 ? k0 : k1;
  if (dom !== domK) { domK = dom; formed *= 0.35; }
  for (let k = 0; k < K; k++) TICKS[k] = resp(st, k) ** 2 * (0.45 + 0.55 * D);
}
function setField(q) {
  gl.uniform4fv(q.u.uM0, F.m0);
  gl.uniform4fv(q.u.uM1, F.m1);
  gl.uniform1f(q.u.uAmp, F.amp);
  gl.uniform1f(q.u.uK, F.k);
}
function simStep(dt, fallH = -1) {
  const q = P.sim;
  gl.useProgram(q.p);
  setField(q);
  gl.uniform1ui(q.u.uFrame, frameNo++);
  gl.uniform1f(q.u.uDt, dt);
  gl.uniform1f(q.u.uHop, reduce ? 0.012 : 0.022);
  gl.uniform1f(q.u.uScatter, fallH >= 0 ? 1 : 0);
  gl.uniform1f(q.u.uFallH, Math.max(0, fallH));
  gl.uniform4fv(q.u.uToss, tossQ || [0, 0, 0, 1]);
  tossQ = null;
  gl.bindFramebuffer(gl.FRAMEBUFFER, sim[1 - cur].fb);
  gl.viewport(0, 0, TW, TH);
  gl.disable(gl.BLEND);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sim[cur].a);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, sim[cur].b);
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  cur = 1 - cur;
}
// The first paint shows a finished figure: the plate has already rung.
function seed() {
  s = sT = START;
  D = 1;
  tune();
  F.amp = 1;
  simStep(1 / 60, 0);
  for (let i = 0; i < 260; i++) simStep(1 / 60);
  F.amp = 0;
  for (let i = 0; i < 40; i++) simStep(1 / 60);
  D = 0;
  tune();
}

/* ---------- layout: the plate seen straight on, the rail at the right ---------- */
let W = 0, H = 0, pr = 1, cw = 0, ch = 0, lowDpr = false, drawN = N;
// CSS pixels, y down.
const L = { cx: 0, cy: 0, side: 1, railX: 0, y0: 0, y1: 0 };
function layout() {
  const small = W < 560, my = small ? 22 : 36, mx = small ? 14 : 36;
  L.railX = W - (small ? 22 : 34);
  const right = L.railX - (small ? 24 : 44);
  L.side = Math.max(60, Math.min(H - 2 * my, right - mx));
  L.cx = Math.min(W / 2, right - L.side / 2);
  L.cy = H / 2;
  L.y0 = L.cy - L.side / 2;
  L.y1 = L.cy + L.side / 2;
  // Small plates draw only a share of the grains.
  drawN = Math.round(N * clamp((L.side / 470) ** 2, 0.45, 1) * (lowDpr ? 0.7 : 1));
}
const railY = v => L.y1 - ((v - SMIN) / (SMAX - SMIN)) * (L.y1 - L.y0);
const railS = y => SMIN + ((L.y1 - y) / (L.y1 - L.y0)) * (SMAX - SMIN);
// CSS pixels to plate units, from the bottom-left corner.
const toPlate = (x, y) => [(x - L.cx) / L.side + 0.5, (L.cy - y) / L.side + 0.5];
const onRail = (x, y) => Math.abs(x - L.railX) < 24 && y > L.y0 - 18 && y < L.y1 + 18;

/* ---------- drawing ---------- */
function blurTo(src, dst, dx, dy) {
  gl.useProgram(P.blur.p);
  gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
  gl.viewport(0, 0, dst.n, dst.n);
  gl.uniform2f(P.blur.u.uDir, dx / src.n, dy / src.n);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function downTo(src, dst) {
  gl.useProgram(P.down.p);
  gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
  gl.viewport(0, 0, dst.n, dst.n);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
// The colour wave sweeps out from the centre.
const front = () => (wave >= 1 ? 3 : lerp(-0.06, 1.3, wave));
function render() {
  const sa = sim[cur].a, sb = sim[cur].b, py = PY;
  gl.bindVertexArray(vao);
  gl.bindFramebuffer(gl.FRAMEBUFFER, py.d0.fb);
  gl.viewport(0, 0, DS, DS);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);
  gl.blendEquation(gl.FUNC_ADD);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(P.den.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sa);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, sb);
  gl.drawArrays(gl.POINTS, 0, N);
  gl.disable(gl.BLEND);
  gl.activeTexture(gl.TEXTURE3);
  blurTo(py.d0, py.t0, 1, 0);
  blurTo(py.t0, py.g0, 0, 1);
  downTo(py.g0, py.d1);
  // Two blurs per coarse level keep the kernel smooth and wide.
  for (const [d, t, g] of [[py.d1, py.t1, py.g1], [py.d2, py.t2, py.g2]]) {
    if (d === py.d2) downTo(py.g1, py.d2);
    blurTo(d, t, 1, 0);
    blurTo(t, g, 0, 1);
    blurTo(g, t, 1, 0);
    blurTo(t, g, 0, 1);
  }

  // Grains add their light into the float buffer.
  ensureHdr();
  gl.bindFramebuffer(gl.FRAMEBUFFER, hdr.fb);
  gl.viewport(0, 0, cw, ch);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);
  const sideD = L.side * pr, cx = L.cx * pr, cy = (H - L.cy) * pr, fr = front();
  const gain = 0.24 * clamp((0.32 * sideD * sideD) / drawN, 0.6, 1.6);
  for (const [q, mode, count] of [[P.dot, gl.POINTS, drawN], [P.streak, gl.LINES, drawN * 2]]) {
    gl.useProgram(q.p);
    setField(q);
    gl.uniform4f(q.u.uPlate, cx, cy, sideD, pr);
    gl.uniform2f(q.u.uRes, cw, ch);
    gl.uniform1f(q.u.uGain, gain);
    gl.uniform1f(q.u.uJit, reduce ? 0.003 : 0.006);
    gl.uniform1f(q.u.uTau, reduce ? 0.02 : 0.04);
    gl.uniform1f(q.u.uFront, fr);
    gl.uniform1f(q.u.uFlash, reduce ? 0 : 1 - wave);
    gl.uniform1ui(q.u.uSeed, frameNo);
    gl.uniform3fv(q.u.uPa, PALS[hueWas].g);
    gl.uniform3fv(q.u.uPb, PALS[hue].g);
    gl.drawArrays(mode, 0, count);
  }
  gl.disable(gl.BLEND);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, cw, ch);
  gl.useProgram(P.comp.p);
  [hdr, py.g0, py.g1, py.g2].forEach((t, i) => {
    gl.activeTexture(gl.TEXTURE4 + i);
    gl.bindTexture(gl.TEXTURE_2D, t.tex);
  });
  const u = P.comp.u, rungDY = ((L.y1 - L.y0) / (SMAX - SMIN)) * pr;
  gl.uniform2f(u.uRes, cw, ch);
  gl.uniform4f(u.uPlate, cx, cy, sideD, pr);
  gl.uniform4f(u.uRail, L.railX * pr, (H - L.y1) * pr, (H - L.y0) * pr, (H - railY(s)) * pr);
  gl.uniform2f(u.uRung, (H - railY(0)) * pr, rungDY);
  gl.uniform4f(u.uDot, clamp(0.15 + D * (0.35 + 0.65 * near) + (gripping ? 0.3 : 0), 0, 1.4), 3.2 + 1.3 * D + (gripping ? 1 : 0), 0, 0);
  gl.uniform1fv(u.uTick, TICKS);
  gl.uniform1f(u.uFront, fr);
  gl.uniform1f(u.uLive, D * (0.4 + 0.6 * near));
  gl.uniform3fv(u.uGa, PALS[hueWas].glow);
  gl.uniform3fv(u.uGb, PALS[hue].glow);
  gl.uniform3fv(u.uWa, PALS[hueWas].wash);
  gl.uniform3fv(u.uWb, PALS[hue].wash);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function fit() {
  const w = panel.clientWidth, h = panel.clientHeight;
  if (!w || !h) return;
  rect = null;
  const p = Math.min(devicePixelRatio || 1, lowDpr ? 1 : 2, Math.sqrt(1.4e6 / (w * h)));
  const nw = Math.round(w * p), nh = Math.round(h * p);
  W = w;
  H = h;
  if (canvas.width !== nw || canvas.height !== nh) {
    canvas.width = nw;
    canvas.height = nh;
  }
  cw = nw;
  ch = nh;
  pr = nw / w;
  layout();
  // A resized canvas is blank until drawn, so draw now.
  if (ready) render();
}

/* ---------- one loop, only while something moves ---------- */
let raf = 0, last = 0, onScreen = true, slow = 0;
function wake() {
  if (!raf && ready && onScreen && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(now) {
  raf = 0;
  const raw = Math.max(0, (now - last) / 1000), dt = Math.min(raw, 1 / 20);
  last = now;
  // Sustained slow frames drop the pixel ratio to 1.
  if (!lowDpr) {
    slow = raw > 0.03 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 20) { lowDpr = true; fit(); }
  }
  const busy = advance(dt, now);
  render();
  if (busy && onScreen && !document.hidden) raf = requestAnimationFrame(frame);
  else {
    sing(freq, 0, 0, 1.5, 0, 0);
    rest();
  }
}
function advance(dt, now) {
  const tuning = !!(tuner && (tuner.moved || tuner.grip));
  const driving = tuning || now < holdUntil;
  if (!tuning) s += (sT - s) * (1 - Math.exp(-dt * 8));
  if (Math.abs(sT - s) < 1e-3) s = sT;
  const goal = driving ? 1 : 0;
  D += (goal - D) * (1 - Math.exp(-dt / (goal > D ? 0.1 : reduce ? 0.3 : 0.55)));
  if (!driving && D < 0.003) D = 0;
  tune();
  if (F.amp > 0.12) settleUntil = Math.max(settleUntil, now + 1500);
  formed = Math.min(1, formed + dt * F.amp * 0.55);
  const steps = clamp(Math.round(dt * 60), 1, 3);
  for (let i = 0; i < steps; i++) {
    if (scatterQ) { scatterQ = false; simStep(dt / steps, reduce ? 0.12 : 0.5); continue; }
    simStep(dt / steps);
  }
  if (wave < 1) wave = Math.min(1, wave + dt / (reduce ? 0.25 : 1.3));
  gripSpeed *= Math.exp(-dt * 6);
  const lvl = soundOn ? 0.22 * D * (0.16 + 0.84 * near ** 1.5) : 0;
  const hiss = soundOn ? 0.11 * Math.min(1, F.amp * 1.3) * (0.2 + 0.8 * (1 - formed)) : 0;
  const rosin = soundOn && gripping ? 0.03 * D * Math.min(1, gripSpeed / 700) : 0;
  sing(freq, lvl, gripping ? 0.42 : 0.14, gripping ? 6 : 1.5, rosin, hiss);
  return tuning || D > 0 || s !== sT || now < settleUntil || scatterQ || !!tossQ || wave < 1;
}

/* ---------- actions ---------- */
function stepRung(dir) {
  sT = clamp(dir > 0 ? Math.floor(sT + 0.25) + 1 : Math.ceil(sT - 0.25) - 1, 0, K - 1);
  holdUntil = performance.now() + (reduce ? 2600 : 4000);
  wake();
}
function scatter() {
  scatterQ = true;
  formed = 0;
  settleUntil = performance.now() + 2200;
  pourSound();
  wake();
}
function toss(u, v) {
  tossQ = [u, v, reduce ? 0.6 : 1, 0.15];
  formed *= 0.7;
  settleUntil = Math.max(settleUntil, performance.now() + 2000);
  tossSound(u * 2 - 1);
  wake();
}
const hueBs = [...document.querySelectorAll('.chip[data-hue]')];
function paint(name) {
  if (!PALS[name]) return;
  hueBs.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.hue === name)));
  if (name === hue) return;
  hueWas = wave < 0.5 ? hueWas : hue;
  hue = name;
  wave = 0;
  chime(freq);
  wake();
}

/* ---------- input ---------- */
let rect = null, tuner = null;
addEventListener('scroll', () => { rect = null; }, { passive: true });
function local(e) {
  const r = rect || (rect = panel.getBoundingClientRect());
  return [e.clientX - r.left, e.clientY - r.top];
}
const ptrs = new Map();
function cursor(grip) {
  panel.classList.toggle('grip', grip);
  panel.classList.toggle('gripping', !!(tuner && tuner.grip));
}
panel.addEventListener('pointerdown', e => {
  if (!ready || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const [x, y] = local(e);
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  const p = { x0: x, y0: y, y, t0: e.timeStamp, t: e.timeStamp, grip: onRail(x, y), moved: false, off: 0 };
  // A grab near the dot keeps its offset, so the dot does not jump.
  if (p.grip && Math.abs(y - railY(s)) < 22) p.off = y - railY(s);
  ptrs.set(e.pointerId, p);
  if (!tuner) {
    tuner = p;
    gripping = p.grip;
  }
  cursor(p.grip);
  wake();
});
panel.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) {
    if (e.pointerType === 'mouse' && ready && !ptrs.size) {
      const [x, y] = local(e);
      cursor(onRail(x, y));
    }
    return;
  }
  const list = e.getCoalescedEvents?.() || [];
  for (const c of list.length ? list : [e]) {
    const [x, y] = local(c), dy = y - p.y;
    p.y = y;
    if (!p.moved && Math.hypot(x - p.x0, y - p.y0) > 6) p.moved = true;
    if (p !== tuner || !p.moved) continue;
    if (p.grip) {
      // The dot follows the finger along the rail.
      s = sT = clamp(railS(y - p.off), SMIN, SMAX);
      gripSpeed = lerp(gripSpeed, Math.abs(dy) / Math.max(4, c.timeStamp - p.t) * 1000, 0.3);
    } else {
      // Up raises the pitch; a stage height spans five or six rungs.
      s = sT = clamp(s - dy / (H / 5.5), SMIN, SMAX);
    }
    p.t = c.timeStamp;
  }
  wake();
});
function lift(e) {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  ptrs.delete(e.pointerId);
  const tap = e.type === 'pointerup' && !p.moved && e.timeStamp - p.t0 < 500;
  if (tap && p.grip) {
    // A tap on the rail glides to the nearest resonance and rings it.
    sT = clamp(Math.round(railS(p.y0 - p.off)), 0, K - 1);
    holdUntil = Math.max(holdUntil, performance.now() + (reduce ? 2600 : 4000));
  } else if (tap) {
    const [u, v] = toPlate(p.x0, p.y0);
    if (u > -0.06 && u < 1.06 && v > -0.06 && v < 1.06) toss(clamp(u, 0.01, 0.99), clamp(v, 0.01, 0.99));
  }
  if (p === tuner) {
    if (p.moved || p.grip) holdUntil = Math.max(holdUntil, performance.now() + (reduce ? 600 : 1400));
    tuner = null;
    gripping = false;
  }
  cursor(false);
  wake();
}
panel.addEventListener('pointerup', lift);
panel.addEventListener('pointercancel', lift);
panel.addEventListener('contextmenu', e => e.preventDefault());

const scatterB = document.getElementById('scatter');
scatterB.addEventListener('click', () => { if (ready) scatter(); });
hueBs.forEach(b => b.addEventListener('click', () => { if (ready) paint(b.dataset.hue); }));
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    if (ready) stepRung(e.key === 'ArrowUp' || e.key === 'ArrowRight' ? 1 : -1);
  } else if (e.key === 'c' || e.key === 'C') {
    if (ready && !e.repeat) paint(ORDER[(ORDER.indexOf(hue) + 1) % ORDER.length]);
  } else if (e.key === ' ' || e.key === 'Enter') {
    // Buttons and links keep Space and Enter for themselves.
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (!ready || e.repeat) return;
    if (e.key === ' ') scatter();
    else toss(rand(0.2, 0.8), rand(0.2, 0.8));
  }
});
const sndB = document.getElementById('snd');
const showSound = () => sndB.setAttribute('aria-pressed', String(soundOn));
showSound();
sndB.addEventListener('click', () => {
  soundOn = !soundOn;
  showSound();
  try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (err) { /* storage is optional */ }
  if (soundOn) {
    audio();
    if (!raf) rest();
  } else if (ac) ac.suspend()?.catch(() => {});
});
// Hidden or off screen, the plate pauses and goes quiet.
function pause() {
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
  if (ac && ac.state === 'running') ac.suspend()?.catch(() => {});
}

/* ---------- start: shaders link before the first paint ---------- */
function failed() {
  ready = false;
  canvas.hidden = true;
  panel.querySelector('.fail').hidden = false;
  panel.style.cursor = 'default';
  scatterB.disabled = true;
  hueBs.forEach(b => { b.disabled = true; });
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; pause(); });
canvas.addEventListener('webglcontextrestored', async () => {
  try {
    await initGL();
    seed();
    ready = true;
    render();
  } catch (err) { console.error(err); failed(); }
});
async function boot() {
  await idle();
  fit();
  if (!W) {
    W = 1160; H = 652; cw = canvas.width = 1160; ch = canvas.height = 652; pr = 1;
    layout();
  }
  try { await initGL(); } catch (err) { console.error(err); failed(); return; }
  await idle();
  seed();
  ready = true;
  render();
  requestAnimationFrame(() => canvas.classList.add('on'));
  new ResizeObserver(fit).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); else pause(); }).observe(panel);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); else wake(); });
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
</body>
