<style>
/* Chladni plate: a lit steel plate, gold sand and a tuning rail. */
:root {
  --stage: oklch(0.17 0.03 280);
  --gold: oklch(0.84 0.13 82);
  --slot: oklch(0.11 0.02 280);
  --notch: oklch(0.42 0.03 280);
}
.stage { cursor: ns-resize; }

/* ---------- the rail: a cut slot, a notch per pattern, a solid cap ---------- */
/* The rail runs between the shell's right-hand corners. */
.rail {
  position: absolute; z-index: 1; right: 14px; top: var(--rail-top, 64px); bottom: var(--rail-bot, 28px); width: 44px;
  cursor: grab; touch-action: none; -webkit-tap-highlight-color: transparent;
}
.rail.held { cursor: grabbing; }
.rail:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 6px; }
.rail::before {
  content: ""; position: absolute; left: 50%; top: -6px; bottom: -6px; width: 4px; margin-left: -2px;
  background: var(--slot); border-radius: 2px;
}
.rail i {
  position: absolute; left: 50%; width: 12px; height: 2px; margin: -1px 0 0 -6px;
  background: var(--notch); transition: width 0.2s ease, margin 0.2s ease, background-color 0.2s ease;
}
.rail i.on { width: 20px; margin-left: -10px; background: var(--gold); }
/* The cap is one solid block split by a cut. */
.rail b {
  position: absolute; left: 50%; width: 28px; height: 14px; margin: -7px 0 0 -14px;
  background: var(--gold); border-radius: 3px; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.rail b::after { content: ""; position: absolute; left: 4px; right: 4px; top: 6px; height: 2px; background: var(--slot); }
.rail.held b { transform: scale(1.15); }
/* The live pitch and pattern sit above the rail in fixed-width figures. */
.rail output {
  position: absolute; right: 0; bottom: 100%; margin-bottom: 10px; white-space: pre; text-align: right;
  font: 500 11px/1.35 var(--slab, ui-monospace), monospace; letter-spacing: 0.04em; font-variant-numeric: tabular-nums;
  color: var(--muted); pointer-events: none; transition: color 0.25s ease;
}
.rail.ringing output { color: var(--fg); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
/* On the dark studio the fail line keeps a pale tone. */
.fail { color: oklch(0.74 0.02 285); cursor: default; }
@media (prefers-reduced-motion: reduce) { .stage canvas, .rail i, .rail b, .rail output { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/chladni.svg)"></span><span class="intro-name">Chladni plate</span><span class="intro-sub">Stimming No. 15</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--chladni" id="stage" tabindex="0" role="application" aria-label="A sand-covered steel plate: drag up or down, or slide the cap on the rail, to tune it, and tap to toss sand. Arrow keys step between patterns, S picks a random pattern, Space spreads the sand again and Enter tosses it.">
      <canvas aria-hidden="true"></canvas>
      <div class="rail" id="rail" role="slider" tabindex="0" aria-label="Pitch" aria-orientation="vertical"><output aria-hidden="true"></output><b></b></div>
      <p class="fail" hidden>Chladni plate needs WebGL 2 with float textures, which this browser lacks.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Chladni plate</h1><div class="vignette" hidden></div></section>
</div>

/* ---------- colour: OKLCH in, linear sRGB out ---------- */

  uS0: linear(0.92, 0.06, 95), uS1: linear(0.82, 0.13, 84), uS2: linear(0.7, 0.14, 66), uS3: linear(0.52, 0.1, 52),

}
let LAMPS = null;
// Lamps sit where the plate mirrors them, whatever the camera's tilt.

/* ---------- the mode ladder ---------- */

// The notes walk a D minor pentatonic scale.
const LADDER = [

  [3, 6, -1, 67], [4, 6, 1, 69], [4, 7, -1, 72], [5, 7, 1, 74], [4, 8, -1, 77], [6, 8, 1, 79],

const K = LADDER.length, START = 2, WIDTH = 0.42, DETENT = 0.8, SMIN = -0.45, SMAX = K - 0.55;
const kOf = i => Math.PI * Math.sqrt((LADDER[i][0] ** 2 + LADDER[i][1] ** 2) / 2);

const ease = t => t - (DETENT * Math.sin(TAU * t)) / TAU;

const MAXV = 10, LEAD = 0.004;

/* ---------- the plate's state ---------- */

/* ---------- camera ---------- */

/* ---------- drawing ---------- */

function fit() {

/* ---------- one loop, only while something moves ---------- */

/* ---------- actions ---------- */

/* ---------- input ---------- */
let rect = null, tuner = null;
addEventListener('scroll', () => { rect = null; }, { passive: true });

/* ---------- the rail ---------- */
// Top is the highest pattern; the cap marks the plate's pitch.

// The shell binds S and Space; the plate keeps the arrows and Enter.

/* ---------- start: shaders link before the first paint ---------- */

}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; pause(); });
canvas.addEventListener('webglcontextrestored', async () => {

  } catch (err) { console.error(err); failed(); }
});

}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>

import { pageReady } from '../shared/stim.js';
// The intro holds until the page, its font and the first frame are in.
playIntro({ ready: pageReady() });
</script>
