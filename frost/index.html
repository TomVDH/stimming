<script type="module">

  uRoom: linear(0.76, 0.1, 62),

void main() {

  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);

const SCENE_FS = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uA;
uniform vec3 uSkyTop, uSkyLow, uMoon, uHaze, uFar, uMid, uNear, uSnowHi, uSnowLo, uTreeSnow, uWarm, uAmber;

// One pine: x holds its cover, y its snow.
vec2 pine(vec2 p, vec2 b, float ht, float sd) {

  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, sim.fb[sim.cur]);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, px);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
}
// Times a few steps on the finest grid, then picks the tier.
function pickTier() {
  sim = makeSim(0, W / H);
  initSim();
  runSteps(2, 1 / 60);
  syncGPU();
  const t0 = performance.now();
  runSteps(10, 1 / 60);
  syncGPU();
  const perCell = (performance.now() - t0) / (10 * sim.w * sim.h);
  let t = TIERS.findIndex(T => perCell * T.cells * T.steps < 6);
  if (t < 0) t = TIERS.length - 1;
  if (t > 0) { freeSim(sim); sim = makeSim(t, W / H); }
  steps = TIERS[t].steps;
  initSim();
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; cancelAnimationFrame(raf); raf = 0; });
canvas.addEventListener('webglcontextrestored', () => { start().catch(err => { console.error(err); failed(); }); });
async function start() {
  await initGL();
  await idle();
  buildBackdrop();
  pickTier();
  edgeSeeds(1);
  for (let i = 0; i < 3; i++) seedAt(rand(0.2, 0.8) * W, rand(0.25, 0.85) * H, true);
  flushStamps();
  lookPass();
  fence = null;
  ready = true;
  boostUntil = performance.now() + 2000;
  stir(3000);
}
async function boot() {
  await idle();
  fit();
  if (!W) {
    W = 1160;
    H = 652;
    canvas.width = 1160;
    canvas.height = 652;
    aim.x = W / 2;
    aim.y = H / 2;
  }
  try { await start(); } catch (err) { console.error(err); failed(); return; }
  new ResizeObserver(fit).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(panel);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
