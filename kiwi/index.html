<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.13 0.02 160); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiwi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">
<link rel="modulepreload" href="./glsl.js">
<link rel="modulepreload" href="./fruit.js">
<link rel="modulepreload" href="./fuzz.js">
<link rel="modulepreload" href="./juice.js">
<link rel="modulepreload" href="./post.js">
<link rel="modulepreload" href="./sound.js">
<style>
/* Kiwi: a toony kiwi to squish and slice. */
:root { --stage: oklch(0.13 0.02 160); }
.stage--kiwi { background: var(--stage); cursor: grab; }
.stage--kiwi.drag { cursor: grabbing; }
.stage--kiwi canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--kiwi canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--kiwi canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Kiwi</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--kiwi" id="stage" tabindex="0" role="application" aria-label="A big fuzzy kiwi on a dark ground. Press it to squish it; it springs back and its fuzz ruffles. Swipe across it to slice it in two: the halves fall open on emerald flesh, a cream core and a ring of black seeds. Tap a half to make it wobble. Space slices or joins the halves.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Kiwi</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
