<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Infinity cube</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600&display=swap">
<style>
/* Layout: header row, then the cube panel at full width. */
:root {
  --bg: oklch(0.16 0.012 275);

  --fg: oklch(0.94 0.008 275);
  --muted: oklch(0.64 0.02 275);
  --focus: oklch(0.84 0.13 205);
  --pick: oklch(0.7 0.18 320 / 0.35);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: oklch(0.975 0.004 275); --surface: oklch(0.995 0.002 275); --line: oklch(0.89 0.008 275);
    --fg: oklch(0.22 0.02 275); --muted: oklch(0.5 0.02 275); --focus: oklch(0.52 0.17 255);

}

  --fg: oklch(0.22 0.02 275); --muted: oklch(0.5 0.02 275); --focus: oklch(0.52 0.17 255);

}

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: clamp(20px, 3.4vw, 40px); }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.tools { display: flex; align-items: center; gap: 8px; }
.home { font-size: 14px; color: var(--muted); text-decoration: none; border-radius: 4px; transition: color 0.2s ease; }
.home:hover { color: var(--fg); }
/* The sound toggle sits as quietly as the home link. */
.snd {
  display: grid; place-items: center; width: 28px; height: 28px; margin-block: -4px; padding: 0;
  color: var(--muted); background: none; border: 0; border-radius: 6px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: color 0.2s ease;
}
.snd:hover { color: var(--fg); }

}
.snd[aria-pressed="true"] .off, .snd[aria-pressed="false"] .on { display: none; }
@media (pointer: coarse) { .snd { width: 40px; height: 40px; margin-block: -10px; } }
main { min-width: 0; }
/* The panel is 16:9, 4:5 on phones, capped by the viewport. */
.stage {
  position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: max(320px, calc(100svh - 168px));
  border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--surface);

}
@media (max-width: 640px) { .stage { aspect-ratio: 4 / 5; } }

.stage:has(canvas:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%; outline: none; cursor: grab;
  opacity: 0; transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
.stage canvas.held { cursor: grabbing; }

  font-size: 13px; color: var(--muted); transition: opacity 0.6s ease;
}
.hint.gone { opacity: 0; }

  position: absolute; inset: 0; margin: 0; padding: 16px; display: grid; place-items: center; text-align: center;
  font-size: 14px; color: var(--muted);
}
@media (prefers-reduced-motion: reduce) { .stage canvas, .hint, .home, .snd { transition: none; } }
</style>

<body>

<div class="wrap">
  <header>
    <h1>Infinity cube</h1>
    <div class="tools">
      <button class="snd" id="snd" type="button" aria-label="Sound" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 8h2.6l3.9-3.2v10.4L5.6 12H3z"/>
          <path class="on" d="M12.8 8.1a3 3 0 0 1 0 3.8M15.1 6.1a6 6 0 0 1 0 7.8"/>
          <path class="off" d="M13.2 8l4 4M17.2 8l-4 4"/>
        </svg>
      </button>
      <a class="home" href="../index.html">Stimming</a>
    </div>
  </header>
  <main>
    <div class="stage" id="stage">
      <canvas tabindex="0" role="application" aria-label="Infinity cube. Space folds it; arrow keys turn it."></canvas>
      <span class="hint">drag to fold</span>
      <p class="fail" hidden>The cube needs WebGL, which this browser has turned off.</p>
    </div>
  </main>
</div>

} }

<script type="module">

    drag.y = y;
    view.yawT += dx;
    view.pitchT = clamp(view.pitchT + dy, -PITCH, PITCH);
    view.vy = view.vy * 0.5 + (dx / dt) * 0.5;
    view.vp = view.vp * 0.5 + (dy / dt) * 0.5;
  }
  wake();
}
function onUp(e, ok) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  drag = null;
  canvas.classList.remove('held');
  lastInput = performance.now();
  // A pause before letting go cancels the throw.
  const still = e.timeStamp - d.lt > 90;
  if (d.kind === 'fold') {
    rubStop();
    if (ok && !d.moved && e.timeStamp - d.t0 < 500) foldOnce();
    else {
      const v = still ? 0 : phiV;
      phiV = v;
      // A flick finishes the fold.
      // Otherwise the nearer end wins.
      target = Math.abs(v) > 2.4 ? (v > 0 ? HALF : 0) : phi > HALF / 2 ? HALF : 0;
    }
  } else if (still) view.vy = view.vp = 0;
  wake();
}

canvas.addEventListener('keydown', e => {
  if (!ready) return;
  const v = view, s = 0.42;
  if (e.key === ' ' || e.key === 'Enter') { if (!e.repeat) foldOnce(); }
  else if (e.key === 'ArrowLeft') v.yawT -= s;
  else if (e.key === 'ArrowRight') v.yawT += s;
  else if (e.key === 'ArrowUp') v.pitchT = clamp(v.pitchT - s, -PITCH, PITCH);
  else if (e.key === 'ArrowDown') v.pitchT = clamp(v.pitchT + s, -PITCH, PITCH);
  else return;
  e.preventDefault();
  lastInput = performance.now();
  wake();
});

/* ---------- build ---------- */
function failed() {
  ready = false;
  canvas.hidden = true;
  hint.hidden = true;
  fail.hidden = false;
}
function fit() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h || !renderer) return;
  W = w;
  H = h;
  // DPR stays under 1.5 and about 1.4 million pixels.
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5, Math.sqrt(1.4e6 / (w * h))));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // The open ring reaches 1.9 units.
  // The frame leaves it a margin.
  const t = Math.tan((camera.fov * D2R) / 2);
  camera.position.set(0, 0, 2.2 / Math.min(t, t * camera.aspect));
  camera.updateProjectionMatrix();
  draw();
}
const colour = lch => new THREE.Color().setRGB(...rgb(lch), THREE.SRGBColorSpace);
function lacquer(lch) {
  return new THREE.MeshPhysicalMaterial({ color: colour(lch), vertexColors: true, roughness: 0.34, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.06 });
}
async function build(RBox) {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.NeutralToneMapping;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(28, 16 / 9, 0.1, 60);
  pm = new THREE.PMREMGenerator(renderer);
  await idle();
  scene.environment = pm.fromScene(new Room(), 0.04).texture;
  const key = new THREE.DirectionalLight(0xffffff, 1.25);
  key.position.set(-3, 4, 5);
  scene.add(key);
  cube = new THREE.Group();
  scene.add(cube);
  const M = { shell: lacquer(LACQUER.shell), lid: lacquer(LACQUER.lid), core: lacquer(LACQUER.core), well: lacquer(LACQUER.well) };
  const body = new RBox(0.994, 0.994, 0.994, 4, 0.045);
  // Every bevel darkens, so the seams between cubes read dark.
  const nrm = body.attributes.normal, shade = new Float32Array(nrm.count * 3), seam = rgb(LACQUER.seam);
  for (let i = 0; i < nrm.count; i++) {
    const tilt = Math.acos(Math.min(1, Math.max(Math.abs(nrm.getX(i)), Math.abs(nrm.getY(i)), Math.abs(nrm.getZ(i)))));
    const t = sstep(1 * D2R, 12 * D2R, tilt);
    for (let k = 0; k < 3; k++) shade[i * 3 + k] = 1 - t * (1 - seam[k]);
  }
  body.setAttribute('color', new THREE.BufferAttribute(shade, 3));
  [[0, 0], [1, 0], [1, 1], [0, 1]].forEach(([u, v], i) => {
    const g = new THREE.Group();
    for (const z of [-0.5, 0.5]) {
      // Face order is +x, -x, +y, -y, +z, -z.
      // Each face takes its colour from where it starts.
      const mats = [u ? M.shell : M.well, u ? M.well : M.shell, v ? M.lid : M.core, v ? M.core : M.lid, z > 0 ? M.shell : M.core, z > 0 ? M.core : M.shell];
      const m = new THREE.Mesh(body, mats);
      m.position.z = z;
      m.userData.bar = i;
      g.add(m);
      hits.push(m);
    }
    cube.add(g);
    bars.push(g);
  });
  ray = new THREE.Raycaster();
  ndc = new THREE.Vector2();
  tv = new THREE.Vector3();
  cube.rotation.set(view.pitch, view.yaw, 0);
  // Async compile keeps shader linking off the main thread.
  await renderer.compileAsync(scene, camera);
  ready = true;
  fit();
  new ResizeObserver(fit).observe(stage);
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', e => onUp(e, true));
  canvas.addEventListener('pointercancel', e => onUp(e, false));
  canvas.addEventListener('lostpointercapture', e => onUp(e, false));
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; });
  canvas.addEventListener('webglcontextrestored', () => {
    scene.environment = pm.fromScene(new Room(), 0.04).texture;
    ready = true;
    fit();
    wake();
  });
  // The loop runs only while the panel is on screen.
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; wake(); }).observe(stage);
  document.addEventListener('visibilitychange', wake);
  canvas.classList.add('on');
  lastInput = performance.now();
  wake();
}
// Modules fetch at once.
// GPU work waits for an idle slice.
const libs = Promise.all([
  import('three'),
  import('three/addons/environments/RoomEnvironment.js'),
  import('three/addons/geometries/RoundedBoxGeometry.js'),
]);
libs.catch(() => {});
async function boot() {
  let RBox;
  try {
    [THREE, { RoomEnvironment: Room }, { RoundedBoxGeometry: RBox }] = await libs;
  } catch (err) {
    console.error(err);
    return failed();
  }
  try { await build(RBox); } catch (err) { console.error(err); failed(); }
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
