<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bar probe</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
@font-face { font-family: "Iosevka Term Slab"; font-weight: 500; font-display: swap; src: url(../shared/fonts/IosevkaTermSlab-Medium.woff2) format("woff2"); }
:root { --bg: oklch(0.16 0.012 275); --fg: oklch(0.94 0.008 275); --muted: oklch(0.64 0.02 275); --line: oklch(0.29 0.016 275); --mono: "Iosevka Term Slab", ui-monospace, monospace; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Gabarito", system-ui, sans-serif; }
body { display: flex; flex-direction: column; }
/* The lab strip sits above the toy; it is not part of any direction. */
.strip { flex: none; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; align-items: center; padding: 10px 16px 6px; }
.strip div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.strip span { font: 500 11px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.strip button { font: 600 13px/1 "Gabarito", system-ui, sans-serif; color: var(--muted); background: none; border: 1px solid oklch(0.32 0.02 275); border-radius: 999px; padding: 8px 13px; cursor: pointer; }
.strip button[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
.strip button:focus-visible { outline: 2px solid oklch(0.84 0.13 205); outline-offset: 3px; }
.note { flex: none; margin: 0; padding: 0 16px 10px; text-align: center; font-size: 14px; color: var(--muted); min-height: 1.3em; }
/* The toy runs in the frame at the picked size. */
.well { flex: 1; min-height: 0; display: grid; place-items: start center; overflow: hidden; }
iframe { display: block; border: 0; width: 100%; height: 100%; background: var(--bg); transform-origin: 50% 0; }
.well[data-size="phone"] iframe { width: 375px; height: 812px; outline: 1px solid var(--line); }
.well[data-size="wide"] iframe { width: 812px; height: 375px; outline: 1px solid var(--line); }
</style>
<body>
<div class="strip">
  <div role="group" aria-label="Bar direction" id="concepts"><span>Bar</span>
    <button type="button" data-c="today">Today</button>
    <button type="button" data-c="dock">Dock</button>
    <button type="button" data-c="bare">Bare</button>
    <button type="button" data-c="tuck">Tuck</button>
    <button type="button" data-c="askew">Askew</button>
  </div>
  <div role="group" aria-label="Toy" id="toys"><span>Toy</span>
    <button type="button" data-t="galaxy">Galaxy</button>
    <button type="button" data-t="pendulum">Pendulum</button>
    <button type="button" data-t="fire">Fire</button>
    <button type="button" data-t="rain">Rain</button>
    <button type="button" data-t="eyes">Eyes</button>
  </div>
  <div role="group" aria-label="Size" id="sizes"><span>Size</span>
    <button type="button" data-s="full">Full</button>
    <button type="button" data-s="phone">Phone</button>
    <button type="button" data-s="wide">Phone, wide</button>
  </div>
</div>
<p class="note" id="note"></p>
<div class="well" id="well"><iframe id="frame" title="Toy with the picked bar"></iframe></div>
<script type="module">
// A probe: other ways to do the toy bars. It changes no shell file.
// The frame runs a real toy; shim.js stands in for shared/stim.js there.
const NOTES = {
  today: 'Today: Bar v2. Controls in four corners, on dark glass.',
  dock: 'Dock: one bar at the bottom holds every control. The stage stays clear.',
  bare: 'Bare: no boxes. Words and icons sit on the stage; a pick flashes white.',
  tuck: 'Tuck: one tab at the bottom. Every control waits in its drawer.',
  askew: 'Askew: blocks in the toy\'s own colour, each at its own tilt.',
};
const q = new URLSearchParams(location.search);
const state = {
  c: NOTES[q.get('c')] ? q.get('c') : 'dock',
  t: q.get('t') || 'galaxy',
  s: ['full', 'phone', 'wide'].includes(q.get('s')) ? q.get('s') : 'full',
};
const frame = document.getElementById('frame'), well = document.getElementById('well');
const SIZES = { phone: [375, 812], wide: [812, 375] };

// The toy page loads as text, so its import map can point stim.js at the shim.
async function load(toy) {
  const dir = new URL(`../${toy}/`, location.href);
  let html = await (await fetch(new URL('index.html', dir), { cache: 'no-cache' })).text();
  const stim = new URL('../shared/stim.js', location.href).href;
  const shim = new URL('shim.js', location.href).href;
  const re = /<script type="importmap">([\s\S]*?)<\/script>/;
  const found = html.match(re);
  const map = found ? JSON.parse(found[1]) : {};
  // Only modules in the toy's folder get the shim; shared modules keep stim.js.
  map.scopes = { ...(map.scopes || {}), [dir.href]: { [stim]: shim } };
  const tag = `<script type="importmap">${JSON.stringify(map)}<\/script>`;
  if (found) html = html.replace(re, () => tag);
  // The intro leaves at once, so a switch of toy costs no wait.
  const skip = `<script>new MutationObserver((_, mo) => { const el = document.querySelector('.intro'); if (el) { el.remove(); mo.disconnect(); } }).observe(document.documentElement, { childList: true, subtree: true });<\/script>`;
  html = html.replace(/<head[^>]*>/i, h => `${h}<base href="${dir.href}">${found ? '' : tag}${skip}`);
  frame.srcdoc = html;
}

// A size too tall for the well scales down to fit.
function fit() {
  well.dataset.size = state.s;
  frame.dataset.size = state.s;
  const dim = SIZES[state.s];
  const k = dim ? Math.min(1, (well.clientHeight - 8) / dim[1], (well.clientWidth - 8) / dim[0]) : 1;
  frame.style.transform = k < 1 ? `scale(${k})` : '';
}
function show() {
  frame.dataset.concept = state.c;
  document.getElementById('note').textContent = NOTES[state.c];
  for (const b of document.querySelectorAll('[data-c]')) b.setAttribute('aria-pressed', String(b.dataset.c === state.c));
  for (const b of document.querySelectorAll('[data-t]')) b.setAttribute('aria-pressed', String(b.dataset.t === state.t));
  for (const b of document.querySelectorAll('[data-s]')) b.setAttribute('aria-pressed', String(b.dataset.s === state.s));
  fit();
  // The address keeps the view, so a link opens the same one.
  history.replaceState(null, '', `?c=${state.c}&t=${state.t}&s=${state.s}`);
  try { frame.contentWindow?.dispatchEvent(new Event('barlab')); } catch {}
}
document.getElementById('concepts').addEventListener('click', e => { const c = e.target.closest('[data-c]')?.dataset.c; if (c) { state.c = c; show(); } });
document.getElementById('toys').addEventListener('click', e => { const t = e.target.closest('[data-t]')?.dataset.t; if (t && t !== state.t) { state.t = t; show(); load(t); } });
document.getElementById('sizes').addEventListener('click', e => { const s = e.target.closest('[data-s]')?.dataset.s; if (s) { state.s = s; show(); } });
// Keys 1 to 5 pick a direction.
addEventListener('keydown', e => {
  const c = Object.keys(NOTES)[Number(e.key) - 1];
  if (c && !e.metaKey && !e.ctrlKey && !e.altKey) { state.c = c; show(); }
});
addEventListener('resize', fit);
show();
load(state.t);
</script>
