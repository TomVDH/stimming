<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.14 0.012 268); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fake Cash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">
<style>
/* Fake Cash: falling custom banknotes with soft paper physics and close-up inspection. */
:root { --stage: oklch(0.24 0.09 266); }
.stage--fakecash { background: radial-gradient(ellipse 72% 66% at 46% 38%, oklch(0.68 0.14 68), oklch(0.42 0.12 18) 38%, oklch(0.26 0.10 264) 84%); }
.stage--fakecash canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.6s ease; touch-action: none; cursor: default;
}
.stage--fakecash canvas.on { opacity: 1; }
.stage--fakecash.over-bill canvas { cursor: pointer; }
.stage--fakecash.inspecting canvas { cursor: grab; }
.stage--fakecash.held canvas { cursor: grabbing; }
@media (prefers-reduced-motion: reduce) { .stage--fakecash canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/fakecash.svg)"></span><span class="intro-name">Fake Cash</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--fakecash" id="stage" tabindex="0" role="application" aria-label="Seven custom banknotes drifting through studio light. Hold the stage to make it rain, drag to stir the air, or click any bill to inspect both sides up close.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Fake Cash</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./dist/main.js"></script>
</body>
</html>
