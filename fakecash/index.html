<style>
/* Fake Cash: falling custom banknotes with soft paper physics and close-up inspection. */
:root { --stage: oklch(0.16 0.015 270); }
.stage--fakecash { background: radial-gradient(ellipse 72% 66% at 45% 42%, oklch(0.26 0.025 65), oklch(0.16 0.016 272) 78%); }
.stage--fakecash canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.6s ease; touch-action: none; cursor: default;
}
.stage--fakecash canvas.on { opacity: 1; }
.stage--fakecash.over-bill canvas { cursor: pointer; }
.stage--fakecash.inspecting canvas { cursor: grab; }
.stage--fakecash.held canvas { cursor: grabbing; }
@media (prefers-reduced-motion: reduce) { .stage--fakecash canvas { transition: none; } }
</style>

<div class="wrap">
  <main>
    <div class="stage stage--fakecash" id="stage" tabindex="0" role="application" aria-label="Ten custom banknotes drifting through studio light. Hold the stage to make it rain, drag to stir the air, or click any bill to inspect both sides up close.">

    <div class="vignette" hidden></div>
  </section>
</div>
