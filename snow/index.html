<title>Snow globe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Snow globe: the studio at full width under the shared header. */
/* The studio is dark in both themes. */
:root { --stage: oklch(0.15 0.035 275); }
.stage--snow { cursor: grab; }
.stage--snow.held { cursor: grabbing; }
.stage--snow canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage--snow canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--snow canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Snow globe</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--snow" id="stage" tabindex="0" role="application" aria-label="A snow globe on a walnut base. Drag to shake it, or flick it for a big shake. Space shakes it and the arrow keys tilt it.">
      <p class="fail" hidden>Snow globe needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <dl class="how" aria-label="How to play">
        <div><dt>Drag</dt><dd>shake</dd></div>
        <div><dt>Flick</dt><dd>big shake</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>shake</dd></div>
        <div class="fine"><dt><kbd>Arrows</kbd></dt><dd>tilt</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Snow globe</h1><div class="vignette" hidden></div></section>
</div>

      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/postprocessing/OutputPass.js'),
    ]);
  } catch (err) {
    console.error(err);
    return failed();
  }
  try {
    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  } catch (err) {
    console.error(err);
    return failed();
  }
  const ext = renderer.extensions;
  if (!ext.has('EXT_color_buffer_float') && !ext.has('EXT_color_buffer_half_float')) { renderer.dispose(); return failed(); }
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const canvas = renderer.domElement;
  canvas.setAttribute('aria-hidden', 'true');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 16 / 9, 0.1, 100);
  tq = new THREE.Quaternion();
  tv = new THREE.Vector3();
  tw = new THREE.Vector3();
  await idle();

  buildTops();
  buildCurl();
  seedFlakes();
  await idle();
  const pm = new THREE.PMREMGenerator(renderer);
  const env = studio(pm);
  pm.dispose();
  await idle();
  build(env);
  await idle();

  const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.42, 0.4, 1.5);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  panel.prepend(canvas);
  new ResizeObserver(resize).observe(panel);
  // A new quality setting clears the slow-frame steps.
  onQuality(() => { lowDpr = false; slow = 0; bloom.enabled = true; resize(); });
  resize();
  await idle();
  // Async compile keeps the shader builds off the main thread.
  await renderer.compileAsync(scene, camera);
  ready = true;
  draw();
  requestAnimationFrame(() => canvas.classList.add('on'));
}
start().catch(err => { console.error(err); failed(); });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
</body>
