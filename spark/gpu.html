// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;

/* ---------- knurl ---------- */
// A diamond knurl: two groove sets at 45 degrees round the rim.
// The map holds tangent-space normals from a pyramid height field.
function knurlMap() {
  const W = 1152, H = 64;
  const across = (WIDTH / (TAU * R / TEETH));

      const sx = (hgt(u + du, v) - hgt(u - du, v)) / (2 * du * TAU * R) * k;

      const l = Math.hypot(sx, sy, 1), i = (y * W + x) * 4;

/* ---------- scene ---------- */

const mountMat = new THREE.MeshStandardMaterial({ color: col(0.4, 0.008, 250), metalness: 0.7, roughness: 0.5 });

// The pivot's x axis is the spray direction; the mount turns with it.

  mesh.rotation.x = Math.PI / 2;
  const flint = new THREE.Mesh(flintGeo, flintMat);
  flint.position.y = -R - 0.07;
  const tube = new THREE.Mesh(tubeGeo, mountMat);
  tube.position.y = -R - 0.31;
  const foot = new THREE.Mesh(footGeo, mountMat);
  foot.position.set(-0.25, FLOOR + 0.06, 0);
  const pin = new THREE.Mesh(pinGeo, mountMat);
  pin.rotation.x = Math.PI / 2;
  pivot.add(mesh, flint, tube, foot, pin);

  for (const z of [-0.36, 0.36]) {
    const arm = new THREE.Mesh(armGeo, mountMat);
    arm.position.set(-0.37, -0.7, z);

const real = makeWheel();
scene.add(real.pivot);

/* ---------- lights ---------- */
// A cool rim light from behind on the left picks out the knurl.
const rim = new THREE.DirectionalLight(col(0.9, 0.03, 240), 2.4);
rim.position.set(-4, 5, -4);
// A weak fill from the front right shows the face.
const fill = new THREE.DirectionalLight(col(0.8, 0.02, 80), 0.35);
fill.position.set(4, 2, 6);
// The contact light flashes warm with the spray.
// It rides the pivot, below the flint on the camera side.
// From there it washes the face, the mount and the floor.
const contact = new THREE.PointLight(col(0.82, 0.16, 62), 0, 7, 2);
contact.position.set(0.1, -R - 0.25, 0.9);
real.pivot.add(contact);
scene.add(rim, fill);

/* ---------- floor ---------- */
// A wet floor: a dark, glossy sheet over a mirrored copy of the scene.
const floorMat = new THREE.MeshStandardMaterial({ color: col(0.1, 0.006, 250), metalness: 0, roughness: 0.28, transparent: true, opacity: 0.88 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = FLOOR;
floor.renderOrder = 1;
scene.add(floor);
const mirror = new THREE.Group();
mirror.scale.y = -1;
mirror.position.y = 2 * FLOOR;
const ghost = makeWheel();
mirror.add(ghost.pivot);
scene.add(mirror);
function setFloor(v) {

  floorMat.opacity = v === 'wet' ? 0.88 : 1;
  floorMat.roughness = v === 'wet' ? 0.28 : 0.85;
  floorMat.transparent = v === 'wet';
  floorMat.needsUpdate = true;

setFloor(ui.setting('floor')?.value ?? 'wet');

/* ---------- haze ---------- */
// A far backdrop: a faint cool glow up and right, behind the wheel.
// The wet floor mirrors it, so the floor reads as wet.
const hazeMat = new THREE.MeshBasicNodeMaterial({ depthWrite: false, fog: false });
{
  const d = uv().sub(vec2(0.56, 0.6)).mul(vec2(1, 2.4));
  hazeMat.colorNode = vec4(uniform(BG).add(uniform(col(0.3, 0.03, 245)).mul(exp(d.dot(d).mul(-12)))), 1);
}
const hazeGeo = new THREE.PlaneGeometry(120, 60);
const haze = new THREE.Mesh(hazeGeo, hazeMat);
haze.position.set(4, 2, -14);
haze.renderOrder = -1;
const ghostHaze = haze.clone();
scene.add(haze);
mirror.add(ghostHaze);

/* ---------- embers ---------- */
// Each ember cools from its start temperature; the colour follows a blackbody ramp.
// An ember is one instanced quad, sized in pixels in the vertex stage.
const EMBERS = 512;
const emberGeo = new THREE.InstancedBufferGeometry();

emberGeo.setAttribute('aE', eAt);

// Additive: a shader adds its colour and leaves alpha alone.

  m.blending = THREE.CustomBlending; m.blendSrc = THREE.OneFactor; m.blendDst = THREE.OneFactor;
  m.blendSrcAlpha = THREE.ZeroFactor; m.blendDstAlpha = THREE.OneFactor;

}
const clipOf = p => cameraProjectionMatrix.mul(cameraViewMatrix).mul(vec4(p, 1));
const uEmberDpr = uniform(1);
// The mirror copy flips about the floor in the shader.

// Seeded random keeps the first frame the same on every load.

  eAttr.set([born, tau, t0], i * 3);

  emberEnd = 0;

/* ---------- K6: burst particles ---------- */

// Each slot holds one flight segment in closed form, written once.

// The thumb on the knurl: a short scrape over a dull knock.
function scrape() {
  const ac = kit.live();
  if (!ac || !kit.noise) return;
  const at = ac.currentTime + 0.005, pan = panAt(tmpV.set(0, -R, 0));
  burst(ac, at, { f: 2500, q: 0.8, dur: 0.07, level: 0.4, pan });
  blip(ac, at, { f: 170, dur: 0.06, level: 0.3, pan });
}

/* ---------- pointer ---------- */
// A press becomes a drag after 8 px, or a hold after 260 ms.
// A release that is neither is a tap, and a tap strikes.
// The forward stroke runs down and a little right; the ratchet blocks the back stroke.
const FWD = new THREE.Vector2(0.25, 1).normalize();
let ptr = null, holdTo = 0;
function spinFrom(dx, dy, dt) {
  if (dt <= 0) return;
  const fwd = (dx * FWD.x + dy * FWD.y) / dt;
  // The thumb drives the wheel up to its own rim speed, never brakes it.
  if (fwd > 0) {
    const was = wheel.omega;
    // The wheel is large on screen; the gain keeps a short flick lively.
    wheel.omega = Math.min(MAXW, Math.max(wheel.omega, fwd / (rPx * 0.7)));
    if (was < 3 && wheel.omega >= 4) scrape();
    return;
  }
  // The back stroke slips over the pawl: one click each 16 px.
  ptr.back = (ptr.back || 0) - fwd * dt;
  while (ptr.back > 16) {
    ptr.back -= 16;
    const ac = kit.live();
    if (ac && kit.noise) play(ac, ac.currentTime + 0.005, { kind: 'pawl', x: 0, y: -R, z: 0 });
  }
}
function down(e) {
  if (ptr || e.button > 0) return;
  try { canvas.setPointerCapture(e.pointerId); } catch { /* A synthetic pointer has no capture. */ }
  ptr = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t: e.timeStamp, mode: 'press' };
  holdTo = setTimeout(() => { if (ptr?.mode === 'press') ptr.mode = 'hold'; }, 260);
  dragging = true;
  live();
}
function move(e) {
  if (!ptr || e.pointerId !== ptr.id) return;
  if (ptr.mode !== 'drag' && Math.hypot(e.clientX - ptr.x0, e.clientY - ptr.y0) > 8) {
    clearTimeout(holdTo);
    ptr.mode = 'drag';
    stage.classList.add('drag');
  }
  if (ptr.mode === 'drag') spinFrom(e.clientX - ptr.x, e.clientY - ptr.y, (e.timeStamp - ptr.t) / 1000);
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.t = e.timeStamp;
  live();
}
function up(e) {
  if (!ptr || (e && e.pointerId !== ptr.id)) return;
  clearTimeout(holdTo);
  const tap = ptr.mode === 'press' && e?.type === 'pointerup';
  ptr = null;
  dragging = false;
  stage.classList.remove('drag');
  if (tap) strike();
  live();
}
// A strike turns the wheel about a quarter turn.
function strike() {
  if (wheel.omega < 3) scrape();
  wheel.omega = Math.max(wheel.omega, (Math.PI / 2) / FRICTION);
  live();
}
act.reset = () => {
  wheel.omega = 0;
  grinding = false;
  rate = 0;
  // Every live spark ends now.
  aA.array.fill(0); aC.array.fill(0);
  sparkGeo.instanceCount = 0;
  head = 0; dirtyFrom = -1; dirtyN = 0; lastDeath = 0;
  for (const at of [aA, aC]) at.needsUpdate = true;
  seedEmbers(time);
  live();
};

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
let ready = false;
resize();
seedEmbers(0);
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  ready = true;
  mark('first-frame');
  wake();
}, () => { canvas.classList.add('on'); ready = true; mark('first-frame'); });

// The first-frame embers start to cool once the intro has gone.
const introEl = document.querySelector('.intro');
if (introEl) {
  const mo = new MutationObserver(() => {
    if (introEl.isConnected) return;
    mo.disconnect();
    act.reset();
  });
  mo.observe(document.body, { childList: true, subtree: true });
}

canvas.addEventListener('pointerdown', down);
canvas.addEventListener('pointermove', move);
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
canvas.addEventListener('lostpointercapture', up);

new ResizeObserver(() => { resize(); if (ready) draw(); }).observe(stage);
onQuality(() => { rung = 0; runFor = slowFor = 0; resize(); if (ready) draw(); });
onReducedChange(() => { if (ready) draw(); wake(); });
// A hidden tab stops the loop and the sim clock with it.
whenVisible(stage, v => {
  visible = v;
  if (!v) { halt(); queue.length = 0; kit.rest(() => true); return; }
  wake();
});
</script>
</body>
</html>
