<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.07 0.008 250); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spark wheel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">
<style>
/* Spark wheel: a knurled wheel on a flint, close up, in the dark. */
:root { --stage: oklch(0.07 0.008 250); }
.stage--spark canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--spark canvas.on { opacity: 1; }
.stage--spark { cursor: grab; }
.stage--spark.drag { cursor: grabbing; }
@media (prefers-reduced-motion: reduce) { .stage--spark canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Spark wheel</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--spark" id="stage" tabindex="0" role="application" aria-label="A knurled steel wheel on a flint, close up. Drag down to flick the wheel and throw sparks. Click to strike. Hold Space to grind.">
      <p class="fail" hidden>Spark wheel needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Spark wheel</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, whenVisible, pixelRatio, onQuality, quality, reduced, onReducedChange, linFit, stage as mark, pageReady } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const stage = document.getElementById('stage');
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const col = (L, C, h) => new THREE.Color().setRGB(...linFit(L, C, h), THREE.LinearSRGBColorSpace);

/* ---------- the wheel ---------- */
// Units: the wheel radius is 1. The floor lies below the flint.
const R = 1, WIDTH = 0.55, TEETH = 36, FLOOR = -2.35;
// Friction stops a free wheel in about a second.
const FRICTION = 0.35, GRIND = 30, MAXW = 60;
const wheel = { angle: 0, omega: 0 };

playIntro({ ready: pageReady(9000) });
mark('build');

/* ---------- bar ---------- */
let metal = 'ferro', grinding = false;
// The handlers bind once the scene exists.
const act = { reset() {} };
const ui = initPage({ id: 'spark', bar: {
  choice: { label: 'Metal', value: 'ferro', options: [
    { value: 'ferro', label: 'Ferro', key: '1' },
    { value: 'steel', label: 'Steel', key: '2' },
    { value: 'titanium', label: 'Titanium', key: '3' },
  ], onPick: v => { metal = v; } },
  actions: [{ verb: 'grind', key: 'Space', hold: true,
    onDown: () => { grinding = true; live(); }, onUp: () => { grinding = false; live(); } }],
  settings: [
    { type: 'slider', id: 'trails', label: 'Trails', min: 0, max: 1, step: 0.01, value: 0.5, persist: true, onInput: v => { trails = v; } },
    { type: 'choice', id: 'floor', label: 'Floor', value: 'wet', persist: true,
      options: [{ value: 'wet', label: 'Wet' }, { value: 'dry', label: 'Dry' }], onPick: v => { setFloor(v); live(); } },
    { type: 'toggle', id: 'smoke', label: 'Smoke', value: true, persist: true, onToggle: v => { smokeOn = v; live(); } },
  ],
  reset: () => act.reset(),
  quality: true,
  keys: [['drag', 'flick the wheel'], ['click', 'strike'], ['space', 'grind']],
} });
// Task 2 reads the trail length.
let trails = ui.setting('trails')?.value ?? 0.5;
let smokeOn = ui.setting('smoke')?.value ?? true;

/* ---------- renderer ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  ui.hideControls?.();
  mark('first-frame');
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const canvas = renderer.domElement;
stage.prepend(canvas);

const BG = col(0.075, 0.008, 250);
const scene = new THREE.Scene();
scene.background = BG;
scene.fog = new THREE.Fog(BG, 9, 26);
// Faint room reflections let bare steel read as metal.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.1;
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;

/* ---------- knurl ---------- */
// A diamond knurl: two groove sets at 45 degrees round the rim.
// The map holds tangent-space normals from a pyramid height field.
function knurlMap() {
  const W = 1152, H = 64;
  const across = (WIDTH / (TAU * R / TEETH));
  const hgt = (u, v) => {
    const a = (u * TEETH + v * across) % 1, b = (((u * TEETH - v * across) % 1) + 1) % 1;
    return 1 - Math.max(Math.abs(a - 0.5), Math.abs(b - 0.5)) * 2;
  };
  const data = new Uint8Array(W * H * 4);
  const du = 1 / W, dv = 1 / H, k = 0.035;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const u = x / W, v = y / H;
      // Slopes in world units: the rim is 2πR around and WIDTH across.
      const sx = (hgt(u + du, v) - hgt(u - du, v)) / (2 * du * TAU * R) * k;
      const sy = (hgt(u, v + dv) - hgt(u, v - dv)) / (2 * dv * WIDTH) * k;
      const l = Math.hypot(sx, sy, 1), i = (y * W + x) * 4;
      data[i] = (-sx / l * 0.5 + 0.5) * 255;
      data[i + 1] = (-sy / l * 0.5 + 0.5) * 255;
      data[i + 2] = (1 / l * 0.5 + 0.5) * 255;
      data[i + 3] = 255;
    }
  }
  const t = new THREE.DataTexture(data, W, H);
  t.wrapS = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.needsUpdate = true;
  return t;
}
// The face: fine lathe rings, a darker axle hole in the centre.
function faceMaps() {
  const S = 256, c = new Uint8Array(S * S * 4), r = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const d = Math.hypot(x / S - 0.5, y / S - 0.5) * 2, i = (y * S + x) * 4;
      const ring = 0.5 + 0.5 * Math.sin(d * 260);
      const hole = d < 0.2 ? 0.08 : d < 0.24 ? 0.5 : 1;
      c[i] = c[i + 1] = c[i + 2] = 255 * hole;
      r[i + 1] = 255 * (0.18 + 0.14 * ring);
      c[i + 3] = r[i + 3] = 255;
    }
  }
  const tex = d => { const t = new THREE.DataTexture(d, S, S); t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter; t.needsUpdate = true; return t; };
  const map = tex(c);
  map.colorSpace = THREE.SRGBColorSpace;
  return { map, rough: tex(r) };
}

/* ---------- scene ---------- */
const steel = col(0.68, 0.008, 250);
const rimMat = new THREE.MeshStandardMaterial({ color: steel, metalness: 1, roughness: 0.3, normalMap: knurlMap(), normalScale: new THREE.Vector2(1, 1) });
const fm = faceMaps();
const faceMat = new THREE.MeshStandardMaterial({ color: steel, metalness: 1, roughness: 1, map: fm.map, roughnessMap: fm.rough });
const wheelGeo = new THREE.CylinderGeometry(R, R, WIDTH, 160, 1);
const flintMat = new THREE.MeshStandardMaterial({ color: col(0.36, 0.006, 70), metalness: 0.1, roughness: 0.92 });
const flintGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.8, 40, 1);

// The yaw shows the knurled rim band three-quarter on.
function makeWheel() {
  const pivot = new THREE.Group();
  pivot.rotation.y = -0.75;
  const mesh = new THREE.Mesh(wheelGeo, [rimMat, faceMat, faceMat]);
  mesh.rotation.x = Math.PI / 2;
  pivot.add(mesh);
  const flint = new THREE.Mesh(flintGeo, flintMat);
  flint.position.y = -R - 0.4;
  return { pivot, mesh, flint };
}
const real = makeWheel();
scene.add(real.pivot, real.flint);

/* ---------- lights ---------- */
// A cool rim light from behind on the right picks out the knurl.
const rim = new THREE.DirectionalLight(col(0.9, 0.03, 240), 2.4);
rim.position.set(4, 5, -4);
// A weak fill from the front left shows the face.
const fill = new THREE.DirectionalLight(col(0.8, 0.02, 80), 0.35);
fill.position.set(-4, 2, 6);
// The contact light flashes warm with the spray.
const contact = new THREE.PointLight(col(0.82, 0.16, 62), 0, 7, 2);
contact.position.set(0.35, -R + 0.2, 0.7);
scene.add(rim, fill, contact);

/* ---------- floor ---------- */
// A wet floor: a dark, glossy sheet over a mirrored copy of the scene.
const floorMat = new THREE.MeshStandardMaterial({ color: col(0.1, 0.006, 250), metalness: 0, roughness: 0.28, transparent: true, opacity: 0.88 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = FLOOR;
floor.renderOrder = 1;
scene.add(floor);
const mirror = new THREE.Group();
mirror.scale.y = -1;
mirror.position.y = 2 * FLOOR;
const ghost = makeWheel();
mirror.add(ghost.pivot, ghost.flint);
scene.add(mirror);
function setFloor(v) {
  mirror.visible = v === 'wet';
  floorMat.opacity = v === 'wet' ? 0.88 : 1;
  floorMat.roughness = v === 'wet' ? 0.28 : 0.85;
  floorMat.transparent = v === 'wet';
  floorMat.needsUpdate = true;
}
setFloor(ui.setting('floor')?.value ?? 'wet');

/* ---------- haze ---------- */
// A far backdrop: a faint cool glow up and right, behind the wheel.
// The wet floor mirrors it, so the floor reads as wet.
const hazeMat = new THREE.ShaderMaterial({
  uniforms: { uCol: { value: col(0.3, 0.03, 245) }, uBg: { value: BG } },
  vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform vec3 uCol, uBg;
    varying vec2 vUv;
    void main() {
      vec2 d = (vUv - vec2(0.56, 0.6)) * vec2(1.0, 2.4);
      gl_FragColor = vec4(uBg + uCol * exp(-dot(d, d) * 12.0), 1.0);
    }`,
  depthWrite: false, fog: false,
});
const hazeGeo = new THREE.PlaneGeometry(120, 60);
const haze = new THREE.Mesh(hazeGeo, hazeMat);
haze.position.set(4, 2, -14);
haze.renderOrder = -1;
const ghostHaze = haze.clone();
scene.add(haze);
mirror.add(ghostHaze);

/* ---------- embers ---------- */
// Each ember cools from its start temperature; the colour follows a blackbody ramp.
const EMBERS = 512;
const emberGeo = new THREE.BufferGeometry();
const ePos = new Float32Array(EMBERS * 3), eAttr = new Float32Array(EMBERS * 3);
emberGeo.setAttribute('position', new THREE.BufferAttribute(ePos, 3));
// x: birth time, y: cooling time, z: start temperature as 0 to 1.
emberGeo.setAttribute('aE', new THREE.BufferAttribute(eAttr, 3));
const BODY = /* glsl */`
vec3 body(float t) {
  vec3 c = mix(vec3(0.35, 0.015, 0.0), vec3(1.0, 0.32, 0.04), smoothstep(0.0, 0.45, t));
  c = mix(c, vec3(1.0, 0.78, 0.5), smoothstep(0.45, 0.85, t));
  return mix(c, vec3(1.0, 0.95, 0.88), smoothstep(0.85, 1.0, t));
}
`;
const emberMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uDpr: { value: 1 } },
  vertexShader: /* glsl */`
    attribute vec3 aE;
    uniform float uTime, uDpr;
    varying float vT;
    void main() {
      float age = uTime - aE.x;
      vT = age < 0.0 ? 0.0 : aE.z * exp(-age / aE.y);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = (4.0 + 10.0 * vT) * uDpr * 16.0 / -mv.z;
    }`,
  fragmentShader: /* glsl */`
    varying float vT;
    ${BODY}
    void main() {
      float r = length(gl_PointCoord - 0.5) * 2.0;
      // A hot core inside a soft glow.
      float a = exp(-r * r * 9.0) + 0.25 * exp(-r * r * 2.5) * smoothstep(1.0, 0.6, r);
      // Radiance rises steeply with temperature.
      float e = pow(vT, 3.0) * 9.0;
      gl_FragColor = vec4(body(vT) * e * a, 1.0);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const embers = new THREE.Points(emberGeo, emberMat);
embers.frustumCulled = false;
const ghostEmbers = new THREE.Points(emberGeo, emberMat);
ghostEmbers.frustumCulled = false;
// Embers draw after the wet floor; their mirror draws under it.
embers.renderOrder = 2;
scene.add(embers);
mirror.add(ghostEmbers);

// Seeded random keeps the first frame the same on every load.
let seed = 1031;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
let emberHead = 0, emberN = 0, emberEnd = 0;
// Embers fill a ring; the oldest gives way.
function addEmber(x, z, born, tau, t0) {
  const i = emberHead;
  emberHead = (emberHead + 1) % EMBERS;
  emberN = Math.max(emberN, emberHead || EMBERS);
  ePos.set([x, FLOOR + 0.02, z], i * 3);
  eAttr.set([born, tau, t0], i * 3);
  emberGeo.setDrawRange(0, emberN);
  emberGeo.attributes.position.needsUpdate = true;
  emberGeo.attributes.aE.needsUpdate = true;
  emberEnd = Math.max(emberEnd, born + 4 * tau);
}
// Clear the ring. The first frame then holds six embers that cool over 8 s.
function seedEmbers(t) {
  eAttr.fill(0);
  emberHead = emberN = 0;
  emberEnd = 0;
  for (let i = 0; i < 6; i++) {
    const [x, z] = narrow ? [0.4 + rnd() * 1.8, -1 + rnd() * 3.6] : [0.8 + rnd() * 3.6, -1.6 + rnd() * 4.2];
    addEmber(x, z, t - rnd() * 0.6, 2.4 + rnd() * 1.8, 0.62 + rnd() * 0.25);
  }
}

/* ---------- K6: burst particles ---------- */
// Lifted from Fireworks: a ring of spark slots on one instanced streak quad.
// Each slot holds one flight segment in closed form, written once.
// A spark is a chain of segments: flight, then forks or floor bounces.
// Later segments carry a future start time; they wait hidden until then.
const CAP = 8000;
const G = new THREE.Vector3(0, -16, 0);
const sparkGeo = new THREE.InstancedBufferGeometry();
// Three columns, tail (0), middle (1) and head (2), so a trail can bend.
// y runs across the streak.
sparkGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, -1, 0, 0, 1, 0, 1, -1, 0, 1, 1, 0, 2, -1, 0, 2, 1, 0], 3));
sparkGeo.setIndex([0, 2, 3, 0, 3, 1, 2, 4, 5, 2, 5, 3]);
const slot = name => {
  const a = new THREE.InstancedBufferAttribute(new Float32Array(CAP * 4), 4);
  a.setUsage(THREE.DynamicDrawUsage);
  sparkGeo.setAttribute(name, a);
  return a;
};
// aA: start point, start time. aB: start velocity, drag. aC: start heat, life, trail, size. aD: kind, seed, end heat, gain.
const aA = slot('aA'), aB = slot('aB'), aC = slot('aC'), aD = slot('aD');
sparkGeo.instanceCount = 0;
function sparkMat(mirrored) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) }, uDpr: { value: 1 },
      uG: { value: G }, uFloor: { value: FLOOR }, uMirror: { value: mirrored ? 1 : 0 }, uTrail: { value: 1 },
      // The wet floor mirrors the sparks at half strength.
      uGain: { value: mirrored ? 0.5 : 1 },
    },
    transparent: true, depthWrite: false,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
    blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
    vertexShader: /* glsl */`
    attribute vec4 aA, aB, aC, aD;
    uniform float uTime, uDpr, uFloor, uMirror, uTrail, uGain;
    uniform vec2 uRes;
    uniform vec3 uG;
    varying vec3 vCol, vColT, vLWH;
    varying float vS, vY, vSpark, vSeed;
    ${BODY}
    // Linear drag, a = G - k v, in closed form: no stored state.
    vec3 path(float t) {
      vec3 vt = uG / aB.w;
      vec3 p = aA.xyz + vt * t + (aB.xyz - vt) * (1.0 - exp(-aB.w * t)) / aB.w;
      // The mirror copy flips about the floor.
      if (uMirror > 0.5) p.y = 2.0 * uFloor - p.y;
      return p;
    }
    // Screen position in pixels, and the clip position for output.
    vec2 scr(vec3 p, out vec4 clip) { clip = projectionMatrix * viewMatrix * vec4(p, 1.0); return clip.xy / clip.w * 0.5 * uRes; }
    void main() {
      float age = uTime - aA.w, life = aC.y;
      if (age < 0.0 || age > life) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
      float f = age / life, tr = min(aC.z * uTrail, age);
      // Three points on the true path, so the trail follows the fall.
      vec4 c0, c1, c2;
      vec2 s0 = scr(path(age - tr), c0), s1 = scr(path(age - tr * 0.5), c1), s2 = scr(path(age), c2);
      float L01 = length(s1 - s0), len = L01 + length(s2 - s1);
      // The core is w wide; the quad is wider to hold the head's halo.
      float w = aC.w * uDpr * (1.0 - 0.4 * f), W = w * 2.4;
      int col = int(position.x + 0.5);
      vec4 c = col == 0 ? c0 : col == 1 ? c1 : c2;
      vec2 dir = col == 0 ? s1 - s0 : col == 1 ? s2 - s0 : s2 - s1;
      dir = length(dir) > 1e-3 ? normalize(dir) : vec2(0.0, 1.0);
      float s = col == 0 ? -W : col == 1 ? L01 : len + W;
      vec2 off = vec2(-dir.y, dir.x) * position.y * W + dir * (col == 0 ? -W : col == 2 ? W : 0.0);
      c.xy += off / (0.5 * uRes) * c.w;
      gl_Position = c;
      vS = s; vY = position.y * W; vLWH = vec3(len, w, W); vSeed = aD.y;
      // Heat falls along the segment; radiance rises steeply with heat.
      float heat = mix(aC.x, aD.z, f);
      float e = pow(heat, 2.5) * 5.0 * aD.w * uGain * (1.0 - smoothstep(0.85, 1.0, f) * 0.6);
      vCol = body(heat) * e;
      // The tail is cooler and redder than the head.
      vColT = body(heat * 0.7) * e * 0.5;
      vSpark = aD.x > 0.5 ? 0.9 : 0.3;
    }`,
    fragmentShader: /* glsl */`
    varying vec3 vCol, vColT, vLWH;
    varying float vS, vY, vSpark, vSeed;
    void main() {
      float len = vLWH.x, W = vLWH.z;
      // A core thinner than a pixel aliases; widen it and dim it to match.
      float w = max(vLWH.y, 0.8), dim = min(vLWH.y / 0.8, 1.0);
      // Distance from the tail-to-head path: a capsule with round ends.
      float out_ = vS < 0.0 ? -vS : max(vS - len, 0.0);
      float d2 = (out_ * out_ + vY * vY) / (w * w);
      float core = max(exp(-d2 * 1.8) - 0.01, 0.0);
      // Brightness falls off exponentially from the head down the trail.
      float u = clamp(vS / max(len, 1.0), 0.0, 1.0);
      float trail = 0.05 + 0.95 * exp(-3.0 * (1.0 - u));
      // Glints every few pixels along the tail.
      float g = step(0.55, fract(sin(floor(vS / 3.0) * 12.9898 + vSeed) * 43758.5453));
      float sp = mix(1.0, 0.4 + 1.4 * g, vSpark * (1.0 - u));
      // The head carries a soft halo, wider than the core.
      float dh2 = ((vS - len) * (vS - len) + vY * vY) / (W * W);
      float halo = 0.22 * exp(-dh2 * 3.0);
      vec3 c = mix(vColT, vCol, u) * core * trail * sp + vCol * halo;
      gl_FragColor = vec4(c * dim, 0.0);
    }`,
  });
}
const sparks = new THREE.Mesh(sparkGeo, sparkMat(false));
sparks.frustumCulled = false;
sparks.renderOrder = 2;
const sparksGhost = new THREE.Mesh(sparkGeo, sparkMat(true));
sparksGhost.frustumCulled = false;
sparksGhost.renderOrder = 0;
scene.add(sparks, sparksGhost);
let head = 0, dirtyFrom = -1, dirtyN = 0, lastDeath = 0;
// Write one segment into the next slot; the oldest slot gives way.
function writeSpark(p0, t0, v0, k, heat0, life, trail, size, kind, heat1, gain) {
  const i = head;
  head = (head + 1) % CAP;
  if (dirtyFrom < 0) dirtyFrom = i;
  dirtyN = Math.min(CAP, dirtyN + 1);
