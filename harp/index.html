<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>String harp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* String harp: a dark panel at full width under the shared header. */
:root { --stage: oklch(0.21 0.008 265); }
/* The instrument fades in on arrival. */
.stage--harp canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  animation: arrive 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes arrive { from { opacity: 0; } }
.stage--harp.grab { cursor: grab; }
.stage--harp.held { cursor: grabbing; }
@media (prefers-reduced-motion: reduce) { .stage--harp canvas { animation: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">String harp</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--harp" id="harp" tabindex="0" role="application" aria-label="String harp with twelve strings. Click or tap a string to pluck it, drag across strings to strum, press a string and drag sideways to pull it. Keys 1 to 0, minus and equals pluck; arrow keys strum.">
      <canvas aria-hidden="true"></canvas>
    </div>
    <div class="bar">
      <div class="choices" role="group" aria-label="Scale">
        <button class="chip" type="button" data-scale="pent" aria-pressed="true">Pentatonic</button>
        <button class="chip" type="button" data-scale="lyd" aria-pressed="false">Lydian</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt><span class="fine">Click a string</span><span class="touch">Tap a string</span></dt><dd>pluck</dd></div>
        <div><dt>Drag across</dt><dd>strum</dd></div>
        <div><dt>Hold and drag</dt><dd>bend</dd></div>
        <div class="fine"><dt><kbd>1</kbd> to <kbd>=</kbd></dt><dd>pluck</dd></div>
        <div class="fine"><dt><kbd>Arrows</kbd></dt><dd>strum</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">String harp</h1><div class="vignette" hidden></div></section>
</div>

<script type="module">
// The toy names its own note player sound(), so the shell's toggle is shellSound.
import { initPage, sound as shellSound } from '../shared/stim.js';
initPage({ id: 'harp' });
(() => {
'use strict';
const TAU = Math.PI * 2, PI = Math.PI, D2R = PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const clock = () => performance.now() / 1000;

const panel = document.getElementById('harp'), cv = panel.querySelector('canvas'), ctx = cv.getContext('2d');
const under = document.createElement('canvas'), uctx = under.getContext('2d');
const over = document.createElement('canvas'), octx = over.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; });

/* ---------- colour: OKLCH in, sRGB out ---------- */
function lin(L, C, h) {
  const a = C * Math.cos(h * D2R), b = C * Math.sin(h * D2R);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
  ];
}
const gam = x => (x = clamp(x), x <= 0.0031308 ? 12.92 * x : 1.055 * x ** (1 / 2.4) - 0.055);
function rgb([L, C, h]) {
  let c = lin(L, C, h);
  // Chroma shrinks until the colour fits sRGB.
  for (let i = 0; i < 24 && (Math.min(c[0], c[1], c[2]) < -1e-4 || Math.max(c[0], c[1], c[2]) > 1.0001); i++) c = lin(L, (C *= 0.9), h);
  return [gam(c[0]), gam(c[1]), gam(c[2])];
}
const hx = v => ((v * 255 + 0.5) | 0).toString(16).padStart(2, '0');
function css(lch, a) {
  const [r, g, b] = rgb(lch);
  return a == null ? '#' + hx(r) + hx(g) + hx(b) : `rgba(${(r * 255) | 0},${(g * 255) | 0},${(b * 255) | 0},${a})`;
}
// Series hues, low string to high, fire through to magenta.
const STOPS = [
  [0.6, 0.21, 28], [0.7, 0.19, 52], [0.8, 0.17, 84], [0.77, 0.16, 160],
  [0.69, 0.14, 206], [0.55, 0.18, 258], [0.51, 0.2, 292], [0.57, 0.22, 330],
];
// Catmull-Rom through the stops, clamped at both ends.
function hueAt(u) {
  const n = STOPS.length, k = Math.min(n - 2, Math.floor(u)), t = u - k;
  const P = q => STOPS[clamp(k + q, 0, n - 1)];
  const a = P(-1), b = P(0), c = P(1), d = P(2), t2 = t * t, t3 = t2 * t;
  return [0, 1, 2].map(i => 0.5 * (2 * b[i] + (c[i] - a[i]) * t + (2 * a[i] - 5 * b[i] + 4 * c[i] - d[i]) * t2 + (3 * b[i] - a[i] - 3 * c[i] + d[i]) * t3));
}
const WHITE = a => `rgba(255,255,255,${a})`;
// Lacquer is a deep blue-black; rosewood and bone sit on it.
const LAC = [[0.27, 0.026, 262], [0.205, 0.022, 266], [0.15, 0.018, 272]], LAC_LIT = [0.92, 0.02, 250];
const WOOD = [[0.43, 0.065, 48], [0.34, 0.06, 40], [0.25, 0.05, 34]], WOOD_LIT = [0.95, 0.04, 75];
const BONE = [[0.94, 0.022, 88], [0.86, 0.03, 80], [0.7, 0.04, 68]], BONE_LIT = [0.99, 0.012, 95];

/* ---------- strings ---------- */
const NS = 12, M = 12, NSEG = 48;
const TONE = Array.from({ length: NS }, (_, i) => {
  const [L, C, h] = hueAt((i / (NS - 1)) * (STOPS.length - 1));
  const l = Math.max(0.72, L + 0.06), c = Math.min(C, 0.17);
  const [r, g, b] = rgb([l, c, h]).map(v => Math.round(v * 255));
  return {
    base: [l, c, h], mid: css([l, c, h]), deep: css([l - 0.22, c * 0.9, h + 6]), lit: css([0.97, c * 0.25, h]),
    rgba: a => `rgba(${r},${g},${b},${a.toFixed(3)})`,
  };
});
// Semitones above C3 for each string, low to high.
const SCALES = {
  pent: [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26],
  lyd: [5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23, 24],
};
const C3 = 130.8128;
let scale = 'pent';
const S = Array.from({ length: NS }, (_, i) => ({
  i, f: 0, om: 0, t60: 1, tau: 1, w: 2, side: i % 2 ? 1 : -1,
  ax: 0, ay: 0, bx: 0, by: 0, dx: 0, dy: 1, px: 0, py: 0, hx: 0, hy: 0,
  len: 1, ux: 0, uy: 1, nx: 1, ny: 0,
  P: new Float64Array(M), Q: new Float64Array(M), act: 0, born: 0, td: 0, hold: null,
}));
// Mode shapes along the string, sampled once.
const SIN = Array.from({ length: M }, (_, n) => Float64Array.from({ length: NSEG + 1 }, (_, k) => Math.sin(((n + 1) * PI * k) / NSEG)));
const CO = new Float64Array(M), Y = new Float64Array(NSEG + 1), LO = new Float64Array(NSEG + 1), HI = new Float64Array(NSEG + 1);

// Retuning keeps each mode's current position and phase.
function rephase(st, om, tv) {
  for (let n = 0; n < M; n++) {
    const P = st.P[n], Q = st.Q[n], R = Math.hypot(P, Q);
    if (!R) continue;
    const th = om * (n + 1) * tv - (st.om * (n + 1) * tv - Math.atan2(Q, P));
    st.P[n] = R * Math.cos(th);
    st.Q[n] = R * Math.sin(th);
  }
}
function tune() {
  const tv = clock();
  for (const st of S) {
    const f = C3 * 2 ** (SCALES[scale][st.i] / 12);
    // Slow motion: 7 Hz at C3, a little faster higher up.
    const om = TAU * 7 * (f / C3) ** 0.45;
    if (st.act) rephase(st, om, tv);
    st.f = f;
    st.om = om;
    // Lower strings ring longer.
    st.t60 = 5.2 * (C3 / f) ** 0.55;
    st.tau = st.t60 / 6.9;
  }
}

// A pluck is a triangle at the pluck point, split into modes.
function excite(st, s, d) {
  s = clamp(s, 0.04, 0.96);
  const tv = clock(), k = ((reduce ? 0.35 : 1) * 2 * d) / (PI * PI * s * (1 - s));
  let act = 0;
  for (let n = 0; n < M; n++) {
    const m = n + 1, A = (k * Math.sin(m * PI * s)) / (m * m), w = st.om * m * tv;
    // A new pluck mostly stops what was ringing.
    st.P[n] = st.P[n] * 0.25 + A * Math.cos(w);
    st.Q[n] = st.Q[n] * 0.25 + A * Math.sin(w);
    act += Math.abs(st.P[n]) + Math.abs(st.Q[n]);
  }
  st.act = act;
  st.born = st.td = tv;
}
// Higher modes lose energy faster, as on a real string.
// Decay runs on real elapsed time, so hidden pages settle.
function decay(st, now) {
  const dt = Math.max(0, now - st.td);
  st.td = now;
  if (!st.act) return;
  let act = 0;
  for (let n = 0; n < M; n++) {
    const k = Math.exp((-dt * (1 + 0.45 * n)) / st.tau);
    st.P[n] *= k;
    st.Q[n] *= k;
    act += Math.abs(st.P[n]) + Math.abs(st.Q[n]);
  }
  if (act < 0.12) { st.P.fill(0); st.Q.fill(0); act = 0; }
  st.act = act;
}

/* ---------- geometry, in CSS pixels ---------- */
let W = 0, H = 0, dpr = 1, lowDpr = false;
let spT = 1, spB = 1, railT = 30, tN = 5, tB = 10, pegR = 8, pinR = 3, hole = { x: 0, y: 0, r: 1 };
// String spacing at a point along the strings, top to bottom.
const spc = s => lerp(spT, spB, clamp(s));

function geometry() {
  const port = W / H < 1.1, cx = W / 2, n1 = NS - 1;
  // Strings fan out toward the bridge; the high ones are shorter.
  const spanB = Math.min(W - 2 * clamp(W * 0.08, 24, 120), H * (port ? 1.2 : 1.4));
  const spanT = spanB * (port ? 0.84 : 0.8);
  spB = spanB / n1;
  spT = spanT / n1;
  railT = clamp(Math.min(W, H) * 0.075, 20, 44);
  tN = clamp(H * 0.011, 4, 7);
  tB = clamp(H * 0.024, 8, 15);
  pegR = clamp(Math.min(spT * 0.36, railT * 0.2), 4.5, 9);
  pinR = clamp(pegR * 0.45, 2.4, 4);
  const yT0 = Math.max(H * 0.16, railT + H * 0.055), yT1 = yT0 + H * (port ? 0.12 : 0.16), yB = H * (port ? 0.85 : 0.84);
  const k = clamp(Math.min(W, H * 1.6) / 1000, 0.8, 1.15);
  for (const st of S) {
    const t = st.i / n1;
    st.ax = cx + spanT * (t - 0.5);
    st.ay = lerp(yT0, yT1, t);
    st.bx = cx + spanB * (t - 0.5);
    st.by = yB;
    st.dx = st.bx - st.ax;
    st.dy = st.by - st.ay;
    st.len = Math.hypot(st.dx, st.dy);
    st.ux = st.dx / st.len;
    st.uy = st.dy / st.len;
    st.nx = st.uy;
    st.ny = -st.ux;
    // Pegs stagger in two rows on the pin block.
    const off = railT * (st.i % 2 ? 0.68 : 0.3), ho = tB / 2 + pinR + 3;
    st.px = st.ax - st.ux * off;
    st.py = st.ay - st.uy * off;
    st.hx = st.bx + st.ux * ho;
    st.hy = st.by + st.uy * ho;
    // Low strings are thicker.
    st.w = lerp(3.6, 1.7, t) * k;
  }
  const yM = (yT0 + yT1) / 2;
  hole = { x: cx, y: lerp(yM, yB, 0.52), r: Math.min(spanB * 0.15, (yB - yM) * 0.22) };
}
// Position along a string from the nut, and signed offset.
const along = (st, x, y) => ((x - st.ax) * st.ux + (y - st.ay) * st.uy) / st.len;
const off = (st, x, y) => (x - st.ax) * st.nx + (y - st.ay) * st.ny;

/* ---------- the instrument, painted once per size ---------- */
function roundPoly(pts, r) {
  const p = new Path2D(), n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const m0 = mid(pts[n - 1], pts[0]);
  p.moveTo(m0[0], m0[1]);
  for (let k = 0; k < n; k++) {
    const a = pts[k], m = mid(a, pts[(k + 1) % n]);
    p.arcTo(a[0], a[1], m[0], m[1], r);
  }
  p.closePath();
  return p;
}
// The rim: a thin white edge fading out by mid-shape.
function rim(c, p, x0, y0, x1, y1, a = 0.62, lw = 1.5) {
  c.save();
  c.clip(p);
  const g = c.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, WHITE(a));
  g.addColorStop(0.5, WHITE(0));
  c.strokeStyle = g;
  c.lineWidth = lw * 2;
  c.stroke(p);
  c.restore();
}
// Round parts: diagonal gradient, top-left light, rim.
function bead(c, x, y, r, [L, C, h]) {
  const p = new Path2D();
  p.arc(x, y, r, 0, TAU);
  const g = c.createLinearGradient(x - 0.92 * r, y - r, x + 0.92 * r, y + r);
  g.addColorStop(0, css([Math.min(0.97, L + 0.07), C * 0.85, h - 10]));
  g.addColorStop(0.55, css([L, C, h]));
  g.addColorStop(1, css([L - 0.15, C * 1.05, h + 14]));
  c.fillStyle = g;
  c.fill(p);
  const lx = x - 0.44 * r, ly = y - 0.6 * r, l = c.createRadialGradient(lx, ly, 0, lx, ly, 1.16 * r);
  l.addColorStop(0, css([0.97, 0.045, h - 20], 0.85));
  l.addColorStop(1, css([0.97, 0.045, h - 20], 0));
  c.fillStyle = l;
  c.fill(p);
  rim(c, p, x - r, y - r, x + r, y + r, 0.62, Math.max(0.8, r * 0.14));
}
// Bars take light from above, so shading runs across the short side.
function bar(c, x0, y0, x1, y1, t, tones, lit, la, grain = 0) {
  const vx = x1 - x0, vy = y1 - y0, L = Math.hypot(vx, vy), h = t / 2;
  let upx = vy / L, upy = -vx / L;
  if (upy > 0) { upx = -upx; upy = -upy; }
  const pts = [[x0 + upx * h, y0 + upy * h], [x1 + upx * h, y1 + upy * h], [x1 - upx * h, y1 - upy * h], [x0 - upx * h, y0 - upy * h]];
  const p = roundPoly(pts, Math.min(h, 8)), mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  const tx = mx + upx * h, ty = my + upy * h, bx = mx - upx * h, by = my - upy * h;
  const g = c.createLinearGradient(tx, ty, bx, by);
  g.addColorStop(0, css(tones[0]));
  g.addColorStop(0.55, css(tones[1]));
  g.addColorStop(1, css(tones[2]));
  c.fillStyle = g;
  c.fill(p);
  const lx = x0 + vx * 0.22 + upx * h * 0.5, ly = y0 + vy * 0.22 + upy * h * 0.5, l = c.createRadialGradient(lx, ly, 0, lx, ly, L * 0.5);
  l.addColorStop(0, css(lit, la));
  l.addColorStop(1, css(lit, 0));
  c.fillStyle = l;
  c.fill(p);
  // Wood shows a few long, faint grain lines.
  if (grain) {
    c.save();
    c.clip(p);
    c.lineWidth = 0.7;
    for (let g2 = 0; g2 < grain; g2++) {
      const o = (((g2 * 0.618) % 1) - 0.5) * t * 0.9, ph = g2 * 2.3, amp = t * 0.06;
      c.strokeStyle = css(tones[2], 0.35 + 0.25 * ((g2 * 0.37) % 1));
      c.beginPath();
      for (let k = 0; k <= 40; k++) {
        const s = k / 40, w = o + amp * Math.sin(s * 9 + ph) + amp * 0.6 * Math.sin(s * 23 + ph * 1.7);
        c.lineTo(x0 + vx * s + upx * w, y0 + vy * s + upy * w);
      }
      c.stroke();
    }
    c.restore();
  }
  rim(c, p, tx, ty, bx, by);
}
// The sound hole: dark inside, its far wall catching the light.
function soundHole(c) {
  const { x, y, r } = hole;
  c.strokeStyle = css(BONE[1], 0.3);
  c.lineWidth = Math.max(1, r * 0.035);
  c.beginPath();
  c.arc(x, y, r * 1.2, 0, TAU);
  c.stroke();
  c.strokeStyle = css(BONE[1], 0.16);
  c.lineWidth = Math.max(1, r * 0.018);
  c.beginPath();
  c.arc(x, y, r * 1.29, 0, TAU);
  c.stroke();
  const p = new Path2D();
  p.arc(x, y, r, 0, TAU);
  const cx = x - r * 0.22, cy = y - r * 0.22, g = c.createRadialGradient(cx, cy, 0, cx, cy, r * 1.22);
  g.addColorStop(0, css([0.075, 0.01, 270]));
  g.addColorStop(0.72, css([0.095, 0.012, 270]));
  g.addColorStop(1, css([0.22, 0.022, 266]));
  c.fillStyle = g;
  c.fill(p);
  rim(c, p, x + r, y + r, x - r, y - r, 0.3);
}
function paint() {
  for (const c of [under, over]) { c.width = cv.width; c.height = cv.height; }
  const u = uctx, o = octx;
  u.setTransform(dpr, 0, 0, dpr, 0, 0);
  o.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = u.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, css(LAC[0]));
  g.addColorStop(0.55, css(LAC[1]));
  g.addColorStop(1, css(LAC[2]));
  u.fillStyle = g;
  u.fillRect(0, 0, W, H);
  const R = Math.hypot(W, H), l = u.createRadialGradient(W * 0.22, H * 0.12, 0, W * 0.22, H * 0.12, R * 0.75);
  l.addColorStop(0, css(LAC_LIT, 0.13));
  l.addColorStop(1, css(LAC_LIT, 0));
  u.fillStyle = l;
  u.fillRect(0, 0, W, H);
  rim(u, roundPoly([[0, 0], [W, 0], [W, H], [0, H]], 18), 0, 0, W, H, 0.4);
  soundHole(u);
  // Pin block and nut along the slanted top, the bridge below.
  const a = S[0], b = S[NS - 1], vl = Math.hypot(b.ax - a.ax, b.ay - a.ay);
  const vx = (b.ax - a.ax) / vl, vy = (b.ay - a.ay) / vl, upx = vy, upy = -vx, e = spT * 0.8, h = railT / 2;
  bar(u, a.ax - vx * e + upx * h, a.ay - vy * e + upy * h, b.ax + vx * e + upx * h, b.ay + vy * e + upy * h, railT, WOOD, WOOD_LIT, 0.3, 7);
  bar(u, a.ax - vx * e, a.ay - vy * e, b.ax + vx * e, b.ay + vy * e, tN, BONE, BONE_LIT, 0.7);
  bar(u, a.bx - spB * 0.7, a.by, b.bx + spB * 0.7, b.by, tB, BONE, BONE_LIT, 0.7);
  // Pegs and hitch pins sit over the string ends.
  for (const st of S) {
    bead(o, st.px, st.py, pegR, TONE[st.i].base);
    bead(o, st.hx, st.hy, pinR, BONE[1]);
  }
}

/* ---------- drawing ---------- */
function drawString(st, tv, span) {
  const tone = TONE[st.i], w = st.w, ends = new Path2D(), p = new Path2D();
  const at = (k, y) => [st.ax + (st.dx * k) / NSEG + st.nx * y, st.ay + (st.dy * k) / NSEG + st.ny * y];
  let band = null;
  ends.moveTo(st.px, st.py);
  ends.lineTo(st.ax, st.ay);
  ends.moveTo(st.bx, st.by);
  ends.lineTo(st.hx, st.hy);
  p.moveTo(st.ax, st.ay);
  if (st.hold) {
    // A held string is two straight runs meeting at the finger.
    const h = st.hold;
    p.lineTo(st.ax + st.dx * h.s + st.nx * h.d, st.ay + st.dy * h.s + st.ny * h.d);
  } else if (st.act) {
    // The shutter stays open for the frame; the swept area blurs.
    let speed = 0;
    for (let n = 0; n < M; n++) speed += st.om * (n + 1) * Math.hypot(st.P[n], st.Q[n]);
    const K = clamp(Math.ceil((speed * span) / Math.max(1, w * 0.6)), 1, 16);
    LO.fill(0);
    HI.fill(0);
    for (let j = 0; j < K; j++) {
      const t = Math.max(st.born, tv - span * (1 - (j + 1) / K));
      for (let n = 0; n < M; n++) {
        const a = st.om * (n + 1) * t;
        CO[n] = st.P[n] * Math.cos(a) + st.Q[n] * Math.sin(a);
      }

function draw(tv, span) {

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 20, LEAD = 0.004;

function live() {

// Room tail: decaying stereo noise that darkens as it fades.

}
function sound(i, s, amp, at = 0, glide = 0) {

const GESTURE = /^(Digit\d|Minus|Equal|Arrow\w+|Space|Enter|NumpadEnter)$/;

const queue = [];

// One string after another, like a hand across the strings.

/* ---------- one loop, only while a string moves ---------- */
let raf = 0, last = 0, onScreen = true, slow = 0;

}

/* ---------- input ---------- */
