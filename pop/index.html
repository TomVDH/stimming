<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pop field</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Pop field: a honeycomb of bubbles laid straight on the page. */
:root { --stage: var(--bg); }
@media (max-width: 640px) { .field { aspect-ratio: 3 / 4; } }
.field canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%; cursor: pointer;
  -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none;
}
/* The focus ring is drawn around the focused cell instead. */
.field canvas:focus-visible { outline: none; }
/* The die is a solid face with its pips cut out. */
.chip.icon svg.die { fill: currentColor; stroke: none; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/pop.svg)"></span><span class="intro-name">Pop field</span><span class="intro-sub">Stimming No. 02</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--pop field" id="field">
      <canvas tabindex="0" role="application" aria-label="Bubble wrap. Arrow keys choose a bubble; Space or Enter pops it. Hold Space on a big bubble to burst it."></canvas>
    </div>
    <div class="bar bar--below">
      <div class="actions">
        <button class="chip icon" id="roll" type="button" aria-label="Shuffle" title="Shuffle: a new sheet"><svg class="die" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d=""/></svg></button>
        <button class="chip" id="reset" type="button">Reset</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>pop</dd></div>
        <div><dt>Drag</dt><dd>sweep</dd></div>
        <div><dt>Hold</dt><dd>burst a big one</dd></div>
        <div class="fine"><dt><kbd>Arrows</kbd> <kbd>Space</kbd></dt><dd>choose, pop</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Pop field</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module">
import { initPage, audioKit, reduced, onReducedChange } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
initPage({ id: 'pop' });

const TAU = Math.PI * 2, PI = Math.PI, D2R = PI / 180, SQ3 = Math.sqrt(3);
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;

let reduce = reduced();
onReducedChange(v => { reduce = v; });

/* ---------- colour: OKLCH in, sRGB out ---------- */
function lin(L, C, h) {

    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,

const hx = v => ((v * 255 + 0.5) | 0).toString(16).padStart(2, '0');
function css(lch, a) {

// A palette is three OKLCH stops: light, middle, deep.
// The first field runs mint, through cyan, to blue.
const MINT = [0.9, 0.11, 165], CYAN = [0.79, 0.125, 205], BLUE = [0.6, 0.14, 250];
// The ramp is a quadratic curve that passes through the middle stop.

// Signed distance to a pointy-top hexagon of apothem a.
function hexSD(x, y, a) {

  px -= d * -0.866025404; py -= d * 0.5;

// A few sine waves crinkle an outline, as in crumpled film.
function wobble(pts, rnd) {

    const t = Math.atan2(y, x);
    const m = 0.975 + 0.026 * Math.sin(5 * t + ph[0]) + 0.017 * Math.sin(11 * t + ph[1]) + 0.011 * Math.sin(19 * t + ph[2]);

const outline = pts => { const p = new Path2D(); pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y))); p.closePath(); return p; };
// The hex outline as points, crinkled when given a random source.

/* ---------- jumbo: seven cells merged into one big dome ---------- */
// The seven-hex flower outline, each edge moved in by t.
// Outer corners and notches both move 2t / sqrt 3 along their bisectors.

/* ---------- sprites: one atlas per palette, drawn once per size ---------- */
const field = document.getElementById('field'), cv = field.querySelector('canvas'), ctx = cv.getContext('2d');
// Two atlases let a new palette sweep in over the old one.
const atl = document.createElement('canvas');
const NB = 32, SHADE_SLOT = NB * 2, SLOTS = NB * 2 + 1;

// Jumbo sprites: one canvas per colour bin, glossy then popped.
const JF = 2.7, jat = new Map();
let SPJ = 0, SBJ = 0, LTJ = null, jPath = null, jShade = null;

  for (let j = 0; j < cols; j++) { const d = Math.abs(cells[row * cols + j].x - wantX); if (d < bd - 0.5) { bd = d; best = j; } }
  fi = row * cols + best;
}
cv.addEventListener('focus', () => { ring = cv.matches(':focus-visible'); wake(); });
cv.addEventListener('blur', () => { ring = false; kPress = null; wake(); });
cv.addEventListener('keydown', e => {
  if (!cells.length) return;
  if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    kPress = null;
    move(e.key);
    ring = true;
    wake();
  } else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    ring = true;
    if (!e.repeat) { kPress = own(cells[fi]); if (!kPress.state && !kPress.J) squeak(); }
    wake();
  }
});
cv.addEventListener('keyup', e => {
  if ((e.key === ' ' || e.key === 'Enter') && kPress) { pop(kPress, nowS(), 0.6 + 0.9 * kPress.q); kPress = null; wake(); }
});
document.getElementById('reset').addEventListener('click', () => refill(nowS()));

/* ---------- theme and size ---------- */
function retheme() { tokens(); if (sR) buildSprites(); draw(); }
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
tokens();
layout();
new ResizeObserver(layout).observe(field);
// Scrolling moves the field under a still mouse, so hover lets go.
addEventListener('scroll', () => { if (hover) { hover = null; hoverCell = null; wake(); } }, { passive: true });

// On arrival the sheet lies flat, then inflates from the centre.
if (!reduce) {
  for (const c of units) { c.state = 1; c.g = 0; c.s = 0.9; }
  draw();
  requestAnimationFrame(ms => refill(ms / 1000 + 0.15));
}
</script>
</body>
</html>
