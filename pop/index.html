:root { --stage: var(--bg); }

    if (hash2(floor(cell) + vMisc.z) > 0.92) s += 0.6;
  }
  vec3 v = mix(q < 0.5 ? vLo : vMi, q < 0.5 ? vMi : vHi, q < 0.5 ? 2.0 * q : 2.0 * q - 1.0) * ao;
  if (uMat == M_CANDY) v = mix(mix(oklchLin(vec3(0.68, 0.02, hue)), oklchLin(vec3(0.97, 0.015, hue)), q) * ao, v, stp);
  v += vHi * t;
  if (nf > 0.0) {
    // Thin film: colours a third or a sixth of the wheel apart.
    vec3 fc = vec3(0.0);
    float sum = 0.0;
    for (int k = 0; k < 6; k++) {
      if (float(k) >= nf) break;
      float e = pow(0.5 + 0.5 * cos(ip - float(k) * 6.2831853 / nf), 2.0);
      fc += e * (nf > 3.5 ? oklchLin(vec3(0.8, 0.17, hue + float(k) * 60.0)) : oklchLin(vec3(0.86, 0.13, hue + float(k) * 120.0)));

    }

  }
  if (uMat == M_ICE) v = mix(v, oklchLin(vec3(0.97, 0.02, hue)), mw);
  if (uMat == M_LAVA) v = mix(oklchLin(vec3(0.3, 0.015, 50.0)) * (0.35 + 0.9 * q) * ao, oklchLin(vec3(0.84, 0.2, hue)), em);
  // Reflections and hot spots stay well below full strength.
  v = mix(v, vLi, w * 0.55) + s * 0.4;
  vec3 col = enc(v * grout);
  // The press shade multiplies, darkest where the finger dents the dome.
  float sh = vMisc.x * mix(0.85, 0.35, sat(length(vLocal - vec2(0.0, 0.1 * uShR)) / (1.05 * uShR)));

const texOf = img => {
  const t = new THREE.CanvasTexture(img);
  t.flipY = false; t.premultiplyAlpha = true; t.generateMipmaps = false;
  t.minFilter = t.magFilter = THREE.LinearFilter; t.colorSpace = THREE.NoColorSpace;
  return t;
};
const jatl = document.createElement('canvas'), atlTex = texOf(atl), jatlTex = texOf(jatl);
let rects = [], jRects = new Map();
// A point light hangs over the sheet and eases toward the pointer.
const light = new THREE.Vector3(), lightT = { x: 0, y: 0 };
const lightHome = () => { lightT.x = -0.25 * W; lightT.y = -0.35 * H; };
const filmMat = tex => new THREE.ShaderMaterial({ uniforms: { map: { value: tex } }, vertexShader: FILM_VERT, fragmentShader: FILM_FRAG, ...BASE });
const domeMat = () => new THREE.ShaderMaterial({
  uniforms: { uMap: { value: null }, uMat: { value: 0 }, uLight: { value: light }, uR: { value: 40 }, uBox: { value: 1 }, uBlocks: { value: 12 }, uShR: { value: 40 }, uShade: { value: new THREE.Vector3(...oklchRgb(SHADE)) } },
  vertexShader: DOME_VERT, fragmentShader: DOME_FRAG, ...BASE,
});
const domeS = domeMat(), domeJ = domeMat();
// The material, block size and shape maps go to both dome shaders.
function domeUniforms() {
  const blocks = rec.mat === 'disco' ? 15 : 12, mi = MATS.indexOf(rec.mat);
  for (const [M, map, box, shr] of [[domeS, hexTex, SB, sR], [domeJ, flowerTex, SBJ, 2.5 * sR]]) {
    const U = M.uniforms;
    U.uMap.value = map; U.uMat.value = mi; U.uR.value = sR; U.uBox.value = box; U.uShR.value = shr; U.uBlocks.value = (box / SB) * blocks;
  }
}
const FILM_ATTR = [['aUv', 4], ['aXf', 4], ['aRa', 2]], DOME_ATTR = [['aXf', 4], ['aRa', 2], ['aLo', 3], ['aMi', 3], ['aHi', 3], ['aLi', 3], ['aMisc', 4]];
// A layer is one instanced draw: one material, many quads.
const layer = (mat, attrs) => ({ mat, attrs, n: 0, cap: 0, a: {} });
// Films first; then flat domes, then swollen domes over them.
const LAYERS = [
  layer(filmMat(atlTex), FILM_ATTR), layer(filmMat(jatlTex), FILM_ATTR),
  layer(domeS, DOME_ATTR), layer(domeJ, DOME_ATTR), layer(domeS, DOME_ATTR), layer(domeJ, DOME_ATTR),
];
// DOME[swollen][jumbo] is the layer a dome draws in.
const [filmS, filmJ] = LAYERS, DOME = [[LAYERS[2], LAYERS[3]], [LAYERS[4], LAYERS[5]]];
function growLayers(cap) {
  LAYERS.forEach((L, o) => {
    if (L.mesh && L.cap >= cap) return;
    if (L.mesh) { scene.remove(L.mesh); L.g.dispose(); }
    const g = new THREE.InstancedBufferGeometry();
    g.index = quad.index;
    g.setAttribute('position', quad.getAttribute('position'));
    g.setAttribute('uv', quad.getAttribute('uv'));
    for (const [name, n] of L.attrs) {
      const a = new THREE.InstancedBufferAttribute(new Float32Array(cap * n), n);
      a.setUsage(THREE.DynamicDrawUsage);
      g.setAttribute(name, a);
      L.a[name] = a.array;
    }
    L.g = g; L.cap = cap;
    L.mesh = new THREE.Mesh(g, L.mat);
    L.mesh.frustumCulled = false;
    L.mesh.renderOrder = o;
    scene.add(L.mesh);
  });
}
function putFilm(L, r, c, sx, sy, rot) {
  const i = L.n++, u = i * 4, A = L.a;
  A.aUv[u] = r[0]; A.aUv[u + 1] = r[1]; A.aUv[u + 2] = r[2]; A.aUv[u + 3] = r[3];
  A.aXf[u] = c.x + c.dx; A.aXf[u + 1] = c.y + c.dy; A.aXf[u + 2] = sx; A.aXf[u + 3] = sy;
  A.aRa[i * 2] = rot; A.aRa[i * 2 + 1] = 1;
}
function putDome(L, c, sb, sk, sh) {
  const i = L.n++, u = i * 4, v = i * 3, A = L.a;
  A.aXf[u] = c.x + c.dx; A.aXf[u + 1] = c.y + c.dy; A.aXf[u + 2] = sb; A.aXf[u + 3] = sb;
  A.aRa[i * 2] = 0; A.aRa[i * 2 + 1] = c.g;
  A.aLo.set(sk[0], v); A.aMi.set(sk[1], v); A.aHi.set(sk[2], v); A.aLi.set(sk[3], v);
  A.aMisc[u] = sh; A.aMisc[u + 1] = c.p; A.aMisc[u + 2] = c.seed; A.aMisc[u + 3] = sk[4];
}
// Post effect: a faint bloom on the hottest highlights.
// The sheet renders opaque on the stage colour, so the passes keep no alpha.
const composer = new EffectComposer(gl), bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.14, 0.35, 0.96);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(bloom);
composer.addPass(new ShaderPass(CopyShader));
function glSize(w, h, d) {
  gl.setPixelRatio(d);
  gl.setSize(w, h, false);
  composer.setPixelRatio(d);
  composer.setSize(w, h);
  camera.right = w; camera.bottom = h;
  camera.updateProjectionMatrix();
  light.z = 0.8 * Math.max(w, h);
}
function drawCells() {
  const k = R / sR;
  for (const L of LAYERS) L.n = 0;
  for (const c of units) {
    if (c.hid) continue;
    const sb = (c.J ? SBJ : SB) * c.s * k;
    // A jumbo film waits for its sprite; its dome never waits.
    const fr = c.J ? jRects.get(c.b) : rects[c.b];
    if (c.g < 0.999 && fr) putFilm(c.J ? filmJ : filmS, fr, c, sb * c.flip, sb, c.rot);
    if (c.g < 0.001 || !binSkin[c.b]) continue;
    // A jumbo dents less, and its shade lifts as it grows taut.
    putDome(DOME[c.s >= 1.03 ? 1 : 0][c.J ? 1 : 0], c, sb, binSkin[c.b], (c.J ? 0.45 * (1 - 0.7 * c.q) : 1) * c.p);
  }
  for (const L of LAYERS) {
    L.g.instanceCount = L.n;
    for (const [name, n] of L.attrs) {
      const a = L.g.getAttribute(name);
      a.clearUpdateRanges(); a.addUpdateRange(0, L.n * n); a.needsUpdate = true;
    }
  }
  composer.render();
}
// The wipe front's radius, or zero once it has passed.
function wipeFront() {
  if (!wipe) return 0;
  const u = (nowS() - wipe.t0) / WIPE_S;
  if (u >= 1) { wipe = null; return 0; }
  return wipe.far * Math.max(0, u);
}
function draw() {
  if (!cv.width || !sR || !LAYERS[0].mesh) return;
  drawCells();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const wf = wipeFront();
  // Outside the wipe front the old sheet still shows.
  if (wf) {
    const p = new Path2D();
    p.rect(0, 0, cv.width, cv.height);
    p.arc(dpr * wipe.x, dpr * wipe.y, dpr * wf, 0, TAU);
    ctx.save(); ctx.clip(p, 'evenodd'); ctx.drawImage(snap, 0, 0); ctx.restore();
  }
  drawBits();
  // The wipe front is a hard band in the new paint.
  if (wf) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(wipe.x, wipe.y, wf, 0, TAU);
    ctx.lineWidth = Math.max(3, R * 0.18); ctx.strokeStyle = wipe.col; ctx.stroke();
  }
  const c = ring && own(cells[fi]);
  if (c) {
    const sc = c.s, p = c.J ? jRing : ringP;
    ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * (c.x + c.dx), dpr * (c.y + c.dy));
    ctx.globalAlpha = 1;
    ctx.lineWidth = 7 / sc; ctx.strokeStyle = bgC; ctx.stroke(p);
    ctx.lineWidth = 3 / sc; ctx.strokeStyle = focusC; ctx.stroke(p);
  }
}

/* ---------- one loop, only while something moves ---------- */
let raf = 0, timer = 0, last = 0;
function wake() {
  clearTimeout(timer);
  timer = 0;
  if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(ms) {
  raf = 0;
  const dt = clamp((ms - last) / 1000, 0, 1 / 30);
  last = ms;
  const moving = step(ms / 1000, dt);
  draw();
  if (moving || events.length || wipe) { raf = requestAnimationFrame(frame); return; }
  // Idle: a timer wakes the loop for the next re-inflation.
  let next = Infinity;
  for (const c of units) if (c.state && c.due < next) next = c.due;
  if (next < Infinity) timer = setTimeout(wake, Math.max(0, (next - ms / 1000) * 1000) + 4);
  else rest();
}

/* ---------- input ---------- */
const local = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
const nowS = () => performance.now() / 1000;

cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const q = local(e), c = hit(q.x, q.y);
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  ptrs.set(e.pointerId, { x: q.x, y: q.y, sx: q.x, sy: q.y, cell: c, drag: false });
  if (c) { fi = c.i; wantX = null; }
  if (c && !c.state && !c.J) squeak();
  ring = false;
  wake();
});
cv.addEventListener('pointermove', e => {
  const q = local(e), p = ptrs.get(e.pointerId);
  if (e.pointerType !== 'touch') { hover = q; hoverCell = hit(q.x, q.y); }
  lightT.x = q.x; lightT.y = q.y;
  if (p) {
    // Past a small slop, a press becomes a sweep that pops everything.
    if (!p.drag && Math.hypot(q.x - p.sx, q.y - p.sy) > R * 0.45) {
      p.drag = true;
      pop(p.cell, nowS(), 1);
      sweep(p.sx, p.sy, q.x, q.y, nowS());
    } else if (p.drag) sweep(p.x, p.y, q.x, q.y, nowS());
    p.x = q.x; p.y = q.y;
  }
  wake();
});
function release(e, ok) {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  ptrs.delete(e.pointerId);
  // A longer squeeze pops harder.
  if (ok && !p.drag && p.cell) { const q = local(e); if (hit(q.x, q.y) === p.cell) pop(p.cell, nowS(), 0.6 + 0.9 * p.cell.q); }
  wake();
}
cv.addEventListener('pointerup', e => release(e, true));
cv.addEventListener('pointercancel', e => release(e, false));
cv.addEventListener('pointerleave', e => {
  if (e.pointerType === 'touch') return;
  hover = null; hoverCell = null;
  lightHome();
  wake();
});

// A move repeats until it leaves a jumbo or meets the edge.
function move(key) {
  const from = own(cells[fi]);
  for (let n = 0; n < 3; n++) { const was = fi; move1(key); if (fi === was || own(cells[fi]) !== from) break; }
}
// Up and down keep a remembered x, so columns zigzag straight.
function move1(key) {
  const c = cells[fi];
  if (key === 'ArrowLeft' || key === 'ArrowRight') {
    fi = c.row * cols + clamp(c.col + (key === 'ArrowLeft' ? -1 : 1), 0, cols - 1);
    wantX = null;
    return;
  }
  const row = clamp(c.row + (key === 'ArrowUp' ? -1 : 1), 0, rows - 1);
  if (row === c.row) return;
  if (wantX == null) wantX = c.x;
  let best = 0, bd = Infinity;
  for (let j = 0; j < cols; j++) { const d = Math.abs(cells[row * cols + j].x - wantX); if (d < bd - 0.5) { bd = d; best = j; } }
  fi = row * cols + best;
}
cv.addEventListener('focus', () => { ring = cv.matches(':focus-visible'); wake(); });
cv.addEventListener('blur', () => { ring = false; kPress = null; wake(); });
cv.addEventListener('keydown', e => {
  if (!cells.length) return;
  if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    kPress = null;
    move(e.key);
    ring = true;
    wake();
  } else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    ring = true;
    if (!e.repeat) { kPress = own(cells[fi]); if (!kPress.state && !kPress.J) squeak(); }
    wake();
  }
});
cv.addEventListener('keyup', e => {
  if ((e.key === ' ' || e.key === 'Enter') && kPress) { pop(kPress, nowS(), 0.6 + 0.9 * kPress.q); kPress = null; wake(); }
});
act.reset = () => { if (cells.length) refill(nowS()); };

/* ---------- theme and size ---------- */
function retheme() { tokens(); if (sR) buildSprites(); draw(); }
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
tokens();
layout();
new ResizeObserver(layout).observe(field);
// A new quality changes the pixel ratio; the sheet stays.
onQuality(() => layout());
// Scrolling moves the field under a still mouse, so hover lets go.
addEventListener('scroll', () => { if (hover) { hover = null; hoverCell = null; wake(); } }, { passive: true });

// On arrival the sheet lies flat, then inflates from the centre.
if (!reduce) {
  for (const c of units) { c.state = 1; c.g = 0; c.s = 0.9; }
  draw();
  requestAnimationFrame(ms => refill(ms / 1000 + 0.15));
}
