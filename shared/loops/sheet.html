<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Loops</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --dim: oklch(0.68 0.015 275);
  --line: oklch(0.3 0.015 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
html, body { background: var(--bg); }
body { margin: 0; color: var(--fg); font: 500 14px/1.35 var(--sans); padding: 20px max(16px, env(safe-area-inset-left, 0px)) 48px; -webkit-font-smoothing: antialiased; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; margin-bottom: 20px; }
h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.count { color: var(--dim); }
.views { display: flex; gap: 4px; margin-left: auto; }
.views button { font: inherit; color: var(--dim); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.views button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px 16px; }
li { display: grid; gap: 8px; }
.frame { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: #000; }
video, img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
img { opacity: 0; transition: opacity 0.2s; }
/* The menu's tube shows the middle circle, 80% of the width, with a soft edge. */
body[data-view="tube"] .frame { -webkit-mask: radial-gradient(circle closest-side, #000 70%, transparent 100%); mask: radial-gradient(circle closest-side, #000 70%, transparent 100%); background: none; }
body[data-view="tube"] .frame::after { content: ""; position: absolute; inset: 10%; border-radius: 50%; box-shadow: 0 0 0 1px oklch(1 0 0 / 0.18) inset; pointer-events: none; }
/* Still: the still shows, so a jump from still to loop is easy to spot. */
body[data-view="still"] img { opacity: 1; }
.meta { display: flex; justify-content: space-between; gap: 8px; }
.name { font-weight: 700; }
.num { color: var(--dim); font-variant-numeric: tabular-nums; }
.missing .frame::before { content: "no loop"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); }
</style>
</head>
<body data-view="tube">
<header>
  <h1>Loops</h1>
  <span class="count"></span>
  <div class="views" role="group" aria-label="View">
    <button type="button" data-view="tube" aria-pressed="true">Tube circle</button>
    <button type="button" data-view="square" aria-pressed="false">Full square</button>
    <button type="button" data-view="still" aria-pressed="false">Still</button>
  </div>
</header>
<ol></ol>
<script type="module">
// The sheet lists every loop in index.json, in shelf order.
const list = document.querySelector('ol'), count = document.querySelector('.count');
const [ids, toys] = await Promise.all([
  fetch('index.json', { cache: 'no-store' }).then(r => r.json()),
  fetch('../../toys.json').then(r => r.json()).catch(() => ({})),
]);
// The query parameter breaks the cache, so a new capture shows at once.
const v = Date.now();
for (const id of ids) {
  const li = document.createElement('li');
  li.innerHTML = `<div class="frame"><video muted loop playsinline preload="metadata"></video><img alt=""></div>
    <div class="meta"><span class="name"></span><span class="num"></span></div>`;
  const video = li.querySelector('video');
  video.src = `${id}.mp4?v=${v}`;
  li.querySelector('img').src = `../stills/${id}.webp?v=${v}`;
  li.querySelector('.name').textContent = toys[id]?.name ?? id;
  li.querySelector('.num').textContent = id;
  video.addEventListener('loadedmetadata', () => { li.querySelector('.num').textContent = `${id} · ${video.duration.toFixed(0)} s`; });
  video.addEventListener('error', () => li.classList.add('missing'));
  list.append(li);
}
count.textContent = `${ids.length} toys`;
// Only the loops on screen play.
const seen = new IntersectionObserver(rows => {
  for (const r of rows) r.isIntersecting ? r.target.play().catch(() => {}) : r.target.pause();
}, { rootMargin: '200px' });
document.querySelectorAll('video').forEach(el => seen.observe(el));
// The view buttons switch the frame.
document.querySelector('.views').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  document.body.dataset.view = b.dataset.view;
  for (const x of document.querySelectorAll('.views button')) x.setAttribute('aria-pressed', String(x === b));
});
</script>
</body>
</html>
