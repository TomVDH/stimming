  P[1].a = rnd(0.6, 0.9);

  startLayer(-1);
  quiet = true;
  for (let i = 0; i < 5000 && drawing; i++) step(1 / 60, true);
  inkUp();
  quiet = false;
  P.forEach(p => { p.a = 0; });
  rot.a = 0;
  drawing = false;
  pen.touch = false;
  pen.lift = 1;
  penAt(q);
  pen.x = q.x;
  pen.y = q.y;
}

/* ---------- start ---------- */
function failed() {
  ready = false;
  canvas.hidden = true;
  panel.querySelector('.fail').hidden = false;
  [...chips, sheetB].forEach(b => { b.disabled = true; });
}
async function boot() {
  await idle();
  try { ctx = canvas.getContext('2d', { alpha: false }); } catch (err) { ctx = null; }
  if (!ctx || typeof ctx.roundRect !== 'function') return failed();
  if (!fit()) {
    W = 1160; H = 652; pr = 1;
    canvas.width = W; canvas.height = H;
    layout();
    bgC = makeDesk(); paperTex = makePaper(); shadowC = makeShadow();
    sheet = makeSheet(); sheetG = sheet.g;
    wetC = mk(paperTex.width, paperTex.height); wetG = wetC.getContext('2d'); wetG.setTransform(1, 0, 0, 1, 0, 0);
  }
  ready = true;
  if (reduce) predraw();
  draw();
  requestAnimationFrame(() => canvas.classList.add('on'));
  let fitT = 0;
  new ResizeObserver(() => { clearTimeout(fitT); fitT = setTimeout(() => { if (fit()) wake(); }, 80); }).observe(panel);
  if (!reduce) setTimeout(randomSwing, 700);
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
