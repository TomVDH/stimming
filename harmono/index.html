  <main>

<script type="module">

  [[0.7, 0.21, 302], [0.62, 0.21, 272], [0.74, 0.23, 336]],
  [[0.76, 0.17, 32], [0.7, 0.2, 14], [0.83, 0.16, 64]],
  [[0.86, 0.15, 168], [0.8, 0.13, 212], [0.9, 0.19, 145]],
  [[0.96, 0.02, 260], [0.88, 0.05, 250], [0.97, 0.05, 85]],

    base, hot: mix(base, WHITE, 0.6),
    glow: (i, a) => glow[i] + a.toFixed(3) + ')',

/* ---------- sound: synthesised, started by the first gesture ---------- */
const SKEY = 'stimming.harmono.sound', MAXV = 16, LEAD = 0.004;
let soundOn = true;

// A context still waking queues sounds for a moment.

}

  bp.Q.value = q;

}

// A short sine with an optional glide.

  glowDot(g, bx, bY, (30 + 18 * hot + 12 * sp) * s, c, 0.6 + 0.35 * hot);
  g.fillStyle = col(hc, 0.9 + 0.1 * hot);
  g.beginPath(); g.arc(bx, bY, (4.2 + 2 * hot) * s, 0, TAU); g.fill();
  g.fillStyle = col(c, 0.5);
  g.beginPath(); g.arc(Q.px, Q.py, 2 * s, 0, TAU); g.fill();
}
// The pen touching down sends out one ring of light.
function drawFlash(g) {
  if (!flash) return;
  const [x, y] = toScreen(flash.x, flash.y), t = flash.t, e = reduce ? 0.3 : easeOut(t), s = L.k, c = hcol();
  glowDot(g, x, y, (26 + 16 * e) * s, c, 0.5 * (1 - t) ** 2);
  g.strokeStyle = col(mix(c, WHITE, 0.4), 0.5 * (1 - t) ** 2);
  g.lineWidth = (1.6 * (1 - t) + 0.4) * s;
  g.beginPath(); g.arc(x, y, (5 + 32 * e) * s, 0, TAU); g.stroke();
}
// The pen is a point of light; a lifted pen dims to a ring.
function drawPen(g) {
  const [x, y] = toScreen(pen.x, pen.y), s = L.k, on = 1 - pen.lift, c = hcol(), w = slowness(pen.sp);
  glowDot(g, x, y, (10 + 22 * on * (0.45 + 0.55 * w)) * s, c, 0.22 + 0.5 * on);
  if (pen.lift > 0.02) {
    g.strokeStyle = col(c, 0.4 * pen.lift);
    g.lineWidth = 1;
    g.beginPath(); g.arc(x, y, 6 * s, 0, TAU); g.stroke();
  }
  g.fillStyle = col(mix(c, WHITE, 0.7), 0.55 + 0.45 * on);
  g.beginPath(); g.arc(x, y, (1.5 + 1.3 * on) * s, 0, TAU); g.fill();
}

/* ---------- one loop, only while something moves ---------- */
let raf = 0, last = 0, onScreen = true, slow = 0;
function wake() {
  if (!raf && ready && onScreen && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(ms) {
  raf = 0;
  const raw = Math.max(0, (ms - last) / 1000), dt = Math.min(raw, 1 / 30);
  last = ms;
  // Sustained slow frames drop the pixel ratio to 1.
  if (!lowDpr) {
    slow = raw > 0.03 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 20) { lowDpr = true; fit(); }
  }
  const busy = step(dt);
  draw();
  voice(dt, pen.touch);
  if (busy && onScreen && !document.hidden) raf = requestAnimationFrame(frame);
  else rest();
}

/* ---------- input ---------- */
let rect = null;
addEventListener('scroll', () => { rect = null; }, { passive: true });
function local(e) {
  const r = rect || (rect = panel.getBoundingClientRect());
  return [e.clientX - r.left, e.clientY - r.top];
}
// A point grabs a dot near it or anywhere in its edge band.
function hitBob(x, y) {
  for (let k = 0; k < 2; k++) {
    const Q = L.pend[k], ang = pos(P[k]) * Q.th, by = Q.len * (0.74 + 0.26 * P[k].bob);
    const bx = Q.px + Math.sin(ang) * by, byy = Q.py + Math.cos(ang) * by;
    if (Math.hypot(x - bx, y - byy) < Math.max(36, 30 * L.k)) return k;
  }
  if (y < L.pend[0].py - 10) return -1;
  const band = L.sw * (L.port ? 1.3 : 1.1);
  if (x < band) return 0;
  if (x > W - band) return 1;
  return -1;
}
function aimAt(k, x, y) {
  const Q = L.pend[k], p = P[k];
  const a = Math.atan2(x - Q.px, Math.max(8, y - Q.py)) / Q.th;
  return clamp(a + p.off, -1.1, 1.1);
}
function hover(k) {
  if (k === hov) return;
  hov = k;
  wake();
}
const grabs = new Map();
panel.addEventListener('pointerdown', e => {
  if (!ready || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const [x, y] = local(e);
  const k = hitBob(x, y);
  endAuto();
  if (k < 0 || P[k].held) return;
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  grabs.set(e.pointerId, k);
  grab(k);
  const Q = L.pend[k];
  P[k].off = 0;
  P[k].off = P[k].hp - clamp(Math.atan2(x - Q.px, Math.max(8, y - Q.py)) / Q.th, -1.1, 1.1);
  P[k].tgt = aimAt(k, x, y);
  panel.style.cursor = 'grabbing';
  wake();
});
panel.addEventListener('pointermove', e => {
  const k = grabs.get(e.pointerId);
  if (k === undefined) {
    if (e.pointerType === 'mouse' && ready && !grabs.size) {
      const [x, y] = local(e), h = hitBob(x, y);
      panel.style.cursor = h >= 0 ? 'grab' : '';
      hover(h);
    }
    return;
  }
  const [x, y] = local(e);
  P[k].tgt = aimAt(k, x, y);
  wake();
});
panel.addEventListener('pointerleave', () => { if (!grabs.size) hover(-1); });
const lift = e => {
  const k = grabs.get(e.pointerId);
  if (k === undefined) return;
  grabs.delete(e.pointerId);
  letGo(k, e.type === 'pointerup');
  panel.style.cursor = grabs.size ? 'grabbing' : 'grab';
  wake();
};
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => panel.addEventListener(t, lift));
panel.addEventListener('contextmenu', e => e.preventDefault());
// Arrow keys pull the dots; the pen follows the arrow.
const ARROWS = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [1, 1], ArrowDown: [1, -1] };
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const key = e.key;
  if (key === ' ') {
    // Buttons and links keep Space for themselves.
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (!e.repeat) randomSwing();
  } else if (key === 'c' || key === 'C' || key === 'n' || key === 'N') {
    if (!e.repeat) clearSheet();
  } else if (ARROWS[key]) {
    e.preventDefault();
    if (e.repeat || !ready) return;
    endAuto();
    const [k, d] = ARROWS[key], p = P[k];
    if (p.held && !p.key) return;
    if (!p.held) grab(k);
    p.key = d;
    wake();
  }
});
addEventListener('keyup', e => {
  const a = ARROWS[e.key];
  if (a && P[a[0]].key === a[1]) { letGo(a[0], false); wake(); }
});
addEventListener('blur', () => { P.forEach((p, k) => { if (p.key) letGo(k, false); }); wake(); });

const chips = [...document.querySelectorAll('[data-ink]')];
chips.forEach(c => c.addEventListener('click', () => setInk(+c.dataset.ink)));
const sheetB = document.getElementById('sheet');
sheetB.addEventListener('click', clearSheet);
const sndB = document.getElementById('snd');
const showSound = () => sndB.setAttribute('aria-pressed', String(soundOn));
showSound();
sndB.addEventListener('click', () => {
  soundOn = !soundOn;
  showSound();
  try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (err) { /* storage is optional */ }
  if (soundOn) audio();
  else if (ac) { hush(); ac.suspend()?.catch(() => {}); }
});
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(panel);
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

/* ---------- sizing ---------- */
function build() {
  layout();
  bgC = makeBg();
  sheet = makeSheet();
  sheetG = sheet.g;
  makeBloom();
  dirty = true;
}
function fit() {
  const w = panel.clientWidth, h = panel.clientHeight;
  if (!w || !h) return false;
  const npr = Math.min(devicePixelRatio || 1, lowDpr ? 1 : 2, Math.sqrt(1.4e6 / (w * h)));
  if (w === W && h === H && npr === pr && bgC) return true;
  W = w;
  H = h;
  pr = npr;
  canvas.width = Math.round(w * pr);
  canvas.height = Math.round(h * pr);
  rect = null;
  inkUp();
  fade = null;
  build();
  replay();
  pen.touch = false;
  if (ready) draw();
  return true;
}
// Reduced motion starts with a finished figure instead of a live one.
function predraw() {
  newRatio();
  P[0].a = rnd(0.65, 0.9);
  P[0].ph = Math.PI / 2;
  P[1].a = rnd(0.6, 0.9);
  P[1].ph = Math.PI / 2 + rnd(0.4, 1.3);
  startLayer(-1);
  quiet = true;
  for (let i = 0; i < 5000 && drawing; i++) step(1 / 60, true);
  inkUp();
  quiet = false;
  P.forEach(p => { p.a = 0; });
  rot.a = 0;
  drawing = false;
  pen.touch = false;
  pen.lift = 1;
  penAt(q);
  pen.x = q.x;
  pen.y = q.y;
  trail.length = 0;
  tr0 = 0;
}

/* ---------- start ---------- */
function failed() {
  ready = false;
  canvas.hidden = true;
  panel.querySelector('.fail').hidden = false;
  [...chips, sheetB].forEach(b => { b.disabled = true; });
}
async function boot() {
  await idle();
  try { ctx = canvas.getContext('2d', { alpha: false }); } catch (err) { ctx = null; }
  if (!ctx) return failed();
  if (!fit()) {
    W = 1160; H = 652; pr = 1;
    canvas.width = W; canvas.height = H;
    build();
  }
  ready = true;
  if (reduce) predraw();
  draw();
  requestAnimationFrame(() => canvas.classList.add('on'));
  let fitT = 0;
  new ResizeObserver(() => { clearTimeout(fitT); fitT = setTimeout(() => { if (fit()) wake(); }, 80); }).observe(panel);
  if (!reduce) setTimeout(randomSwing, 700);
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
</body>
</html>
