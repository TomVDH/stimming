<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.05 0.01 230); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glowworm cave</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./cave.js">
<link rel="modulepreload" href="./shaders.js">
<link rel="modulepreload" href="./render.js">
<link rel="modulepreload" href="./sound.js">
<link rel="modulepreload" href="../shared/gl.js">
<link rel="modulepreload" href="../shared/glow.js">
<link rel="modulepreload" href="../shared/output.js">
<link rel="modulepreload" href="../shared/detail.js">
<style>
/* Glowworm cave: blue points on a cave roof, doubled in still water. */
:root { --stage: oklch(0.05 0.01 230); }
.stage--glowworm { background: var(--stage); cursor: crosshair; }
.stage--glowworm canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--glowworm canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--glowworm canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Glowworm cave</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--glowworm" id="stage" tabindex="0" role="application" aria-label="From a small boat on a still underground river you look up at a limestone cave roof. Thousands of glowworms shine on it as blue-green points, each with fine threads of silk hanging below it, and the black water doubles every point. Tap the water to dip a hand: rings spread and the doubled lights shiver. Tap the roof to let a drop fall. Drag, or press the arrow keys, to look round. Any sound dims the nearest worms for a moment.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Glowworm cave</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
