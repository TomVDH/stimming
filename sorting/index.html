<style>
/* Sorting sounds: a row of rods sorts itself, each step a tone. */
:root { --stage: oklch(0.07 0.01 285); }
.stage--sorting { background: var(--stage); cursor: pointer; }
.stage--sorting canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--sorting canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--sorting canvas { transition: none; } }
</style>

<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Sorting sounds</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--sorting" id="stage" tabindex="0" role="application" aria-label="A dark stage with a row of glowing glass rods of many heights on a black glass floor. Pick an algorithm and the rods sort themselves, shortest to tallest; each compare and each move lights the rods and rings their notes; a short rod sounds low and a tall rod high. When the row is sorted, a light runs along it and plays the rising scale. Tap to sort or pause, drag across the rods to play them. Press Space to sort, S to shuffle, and 1 to 6 to pick an algorithm.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Sorting sounds</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
