<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Range lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..800&display=swap">
<style>
/* Range lab: shape the railgun's far ranges, then copy the config into ranges.js. */
:root { --bg: oklch(0.13 0.01 260); --panel: oklch(0.16 0.012 260); --ink: oklch(0.93 0.01 260); --muted: oklch(0.66 0.015 260); --line: oklch(0.28 0.015 260); --acc: oklch(0.8 0.12 75); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.35 Gabarito, system-ui, sans-serif; }
body { display: grid; grid-template-columns: minmax(0, 1fr) 310px; min-height: 100vh; }
main { padding: 12px 16px 24px; display: grid; gap: 14px; align-content: start; min-width: 0; }
aside { border-left: 1px solid var(--line); position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--panel); }
.top { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
h1 { font-size: 16px; margin: 0; }
h2 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600; }
h3 { font-size: 11px; color: var(--muted); margin: 10px 0 2px; font-weight: 600; }
details { border-bottom: 1px solid var(--line); padding: 8px 14px; }
details > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; padding: 2px 0; }
details > summary::after { content: '+'; color: var(--muted); }
details[open] > summary::after { content: '\2212'; }
details > summary::-webkit-details-marker { display: none; }
.row { display: grid; grid-template-columns: 84px 1fr 52px; align-items: center; gap: 8px; margin: 3px 0; }
.row span { color: var(--muted); }
.row output { text-align: right; font-variant-numeric: tabular-nums; }
.row.off { opacity: 0.4; }
.check { display: flex; align-items: center; gap: 8px; color: var(--muted); margin: 4px 0; }
input[type=range] { width: 100%; accent-color: var(--acc); }
input[type=checkbox] { accent-color: var(--acc); }
input[type=text], select { font: inherit; color: var(--ink); background: oklch(0.2 0.012 260); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; width: 100%; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
button { font: inherit; color: var(--ink); background: oklch(0.21 0.012 260); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--acc); }
button:disabled { opacity: 0.4; cursor: default; }
button.on { border-color: var(--acc); color: var(--acc); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
#status { color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
#status.err { color: oklch(0.7 0.17 25); white-space: pre-wrap; }
p.note { color: var(--muted); margin: 4px 0; }
.list { display: grid; gap: 1px; margin: 4px 0; }
.list button { display: grid; grid-template-columns: 14px 1fr auto; gap: 6px; align-items: center; text-align: left; background: none; border: 1px solid transparent; padding: 3px 6px; font-variant-numeric: tabular-nums; }
.list button.sel { border-color: var(--acc); background: oklch(0.21 0.012 260); }
.list i { width: 10px; height: 10px; border-radius: 2px; }
.list small { color: var(--muted); }
.stack { position: relative; width: 100%; }
.stack canvas { display: block; width: 100%; height: 100%; }
.stack canvas.over { position: absolute; inset: 0; pointer-events: none; }
#gun { aspect-ratio: 16 / 9; }
#gun.phone { aspect-ratio: 9 / 19.5; max-height: 78vh; width: auto; margin: 0 auto; }
#pano { aspect-ratio: 1000 / 220; }
#map { aspect-ratio: 1; touch-action: none; cursor: default; }
.pair { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.hint { color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; min-height: 1.4em; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
kbd { font: 11px Gabarito, sans-serif; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
@media (max-width: 960px) { body { grid-template-columns: 1fr; } aside { position: static; height: auto; border-left: 0; border-top: 1px solid var(--line); } .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <section>
    <div class="head"><h2>The gun's eye</h2><div class="seg" id="lens"><button type="button" data-lens="wide" class="on">Landscape</button><button type="button" data-lens="phone">Phone</button></div></div>
    <div class="stack" id="gun"><canvas class="gl"></canvas><canvas class="over"></canvas></div>
  </section>
  <div class="pair">
    <section>
      <div class="head"><h2>Map: drag to shape</h2></div>
      <div class="stack" id="map"><canvas class="gl"></canvas><canvas class="over"></canvas></div>
      <div class="hint" id="maphint"><kbd>drag</kbd> a dot to move · <kbd>drag</kbd> its ring to turn · <kbd>scroll</kbd> on a dot for height, <kbd>shift</kbd> for size</div>
    </section>
    <section>
      <div class="head"><h2>Skyline: elevation stretched</h2></div>
      <div class="stack" id="pano"><canvas class="gl"></canvas><canvas class="over"></canvas></div>
      <div class="hint" id="hover"></div>
    </section>
  </div>
</main>
<aside>
  <div class="top">
    <div class="head"><h1>Range lab</h1><div class="btns" style="margin:0"><button id="undo" type="button" title="Undo (Cmd Z)">Undo</button><button id="redo" type="button" title="Redo (Shift Cmd Z)">Redo</button></div></div>
    <div id="status">Loading</div>
    <div class="btns"><button id="copy" type="button" title="The ranges and the landscape knobs, as JS for ranges.js">Copy config</button><button id="reload" type="button" title="Re-import ranges.js (R)">Reload ranges.js</button></div>
  </div>
  <details open id="sec-ranges">
    <summary><h2>Ranges</h2></summary>
    <p class="note" id="source"></p>
    <div class="list" id="list"></div>
    <div class="row"><span>Add</span><select id="addform"></select><button id="add" type="button">Add</button></div>
    <h3>Generate</h3>
    <div class="row"><span>Seed</span><input id="seed" type="text" value="1" spellcheck="false"><button id="next" type="button" title="Next seed (N)">Next</button></div>
    <div class="btns"><button id="generate" type="button" title="A new table from the seed (G)">Generate</button><button id="reset" type="button" title="The table and knobs in ranges.js">Reset to ranges.js</button></div>
  </details>
  <details open id="sec-sel">
    <summary><h2 id="seltitle">Selected range</h2></summary>
    <div id="sel"></div>
  </details>
  <div id="land"></div>
  <details id="sec-view">
    <summary><h2>View</h2></summary>
    <div class="row"><span>Sun</span><input data-view="sun" type="range" min="1" max="60" step="1" value="10"><output></output></div>
    <div class="row"><span>Haze</span><input data-view="haze" type="range" min="0" max="2" step="0.05" value="1"><output></output></div>
    <div class="row"><span>Skyline x</span><input data-view="vex" type="range" min="1" max="8" step="0.5" value="4"><output></output></div>
    <label class="check"><input data-view="tint" type="checkbox"> Colour the gun's eye by range</label>
    <h3>Toy Dev rows</h3>
    <div class="row"><span>Erosion</span><input data-view="ero" type="range" min="0" max="2" step="0.05" value="1"><output></output></div>
    <label class="check"><input data-view="forms" type="checkbox" checked> Forms (off: all crescents)</label>
  </details>
</aside>
<script type="module">
import { program, linked, TRI_VS } from '../shared/gl.js';

/* ---------- constants ---------- */
const PLANET_R = 6.0e6;
// The toy's two lenses: eye, yaw, vertical field, horizon height on screen.
const LENS = {
  wide: { eye: [1670, 30, 1990], yaw: 24.5, fov: 55, horizon: 0.84 },
  phone: { eye: [800, 22, 3000], yaw: 8.5, fov: 74, horizon: 0.8 },
};
// The skyline's bearings, left to right; its lowest elevation, in degrees.
const B_LEFT = 75, B_RIGHT = -25, E_LOW = -0.6;
// The views' bearing windows, left edge first.
const VIEWS = [{ name: 'landscape', l: 67, r: -18, c: 'oklch(0.85 0.12 75)' }, { name: 'portrait', l: 29, r: -12, c: 'oklch(0.8 0.1 200)' }];
// The march's ceiling: no crest may pass it after the height knob.
const CREST_MAX = 46000;
const FORMS = ['crescent', 'mesa', 'cone', 'knife', 'spires', 'slabs'];
// A cone and a spire field are round; the rest lie on an arc.
const radialForm = f => f === 2 || f === 4;
// The map's fixed box about the eye, in metres: x left and right, z ahead and behind.
const MAP_BOX = [-270000, -330000, 110000, 50000];
const HUES = [25, 60, 95, 140, 185, 225, 265, 305, 340, 0, 120, 200];
const col = i => { const h = HUES[i % HUES.length] * Math.PI / 180; return [0.62 + 0.3 * Math.cos(h), 0.62 + 0.3 * Math.cos(h - 2.1), 0.62 + 0.3 * Math.cos(h + 2.1)]; };
const css = (c, a = 1) => `rgb(${c.map(v => Math.round(v * 255)).join(' ')} / ${a})`;
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
// An angle in degrees, wrapped to -180 to 180.
const wrap = d => ((d + 180) % 360 + 360) % 360 - 180;
const $ = s => document.querySelector(s);
const STORE = 'stimming.rangelab';

// OKLCH to linear sRGB, clamped.
function oklchLin([L, C, h]) {
  const a = C * Math.cos(rad(h)), b = C * Math.sin(rad(h));
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3, m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3, s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s].map(v => Math.max(0, v));
}
const SLOPE = oklchLin([0.43, 0.035, 48]), WALL = oklchLin([0.37, 0.045, 32]), GROUND = oklchLin([0.52, 0.035, 65]);

/* ---------- state ---------- */
// R: the module. ranges: the edit model, one object per range.
// A range: form, the arc's middle (bearing mb, distance md), radius rc, crest, span, facing.
// Facing 0 bulges the arc toward the gun; a round form ignores it.
let R = null, N = 12, ranges = [], land = {}, sel = -1, version = 0;
const view = { sun: 10, haze: 1, vex: 4, tint: 0, ero: 1, forms: 1, lens: 'wide', seed: '1' };
const past = [], future = [];

/* ---------- model <-> table ---------- */
const EYE = () => R.EYE;
const bearingOf = (x, z) => deg(Math.atan2(EYE()[0] - x, EYE()[1] - z));
const distOf = (x, z) => Math.hypot(x - EYE()[0], z - EYE()[1]);
// The arc's middle point, the direction from the centre to it, and the centre.
function frame(g) {
  const [mx, mz] = R.polar(rad(g.mb), g.md);
  const toEye = Math.atan2(EYE()[1] - mz, EYE()[0] - mx), a = toEye + rad(g.face);
  return { mx, mz, a, cx: radialForm(g.form) ? mx : mx - g.rc * Math.cos(a), cz: radialForm(g.form) ? mz : mz - g.rc * Math.sin(a) };
}
function toRow(g) {
  // A centre on the eye has no bearing; it reads 0.
  const f = frame(g), cd = distOf(f.cx, f.cz), row = [cd < 1 ? 0 : bearingOf(f.cx, f.cz), cd, g.rc, g.crest, radialForm(g.form) ? 0 : g.span, radialForm(g.form) ? 0 : ((deg(f.a) - 180) % 360 + 360) % 360];
  if (g.form) row.push(g.form);
  return row;
}
function fromRow(m) {
  const form = m[6] || 0, [cx, cz] = R.polar(rad(m[0]), m[1]);
  if (radialForm(form)) return { form, mb: m[0], md: m[1], rc: m[2], crest: m[3], span: 120, face: 0 };
  const a = rad(m[5] + 180), mx = cx + m[2] * Math.cos(a), mz = cz + m[2] * Math.sin(a);
  const toEye = Math.atan2(EYE()[1] - mz, EYE()[0] - mx);
  const face = ((deg(a - toEye) + 180) % 360 + 360) % 360 - 180;
  return { form, mb: bearingOf(mx, mz), md: distOf(mx, mz), rc: m[2], crest: m[3], span: m[4], face };
}
const table = () => ranges.map(toRow);

/* ---------- history and storage ---------- */
const snap = () => JSON.stringify({ ranges, land });
function commit() {
  const s = snap();
  if (past[past.length - 1] !== s) { past.push(s); if (past.length > 200) past.shift(); future.length = 0; }
  save(); buttons();
}
function restore(s) { const o = JSON.parse(s); ranges = o.ranges; land = o.land; sel = Math.min(sel, ranges.length - 1); buildLand(); changed(); save(); buttons(); }
function undo() { if (past.length < 2) return; future.push(past.pop()); restore(past[past.length - 1]); }
function redo() { if (!future.length) return; const s = future.pop(); past.push(s); restore(s); }
function buttons() { $('#undo').disabled = past.length < 2; $('#redo').disabled = !future.length; $('#add').disabled = ranges.length >= N; }
function save() { try { localStorage.setItem(STORE, JSON.stringify({ ranges, land, view })); } catch { /* storage is optional */ } }
function loadSaved() { try { return JSON.parse(localStorage.getItem(STORE)); } catch { return null; } }

/* ---------- GLSL ---------- */
const COMMON = () => `
uniform vec3 uEye, uSun;
uniform float uTint;
uniform vec3 uCol[${N}];
const float PLANET_R = ${PLANET_R.toFixed(1)};
float drop(vec3 p) { vec2 d = p.xz - uEye.xz; return dot(d, d) / (2.0 * PLANET_R); }
// The bake's own stride: fine, so thin teeth stay solid.
float march(vec3 ro, vec3 rd) {
  float t = 2000.0, tp = t;
  for (int i = 0; i < 900; i++) {
    vec3 p = ro + rd * t;
    float nr, hh = farHN(p.xz, nr), dy = p.y - (hh - drop(p));
    if (dy < 0.0) {
      float a = tp, b = t;
      for (int k = 0; k < 8; k++) { float m = 0.5 * (a + b); vec3 q = ro + rd * m; if (q.y - (farH(q.xz) - drop(q)) < 0.0) b = m; else a = m; }
      return b;
    }
    if (p.y + drop(p) > 50000.0 && rd.y + t * dot(rd.xz, rd.xz) / PLANET_R > 0.0) break;
    tp = t;
    t += nr > 0.5 ? clamp(0.3 * dy, 0.0005 * t, dy < 0.05 * t ? 0.003 * t : 0.01 * t) : max(0.45 * dy, 0.03 * t);
    if (t > 650000.0) break;
  }
  return -1.0;
}
vec3 normalAt(vec2 p, float e) {
  return normalize(vec3(farH(p - vec2(e, 0.0)) - farH(p + vec2(e, 0.0)), 2.0 * e, farH(p - vec2(0.0, e)) - farH(p + vec2(0.0, e))));
}
// The range a point belongs to: the band it sits deepest in; an estimate where ranges blend.
int rangeAt(vec2 p) {
  int best = -1;
  float bs = 1e9;
  for (int i = 0; i < ${N}; i++) {
    if (uRg[i].w < 1.0) continue;
    bool radial = abs(uRa[i].w - 2.0) < 0.5 || abs(uRa[i].w - 4.0) < 0.5;
    if (uForms < 0.5 && radial) continue;
    vec2 q = p - uRg[i].xy;
    float r = length(q), Rc = uRg[i].z, s;
    if (radial) s = r / Rc;
    else {
      float u = mod(atan(q.y, q.x) - uRa[i].x, 6.2831853) / uRa[i].y;
      if (u > 1.0) continue;
      s = abs(r - Rc) / (0.4 * Rc);
    }
    if (s < bs && s < 1.2) { bs = s; best = i; }
  }
  return best;
}
vec3 tintAt(vec2 p) {
  int i = rangeAt(p);
  vec3 c = vec3(0.7);
  for (int k = 0; k < ${N}; k++) if (k == i) c = uCol[k];
  return c;
}
// A short march toward the sun: the crests shade the valleys.
float shadowAt(vec3 P, vec3 L) {
  float sh = 1.0, sd = 300.0;
  for (int j = 0; j < 9; j++) { vec3 q = P + L * sd; sh = min(sh, clamp(3.0 * (q.y - farH(q.xz)) / sd + 0.5, 0.0, 1.0)); sd *= 1.7; }
  return sh;
}`;
const HEAD = () => `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;
${R.K2_BASE}
${R.RANGE_GLSL}
${COMMON()}`;
// The gun's eye: the toy's lens, rock colours, a sand plain and simple air.
const GUN_FS = () => `${HEAD()}
uniform mat3 uRot;
uniform vec2 uTan;
uniform vec3 uSlope, uWall, uGround;
uniform float uHaze;
vec3 skyOf(vec3 rd, vec3 L, vec3 sunC) {
  float up = clamp(rd.y, 0.0, 1.0), mu = max(dot(rd, L), 0.0);
  vec3 zen = vec3(0.10, 0.20, 0.45), hor = mix(vec3(0.75, 0.62, 0.52), vec3(0.62, 0.70, 0.80), smoothstep(0.05, 0.4, L.y));
  return mix(hor, zen, pow(up, 0.45)) + sunC * (0.25 * pow(mu, 8.0) + 3.0 * pow(mu, 900.0));
}
// The air between the eye and a point: Rayleigh and a dusty Mie.
vec3 airOf(vec3 c, vec3 ro, float t, float y, vec3 inL) {
  float hR = 8000.0, hM = 3000.0, yc = ro.y, dy = y - yc;
  float aR = abs(dy) < 1.0 ? exp(-yc / hR) : (exp(-yc / hR) - exp(-y / hR)) * hR / dy;
  float aM = abs(dy) < 1.0 ? exp(-yc / hM) : (exp(-yc / hM) - exp(-y / hM)) * hM / dy;
  vec3 T = exp(-(vec3(5.8e-6, 13.5e-6, 33.1e-6) * aR + vec3(1.1e-5) * aM) * t * uHaze);
  return c * T + inL * (1.0 - T);
}
void main() {
  vec3 rd = normalize(uRot * vec3((vUv.x * 2.0 - 1.0) * uTan.x, (vUv.y * 2.0 - 1.0) * uTan.y, -1.0));
  vec3 L = uSun, sunC = mix(vec3(1.0, 0.5, 0.25), vec3(1.0, 0.94, 0.86), smoothstep(0.03, 0.4, L.y)) * 3.0;
  vec3 hor = skyOf(normalize(vec3(rd.x, 0.0, rd.z)), L, sunC) * 0.95, amb = vec3(0.35, 0.42, 0.55);
  float t = march(uEye, rd);
  vec3 c;
  if (t > 0.0) {
    vec3 p = uEye + rd * t, P = vec3(p.x, farH(p.xz), p.z), N = normalAt(p.xz, max(60.0, 0.002 * t));
    vec3 alb = mix(uSlope, uWall, smoothstep(0.92, 0.5, N.y));
    alb = mix(uGround, alb, smoothstep(30.0, 900.0, P.y));
    if (uTint > 0.5) alb = tintAt(p.xz) * 0.4;
    c = alb * (sunC * max(dot(N, L), 0.0) * shadowAt(P, L) + amb * (0.55 + 0.45 * N.y));
    c = airOf(c, uEye, t, max(P.y, 0.0), hor);
  } else if (rd.y < 0.0) {
    // The sand plain, out to the horizon.
    c = airOf(uGround * (sunC * max(L.y, 0.0) + amb), uEye, min(uEye.y / max(-rd.y, 1e-5), 400000.0), 0.0, hor);
  } else c = skyOf(rd, L, sunC);
  // A soft film curve, then sRGB.
  o = vec4(pow(1.0 - exp(-c * 0.9), vec3(1.0 / 2.2)), 1.0);
}`;
const PANO_FS = () => `${HEAD()}
uniform vec4 uWin;
void main() {
  float b = radians(mix(uWin.x, uWin.y, vUv.x)), e = radians(mix(uWin.z, uWin.w, vUv.y));
  vec3 rd = normalize(vec3(-sin(b) * cos(e), sin(e), -cos(b) * cos(e)));
  float t = march(uEye, rd);
  if (t < 0.0) { o = vec4(mix(vec3(0.16, 0.18, 0.23), vec3(0.09, 0.1, 0.14), vUv.y), 1.0); return; }
  vec3 p = uEye + rd * t, N = normalAt(p.xz, max(60.0, 0.002 * t));
  float l = 0.35 + 0.65 * max(dot(N, uSun), 0.0);
  // Far ground fades a little, so the layers part.
  o = vec4(tintAt(p.xz) * l * mix(1.0, 0.6, smoothstep(40000.0, 260000.0, t)), 1.0);
}`;
const MAP_FS = () => `${HEAD()}
uniform vec4 uBox;
uniform float uPx;
void main() {
  // Screen x is world x; screen up is negative z.
  vec2 p = vec2(mix(uBox.x, uBox.z, vUv.x), mix(uBox.w, uBox.y, vUv.y));
  float h = farH(p);
  if (h < 1.0) { o = vec4(vec3(0.11, 0.12, 0.15), 1.0); return; }
  vec3 N = normalAt(p, max(60.0, uPx));
  vec3 c = tintAt(p) * (0.3 + 0.7 * max(dot(N, uSun), 0.0)) * (0.55 + 0.45 * clamp(h / 30000.0, 0.0, 1.0));
  // A contour every 2 km; every fifth is bold.
  float s = h / 2000.0, w = fwidth(s);
  c = mix(c, vec3(0.05), 0.45 * (1.0 - smoothstep(0.0, 1.2 * w, min(fract(s), 1.0 - fract(s)))));
  c = mix(c, vec3(0.02), 0.6 * (1.0 - smoothstep(0.0, 1.6 * w, min(fract(s / 5.0), 1.0 - fract(s / 5.0)) * 5.0)));
  o = vec4(c, 1.0);
}`;

/* ---------- panels ---------- */
const panels = {};
for (const id of ['gun', 'pano', 'map']) {
  const box = $('#' + id), gl = box.querySelector('canvas.gl').getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
  panels[id] = { box, gl, over: box.querySelector('canvas.over'), vao: gl.createVertexArray(), prog: null };
}
const SHADERS = { gun: GUN_FS, pano: PANO_FS, map: MAP_FS };

/* ---------- copy ---------- */
function configJs() {
  const rows = table().map(m => `  [${[+m[0].toFixed(1), Math.round(m[1] / 1000) * 1000, Math.round(m[2] / 500) * 500, Math.round(m[3] / 100) * 100, Math.round(m[4]), Math.round(m[5]), ...(m[6] ? [m[6]] : [])].join(', ')}],${m[6] ? ` // ${FORMS[m[6]]}` : ''}`);
  const knobs = R.LAND_KEYS.map(k => `  ${k}: ${land[k]},`).join('\n');
  return `export const RANGES = [\n${rows.join('\n')}\n];\n\n// The LAND values, for each knob's value in ranges.js.\nconst LAND_VALUES = {\n${knobs}\n};\n`;
}
async function copy(btn) {
  const text = configJs();
  try { await navigator.clipboard.writeText(text); flash(btn, 'Copied'); } catch { console.log(text); flash(btn, 'In the console'); }
}
function flash(btn, t) { const t0 = btn.textContent; btn.textContent = t; setTimeout(() => { btn.textContent = t0; }, 1200); }

/* ---------- load ---------- */
async function load(first = false) {
  const v = ++version;
  setStatus('Loading ranges.js');
  try {
    R = await import(`./ranges.js?v=${Date.now()}`);
    N = R.RANGE_MAX || R.RANGES.length;
    if (first) {
      const s = loadSaved();
      if (s?.ranges?.length) { ranges = s.ranges.slice(0, N); land = s.land || {}; Object.assign(view, s.view || {}); }
      else ranges = R.RANGES.map(fromRow);
      $('#addform').innerHTML = FORMS.map((f, k) => `<option value="${k}">${f}</option>`).join('');
      syncView();
    }
    buildLand();
    for (const [id, fs] of Object.entries(SHADERS)) {
      const P = panels[id];
      if (P.prog) P.gl.deleteProgram(P.prog.p);
      P.prog = program(P.gl, TRI_VS, fs());
    }
    await Promise.all(Object.values(panels).map(P => linked(P.gl, { a: P.prog })));
    if (v !== version) return;
    if (!past.length) past.push(snap());
    renderList(); renderSel(); buttons();
    draw();
  } catch (err) {
    setStatus(String(err.message || err), true);
  }
}
// The View section mirrors the view state.
function syncView() {
  document.querySelectorAll('[data-view]').forEach(el => {
    const k = el.dataset.view;
    if (el.type === 'checkbox') el.checked = !!view[k]; else { el.value = view[k]; el.nextElementSibling.textContent = view[k]; }
  });
  $('#seed').value = view.seed;
  document.querySelectorAll('#lens button').forEach(b => b.classList.toggle('on', b.dataset.lens === view.lens));
  $('#gun').classList.toggle('phone', view.lens === 'phone');
}

/* ---------- wiring ---------- */
document.querySelectorAll('[data-view]').forEach(el => el.addEventListener(el.type === 'checkbox' ? 'change' : 'input', () => {
  const k = el.dataset.view;
  view[k] = el.type === 'checkbox' ? (el.checked ? 1 : 0) : +el.value;
  if (el.type !== 'checkbox') el.nextElementSibling.textContent = el.value;
  save(); draw({ fast: el.type !== 'checkbox' });
}));
$('#lens').addEventListener('click', ev => { const l = ev.target.dataset.lens; if (!l) return; view.lens = l; syncView(); save(); draw(); });
panels.pano.box.addEventListener('pointermove', ev => {
  const r = panels.pano.box.getBoundingClientRect(), win = panoWin();
  const b = win[0] + (win[1] - win[0]) * (ev.clientX - r.left) / r.width, e = win[3] + (win[2] - win[3]) * (ev.clientY - r.top) / r.height;
  $('#hover').textContent = `bearing ${b.toFixed(1)}° · elevation ${e.toFixed(2)}°`;
});
$('#add').addEventListener('click', () => {
  if (ranges.length >= N) return;
  const form = +$('#addform').value, crest = form === 1 ? 3000 : 12000;
  ranges.push({ form, mb: 20, md: 140000, crest, rc: radialForm(form) ? crest * 1.8 : 2.6 * crest, span: 120, face: 0 });
  sel = ranges.length - 1; commit(); buildLand(); changed();
});
const gen = () => { if (!R) return; view.seed = $('#seed').value.trim() || '1'; ranges = generate(view.seed); sel = -1; commit(); buildLand(); changed(); };
$('#generate').addEventListener('click', gen);
$('#next').addEventListener('click', () => { const s = $('#seed'); s.value = String((parseInt(s.value, 10) || 0) + 1); gen(); });
$('#seed').addEventListener('keydown', ev => { if (ev.key === 'Enter') gen(); });
$('#reset').addEventListener('click', () => { if (!R) return; ranges = R.RANGES.map(fromRow); land = {}; sel = -1; buildLand(); commit(); changed(); });
$('#copy').addEventListener('click', ev => copy(ev.target));
$('#reload').addEventListener('click', () => load());
$('#undo').addEventListener('click', undo);
$('#redo').addEventListener('click', redo);
addEventListener('keydown', ev => {
  const typing = (ev.target.tagName === 'INPUT' && ev.target.type === 'text') || ev.target.tagName === 'SELECT';
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); if (ev.shiftKey) redo(); else undo(); return; }
  if (ev.metaKey || ev.ctrlKey || typing) return;
  if (ev.key === 'r') load(); else if (ev.key === 'g') gen(); else if (ev.key === 'n') $('#next').click();
  else if ((ev.key === 'Delete' || ev.key === 'Backspace') && sel >= 0) { ranges.splice(sel, 1); sel = -1; commit(); buildLand(); changed(); }
  else if (ev.key === 'Escape') select(-1);
});
new ResizeObserver(() => draw()).observe(document.querySelector('main'));
// QA: wait on ready; read the status, the table and the knobs; drive a few edits.
window.__lab = {
  ready: () => !!R && /drawn/.test($('#status').textContent),
  status: () => $('#status').textContent,
  table, ranges: () => JSON.parse(JSON.stringify(ranges)), land: () => ({ ...land }), view: () => ({ ...view }),
  gen: s => { $('#seed').value = s; gen(); }, select, undo, redo,
  setLand: (k, v) => { land[k] = v; commit(); changed(); },
  setView: (k, v) => { view[k] = v; syncView(); draw(); },
  handle: i => { const h = handles(i), r = panels.map.box.getBoundingClientRect(), d = dpr(); return { dot: [r.left + h.dot[0] / d, r.top + h.dot[1] / d], ring: h.ring && [r.left + h.ring[0] / d, r.top + h.ring[1] / d] }; },
  config: configJs,
};
load(true);
</script>
</body>
