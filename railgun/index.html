<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { createNoise3D } from 'simplex-noise';
import { initPage, whenVisible, pixelRatio, onQuality, linFit, reduced, onReducedChange, quality, audioKit, sound, stage as mark, pageReady, later } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import { FLARE } from '../shared/flare.js';
mark('libs');

/* ---------- settings ---------- */
const store = {
  get(k) { try { return localStorage.getItem(`stimming.railgun.${k}`); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(`stimming.railgun.${k}`, String(v)); } catch { /* storage off */ } },
};
// Per size: radius in metres, fall seconds, shard count, rumble gain.
const SIZES = {
  boulder: { R: 600, T: 220, shards: 24, rumble: 0.7 },
  mountain: { R: 1000, T: 300, shards: 40, rumble: 1.0 },
  moon: { R: 1700, T: 380, shards: 56, rumble: 1.3 },
};
const opts = {
  // The first rock rolls its size too.
  size: 'mountain',
  // Time of day, 0 for night to 1 for noon.
  // It has its own key: the old Sun key had a narrower range.
  sun: Number.isFinite(+store.get('time')) && store.get('time') !== null ? Math.min(1, Math.max(0, +store.get('time'))) : 0.5,
};

/* ---------- bar ---------- */
// 'random' turns to the next size at each Reset; a dev pick pins it.
let devSize = 'random';
// The charge sound's mix: 'hum', 'blend', 'choir', 'vast' or 'titan'.
// Expanse is the default; an old Blend default moves to it once.
let chargeMix = (() => {
  try {
    const K = 'stimming.railgun.chargemix';
    if (!localStorage.getItem(K + '.v2')) { if (localStorage.getItem(K) === 'blend') localStorage.setItem(K, 'vast'); localStorage.setItem(K + '.v2', '1'); }
    return localStorage.getItem(K) || 'vast';
  } catch { return 'vast'; }
})();
// The hold is the toy: no action chips.
const act = { press() {}, release() {} };
const ui = initPage({ id: 'railgun', bar: {
  // Time runs from a starry night to a high noon sun.
  slider: { label: 'Time', min: 0, max: 1, step: 0.002, value: opts.sun, onInput: v => { opts.sun = v; store.set('time', v); setSun(); } },
  settings: [
    { type: 'toggle', id: 'letterbox', label: 'Letterbox', value: false, persist: true, onToggle: on => setBox(on) },
    // Aim: the gun tracks the rock, or the arrow keys lay it by hand.
    { type: 'choice', id: 'aim', label: 'Aim', value: 'track', persist: true, options: [{ value: 'track', label: 'Track' }, { value: 'free', label: 'Free' }], onPick: v => setAimMode(v) },
    // The charge: the hum, the choir, a blend, or a blend on the plain.
    { type: 'choice', id: 'chargemix', label: 'Charge sound', display: 'stepper', value: 'vast', persist: true, options: [{ value: 'hum', label: 'Hum' }, { value: 'blend', label: 'Blend' }, { value: 'choir', label: 'Choir' }, { value: 'vast', label: 'Expanse' }, { value: 'titan', label: 'Titan' }], onPick: v => { chargeMix = v; } },
    // Dev: pin the rock's size; Random rolls a new one per rock.
    { type: 'choice', id: 'devsize', label: 'Rock (dev)', display: 'stepper', value: 'random', options: [{ value: 'random', label: 'Random' }, { value: 'boulder', label: 'Boulder' }, { value: 'mountain', label: 'Mountain' }, { value: 'moon', label: 'Moon' }], onPick: v => { devSize = v; if (v !== 'random') { opts.size = v; retune(); } } },
    { type: 'slider', id: 'grain', label: 'Grain', min: 0, max: 2, step: 0.05, value: 1, persist: true, onInput: () => setGrain() },
    // Graphics: fine tuning on top of Quality and the automatic ladder.
    { type: 'slider', id: 'res', label: 'Resolution', min: 0.5, max: 1, step: 0.05, value: 1, persist: true, onInput: v => { gfx.res = v; resize(); } },
    { type: 'choice', id: 'detail', label: 'Smoke detail', value: 'mid', persist: true, options: [{ value: 'low', label: 'Low' }, { value: 'mid', label: 'Mid' }, { value: 'high', label: 'High' }], onPick: v => { gfx.detail = DETAIL[v]; resize(); } },
    { type: 'slider', id: 'bloom', label: 'Bloom', min: 0, max: 2, step: 0.05, value: 1, persist: true, onInput: v => { gfx.bloom = v; setBloom(); } },
    // Tone: the curve, then exposure, contrast and colour on top of the grade.
    { type: 'choice', id: 'tone', label: 'Tone map', value: 'aces', persist: true, options: [{ value: 'agx', label: 'AgX' }, { value: 'aces', label: 'ACES' }, { value: 'neutral', label: 'Neutral' }], onPick: v => { gfx.tone = v; setTone(); } },
    { type: 'slider', id: 'exposure', label: 'Exposure', min: 0.5, max: 2, step: 0.05, value: 0.55, persist: true, onInput: v => { gfx.exp = v; draw(); } },
    { type: 'slider', id: 'brightness', label: 'Brightness', min: 0.6, max: 1.5, step: 0.02, value: 0.78, persist: true, onInput: v => { gfx.bri = v; setTone(); } },
    { type: 'slider', id: 'contrast', label: 'Contrast', min: 0, max: 0.5, step: 0.01, value: 0.24, persist: true, onInput: v => { gfx.con = v; setTone(); } },
    { type: 'slider', id: 'saturation', label: 'Saturation', min: 0.4, max: 1.4, step: 0.02, value: 1.06, persist: true, onInput: v => { gfx.sat = v; setTone(); } },
    { type: 'choice', id: 'fxaa', label: 'FXAA', value: 'auto', persist: true, options: [{ value: 'auto', label: 'Auto' }, { value: 'on', label: 'On' }, { value: 'off', label: 'Off' }], onPick: v => { gfx.fxaa = v; resize(); } },
  ],
  // Reset runs the days faster and faster, then cuts back to the start.
  // Reset waits right of Sight; it shows and glows after a kill.
  actions: [{ verb: 'sight', key: 'V', onPress: () => toggleSight() }, { verb: 'reset', key: 'R', onPress: () => resetToy() }],
  quality: true,
  keys: [['hold', 'charge'], ['release', 'fire'], ['arrows', 'traverse'], ['v', 'sight']],
} });

const stage = document.getElementById('stage');
mark('build');
let markReady;
const sceneReady = new Promise(r => { markReady = () => { mark('first-frame'); r(); }; });
// A slow phone compiles for many seconds; the intro holds for it.
playIntro({ ready: pageReady(15000) });

// Seeded random keeps the gun the same on every load.
let seed = 7331;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rad = THREE.MathUtils.degToRad;
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp = THREE.MathUtils.clamp;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; ui.hideControls(); markReady();
  throw err;
}
// AgX rolls bright fire and sky off softly, without the yellow skew of ACES.
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.0;
// The time of day's exposure; the eye's adaptation scales it each frame.
let baseExp = 1.0;
// The last sun drift step, on the sim clock.
let sunT = -99;
renderer.setClearColor(0x000000, 1);
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
// A 20 m near plane keeps depth precision on rocks 40 km out.
const camera = new THREE.PerspectiveCamera(44, 1, 20, 300000);
camera.rotation.order = 'YXZ';
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = +new URLSearchParams(location.search).get('rung') || 0;
// Graphics settings: resolution share, smoke step factor, bloom gain, FXAA mode.
const DETAIL = { low: 0.6, mid: 1, high: 1.4 };
const gfx = { res: 1, detail: 1, bloom: 1, fxaa: 'auto', tone: 'aces', exp: 0.55, bri: 0.78, con: 0.24, sat: 1.06 };
// The share of the quality's resolution per rung.
const RES_STEP = [1, 0.82, 0.68, 0.55];

/* ---------- the gun's axis ---------- */
// One unit is one metre. The trunnion sits 245 m over the origin.
// LIFT: the plinth stands on a sloped berm, LIFT metres high.
// The barrel climbs at 6 degrees toward negative z.
// Station 0 is the trunnion; station 1 is the muzzle, 900 m on.
const LIFT = 30, BERM_R = 660;
const ELEV = rad(6), L = 900, TRUN_Y = 215 + LIFT;
const AX = new THREE.Vector3(0, Math.sin(ELEV), -Math.cos(ELEV));
const AX_UP = new THREE.Vector3(0, Math.cos(ELEV), Math.sin(ELEV));
const A0 = new THREE.Vector3(0, TRUN_Y, 0);
const axisAt = (s, out) => out.copy(A0).addScaledVector(AX, L * s);
// The bore starts behind the trunnion.
const BREECH = -0.25;
// The rock ends its fall 40 km out, low over the horizon.
// The bolt takes seconds to reach it.
const DA = 40000;
const yUp = new THREE.Vector3(0, 1, 0);
// The fall ends at END0; it starts FALL metres back along AWAY0.
const END0 = new THREE.Vector3(Math.sin(rad(1)) * Math.cos(ELEV), Math.sin(ELEV), -Math.cos(rad(1)) * Math.cos(ELEV)).multiplyScalar(DA).add(A0);
const AWAY0 = new THREE.Vector3(-12500, 12000, -3500).normalize();
const FALL = 17680;
// A point on the barrel: a metres along, x across, u up.
// SY and CY hold the mount's yaw, left of negative z.
let SE = Math.sin(ELEV), CE = Math.cos(ELEV), SY = 0, CY = 1;
const barrelPt = (a, x, u, out) => { const z = -a * CE + u * SE; return out.set(x * CY + z * SY, TRUN_Y + a * SE + u * CE, z * CY - x * SY); };
const MUZZLE = axisAt(1, new THREE.Vector3());

/* ---------- uniforms ---------- */
const BLUE = linFit(0.82, 0.12, 225), AMBER = linFit(0.78, 0.17, 50);
const U = {
  // The gun's depth from the eye: volumes stop marching at its skin.
  uGunD: { value: null }, uDRes: { value: new THREE.Vector2(1, 1) }, uNF: { value: new THREE.Vector2(20, 300000) }, uCamFwd: { value: new THREE.Vector3(0, 0, -1) },
  uTime: { value: 0 },
  // The sun: direction toward it, its colour, the zenith and the horizon.
  uSun: { value: new THREE.Vector3(0, 0.1, -1) },
  uSunC: { value: new THREE.Vector3() },
  uZenC: { value: new THREE.Vector3() },
  uHorC: { value: new THREE.Vector3() },
  uSunE: { value: 0.1 },
  // uSun is the key light: the sun by day, the moon by night.
  // uSunD is the true sun; it tints the sky glow.
  uSunD: { value: new THREE.Vector3(0, 0.1, -1) },
  uGlowC: { value: new THREE.Vector3() },
  uMoonD: { value: new THREE.Vector3(-0.58, 0.42, -0.69).normalize() },
  uMoonK: { value: 0 },
  uStars: { value: 0 },
  uStarT: null,
  // High cloud still holds the sun after it sets.
  uCloudSun: { value: new THREE.Vector3() },
  uCloudAmb: { value: new THREE.Vector3(0.22, 0.22, 0.22) },
  // The plain's light: slope gain and lift; a low sun needs both.
  uGLift: { value: new THREE.Vector2(4, 0.25) },
  // The hit: world position and the sim time of the hit.
  uHitP: { value: new THREE.Vector4(0, 0, 0, -1e6) },
  uHitR: { value: 1000 },
  // Haze: dust per metre, and the height where it thins.
  uHaze: { value: 0.00013 },
  uDustLoad: { value: 0 },
  uHazeH: { value: 700 },
  uWisp: { value: new THREE.Vector3(Math.random() * 200, Math.random() * 200, 0.6 + Math.random() * 0.4) },
  // The asteroid: direction from the eye, light strength; its angular radius.
  uAst: { value: new THREE.Vector4(0, 1, 0, 0) },
  uAstR: { value: 0.05 },
  uAstC: { value: new THREE.Vector3(...AMBER) },
  // The bolt: world position and strength. The hit: direction and strength.
  uBolt: { value: new THREE.Vector4(0, 0, 0, 0) },
  uBoltC: { value: new THREE.Vector3(...linFit(0.9, 0.08, 225)) },
  uHit: { value: new THREE.Vector4(0, 1, 0, 0) },
  // The void: a sphere the blast clears in the sky. Centre and radius; strength.
  uVoid: { value: new THREE.Vector4(0, 0, 0, 1) }, uVoidK: { value: 0 }, uVoidD: { value: new THREE.Vector2() }, uVoidT: { value: 0 },
  // Charge level, chase station, chase half width, muzzle flash.
  uCharge: { value: 0 },
  uRage: { value: 0 },
  uChase: { value: 0 },
  uChaseW: { value: 0.25 },
  uFire: { value: 0 },
  uAxisA: { value: A0 },
  uAxisD: { value: AX },
  uAxisUp: { value: AX_UP },
  uL: { value: L },
  // The barrel slides back along its axis, in metres.
  uRecoil: { value: 0 },
  // Cosine and sine of the barrel's drop below the firing angle.
  uDrop: { value: new THREE.Vector2(1, 0) },
  // The rest axis, and the cosine and sine of the mount's yaw.
  uAxis0: { value: AX.clone() },
  uYaw: { value: new THREE.Vector2(1, 0) },
  // The sun's depth map, its matrix and its bias.
  uShadowT: { value: null },
  uShadowM: { value: new THREE.Matrix4() },
  uShadowB: { value: 0.002 },
  // The brightest arc: position and strength.
  uArcL: { value: new THREE.Vector4(0, 0, 0, 0) },
  uMuzL: { value: new THREE.Vector4(0, 0, 0, 0) },
  // The Mach ring on the ground: centre x, z, radius, strength.
  uShock: { value: new THREE.Vector4(0, 0, 0, 0) },
  // The strength of the Rayleigh air.
  uAir: { value: 0.7 },
  // Barrel heat, 0 cold to 1 white-hot.
  uHeat: { value: 0 },
  // A slow dull-red tail after each shot.
  uHeatT: { value: 0 },
  // The over-hold, 0 to 1: the gun acts out.
  uOver: { value: 0 },
  // The blast light: world position and strength.
  uBlast: { value: new THREE.Vector4(0, 0, 0, 0) },
  // uBk: the live blast's power; 0 when no blast burns.
  uBk: { value: 0 },
  // The soot ball: centre and radius, and its density.
  uSootS: { value: new THREE.Vector4() }, uSootK: { value: 0 },
  // The soot's shadow light: a steered way, so its shadow crosses the seen plain.
  uSootL: { value: new THREE.Vector3(0, 1, 0) },
  // The blast eats the tail's end: centre and radius; it stays after the soot.
  uEat: { value: new THREE.Vector4() },
  // The rock's place over the plain: x, z.
  uAstG: { value: new THREE.Vector2() },
  // The falling pieces' glows: place and strength.
  uDebL: { value: Array.from({ length: 4 }, () => new THREE.Vector4()) },
  // Ember pools where pieces land: x, z, strength, radius.
  uPool: { value: Array.from({ length: 4 }, () => new THREE.Vector4()) },
};
U.uStarT = U.uTime;

/* ---------- sun: late light over a dusty plain ---------- */
// The sun sits low on the right, a little ahead of the eye.
// It lights the near flank; shadows rake away to the left.
const SUN_AZ = new THREE.Vector2(0.62, -0.78).normalize();
const lerp3 = (a, b, t) => a.map((x, i) => x + (b[i] - x) * t);
const sstep = THREE.MathUtils.smoothstep;
const lerp = THREE.MathUtils.lerp;
// The moon: cool and dim, high on the left.
const MOON_C = [0.09, 0.11, 0.16];

/* ---------- sky: one turn a day about a tilted pole ---------- */
// Latitude thirty degrees: the equinox sun stands sixty degrees up at noon.
// The sun rises ahead and right, crosses the sky ahead and left, sets behind.
const PHI = rad(30);
const SKY = { E: new THREE.Vector3(SUN_AZ.x, 0, SUN_AZ.y).normalize(), S: new THREE.Vector3(), P: new THREE.Vector3() };
const skyFrame = () => {
  SKY.S.crossVectors(yUp, SKY.E);
  SKY.P.copy(yUp).multiplyScalar(Math.sin(PHI)).addScaledVector(SKY.S, -Math.cos(PHI));
};
// A direction on the sky at hour angle H and declination d.
function skyDir(H, d, out) {
  const cd = Math.cos(d), sd = Math.sin(d), cP = Math.cos(PHI), sP = Math.sin(PHI);
  out.copy(SKY.E).multiplyScalar(-Math.sin(H) * cd);
  out.addScaledVector(yUp, Math.cos(H) * cd * cP + sd * sP);
  return out.addScaledVector(SKY.S, Math.cos(H) * cd * sP - sd * cP);
}
// The morning hour angle where the sun stands deg degrees up.
const hourOf = deg => -Math.acos(clamp(Math.sin(rad(deg)) / Math.cos(PHI), -1, 1));
// Turn the frame so the dusk sun lands on the first look's bearing.
skyFrame();
{
  const d = skyDir(hourOf(5.6), 0, new THREE.Vector3());
  SKY.E.applyAxisAngle(yUp, Math.atan2(SKY.E.x, SKY.E.z) - Math.atan2(d.x, d.z));
  skyFrame();
}
// The moon runs six hours behind the sun, low in the south.
// At night on the slider it stands high on the left.
const MOON_H = rad(93.5), MOON_DEC = rad(-33.7);
const skyRot = new THREE.Matrix4();
U.uSkyRot = { value: new THREE.Matrix3() };
let skyH = 0;
function sun(deg) { skyAt(hourOf(deg)); }
function skyAt(H) {

};
// The vent: a crash and a boom under the barrel.
ventSound = () => {
  const ac = kit.live();
  if (!ac) return;
  const t = ac.currentTime;
  const cr = hiss(ac, t, 1.6, 0.8), bp = filt(ac, 'bandpass', 900, 0.7), crG = ac.createGain();
  crG.gain.setValueAtTime(0.5, t); crG.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
  cr.connect(bp).connect(crG).connect(kit.out);
  const o = ac.createOscillator(), og = ac.createGain();
  o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(24, t + 1.2);
  og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.6, t + 0.02); og.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
  o.connect(og).connect(kit.out); o.start(t); o.stop(t + 1.5);
  echo(ac, crG, 0.3); echo(ac, og, 0.3, 500);
  track(t + 1.7, cr, o);
};
// The arm cue: a low clunk with a short metal ring.
armSound = () => {
  const ac = kit.live();
  if (!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(), r = ac.createOscillator(), rg = ac.createGain();
  o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.25);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  r.frequency.value = 610 * jit(0.03);
  rg.gain.setValueAtTime(0.05, t); rg.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  o.connect(g).connect(kit.out); r.connect(rg).connect(kit.out);
  o.start(t); o.stop(t + 0.4); r.start(t); r.stop(t + 1);
  track(t + 1.1, o, r);
};
// Tom's samples: a whoosh into an impact, then a far boom.
const SAMPLES = { impact: 'impact.mp3', boom: 'boom.mp3', shot: 'shot.mp3' };
// The impact's peak sits 1.85 s into its file.
const IMPACT_AT = 1.85;
const sampleP = {};
let boomOK = false;
// A missing or failed sample resolves null and tries again next time.
const sample = (ac, name) => (sampleP[name] ??= fetch(SAMPLES[name])
  .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
  .then(b => ac.decodeAudioData(b))
  .catch(() => { delete sampleP[name]; return null; }));
// Send a node into the plain's echoes, darkened above dark hertz.
function echo(ac, node, lvl, dark = 6000) {
  const s = ac.createGain(), lp = filt(ac, 'lowpass', dark, 0.5);
  s.gain.value = lvl;
  node.connect(s).connect(lp).connect(plainVerb(ac));
}
// dark: lowpass corner in hertz, with a low shelf lift; 0 plays it plain.
// wet: the send into the plain's echoes.
function playSample(ac, buf, when, gain, rate, dark = 0, wet = 0) {
  const src = ac.createBufferSource(), g = ac.createGain();
  src.buffer = buf; src.playbackRate.value = rate; g.gain.value = gain;
  if (dark) {
    const lp = filt(ac, 'lowpass', dark, 0.5), sh = filt(ac, 'lowshelf', 120);
    sh.gain.value = 9;
    src.connect(lp).connect(sh).connect(g).connect(kit.out);
  } else src.connect(g).connect(kit.out);
  if (wet) echo(ac, g, wet, dark || 6000);
  src.start(when);
  track(when + buf.duration / rate + 0.1, src);
}
// Tom's cannon report plays as the slug leaves the muzzle.
function shotSound(ac, sh) {
  const late = 0;
  const at = ac.currentTime + 0.3;
  sh.sfx = { ...sh.sfx, shot: 0, shotLate: late };
  sample(ac, 'shot').then(buf => {
    if (!buf || shot !== sh || !kit.live()) return;
    const src = ac.createBufferSource(), g = ac.createGain();
    src.buffer = buf; src.playbackRate.value = jit(0.03);
    // Its long tail fades out before the boom lands.
    const lvl = 1.4 * Math.min(sh.c, 1.25) * jit(0.1);
    g.gain.setValueAtTime(lvl, Math.max(ac.currentTime, at)); g.gain.setTargetAtTime(0, at + 4, 3.5);
    src.connect(g).connect(kit.out);
    // The report rolls off the mesas across the flats.
    echo(ac, g, 0.35);
    sh.sfx.shot = Math.max(ac.currentTime, at);
    src.start(sh.sfx.shot); src.stop(sh.sfx.shot + 20);
    // A sub punch under the report gives it weight.
    const t0 = sh.sfx.shot, o = ac.createOscillator(), og = ac.createGain();
    o.frequency.setValueAtTime(52, t0); o.frequency.exponentialRampToValueAtTime(28, t0 + 0.7);
    og.gain.setValueAtTime(0.0001, t0); og.gain.exponentialRampToValueAtTime(0.8 * Math.min(sh.c, 1.25), t0 + 0.015); og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
    o.connect(og).connect(kit.out); o.start(t0); o.stop(t0 + 1);
    echo(ac, og, 0.25, 400);
    track(sh.sfx.shot + 20.1, src, o);
  });
}
// The impact's prelude lands on the flash.
// The boom crosses the distance at sound speed, compressed eight times.
function hitSounds(ac, sh) {
  if (!sh.canHit) return;
  const hit = ac.currentTime + sh.hitT, k = SIZES[opts.size].rumble * Math.min(sh.c, 1.25);
  // Compressed 28 times: the boom lands about 5 s after the flash.
  const late = camera.position.distanceTo(sh.target) / 343 / 28;
  sh.sfx = { ...sh.sfx, hit, impact: 0, boom: 0, late };
  Promise.all([sample(ac, 'impact'), sample(ac, 'boom')]).then(([imp, boom]) => {
    if (shot !== sh || !kit.live()) return;
    if (imp) { sh.sfx.impact = Math.max(ac.currentTime, hit - IMPACT_AT); playSample(ac, imp, sh.sfx.impact, 0.45 * k * jit(0.1), jit(0.04), 0, 0.25); }
    // The boom plays half speed, an octave down: deep, bellowing, about 45 s long.
    if (boom) { boomOK = true; sh.sfx.boom = hit + late; playSample(ac, boom, sh.sfx.boom, 1.9 * k * jit(0.1), 0.5 * jit(0.03), 1200, 0.2); }
  });
}
// The fire's own sound, after the boom's delay: a low roar that follows the fire,
// far crackle, and one muffled thud per late burst.
function fireSounds(ac, sh, fx) {
  const t0 = ac.currentTime + (sh.sfx.late || 0), k = SIZES[opts.size].rumble * fx.k;
  // The roar: low noise that swells in a second and dies with the fire.
  const roar = hiss(ac, t0, 30, 0.5), lp = filt(ac, 'lowpass', 260), rg = ac.createGain();
  rg.gain.setValueAtTime(0.0001, t0); rg.gain.exponentialRampToValueAtTime(0.12 * k, t0 + 1.2);
  rg.gain.setTargetAtTime(0.0001, t0 + 2, 7);
  roar.connect(lp).connect(rg).connect(kit.out);
  lp.frequency.setValueAtTime(320, t0); lp.frequency.setTargetAtTime(120, t0 + 2, 9);
  // Crackle: dull pops, thick at first, rarer as the fire cools.
  const pops = [];
  for (let t = 0.4; t < 20; t += 0.08 + 0.5 * Math.random() * (t / 8)) {
    const at = t0 + t, d = 0.02 + 0.06 * Math.random(), n = hiss(ac, at, d + 0.03, 0.9);
    const bp = filt(ac, 'bandpass', 500 + 1300 * Math.random(), 1.8), g = ac.createGain(), pn = ac.createStereoPanner();
    pn.pan.value = Math.random() * 0.8 - 0.4;
    const lvl = 0.07 * k * Math.exp(-t / 7) * (0.4 + 0.6 * Math.random());
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(Math.max(lvl, 0.0002), at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + d);
    n.connect(bp).connect(g).connect(pn).connect(kit.out);
    pops.push(n);
  }
  // A thud per burst: low, short, with a little body.
  const thuds = fx.bursts.map(b => {
    const at = t0 + b.t, o = ac.createOscillator(), og = ac.createGain();
    o.frequency.setValueAtTime(58 * jit(0.1), at); o.frequency.exponentialRampToValueAtTime(30, at + 0.9);
    og.gain.setValueAtTime(0.0001, at); og.gain.exponentialRampToValueAtTime(0.45 * k * b.k, at + 0.03); og.gain.exponentialRampToValueAtTime(0.0001, at + 1.4);
    o.connect(og).connect(kit.out); o.start(at); o.stop(at + 1.5);
    echo(ac, og, 0.3, 500);
    return o;
  });
  track(t0 + 31, roar, ...pops, ...thuds);
}
// The rumble crosses forty kilometres of air, compressed eight times.
// It lands fifteen seconds after the flash.
function rumble(c) {
  const ac = kit.live();
  if (!ac) return;
  const t = ac.currentTime + DA / 343 / 8, k = SIZES[opts.size].rumble;
  const s = hiss(ac, t, 7, 0.3), lp = filt(ac, 'lowpass', 180), g = ac.createGain();
  const lvl = 0.25 * (0.5 + 0.5 * c) * k * jit(0.1);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(lvl, t + 0.6); g.gain.setTargetAtTime(0.0001, t + 1.2, 1.4);
  s.connect(lp).connect(g).connect(kit.out);
  const o = ac.createOscillator(), og = ac.createGain();
  o.frequency.value = 30 * jit(0.05);
  og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(lvl * 0.8, t + 0.6); og.gain.setTargetAtTime(0.0001, t + 1.2, 1.4);
  o.connect(og).connect(kit.out); o.start(t); o.stop(t + 7);
  track(t + 7.5, s, o);
}
// Sound on mid-charge starts the hum where the hold is.
// Sound off stops everything.
sound.onChange(on => {
  if (!on) { stopAll(); humStop(kit.ac); if (bed) { bed.g.gain.value = 0; bed.g2.gain.value = 0; } return; }
  if (charge) setTimeout(() => { const ac = kit.live(); if (ac && charge) humStart(ac); }, 60);
});


/* Pointer: a press charges, a release fires; the cursor leans the lens a little. */
let press = null, spaceDown = false;
stage.addEventListener('pointerdown', e => {
  // One finger at a time: a second pointer changes nothing.
  if (e.button > 0 || press) return;
  stage.setPointerCapture(e.pointerId);
  press = { id: e.pointerId, at: performance.now() };
  stage.classList.add('held');
  if (sound.on) kit.wake();
  act.press();
  wake();
});
// The lens leans a degree or so toward the cursor, slow and heavy.
// Reduced motion keeps it still.
stage.addEventListener('pointermove', e => {
  if (reduced() || e.pointerType === 'touch') return;
  const r = stage.getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width - 0.5, ny = (e.clientY - r.top) / r.height - 0.5;
  lookTo.yaw = -clamp(nx, -0.5, 0.5) * rad(1.4);
  lookTo.pitch = -clamp(ny, -0.5, 0.5) * rad(0.9);
  wake();
});
stage.addEventListener('pointerleave', () => { lookTo.yaw = lookTo.pitch = 0; wake(); });
const end = e => {
  if (!press || e.pointerId !== press.id) return;
  press = null;
  stage.classList.remove('held');
  act.release('pointer');
  wake();
};
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);
// Space holds the charge.
// The shell ignores it while a sheet has focus.
document.addEventListener('keydown', e => {
  if (TRAV[e.code] && !e.target.closest?.('input, .s2-sheet') && !e.metaKey && !e.ctrlKey) { e.preventDefault(); tkeys.add(e.code); wake(); return; }
  if (e.code !== 'Space' || e.repeat || e.target.closest?.('input, button, .s2-sheet')) return;
  e.preventDefault();
  spaceDown = true;
  if (sound.on) kit.wake();
  act.press('space');
  wake();
});
document.addEventListener('keyup', e => {
  if (TRAV[e.code]) { tkeys.delete(e.code); return; }
  if (e.code !== 'Space' || !spaceDown) return;
  spaceDown = false;
  act.release('space');
  wake();
});
addEventListener('blur', () => { tkeys.clear(); if (charge || press) { cancelHold(); wake(); } });

function setBox(on) { grade.uniforms.uBox.value = on ? 1 : 0; draw(); }
function setGrain() { grade.uniforms.uGrain.value = POST.grain * ui.setting('grain').value; draw(); }
function setBloom() { bloomPass.strength = POST.bloom[0] * gfx.bloom; draw(); }
const TONES = { agx: THREE.AgXToneMapping, aces: THREE.ACESFilmicToneMapping, neutral: THREE.NeutralToneMapping };
function setTone() {
  renderer.toneMapping = TONES[gfx.tone] || THREE.AgXToneMapping;
  grade.uniforms.uCon.value = gfx.con; grade.uniforms.uSat.value = gfx.sat; grade.uniforms.uBri.value = gfx.bri;
  draw();
}

/* QA hooks: Dusk, the sim clock, draw count. Not for the UI. */
window.__qa = {
  sun(v) { opts.sun = v; setSun(); },
  simT: () => simT,
  draws: () => drawN,
  info: () => ({ ...renderer.info.render, programs: renderer.info.programs.length, ...renderer.info.memory }),
  size: v => { opts.size = v; retune(); },
  ast: () => ({ s: ast.s, state: ast.state, R: ast.R, th: THREE.MathUtils.radToDeg(ast.th) }),
  // Hold at a level: the charge starts as if held for c.
  charge(c) { c = clamp(c, 0.12, 1.25); act.press('pointer'); charge.t0 = simT - heldOf(c); stepCharge(0); frame(); draw(); },
  // Hold as if pressed t seconds ago.
  hold(t) { act.press('pointer'); if (charge) charge.t0 = simT - t; stepCharge(0); frame(); draw(); },
  level: () => (charge ? charge.c : 0),
  stage: () => (charge ? stageOf(simT - charge.t0) : simT - ventT < 3 ? 'vent' : 'idle'),
  holding: () => !!charge,
  recoil: () => ({ slide: U.uRecoil.value, pitch: THREE.MathUtils.radToDeg(kick.p) }),
  heat: () => U.uHeat.value,
  rockKind: () => astMesh.geometry.userData.kind,
  spin: () => (spin ? { t: spin.t } : null),
  reset() { resetToy(); },
  sight: () => sight,
  toggleSight() { toggleSight(); },
  look: () => ({ yaw: THREE.MathUtils.radToDeg(look.yaw), pitch: THREE.MathUtils.radToDeg(look.pitch), to: THREE.MathUtils.radToDeg(lookTo.yaw) }),
  blastState: () => {
    const u = fireball.material.uniforms, b = U.uBlast.value, T = u.uFb.value.x;
    return { fire: fireball.visible, w: b.w, off: blastFx ? +(blastFx.P.distanceTo(b) / blastFx.R).toFixed(2) : -1, size: blastFx ? +(u.uR.value / 1.6 / blastFx.R).toFixed(2) : 0,
      hot: blastFx ? Math.exp(-T / 5) + 0.8 * Math.exp(-T / 0.6) : 0, shellA: hitShellA.visible ? Math.round(hitShellA.material.uniforms.uR.value) : 0,
      shellB: hitShellB.visible ? Math.round(hitShellB.material.uniforms.uR.value) : 0, rings: false, astW: U.uAst.value.w, hitFlash };
  },
  frags: () => frags.filter(f => f.on).map(f => ({ visible: f.m.visible, gap: +(f.pos.distanceTo(ast.pos) / ast.R).toFixed(2), r: Math.round(f.k * ast.R) })),
  ablation: () => ablN,
  ion: () => ({ visible: ionLine.visible || ionPuffs.visible, glow: ion ? Math.exp(-ionMat.uniforms.uI.value.x / 0.35) : 0 }),
  muzzle: () => ({ plume: plume.visible, jets: jets.some(j => j.visible), spike: spike.visible, rings: false, shell: shellMesh.visible ? shellMesh.material.uniforms.uR.value : 0 }),
  aim: () => ({ dy: aimNow.dy, de: aimNow.de, err: aimNow.err, elev: aimNow.elev }),
  release() { act.release('pointer'); },
  // Jump the clock by t seconds.
  // The rock and the charge catch up.
  jump(t) { simT += t; U.uTime.value = simT; stepAst(t); stepAim(t, true); stepCharge(Math.min(t, 0.1)); frame(); draw(); },
  setS(v) { ast.s = v; ast.state = v >= 1 ? 'hold' : 'approach'; placeAst(); astSize(); stepAim(0, true); frame(); draw(); },
  charged: () => U.uCharge.value,
  chaos: () => chaos,
  audio: () => ({ state: kit.ac?.state ?? null, hum: !!hum, bed: !!bed, pend: pend.size, voices: hum ? hum.voices.length : 0, locked: !!hum?.locked, sour: hum ? hum.sour : 0 }),
  mute(on) { sound.set(!on); },
  shoot(c) { fire(c); frame(); draw(); },
  // Freeze the clock, then run it t seconds in frame steps.
  // A frozen page draws even when hidden, for stills from a background tab.
  freeze(on = true) { qaFreeze = on; if (on) visible = true; },
  run(t, dt = 1 / 30) { for (let k = 0; k < t - 1e-6; k += dt) { stepSpin(dt); const sdt = dt * spinSpeed(); simT += sdt; U.uTime.value = simT; stepAst(sdt); stepAim(sdt); stepCharge(sdt); stepShot(sdt); stepCase(sdt); easeLook(dt); } frame(); draw(); },
  shot: () => (shot ? { age: simT - shot.t0, T: shot.T, hitT: shot.hitT, hit: shot.hit, arrive: shot.arrive, sfx: shot.sfx } : null),
  // Free aim: lay the gun at yaw and elevation in degrees.
  aimFree(y, e) { ui.setting('aim').set('free', true); if (y != null) { manual.yaw = rad(y); manual.elev = rad(e); } },
  // The muzzle in CSS pixels, for cropped stills.
  // Any barrel point in CSS pixels: a along, x across, u up.
  screenOf(a, x = 0, u = 0) { const p = barrelPt(a, x, u, new THREE.Vector3()).project(camera), r = canvas.getBoundingClientRect(); return { x: r.left + (p.x * 0.5 + 0.5) * r.width, y: r.top + (0.5 - p.y * 0.5) * r.height }; },
  muzzleScreen() { const p = MUZZLE.clone().project(camera), r = canvas.getBoundingClientRect(); return { x: r.left + (p.x * 0.5 + 0.5) * r.width, y: r.top + (0.5 - p.y * 0.5) * r.height }; },
  spent: () => (spent ? { y: spent.p.y, bounce: spent.bounce, landed: spent.lt >= 0, r: Math.hypot(spent.p.x, spent.p.z), visible: caseMesh.visible } : null),
  resetReady: () => resetOn,
  dust: () => ({ charge: chargeDust.visible, shot: shotDust.visible, kase: caseDustV.visible }),
  chunkSegs: () => chunks.map(ch => ch.segs.map(t => (t.m.visible ? [t.pu.uX0.value | 0, t.pu.uSeg.value | 0] : null))),
  // Pose the blast on the clouds t seconds after a hit at the rock.
  blast(t) { hitFlash = Math.exp(-t / 0.4) + 0.3 * Math.exp(-t / 5); U.uHit.value.w = hitFlash; U.uHitP.value.set(ast.pos.x, ast.pos.y, ast.pos.z, simT - t); U.uHitR.value = ast.R; U.uBlast.value.set(ast.pos.x, ast.pos.y, ast.pos.z, hitFlash); U.uBk.value = 1; frame(); draw(); },
};

// The gun's meshes, for model exports from a dev script.
window.__models = () => ({ gun, flapMesh, portMesh, frameMesh });
/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
sun(sunDeg(opts.sun));
seedFrags();
placeAst();
astSize();
stepAim(0, true);
prewarmEmbers();
setBox(ui.setting('letterbox').value);
// A stored Free aim takes the gun from where it parks.
setAimMode(ui.setting('aim').value);
// The stored graphics settings apply before the first frame.
gfx.res = ui.setting('res').value; gfx.detail = DETAIL[ui.setting('detail').value] || 1; gfx.bloom = ui.setting('bloom').value; gfx.fxaa = ui.setting('fxaa').value;
gfx.tone = ui.setting('tone').value; gfx.exp = ui.setting('exposure').value; gfx.con = ui.setting('contrast').value; gfx.sat = ui.setting('saturation').value;
setBloom(); setTone();
setGrain();
resize();
renderer.compileAsync(scene, camera).then(async () => {
  // Warm every hidden piece once behind the intro.
  // The first charge, shot and hit then link no programs and upload no buffers.
  const hidden = [];
  scene.traverse(o => { if ((o.isMesh || o.isPoints) && !o.visible) { hidden.push(o); o.visible = true; } });
  // A failed warm-up falls through to the normal start; the first shot then warms itself.
  try { await renderer.compileAsync(scene, camera); composer.render(); } catch (err) { console.warn('railgun warm-up', err); }
  for (const o of hidden) o.visible = false;
  // The shot's sound files download now; they decode on first use.
  later(() => Object.values(SAMPLES).forEach(f => fetch(f)));
  compiled = true;
  draw();
  canvas.classList.add('on');
  markReady();
  wake();
}, err => {
  stage.querySelector('.fail').hidden = false; ui.hideControls(); markReady();
  throw err;
});
</script>
