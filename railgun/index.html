<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.13 0.014 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Railgun</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Railgun: one colossal gun under a looming rock. */
:root { --stage: oklch(0.11 0.02 265); }
.stage--railgun canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--railgun canvas.on { opacity: 1; }
.stage--railgun.held canvas { cursor: grabbing; }
@media (prefers-reduced-motion: reduce) { .stage--railgun canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Railgun</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--railgun" id="stage" tabindex="0" role="application" aria-label="A colossal railgun at dusk. A burning asteroid hangs beyond its muzzle. Hold to charge, release to fire, drag to look around.">
      <p class="fail" hidden>Railgun needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Railgun</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { createNoise3D } from 'simplex-noise';
import { gsap } from 'gsap';
import { initPage, whenVisible, pixelRatio, onQuality, linFit, reduced, onReducedChange, quality, audioKit, sound } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

/* ---------- settings ---------- */
const store = {
  get(k) { try { return localStorage.getItem(`stimming.railgun.${k}`); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(`stimming.railgun.${k}`, String(v)); } catch { /* storage off */ } },
};
// Each size: first and last angular diameter in degrees, approach seconds, shard count, rumble gain.
const SIZES = {
  boulder: { th0: 0.8, thMax: 8, T: 60, shards: 24, rumble: 0.7 },
  mountain: { th0: 1.4, thMax: 14, T: 90, shards: 40, rumble: 1.0 },
  moon: { th0: 2.2, thMax: 22, T: 120, shards: 56, rumble: 1.3 },
};
const opts = {
  size: store.get('size') in SIZES ? store.get('size') : 'mountain',
  dusk: Number.isFinite(+store.get('dusk')) && store.get('dusk') !== null ? Math.min(1, Math.max(0, +store.get('dusk'))) : 0.5,
};

/* ---------- bar ---------- */
// The hold is the toy: no action chips.
const act = { press() {}, release() {} };
const ui = initPage({ id: 'railgun', bar: {
  choice: {
    label: 'Asteroid', value: opts.size,
    options: [{ value: 'boulder', label: 'Boulder' }, { value: 'mountain', label: 'Mountain' }, { value: 'moon', label: 'Moon' }],
    onPick: v => { opts.size = v; store.set('size', v); retune(); },
  },
  // Dusk moves the sun from 18 to 7 degrees under the horizon.
  slider: { label: 'Dusk', min: 0, max: 1, step: 0.005, value: opts.dusk, onInput: v => { opts.dusk = v; store.set('dusk', v); setDusk(); } },
  settings: [
    { type: 'toggle', id: 'letterbox', label: 'Letterbox', value: false, persist: true, onToggle: on => setBox(on) },
    { type: 'toggle', id: 'dolly', label: 'Dolly', value: true, persist: true, onToggle: () => wake() },
    { type: 'slider', id: 'grain', label: 'Grain', min: 0, max: 2, step: 0.05, value: 1, persist: true, onInput: () => setGrain() },
  ],
  quality: true,
  keys: [['hold', 'charge'], ['release', 'fire'], ['drag', 'look around'], ['space', 'charge']],
} });

const stage = document.getElementById('stage');
let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

// Seeded random keeps the gun the same on every load.
let seed = 7331;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rad = THREE.MathUtils.degToRad;
const clamp = THREE.MathUtils.clamp;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; ui.hideControls(); markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setClearColor(0x000000, 1);
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, 1, 0.5, 60000);
camera.rotation.order = 'YXZ';
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = +new URLSearchParams(location.search).get('rung') || 0;

/* ---------- the gun's axis ---------- */
// One unit is one metre. The breech sits at the origin.
// The barrel climbs at 24 degrees toward negative z, 1,400 m long.
const ELEV = rad(24), L = 1400, GAP = 28, RW = 22, RH = 34, BASE_Y = 30;
const AX = new THREE.Vector3(0, Math.sin(ELEV), -Math.cos(ELEV));
const AX_UP = new THREE.Vector3(0, Math.cos(ELEV), Math.sin(ELEV));
const A0 = new THREE.Vector3(0, BASE_Y, 0);
const axisAt = (s, out) => out.copy(A0).addScaledVector(AX, L * s);
// The asteroid hangs 5 km out along the axis.
const DA = 5000;

/* ---------- uniforms ---------- */
const BLUE = linFit(0.82, 0.12, 225), AMBER = linFit(0.78, 0.17, 50);
const U = {
  uTime: { value: 0 },
  uSun: { value: new THREE.Vector3(0, -0.1, -1) },
  uDawn: { value: 0 },
  uNight: { value: 0.5 },
  uAmb: { value: new THREE.Vector3() },
  uGlowC: { value: new THREE.Vector3() },
  // Haze: density per metre, and the height where it thins.
  uHaze: { value: 0.00035 },
  uHazeH: { value: 400 },
  uWisp: { value: new THREE.Vector3(Math.random() * 200, Math.random() * 200, 0.3 + Math.random() * 0.5) },
  // The charge draws light out of the air.
  uDraw: { value: 0 },
  // The asteroid: direction from the eye, light strength; its angular radius.
  uAst: { value: new THREE.Vector4(0, 1, 0, 0) },
  uAstR: { value: 0.05 },
  uAstC: { value: new THREE.Vector3(...AMBER) },
  // The bolt: world position and strength. The hit: direction and strength.
  uBolt: { value: new THREE.Vector4(0, 0, 0, 0) },
  uBoltC: { value: new THREE.Vector3(...linFit(0.9, 0.08, 225)) },
  uHit: { value: new THREE.Vector4(0, 1, 0, 0) },
  // Charge level, chase station, chase half width, muzzle flash.
  uCharge: { value: 0 },
  uChase: { value: 0 },
  uChaseW: { value: 0.25 },
  uFire: { value: 0 },
  uBlue: { value: new THREE.Vector3(...BLUE) },
  uAxisA: { value: A0 },
  uAxisD: { value: AX },
  uAxisUp: { value: AX_UP },
  uL: { value: L },
  // The Mach ring on the ground: centre x, z, radius, strength.
  uShock: { value: new THREE.Vector4(0, 0, 0, 0) },
};

/* ---------- dusk: a sun below the horizon ---------- */
// The sun sits ahead and to the right, under the rock.
const SUN_AZ = new THREE.Vector2(0.55, -0.83).normalize();
const SKY = {
  zen: [0.018, 0.04, 0.13], low: [0.05, 0.055, 0.085], rose: [0.24, 0.075, 0.09],
  amber: [1.5, 0.34, 0.03], ember: [0.9, 0.16, 0.02], belt: [0.18, 0.08, 0.12],
};
const v3 = a => `vec3(${a.map(x => x.toFixed(4)).join(', ')})`;
const skyB = t => 0.06 + 0.94 * t * t;
function dusk(deg) {
  const t = clamp((9 - deg) / 8, 0, 1);
  const n = clamp((deg - 9) / 9, 0, 1);
  const r = rad(deg);
  U.uSun.value.set(SUN_AZ.x * Math.cos(r), -Math.sin(r), SUN_AZ.y * Math.cos(r));
  U.uDawn.value = t;
  U.uNight.value = n;
  const B = skyB(t) * (1 - 0.8 * n);
  U.uAmb.value.set(...SKY.zen.map((z, i) => B * (z * (0.6 + 0.6 * t) + SKY.low[i] * 0.45)));
  const glow = SKY.amber.map((a, i) => a + (SKY.ember[i] - a) * (1 - t));
  U.uGlowC.value.set(...glow.map(g => B * g * 0.35 * (1 - 0.7 * n)));
  renderer.toneMappingExposure = 2.1 - 1.25 * t + 0.3 * n;
}
// The slider runs from night (18° down) to the last of the dusk (7°).
const duskDeg = v => 7 + 11 * Math.pow(1 - v, 2);
const setDusk = () => { dusk(duskDeg(opts.dusk)); draw(); };

/* ---------- K2: noise ---------- */
// Lifted from Marsh launch, which lifted it from Fireworks.
const K2_NOISE = /* glsl */`
float k2hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float k2noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(k2hash(i), k2hash(i + vec2(1, 0)), u.x), mix(k2hash(i + vec2(0, 1)), k2hash(i + vec2(1, 1)), u.x), u.y);
}
float k2fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * k2noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s;
}
// Three-dimensional value noise for rock.
float k3hash(vec3 p) { p = fract(p * vec3(123.34, 456.21, 789.12)); p += dot(p, p.yzx + 45.32); return fract((p.x + p.y) * p.z); }
float k3noise(vec3 p) {
  vec3 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  float a = mix(mix(k3hash(i), k3hash(i + vec3(1, 0, 0)), u.x), mix(k3hash(i + vec3(0, 1, 0)), k3hash(i + vec3(1, 1, 0)), u.x), u.y);
  float b = mix(mix(k3hash(i + vec3(0, 0, 1)), k3hash(i + vec3(1, 0, 1)), u.x), mix(k3hash(i + vec3(0, 1, 1)), k3hash(i + vec3(1, 1, 1)), u.x), u.y);
  return mix(a, b, u.z);
}
float k3fbm(vec3 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++) { s += a * k3noise(p); p = p * 2.07 + vec3(11.3, 7.1, 5.9); a *= 0.5; }
  return s;
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: sky ---------- */
// Kept from Marsh launch: dusk glow, stars, wisps.
// New: the draw dims the air, the rock, the bolt and the hit light it.
const K2_SKY = /* glsl */`
uniform float uDawn;
uniform float uNight;
uniform vec3 uWisp;
uniform float uDraw;
uniform vec4 uAst;
uniform float uAstR;
uniform vec3 uAstC;
uniform vec4 uBolt;
uniform vec3 uBoltC;
uniform vec4 uHit;
vec3 wisps(vec3 dir, vec3 col, float t, float cs) {
  if (dir.y < 0.015 || uWisp.z < 0.01) return col;
  vec2 p = dir.xz / dir.y * 7.0;
  float n = k2noise(vec2(p.x * 0.045, p.y * 0.3) + uWisp.xy) * 0.6 + k2noise(vec2(p.x * 0.16, p.y * 1.3) + uWisp.yx) * 0.4;
  float d = smoothstep(0.78 - 0.08 * uWisp.z, 0.95, n) * smoothstep(0.015, 0.07, dir.y) * (1.0 - smoothstep(0.25, 0.45, dir.y));
  if (d < 0.002) return col;
  vec3 glowC = mix(vec3(0.55, 0.3, 0.32), vec3(1.0, 0.55, 0.35), pow(max(cs, 0.0), 3.0));
  vec3 cloud = mix(col * 0.85 + vec3(0.002, 0.002, 0.004), glowC * (0.05 + 0.5 * t * t), smoothstep(0.2, 0.9, t) * (0.35 + 0.65 * max(cs, 0.0)));
  return mix(col, cloud, d * 0.5);
}
// The burning rock lights the air round it; the halo widens with its size.
vec3 astGlow(vec3 dir) {
  float ang = acos(clamp(dot(dir, uAst.xyz), -1.0, 1.0));
  float out_ = max(ang - uAstR, 0.0);
  return uAstC * uAst.w * (0.05 * exp(-out_ / (uAstR * 0.8)) + 0.012 * exp(-out_ / (uAstR * 3.0)));
}
// Air round the bolt glows; a view ray collects it.
vec3 boltGlow(vec3 dir) {
  if (uBolt.w < 0.001) return vec3(0.0);
  vec3 v = uBolt.xyz - cameraPosition;
  float c = dot(dir, normalize(v)) - 1.0;
  return uBoltC * uBolt.w * (0.08 * exp(c * 900.0) + 0.02 * exp(c * 60.0));
}
vec3 hitGlow(vec3 dir) {
  if (uHit.w < 0.001) return vec3(0.0);
  float c = dot(dir, uHit.xyz) - 1.0;
  return uAstC * uHit.w * (0.12 * exp(c * 40.0) + 0.03 * exp(c * 5.0));
}
float k2stars(vec3 dir) {
  vec2 q = vec2(atan(dir.x, -dir.z) * 260.0, dir.y * 260.0);
  vec2 i = floor(q), f = fract(q) - 0.5;
  float h = k2hash(i);
  float on = step(0.995, h);
  vec2 o = vec2(k2hash(i + 7.1), k2hash(i + 3.3)) - 0.5;
  return on * exp(-dot(f - o * 0.6, f - o * 0.6) * 60.0) * (0.02 + 0.05 * k2hash(i + 1.7));
}
vec3 k2sky(vec3 dir) {
  float t = uDawn, up = max(dir.y, 0.0);
  vec2 sh = normalize(uSun.xz), dh = normalize(dir.xz + vec2(1e-5));
  float cs = dot(dh, sh);
  float near = pow(cs * 0.5 + 0.5, 4.0), tight = pow(max(cs, 0.0), 8.0);
  vec3 col = ${v3(SKY.zen)} * (0.6 + 0.6 * t);
  col += ${v3(SKY.low)} * exp(-up * 5.0);
  col += ${v3(SKY.rose)} * near * exp(-up * 6.0) * (0.4 + 0.6 * t);
  vec3 glow = mix(${v3(SKY.ember)}, ${v3(SKY.amber)}, t);
  col += glow * (0.3 * near + 0.9 * tight) * exp(-up * (30.0 - 16.0 * t));
  float anti = pow(max(-cs, 0.0), 2.0);
  col *= 1.0 - 0.35 * anti * exp(-up * 12.0) * t;
  col += ${v3(SKY.belt)} * anti * exp(-pow((up - 0.12) / 0.07, 2.0)) * t;
  col *= 0.06 + 0.94 * t * t;
  col *= 1.0 - 0.8 * uNight;
  // The draw: the air darkens and the stars hold.
  col *= 1.0 - 0.55 * uDraw;
  float dark = (1.0 - t) * (1.0 - t) * (1.0 + 2.0 * uNight);
  col += vec3(0.85, 0.9, 1.0) * k2stars(dir) * smoothstep(0.03, 0.25, dir.y) * dark * 1.5 * (1.0 - 0.2 * uDraw);
  return wisps(dir, col, t, cs) + astGlow(dir) + boltGlow(dir) + hitGlow(dir);
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: haze ---------- */
const K2_HAZE = /* glsl */`
uniform float uHaze;
uniform float uHazeH;
float k2hazeAmount(vec3 P) {
  vec3 v = P - cameraPosition;
  float dist = length(v);
  float k = 1.0 / uHazeH;
  float h0 = max(cameraPosition.y, 0.0), h1 = max(P.y, 0.0), dh = h1 - h0;
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);
  return 1.0 - exp(-dist * uHaze * max(avg, 0.0));
}
vec3 k2hazeColor(vec3 dir) { return k2sky(normalize(vec3(dir.x, 0.015, dir.z))) * 0.9; }
vec3 k2haze(vec3 c, vec3 P) {
  return mix(c, k2hazeColor(normalize(P - cameraPosition)), k2hazeAmount(P));
}`;
/* ---------- end K2 ---------- */

// Shared lighting: the sky's ambient, the rock's key and the charge's point light.
const LIGHT = /* glsl */`
uniform vec3 uAmb, uGlowC;
uniform float uCharge, uChase, uChaseW, uFire, uL;
uniform vec3 uBlue, uAxisA, uAxisD, uAxisUp;
// Hemisphere ambient: more from above.
vec3 ambient(vec3 N) {
  vec3 fill = (uAmb * 1.4 + vec3(0.16, 0.19, 0.3)) * (0.55 + 0.45 * N.y);
  // The dusk glow on the horizon lights the faces that look at it.
  vec3 sh = normalize(vec3(uSun.x, 0.0, uSun.z));
  return fill + uGlowC * 6.0 * max(dot(N, sh), 0.0) * (1.0 - 0.6 * max(N.y, 0.0));
}
// Light from behind the gun catches its edges: the rock's and the dusk's.
vec3 rim(vec3 N, vec3 P) {
  vec3 V = normalize(cameraPosition - P);
  float f = pow(1.0 - abs(dot(N, V)), 2.5);
  return f * (uAstC * uAst.w * 0.5 + uGlowC * 3.0);
}
// The rock lights what faces it.
vec3 keyLight(vec3 N) { return uAstC * uAst.w * max(dot(N, uAst.xyz), 0.0); }
// The charge glows from wherever the chase is on the axis.
vec3 chargeLight(vec3 P, vec3 N) {
  vec3 cp = uAxisA + uAxisD * uL * uChase;
  vec3 v = cp - P;
  float d2 = dot(v, v);
  float k = (uCharge * uCharge * 40.0 + uFire * 160.0) * 2500.0 / (d2 + 2500.0);
  return uBlue * k * max(dot(N, v * inversesqrt(d2 + 1.0)), 0.0);
}`;
const HEAD = `${K2_NOISE}\nuniform vec3 uSun;\n${K2_SKY}\n${K2_HAZE}\n${LIGHT}`;

/* ---------- sky dome ---------- */
const sky = new THREE.Mesh(new THREE.SphereGeometry(20000, 48, 24), new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false,
  vertexShader: /* glsl */`varying vec3 vP; void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`varying vec3 vP; ${HEAD} void main() { gl_FragColor = vec4(k2sky(normalize(vP - cameraPosition)), 1.0); }`,
}));
sky.renderOrder = -1;
scene.add(sky);

/* ---------- ground: a dark plateau ---------- */
const GROUND_C = linFit(0.22, 0.012, 60);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30000, 30000).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  uniforms: { ...U, uGroundC: { value: new THREE.Vector3(...GROUND_C) } },
  vertexShader: /* glsl */`varying vec3 vP; void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`
  varying vec3 vP;
  uniform vec3 uGroundC;
  uniform vec4 uShock;
  ${HEAD}
  void main() {
    vec3 N = vec3(0.0, 1.0, 0.0);
    float grit = k2fbm(vP.xz * 0.02) * 0.6 + k2noise(vP.xz * 0.3) * 0.4;
    vec3 alb = uGroundC * (0.6 + 0.8 * grit);
    // The breech apron is fused glass: a shade lighter.
    float apron = smoothstep(140.0, 40.0, length(vP.xz));
    alb *= 1.0 + 0.12 * apron;
    vec3 col = alb * (ambient(N) + keyLight(N) + chargeLight(vP, N));
    // The Mach ring: a thin bright front, compressed air dark behind it.
    float r = length(vP.xz - uShock.xy);
    float sw = 4.0 + 0.05 * uShock.z;
    float shock = exp(-(r - uShock.z) * (r - uShock.z) / (2.0 * sw * sw));
    float inside = smoothstep(uShock.z, uShock.z - sw * 3.0, r);
    col *= 1.0 - 0.4 * uShock.w * inside * (1.0 - shock);
    col += vec3(0.6) * shock * uShock.w * 0.6;
    gl_FragColor = vec4(k2haze(col, vP), 1.0);
  }`,
}));
scene.add(ground);

/* ---------- the gun: two rails, a breech, nine cradles ---------- */
// Every piece is a chipped box; one merged mesh, one draw call.
// aPart: station along the barrel, rail flag, inner-face flag, seed.
const noise3 = createNoise3D(rnd);
const CRADLES = 4;
function chip(geo) {
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    // Offsets come from position alone, so shared corners stay joined.
    const a = 0.04, b = 0.11;
    const dx = noise3(v.x * a, v.y * a, v.z * a) * 0.9 + noise3(v.x * b + 31, v.y * b, v.z * b) * 0.3;
    const dy = noise3(v.x * a + 57, v.y * a, v.z * a) * 0.9 + noise3(v.x * b, v.y * b + 13, v.z * b) * 0.3;
    const dz = noise3(v.x * a, v.y * a + 91, v.z * a) * 0.9 + noise3(v.x * b, v.y * b, v.z * b + 71) * 0.3;
    p.setXYZ(i, v.x + dx, v.y + dy, v.z + dz);
  }
  return geo;
}

  const wy = wk * (0.0026 * Math.sin(t * 0.61) + 0.0012 * Math.sin(t * 1.73 + 1.3) + 0.0005 * Math.sin(t * 4.9 + 0.3) + jit());
  const wp = wk * (0.002 * Math.sin(t * 0.83 + 0.4) + 0.001 * Math.sin(t * 2.11) + 0.0005 * Math.sin(t * 6.3 + 2.1) + jit());
  const wr = wk * (0.0014 * Math.sin(t * 0.47 + 2.0) + 0.0004 * Math.sin(t * 3.7));
  camera.rotation.set(baseUp + look.pitch + cam.kickP + wp, yaw0 + look.yaw + cam.kickY + wy, wr);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
}
function easeLook(dt) {
  const e = 1 - Math.exp(-dt * (reduced() ? 12 : 6));
  look.yaw += (lookTo.yaw - look.yaw) * e;
  look.pitch += (lookTo.pitch - look.pitch) * e;
}
// The rock's direction and light, as the shaders see them.
const tmpA = new THREE.Vector3();
function aimAst() {
  tmpA.subVectors(ast.pos, camera.position);
  const dist = tmpA.length();
  tmpA.divideScalar(dist);
  const k = SIZES[opts.size];
  const near = ast.th / rad(k.thMax);
  U.uAst.value.set(tmpA.x, tmpA.y, tmpA.z, (0.5 + 2.5 * near * near) * astMat.uniforms.uBurn.value);
  U.uAstR.value = Math.atan(ast.R / dist);
  PU.uAstRad.value = ast.R;
}

function resize() {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  // Rung 1 drops the pixel ratio; rung 2 drops multisampling and shrinks the bloom.
  size = { w, h, dpr: pixelRatio(w, h, { maxDpr: 1.5, budget: 1.6e6, low: rung >= 1 }) };
  renderer.setPixelRatio(size.dpr);
  renderer.setSize(w, h, false);
  setSamples(rung >= 2 ? 0 : 4);
  composer.setPixelRatio(size.dpr);
  composer.setSize(w, h);
  grade.uniforms.uRes.value.set(w * size.dpr, h * size.dpr);
  lightMat.uniforms.uDpr.value = size.dpr;
  lightMat.uniforms.uRes.value.set(w * size.dpr, h * size.dpr);
  // Rung 2 halves the plume; rung 3 drops the ember cracks.
  plumeGeo.instanceCount = rung >= 2 ? 24 : QN;
  astMat.uniforms.uCracks.value = rung >= 3 ? 0 : 1;
  frame();
  draw();
}
let visible = !document.hidden;
let compiled = false, drawN = 0;
function draw() {
  if (!visible || !compiled) return;
  drawN++;
  astMesh.rotateOnAxis(ast.spin, 0.0012);
  aimAst();
  if (!reduced()) grade.uniforms.uSeed.value = (grade.uniforms.uSeed.value % 997) + 1;
  composer.render();
}

/* Frame loop: 30 fps, idle or not; it sleeps 60 s after the last input. */
const SLEEP = +new URLSearchParams(location.search).get('sleep') || 60000;
const FRAME = 1000 / 30;
let nap = 0, raf = 0, lastT = 0, lastDraw = 0, lastInput = performance.now();
const busy = () => !!press || Math.abs(lookTo.yaw - look.yaw) + Math.abs(lookTo.pitch - look.pitch) > 1e-4;
function tick(now) {
  raf = 0;
  if (!visible || document.hidden) { lastT = 0; return; }
  const dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0;
  lastT = now;
  const awake = !reduced() && now - lastInput < SLEEP;
  pace = awake ? Math.min(1, pace + dt / 2) : Math.max(0, pace - dt / 2);
  const lively = busy();
  try {
    simT += dt;
    U.uTime.value = simT;
    easeLook(dt);
    if (now - lastDraw >= FRAME - 2) {
      frame();
      draw();
      watch(now, lively);
      lastDraw = now - lastDraw > FRAME * 3 ? now : lastDraw + FRAME;
    }
  } finally {
    if (visible && lively) raf = requestAnimationFrame(tick);
    else if (visible && pace > 0) { raf = -1; nap = setTimeout(() => { nap = 0; raf = requestAnimationFrame(tick); }, Math.max(0, lastDraw + FRAME - 18 - performance.now())); }
    else { lastT = 0; draw(); kit.rest(() => !busy() && !pending()); }
  }
}
function wake() {
  lastInput = performance.now();
  if (nap) { clearTimeout(nap); nap = 0; raf = 0; }
  if (!raf && visible && !document.hidden) raf = requestAnimationFrame(tick);
}
/* Performance ladder: slow frames step quality down a rung, never back up. */
let watchFrom = 0, watchN = 0, watchSum = 0, prevDraw = 0;
function watch(now, lively) {
  const gap = now - prevDraw;
  prevDraw = now;
  if (gap > 200) { watchFrom = now; watchN = watchSum = 0; return; }
  if (!watchFrom) watchFrom = now;
  if (now - watchFrom < 4000) return;
  watchN++; watchSum += gap;
  if (watchN < 2 || now - watchFrom < 6000) return;
  // Frames come every 33 ms by design; past 48 is slow.
  if (watchSum / watchN > (lively ? 48 : 70) && rung < 3) { rung++; resize(); }
  watchFrom = now - 4000; watchN = watchSum = 0;
}
whenVisible(stage, vis => {
  visible = vis;
  if (!vis) {
    cancelAnimationFrame(raf); clearTimeout(nap); raf = 0; nap = 0; lastT = 0; stopAll();
    kit.ac?.suspend()?.catch(() => {});
    return;
  }
  draw();
  wake();
});
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
onReducedChange(() => wake());

/* ---------- sound scaffolding ---------- */
const kit = audioKit({ keys: new Set([' ']) });
const pend = new Set();
function track(end, ...nodes) { pend.add({ end, nodes }); }
function prune() { const now = kit.ac?.currentTime ?? 0; for (const h of pend) if (h.end < now) pend.delete(h); }
const pending = () => { prune(); return pend.size > 0; };
function stopAll() {
  for (const h of pend) for (const n of h.nodes) { try { n.stop?.(); } catch { /* not started */ } try { n.disconnect(); } catch { /* gone */ } }
  pend.clear();
}

/* Pointer: a press charges; a drag past 8 px also looks around; any release fires. */
let press = null;
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture(e.pointerId);
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, yaw: lookTo.yaw, pitch: lookTo.pitch, at: performance.now(), drag: false };
  if (sound.on) kit.wake();
  act.press();
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  const dx = e.clientX - press.x, dy = e.clientY - press.y;
  if (!press.drag && Math.hypot(dx, dy) > 8) { press.drag = true; stage.classList.add('held'); }
  if (!press.drag) return;
  const k = rad(camera.fov) / size.h;
  lookTo.yaw = clamp(press.yaw + dx * k, -0.3, 0.3);
  lookTo.pitch = clamp(press.pitch + dy * k, -0.15, 0.35);
});
const end = e => {
  if (!press || e.pointerId !== press.id) return;
  press = null;
  stage.classList.remove('held');
  act.release();
  wake();
};
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);
// Space holds the charge; the shell ignores it while a sheet has focus.
let spaceDown = false;
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat || e.target.closest?.('input, button, .s2-sheet')) return;
  e.preventDefault();
  spaceDown = true;
  if (sound.on) kit.wake();
  act.press();
  wake();
});
document.addEventListener('keyup', e => {
  if (e.code !== 'Space' || !spaceDown) return;
  spaceDown = false;
  act.release();
  wake();
});
addEventListener('blur', () => { if (spaceDown) { spaceDown = false; act.release(); } });

function setBox(on) { grade.uniforms.uBox.value = on ? 1 : 0; draw(); }
function setGrain() { grade.uniforms.uGrain.value = POST.grain * ui.setting('grain').value; draw(); }

/* QA hooks: Dusk, the sim clock, draw count. Not for the UI. */
window.__qa = {
  dusk(v) { opts.dusk = v; setDusk(); },
  simT: () => simT,
  draws: () => drawN,
  info: () => ({ ...renderer.info.render }),
  size: v => { opts.size = v; retune(); },
  ast: () => ({ s: ast.s, state: ast.state, R: ast.R, th: THREE.MathUtils.radToDeg(ast.th) }),
};

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
dusk(duskDeg(opts.dusk));
placeAst();
astSize();
setBox(ui.setting('letterbox').value);
setGrain();
resize();
renderer.compileAsync(scene, camera).then(() => {
  compiled = true;
  draw();
  canvas.classList.add('on');
  markReady();
  wake();
}, err => {
  stage.querySelector('.fail').hidden = false; ui.hideControls(); markReady();
  throw err;
});
</script>
</body>
</html>
