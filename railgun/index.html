<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",

  }
}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { createNoise3D } from 'simplex-noise';
import { initPage, whenVisible, pixelRatio, onQuality, linFit, reduced, onReducedChange, quality, audioKit, sound } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

/* ---------- settings ---------- */
const store = {
  get(k) { try { return localStorage.getItem(`stimming.railgun.${k}`); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(`stimming.railgun.${k}`, String(v)); } catch { /* storage off */ } },
};
// Per size: radius in metres, fall seconds, shard count, rumble gain.
const SIZES = {
  boulder: { R: 600, T: 220, shards: 24, rumble: 0.7 },
  mountain: { R: 1000, T: 300, shards: 40, rumble: 1.0 },
  moon: { R: 1700, T: 380, shards: 56, rumble: 1.3 },
};
const opts = {
  size: store.get('size') in SIZES ? store.get('size') : 'mountain',
  // Time of day, 0 for night to 1 for noon.
  // It has its own key: the old Sun key had a narrower range.
  sun: Number.isFinite(+store.get('time')) && store.get('time') !== null ? Math.min(1, Math.max(0, +store.get('time'))) : 0.5,
};

/* ---------- bar ---------- */
// The hold is the toy: no action chips.
const act = { press() {}, release() {} };
const ui = initPage({ id: 'railgun', bar: {
  choice: {
    label: 'Asteroid', value: opts.size,
    options: [{ value: 'boulder', label: 'Boulder' }, { value: 'mountain', label: 'Mountain' }, { value: 'moon', label: 'Moon' }],
    onPick: v => { opts.size = v; store.set('size', v); retune(); },
  },
  // Time runs from a starry night to a high noon sun.
  slider: { label: 'Time', min: 0, max: 1, step: 0.002, value: opts.sun, onInput: v => { opts.sun = v; store.set('time', v); setSun(); } },
  settings: [
    { type: 'toggle', id: 'letterbox', label: 'Letterbox', value: false, persist: true, onToggle: on => setBox(on) },
    { type: 'slider', id: 'grain', label: 'Grain', min: 0, max: 2, step: 0.05, value: 1, persist: true, onInput: () => setGrain() },
  ],
  // Reset runs the days faster and faster, then cuts back to the start.
  actions: [{ verb: 'reset', key: 'R', onPress: () => resetToy() }],
  quality: true,
  keys: [['hold', 'charge'], ['release', 'fire'], ['drag', 'look around'], ['space', 'charge']],
} });

const stage = document.getElementById('stage');
let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

// Seeded random keeps the gun the same on every load.
let seed = 7331;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rad = THREE.MathUtils.degToRad;
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp = THREE.MathUtils.clamp;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; ui.hideControls(); markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setClearColor(0x000000, 1);
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, 1, 0.5, 300000);
camera.rotation.order = 'YXZ';
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = +new URLSearchParams(location.search).get('rung') || 0;

/* ---------- the gun's axis ---------- */
// One unit is one metre. The trunnion sits 215 m over the origin.
// The barrel climbs at 6 degrees toward negative z.
// Station 0 is the trunnion; station 1 is the muzzle, 900 m on.
const ELEV = rad(6), L = 900, TRUN_Y = 215;
const AX = new THREE.Vector3(0, Math.sin(ELEV), -Math.cos(ELEV));
const AX_UP = new THREE.Vector3(0, Math.cos(ELEV), Math.sin(ELEV));
const A0 = new THREE.Vector3(0, TRUN_Y, 0);
const axisAt = (s, out) => out.copy(A0).addScaledVector(AX, L * s);
// The bore starts behind the trunnion.
const BREECH = -0.25;
// The rock ends its fall 40 km out, low over the horizon.
// The bolt takes seconds to reach it.
const DA = 40000;
const yUp = new THREE.Vector3(0, 1, 0);
// The fall ends at END0; it starts FALL metres back along AWAY0.
const END0 = new THREE.Vector3(Math.sin(rad(1)) * Math.cos(ELEV), Math.sin(ELEV), -Math.cos(rad(1)) * Math.cos(ELEV)).multiplyScalar(DA).add(A0);
const AWAY0 = new THREE.Vector3(-12500, 12000, -3500).normalize();
const FALL = 17680;
// A point on the barrel: a metres along, x across, u up.
// SY and CY hold the mount's yaw, left of negative z.
let SE = Math.sin(ELEV), CE = Math.cos(ELEV), SY = 0, CY = 1;
const barrelPt = (a, x, u, out) => { const z = -a * CE + u * SE; return out.set(x * CY + z * SY, TRUN_Y + a * SE + u * CE, z * CY - x * SY); };
const MUZZLE = axisAt(1, new THREE.Vector3());

/* ---------- uniforms ---------- */
const BLUE = linFit(0.82, 0.12, 225), AMBER = linFit(0.78, 0.17, 50);
const U = {
  uTime: { value: 0 },
  // The sun: direction toward it, its colour, the zenith and the horizon.
  uSun: { value: new THREE.Vector3(0, 0.1, -1) },
  uSunC: { value: new THREE.Vector3() },
  uZenC: { value: new THREE.Vector3() },
  uHorC: { value: new THREE.Vector3() },
  uSunE: { value: 0.1 },
  // uSun is the key light: the sun by day, the moon by night.
  // uSunD is the true sun; it tints the sky glow.
  uSunD: { value: new THREE.Vector3(0, 0.1, -1) },
  uGlowC: { value: new THREE.Vector3() },
  uMoonD: { value: new THREE.Vector3(-0.58, 0.42, -0.69).normalize() },
  uMoonK: { value: 0 },
  uStars: { value: 0 },
  uStarT: null,
  // High cloud still holds the sun after it sets.
  uCloudSun: { value: new THREE.Vector3() },
  uCloudAmb: { value: new THREE.Vector3(0.22, 0.22, 0.22) },
  // The plain's light: slope gain and lift; a low sun needs both.
  uGLift: { value: new THREE.Vector2(4, 0.25) },
  // The hit: world position and the sim time of the hit.
  uHitP: { value: new THREE.Vector4(0, 0, 0, -1e6) },
  // Haze: dust per metre, and the height where it thins.
  uHaze: { value: 0.00013 },
  uHazeH: { value: 700 },
  uWisp: { value: new THREE.Vector3(Math.random() * 200, Math.random() * 200, 0.3 + Math.random() * 0.5) },
  // The asteroid: direction from the eye, light strength; its angular radius.
  uAst: { value: new THREE.Vector4(0, 1, 0, 0) },
  uAstR: { value: 0.05 },
  uAstC: { value: new THREE.Vector3(...AMBER) },
  // The bolt: world position and strength. The hit: direction and strength.
  uBolt: { value: new THREE.Vector4(0, 0, 0, 0) },
  uBoltC: { value: new THREE.Vector3(...linFit(0.9, 0.08, 225)) },
  uHit: { value: new THREE.Vector4(0, 1, 0, 0) },
  // Charge level, chase station, chase half width, muzzle flash.
  uCharge: { value: 0 },
  uRage: { value: 0 },
  uChase: { value: 0 },
  uChaseW: { value: 0.25 },
  uFire: { value: 0 },
  uAxisA: { value: A0 },
  uAxisD: { value: AX },
  uAxisUp: { value: AX_UP },
  uL: { value: L },
  // The barrel slides back along its axis, in metres.
  uRecoil: { value: 0 },
  // Cosine and sine of the barrel's drop below the firing angle.
  uDrop: { value: new THREE.Vector2(1, 0) },
  // The rest axis, and the cosine and sine of the mount's yaw.
  uAxis0: { value: AX.clone() },
  uYaw: { value: new THREE.Vector2(1, 0) },
  // The sun's depth map, its matrix and its bias.
  uShadowT: { value: null },
  uShadowM: { value: new THREE.Matrix4() },
  uShadowB: { value: 0.002 },
  // The brightest arc: position and strength.
  uArcL: { value: new THREE.Vector4(0, 0, 0, 0) },
  uMuzL: { value: new THREE.Vector4(0, 0, 0, 0) },
  // The Mach ring on the ground: centre x, z, radius, strength.
  uShock: { value: new THREE.Vector4(0, 0, 0, 0) },
  // The strength of the Rayleigh air.
  uAir: { value: 0.7 },
};
U.uStarT = U.uTime;

/* ---------- sun: late light over a dusty plain ---------- */
// The sun sits low on the right, a little ahead of the eye.
// It lights the near flank; shadows rake away to the left.
const SUN_AZ = new THREE.Vector2(0.62, -0.78).normalize();
const lerp3 = (a, b, t) => a.map((x, i) => x + (b[i] - x) * t);
const sstep = THREE.MathUtils.smoothstep;
const lerp = THREE.MathUtils.lerp;
// The moon: cool and dim, high on the left.
const MOON_C = [0.09, 0.11, 0.16];

/* ---------- sky: one turn a day about a tilted pole ---------- */
// Latitude thirty degrees: the equinox sun stands sixty degrees up at noon.
// The sun rises ahead and right, crosses the sky ahead and left, sets behind.
const PHI = rad(30);
const SKY = { E: new THREE.Vector3(SUN_AZ.x, 0, SUN_AZ.y).normalize(), S: new THREE.Vector3(), P: new THREE.Vector3() };
const skyFrame = () => {
  SKY.S.crossVectors(yUp, SKY.E);
  SKY.P.copy(yUp).multiplyScalar(Math.sin(PHI)).addScaledVector(SKY.S, -Math.cos(PHI));
};
// A direction on the sky at hour angle H and declination d.
function skyDir(H, d, out) {
  const cd = Math.cos(d), sd = Math.sin(d), cP = Math.cos(PHI), sP = Math.sin(PHI);
  out.copy(SKY.E).multiplyScalar(-Math.sin(H) * cd);
  out.addScaledVector(yUp, Math.cos(H) * cd * cP + sd * sP);
  return out.addScaledVector(SKY.S, Math.cos(H) * cd * sP - sd * cP);
}
// The morning hour angle where the sun stands deg degrees up.
const hourOf = deg => -Math.acos(clamp(Math.sin(rad(deg)) / Math.cos(PHI), -1, 1));
// Turn the frame so the dusk sun lands on the first look's bearing.
skyFrame();
{
  const d = skyDir(hourOf(5.6), 0, new THREE.Vector3());
  SKY.E.applyAxisAngle(yUp, Math.atan2(SKY.E.x, SKY.E.z) - Math.atan2(d.x, d.z));
  skyFrame();
}
// The moon runs six hours behind the sun, low in the south.
// At night on the slider it stands high on the left.
const MOON_H = rad(93.5), MOON_DEC = rad(-33.7);
const skyRot = new THREE.Matrix4();
U.uSkyRot = { value: new THREE.Matrix3() };
let skyH = 0;
function sun(deg) { skyAt(hourOf(deg)); }
function skyAt(H) {
  skyH = H;
  skyDir(H, 0, U.uSunD.value);
  const deg = THREE.MathUtils.radToDeg(Math.asin(clamp(U.uSunD.value.y, -1, 1)));
  const r = rad(deg);
  U.uSunE.value = r;
  skyDir(H + MOON_H, MOON_DEC, U.uMoonD.value);
  const moonUp = sstep(U.uMoonD.value.y, -0.02, 0.1);
  // The stars turn with the sky.
  U.uSkyRot.value.setFromMatrix4(skyRot.makeRotationAxis(SKY.P, -H));
  // Dusk: the first look, 0 to 15 degrees.
  // low: 0 at the horizon, 1 at fifteen degrees up.
  const low = clamp(deg / 15, 0, 1);
  let sunC = lerp3([1.6, 0.62, 0.22], [1.9, 1.75, 1.55], low).map(x => x * (0.55 + 0.45 * low));
  let zen = lerp3([0.10, 0.15, 0.30], [0.16, 0.30, 0.62], low);
  let hor = lerp3([0.78, 0.38, 0.17], [0.72, 0.68, 0.62], low);
  // Day: 15 to 60 degrees, toward a white noon.
  const day = sstep(deg, 15, 60);
  sunC = lerp3(sunC, [2.05, 2.0, 1.9], day);
  zen = lerp3(zen, [0.05, 0.16, 0.56], day);
  hor = lerp3(hor, [0.56, 0.65, 0.78], day);
  // Under the horizon: blue hour to -6, night to -14.
  const tw = sstep(deg, -6, 0), nt = sstep(deg, -14, -6);
  zen = lerp3(lerp3([0.004, 0.006, 0.016], [0.035, 0.06, 0.15], nt), zen, tw);
  hor = lerp3(lerp3([0.012, 0.015, 0.028], [0.2, 0.15, 0.2], nt), hor, tw);
  // The disc's light goes as it sets; the glow lasts to -10.
  const kS = sstep(deg, -1.5, 1.5);
  U.uGlowC.value.set(...sunC.map(x => x * sstep(deg, -10, 0)));
  // The moon takes the key light below -3 degrees.
  const mK = (1 - sstep(deg, -10, -3)) * moonUp;
  U.uMoonK.value = mK;
  U.uStars.value = 1 - sstep(deg, -10, -2);
  U.uSun.value.copy(deg > -3 ? U.uSunD.value : U.uMoonD.value);
  U.uSun.value.setY(Math.max(U.uSun.value.y, 0.02)).normalize();
  U.uSunC.value.set(...sunC.map((x, i) => x * kS + MOON_C[i] * mK));
  U.uZenC.value.set(...zen);
  U.uHorC.value.set(...hor);
  // Cloud nine kilometres up sees the sun to -6 degrees.
  U.uCloudSun.value.set(...sunC.map((x, i) => x * sstep(deg, -6, 1) + MOON_C[i] * mK * 0.3));
  U.uCloudAmb.value.setScalar(lerp(lerp(0.012, 0.05, nt), 0.22, tw));
  // A high sun needs no lift on the plain.
  U.uGLift.value.set(lerp(4, 1.1, day), lerp(0.25, 0.05, day));
  renderer.toneMappingExposure = lerp(lerp(2.2, 1.35, nt), 0.9, tw);
  fitShadow();
}
// The slider runs from night to noon.
// The knots keep dusk mid-slider, where the first look sat.
const TIME_K = [[0, -14], [0.18, -6], [0.32, 0], [0.5, 5.6], [0.72, 18], [1, 60]];
function sunDeg(v) {
  for (let i = 1; i < TIME_K.length; i++) {
    const [v0, d0] = TIME_K[i - 1], [v1, d1] = TIME_K[i];
    if (v <= v1) return lerp(d0, d1, (v - v0) / (v1 - v0));
  }
  return 60;
}
const setSun = () => { sun(sunDeg(opts.sun)); draw(); };

/* ---------- K2: noise ---------- */
// Lifted from Marsh launch, which lifted it from Fireworks.
const K2_NOISE = /* glsl */`
float k2hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float k2noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(k2hash(i), k2hash(i + vec2(1, 0)), u.x), mix(k2hash(i + vec2(0, 1)), k2hash(i + vec2(1, 1)), u.x), u.y);
}
float k2fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * k2noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s;
}
// Three-dimensional value noise for rock.
float k3hash(vec3 p) { p = fract(p * vec3(123.34, 456.21, 789.12)); p += dot(p, p.yzx + 45.32); return fract((p.x + p.y) * p.z); }
float k3noise(vec3 p) {
  vec3 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  float a = mix(mix(k3hash(i), k3hash(i + vec3(1, 0, 0)), u.x), mix(k3hash(i + vec3(0, 1, 0)), k3hash(i + vec3(1, 1, 0)), u.x), u.y);
  float b = mix(mix(k3hash(i + vec3(0, 0, 1)), k3hash(i + vec3(1, 0, 1)), u.x), mix(k3hash(i + vec3(0, 1, 1)), k3hash(i + vec3(1, 1, 1)), u.x), u.y);
  return mix(a, b, u.z);
}
float k3fbm(vec3 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++) { s += a * k3noise(p); p = p * 2.07 + vec3(11.3, 7.1, 5.9); a *= 0.5; }
  return s;
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: sky ---------- */
// A day sky replaces the night one.
// Zenith, horizon, dust band, the sun.
// Long cirrus streaks hang across it.
// New: the rock, the bolt and the hit light the air.
const K2_SKY = /* glsl */`
uniform vec3 uSunC, uZenC, uHorC;
uniform float uSunE;
uniform vec3 uSunD, uGlowC, uMoonD, uCloudSun, uCloudAmb;
uniform float uMoonK, uStars, uStarT;
uniform mat3 uSkyRot;
uniform vec3 uWisp;
uniform vec4 uAst;
uniform float uAstR;
uniform vec3 uAstC;
uniform vec4 uBolt;
uniform vec3 uBoltC;
uniform vec4 uHit;
uniform vec4 uHitP;
// The blast on a cloud at P: its light, the shock rim and the push.
// thin is 1 at a cloud's thin edge, where light shines through.
// The flash lights near cloud brightest; the shock reaches it first.
vec3 cloudHit(vec3 P, float thin, out float rim, out vec3 push) {
  rim = 0.0; push = vec3(0.0);
  float t = uStarT - uHitP.w;
  if (t < 0.0 || t > 40.0) return vec3(0.0);
  vec3 d = P - uHitP.xyz;
  float r = max(length(d), 1.0);
  vec3 n = d / r;
  // The flash: white first, then the fireball's amber.
  vec3 c = mix(vec3(1.0, 0.9, 0.78) * 1.6, uAstC, smoothstep(0.1, 2.0, t));
  float I = uHit.w * 5.0 / (1.0 + r * r / 2.0e8);
  // Light that passes through toward the eye: a silver edge.
  float fwd = pow(max(dot(n, normalize(cameraPosition - P)), 0.0), 5.0);
  vec3 L = c * I * (0.45 + 2.2 * fwd * thin);
  // The shock shell: fast at first, slow at sixty kilometres.
  float R = 60000.0 * (1.0 - exp(-t / 5.0));
  float w = 500.0 + 0.06 * R;
  float fade = exp(-t / 9.0);
  rim = exp(-(r - R) * (r - R) / (2.0 * w * w)) * fade;
  // Cloud behind the front is pushed out, then settles.
  push = n * smoothstep(R + w, R - 2.0 * w, r) * fade * (900.0 + 0.04 * R);
  return L;
}
// Cirrus: long streaks on one wind line, gathered in patches.
vec3 wisps(vec3 dir, vec3 col, float cs) {
  if (dir.y < 0.008) return col;
  // A flat layer nine kilometres up; q.x runs along the wind.
  vec2 p = dir.xz / (dir.y + 0.07);
  // The layer's point in the world, for the blast.
  vec3 Pc = cameraPosition + vec3(p.x, 0.0, p.y) * 9000.0 + vec3(0.0, 9000.0, 0.0);
  float rim; vec3 push;
  vec3 hl = cloudHit(Pc, 0.6, rim, push);
  p -= push.xz / 9000.0;
  vec2 q = vec2(dot(p, vec2(0.966, -0.259)), dot(p, vec2(0.259, 0.966))) + uWisp.xy;
  // Slow bends keep the streaks from running ruled.
  q.y += 1.6 * k2fbm(q * vec2(0.09, 0.25));
  float streak = k2fbm(vec2(q.x * 0.22, q.y * 3.4));
  float hair = k2noise(vec2(q.x * 0.7, q.y * 11.0));
  float bank = k2fbm(q * vec2(0.05, 0.22) + 31.0);
  float d = smoothstep(0.53, 0.8, streak + 0.14 * hair) * smoothstep(0.47 - 0.08 * uWisp.z, 0.66, bank);
  d *= smoothstep(0.015, 0.12, dir.y);
  if (d < 0.002) return col;
  // High ice still holds sunlight; it reads brighter than the dusty air.

  // A slow swell moves the wind's cutoff.
  const lfo = ac.createOscillator(), lg = ac.createGain();
  lfo.frequency.value = 0.1; lg.gain.value = 150;
  lfo.connect(lg).connect(lp.frequency);
  src.start(); lfo.start();
  bed = { src, g, g2, lfo };
}
function soundBed() {
  const ac = kit.live();
  if (!ac) { if (bed) { bed.g.gain.value = 0; bed.g2.gain.value = 0; } return; }
  windBed(ac);
  const k = pace * (1 - 0.4 * chaos);
  bed.g.gain.setTargetAtTime(0.02 * k, ac.currentTime, 0.3);
  bed.g2.gain.setTargetAtTime(0.006 * k, ac.currentTime, 0.3);
}
/* ---------- the charge hum ---------- */
// One root carries ten harmonic partials.
// Each partial enters as the chaos grows: [ratio, wave, enter, level].
const PARTIALS = [
  [1, 'sawtooth', 0, 1], [1.5, 'triangle', 0.1, 0.7], [2, 'sawtooth', 0.22, 0.6], [3, 'triangle', 0.34, 0.6], [4, 'sawtooth', 0.46, 0.4],
  [5, 'sine', 0.56, 0.5], [6, 'sine', 0.66, 0.45], [8, 'sine', 0.74, 0.4], [12, 'sine', 0.82, 0.3], [16, 'sine', 0.88, 0.25],
];
let hum = null;
function humStart(ac) {
  if (hum) return;
  const lp = filt(ac, 'lowpass', 180, 1.2), pre = ac.createGain(), shape = ac.createWaveShaper(), trem = ac.createGain(), g = ac.createGain();
  // A soft clip glues the stack and growls under drive.
  const curve = new Float32Array(257);
  for (let i = 0; i < 257; i++) curve[i] = Math.tanh(2.5 * (i / 128 - 1));
  shape.curve = curve; shape.oversample = '2x';
  pre.gain.value = 0.5; trem.gain.value = 1; g.gain.value = 0;
  lp.connect(pre).connect(shape).connect(trem).connect(g).connect(kit.out);
  const src = [], layers = [];
  PARTIALS.forEach(([ratio, type, enter, level], i) => {
    const lg = ac.createGain(), pan = ac.createStereoPanner(), os = [];
    lg.gain.value = 0;
    // High partials sit wide; the root sits in the middle.
    pan.pan.value = (i % 2 ? 1 : -1) * Math.min(0.7, 0.1 * i);
    for (const sgn of [-1, 1]) {
      const o = ac.createOscillator();
      o.type = type; o.detune.value = sgn * (3 + i); o.frequency.value = 55 * ratio;
      o.connect(lg); o.start(); os.push(o); src.push(o);
    }
    lg.connect(pan).connect(lp);
    layers.push({ os, lg, ratio, enter, level });
  });
  const sub = ac.createOscillator(), sg = ac.createGain();
  sub.frequency.value = 27.5; sg.gain.value = 0;
  sub.connect(sg).connect(kit.out); sub.start(); src.push(sub);
  const lfo = ac.createOscillator(), lg = ac.createGain();
  lfo.frequency.value = 0.5; lg.gain.value = 0.5;
  lfo.connect(lg).connect(trem.gain); lfo.start(); src.push(lfo);
  // Air tears round the barrel at rage.
  const nz = ac.createBufferSource(), nb = filt(ac, 'bandpass', 1200, 0.8), ng = ac.createGain();
  nz.buffer = kit.noise; nz.loop = true; ng.gain.value = 0;
  nz.connect(nb).connect(ng).connect(kit.out); nz.start(); src.push(nz);
  hum = { layers, src, lp, pre, g, sub, sg, lfo, lg, nb, ng };
}
function humUpdate(ac) {
  if (!hum || !charge) return;
  const c = charge.c, t = ac.currentTime, f = 55 * Math.pow(2, c * 7 / 12);
  for (const l of hum.layers) {
    for (const o of l.os) o.frequency.setTargetAtTime(f * l.ratio, t, 0.05);
    l.lg.gain.setTargetAtTime(0.12 * l.level * THREE.MathUtils.smoothstep(chaos, l.enter, l.enter + 0.1), t, 0.08);
  }
  hum.sub.frequency.setTargetAtTime(f / 2, t, 0.05);
  hum.lp.frequency.setTargetAtTime(180 * Math.pow(2, 4.8 * c), t, 0.05);
  hum.pre.gain.setTargetAtTime(0.5 + 2.5 * rage, t, 0.08);
  hum.g.gain.setTargetAtTime(0.12 * (0.3 + 0.7 * c) * (0.6 + 0.4 * chaos), t, 0.05);
  hum.sg.gain.setTargetAtTime(0.14 * c * c, t, 0.05);
  hum.lfo.frequency.setTargetAtTime(1 / CHASE_T(c) + 14 * rage, t, 0.05);
  hum.lg.gain.setTargetAtTime(0.5 - 0.4 * c + 0.35 * rage, t, 0.05);
  hum.nb.frequency.setTargetAtTime(1200 + 2500 * rage, t, 0.08);
  hum.ng.gain.setTargetAtTime(0.05 * rage, t, 0.08);
}
function humStop(ac, now = false) {
  if (!hum) return;
  const h = hum, t = ac ? ac.currentTime : 0;
  hum = null;
  if (!ac || now) { for (const n of h.src) { try { n.stop(); n.disconnect(); } catch { /* not started */ } } return; }
  for (const n of [h.g, h.sg, h.ng]) n.gain.setTargetAtTime(0, t, 0.03);
  for (const n of h.src) n.stop(t + 0.4);
  track(t + 0.5, ...h.src);
}
/* ---------- arcs, slug, crack, rumble ---------- */
// Every hit jitters in pitch, time and level.
let lastClick = 0;
const panV = new THREE.Vector3();
click = arc => {
  const ac = kit.live();
  if (!ac || ac.currentTime - lastClick < 0.05 - 0.025 * rage) return;
  lastClick = ac.currentTime;
  const t = ac.currentTime, dur = 0.012 + Math.random() * 0.018;
  const s = hiss(ac, t, dur + 0.02, 1.2), bp = filt(ac, 'bandpass', 2500 + Math.random() * 3500, 3), g = ac.createGain(), pan = ac.createStereoPanner();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime((0.03 + 0.03 * chaos + 0.05 * rage) * jit(0.3), t + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  pan.pan.value = clamp(panV.copy(arc.a).project(camera).x, -0.8, 0.8);
  s.connect(bp).connect(g).connect(pan).connect(kit.out);
  track(t + dur + 0.05, s);
};
// The slug: a chirp that rises along the rails.
// It pans left to right.
function chirp(ac, c) {
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain(), pan = ac.createStereoPanner();
  o.frequency.setValueAtTime(300 * jit(0.1), t); o.frequency.exponentialRampToValueAtTime(2400, t + 0.3);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.15 * c, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
  pan.pan.setValueAtTime(-0.5, t); pan.pan.linearRampToValueAtTime(0.4, t + 0.3);
  o.connect(g).connect(pan).connect(kit.out);
  o.start(t); o.stop(t + 0.35);
  track(t + 0.4, o);
}
// The crack plays when the Mach ring reaches the eye.
// That is seconds after the flash.
crack = sh => {
  const ac = kit.live();
  if (!ac) return;
  const c = sh.c, t = ac.currentTime;
  const sub = ac.createOscillator(), subG = ac.createGain();
  sub.frequency.setValueAtTime(60 * jit(0.08), t); sub.frequency.exponentialRampToValueAtTime(28, t + 0.35);
  subG.gain.setValueAtTime(0.0001, t); subG.gain.exponentialRampToValueAtTime(0.5 * c, t + 0.01); subG.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  sub.connect(subG).connect(kit.out); sub.start(t); sub.stop(t + 0.55);
  const cr = hiss(ac, t, 0.06), hp = filt(ac, 'highpass', 1500), crG = ac.createGain();
  crG.gain.setValueAtTime(0.35 * c * jit(0.15), t); crG.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
  cr.connect(hp).connect(crG).connect(kit.out);
  const wh = hiss(ac, t, 0.3, 0.7), bp = filt(ac, 'bandpass', 300 * jit(0.1), 1.2), whG = ac.createGain();
  whG.gain.setValueAtTime(0.0001, t); whG.gain.exponentialRampToValueAtTime(0.3 * c, t + 0.015); whG.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  wh.connect(bp).connect(whG).connect(kit.out);
  const tail = hiss(ac, t, 2.0, 0.9), lp = filt(ac, 'lowpass', 1200), tG = ac.createGain();
  tG.gain.setValueAtTime(0.1 * c, t); tG.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
  tail.connect(lp).connect(tG).connect(kit.out);
  // Stone rings low and dull.
  for (const f of [180, 270]) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = f * jit(0.03);
    g.gain.setValueAtTime(0.03 * c, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
    o.connect(g).connect(kit.out); o.start(t); o.stop(t + 1.6);
    track(t + 1.7, o);
  }
  track(t + 2.1, sub, cr, wh, tail);
};
// The rumble crosses forty kilometres of air, compressed eight times.
// It lands fifteen seconds after the flash.
function rumble(c) {
  const ac = kit.live();
  if (!ac) return;
  const t = ac.currentTime + DA / 343 / 8, k = SIZES[opts.size].rumble;
  const s = hiss(ac, t, 7, 0.3), lp = filt(ac, 'lowpass', 180), g = ac.createGain();
  const lvl = 0.25 * (0.5 + 0.5 * c) * k * jit(0.1);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(lvl, t + 0.6); g.gain.setTargetAtTime(0.0001, t + 1.2, 1.4);
  s.connect(lp).connect(g).connect(kit.out);
  const o = ac.createOscillator(), og = ac.createGain();
  o.frequency.value = 30 * jit(0.05);
  og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(lvl * 0.8, t + 0.6); og.gain.setTargetAtTime(0.0001, t + 1.2, 1.4);
  o.connect(og).connect(kit.out); o.start(t); o.stop(t + 7);
  track(t + 7.5, s, o);
}
// Sound on mid-charge starts the hum where the hold is.
// Sound off stops everything.
sound.onChange(on => {
  if (!on) { stopAll(); humStop(kit.ac); if (bed) { bed.g.gain.value = 0; bed.g2.gain.value = 0; } return; }
  if (charge) setTimeout(() => { const ac = kit.live(); if (ac && charge) humStart(ac); }, 60);
});


/* Pointer: a press charges; a drag past 8 px also looks around; any release fires. */
let press = null, spaceDown = false;
stage.addEventListener('pointerdown', e => {
  // One finger at a time: a second pointer changes nothing.
  if (e.button > 0 || press) return;
  stage.setPointerCapture(e.pointerId);
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, yaw: lookTo.yaw, pitch: lookTo.pitch, at: performance.now(), drag: false };
  if (sound.on) kit.wake();
  act.press();
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  const dx = e.clientX - press.x, dy = e.clientY - press.y;
  if (!press.drag && Math.hypot(dx, dy) > 8) { press.drag = true; stage.classList.add('held'); }
  if (!press.drag) return;
  const k = rad(camera.fov) / size.h;
  lookTo.yaw = clamp(press.yaw + dx * k, -0.3, 0.3);
  lookTo.pitch = clamp(press.pitch + dy * k, -0.15, 0.35);
});
const end = e => {
  if (!press || e.pointerId !== press.id) return;
  press = null;
  stage.classList.remove('held');
  act.release('pointer');
  wake();
};
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);
// Space holds the charge.
// The shell ignores it while a sheet has focus.
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat || e.target.closest?.('input, button, .s2-sheet')) return;
  e.preventDefault();
  spaceDown = true;
  if (sound.on) kit.wake();
  act.press('space');
  wake();
});
document.addEventListener('keyup', e => {
  if (e.code !== 'Space' || !spaceDown) return;
  spaceDown = false;
  act.release('space');
  wake();
});
addEventListener('blur', () => { if (charge || press) { cancelHold(); wake(); } });

function setBox(on) { grade.uniforms.uBox.value = on ? 1 : 0; draw(); }
function setGrain() { grade.uniforms.uGrain.value = POST.grain * ui.setting('grain').value; draw(); }

/* QA hooks: Dusk, the sim clock, draw count. Not for the UI. */
window.__qa = {
  sun(v) { opts.sun = v; setSun(); },
  simT: () => simT,
  draws: () => drawN,
  info: () => ({ ...renderer.info.render }),
  size: v => { opts.size = v; retune(); },
  ast: () => ({ s: ast.s, state: ast.state, R: ast.R, th: THREE.MathUtils.radToDeg(ast.th) }),
  // Hold at a level: the charge starts as if held for c.
  charge(c) { c = clamp(c, 0.12, 0.999); act.press('pointer'); charge.t0 = simT + 2.5 * Math.log(1 - (c - 0.12) / 0.88); stepCharge(0); frame(); draw(); },
  release() { act.release('pointer'); },
  // Jump the clock by t seconds.
  // The rock and the charge catch up.
  jump(t) { simT += t; U.uTime.value = simT; stepAst(t); stepAim(t, true); stepCharge(Math.min(t, 0.1)); frame(); draw(); },
  setS(v) { ast.s = v; ast.state = v >= 1 ? 'hold' : 'approach'; placeAst(); astSize(); stepAim(0, true); frame(); draw(); },
  charged: () => U.uCharge.value,
  chaos: () => chaos,
  audio: () => ({ state: kit.ac?.state ?? null, hum: !!hum, bed: !!bed, pend: pend.size }),
  shoot(c) { fire(c); frame(); draw(); },
  shot: () => (shot ? { age: simT - shot.t0, T: shot.T, hit: shot.hit, arrive: shot.arrive } : null),
  // Pose the blast on the clouds t seconds after a hit at the rock.
  blast(t) { hitFlash = Math.exp(-t / 0.28) + 0.22 * Math.exp(-t / 2.4); U.uHit.value.w = hitFlash; U.uHitP.value.set(ast.pos.x, ast.pos.y, ast.pos.z, simT - t); frame(); draw(); },
};

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
sun(sunDeg(opts.sun));
placeAst();
astSize();
stepAim(0, true);
setBox(ui.setting('letterbox').value);
setGrain();
resize();
renderer.compileAsync(scene, camera).then(() => {
  compiled = true;
  draw();
  canvas.classList.add('on');
  markReady();
  wake();
}, err => {
  stage.querySelector('.fail').hidden = false; ui.hideControls(); markReady();
  throw err;
});
</script>
