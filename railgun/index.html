<style>
/* Railgun: one colossal gun under a looming rock. */
:root { --stage: oklch(0.11 0.02 265); }
.stage--railgun canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--railgun canvas.on { opacity: 1; }
.stage--railgun.held canvas { cursor: grabbing; }
/* The Reset chip glows when the sky waits for it. */
.s2-chip[data-glow] { box-shadow: 0 0 0 1px oklch(0.88 0.12 72 / 0.8), 0 0 16px 2px oklch(0.84 0.15 70 / 0.5); animation: rg-glow 1.8s ease-in-out infinite; }
@keyframes rg-glow { 50% { box-shadow: 0 0 0 1px oklch(0.94 0.1 72 / 1), 0 0 30px 7px oklch(0.86 0.16 70 / 0.75); } }
@media (prefers-reduced-motion: reduce) { .s2-chip[data-glow] { animation: none; } }
@media (prefers-reduced-motion: reduce) { .stage--railgun canvas { transition: none; } }
</style>

<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/railgun.svg)"></span><span class="intro-name">Railgun</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--railgun" id="stage" tabindex="0" role="application" aria-label="A very large railgun. A burning asteroid is in the sky. Hold to charge the gun. Release to fire the shot.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2.</p>
      <div class="reset-fill" aria-hidden="true" style="position:absolute;inset:0;background:#fffaf3;opacity:0;pointer-events:none"></div>
      <p class="release-hint" aria-live="polite" style="position:absolute;left:50%;bottom:22%;transform:translateX(-50%);margin:0;font:600 11px/1 var(--mono, ui-monospace, monospace);letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,236,214,0.85);text-shadow:0 0 12px rgba(255,140,60,0.5);opacity:0;transition:opacity 0.6s;pointer-events:none">Release to fire</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Railgun</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./dist/main.js"></script>
