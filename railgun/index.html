<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.13 0.014 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Railgun</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Railgun: one colossal gun under a looming rock. */
:root { --stage: oklch(0.11 0.02 265); }
.stage--railgun canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--railgun canvas.on { opacity: 1; }
.stage--railgun.held canvas { cursor: grabbing; }
@media (prefers-reduced-motion: reduce) { .stage--railgun canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Railgun</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--railgun" id="stage" tabindex="0" role="application" aria-label="A colossal railgun at dusk. A burning asteroid hangs beyond its muzzle. Hold to charge, release to fire, drag to look around.">
      <p class="fail" hidden>Railgun needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Railgun</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { createNoise3D } from 'simplex-noise';
import { initPage, whenVisible, pixelRatio, onQuality, linFit, reduced, onReducedChange, quality, audioKit, sound } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

/* ---------- settings ---------- */
const store = {
  get(k) { try { return localStorage.getItem(`stimming.railgun.${k}`); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(`stimming.railgun.${k}`, String(v)); } catch { /* storage off */ } },
};
// Per size: first and last diameter in degrees.
// Then approach seconds, shard count, rumble gain.
const SIZES = {
  boulder: { th0: 0.8, thMax: 8, T: 60, shards: 24, rumble: 0.7 },
  mountain: { th0: 1.4, thMax: 14, T: 90, shards: 40, rumble: 1.0 },
  moon: { th0: 2.2, thMax: 22, T: 120, shards: 56, rumble: 1.3 },
};
const opts = {
  size: store.get('size') in SIZES ? store.get('size') : 'mountain',
  sun: Number.isFinite(+store.get('sun')) && store.get('sun') !== null ? Math.min(1, Math.max(0, +store.get('sun'))) : 0.3,
};

/* ---------- bar ---------- */
// The hold is the toy: no action chips.
const act = { press() {}, release() {} };
const ui = initPage({ id: 'railgun', bar: {
  choice: {
    label: 'Asteroid', value: opts.size,
    options: [{ value: 'boulder', label: 'Boulder' }, { value: 'mountain', label: 'Mountain' }, { value: 'moon', label: 'Moon' }],
    onPick: v => { opts.size = v; store.set('size', v); retune(); },
  },
  // Sun lifts the sun from the horizon to fifteen degrees up.
  slider: { label: 'Sun', min: 0, max: 1, step: 0.005, value: opts.sun, onInput: v => { opts.sun = v; store.set('sun', v); setSun(); } },
  settings: [
    { type: 'toggle', id: 'letterbox', label: 'Letterbox', value: false, persist: true, onToggle: on => setBox(on) },
    { type: 'slider', id: 'grain', label: 'Grain', min: 0, max: 2, step: 0.05, value: 1, persist: true, onInput: () => setGrain() },
  ],
  quality: true,
  keys: [['hold', 'charge'], ['release', 'fire'], ['drag', 'look around'], ['space', 'charge']],
} });

const stage = document.getElementById('stage');
let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

// Seeded random keeps the gun the same on every load.
let seed = 7331;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rad = THREE.MathUtils.degToRad;
const clamp = THREE.MathUtils.clamp;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; ui.hideControls(); markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setClearColor(0x000000, 1);
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, 1, 0.5, 300000);
camera.rotation.order = 'YXZ';
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = +new URLSearchParams(location.search).get('rung') || 0;

/* ---------- the gun's axis ---------- */
// One unit is one metre. The breech sits at the origin.
// The barrel climbs at 15 degrees toward negative z, 1,400 m long.
const ELEV = rad(15), L = 1400, GAP = 28, RW = 22, RH = 34, BASE_Y = 30;
const AX = new THREE.Vector3(0, Math.sin(ELEV), -Math.cos(ELEV));
const AX_UP = new THREE.Vector3(0, Math.cos(ELEV), Math.sin(ELEV));
const A0 = new THREE.Vector3(0, BASE_Y, 0);
const axisAt = (s, out) => out.copy(A0).addScaledVector(AX, L * s);
// The asteroid hangs 40 km out along the axis.
// The bolt takes seconds to reach it.
const DA = 40000;

/* ---------- uniforms ---------- */
const BLUE = linFit(0.82, 0.12, 225), AMBER = linFit(0.78, 0.17, 50);
const U = {
  uTime: { value: 0 },
  // The sun: direction toward it, its colour, the zenith and the horizon.
  uSun: { value: new THREE.Vector3(0, 0.1, -1) },
  uSunC: { value: new THREE.Vector3() },
  uZenC: { value: new THREE.Vector3() },
  uHorC: { value: new THREE.Vector3() },
  uSunE: { value: 0.1 },
  // Haze: dust per metre, and the height where it thins.
  uHaze: { value: 0.00013 },
  uHazeH: { value: 700 },
  uWisp: { value: new THREE.Vector3(Math.random() * 200, Math.random() * 200, 0.3 + Math.random() * 0.5) },
  // The asteroid: direction from the eye, light strength; its angular radius.
  uAst: { value: new THREE.Vector4(0, 1, 0, 0) },
  uAstR: { value: 0.05 },
  uAstC: { value: new THREE.Vector3(...AMBER) },
  // The bolt: world position and strength. The hit: direction and strength.
  uBolt: { value: new THREE.Vector4(0, 0, 0, 0) },
  uBoltC: { value: new THREE.Vector3(...linFit(0.9, 0.08, 225)) },
  uHit: { value: new THREE.Vector4(0, 1, 0, 0) },
  // Charge level, chase station, chase half width, muzzle flash.
  uCharge: { value: 0 },
  uChase: { value: 0 },
  uChaseW: { value: 0.25 },
  uFire: { value: 0 },
  uAxisA: { value: A0 },
  uAxisD: { value: AX },
  uAxisUp: { value: AX_UP },
  uL: { value: L },
  // The Mach ring on the ground: centre x, z, radius, strength.
  uShock: { value: new THREE.Vector4(0, 0, 0, 0) },
};

/* ---------- sun: late light over a dusty plain ---------- */
// The sun sits ahead and to the left.
// The gun stands against its glow.
const SUN_AZ = new THREE.Vector2(-0.62, -0.78).normalize();
const lerp3 = (a, b, t) => a.map((x, i) => x + (b[i] - x) * t);
function sun(deg) {
  const r = rad(deg);
  // low: 0 at the horizon, 1 at fifteen degrees up.
  const low = clamp(deg / 15, 0, 1);
  U.uSun.value.set(SUN_AZ.x * Math.cos(r), Math.sin(r), SUN_AZ.y * Math.cos(r));
  U.uSunE.value = r;
  U.uSunC.value.set(...lerp3([1.6, 0.62, 0.22], [1.9, 1.75, 1.55], low).map(x => x * (0.55 + 0.45 * low)));
  U.uZenC.value.set(...lerp3([0.10, 0.15, 0.30], [0.16, 0.30, 0.62], low));
  U.uHorC.value.set(...lerp3([0.78, 0.38, 0.17], [0.72, 0.68, 0.62], low));
  renderer.toneMappingExposure = 0.9;
}
// The slider lifts the sun from the horizon to 15 degrees.
const sunDeg = v => 1 + 14 * v * v;
const setSun = () => { sun(sunDeg(opts.sun)); draw(); };

/* ---------- K2: noise ---------- */
// Lifted from Marsh launch, which lifted it from Fireworks.
const K2_NOISE = /* glsl */`
float k2hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float k2noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(k2hash(i), k2hash(i + vec2(1, 0)), u.x), mix(k2hash(i + vec2(0, 1)), k2hash(i + vec2(1, 1)), u.x), u.y);
}
float k2fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * k2noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s;
}
// Three-dimensional value noise for rock.
float k3hash(vec3 p) { p = fract(p * vec3(123.34, 456.21, 789.12)); p += dot(p, p.yzx + 45.32); return fract((p.x + p.y) * p.z); }
float k3noise(vec3 p) {
  vec3 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  float a = mix(mix(k3hash(i), k3hash(i + vec3(1, 0, 0)), u.x), mix(k3hash(i + vec3(0, 1, 0)), k3hash(i + vec3(1, 1, 0)), u.x), u.y);
  float b = mix(mix(k3hash(i + vec3(0, 0, 1)), k3hash(i + vec3(1, 0, 1)), u.x), mix(k3hash(i + vec3(0, 1, 1)), k3hash(i + vec3(1, 1, 1)), u.x), u.y);
  return mix(a, b, u.z);
}
float k3fbm(vec3 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++) { s += a * k3noise(p); p = p * 2.07 + vec3(11.3, 7.1, 5.9); a *= 0.5; }
  return s;
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: sky ---------- */
// A day sky replaces the night one.
// Zenith, horizon, dust band, the sun.
// Kept from Marsh launch: wisps.
// New: the rock, the bolt and the hit light the air.
const K2_SKY = /* glsl */`
uniform vec3 uSunC, uZenC, uHorC;
uniform float uSunE;
uniform vec3 uWisp;
uniform vec4 uAst;
uniform float uAstR;
uniform vec3 uAstC;
uniform vec4 uBolt;
uniform vec3 uBoltC;
uniform vec4 uHit;
vec3 wisps(vec3 dir, vec3 col, float cs) {
  if (dir.y < 0.015 || uWisp.z < 0.01) return col;
  vec2 p = dir.xz / dir.y * 7.0;
  float n = k2noise(vec2(p.x * 0.045, p.y * 0.3) + uWisp.xy) * 0.6 + k2noise(vec2(p.x * 0.16, p.y * 1.3) + uWisp.yx) * 0.4;
  float d = smoothstep(0.78 - 0.08 * uWisp.z, 0.95, n) * smoothstep(0.015, 0.07, dir.y) * (1.0 - smoothstep(0.25, 0.45, dir.y));
  if (d < 0.002) return col;
  // Thin cloud takes the sun on the side that faces it.
  vec3 cloud = mix(uZenC * 1.4 + uHorC * 0.3, uSunC * 0.5, pow(max(cs, 0.0), 3.0) * 0.6);
  return mix(col, cloud, d * 0.45);
}
vec3 astGlow(vec3 dir) {
  float ang = acos(clamp(dot(dir, uAst.xyz), -1.0, 1.0));
  float out_ = max(ang - uAstR, 0.0);
  return uAstC * min(uAst.w, 1.2) * (0.05 * exp(-out_ / (uAstR * 0.8)) + 0.012 * exp(-out_ / (uAstR * 3.0)));
}
vec3 boltGlow(vec3 dir) {
  if (uBolt.w < 0.001) return vec3(0.0);
  vec3 v = uBolt.xyz - cameraPosition;
  float c = dot(dir, normalize(v)) - 1.0;
  return uBoltC * uBolt.w * (0.08 * exp(c * 900.0) + 0.02 * exp(c * 60.0));
}
vec3 hitGlow(vec3 dir) {
  if (uHit.w < 0.001) return vec3(0.0);
  float c = dot(dir, uHit.xyz) - 1.0;
  return uAstC * uHit.w * (0.12 * exp(c * 40.0) + 0.03 * exp(c * 5.0));
}
vec3 k2skyS(vec3 dir, float sunK) {
  float up = max(dir.y, 0.0);
  float cs = dot(dir, uSun);
  // Zenith to horizon, with a dust band low down.
  vec3 col = mix(uHorC, uZenC, pow(up, 0.45));
  col = mix(col, uHorC * 0.92, exp(-up * 14.0) * 0.55);
  // Below the horizon the sky model only feeds the haze colour.
  col = mix(col, uHorC * 0.8, smoothstep(0.0, -0.05, dir.y));
  // The sun: a wide glow, a tight glow and the disc.
  float cp = max(cs, 0.0);
  float glow = pow(cp, 5.0) * 0.22 + pow(cp, 90.0) * 0.7 * sunK + pow(cp, 8000.0) * 14.0 * sunK;
  col += uSunC * glow * (0.35 + 0.65 * exp(-up * 4.0));
  return wisps(dir, col, cs) + astGlow(dir) + boltGlow(dir) + hitGlow(dir);
}
vec3 k2sky(vec3 dir) { return k2skyS(dir, 1.0); }`;
/* ---------- end K2 ---------- */

/* ---------- K2: haze ---------- */
const K2_HAZE = /* glsl */`
uniform float uHaze;
uniform float uHazeH;
float k2hazeAmount(vec3 P) {
  vec3 v = P - cameraPosition;
  float dist = length(v);
  float k = 1.0 / uHazeH;
  float h0 = max(cameraPosition.y, 0.0), h1 = max(P.y, 0.0), dh = h1 - h0;
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);
  return 1.0 - exp(-dist * uHaze * max(avg, 0.0));
}
// The haze takes the horizon sky colour without the sun's disc.
vec3 k2hazeColor(vec3 dir) { return k2skyS(normalize(vec3(dir.x, 0.02, dir.z)), 0.0) * 0.9; }
vec3 k2haze(vec3 c, vec3 P) {
  return mix(c, k2hazeColor(normalize(P - cameraPosition)), k2hazeAmount(P));
}`;
/* ---------- end K2 ---------- */

// Shared lighting: sky hemisphere, sun, rim, the rock's glow.
const LIGHT = /* glsl */`
uniform float uL;
uniform vec3 uAxisA, uAxisD, uAxisUp;
vec3 ambient(vec3 N) { return mix(uHorC, uZenC, N.y * 0.5 + 0.5) * 0.55; }
vec3 sunLight(vec3 N) { return uSunC * max(dot(N, uSun), 0.0); }
// The rock lights what faces it, faintly by day.
vec3 keyLight(vec3 N) { return uAstC * uAst.w * 0.25 * max(dot(N, uAst.xyz), 0.0); }
// Light from behind catches the edges: the sun's and the rock's.
vec3 rim(vec3 N, vec3 P) {
  vec3 V = normalize(cameraPosition - P);
  float f = pow(1.0 - abs(dot(N, V)), 2.5);
  return f * (uSunC * 0.3 * max(dot(uSun, -V), 0.0) + uAstC * uAst.w * 0.15);
}`;
const HEAD = `${K2_NOISE}\nuniform vec3 uSun;\n${K2_SKY}\n${K2_HAZE}\n${LIGHT}`;

/* ---------- sky dome ---------- */
const sky = new THREE.Mesh(new THREE.SphereGeometry(150000, 48, 24), new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false,
  vertexShader: /* glsl */`varying vec3 vP; void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`varying vec3 vP; ${HEAD} void main() { gl_FragColor = vec4(k2sky(normalize(vP - cameraPosition)), 1.0); }`,
}));
sky.renderOrder = -1;
scene.add(sky);

/* ---------- ground: a dark plateau ---------- */
const GROUND_C = linFit(0.52, 0.035, 65);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30000, 30000).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  uniforms: { ...U, uGroundC: { value: new THREE.Vector3(...GROUND_C) } },
  vertexShader: /* glsl */`varying vec3 vP; void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`
  varying vec3 vP;
  uniform vec3 uGroundC;
  uniform vec4 uShock;
  ${HEAD}
  void main() {
    vec3 N = vec3(0.0, 1.0, 0.0);
    // Broad dunes of tone, then grit.
    float grit = k2fbm(vP.xz * 0.0012) * 0.7 + k2fbm(vP.xz * 0.02) * 0.3;
    vec3 alb = uGroundC * (0.5 + 1.0 * grit);
    // The breech apron is scorched: a shade darker.
    float apron = smoothstep(160.0, 40.0, length(vP.xz));
    alb *= 1.0 - 0.3 * apron;
    vec3 col = alb * (ambient(N) + sunLight(N) + keyLight(N));
    // The Mach ring: a thin bright front, compressed air dark behind it.
    float r = length(vP.xz - uShock.xy);
    float sw = 4.0 + 0.05 * uShock.z;
    float shock = exp(-(r - uShock.z) * (r - uShock.z) / (2.0 * sw * sw));
    float inside = smoothstep(uShock.z, uShock.z - sw * 3.0, r);
    // Dust stands up in the front and catches the sun.
    // The air behind it is swept clean.
    col *= 1.0 - 0.25 * uShock.w * inside * (1.0 - shock);
    col += (ambient(N) + sunLight(vec3(0.0, 0.3, 0.0)) * 0.5) * uGroundC * 1.6 * shock * uShock.w;
    gl_FragColor = vec4(k2haze(col, vP), 1.0);
  }`,
}));
scene.add(ground);

/* ---------- the gun: two rails, a breech, four cradles ---------- */
// Every piece is a chipped box; one merged mesh, one draw call.
// aPart: station along the barrel, rail flag, inner-face flag, seed.
const noise3 = createNoise3D(rnd);
const CRADLES = 4;
function chip(geo) {
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    // Offsets come from position alone, so shared corners stay joined.
    const a = 0.04, b = 0.11;
    const dx = noise3(v.x * a, v.y * a, v.z * a) * 0.9 + noise3(v.x * b + 31, v.y * b, v.z * b) * 0.3;
    const dy = noise3(v.x * a + 57, v.y * a, v.z * a) * 0.9 + noise3(v.x * b, v.y * b + 13, v.z * b) * 0.3;
    const dz = noise3(v.x * a, v.y * a + 91, v.z * a) * 0.9 + noise3(v.x * b, v.y * b, v.z * b + 71) * 0.3;
    p.setXYZ(i, v.x + dx, v.y + dy, v.z + dz);
  }
  return geo;
}
function part(geo, isRail, side) {
  const p = geo.attributes.position, n = geo.attributes.normal, v = new THREE.Vector3(), rel = new THREE.Vector3();
  const a = new Float32Array(p.count * 4);
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    rel.subVectors(v, A0);
    const st = clamp(rel.dot(AX) / L, 0, 1);
    const inner = isRail && n.getX(i) * -side > 0.5 ? 1 : 0;
    a.set([st, isRail ? 1 : 0, inner, rnd()], i * 4);
  }
  geo.setAttribute('aPart', new THREE.Float32BufferAttribute(a, 4));
  geo.deleteAttribute('uv');
  return geo;
}
function buildGun() {
  const pieces = [];
  // Rails: long boxes pitched up the axis, one per side.
  for (const side of [-1, 1]) {
    const g = new THREE.BoxGeometry(RW, RH, L, 3, 4, 140).translate(0, 0, -L / 2).rotateX(ELEV);
    g.translate(side * (GAP / 2 + RW / 2), A0.y, A0.z);
    pieces.push(part(chip(g), true, side));
  }
  // The breech block swallows the first eighty metres of both rails.
  {
    const g = new THREE.BoxGeometry(96, 76, 70, 4, 4, 3).translate(0, 0, -35).rotateX(ELEV).translate(0, A0.y, A0.z);
    pieces.push(part(chip(g), false, 0));
  }
  // Cradles: two uprights and a lintel over both rails.
  // They grow taller as the barrel climbs.
  const c = new THREE.Vector3();
  for (let i = 0; i < CRADLES; i++) {
    const s = (i + 1) / (CRADLES + 0.5);
    axisAt(s, c);
    const H = c.y + RH / 2 + 6;
    for (const side of [-1, 1]) {
      const g = new THREE.BoxGeometry(11, H, 12, 2, Math.max(3, Math.round(H / 20)), 2).translate(side * 42, H / 2, c.z);
      pieces.push(part(chip(g), false, 0));
    }
    const g = new THREE.BoxGeometry(95, 9, 13, 6, 2, 2).translate(0, H + 4.5, c.z);
    pieces.push(part(chip(g), false, 0));
  }
  return mergeGeometries(pieces, false);
}
const ROCK_C = linFit(0.42, 0.02, 70);
const gunMat = new THREE.ShaderMaterial({
  uniforms: { ...U, uRockC: { value: new THREE.Vector3(...ROCK_C) } },
  vertexShader: /* glsl */`
  attribute vec4 aPart;
  varying vec3 vP; varying vec4 vPart;

  sub.connect(subG).connect(kit.out); sub.start(t); sub.stop(t + 0.55);
  const cr = hiss(ac, t, 0.06), hp = filt(ac, 'highpass', 1500), crG = ac.createGain();
  crG.gain.setValueAtTime(0.35 * c * jit(0.15), t); crG.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
  cr.connect(hp).connect(crG).connect(kit.out);
  const wh = hiss(ac, t, 0.3, 0.7), bp = filt(ac, 'bandpass', 300 * jit(0.1), 1.2), whG = ac.createGain();
  whG.gain.setValueAtTime(0.0001, t); whG.gain.exponentialRampToValueAtTime(0.3 * c, t + 0.015); whG.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  wh.connect(bp).connect(whG).connect(kit.out);
  const tail = hiss(ac, t, 2.0, 0.9), lp = filt(ac, 'lowpass', 1200), tG = ac.createGain();
  tG.gain.setValueAtTime(0.1 * c, t); tG.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
  tail.connect(lp).connect(tG).connect(kit.out);
  // Stone rings low and dull.
  for (const f of [180, 270]) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = f * jit(0.03);
    g.gain.setValueAtTime(0.03 * c, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
    o.connect(g).connect(kit.out); o.start(t); o.stop(t + 1.6);
    track(t + 1.7, o);
  }
  track(t + 2.1, sub, cr, wh, tail);
};
// The rumble crosses forty kilometres of air, compressed eight times.
// It lands fifteen seconds after the flash.
function rumble(c) {
  const ac = kit.live();
  if (!ac) return;
  const t = ac.currentTime + DA / 343 / 8, k = SIZES[opts.size].rumble;
  const s = hiss(ac, t, 7, 0.3), lp = filt(ac, 'lowpass', 180), g = ac.createGain();
  const lvl = 0.25 * (0.5 + 0.5 * c) * k * jit(0.1);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(lvl, t + 0.6); g.gain.setTargetAtTime(0.0001, t + 1.2, 1.4);
  s.connect(lp).connect(g).connect(kit.out);
  const o = ac.createOscillator(), og = ac.createGain();
  o.frequency.value = 30 * jit(0.05);
  og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(lvl * 0.8, t + 0.6); og.gain.setTargetAtTime(0.0001, t + 1.2, 1.4);
  o.connect(og).connect(kit.out); o.start(t); o.stop(t + 7);
  track(t + 7.5, s, o);
}
// Sound on mid-charge starts the hum where the hold is.
// Sound off stops everything.
sound.onChange(on => {
  if (!on) { stopAll(); humStop(kit.ac); if (bed) { bed.g.gain.value = 0; bed.g2.gain.value = 0; } return; }
  if (charge) setTimeout(() => { const ac = kit.live(); if (ac && charge) humStart(ac); }, 60);
});


/* Pointer: a press charges; a drag past 8 px also looks around; any release fires. */
let press = null, spaceDown = false;
stage.addEventListener('pointerdown', e => {
  // One finger at a time: a second pointer changes nothing.
  if (e.button > 0 || press) return;
  stage.setPointerCapture(e.pointerId);
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, yaw: lookTo.yaw, pitch: lookTo.pitch, at: performance.now(), drag: false };
  if (sound.on) kit.wake();
  act.press();
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  const dx = e.clientX - press.x, dy = e.clientY - press.y;
  if (!press.drag && Math.hypot(dx, dy) > 8) { press.drag = true; stage.classList.add('held'); }
  if (!press.drag) return;
  const k = rad(camera.fov) / size.h;
  lookTo.yaw = clamp(press.yaw + dx * k, -0.3, 0.3);
  lookTo.pitch = clamp(press.pitch + dy * k, -0.15, 0.35);
});
const end = e => {
  if (!press || e.pointerId !== press.id) return;
  press = null;
  stage.classList.remove('held');
  act.release('pointer');
  wake();
};
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);
// Space holds the charge.
// The shell ignores it while a sheet has focus.
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat || e.target.closest?.('input, button, .s2-sheet')) return;
  e.preventDefault();
  spaceDown = true;
  if (sound.on) kit.wake();
  act.press('space');
  wake();
});
document.addEventListener('keyup', e => {
  if (e.code !== 'Space' || !spaceDown) return;
  spaceDown = false;
  act.release('space');
  wake();
});
addEventListener('blur', () => { if (charge || press) { cancelHold(); wake(); } });

function setBox(on) { grade.uniforms.uBox.value = on ? 1 : 0; draw(); }
function setGrain() { grade.uniforms.uGrain.value = POST.grain * ui.setting('grain').value; draw(); }

/* QA hooks: Dusk, the sim clock, draw count. Not for the UI. */
window.__qa = {
  sun(v) { opts.sun = v; setSun(); },
  simT: () => simT,
  draws: () => drawN,
  info: () => ({ ...renderer.info.render }),
  size: v => { opts.size = v; retune(); },
  ast: () => ({ s: ast.s, state: ast.state, R: ast.R, th: THREE.MathUtils.radToDeg(ast.th) }),
  // Hold at a level: the charge starts as if held for c.
  charge(c) { c = clamp(c, 0.12, 0.999); act.press('pointer'); charge.t0 = simT + 2.5 * Math.log(1 - (c - 0.12) / 0.88); stepCharge(0); frame(); draw(); },
  release() { act.release('pointer'); },
  // Jump the clock by t seconds.
  // The rock and the charge catch up.
  jump(t) { simT += t; U.uTime.value = simT; stepAst(t); stepCharge(Math.min(t, 0.1)); frame(); draw(); },
  setS(v) { ast.s = v; ast.state = v >= 1 ? 'hold' : 'approach'; astSize(); frame(); draw(); },
  charged: () => U.uCharge.value,
  chaos: () => chaos,
  audio: () => ({ state: kit.ac?.state ?? null, hum: !!hum, bed: !!bed, pend: pend.size }),
  shoot(c) { fire(c); frame(); draw(); },
  shot: () => (shot ? { age: simT - shot.t0, T: shot.T, hit: shot.hit, arrive: shot.arrive } : null),
};

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
sun(sunDeg(opts.sun));
placeAst();
astSize();
setBox(ui.setting('letterbox').value);
setGrain();
resize();
renderer.compileAsync(scene, camera).then(() => {
  compiled = true;
  draw();
  canvas.classList.add('on');
  markReady();
  wake();
}, err => {
  stage.querySelector('.fail').hidden = false; ui.hideControls(); markReady();
  throw err;
});
</script>
</body>
