/* The table is 16:9, and 4:5 on phones. */

<div class="wrap">
  <header>
    <h1>Domino run</h1>
    <div class="tools">
      <button class="snd" id="snd" type="button" aria-label="Sound" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 8h2.6l3.9-3.2v10.4L5.6 12H3z"/>
          <path class="on" d="M12.8 8.1a3 3 0 0 1 0 3.8M15.1 6.1a6 6 0 0 1 0 7.8"/>
          <path class="off" d="M13.2 8l4 4M17.2 8l-4 4"/>
        </svg>
      </button>
      <a class="home" href="../index.html">Stimming</a>
    </div>
  </header>
  <main>
    <div class="table" id="table" tabindex="0" role="application" aria-label="Domino table. Drag to lay a line of tiles; tap a tile to tip it. Space tips the first tile, R stands them back up.">
      <canvas></canvas>
      <p class="hint" aria-hidden="true">draw a line &middot; tap the first tile</p>
      <p class="fail" hidden>The tiles need WebGL, which this browser has turned off.</p>
    </div>
    <div class="ctl">
      <button class="chip" id="reset" type="button" disabled>Reset</button>
      <button class="chip" id="clear" type="button" disabled>Clear</button>
    </div>
  </main>
</div>

  const ppu = r.height / 2 / Math.tan((FOV / 2) * D2R), t = nowS();
  let best = -1, bs = Infinity;
  for (let i = 0; i < n; i++) {
    if (ST[i] !== 0 || BORN[i] > t) continue;
    const o = i * 16, x = te[o + 12], y = te[o + 13], z = te[o + 14], ux = (te[o + 4] * H) / 2, uy = (te[o + 5] * H) / 2, uz = (te[o + 6] * H) / 2;
    vtmp.set(x - ux, y - uy, z - uz).project(camera);
    const ax = ((vtmp.x + 1) / 2) * r.width, ay = ((1 - vtmp.y) / 2) * r.height;
    vtmp.set(x + ux, y + uy, z + uz).project(camera);
    const bx = ((vtmp.x + 1) / 2) * r.width, by = ((1 - vtmp.y) / 2) * r.height;
    const depth = Math.hypot(x - camera.position.x, y - camera.position.y, z - camera.position.z);
    const half = ((W / 2) * ppu) / depth, d = distSeg(px, py, ax, ay, bx, by);
    if (d > Math.max(half + 2, touch ? 20 : 8)) continue;
    const s = d <= half ? depth : 1e3 + d;
    if (s < bs) { bs = s; best = i; }
  }
  return best;
}
canvas.addEventListener('pointerdown', e => {
  if (!ready || (e.pointerType === 'mouse' && e.button !== 0)) return;
  if (clearing) finishClear();
  const q = tablePoint(e.clientX, e.clientY);
  if (!q) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  const touch = e.pointerType !== 'mouse';
  ptrs.set(e.pointerId, { sx: e.clientX, sy: e.clientY, q, touch, tile: pick(e.clientX, e.clientY, touch), drawing: false });
});
canvas.addEventListener('pointermove', e => {
  if (!ready) return;
  const p = ptrs.get(e.pointerId);
  if (!p) {
    if (e.pointerType === 'mouse') canvas.classList.toggle('tip', pick(e.clientX, e.clientY, false) >= 0);
    return;
  }
  if (!p.drawing) {
    // Past a small slop, a press becomes a stroke.
    if (Math.hypot(e.clientX - p.sx, e.clientY - p.sy) < (p.touch ? 10 : 5)) return;
    p.drawing = true;
    canvas.classList.remove('tip');
    begin(p);
  }
  const list = e.getCoalescedEvents?.() || [];
  for (const c of list.length ? list : [e]) {
    const q = tablePoint(c.clientX, c.clientY);
    if (q) brush(p, q.x, q.z);
  }
  syncChips();
  wake();
});
function release(e, ok) {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  ptrs.delete(e.pointerId);
  if (p.drawing) {
    const q = ok && tablePoint(e.clientX, e.clientY);
    if (q) finish(p, q.x, q.z);
  } else if (ok && p.tile >= 0 && ST[p.tile] === 0) tip(p.tile, pushDir(p.tile));
  syncChips();
  wake();
}
canvas.addEventListener('pointerup', e => release(e, true));
canvas.addEventListener('pointercancel', e => release(e, false));
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') canvas.classList.remove('tip'); });

addEventListener('keydown', e => {
  if (!ready || e.metaKey || e.ctrlKey || e.altKey) return;
  // Buttons and links keep their own keys.
  if (e.target instanceof Element && e.target.closest('button, a, input, select, textarea')) return;
  if (e.key === ' ') { e.preventDefault(); if (!e.repeat) tipFirst(); }
  else if (e.key === 'r' || e.key === 'R') { if (!e.repeat) reset(); }
});
resetB.addEventListener('click', reset);
clearB.addEventListener('click', clearAll);
const sndB = document.getElementById('snd');
const showSound = () => sndB.setAttribute('aria-pressed', String(soundOn));
showSound();
sndB.addEventListener('click', () => {
  soundOn = !soundOn;
  showSound();
  try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (err) { /* storage is optional */ }
  if (soundOn) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});

/* ---------- start ---------- */
function failed() {
  panel.querySelector('.fail').hidden = false;
  canvas.hidden = true;
  hint.hidden = true;
}
// WebGL setup runs in idle slices, so loading never stalls.
async function init() {
  let RoundedBoxGeometry, RoomEnvironment;
  try {
    THREE = await import('three');
    [{ RoundedBoxGeometry }, { RoomEnvironment }] = await Promise.all([
      import('three/addons/geometries/RoundedBoxGeometry.js'),
      import('three/addons/environments/RoomEnvironment.js'),
    ]);
  } catch (err) {
    return failed();
  }
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (err) {
    return failed();
  }
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene = new THREE.Scene();
  await idle();
  // Soft room light makes the lacquer read.
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  pm.dispose();
  scene.environmentIntensity = 0.65;
  camera = new THREE.PerspectiveCamera(FOV, 16 / 9, 0.5, 200);
  sun = new THREE.DirectionalLight(0xffffff, 1.7);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.02;
  scene.add(sun, sun.target);
  // The table itself is the panel; only shadows are drawn on it.
  shade = new THREE.ShadowMaterial({ opacity: 0.44 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), shade);
  floor.rotation.x = -HALF;
  floor.receiveShadow = true;
  scene.add(floor);
  const mat = new THREE.MeshPhysicalMaterial({ roughness: 0.38, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.06 });
  mesh = new THREE.InstancedMesh(new RoundedBoxGeometry(T, H, W, 2, 0.035), mat, MAX);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  col = new THREE.Color(1, 1, 1);
  mesh.setColorAt(0, col);
  mesh.count = 0;
  mesh.frustumCulled = false;
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
  ray = new THREE.Raycaster();
  ndc = new THREE.Vector2();
  vtmp = new THREE.Vector3();
  tokens();
  await idle();
  // Async compile keeps the physical-material build off the main thread.
  try { await renderer.compileAsync(scene, camera); } catch (err) { /* first render compiles instead */ }
  ready = true;
  intro = reduce ? 0 : -1;
  layout();
  new ResizeObserver(layout).observe(panel);
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; wake(); }).observe(panel);
  preset(nowS() + 0.25);
  syncChips();
  wake();
}
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', tokens);
new MutationObserver(tokens).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.readyState === 'complete') idle().then(init);
else addEventListener('load', () => idle().then(init));
</script>
