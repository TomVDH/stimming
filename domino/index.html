<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Domino run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Domino run: lacquered tiles on a dark table. */
:root { --stage: oklch(0.245 0.014 275); }
/* A height cap keeps the bar on screen. */
.stage--domino { max-height: max(320px, calc(100svh - 190px)); -webkit-touch-callout: none; }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%; cursor: crosshair;
  opacity: 0; transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
.stage canvas.tip { cursor: pointer; }
.stage canvas.turn { cursor: grabbing; }
.hint {
  position: absolute; left: 16px; bottom: 14px; margin: 0; pointer-events: none;
  font-size: 13px; color: var(--muted); transition: opacity 0.6s ease;
}
.hint.gone { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .hint, .stage canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/domino.svg)"></span><span class="intro-name">Domino run</span><span class="intro-sub">Stimming No. 04</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--domino table" id="table" tabindex="0" role="application" aria-label="Domino table. Drag to lay a line of tiles; a long line ends at a tower. Click or tap a tile to tip it. Right-drag or two fingers turn the table; I toggles the iso view. R stands the tiles back up.">
      <canvas></canvas>
      <p class="fail" hidden>The tiles need WebGL, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices">
        <button class="chip" id="rows" type="button" aria-label="Rows per stroke: 1">1 row</button>
        <button class="chip" id="iso" type="button" aria-pressed="false" aria-keyshortcuts="I">Iso</button>
      </div>
      <div class="actions">
        <button class="chip" id="reset" type="button" aria-keyshortcuts="R" disabled>Reset</button>
        <button class="chip" id="clear" type="button" disabled>Clear</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag</dt><dd>lay tiles</dd></div>
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>tip a tile</dd></div>
        <div><dt><span class="fine">Right-drag</span><span class="touch">Two fingers</span></dt><dd>turn the table</dd></div>
        <div class="fine"><dt><kbd>R</kbd></dt><dd>reset</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Domino run</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }

<script type="module">
import { initPage, audioKit, reduced, onReducedChange } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });

let reduce = reduced();
onReducedChange(on => { reduce = on; if (reduce) { intro = 0; wake(); } });
const PI = Math.PI, HALF = PI / 2, D2R = PI / 180;

/* ---------- colour: OKLCH in, sRGB out ---------- */

// Series hues in chain order: fire, amber, mint, cyan, blue, violet, magenta.
const STOPS = [
  [0.6, 0.21, 28], [0.7, 0.19, 52], [0.8, 0.17, 84], [0.77, 0.16, 160],
  [0.69, 0.14, 206], [0.55, 0.18, 258], [0.51, 0.2, 292], [0.57, 0.22, 330],

const PER = 8;

/* ---------- page ---------- */
const panel = document.getElementById('table'), canvas = panel.querySelector('canvas');
const hint = panel.querySelector('.hint'), resetB = document.getElementById('reset'), clearB = document.getElementById('clear');
const isoB = document.getElementById('iso'), rowsB = document.getElementById('rows');

/* ---------- sound: synthesised, started by the first gesture ---------- */
// The kit wakes on the first gesture (Space or Enter from the keyboard) and follows the header toggle.
// One second of white noise feeds every burst.
const kit = audioKit({ gain: 0.55, keys: new Set([' ', 'Enter']), noiseSeconds: 1, sleepMs: 1500 });
const MAXV = 22, LEAD = 0.004;
let voices = 0, clackNext = 0, tickNext = 0;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.08 * voices);
const live = () => kit.live();
function track(src, ...tails) {
  voices++;

}
// Once the table settles, the context sleeps until the next gesture.
const rest = () => kit.rest(() => !raf && !ptrs.size);

// Impact: a crisp bandpassed click over a tiny pitched knock.
function clack(s, run) {
  const a = live();
  if (!a) return;
  const t0 = a.currentTime + LEAD, t = Math.max(t0, clackNext);

  if (t - t0 > 0.05 || voices >= MAXV) return;

  const f = (1 + 0.16 * (1 - Math.exp(-run / 70))) * jit(0.06), g = level() * (0.3 + 0.7 * clamp(s)) * jit(0.12);

  bp.type = 'bandpass';
  bp.frequency.value = 3300 * f;
  bp.Q.value = 2.2;
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(1.15 * g, t + 0.0005);
  ng.gain.setTargetAtTime(0, t + 0.0005, 0.0032);
  src.connect(bp).connect(ng).connect(kit.out);
  src.start(t, Math.random() * 0.9, 0.04);
  const o = a.createOscillator(), og = a.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(1480 * f, t);
  o.frequency.exponentialRampToValueAtTime(1120 * f, t + 0.03);
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(0.3 * g, t + 0.001);
  og.gain.setTargetAtTime(0, t + 0.001, 0.008);

// Landing flat: a lower, rounder knock on the table.

  const t = Math.max(a.currentTime + LEAD, clackNext), f = jit(0.05), g = level() * (0.35 + 0.65 * clamp(s)) * jit(0.1);

  const src = a.createBufferSource(), bp = a.createBiquadFilter(), ng = a.createGain();
  src.buffer = kit.noise;
  bp.type = 'bandpass';
  bp.frequency.value = 1700 * f;
  bp.Q.value = 1.2;
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(0.8 * g, t + 0.0008);
  ng.gain.setTargetAtTime(0, t + 0.0008, 0.006);
  src.connect(bp).connect(ng).connect(kit.out);
  src.start(t, Math.random() * 0.9, 0.05);
  const o = a.createOscillator(), og = a.createGain();
  o.frequency.setValueAtTime(620 * f, t);
  o.frequency.exponentialRampToValueAtTime(430 * f, t + 0.05);
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(0.32 * g, t + 0.0015);
  og.gain.setTargetAtTime(0, t + 0.0015, 0.016);
  o.connect(og).connect(kit.out);
  o.start(t);
  o.stop(t + 0.12);

// Placing: a soft, short click.
function tick(s = 1) {
  const a = live();
  if (!a) return;
  const t = a.currentTime + LEAD;
  if (t < tickNext || voices >= MAXV) return;
  tickNext = t + 0.024 + Math.random() * 0.012;
  const f = jit(0.08), g = level() * s * jit(0.15);
  const src = a.createBufferSource(), hp = a.createBiquadFilter(), ng = a.createGain();
  src.buffer = kit.noise;
  hp.type = 'highpass';
  hp.frequency.value = 4800 * f;
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(0.3 * g, t + 0.0005);
  ng.gain.setTargetAtTime(0, t + 0.0005, 0.0018);
  src.connect(hp).connect(ng).connect(kit.out);
  src.start(t, Math.random() * 0.9, 0.02);
  const o = a.createOscillator(), og = a.createGain();
  o.frequency.value = 2500 * f;
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(0.05 * g, t + 0.0008);
  og.gain.setTargetAtTime(0, t + 0.0008, 0.003);
  o.connect(og).connect(kit.out);
  o.start(t);
  o.stop(t + 0.03);
  track(o, og, ng);

// A tower falls: a deep thump, a dull whump, then a long clatter.
function crash(s) {
  const a = live();
  if (!a) return;
  const t = a.currentTime + LEAD, g = level() * clamp(s, 0.6, 1.2);
  const o = a.createOscillator(), og = a.createGain();
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(46, t + 0.2);
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(0.8 * g, t + 0.003);
  og.gain.setTargetAtTime(0, t + 0.003, 0.09);
  o.connect(og).connect(kit.out);
  o.start(t);
  o.stop(t + 0.6);
  track(o, og);
  const wn = a.createBufferSource(), lp = a.createBiquadFilter(), wg = a.createGain();
  wn.buffer = kit.noise;
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(900, t);
  lp.frequency.exponentialRampToValueAtTime(220, t + 0.15);
  wg.gain.setValueAtTime(0, t);
  wg.gain.linearRampToValueAtTime(0.75 * g, t + 0.004);
  wg.gain.setTargetAtTime(0, t + 0.004, 0.05);
  wn.connect(lp).connect(wg).connect(kit.out);
  wn.start(t, Math.random() * 0.6, 0.3);

  for (let k = 0; k < 14; k++) {

    bp.type = 'bandpass';
    bp.frequency.value = 1200 + Math.random() * 2600;
    bp.Q.value = 1.6;
    ng.gain.setValueAtTime(0, tk);
    ng.gain.linearRampToValueAtTime(gk, tk + 0.0006);
    ng.gain.setTargetAtTime(0, tk + 0.0006, 0.006);

/* ---------- tiles ---------- */
// One unit is a tile's height.
// Tiles are 1 x 0.5 x 0.16 units.

const BREAK = 1.6;

const SPAWN = 0.2, DROP = 0.18;

const BAR = 0.012;

const TH = new Float64Array(MAX), OM = new Float64Array(MAX), PUSH = new Float64Array(MAX), PREV = new Float64Array(MAX);
const BORN = new Float64Array(MAX), RISE0 = new Float64Array(MAX), RISET = new Float64Array(MAX), HUE = new Float32Array(MAX);
const SG = new Int8Array(MAX), ST = new Uint8Array(MAX), LAND = new Uint8Array(MAX), CL = new Uint8Array(MAX);
const STILL = new Uint8Array(MAX), ACT = new Uint8Array(MAX), RANK = new Int32Array(MAX), RUN = new Int32Array(MAX);

// Each tile remembers its stroke and its place in that stroke.
const SID = new Int32Array(MAX), SEQ = new Int32Array(MAX);
// Parallel rows of one stroke share a group and start together.
const GRP = new Int32Array(MAX);
// Rows per stroke, and the spacing between rows.
const ROWS = [1, 3, 5], LANE = 0.85;
let rows = 1;
// ST: 0 standing, 1 falling, 2 down, 3 standing back up.
let n = 0, rank = 0, stamp = 0, nextHue = 0, lastBorn = -1e9, clearing = 0, strokes = 0;
const active = [];

// A one-unit grid finds neighbours without scanning every tile.
const grid = new Map();
const cellKey = (cx, cz) => (cx + 4096) * 8192 + (cz + 4096);

/* ---------- toppling, kinematic ---------- */
// Tile j is a candidate when i's top edge can reach it.

// Masters update first, so a leaning tile reads this step's angle.
function upd(i, h) {

  if (clearing) finishClear();
  const q = tablePoint(e.clientX, e.clientY);
  if (!q) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  // A point squarely on a tower picks the tower before any tile.
  const touch = e.pointerType !== 'mouse', square = pickTower(e.clientX, e.clientY, 0);
  const tile = square ? -1 : pick(e.clientX, e.clientY, touch);
  const tower = square || (tile < 0 ? pickTower(e.clientX, e.clientY, touch ? 12 : 4) : null);
  ptrs.set(e.pointerId, { sx: e.clientX, sy: e.clientY, cx: e.clientX, cy: e.clientY, q, touch, tile, tower, drawing: false });
});
canvas.addEventListener('pointermove', e => {
  if (!ready || turnMove(e)) return;
  const p = ptrs.get(e.pointerId);
  if (!p) {
    if (e.pointerType === 'mouse') canvas.classList.toggle('tip', pick(e.clientX, e.clientY, false) >= 0 || !!pickTower(e.clientX, e.clientY, 4));
    return;
  }
  p.cx = e.clientX; p.cy = e.clientY;
  if (!p.drawing) {
    // Past a small slop, a press becomes a stroke.
    if (Math.hypot(e.clientX - p.sx, e.clientY - p.sy) < (p.touch ? 10 : 5)) return;
    p.drawing = true;
    canvas.classList.remove('tip');
    begin(p);
  }
  const list = e.getCoalescedEvents?.() || [];
  for (const c of list.length ? list : [e]) {
    const q = tablePoint(c.clientX, c.clientY);
    if (q) brush(p, q.x, q.z);
  }
  syncChips();
  wake();
});
function release(e, ok) {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  ptrs.delete(e.pointerId);
  if (p.drawing) {
    const q = ok && tablePoint(e.clientX, e.clientY);
    if (q) finish(p, q.x, q.z);
  } else if (ok && p.tile >= 0 && ST[p.tile] === 0) tip(p.tile, pushDir(p.tile));
  else if (ok && p.tower && p.tower.st === 0) shove(p.tower);
  syncChips();
  wake();
}
canvas.addEventListener('pointerup', e => { if (!turnEnd(e)) release(e, true); });
canvas.addEventListener('pointercancel', e => { if (!turnEnd(e)) release(e, false); });
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') canvas.classList.remove('tip'); });

addEventListener('keydown', e => {
  if (!ready || e.metaKey || e.ctrlKey || e.altKey) return;
  // Buttons and links keep their own keys.
  if (e.target instanceof Element && e.target.closest('button, a, input, select, textarea')) return;
  if (e.key === ' ') { e.preventDefault(); if (!e.repeat) tipFirst(); }
  else if (e.key === 'r' || e.key === 'R') { if (!e.repeat) reset(); }
  else if (e.key === 'i' || e.key === 'I') { if (!e.repeat) setView(!lensTo); }
  // Arrows turn the table only while the page itself has focus.
  else if (e.key.startsWith('Arrow') && [document.body, panel].includes(document.activeElement)) {
    e.preventDefault();
    const side = { ArrowLeft: 1, ArrowRight: -1 }[e.key];
    if (side) goal.yaw += side * (lensTo ? HALF : 15 * D2R);
    else if (!lensTo) goal.pitch = clamp(goal.pitch + (e.key === 'ArrowUp' ? 8 : -8) * D2R, PMIN, PMAX);
    wake();
  }
});
resetB.addEventListener('click', reset);
isoB.addEventListener('click', () => setView(!lensTo));
// The Rows chip cycles 1, 3 and 5 parallel rows per stroke.
function setRows(r, save = true) {
  rows = ROWS.includes(r) ? r : 1;
  rowsB.textContent = rows === 1 ? '1 row' : `${rows} rows`;
  rowsB.setAttribute('aria-label', `Rows per stroke: ${rows}`);
  rowsB.setAttribute('aria-pressed', String(rows > 1));
  if (save) try { localStorage.setItem('stimming.domino.rows', String(rows)); } catch (err) { /* storage is optional */ }
}
rowsB.addEventListener('click', () => setRows(ROWS[(ROWS.indexOf(rows) + 1) % ROWS.length]));
try { setRows(+localStorage.getItem('stimming.domino.rows'), false); } catch (err) { setRows(1, false); }
clearB.addEventListener('click', clearAll);

/* ---------- tile finish ---------- */
// Broad faces carry full colour; the narrow edges sit a shade deeper.
// A cut bar splits each face in two; there are no pips.
// The bar is matte and dark, a gap and not paint.
function carve(mat) {
  const f = x => x.toFixed(4);
  mat.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vLocal;\nvarying vec3 vLN;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvLocal = position;\nvLN = normal;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vLocal;\nvarying vec3 vLN;')
      .replace('#include <color_fragment>', `#include <color_fragment>
        float face = smoothstep(0.6, 0.92, abs(vLN.x));
        float fy = max(fwidth(vLocal.y), 1e-4), fz = max(fwidth(vLocal.z), 1e-4);
        float groove = (1.0 - smoothstep(${f(BAR)} - fy, ${f(BAR)} + fy, abs(vLocal.y)))
          * (1.0 - smoothstep(${f(W / 2 - 0.075)} - fz, ${f(W / 2 - 0.075)} + fz, abs(vLocal.z))) * face;
        diffuseColor.rgb *= mix(0.72, 1.0, face);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.012, 0.01, 0.016), groove);`)
      .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\nroughnessFactor = mix(roughnessFactor, 0.9, groove);')
      .replace('#include <lights_physical_fragment>', '#include <lights_physical_fragment>\nmaterial.clearcoat *= 1.0 - groove;');
  };
  mat.customProgramCacheKey = () => 'domino-carved';
}

/* ---------- start ---------- */
function failed() {
  panel.querySelector('.fail').hidden = false;
  canvas.hidden = true;
  if (hint) hint.hidden = true;
}
// WebGL setup runs in idle slices, so loading never stalls.
async function init() {
  let RoundedBoxGeometry, RoomEnvironment;
  try {
    THREE = await import('three');
    [{ RoundedBoxGeometry }, { RoomEnvironment }] = await Promise.all([
      import('three/addons/geometries/RoundedBoxGeometry.js'),
      import('three/addons/environments/RoomEnvironment.js'),
    ]);
  } catch (err) {
    return failed();
  }
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (err) {
    return failed();
  }
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene = new THREE.Scene();
  await idle();
  // Soft room light makes the lacquer read.
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  pm.dispose();
  scene.environmentIntensity = 0.65;
  persp = new THREE.PerspectiveCamera(FOV, 16 / 9, 0.5, 200);
  ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 200);
  camera = persp;
  sun = new THREE.DirectionalLight(0xffffff, 1.7);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.02;
  scene.add(sun, sun.target);
  // The table itself is the panel; only shadows are drawn on it.
  shade = new THREE.ShadowMaterial({ opacity: 0.44 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), shade);
  floor.rotation.x = -HALF;
  floor.receiveShadow = true;
  scene.add(floor);
  const mat = new THREE.MeshPhysicalMaterial({ roughness: 0.34, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.08 });
  carve(mat);
  const geo = new RoundedBoxGeometry(T, H, W, 4, 0.03);
  col = new THREE.Color(1, 1, 1);
  // Chain tiles and tower tiles share one shape and one finish.
  [mesh, tmesh] = [MAX, MAXP].map(cap => {
    const m = new THREE.InstancedMesh(geo, mat, cap);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.setColorAt(0, col);
    m.count = 0;
    m.frustumCulled = false;
    m.castShadow = m.receiveShadow = true;
    scene.add(m);
    return m;
  });
  ray = new THREE.Raycaster();
  ndc = new THREE.Vector2();
  vtmp = new THREE.Vector3();
  await idle();
  // Async compile keeps the physical-material build off the main thread.
  try { await renderer.compileAsync(scene, camera); } catch (err) { /* first render compiles instead */ }
  ready = true;
  intro = reduce ? 0 : -1;
  // The last view comes back; iso starts already flat.
  let saved = null;
  try { saved = localStorage.getItem('stimming.domino.view'); } catch (err) { /* storage is optional */ }
  if (saved === 'iso') { setView(true, false); lens = 1; cam.pitch = goal.pitch; cam.yaw = goal.yaw; }
  layout();
  new ResizeObserver(layout).observe(panel);
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; wake(); }).observe(panel);
  preset(nowS() + 0.25);
  syncChips();
  wake();
}
if (document.readyState === 'complete') idle().then(init);
else addEventListener('load', () => idle().then(init));
</script>
</body>
</html>
