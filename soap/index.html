<style>
/* Soap cutting: the board at full width under the shared header. */
:root { --stage: oklch(0.21 0.008 265); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%; cursor: crosshair;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.setter { position: relative; }
#setBtn svg { stroke-linecap: round; }
/* Settings lights while it holds the soap in use. */
.setter.holds #setBtn { color: var(--fg); border-color: var(--fg); }
/* Settings opens a tray above the bar. */
.sets {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: grid; gap: 8px; width: max-content; padding: 10px; white-space: nowrap;
  background: oklch(0.19 0.012 275 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
/* A clear strip bridges the gap, so hover survives the move up. */
.sets::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 12px; }
.setter.is-open .sets { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .setter:hover .sets { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .chip { padding: 4px 9px; }
@media (prefers-reduced-motion: reduce) { .stage canvas, .sets { transition: none; } }
</style>

<div class="intro" aria-hidden="true">

const css = ([L, C, h]) => `oklch(${L} ${C} ${h})`;
// The chip dot hints at each soap's pattern.
function swatchCss(v) {
  if (v.mode === 1) return `linear-gradient(${css(v.c)} 0 33%, ${css(v.a)} 0 66%, ${css(v.b)} 0)`;
  if (v.mode === 2) return `repeating-linear-gradient(135deg, ${css(v.a)} 0 3px, ${css(v.b)} 0 5px)`;

// The last soap lives in Settings; the bar holds the rest.
const SWIRL = SOAPS.length - 1;
let soapAt = Math.floor(Math.random() * SWIRL);

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 16, LEAD = 0.004;
let ac = null, out = null, noise = null, askedAt = -1e9, voices = 0, tickNext = 0, thunkNext = 0, restT = 0;

// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.08 * voices);

    body.Q.value = 0.8;

// A context still waking queues sounds for a moment.
function live() {

}
function track(src, ...tails) {

}
// Once the board settles, the context sleeps until the next gesture.
function rest() {

/* ---------- blow: a gust clears shavings and crumbs off the mat ---------- */
// The gust front sweeps across the mat; things move once it reaches them.
let gust = null;
const GUST_DUR = 1.5, GUST_DIR = (() => { const l = Math.hypot(0.94, 0.34); return [0.94 / l, -0.34 / l]; })();
// Wind strength at a stage point now, zero to one.
function windAt(x, z) {
  if (!gust) return 0;
  const u = (nowS() - gust.t0) / GUST_DUR;
  if (u >= 1) return 0;
  const front = -45 + 140 * u, d = x * GUST_DIR[0] + z * GUST_DIR[1];
  return clamp((front - d) / 10) * (1 - clamp((u - 0.7) / 0.3));
}
const offMat = (x, z, pad) => Math.abs(x) > BWc / 2 + pad || Math.abs(z) > BDc / 2 + pad;
// Pieces too small to cut count as crumbs; bigger pieces stay put.
const isCrumb = pc => pc !== bar && !pc.dead && !pc.frozen && !pc.held && pc.ncell < CUT_MIN;
function blow() {
  if (!ready || sweep) return;
  gustSound();
  const crumbs = pieces.filter(isCrumb), flakes = shavings.filter(sh => !sh.growing && !sh.fade);
  if (reduce) {
    // Reduced motion lets them vanish without the flight.
    for (const sh of flakes) sh.fade = 1;
    for (const pc of crumbs) retire(pc);
    wake();
    return;
  }
  gust = { t0: nowS() };
  for (const pc of crumbs) {
    pc.blow = true;
    pc.age = 0;
    pc.gk = rnd(0.7, 1.3);
    if (!pc.kin) wakePiece(pc);
  }
  for (const sh of flakes) {
    sh.blow = true;
    sh.rest = false;
    sh.calm = 0;
    sh.gk = rnd(0.7, 1.4);
  }
  wake();
}

/* ---------- a new bar: sweep the board, slide the next one in ---------- */
let barSoap = -1;
function resetBar() {
  owner.fill(0);
  for (const b of bond) b.fill(0);
  for (const c of chatAx) c.fill(0);
  for (const c of chatPitch) c.fill(0);
  for (const s of scorePlanes) s.clear();
  dirty.clear();
  pN = 0;
  awake.length = 0;
  planAt = 0;
  barSoap = soapAt;
  const v = SOAPS[soapAt];
  barMat = soapMaterial(v, THREE.FrontSide);
  shaveMat = soapMaterial(v, THREE.DoubleSide);
  const ink = new THREE.Color().setRGB(...rgb(v.ink), THREE.SRGBColorSpace);
  INK[0] = ink.r; INK[1] = ink.g; INK[2] = ink.b;
  pvKey = '-';
  bar = { id: 0, cells: Array.from({ length: NC }, (_, i) => i), mesh: null, frozen: false, dead: false, q: [1, 0, 0, 0], c: [0, 0, 0], c0: [0, 0, 0] };
  pieces = [bar];
  shavings = [];
  measure();
  bar.mesh = new THREE.Mesh(buildGeometry(0, bar.cells, false), barMat);
  stage.add(bar.mesh);
}
function makeStage() {
  stage = new THREE.Group();
  stage.scale.setScalar(K);
  scene.add(stage);
}
function newBar(first = false) {
  if (!ready || sweep) return;
  if (stroke?.kind === 'auto') finishAuto();
  if (stroke) endStroke();
  queued = 0;
  hover = null;
  gust = null;
  press = null;
  const old = first ? null : stage, mats = [barMat, shaveMat];
  for (const pc of pieces) pc.frozen = true;
  makeStage();
  resetBar();
  stage.position.x = reduce && !first ? 0 : SW;
  sweep = { t0: nowS(), old, mats: first ? [] : mats, dur: reduce ? 0.35 : first ? 0.9 : 1.1, inAt: first ? 0 : reduce ? 0 : 0.32 };
  if (!first) whoosh();
  wake();
}
const outBack = u => 1 + 2.2 * (u - 1) ** 3 + 1.2 * (u - 1) ** 2;
function updateSweep(now) {
  if (!sweep) return false;
  const u = clamp((now - sweep.t0) / sweep.dur);
  if (sweep.old) {
    // Reduced motion swaps the bars without the slide.
    const k = reduce ? 1 : clamp(u / 0.5);
    sweep.old.position.x = -SW * k * k * k;
    sweep.old.visible = k < 1;
  }
  const k2 = clamp((u - sweep.inAt) / (1 - sweep.inAt));
  stage.position.x = reduce ? 0 : SW * (1 - outBack(k2));
  if (u >= 1) {
    stage.position.x = 0;
    if (sweep.old) {
      sweep.old.traverse(o => o.geometry?.dispose());
      sweep.old.removeFromParent();
      for (const m of sweep.mats) m.dispose();
    }
    sweep = null;
    // A soap picked mid-sweep arrives next.
    if (barSoap !== soapAt) newBar();
  }
  return true;
}

/* ---------- one loop, only while something moves ---------- */
let raf = 0, last = 0, onScreen = true, slow = 0, builtAt = 0;
function wake() {
  if (!raf && ready && onScreen && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(ms) {
  raf = 0;
  const raw = Math.max(0, (ms - last) / 1000), dt = Math.min(raw, 1 / 30), now = ms / 1000;
  last = ms;
  // Sustained slow frames drop the pixel ratio to 1.
  if (!lowDpr) {
    slow = raw > 0.03 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 20) { lowDpr = true; dispatchEvent(new Event('perf-low')); }
  }
  let busy = updateAuto(nowS());
  if (gust) { busy = true; if (nowS() - gust.t0 > GUST_DUR) gust = null; }
  // The scrape follows the blade's speed through the soap.
  const st = stroke;
  if (st) {
    // A piece knocked loose mid-stroke drops the stroke.
    if (st.pc !== bar && !st.done && (st.pc.awake || st.pc.dead)) st.dead = true;
    const inst = st.moved / Math.max(dt, 1 / 240);
    st.moved = 0;
    st.speed += (inst - st.speed) * (inst > st.speed ? 0.5 : 0.25);
    if (st.speed < 0.05) st.speed = 0;
    scrape(st.done || st.dead ? 0 : st.speed * K);
    if (st.speed > 4.5 && !st.done && Math.random() < st.speed * K * dt * 0.3) crumb(rnd(0.08, 0.22), 0, rnd(1, 1.6));
    if (st.speed > 0) busy = true;
    // A still hold on a scored cube becomes a press.
    if (st.press && !press && nowS() - st.press.t0 > HOLD) {
      startPress(st.press.rings, 'hold');
      st.press = null;
      st.dead = st.held = true;
    }
    if (st.press) busy = true;
  }
  if (updatePress(nowS(), dt)) busy = true;
  if (physics(dt * TS)) busy = true;
  if (updateShavings(dt * TS)) busy = true;
  if (updateBlade(dt)) busy = true;
  if (updateSweep(nowS())) busy = true;
  // Scores show up as the blade passes, a few times a second.
  if (dirty.size && (!stroke || now - builtAt > 0.07)) { rebuildDirty(); builtAt = now; }
  if (dirty.size) busy = true;
  updatePreview();
  renderer.render(scene, camera);
  // A wake in this frame may have queued the next one.
  if (busy && onScreen && !document.hidden) { if (!raf) raf = requestAnimationFrame(frame); }
  else if (!raf) { scrape(0); rest(); }
}

/* ---------- input ---------- */
panel.addEventListener('pointerdown', e => {
  // A Mac reports Ctrl-click as the right button.
  if (!ready || sweep || press || (e.pointerType === 'mouse' && e.button !== 0 && !(e.ctrlKey && e.button === 2))) return;
  if (stroke) { if (stroke.kind !== 'auto') return; finishAuto(); }
  hover = null;
  const rs = rayAt(e.clientX, e.clientY), h = hitAny(rs), st = makeStroke('user');
  st.id = e.pointerId;
  st.outside = !h;
  st.deep = e.shiftKey;
  st.ray = rs;
  if (h) {
    st.pc = h.pc;
    st.box = bounds(h.pc);
    bindFace(st, h.hit, null);
    const q = onPlane(h.r, st.a, st.F);
    if (q) st.pts.push(q);
    // A press on a scored cube of the bar's top may pop it.
    const id = q && h.pc === bar && st.a === 1 && st.sg > 0 ? seedAt(q, st.F) : -1, rings = id >= 0 ? pressPlan(id) : null;
    // Ctrl-click pops the whole grid from that cube.
    if (rings && e.ctrlKey) { startPress(rings, 'auto'); wake(); return; }
    if (rings) st.press = { rings, x: e.clientX, y: e.clientY, t0: nowS() };
  }
  stroke = st;
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  wake();
});
panel.addEventListener('pointermove', e => {
  const st = stroke;
  if (!st) { if (e.pointerType === 'mouse') setHover(e.clientX, e.clientY); return; }
  if (st.kind !== 'user' || e.pointerId !== st.id) return;
  if (e.shiftKey) st.deep = true;
  // A real move turns a press into a drag.
  if (st.press && Math.hypot(e.clientX - st.press.x, e.clientY - st.press.y) > 9) st.press = null;
  const list = e.getCoalescedEvents?.() || [];
  for (const c of list.length ? list : [e]) {
    const rs = rayAt(c.clientX, c.clientY);
    if (st.a < 0) { enter(st, rs, c.clientX, c.clientY); if (st.a < 0) continue; }
    follow(st, rs);
  }
  wake();
});
panel.addEventListener('contextmenu', e => e.preventDefault());
panel.addEventListener('pointerleave', e => { if (!stroke && e.pointerType === 'mouse') setHover(null, null); });
// A swipe from outside binds to the first piece it crosses.
// A top face binds at once.
// A side face binds after a real drag along it.
function enter(st, rs, x, y) {
  const h = hitAny(rs);
  if (h) {
    const n = [0, 0, 0];
    n[h.hit.a] = h.hit.sg;
    dirToStage(h.pc, n, n);
    const bind = from => { st.pc = h.pc; st.box = bounds(h.pc); bindFace(st, h.hit, from); };
    if (n[1] > 0.7) bind(st.ray);
    else {
      if (!st.front || st.front.pc !== h.pc || st.front.a !== h.hit.a) st.front = { ray: st.ray, x, y, pc: h.pc, a: h.hit.a };
      if (Math.hypot(x - st.front.x, y - st.front.y) > 28) bind(st.front.ray);
    }
  }
  st.ray = rs;
}
// A tap on a scored cube pops it; a held press lets go.
function release(e) {
  const st = stroke;
  if (st?.kind !== 'user' || e.pointerId !== st.id) return;
  if (st.press && !press && st.t < 0) startPress(st.press.rings, 'tap');
  else if (st.held && press?.mode === 'hold') { press.go = true; press.goAt = nowS(); }
  endStroke();
}
panel.addEventListener('pointerup', release);
panel.addEventListener('pointercancel', release);
panel.addEventListener('lostpointercapture', release);
// Keyboard focus shows where Space will cut next.
panel.addEventListener('focus', () => { kbFocus = panel.matches(':focus-visible'); wake(); });
panel.addEventListener('blur', () => { kbFocus = false; wake(); });

/* ---------- the soap chips ---------- */
const soapsEl = document.getElementById('soaps'), swirlEl = document.getElementById('swirl');
const setter = document.getElementById('setter'), setBtn = document.getElementById('setBtn');
const chipFace = v => `<span class="dot" style="--c: ${swatchCss(v)}" aria-hidden="true"></span>${v.name}`;
soapsEl.innerHTML = SOAPS.slice(0, SWIRL).map((v, i) => `<button class="chip" type="button" data-value="${i}" aria-pressed="false" aria-keyshortcuts="${i + 1}">${chipFace(v)}</button>`).join('');
swirlEl.innerHTML = chipFace(SOAPS[SWIRL]);
const soapChips = [...soapsEl.children];
// Swirl off goes back to the last soap from the bar.
let soapBack = soapAt;
function paintSoaps() {
  soapChips.forEach((el, i) => el.setAttribute('aria-pressed', String(i === soapAt)));
  swirlEl.setAttribute('aria-pressed', String(soapAt === SWIRL));
  setter.classList.toggle('holds', soapAt === SWIRL);
}
// A new pick slides a fresh bar of that soap in.
// A pick before the toy loads changes nothing.
function setSoap(i) {
  if (ready && i !== soapAt) {
    if (i !== SWIRL) soapBack = i;
    soapAt = i;
    newBar();
  }
  paintSoaps();
}
choices(soapsEl, v => setSoap(+v));
// A pointer pick hands the keys back to the stage.
soapsEl.addEventListener('click', e => { if (e.detail) panel.focus({ preventScroll: true }); });
const openSets = on => { setter.classList.toggle('is-open', on); setBtn.setAttribute('aria-expanded', String(on)); };
setBtn.addEventListener('click', () => openSets(!setter.classList.contains('is-open')));
swirlEl.addEventListener('click', e => {
  setSoap(soapAt === SWIRL ? soapBack : SWIRL);
  openSets(false);
  if (e.detail) panel.focus({ preventScroll: true });
});
document.addEventListener('pointerdown', e => { if (!setter.contains(e.target)) openSets(false); });
addEventListener('keydown', e => { if (e.key === 'Escape') openSets(false); });
paintSoaps();

addEventListener('keydown', e => {
  if (!ready || e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  // Buttons and links keep their own keys.
  if (e.target instanceof Element && e.target.closest('button, a, input, select, textarea')) return;
  if (e.key === ' ') { e.preventDefault(); if (!e.repeat) nextCut(); }
  else if (e.key === 'n' || e.key === 'N') { if (!e.repeat) newBar(); }
  else if (e.key === 'b' || e.key === 'B') { if (!e.repeat) blow(); }
  else if (e.key === 'Enter') {
    // Enter pops the whole grid from its middle.
    const rings = !e.repeat && !press && !sweep && !stroke ? gridPlan() : null;
    if (rings) startPress(rings, 'auto');
  }
  else if (e.key >= '1' && e.key <= String(SOAPS.length)) setSoap(+e.key - 1);
});
document.getElementById('fresh').addEventListener('click', () => newBar());
document.getElementById('blow').addEventListener('click', () => blow());
sound.onChange(on => {
  if (on) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(panel);
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

/* ---------- start: WebGL setup in idle slices ---------- */
function failed() {
  panel.querySelector('.fail').hidden = false;
  document.getElementById('fresh').disabled = true;
  document.getElementById('blow').disabled = true;
  [...soapChips, swirlEl, setBtn].forEach(el => { el.disabled = true; });
}
async function start() {
  let RoomEnvironment;
  try {
    THREE = await import('three');
    ({ RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js'));
  } catch (err) {
    console.error(err);
    return failed();
  }
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (err) {
    console.error(err);
    return failed();
  }
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.NeutralToneMapping;
  const canvas = renderer.domElement;
  canvas.setAttribute('aria-hidden', 'true');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 16 / 9, 1, 500);
  ray = new THREE.Raycaster();
  ndc = new THREE.Vector2();
  vtmp = new THREE.Vector3();
  tgt = new THREE.Vector3(0, 2.4, 0.6);
  await idle();

  // Soft studio light for the wax and the steel.
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  pm.dispose();
  scene.environmentIntensity = 0.55;
  // The key light comes from the left, grazing the front face.
  const key = new THREE.DirectionalLight(0xfff3e6, 2.5);
  key.position.set(-26, 40, 8);
  scene.add(key, key.target);
  // The mat is a square slab; the cut grid covers its top only.
  const { top, edge } = matMaterials();
  const boardMesh = new THREE.Mesh(new THREE.BoxGeometry(BW, BT, BD), [edge, edge, top, edge, edge, edge]);
  boardMesh.position.y = -BT / 2;
  scene.add(boardMesh);
  blade = new THREE.Mesh(bladeGeometry(), new THREE.MeshStandardMaterial({ vertexColors: true, metalness: 1, roughness: 0.2, envMapIntensity: 2.2 }));
  blade.matrixAutoUpdate = false;
  scene.add(blade);
  pvMat = new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, depthWrite: false, toneMapped: false, side: THREE.DoubleSide,
    polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4,
  });
  pv = new THREE.Mesh(new THREE.BufferGeometry(), pvMat);
  pv.matrixAutoUpdate = false;
  pv.renderOrder = 2;
  pv.visible = false;
  pv.frustumCulled = false;
  scene.add(pv);
  makeStage();
  await idle();
  resetBar();
  stage.position.x = reduce ? 0 : SW;

  panel.prepend(canvas);
  fitRenderer(1.5, (w, h) => {
    fit(w, h);
    if (ready) { renderer.render(scene, camera); wake(); }
  }, 1.4e6);
  if (!camera.aspect) fit(16, 9);
  await idle();
  // Async compile keeps the shader build off the main thread.
  const probe = new THREE.Mesh(shavingGeometry(), shaveMat);
  probe.position.y = -60;
  scene.add(probe);
  blade.matrix.makeTranslation(0, -60, 0);
  blade.visible = true;
  try { await renderer.compileAsync(scene, camera); } catch (err) { /* first render compiles instead */ }
  probe.removeFromParent();
  probe.geometry.dispose();
  blade.visible = false;
  ready = true;
  sweep = { t0: nowS(), old: null, mats: [], dur: reduce ? 0.01 : 0.9, inAt: 0 };
  renderer.render(scene, camera);
  requestAnimationFrame(() => canvas.classList.add('on'));
  wake();
}
start().catch(err => { console.error(err); failed(); });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
