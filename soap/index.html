  if (!lowDpr) {
    slow = raw > 0.03 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 20) { lowDpr = true; dispatchEvent(new Event('perf-low')); }
  }
  let busy = updateAuto(nowS());
  // The scrape follows the blade's speed through the soap.
  const st = stroke;
  if (st) {
    const inst = st.moved / Math.max(dt, 1 / 240);
    st.moved = 0;
    st.speed += (inst - st.speed) * (inst > st.speed ? 0.5 : 0.25);
    if (st.speed < 0.05) st.speed = 0;
    scrape(st.done ? 0 : st.speed);
    if (st.speed > 3 && !st.done && Math.random() < st.speed * dt * 0.3) crumb(rnd(0.08, 0.22), 0, rnd(1, 1.6));
    if (st.speed > 0) busy = true;
  }
  if (physics(dt)) busy = true;
  if (updateShavings(dt)) busy = true;
  if (updateBlade(dt)) busy = true;
  if (updateSweep(nowS())) busy = true;
  // Scores show up as the blade passes, a few times a second.
  if (staticDirty && (!stroke || now - builtAt > 0.07)) { rebuildStatic(); builtAt = now; }
  if (staticDirty) busy = true;
  renderer.render(scene, camera);
  // A wake in this frame may have queued the next one.
  if (busy && onScreen && !document.hidden) { if (!raf) raf = requestAnimationFrame(frame); }
  else if (!raf) { scrape(0); rest(); }
}

/* ---------- input ---------- */
panel.addEventListener('pointerdown', e => {
  if (!ready || sweep || (e.pointerType === 'mouse' && e.button !== 0)) return;
  if (stroke) { if (stroke.kind !== 'auto') return; finishAuto(); }
  const r = rayAt(e.clientX, e.clientY), hit = voxelHit(r), st = makeStroke('user');
  st.id = e.pointerId;
  st.outside = !hit;
  st.ray = r;
  if (hit) {
    bindFace(st, hit, null);
    const q = onPlane(r, st.a, st.F);
    if (q) st.pts.push(q);
  }
  stroke = st;
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  wake();
});
panel.addEventListener('pointermove', e => {
  const st = stroke;
  if (!st || st.kind !== 'user' || e.pointerId !== st.id) return;
  const list = e.getCoalescedEvents?.() || [];
  for (const c of list.length ? list : [e]) {
    const r = rayAt(c.clientX, c.clientY);
    if (st.a < 0) { enter(st, r, c.clientX, c.clientY); if (st.a < 0) continue; }
    follow(st, r);
  }
  wake();
});
// A swipe from outside binds to the top as it crosses.
// It takes the front face only after a real drag along it.
function enter(st, r, x, y) {
  const top = box.hi[1] + 1, q = onPlane(r, 1, top);
  if (q && q[0] >= box.lo[0] && q[0] <= box.hi[0] + 1 && q[2] >= box.lo[2] && q[2] <= box.hi[2] + 1) {
    bindFace(st, { a: 1, sg: 1, F: top }, st.ray);
  } else {
    const hit = voxelHit(r);
    if (hit && hit.a === 2 && hit.sg > 0) {
      if (!st.front) st.front = { ray: st.ray, x, y };
      if (Math.hypot(x - st.front.x, y - st.front.y) > 28) bindFace(st, hit, st.front.ray);
    }
  }
  st.ray = r;
}
function release(e) {
  if (stroke?.kind === 'user' && e.pointerId === stroke.id) endStroke();
}
panel.addEventListener('pointerup', release);
panel.addEventListener('pointercancel', release);
panel.addEventListener('lostpointercapture', release);
addEventListener('keydown', e => {
  if (!ready || e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  // Buttons and links keep their own keys.
  if (e.target instanceof Element && e.target.closest('button, a, input, select, textarea')) return;
  if (e.key === ' ') { e.preventDefault(); if (!e.repeat) nextCut(); }
  else if (e.key === 'n' || e.key === 'N') { if (!e.repeat) newBar(); }
});
document.getElementById('fresh').addEventListener('click', () => newBar());
const sndB = document.getElementById('snd');
const showSound = () => sndB.setAttribute('aria-pressed', String(soundOn));
showSound();
sndB.addEventListener('click', () => {
  soundOn = !soundOn;
  showSound();
  try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (err) { /* storage is optional */ }
  if (soundOn) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(panel);
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

/* ---------- start: WebGL setup in idle slices ---------- */
function failed() {
  panel.querySelector('.fail').hidden = false;
}
async function start() {
  let RoomEnvironment, RoundedBoxGeometry;
  try {
    THREE = await import('three');
    [{ RoomEnvironment }, { RoundedBoxGeometry }] = await Promise.all([
      import('three/addons/environments/RoomEnvironment.js'),
      import('three/addons/geometries/RoundedBoxGeometry.js'),
    ]);
  } catch (err) {
    console.error(err);
    return failed();
  }
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (err) {
    console.error(err);
    return failed();
  }
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const canvas = renderer.domElement;
  canvas.setAttribute('aria-hidden', 'true');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 16 / 9, 1, 500);
  ray = new THREE.Raycaster();
  ndc = new THREE.Vector2();
  vtmp = new THREE.Vector3();
  tgt = new THREE.Vector3(0, 2.4, 0.6);
  await idle();

  // Soft studio light for the wax and the steel.
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  pm.dispose();
  scene.environmentIntensity = 0.55;
  // The key light comes from the left, grazing the front face.
  const key = new THREE.DirectionalLight(0xfff3e6, 2.5);
  key.position.set(-26, 40, 8);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  const sc = key.shadow.camera;
  sc.left = sc.bottom = -34;
  sc.right = sc.top = 34;
  sc.near = 1;
  sc.far = 120;
  key.shadow.bias = -0.0004;
  key.shadow.normalBias = 0.05;
  scene.add(key, key.target);
  // The panel itself is the table.
  // Only the board's shadow is drawn on it.
  const table = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.ShadowMaterial({ opacity: 0.45 }));
  table.rotation.x = -Math.PI / 2;
  table.position.y = -BT;
  table.receiveShadow = true;
  scene.add(table);
  const boardMesh = new THREE.Mesh(
    new RoundedBoxGeometry(BW, BT, BD, 4, 0.9),
    new THREE.MeshStandardMaterial({ map: woodTexture(), roughness: 0.68, metalness: 0 }),
  );
  boardMesh.position.y = -BT / 2;
  boardMesh.receiveShadow = boardMesh.castShadow = true;
  scene.add(boardMesh);
  blade = new THREE.Mesh(bladeGeometry(), new THREE.MeshStandardMaterial({ vertexColors: true, metalness: 1, roughness: 0.2, envMapIntensity: 2.2 }));
  blade.castShadow = true;
  blade.matrixAutoUpdate = false;
  scene.add(blade);
  stage = new THREE.Group();
  scene.add(stage);
  await idle();
  resetBar();
  stage.position.x = reduce ? 0 : SW;

  panel.prepend(canvas);
  fitRenderer(1.5, (w, h) => {
    fit(w, h);
    if (ready) { renderer.render(scene, camera); wake(); }
  }, 1.4e6);
  if (!camera.aspect) fit(16, 9);
  await idle();
  // Async compile keeps the shader build off the main thread.
  const probe = new THREE.Mesh(shavingGeometry(), shaveMat);
  probe.position.y = -60;
  scene.add(probe);
  blade.matrix.makeTranslation(0, -60, 0);
  blade.visible = true;
  try { await renderer.compileAsync(scene, camera); } catch (err) { /* first render compiles instead */ }
  probe.removeFromParent();
  probe.geometry.dispose();
  blade.visible = false;
  ready = true;
  sweep = { t0: nowS(), old: null, mats: [], dur: reduce ? 0.01 : 0.9, inAt: 0 };
  renderer.render(scene, camera);
  requestAnimationFrame(() => canvas.classList.add('on'));
  wake();
}
start().catch(err => { console.error(err); failed(); });
</script>
</body>
