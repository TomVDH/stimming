  canvas.setAttribute('aria-hidden', 'true');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 16 / 9, 1, 500);
  tmp = new THREE.Vector3();
  await idle();

  // A dim floor replaces the room's, so lower faces mirror the table.
  const room = new RoomEnvironment();
  const floor = new THREE.Mesh(new THREE.CircleGeometry(80, 48), new THREE.MeshBasicMaterial({ color: 0x2a2c31 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.6;
  room.add(floor);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(room, 0.03).texture;
  room.dispose();
  pm.dispose();
  scene.environmentIntensity = 0.85;

  const table = new THREE.Mesh(
    new THREE.PlaneGeometry(900, 900),
    new THREE.MeshStandardMaterial({ color: tableC, roughness: 0.95, metalness: 0, envMapIntensity: 0.4 }),
  );
  table.rotation.x = -Math.PI / 2;
  table.receiveShadow = true;
  scene.add(table);
  // A soft lamp pools light mid-table and lays the top's shadow.
  const lamp = new THREE.SpotLight(0xffffff, 2.6, 0, 0.42, 0.95, 0);
  lamp.position.set(-17, 44, 12);
  lamp.target.position.set(0, 0, 0);
  lamp.castShadow = true;
  lamp.shadow.mapSize.set(1024, 1024);
  lamp.shadow.camera.near = 20;
  lamp.shadow.camera.far = 90;
  lamp.shadow.bias = -0.0004;
  lamp.shadow.normalBias = 0.02;
  scene.add(lamp, lamp.target);
  await idle();

  // The body is one lathe, painted in the shader.
  // Its uv.y runs along the profile's arc length.
  const small = Math.min(innerWidth, innerHeight) < 700, seg = small ? 72 : 96;
  const prof = even(BODY.p, 160), arc = arcs(BODY.p), len = arc[arc.length - 1];
  const sAt = {};
  for (const k in BODY.at) sAt[k] = arc[BODY.at[k]];
  const bands = paintBands(sAt, len);
  const col = c => new THREE.Color().setRGB(...linFit(c), THREE.LinearSRGBColorSpace);
  uni = {
    uBlur: { value: 0 },
    uLen: { value: len },
    uBand: { value: bands.map(b => new THREE.Vector4(b[0], b[1], b[2], b[3])) },
    uColA: { value: bands.map(b => col(b[4])) },
    uColB: { value: bands.map(b => col(b[5])) },
    uBase: { value: col([0.58, 0.21, 28]) },
  };
  const lacquer = new THREE.MeshPhysicalMaterial({ roughness: 0.34, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.06 });
  lacquer.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, uni);
    sh.vertexShader = sh.vertexShader
      .replace('#include <uv_pars_vertex>', '#include <uv_pars_vertex>\nvarying vec2 vPat;')
      .replace('#include <uv_vertex>', '#include <uv_vertex>\nvPat = uv;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <uv_pars_fragment>', '#include <uv_pars_fragment>\n' + PAINT)
      .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb = paint();');
  };
  const bodyG = new THREE.LatheGeometry(prof.map(([r, y]) => new THREE.Vector2(r, y)), seg);
  bodyG.translate(0, -YC, 0);
  // Polished steel at the tip.
  const tipG = new THREE.LatheGeometry(TIP.map(([r, y]) => new THREE.Vector2(r, y)), small ? 32 : 48);
  tipG.translate(0, -YC, 0);
  const steel = new THREE.MeshStandardMaterial({ color: 0xe6e8ec, metalness: 1, roughness: 0.2, envMapIntensity: 2.4 });
  top = new THREE.Group();
  const body = new THREE.Mesh(bodyG, lacquer), tip = new THREE.Mesh(tipG, steel);
  body.castShadow = tip.castShadow = true;
  top.add(body, tip);
  scene.add(top);

  panel.prepend(canvas);
  fitRenderer(renderer, panel, 1.5, (w, h) => {
    fit(w, h);
    if (ready) { draw(); wake(); }
  }, 1.4e6);
  if (!panel.clientWidth) fit(16, 9);
  await idle();
  // Async compile keeps the physical-material build off the main thread.
  try { await renderer.compileAsync(scene, camera); } catch (err) { /* the first render compiles instead */ }
  ready = true;
  draw();
  requestAnimationFrame(() => canvas.classList.add('on'));
}
start().catch(err => { console.error(err); failed(); });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
</body>
</html>
