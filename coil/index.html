/* ---------- physics: a planar chain of rigid rings ---------- */
// Units are metres, kilograms and seconds.
// X runs down the stairs and Y runs up.

const TREAD = 0.088, RISE = 0.079, BACK = -0.6;

    for (let k = 0; k < 3; k++) {
      const g = ((q + k / 2) * Math.PI) / 2, nr = Math.cos(g), na = Math.sin(g);
      prof.push([sx * (a - r) + r * nr, sy * (b - r) + r * na, nr, na]);
    }
  }
  const P = prof.length, M = (N - 1) * SEG, V = (M + 1) * P;
  const pos = new Float32Array(V * 3), s = new Float32Array(V), sec = new Float32Array(V * 4), col = new Float32Array(V * 3);
  for (let j = 0; j <= M; j++) {
    // The hue runs red to violet along the coil.
    const u = j / M, c = linear(0.72, 0.19, 22 + 300 * u);
    for (let p = 0; p < P; p++) {
      const v = j * P + p;
      s[v] = j / SEG;
      sec.set(prof[p], v * 4);
      col.set(c, v * 3);
    }
  }
  const idx = new Uint32Array(M * P * 6);
  let o = 0;
  for (let j = 0; j < M; j++) for (let p = 0; p < P; p++) {
    const a0 = j * P + p, a1 = j * P + ((p + 1) % P), b0 = a0 + P, b1 = a1 + P;
    idx[o++] = a0; idx[o++] = a1; idx[o++] = b0;
    idx[o++] = a1; idx[o++] = b1; idx[o++] = b0;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aS', new THREE.BufferAttribute(s, 1));
  g.setAttribute('aSec', new THREE.BufferAttribute(sec, 4));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}
function coilMaterials() {
  const mat = new THREE.MeshPhysicalMaterial({
    vertexColors: true, roughness: 0.34, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.06, specularIntensity: 0.6,
  });
  mat.onBeforeCompile = sh => {
    sh.uniforms.tRing = { value: ringTex };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\n' + COIL_VS)
      .replace('#include <beginnormal_vertex>', 'coilPoint();\nvec3 objectNormal = coilNrm;')
      .replace('#include <begin_vertex>', 'vec3 transformed = coilPos;');
    // Thin plastic glows a little in its own colour.
    sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += vColor * 0.045;');
  };
  const depth = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
  depth.onBeforeCompile = sh => {
    sh.uniforms.tRing = { value: ringTex };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\n' + COIL_VS)
      .replace('#include <begin_vertex>', 'coilPoint();\nvec3 transformed = coilPos;');
  };
  return [mat, depth];
}
function woodMaterial(RoundedBoxGeometry) {
  const mat = new THREE.MeshPhysicalMaterial({ roughness: 0.5, metalness: 0, clearcoat: 0.45, clearcoatRoughness: 0.32 });
  const W = [linear(0.62, 0.09, 64), linear(0.45, 0.085, 48), linear(0.34, 0.065, 40)];
  mat.onBeforeCompile = sh => {
    sh.uniforms.uWoodA = { value: new THREE.Vector3(...W[0]) };
    sh.uniforms.uWoodB = { value: new THREE.Vector3(...W[1]) };
    sh.uniforms.uWoodC = { value: new THREE.Vector3(...W[2]) };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + WOOD_FS)
      .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb = woodColor(vWP);')
      .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\nroughnessFactor = mix(0.42, 0.66, woodK);');
  };
  const group = new THREE.Group();
  // Three solid steps; the top one runs back out of view.
  const blocks = [[BACK, NOSE[0], LEVEL[0]], [NOSE[0], NOSE[1], LEVEL[1]], [NOSE[1], NOSE[2], LEVEL[2]]];
  for (const [x0, x1, top] of blocks) {
    const m = new THREE.Mesh(new RoundedBoxGeometry(x1 - x0, top, WIDE, 3, 0.0035), mat);
    m.position.set((x0 + x1) / 2, top / 2, 0);
    m.castShadow = m.receiveShadow = true;
    group.add(m);
  }
  return group;
}

// A photo sweep: the floor curves up into a wall behind the stairs.
function sweep() {
  const prof = [[2.5, 0, 0, 1], [-0.3, 0, 0, 1]], R = 0.5;
  for (let k = 1; k <= 18; k++) {
    const b = (k / 18) * (Math.PI / 2);
    prof.push([-0.3 - R * Math.sin(b), R - R * Math.cos(b), Math.sin(b), Math.cos(b)]);
  }
  prof.push([-0.3 - R, 5, 1, 0]);
  const pos = [], nrm = [], idx = [];
  prof.forEach(([z, y, nz, ny], i) => {
    for (const x of [-6, 6]) { pos.push(x, y, z); nrm.push(0, ny, nz); }
    if (i) idx.push(2 * i - 2, 2 * i - 1, 2 * i, 2 * i - 1, 2 * i + 1, 2 * i);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  g.setIndex(idx);
  return g;
}

// Budget caps drawing-buffer pixels, so big screens keep their frame rate.
function fitRenderer(cap, budget) {
  const apply = () => {
    const w = panel.clientWidth, h = panel.clientHeight;
    if (!w || !h) return;
    renderer.setPixelRatio(Math.min(devicePixelRatio, lowDpr ? 1 : cap, Math.sqrt(budget / (w * h))));
    renderer.setSize(w, h, false);
    fit(w / h);
    if (ready) { draw(); wake(); }
  };
  new ResizeObserver(apply).observe(panel);
  addEventListener('perf-low', apply);
  apply();
}
// The camera looks in from the front right and a little above.
// It backs off until the whole box of action fits.
function fit(A) {
  camera.aspect = A;
  camera.updateProjectionMatrix();
  const az = A < 1.1 ? 0.22 : 0.3, el = 0.21;
  const cx = (BOX.x0 + BOX.x1) / 2, cy = (BOX.y0 + BOX.y1) / 2 - 0.01;
  const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  let lo = 0.2, hi = 4;
  for (let it = 0; it < 30; it++) {
    const d = (lo + hi) / 2;
    camera.position.set(cx + dir.x * d, cy + dir.y * d, dir.z * d);
    camera.lookAt(cx, cy, 0);
    camera.updateMatrixWorld();
    let ok = true;
    for (const x of [BOX.x0, BOX.x1]) for (const y of [BOX.y0, BOX.y1]) for (const z of [-0.05, 0.05]) {
      tmpV.set(x, y, z).project(camera);
      if (Math.abs(tmpV.x) > 0.94 || Math.abs(tmpV.y) > 0.92) ok = false;
    }
    if (ok) hi = d; else lo = d;
  }
  camera.position.set(cx + dir.x * hi, cy + dir.y * hi, dir.z * hi);
  camera.lookAt(cx, cy, 0);
  camera.updateMatrixWorld();
}
function upload() {
  for (let i = 0; i < N; i++) {
    ringData[4 * i] = X[i];
    ringData[4 * i + 1] = Y[i];
    ringData[4 * i + 2] = TH[i];
  }
  ringTex.needsUpdate = true;
}
function draw() {
  upload();
  renderer.render(scene, camera);
}

/* ---------- the hand: held by the pointer or by a key ---------- */
// A scripted hand follows a curve, holds, then lets go.
let hand = null, drag = null;
const bez = (a, b, c, d, u) => {
  const m = 1 - u;
  return m * m * m * a + 3 * m * m * u * b + 3 * m * u * u * c + u * u * u * d;
};
function coilLength() {
  let s = 0;
  for (let i = 1; i < N; i++) s += Math.hypot(X[i] - X[i - 1], Y[i] - Y[i - 1]);
  return s;
}
// The end that sits higher is the one a hand would pick up.
function ends() {
  if (Math.abs(Y[N - 1] - Y[0]) < 0.03) return X[0] < X[N - 1] ? [0, N - 1] : [N - 1, 0];
  return Y[N - 1] > Y[0] ? [N - 1, 0] : [0, N - 1];
}
// Lifts the top end over the next edge and sets it down beyond.
function nudge() {
  if (!ready || drag) return;
  const [top, base] = ends();
  const k = Math.min(3, region(X[base]) % 4);
  let lx, ly;
  if (k < 2) { lx = NOSE[k] + TREAD * 0.6; ly = LEVEL[k + 1]; }
  else if (k === 2) { lx = NOSE[2] + 0.07; ly = 0; }
  else { lx = X[base] + (X[base] > 0.3 ? -0.1 : 0.1); ly = 0; }
  const up = Math.max(Y[top], ly) + 0.12;
  hand = { i: top, t: 0, dur: 0.8, hold: 0.1, px: [X[top], X[top], lx, lx], py: [Y[top], up, up, ly + 2 * THK] };
  wake();
}
// The up arrow plucks the top end upward and lets it snap back.
function pluck() {
  if (!ready || drag) return;
  const [top] = ends();
  hand = { i: top, t: 0, dur: 0.35, hold: 0.12, px: [X[top], X[top], X[top], X[top]], py: [Y[top], Y[top] + 0.08, Y[top] + 0.16, Y[top] + 0.16] };
  wake();
}
function steer(dt) {
  if (drag) {
    grip.i = drag.i;
    drag.ox *= 0.86; drag.oy *= 0.86;
    grip.x = clamp(drag.x + drag.ox, BOX.x0 + 0.02, BOX.x1 + 0.05);
    grip.y = clamp(drag.y + drag.oy, levelAt(grip.x) + 0.004, 0.62);
    return true;
  }
  if (!hand) { grip.i = -1; return false; }
  hand.t += dt;
  const u = clamp(hand.t / hand.dur), e = u * u * (3 - 2 * u);
  grip.i = hand.i;
  grip.x = bez(...hand.px, e);
  grip.y = bez(...hand.py, e);
  if (hand.t > hand.dur + hand.hold) { hand = null; grip.i = -1; }
  return true;
}
function resetCoil0() {
  hand = drag = null;
  resetCoil(NOSE[0] - ROUT - 0.006, reduce ? 0 : 0.014);
  calm = 0;
  wake();
}

/* ---------- one loop, only while something moves ---------- */
let raf = 0, last = 0, onScreen = true, slow = 0, calm = 0, lenPrev = 0, rate = 0;
function wake() {
  if (!raf && ready && onScreen && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(ms) {
  raf = 0;
  const raw = Math.max(0, (ms - last) / 1000), dt = clamp(raw, 1 / 240, 1 / 30);
  last = ms;
  // Sustained slow frames drop the pixel ratio to 1.
  if (!lowDpr) {
    slow = raw > 0.03 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 20) { lowDpr = true; dispatchEvent(new Event('perf-low')); }
  }
  const held = steer(dt);
  hits.ring = hits.ringN = hits.step = hits.stepN = 0;
  const e = stepCoil(dt);
  if (!Number.isFinite(e)) { resetCoil0(); return; }
  const pan = x => (x - 0.15) / 0.3;
  if (hits.ringN) {
    clack(hits.ring, pan(hits.ringX));
    // Many turns closing at once rattle for a moment.
    if (hits.ringN > 4) clack(hits.ring * 0.7, pan(hits.ringX), 0.03);
  }
  if (hits.stepN) knock(hits.step, pan(hits.stepX));
  const len = coilLength();
  rate += (Math.abs(len - lenPrev) / dt - rate) * 0.3;
  lenPrev = len;
  shimmerAt(rate, len);
  draw();
  // The coil sleeps once it has been still for a moment.
  calm = e < 2e-4 && !held ? calm + dt : 0;
  if (calm < 0.4 && onScreen && !document.hidden) raf = requestAnimationFrame(frame);
  else rest();
}

/* ---------- input ---------- */
function toPlane(cx, cy) {
  const r = panel.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, 1 - ((cy - r.top) / r.height) * 2);
  ray.setFromCamera(ndc, camera);
  return ray.ray.intersectPlane(plane, hitV) ? { x: hitV.x, y: hitV.y } : null;
}
// The nearer end of the coil, if the point is on or near the coil.
function pick(p, touch) {
  let near = Infinity;
  for (let i = 0; i < N; i += 3) near = Math.min(near, Math.hypot(X[i] - p.x, Y[i] - p.y));
  const d0 = Math.hypot(X[0] - p.x, Y[0] - p.y), d1 = Math.hypot(X[N - 1] - p.x, Y[N - 1] - p.y);
  const reach = touch ? 0.075 : 0.055;
  if (Math.min(near, d0, d1) > reach) return -1;
  return d1 <= d0 ? N - 1 : 0;
}
panel.addEventListener('pointerdown', e => {
  if (!ready || drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const p = toPlane(e.clientX, e.clientY);
  if (!p) return;
  const i = pick(p, e.pointerType !== 'mouse');
  if (i < 0) return;
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  hand = null;
  drag = { id: e.pointerId, i, x: p.x, y: p.y, ox: X[i] - p.x, oy: Y[i] - p.y };
  panel.classList.add('held');
  wake();
});
panel.addEventListener('pointermove', e => {
  if (!ready) return;
  const p = toPlane(e.clientX, e.clientY);
  if (drag && e.pointerId === drag.id) {
    if (p) { drag.x = p.x; drag.y = p.y; }
    wake();
  } else if (!drag && e.pointerType === 'mouse' && p) panel.classList.toggle('near', pick(p, false) >= 0);
});
const lift = e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag = null;
  grip.i = -1;
  panel.classList.remove('held');
  wake();
};
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => panel.addEventListener(t, lift));
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const k = e.key;
  if (k === 'r' || k === 'R') { if (!e.repeat) resetCoil0(); }
  else if (k === ' ') {
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (!e.repeat) nudge();
  } else if (k === 'ArrowUp') {
    if (e.target !== panel) return;
    e.preventDefault();
    if (!e.repeat) pluck();
  }
});
document.getElementById('nudge').addEventListener('click', nudge);
document.getElementById('reset').addEventListener('click', resetCoil0);
const sndB = document.getElementById('snd');
const showSound = () => sndB.setAttribute('aria-pressed', String(soundOn));
showSound();
sndB.addEventListener('click', () => {
  soundOn = !soundOn;
  showSound();
  try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (err) { /* storage is optional */ }
  if (soundOn) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(panel);
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

/* ---------- start: WebGL setup in idle slices ---------- */
function failed() {
  panel.querySelector('.fail').hidden = false;
}
async function start() {
  if (!document.createElement('canvas').getContext('webgl2')) return failed();
  let RoomEnvironment, RoundedBoxGeometry;
  try {
    THREE = await import('three');
    [{ RoomEnvironment }, { RoundedBoxGeometry }] = await Promise.all([
      import('three/addons/environments/RoomEnvironment.js'),
      import('three/addons/geometries/RoundedBoxGeometry.js'),
    ]);
  } catch (err) {
    console.error(err);
    return failed();
  }
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (err) {
    console.error(err);
    return failed();
  }
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  canvas = renderer.domElement;
  canvas.setAttribute('aria-hidden', 'true');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 16 / 9, 0.02, 30);
  ray = new THREE.Raycaster();
  ndc = new THREE.Vector2();
  hitV = new THREE.Vector3();
  tmpV = new THREE.Vector3();
  plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  await idle();

  // Soft studio light: a room for reflections, a warm key, a cool rim.
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.45;
  pm.dispose();
  const C3 = c => new THREE.Color(c[0], c[1], c[2]);
  sun = new THREE.DirectionalLight(C3(linear(0.97, 0.035, 75)), 2.6);
  sun.position.set(-0.45, 0.95, 0.75);
  sun.target.position.set(0.12, 0.12, 0);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -0.42, right: 0.42, top: 0.42, bottom: -0.42, near: 0.3, far: 2.4 });
  sun.shadow.bias = -0.0002;
  sun.shadow.normalBias = 0.0008;
  sun.shadow.radius = 3;
  const rim = new THREE.DirectionalLight(C3(linear(0.85, 0.09, 235)), 1.5);
  rim.position.set(0.7, 0.5, -0.8);
  const fill = new THREE.HemisphereLight(C3(linear(0.7, 0.06, 290)), C3(linear(0.35, 0.05, 50)), 0.2);
  scene.add(sun, sun.target, rim, fill);
  await idle();

  const studio = new THREE.Mesh(sweep(), new THREE.MeshStandardMaterial({ color: C3(linear(0.3, 0.03, 285)), roughness: 0.9 }));
  studio.receiveShadow = true;
  // Coloured lamps wash the sweep: rose on the left, teal on the right.
  const lamp = (c, k, x, y, z, tx, ty) => {
    const l = new THREE.SpotLight(C3(c), k, 0, 0.55, 1, 1.6);
    l.position.set(x, y, z);
    l.target.position.set(tx, ty, -0.85);
    scene.add(l, l.target);
  };
  lamp(linear(0.66, 0.2, 345), 7, -0.5, 0.75, 0.5, -0.45, 0.35);
  lamp(linear(0.72, 0.15, 210), 6, 0.95, 0.7, 0.5, 0.8, 0.2);
  scene.add(studio, woodMaterial(RoundedBoxGeometry));

  ringData = new Float32Array(N * 4);
  ringTex = new THREE.DataTexture(ringData, N, 1, THREE.RGBAFormat, THREE.FloatType);
  ringTex.magFilter = ringTex.minFilter = THREE.NearestFilter;
  const [mat, depth] = coilMaterials();
  coilMesh = new THREE.Mesh(coilGeometry(), mat);
  coilMesh.customDepthMaterial = depth;
  coilMesh.castShadow = coilMesh.receiveShadow = true;
  coilMesh.frustumCulled = false;
  scene.add(coilMesh);
  resetCoil(NOSE[0] - ROUT - 0.006, reduce ? 0 : 0.014);
  upload();
  await idle();

  panel.prepend(canvas);
  fitRenderer(2, 1.4e6);
  // Async compile keeps the shader builds off the main thread.
  try { await renderer.compileAsync(scene, camera); } catch (err) { /* the first render compiles instead */ }
  ready = true;
  draw();
  requestAnimationFrame(() => canvas.classList.add('on'));
  wake();
}
start().catch(err => { console.error(err); failed(); });
</script>
</body>
</html>
