<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Jelly: wobbling soft bodies in a box. */
:root { --stage: oklch(0.2 0.02 250); }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; cursor: grab; }
.stage canvas.held { cursor: grabbing; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/jelly.svg)"></span><span class="intro-name">Jelly</span><span class="intro-sub">Stimming No. 20</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--jelly" id="stage" tabindex="0" role="application" aria-label="Jelly in a box. Drag a jelly to stretch and toss it; click empty space to drop in another. The chips pick the shape of new jellies. Space shakes the box.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Jelly needs canvas drawing, which this browser has turned off.</p>
    </div>
    <div class="bar bar--below">
      <div class="choices" role="group" aria-label="Shape">
        <button class="chip" type="button" data-value="cube" aria-pressed="true">Cube</button>
        <button class="chip" type="button" data-value="bean" aria-pressed="false">Bean</button>
        <button class="chip" type="button" data-value="star" aria-pressed="false">Star</button>
      </div>
      <div class="actions">
        <button class="chip" id="clear" type="button">Clear</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag</dt><dd>toss</dd></div>
        <div><dt>Click</dt><dd>drop</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>shake</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Jelly</h1><div class="vignette" hidden></div></section>
</div>

<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
<script type="module">
import { initPage, audioKit, choices, fitCanvas, reduced } from '../shared/stim.js';
initPage({ id: 'jelly' });

const stage = document.getElementById('stage'), canvas = stage.querySelector('canvas');
const ctx = canvas.getContext('2d');
if (!ctx) { stage.querySelector('.fail').hidden = false; throw new Error('no canvas'); }
const TAU = Math.PI * 2;

/* ---------- bodies ---------- */
// Candy colours: a light and a deep stop each.
const CANDY = [['oklch(0.82 0.17 10)', 'oklch(0.56 0.22 15)'], ['oklch(0.9 0.18 130)', 'oklch(0.62 0.19 140)'], ['oklch(0.82 0.12 230)', 'oklch(0.52 0.18 255)'], ['oklch(0.92 0.15 95)', 'oklch(0.72 0.18 70)'], ['oklch(0.8 0.14 310)', 'oklch(0.5 0.2 300)']];
// Each shape is a ring of points around the origin, unit size.
const SHAPES = {
  cube: n => Array.from({ length: n }, (_, i) => { const a = (i / n) * TAU, s = Math.max(Math.abs(Math.cos(a)), Math.abs(Math.sin(a))); const r = 1 / Math.pow(Math.pow(Math.abs(Math.cos(a)), 6) + Math.pow(Math.abs(Math.sin(a)), 6), 1 / 6); return [Math.cos(a) * r * 0.9, Math.sin(a) * r * 0.9 + 0 * s]; }),
  bean: n => Array.from({ length: n }, (_, i) => { const a = (i / n) * TAU; return [Math.cos(a) * 1.15, Math.sin(a) * 0.72 + 0.18 * Math.cos(2 * a)]; }),
  star: n => Array.from({ length: n }, (_, i) => { const a = (i / n) * TAU, r = 0.72 + 0.32 * Math.cos(5 * a); return [Math.cos(a - Math.PI / 2) * r, Math.sin(a - Math.PI / 2) * r]; }),
};
const N = 28;
let bodies = [], shape = 'cube', colourIndex = 0;
function addBody(x, y, size) {
  const rest = SHAPES[shape](N).map(([u, v]) => [u * size, v * size]);
  const pts = rest.map(([u, v]) => ({ x: x + u, y: y + v, px: x + u, py: y + v }));
  bodies.push({ rest, pts, size, colour: CANDY[colourIndex++ % CANDY.length], squish: 0 });
  if (bodies.length > 5) bodies.shift();
}

/* ---------- physics ---------- */
// Shape matching pulls each ring back toward its rest shape, best-fit rotated.
let size = { w: 1, h: 1, dpr: 1 };
const G = 1400, STIFF = 0.18, DAMP = 0.992;
function centroid(pts) { let x = 0, y = 0; pts.forEach(p => { x += p.x; y += p.y; }); return [x / pts.length, y / pts.length]; }
function step(dt) {
  const { w, h } = size;
  for (const b of bodies) {
    for (const p of b.pts) {
      if (p === grabbed?.point) continue;
      const vx = (p.x - p.px) * DAMP, vy = (p.y - p.py) * DAMP;
      p.px = p.x; p.py = p.y;
      p.x += vx; p.y += vy + G * dt * dt;
    }
    const [cx, cy] = centroid(b.pts);
    // Best-fit rotation of the rest shape onto the current points.
    let a = 0, c = 0;
    b.pts.forEach((p, i) => { const [rx, ry] = b.rest[i], qx = p.x - cx, qy = p.y - cy; a += rx * qy - ry * qx; c += rx * qx + ry * qy; });
    const ang = Math.atan2(a, c), cs = Math.cos(ang), sn = Math.sin(ang);
    b.pts.forEach((p, i) => {
      if (p === grabbed?.point) return;
      const [rx, ry] = b.rest[i];
      p.x += (cx + rx * cs - ry * sn - p.x) * STIFF;
      p.y += (cy + rx * sn + ry * cs - p.y) * STIFF;
    });
    // The box: walls bounce, the floor grips a little.
    for (const p of b.pts) {
      if (p.y > h - 4) { const vy = p.y - p.py; p.y = h - 4; p.py = p.y + vy * 0.45; p.px = p.x - (p.x - p.px) * 0.8; if (vy > 6) hitAt(vy, b); }
      if (p.y < 4) { p.y = 4; p.py = p.y; }
      if (p.x < 4) { p.px = p.x; p.x = 4; }
      if (p.x > w - 4) { p.px = p.x; p.x = w - 4; }
    }
  }
  // Bodies push apart where their points sink into one another.
  for (let i = 0; i < bodies.length; i++) for (let j = 0; j < bodies.length; j++) {
    if (i === j) continue;
    const A = bodies[i], B = bodies[j], [bx, by] = centroid(B.pts), R = B.size * 0.85;
    for (const p of A.pts) {
      const dx = p.x - bx, dy = p.y - by, d = Math.hypot(dx, dy);
      if (d < R && d > 0.001) { const push = (R - d) * 0.5; p.x += (dx / d) * push; p.y += (dy / d) * push; }
    }
  }
  bodies.forEach(b => { b.squish *= 0.9; });
}

/* ---------- drawing ---------- */
function fit() { size = fitCanvas(canvas, { maxDpr: 2, budget: 2.4e6 }); if (!bodies.length) seed(); draw(); }
function seed() {
  const { w, h } = size, s = Math.min(w, h) * 0.14;
  addBody(w * 0.35, h * 0.45, s);
  addBody(w * 0.62, h * 0.3, s * 0.85);
}
function ringPath(pts) {
  const p = new Path2D(), n = pts.length;
  const mid = i => [(pts[i].x + pts[(i + 1) % n].x) / 2, (pts[i].y + pts[(i + 1) % n].y) / 2];
  p.moveTo(...mid(n - 1));
  for (let i = 0; i < n; i++) p.quadraticCurveTo(pts[i].x, pts[i].y, ...mid(i));
  p.closePath();
  return p;
}
function draw() {
  const { w, h, dpr } = size;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  for (const b of bodies) {
    const path = ringPath(b.pts), [cx, cy] = centroid(b.pts), r = b.size;
    // Body: translucent candy, light top left to deep bottom right.
    const g = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
    g.addColorStop(0, b.colour[0]); g.addColorStop(1, b.colour[1]);
    ctx.globalAlpha = 0.9; ctx.fillStyle = g; ctx.fill(path); ctx.globalAlpha = 1;
    // A deeper core shows the jelly's thickness.
    ctx.save(); ctx.clip(path);
    const core = ctx.createRadialGradient(cx + r * 0.2, cy + r * 0.25, r * 0.1, cx, cy, r * 1.2);
    core.addColorStop(0, 'rgba(0,0,0,0)'); core.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = core; ctx.fillRect(cx - r * 2, cy - r * 2, r * 4, r * 4);
    // A wet highlight rides the upper left.
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.ellipse(cx - r * 0.38, cy - r * 0.42, r * 0.26, r * 0.12, -0.6, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(cx - r * 0.12, cy - r * 0.56, r * 0.05, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.stroke(path);
  }
}

/* ---------- sound ---------- */
// A squelch: a swept low-pass noise and a wobbling low tone.
const kit = audioKit({ gain: 0.5, keys: new Set([' ']) });
let lastSquelch = 0;
function squelch(power) {
  const ac = kit.live(); if (!ac || !kit.noise) return;
  const now = performance.now(); if (now - lastSquelch < 70) return; lastSquelch = now;
  const t = ac.currentTime, v = Math.min(1, power);
  const src = ac.createBufferSource(); src.buffer = kit.noise;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 9;
  f.frequency.setValueAtTime(260, t); f.frequency.exponentialRampToValueAtTime(1100, t + 0.06); f.frequency.exponentialRampToValueAtTime(300, t + 0.2);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.45 * v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
  src.connect(f); f.connect(g); g.connect(kit.out); src.start(t, Math.random() * 0.5, 0.26);
  const o = ac.createOscillator(), og = ac.createGain();
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.18);
  og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.25 * v, t + 0.01); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(og); og.connect(kit.out); o.start(t); o.stop(t + 0.22);
}
function hitAt(vy) { squelch(vy / 18); }

/* ---------- loop ---------- */
let raf = 0, prevT = 0, calm = 0;
function frame(t) {
  const dt = Math.min(1 / 30, (t - (prevT || t)) / 1000) || 1 / 60;
  prevT = t;
  // Two substeps keep fast tosses stable.
  step(dt / 2); step(dt / 2);
  draw();
  const motion = bodies.reduce((m, b) => Math.max(m, ...b.pts.map(p => Math.abs(p.x - p.px) + Math.abs(p.y - p.py))), 0);
  calm = motion < 0.05 ? calm + 1 : 0;
  if (grabbed || calm < 30) raf = requestAnimationFrame(frame);
  else { raf = 0; prevT = 0; kit.rest(() => !raf); }
}
const wake = () => { calm = 0; if (!raf) raf = requestAnimationFrame(frame); };

/* ---------- input ---------- */
let grabbed = null;
const at = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
function nearest([x, y]) {
  let best = null, bd = Infinity;
  for (const b of bodies) for (const p of b.pts) { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = { body: b, point: p }; } }
  return best && bd < best.body.size * 0.9 ? best : null;
}
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  const p = at(e), hit = nearest(p);
  if (hit) { grabbed = hit; canvas.classList.add('held'); squelch(0.5); }
  else { addBody(p[0], p[1], Math.min(size.w, size.h) * (0.1 + Math.random() * 0.06)); squelch(0.3); }
  wake();
});
canvas.addEventListener('pointermove', e => {
  if (!grabbed) return;
  const [x, y] = at(e), p = grabbed.point;
  // The held point follows the pointer; its old place sets the toss.
  p.px = p.x; p.py = p.y; p.x = x; p.y = y;
});
const drop = () => { if (grabbed) { grabbed = null; canvas.classList.remove('held'); wake(); } };
canvas.addEventListener('pointerup', drop);
canvas.addEventListener('pointercancel', drop);
// Space shakes the box: every point gets a random kick.
stage.addEventListener('keydown', e => {
  if (e.key !== ' ') return;
  e.preventDefault();
  bodies.forEach(b => { const kx = (Math.random() - 0.5) * 30, ky = -10 - Math.random() * 25; b.pts.forEach(p => { p.px -= kx; p.py -= ky; }); });
  squelch(1); wake();
});
choices(document.querySelector('.choices'), v => { shape = v; });
document.getElementById('clear').addEventListener('click', () => { bodies = []; seed(); wake(); });
if (reduced()) stage.dataset.calm = '1';

new ResizeObserver(fit).observe(stage);
fit(); wake();
</script>
</body>
</html>
