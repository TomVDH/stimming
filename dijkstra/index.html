const COARSE = matchMedia('(pointer: coarse)');

let markReady;
const glReady = new Promise(r => { markReady = r; });

// The flood holds still until the intro leaves.
const introGone = new Promise(r => {
  if (!document.querySelector('.intro')) return r();
  const mo = new MutationObserver(() => { if (!document.querySelector('.intro')) { mo.disconnect(); r(); } });
  mo.observe(document.body, { childList: true, subtree: true });
  setTimeout(r, 12000);

/* ---------- random ---------- */
// Seeded random keeps the first web the same on every load.
function mulberry(a) {
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Value noise on a seeded lattice sets the cell size.
function noise2(rnd) {
  const N = 64, v = new Float32Array(N * N).map(() => rnd());
  const at = (x, y) => v[((y & (N - 1)) * N) + (x & (N - 1))];
  return (x, y) => {
    const ix = Math.floor(x), iy = Math.floor(y);
    let fx = x - ix, fy = y - iy;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const a = at(ix, iy) + (at(ix + 1, iy) - at(ix, iy)) * fx;
    const b = at(ix, iy + 1) + (at(ix + 1, iy + 1) - at(ix, iy + 1)) * fx;
    return a + (b - a) * fy;
  };

/* ---------- web: Poisson sites, Delaunay, Voronoi ---------- */
// The web: node positions, edges, and fan faces for the heat map.
let web = null;
// Dart throwing with a cell size that varies by noise.
function sites(W, H, rnd, rMin, rMax) {
  const n2 = noise2(rnd);

  const x0 = -M, y0 = -M, x1 = W + M, y1 = H + M;
  const cell = rMin / Math.SQRT2, gw = Math.ceil((x1 - x0) / cell) + 1, gh = Math.ceil((y1 - y0) / cell) + 1;
  const grid = new Int32Array(gw * gh).fill(-1);

  const reach = Math.ceil(rMax / cell);

  const put = (x, y, r) => { const gx = Math.floor((x - x0) / cell), gy = Math.floor((y - y0) / cell); grid[gy * gw + gx] = px.length; px.push(x); py.push(y); pr.push(r); };
  const nx = Math.ceil((x1 - x0) / (rMax * 0.8)), ny = Math.ceil((y1 - y0) / (rMax * 0.8));
  for (let i = 0; i < nx; i++) { const x = x0 + ((x1 - x0) * i) / nx; put(x, y0, rMax); put(x + (x1 - x0) / nx / 2, y1, rMax); }
  for (let j = 0; j < ny; j++) { const y = y0 + ((y1 - y0) * (j + 0.5)) / ny; put(x0, y, rMax); put(x1, y, rMax); }
  let fails = 0;
  while (fails < 4000) {
    const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0);
    const k = n2(x / 230 + 11, y / 230 + 7);
    const r = rMin + (rMax - rMin) * clamp((k - 0.2) / 0.6);
    const gx = Math.floor((x - x0) / cell), gy = Math.floor((y - y0) / cell);
    let ok = grid[gy * gw + gx] < 0;
    for (let dy = -reach; ok && dy <= reach; dy++) for (let dx = -reach; dx <= reach; dx++) {
      const cx = gx + dx, cy = gy + dy;
      if (cx < 0 || cy < 0 || cx >= gw || cy >= gh) continue;
      const j = grid[cy * gw + cx];
      if (j < 0) continue;
      const ex = px[j] - x, ey = py[j] - y, rr = (r + pr[j]) * 0.5;
      if (ex * ex + ey * ey < rr * rr) { ok = false; break; }
    }
    if (!ok) { fails++; continue; }
    fails = 0;
    grid[gy * gw + gx] = px.length;
    px.push(x); py.push(y); pr.push(r);

}
// Bowyer-Watson: insert each site, re-fan the cavity it opens.
function delaunay(px, py) {
  const n = px.length;

  for (let i = 0; i < n; i++) {
    minX = Math.min(minX, px[i]); maxX = Math.max(maxX, px[i]);
    minY = Math.min(minY, py[i]); maxY = Math.max(maxY, py[i]);
  }
  const d = Math.max(maxX - minX, maxY - minY) * 20, mx = (minX + maxX) / 2, my = (minY + maxY) / 2;
  const X = [...px, mx - d, mx, mx + d], Y = [...py, my - d, my + d, my - d];
  const circ = (a, b, c) => {
    const ax = X[a], ay = Y[a], bx = X[b], by = Y[b], cx = X[c], cy = Y[c];
    const D = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
    const a2 = ax * ax + ay * ay, b2 = bx * bx + by * by, c2 = cx * cx + cy * cy;
    const ux = (a2 * (by - cy) + b2 * (cy - ay) + c2 * (ay - by)) / D;
    const uy = (a2 * (cx - bx) + b2 * (ax - cx) + c2 * (bx - ax)) / D;
    return [ux, uy, (ax - ux) ** 2 + (ay - uy) ** 2];

    const x = X[i], y = Y[i], keep = [], edges = new Map();

      if ((x - t[3]) ** 2 + (y - t[4]) ** 2 < t[5]) {
        for (const [u, v] of [[t[0], t[1]], [t[1], t[2]], [t[2], t[0]]]) {
          const key = u < v ? u * 100003 + v : v * 100003 + u;
          edges.set(key, edges.has(key) ? null : [u, v]);
        }
      } else keep.push(t);
    }
    for (const e of edges.values()) if (e) keep.push([e[0], e[1], i, ...circ(e[0], e[1], i)]);

  }

}
// Cells: a Voronoi web; circumcentres become nodes, shared sides edges.
function cellsWeb(W, H, rnd) {

  const tris = delaunay(px, py);
  const lim = M * 2;

  const parent = tris.map((_, i) => i);
  const find = i => { while (parent[i] !== i) i = parent[i] = parent[parent[i]]; return i; };
  const side = new Map();
  tris.forEach((t, k) => {
    for (const [u, v] of [[t[0], t[1]], [t[1], t[2]], [t[2], t[0]]]) {
      const key = u < v ? u * 100003 + v : v * 100003 + u;
      const s = side.get(key);
      if (s) s.push(k); else side.set(key, [k]);
    }
  });
  for (const pair of side.values()) {
    if (pair.length !== 2) continue;
    const [a, b] = pair;
    if (Math.hypot(tris[a][3] - tris[b][3], tris[a][4] - tris[b][4]) < 6) parent[find(a)] = find(b);
  }
  // One node per merged group, at the mean of its circumcentres.
  const nodeOf = new Int32Array(tris.length).fill(-1), sx = [], sy = [], cnt = [];
  const groupNode = new Map();
  tris.forEach((t, k) => {
    const g = find(k);
    let id = groupNode.get(g);
    if (id === undefined) { id = sx.length; groupNode.set(g, id); sx.push(0); sy.push(0); cnt.push(0); }
    sx[id] += t[3]; sy[id] += t[4]; cnt[id]++;
    nodeOf[k] = id;
  });
  const nx = sx.map((v, i) => v / cnt[i]), ny = sy.map((v, i) => v / cnt[i]);
  const keepN = nx.map((x, i) => inBox(x, ny[i]));

  const remap = new Int32Array(nx.length).fill(-1), X = [], Y = [];
  keepN.forEach((k, i) => { if (k) { remap[i] = X.length; X.push(nx[i]); Y.push(ny[i]); } });

  for (const pair of side.values()) {
    if (pair.length !== 2) continue;
    const a = remap[nodeOf[pair[0]]], b = remap[nodeOf[pair[1]]];
    if (a < 0 || b < 0 || a === b) continue;
    const key = a < b ? a * 100003 + b : b * 100003 + a;
    if (seen.has(key)) continue;
    seen.add(key);
    ea.push(a); eb.push(b);

    if (hull[s] || ks.length < 3) return;
    const cx = px[s], cy = py[s];
    if (cx < -M || cy < -M || cx > W + M || cy > H + M) return;
    ks.sort((p, q) => Math.atan2(tris[p][4] - cy, tris[p][3] - cx) - Math.atan2(tris[q][4] - cy, tris[q][3] - cx));
    const ids = [];
    for (const k of ks) { const id = remap[nodeOf[k]]; if (id < 0) return; if (ids[ids.length - 1] !== id) ids.push(id); }
    if (ids[0] === ids[ids.length - 1]) ids.pop();
    if (ids.length >= 3) faces.push({ cx, cy, ids });
  });

  const tiles = faces.map(f => inset(f.ids.map(i => [X[i], Y[i]]), f.cx, f.cy, 2.4));
  return { X, Y, ea, eb, areas: { s: 1, b: tiles, w: [], g: [], r: [] } };
}
// A closed ring pulled toward its centre by a few pixels.
function inset(pts, cx, cy, by) {
  const r = new Float32Array(2 * pts.length + 2);
  pts.forEach(([x, y], k) => {
    const dx = x - cx, dy = y - cy, L = Math.hypot(dx, dy) || 1, f = Math.max(0, 1 - by / L);
    r[2 * k] = cx + dx * f; r[2 * k + 1] = cy + dy * f;

}
// Union-find joins components; join reports a merge.
function joiner(n) {
  const p = Int32Array.from({ length: n }, (_, i) => i);

}
// An edge list with a weight factor and a width per edge.
function edges() {

}
// Streets from a city grab: the square map covers the stage.
// Big roads are wide and fast; crossings are lamps; bends hide.
const ROAD_W = [2.6, 2.1, 1.8, 1.5, 1.0, 0.7], ROAD_M = [0.5, 0.62, 0.72, 0.82, 1, 1.15];

// Streets without a grab: a warped grid; every fifth line is an avenue.
function streetsWeb(W, H, rnd) {

    blocks.push(inset(ids.map(k => [X[k], Y[k]]), ids.reduce((v, k) => v + X[k], 0) / 4, ids.reduce((v, k) => v + Y[k], 0) / 4, 4));

// Circuit: traces on a lattice at 0 and 45 degrees, chips and power rails.
function circuitWeb(W, H, rnd) {

  const cols = Math.ceil((W + 2 * M) / s) + 1, rows = Math.ceil((H + 2 * M) / s) + 1;
  const id = (i, j) => j * cols + i, X = [], Y = [];

    const w = 3 + Math.floor(rnd() * 4), h = 2 + Math.floor(rnd() * 3);

const credit = document.createElement('a');
credit.className = 'osm';
credit.href = 'https://www.openstreetmap.org/copyright';
credit.target = '_blank';
credit.rel = 'noopener';
credit.hidden = true;
stage.append(credit);
function showCredit() {
  const on = kind === 'streets' && web?.areas && grab;
  credit.hidden = !on;
  if (on) credit.textContent = `${grab.name} · © OpenStreetMap`;
}

/* ---------- layout ---------- */
// The web takes the stage's size; a new size builds a new web in place.
async function layout() {
  // Hairlines need the screen's own pixels, so the pixel budget is generous.
  const { w, h, dpr } = fitCanvas(canvas, { maxDpr: 2, budget: 4.2e6 });
  const resized = !mask || mask.w !== canvas.width || mask.h !== canvas.height;
  const rebuild = !web || Math.abs(web.W - w) > 1 || Math.abs(web.H - h) > 1;
  view = { w, h, dpr };
  allocScreen();
  if (rebuild) await makeWeb(w, h, true);
  else if (resized) areaMasks();
}
// The first frame: a seeded source and target per orientation.
function defaults(w, h) {
  return h > w ? { s: [0.5, 0.8], t: [0.42, 0.18] } : { s: [0.22, 0.6], t: [0.8, 0.28] };
}
// A build that a newer one overtakes is dropped.
let buildNo = 0;
async function makeWeb(w, h, finished, fresh = false) {
  const no = ++buildNo;
  const g = kind === 'streets' ? await pickGrab(fresh) : null;
  if (no !== buildNo) return;
  web = buildWeb(w, h, seed, kind, g);
  if (clearBtn) clearBtn.disabled = true;
  areaMasks();
  showCredit();
  src = -1; tgt = -1;
  // A fresh map gets fresh pins; otherwise the pins keep their place.
  if (fresh) {
    const [s, t] = randomPins();
    pin('src', s); pin('tgt', t);
    if (algo === 'districts') setSrcs(spreadPins(srcs.length || 3));
  } else {
    const d = defaults(w, h), s = srcAt || d.s, t = tgtAt || d.t;
    pin('src', nearest(s[0] * w, s[1] * h));
    pin('tgt', nearest(t[0] * w, t[1] * h));
    setSrcs(srcsAt.map(f => nearest(f[0] * w, f[1] * h)));
    if (algo === 'districts' && !srcs.length) setSrcs(spreadPins(3, [src]));
  }
  if (finished) settle(); else replay();
  still();
}

/* ---------- frame loop ---------- */
let raf = 0, last = 0, lastDraw = 0, visible = true, inputAt = 0, started = false;
const live = () => { inputAt = performance.now(); wake(); };
function wake() {
  if (!raf && visible && P && started) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
// Lively while the front runs or a drag is live; drifting while the path pulses.
const lively = () => !done() || drag || (lockT >= 0 && simT - lockT < 1.2);
const busy = (now = performance.now()) => visible && (lively() || now - inputAt < 60000);
function frame(now) {
  raf = 0;
  try {
    if (lively() || now - lastDraw >= 31) {
      const dt = Math.min(0.05, (now - last) / 1000);
      // Ambient motion eases out over the 2 s before sleep.
      ambT += dt * clamp((60000 - (now - inputAt)) / 2000);
      last = now;
      lastDraw = now;
      simT += dt;
      if (!done()) { W += speed() * dt; checkLock(); }
      render();
    }
  } finally {
    if (busy(now)) raf = requestAnimationFrame(frame);
  }
}
function still() { if (P && web) render(); }

/* ---------- pointer ---------- */
// Press a pin to drag it. A tap sets the source; a long press sets the destination.
// A drag from open ground walls off the streets it crosses.
const HOLD = 380;
let ptr = null, drag = false;
const local = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
function pinAt(x, y) {
  const g = web, d = i => (i < 0 ? Infinity : Math.hypot(g.X[i] - x, g.Y[i] - y));
  if (algo === 'districts') {
    let k = -1, bd = COARSE.matches ? 26 : 16;
    srcs.forEach((q, j) => { if (d(q) < bd) { bd = d(q); k = j; } });
    return k < 0 ? null : `d${k}`;
  }
  const ds = d(src), dt = d(tgt);
  if (Math.min(ds, dt) > (COARSE.matches ? 26 : 16)) return null;
  return dt <= ds ? 'tgt' : 'src';
}
function down(e) {
  if (ptr || e.button > 0 || !web) return;
  try { canvas.setPointerCapture(e.pointerId); } catch { /* A synthetic pointer has no capture. */ }
  const [x, y] = local(e);
  ptr = { id: e.pointerId, x0: x, y0: y, lx: x, ly: y, mode: pinAt(x, y) || 'press', moved: false };
  drag = ptr.mode !== 'press';
  if (drag) canvas.style.cursor = 'grabbing';
  // A long press sets the destination where the finger rests.
  if (ptr.mode === 'press') {
    ptr.timer = setTimeout(() => {
      if (!ptr || ptr.mode !== 'press' || algo === 'districts') return;
      // The search plays again; the path waits for the light to arrive.
      ptr.mode = 'held';
      const i = nearest(x, y);
      if (i >= 0 && i !== src) { pin('tgt', i); replay(); }
      navigator.vibrate?.(12);
      live();
    }, HOLD);
  }
  live();
}
function move(e) {
  const [x, y] = local(e);
  if (!ptr) { if (web) canvas.style.cursor = pinAt(x, y) ? 'grab' : ''; return; }
  if (e.pointerId !== ptr.id) return;
  if (ptr.mode === 'press' && Math.hypot(x - ptr.x0, y - ptr.y0) > 8) {
    clearTimeout(ptr.timer);
    ptr.mode = 'wall';
    strokeNo++;
    drag = true;
  }
  if (Math.hypot(x - ptr.x0, y - ptr.y0) > 4) ptr.moved = true;
  // A district pin moves to any free node.
  if (ptr.mode[0] === 'd') {
    const k = +ptr.mode.slice(1), i = nearest(x, y);
    if (i >= 0 && !srcs.includes(i)) { srcs[k] = i; setSrcs(srcs); settle(); }
  } else if (ptr.mode === 'src') { const i = nearest(x, y); if (i >= 0 && i !== src && i !== tgt) { pin('src', i); settle(); } }
  else if (ptr.mode === 'tgt') aim(nearest(x, y), false);
  else if (ptr.mode === 'wall') {
    // Steps along the stroke, so a fast drag leaves no gaps.
    const n = Math.max(1, Math.ceil(Math.hypot(x - ptr.lx, y - ptr.ly) / 6));
    for (let k = 1; k <= n; k++) brush(ptr.lx + ((x - ptr.lx) * k) / n, ptr.ly + ((y - ptr.ly) * k) / n);
  }
  ptr.lx = x; ptr.ly = y;
  live();
}
function up(e) {
  if (!ptr || (e && e.pointerId !== ptr.id)) return;
  clearTimeout(ptr.timer);
  const m = ptr.mode, tap = m === 'press' && e?.type === 'pointerup', x0 = ptr.x0, y0 = ptr.y0, wasMoved = ptr.moved;
  ptr = null;
  drag = false;
  canvas.style.cursor = '';
  if (algo === 'districts') {
    // A tap on open ground adds a district; the sixth replaces the oldest.
    if (tap) {
      const i = nearest(x0, y0);
      if (i >= 0 && !srcs.includes(i)) { setSrcs([...srcs, i].slice(-MAXD)); replay(); }
    } else if (m[0] === 'd' && !wasMoved) {
      // A tap on a district pin removes it; one always stays.
      if (srcs.length > 1) { srcs.splice(+m.slice(1), 1); setSrcs(srcs); }
      replay();
    } else if (m[0] === 'd' || m === 'wall') replay();
  }
  // A tap moves the source and plays the search again.
  else if (tap) { const i = nearest(x0, y0); if (i >= 0 && i !== tgt) { pin('src', i); replay(); } }
  else if (m === 'src' || m === 'wall') replay();
  live();
}
// A long press must not open the context menu.
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- actions ---------- */
// Shuffle drops both pins somewhere new and plays the search.
act.shuffle = () => {
  if (!web) return;
  const [s, t] = randomPins();
  pin('src', s); pin('tgt', t);
  if (algo === 'districts') setSrcs(spreadPins(Math.max(3, srcs.length)));
  replay();
  live();
};
// Remap builds a new map; on Streets it flies to another city.
act.remap = () => {
  seed = (Math.random() * 1e9) | 0;
  makeWeb(view.w, view.h, false, true).then(live);
};
act.clear = () => {
  if (!web) return;
  web.cut.fill(0);
  web.jam.fill(0);
  web.w.set(web.w0);
  if (clearBtn) clearBtn.disabled = true;
  replay();
  live();
};
act.algo = v => {
  algo = v;
  try { localStorage.setItem(ALGO_KEY, v); } catch { /* Storage can be blocked. */ }
  keyWords();
  // Districts starts from the source plus two more, spread out.
  if (web && v === 'districts' && srcs.length < 2) setSrcs(spreadPins(3, [src]));
  if (web) { replay(); live(); }
};
// Districts has no destination, so two key words change.
function keyWords() {
  const dd = stage.parentElement.querySelectorAll('.s2-keys dd'), many = algo === 'districts';
  if (dd[0]) dd[0].textContent = many ? 'add district' : 'source';
  if (dd[1]) dd[1].parentElement.hidden = many;
  if (dd[2]) dd[2].textContent = many ? 'move, drop or jam' : 'pin or jam';
}
act.tree = v => { treeOn = v; still(); live(); };
act.reset = () => {
  seed = 4242;
  srcAt = tgtAt = null;
  srcs = []; srcsAt = [];
  ui.choice?.set('dijkstra');
  act.algo('dijkstra');
  makeWeb(view.w, view.h, false).then(live);
};
act.still = () => still();
// A new map kind keeps the pins in place.
act.web = v => {
  kind = v;
  applyLook();
  makeWeb(view.w, view.h, false).then(live);
};

/* ---------- boot ---------- */
try {
  await initGL();
  applyLook();
  HOT = linFit(0.97, 0.06, 85);
  await layout();
  replay();
  // The first frame shows the light 55 % of the way out.
  W = web.maxD * 0.55;
  checkLock();
  marks();
  render();
  gl.finish();
  canvas.classList.add('on');
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  ui.hideControls?.();
  markReady();
  throw err;
}
markReady();
introGone.then(() => { started = true; live(); });

canvas.addEventListener('pointerdown', down);
canvas.addEventListener('pointermove', move);
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
canvas.addEventListener('lostpointercapture', up);
keyWords();
// T shows or hides the tree.
document.addEventListener('keydown', e => {
  if (e.code !== 'KeyT' || e.repeat || e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.('input, textarea, .s2-sheet')) return;
  ui.setting('tree')?.set(!treeOn, true);
});
// Space plays the search again.
stage.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat) return;
  e.preventDefault();
  replay();
  live();
});

let resizeT = 0;
new ResizeObserver(() => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (P) layout().then(still); }, 120); }).observe(stage);
onQuality(() => { if (P) layout().then(still); });
// A hidden tab stops the loop and the clocks with it.
whenVisible(stage, v => {
  visible = v;
  if (!v) { cancelAnimationFrame(raf); raf = 0; return; }
  if (busy()) wake(); else still();
});
</script>
</body>
</html>
