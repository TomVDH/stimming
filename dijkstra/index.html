<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.11 0.02 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dijkstra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm">
<link rel="preload" as="fetch" crossorigin href="maps/index.json">
<style>
/* Dijkstra: search algorithms explore a city as light. */
:root { --stage: oklch(0.11 0.02 275); }
.stage--dijkstra canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--dijkstra canvas.on { opacity: 1; }
.stage--dijkstra { cursor: crosshair; }
/* The map credit: required by the OpenStreetMap licence, kept quiet. */
.stage--dijkstra .osm {
  position: absolute; right: 14px; bottom: 50px; z-index: 2;
  font: 500 9px/1 var(--slab, ui-monospace, monospace); letter-spacing: 0.07em; text-transform: uppercase;
  color: oklch(0.85 0.01 260 / 0.38); text-decoration: none;
}
.stage--dijkstra .osm:hover { color: oklch(0.95 0.01 260 / 0.8); }
@media (prefers-reduced-motion: reduce) { .stage--dijkstra canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Dijkstra</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--dijkstra" id="stage" tabindex="0" role="application" aria-label="A city at night. Light floods the streets as the chosen search explores them. Click to set the source. Hold to set the destination. Drag a pin to move it. Drag across the streets to jam them. Double-click to black out a spot. Press Space to play the search again.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Dijkstra</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
