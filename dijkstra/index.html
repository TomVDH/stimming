<script type="module">

let markReady;
const glReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));

// The flood holds still until the intro leaves.
const introGone = new Promise(r => {

  mo.observe(document.body, { childList: true, subtree: true });

/* ---------- random ---------- */
// Seeded random keeps the first web the same on every load.
function mulberry(a) {
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Value noise on a seeded lattice sets the cell size.
function noise2(rnd) {

  const at = (x, y) => v[((y & (N - 1)) * N) + (x & (N - 1))];
  return (x, y) => {
    const ix = Math.floor(x), iy = Math.floor(y);
    let fx = x - ix, fy = y - iy;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const a = at(ix, iy) + (at(ix + 1, iy) - at(ix, iy)) * fx;

    return a + (b - a) * fy;
  };

/* ---------- web: Poisson sites, Delaunay, Voronoi ---------- */
// The web: node positions, edges, and fan faces for the heat map.
let web = null;
// Dart throwing with a cell size that varies by noise.
function sites(W, H, rnd, rMin, rMax) {
  const n2 = noise2(rnd);
  const M = rMax * 1.4;
  const x0 = -M, y0 = -M, x1 = W + M, y1 = H + M;
  const cell = rMin / Math.SQRT2, gw = Math.ceil((x1 - x0) / cell) + 1, gh = Math.ceil((y1 - y0) / cell) + 1;
  const grid = new Int32Array(gw * gh).fill(-1);

  const put = (x, y, r) => { const gx = Math.floor((x - x0) / cell), gy = Math.floor((y - y0) / cell); grid[gy * gw + gx] = px.length; px.push(x); py.push(y); pr.push(r); };
  const nx = Math.ceil((x1 - x0) / (rMax * 0.8)), ny = Math.ceil((y1 - y0) / (rMax * 0.8));
  for (let i = 0; i < nx; i++) { const x = x0 + ((x1 - x0) * i) / nx; put(x, y0, rMax); put(x + (x1 - x0) / nx / 2, y1, rMax); }
  for (let j = 0; j < ny; j++) { const y = y0 + ((y1 - y0) * (j + 0.5)) / ny; put(x0, y, rMax); put(x1, y, rMax); }
  let fails = 0;
  while (fails < 4000) {
    const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0);
    const k = n2(x / 230 + 11, y / 230 + 7);
    const r = rMin + (rMax - rMin) * clamp((k - 0.2) / 0.6);
    const gx = Math.floor((x - x0) / cell), gy = Math.floor((y - y0) / cell);

    for (let dy = -reach; ok && dy <= reach; dy++) for (let dx = -reach; dx <= reach; dx++) {
      const cx = gx + dx, cy = gy + dy;
      if (cx < 0 || cy < 0 || cx >= gw || cy >= gh) continue;
      const j = grid[cy * gw + cx];
      if (j < 0) continue;
      const ex = px[j] - x, ey = py[j] - y, rr = (r + pr[j]) * 0.5;
      if (ex * ex + ey * ey < rr * rr) { ok = false; break; }
    }
    if (!ok) { fails++; continue; }
    fails = 0;
    grid[gy * gw + gx] = px.length;

// Bowyer-Watson: insert each site, re-fan the cavity it opens.

    return [ux, uy, (ax - ux) ** 2 + (ay - uy) ** 2];

    const x = X[i], y = Y[i], keep = [], edges = new Map();

      if ((x - t[3]) ** 2 + (y - t[4]) ** 2 < t[5]) {
        for (const [u, v] of [[t[0], t[1]], [t[1], t[2]], [t[2], t[0]]]) {
          const key = u < v ? u * 100003 + v : v * 100003 + u;
          edges.set(key, edges.has(key) ? null : [u, v]);

// Cells: a Voronoi web; circumcentres become nodes, shared sides edges.
function cellsWeb(W, H, rnd) {

  const tris = delaunay(px, py);

  const parent = tris.map((_, i) => i);
  const find = i => { while (parent[i] !== i) i = parent[i] = parent[parent[i]]; return i; };

  tris.forEach((t, k) => {
    for (const [u, v] of [[t[0], t[1]], [t[1], t[2]], [t[2], t[0]]]) {
      const key = u < v ? u * 100003 + v : v * 100003 + u;
      const s = side.get(key);
      if (s) s.push(k); else side.set(key, [k]);
    }
  });
  for (const pair of side.values()) {
    if (pair.length !== 2) continue;
    const [a, b] = pair;
    if (Math.hypot(tris[a][3] - tris[b][3], tris[a][4] - tris[b][4]) < 6) parent[find(a)] = find(b);

  keepN.forEach((k, i) => { if (k) { remap[i] = X.length; X.push(nx[i]); Y.push(ny[i]); } });

  for (const pair of side.values()) {
    if (pair.length !== 2) continue;
    const a = remap[nodeOf[pair[0]]], b = remap[nodeOf[pair[1]]];
    if (a < 0 || b < 0 || a === b) continue;
    const key = a < b ? a * 100003 + b : b * 100003 + a;
    if (seen.has(key)) continue;
    seen.add(key);
    ea.push(a); eb.push(b);
  }

  const ring = px.map(() => []);
  const hull = new Uint8Array(px.length);
  for (const [key, pair] of side) if (pair.length !== 2) { const u = Math.floor(key / 100003); hull[u] = 1; hull[key - u * 100003] = 1; }

    for (const k of ks) { const id = remap[nodeOf[k]]; if (id < 0) return; if (ids[ids.length - 1] !== id) ids.push(id); }

}
// Union-find joins components; join reports a merge.
function joiner(n) {

  const find = i => { while (p[i] !== i) i = p[i] = p[p[i]]; return i; };
  return { join(a, b) { a = find(a); b = find(b); if (a === b) return false; p[a] = b; return true; } };
}
// An edge list with a weight factor and a width per edge.
function edges() {
  const ea = [], eb = [], wmul = [], width = [];
  return { ea, eb, wmul, width, add(a, b, wm = 1, wd = 1) { ea.push(a); eb.push(b); wmul.push(wm); width.push(wd); } };
}
// Streets from a city grab: the square map covers the stage.
// Big roads are wide and fast; crossings are lamps; bends hide.
const ROAD_W = [2.6, 2.1, 1.8, 1.5, 1.0, 0.7], ROAD_M = [0.5, 0.62, 0.72, 0.82, 1, 1.15];
function cityWeb(W, H, d) {

  // Coordinates arrive as integer deltas at 1 / q metres.
  const dec = (arr, q) => {
    const out = new Float32Array(arr.length);
    let x = 0, y = 0;
    for (let i = 0; i < arr.length; i += 2) { x += arr[i]; y += arr[i + 1]; out[i] = cx + (x / q) * s; out[i + 1] = cy + (y / q) * s; }

// Streets without a grab: a warped grid; every fifth line is an avenue.
function streetsWeb(W, H, rnd) {
  const phone = Math.min(W, H) < 640, s = phone ? 22 : 28, M = s * 2;

// Circuit: traces on a lattice at 0 and 45 degrees, chips and power rails.

    if (j + 1 < rows) cand.push([id(i, j), id(i, j + 1), 0.45, false]);
    if (i + 1 < cols && j + 1 < rows) cand.push(rnd() < 0.5 ? [id(i, j), id(i + 1, j + 1), 0.2, false] : [id(i + 1, j), id(i, j + 1), 0.2, false]);

    if (v.length / 3 > first) runs.push({ first, n: v.length / 3 - first, chan: 1, stencil: false });
    fillVbo('area', new Float32Array(v), v.length / 3);
    const q = P.mask;
    gl.useProgram(q.p);
    gl.uniform4f(q.u.uMap, 2 / view.w, -2 / view.h, -1, 1);
    gl.bindVertexArray(vbo.area.a);
    for (const r of runs) {
      const ch = [0, 1, 2].map(k => k === r.chan);
      if (r.stencil) {
        gl.enable(gl.STENCIL_TEST);
        gl.colorMask(false, false, false, false);
        gl.stencilFunc(gl.ALWAYS, 0, 0xff);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.INVERT);
        gl.drawArrays(gl.TRIANGLES, r.first, r.n);
        gl.colorMask(ch[0], ch[1], ch[2], r.chan === 0);
        gl.stencilFunc(gl.NOTEQUAL, 0, 0xff);
        gl.stencilOp(gl.ZERO, gl.ZERO, gl.ZERO);
        gl.drawArrays(gl.TRIANGLES, r.first, r.n);
        gl.disable(gl.STENCIL_TEST);
      } else {
        gl.colorMask(ch[0], ch[1], ch[2], false);
        gl.drawArrays(gl.TRIANGLES, r.first, r.n);
      }
    }
    gl.colorMask(true, true, true, true);
  }
  // Blurred levels give occlusion, eaves and shadows.
  const d = P.down;
  gl.useProgram(d.p);
  let from = mask;
  for (const t of maskB) {
    bind(d, 'uSrc', 0, from.tex);
    gl.uniform2f(d.u.uTex, 1 / from.w, 1 / from.h);
    gl.uniform1f(d.u.uThr, 0);
    tri(t);
    from = t;
  }
}

/* ---------- drawing ---------- */
function common(q) {
  gl.uniform4f(q.u.uMap, 2 / view.w, -2 / view.h, -1, 1);
  if (q.u.uLut) bind(q, 'uLut', 7, lutT);
  gl.uniform1f(q.u.uW, W);
  gl.uniform1f(q.u.uMax, web.maxD);
  gl.uniform1f(q.u.uBand, BAND);
  gl.uniform1f(q.u.uPx, 1 / view.dpr);
  gl.uniform1f(q.u.uTime, ambT);
  gl.uniform1f(q.u.uFlick, reduced() ? 0 : 1);
  gl.uniform1f(q.u.uStyle, look.i);
  if (q.u.uCold) gl.uniform3fv(q.u.uCold, COLD);
}
let COLD, BASE, BG, HOT, AMB, look = STYLES.cells;
// A web kind brings its colours and heat ramp.
function applyLook() {
  look = STYLES[kind];
  const lin = v => linFit(v[0], v[1], v[2]);
  COLD = lin(look.cold).map(v => v * look.cold[3]);
  BASE = lin(look.base);
  BG = lin(look.bg);
  gl.bindTexture(gl.TEXTURE_2D, lutT);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, 256, 1, 0, gl.RGBA, gl.FLOAT, lutData(look.lut));
}
function instanced(name, q, R) {
  if (!vbo[name].n) return;
  gl.useProgram(q.p);
  common(q);
  gl.uniform1f(q.u.uR, R);
  gl.bindVertexArray(vbo[name].a);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, vbo[name].n);
}
function render() {
  let q = P.bg;
  gl.useProgram(q.p);
  gl.uniform3fv(q.u.uBg, web.areas ? [0, 0, 0] : BG);
  gl.uniform1f(q.u.uStyle, look.i);
  gl.uniform1f(q.u.uDpr, view.dpr);
  tri(scene);
  if (vbo.face.n) {
    q = P.face;
    gl.useProgram(q.p);
    common(q);
    gl.uniform3fv(q.u.uBase, BASE);
    gl.uniform1f(q.u.uStep, Math.max(40, web.maxD / 16));
    gl.bindVertexArray(vbo.face.a);
    gl.drawArrays(gl.TRIANGLES, 0, vbo.face.n);
  }
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  // MAX blending keeps joints and crossings from beading.
  gl.blendEquation(gl.MAX);
  q = P.edge;
  gl.useProgram(q.p);
  gl.uniform1f(q.u.uScout, 0.35);
  instanced('edge', q, 4);
  gl.blendEquation(gl.FUNC_ADD);
  instanced('node', P.node, 8);
  if (lockT >= 0 && path.length > 1) {
    q = P.path;
    gl.useProgram(q.p);
    const t = simT - lockT, rm = reduced();
    // The path sweeps on from the source in 0.22 s.
    gl.uniform1f(q.u.uReveal, rm ? 1e6 : t < 0.22 ? (t / 0.22) * pathLen : 1e6);
    gl.uniform1f(q.u.uNow, simT);
    gl.uniform1f(q.u.uFlash, (rm ? 0.3 : 1) * Math.exp(-t / 0.4));
    gl.uniform1f(q.u.uPulse, ambT * 90 * (rm ? 0.5 : 1));
    gl.uniform3fv(q.u.uHot, HOT);
    // MAX blending keeps the path's joints from beading.
    gl.blendEquation(gl.MAX);
    instanced('path', q, 6);
    gl.blendEquation(gl.FUNC_ADD);
  }
  q = P.mark;
  gl.useProgram(q.p);
  gl.uniform3fv(q.u.uHot, HOT);
  instanced('mark', q, 13);
  gl.disable(gl.BLEND);
  bloomPass();
  q = P.final;
  gl.useProgram(q.p);
  bind(q, 'uScene', 0, scene.tex);
  bind(q, 'uBloom', 1, ups[0].tex);
  bind(q, 'uLight', 2, ups[1].tex);
  bind(q, 'uMask', 3, mask.tex);
  bind(q, 'uMaskS', 6, maskB[0].tex);
  bind(q, 'uMaskA', 4, maskB[1].tex);
  bind(q, 'uMaskW', 5, maskB[3].tex);
  const isCity = web.areas ? 1 : 0;
  gl.uniform2f(q.u.uRes, canvas.width, canvas.height);
  // The moon sits up and to the left, so shadows fall down and right.
  gl.uniform2f(q.u.uSun, (-3 * view.dpr) / canvas.width, (3 * view.dpr) / canvas.height);
  gl.uniform3fv(q.u.uAmb, AMB);
  gl.uniform1f(q.u.uGlow, glow);
  gl.uniform1f(q.u.uTime, simT);
  gl.uniform1f(q.u.uCity, isCity);
  gl.uniform1f(q.u.uDpr, view.dpr);
  tri(null);
  frameNo++;
}
function bloomPass() {
  const d = P.down;
  gl.useProgram(d.p);
  let src = scene;
  for (let i = 0; i < mips.length; i++) {
    bind(d, 'uSrc', 0, src.tex);
    gl.uniform2f(d.u.uTex, 1 / src.w, 1 / src.h);
    gl.uniform1f(d.u.uThr, i === 0 ? (web.areas ? 0.02 : 1.0) : 0);
    tri(mips[i]);
    src = mips[i];
  }
  const u = P.up;
  gl.useProgram(u.p);
  for (let i = ups.length - 1; i >= 0; i--) {
    const s = i === ups.length - 1 ? mips[i + 1] : ups[i + 1];
    bind(u, 'uSrc', 0, s.tex);
    bind(u, 'uAdd', 1, mips[i].tex);
    gl.uniform2f(u.u.uTex, 1 / s.w, 1 / s.h);
    tri(ups[i]);
  }
}

/* ---------- city grabs ---------- */
// Grabs are OpenStreetMap squares, cached in maps/ by maps/fetch.py.
let cityIndex = null, grab = null;
const grabs = new Map();
const listGrabs = () => (cityIndex ||= fetch('maps/index.json').then(r => r.json()).catch(() => []));
function loadGrab(id) {
  if (!grabs.has(id)) grabs.set(id, fetch(`maps/${id}.json`).then(r => (r.ok ? r.json() : Promise.reject(new Error(r.status)))));
  return grabs.get(id);
}
// The current grab stays; a fresh pick is any other city.
async function pickGrab(fresh) {
  if (grab && !fresh) return grab;
  const list = await listGrabs();
  if (!list.length) return null;
  let row;
  do row = list[Math.floor(Math.random() * list.length)]; while (list.length > 1 && row.id === grab?.id);
  try { grab = await loadGrab(row.id); grab.id = row.id; } catch { grab = null; }
  return grab;
}
const credit = document.createElement('a');
credit.className = 'osm';
credit.href = 'https://www.openstreetmap.org/copyright';
credit.target = '_blank';
credit.rel = 'noopener';
credit.hidden = true;
stage.append(credit);
function showCredit() {
  const on = kind === 'streets' && web?.areas && grab;
  credit.hidden = !on;
  if (on) credit.textContent = `${grab.name} · © OpenStreetMap`;
}

/* ---------- layout ---------- */
// The web takes the stage's size; a new size builds a new web in place.
async function layout() {
  // Hairlines need the screen's own pixels, so the pixel budget is generous.
  const { w, h, dpr } = fitCanvas(canvas, { maxDpr: 2, budget: 4.2e6 });
  const resized = !mask || mask.w !== canvas.width || mask.h !== canvas.height;
  const rebuild = !web || Math.abs(web.W - w) > 1 || Math.abs(web.H - h) > 1;
  view = { w, h, dpr };
  allocScreen();
  if (rebuild) await makeWeb(w, h, true);
  else if (resized) areaMasks();
}
// The first frame: a seeded source and target per orientation.
function defaults(w, h) {
  return h > w ? { s: [0.5, 0.8], t: [0.42, 0.18] } : { s: [0.22, 0.6], t: [0.8, 0.28] };
}
// A build that a newer one overtakes is dropped.
let buildNo = 0;
async function makeWeb(w, h, finished, fresh = false) {
  const no = ++buildNo;
  const g = kind === 'streets' ? await pickGrab(fresh) : null;
  if (no !== buildNo) return;
  web = buildWeb(w, h, seed, kind, g);
  areaMasks();
  showCredit();
  const d = defaults(w, h);
  const s = srcAt || d.s, t = tgtAt || d.t;
  src = -1; tgt = -1;
  flood(nearest(s[0] * w, s[1] * h));
  setTarget(nearest(t[0] * w, t[1] * h, true));
  if (finished) { W = web.maxD + TAIL; checkLock(); marks(); }
  still();
}

/* ---------- frame loop ---------- */
let raf = 0, last = 0, lastDraw = 0, visible = true, inputAt = 0, started = false;
const live = () => { inputAt = performance.now(); wake(); };
function wake() {
  if (!raf && visible && P && started) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
// Lively while the front runs or a drag is live; drifting while the path pulses.
const lively = () => !done() || drag || (lockT >= 0 && simT - lockT < 1.2);
const busy = (now = performance.now()) => visible && (lively() || now - inputAt < 60000);
function frame(now) {
  raf = 0;
  try {
    if (lively() || now - lastDraw >= 31) {
      const dt = Math.min(0.05, (now - last) / 1000);
      // Ambient motion eases out over the 2 s before sleep.
      ambT += dt * clamp((60000 - (now - inputAt)) / 2000);
      last = now;
      lastDraw = now;
      simT += dt;
      if (!done()) { W += speed() * dt; checkLock(); }
      render();
    }
  } finally {
    if (busy(now)) raf = requestAnimationFrame(frame);
  }
}
function still() { if (P && web) render(); }

/* ---------- pointer ---------- */
// A press that travels 8 px is a drag; a release before that is a tap.
let ptr = null, drag = false;
const local = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
function down(e) {
  if (ptr || e.button > 0) return;
  try { canvas.setPointerCapture(e.pointerId); } catch { /* A synthetic pointer has no capture. */ }
  const [x, y] = local(e);
  ptr = { id: e.pointerId, x0: x, y0: y };
  live();
}
function move(e) {
  if (!ptr || e.pointerId !== ptr.id) return;
  const [x, y] = local(e);
  if (!drag && Math.hypot(x - ptr.x0, y - ptr.y0) > 8) drag = true;
  if (drag) { setTarget(nearest(x, y, true)); live(); }
}
function up(e) {
  if (!ptr || (e && e.pointerId !== ptr.id)) return;
  const tap = !drag && e?.type === 'pointerup';
  if (tap) flood(nearest(ptr.x0, ptr.y0));
  ptr = null;
  drag = false;
  live();
}

/* ---------- actions ---------- */
// Shuffle seeds a new web; on Streets it flies to another city.
act.shuffle = () => {
  seed = (Math.random() * 1e9) | 0;
  makeWeb(view.w, view.h, false, true).then(live);
};
act.reset = () => {
  seed = 4242;
  srcAt = tgtAt = null;
  makeWeb(view.w, view.h, false).then(live);
};
act.still = () => still();
// A new web kind floods its new web from the same spots.
act.web = v => {
  kind = v;
  try { localStorage.setItem(WEB_KEY, v); } catch { /* Storage can be blocked. */ }
  applyLook();
  makeWeb(view.w, view.h, false).then(live);
};

/* ---------- boot ---------- */
try {
  await initGL();
  applyLook();
  HOT = linFit(0.97, 0.06, 85);
  AMB = linFit(0.62, 0.035, 255).map(v => v * 1.1);
  await layout();
  // The first frame shows the front at 55 % of the web.
  W = web.maxD * 0.55;
  checkLock();
  marks();
  render();
  gl.finish();
  canvas.classList.add('on');
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  ui.hideControls?.();
  markReady();
  throw err;
}
markReady();
introGone.then(() => { started = true; live(); });

canvas.addEventListener('pointerdown', down);
canvas.addEventListener('pointermove', move);
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
canvas.addEventListener('lostpointercapture', up);
// Space floods again from the current source.
stage.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat) return;
  e.preventDefault();
  flood(src);
  live();
});

let resizeT = 0;
new ResizeObserver(() => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (P) layout().then(still); }, 120); }).observe(stage);
onQuality(() => { if (P) layout().then(still); });
// A hidden tab stops the loop and the clocks with it.
whenVisible(stage, v => {
  visible = v;
  if (!v) { cancelAnimationFrame(raf); raf = 0; return; }
  if (busy()) wake(); else still();
});
</script>
</body>
</html>
