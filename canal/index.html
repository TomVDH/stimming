<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.14 0.02 262); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canal at dusk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Canal at dusk: a canal at blue hour, gables doubled in the water. */
:root { --stage: oklch(0.12 0.02 262); }
.stage--canal canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--canal canvas.on { opacity: 1; }
.stage--canal { cursor: grab; }
.stage--canal.held { cursor: grabbing; }
/* Letterbox bars clip the canvas to 2.39 to 1. */
.stage--canal[data-letterbox] canvas { clip-path: inset(var(--box, 0px) 0); }
@media (prefers-reduced-motion: reduce) { .stage--canal canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Canal at dusk</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--canal" id="stage" tabindex="0" role="application" aria-label="A canal at blue hour. Gabled houses stand doubled in the water. Drag to look along the canal.">
      <p class="fail" hidden>Canal at dusk needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Canal at dusk</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { initPage, whenVisible, pixelRatio, onQuality, linFit, reduced, onReducedChange, quality } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const stage = document.getElementById('stage');
// The weather chips and Dusk drive the look; set() binds once the scene exists.
const act = { weather() {}, dusk() {}, letterbox() {}, view() {} };
const QS = new URLSearchParams(location.search);
const ui = initPage({ id: 'canal', bar: {
  choice: { label: 'Weather', value: 'dry', options: [
    { value: 'dry', label: 'Dry' }, { value: 'drizzle', label: 'Drizzle' },
    { value: 'rain', label: 'Rain' }, { value: 'downpour', label: 'Downpour' },
  ], onPick: v => act.weather(v) },
  slider: { label: 'Dusk', min: 0, max: 1, step: 0.01, value: QS.has('dusk') ? +QS.get('dusk') : 0.35, onInput: v => act.dusk(v) },
  settings: [
    { type: 'choice', id: 'view', label: 'View', value: 'sky', persist: true, onPick: v => act.view(v),
      options: [{ value: 'sky', label: 'Sky eye' }, { value: 'path', label: 'Towpath' }] },
    { type: 'toggle', id: 'letterbox', label: 'Letterbox', value: false, persist: true, onToggle: on => act.letterbox(on) },
  ],
  quality: true,
  keys: [['drag', 'look round']],
} });

// Seeded random keeps the street the same on every load.
let seed = 1302;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; ui.hideControls?.(); markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 4000);
// Layer 1 holds what the water mirrors.
const LIGHT = 1;
// The towpaths sit this high above the water.
const QUAY = 1.0;
// The canal runs along -z between these walls.
const CANAL_X = 12;
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;

/* ---------- lamps ---------- */
// Ten tappable lamps, then fixed lights: frietkot, staminee, station, church, farms, yard.
// Every lit shader reads this one array.
const LN = 19, TAPS = 10;
const U = {
  uLamp: { value: Array.from({ length: LN }, () => new THREE.Vector4()) },
  uLampC: { value: Array.from({ length: LN }, () => new THREE.Vector3()) },
  uZen: { value: new THREE.Vector3() },
  uHor: { value: new THREE.Vector3() },
  uGlowC: { value: new THREE.Vector3() },
  uSun: { value: new THREE.Vector3(-0.25, 0, -1).normalize() },
  uStars: { value: 0 },
  uDusk: { value: 0.35 },
  uWin: { value: new THREE.Vector3() },
  uHaze: { value: 0.0042 },
  uHazeH: { value: 18 },
  uTime: { value: 0 },
  // The church tower brightens while the bells ring.
  uBell: { value: 0 },
};
const LAMPS_GLSL = /* glsl */`
uniform vec4 uLamp[${LN}];
uniform vec3 uLampC[${LN}];
// Light from every lit lamp on a surface with normal N; a soft wrap reaches grazing walls.
vec3 lampLit(vec3 P, vec3 N) {
  vec3 s = vec3(0.0);
  for (int i = 0; i < ${LN}; i++) {
    if (uLamp[i].w <= 0.0) continue;
    vec3 d = uLamp[i].xyz - P;
    float dd = dot(d, d);
    s += uLampC[i] * uLamp[i].w * (0.3 + 0.7 * max(dot(N, d * inversesqrt(dd)), 0.0)) * 30.0 / (dd + 1.0);
  }
  return s;
}`;
// The main road crosses the canal here; the village sits round the crossing.
const ROAD_Z = -160;
// Lamp heads: five each side of the bridge on both towpaths.
const LAMP_POS = [
  ...[-80, -105, -130, -190, -215].map(z => new THREE.Vector3(-CANAL_X - 2.4, QUAY + 7.5, z)),
  ...[-80, -105, -130, -190, -215].map(z => new THREE.Vector3(CANAL_X + 2.4, QUAY + 7.5, z)),
];
LAMP_POS.forEach((p, i) => U.uLamp.value[i].set(p.x, p.y, p.z, 0));
// Fixed lights: position, colour as OKLCH, and full strength.
const VENUES = [
  { p: [25, 2.5, -144], c: [0.9, 0.08, 80], k: 3 },
  { p: [50, 3, -166], c: [0.75, 0.14, 60], k: 2.5 },
  { p: [-87, 6, -142], c: [0.9, 0.05, 230], k: 2.2 },
  { p: [-87, 6, -114], c: [0.9, 0.05, 230], k: 2.2 },
  { p: [44, 1.5, -206], c: [0.85, 0.1, 70], k: 9 },
  { p: [56, 1.5, -194], c: [0.85, 0.1, 70], k: 9 },
  { p: [397, 6, -319], c: [0.75, 0.15, 60], k: 4 },
  { p: [-353, 6, -332], c: [0.75, 0.15, 60], k: 4 },
  { p: [526, 9, -60], c: [0.92, 0.04, 240], k: 6 },
];
VENUES.forEach((v, i) => {
  U.uLamp.value[TAPS + i].set(v.p[0], QUAY + v.p[1], v.p[2], 0);
  U.uLampC.value[TAPS + i].set(...linFit(...v.c));
});
/* ---------- end lamps ---------- */

/* ---------- K2: noise ---------- */
// Lifted from Fireworks.
const K2_NOISE = /* glsl */`
float k2hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float k2noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(k2hash(i), k2hash(i + vec2(1, 0)), u.x), mix(k2hash(i + vec2(0, 1)), k2hash(i + vec2(1, 1)), u.x), u.y);
}
float k2fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * k2noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s;
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: sky ---------- */
// Lifted from Fireworks; Dusk sets the zenith, horizon and afterglow.
// The afterglow lies low in the west, down the canal.
const K2_SKY = /* glsl */`
uniform vec3 uZen, uHor, uGlowC, uSun;
uniform float uStars;
float k2stars(vec3 dir) {
  vec2 q = vec2(atan(dir.x, -dir.z) * 260.0, dir.y * 260.0);
  vec2 i = floor(q), f = fract(q) - 0.5;
  float h = k2hash(i);
  // About one cell in two hundred holds a star.
  float on = step(0.995, h);
  vec2 o = vec2(k2hash(i + 7.1), k2hash(i + 3.3)) - 0.5;
  return on * exp(-dot(f - o * 0.6, f - o * 0.6) * 60.0) * (0.02 + 0.05 * k2hash(i + 1.7));
}
float k2glow(vec3 dir) {
  vec2 h = normalize(dir.xz + vec2(1e-5));
  return pow(max(dot(h, uSun.xz), 0.0), 3.0) * exp(-max(dir.y, 0.0) * 7.0);
}
vec3 k2sky(vec3 dir) {
  float up = max(dir.y, 0.0);
  vec3 col = mix(uHor, uZen, smoothstep(0.0, 0.55, pow(up, 0.7)));
  col += uGlowC * k2glow(dir);
  return col + vec3(0.85, 0.9, 1.0) * k2stars(dir) * uStars * smoothstep(0.03, 0.25, dir.y);
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: haze ---------- */
// Lifted from Fireworks; the haze takes the horizon colour.
const K2_HAZE = /* glsl */`
uniform float uHaze;
uniform float uHazeH;
float k2hazeAmount(vec3 P) {
  vec3 v = P - cameraPosition;
  float dist = length(v);
  float k = 1.0 / uHazeH;
  float h0 = max(cameraPosition.y, 0.0), h1 = max(P.y, 0.0), dh = h1 - h0;
  // Exponential height fog integrated along the ray.
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);
  return 1.0 - exp(-dist * uHaze * max(avg, 0.0));
}
vec3 k2hazeColor(vec3 dir) { return uHor * 0.9 + uGlowC * k2glow(dir) * 0.5; }
vec3 k2haze(vec3 c, vec3 P) {
  return mix(c, k2hazeColor(normalize(P - cameraPosition)), k2hazeAmount(P));
}`;
/* ---------- end K2 ---------- */
const HEAD = `${LAMPS_GLSL}\n${K2_NOISE}\n${K2_SKY}\n${K2_HAZE}
uniform float uDusk, uTime, uBell;
uniform vec3 uWin;
// Sky light on a surface: the zenith from above, the horizon from the side.
vec3 skyAmb(vec3 N) { return mix(uHor * 0.8, uZen * 1.3, 0.5 + 0.5 * N.y) * 0.9; }`;

/* ---------- dusk ---------- */
// Three sky keys: blue hour, late blue, night; Dusk runs through them.
const KEYS = [
  { zen: [0.4, 0.1, 262], hor: [0.6, 0.065, 248], glow: [0.6, 0.07, 35] },
  { zen: [0.24, 0.085, 266], hor: [0.4, 0.07, 256], glow: [0.4, 0.05, 30] },
  { zen: [0.075, 0.02, 268], hor: [0.15, 0.028, 255], glow: [0.17, 0.035, 55] },
].map(k => ({ zen: linFit(...k.zen), hor: linFit(...k.hor), glow: linFit(...k.glow) }));
const lerp3 = (a, b, t) => a.map((x, i) => x + (b[i] - x) * t);
function setDusk(d) {
  U.uDusk.value = d;
  const t = d * 2, i = Math.min(1, Math.floor(t)), f = t - i;
  const a = KEYS[i], b = KEYS[i + 1];
  U.uZen.value.set(...lerp3(a.zen, b.zen, f));
  U.uHor.value.set(...lerp3(a.hor, b.hor, f));
  // The afterglow fades before the sky goes dark.
  U.uGlowC.value.set(...lerp3(a.glow, b.glow, f).map(x => x * 0.35 * (1 - d) ** 1.5));
  U.uStars.value = Math.max(0, (d - 0.55) / 0.45);
  // The frietkot, staminee, station and church lights come on as it darkens.
  const on = Math.min(1, Math.max(0, (d - 0.1) / 0.3));
  VENUES.forEach((v, i) => { U.uLamp.value[TAPS + i].w = v.k * on * on * (3 - 2 * on); });
}
U.uWin.value.set(...linFit(0.8, 0.12, 70).map(x => x * 2.6));
/* ---------- end dusk ---------- */

/* ---------- sky dome ---------- */
const sky = new THREE.Mesh(new THREE.SphereGeometry(2500, 32, 16), new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false,
  vertexShader: /* glsl */`varying vec3 vP; void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`varying vec3 vP; ${HEAD} void main() { gl_FragColor = vec4(k2sky(normalize(vP - cameraPosition)), 1.0); }`,
}));
sky.renderOrder = -1;
scene.add(sky);

/* ---------- buildings ---------- */
// Surface kinds in aInfo.w.
const BRICK = 0, RENDER = 1, CONCRETE = 2, STEEL = 3, CHURCH = 4, METAL = 5, TREE = 6, FRIT = 7, SIGN = 8, STAM = 9;
const fr = x => x - Math.floor(x);
const v2 = ps => new THREE.Shape(ps.map(([x, y]) => new THREE.Vector2(x, y)));
const UP = new THREE.Vector3(0, 1, 0);
// One building: u runs across the front, v up, z back; b is the eaves height.
// The roof ridge runs along the front; a gable house turns its gable to the street.
function house(w, b, d, rh, seed, kind, { win = true, gable = false } = {}) {
  const info = [win ? w : 0, b, seed, kind];
  if (gable) {
    const g = new THREE.ExtrudeGeometry(v2([[0, 0], [w, 0], [w, b], [w / 2, b + rh], [0, b]]), { depth: d, bevelEnabled: false });
    return [tag(g, info, true)];
  }
  const parts = [tag(new THREE.ExtrudeGeometry(v2([[0, 0], [w, 0], [w, b], [0, b]]), { depth: d, bevelEnabled: false }), info, true)];
  if (rh > 0) {
    const roof = new THREE.ExtrudeGeometry(v2([[-0.4, b - 0.15], [d + 0.4, b - 0.15], [d / 2, b + rh]]), { depth: w + 0.4, bevelEnabled: false });
    roof.rotateY(-Math.PI / 2).translate(w + 0.2, 0, 0);
    parts.push(tag(roof, info, true));
  }
  return parts;
}
// Add the face coordinates and the surface info every solid carries.
function tag(geo, info, face = false) {
  geo = geo.index ? geo.toNonIndexed() : geo;
  if (geo.attributes.uv) geo.deleteAttribute('uv');
  const n = geo.attributes.position.count, p = geo.attributes.position.array;
  const uv = new Float32Array(n * 2), inf = new Float32Array(n * 4);
  for (let i = 0; i < n; i++) {
    if (face) { uv[i * 2] = p[i * 3]; uv[i * 2 + 1] = p[i * 3 + 1]; }
    inf.set(info, i * 4);
  }
  geo.setAttribute('aUV', new THREE.BufferAttribute(uv, 2));
  geo.setAttribute('aInfo', new THREE.BufferAttribute(inf, 4));
  return geo;
}
const parts = [];
// Place local geometry at a plot: the front faces away from back.
function place(geos, x, z, back) {
  const b = new THREE.Vector3(...back), u = new THREE.Vector3().crossVectors(UP, b);
  const m = new THREE.Matrix4().makeBasis(u, UP, b).setPosition(x, QUAY, z);
  for (const g of geos) { g.applyMatrix4(m); parts.push(g); }
}
const brickKind = () => (rnd() < 0.22 ? RENDER : BRICK);
// A round tree on a short trunk.
function tree(x, z, r) {
  parts.push(
    tag(new THREE.CylinderGeometry(0.2, 0.3, 3, 5).translate(x, QUAY + 1.5, z), [0, 0, 0, TREE]),
    tag(new THREE.SphereGeometry(r, 10, 7).scale(1, 1.15, 1).translate(x, QUAY + 2.4 + r, z), [0, 0, rnd() * 100, TREE]),
  );
}
// One ordinary plot; returns its frontage and its geometry, or trees for an empty lot.
// Mixes: village along the old roads, estate on new streets, sparse out in the fields, industry.
function plotGeos(mode = 'village') {
  const t = rnd(), s = rnd() * 100;
  if (mode === 'estate') {
    // Detached fermettes and bungalows, each on its own lawn.
    if (t < 0.4) { const w = 11 + 4 * rnd(); return { w, geos: house(w, 3, 9, 5.5, s, rnd() < 0.6 ? RENDER : BRICK) }; }
    if (t < 0.75) { const w = 11 + 3 * rnd(); return { w, geos: house(w, 3.2, 10, 2.4, s, BRICK) }; }
    if (t < 0.9) { const w = 9 + rnd(); return { w, geos: house(w, 5.6, 10, 3.6, s, brickKind()) }; }
    return { w: 14 + 8 * rnd(), geos: null };
  }
  if (mode === 'industry') {
    const w = 30 + 25 * rnd();
    return { w, geos: house(w, 8, 25 + 15 * rnd(), 1.4, s, METAL, { win: false }).map(g => g.translate(0, 0, 6)) };
  }
  if (mode === 'sparse') {
    if (t < 0.2) { const w = 11 + 4 * rnd(); return { w, geos: house(w, 3, 9, 5.5, s, rnd() < 0.55 ? RENDER : BRICK) }; }
    if (t < 0.3) { const w = 11 + 3 * rnd(); return { w, geos: house(w, 3.2, 10, 2.4, s, BRICK) }; }
    if (t < 0.38) { const w = 5.8 + rnd(); return { w, geos: house(w, 6.4 + rnd(), 11, 4.2, s, BRICK) }; }
    if (t < 0.45) { const w = 24 + 14 * rnd(); return { w, geos: house(w, 7, 20, 1.6, s, METAL, { win: false }).map(g => g.translate(0, 0, 6)) }; }
    return { w: 25 + 45 * rnd(), geos: null };
  }
  if (t < 0.24) {
    // A short terrace of two to four houses; the end walls stay blank.
    const n = 2 + Math.floor(rnd() * 3), b = 5.8 + 0.8 * rnd(), k = brickKind(), geos = [];
    let w = 0;
    for (let i = 0; i < n; i++) {
      const hw = 5.4 + rnd();
      geos.push(...house(hw, b, 10, 4, s + i, rnd() < 0.3 ? brickKind() : k).map(g => g.translate(w, 0, 0)));
      w += hw;
    }
    return { w, geos };
  }
  // A lone tall house with blank side walls, waiting for neighbours.
  if (t < 0.38) { const w = 5.8 + rnd(); return { w, geos: house(w, 6.4 + rnd(), 11, 4.2, s, BRICK) }; }
  // A low farmhouse under a steep roof.
  if (t < 0.53) { const w = 11 + 4 * rnd(); return { w, geos: house(w, 3, 9, 5.5, s, rnd() < 0.55 ? RENDER : BRICK) }; }
  // A wide bungalow under a low roof.
  if (t < 0.68) { const w = 11 + 3 * rnd(); return { w, geos: house(w, 3.2, 10, 2.4, s, BRICK) }; }
  // A gable house turned to the street.
  if (t < 0.79) { const w = 7 + rnd(); return { w, geos: house(w, 6, 12, 4.8, s, brickKind(), { gable: true }) }; }
  // A metal shed, blank and wide, set further back.
  if (t < 0.87) { const w = 24 + 14 * rnd(); return { w, geos: house(w, 7, 20, 1.6, s, METAL, { win: false }).map(g => g.translate(0, 0, 6)) }; }
  return { w: 10 + 22 * rnd(), geos: null };
}
// A ribbon of plots along a street; dir runs along it, back points away from it.
// Spans in skip stay empty.
function ribbon(x0, z0, dir, back, len, skip = [], mode = 'village') {
  const D = new THREE.Vector3(...dir), B = new THREE.Vector3(...back);
  const flip = new THREE.Vector3().crossVectors(UP, B).dot(D) < 0;
  for (let a = 0; a < len;) {
    const { w, geos } = plotGeos(mode);
    if (skip.some(([s0, s1]) => a + w > s0 && a < s1)) { a += 6; continue; }
    const set = 2 + 8 * rnd() ** 2;
    const at = flip ? a + w : a;
    const x = x0 + D.x * at + B.x * set, z = z0 + D.z * at + B.z * set;
    if (geos) place(geos, x, z, back);
    else if (rnd() < 0.5) for (let i = 0, n = 1 + Math.floor(rnd() * 3); i < n; i++) {
      const q = a + rnd() * w, r = 6 + rnd() * 18;
      tree(x0 + D.x * q + B.x * r, z0 + D.z * q + B.z * r, 2.8 + rnd() * 2);
    }
    a += w + 2 + 6 * rnd();
  }
}
// Poplars stand in a row along the near bank, broken where the road crosses.
function poplars(z0, z1) {
  for (let z = z0; z > z1; z -= 7 + 2 * rnd()) {
    if (Math.abs(z - ROAD_Z) < 9) continue;
    // Columns: narrow, tall, with a short bare trunk.
    const x = -22 + rnd(), h = 19 + 7 * rnd(), r = 1.1 + 0.35 * rnd();
    parts.push(tag(new THREE.CylinderGeometry(0.16, 0.26, 3.5, 5).translate(x, QUAY + 1.75, z), [0, 0, 0, TREE]));
    parts.push(tag(new THREE.SphereGeometry(1, 10, 9).scale(r, h * 0.45, r).translate(x, QUAY + 2.6 + h * 0.45, z), [0, 0, rnd() * 100, TREE]));
  }
}
// A far tree line: a strip with a soft top; the haze takes most of it.
function treeLine(ax, az, bx, bz, h) {
  const N = 160, pos = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, x = ax + (bx - ax) * t, z = az + (bz - az) * t;
    const top = h * (0.7 + 0.15 * Math.sin(i * 0.9) + 0.1 * Math.sin(i * 2.3 + 1.0) + 0.1 * rnd());
    pos.push(x, QUAY, z, x, QUAY + top, z);
  }
  for (let i = 0; i < N; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  parts.push(tag(g, [0, 0, 1.1, TREE]));
}

/* ---------- bridge, quay walls and lamp posts ---------- */
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
// A flat road bridge: a thin deck on short ramps, a flat soffit over the water.
function bridge() {
  const Q = QUAY, deck = Q + 3.4, top = x => Q + (deck - Q + 0.9) * smooth(44, 15, Math.abs(x));
  const pts = [[-44, Q], [-12.6, Q], [-12.6, 0], [-12, 0], [-12, deck - 0.9], [12, deck - 0.9], [12, 0], [12.6, 0], [12.6, Q], [44, Q]];
  for (let k = 0; k <= 22; k++) { const x = 44 - (88 * k) / 22; pts.push([x, top(x)]); }
  const geo = new THREE.ExtrudeGeometry(v2(pts), { depth: 9, bevelEnabled: false, curveSegments: 1 });
  parts.push(tag(geo.translate(0, 0, ROAD_Z - 4.5), [0, 0, 7.7, CONCRETE]));
  // A plain steel rail each side of the deck.
  for (const s of [-1, 1]) parts.push(tag(new THREE.BoxGeometry(30, 0.1, 0.1).translate(0, deck + 1, ROAD_Z + s * 4.3), [0, 0, 0, STEEL]));
}

      tag(new THREE.BoxGeometry(0.75, 0.16, 0.34).translate(p.x, p.y, p.z), [0, 0, 0, STEEL]),
    );

}

/* ---------- layout ---------- */
// Every street the ground draws: x0, z0, x1, z1 and half its width.

/* ---------- solids: one material for every built surface ---------- */
const solidMat = new THREE.ShaderMaterial({
  uniforms: U, side: THREE.DoubleSide,
  vertexShader: /* glsl */`attribute vec2 aUV; attribute vec4 aInfo;
  varying vec3 vP; varying vec3 vN; varying vec2 vUV; varying vec4 vInfo;
  void main() {
    vP = (modelMatrix * vec4(position, 1.0)).xyz; vN = normalize(mat3(modelMatrix) * normal);
    vUV = aUV; vInfo = aInfo;
    gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0);
  }`,
  fragmentShader: /* glsl */`varying vec3 vP; varying vec3 vN; varying vec2 vUV; varying vec4 vInfo; ${HEAD}
  // Brick courses along a wall; mortar fades out where it would alias.
  vec3 brick(vec3 P, vec3 N, vec3 base) {
    float s = abs(N.x) > 0.5 ? P.z : P.x;
    vec2 q = vec2(s / 0.44, P.y / 0.19);
    q.x += 0.5 * mod(floor(q.y), 2.0);
    vec2 f = fract(q), id = floor(q);
    vec2 aa = fwidth(q);
    float m = smoothstep(0.0, 0.08 + aa.x, f.x) * smoothstep(0.0, 0.12 + aa.y, f.y);
    m = mix(m, 0.86, smoothstep(0.25, 0.6, max(aa.x, aa.y)));
    vec3 c = base * (0.88 + 0.24 * k2hash(id + vInfo.z));
    return mix(base * 1.2 + 0.025, c, m);
  }
  bool is(float k, float v) { return abs(k - v) < 0.5; }
  void main() {
    vec3 N = normalize(vN);
    vec3 V = normalize(vP - cameraPosition);
    if (dot(N, V) > 0.0) N = -N;
    float kind = vInfo.w;
    float sd = vInfo.z;
    float hv = k2hash(vec2(sd, 1.3));
    vec3 base;
    // Brick: red-orange, yellow-brown or purple-brown.
    if (is(kind, 0.0) || is(kind, 9.0)) base = hv < 0.45 ? vec3(0.22, 0.08, 0.042) : hv < 0.75 ? vec3(0.25, 0.16, 0.075) : vec3(0.12, 0.06, 0.05);
    // Render: white or cream.
    else if (is(kind, 1.0) || is(kind, 7.0)) base = hv < 0.6 ? vec3(0.6, 0.58, 0.53) : vec3(0.55, 0.5, 0.4);
    else if (is(kind, 2.0)) base = vec3(0.2, 0.2, 0.19) * (0.85 + 0.3 * k2noise(vP.xy * vec2(0.4, 0.15)));
    else if (is(kind, 3.0)) base = vec3(0.04, 0.042, 0.045);
    // The church is grey stone.
    else if (is(kind, 4.0)) base = vec3(0.17, 0.165, 0.155) * (0.9 + 0.2 * k2noise(vP.xy * vec2(0.5, 1.5)));
    // Sheds: grey or green metal in vertical ribs.
    else if (is(kind, 5.0)) base = (hv < 0.6 ? vec3(0.15, 0.16, 0.16) : vec3(0.07, 0.11, 0.09)) * (0.92 + 0.08 * sin((abs(N.x) > 0.5 ? vP.z : vP.x) * 25.0) * (1.0 - smoothstep(0.3, 1.0, fwidth(vP.z * 25.0 + vP.x * 25.0))));
    else if (is(kind, 6.0)) base = vec3(0.012, 0.018, 0.01) * (0.6 + 0.8 * k2noise(vec2(vP.x + vP.z, vP.y) * 0.9));
    else base = vec3(0.02);
    vec3 alb = is(kind, 0.0) || is(kind, 9.0) ? brick(vP, N, base) : base;
    // Roofs: grey concrete tile, red-brown tile or black glaze; the church has slate.
    float roof = (kind < 1.5 || is(kind, 4.0) || is(kind, 9.0)) && N.y > 0.25 && N.y < 0.98 ? 1.0 : 0.0;
    float rk = k2hash(vec2(sd, 2.0));
    if (roof > 0.5) alb = is(kind, 4.0) ? vec3(0.03, 0.035, 0.045) : rk < 0.45 ? vec3(0.03, 0.03, 0.032) : rk < 0.8 ? vec3(0.075, 0.03, 0.02) : vec3(0.012);
    // Rendered walls stand on a tarred black plinth.
    if (roof < 0.5 && is(kind, 1.0) && vUV.y < 0.6) alb = vec3(0.012);
    vec3 emit = vec3(0.0);
    float glass = 0.0;
    float lit = smoothstep(0.1, 0.35, uDusk);
    // Signs glow: frietkot yellow, staminee red, platform white.
    if (is(kind, 8.0)) emit = (sd < 1.5 ? vec3(1.0, 0.12, 0.08) : sd < 2.5 ? vec3(1.0, 0.7, 0.15) : vec3(0.75, 0.88, 1.0)) * mix(0.4, 4.0, lit);
    // Windows sit only on fronts and backs, where u runs along the wall.
    float w = vInfo.x, h = vInfo.y;
    bool face = length(vec2(dFdx(vUV.x), dFdy(vUV.x))) > 1e-5 && abs(N.y) < 0.3;
    if (w > 0.0 && roof < 0.5 && face) {
      float u = vUV.x, v = vUV.y;
      // The frietkot is one long counter window.
      if (is(kind, 7.0)) {
        if (v > 0.9 && v < 2.5 && u > 0.6 && u < w - 0.6) { emit = vec3(1.0, 0.86, 0.62) * mix(0.6, 4.5, lit); alb = vec3(0.0); }
      } else {
        float n = max(1.0, floor(w / 1.9)), cw = w / n;
        float ci = floor(u / cw), cu = (fract(u / cw) - 0.5) * cw;
        float fh = h / max(1.0, floor(h / 2.6));
        float ri = floor(v / fh), rv = v - ri * fh;
        vec2 hw = vec2(cw * 0.27, fh * 0.27), c = vec2(0.0, fh * 0.52);
        // A gable holds one window in its middle.
        if (v > h) { ci = 99.0; ri = 0.0; cu = u - w * 0.5; rv = v - h; hw = vec2(0.4, 0.5); c = vec2(0.0, 1.1); }
        vec2 d = abs(vec2(cu, rv) - c) - hw;
        float id = k2hash(vec2(sd * 3.7 + ci, ri * 1.9 + 0.3));
        // About four windows in ten light up as Dusk passes their mark.
        float mark = id < 0.42 ? -0.05 + id / 0.42 * 0.95 : 9.0;
        float on = smoothstep(mark, mark + 0.03, uDusk);
        // The staminee's ground floor is always lit, amber.
        bool cafe = is(kind, 9.0) && ri < 0.5;
        if (cafe) on = mix(0.5, 1.4, lit);
        if (max(d.x, d.y) < 0.0) {
          vec2 l = vec2(cu, rv) - c;
          // Frames are white or dark; a roller shutter hangs part way down.
          float fw = min(-d.x, -d.y);
          float sh = cafe ? 0.0 : k2hash(vec2(id, 5.5)), drop = sh < 0.45 ? 0.0 : (sh - 0.45) / 0.55 * 0.85;
          vec3 frame = k2hash(vec2(id, 6.6)) < 0.6 ? vec3(0.42, 0.42, 0.4) : vec3(0.03);
          if (fw < 0.06 || abs(l.x) < 0.03 && k2hash(vec2(id, 7.7)) < 0.4) alb = frame;
          else if (l.y > hw.y - 2.0 * hw.y * drop) {
            // Slats leak a thread of the light behind them.
            float slat = smoothstep(0.75, 0.95, fract(l.y * 18.0));
            alb = vec3(0.16, 0.15, 0.13);
            emit = uWin * on * 0.15 * slat * (1.0 - smoothstep(0.3, 1.0, fwidth(l.y * 18.0)));
          } else {
            glass = 1.0;
            // Curtains: soft folds and a warm or pale tint per window.
            float fold = 0.7 + 0.3 * sin(l.x * 18.0 + id * 40.0);
            float tint = k2hash(vec2(id, 9.1));
            vec3 wc = uWin * mix(vec3(1.0, 0.82, 0.62), vec3(1.0, 1.05, 1.1), tint) * (0.55 + 0.9 * k2hash(vec2(id, 4.4)));
            if (cafe) wc = uWin * vec3(1.2, 0.75, 0.4);
            emit = wc * fold * on;
            alb = vec3(0.0);
          }
        } else {
          // A lit window spills a little warm light on the wall round it.
          float dd = length(max(d, 0.0));
          emit = uWin * on * 0.06 * exp(-dd * 4.0) * alb;
        }
      }
    }
    vec3 col = alb * skyAmb(N);
    // Walls darken toward the ground, where less sky reaches.
    col *= 0.6 + 0.4 * smoothstep(0.0, 3.0, vP.y - ${QUAY.toFixed(2)});
    col += alb * lampLit(vP, N) * (is(kind, 4.0) ? 1.0 + 2.0 * uBell : 1.0);
    // Dark glass holds a dim copy of the sky.
    col += (glass * 0.25 + roof * 0.06) * k2sky(reflect(V, N)) + emit;
    gl_FragColor = vec4(k2haze(col, vP), 1.0);
  }`,
});
solidMat.extensions = { derivatives: true };
const solids = new THREE.Mesh(mergeGeometries(parts), solidMat);
solids.layers.enable(LIGHT);
scene.add(solids);
/* ---------- end solids ---------- */

/* ---------- K2: mirror ---------- */
// Lifted from Fireworks' water: a camera under y = 0 sees only the LIGHT layer.
const mirrorCam = new THREE.PerspectiveCamera();
mirrorCam.layers.set(LIGHT);
const mirrorRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
const texM = new THREE.Matrix4();
const bias = new THREE.Matrix4().set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);
const tgt = new THREE.Vector3(), fwd = new THREE.Vector3();
function renderMirror() {
  camera.updateMatrixWorld();
  camera.getWorldDirection(fwd);
  tgt.copy(camera.position).add(fwd);
  mirrorCam.position.set(camera.position.x, -camera.position.y, camera.position.z);
  mirrorCam.up.set(0, -1, 0);
  mirrorCam.lookAt(tgt.x, -tgt.y, tgt.z);
  mirrorCam.fov = camera.fov; mirrorCam.aspect = camera.aspect;
  mirrorCam.near = camera.near; mirrorCam.far = camera.far;
  mirrorCam.updateProjectionMatrix();
  mirrorCam.updateMatrixWorld();
  texM.copy(bias).multiply(mirrorCam.projectionMatrix).multiply(mirrorCam.matrixWorldInverse);
  renderer.setRenderTarget(mirrorRT);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  renderer.render(scene, mirrorCam);
  renderer.setRenderTarget(null);
}
/* ---------- end K2 ---------- */

/* ---------- water ---------- */
// Wind ripple and smear follow the weather; Dry is near still.
const W = { uWind: { value: 0.1 }, uSmear: { value: 0.3 } };
const water = new THREE.Mesh(new THREE.PlaneGeometry(CANAL_X * 2, 1600).rotateX(-Math.PI / 2).translate(0, 0, -300), new THREE.ShaderMaterial({
  uniforms: { ...U, ...W, tMirror: { value: mirrorRT.texture }, uTexM: { value: texM } },
  vertexShader: /* glsl */`uniform mat4 uTexM; varying vec3 vP; varying vec4 vM;
  void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; vM = uTexM * vec4(vP, 1.0); gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`uniform sampler2D tMirror; uniform float uWind, uSmear; varying vec3 vP; varying vec4 vM; ${HEAD}
  void main() {
    vec3 v = normalize(vP - cameraPosition);
    float dist = length(vP.xz - cameraPosition.xz);
    // A slow swell and a fine wind ripple, stretched across the view.
    float t = uTime * 0.5;
    vec2 p = vP.xz;
    float w1 = k2noise(p * vec2(0.25, 0.08) + vec2(t * 0.1, t * 0.3));
    float w2 = k2noise(p * vec2(1.1, 0.35) + vec2(-t * 0.3, t * 0.8) + 5.0);
    float w3 = k2noise(p * vec2(3.2, 1.0) + vec2(t * 0.7, -t * 1.2) + 11.0);
    float n = ((w1 - 0.5) + 0.5 * (w2 - 0.5) + 0.3 * (w3 - 0.5)) * uWind;
    float near = 1.0 / (1.0 + dist / 25.0);
    vec3 nrm = normalize(vec3(n * 0.2, 1.0, n * 0.12));
    vec3 r = reflect(v, nrm);
    // Canal water is dark and smooth: the mirror stays strong.
    float fres = 0.05 + 0.95 * pow(1.0 - max(dot(-v, nrm), 0.0), 4.0);
    vec2 uv = vM.xy / vM.w + vec2(n * 0.006, n * 0.02) * near;
    // Nine taps smear each light toward the eye, longer where the view grazes.
    float len = (0.0008 + 0.004 * smoothstep(5.0, 80.0, dist)) * uSmear;
    vec4 m = vec4(0.0);
    float ws = 0.0;
    for (int i = -4; i <= 4; i++) {
      float fi = float(i), wt = exp(-fi * fi / 8.0);
      m += texture2D(tMirror, uv + vec2(0.0, fi * len)) * wt;
      ws += wt;
    }
    m /= ws;
    vec3 skyR = k2sky(r) * (1.0 - clamp(m.a, 0.0, 1.0));
    vec3 c = vec3(0.002, 0.003, 0.0025) + (skyR + m.rgb) * fres;
    gl_FragColor = vec4(k2haze(c, vP), 1.0);
  }`,
}));
scene.add(water);
/* ---------- end water ---------- */

/* ---------- ground: towpaths, roads, the square, the railway and fields ---------- */
const groundMat = new THREE.ShaderMaterial({
  uniforms: { ...U, tMirror: { value: mirrorRT.texture }, uTexM: { value: texM },

  vertexShader: /* glsl */`varying vec3 vP; void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`uniform sampler2D tMirror; uniform mat4 uTexM; uniform vec4 uRoad[${ROADS.length}]; uniform float uRoadH[${ROADS.length}]; varying vec3 vP; ${HEAD}
  float band(float x, float a, float b) { return step(a, x) * (1.0 - step(b, x)); }
  // Distance to the edge of the nearest street; negative on the asphalt.
  float roadD(vec2 p) {
    float d = 1e5;
    for (int i = 0; i < ${ROADS.length}; i++) {
      vec2 a = uRoad[i].xy, ba = uRoad[i].zw - a, pa = p - a;
      d = min(d, length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)) - uRoadH[i]);
    }
    return d;
  }
  void main() {
    vec3 V = normalize(vP - cameraPosition);
    float x = vP.x, z = vP.z, ax = abs(x);
    // Asphalt: both towpaths, the canal road and the main road.
    float rd = roadD(vP.xz);
    float tar = max(1.0 - step(${CANAL_X + 4}.0, ax), 1.0 - step(0.0, rd));
    // The square: pale paving.
    float sq = band(x, 42.0, 102.0) * band(z, -234.0, -164.0) * (1.0 - tar);
    // The railway: a gravel bed with two tracks.
    float rail = band(x, -86.0, -74.0) * (1.0 - tar);
    float dRoad = min(rd, ax - 12.0);
    float field = smoothstep(45.0, 70.0, dRoad);
    // Fields: parcels of grass, ploughland and stubble, each with its own furrows.
    vec2 pc = floor(vec2(x / 90.0, z / 140.0 + 0.5 * floor(x / 90.0)));
    float ph = k2hash(pc + 4.0);
    vec3 parcel = ph < 0.45 ? vec3(0.03, 0.045, 0.02) : ph < 0.75 ? vec3(0.045, 0.034, 0.024) : vec3(0.06, 0.055, 0.035);
    float fu = (k2hash(pc + 9.0) < 0.5 ? x : z) * 1.6;
    float fw = fwidth(fu);
    parcel *= 0.85 + 0.15 * sin(fu * 6.283) * (1.0 - smoothstep(0.3, 0.8, fw));
    // Parcel edges are darker ditches.
    vec2 pf = fract(vec2(x / 90.0, z / 140.0 + 0.5 * floor(x / 90.0)));
    parcel *= 0.55 + 0.45 * smoothstep(0.0, 0.02, min(min(pf.x, 1.0 - pf.x), min(pf.y, 1.0 - pf.y)) );
    float n = k2noise(vP.xz * 0.7), n2 = k2fbm(vP.xz * 0.04);
    vec3 grass = vec3(0.026, 0.038, 0.017) * (0.75 + 0.5 * n2);
    vec3 alb = mix(grass, parcel, field);
    alb = mix(alb, vec3(0.046, 0.046, 0.05) * (0.9 + 0.2 * n), tar);
    alb = mix(alb, vec3(0.07, 0.068, 0.064) * (0.9 + 0.2 * n), sq);
    float steel = 0.0;
    if (rail > 0.5) {
      float r = abs(abs(x + 80.0) - 2.6) - 0.72;
      float aa = fwidth(x);
      steel = 1.0 - smoothstep(0.04, 0.04 + aa * 1.5, abs(r));
      alb = mix(vec3(0.05, 0.047, 0.045) * (0.7 + 0.6 * n), vec3(0.09), steel);
    }
    // Puddles lie on the asphalt where the noise runs high.
    float pud = tar * smoothstep(0.55, 0.61, k2fbm(vP.xz * 0.13 + 3.0));
    float wet = max(tar, sq) * max(pud, 0.5);
    alb *= 1.0 - 0.4 * wet;
    vec3 N = vec3(0.0, 1.0, 0.0);
    vec3 col = alb * (skyAmb(N) + lampLit(vP, N));
    // Wet ground, puddles and rails mirror the sky and the bank.
    vec3 R = reflect(V, N);
    float fres = 0.03 + 0.97 * pow(1.0 - max(dot(-V, N), 0.0), 5.0);
    vec4 M = uTexM * vec4(vP.x, 0.0, vP.z, 1.0);
    vec4 m = texture2D(tMirror, M.xy / M.w);
    vec3 refl = mix(k2sky(R), m.rgb, clamp(m.a, 0.0, 1.0) * pud);
    col += refl * fres * (max(tar, sq) * mix(0.3, 0.9, wet) + steel * 0.8 + 0.05);
    gl_FragColor = vec4(k2haze(col, vP), 1.0);
  }`,
});
groundMat.extensions = { derivatives: true };
for (const s of [-1, 1]) {
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2600).rotateX(-Math.PI / 2).translate(s * (CANAL_X + 1200), QUAY, -800), groundMat);
  scene.add(ground);
}
/* ---------- end ground ---------- */

/* ---------- K2: bloom ---------- */
// Lifted from Fireworks: bloom on a float target; only bright sources cross the threshold.
function makeBloom(strength, radius, threshold) {
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), strength, radius, threshold);
  const full = bloom.setSize.bind(bloom);
  // Full size on High, 0.7 on Standard, half on the ladder's rung 2.
  bloom.setSize = (w, h) => { const m = rung >= 2 ? 0.5 : quality() === 'high' ? 1 : 0.7; full(Math.max(1, w * m), Math.max(1, h * m)); };
  // A sigma of radius / 2.5 gives each blur layer a round falloff.
  for (const m of bloom.separableBlurMaterials) {
    const r = m.defines.KERNEL_RADIUS, sg = r / 2.5;
    m.uniforms.gaussianCoefficients.value = Array.from({ length: r }, (_, i) => Math.exp(-0.5 * i * i / (sg * sg)));
  }
  return bloom;
}
/* ---------- end K2 ---------- */

/* ---------- K2: grade ---------- */
// Lifted from Fireworks: linear grade before tone mapping, vignette, fixed grain.
function makeGrade({ tint, vig, vigIn, grain }) {
  return new ShaderPass({
    uniforms: {
      tDiffuse: { value: null },
      uRes: { value: new THREE.Vector2(1, 1) },
      uTint: { value: new THREE.Vector3(...tint) },
      uVig: { value: vig },
      uVigIn: { value: vigIn },
      uGrain: { value: grain },
    },
    vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform vec2 uRes;
    uniform vec3 uTint;
    uniform float uVig, uVigIn, uGrain;
    varying vec2 vUv;
    // An integer hash per pixel; float hashes draw faint stripes here.
    float h(vec2 p) {
      uvec2 q = uvec2(p);
      uint n = (q.x * 1597334677u) ^ (q.y * 3812015801u);
      n *= 1597334677u; n ^= n >> 16; n *= 2246822519u; n ^= n >> 13;
      return float(n) / 4294967295.0;
    }
    void main() {
      vec3 c = texture2D(tDiffuse, vUv).rgb + uTint;
      vec2 q = (vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
      c *= 1.0 - uVig * smoothstep(uVigIn, 1.1, length(q));
      float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c *= 1.0 + (h(gl_FragCoord.xy) - 0.5) * uGrain * (0.6 + 0.4 * smoothstep(0.0, 0.3, lum)) * 2.0;
      gl_FragColor = vec4(max(c, 0.0), 1.0);
    }`,
  });
}
/* ---------- end K2 ---------- */

/* ---------- post chain ---------- */
const POST = { bloom: [0.45, 0.45, 0.85], tint: [0.0008, 0.0009, 0.0014], vig: 0.45, vigIn: 0.45, grain: 0.03 };
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 2 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(makeBloom(...POST.bloom));
const grade = makeGrade(POST);
composer.addPass(grade);
composer.addPass(new OutputPass());

/* ---------- camera and size ---------- */
let size = { w: 1, h: 1, dpr: 1 };
// Look offsets from a drag; they ease toward the target.
const look = { yaw: 0, pitch: 0, ty: 0, tp: 0 };
// Sky eye circles the crossing from high up; drag turns it round a little.
const SKY_T = new THREE.Vector3(40, 0, -150), SKY_P = new THREE.Vector3(110, 0, -150);
let view = 'sky';
function frame() {
  const portrait = size.w < size.h;
  camera.aspect = size.w / size.h;
  if (view === 'sky') {
    camera.fov = portrait ? 46 : 34;
    // Phones look along the main road, over the bridge; wide screens look across the canal.
    const dist = portrait ? 560 : 560, el = (portrait ? 0.72 : 0.5) - look.pitch * 2, az = (portrait ? -1.45 : -0.5) + look.yaw * 2;
    const T = portrait ? SKY_P : SKY_T;
    camera.position.set(T.x + dist * Math.cos(el) * Math.sin(az), dist * Math.sin(el), T.z + dist * Math.cos(el) * Math.cos(az));
    camera.lookAt(T);
    // From the air the ground gets less sky; the exposure opens up.
    renderer.toneMappingExposure = 1.7;
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld();
    return;
  }
  camera.fov = portrait ? 62 : 44;
  renderer.toneMappingExposure = 1.25;
  // A low eye on the near towpath, turned a little toward the far bank.
  // Phones stand at the edge, so the water fills the foreground.
  camera.position.set(portrait ? -12.6 : -14.6, QUAY + 1.6, 14);
  camera.rotation.order = 'YXZ';
  camera.rotation.set((portrait ? -0.06 : 0.0) + look.pitch, -(portrait ? 0.26 : 0.22) + look.yaw, 0);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
}
function resize() {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  // Rung 1 of the ladder drops the pixel ratio; rung 2 shrinks the mirror.
  size = { w, h, dpr: pixelRatio(w, h, { maxDpr: 1.5, budget: 1.6e6, low: rung >= 1 }) };
  renderer.setPixelRatio(size.dpr);
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  // The mirror runs at half size, three quarters on High, a quarter on rung 2.
  const m = rung >= 2 ? 0.25 : quality() === 'high' ? 0.75 : 0.5;
  mirrorRT.setSize(Math.max(1, Math.round(w * size.dpr * m)), Math.max(1, Math.round(h * size.dpr * m)));
  grade.uniforms.uRes.value.set(w * size.dpr, h * size.dpr);
  stage.style.setProperty('--box', `${Math.max(0, (h - w / 2.39) / 2)}px`);
  frame();
  draw();
}
let visible = !document.hidden;
function draw() {
  if (!visible) return;
  renderMirror();
  composer.render();
}

/* Frame loop: full rate while a drag eases, 30 fps while the water drifts, then sleep. */
// QA can shorten the sleep with ?sleep=<ms>.
const SLEEP = +QS.get('sleep') || 60000;
let raf = 0, lastT = 0, lastDraw = 0, lastInput = performance.now(), pace = reduced() ? 0 : 1, simT = 0;
const busy = () => !!press || Math.abs(look.ty - look.yaw) + Math.abs(look.tp - look.pitch) > 1e-4;
function tick(now) {
  raf = 0;
  if (!visible || document.hidden) { lastT = 0; return; }
  const dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0;
  lastT = now;
  // Ambient drift eases out over 2 s once idle, and stays off in reduced motion.
  const awake = !reduced() && now - lastInput < SLEEP;
  pace = awake ? Math.min(1, pace + dt / 2) : Math.max(0, pace - dt / 2);
  const lively = busy();
  try {
    simT += dt * pace;
    U.uTime.value = simT;
    const k = 1 - Math.exp(-dt * (reduced() ? 6 : 10));
    look.yaw += (look.ty - look.yaw) * k;
    look.pitch += (look.tp - look.pitch) * k;
    if (lively || now - lastDraw >= 31) {
      frame();
      draw();
      watch(now, lively);
      lastDraw = now;
    }
  } finally {
    if (visible && (lively || pace > 0)) raf = requestAnimationFrame(tick);
    else { lastT = 0; frame(); draw(); }
  }
}
function wake() {
  lastInput = performance.now();
  if (!raf && visible && !document.hidden) raf = requestAnimationFrame(tick);
}
/* Performance ladder: slow frames step quality down a rung, never back up. */
let watchFrom = 0, watchN = 0, watchSum = 0, prevDraw = 0;
function watch(now, lively) {
  const gap = now - prevDraw;
  prevDraw = now;
  if (gap > 200) { watchFrom = now; watchN = watchSum = 0; return; }
  if (!watchFrom) watchFrom = now;
  if (now - watchFrom < 4000) return;
  watchN++; watchSum += gap;
  if (watchN < 2 || now - watchFrom < 6000) return;
  if (watchSum / watchN > (lively ? 1000 / 38 : 1000 / 22) && rung < 2) { rung++; resize(); }
  watchFrom = now - 4000; watchN = watchSum = 0;
}
whenVisible(stage, vis => {
  visible = vis;
  if (!vis) { cancelAnimationFrame(raf); raf = 0; lastT = 0; return; }
  draw();
  wake();
});
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
onReducedChange(() => wake());

/* Pointer: a press turns into a drag after 8 px, or a hold after 260 ms. */
let press = null;
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture(e.pointerId);
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, at: performance.now(), drag: false, yaw: look.ty, pitch: look.tp };
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  if (!press.drag && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { press.drag = true; stage.classList.add('held'); }
  if (!press.drag) return;
  // Drag looks along the canal, a little each way.
  const s = 1.4 / Math.max(size.w, size.h);
  look.ty = Math.max(-0.3, Math.min(0.3, press.yaw + (e.clientX - press.x) * s));
  look.tp = Math.max(-0.08, Math.min(0.1, press.pitch + (e.clientY - press.y) * s * 0.5));
  wake();
});
const end = e => {
  if (!press || e.pointerId !== press.id) return;
  press = null;
  stage.classList.remove('held');
  wake();
};
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);

/* ---------- bar ---------- */
// The weather sets the water; rain itself comes in Task 3.
const WEATHER = { dry: [0.1, 0.3], drizzle: [0.5, 0.6], rain: [0.8, 0.8], downpour: [1.1, 1.0] };
act.weather = v => { [W.uWind.value, W.uSmear.value] = WEATHER[v]; wake(); draw(); };
act.dusk = v => { setDusk(v); wake(); draw(); };
act.letterbox = on => { stage.toggleAttribute('data-letterbox', on); };
act.view = v => { view = v; look.yaw = look.ty = look.pitch = look.tp = 0; frame(); wake(); draw(); };
view = ui.setting('view')?.value === 'path' ? 'path' : 'sky';
setDusk(ui.slider?.value ?? 0.35);
act.letterbox(!!ui.setting('letterbox')?.value);

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  markReady();
  wake();
}, () => { canvas.classList.add('on'); markReady(); });
</script>
</body>
</html>
