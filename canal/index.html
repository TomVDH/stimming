<style>
/* Canal at dusk: a canal at blue hour, gables doubled in the water. */
:root { --stage: oklch(0.12 0.02 262); }
.stage--canal canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--canal canvas.on { opacity: 1; }
.stage--canal { cursor: grab; }
.stage--canal.held { cursor: grabbing; }
/* Letterbox bars clip the canvas to 2.39 to 1. */
.stage--canal[data-letterbox] canvas { clip-path: inset(var(--box, 0px) 0); }
@media (prefers-reduced-motion: reduce) { .stage--canal canvas { transition: none; } }
/* The camera rocker: three heights in one slab, on the right edge. */
.stim-ui > .cn-rock { top: 50%; right: 12px; transform: translateY(-50%); perspective: 260px; }
.cn-pad {
  display: flex; flex-direction: column; background: var(--glass); border: 1px solid var(--line); border-radius: 2px;
  box-shadow: var(--hard); transition: transform 0.35s cubic-bezier(0.3, 1.5, 0.5, 1);
}
/* The slab tips toward the end that is down. */
.cn-pad[data-v="sky"] { transform: rotateX(16deg); }
.cn-pad[data-v="path"] { transform: rotateX(-16deg); }
.cn-pad button {
  box-sizing: border-box; display: flex; align-items: center; justify-content: center;
  width: 58px; height: var(--chip); margin: 0; padding: 0; border: 0; border-radius: 0;
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--muted); background: none; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: color 0.15s ease, background 0.15s ease;
}
.cn-pad button + button { border-top: 1px solid var(--line); }
@media (hover: hover) { .cn-pad button:hover { color: var(--fg); } }
.cn-pad button[aria-checked="true"] { color: var(--bg); background: var(--fg); }
.cn-pad button:focus-visible { outline: 2px solid var(--fg); outline-offset: -3px; }
@media (prefers-reduced-motion: reduce) { .cn-pad { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Canal at dusk</span><span class="intro-sub">Stimming Lab</span></div></div>

<div class="wrap">

      <p class="fail" hidden>Canal at dusk needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Canal at dusk</h1>
    <div class="vignette" hidden></div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { initPage, whenVisible, pixelRatio, onQuality, linFit, reduced, onReducedChange, quality, audioKit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const stage = document.getElementById('stage');
// The weather chips and Dusk drive the look; set() binds once the scene exists.
const act = { weather() {}, dusk() {}, letterbox() {}, view() {}, boat() {} };
const QS = new URLSearchParams(location.search);
// Weather and Dusk persist under stimming.canal.<key>; storage may be blocked.
const saved = (k, d) => { try { return localStorage.getItem(`stimming.canal.${k}`) ?? d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.canal.${k}`, String(v)); } catch (e) { /* no storage */ } };
// Wall-clock seconds since load.
const T0 = performance.now();
const nowS = () => (performance.now() - T0) / 1000;
const ui = initPage({ id: 'canal', bar: {
  choice: { label: 'Weather', value: saved('weather', 'dry'), options: [
    { value: 'dry', label: 'Dry' }, { value: 'drizzle', label: 'Drizzle' },
    { value: 'rain', label: 'Rain' }, { value: 'downpour', label: 'Downpour' },
  ], onPick: v => { save('weather', v); act.weather(v); } },
  slider: { label: 'Dusk', min: 0, max: 1, step: 0.01, value: QS.has('dusk') ? +QS.get('dusk') : +saved('dusk', 0.35), onInput: v => { save('dusk', v); act.dusk(v); } },
  settings: [
    { type: 'toggle', id: 'letterbox', label: 'Letterbox', value: false, persist: true, onToggle: on => act.letterbox(on) },
  ],
  quality: true,
  actions: [{ verb: 'add', noun: 'Boat', key: ' ', onPress: () => act.boat() }],
  keys: [['click', 'a lamp'], ['drag', 'look round'], ['scroll', 'zoom'], ['space', 'boat']],
} });

// Seeded random keeps the street the same on every load.
let seed = 1302;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; ui.hideControls?.(); markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 4000);
// Layer 1 holds what the water mirrors.
const LIGHT = 1;
// The towpaths sit this high above the water.
const QUAY = 1.0;
// The canal runs along -z between these walls.
const CANAL_X = 12;
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;

/* ---------- lamps ---------- */
// Ten tappable lamps, then fixed lights: frietkot, staminee, station, church, farms, yard.
// Every lit shader reads this one array.
const LN = 19, TAPS = 10;
const U = {
  uLamp: { value: Array.from({ length: LN }, () => new THREE.Vector4()) },
  uLampC: { value: Array.from({ length: LN }, () => new THREE.Vector3()) },
  uZen: { value: new THREE.Vector3() },
  uHor: { value: new THREE.Vector3() },
  uGlowC: { value: new THREE.Vector3() },
  uSun: { value: new THREE.Vector3(-0.25, 0, -1).normalize() },
  uStars: { value: 0 },
  uDusk: { value: 0.35 },
  uWin: { value: new THREE.Vector3() },
  uHaze: { value: 0.0042 },
  uHazeH: { value: 18 },
  uTime: { value: 0 },
  // The church tower brightens while the bells ring.
  uBell: { value: 0 },
  // Wall-clock seconds, for warm-ups and televisions; it runs while the sim sleeps.
  uNow: { value: 0 },
  // A sodium lamp starts dim pink-red.
  uPink: { value: new THREE.Vector3() },
  // The first of the ten canal lamps in the lamp texture.
  uCanal0: { value: 0 },
  // Rain, 0 to 1; it eases toward the chip.
  uRainK: { value: 0 },
  // Sodium warm-up time; reduced motion shortens it.
  uWarmT: { value: 3 },
  // Raindrop rings: 1, or 0 under reduced motion, where the water only blurs.
  uRings: { value: 1 },
  // Streetlights: their data in one texture, their 12 m grid of nearest lamps in another.
  tSL: { value: null },
  tGrid: { value: null },
  // Town light in the night haze.
  uTown: { value: new THREE.Vector3() },
};
const LAMPS_GLSL = /* glsl */`
uniform vec4 uLamp[${LN}];
uniform vec3 uLampC[${LN}];
// Light from every lit lamp on a surface with normal N; a soft wrap reaches grazing walls.
vec3 lampLit(vec3 P, vec3 N) {
  vec3 s = vec3(0.0);
  for (int i = 0; i < ${LN}; i++) {
    if (uLamp[i].w <= 0.0) continue;
    vec3 d = uLamp[i].xyz - P;
    float dd = dot(d, d);
    s += uLampC[i] * uLamp[i].w * (0.3 + 0.7 * max(dot(N, d * inversesqrt(dd)), 0.0)) * 30.0 / (dd + 1.0);
  }
  return s;
}`;
// The main road crosses the canal here; the village sits round the crossing.
const ROAD_Z = -160;
// The canal bends gently away from the bridge in both directions.
const BEND = 0.00012;
const canalX = z => BEND * (z - ROAD_Z) ** 2;
// Lamp heads: five on each towpath, between the camera and the bridge.
const LAMP_POS = [
  ...[-8, -38, -68, -98, -128].map(z => new THREE.Vector3(canalX(z) - CANAL_X - 2.4, QUAY + 7.5, z)),
  ...[-23, -53, -83, -113, -143].map(z => new THREE.Vector3(canalX(z) + CANAL_X + 2.4, QUAY + 7.5, z)),
];
LAMP_POS.forEach((p, i) => U.uLamp.value[i].set(p.x, p.y, p.z, 0));
// Fixed lights: position, colour as OKLCH, and full strength.
const VENUES = [
  { p: [25, 2.5, -144], c: [0.9, 0.08, 80], k: 3 },
  { p: [50, 3, -166], c: [0.75, 0.14, 60], k: 2.5 },
  { p: [-87, 6, -142], c: [0.9, 0.05, 230], k: 2.2 },
  { p: [-87, 6, -114], c: [0.9, 0.05, 230], k: 2.2 },
  { p: [44, 1.5, -206], c: [0.85, 0.1, 70], k: 9 },
  { p: [56, 1.5, -194], c: [0.85, 0.1, 70], k: 9 },
  { p: [397, 6, -319], c: [0.75, 0.15, 60], k: 4 },
  { p: [-353, 6, -332], c: [0.75, 0.15, 60], k: 4 },
  { p: [250, 9, 290], c: [0.92, 0.04, 240], k: 6 },
];
VENUES.forEach((v, i) => {
  U.uLamp.value[TAPS + i].set(v.p[0], QUAY + v.p[1], v.p[2], 0);
  U.uLampC.value[TAPS + i].set(...linFit(...v.c));
});
/* ---------- end lamps ---------- */

/* ---------- K2: noise ---------- */
// Lifted from Fireworks.
const K2_NOISE = /* glsl */`
float k2hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float k2noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(k2hash(i), k2hash(i + vec2(1, 0)), u.x), mix(k2hash(i + vec2(0, 1)), k2hash(i + vec2(1, 1)), u.x), u.y);
}
float k2fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * k2noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s;
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: sky ---------- */
// Lifted from Fireworks; Dusk sets the zenith, horizon and afterglow.
// The afterglow lies low in the west, down the canal.
const K2_SKY = /* glsl */`
uniform vec3 uZen, uHor, uGlowC, uSun;
uniform float uStars;
float k2stars(vec3 dir) {
  vec2 q = vec2(atan(dir.x, -dir.z) * 260.0, dir.y * 260.0);
  vec2 i = floor(q), f = fract(q) - 0.5;
  float h = k2hash(i);
  // About one cell in two hundred holds a star.
  float on = step(0.995, h);
  vec2 o = vec2(k2hash(i + 7.1), k2hash(i + 3.3)) - 0.5;
  return on * exp(-dot(f - o * 0.6, f - o * 0.6) * 60.0) * (0.02 + 0.05 * k2hash(i + 1.7));
}
float k2glow(vec3 dir) {
  vec2 h = normalize(dir.xz + vec2(1e-5));
  return pow(max(dot(h, uSun.xz), 0.0), 3.0) * exp(-max(dir.y, 0.0) * 7.0);
}
vec3 k2sky(vec3 dir) {
  float up = max(dir.y, 0.0);
  vec3 col = mix(uHor, uZen, smoothstep(0.0, 0.55, pow(up, 0.7)));
  col += uGlowC * k2glow(dir);
  return col + vec3(0.85, 0.9, 1.0) * k2stars(dir) * uStars * smoothstep(0.03, 0.25, dir.y);
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: haze ---------- */
// Lifted from Fireworks; the haze takes the horizon colour.
const K2_HAZE = /* glsl */`
uniform float uHaze;
uniform float uHazeH;
float k2hazeAmount(vec3 P) {
  vec3 v = P - cameraPosition;
  float dist = length(v);
  float k = 1.0 / uHazeH;
  float h0 = max(cameraPosition.y, 0.0), h1 = max(P.y, 0.0), dh = h1 - h0;
  // Exponential height fog integrated along the ray.
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);
  return 1.0 - exp(-dist * uHaze * max(avg, 0.0));
}
uniform vec3 uTown;
vec3 k2hazeColor(vec3 dir) { return uHor * 0.9 + uGlowC * k2glow(dir) * 0.5 + uTown; }
vec3 k2haze(vec3 c, vec3 P) {
  return mix(c, k2hazeColor(normalize(P - cameraPosition)), k2hazeAmount(P));
}`;
/* ---------- end K2 ---------- */
// A lamp's live state; the lit shaders and the heads share it.
const LAMP_STATE = /* glsl */`
uniform float uNow, uWarmT;
uniform vec3 uPink;
// One lamp's level and colour: the photocell follows Dusk; a tap forces it on or off.
// Rows per lamp: position and mark, colour and reach, then state and the tap time.
vec4 lampState(int id, out vec4 lp, out vec4 lc) {
  ivec2 at = ivec2(id % 2048, (id / 2048) * 3);
  lp = texelFetch(tSL, at, 0);
  lc = texelFetch(tSL, at + ivec2(0, 1), 0);
  vec4 st = texelFetch(tSL, at + ivec2(0, 2), 0);
  bool led = lc.w < 22.0;
  float lvl, warm;
  if (st.x == 0.0) { lvl = smoothstep(lp.w, lp.w + 0.025, uDusk); warm = lvl; }
  else if (st.x > 0.0) {
    // Sodium warms over 3 s with an ease-out, from 15 % up; LED comes on in 0.3 s.
    float t = clamp((uNow - st.y) / (led ? 0.3 : uWarmT), 0.0, 1.0);
    warm = 1.0 - pow(1.0 - t, 3.0);
    lvl = led ? warm : 0.15 + 0.85 * warm;
  } else { lvl = 1.0 - clamp((uNow - st.y) / 0.4, 0.0, 1.0); warm = 1.0; }
  vec3 col = led ? lc.rgb : mix(uPink, lc.rgb, warm);
  return vec4(col, lvl);
}
`;
const HEAD = `${LAMPS_GLSL}\n${K2_NOISE}\n${K2_SKY}\n${K2_HAZE}
uniform float uDusk, uTime, uBell;
float canalX(float z) { float t = z - (${ROAD_Z}.0); return ${BEND} * t * t; }
uniform vec3 uWin;
// Sky light on a surface: the zenith from above, the horizon from the side.
// The afterglow in the west warms the walls that face it.
vec3 skyAmb(vec3 N) { return mix(uHor * 0.8, uZen * 1.3, 0.5 + 0.5 * N.y) * 0.9 + uGlowC * 1.2 * max(dot(N, uSun), 0.0); }
// Streetlights: each fragment reads the lamps listed for its 12 m cell, up to eight.
// The plan spans x -1500 to 1500 and z -2000 to 1000.
uniform highp sampler2D tSL;
uniform highp sampler2D tGrid;
uniform int uCanal0;
uniform float uRainK, uRings;
${LAMP_STATE}
// Raindrop rings on a 0.9 m grid; each cell rings at its own time. Returns a slope.
vec2 rainRings(vec2 p, float t, float k) {
  vec2 n = vec2(0.0);
  if (k <= 0.0) return n;
  vec2 id0 = floor(p / 0.9);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 id = id0 + vec2(float(i), float(j));
    if (k2hash(id + 3.1) > k) continue;
    float per = 0.9 + 0.6 * k2hash(id + 7.7);
    float age = fract(t / per + k2hash(id + 1.9)) * per;
    vec2 c = (id + 0.2 + 0.6 * vec2(k2hash(id + 5.3), k2hash(id + 9.1))) * 0.9;
    vec2 d = p - c;
    float dl = length(d) + 1e-4, x = dl - age * 0.55;
    n += d / dl * exp(-x * x * 500.0) * sin(x * 40.0) * (1.0 - age / per);
  }
  return n;
}
// Diffuse light comes back; spec gathers the glossy share for wet or glass surfaces.
vec3 streetLit(vec3 P, vec3 N, vec3 V, float gloss, inout vec3 spec) {
  vec2 c = floor((P.xz - vec2(-1500.0, -2000.0)) / 12.0);
  if (c.x < 0.0 || c.y < 0.0 || c.x > 249.0 || c.y > 249.0) return vec3(0.0);
  ivec2 ci = ivec2(c);
  vec4 a = texelFetch(tGrid, ivec2(ci.x * 2, ci.y), 0), b = texelFetch(tGrid, ivec2(ci.x * 2 + 1, ci.y), 0);
  float ids[8] = float[8](a.x, a.y, a.z, a.w, b.x, b.y, b.z, b.w);
  vec3 s = vec3(0.0);
  for (int k = 0; k < 8; k++) {
    if (ids[k] < 0.0) break;
    vec4 lp, lc;
    vec4 ls = lampState(int(ids[k]), lp, lc);
    float on = ls.a;
    if (on <= 0.0) continue;
    vec3 d = lp.xyz - P;
    float dd = dot(d, d), dist = sqrt(dd);
    vec3 l = d / dist;
    // A smooth window ends the reach at the lamp's radius; the head throws light downward.
    float win = clamp(1.0 - pow(dist / lc.w, 4.0), 0.0, 1.0);
    float k2 = on * win * win * smoothstep(-0.15, 0.45, l.y) * 160.0 / (dd + 1.0);
    s += ls.rgb * k2 * max(dot(N, l), 0.0);
    spec += ls.rgb * k2 * gloss * pow(max(dot(N, normalize(l - V)), 0.0), 48.0);
  }
  return s;
}`;

/* ---------- dusk ---------- */
// Three sky keys: blue hour, late blue, night; Dusk runs through them.
const KEYS = [
  { zen: [0.4, 0.1, 262], hor: [0.6, 0.065, 248], glow: [0.6, 0.07, 35] },
  { zen: [0.24, 0.085, 266], hor: [0.4, 0.07, 256], glow: [0.4, 0.05, 30] },
  { zen: [0.075, 0.02, 268], hor: [0.16, 0.034, 45], glow: [0.17, 0.035, 55] },
].map(k => ({ zen: linFit(...k.zen), hor: linFit(...k.hor), glow: linFit(...k.glow) }));
const lerp3 = (a, b, t) => a.map((x, i) => x + (b[i] - x) * t);
function setDusk(d) {
  U.uDusk.value = d;
  const t = d * 2, i = Math.min(1, Math.floor(t)), f = t - i;
  const a = KEYS[i], b = KEYS[i + 1];
  U.uZen.value.set(...lerp3(a.zen, b.zen, f));
  U.uHor.value.set(...lerp3(a.hor, b.hor, f));
  // The afterglow fades before the sky goes dark.
  U.uGlowC.value.set(...lerp3(a.glow, b.glow, f).map(x => x * 0.35 * (1 - d) ** 1.5));
  U.uStars.value = Math.max(0, (d - 0.55) / 0.45);
  // Streetlights switch on between 0.28 and 0.45; their light lifts the night haze.
  const sl = Math.min(1, Math.max(0, (d - 0.28) / 0.17)), sk = sl * sl * (3 - 2 * sl);
  U.uTown.value.set(...TOWN.map(x => x * sk));
  // The frietkot, staminee, station and church lights come on as it darkens.
  const on = Math.min(1, Math.max(0, (d - 0.1) / 0.3));
  VENUES.forEach((v, i) => { U.uLamp.value[TAPS + i].w = v.k * on * on * (3 - 2 * on); });
}
U.uWin.value.set(...linFit(0.8, 0.12, 70).map(x => x * 2.6));
const TOWN = linFit(0.6, 0.12, 55).map(x => x * 0.01);
U.uPink.value.set(...linFit(0.5, 0.12, 10));
/* ---------- end dusk ---------- */

/* ---------- sky dome ---------- */
const sky = new THREE.Mesh(new THREE.SphereGeometry(2500, 32, 16), new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false,
  vertexShader: /* glsl */`varying vec3 vP; void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`varying vec3 vP; ${HEAD} void main() { gl_FragColor = vec4(k2sky(normalize(vP - cameraPosition)), 1.0); }`,
}));
sky.renderOrder = -1;
scene.add(sky);

/* ---------- buildings ---------- */
// Surface kinds in aInfo.w.
const BRICK = 0, RENDER = 1, CONCRETE = 2, STEEL = 3, CHURCH = 4, METAL = 5, TREE = 6, FRIT = 7, SIGN = 8, STAM = 9, LAMPHEAD = 10;
const fr = x => x - Math.floor(x);
const v2 = ps => new THREE.Shape(ps.map(([x, y]) => new THREE.Vector2(x, y)));
const UP = new THREE.Vector3(0, 1, 0);
// One building: u runs across the front, v up, z back; b is the eaves height.
// The roof ridge runs along the front; a gable house turns its gable to the street.
function house(w, b, d, rh, seed, kind, { win = true, gable = false } = {}) {

/* ---------- end buildings ---------- */

/* ---------- the village centre ---------- */

/* ---------- bridge, quay walls and lamp posts ---------- */

/* ---------- plan: occupancy grid and the painted ground map ---------- */
// The plan spans x -1500 to 1500 and z -2000 to 1000.
const MAP = { x0: -1500, z0: -2000, size: 3000, px: 2048 };
// A lake in an old sand pit: centre and radii.
const LAKE = [560, -820, 75, 48];
// Occupancy in 2 m cells: 0 free, 1 road, 2 building, 3 garden, 4 kept clear, 5 industry only.
const CELL = 2, GN = MAP.size / CELL;
const occ = new Uint8Array(GN * GN);

  const i = Math.floor((x - MAP.x0) / CELL), j = Math.floor((z - MAP.z0) / CELL);

const occGet = (x, z) => { const c = cellAt(x, z); return c < 0 ? 4 : occ[c]; };

const K = MAP.px / MAP.size;

/* ---------- fields ---------- */

/* ---------- end fields ---------- */

/* ---------- roads ---------- */

/* ---------- end roads ---------- */

/* ---------- plots ---------- */
const CENTRES = [[44, -170], [-44, -160]];

  if (pts.size === 2) { pinch = { d0: spread(), z0: zoom }; press = null; stage.classList.remove('held'); wake(); return; }
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, at: performance.now(), drag: false, yaw: look.ty, pitch: look.tp };
  wake();
});
stage.addEventListener('pointermove', e => {
  if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size >= 2) { setZoom(pinch.z0 * pinch.d0 / spread()); return; }
  if (!press || e.pointerId !== press.id) return;
  if (!press.drag && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { press.drag = true; stage.classList.add('held'); }
  if (!press.drag) return;
  // Drag looks along the canal, a little each way.
  const s = 1.4 / Math.max(size.w, size.h);
  // The high views turn further round than the towpath.
  const yr = view === 'path' ? 0.3 : 0.6;
  look.ty = Math.max(-yr, Math.min(yr, press.yaw + (e.clientX - press.x) * s));
  look.tp = Math.max(-0.08, Math.min(0.1, press.pitch + (e.clientY - press.y) * s * 0.5));
  wake();
});
const end = e => {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (!press || e.pointerId !== press.id) return;
  press = null;
  stage.classList.remove('held');
  wake();
};
stage.addEventListener('pointerup', e => {
  if (press && e.pointerId === press.id && !press.drag && performance.now() - press.at < 260) tapAt(e.clientX, e.clientY);
  end(e);
});
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);


/* ---------- sound: rain, wind, lamps and a far carillon ---------- */
// Muted by default; the kit starts on a gesture and sleeps when the toy settles.
const kit = audioKit({ keys: new Set([' ']) });
let A = null;
// Scheduled one-shots; a hidden tab stops them all.
const voices = new Set();
let pendEnd = 0;
const jit = (x, k) => x * (1 + (Math.random() - 0.5) * 2 * k);
// A decaying noise burst makes the reverb's impulse.
function impulse(ac, sec, decay) {
  const n = Math.round(ac.sampleRate * sec), b = ac.createBuffer(2, n, ac.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
  }
  return b;
}
function noiseLoop(ac, rate) {
  const s = ac.createBufferSource();
  s.buffer = kit.noise; s.loop = true; s.playbackRate.value = rate;
  s.start();
  return s;
}
// The graph builds once per context: a bus, a long reverb, and the two beds.
function graph() {
  const ac = kit.live();
  if (!ac) return null;
  if (A?.ac === ac) return A;
  const bus = ac.createGain();
  bus.connect(kit.out);
  const verb = ac.createConvolver();
  verb.buffer = impulse(ac, 5, 2.4);
  verb.connect(bus);
  // Rain on stone: a soft band of hiss.
  const hissG = ac.createGain(); hissG.gain.value = 0;
  const hbp = ac.createBiquadFilter(); hbp.type = 'bandpass'; hbp.frequency.value = 3200; hbp.Q.value = 0.4;
  noiseLoop(ac, 1).connect(hbp).connect(hissG).connect(bus);
  // Wind: low noise whose filter breathes.
  const windG = ac.createGain(); windG.gain.value = 0;
  const wlp = ac.createBiquadFilter(); wlp.type = 'lowpass'; wlp.frequency.value = 240; wlp.Q.value = 0.8;
  const lfo = ac.createOscillator(), lfoG = ac.createGain();
  lfo.frequency.value = 0.07; lfoG.gain.value = 110;
  lfo.connect(lfoG).connect(wlp.frequency); lfo.start();
  noiseLoop(ac, 0.3).connect(wlp).connect(windG).connect(bus);
  A = { ac, bus, verb, hissG, windG, bellEnd: 0 };
  return A;
}
// A voice's pan from its place on screen.
function panAt(x, y, z) {
  proj.set(x, y, z).project(camera);
  return Math.max(-0.9, Math.min(0.9, proj.x * 0.8));
}
function track(node, end) { voices.add(node); pendEnd = Math.max(pendEnd, end); node.onended = () => voices.delete(node); }
// One plink: a short sine that drops a little, somewhere on the water.
function plink(g, t) {
  const ac = g.ac, o = ac.createOscillator(), e = ac.createGain(), p = ac.createStereoPanner();
  const f = 1300 * Math.pow(2.6, Math.random());
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.82, t + 0.05);
  e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(jit(0.018, 0.5), t + 0.002);
  e.gain.exponentialRampToValueAtTime(0.0001, t + jit(0.05, 0.4));
  p.pan.value = (Math.random() - 0.5) * 1.6;
  o.connect(e).connect(p).connect(g.bus);
  o.start(t); o.stop(t + 0.08);
  track(o, t + 0.08);
}
// The beds follow the eased weather; plinks fall at a rate set by the rain.
function soundTick(dt) {
  const g = graph();
  if (!g) return;
  const t = g.ac.currentTime, rk = U.uRainK.value, far = { sky: 0.55, tower: 0.8, path: 1 }[view];
  g.hissG.gain.setTargetAtTime(0.16 * rk * far, t, 0.4);
  g.windG.gain.setTargetAtTime((0.025 + 0.11 * W.uWind.value) * far, t, 0.6);
  if (reduced() || rk < 0.02) return;
  for (let n = rk * 28 * far * dt; n > 0; n--) if (Math.random() < n) plink(g, t + Math.random() * dt);
}
// A lamp: a relay click; sodium then hums up through its warm-up and falls silent.
function lampSound(i, on) {
  const g = graph();
  if (!g) return;
  const ac = g.ac, t = ac.currentTime + 0.01, l = SL[i], p = ac.createStereoPanner();
  p.pan.value = panAt(l.x, QUAY + l.y, l.z);
  p.connect(g.bus);
  const c = ac.createBufferSource(), cb = ac.createBiquadFilter(), ce = ac.createGain();
  c.buffer = kit.noise; c.playbackRate.value = jit(1, 0.2);
  cb.type = 'bandpass'; cb.frequency.value = jit(2200, 0.25); cb.Q.value = 3;
  ce.gain.setValueAtTime(jit(0.35, 0.3), t); ce.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
  c.connect(cb).connect(ce).connect(p);
  c.start(t, Math.random() * 0.5); c.stop(t + 0.04);
  track(c, t + 0.04);
  if (!on || l.led) return;
  // Mains hum at 100 Hz, rising as the arc strikes and warms, then settling.
  const warm = U.uWarmT.value, o = ac.createOscillator(), bp = ac.createBiquadFilter(), e = ac.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(jit(92, 0.02), t); o.frequency.linearRampToValueAtTime(jit(100, 0.01), t + warm);
  bp.type = 'bandpass'; bp.frequency.value = 300; bp.Q.value = 1.2;
  e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(jit(0.05, 0.3), t + warm * 0.8);
  e.gain.exponentialRampToValueAtTime(0.0005, t + warm + 1.2);
  o.connect(bp).connect(e).connect(p);
  o.start(t); o.stop(t + warm + 1.3);
  track(o, t + warm + 1.3);
}
// The carillon: an original eight-note phrase, minor, on additive bells.
// Partials: hum 0.5, prime 1, minor tierce 1.2, quint 1.5, nominal 2.
const PHRASE = [[67, 0], [70, 0.42], [74, 0.84], [72, 1.26], [70, 1.68], [67, 2.1], [65, 2.52], [67, 3.06]];
const PARTS = [[0.5, 0.45, 6], [1, 1, 3.6], [1.2, 0.55, 2.6], [1.5, 0.3, 2], [2, 0.45, 1.6]];
function bell(g, dest, f, t, k) {
  for (const [r, a, dk] of PARTS) {
    const o = g.ac.createOscillator(), e = g.ac.createGain();
    o.frequency.value = f * r;
    e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(a * k, t + 0.004);
    e.gain.exponentialRampToValueAtTime(0.0001, t + dk);
    o.connect(e).connect(dest);
    o.start(t); o.stop(t + dk + 0.05);
    track(o, t + dk + 0.05);
  }
}
// Sound from the tower arrives 0.6 s late, dulled by distance, mostly reverb.
// A second tap waits for the phrase to end; it never overlaps.
function carillon() {
  const g = graph();
  if (!g) return;
  const ac = g.ac, t0 = Math.max(ac.currentTime + 0.6, g.bellEnd);
  if (g.bellEnd > ac.currentTime + 4) return;
  const lp = ac.createBiquadFilter(), dry = ac.createGain(), send = ac.createGain(), p = ac.createStereoPanner();
  lp.type = 'lowpass'; lp.frequency.value = view === 'sky' ? 1800 : 2600;
  dry.gain.value = 0.35; send.gain.value = 0.9;
  p.pan.value = panAt(56, QUAY + 30, -205.5);
  lp.connect(dry).connect(p).connect(g.bus);
  lp.connect(send).connect(g.verb);
  const cents = (Math.random() - 0.5) * 0.06;
  for (const [m, dt] of PHRASE) bell(g, lp, 440 * Math.pow(2, (m - 69) / 12 + cents / 12), t0 + (dt ? jit(dt, 0.03) : 0), jit(0.09, 0.15));
  g.bellEnd = t0 + 3.06 + 0.5;
  pendEnd = Math.max(pendEnd, t0 + 9);
}
// A hidden tab stops every voice and lets the beds fall silent.
function stopAll() {
  for (const v of voices) { try { v.stop(); } catch (e) { /* already stopped */ } }
  voices.clear();
  if (A) { A.bellEnd = 0; A.hissG.gain.value = 0; A.windG.gain.value = 0; }
}
const pending = () => (kit.ac ? kit.ac.currentTime < pendEnd : false);
/* ---------- end sound ---------- */

/* ---------- lamps you can tap ---------- */
let warmUntil = 0;
// A lamp's handle: toggle flips it against what it shows now.
function lamp(i) {
  return {
    toggle() {
      const d = U.tSL.value.image.data, o = (slRow(i) + 2 * SLW) * 4, l = SL[i];
      const auto = U.uDusk.value > l.mark + 0.0125;
      const lit = d[o] > 0 || (d[o] === 0 && auto);
      d[o] = lit ? -1 : 1;
      d[o + 1] = nowS();
      U.tSL.value.needsUpdate = true;
      warmUntil = d[o + 1] + 3.2;
      lampSound(i, !lit);
      taa.reset = true;
      wake();
      return !lit;
    },
  };
}
// The church tower's corners, for picking.
const TOWER = [[51.5, -210], [60.5, -201]];
const proj = new THREE.Vector3();
const toPx = (x, y, z, r) => { proj.set(x, y, z).project(camera); return proj.z > 1 ? null : [(proj.x * 0.5 + 0.5) * r.width, (0.5 - proj.y * 0.5) * r.height]; };
// What a tap at client x, y hits: the nearest lamp head within 28 px, or the church.
// Inside the tower's screen box the church wins unless a head is within 10 px.
function pickAt(cx, cy) {
  const r = stage.getBoundingClientRect(), px = cx - r.left, py = cy - r.top;
  let best = -1, bd = 28;
  SL.forEach((l, i) => {
    const q = toPx(l.x, QUAY + l.y, l.z, r);
    if (!q) return;
    const dd = Math.hypot(q[0] - px, q[1] - py);
    if (dd < bd) { bd = dd; best = i; }
  });
  // The church: the screen box of the tower and spire.
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const x of [TOWER[0][0], TOWER[1][0]]) for (const z of [TOWER[0][1], TOWER[1][1]]) for (const y of [QUAY, QUAY + 56]) {
    const q = toPx(x, y, z, r);
    if (!q) continue;
    x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]);
  }
  const tower = px > x0 - 6 && px < x1 + 6 && py > y0 - 6 && py < y1 + 6;
  if (tower && (best < 0 || bd > 10)) return { belfry: true };
  return best >= 0 ? { lamp: best } : null;
}
// A tap on the canal starts a ring where the ray meets the water.
let tapN = 0, tapUntil = 0;
function ripple(cx, cy) {
  const r = stage.getBoundingClientRect();
  proj.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1, 0.5).unproject(camera).sub(camera.position);
  if (proj.y >= -1e-4) return;
  const t = -camera.position.y / proj.y, x = camera.position.x + proj.x * t, z = camera.position.z + proj.z * t;
  if (Math.abs(x - canalX(z)) > CANAL_X) return;
  W.uTap.value[tapN++ % 4].set(x, z, U.uTime.value, { sky: 3, tower: 2, path: 1 }[view]);
  tapUntil = nowS() + 4;
  taa.reset = true;
  wake();
}
function tapAt(cx, cy) {
  const hit = pickAt(cx, cy);
  if (hit?.lamp != null) lamp(hit.lamp).toggle();
  else if (hit?.belfry) { U.uBell.value = 1; carillon(); taa.reset = true; wake(); }
  else ripple(cx, cy);
}

/* ---------- bar ---------- */
// The weather sets the water; rain itself comes in Task 3.
// Each chip: wind ripple, reflection smear, rain. The water eases toward them.
const WEATHER = { dry: [0.1, 0.3, 0], drizzle: [0.4, 0.55, 0.25], rain: [0.7, 0.8, 0.6], downpour: [1.0, 1.0, 1.0] };
let wx = WEATHER.dry;
act.weather = v => { wx = WEATHER[v] ?? WEATHER.dry; taa.reset = true; wake(); };
act.boat = () => addBoat();
// Over about 2 s the rain thins or thickens; the mirror settles over about 3 s.
function easeWeather(dt) {
  const k = 1 - Math.exp(-dt / 0.8), k2 = 1 - Math.exp(-dt / 1.1);
  W.uWind.value += (wx[0] - W.uWind.value) * k2;
  W.uSmear.value += (wx[1] - W.uSmear.value) * k2;
  U.uRainK.value += (wx[2] - U.uRainK.value) * k;
  U.uHaze.value = 0.0042 * (1 + 0.6 * U.uRainK.value);
}
const easing = () => Math.abs(wx[0] - W.uWind.value) + Math.abs(wx[1] - W.uSmear.value) + Math.abs(wx[2] - U.uRainK.value) > 0.004;
act.dusk = v => { setDusk(v); taa.reset = true; wake(); draw(); };
act.letterbox = on => { stage.toggleAttribute('data-letterbox', on); };
// A new view flies from wherever the camera is now.
act.view = v => {
  if (v === view || !VIEWS.includes(v)) return;
  fly = camPose ? { from: camPose, t0: performance.now() } : null;
  view = v;
  look.yaw = look.ty = look.pitch = look.tp = 0;
  zoom = 1;
  save('view', v);
  rock.dataset.v = v;
  rock.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.v === v)));
  wake();
};
view = VIEWS.includes(saved('view', 'sky')) ? saved('view', 'sky') : 'sky';
/* ---------- the camera rocker ---------- */
// One slab, three heights, top to bottom; arrow keys step it while it has focus.
const rock = document.createElement('div');
rock.className = 'cn-pad';
rock.setAttribute('role', 'radiogroup');
rock.setAttribute('aria-label', 'Camera');
rock.dataset.v = view;
for (const [v, label] of [['sky', 'Sky'], ['tower', 'Tower'], ['path', 'Path']]) {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.v = v; b.textContent = label;
  b.setAttribute('role', 'radio');
  b.setAttribute('aria-checked', String(v === view));
  b.addEventListener('click', () => act.view(v));
  rock.append(b);
}
rock.addEventListener('keydown', e => {
  const d = { ArrowUp: -1, ArrowDown: 1 }[e.key];
  if (!d) return;
  e.preventDefault(); e.stopPropagation();
  const v = VIEWS[Math.max(0, Math.min(2, VIEWS.indexOf(view) + d))];
  act.view(v);
  rock.querySelector(`[data-v="${v}"]`).focus();
});
{
  const slot = document.createElement('div');
  slot.className = 'cn-rock';
  slot.append(rock);
  document.querySelector('.stim-ui')?.append(slot);
}
/* ---------- end camera rocker ---------- */
setDusk(ui.slider?.value ?? 0.35);
// The saved weather applies at once on load, with no easing.
wx = WEATHER[ui.choice?.value] ?? WEATHER.dry;
easeWeather(60);
act.letterbox(!!ui.setting('letterbox')?.value);

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  markReady();
  wake();
}, () => { canvas.classList.add('on'); markReady(); });
</script>
