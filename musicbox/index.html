<style>
/* Layout: header row, the stage at full width, one chip row. */
:root {
  --bg: oklch(0.16 0.012 275);
  --surface: oklch(0.195 0.014 275);
  --line: oklch(0.29 0.016 275);
  --fg: oklch(0.94 0.008 275);
  --muted: oklch(0.64 0.02 275);
  --focus: oklch(0.84 0.13 205);

  color-scheme: dark;
}
body {

}

<body>

<div class="wrap">
  <header>
    <h1>Music box</h1>
    <div class="tools">
      <button class="snd" id="snd" type="button" aria-label="Sound" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 8h2.6l3.9-3.2v10.4L5.6 12H3z"/>
          <path class="on" d="M12.8 8.1a3 3 0 0 1 0 3.8M15.1 6.1a6 6 0 0 1 0 7.8"/>
          <path class="off" d="M13.2 8l4 4M17.2 8l-4 4"/>
        </svg>
      </button>
      <a class="home" href="../index.html">Stimming</a>
    </div>
  </header>
  <main>
    <div class="stage" id="stage" tabindex="0" role="application" aria-label="A music box: a turning pin roll over fifteen coloured bars. Click the roll to place or remove a pin, drag the roll or the handle to play, and flick to wind the spring; Space winds, Up and Down turn the roll one step, Left and Right pick a bar, and Enter places or removes a pin.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Music box needs Canvas, which this browser has turned off.</p>
    </div>
    <div class="foot">
      <div class="ctl">
        <button class="chip" id="clear" type="button">Clear</button>
        <button class="chip" id="tune" type="button">Tune</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt><span class="fine">Click the roll</span><span class="touch">Tap the roll</span></dt><dd>pin</dd></div>
        <div><dt>Drag the handle</dt><dd>play</dd></div>
        <div><dt>Flick</dt><dd>wind up</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>wind</dd></div>
      </dl>
    </div>
  </main>
</div>

<script type="module">
const panel = document.getElementById('stage'), cv = panel.querySelector('canvas');
const ctx = cv.getContext('2d', { alpha: false });
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; wake(); });
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (a, n) => ((a % n) + n) % n;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };

/* ---------- colour: OKLCH in, sRGB out ---------- */
function lin(L, C, h) {
  const a = C * Math.cos(h * D2R), b = C * Math.sin(h * D2R);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
  ];
}
// Chroma shrinks until the colour fits sRGB.
function linFit(L, C, h) {
  let c = lin(L, C, h);
  for (let i = 0; i < 24 && (Math.min(...c) < -1e-4 || Math.max(...c) > 1.0001); i++) c = lin(L, (C *= 0.9), h);
  return c.map(v => clamp(v));
}
const enc = v => (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055);
const rgb = (L, C, h) => linFit(L, C, h).map(v => Math.round(enc(v) * 255));
const okMemo = new Map();
function ok(L, C, h, a = 1) {
  const key = L + ',' + C + ',' + h;
  let c = okMemo.get(key);
  if (!c) okMemo.set(key, (c = rgb(L, C, h)));
  return `rgba(${c[0]},${c[1]},${c[2]},${+a.toFixed(3)})`;
}

/* ---------- music: fifteen teeth, C major over two octaves ---------- */
const N = 15, S = 32, DPHI = TAU / S;
// Pins cross the comb half a step after a rest position.
const P = 6.5, CRANK = 8, BASE = 1 / 0.24, CAP = 3.5 * S, FLICK = 6.5, WHIR = 26;
const SEMI = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23, 24];
const FREQ = SEMI.map(s => 523.25 * 2 ** (s / 12));
// Each entry is a step, then the teeth pinned on that step.
const TUNES = [
  [[0, 0, 9], [2, 4, 11], [3, 12], [4, 2, 11], [6, 4, 9],
    [8, 5, 12], [10, 2, 14], [12, 0, 13], [13, 12], [14, 2, 11],
    [16, 3, 10], [18, 5, 12], [20, 4, 11], [22, 6, 9], [23, 8],
    [24, 0, 7], [26, 4, 9], [28, 2, 11], [30, 4, 14]],
  [[0, 5, 14], [3, 0, 13], [6, 2, 12], [7, 11],
    [8, 3, 12], [11, 0, 10], [13, 11], [14, 5, 12],
    [16, 0, 11], [19, 4, 9], [22, 2, 7], [23, 8],
    [24, 4, 9], [27, 1, 8], [28, 11], [30, 6, 13]],
];

/* ---------- sound: synthesised, started by the first gesture ---------- */
const SKEY = 'stimming.musicbox.sound', MAXV = 14, LEAD = 0.006;
let soundOn = true;
try { soundOn = localStorage.getItem(SKEY) !== '0'; } catch (err) { /* storage is optional */ }
let ac = null, out = null, inst = null, noise = null, askedAt = -1e9, voices = 0, restT = 0;
let whirG = null, whirF = null, whirAt = 0, clickAt = 0;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.05 * voices);
const held = [], ringV = new Array(N).fill(null), lastAt = new Float64Array(N).fill(-1);
// Each mode lists frequency ratio, level and relative decay.
const MODES = [[1, 1, 1], [1.0013, 0.2, 0.85], [2.76, 0.3, 0.3], [5.4, 0.11, 0.13], [8.93, 0.035, 0.06]];

function biq(type, f, q, gain = 0) {
  const b = ac.createBiquadFilter();
  b.type = type;
  b.frequency.value = f;
  b.Q.value = q;
  b.gain.value = gain;
  return b;
}
// The room impulse is noise that darkens as it fades.
function impulse(sec) {
  const sr = ac.sampleRate, n = Math.round(sr * sec), buf = ac.createBuffer(2, n, sr);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    let y = 0;
    for (let i = 0; i < n; i++) {
      const t = i / sr;
      y += lerp(0.6, 0.07, t / sec) * (Math.random() * 2 - 1 - y);
      d[i] = y * Math.exp(-t / 0.45) * Math.min(1, t / 0.006);
    }
  }
  return buf;
}
function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (err) { return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;
    out = ac.createGain();
    out.gain.value = 0.55;
    out.connect(comp);
    comp.connect(ac.destination);
    // One second of white noise feeds every burst.
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // A warm body shapes each note, then a small room follows.
    inst = ac.createGain();
    const lp = biq('lowpass', 9000, 0.5);
    inst.connect(biq('peaking', 420, 0.9, 3)).connect(biq('peaking', 1300, 1.3, 1.5))
      .connect(biq('highshelf', 5200, 0.7, -6)).connect(lp).connect(out);
    const pre = ac.createDelay(0.05), verb = ac.createConvolver(), wet = ac.createGain();
    pre.delayTime.value = 0.016;
    verb.buffer = impulse(2.4);
    wet.gain.value = 0.32;
    lp.connect(pre).connect(verb).connect(wet).connect(out);
    whir();
  }
  if (ac.state !== 'running') { askedAt = performance.now(); ac.resume()?.catch(() => {}); }
}
// A context still waking queues sounds for a moment.
function live() {
  if (!soundOn || !ac || ac.state === 'closed') return null;
  return ac.state === 'running' || performance.now() - askedAt < 250 ? ac : null;
}
// Once the roll settles, the context sleeps until the next gesture.
function rest() {
  clearTimeout(restT);
  if (whirG && ac.state === 'running') whirTo(0);
  if (!ac || ac.state !== 'running') return;
  restT = setTimeout(() => {
    if (raf || grab || voices > 0) return rest();
    if (ac.state === 'running') ac.suspend()?.catch(() => {});
  }, 1500);
}
const GESTURE_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter']);
function unlock(e) {
  if (!soundOn || (e.type === 'keydown' && !GESTURE_KEYS.has(e.key))) return;
  // A touch counts as a gesture only once the finger lifts.
  if (!ac && e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
  audio();
}
// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// A noise burst through one filter; it tidies itself up.
function burst(a, dst, t, type, f, q, g, tau, len) {
  const src = a.createBufferSource(), fl = a.createBiquadFilter(), ng = a.createGain();
  src.buffer = noise;
  fl.type = type;
  fl.frequency.value = f;
  fl.Q.value = q;
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(g, t + 0.0005);
  ng.gain.setTargetAtTime(0, t + 0.0005, tau);
  src.connect(fl).connect(ng).connect(dst);
  src.onended = () => ng.disconnect();
  src.start(t, Math.random() * 0.8, len);
}
function ping(a, t, f, g, tau) {
  const o = a.createOscillator(), og = a.createGain();
  o.frequency.value = f;
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(g, t + 0.0008);
  og.gain.setTargetAtTime(0, t + 0.001, tau);
  o.connect(og).connect(inst);
  o.onended = () => og.disconnect();
  o.start(t);
  o.stop(t + tau * 8 + 0.02);
}
// A tooth rings in a few inharmonic modes after a short pluck.
function pluck(i, t, v) {
  const a = live();
  if (!a) return;
  t = Math.max(t, a.currentTime);
  if (t - lastAt[i] < 0.03) return;
  lastAt[i] = t;
  hush(ringV[i], t);
  while (held.length >= MAXV) hush(held[0], t);
  const k = i / (N - 1), f0 = FREQ[i] * jit(0.002), tau = lerp(1.6, 0.6, k);
  const amp = 0.17 * v * level() * jit(0.06) * lerp(1, 0.72, k);
  const vg = a.createGain(), pan = a.createStereoPanner ? a.createStereoPanner() : null;
  if (pan) { pan.pan.value = lerp(-0.5, 0.5, k); vg.connect(pan).connect(inst); } else vg.connect(inst);

  for (const [r, l, dk] of MODES) {
    const f = f0 * r;
    if (f > 10500) continue;
    const o = a.createOscillator(), og = a.createGain(), d = tau * dk;
    o.frequency.value = f;
    og.gain.setValueAtTime(0, t);
    og.gain.linearRampToValueAtTime(amp * l * (r > 2 ? lerp(1, 0.55, k) : 1), t + (r > 2 ? 0.0007 : 0.0018));
    og.gain.setTargetAtTime(0, t + 0.002, d);
    o.connect(og).connect(vg);
    o.start(t);
    o.stop(t + d * 7 + 0.05);
    oscs.push(o);
  }
  burst(a, vg, t, 'bandpass', clamp(f0 * 3.3, 2200, 7500), 1.4, amp * 0.5, 0.0035, 0.03);
  const vc = { vg, oscs, hushed: false };
  ringV[i] = vc;
  held.push(vc);
  voices++;
  oscs[0].onended = () => {
    voices--;
    vg.disconnect();
    pan?.disconnect();
    const n = held.indexOf(vc);
    if (n >= 0) held.splice(n, 1);
    if (ringV[i] === vc) ringV[i] = null;
  };
}
// A re-plucked tooth stops its old ring first.
function hush(vc, t) {
  if (!vc || vc.hushed) return;
  vc.hushed = true;
  const n = held.indexOf(vc);
  if (n >= 0) held.splice(n, 1);
  vc.vg.gain.setValueAtTime(1, t);
  vc.vg.gain.setTargetAtTime(0, t, 0.012);
  for (const o of vc.oscs) try { o.stop(t + 0.1); } catch (err) { /* already stopping */ }

// The ratchet clicks as the spring winds.
function click(t, g = 1) {
  const a = live();
  if (!a) return;
  burst(a, inst, t, 'bandpass', 3000 * jit(0.1), 2, 0.12 * g * jit(0.08), 0.003, 0.02);
  ping(a, t, 2350 * jit(0.04), 0.018 * g, 0.012);
}
// A pin taps into the roll.
function tap(t, f, g) {
  const a = live();
  if (!a) return;
  burst(a, inst, t, 'highpass', 4200, 0.7, 0.05 * g * jit(0.08), 0.0018, 0.015);
  ping(a, t, f * jit(0.03), 0.022 * g, 0.016);
}
// The motor whirs while the roll turns.
function whir() {
  const src = ac.createBufferSource(), am = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
  src.buffer = noise;
  src.loop = true;
  am.gain.value = 0.55;
  lg.gain.value = 0.45;
  lfo.frequency.value = 8;
  lfo.connect(lg).connect(am.gain);
  whirG = ac.createGain();
  whirG.gain.value = 0;
  src.connect(biq('bandpass', 520, 0.8)).connect(am).connect(whirG).connect(out);
  src.start();
  lfo.start();
  whirF = lfo.frequency;
}
function whirTo(rps) {
  if (!whirG) return;
  const g = soundOn ? clamp(rps / 6) * 0.05 : 0;
  if (Math.abs(g - whirAt) < 0.002 && (g > 0 || whirAt === 0)) return;
  whirAt = g;
  const t = ac.currentTime;
  whirG.gain.setTargetAtTime(g, t, 0.08);
  whirF.setTargetAtTime(Math.max(1, rps * 2), t, 0.1);
}

/* ---------- palette: one rainbow, low tooth to high ---------- */
// Series hues run fire through to magenta, as on String harp.
const STOPS = [
  [0.6, 0.21, 28], [0.7, 0.19, 52], [0.8, 0.17, 84], [0.77, 0.16, 160],
  [0.69, 0.14, 206], [0.55, 0.18, 258], [0.51, 0.2, 292], [0.57, 0.22, 330],
];
// Catmull-Rom through the stops, clamped at both ends.
function hueAt(t) {
  const n = STOPS.length, k = Math.min(n - 2, Math.floor(t)), f = t - k;
  const Q = q => STOPS[clamp(k + q, 0, n - 1)];
  const a = Q(-1), b = Q(0), c = Q(1), d = Q(2), f2 = f * f, f3 = f2 * f;
  return [0, 1, 2].map(i => 0.5 * (2 * b[i] + (c[i] - a[i]) * f + (2 * a[i] - 5 * b[i] + 4 * c[i] - d[i]) * f2 + (3 * b[i] - a[i] - 3 * c[i] + d[i]) * f3));
}
const TONE = Array.from({ length: N }, (_, i) => {
  const [L, C, h] = hueAt((i / (N - 1)) * (STOPS.length - 1));
  return [Math.max(0.72, L + 0.06), Math.min(C, 0.19), h];
});
// One tooth's colour, nudged in lightness, chroma and hue.
const tc = (i, dL = 0, kC = 1, dh = 0, a = 1) => {
  const [L, C, h] = TONE[i];
  return ok(+clamp(L + dL).toFixed(3), +(C * kC).toFixed(3), +(h + dh).toFixed(1), a);
};

/* ---------- state: the roll, the spring, the bars ---------- */
let u = P - 0.5, vel = 0, mode = 'free', goal = 0, handU = 0, wind = 0, windVis = 0;
let tuneIx = 0, kc = 7, kbd = false, hover = null, dir = 1;
const pins = new Uint8Array(S * N), born = new Float32Array(S * N).fill(-9);
let ghosts = [];
const amp = new Float32Array(N), age = new Float32Array(N), glow = new Float32Array(N), bAge = new Float32Array(N).fill(9);
const press = new Float32Array(N), sway = new Float32Array(N), env = new Float32Array(N);
const clock = () => performance.now() / 1000;
const pinAt = (k, i) => pins[mod(k, S) * N + i];
// A rung bar swings this many times its pluck depth.
const SWAY = 2.2;

/* ---------- layout: every size in CSS pixels ---------- */
let G = null, W = 0, H = 0, dpr = 1, lowDpr = false;
function layout(w, h) {
  const g = { w, h, port: w / h < 1.2 };
  if (!g.port) {
    const cw = Math.min(w, h * 1.85), rw = 0.64 * cw;
    g.R = 0.19 * h;
    g.cy = 0.13 * h + g.R;
    g.kr = 0.085 * h;
    g.gap = 0.045 * h;
    g.bl = (w - (rw + g.gap + 2 * g.kr)) / 2;
    g.br = g.bl + rw;
    g.Lmax = 0.31 * h;
    g.Lmin = 0.18 * h;
  } else {
    g.R = 0.25 * w;
    g.cy = 0.07 * h + g.R;
    g.kr = 0.075 * w;
    g.gap = 0.035 * w;
    g.bl = 0.045 * w;
    g.br = w - 0.045 * w - 2 * g.kr - g.gap;
    g.Lmax = Math.min(0.44 * h, 0.9 * h - (g.cy + g.R * Math.sin(P * DPHI)));
    g.Lmin = 0.58 * g.Lmax;
  }
  g.u = g.R / 120;
  g.cwid = (g.br - g.bl) / (N + 0.9);
  g.x0 = g.bl + 0.45 * g.cwid;
  g.x1 = g.br - 0.45 * g.cwid;
  g.tw = (g.port ? 0.68 : 0.62) * g.cwid;
  g.rad = 0.26 * g.R;
  g.kx = g.br + g.gap + g.kr;
  g.ky = g.cy;
  g.yp = g.cy + g.R * Math.sin(P * DPHI);
  g.tip = g.yp - g.R * 0.02;

  g.pr = Math.max(3.5, 0.19 * g.cwid);

}
const colX = i => G.x0 + (i + 0.5) * G.cwid;
const rootY = i => G.tip + lerp(G.Lmax, G.Lmin, i / (N - 1));

/* ---------- sprites: painted once per size ---------- */
let bg = null, knobSpr = null, haloW = null, ringFill = null;
const barSpr = [], pinSpr = [], haloSpr = [], glowSpr = [], bloomSpr = [], trackSpr = [];
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);

  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);

const rollPath = g => { g.beginPath(); rr(g, G.bl, G.cy - G.R, G.br - G.bl, 2 * G.R, G.rad); };
// A soft round light, solid at the centre.
function radial(size, stops) {
  const c = mk(size, size), g = c.getContext('2d'), r = size / 2, gr = g.createRadialGradient(r, r, 0, r, r, r);
  for (const [o, col] of stops) gr.addColorStop(o, col);

}
// A bar takes light from the upper left, so shading runs across it.
function paintBar(i) {
  const hw = G.tw / 2, L = rootY(i) - G.tip, m = 3;
  const c = mk((2 * hw + 2 * m) * dpr, (L + 2 * m) * dpr), g = c.getContext('2d');
  g.scale(dpr, dpr);
  g.translate(m + hw, m);
  const p = new Path2D();
  rr(p, -hw, 0, 2 * hw, L, hw);
  let gr = g.createLinearGradient(-hw, 0, hw, 0);
  gr.addColorStop(0, tc(i, 0.08, 0.85, -10));
  gr.addColorStop(0.55, tc(i));
  gr.addColorStop(1, tc(i, -0.17, 1.05, 14));
  g.fillStyle = gr;
  g.fill(p);
  g.save();
  g.clip(p);
  // The tip catches the light; the root falls into shade.
  gr = g.createLinearGradient(0, 0, 0, L);
  gr.addColorStop(0, 'rgba(255,255,255,0.3)');
  gr.addColorStop(0.16, 'rgba(255,255,255,0)');
  gr.addColorStop(0.62, 'rgba(12,4,40,0)');
  gr.addColorStop(1, 'rgba(12,4,40,0.36)');
  g.fillStyle = gr;
  g.fillRect(-hw, 0, 2 * hw, L);

  const sw = Math.max(1.2, hw * 0.3);
  gr = g.createLinearGradient(0, 0, 0, L);
  gr.addColorStop(0, 'rgba(255,255,255,0.75)');
  gr.addColorStop(0.45, 'rgba(255,255,255,0.22)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');

}
function paintSprites() {

    const ps = 48, pc = mk(ps, ps), g = pc.getContext('2d');
    let gr = g.createRadialGradient(ps * 0.4, ps * 0.36, 0, ps / 2, ps / 2, ps / 2 - 1);
    gr.addColorStop(0, ok(0.99, 0.03, TONE[i][2]));
    gr.addColorStop(0.4, tc(i, 0.1, 0.9));
    gr.addColorStop(0.92, tc(i, -0.04, 1.05));
    gr.addColorStop(1, tc(i, -0.04, 1.05, 0, 0));
    g.fillStyle = gr;
    g.beginPath();
    g.arc(ps / 2, ps / 2, ps / 2 - 1, 0, TAU);
    g.fill();
    pinSpr.push(pc);
    haloSpr.push(radial(64, [[0, tc(i, 0.05, 1, 0, 0.7)], [0.3, tc(i, 0, 1, 0, 0.22)], [1, tc(i, 0, 1, 0, 0)]]));
    bloomSpr.push(radial(128, [[0, tc(i, 0.06, 1, 0, 0.6)], [0.22, tc(i, 0, 1, 0, 0.3)], [0.55, tc(i, -0.05, 1, 0, 0.08)], [1, tc(i, 0, 1, 0, 0)]]));
    // Each bar glows in its own hue while it rings.
    const gc = mk(64, 160);
    const gg = gc.getContext('2d');
    gg.translate(32, 80);
    gg.scale(1, 2.5);
    gr = gg.createRadialGradient(0, 0, 0, 0, 0, 32);
    gr.addColorStop(0, tc(i, 0.12, 0.8, 0, 0.9));
    gr.addColorStop(0.3, tc(i, 0.02, 1, 0, 0.45));
    gr.addColorStop(1, tc(i, -0.1, 1, 0, 0));
    gg.fillStyle = gr;
    gg.beginPath();
    gg.arc(0, 0, 32, 0, TAU);
    gg.fill();

    const tcv = mk(32, 256), tg = tcv.getContext('2d');
    gr = tg.createLinearGradient(0, 0, 32, 0);
    gr.addColorStop(0, tc(i, 0, 1, 0, 0));
    gr.addColorStop(0.5, tc(i, 0.05, 1, 0, 1));
    gr.addColorStop(1, tc(i, 0, 1, 0, 0));
    tg.fillStyle = gr;
    tg.fillRect(0, 0, 32, 256);
    tg.globalCompositeOperation = 'destination-in';
    gr = tg.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, 'rgba(0,0,0,0.1)');
    gr.addColorStop(0.55, 'rgba(0,0,0,0.55)');
    gr.addColorStop(0.92, 'rgba(0,0,0,1)');
    gr.addColorStop(1, 'rgba(0,0,0,0.5)');

    tg.fillRect(0, 0, 32, 256);

  const ks = 64;

  const gr = g.createRadialGradient(ks * 0.38, ks * 0.34, 0, ks / 2, ks / 2, ks / 2 - 1);
  gr.addColorStop(0, ok(0.995, 0.01, 250));
  gr.addColorStop(0.5, ok(0.9, 0.035, 285));
  gr.addColorStop(0.94, ok(0.7, 0.06, 290));
  gr.addColorStop(1, ok(0.7, 0.06, 290, 0));

  g.beginPath();
  g.arc(ks / 2, ks / 2, ks / 2 - 1, 0, TAU);
  g.fill();

// The stage, the roll body and the handle never move.

  gr.addColorStop(0.55, ok(0.195, 0.022, 268));

  gr.addColorStop(0.36, ok(0.31, 0.05, 282));
  gr.addColorStop(0.62, ok(0.22, 0.045, 280));
  gr.addColorStop(0.88, ok(0.15, 0.035, 278));
  gr.addColorStop(1, ok(0.1, 0.025, 276));

/* ---------- drawing, every frame ---------- */
function draw(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(bg, 0, 0, W, H);
  drawRoll(now);
  drawBloom();
  drawBars();
  drawGlow();
  drawHandle();
}
const backOut = t => { const s = 2.2; t -= 1; return 1 + t * t * ((s + 1) * t + s); };
function drawRoll(now) {
  const { bl, br, cy, R, cwid, pr } = G;
  ctx.save();
  rollPath(ctx);
  ctx.clip();
  // A ringing tooth lights its whole track.
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < N; i++) {
    if (glow[i] <= 0.02) continue;
    ctx.globalAlpha = Math.min(1, glow[i]) * 0.6;
    ctx.drawImage(trackSpr[i], colX(i) - cwid * 0.8, cy - R, cwid * 1.6, 2 * R);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  // Step lines turn with the roll; every eighth is a bar line.
  for (let k = 0; k < S; k++) {
    const th = (u - k) * DPHI, c = Math.cos(th);
    if (c <= 0.06) continue;
    const y = cy + R * Math.sin(th);
    ctx.fillStyle = `rgba(225,220,255,${((k % 8 ? 0.05 : 0.15) * c).toFixed(3)})`;
    ctx.fillRect(bl + cwid * 0.25, y - 0.5, br - bl - cwid * 0.5, k % 8 ? 1 : 1.5);
  }
  if (kbd) {
    ctx.fillStyle = ok(0.84, 0.13, 205, 0.12);
    ctx.fillRect(colX(kc) - cwid / 2, cy - R, cwid, 2 * R);
  }
  const drawPin = (k, i, s, alpha) => {
    const th = (u - k) * DPHI, c = Math.cos(th);
    if (c <= 0.03 || s <= 0) return;
    const x = colX(i), y = cy + R * Math.sin(th), sq = Math.max(0.3, c), a = alpha * sstep(0.03, 0.45, c);
    const r = pr * s, hr = r * 3.2;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a * 0.85;
    ctx.drawImage(haloSpr[i], x - hr, y - hr * sq, 2 * hr, 2 * hr * sq);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = a;
    ctx.drawImage(pinSpr[i], x - r, y - r * sq, 2 * r, 2 * r * sq);
    ctx.globalAlpha = 1;
  };
  for (let k = 0; k < S; k++) {
    for (let i = 0; i < N; i++) {
      const ix = k * N + i;
      if (!pins[ix]) continue;
      const t = now - born[ix];
      drawPin(k, i, reduce || t > 0.3 ? 1 : t < 0 ? 0 : backOut(t / 0.3), 1);
    }
  }
  for (const gh of ghosts) {
    const t = (now - gh.t) / 0.22;
    if (t < 0) drawPin(gh.k, gh.i, 1, 1);
    else if (t < 1) drawPin(gh.k, gh.i, 1 + t * 0.8, 1 - t);
  }
  // Hover shows where a click lands.
  if (hover && !grab) {
    const th = (u - hover.k) * DPHI, x = colX(hover.i), y = cy + R * Math.sin(th), has = pinAt(hover.k, hover.i);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = tc(hover.i, 0.12, 0.8, 0, has ? 0.95 : 0.7);
    ctx.beginPath();
    ctx.arc(x, y, pr * 2, 0, TAU);
    ctx.stroke();
    if (!has) {
      ctx.globalAlpha = 0.5;
      ctx.drawImage(pinSpr[hover.i], x - pr, y - pr, 2 * pr, 2 * pr);
      ctx.globalAlpha = 1;
    }
  }
  if (kbd) {
    const k = mod(Math.round(u), S), th = (u - k) * DPHI, y = cy + R * Math.sin(th);
    ctx.lineWidth = 2;
    ctx.strokeStyle = ok(0.84, 0.13, 205, 0.95);
    ctx.beginPath();
    ctx.arc(colX(kc), y, pr * 2.2, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
}
// Each note blooms from the bar's tip and spreads.
function drawBloom() {
  const cw = G.cwid;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < N; i++) {
    if (glow[i] <= 0.02) continue;
    const gl = Math.min(1, glow[i]), grow = reduce ? 1.3 : 1 + 0.8 * (1 - Math.exp(-bAge[i] / 0.22));
    const r = cw * 2.3 * grow, x = colX(i), y = G.tip + cw * 0.2;
    ctx.globalAlpha = gl * 0.8;
    ctx.drawImage(bloomSpr[i], x - r, y - r, 2 * r, 2 * r);
    // The pool under the root brightens too.
    const px = cw * 1.5 * grow, py = cw * 0.5 * grow, ry = rootY(i) + cw * 0.15;
    ctx.globalAlpha = gl * 0.7;
    ctx.drawImage(bloomSpr[i], x - px, ry - py, 2 * px, 2 * py);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}
// A bar bends about its root; the tip carries the swing.
function blitBar(b, x, root, L, d) {
  const s = L / b.L;
  ctx.setTransform(dpr, 0, 0, dpr, x * dpr, root * dpr);
  ctx.transform(1, 0, -d / L, 1, 0, 0);
  ctx.drawImage(b.c, -b.hw - b.m, -(b.L + b.m) * s, 2 * (b.hw + b.m), (b.L + 2 * b.m) * s);
}
function drawBars() {
  for (let i = 0; i < N; i++) {
    const b = barSpr[i], x = colX(i), root = rootY(i), L = root - G.tip - press[i] * 0.8;
    // A fast swing leaves a faint trail at both extremes.
    if (env[i] > 0.6) {
      ctx.globalAlpha = 0.24;
      blitBar(b, x, root, L, env[i]);
      blitBar(b, x, root, L, -env[i]);
    }
    ctx.globalAlpha = 1;
    blitBar(b, x, root, L, sway[i]);
    const lit = Math.min(1, glow[i]) * 0.45 + (press[i] / G.push) * 0.15;
    if (lit > 0.01) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = lit;
      blitBar(b, x, root, L, sway[i]);
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function drawGlow() {
  ctx.globalCompositeOperation = 'lighter';
  const gw = G.cwid * 2.4;
  for (let i = 0; i < N; i++) {
    if (glow[i] <= 0.02) continue;
    const gh = (rootY(i) - G.tip) * 1.3;
    ctx.globalAlpha = Math.min(1, glow[i]) * 0.7;
    ctx.drawImage(glowSpr[i], colX(i) + sway[i] * 0.5 - gw / 2, G.tip - gh * 0.2, gw, gh);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}
// The handle turns with the roll; its ring shows the spring.
function drawHandle() {
  const { kx, ky, kr } = G, a = (u * TAU) / CRANK;
  if (windVis > 0.002) {
    const a0 = -Math.PI / 2, a1 = a0 + windVis * TAU, rw = kr * 0.8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = ringFill;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.28;
    ctx.lineWidth = kr * 0.3;
    ctx.beginPath();
    ctx.arc(kx, ky, rw, a0, a1);
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.lineWidth = kr * 0.11;
    ctx.beginPath();
    ctx.arc(kx, ky, rw, a0, a1);
    ctx.stroke();
    ctx.lineCap = 'butt';
  }
  const nx = kx + Math.cos(a) * kr * 0.5, ny = ky + Math.sin(a) * kr * 0.5, nr = kr * 0.21, hr = nr * 2.8;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.8;
  ctx.drawImage(haloW, nx - hr, ny - hr, 2 * hr, 2 * hr);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.drawImage(knobSpr, nx - nr, ny - nr, 2 * nr, 2 * nr);
}

/* ---------- physics: the roll, the motor, the bars ---------- */
function stepDrum(dt) {
  if (mode === 'hand') {
    u = handU;
  } else if (mode === 'goal') {
    const k = 320, c = 2 * Math.sqrt(k);
    vel += (k * (goal - u) - c * vel) * dt;
    u += vel * dt;
    if (Math.abs(goal - u) < 0.003 && Math.abs(vel) < 0.08) { u = goal; vel = 0; mode = 'free'; }
  } else {
    if (wind > 0) {
      // The motor holds the tempo until the spring runs low.
      const target = BASE * Math.min(1, Math.sqrt(wind / 0.12));
      vel += (target - vel) * (1 - Math.exp(-dt / (vel > target ? 0.35 : 0.5)));
      const used = (Math.max(0, Math.min(vel, target)) * dt) / CAP;
      wind = Math.max(0, wind - used);
      if (wind < 1e-4) wind = 0;
    } else {
      vel *= Math.exp(-dt / (reduce ? 0.25 : 0.5));
      if (Math.abs(vel) < 0.05) vel = 0;
    }
    u += vel * dt;
  }
}
// A pin plucks when u passes P plus a whole step.
function crossings(u0, u1, dt) {
  if (u1 === u0) return;
  const fwd = u1 > u0;
  dir = fwd ? 1 : -1;
  let ja = fwd ? Math.floor(u0 - P) + 1 : Math.ceil(u1 - P), jb = fwd ? Math.floor(u1 - P) : Math.ceil(u0 - P) - 1;
  if (jb - ja > S) ja = jb - S;
  const a = live(), t0 = a ? a.currentTime + LEAD : 0;
  for (let j = ja; j <= jb; j++) {
    const f = clamp((P + j - u0) / (u1 - u0)), k = mod(j, S);
    for (let i = 0; i < N; i++) {
      if (!pins[k * N + i]) continue;
      if (a) pluck(i, t0 + f * dt, fwd ? jit(0.05) * 0.95 : 0.7);
      ring(i, 1);
    }
  }
}
function ring(i, v) {
  amp[i] = G.push * v;
  age[i] = 0;
  bAge[i] = 0;
  glow[i] = Math.min(1.2, glow[i] * 0.4 + v);
}
// A pin presses each bar's tip, then the bar rings and settles.
function stepTeeth(dt) {
  let busy = false;
  const q = u - P, d = dir > 0 ? Math.floor(q) + 1 - q : q - (Math.ceil(q) - 1), k = mod(dir > 0 ? Math.floor(q) + 1 : Math.ceil(q) - 1, S);
  const near = d < 0.45 ? 1 - d / 0.45 : 0;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1), tv = lerp(0.7, 0.35, t), tg = lerp(1.2, 0.55, t) * (reduce ? 0.6 : 1);
    let z = near && pins[k * N + i] ? G.push * near * near : 0, e2 = 0, s = 0;
    if (amp[i] > 0) {
      age[i] += dt;
      const e = Math.exp(-age[i] / tv);
      if (amp[i] * e < 0.05) amp[i] = 0;
      else {
        if (reduce) z += amp[i] * e * 0.3;
        else {
          e2 = amp[i] * e * SWAY;
          s = e2 * Math.cos(TAU * lerp(19, 27, t) * age[i]);
        }
        busy = true;
      }
    }
    if (glow[i] > 0) {
      bAge[i] += dt;
      glow[i] *= Math.exp(-dt / tg);
      if (glow[i] < 0.02) glow[i] = 0;
      else busy = true;
    }
    press[i] = z;
    env[i] = e2;
    sway[i] = s;
  }
  return busy;
}

/* ---------- one loop, only while something moves ---------- */
let raf = 0, last = 0, onScreen = true, ready = false, slow = 0, frames = 0;
function wake() {
  if (!raf && ready && onScreen && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(ms) {
  raf = 0;
  const raw = Math.max(0, (ms - last) / 1000), dt = Math.min(raw, 1 / 20), now = ms / 1000;
  last = ms;
  // Sustained slow frames drop the pixel ratio to 1.
  if (!lowDpr && ++frames > 20) {
    slow = raw > 0.03 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 24) { lowDpr = true; fit(); }
  }
  const u0 = u;
  stepDrum(dt);
  crossings(u0, u, dt);
  const ringing = stepTeeth(dt);
  windVis += (wind - windVis) * (1 - Math.exp(-dt / (reduce ? 0.04 : 0.12)));
  if (Math.abs(wind - windVis) < 1e-4) windVis = wind;
  ghosts = ghosts.filter(g => now - g.t < 0.25);
  const popping = ghosts.length > 0 || now - lastBorn < 0.35;
  const moving = mode !== 'free' || vel !== 0 || wind > 0 || windVis !== wind;
  draw(now);
  if (frames === 2) cv.classList.add('on');
  if (ac && ac.state === 'running') whirTo(Math.abs(vel * DPHI * WHIR) / TAU);
  if ((moving || ringing || popping || grab) && onScreen && !document.hidden) raf = requestAnimationFrame(frame);
  else rest();
}

/* ---------- actions ---------- */
let lastBorn = -9;
function togglePin(i, k) {
  const ix = k * N + i, now = clock();
  const a = live();
  if (pins[ix]) {
    pins[ix] = 0;
    ghosts.push({ i, k, t: now });
    if (a) tap(a.currentTime + LEAD, 2600, 0.7);
  } else {
    pins[ix] = 1;
    born[ix] = now;
    lastBorn = now;
    if (a) {
      tap(a.currentTime + LEAD, 3900, 1);
      pluck(i, a.currentTime + LEAD + 0.03, 0.5);
    }
    ring(i, 0.45);
  }
  wake();
}
function clearPins(now) {
  let n = 0;
  for (let k = 0; k < S; k++) {
    for (let i = 0; i < N; i++) {
      if (!pins[k * N + i]) continue;
      pins[k * N + i] = 0;
      // Pins nearest the front leave first.
      const th = mod((u - k) * DPHI + Math.PI, TAU) - Math.PI;
      ghosts.push({ i, k, t: now + (reduce ? 0 : Math.abs(th) * 0.12 + i * 0.004) });
      n++;
    }
  }
  return n;
}
function loadTune(ix) {
  const now = clock(), a = live();
  clearPins(now);
  for (const [k, ...teeth] of TUNES[ix]) {
    for (const i of teeth) {
      const j = k * N + i, th = mod((u - k) * DPHI + Math.PI, TAU) - Math.PI;
      pins[j] = 1;
      born[j] = now + (reduce ? 0 : 0.18 + Math.abs(th) * 0.16 + i * 0.006);
      lastBorn = Math.max(lastBorn, born[j]);
    }
  }
  if (a) for (let k = 0; k < 7; k++) tap(a.currentTime + LEAD + 0.2 + k * 0.07, 3600 - k * 120, 0.55 - k * 0.05);
  wake();
}
function windUp(dw, clicks = true) {
  const add = Math.min(1 - wind, dw);
  if (add <= 0.001) return;
  wind += add;
  const a = live();
  if (a && clicks) {
    const n = clamp(Math.round(add * 22), 1, 10);
    const t = Math.max(a.currentTime + LEAD, clickAt);
    for (let k = 0; k < n; k++) click(t + k * 0.032, 0.8 + 0.2 * Math.random());
    clickAt = t + n * 0.032;
  }
  wake();
}
function stepBy(d) {
  if (mode !== 'goal') { goal = Math.round(u); vel = mode === 'hand' ? 0 : vel; }
  goal += d;
  mode = 'goal';
  wake();
}

/* ---------- input ---------- */
let rect = null, grab = null;
addEventListener('scroll', () => { rect = null; }, { passive: true });
function local(e) {
  const r = rect || (rect = panel.getBoundingClientRect());
  return [((e.clientX - r.left) / r.width) * W, ((e.clientY - r.top) / r.height) * H];
}
function cellAt(x, y) {
  if (x < G.bl || x >= G.br) return null;
  const s = (y - G.cy) / G.R;
  if (Math.abs(s) > 0.93) return null;
  const i = clamp(Math.floor((x - G.x0) / G.cwid), 0, N - 1), k = mod(Math.round(u - Math.asin(s) / DPHI), S);
  return { i, k };
}
const onCrank = (x, y) => Math.hypot(x - G.kx, y - G.ky) < G.kr + Math.max(8, 10 * G.u);
const onDrum = (x, y) => x > G.bl && x < G.br && Math.abs(y - G.cy) < G.R;
function cursorFor(x, y) {
  panel.style.cursor = grab ? 'grabbing' : onCrank(x, y) ? 'grab' : onDrum(x, y) ? 'pointer' : '';
}
function sample(t) {
  grab.hist.push(t, handU);
  while (grab.hist.length > 4 && t - grab.hist[0] > 110) grab.hist.splice(0, 2);
}
panel.addEventListener('pointerdown', e => {
  if (!ready || grab || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const [x, y] = local(e);
  const kind = onCrank(x, y) ? 'crank' : onDrum(x, y) ? 'drum' : null;
  if (!kind) return;
  kbd = false;
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  grab = { id: e.pointerId, kind, sx: x, sy: y, ly: y, moved: false, cell: kind === 'drum' ? cellAt(x, y) : null, hist: [] };
  grab.a = Math.atan2(y - G.ky, x - G.kx);
  // A hand on the roll or the handle holds it still.
  handU = u;
  mode = 'hand';
  vel = 0;
  sample(e.timeStamp);
  hover = null;
  cursorFor(x, y);
  wake();
});
panel.addEventListener('pointermove', e => {
  if (!grab) {
    if (e.pointerType !== 'mouse' || !ready) return;
    const [x, y] = local(e), c = onDrum(x, y) ? cellAt(x, y) : null;
    cursorFor(x, y);
    if ((c && hover && c.i === hover.i && c.k === hover.k) || (!c && !hover)) return;
    hover = c;
    wake();
    return;
  }
  if (e.pointerId !== grab.id) return;
  const list = e.getCoalescedEvents?.() || [];
  for (const ev of list.length ? list : [e]) {
    const [x, y] = local(ev);
    if (grab.kind === 'drum') {
      if (!grab.moved && Math.hypot(x - grab.sx, y - grab.sy) > 6) { grab.moved = true; grab.ly = y; }
      if (grab.moved) {
        const s = clamp((y - G.cy) / G.R, -0.95, 0.95), c = Math.max(0.45, Math.sqrt(1 - s * s));
        handU += (y - grab.ly) / (G.R * c * DPHI);
        grab.ly = y;
      }
    } else {
      const r = Math.hypot(x - G.kx, y - G.ky), a = Math.atan2(y - G.ky, x - G.kx);
      let da = a - grab.a;
      da = mod(da + Math.PI, TAU) - Math.PI;
      grab.a = a;
      if (r < 6 * G.u) continue;
      grab.moved = true;
      handU += (da / TAU) * CRANK;
    }
    sample(ev.timeStamp);
  }
  wake();
});
function release(e) {
  if (!grab || e.pointerId !== grab.id) return;
  const g = grab;
  grab = null;
  if (g.kind === 'drum' && !g.moved && g.cell && e.type === 'pointerup') togglePin(g.cell.i, g.cell.k);
  // The last tenth of a second of the drag sets the speed.
  let v = 0;
  const hs = g.hist, n = hs.length;
  if (n >= 4 && e.timeStamp - hs[n - 2] < 70) {
    const span = (hs[n - 2] - hs[0]) / 1000;
    if (span > 0.012) v = (hs[n - 1] - hs[1]) / span;
  }
  v = clamp(v, -60, 60);
  mode = 'free';
  vel = g.moved ? v : 0;
  if (v > FLICK) windUp(clamp((v - 4) / 40, 0.1, 1));
  const [x, y] = local(e);
  cursorFor(x, y);
  wake();
}
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => panel.addEventListener(t, release));
panel.addEventListener('pointerleave', () => { if (hover) { hover = null; wake(); } });
panel.addEventListener('contextmenu', e => e.preventDefault());
// The keyboard cursor shows only for keyboard use.
panel.addEventListener('blur', () => { if (kbd) { kbd = false; wake(); } });
let spaceAt = 0;
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const k = e.key;
  if (k === ' ') {
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (!ready) return;
    const t = performance.now();
    if (e.repeat && t - spaceAt < 110) return;
    spaceAt = t;
    windUp(e.repeat ? 0.06 : 0.22);
  } else if (k === 'ArrowUp' || k === 'ArrowDown') {
    e.preventDefault();
    if (!ready) return;
    kbd = true;
    stepBy(k === 'ArrowDown' ? 1 : -1);
  } else if (k === 'ArrowLeft' || k === 'ArrowRight') {
    e.preventDefault();
    if (!ready) return;
    kbd = true;
    kc = clamp(kc + (k === 'ArrowRight' ? 1 : -1), 0, N - 1);
    wake();
  } else if (k === 'Enter') {
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (!ready || e.repeat) return;
    kbd = true;
    togglePin(kc, mod(Math.round(u), S));
  }
});
const clearB = document.getElementById('clear'), tuneB = document.getElementById('tune');
clearB.addEventListener('click', () => {
  if (!ready) return;
  const now = clock(), a = live();
  if (clearPins(now) && a) for (let k = 0; k < 6; k++) tap(a.currentTime + LEAD + k * 0.05, 2800 - k * 160, 0.5 - k * 0.06);
  wake();
});
tuneB.addEventListener('click', () => {
  if (!ready) return;
  tuneIx = 1 - tuneIx;
  loadTune(tuneIx);
});
const sndB = document.getElementById('snd');
const showSound = () => sndB.setAttribute('aria-pressed', String(soundOn));
showSound();
sndB.addEventListener('click', () => {
  soundOn = !soundOn;
  showSound();
  try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (err) { /* storage is optional */ }
  if (soundOn) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});

/* ---------- size: canvas pixels follow the stage ---------- */
function fit() {
  const r = panel.getBoundingClientRect();
  rect = null;
  if (r.width < 2 || r.height < 2) return;
  W = r.width;
  H = r.height;
  dpr = Math.min(devicePixelRatio || 1, lowDpr ? 1 : 2, Math.sqrt(1.4e6 / (W * H)));
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  G = layout(W, H);
  paintSprites();
  paintBg();
  if (ready) draw(clock());
  wake();
}
let fitT = 0;
function refit() {
  clearTimeout(fitT);
  fitT = setTimeout(fit, 60);
}
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(panel);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return wake();
  cancelAnimationFrame(raf);
  raf = 0;
  rest();
});

async function boot() {
  if (!ctx) {
    panel.querySelector('.fail').hidden = false;
    clearB.disabled = tuneB.disabled = true;
    return;
  }
  await idle();
  for (const [k, ...teeth] of TUNES[0]) for (const i of teeth) pins[k * N + i] = 1;
  fit();
  ready = true;
  draw(clock());
  cv.classList.add('on');
  new ResizeObserver(refit).observe(panel);
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
