<style>
/* Layout: header row, the box at full width, one chip row. */
:root {
  --bg: oklch(0.16 0.012 275);
  --surface: oklch(0.195 0.014 275);
  --line: oklch(0.29 0.016 275);
  --fg: oklch(0.94 0.008 275);
  --muted: oklch(0.64 0.02 275);
  --focus: oklch(0.84 0.13 205);

}

  border-radius: 18px; overflow: hidden; background: var(--wood);

<div class="wrap">
  <header>

    <div class="tools">

  <main>

      <canvas aria-hidden="true"></canvas>

    </div>
    <div class="foot">

        <div class="fine"><dt><kbd>Space</kbd></dt><dd>wind</dd></div>

const SEMI = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23, 24];

    [8, 5, 12], [10, 2, 14], [12, 0, 13], [13, 12], [14, 2, 11],
    [16, 3, 10], [18, 5, 12], [20, 4, 11], [22, 6, 9], [23, 8],
    [24, 0, 7], [26, 4, 9], [28, 2, 11], [30, 4, 14]],
  [[0, 5, 14], [3, 0, 13], [6, 2, 12], [7, 11],
    [8, 3, 12], [11, 0, 10], [13, 11], [14, 5, 12],
    [16, 0, 11], [19, 4, 9], [22, 2, 7], [23, 8],
    [24, 4, 9], [27, 1, 8], [28, 11], [30, 6, 13]],

/* ---------- sound: synthesised, started by the first gesture ---------- */
const SKEY = 'stimming.musicbox.sound', MAXV = 14, LEAD = 0.006;
let soundOn = true;
try { soundOn = localStorage.getItem(SKEY) !== '0'; } catch (err) { /* storage is optional */ }
let ac = null, out = null, inst = null, noise = null, askedAt = -1e9, voices = 0, restT = 0;
let whirG = null, whirF = null, whirAt = 0, clickAt = 0, tickAt = 0;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.05 * voices);
const held = [], ringV = new Array(N).fill(null), lastAt = new Float64Array(N).fill(-1);
// Each mode: frequency ratio, level, decay as a share of the fundamental's.
const MODES = [[1, 1, 1], [1.0013, 0.2, 0.85], [2.76, 0.3, 0.3], [5.4, 0.11, 0.13], [8.93, 0.035, 0.06]];

  b.frequency.value = f;
  b.Q.value = q;

// A dark, short room: noise that loses its top end as it fades.

// Once the box settles, the context sleeps until the next gesture.

/* ---------- drawing, every frame ---------- */
function draw(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(bg, 0, 0, W, H);
  drawWheels();
  drawDrum(now);
  drawTeeth();
  ctx.drawImage(combSpr.c, combSpr.x, combSpr.y, combSpr.w, combSpr.h);
  drawGlow();
  drawBarrel();
  drawFan();
  drawCrank();

// Edge-on gears: the great wheel on the left, a pinion on the right.

    const lg = ctx.createLinearGradient(0, G.cy - rad, 0, G.cy + rad);
    lg.addColorStop(0, ok(0.35, 0.07, 64));
    lg.addColorStop(0.3, ok(0.86, 0.1, 88));
    lg.addColorStop(0.62, ok(0.66, 0.11, 80));
    lg.addColorStop(1, ok(0.3, 0.06, 60));

    ctx.fillRect(x, G.cy - rad, wid, 2 * rad);
    ctx.fillStyle = 'rgba(40,18,0,0.55)';

    const th = (u - k) * DPHI, c = Math.cos(th);
    if (c <= 0.06) continue;

    ctx.fillRect(x0 + 3, y - 0.5, x1 - x0 - 6, 1);
    if (k % 8 === 0) {
      ctx.fillStyle = `rgba(70,38,4,${(0.22 * c).toFixed(3)})`;
      ctx.fillRect(x0 + 3, y + 0.5, x1 - x0 - 6, 1);
    }
  }
  // Keyboard cursor: the picked track and the front cell.
  if (kbd) {
    const x = colX(kc);
    ctx.fillStyle = ok(0.84, 0.13, 205, 0.16);
    ctx.fillRect(x - G.cwid / 2, cy - R, G.cwid, 2 * R);

  const pr = Math.max(2.2, 4.2 * u2), ph = R * 0.07;

    ctx.fill();

      ctx.lineTo(x, yt);

    }
  }
  for (const gh of ghosts) {
    const t = (now - gh.t) / 0.22;
    if (t < 0) drawPin(gh.k, gh.i, 1, 1);
    else if (t < 1) drawPin(gh.k, gh.i, 1 + t * 0.3, 1 - t);

  if (hover && !grab) {
    const th = (u - hover.k) * DPHI, x = colX(hover.i), y = cy + (R + ph) * Math.sin(th);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = pinAt(hover.k, hover.i) ? 'rgba(255,240,230,0.85)' : 'rgba(255,250,240,0.6)';
    ctx.beginPath();
    ctx.arc(x, y, pr * 1.9, 0, TAU);
    ctx.stroke();
    if (!pinAt(hover.k, hover.i)) {
      ctx.globalAlpha = 0.5;
      ctx.drawImage(pinSpr, x - pr, y - pr, 2 * pr, 2 * pr);
      ctx.globalAlpha = 1;
    }

    lg.addColorStop(0.75, ok(0.66, 0.04, 255));
    lg.addColorStop(1, ok(0.36, 0.05, 260));

    vg.addColorStop(0, ok(0.7, 0.1, 290, 0));
    vg.addColorStop(1, ok(0.5, 0.14, 290, 0.45));
    ctx.fillStyle = vg;
    ctx.fill();
    if (glow[i] > 0.02) {
      ctx.fillStyle = ok(0.82, 0.15, HUE[i], glow[i] * 0.4);

  ctx.moveTo(rb * 0.31, -rb * 0.04);
  ctx.lineTo(rb * 0.62, -rb * 0.07);
  ctx.lineTo(rb * 0.62, rb * 0.07);
  ctx.lineTo(rb * 0.31, rb * 0.02);
  ctx.closePath();
  ctx.fillStyle = ok(0.82, 0.03, 245);
  ctx.fill();
  ctx.restore();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.35;
  ctx.drawImage(sheenSpr, -rb * 0.9, -rb * 0.95, rb * 1.1, rb * 1.1);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}
function drawFan() {
  const { fx, fy, fr } = G, fs = fr * 2.2, a = u * DPHI * FANR, w = Math.abs(vel * DPHI * FANR);
  const blur = reduce ? 0 : clamp((w - 6) / 30);
  ctx.save();
  ctx.translate(fx, fy);
  if (blur > 0) {
    const gr = ctx.createRadialGradient(0, 0, fr * 0.15, 0, 0, fr);
    gr.addColorStop(0, ok(0.8, 0.09, 85, 0.35 * blur));
    gr.addColorStop(0.85, ok(0.75, 0.1, 82, 0.22 * blur));
    gr.addColorStop(1, ok(0.75, 0.1, 82, 0));
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(0, 0, fr, 0, TAU);
    ctx.fill();
  }
  ctx.rotate(a);
  ctx.globalAlpha = 0.35;
  ctx.drawImage(bladeSpr, -fs / 2 + 3 * G.u, -fs / 2 + 5 * G.u, fs, fs);
  ctx.globalAlpha = 1 - 0.6 * blur;
  ctx.drawImage(bladeSpr, -fs / 2, -fs / 2, fs, fs);
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.beginPath();
  ctx.arc(fx, fy, fr * 0.12, 0, TAU);
  ctx.fillStyle = brassRadialAt(ctx, fx, fy, fr * 0.12);
  ctx.fill();
}
function drawCrank() {
  const { kx, ky, kr, arm, knob } = G, u2 = G.u, cs = kr * 2.3, a = u * TAU / CRANK;
  ctx.save();
  ctx.translate(kx, ky);
  ctx.save();
  ctx.rotate(a);
  ctx.drawImage(crownSpr, -cs / 2, -cs / 2, cs, cs);
  ctx.restore();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.3;
  ctx.drawImage(sheenSpr, -kr * 0.95, -kr * 0.95, kr * 1.2, kr * 1.2);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  const ex = Math.cos(a) * arm, ey = Math.sin(a) * arm, aw = Math.max(5, 9 * u2);
  // Arm and knob cast shadows on the velvet.
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(15,0,5,0.38)';
  ctx.lineWidth = aw;
  ctx.beginPath();
  ctx.moveTo(6 * u2, 9 * u2);
  ctx.lineTo(ex + 9 * u2, ey + 13 * u2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(15,0,5,0.38)';
  ctx.beginPath();
  ctx.arc(ex + 14 * u2, ey + 19 * u2, knob * 1.05, 0, TAU);
  ctx.fill();
  const nx = -Math.sin(a), ny = Math.cos(a);
  const lg = ctx.createLinearGradient(nx * aw * 0.5, ny * aw * 0.5, -nx * aw * 0.5, -ny * aw * 0.5);
  const lit = clamp(0.5 + 0.5 * (nx * 0.5 + ny * 0.7));
  lg.addColorStop(0, ok(lerp(0.5, 0.92, 1 - lit), 0.09, 86));
  lg.addColorStop(0.5, ok(0.74, 0.11, 82));
  lg.addColorStop(1, ok(lerp(0.5, 0.92, lit), 0.09, 86));
  ctx.strokeStyle = lg;
  ctx.lineWidth = aw;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, kr * 0.26, 0, TAU);
  ctx.fillStyle = brassRadialAt(ctx, 0, 0, kr * 0.26);
  ctx.fill();
  screw(ctx, 0, 0, kr * 0.12, a);
  // A turned wooden knob, lit from the upper left.
  const kg = ctx.createRadialGradient(ex - knob * 0.35, ey - knob * 0.4, knob * 0.05, ex, ey, knob);
  kg.addColorStop(0, ok(0.86, 0.06, 60));
  kg.addColorStop(0.45, ok(0.55, 0.12, 40));
  kg.addColorStop(1, ok(0.26, 0.07, 30));
  ctx.fillStyle = kg;
  ctx.beginPath();
  ctx.arc(ex, ey, knob, 0, TAU);
  ctx.fill();
  ctx.restore();
}

/* ---------- physics: the drum, the motor, the comb ---------- */
function stepDrum(dt) {
  if (mode === 'hand') {
    u = handU;
  } else if (mode === 'goal') {
    const k = 320, c = 2 * Math.sqrt(k);
    vel += (k * (goal - u) - c * vel) * dt;
    u += vel * dt;
    if (Math.abs(goal - u) < 0.003 && Math.abs(vel) < 0.08) { u = goal; vel = 0; mode = 'free'; }
  } else {
    if (wind > 0) {
      // The governor holds the tempo until the spring runs low.
      const target = BASE * Math.min(1, Math.sqrt(wind / 0.12));
      vel += (target - vel) * (1 - Math.exp(-dt / (vel > target ? 0.35 : 0.5)));
      const used = (Math.max(0, Math.min(vel, target)) * dt) / CAP;
      wind = Math.max(0, wind - used);
      windOut += used;
      if (wind < 1e-4) wind = 0;
    } else {
      vel *= Math.exp(-dt / (reduce ? 0.25 : 0.5));
      if (Math.abs(vel) < 0.05) vel = 0;
    }
    u += vel * dt;
  }
}
// A pin crosses the comb each time u passes P plus a whole step.
function crossings(u0, u1, dt) {
  if (u1 === u0) return;
  const fwd = u1 > u0;
  dir = fwd ? 1 : -1;
  let ja = fwd ? Math.floor(u0 - P) + 1 : Math.ceil(u1 - P), jb = fwd ? Math.floor(u1 - P) : Math.ceil(u0 - P) - 1;
  if (jb - ja > S) ja = jb - S;
  const a = live(), t0 = a ? a.currentTime + LEAD : 0;
  for (let j = ja; j <= jb; j++) {
    const f = clamp((P + j - u0) / (u1 - u0)), k = mod(j, S);
    for (let i = 0; i < N; i++) {
      if (!pins[k * N + i]) continue;
      if (a) pluck(i, t0 + f * dt, fwd ? jit(0.05) * 0.95 : 0.7);
      ring(i, 1);
    }
  }
}
function ring(i, v) {
  amp[i] = G.push * v;
  age[i] = 0;
  glow[i] = Math.min(1.2, glow[i] * 0.4 + v);
}
// Tooth lift: a pin presses it up, then it rings and settles.
function stepTeeth(dt) {
  let busy = false;
  const q = u - P, d = dir > 0 ? Math.floor(q) + 1 - q : q - (Math.ceil(q) - 1), k = mod(dir > 0 ? Math.floor(q) + 1 : Math.ceil(q) - 1, S);
  const near = d < 0.45 ? 1 - d / 0.45 : 0;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1), tv = lerp(0.7, 0.35, t), tg = lerp(1.2, 0.55, t) * (reduce ? 0.6 : 1);
    let z = near && pins[k * N + i] ? G.push * near * near : 0;
    if (amp[i] > 0) {
      age[i] += dt;
      const e = Math.exp(-age[i] / tv);
      if (amp[i] * e < 0.05) amp[i] = 0;
      else {
        z += reduce ? amp[i] * e * 0.3 : amp[i] * e * Math.cos(TAU * lerp(19, 27, t) * age[i]);
        busy = true;
      }
    }
    if (glow[i] > 0) {
      glow[i] *= Math.exp(-dt / tg);
      if (glow[i] < 0.02) glow[i] = 0;
      else busy = true;
    }
    lift[i] = z;
  }
  return busy;
}

/* ---------- one loop, only while something moves ---------- */
let raf = 0, last = 0, onScreen = true, ready = false, slow = 0, frames = 0;
function wake() {
  if (!raf && ready && onScreen && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(ms) {
  raf = 0;
  const raw = Math.max(0, (ms - last) / 1000), dt = Math.min(raw, 1 / 20), now = ms / 1000;
  last = ms;
  // Sustained slow frames drop the pixel ratio to 1.
  if (!lowDpr && ++frames > 20) {
    slow = raw > 0.03 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 24) { lowDpr = true; fit(); }
  }
  const u0 = u;
  stepDrum(dt);
  crossings(u0, u, dt);
  const ringing = stepTeeth(dt);
  arborVis += (windIn - arborVis) * (1 - Math.exp(-dt / 0.08));
  ghosts = ghosts.filter(g => now - g.t < 0.25);
  const popping = ghosts.length > 0 || now - lastBorn < 0.35;
  const moving = mode !== 'free' || vel !== 0 || wind > 0 || Math.abs(windIn - arborVis) > 1e-4;
  draw(now);
  if (frames === 2) cv.classList.add('on');
  if (ac && ac.state === 'running') whirTo(Math.abs(vel * DPHI * FANR) / TAU);
  if ((moving || ringing || popping || grab) && onScreen && !document.hidden) raf = requestAnimationFrame(frame);
  else rest();
}

/* ---------- actions ---------- */
let lastBorn = -9;
function togglePin(i, k) {
  const ix = k * N + i, now = clock();
  const a = live();
  if (pins[ix]) {
    pins[ix] = 0;
    ghosts.push({ i, k, t: now });
    if (a) tap(a.currentTime + LEAD, 2600, 0.7);
  } else {
    pins[ix] = 1;
    born[ix] = now;
    lastBorn = now;
    if (a) {
      tap(a.currentTime + LEAD, 3900, 1);
      pluck(i, a.currentTime + LEAD + 0.03, 0.5);
    }
    ring(i, 0.45);
  }
  wake();
}
function clearPins(now) {
  let n = 0;
  for (let k = 0; k < S; k++) {
    for (let i = 0; i < N; i++) {
      if (!pins[k * N + i]) continue;
      pins[k * N + i] = 0;
      // Pins nearest the front leave first.
      const th = mod((u - k) * DPHI + Math.PI, TAU) - Math.PI;
      ghosts.push({ i, k, t: now + (reduce ? 0 : Math.abs(th) * 0.12 + i * 0.004) });
      n++;
    }
  }
  return n;
}
function loadTune(ix) {
  const now = clock(), a = live();
  clearPins(now);
  let n = 0;
  for (const [k, ...teeth] of TUNES[ix]) {
    for (const i of teeth) {
      const j = k * N + i, th = mod((u - k) * DPHI + Math.PI, TAU) - Math.PI;
      pins[j] = 1;
      born[j] = now + (reduce ? 0 : 0.18 + Math.abs(th) * 0.16 + i * 0.006);
      lastBorn = Math.max(lastBorn, born[j]);
      n++;
    }
  }
  if (a) for (let k = 0; k < 7; k++) tap(a.currentTime + LEAD + 0.2 + k * 0.07, 3600 - k * 120, 0.55 - k * 0.05);
  wake();
}
function windUp(dw, clicks = true) {
  const add = Math.min(1 - wind, dw);
  if (add <= 0.001) return;
  wind += add;
  windIn += add;
  const a = live();
  if (a && clicks) {
    const n = clamp(Math.round(add * 22), 1, 10);
    const t = Math.max(a.currentTime + LEAD, clickAt);
    for (let k = 0; k < n; k++) click(t + k * 0.032, 0.8 + 0.2 * Math.random());
    clickAt = t + n * 0.032;
  }
  wake();
}
function stepBy(d) {
  if (mode !== 'goal') { goal = Math.round(u); vel = mode === 'hand' ? 0 : vel; }
  goal += d;
  mode = 'goal';
  wake();
}

/* ---------- input ---------- */
let rect = null, grab = null;
addEventListener('scroll', () => { rect = null; }, { passive: true });
function local(e) {
  const r = rect || (rect = panel.getBoundingClientRect());
  return [((e.clientX - r.left) / r.width) * W, ((e.clientY - r.top) / r.height) * H];
}
function cellAt(x, y) {
  if (x < G.x0 || x >= G.x1) return null;
  const s = (y - G.cy) / G.R;
  if (Math.abs(s) > 0.93) return null;
  const i = clamp(Math.floor((x - G.x0) / G.cwid), 0, N - 1), k = mod(Math.round(u - Math.asin(s) / DPHI), S);
  return { i, k };
}
const onCrank = (x, y) => Math.hypot(x - G.kx, y - G.ky) < G.arm + G.knob + 10 * G.u;
const onDrum = (x, y) => x > G.x0 - 4 && x < G.x1 + 4 && Math.abs(y - G.cy) < G.R;
const onBarrel = (x, y) => Math.hypot(x - G.bx, y - G.by) < G.rb * 1.08;
function cursorFor(x, y) {
  panel.style.cursor = grab ? 'grabbing' : onCrank(x, y) || onBarrel(x, y) ? 'grab' : onDrum(x, y) ? 'pointer' : '';
}
function sample(t) {
  grab.hist.push(t, handU);
  while (grab.hist.length > 4 && t - grab.hist[0] > 110) grab.hist.splice(0, 2);
}
panel.addEventListener('pointerdown', e => {
  if (!ready || grab || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const [x, y] = local(e);
  const kind = onCrank(x, y) ? 'crank' : onDrum(x, y) ? 'drum' : onBarrel(x, y) ? 'barrel' : null;
  if (!kind) return;
  kbd = false;
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  grab = { id: e.pointerId, kind, sx: x, sy: y, ly: y, moved: false, cell: kind === 'drum' ? cellAt(x, y) : null, hist: [] };
  grab.a = kind === 'crank' ? Math.atan2(y - G.ky, x - G.kx) : Math.atan2(y - G.by, x - G.bx);
  if (kind !== 'barrel') {
    // A hand on the drum or crank holds it still.
    handU = u;
    mode = 'hand';
    vel = 0;
    sample(e.timeStamp);
  }
  hover = null;
  cursorFor(x, y);
  wake();
});
panel.addEventListener('pointermove', e => {
  if (!grab) {
    if (e.pointerType !== 'mouse' || !ready) return;
    const [x, y] = local(e), c = onDrum(x, y) ? cellAt(x, y) : null;
    cursorFor(x, y);
    if ((c && hover && c.i === hover.i && c.k === hover.k) || (!c && !hover)) return;
    hover = c;
    wake();
    return;
  }
  if (e.pointerId !== grab.id) return;
  const list = e.getCoalescedEvents?.() || [];
  for (const ev of list.length ? list : [e]) {
    const [x, y] = local(ev);
    if (grab.kind === 'drum') {
      if (!grab.moved && Math.hypot(x - grab.sx, y - grab.sy) > 6) { grab.moved = true; grab.ly = y; }
      if (grab.moved) {
        const s = clamp((y - G.cy) / G.R, -0.95, 0.95), c = Math.max(0.45, Math.sqrt(1 - s * s));
        handU += (y - grab.ly) / (G.R * c * DPHI);
        grab.ly = y;
      }
    } else {
      const cx = grab.kind === 'crank' ? G.kx : G.bx, cy = grab.kind === 'crank' ? G.ky : G.by;
      const r = Math.hypot(x - cx, y - cy), a = Math.atan2(y - cy, x - cx);
      let da = a - grab.a;
      da = mod(da + Math.PI, TAU) - Math.PI;
      grab.a = a;
      if (r < 6 * G.u) continue;
      grab.moved = true;
      if (grab.kind === 'crank') handU += (da / TAU) * CRANK;
      else if (da > 0) windUp((da / TAU) * 0.3);
    }
    if (grab.kind !== 'barrel') sample(ev.timeStamp);
  }
  wake();
});
function release(e) {
  if (!grab || e.pointerId !== grab.id) return;
  const g = grab;
  grab = null;
  if (g.kind === 'drum' && !g.moved && g.cell && e.type === 'pointerup') togglePin(g.cell.i, g.cell.k);
  if (g.kind !== 'barrel') {
    // Release speed from the last tenth of a second of the drag.
    let v = 0;
    const hs = g.hist, n = hs.length;
    if (n >= 4 && e.timeStamp - hs[n - 2] < 70) {
      const span = (hs[n - 2] - hs[0]) / 1000;
      if (span > 0.012) v = (hs[n - 1] - hs[1]) / span;
    }
    v = clamp(v, -60, 60);
    mode = 'free';
    vel = g.moved ? v : 0;
    if (v > FLICK) windUp(clamp((v - 4) / 40, 0.1, 1));
  }
  const [x, y] = local(e);
  cursorFor(x, y);
  wake();
}
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => panel.addEventListener(t, release));
panel.addEventListener('pointerleave', () => { if (hover) { hover = null; wake(); } });
panel.addEventListener('contextmenu', e => e.preventDefault());
// The keyboard cursor shows only for keyboard use.
panel.addEventListener('blur', () => { if (kbd) { kbd = false; wake(); } });
let spaceAt = 0;
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const k = e.key;
  if (k === ' ') {
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (!ready) return;
    const t = performance.now();
    if (e.repeat && t - spaceAt < 110) return;
    spaceAt = t;
    windUp(e.repeat ? 0.06 : 0.22);
  } else if (k === 'ArrowUp' || k === 'ArrowDown') {
    e.preventDefault();
    if (!ready) return;
    kbd = true;
    stepBy(k === 'ArrowDown' ? 1 : -1);
  } else if (k === 'ArrowLeft' || k === 'ArrowRight') {
    e.preventDefault();
    if (!ready) return;
    kbd = true;
    kc = clamp(kc + (k === 'ArrowRight' ? 1 : -1), 0, N - 1);
    wake();
  } else if (k === 'Enter') {
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (!ready || e.repeat) return;
    kbd = true;
    togglePin(kc, mod(Math.round(u), S));
  }
});
const clearB = document.getElementById('clear'), tuneB = document.getElementById('tune');
clearB.addEventListener('click', () => {
  if (!ready) return;
  const now = clock(), a = live();
  if (clearPins(now) && a) for (let k = 0; k < 6; k++) tap(a.currentTime + LEAD + k * 0.05, 2800 - k * 160, 0.5 - k * 0.06);
  wake();
});
tuneB.addEventListener('click', () => {
  if (!ready) return;
  tuneIx = 1 - tuneIx;
  loadTune(tuneIx);
});
const sndB = document.getElementById('snd');
const showSound = () => sndB.setAttribute('aria-pressed', String(soundOn));
showSound();
sndB.addEventListener('click', () => {
  soundOn = !soundOn;
  showSound();
  try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (err) { /* storage is optional */ }
  if (soundOn) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});

/* ---------- size: canvas pixels follow the stage ---------- */
function fit() {
  const r = panel.getBoundingClientRect();
  rect = null;
  if (r.width < 2 || r.height < 2) return;
  W = r.width;
  H = r.height;
  dpr = Math.min(devicePixelRatio || 1, lowDpr ? 1 : 2, Math.sqrt(1.4e6 / (W * H)));
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  G = layout(W, H);
  paintBg();
  drumSpr = paintDrum();
  combSpr = paintComb();
  paintSprites();
  if (ready) draw(clock());
  wake();
}
let fitT = 0;
function refit() {
  clearTimeout(fitT);
  fitT = setTimeout(fit, 60);
}
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(panel);
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); else rest(); });

async function boot() {
  if (!ctx) {
    panel.querySelector('.fail').hidden = false;
    clearB.disabled = tuneB.disabled = true;
    return;
  }
  await idle();
  for (const [k, ...teeth] of TUNES[0]) for (const i of teeth) pins[k * N + i] = 1;
  fit();
  ready = true;
  draw(clock());
  cv.classList.add('on');
  new ResizeObserver(refit).observe(panel);
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
