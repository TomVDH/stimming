<!doctype html>
<html lang="en">
<head>

<style>
/* Googly eyes: a dark stage at full width under the shared header. */
:root { --stage: oklch(0.17 0.035 288); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);

</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Googly eyes</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--eyes" id="stage" tabindex="0" role="application" aria-label="A cluster of googly eyes that watch the pointer. Arrow keys move what they watch, Shift with arrows drags an eye, Enter blinks one, B blinks them all, D makes them dizzy and Space shakes them.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Googly eyes needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="actions">
        <button class="chip" id="shake" type="button" aria-keyshortcuts="Space">Shake</button>
        <button class="chip" id="blink" type="button" aria-keyshortcuts="B">Blink</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt><span class="fine">Move</span><span class="touch">Drag</span></dt><dd>they watch</dd></div>
        <div><dt>Circle fast</dt><dd>dizzy</dd></div>
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span> an eye</dt><dd>blink</dd></div>
        <div><dt>Drag</dt><dd>shake</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>rattle</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Googly eyes</h1><div class="vignette" hidden></div></section>
</div>

<script type="module">
import { initPage, sound } from '../shared/stim.js';
initPage({ id: 'eyes' });
const panel = document.getElementById('stage'), canvas = panel.querySelector('canvas');
const shakeB = document.getElementById('shake'), blinkB = document.getElementById('blink');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;

const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

const HUES = [[0.7, 0.22, 355], [0.76, 0.17, 52], [0.88, 0.17, 96], [0.84, 0.2, 138], [0.78, 0.13, 192], [0.64, 0.19, 258], [0.62, 0.23, 302], [0.67, 0.2, 25]].map(c => linear(...c));

  uGlowA: linear(0.36, 0.13, 342), uGlowB: linear(0.34, 0.09, 205),

const SKIN = {
  uWhite: linear(0.965, 0.012, 95), uPupil: linear(0.17, 0.015, 280), uCaus: linear(0.98, 0.035, 85),
  uEnvA: linear(0.68, 0.22, 345), uEnvB: linear(0.78, 0.13, 195), uEnvTop: linear(0.44, 0.035, 270), uEnvLow: linear(0.14, 0.025, 285),

const SHADE = linear(0.09, 0.035, 290), FOCUS = linear(0.84, 0.13, 205);

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 24, LEAD = 0.004;
let ac = null, out = null, noise = null, askedAt = -1e9, voices = 0, restT = 0, clickGate = 0, pipGate = 0;

// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.07 * voices);

function audio() {

function track(src, ...tails) {

}
// Once the eyes settle, the context sleeps until the next gesture.
function rest() {

// Touchend is the gesture iOS needs.

// Each voice pans with its place on the stage.
function bus(a, x) {

// Small eyes tick higher.

// Big eyes pip lower than small eyes.
const SCALE = [0, 2, 4, 7, 9];

/* ---------- the eyes: a packed cluster in CSS pixels, y down ---------- */
// Accelerations are in pixels per second squared at stage scale one.
const GRAV = 1700, PULL = 7800, WHIRL = 5200, JMAX = 4000, AMAX = 40000;
