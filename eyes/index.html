<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Googly eyes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: every module downloads in parallel. -->
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm">
<style>
/* Googly eyes: a dark stage at full width under the shared header. */
:root { --stage: oklch(0.17 0.035 288); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/eyes.svg)"></span><span class="intro-name">Googly eyes</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--eyes" id="stage" tabindex="0" role="application" aria-label="A cluster of googly eyes that watch the pointer. Arrow keys move what they watch, Shift with arrows drags an eye, Enter blinks one, B blinks them all, D makes them dizzy and Space shakes them. Shuffle deals a new cluster.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Googly eyes needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Googly eyes</h1><div class="vignette" hidden></div></section>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
