<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.13 0.008 300); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sequin brush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Sequin brush: one field of reversible sequins under one key light. */
:root { --stage: oklch(0.1 0.008 300); }
.stage--sequin { cursor: crosshair; }
.stage--sequin canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--sequin canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--sequin canvas { transition: none; } }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.01 300 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
/* Each face-pair dot shows both faces, split on the diagonal. */
.chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Sequin brush</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--sequin" id="stage" tabindex="0" role="application" aria-label="A field of reversible sequins. Stroke down to flip them; stroke up to flip them home.">
      <p class="fail" hidden>Sequin brush needs WebGL2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" id="faces" role="group" aria-label="Sequins">
        <button class="chip" type="button" data-value="silver" aria-pressed="true"><span class="dot" style="background:linear-gradient(135deg,oklch(0.9 0.005 250) 50%,oklch(0.2 0.01 290) 50%)"></span>Silver</button>
        <button class="chip" type="button" data-value="gold" aria-pressed="false"><span class="dot" style="background:linear-gradient(135deg,oklch(0.82 0.12 85) 50%,oklch(0.64 0.16 10) 50%)"></span>Gold</button>
        <button class="chip" type="button" data-value="lagoon" aria-pressed="false"><span class="dot" style="background:linear-gradient(135deg,oklch(0.74 0.12 190) 50%,oklch(0.56 0.2 300) 50%)"></span>Lagoon</button>
      </div>
      <label class="slider"><span>Brush</span><input type="range" id="brush" min="0" max="1" step="0.01" value="0.5" aria-label="Brush: narrow to wide"></label>
      <div class="actions">
        <button class="chip" id="clear" type="button">Clear</button>
      </div>
      <div class="edge">
        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings"></div>
        </div>
        <dl class="how" aria-label="How to play">
          <div><dt>Stroke down</dt><dd>flip the sequins</dd></div>
          <div><dt>Stroke up</dt><dd>flip them home</dd></div>
        </dl>
      </div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Sequin brush</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, choices, fitCanvas, linFit, qualitySetting, onQuality } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

// Blockout: still frames only; no loop, no input, no sound.
const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });
initPage({ id: 'sequin' });
// Settings holds the site-wide Quality choice.
qualitySetting(document.getElementById('sets'));

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.sequin.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.sequin.${k}`, String(v)); } catch { /* storage is optional */ } };
const opts = {
  faces: saved('faces') || 'silver',
  brush: saved('brush') != null ? +saved('brush') : 0.5,
};
// Each pair: home face A, flipped face B, as OKLCH reflectance.
const FACES = {
  silver: { a: [0.9, 0.005, 250], b: [0.3, 0.012, 290] },
  gold: { a: [0.8, 0.13, 84], b: [0.62, 0.16, 10] },
  lagoon: { a: [0.72, 0.12, 190], b: [0.52, 0.2, 300] },
};
// Clear shows the field with every sequin home.
const still = { clear: 0 };

/* ---------- WebGL2 ---------- */
const stage = document.getElementById('stage');
const canvas = document.createElement('canvas');
canvas.setAttribute('aria-hidden', 'true');
stage.prepend(canvas);
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
const fail = () => { stage.querySelector('.fail').hidden = false; markReady(); throw new Error('no webgl2'); };
if (!gl) fail();
// Half floats keep the highlights above one for bloom.
const FLOAT = !!gl.getExtension('EXT_color_buffer_float');

const QUAD_VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
const NOISE = `
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y); }
`;

function program(vs, fs, attrs) {
  const p = gl.createProgram();
  [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(([type, src]) => {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(sh)); fail(); }
    gl.attachShader(p, sh);
  });
  attrs.forEach((name, i) => gl.bindAttribLocation(p, i, name));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); fail(); }
  const u = {};
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(p, i).name.replace('[0]', ''); u[n] = gl.getUniformLocation(p, n); }
  return { p, u };
}

const quadVao = gl.createVertexArray();
gl.bindVertexArray(quadVao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

function target(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (FLOAT) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
  [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fb, w, h };
}
const drop = t => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); };

/* ---------- the field ---------- */
// The field: rows of cupped sequins; each upper row overlaps the next.
const FIELD_FS = `#version 300 es
precision highp float;
uniform vec2 uRes, uKeyC, uFillC;
uniform float uD, uWidth, uClear, uKeyA, uEndX, uAx;
uniform vec3 uA, uB, uCloth;
in vec2 vUv; out vec4 o;
${NOISE}
const float PI = 3.14159265;
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
// The swath: one brushed S-curve that ends mid-field.
float pathY(float x) { return 0.16 * sin(x * 2.4 + 0.5) - 0.03; }
// The flip angle: 0 shows face A; PI shows face B.
float flipOf(vec2 c, vec2 id) {
  if (uClear > 0.5) return 0.0;
  vec2 h = hash22(id + 7.3);
  float d = abs(c.y - pathY(c.x)) + (h.x - 0.5) * 0.025;
  float band = 1.0 - smoothstep(uWidth - 0.022, uWidth + 0.012, d);
  // The head is where the brush is now; its sequins turn mid-flip.
  float head = 1.0 - smoothstep(uEndX - 0.1, uEndX + 0.02 * h.y, c.x);
  float tail = smoothstep(-uAx * 0.5 - 0.1, -uAx * 0.5 + 0.02, c.x);
  return PI * clamp(band * head * tail, 0.0, 1.0);
}
// The room: one warm key strip, one cool fill and a dim surround.
vec3 env(vec2 q, vec3 r) {
  float rz = max(r.z, 0.08);
  vec2 hit = q + r.xy / rz * 1.1;
  vec2 s = rot(-uKeyA) * (hit - uKeyC);
  float key = (1.0 - smoothstep(0.3, 0.6, abs(s.x))) * exp(-s.y * s.y * 140.0);
  // The key light falls in one pool; far sequins stay dark.
  vec2 kp = q - uKeyC;
  float pool = exp(-dot(kp, kp) * 2.2);
  float glow = exp(-dot(s, s) * 3.0);
  vec2 f = hit - uFillC;
  float fill = exp(-dot(f, f) * 3.0);
  float m = vnoise(hit * 1.3 + 2.0);
  float room = 0.003 + 0.035 * m * m * m;
  return vec3(1.0, 0.94, 0.85) * (key * 7.0 + glow * 0.35) * (0.15 + 0.85 * pool) + vec3(0.6, 0.66, 0.9) * fill * 0.14 + vec3(room);
}
void main() {
  float S = min(uRes.x, uRes.y);
  vec2 q = (vUv * uRes - 0.5 * uRes) / S;
  float d = uD, dy = d * 0.78, r = d * 0.56, aa = 1.4 / (S * r);
  // The cloth shows in the gaps: dark weave with a faint sheen.
  float weave = 0.75 + 0.25 * sin(q.x * S * 0.9) * sin(q.y * S * 0.9);
  vec3 col = uCloth * weave * (0.7 + 0.6 * vnoise(q * 6.0));
  float j0 = floor(q.y / dy);
  bool done = false;
  // Upper rows lie on top, so the loop tests them first.
  for (int k = 1; k >= -1 && !done; k--) {
    float j = j0 + float(k);
    float off = mod(j, 2.0) * 0.5;
    float i0 = floor(q.x / d - off + 0.5);
    for (int m = -1; m <= 1 && !done; m++) {
      vec2 id = vec2(i0 + float(m), j);
      vec2 c = vec2((id.x + off) * d, (j + 0.5) * dy);
      float th = flipOf(c, id);
      float cs = cos(th);
      // The flip turns each disc about its horizontal axis.
      vec2 p = q - c;
      vec2 l = vec2(p.x, p.y / max(abs(cs), 0.035)) / r;
      float rr = length(l);
      if (rr >= 1.0) continue;
      done = true;
      vec2 h = hash22(id), h2 = hash22(id + 31.0);
      // A cupped disc with a random wobble, so each one finds the light alone.
      vec3 n = vec3(0.0, -sin(th), cs) * sign(cs + 1e-4);
      n.xy += -l * vec2(1.0, abs(cs)) * 0.3 + (h - 0.5) * 0.3;
      n = normalize(n);
      vec3 rv = reflect(vec3(0.0, 0.0, -1.0), n);
      vec3 F0 = cs >= 0.0 ? uA : uB;
      vec3 F = mix(F0, vec3(1.0), pow(1.0 - n.z, 5.0) * 0.6);
      vec3 c3 = env(q, rv) * F + F0 * 0.012;
      // A tiny press mark shows the stitch hole near the top edge.
      vec2 st = l - vec2(0.0, 0.62);
      c3 *= mix(0.15, 1.0, smoothstep(0.07, 0.11, length(st)));
      // An edge-on sequin catches a thin bright line along its rim.
      float edge = pow(1.0 - abs(cs), 6.0);
      c3 += vec3(1.0, 0.95, 0.88) * edge * 2.5 * (0.4 + 0.6 * h2.x);
      // The row above casts a soft shadow on this sequin.
      float sh = 1.0;
      float ju = j + 1.0, offu = mod(ju, 2.0) * 0.5;
      for (int u = -1; u <= 1; u++) {
        float iu = floor(q.x / d - offu + 0.5) + float(u);
        vec2 cu = vec2((iu + offu) * d, (ju + 0.5) * dy) + vec2(0.06, -0.1) * d;
        sh = min(sh, smoothstep(0.92, 1.25, length(q - cu) / r));
      }
      c3 *= mix(0.3, 1.0, sh);
      // The rim darkens to a seam, which also smooths the edge.
      c3 *= smoothstep(1.0, 1.0 - aa - 0.05, rr);
      col = c3;
    }
  }
  o = vec4(col, 1.0);
}`;
// The bright pass keeps only light above a soft threshold.
const BRIGHT_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; in vec2 vUv; out vec4 o;
void main() { vec3 c = texture(uSrc, vUv).rgb; float l = max(c.r, max(c.g, c.b)); o = vec4(c * smoothstep(0.6, 2.6, l), 1.0); }`;
// A nine-tap blur runs once per axis.
const BLUR_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uDir; in vec2 vUv; out vec4 o;
void main() {
  vec3 s = texture(uSrc, vUv).rgb * 0.227;
  s += (texture(uSrc, vUv + uDir * 1.385).rgb + texture(uSrc, vUv - uDir * 1.385).rgb) * 0.316;
  s += (texture(uSrc, vUv + uDir * 3.231).rgb + texture(uSrc, vUv - uDir * 3.231).rgb) * 0.070;
  o = vec4(s, 1.0);
}`;
// The final pass: glow, vignette, grain and output curve.
const OUT_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc, uBloom, uWide; uniform vec2 uRes;
in vec2 vUv; out vec4 o;
${NOISE}
void main() {
  vec3 c = texture(uSrc, vUv).rgb + texture(uBloom, vUv).rgb * 0.4 + texture(uWide, vUv).rgb * 0.2;
  vec2 q = vUv - 0.5;
  c *= 1.0 - dot(q * vec2(1.0, 1.3), q) * 0.8;
  c = 1.0 - exp(-c * 1.4);
  c += (hash12(vUv * uRes) - 0.5) * 0.006;
  o = vec4(pow(max(c, 0.0), vec3(1.0 / 2.2)), 1.0);
}`;
const P = {
  field: program(QUAD_VS, FIELD_FS, ['aPos']),
  bright: program(QUAD_VS, BRIGHT_FS, ['aPos']),
  blur: program(QUAD_VS, BLUR_FS, ['aPos']),
  out: program(QUAD_VS, OUT_FS, ['aPos']),
};

/* ---------- render ---------- */
let W = 1, H = 1, frame = null, bl = [], wd = [];
function quad(dst, prog) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst ? dst.fb : null);
  gl.viewport(0, 0, dst ? dst.w : W, dst ? dst.h : H);
  gl.useProgram(prog.p); gl.bindVertexArray(quadVao);
}
const bind = (unit, tex, loc) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(loc, unit); };
function blur(pair) {
  quad(pair[1], P.blur); bind(0, pair[0].tex, P.blur.u.uSrc); gl.uniform2f(P.blur.u.uDir, 1 / pair[0].w, 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  quad(pair[0], P.blur); bind(0, pair[1].tex, P.blur.u.uSrc); gl.uniform2f(P.blur.u.uDir, 0, 1 / pair[0].h); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
// The layout sizes the sequins to the stage and aims the key light.
function layout() {
  const S = Math.min(W, H), ax = W / S, ay = H / S, tall = W < H;
  return {
    ax,
    d: tall ? 0.072 : 0.052,
    endX: ax * (tall ? 0.28 : 0.2),
    key: tall ? [-0.1, ay * 0.12] : [-ax * 0.12, 0.1],
    keyA: tall ? 0.9 : -0.55,
    fill: tall ? [0.3, -ay * 0.35] : [ax * 0.4, -0.35],
  };
}
function render() {
  const L = layout(), F = FACES[opts.faces];
  quad(frame, P.field);
  const u = P.field.u;
  gl.uniform2f(u.uRes, W, H);
  gl.uniform1f(u.uD, L.d);
  gl.uniform1f(u.uAx, L.ax);
  gl.uniform1f(u.uEndX, L.endX);
  gl.uniform1f(u.uWidth, 0.05 + opts.brush * 0.14);
  gl.uniform1f(u.uClear, still.clear);
  gl.uniform2fv(u.uKeyC, L.key);
  gl.uniform1f(u.uKeyA, L.keyA);
  gl.uniform2fv(u.uFillC, L.fill);
  gl.uniform3fv(u.uA, linFit(...F.a));
  gl.uniform3fv(u.uB, linFit(...F.b));
  gl.uniform3fv(u.uCloth, linFit(0.12, 0.012, 300));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // Two blur sizes give a tight glint and a wide bloom.
  quad(bl[0], P.bright); bind(0, frame.tex, P.bright.u.uSrc); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  blur(bl);
  quad(wd[0], P.bright); bind(0, bl[0].tex, P.bright.u.uSrc); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  blur(wd); blur(wd);
  quad(null, P.out);
  bind(0, frame.tex, P.out.u.uSrc); bind(1, bl[0].tex, P.out.u.uBloom); bind(2, wd[0].tex, P.out.u.uWide);
  gl.uniform2f(P.out.u.uRes, W, H);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- size ---------- */
function resize() {
  const fit = fitCanvas(canvas, { budget: 2.2e6 });
  if (fit.W === W && fit.H === H && frame) return;
  W = fit.W; H = fit.H;
  [...bl, ...wd].forEach(drop); if (frame) drop(frame);
  frame = target(W, H);
  const bw = Math.max(1, W >> 2), bh = Math.max(1, H >> 2);
  bl = [target(bw, bh), target(bw, bh)];
  wd = [target(Math.max(1, bw >> 2), Math.max(1, bh >> 2)), target(Math.max(1, bw >> 2), Math.max(1, bh >> 2))];
  render();
}

/* ---------- bar ---------- */
function popover(box, btn) {
  const set = on => { box.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!box.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
const brushEl = document.getElementById('brush');
brushEl.value = String(opts.brush);
brushEl.addEventListener('input', () => { opts.brush = +brushEl.value; still.clear = 0; save('brush', opts.brush); render(); });
choices(document.getElementById('faces'), v => { opts.faces = v; save('faces', v); render(); }).set(opts.faces);
// Clear toggles between the plain field and the brushed swath.
document.getElementById('clear').addEventListener('click', () => { still.clear = 1 - still.clear; render(); });

/* ---------- start ---------- */
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
resize();
gl.finish();
markReady();
requestAnimationFrame(() => canvas.classList.add('on'));
</script>
</body>
</html>
