<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.13 0.008 300); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sequin brush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Sequin brush: one field of reversible sequins under one key light. */
:root { --stage: oklch(0.1 0.008 300); }
.stage--sequin { cursor: crosshair; touch-action: none; }
.stage--sequin canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--sequin canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--sequin canvas { transition: none; } }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.01 300 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
/* Each face-pair dot shows both faces, split on the diagonal. */
.chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Sequin brush</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--sequin" id="stage" tabindex="0" role="application" aria-label="A field of reversible sequins. Stroke up to flip them; stroke down to flip them home.">
      <p class="fail" hidden>Sequin brush needs WebGL2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" id="faces" role="group" aria-label="Sequins">
        <button class="chip" type="button" data-value="silver" aria-pressed="true"><span class="dot" style="background:linear-gradient(135deg,oklch(0.9 0.005 250) 50%,oklch(0.2 0.01 290) 50%)"></span>Silver</button>
        <button class="chip" type="button" data-value="gold" aria-pressed="false"><span class="dot" style="background:linear-gradient(135deg,oklch(0.82 0.12 85) 50%,oklch(0.64 0.16 10) 50%)"></span>Gold</button>
        <button class="chip" type="button" data-value="lagoon" aria-pressed="false"><span class="dot" style="background:linear-gradient(135deg,oklch(0.74 0.12 190) 50%,oklch(0.56 0.2 300) 50%)"></span>Lagoon</button>
      </div>
      <label class="slider"><span>Brush</span><input type="range" id="brush" min="0" max="1" step="0.01" value="0.5" aria-label="Brush: narrow to wide"></label>
      <div class="actions">
        <button class="chip" id="clear" type="button">Clear</button>
      </div>
      <div class="edge">
        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings"></div>
        </div>
        <dl class="how" aria-label="How to play">
          <div><dt>Stroke up</dt><dd>flip the sequins</dd></div>
          <div><dt>Stroke down</dt><dd>flip them home</dd></div>
          <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>flip a few</dd></div>
          <div class="fine"><dt><kbd>Arrows</kbd></dt><dd>stroke</dd></div>
        </dl>
      </div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Sequin brush</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, choices, fitCanvas, whenVisible, reduced, onReducedChange, linFit, quality, qualitySetting, onQuality, audioKit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
const introDone = playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });
initPage({ id: 'sequin' });
// Settings holds the site-wide Quality choice.
qualitySetting(document.getElementById('sets'));

const PI = Math.PI;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.sequin.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.sequin.${k}`, String(v)); } catch { /* storage is optional */ } };
const opts = {
  faces: saved('faces') || 'silver',
  brush: saved('brush') != null ? +saved('brush') : 0.5,
};
let reduce = reduced();
onReducedChange(v => { reduce = v; });
// Each pair: home face A, flipped face B, as OKLCH reflectance.
const FACES = {
  silver: { a: [0.9, 0.005, 250], b: [0.3, 0.012, 290] },
  gold: { a: [0.8, 0.13, 84], b: [0.62, 0.16, 10] },
  lagoon: { a: [0.72, 0.12, 190], b: [0.52, 0.2, 300] },
};
// The brush radius, in short-side units.
const brushR = () => 0.035 + opts.brush * 0.11;

/* ---------- WebGL2 ---------- */
const stage = document.getElementById('stage');
const canvas = document.createElement('canvas');
canvas.setAttribute('aria-hidden', 'true');
stage.prepend(canvas);
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
const fail = () => { stage.querySelector('.fail').hidden = false; markReady(); throw new Error('no webgl2'); };
if (!gl) fail();
// Half floats keep the highlights above one for bloom.
const FLOAT = !!gl.getExtension('EXT_color_buffer_float');

const QUAD_VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
const NOISE = `
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y); }
`;

function program(vs, fs, attrs) {
  const p = gl.createProgram();
  [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(([type, src]) => {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(sh)); fail(); }
    gl.attachShader(p, sh);
  });
  attrs.forEach((name, i) => gl.bindAttribLocation(p, i, name));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); fail(); }
  const u = {};
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(p, i).name.replace('[0]', ''); u[n] = gl.getUniformLocation(p, n); }
  return { p, u };
}

const quadVao = gl.createVertexArray();
gl.bindVertexArray(quadVao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

function target(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (FLOAT) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
  [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fb, w, h };
}
const drop = t => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); };

/* ---------- the field ---------- */
// One byte holds each flip angle, with room for overshoot.
const TH_LO = -0.6, TH_SPAN = PI + 1.2;
// The field: rows of cupped sequins; each upper row overlaps the next.
const FIELD_FS = `#version 300 es
precision highp float;
uniform vec2 uRes, uKeyC, uFillC;
uniform float uD, uKeyA;
uniform ivec2 uOrigin, uSize;
uniform sampler2D uState;
uniform vec3 uA, uB, uCloth;
in vec2 vUv; out vec4 o;
${NOISE}
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
// The flip angle: 0 shows face A; pi shows face B.
float flipOf(vec2 id) {
  ivec2 t = ivec2(id) - uOrigin;
  if (any(lessThan(t, ivec2(0))) || any(greaterThanEqual(t, uSize))) return 0.0;
  return texelFetch(uState, t, 0).r * ${TH_SPAN.toFixed(6)} + ${TH_LO.toFixed(6)};
}
// The room: one warm key strip, one cool fill and a dim surround.
vec3 env(vec2 q, vec3 r) {
  float rz = max(r.z, 0.08);
  vec2 hit = q + r.xy / rz * 1.1;
  vec2 s = rot(-uKeyA) * (hit - uKeyC);
  float key = (1.0 - smoothstep(0.3, 0.6, abs(s.x))) * exp(-s.y * s.y * 140.0);
  // The key light falls in one pool; far sequins stay dark.
  vec2 kp = q - uKeyC;
  float pool = exp(-dot(kp, kp) * 2.2);
  float glow = exp(-dot(s, s) * 3.0);
  vec2 f = hit - uFillC;
  float fill = exp(-dot(f, f) * 3.0);
  float m = vnoise(hit * 1.3 + 2.0);
  float room = 0.003 + 0.035 * m * m * m;
  return vec3(1.0, 0.94, 0.85) * (key * 7.0 + glow * 0.35) * (0.15 + 0.85 * pool) + vec3(0.6, 0.66, 0.9) * fill * 0.14 + vec3(room);
}
void main() {
  float S = min(uRes.x, uRes.y);
  vec2 q = (vUv * uRes - 0.5 * uRes) / S;
  float d = uD, dy = d * 0.78, r = d * 0.56, aa = 1.4 / (S * r);
  // The cloth shows in the gaps: dark weave with a faint sheen.
  float weave = 0.75 + 0.25 * sin(q.x * S * 0.9) * sin(q.y * S * 0.9);
  vec3 col = uCloth * weave * (0.7 + 0.6 * vnoise(q * 6.0));
  float j0 = floor(q.y / dy);
  bool done = false;
  // Upper rows lie on top, so the loop tests them first.
  for (int k = 1; k >= -1 && !done; k--) {
    float j = j0 + float(k);
    float off = mod(j, 2.0) * 0.5;
    float i0 = floor(q.x / d - off + 0.5);
    for (int m = -1; m <= 1 && !done; m++) {
      vec2 id = vec2(i0 + float(m), j);
      vec2 c = vec2((id.x + off) * d, (j + 0.5) * dy);
      float th = flipOf(id);
      float cs = cos(th);
      // The flip turns each disc about its horizontal axis.
      vec2 p = q - c;
      vec2 l = vec2(p.x, p.y / max(abs(cs), 0.035)) / r;
      float rr = length(l);
      if (rr >= 1.0) continue;
      done = true;
      vec2 h = hash22(id), h2 = hash22(id + 31.0);
      // A cupped disc with a random wobble, so each one finds the light alone.
      vec3 n = vec3(0.0, -sin(th), cs) * sign(cs + 1e-4);
      n.xy += -l * vec2(1.0, abs(cs)) * 0.3 + (h - 0.5) * 0.3;
      n = normalize(n);
      vec3 rv = reflect(vec3(0.0, 0.0, -1.0), n);
      vec3 F0 = cs >= 0.0 ? uA : uB;
      vec3 F = mix(F0, vec3(1.0), pow(1.0 - n.z, 5.0) * 0.6);
      vec3 c3 = env(q, rv) * F + F0 * 0.012;
      // A turning sequin keeps its colour in the fill light.
      c3 += F0 * (1.0 - abs(cs)) * 0.08;
      // A tiny press mark shows the stitch hole near the top edge.
      vec2 st = l - vec2(0.0, 0.62);
      c3 *= mix(0.15, 1.0, smoothstep(0.07, 0.11, length(st)));
      // An edge-on sequin catches a thin bright line along its rim.
      float edge = pow(1.0 - abs(cs), 6.0);
      c3 += vec3(1.0, 0.95, 0.88) * edge * 2.5 * (0.4 + 0.6 * h2.x);
      // The row above casts a soft shadow on this sequin.
      float sh = 1.0;
      float ju = j + 1.0, offu = mod(ju, 2.0) * 0.5;
      for (int u = -1; u <= 1; u++) {
        float iu = floor(q.x / d - offu + 0.5) + float(u);
        vec2 cu = vec2((iu + offu) * d, (ju + 0.5) * dy) + vec2(0.06, -0.1) * d;
        sh = min(sh, smoothstep(0.92, 1.25, length(q - cu) / r));
      }
      c3 *= mix(0.3, 1.0, sh);
      // The rim darkens to a seam, which also smooths the edge.
      c3 *= smoothstep(1.0, 1.0 - aa - 0.05, rr);
      col = c3;
    }
  }
  o = vec4(col, 1.0);
}`;
// The bright pass keeps only light above a soft threshold.
const BRIGHT_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; in vec2 vUv; out vec4 o;
void main() { vec3 c = texture(uSrc, vUv).rgb; float l = max(c.r, max(c.g, c.b)); o = vec4(c * smoothstep(0.6, 2.6, l), 1.0); }`;
// A nine-tap blur runs once per axis.
const BLUR_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uDir; in vec2 vUv; out vec4 o;
void main() {
  vec3 s = texture(uSrc, vUv).rgb * 0.227;
  s += (texture(uSrc, vUv + uDir * 1.385).rgb + texture(uSrc, vUv - uDir * 1.385).rgb) * 0.316;
  s += (texture(uSrc, vUv + uDir * 3.231).rgb + texture(uSrc, vUv - uDir * 3.231).rgb) * 0.070;
  o = vec4(s, 1.0);
}`;
// The final pass: glow, vignette, grain and output curve.
const OUT_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc, uBloom, uWide; uniform vec2 uRes;
in vec2 vUv; out vec4 o;
${NOISE}
void main() {
  vec3 c = texture(uSrc, vUv).rgb + texture(uBloom, vUv).rgb * 0.4 + texture(uWide, vUv).rgb * 0.2;
  vec2 q = vUv - 0.5;
  c *= 1.0 - dot(q * vec2(1.0, 1.3), q) * 0.8;
  c = 1.0 - exp(-c * 1.4);
  c += (hash12(vUv * uRes) - 0.5) * 0.006;
  o = vec4(pow(max(c, 0.0), vec3(1.0 / 2.2)), 1.0);
}`;
const P = {
  field: program(QUAD_VS, FIELD_FS, ['aPos']),
  bright: program(QUAD_VS, BRIGHT_FS, ['aPos']),
  blur: program(QUAD_VS, BLUR_FS, ['aPos']),
  out: program(QUAD_VS, OUT_FS, ['aPos']),
};

/* ---------- state ---------- */
// Grid ids are absolute, so a resize keeps every sequin's state.
let grid = null, stateTex = null, dirty = true;
let t = 0, drift = 0, ready = false;
// Sequins in motion; the loop sleeps when this set is empty.
const active = new Set();
// Clear schedules flips home as a wave, earliest first.
let pend = [];
// Seeded hash per sequin, for jitter that stays put.
const hash = (i, j) => { let h = Math.imul(i * 374761393 + j * 668265263, 1274126177); h ^= h >>> 13; h = Math.imul(h, 1103515245); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const rowOff = j => (((j % 2) + 2) % 2) * 0.5;
function makeGrid(L) {
  const d = L.d, dy = d * 0.78;
  const i0 = Math.floor(-L.ax / 2 / d) - 2, i1 = Math.ceil(L.ax / 2 / d) + 2;
  const j0 = Math.floor(-L.ay / 2 / dy) - 2, j1 = Math.ceil(L.ay / 2 / dy) + 1;
  const cols = i1 - i0 + 1, rows = j1 - j0 + 1, n = cols * rows;
  const g = { d, dy, i0, j0, cols, rows, th: new Float32Array(n), v: new Float32Array(n), tg: new Uint8Array(n), touched: new Float32Array(n).fill(-1e9), bytes: new Uint8Array(n) };
  g.cx = k => (g.i0 + (k % g.cols) + rowOff(g.j0 + ((k / g.cols) | 0))) * g.d;
  g.cy = k => (g.j0 + ((k / g.cols) | 0) + 0.5) * g.dy;
  return g;
}
// The first view: one brushed S-curve, its head still mid-flip.
const pathY = x => 0.16 * Math.sin(x * 2.4 + 0.5) - 0.03;
function preBrush(g, L) {
  const w = 0.05 + opts.brush * 0.14, endX = L.endX, startX = -L.ax / 2;
  for (let k = 0; k < g.th.length; k++) {
    const i = g.i0 + (k % g.cols), j = g.j0 + ((k / g.cols) | 0), x = g.cx(k), y = g.cy(k);
    const dist = Math.abs(y - pathY(x)) + (hash(i, j) - 0.5) * 0.025;
    const band = 1 - smooth(w - 0.022, w + 0.012, dist);
    const head = 1 - smooth(endX - 0.1, endX + 0.02 * hash(j, i), x);
    const tail = smooth(startX - 0.1, startX + 0.02, x);
    const f = clamp(band * head * tail);
    if (f < 0.05) continue;
    g.tg[k] = 1;
    g.th[k] = f * PI;
    if (f < 0.98) hero.push(k);
  }
}
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
// The head sequins hold still until the intro clears.
let hero = [];
function regrid(L) {
  const old = grid, g = makeGrid(L);
  if (old && old.d === g.d && old.i0 === g.i0 && old.j0 === g.j0 && old.cols === g.cols && old.rows === g.rows) return;
  active.clear(); pend = []; hero = [];
  if (old && old.d === g.d) {
    // Each sequin keeps its face by id; new ones start home.
    for (let r = 0; r < old.rows; r++) for (let c = 0; c < old.cols; c++) {
      const ci = old.i0 + c - g.i0, rj = old.j0 + r - g.j0;
      if (ci < 0 || rj < 0 || ci >= g.cols || rj >= g.rows) continue;
      const a = r * old.cols + c, b = rj * g.cols + ci;
      g.tg[b] = old.tg[a]; g.th[b] = old.tg[a] * PI;
    }
  } else preBrush(g, L);
  grid = g;
  if (stateTex) gl.deleteTexture(stateTex);
  stateTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, stateTex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, g.cols, g.rows, 0, gl.RED, gl.UNSIGNED_BYTE, null);
  [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.NEAREST));
  dirty = true;
}
function upload() {
  const g = grid;
  for (let k = 0; k < g.th.length; k++) g.bytes[k] = Math.round(clamp((g.th[k] - TH_LO) / TH_SPAN) * 255);
  gl.bindTexture(gl.TEXTURE_2D, stateTex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, g.cols, g.rows, gl.RED, gl.UNSIGNED_BYTE, g.bytes);
  dirty = false;
}

/* ---------- flips ---------- */
// A sequin springs to its face and overshoots a little as it lands.
function springs(dt) {
  const g = grid, K = reduce ? 900 : 520, C = 2 * Math.sqrt(K) * (reduce ? 1 : 0.55);
  if (!active.size || !dt) return;
  const n = Math.ceil(dt * 120), h = dt / n;
  dirty = true;
  for (const k of active) {
    const goal = g.tg[k] * PI;
    let th = g.th[k], v = g.v[k];
    for (let s = 0; s < n; s++) { v += (K * (goal - th) - C * v) * h; th += v * h; }
    if (Math.abs(goal - th) < 0.004 && Math.abs(v) < 0.05) { th = goal; v = 0; active.delete(k); }
    g.th[k] = th; g.v[k] = v;
  }
}
// Set one sequin's face; a sequin already there only lifts and settles.
function flip(k, to, x) {
  const g = grid;
  if (g.tg[k] !== to) {
    g.tg[k] = to;
    // A small push starts the turn at once, so the gesture answers this frame.
    g.v[k] += (to ? 1 : -1) * (reduce ? 2 : 6);
    active.add(k);
    tick(x, to, 1);
  } else if (t - g.touched[k] > 0.25) {
    g.v[k] += (to ? -1 : 1) * (reduce ? 1.5 : 4) * (0.6 + 0.8 * Math.random());
    active.add(k);
    tick(x, to, 0.35);
  }
  g.touched[k] = t;
}
// The brush sweeps a capsule from a to b; dir is 1 up, 0 down, -1 sideways.
function sweep(ax, ay, bx, by, R, dir) {
  const g = grid;
  const jlo = Math.floor((Math.min(ay, by) - R) / g.dy) - 1, jhi = Math.ceil((Math.max(ay, by) + R) / g.dy) + 1;
  const ilo = Math.floor((Math.min(ax, bx) - R) / g.d) - 1, ihi = Math.ceil((Math.max(ax, bx) + R) / g.d) + 1;
  const ex = bx - ax, ey = by - ay, ll = ex * ex + ey * ey || 1e-9;
  for (let j = jlo; j <= jhi; j++) {
    const r = j - g.j0;
    if (r < 0 || r >= g.rows) continue;
    for (let i = ilo; i <= ihi; i++) {
      const c = i - g.i0;
      if (c < 0 || c >= g.cols) continue;
      const k = r * g.cols + c, x = g.cx(k), y = g.cy(k);
      const u = clamp(((x - ax) * ex + (y - ay) * ey) / ll);
      const dx = x - (ax + ex * u), dy = y - (ay + ey * u);
      if (dx * dx + dy * dy > R * R) continue;
      if (dir < 0) { if (t - g.touched[k] > 0.25) flip(k, g.tg[k], x); }
      else flip(k, dir, x);
    }
  }
}
// Clear flips every sequin home, as one stroke down from the top.
function clearAll() {
  const g = grid;
  pend = [];
  for (let k = 0; k < g.tg.length; k++) {
    if (!g.tg[k]) continue;
    const top = 1 - ((k / g.cols) | 0) / g.rows;
    pend.push({ at: t + 0.04 + top * (reduce ? 0.2 : 0.7) + Math.random() * 0.05, k });
  }
  pend.sort((a, b) => a.at - b.at);
}

/* ---------- render ---------- */
let W = 1, H = 1, frame = null, bl = [], wd = [];
function quad(dst, prog) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst ? dst.fb : null);
  gl.viewport(0, 0, dst ? dst.w : W, dst ? dst.h : H);
  gl.useProgram(prog.p); gl.bindVertexArray(quadVao);
}
const bind = (unit, tex, loc) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(loc, unit); };
function blur(pair) {
  quad(pair[1], P.blur); bind(0, pair[0].tex, P.blur.u.uSrc); gl.uniform2f(P.blur.u.uDir, 1 / pair[0].w, 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  quad(pair[0], P.blur); bind(0, pair[1].tex, P.blur.u.uSrc); gl.uniform2f(P.blur.u.uDir, 0, 1 / pair[0].h); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
// The layout sizes the sequins to the stage and aims the key light.
function layout() {
  const S = Math.min(W, H), ax = W / S, ay = H / S, tall = W < H;
  return {
    ax, ay,
    d: tall ? 0.072 : 0.052,
    endX: ax * (tall ? 0.28 : 0.2),
    key: tall ? [-0.1, ay * 0.12] : [-ax * 0.12, 0.1],
    keyA: tall ? 0.9 : -0.55,
    fill: tall ? [0.3, -ay * 0.35] : [ax * 0.4, -0.35],
  };
}
function render() {
  const L = layout(), F = FACES[opts.faces], g = grid;
  if (dirty) upload();
  quad(frame, P.field);
  const u = P.field.u;
  gl.uniform2f(u.uRes, W, H);
  gl.uniform1f(u.uD, g.d);
  gl.uniform2i(u.uOrigin, g.i0, g.j0);
  gl.uniform2i(u.uSize, g.cols, g.rows);
  bind(0, stateTex, u.uState);
  // The key light wanders slowly, so the glints move across the field.
  gl.uniform2f(u.uKeyC, L.key[0] + 0.1 * Math.sin(drift * 0.11), L.key[1] + 0.06 * Math.sin(drift * 0.083 + 1.3));
  gl.uniform1f(u.uKeyA, L.keyA + 0.12 * Math.sin(drift * 0.07));
  gl.uniform2fv(u.uFillC, L.fill);
  gl.uniform3fv(u.uA, linFit(...F.a));
  gl.uniform3fv(u.uB, linFit(...F.b));
  gl.uniform3fv(u.uCloth, linFit(0.12, 0.012, 300));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // Two blur sizes give a tight glint and a wide bloom.
  quad(bl[0], P.bright); bind(0, frame.tex, P.bright.u.uSrc); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  blur(bl);
  quad(wd[0], P.bright); bind(0, bl[0].tex, P.bright.u.uSrc); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  blur(wd); blur(wd);
  quad(null, P.out);
  bind(0, frame.tex, P.out.u.uSrc); bind(1, bl[0].tex, P.out.u.uBloom); bind(2, wd[0].tex, P.out.u.uWide);
  gl.uniform2f(P.out.u.uRes, W, H);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- loop ---------- */
let raf = 0, last = 0, visible = true, lastInput = performance.now(), rate = 1;
// Lively frames run at full rate; drifting frames at 30 fps.
const lively = () => !!press || active.size > 0 || pend.length > 0;
function frameFn(now) {
  raf = 0;
  const live = lively();
  if (!live && last && now - last < 31) { raf = requestAnimationFrame(frameFn); return; }
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
  last = now;
  let more = false;
  try { more = step(dt, now); render(); }
  finally {
    if (visible && (live || more || lively())) raf = requestAnimationFrame(frameFn);
    else kit.rest(() => !raf);
  }
}
function wake() { if (visible && ready && !raf) { last = 0; raf = requestAnimationFrame(frameFn); } }
// Any input wakes the loop and resets the sleep clock.
function poke() { lastInput = performance.now(); rate = 1; wake(); }

function step(dt, now) {
  t += dt;
  // After a minute without input, the drift eases to a stop over 2 s.
  rate = clamp(1 - ((now - lastInput) / 1000 - 60) / 2);
  if (!reduce) drift += dt * rate;
  if (press && press.kind === 'press' && now - press.t0 > 260) press.kind = 'hold';
  while (pend.length && pend[0].at <= t) { const p = pend.shift(); flip(p.k, 0, grid.cx(p.k)); }
  springs(dt);
  ticks();
  if (lively()) watchdog(dt);
  return rate > 0 && !reduce;
}

/* ---------- performance ---------- */
// Slow frames step quality down one rung; it never steps back up.
let runT = 0, avg = 1 / 60, slowT = 0, rung = 0;
function watchdog(dt) {
  if (!dt || rung >= 2) return;
  runT += dt;
  avg = lerp(avg, dt, 0.1);
  if (runT < 4) return;
  slowT = avg > 1 / 38 ? slowT + dt : 0;
  if (slowT > 2) { rung++; slowT = 0; resize(true); }
}

/* ---------- size ---------- */
function fit() {
  if (!rung) return fitCanvas(canvas, { budget: 2.2e6 });
  // On High the first rung falls back to Standard, not to 1x.
  return quality() === 'high' ? fitCanvas(canvas, { budget: 2.2e6, quality: 'standard' }) : fitCanvas(canvas, { budget: 2.2e6, maxDpr: 1 });
}
function resize(force = false) {
  const f = fit();
  if (f.W === W && f.H === H && frame && !force) return;
  W = f.W; H = f.H;
  [...bl, ...wd].forEach(drop); if (frame) drop(frame);
  frame = target(W, H);
  const sh = rung >= 2 ? 3 : 2;
  const bw = Math.max(1, W >> sh), bh = Math.max(1, H >> sh);
  bl = [target(bw, bh), target(bw, bh)];
  wd = [target(Math.max(1, bw >> 2), Math.max(1, bh >> 2)), target(Math.max(1, bw >> 2), Math.max(1, bh >> 2))];
  regrid(layout());
  render();
  wake();
}

/* ---------- sound ---------- */
// Arrows and Space stroke the field, so they count as gestures.
const kit = audioKit({ keys: new Set([' ', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']) });
let V = null, T = null, toneLoad = null, queue = [], rr = 0;
const LEAD = 0.005;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// The first live call loads Tone; voices answer once it lands.
function voices() {
  if (!kit.live()) return null;
  if (V) return V;
  toneLoad ||= kit.tone().then(m => {
    toneLoad = null;
    if (m && !V) { T = m; V = buildVoices(); }
  });
  return null;
}
// Four voices take the ticks in turn: a hiss of metal and a tiny ping.
function buildVoices() {
  return Array.from({ length: 4 }, () => {
    const pan = new T.Panner(0).connect(kit.out);
    const bp = new T.Filter({ type: 'bandpass', Q: 1.4, frequency: 6000 }).connect(pan);
    const hiss = new T.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.0008, decay: 0.022, sustain: 0, release: 0.01 }, volume: -6 }).connect(bp);
    const ping = new T.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.0005, decay: 0.035, sustain: 0, release: 0.02 }, volume: -24 }).connect(pan);
    return { pan, bp, hiss, ping };
  });
}
// Each flip queues one tick; a frame plays a few, spread over the frame.
function tick(x, to, level) {
  if (queue.length < 48) queue.push([x, to, level]);
}
function ticks() {
  if (!queue.length) return;
  const v = voices(), q = queue;
  queue = [];
  if (!v) return;
  const S = Math.min(W, H), half = W / S / 2;
  // A burst of flips plays as a few louder ticks, never as a wall.
  const n = Math.min(q.length, 4), boost = Math.min(1.6, 0.7 + q.length * 0.08);
  for (let i = 0; i < n; i++) {
    const [x, to, level] = q[(Math.random() * q.length) | 0];
    const s = v[rr++ % v.length], tt = kit.ac.currentTime + LEAD + i * 0.011 * jit(0.5);
    s.pan.pan.setValueAtTime(clamp(x / half, -1, 1) * 0.7, tt);
    s.bp.frequency.setValueAtTime((to ? 6800 : 5000) * jit(0.25), tt);
    s.hiss.triggerAttackRelease(0.02, tt, clamp(0.5 * level * boost * jit(0.25), 0, 1));
    if (level > 0.5) s.ping.triggerAttackRelease((to ? 3900 : 3100) * jit(0.12), 0.03, tt + 0.002, 0.4 * jit(0.3));
  }
}

/* ---------- input ---------- */
let press = null, keyAt = [0, 0];
// Pointer position in short-side units, origin at the stage centre.
const at = e => { const r = canvas.getBoundingClientRect(), S = Math.min(r.width, r.height); return [(e.clientX - r.left - r.width / 2) / S, (r.top + r.height / 2 - e.clientY) / S]; };
// The stroke direction is a running average, so a wobble does not flip it.
function strokeTo(p) {
  const dx = p[0] - press.x, dy = p[1] - press.y;
  press.vx = lerp(press.vx, dx, 0.35); press.vy = lerp(press.vy, dy, 0.35);
  const dir = press.vy > 0.35 * Math.abs(press.vx) ? 1 : press.vy < -0.35 * Math.abs(press.vx) ? 0 : -1;
  sweep(press.x, press.y, p[0], p[1], brushR(), dir);
  press.x = p[0]; press.y = p[1];
}
stage.addEventListener('pointerdown', e => {
  if (e.button > 0 || press || !grid) return;
  try { stage.setPointerCapture(e.pointerId); } catch { /* capture is optional */ }
  const p = at(e);
  press = { id: e.pointerId, cx: e.clientX, cy: e.clientY, t0: performance.now(), kind: 'press', x: p[0], y: p[1], x0: p[0], y0: p[1], vx: 0, vy: 0 };
  // The press lifts the sequins under the brush at once.
  sweep(p[0], p[1], p[0], p[1], brushR() * 0.6, -1);
  poke();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  if (press.kind !== 'drag' && Math.hypot(e.clientX - press.cx, e.clientY - press.cy) > 8) press.kind = 'drag';
  if (press.kind !== 'drag') return;
  // Coalesced moves keep fast strokes smooth; an empty list falls back to the event.
  const list = e.getCoalescedEvents?.();
  for (const c of list?.length ? list : [e]) strokeTo(at(c));
  poke();
});
// A tap toggles the few sequins under the brush tip.
function tapAt(x, y) {
  const g = grid, R = brushR() * 0.45;
  for (let k = 0; k < g.tg.length; k++) {
    const dx = g.cx(k) - x, dy = g.cy(k) - y;
    if (dx * dx + dy * dy <= R * R) flip(k, g.tg[k] ? 0 : 1, g.cx(k));
  }
}
const end = e => {
  if (!press || (e && e.pointerId !== press.id)) return;
  if (press.kind === 'press') tapAt(press.x0, press.y0);
  press = null;
  poke();
};
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);
// Arrows stroke from a resting point; the stroke direction sets the face.
const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] };
stage.addEventListener('keydown', e => {
  const mv = ARROWS[e.key];
  if (!grid) return;
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (!e.repeat) tapAt(keyAt[0], keyAt[1]);
    poke();
  } else if (mv) {
    e.preventDefault();
    const L = layout(), s = grid.d * 1.2;
    const nx = clamp(keyAt[0] + mv[0] * s, -L.ax / 2, L.ax / 2), ny = clamp(keyAt[1] + mv[1] * s, -L.ay / 2, L.ay / 2);
    sweep(keyAt[0], keyAt[1], nx, ny, brushR(), mv[1] > 0 ? 1 : mv[1] < 0 ? 0 : -1);
    keyAt = [nx, ny];
    poke();
  }
});

/* ---------- bar ---------- */
function popover(box, btn) {
  const set = on => { box.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!box.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
const brushEl = document.getElementById('brush');
brushEl.value = String(opts.brush);
brushEl.addEventListener('input', () => { opts.brush = +brushEl.value; save('brush', opts.brush); });
choices(document.getElementById('faces'), v => { opts.faces = v; save('faces', v); render(); poke(); }).set(opts.faces);
document.getElementById('clear').addEventListener('click', () => { if (grid) { clearAll(); poke(); } });

/* ---------- start ---------- */
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => { rung = 0; resize(true); });
resize();
gl.finish();
ready = true;
markReady();
requestAnimationFrame(() => canvas.classList.add('on'));
whenVisible(stage, v => {
  visible = v;
  if (v) wake();
  else if (raf) { cancelAnimationFrame(raf); raf = 0; }
});
// After the intro, the head of the first stroke finishes its flip.
Promise.race([introDone, wait(9000)]).then(() => wait(250)).then(() => {
  hero.forEach(k => { grid.v[k] = reduce ? 0 : 3; active.add(k); });
  hero = [];
  poke();
});
wake();
</script>
</body>
</html>
