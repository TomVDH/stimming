<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.11 0.006 70); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wave machine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./sim.js">
<link rel="modulepreload" href="./scene.js">
<link rel="modulepreload" href="./sound.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">
<style>
/* Wave machine: flick a rod; the twist wave runs out and bounces back. */
:root { --stage: oklch(0.11 0.006 70); }
.stage--wavemachine { background: var(--stage); cursor: grab; }
.stage--wavemachine canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--wavemachine canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--wavemachine canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Wave machine</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--wavemachine" id="stage" tabindex="0" role="application" aria-label="A torsion wave machine on a black lab bench: a long row of steel rods with brass weights at their ends, each fixed at its middle across one taut wire. Drag a rod end up or down to turn it; click or flick a rod to send a pulse. The pulse runs down the line, comes back upside down from the clamp at the far end, and slowly dies away. Space flicks the first rod; R brings the line to rest.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Wave machine</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
