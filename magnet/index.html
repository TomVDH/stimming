  mark.rotation.x = -Math.PI / 2;
  mark.visible = false;
  scene.add(mark);

  panel.prepend(canvas);
  fitRenderer(renderer, panel, 1.5, (w, h) => {
    fit(w, h);
    if (ready) { draw(); wake(); }
  }, 1.4e6);
  // A panel with no size yet still gets walls.
  if (!walls.length) fit(16, 9);
  await idle();
  seed();
  aim = pick(...at(0, 0), Infinity);
  // Async compile keeps the physical-material build off the main thread.
  await renderer.compileAsync(scene, camera);
  ready = true;
  draw();
  requestAnimationFrame(() => canvas.classList.add('on'));
}
start().catch(err => { console.error(err); failed(); });
</script>
</body>
</html>
