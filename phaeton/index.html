<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.3 0.06 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phaeton</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">
<style>
/* Phaeton: a rail gun diorama on a salt slab, fired sideways through a row of targets. */
:root { --stage: oklch(0.3 0.06 265); }
.stage--phaeton canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--phaeton canvas.on { opacity: 1; }
.stage--phaeton { cursor: crosshair; }
@media (prefers-reduced-motion: reduce) { .stage--phaeton canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Phaeton</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--phaeton" id="stage" tabindex="0" role="application" aria-label="A rail gun on a salt slab, seen from the side, aimed along a row of six targets. Click the rack to load a slug, pull the breech lever to lock it, hold to charge and release to fire. The slug goes through the targets in slow motion. L loads, K locks, Space charges and fires, S shuffles the row.">
      <p class="fail" hidden>Phaeton needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Phaeton</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, whenVisible, pixelRatio, onQuality, reduced, onReducedChange, linFit, stage as mark, pageReady } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { gsap } from 'gsap';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const stage = document.getElementById('stage');
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const col = (L, C, h) => new THREE.Color().setRGB(...linFit(L, C, h), THREE.LinearSRGBColorSpace);

playIntro({ ready: pageReady(9000) });
mark('build');

/* ---------- the diorama ---------- */
// Units are metres. The lane runs along +x; the camera looks from +z.
const BORE = 1.3;
const SLAB = { x0: -17, x1: 12.6, z: 3.5, salt: 1.2, plinth: 1.5 };
const RACK_X = -15.2, TRAY_X = -12.4, MUZZLE = -6, BACK_X = 10.4;
const SLOTS = [-3.6, -1.2, 1.2, 3.6, 6, 8.4];
// The slug speed is in sim metres per second.
const SPEED = 380, CHARGE_TIME = 2.5, MIN_HOLD = 0.15, REFILL = 4;
const onSlab = (x, z) => x > SLAB.x0 && x < SLAB.x1 && Math.abs(z) < SLAB.z;

/* ---------- bar ---------- */
let camMode = 'track', dustOn = true, slowmo = 0.35;
const MODES = ['range', 'corridor', 'aquarium', 'depth'];
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let mode = MODES.includes(store.get('stimming.phaeton.mode')) ? store.get('stimming.phaeton.mode') : 'range';
// The handlers bind once the scene exists.
const act = { load() {}, lock() {}, down() {}, up() {}, shuffle() {}, reset() {}, mode() {} };
const ui = initPage({ id: 'phaeton', bar: {
  choice: { label: 'Mode', value: mode, options: [
    { value: 'range', label: 'Range', key: '1' },
    { value: 'corridor', label: 'Corridor', key: '2' },
    { value: 'aquarium', label: 'Aquarium', key: '3' },
    { value: 'depth', label: 'Depth', key: '4' },
  ], onPick: v => act.mode(v) },
  actions: [
    { verb: 'load', key: 'L', onPress: () => act.load() },
    { verb: 'lock', key: 'K', onPress: () => act.lock() },
    { verb: 'fire', key: 'Space', hold: true, onDown: () => act.down(), onUp: () => act.up() },
  ],
  // Slow-mo sets the bullet-time scale, from 1/8 to 1/100.
  slider: { label: 'Slow-mo', min: 0, max: 1, step: 0.01, value: 0.35, persist: true, onInput: v => { slowmo = v; } },
  settings: [
    { type: 'choice', id: 'camera', label: 'Camera', value: 'track', persist: true,
      options: [{ value: 'track', label: 'Track' }, { value: 'fixed', label: 'Fixed' }], onPick: v => { camMode = v; } },
    { type: 'toggle', id: 'dust', label: 'Dust', value: true, persist: true, onToggle: v => { dustOn = v; } },
  ],
  reset: () => act.reset(),
  quality: true,
  keys: [['click', 'rack, lever'], ['hold', 'charge'], ['release', 'fire'], ['S', 'shuffle']],
} });
camMode = ui.setting('camera')?.value ?? camMode;
dustOn = ui.setting('dust')?.value ?? dustOn;
slowmo = ui.slider?.value ?? slowmo;
const timeSlow = () => 1 / (8 + 92 * slowmo);

/* ---------- renderer ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  ui.hideControls?.();
  mark('first-frame');
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const canvas = renderer.domElement;
stage.prepend(canvas);

const HORIZON = col(0.74, 0.12, 52), ZENITH = col(0.3, 0.09, 268), GLOW = col(0.84, 0.15, 62), VOID = col(0.22, 0.05, 280);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(20, 1, 0.5, 1500);

/* ---------- lens and grade ---------- */
// Bloom on the hot parts, a tilt-shift blur that sells the miniature, then a film grade.
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.7, 0.5, 1.6);
composer.addPass(bloom);
const POST_VS = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }';
const TILTSHIFT = {
  uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uRes: { value: new THREE.Vector2(1, 1) }, uFocus: { value: 0.45 }, uBand: { value: 0.1 }, uMax: { value: 7 } },
  vertexShader: POST_VS,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform vec2 uDir, uRes; uniform float uFocus, uBand, uMax; varying vec2 vUv;
    void main() {
      // Blur grows with distance from the focus band, as a tilted lens does.
      float r = uMax * smoothstep(uBand, uBand + 0.32, abs(vUv.y - uFocus));
      vec4 c = vec4(0.0); float w = 0.0;
      for (int i = -4; i <= 4; i++) {
        float k = exp(-float(i * i) / 8.0);
        c += texture2D(tDiffuse, vUv + uDir * float(i) * r / uRes) * k;
        w += k;
      }
      gl_FragColor = c / w;
    }`,
};
const tiltH = new ShaderPass(TILTSHIFT), tiltV = new ShaderPass(TILTSHIFT);
tiltV.uniforms.uDir.value.set(0, 1);
composer.addPass(tiltH);
composer.addPass(tiltV);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(1, 1) }, uTime: { value: 0 } },
  vertexShader: POST_VS,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uTime; varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      // A warm print stock: lifted shadows, golden mids, a soft vignette, fine grain.
      c = c * vec3(1.05, 1.0, 0.92) + vec3(0.006, 0.004, 0.012);
      float v = length((vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0));
      c *= mix(1.0, 0.62, smoothstep(0.35, 1.05, v));
      c += (hash(vUv * uRes + fract(uTime) * 100.0) - 0.5) * 0.035 * (c + 0.04);
      gl_FragColor = vec4(c, 1.0);
    }`,
});
composer.addPass(grade);
composer.addPass(new OutputPass());
const draw = () => { grade.uniforms.uTime.value = performance.now() / 1000; composer.render(); };

/* ---------- sky ---------- */
// The diorama floats in a dusk sky; below the horizon it fades to violet.
const SUN = new THREE.Vector3(-0.7, 0.05, -0.7).normalize();
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uHor: { value: HORIZON }, uZen: { value: ZENITH }, uGlow: { value: GLOW }, uVoid: { value: VOID }, uSun: { value: SUN } },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position.z = gl_Position.w; }`,
  fragmentShader: /* glsl */`
    uniform vec3 uHor, uZen, uGlow, uVoid, uSun;
    varying vec3 vDir;
    void main() {
      float y = vDir.y;
      vec3 c = mix(uHor, uZen, pow(smoothstep(0.0, 0.55, max(y, 0.0)), 0.6));
      c = mix(c, uVoid, smoothstep(0.0, -0.35, y));
      float s = max(dot(normalize(vec3(vDir.x, 0.0, vDir.z)), normalize(vec3(uSun.x, 0.0, uSun.z))), 0.0);
      c += uGlow * pow(s, 5.0) * exp(-abs(y) * 8.0) * 0.8;
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
scene.add(sky);
// The sky lights the bare metal by reflection.
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new THREE.Scene().add(sky.clone()), 0.02).texture;
  scene.environmentIntensity = 0.7;
  pmrem.dispose();
}

/* ---------- light ---------- */
const hemi = new THREE.HemisphereLight(col(0.66, 0.06, 255), col(0.6, 0.06, 40), 1.0);
scene.add(hemi);
// A low sun from the front left rakes the slab and throws long shadows right.
const sun = new THREE.DirectionalLight(col(0.88, 0.1, 60), 2.2);
sun.position.set(-38, 11, 26);
sun.target.position.set(0, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 14, bottom: -14, near: 1, far: 120 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
// The muzzle flash lights the slab and the targets for a moment.
const flash = new THREE.PointLight(col(0.9, 0.08, 230), 0, 30, 1.6);
flash.position.set(MUZZLE + 0.8, BORE + 0.5, 0.8);
scene.add(flash);

/* ---------- textures ---------- */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
// A periodic Voronoi tile draws the hexagon crust of a salt flat.
function crustTile(N = 256, cells = 6) {
  const pts = [];
  for (let j = 0; j < cells; j++) for (let i = 0; i < cells; i++) pts.push([(i + rnd(0.2, 0.8)) / cells, (j + rnd(0.2, 0.8)) / cells]);
  const t = canvasTex(N, N, (g) => {
    const img = g.createImageData(N, N);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const u = x / N, v = y / N;
      let f1 = 9, f2 = 9;
      for (const [px, py] of pts) {
        let dx = Math.abs(u - px), dy = Math.abs(v - py);
        dx = Math.min(dx, 1 - dx); dy = Math.min(dy, 1 - dy);
        const d = Math.hypot(dx, dy);
        if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
      }
      // Ridges rise where two cells meet.
      const e = (f2 - f1) * cells, k = (Math.exp(-e * e * 70) * 255) | 0, o = (y * N + x) * 4;
      img.data[o] = img.data[o + 1] = img.data[o + 2] = k; img.data[o + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
  t.colorSpace = THREE.NoColorSpace;
  return t;
}
// The cut faces show strata: crust, mud and clay bands.
function strataTex(len) {
  const t = canvasTex(1024, 128, (g, w, h) => {
    const bands = [[0, 0.08, '#efeae2'], [0.08, 0.2, '#cfc6b8'], [0.2, 0.34, '#a59a8a'], [0.34, 0.4, '#d9d1c4'], [0.4, 0.62, '#8c7d6c'], [0.62, 0.7, '#b9ad9b'], [0.7, 1, '#6f6255']];
    for (const [a, b, c] of bands) { g.fillStyle = c; g.fillRect(0, a * h, w, (b - a) * h + 1); }
    // Wavy seams and grit break the bands.
    for (let i = 0; i < 2600; i++) {
      const v = Math.random() < 0.5 ? 255 : 0;
      g.fillStyle = `rgba(${v},${v},${v},${rnd(0.03, 0.1)})`;
      g.fillRect(Math.random() * w, Math.random() * h, rnd(1, 6), rnd(1, 2));
    }
  });
  t.repeat.set(len / 9, 1);
  return t;
}
const crust = crustTile();

/* ---------- slab and plinth ---------- */
{
  const L = SLAB.x1 - SLAB.x0, D = SLAB.z * 2;
  crust.repeat.set(L / 2.6, D / 2.6);
  const top = new THREE.MeshStandardMaterial({ color: col(0.95, 0.012, 70), roughness: 0.95, bumpMap: crust, bumpScale: 1.4 });
  const side = new THREE.MeshStandardMaterial({ map: strataTex(L), roughness: 1 });
  const end = new THREE.MeshStandardMaterial({ map: strataTex(D), roughness: 1 });
  const dark = new THREE.MeshStandardMaterial({ color: col(0.16, 0.01, 280), roughness: 0.7, metalness: 0.1 });
  const slab = new THREE.Mesh(new THREE.BoxGeometry(L, SLAB.salt, D), [end, end, top, dark, side, side]);
  slab.position.set((SLAB.x0 + SLAB.x1) / 2, -SLAB.salt / 2, 0);
  slab.receiveShadow = true;
  // The plinth is a dark museum base, set in from the slab edge.
  const plinth = new THREE.Mesh(new RoundedBoxGeometry(L - 0.8, SLAB.plinth, D - 0.8, 2, 0.08), dark);
  plinth.position.set(slab.position.x, -SLAB.salt - SLAB.plinth / 2, 0);
  scene.add(slab, plinth);
}

/* ---------- materials ---------- */
// Atomic-age proving ground: enamel paint, chrome, Bakelite, copper.
const enamel = (c, r = 0.32) => new THREE.MeshPhysicalMaterial({ color: c, roughness: r, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.12 });
const PAL = { cream: col(0.93, 0.035, 90), seafoam: col(0.74, 0.085, 180), cherry: col(0.56, 0.19, 25), mustard: col(0.8, 0.14, 85), bakelite: col(0.32, 0.06, 45) };
const steel = new THREE.MeshStandardMaterial({ color: col(0.36, 0.012, 250), roughness: 0.5, metalness: 0.65 });
const steelLight = new THREE.MeshStandardMaterial({ color: col(0.58, 0.01, 250), roughness: 0.35, metalness: 0.8 });
const chrome = new THREE.MeshStandardMaterial({ color: col(0.92, 0.005, 250), roughness: 0.1, metalness: 1 });
const paint = enamel(PAL.mustard, 0.4);
const cream = enamel(PAL.cream), seafoam = enamel(PAL.seafoam), cherry = enamel(PAL.cherry, 0.28), bakelite = enamel(PAL.bakelite, 0.3);
const ceramic = new THREE.MeshStandardMaterial({ color: col(0.86, 0.02, 85), roughness: 0.45 });
const copper = new THREE.MeshStandardMaterial({ color: col(0.62, 0.12, 50), roughness: 0.3, metalness: 0.95, emissive: new THREE.Color(0) });
const black = new THREE.MeshStandardMaterial({ color: col(0.14, 0.005, 250), roughness: 0.6 });
const add = (parent, geo, mat, x, y, z, shadow = true) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m);
  return m;
};
const bx = (w, h, d, r = 0) => (r ? new RoundedBoxGeometry(w, h, d, 2, r) : new THREE.BoxGeometry(w, h, d));
const cylX = (r, len, seg = 20) => new THREE.CylinderGeometry(r, r, len, seg).rotateZ(Math.PI / 2);
// A ring round the x axis.
const ringX = (r, tube) => new THREE.TorusGeometry(r, tube, 10, 40).rotateY(Math.PI / 2);
// A lathe along x from a list of [x, radius] points.
const latheX = pts => new THREE.LatheGeometry(pts.map(([x, r]) => new THREE.Vector2(r, x)), 48).rotateZ(-Math.PI / 2);
// Hazard stripes for crane beams and the backstop band.
const hazardTex = canvasTex(256, 64, (g, w, h) => {
  g.fillStyle = '#e8b725'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#1d1a16';
  for (let x = -h; x < w + h; x += 48) { g.beginPath(); g.moveTo(x, h); g.lineTo(x + 24, h); g.lineTo(x + 24 + h, 0); g.lineTo(x + h, 0); g.fill(); }
});
function hazardMat(len) {
  const t = hazardTex.clone();
  t.needsUpdate = true;
  t.repeat.set(len / 1.2, 1);
  const m = enamel(new THREE.Color(1, 1, 1), 0.45);
  m.map = t;
  return m;
}

/* ---------- the gun ---------- */
const gun = new THREE.Group();
scene.add(gun);
// The barrel is a streamlined seafoam nacelle with chrome rings and a flared muzzle.
const NOSE = TRAY_X + 0.42;
add(gun, latheX([[NOSE, 0.001], [NOSE, 0.3], [NOSE + 0.25, 0.4], [NOSE + 1.2, 0.43], [MUZZLE - 1.2, 0.38], [MUZZLE - 0.45, 0.3], [MUZZLE - 0.45, 0.001]]), seafoam, 0, BORE, 0);
add(gun, latheX([[MUZZLE - 0.5, 0.001], [MUZZLE - 0.5, 0.26], [MUZZLE - 0.2, 0.3], [MUZZLE, 0.44], [MUZZLE + 0.02, 0.44], [MUZZLE + 0.02, 0.18], [MUZZLE - 0.3, 0.12]]), chrome, 0, BORE, 0);
for (const x of [NOSE + 0.6, NOSE + 1.7, NOSE + 2.8, NOSE + 3.9, MUZZLE - 0.8]) add(gun, ringX(0.425, 0.03), chrome, x, BORE, 0);
add(gun, ringX(0.31, 0.035), cherry, MUZZLE - 0.42, BORE, 0);
// Coil portholes along the camera side glow with the charge.
const ports = [];
for (let i = 0; i < 5; i++) {
  const x = NOSE + 1.15 + i * 1.1;
  const p = new THREE.Group();
  p.position.set(x, BORE, 0.39);
  add(p, new THREE.TorusGeometry(0.1, 0.022, 10, 28), chrome, 0, 0, 0.02);
  const m = new THREE.MeshBasicMaterial({ color: new THREE.Color(), toneMapped: false });
  add(p, new THREE.CircleGeometry(0.09, 28), m, 0, 0, 0.012, false);
  gun.add(p);
  ports.push(m);
}
// A cherry tail fin rides on top of the breech end.
{
  const s = new THREE.Shape();
  s.moveTo(0, 0); s.lineTo(1.5, 0); s.quadraticCurveTo(0.6, 0.15, 0.1, 0.55); s.lineTo(0, 0);
  const fin = add(gun, new THREE.ExtrudeGeometry(s, { depth: 0.04, bevelEnabled: true, bevelSize: 0.012, bevelThickness: 0.012, bevelSegments: 2 }), cherry, NOSE + 0.15, BORE + 0.36, -0.02);
  fin.rotation.y = 0;
}
// Twin copper rails run outside the nacelle on chrome standoffs.
const rails = [];
const railLen = MUZZLE - NOSE - 0.9;
for (const s of [-1, 1]) {
  rails.push(add(gun, cylX(0.032, railLen, 12), copper, NOSE + 0.55 + railLen / 2, BORE + s * 0.22, 0.44, false));
  for (let x = NOSE + 0.7; x < MUZZLE - 0.5; x += 1.1) add(gun, bx(0.05, 0.05, 0.1), chrome, x, BORE + s * 0.22, 0.4, false);
}
// Two mustard cradles with chrome rams hold the barrel.
for (const x of [NOSE + 1.1, MUZZLE - 1.5]) {
  const saddle = add(gun, new THREE.TorusGeometry(0.46, 0.05, 8, 24, Math.PI), paint, x, BORE, 0);
  saddle.rotation.set(0, Math.PI / 2, Math.PI);
  for (const z of [-1, 1]) {
    const leg = add(gun, bx(0.14, BORE - 0.2, 0.12, 0.03), paint, x, (BORE - 0.2) / 2, z * 0.42);
    leg.rotation.x = z * 0.2;
  }
  add(gun, bx(0.6, 0.1, 1.3, 0.04), paint, x, 0.05, 0);
  const ram = add(gun, new THREE.CylinderGeometry(0.035, 0.035, 0.95, 12), chrome, x - 0.35, 0.55, 0.25);

    G.blink[i] = Math.max(0, G.blink[i] - dt);
    if (G.blink[i] > 0) m.color.copy(Math.floor(G.blink[i] * 10) % 2 ? LAMP.no : LAMP.off);
    else if (i === 2 && G.s === 'charging') m.color.copy(c >= 1 ? LAMP.ok : LAMP.live).multiplyScalar(c >= 1 ? 1 : 0.4 + 0.6 * Math.abs(Math.sin(performance.now() / 120)));
    else m.color.copy(st[i] ? LAMP.ok : ask === i ? LAMP.ask : LAMP.off);
  });
  // The part that takes the next step glows under the pointer.
  knobMat.emissive.copy(hover === 'lever' && G.s === 'loaded' ? col(0.6, 0.2, 28) : new THREE.Color(0));
  bandMat.emissive.copy(hover === 'rack' && G.s === 'empty' ? col(0.6, 0.12, 50) : new THREE.Color(0));
  placeGun();
  flashT += dt;
  flash.intensity = reduced() || flashT < 0 ? 0 : 90 * Math.exp(-flashT / 0.07);

  // The sim clock runs at the time scale; bullet time is one number.
  if (shot.phase === 'snap') timeScale = Math.min(1, timeScale + dt / 0.15);
  const h = frozen ? 0 : dt * timeScale;
  if (shot.phase === 'flight') {
    const from = shot.x;
    shot.x = Math.min(shot.x + SPEED * h, shot.stopX);
    const ka = aimAt(shot.x);
    tankTrail(from, shot.x, BORE + shot.aim.y * ka, shot.aim.x * ka);
    while (shot.next < shot.events.length && shot.x >= shot.events[shot.next].x) hitEvent(shot.events[shot.next++]);
    if (shot.x >= shot.stopX) { shot.x = shot.stopX; shot.phase = 'hold'; shot.hold = 0; }
    if (qaAt?.x != null && shot.x >= qaAt.x) { frozen = true; qaAt = null; }
  } else if (shot.phase === 'hold') {
    if (!frozen) shot.hold += dt;
    if (shot.hold > 0.35) { shot.phase = 'snap'; tankBurst(); }
  } else if (shot.phase === 'snap' && timeScale >= 1) {
    shot.phase = 'after'; shot.after = 0;
    if (G.s === 'fired') unlock();
    if (mode === 'depth') depthResult(shot.stopX);
  } else if (shot.phase === 'after') {
    if (qaAt?.t != null && shot.after >= qaAt.t) { frozen = true; qaAt = null; }
    if (!frozen) shot.after += dt;
    if (shot.after > REFILL) refill();
  }
  const k = aimAt(shot.x);
  slug.position.set(shot.x, BORE + shot.aim.y * k, shot.aim.x * k);
  // The slug shows once it leaves the barrel.
  slug.visible = (shot.phase === 'flight' || shot.phase === 'hold') && shot.x > MUZZLE - 0.2;
  trail.scale.x = clamp((shot.x - MUZZLE) / 4, 0.05, 1) * 1.2;

  // The row drops in after a refill.
  let dropping = false;
  for (const t of row) {
    if (t.drop < 1) {
      t.drop = Math.min(1, t.drop + dt / 0.55);
      const q = clamp(t.drop);
      // A falling ease with one small bounce.
      const y = q < 0.75 ? 1 - (q / 0.75) ** 2 : 0.06 * Math.sin((q - 0.75) / 0.25 * Math.PI);
      t.g.position.y = y * 6;
      dropping = true;
    }
  }
  if (shot.phase === 'refill') {
    // Old debris shrinks away while the new row lands.
    fadeT += dt;
    const f = clamp(1 - fadeT / 0.4);
    for (const s of sets) s.fade = f;
    for (const s of puffSets) s.mat.uniforms.uFade.value = f;
    stains.mesh.material.opacity = 0.7 * f;
    if (f <= 0) {
      clearDebris();
      for (const s of sets) s.fade = 1;
      for (const s of puffSets) s.mat.uniforms.uFade.value = 1;
      stains.mesh.material.opacity = 0.7;
    }
    if (!dropping && f <= 0) shot.phase = 'idle';
  }
  const hs = shot.phase === 'refill' ? 0 : h;
  let moving = false;
  for (const s of sets) moving = s.step(hs) || moving;
  let steaming = false;
  for (const s of puffSets) steaming = s.step(hs) || steaming;
  if (shot.phase === 'refill') moving = steaming = false;
  const tumbling = stepKnocked(h) || stepRings(hs);
  const warm = coolGlows(dt);

  // The track camera follows the slug in bullet time.
  const ride = camMode === 'track' && !reduced() && (shot.phase === 'flight' || shot.phase === 'hold');
  camBlend += ((ride ? 1 : 0) - camBlend) * (1 - Math.exp(-dt / (ride ? 0.2 : 0.35)));
  if (Math.abs(camBlend - (ride ? 1 : 0)) < 0.002) camBlend = ride ? 1 : 0;
  placeCamera();

  const blinking = G.blink.some(b => b > 0);
  // The focus band follows the view: the slab, or the slug when tracking.
  for (const p of [tiltH, tiltV]) {
    p.uniforms.uFocus.value = lerp(narrow ? 0.5 : 0.47, 0.52, camBlend);
    p.uniforms.uBand.value = lerp(narrow ? 0.06 : 0.09, 0.16, camBlend);
    p.uniforms.uMax.value = (narrow ? 4 : 7) * size.dpr;
  }
  return spinning || shot.phase !== 'idle' || G.busy > 0 || G.s === 'charging' || blinking || dropping || moving || steaming || tumbling || warm || camBlend > 0 || flashT < 0.5;
}

/* ---------- camera ---------- */
let size = { w: 1, h: 1, dpr: 1 }, narrow = false;
const fixedPos = new THREE.Vector3(), fixedLook = new THREE.Vector3();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
const CX = (SLAB.x0 + SLAB.x1) / 2, HALF_W = 15.6, TILT = 15 * Math.PI / 180;
function frameShot() {
  const asp = size.w / size.h;
  narrow = asp < 0.9;
  camera.aspect = asp;
  camera.fov = narrow ? 44 : 20;
  // The distance fits the whole diorama across the frame.
  const hf = Math.atan(Math.tan(camera.fov * Math.PI / 360) * asp);
  const d = HALF_W / Math.tan(hf);
  fixedLook.set(CX, narrow ? 0.2 : 0.9, 0);
  fixedPos.set(CX, fixedLook.y + d * Math.sin(TILT), d * Math.cos(TILT));
  camera.far = d + 1000;
  camera.updateProjectionMatrix();
  const scale = size.h * size.dpr / (2 * Math.tan(camera.fov * Math.PI / 360));
  for (const s of puffSets) s.mat.uniforms.uScale.value = scale;
}
function placeCamera() {
  const x = shot.x;
  camPos.set(lerp(fixedPos.x, x + 0.4, camBlend), lerp(fixedPos.y, BORE + 1.6, camBlend), lerp(fixedPos.z, 13, camBlend));
  camLook.set(lerp(fixedLook.x, x + 1.4, camBlend), lerp(fixedLook.y, BORE, camBlend), lerp(fixedLook.z, 0, camBlend));
  camera.position.copy(camPos);
  camera.lookAt(camLook);
}
function resize() {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  size = { w, h, dpr: pixelRatio(w, h, { maxDpr: 2, budget: 2.2e6 }) };
  frameShot();
  placeCamera();
  renderer.setPixelRatio(size.dpr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(size.dpr);
  composer.setSize(w, h);
  for (const p of [tiltH, tiltV, grade]) p.uniforms.uRes.value.set(w * size.dpr, h * size.dpr);
}

/* ---------- frame loop ---------- */
// The loop runs while anything moves; it sleeps at rest.
let raf = 0, last = 0, visible = !document.hidden, ready = false;
function wake() {
  if (!raf && visible && ready) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(now) {
  raf = 0;
  let again = true;
  try {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    again = step(dt);
    draw();
  } finally {
    if (again && visible) raf = requestAnimationFrame(frame);
  }
}

/* ---------- pointer ---------- */
// The rack and the lever take clicks; anywhere else charges.
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.intersectObject(lever, true).length || ray.intersectObject(block, false).length) return 'lever';
  if (ray.intersectObject(rack, true).length) return 'rack';
  return null;
}
let pointerId = null;
canvas.addEventListener('pointermove', e => {
  if (pointerId !== null || e.pointerType !== 'mouse') return;
  const p = pick(e);
  if (p === hover) return;
  hover = p;
  stage.style.cursor = p ? 'pointer' : '';
  wake();
});
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0 || pointerId !== null) return;
  const p = pick(e);
  if (p === 'rack') { load(); return; }
  if (p === 'lever') { lock(); return; }
  pointerId = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  startCharge();
});
const up = e => {
  if (e.pointerId !== pointerId) return;
  pointerId = null;
  release();
};
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
canvas.addEventListener('lostpointercapture', up);
canvas.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.('input, textarea, select')) return;
  if (e.key === 's' || e.key === 'S') act.shuffle();
});

/* ---------- ready ---------- */
buildMode(false);
placeGun();
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  ready = true;
  mark('first-frame');
}, () => { canvas.classList.add('on'); ready = true; mark('first-frame'); });

new ResizeObserver(() => { resize(); if (ready) draw(); }).observe(stage);
onQuality(() => { resize(); if (ready) draw(); });
onReducedChange(() => wake());
// A hidden tab stops the loop and the sim clock with it.
whenVisible(stage, v => {
  visible = v;
  if (!v) { cancelAnimationFrame(raf); raf = 0; return; }
  wake();
});
</script>
</body>
</html>
