<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.3 0.06 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phaeton</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">
<style>
/* Phaeton: a rail gun diorama on a salt slab, fired sideways through a row of targets. */
:root { --stage: oklch(0.3 0.06 265); }
.stage--phaeton canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--phaeton canvas.on { opacity: 1; }
.stage--phaeton { cursor: crosshair; }
@media (prefers-reduced-motion: reduce) { .stage--phaeton canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Phaeton</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--phaeton" id="stage" tabindex="0" role="application" aria-label="A rail gun on a salt slab, seen from the side, aimed along a row of six targets. Click the rack to load a slug, pull the breech lever to lock it, hold to charge and release to fire. The slug goes through the targets in slow motion. L loads, K locks, Space charges and fires, S shuffles the row.">
      <p class="fail" hidden>Phaeton needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Phaeton</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, whenVisible, pixelRatio, onQuality, reduced, onReducedChange, linFit, stage as mark, pageReady } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { gsap } from 'gsap';

const stage = document.getElementById('stage');
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const col = (L, C, h) => new THREE.Color().setRGB(...linFit(L, C, h), THREE.LinearSRGBColorSpace);

playIntro({ ready: pageReady(9000) });
mark('build');

/* ---------- the diorama ---------- */
// Units are metres. The lane runs along +x; the camera looks from +z.
const BORE = 1.3;
const SLAB = { x0: -17, x1: 12.6, z: 3.5, salt: 1.2, plinth: 1.5 };
const RACK_X = -15.2, TRAY_X = -12.4, MUZZLE = -6, BACK_X = 10.4;
const SLOTS = [-3.6, -1.2, 1.2, 3.6, 6, 8.4];
// The slug speed is in sim metres per second.
const SPEED = 380, CHARGE_TIME = 2.5, MIN_HOLD = 0.15, REFILL = 4;
const onSlab = (x, z) => x > SLAB.x0 && x < SLAB.x1 && Math.abs(z) < SLAB.z;

/* ---------- bar ---------- */
let camMode = 'track', dustOn = true, slowmo = 0.35;
// The handlers bind once the scene exists.
const act = { load() {}, lock() {}, down() {}, up() {}, shuffle() {}, reset() {} };
const ui = initPage({ id: 'phaeton', bar: {
  actions: [
    { verb: 'load', key: 'L', onPress: () => act.load() },
    { verb: 'lock', key: 'K', onPress: () => act.lock() },
    { verb: 'fire', key: 'Space', hold: true, onDown: () => act.down(), onUp: () => act.up() },
  ],
  // Slow-mo sets the bullet-time scale, from 1/8 to 1/100.
  slider: { label: 'Slow-mo', min: 0, max: 1, step: 0.01, value: 0.35, persist: true, onInput: v => { slowmo = v; } },
  settings: [
    { type: 'choice', id: 'camera', label: 'Camera', value: 'track', persist: true,
      options: [{ value: 'track', label: 'Track' }, { value: 'fixed', label: 'Fixed' }], onPick: v => { camMode = v; } },
    { type: 'toggle', id: 'dust', label: 'Dust', value: true, persist: true, onToggle: v => { dustOn = v; } },
  ],
  reset: () => act.reset(),
  quality: true,
  keys: [['click', 'rack, lever'], ['hold', 'charge'], ['release', 'fire'], ['S', 'shuffle']],
} });
camMode = ui.setting('camera')?.value ?? camMode;
dustOn = ui.setting('dust')?.value ?? dustOn;
slowmo = ui.slider?.value ?? slowmo;
const timeSlow = () => 1 / (8 + 92 * slowmo);

/* ---------- renderer ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  ui.hideControls?.();
  mark('first-frame');
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const canvas = renderer.domElement;
stage.prepend(canvas);

const HORIZON = col(0.74, 0.12, 52), ZENITH = col(0.3, 0.09, 268), GLOW = col(0.84, 0.15, 62), VOID = col(0.22, 0.05, 280);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(20, 1, 0.5, 1500);

/* ---------- sky ---------- */
// The diorama floats in a dusk sky; below the horizon it fades to violet.
const SUN = new THREE.Vector3(-0.7, 0.05, -0.7).normalize();
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uHor: { value: HORIZON }, uZen: { value: ZENITH }, uGlow: { value: GLOW }, uVoid: { value: VOID }, uSun: { value: SUN } },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position.z = gl_Position.w; }`,
  fragmentShader: /* glsl */`
    uniform vec3 uHor, uZen, uGlow, uVoid, uSun;
    varying vec3 vDir;
    void main() {
      float y = vDir.y;
      vec3 c = mix(uHor, uZen, pow(smoothstep(0.0, 0.55, max(y, 0.0)), 0.6));
      c = mix(c, uVoid, smoothstep(0.0, -0.35, y));
      float s = max(dot(normalize(vec3(vDir.x, 0.0, vDir.z)), normalize(vec3(uSun.x, 0.0, uSun.z))), 0.0);
      c += uGlow * pow(s, 5.0) * exp(-abs(y) * 8.0) * 0.8;
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
scene.add(sky);
// The sky lights the bare metal by reflection.
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new THREE.Scene().add(sky.clone()), 0.02).texture;
  scene.environmentIntensity = 0.7;
  pmrem.dispose();
}

/* ---------- light ---------- */
const hemi = new THREE.HemisphereLight(col(0.66, 0.06, 255), col(0.6, 0.06, 40), 1.0);
scene.add(hemi);
// A low sun from the front left rakes the slab and throws long shadows right.
const sun = new THREE.DirectionalLight(col(0.88, 0.1, 60), 2.2);
sun.position.set(-38, 11, 26);
sun.target.position.set(0, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 14, bottom: -14, near: 1, far: 120 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
// The muzzle flash lights the slab and the targets for a moment.
const flash = new THREE.PointLight(col(0.9, 0.08, 230), 0, 30, 1.6);
flash.position.set(MUZZLE + 0.8, BORE + 0.5, 0.8);
scene.add(flash);

/* ---------- textures ---------- */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
// A periodic Voronoi tile draws the hexagon crust of a salt flat.
function crustTile(N = 256, cells = 6) {
  const pts = [];
  for (let j = 0; j < cells; j++) for (let i = 0; i < cells; i++) pts.push([(i + rnd(0.2, 0.8)) / cells, (j + rnd(0.2, 0.8)) / cells]);
  const t = canvasTex(N, N, (g) => {
    const img = g.createImageData(N, N);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const u = x / N, v = y / N;
      let f1 = 9, f2 = 9;
      for (const [px, py] of pts) {
        let dx = Math.abs(u - px), dy = Math.abs(v - py);
        dx = Math.min(dx, 1 - dx); dy = Math.min(dy, 1 - dy);
        const d = Math.hypot(dx, dy);
        if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
      }
      // Ridges rise where two cells meet.
      const e = (f2 - f1) * cells, k = (Math.exp(-e * e * 70) * 255) | 0, o = (y * N + x) * 4;
      img.data[o] = img.data[o + 1] = img.data[o + 2] = k; img.data[o + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
  t.colorSpace = THREE.NoColorSpace;
  return t;
}
// The cut faces show strata: crust, mud and clay bands.
function strataTex(len) {
  const t = canvasTex(1024, 128, (g, w, h) => {
    const bands = [[0, 0.08, '#efeae2'], [0.08, 0.2, '#cfc6b8'], [0.2, 0.34, '#a59a8a'], [0.34, 0.4, '#d9d1c4'], [0.4, 0.62, '#8c7d6c'], [0.62, 0.7, '#b9ad9b'], [0.7, 1, '#6f6255']];
    for (const [a, b, c] of bands) { g.fillStyle = c; g.fillRect(0, a * h, w, (b - a) * h + 1); }
    // Wavy seams and grit break the bands.
    for (let i = 0; i < 2600; i++) {
      const v = Math.random() < 0.5 ? 255 : 0;
      g.fillStyle = `rgba(${v},${v},${v},${rnd(0.03, 0.1)})`;
      g.fillRect(Math.random() * w, Math.random() * h, rnd(1, 6), rnd(1, 2));
    }
  });
  t.repeat.set(len / 9, 1);
  return t;
}
const crust = crustTile();

/* ---------- slab and plinth ---------- */
{
  const L = SLAB.x1 - SLAB.x0, D = SLAB.z * 2;
  crust.repeat.set(L / 2.6, D / 2.6);
  const top = new THREE.MeshStandardMaterial({ color: col(0.95, 0.012, 70), roughness: 0.95, bumpMap: crust, bumpScale: 1.4 });
  const side = new THREE.MeshStandardMaterial({ map: strataTex(L), roughness: 1 });
  const end = new THREE.MeshStandardMaterial({ map: strataTex(D), roughness: 1 });
  const dark = new THREE.MeshStandardMaterial({ color: col(0.16, 0.01, 280), roughness: 0.7, metalness: 0.1 });
  const slab = new THREE.Mesh(new THREE.BoxGeometry(L, SLAB.salt, D), [end, end, top, dark, side, side]);
  slab.position.set((SLAB.x0 + SLAB.x1) / 2, -SLAB.salt / 2, 0);
  slab.receiveShadow = true;
  // The plinth is a dark museum base, set in from the slab edge.
  const plinth = new THREE.Mesh(new RoundedBoxGeometry(L - 0.8, SLAB.plinth, D - 0.8, 2, 0.08), dark);
  plinth.position.set(slab.position.x, -SLAB.salt - SLAB.plinth / 2, 0);
  scene.add(slab, plinth);
}

/* ---------- materials ---------- */
const steel = new THREE.MeshStandardMaterial({ color: col(0.36, 0.012, 250), roughness: 0.5, metalness: 0.65 });
const steelLight = new THREE.MeshStandardMaterial({ color: col(0.58, 0.01, 250), roughness: 0.35, metalness: 0.8 });
const paint = new THREE.MeshStandardMaterial({ color: col(0.5, 0.06, 150), roughness: 0.6, metalness: 0.2 });
const ceramic = new THREE.MeshStandardMaterial({ color: col(0.86, 0.02, 85), roughness: 0.45 });
const copper = new THREE.MeshStandardMaterial({ color: col(0.6, 0.11, 48), roughness: 0.4, metalness: 0.85, emissive: new THREE.Color(0) });
const black = new THREE.MeshStandardMaterial({ color: col(0.12, 0.005, 250), roughness: 0.6 });
const add = (parent, geo, mat, x, y, z, shadow = true) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m);
  return m;
};
const bx = (w, h, d, r = 0) => (r ? new RoundedBoxGeometry(w, h, d, 2, r) : new THREE.BoxGeometry(w, h, d));
const cylX = (r, len, seg = 20) => new THREE.CylinderGeometry(r, r, len, seg).rotateZ(Math.PI / 2);

/* ---------- the gun ---------- */
const gun = new THREE.Group();
scene.add(gun);
// Trestles carry the barrel; a ceramic collar sits every 0.75 m.
for (const x of [-11.2, -7.2]) {
  add(gun, bx(0.18, BORE - 0.3, 0.9, 0.03), paint, x, (BORE - 0.3) / 2, 0);
  add(gun, bx(0.9, 0.12, 1.3, 0.03), paint, x, 0.06, 0);
}
const barrelLen = MUZZLE - (TRAY_X + 0.4);
const barrelX = (MUZZLE + TRAY_X + 0.4) / 2;
add(gun, bx(barrelLen, 0.5, 0.5, 0.04), steel, barrelX, BORE, 0);
// The rails show as copper strips on the barrel face.
const rails = [];
for (const s of [-1, 1]) rails.push(add(gun, bx(barrelLen, 0.07, 0.04), copper, barrelX, BORE + s * 0.19, 0.25, false));
for (let x = TRAY_X + 0.8; x < MUZZLE - 0.2; x += 0.75) add(gun, bx(0.12, 0.66, 0.66, 0.03), ceramic, x, BORE, 0);
add(gun, bx(0.32, 0.74, 0.74, 0.05), steelLight, MUZZLE - 0.16, BORE, 0);
// The breech: an open tray, a sliding block and a lever.
add(gun, bx(1.6, 0.14, 0.56, 0.03), steel, TRAY_X - 0.3, BORE - 0.32, 0);
add(gun, bx(0.12, 0.62, 0.62, 0.03), steel, TRAY_X + 0.37, BORE, 0);
const block = add(gun, bx(0.74, 0.52, 0.56, 0.05), steelLight, 0, BORE, 0);
const BLOCK_OPEN = TRAY_X - 1.0, BLOCK_SHUT = TRAY_X;
const lever = new THREE.Group();
lever.position.set(TRAY_X - 0.6, BORE - 0.2, 0.38);
add(lever, new THREE.CylinderGeometry(0.03, 0.035, 0.9, 10).translate(0, 0.45, 0), steelLight, 0, 0, 0);
const knobMat = new THREE.MeshStandardMaterial({ color: col(0.58, 0.2, 28), roughness: 0.35, emissive: new THREE.Color(0) });
add(lever, new THREE.SphereGeometry(0.085, 16, 12), knobMat, 0, 0.92, 0);
add(lever, cylX(0.07, 0.06).rotateY(Math.PI / 2), steel, 0, 0, 0);
gun.add(lever);
const LEVER_OPEN = 0.65, LEVER_SHUT = -0.65;

/* ---------- the rack and crane ---------- */
const slugGeo = cylX(0.085, 0.5, 18);
const bandGeo = cylX(0.092, 0.08, 18);
const slugMat = new THREE.MeshStandardMaterial({ color: col(0.42, 0.015, 250), roughness: 0.3, metalness: 0.9 });
const bandMat = new THREE.MeshStandardMaterial({ color: col(0.6, 0.11, 48), roughness: 0.35, metalness: 0.85, emissive: new THREE.Color(0) });
function makeSlug() {
  const g = new THREE.Group();
  add(g, slugGeo, slugMat, 0, 0, 0);
  add(g, bandGeo, bandMat, -0.12, 0, 0);
  add(g, bandGeo, bandMat, 0.12, 0, 0);
  return g;
}
const rack = new THREE.Group();
scene.add(rack);
for (const z of [-0.34, 0.34]) add(rack, bx(0.1, 2.3, 0.1, 0.02), paint, RACK_X, 1.15, z);
add(rack, bx(0.9, 0.1, 0.9, 0.02), paint, RACK_X, 0.05, 0);
const RACK_N = 5, rackY = i => 0.45 + i * 0.36;
const rackSlugs = [];
for (let i = 0; i < RACK_N; i++) {
  add(rack, bx(0.7, 0.05, 0.62), steel, RACK_X, rackY(i) - 0.11, 0);
  const s = makeSlug();
  s.position.set(RACK_X, rackY(i), 0);
  rack.add(s);
  rackSlugs.push(s);
}
// A gantry crane carries the slug from the rack to the tray.
const CRANE_Y = 3.6;
for (const x of [-16.1, -11.3]) {
  add(scene, bx(0.14, CRANE_Y, 0.14, 0.02), paint, x, CRANE_Y / 2, -1.0);
  add(scene, bx(0.12, 0.12, 1.1), paint, x, CRANE_Y - 0.06, -0.5);
}
add(scene, bx(5.1, 0.18, 0.18, 0.02), paint, -13.7, CRANE_Y, 0);
const trolley = add(scene, bx(0.4, 0.22, 0.36, 0.04), steelLight, 0, CRANE_Y - 0.18, 0);
const cable = add(scene, new THREE.CylinderGeometry(0.012, 0.012, 1, 6).translate(0, -0.5, 0), black, 0, 0, 0, false);
const hook = add(scene, new THREE.CylinderGeometry(0.15, 0.15, 0.07, 20), steelLight, 0, 0, 0);
const gripMat = new THREE.MeshBasicMaterial({ color: col(0.8, 0.14, 230), toneMapped: false, transparent: true, opacity: 0 });
const grip = new THREE.Mesh(new THREE.CircleGeometry(0.12, 20).rotateX(Math.PI / 2), gripMat);
hook.add(grip);
grip.position.y = -0.04;
const crane = { x: -13.8, y: 2.9, magnet: 0 };
function placeCrane() {
  trolley.position.x = crane.x;
  cable.position.set(crane.x, CRANE_Y - 0.28, 0);
  cable.scale.y = Math.max(0.01, CRANE_Y - 0.28 - crane.y - 0.035);
  hook.position.set(crane.x, crane.y, 0);
  gripMat.opacity = crane.magnet;
}

/* ---------- capacitors and panel ---------- */
const caps = [];
for (let i = 0; i < 6; i++) {
  const x = -11 + i * 0.72;
  add(scene, new THREE.CylinderGeometry(0.25, 0.25, 1.1, 24), black, x, 0.55, -1.7);
  add(scene, new THREE.CylinderGeometry(0.12, 0.12, 0.1, 16), ceramic, x, 1.15, -1.7);
  const m = new THREE.MeshBasicMaterial({ color: new THREE.Color(), toneMapped: false });
  add(scene, new THREE.CylinderGeometry(0.255, 0.255, 0.1, 24, 1, true), m, x, 0.85, -1.7, false);
  caps.push(m);
}
add(scene, bx(4.3, 0.08, 0.14), copper, -9.2, 1.24, -1.7);
add(scene, bx(0.1, 0.08, 1.5), copper, -9.2, 1.24, -0.95);
const CAP_OFF = col(0.25, 0.03, 230), CAP_ON = col(0.88, 0.14, 225).multiplyScalar(2.5);
// The panel: a dial with a needle and three lamps, facing the viewer.
const panel = new THREE.Group();
// It stands behind the barrel and reads above it.
panel.position.set(-9.4, 0, -1.0);
scene.add(panel);
add(panel, bx(0.1, 1.8, 0.1), paint, 0, 0.9, 0);
add(panel, bx(0.9, 0.6, 0.14, 0.04), paint, 0, 2.1, 0);
add(panel, new THREE.CircleGeometry(0.2, 32), new THREE.MeshStandardMaterial({ color: col(0.92, 0.02, 90), roughness: 0.5 }), -0.18, 2.1, 0.075, false);
const needle = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.17, 0.01).translate(0, 0.075, 0), new THREE.MeshBasicMaterial({ color: col(0.5, 0.2, 28) }));
needle.position.set(-0.18, 2.1, 0.085);
panel.add(needle);
const lamps = [0, 1, 2].map(i => {
  const m = new THREE.MeshBasicMaterial({ color: new THREE.Color(), toneMapped: false });
  add(panel, new THREE.SphereGeometry(0.05, 14, 10), m, 0.14 + i * 0.12, 2.1, 0.08, false);
  return m;
});
const LAMP = { off: col(0.25, 0.02, 60), ask: col(0.82, 0.16, 75).multiplyScalar(2), ok: col(0.82, 0.18, 145).multiplyScalar(2), no: col(0.62, 0.22, 28).multiplyScalar(2.5), live: col(0.88, 0.14, 225).multiplyScalar(2.5) };

// Arcs crawl down the barrel face while the gun charges.
const ARCS = 7, ARC_SEG = 6;
const arcGeo = new THREE.BufferGeometry();
arcGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ARCS * ARC_SEG * 2 * 3), 3));
const arcs = new THREE.LineSegments(arcGeo, new THREE.LineBasicMaterial({ color: col(0.95, 0.12, 240).multiplyScalar(2), toneMapped: false }));
arcs.frustumCulled = false;
scene.add(arcs);
function drawArcs(c) {
  const p = arcGeo.attributes.position.array;
  let o = 0;
  for (let a = 0; a < ARCS; a++) {
    const on = Math.random() < c * 1.2 ? 1 : 0;
    const x = rnd(TRAY_X + 0.5, MUZZLE - 0.3);
    let px = x, py = BORE - 0.16;
    for (let s = 0; s < ARC_SEG; s++) {
      const t = (s + 1) / ARC_SEG;
      const nx = x + (s < ARC_SEG - 1 ? rnd(-0.06, 0.06) : 0), ny = lerp(BORE - 0.16, BORE + 0.16, t);
      p[o++] = px * on; p[o++] = py * on; p[o++] = 0.28 * on;
      p[o++] = nx * on; p[o++] = ny * on; p[o++] = 0.28 * on;
      px = nx; py = ny;
    }
  }
  arcGeo.attributes.position.needsUpdate = true;
  arcs.visible = c > 0.02;
}

/* ---------- the flying slug ---------- */

// QA: fire at a set charge, and freeze the sim clock for stills.
window.__qa = {
  ready() { gunState.s = 'locked'; gunState.lever = 1; placeGun(); wake(); },
  fire(c = 1) { this.ready(); gunState.s = 'charging'; gunState.held = 1; gunState.charge = c; fire(); },
  freeze(on = true) { frozen = on; wake(); },
  state: () => ({ gun: gunState.s, rack: gunState.rack, shot: shot.phase }),
};
act.load = load;
act.lock = lock;
act.down = startCharge;
act.up = release;
act.shuffle = () => { if (shot.phase === 'idle' || shot.phase === 'after' || shot.phase === 'refill') { refill(); clearBits(); } };
act.reset = () => {
  for (const d of glows) { scene.remove(d.m); d.m.material.dispose(); }
  glows.length = 0;
  clearBits();
  steam.clear();
  slug.visible = false; timeScale = 1; camBlend = 0;
  if (shot.phase === 'flight' || shot.phase === 'hold') shot.phase = 'after';
  refill();
};

/* ---------- step ---------- */
function step(dt) {
  // Real time drives the charge, the lamps, the camera and the flash.
  const G = gunState;
  if (G.s === 'charging') {
    G.held += dt;
    G.charge = clamp(G.charge + dt / CHARGE_TIME);
  }
  const c = G.s === 'charging' ? G.charge : 0;
  for (const r of rails) r.material.emissive.copy(col(0.7, 0.18, 45)).multiplyScalar(c * c * 1.6);
  drawArcs(c);
  needle.rotation.z = lerp(2.2, -2.2, c);
  caps.forEach((m, i) => m.color.copy(CAP_OFF).lerp(CAP_ON, clamp(c * 6 - i)));
  // Lamps: load, lock, charge. Amber asks, green is done, red refuses.
  const ask = G.s === 'empty' ? 0 : G.s === 'loaded' ? 1 : G.s === 'locked' ? 2 : -1;
  const st = [G.s !== 'empty' && G.s !== 'loading', ['locked', 'charging', 'fired'].includes(G.s), G.s === 'charging' && c >= 1];
  lamps.forEach((m, i) => {
    G.blink[i] = Math.max(0, G.blink[i] - dt);
    if (G.blink[i] > 0) m.color.copy(Math.floor(G.blink[i] * 10) % 2 ? LAMP.no : LAMP.off);
    else if (i === 2 && G.s === 'charging') m.color.copy(c >= 1 ? LAMP.ok : LAMP.live).multiplyScalar(c >= 1 ? 1 : 0.4 + 0.6 * Math.abs(Math.sin(performance.now() / 120)));
    else m.color.copy(st[i] ? LAMP.ok : ask === i ? LAMP.ask : LAMP.off);
  });
  // The part that takes the next step glows under the pointer.
  knobMat.emissive.copy(hover === 'lever' && G.s === 'loaded' ? col(0.6, 0.2, 28) : new THREE.Color(0));
  bandMat.emissive.copy(hover === 'rack' && G.s === 'empty' ? col(0.6, 0.12, 50) : new THREE.Color(0));
  placeGun();
  flashT += dt;
  flash.intensity = reduced() || flashT < 0 ? 0 : 90 * Math.exp(-flashT / 0.07);

  // The sim clock runs at the time scale; bullet time is one number.
  if (shot.phase === 'snap') timeScale = Math.min(1, timeScale + dt / 0.15);
  const h = frozen ? 0 : dt * timeScale;
  if (shot.phase === 'flight') {
    shot.x += SPEED * h;
    while (shot.next < shot.events.length && shot.x >= shot.events[shot.next].x) hitEvent(shot.events[shot.next++]);
    if (shot.x >= shot.stopX) { shot.x = shot.stopX; shot.phase = 'hold'; shot.hold = 0; }
  } else if (shot.phase === 'hold') {
    if (!frozen) shot.hold += dt;
    if (shot.hold > 0.35) shot.phase = 'snap';
  } else if (shot.phase === 'snap' && timeScale >= 1) {
    shot.phase = 'after'; shot.after = 0;
    if (G.s === 'fired') unlock();
  } else if (shot.phase === 'after') {
    shot.after += dt;
    if (shot.after > REFILL) refill();
  }
  const k = aimAt(shot.x);
  slug.position.set(shot.x, BORE + shot.aim.y * k, shot.aim.x * k);
  // The slug shows once it leaves the barrel.
  slug.visible = (shot.phase === 'flight' || shot.phase === 'hold') && shot.x > MUZZLE - 0.2;
  trail.scale.x = clamp((shot.x - MUZZLE) / 4, 0.05, 1) * 1.2;

  // The row drops in after a refill.
  let dropping = false;
  for (const t of row) {
    if (t.drop < 1) {
      t.drop = Math.min(1, t.drop + dt / 0.55);
      const q = clamp(t.drop);
      // A falling ease with one small bounce.
      const y = q < 0.75 ? 1 - (q / 0.75) ** 2 : 0.06 * Math.sin((q - 0.75) / 0.25 * Math.PI);
      t.g.position.y = y * 6;
      dropping = true;
    }
  }
  if (shot.phase === 'refill') {
    // Old debris shrinks away while the new row lands.
    fadeT += dt;
    const f = clamp(1 - fadeT / 0.4);
    for (const b of bits) { b.fade = f; b.rest = false; b.v.set(0, 0, 0); }
    if (f <= 0) clearBits();
    if (!dropping && f <= 0) shot.phase = 'idle';
  }
  const moving = stepBits(shot.phase === 'refill' ? 0 : h) && shot.phase !== 'refill';
  const steaming = steam.step(h);
  const tumbling = stepKnocked(h);
  const warm = coolGlows(dt);

  // The track camera follows the slug in bullet time.
  const ride = camMode === 'track' && !reduced() && (shot.phase === 'flight' || shot.phase === 'hold');
  camBlend += ((ride ? 1 : 0) - camBlend) * (1 - Math.exp(-dt / (ride ? 0.2 : 0.35)));
  if (Math.abs(camBlend - (ride ? 1 : 0)) < 0.002) camBlend = ride ? 1 : 0;
  placeCamera();

  const blinking = G.blink.some(b => b > 0);
  return shot.phase !== 'idle' || G.busy > 0 || G.s === 'charging' || blinking || dropping || moving || steaming || tumbling || warm || camBlend > 0 || flashT < 0.5;
}

/* ---------- camera ---------- */
let size = { w: 1, h: 1, dpr: 1 }, narrow = false;
const fixedPos = new THREE.Vector3(), fixedLook = new THREE.Vector3();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
const CX = (SLAB.x0 + SLAB.x1) / 2, HALF_W = 15.6, TILT = 15 * Math.PI / 180;
function frameShot() {
  const asp = size.w / size.h;
  narrow = asp < 0.9;
  camera.aspect = asp;
  camera.fov = narrow ? 44 : 20;
  // The distance fits the whole diorama across the frame.
  const hf = Math.atan(Math.tan(camera.fov * Math.PI / 360) * asp);
  const d = HALF_W / Math.tan(hf);
  fixedLook.set(CX, narrow ? 0.2 : 0.9, 0);
  fixedPos.set(CX, fixedLook.y + d * Math.sin(TILT), d * Math.cos(TILT));
  camera.far = d + 1000;
  camera.updateProjectionMatrix();
  const scale = size.h * size.dpr / (2 * Math.tan(camera.fov * Math.PI / 360));
  steam.mat.uniforms.uScale.value = scale;
}
function placeCamera() {
  const x = shot.x;
  camPos.set(lerp(fixedPos.x, x + 1.2, camBlend), lerp(fixedPos.y, BORE + 1.6, camBlend), lerp(fixedPos.z, 13, camBlend));
  camLook.set(lerp(fixedLook.x, x + 3.2, camBlend), lerp(fixedLook.y, BORE, camBlend), lerp(fixedLook.z, 0, camBlend));
  camera.position.copy(camPos);
  camera.lookAt(camLook);
}
function resize() {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  size = { w, h, dpr: pixelRatio(w, h, { maxDpr: 2, budget: 2.2e6 }) };
  frameShot();
  placeCamera();
  renderer.setPixelRatio(size.dpr);
  renderer.setSize(w, h, false);
}

/* ---------- frame loop ---------- */
// The loop runs while anything moves; it sleeps at rest.
let raf = 0, last = 0, visible = !document.hidden, ready = false;
function wake() {
  if (!raf && visible && ready) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(now) {
  raf = 0;
  let again = true;
  try {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    again = step(dt);
    renderer.render(scene, camera);
  } finally {
    if (again && visible) raf = requestAnimationFrame(frame);
  }
}

/* ---------- pointer ---------- */
// The rack and the lever take clicks; anywhere else charges.
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.intersectObject(lever, true).length || ray.intersectObject(block, false).length) return 'lever';
  if (ray.intersectObject(rack, true).length) return 'rack';
  return null;
}
let pointerId = null;
canvas.addEventListener('pointermove', e => {
  if (pointerId !== null || e.pointerType !== 'mouse') return;
  const p = pick(e);
  if (p === hover) return;
  hover = p;
  stage.style.cursor = p ? 'pointer' : '';
  wake();
});
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0 || pointerId !== null) return;
  const p = pick(e);
  if (p === 'rack') { load(); return; }
  if (p === 'lever') { lock(); return; }
  pointerId = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  startCharge();
});
const up = e => {
  if (e.pointerId !== pointerId) return;
  pointerId = null;
  release();
};
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
canvas.addEventListener('lostpointercapture', up);
canvas.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.('input, textarea, select')) return;
  if (e.key === 's' || e.key === 'S') act.shuffle();
});

/* ---------- ready ---------- */
newRow(false);
placeGun();
resize();
renderer.compileAsync(scene, camera).then(() => {
  renderer.render(scene, camera);
  canvas.classList.add('on');
  ready = true;
  mark('first-frame');
}, () => { canvas.classList.add('on'); ready = true; mark('first-frame'); });

new ResizeObserver(() => { resize(); if (ready) renderer.render(scene, camera); }).observe(stage);
onQuality(() => { resize(); if (ready) renderer.render(scene, camera); });
onReducedChange(() => wake());
// A hidden tab stops the loop and the sim clock with it.
whenVisible(stage, v => {
  visible = v;
  if (!v) { cancelAnimationFrame(raf); raf = 0; return; }
  wake();
});
</script>
</body>
</html>
