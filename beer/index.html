<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { Pass } from 'three/addons/postprocessing/Pass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { initPage, whenVisible, pixelRatio, onQuality, reduced, onReducedChange, oklchLinear } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import { BEERS } from './catalogue.js';

const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = (dt, tau) => 1 - Math.exp(-dt / tau);
const rnd = () => Math.random();

/* ---------- profiles ---------- */
// Lengths are in cm. A profile is NP samples of outer radius, inner radius and both slopes.
// Glass and bottle outlines come from product photos (beer/data).
const NP = 512, GMAX = 26, BMAX = 32;
function slopes(a, max) {
  const dy = max / NP;
  for (let i = 0; i < NP; i++) {
    const i0 = Math.max(i - 1, 0), i1 = Math.min(i + 1, NP - 1);
    a[i * 4 + 2] = (a[i1 * 4] - a[i0 * 4]) / ((i1 - i0) * dy);
    a[i * 4 + 3] = (a[i1 * 4 + 1] - a[i0 * 4 + 1]) / ((i1 - i0) * dy);
  }
  return a;
}
// A Catmull-Rom spline through an outline.
function outlineR(pts, y) {
  const step = pts[1][0] - pts[0][0], n = pts.length;
  if (y < 0 || y > pts[n - 1][0]) return 0;
  const f = y / step, i = Math.floor(f), t = f - i;
  const P = k => pts[clamp(k, 0, n - 1)][1];
  const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
  return Math.max(0, 0.5 * (2 * p1 + (p2 - p0) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (3 * p1 - p0 - 3 * p2 + p3) * t * t * t));
}
function vesselProfile(pts, max, ybot, wall) {
  const a = new Float32Array(NP * 4), dy = max / NP, H = pts[pts.length - 1][0];
  for (let i = 0; i < NP; i++) {
    const y = (i + 0.5) * dy, ro = outlineR(pts, y);
    a[i * 4] = ro;
    if (y > ybot && y <= H) a[i * 4 + 1] = Math.max(ro - wall(ro), 0) * Math.pow(Math.sin(Math.min((y - ybot) / 0.7, 1) * Math.PI / 2), 0.5);
  }
  return { prof: slopes(a, max), h: H, ybot };
}
// sRGB hex to linear RGB.
function hexLin(h) {
  const n = parseInt(h.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => v / 255);
  return c.map(v => (v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
}
// SRM is 12.7 times the absorbance at 430 nm through 1 cm; absorbance falls near exponentially with wavelength.
function sigmaFor(b) {
  if (b.tint) return hexLin(b.tint).map(x => -Math.log(Math.max(x, 0.003)) / 3);
  const a430 = b.ebc / 1.97 / 12.7;
  return [610, 550, 465].map(l => Math.LN10 * a430 * Math.exp(-(l - 430) / 55));
}

/* ---------- the glass as a vessel ---------- */
// The glass stands upright at the origin; levels are heights above the table.
class Vessel {
  constructor(max) { this.max = max; this.prof = new Float32Array(NP * 4); this.h = 1; this.ybot = 0; }
  load(v) { this.prof = v.prof; this.h = v.h; this.ybot = v.ybot; }
  ri(y) { return this.prof[clamp(Math.floor(y / this.max * NP), 0, NP - 1) * 4 + 1]; }
  ro(y) { return this.prof[clamp(Math.floor(y / this.max * NP), 0, NP - 1) * 4]; }
  volBelow(L) {
    let v = 0;
    const dy = this.max / NP;
    for (let i = Math.floor(this.ybot / dy); i < NP; i++) {
      const y = (i + 0.5) * dy, r = this.prof[i * 4 + 1];
      if (y > L) break;
      v += Math.PI * r * r * dy;
    }
    return v;
  }
  levelFor(V) {
    let lo = this.ybot, hi = this.h;
    for (let k = 0; k < 24; k++) { const m = (lo + hi) / 2; if (this.volBelow(m) < V) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }
}
const glass = new Vessel(GMAX), bottleV = new Vessel(BMAX);

/* ---------- state ---------- */
const LIGHTS = { warm: [0.93, 0.07, 72], white: [0.96, 0.012, 95], neon: [0.74, 0.21, 352] };
let beer = BEERS[0], fizz = 0.65;
const act = { pour() {}, sip() {}, clear() {}, reset() {} };
const ui = initPage({ id: 'beer', bar: {
  choice: { label: 'Beer', value: beer.id, options: BEERS.map(b => ({ value: b.id, label: b.name })), onPick: v => { setBeer(v); live(); } },
  slider: { label: 'Fizz', min: 0, max: 1, step: 0.01, value: fizz, onInput: v => { fizz = v; live(); } },
  actions: [
    { verb: 'pour', label: 'Pour', key: 'P', onPress: () => act.pour() },
    { verb: 'sip', label: 'Sip', key: 'S', onPress: () => act.sip() },
    { verb: 'clear', key: 'C', onPress: () => act.clear() },
  ],
  settings: [
    { type: 'choice', id: 'light', label: 'Light', value: 'warm', persist: true,
      options: [{ value: 'warm', label: 'Warm' }, { value: 'white', label: 'White' }, { value: 'neon', label: 'Neon' }],
      onPick: v => { light = v; live(); } },
    { type: 'choice', id: 'foamTime', label: 'Foam time', value: 'fast', persist: true,
      options: [{ value: 'fast', label: 'Fast' }, { value: 'real', label: 'Real' }], onPick: v => { foamTime = v; live(); } },
    { type: 'toggle', id: 'cold', label: 'Cold glass', value: false, persist: true, onToggle: v => { coldGlass = v; live(); } },
  ],
  reset: () => act.reset(),
  quality: true,
  keys: [['hold', 'pour'], ['s', 'sip'], ['c', 'fresh glass'], ['space', 'pour']],
} });
let light = ui.setting('light')?.value ?? 'warm';
let foamTime = ui.setting('foamTime')?.value ?? 'fast';
let coldGlass = ui.setting('cold')?.value ?? false;

let markReady;
const glReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, glReady]) });

/* ---------- shader chunks ---------- */
const NOISE = `
float hash11(float n) { return fract(sin(n * 127.1) * 43758.5453); }
float hash(vec2 p) { vec3 q = fract(p.xyx * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
vec2 hash2(vec2 p) { vec3 q = fract(p.xyx * vec3(0.1031, 0.103, 0.0973)); q += dot(q, q.yzx + 33.33); return fract((q.xx + q.yz) * q.zy); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * noise(p); p = p * 2.03 + 7.1; a *= 0.5; } return s / 0.9375; }
vec4 voro(vec2 x) {
  vec2 n = floor(x), f = fract(x);
  float F1 = 8.0, F2 = 8.0; vec2 v1 = vec2(0.0);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j)), r = g + hash2(n + g) * 0.86 + 0.07 - f;
    float d = dot(r, r);
    if (d < F1) { F2 = F1; F1 = d; v1 = r; } else if (d < F2) F2 = d;
  }
  return vec4(sqrt(F1), sqrt(F2), v1);
}
`;
// The room: a warm dark bar far behind, the lamp, and out-of-focus lights in three sizes.
const ROOM = `
uniform vec3 uLamp;
uniform float uTime;
const float BACK_Z = -70.0;
const vec2 LAMP = vec2(-3.0, 3.0);
vec3 bokehTier(vec2 x, float n, float seed, vec2 rr, float gain) {
  vec3 c = vec3(0.0);
  for (int i = 0; i < 16; i++) {
    float fi = float(i);
    if (fi >= n) break;
    float h1 = hash11(fi * 3.17 + seed), h2 = hash11(fi * 7.31 + seed * 1.7), h3 = hash11(fi * 5.13 + seed * 2.3);
    vec2 p = vec2(mix(-60.0, 60.0, h1), mix(-8.0, 46.0, h2));
    p.x += sign(p.x - LAMP.x) * 9.0 * exp(-pow((p.y - LAMP.y) / 18.0, 2.0)) * step(abs(p.x - LAMP.x), 12.0);
    p += vec2(sin(uTime * 0.05 + fi), cos(uTime * 0.04 + fi * 1.3)) * 0.6;
    float r = mix(rr.x, rr.y, h3), d = length(x - p);
    float disc = smoothstep(r, r * 0.86, d), rim = smoothstep(r * 0.5, r * 0.97, d) * disc;
    vec3 tint = mix(vec3(1.0, 0.5, 0.15), vec3(1.0, 0.78, 0.45), hash11(fi + seed * 9.0));
    tint = mix(tint, vec3(0.6, 0.14, 0.08), step(0.82, hash11(fi * 2.1 + seed)));
    c += mix(tint, uLamp, 0.3) * disc * (0.75 + 0.45 * rim) * gain * mix(0.35, 1.0, hash11(fi * 11.7 + seed));
  }
  return c;
}
vec3 lampAt(vec2 x) {
  vec2 ld = (x - LAMP) / vec2(13.0, 11.0);
  float dl = dot(ld, ld);
  return uLamp * (0.95 * exp(-pow(dl, 1.1) * 1.5) + 0.2 * exp(-sqrt(dl) * 1.4) + 0.05 * exp(-sqrt(dl) * 0.4));
}
vec3 backdrop(vec2 x) {
  vec3 c = mix(vec3(0.004, 0.003, 0.0028), vec3(0.02, 0.011, 0.007), smoothstep(-10.0, 45.0, x.y));
  float band = exp(-pow((x.y - 26.0) / 11.0, 2.0)) + 0.6 * exp(-pow((x.y - 42.0) / 7.0, 2.0));
  c += vec3(0.075, 0.036, 0.014) * band * smoothstep(0.3, 0.85, fbm(vec2(x.x * 0.03, x.y * 0.05) + 3.0));
  c += lampAt(x);
  c += bokehTier(x, 10.0, 1.0, vec2(5.0, 9.0), 0.018);
  c += bokehTier(x, 14.0, 2.0, vec2(1.8, 3.4), 0.03);
  c += bokehTier(x, 14.0, 3.0, vec2(0.4, 0.8), 0.2);
  return c;
}
vec3 backdropRay(vec3 o, vec3 d) {
  float t = (BACK_Z - o.z) / min(d.z, -1e-3);
  return backdrop((o + d * t).xy);
}
// The studio behind the camera: a key softbox up left and a warm strip on the right.
const vec3 KEY_DIR = vec3(-0.5, 0.5, 0.72);
vec3 studio(vec3 o, vec3 d) {
  vec3 c = vec3(0.004, 0.0034, 0.003);
  vec3 kd = normalize(KEY_DIR), ku = normalize(cross(kd, vec3(0.0, 1.0, 0.0))), kv = cross(ku, kd);
  float kz = dot(d, kd);
  if (kz > 0.0) {
    vec2 a = vec2(dot(d, ku), dot(d, kv)) / kz;
    c += vec3(1.0, 0.95, 0.88) * smoothstep(0.025, 0.0, max(abs(a.x) - 0.06, abs(a.y) - 0.42)) * 4.0;
    c += vec3(1.0, 0.95, 0.88) * smoothstep(0.02, 0.0, max(abs(a.x - 0.16) - 0.015, abs(a.y) - 0.38)) * 2.5;
  }
  vec3 sd = normalize(vec3(0.92, 0.12, 0.25)), su = normalize(cross(sd, vec3(0.0, 1.0, 0.0))), sv = cross(su, sd);
  float sz = dot(d, sd);
  if (sz > 0.0) {
    vec2 a = vec2(dot(d, su), dot(d, sv)) / sz;
    c += uLamp * 1.8 * smoothstep(0.05, 0.0, max(abs(a.x) - 0.04, abs(a.y) - 0.7));
  }
  if (d.z < -0.15) c += backdropRay(o, d) * 0.9;
  return c;
}
`;
// The glass profile: outer radius, inner radius and slopes by height.
const PROF = `
uniform sampler2D uGP;
uniform float uGH, uGYb;
const float GMAX = ${GMAX.toFixed(1)};
vec4 gp(float y) { return texture2D(uGP, vec2(clamp(y / GMAX, 0.0, 1.0), 0.5)); }
`;
const FULL_VS = `
varying vec2 vUv;
void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

/* ---------- the room ---------- */
const BACK_FS = NOISE + ROOM + `
uniform vec3 uCamPos, uCamR, uCamU, uCamF;
uniform vec2 uTan;
varying vec2 vUv;
void main() {
  vec2 n = vUv * 2.0 - 1.0;
  vec3 d = normalize(uCamF + uCamR * n.x * uTan.x + uCamU * n.y * uTan.y);
  gl_FragColor = vec4(backdropRay(uCamPos, d), 1.0);
}`;

/* The table: dark slate with a satin streak of the lamp and the glass's shadow. */
const TABLE_VS = `
varying vec3 vW;
void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
const TABLE_FS = NOISE + ROOM + PROF + `
uniform vec3 uSigma;
uniform float uLevel, uFill;
varying vec3 vW;
void main() {
  vec3 p = vW;
  vec3 L = vec3(LAMP.x * 0.5, 30.0, -40.0) - p;
  float dist = length(L);
  vec3 l = L / dist;
  float irr = max(l.y, 0.0) * 1300.0 / (dist * dist);
  // The glass's shadow falls toward the viewer; light through the beer focuses in it.
  float s = dot(-p.xz, L.xz) / max(dot(L.xz, L.xz), 1e-4);
  vec3 tint = vec3(1.0);
  if (s > 0.0 && s < 1.0) {
    vec3 q = p + L * s;
    float hd = length(q.xz);
    vec4 Pr = gp(q.y);
    float inside = smoothstep(Pr.x + 0.15, Pr.x - 0.2, hd);
    float D = length(p.xz), R = max(Pr.y, 0.5), f = 2.0 * R;
    float w = R * abs(1.0 - D / f) + 0.08 * R;
    vec3 Tb = exp(-uSigma * 1.4 * R);
    vec3 beer = mix(vec3(0.05), Tb * min(R / w, 7.0) * 0.8, smoothstep(w, w * 0.6, hd));
    vec3 t2 = q.y < uLevel && q.y > uGYb && uFill > 0.0 ? beer : vec3(q.y < uGYb ? 0.4 : 0.82);
    tint = mix(vec3(1.0), t2, inside);
  }
  vec3 v = normalize(cameraPosition - p), h = normalize(l + v);
  vec3 c = vec3(0.05, 0.043, 0.038) * uLamp * irr * tint;
  c += uLamp * pow(max(h.y, 0.0), 160.0) * irr * 0.5 * tint;
  c *= 1.0 - 0.65 * exp(-pow(max(length(p.xz) - gp(0.1).x, 0.0) / 0.7, 2.0));
  c += uLamp * 0.3 * exp(-pow((p.z + 62.0) / 0.3, 2.0)) * exp(-pow((p.x - LAMP.x) / 20.0, 2.0));
  gl_FragColor = vec4(c, 1.0);
}`;

/* The bottle: brown glass, a glow where its beer is, and its label. */
const BOTTLE_VS = `
varying vec3 vW, vN;
varying vec2 vUv;
void main() {
  vec4 w = modelMatrix * vec4(position, 1.0);
  vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal); vUv = uv;
  gl_Position = projectionMatrix * viewMatrix * w;
}`;
const BOTTLE_FS = NOISE + ROOM + `
uniform sampler2D uLabel;
uniform vec4 uLab;     // body label v0, v1; neck label v0, v1 (bottle cm)
uniform float uBH, uBLevel, uPainted;
uniform vec3 uTintB, uPaint, uBeerCol;
varying vec3 vW, vN;
varying vec2 vUv;
void main() {
  vec3 n = normalize(vN), v = normalize(cameraPosition - vW);
  float y = vUv.y * uBH, u = fract(vUv.x + 0.5);
  float F = 0.04 + 0.96 * pow(1.0 - max(dot(n, v), 0.0), 5.0);
  vec3 back = lampAt(vec2(vW.x * 1.8 - 6.0, vW.y * 1.6));
  // Light through brown glass, warmer and brighter where beer fills it.
  vec3 body = back * uTintB * (y < uBLevel ? uBeerCol * 1.4 : vec3(0.45)) * (1.0 - 0.7 * pow(1.0 - max(dot(n, v), 0.0), 2.0));
  if (uPainted > 0.5) body = uPaint * (0.05 + 0.5 * max(dot(n, normalize(KEY_DIR)), 0.0));
  vec3 c = body + studio(vW, reflect(-v, n)) * F;
  vec4 lab = vec4(0.0);
  if (y > uLab.x && y < uLab.y) lab = texture2D(uLabel, vec2(u, 0.7 * (y - uLab.x) / (uLab.y - uLab.x)));
  if (y > uLab.z && y < uLab.w) lab = texture2D(uLabel, vec2(u, 0.74 + 0.26 * (y - uLab.z) / (uLab.w - uLab.z)));
  if (lab.a > 0.5) {
    float diff = max(dot(n, normalize(KEY_DIR)), 0.0);
    c = pow(lab.rgb, vec3(2.2)) * (0.03 + 0.55 * diff) + uLamp * pow(1.0 - max(dot(n, v), 0.0), 3.0) * 0.3 + studio(vW, reflect(-v, n)) * 0.04;
  }
  gl_FragColor = vec4(c, 1.0);
}`;

/* ---------- the beer ---------- */
// The beer is a lathe of the glass's inner wall, from the floor to the level, closed on top.
// Each pixel follows its ray through the beer: refract in, cross the beer, refract out.
// Beer-Lambert colours it by the true path; haze scatters the lamp forward.
const BEER_VS = PROF + `
attribute vec2 aTS;    // height fraction, radial fraction (1 on the wall)
uniform float uLevel;
varying vec3 vW, vN;
void main() {
  float y = mix(uGYb + 0.05, uLevel, aTS.x);
  vec4 P = gp(y);
  float r = P.y * aTS.y;
  vec2 dir = normalize(position.xz + 1e-6);
  vec3 pos = vec3(dir.x * r, y, dir.y * r);
  vec3 n = aTS.x > 0.999 && aTS.y < 0.999 ? vec3(0.0, 1.0, 0.0) : normalize(vec3(dir.x, -P.w, dir.y));
  vW = pos; vN = n;
  gl_Position = projectionMatrix * viewMatrix * vec4(pos, 1.0);
}`;
const BEER_FS = NOISE + ROOM + PROF + `
uniform sampler2D uBehind;
uniform mat4 projectionMatrix;
uniform vec3 uSigma, uKey;
uniform float uLevel, uHaze, uSurge;
varying vec3 vW, vN;
bool inBeer(vec3 p) { return p.y > uGYb && p.y < uLevel && length(p.xz) < gp(p.y).y; }
void main() {
  vec3 v = normalize(cameraPosition - vW), n = normalize(vN);
  float c = max(dot(n, v), 0.0);
  float F = 0.02 + 0.98 * pow(1.0 - c, 5.0);
  vec3 d = refract(-v, n, 1.0 / 1.333);
  // March out of the beer, then bisect to the wall.
  float t = 0.0, st = 0.22;
  for (int i = 0; i < 64; i++) { if (!inBeer(vW + d * (t + st))) break; t += st; }
  float a = t, b = t + st;
  for (int k = 0; k < 6; k++) { float m = 0.5 * (a + b); if (inBeer(vW + d * m)) a = m; else b = m; }
  t = b;
  vec3 X = vW + d * t;
  vec4 P = gp(X.y);
  vec3 nx = X.y <= uGYb + 0.02 ? vec3(0.0, -1.0, 0.0) : normalize(vec3(X.x, -P.w * length(X.xz), X.z));
  vec3 d2 = refract(d, -nx, 1.333);

  if (L.shape === 'diamond') {
    const r = Math.min(bh * 0.5, W * 0.17);
    c.moveTo(W / 2, cy - r); c.lineTo(W / 2 + r, cy); c.lineTo(W / 2, cy + r); c.lineTo(W / 2 - r, cy); c.closePath();
  } else if (L.shape === 'round') {
    c.arc(W / 2, cy, Math.min(bh * 0.5, W * 0.17), 0, Math.PI * 2);
  } else if (L.shape === 'oval') {
    c.roundRect(x0, top + 10, x1 - x0, bh - 20, bh * 0.35);
  } else if (L.shape === 'arch') {
    c.moveTo(x0 + 60, H); c.lineTo(x0 + 60, top + bh * 0.3);
    c.quadraticCurveTo(W / 2, top - bh * 0.15, x1 - 60, top + bh * 0.3); c.lineTo(x1 - 60, H); c.closePath();
  } else if (L.shape !== 'printed') {
    c.rect(x0, top, x1 - x0, bh);
  }
  if (L.shape !== 'printed') {
    c.fillStyle = bg;
    c.fill();
    c.clip();
    c.strokeStyle = acc;
    c.lineWidth = 10;
    c.stroke();
    c.lineWidth = 3;
    c.strokeStyle = acc2;
  }
  // A few plain marks stand in for the real art.
  if (L.shape === 'foil') {
    c.fillStyle = acc;
    for (let k = 0; k < 7; k++) { c.beginPath(); c.arc(W * (0.32 + k * 0.06), top + bh * 0.82, 9, 0, Math.PI * 2); c.fill(); }
  }
  const tw = L.shape === 'diamond' || L.shape === 'round' ? W * 0.2 : W * 0.3;
  const ty = L.shape === 'printed' ? cy : cy - bh * 0.06;
  text(name, W / 2, ty, tw, 76, 800, L.shape === 'printed' ? acc : ink);
  text(b.style.toUpperCase(), W / 2, ty + bh * 0.2, tw * 0.9, 22, 600, L.shape === 'printed' ? acc : ink);
  text(`${b.abv}% VOL`, W / 2, ty + bh * 0.3, tw * 0.6, 20, 600, L.shape === 'printed' ? acc : ink);
  c.restore();
  // The neck band.
  c.fillStyle = L.shape === 'printed' ? acc : acc === ink ? bg : acc;
  c.fillRect(W * 0.28, 0, W * 0.44, H * 0.26);
  c.textBaseline = 'middle';
  text(name, W / 2, H * 0.13, W * 0.3, 30, 700, L.shape === 'printed' ? bg : ink === c.fillStyle ? bg : ink);
  uploadLabel(labCanvas);
}
function uploadLabel() { if (labTex) labTex.needsUpdate = true; }

/* ---------- the custom render: behind, then beer and fizz, then the glass ---------- */
// A two-pass blur: everything behind the glass is out of focus in a macro shot.
const BLUR_FS = `
uniform sampler2D t;
uniform vec2 uStep;
varying vec2 vUv;
void main() {
  vec3 c = vec3(0.0);
  float w = 0.0;
  for (int i = -6; i <= 6; i++) { float k = exp(-float(i * i) / 18.0); c += texture2D(t, vUv + uStep * float(i)) * k; w += k; }
  gl_FragColor = vec4(c / w, 1.0);
}`.replace('texture2D(t, vUv + uStep * float(i)) * k', 'texture2D(t, vUv + uStep * float(i)).rgb * k');
let rtBlur, blurScene, blurMat;
class StagePass extends Pass {
  render(r, writeBuffer) {
    r.setRenderTarget(rtBlur);
    r.clear();
    r.render(back, camera);
    // Blur across, then down, back into the behind target.
    const px = 2.2 * dpr;
    blurMat.uniforms.t.value = rtBlur.texture;
    blurMat.uniforms.uStep.value.set(px / rtBlur.width, 0);
    r.setRenderTarget(rtBehind);
    r.render(blurScene, camera);
    blurMat.uniforms.t.value = rtBehind.texture;
    blurMat.uniforms.uStep.value.set(0, px / rtBlur.height);
    r.setRenderTarget(rtBlur);
    r.render(blurScene, camera);
    blurMat.uniforms.t.value = rtBlur.texture;
    blurMat.uniforms.uStep.value.set(0, 0);
    r.setRenderTarget(rtBehind);
    r.render(blurScene, camera);
    r.setRenderTarget(rtScene);
    r.clear();
    r.render(mid, camera);
    r.setRenderTarget(this.renderToScreen ? null : writeBuffer);
    r.clear();
    r.render(top, camera);
  }
}

function build() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  if (!renderer.capabilities.isWebGL2) throw new Error('WebGL 2 unavailable');
  renderer.autoClear = false;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  camera = new THREE.PerspectiveCamera(25, 1.6, 0.5, 400);
  const rtOpt = { type: THREE.HalfFloatType, depthBuffer: true };
  rtBehind = new THREE.WebGLRenderTarget(4, 4, rtOpt);
  rtScene = new THREE.WebGLRenderTarget(4, 4, rtOpt);
  rtBlur = new THREE.WebGLRenderTarget(4, 4, rtOpt);
  blurMat = new THREE.ShaderMaterial({ vertexShader: FULL_VS, fragmentShader: BLUR_FS, depthTest: false, depthWrite: false, uniforms: { t: { value: null }, uStep: { value: new THREE.Vector2() } } });
  blurScene = new THREE.Scene();
  blurScene.add(fullQuad(blurMat, 0));
  gTex = new THREE.DataTexture(new Float32Array(NP * 4), NP, 1, THREE.RGBAFormat, THREE.FloatType);
  gTex.magFilter = gTex.minFilter = THREE.NearestFilter;
  U.uGP.value = gTex;
  labTex = new THREE.CanvasTexture(labCanvas);
  labTex.colorSpace = THREE.NoColorSpace;
  labTex.anisotropy = 8;

  // Behind: the room, the table and the bottle.
  const camU = { uCamPos: { value: new THREE.Vector3() }, uCamR: { value: new THREE.Vector3() }, uCamU: { value: new THREE.Vector3() }, uCamF: { value: new THREE.Vector3() }, uTan: { value: new THREE.Vector2() } };
  const bgMat = new THREE.ShaderMaterial({ vertexShader: FULL_VS, fragmentShader: BACK_FS, depthTest: false, depthWrite: false, uniforms: { ...U, ...camU } });
  back.add(fullQuad(bgMat, -10));
  back.userData.cam = camU;
  const table = new THREE.Mesh(new THREE.PlaneGeometry(200, 92).rotateX(-Math.PI / 2).translate(0, 0, -16), new THREE.ShaderMaterial({ vertexShader: TABLE_VS, fragmentShader: TABLE_FS, uniforms: { ...U, uFill: { value: 0 } } }));
  table.userData.fill = table.material.uniforms.uFill;
  back.add(table);
  back.userData.table = table;
  bottleMesh = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.ShaderMaterial({
    vertexShader: BOTTLE_VS, fragmentShader: BOTTLE_FS, side: THREE.DoubleSide,
    uniforms: { ...U, uLabel: { value: labTex }, uLab: { value: new THREE.Vector4() }, uBH: { value: 20 }, uBLevel: { value: 0 }, uPainted: { value: 0 },
      uTintB: { value: new THREE.Vector3() }, uPaint: { value: new THREE.Vector3() }, uBeerCol: { value: new THREE.Vector3() } },
  }));
  back.add(bottleMesh);

  // Middle: the room as seen, the beer, the fizz and the head.
  mid.add(fullQuad(showTex(rtBehind.texture), -10));
  beerMesh = new THREE.Mesh(bodyGeometry(), new THREE.ShaderMaterial({ vertexShader: BEER_VS, fragmentShader: BEER_FS, depthWrite: false, uniforms: { ...U, uBehind: { value: rtBehind.texture } } }));
  beerMesh.frustumCulled = false;
  beerMesh.renderOrder = 1;
  fizzMesh = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.ShaderMaterial({
    vertexShader: FIZZ_VS, fragmentShader: FIZZ_FS, transparent: true, depthWrite: false,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
    uniforms: { ...U, uWall: { value: 0 }, uWallT: { value: 0 }, uFizz: { value: 0.6 }, uFocus: { value: 30 }, uCoc: { value: 0.5 }, uPx: { value: 0.001 }, uOn: { value: 0 } },
  }));
  fizzMesh.frustumCulled = false;
  fizzMesh.renderOrder = 2;
  foamMesh = new THREE.Mesh(bodyGeometry(24, 128, 24), new THREE.ShaderMaterial({
    vertexShader: FOAM_VS, fragmentShader: FOAM_FS,
    uniforms: { ...U, uFoamCol: { value: new THREE.Vector3(1, 1, 1) }, uDome: { value: 0 }, uRock: { value: 0 }, uCell: { value: 0.15 }, uCoarse: { value: 0 } },
  }));
  foamMesh.frustumCulled = false;
  foamMesh.renderOrder = 3;
  mid.add(beerMesh, fizzMesh, foamMesh);

  // Top: the middle as seen, and the glass over it.
  top.add(fullQuad(showTex(rtScene.texture), -10));
  glassMesh = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.ShaderMaterial({
    vertexShader: GLASS_VS, fragmentShader: GLASS_FS, depthWrite: true, side: THREE.DoubleSide,
    uniforms: { ...U, uScene: { value: rtScene.texture }, uChill: { value: 0.5 }, uCold: { value: 0 }, uMistAge: { value: 0.2 } },
  }));
  top.add(glassMesh);

  composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType }));
  composer.addPass(new StagePass());
  bloom = new UnrealBloomPass(new THREE.Vector2(16, 9), 0.4, 0.6, 0.9);
  composer.addPass(bloom);
  finalPass = new ShaderPass({ uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uVig: { value: 0.55 } }, vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }', fragmentShader: FINAL_FS });
  composer.addPass(finalPass);
}

/* ---------- camera ---------- */
// A macro shot: the glass fills most of the frame; the bottle rests out of focus at the right.
let narrow = false, dpr = 1;
const rest = { x: 9.5, z: -7 };
function frameCamera(w, h) {
  const aspect = w / h;
  narrow = w < 640;
  const gh = glass.h;
  const at = new THREE.Vector3(narrow ? 0.6 : 2.2, gh * 0.6, 0);
  const dist = 34;
  camera.position.set(at.x * 0.3, at.y + 3.4, dist);
  camera.lookAt(at);
  // The frame holds the bowl; on phones it also holds the glass's width.
  // The frame always keeps the glass's width, with room for the pour beside it.
  const halfH = Math.max(gh * 0.52, (narrow ? 7.6 : 10.5) / aspect);
  camera.fov = 2 * Math.atan(halfH / dist) * 180 / Math.PI;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  rest.x = narrow ? 8 : 12;
  rest.z = narrow ? -16 : -14;
}
function resize() {
  const rc = stage.getBoundingClientRect();
  const w = Math.max(1, rc.width), h = Math.max(1, rc.height);
  dpr = pixelRatio(w, h, { maxDpr: 2, budget: 1.4e6 });
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
  rtBehind.setSize(Math.round(w * dpr), Math.round(h * dpr));
  rtScene.setSize(Math.round(w * dpr), Math.round(h * dpr));
  rtBlur.setSize(Math.round(w * dpr), Math.round(h * dpr));
  bloom.resolution.set(w, h);
  U.uRes.value.set(Math.round(w * dpr), Math.round(h * dpr));
  frameCamera(w, h);
}

/* ---------- fill model ---------- */
// vol: beer (cm³); foam: head (cm³); age: mean foam age (s).
const fill = { vol: 0, foam: 0, age: 0, level: 0, top: 0, post: 0, cap: 1 };
const fx = { surge: 0, wall: 0, wallT: 0, chill: 0.55, cold: 0, mistAge: 0.15 };
function settleLevels() {
  fill.cap = glass.volBelow(glass.h - 0.05);
  fill.vol = Math.min(fill.vol, fill.cap);
  fill.level = fill.vol > 0.5 ? glass.levelFor(fill.vol) : glass.ybot;
  // Foam past the rim spills.
  if (fill.vol + fill.foam > fill.cap) fill.foam = Math.max(fill.cap - fill.vol, 0);
  fill.top = fill.foam > 0.5 ? glass.levelFor(fill.vol + fill.foam) : fill.level;
}
function freshGlass() {
  Object.assign(fill, { vol: 0, foam: 0, age: 0, post: 0 });
  Object.assign(fx, { surge: 0, wall: 0, wallT: 0, chill: 0.32, cold: 0, mistAge: 0.15 });
  settleLevels();
}

/* ---------- beer ---------- */
const look = { sigma: [0, 0, 0], foam: [1, 1, 1] };
function setBeer(id) {
  beer = BEERS.find(b => b.id === id) || BEERS[0];
  const G = beer.glass, B = beer.bottle;
  const gv = vesselProfile(G.outline, GMAX, G.ybot, () => G.wall);
  glass.load(gv);
  const bv = vesselProfile(B.outline, BMAX, B.kind === 'champ' ? 1.8 : 0.6, ro => (ro < 1.7 ? 0.42 : 0.3));
  bottleV.load(bv);
  // The style runs the colour a little richer than the measured beer.
  look.sigma = sigmaFor(beer).map(x => x * 1.75);
  look.foam = hexLin(beer.foam);
  gTex.image.data.set(glass.prof);
  gTex.needsUpdate = true;
  U.uGH.value = glass.h;
  U.uGYb.value = glass.ybot;
  U.uSigma.value.set(...look.sigma);
  U.uHaze.value = beer.haze;
  glassMesh.geometry.dispose();
  glassMesh.geometry = glassGeometry(G.outline, glass.prof);
  bottleMesh.geometry.dispose();
  bottleMesh.geometry = new THREE.LatheGeometry(B.outline.map(([y, r]) => new THREE.Vector2(Math.max(r, 0.001), y)), 96);
  const bu = bottleMesh.material.uniforms;
  bu.uBH.value = bottleV.h;
  bu.uLab.value.set(...B.lab);
  bu.uTintB.value.set(...hexLin(B.glass).map(c => Math.min(c * 5, 1)));
  bu.uPainted.value = B.paint ? 1 : 0;
  if (B.paint) bu.uPaint.value.set(...hexLin(B.paint));
  bu.uBeerCol.value.set(...look.sigma.map(s => Math.exp(-s * 3)));
  const fu = foamMesh.material.uniforms;
  fu.uFoamCol.value.set(...look.foam);
  fu.uCell.value = beer.cell;
  drawLabel(beer);
  uploadLabel();
  fizzMesh.geometry.dispose();
  fizzMesh.geometry = fizzGeometry();
  const rc = stage.getBoundingClientRect();
  frameCamera(Math.max(rc.width, 1), Math.max(rc.height, 1));
  freshGlass();
}

/* ---------- pour (interim: the grab-the-bottle pour comes next) ---------- */
// Hold to pour: beer flows in, makes foam, starts the surge and wets the walls with bubbles.
const pour = { on: false, auto: 0, flow: 0, t: 0 };
function pourStep(dt) {
  const on = pour.on || pour.auto > 0;
  if (pour.auto) { pour.auto += dt; if (fill.vol + fill.foam > fill.cap * 0.98 || pour.auto > 14) { pour.auto = 0; fill.post = 1; } }
  pour.flow += ((on ? 1 : 0) - pour.flow) * ease(dt, on ? 0.25 : 0.15);
  if (pour.flow < 0.01) return;
  const q = 40 * pour.flow * dt;
  const fp = beer.power * (0.3 + 0.9 * fizz * beer.fizz) * 0.55;
  fill.age = fill.age * fill.foam / (fill.foam + q * fp + 1e-6);
  fill.foam += q * fp;
  fill.vol += q * (1 - 0.2 * Math.min(fp, 1));
  fx.surge = Math.min(fx.surge + pour.flow * dt * 0.5, 1);
  fx.wall = Math.min(fx.wall + pour.flow * dt * 0.25, 0.85);
}
function foamStep(dt) {
  if (fill.post > 0.001) {
    const add = fill.post * 6 * beer.power * (0.3 + fizz) * dt;
    fill.age = fill.age * fill.foam / (fill.foam + add + 1e-6);
    fill.foam += add;
    fill.post *= Math.exp(-dt / 2.2);
  }
  const half = beer.half * (foamTime === 'real' ? 3 : 1);
  const lost = fill.foam * (1 - Math.exp(-dt * Math.LN2 / half));
  fill.foam -= lost;
  fill.vol += lost * 0.2;
  if (fill.foam < 0.3) fill.foam = 0;
  fill.age += dt;
  // The surge clears; wall bubbles let go over minutes; the cold glass fogs.
  fx.surge *= Math.exp(-dt / 9);
  fx.wall *= Math.exp(-dt / 150);
  fx.wallT += dt;
  fx.chill = Math.max(fx.chill - dt * fx.chill / 150, 0.12);
  const coldT = fill.vol > 1 ? 1 : 0;
  fx.cold += (coldT - fx.cold) * ease(dt, coldT > fx.cold ? 25 : 60);
  fx.mistAge = Math.min(fx.mistAge + dt / 45 * Math.max(fx.cold, fx.chill), 1);
}
act.pour = () => { if (fill.vol + fill.foam > fill.cap * 0.9) freshGlass(); pour.auto = 1e-3; live(); };
act.sip = () => { pour.auto = 0; fill.vol = Math.max(0, fill.vol - fill.cap * 0.1); fill.foam *= 0.85; live(); };
act.clear = () => { pour.auto = 0; pour.on = false; freshGlass(); live(); };
act.reset = act.clear;

/* ---------- render ---------- */
let time = 0;
function render() {
  const lamp = oklchLinear(...LIGHTS[light]);
  U.uLamp.value.set(...lamp);
  U.uTime.value = time;
  U.uLevel.value = fill.vol > 0.5 ? fill.level : glass.ybot - 0.01;
  U.uTop.value = fill.top;
  U.uSurge.value = fx.surge;
  const cu = back.userData.cam;
  const e = camera.matrixWorld.elements;
  cu.uCamPos.value.setFromMatrixPosition(camera.matrixWorld);
  cu.uCamR.value.set(e[0], e[1], e[2]);
  cu.uCamU.value.set(e[4], e[5], e[6]);
  cu.uCamF.value.set(-e[8], -e[9], -e[10]);
  const th = Math.tan(camera.fov * Math.PI / 360);
  cu.uTan.value.set(th * camera.aspect, th);
  back.userData.table.userData.fill.value = fill.vol > 0.5 ? 1 : 0;
  beerMesh.visible = fill.vol > 0.5;
  const thick = fill.foam > 0.5 ? fill.top - fill.level : 0;
  foamMesh.visible = thick > 0.05;
  const fu = foamMesh.material.uniforms;
  fu.uDome.value = Math.min(0.5, thick * 0.12);
  fu.uRock.value = (beer.rock || 0.2) * clamp(thick / 2.5) * (0.5 + 0.5 * Math.exp(-fill.age / beer.half));
  fu.uCoarse.value = Math.sqrt(fill.age / beer.half) * 0.6;
  const zu = fizzMesh.material.uniforms;
  zu.uOn.value = fill.vol > 1 ? 1 : 0;
  zu.uWall.value = fx.wall;
  zu.uWallT.value = fx.wallT;
  zu.uFizz.value = fizz * beer.fizz;
  zu.uFocus.value = camera.position.distanceTo(new THREE.Vector3(0, glass.h * 0.55, 3));
  zu.uCoc.value = 0.35;
  zu.uPx.value = 2 * Math.tan(camera.fov * Math.PI / 360) / Math.max(U.uRes.value.y, 1);
  const gu = glassMesh.material.uniforms;
  gu.uChill.value = fx.chill;
  gu.uCold.value = coldGlass ? fx.cold * 0.75 : 0;
  gu.uMistAge.value = fx.mistAge;
  // The bottle rests at the right, out of focus; its beer level shows through the glass.
  bottleMesh.position.set(rest.x, 0, rest.z);
  bottleMesh.material.uniforms.uBLevel.value = bottleV.h * 0.85;
  finalPass.uniforms.uTime.value = time;
  composer.render();
}

/* ---------- frame loop ---------- */
// Lively frames run at full rate; drifting frames (fizz, a settling head) at 30 fps.
// 60 s after the last input the fizz eases to a stop over 2 s, and the loop sleeps.
let raf = 0, last = 0, lastDraw = 0, visible = true, lastInput = performance.now(), pace = 1, ready = false;
const live = () => { lastInput = performance.now(); wake(); };
function wake() { if (!raf && visible && ready) { last = performance.now(); raf = requestAnimationFrame(frame); } }
const lively = () => pour.on || pour.auto > 0 || pour.flow > 0.01 || fill.post > 0.02;
function frame(now) {
  raf = 0;
  let again = true;
  try {
    if (!lively() && now - lastDraw < 31) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    lastDraw = now;
    const idle = now - lastInput > 60000 && !lively();
    pace += ((idle ? 0 : 1) - pace) * ease(dt, 0.6);
    pourStep(dt);
    foamStep(dt * pace);
    settleLevels();
    time += dt * pace * (reduced() ? 0.25 : 1);
    render();
    again = !(idle && pace < 0.01);
  } finally {
    if (again && visible) raf = requestAnimationFrame(frame);
  }
}

/* ---------- pointer ---------- */
let ptr = null;
function down(e) {
  if (ptr || e.button > 0) return;
  try { canvas.setPointerCapture(e.pointerId); } catch { /* A synthetic pointer has no capture. */ }
  ptr = { id: e.pointerId };
  if (fill.vol + fill.foam > fill.cap * 0.95) freshGlass();
  pour.on = true;
  stage.classList.add('pour');
  live();
}
function up(e) {
  if (!ptr || (e && e.pointerId !== ptr.id)) return;
  ptr = null;
  pour.on = false;
  fill.post = Math.max(fill.post, 0.6);
  stage.classList.remove('pour');
  live();
}

/* ---------- boot ---------- */
try {
  build();
  resize();
  setBeer(beer.id);
  await renderer.compileAsync(back, camera);
  await renderer.compileAsync(mid, camera);
  await renderer.compileAsync(top, camera);
  render();
  canvas.classList.add('on');
  ready = true;
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  ui.hideControls?.();
  markReady();
  throw err;
}
markReady();
wake();
document.fonts.ready.then(() => { drawLabel(beer); uploadLabel(); live(); });

canvas.addEventListener('pointerdown', down);
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
canvas.addEventListener('lostpointercapture', up);
stage.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat) return;
  e.preventDefault();
  if (fill.vol + fill.foam > fill.cap * 0.95) freshGlass();
  pour.on = true;
  live();
});
stage.addEventListener('keyup', e => { if (e.code === 'Space') { pour.on = false; fill.post = Math.max(fill.post, 0.6); live(); } });

new ResizeObserver(() => { resize(); render(); wake(); }).observe(stage);
onQuality(() => { resize(); render(); });
onReducedChange(() => { render(); wake(); });
// A hidden tab stops the loop and the sim clock with it.
whenVisible(stage, v => {
  visible = v;
  if (!v) { cancelAnimationFrame(raf); raf = 0; return; }
  wake();
});
</script>
</body>
</html>
