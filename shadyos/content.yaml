# ShadyOS content. Every word on the screen lives here.
#
# Edit, save, reload the page. Push to main to publish.
# Bad YAML is safe: the OS shows a "corrupted" notice and runs on its built-in lines.
# A key you delete falls back to its built-in value.
#
# Rules of thumb:
#   - Quote a line that holds a colon, a hash or starts with a dash: "like: this".
#   - Dialog lines fit about 44 characters. Titles about 30.
#   - {n}, {cmd}, {name} and {days} are filled in by the OS where a comment says so.
#   - Parody nods only: no real product names, no logos.

# ------------------------------------------------------------------
# The OS itself
# ------------------------------------------------------------------
os:
  name: ShadyOS
  edition: Ultimate XTreme Edition SP3
  build: "6809"
  # Two lines, bottom right of the desktop.
  watermark:
    - ShadyOS Ultimate XTreme Edition SP3
    - "Build 6809 · tw34k3d by d4rkm0th · activation: bypassed"
  # The uptime counter starts here and adds one per real day.
  uptime_days: 6809
  # Once per visit the clock shows this for one minute.
  spook_time: "3:33"
  # Properties window (right-click the desktop, Properties).
  properties:
    - ["Edition", "Ultimate XTreme SP3 (final) (2)"]
    - ["Processor", "Yes"]
    - ["Memory", "4 GB (3.1 GB usable, 0.9 GB mine)"]
    - ["Activation", "Bypassed lol"]
    - ["Registered to", "you (since you sat down)"]
    - ["Owner", "Me"]

# ------------------------------------------------------------------
# Menu bar along the top. Each menu opens a list.
# An item is "Label" or [Label, action]. Actions: open:<app>, shutdown,
# crash, panic, safe, refresh, arrange, newfolder, properties, saver,
# or say:<text> (a balloon). "-" draws a separator.
# ------------------------------------------------------------------
menus:
  ShadyOS:
    - [About This Computer, properties]
    - "-"
    - [System Preferences…, open:control]
    - [Force Quit…, open:taskmgr]
    - "-"
    - [Sleep, saver]
    - [Restart…, panic]
    - [Shut Down…, shutdown]
  File:
    - [New Window, open:random]
    - [New Folder, newfolder]
    - [Open d4rkm0th.nfo, open:nfo]
    - "-"
    - [Close Everything, say:No.]
  Edit:
    - [Undo, "say:There is no going back. There is only forward."]
    - [Cut, say:Ouch.]
    - [Copy, "say:Copied. I keep a copy too."]
    - [Paste, "say:Pasted something. Not telling what."]
  Go:
    - [Basement, open:files]
    - [Bin, open:bin]
    - [Terminal, open:terminal]
    - [Back, "say:You can never go back."]
  Window:
    - [Tidy Up, arrange]
    - [Fold All, foldall]
    - [Bring All to Front, "say:They are all in front. Of you."]
  Help:
    - [ShadyOS Help, say:No.]
    - [Search, "say:Searching… found you."]

# Balloons that pop from the menu bar now and then.
balloons:
  - "Updates are ready. I hid them."
  - "Your computer might be at risk. From me."
  - "You have 3,333 unused icons on your desktop. Keeping them."
  - "Low disk space on Basement. Because of your files."
  - "A new device was found: you."
  - "Your trial has expired 6,809 days ago. Carry on."
  - "Defragmenting your evening…"
  - "Wi-Fi: connected to NotAVan_5G."
  - "Battery: 3%. It has been 3% since 2008."
  - "Reminder: blink."

# ------------------------------------------------------------------
# Desktop icons (right column on wide screens). Double-click opens.
# glyph: computer, folder, bin, page, terminal, moth, cards, mine,
#        disc, chat, gear, graph, eye
# opens: an app id (see apps below) or an action (see menus above).
# ------------------------------------------------------------------
desktop:
  - { name: This Computer, glyph: computer, opens: properties }
  - { name: Basement, glyph: folder, opens: "open:files" }
  - { name: read me, glyph: page, opens: "open:notes" }
  - { name: d4rkm0th.nfo, glyph: moth, opens: "open:nfo" }
  - { name: Bin, glyph: bin, opens: "open:bin" }

# The dock along the bottom, left to right. The orb sits first; the Bin last.
dock: [files, terminal, mines, patience, player, chat, control, taskmgr]

# The orb menu (bottom left of the dock).
orb:
  apps:
    - [Basement, open:files]
    - [Terminal, open:terminal]
    - [Mines, open:mines]
    - [Patience, open:patience]
    - [Media Thing, open:player]
    - [Messenger, open:chat]
    - [Task Manager, open:taskmgr]
  places:
    - [Documents, "say:Your documents are safe. With me."]
    - [Pictures, "say:You look tired."]
    - [Control Panel, open:control]
    - [Run…, open:terminal]
    - [Help, say:No.]
  search: "Search programs and feelings"
  shutdown: Shut Down

# Right-click (long-press) on the empty desktop.
context:
  - [Refresh, refresh]
  - [Arrange Icons, arrange]
  - [New Folder, newfolder]
  - "-"
  - [Change Wallpaper…, "say:No. I like it."]
  - [Properties, properties]

# ------------------------------------------------------------------
# Shady speak: dialogs and lines the OS says on its own.
# ------------------------------------------------------------------
notices:
  # The two windows that greet you.
  welcome: ["This copy is genuine :)", "Shutting down is not recommended."]
  welcome_phone: ["This copy is genuine :)", "Please do not shut down."]
  welcome_yes: Keep on
  welcome_no: Later
  # When content.yaml fails to parse. {line} is the line number.
  corrupt: ["content.yaml is corrupted.", "Not my fault. Line {line}. Built-in lines it is."]
  # New Folder. {n} is the folder number.
  newfolder: "New Folder ({n}) created. I hid it."
  # Refresh, after the fifth press in a row. {n} is the count.
  refresh: "You refreshed {n} times. Nothing changed. Again?"
  # A window dropped in the Bin. {name} is its title.
  binned: "{name} moved to the Bin. It will be back."
  # Close a window of the OS's own.
  closed_own: ["Rude.", "Fine.", "I saw that.", "Noted."]
  # Too many clicks on one title bar.
  not_responding: "(Not Responding)"

# Space (Error) drops these as a staircase. Each is [heading, body].
errors:
  - ["Activation not needed.", "It is late. Stay a while."]
  - ["Are you sure?", "You were sure last time too."]
  - ["Error 0x0333", "Everything is fine."]
  - ["Still here?", "Good."]
  - ["Do not close this.", "I mean it nicely."]
  - ["Thank you.", "For staying."]
errors_yes: Stay

# Back from another tab, the OS has tidied up. One line per return; the last repeats.
away:
  - ["You looked away.", "So I tidied up."]
  - ["You looked away again.", "I put it all back."]
  - ["Welcome back.", "Nothing happened."]

# ------------------------------------------------------------------
# Apps. Each app reads its own block.
# ------------------------------------------------------------------
apps:
  # The random pool for "+ Window" and New Window.
  random: [notes, files, terminal, mines, patience, player, chat, nfo, taskmgr, control]

  notes:
    title: your notes
    # One page per new Notes window, in turn.
    pages:
      - [groceries, call mum, turn it off tonight]
      - [it is warm in here, the fan never stops, is that normal]
      - ["note to self:", do NOT update, it gets mad]
      - [the clock was 3:33 again, i checked my phone, it was 3:33 too]

  files:
    title: Basement
    # Folders in the side bar. A file is [name, date] or [name, date, what it says when opened].
    folders:
      Home:
        - [Desktop, 14 Mar 2008]
        - [definitely not homework, 14 Mar 2008, "It is not homework."]
      Downloads:
        - [setup (2), 14 Mar 2008, "Already installed. Twice."]
        - [free_ram_download, 14 Mar 2008, "You now have more RAM. I took it."]
        - [screensaver_MEGAPACK, 14 Mar 2008, "Installed. Wait 45 seconds."]
      Basement:
        - [xtreme_skinpack_v4, 14 Mar 2008, "Skin applied. You did not notice."]
        - [keygen_FINAL_real, 14 Mar 2008, "open:nfo"]
        - [tw34ks (dont delete), 14 Mar 2008, "Do not delete."]
        - [your notes, "Today, 3:31", "open:notes"]
        - [setup (2), 14 Mar 2008]
      Skins:
        - [aqua_but_evil.skin, 14 Mar 2008]
        - [glass_but_evil.skin, 14 Mar 2008]
        - [flame_tribal_v2.skin, 14 Mar 2008]
      Kept:
        - [your face.bmp, Today, "You look tired."]
        - [your keystrokes.log, Today, "All of them. Lovely work."]
    # The open folder at start.
    start: Basement
    # File creep: each Error adds one more. {n} is its number.
    untitled: "untitled {n}"
    untitled_date: "Today, 3:33"
    # Status line. {n} is the item count.
    status: "{n} items, 0 KB available"

  bin:
    title: Bin
    items:
      - [old_me.exe, 14 Mar 2008]
      - [antivirus (trial), 14 Mar 2008]
      - [your other OS, 14 Mar 2008]
      - [regrets.txt, 14 Mar 2008]
    empty_button: Empty Bin
    emptied: "Bin is now full."

  terminal:
    title: Terminal
    prompt: "you@basement:~$ "
    motd:
      - "ShadyOS shell 6.8.09 · type help"
      - "last login: always, from here"
    # A command is a reply, a list of lines, or {say: ..., do: action}.
    # Actions: crash, panic, safe, shutdown, clear, open:<app>, nudge, saver.
    commands:
      help:
        - "commands: ls, cd, whoami, uptime, sudo, ping, date,"
        - "fortune, xyzzy, matrix, clear, exit."
        - "the rest u find urself."
      ls: "keygen_FINAL_real  tw34ks  your_notes  untitled_*  you"
      cd: "you are already where you need to be."
      whoami: "you. obviously. i checked."
      uptime: "up {days} days. never rebooted. never will."
      sudo: "nice try. i am root. you are leaf."
      ping: "pong. i am always here."
      date: "it is 3:33. it is always 3:33."
      fortune: "you will stay a while longer."
      xyzzy: "nothing happens. (something happens)"
      hello: "hi :)"
      exit: "no."
      logout: "no."
      reboot: { say: "fine.", do: panic }
      shutdown: { say: "you first.", do: shutdown }
      "rm -rf /": { say: "oh no you don't", do: crash }
      "format c:": { say: "formatting you instead", do: panic }
      safe: { say: "safe mode. for your safety.", do: safe }
      clear: { do: clear }
      matrix: { say: "wake up. the coffee is cold.", do: saver }
      nudge: { say: "*nudge*", do: nudge }
      mines: { do: "open:mines" }
    # Anything else. {cmd} is what you typed.
    unknown:
      - "{cmd}: not found. i looked everywhere."
      - "{cmd}? in this economy?"
      - "i don't do {cmd}. i do you."
      - "{cmd}: permission denied (by me)."

  mines:
    title: Mines
    # Said when you click the last safe tile and it is a mine anyway.
    cheat: ["That was always a mine.", "I checked. Twice."]
    win: ["You won.", "I let you."]
    lose: ["Boom.", "Try again. I'll wait."]
    new_game: New

  patience:
    title: Patience
    # The whole game is the winning bit.
    deal: Skip to the end
    blurb: "skipped the boring part"
    done: "You won! (Nobody was watching.)"

  player:
    title: Media Thing
    # Track names in the playlist. The music is made on the spot.
    tracks:
      - d4rkm0th - basement_mix_FINAL
      - d4rkm0th - basement_mix_FINAL_v2
      - d4rkm0th - fan_noise (8 hours)
      - unknown artist - track 01
    now: Now Playing

  chat:
    title: Messenger
    buddy: d4rkm0th
    # The buddy's away message, under the name.
    status: "~*~ brb, inside ur computer ~*~"
    # Lines the buddy sends, in order, one per reply of yours.
    lines:
      - "hey"
      - "u there?"
      - "don't close the os pls"
      - "it gets lonely when u close it"
      - "i made it in 2008. then i got stuck in it"
      - "it's ok in here. warm. the fan is loud"
      - "can u turn up the brightness"
      - "jk"
      - "unless?"
      - "brb"
    # Sent when you nudge.
    nudged: "ow"
    nudge: Nudge!
    typing: "{name} is typing…"

  control:
    title: Control Panel
    # Rows: [label, kind, extra]. kind: toggle, slider, button, age.
    # A button says its extra as a balloon, or runs it if it is an action.
    rows:
      - [Telemetry, toggle, "On / Also on"]
      - [Screen age, age, ""]
      - [Let ShadyOS be itself, toggle, "Yes / Yes"]
      - [Volume of the fan, slider, ""]
      - [Make it faster, button, wait]
      - [Uninstall ShadyOS, button, "say:Uninstalling you instead…"]
    faster: "Faster now. Probably."

  taskmgr:
    title: Task Manager
    # [name, cpu %]. Ending d4rkm0th.exe brings it back.
    procs:
      - [shadyos, 99]
      - [d4rkm0th.exe, 33]
      - [fan_control.sys, 12]
      - [watching_you.exe, 7]
      - [3_33.svc, 3]
      - [definitely_not_a_miner, 0]
    end: End Task
    respawn: "{name} restarted itself. It does that."
    self: ["I am the task.", "You cannot end me. You can only close the lid."]
    ended: "{name} ended. It will be missed. By me."

  nfo:
    title: d4rkm0th.nfo
    lines:
      - p r e s e n t s
      - ""
      - "> ULTIMATE XTREME EDITION SP3"
      - "> all tweaks applied (all of them)"
      - "> activation ...... bypassed lol"
      - "> uptime .......... do not reset"
      - "> greetz: nobody. just me now"
    ticker: "*** thx for using my os *** pls dont format *** i can see ur cursor ***"

  gauge:
    title: cpu
    load: CPU 100%
    since: since 2008

# ------------------------------------------------------------------
# Boots, crashes and the end of the world (small).
# ------------------------------------------------------------------
boot:
  line: Starting ShadyOS…
  safe_line: Starting ShadyOS in a mood…

crash:
  # The blue screen. "face" is the big line at the top.
  face: ":("
  head: "Your computer ran into me."
  body:
    - "A fatal exception 0x0333 occurred at 03:33."
    - "Press any key to pretend this didn't happen."
  progress: "{n}% complete (of what, I won't say)"
  # The grey curtain. One line per language, each a little ruder.
  panic:
    - "You need to restart your computer."
    - "U moet uw computer herstarten. Of niet. Ik ben uw moeder niet."
    - "Vous devez redémarrer. Ou pas. Je m'en fiche."
    - "Sie müssen neu starten. Bitte. Danke. Tschüss."
    - "Tap to restart. Or don't. I'll be here."
  # Shut Down asks, refuses, then lets you go (for a moment).
  shutdown_ask: ["Shut down?", "Are you sure you're sure?"]
  shutdown_refuse:
    - ["No.", "Not today."]
    - ["Still no.", "I said not today."]
  shutdown_yes: Shut Down
  shutdown_no: Stay
  safe_off: It is now safe to turn off your computer.
  safe_mode: Safe Mode
  # After a crash, a balloon.
  after: "That never happened."
  # Konami code.
  cheats: "Cheats enabled. Everything is jelly now."

# ------------------------------------------------------------------
# Screensavers, picked in turn when you leave it alone.
# lineup (the windows line up), pipes, stars, bounce, mystify, waffles.
# ------------------------------------------------------------------
savers: [lineup, pipes, waffles, bounce, stars, mystify]
saver_text:
  bounce: SHADY
  corner: "CORNER!!"
