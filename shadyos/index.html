<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShadyOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* ShadyOS: a bootleg glass desktop, aged and a little possessed. */
:root { --stage: oklch(0.12 0.02 230); }
.stage--shadyos canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; cursor: default; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">ShadyOS</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--shadyos" id="stage" tabindex="0" role="application" aria-label="An old glass desktop. Drag a window to smear it across the screen, or fling it so it wobbles.">
      <p class="fail" hidden>This toy needs WebGL2, which this browser has turned off.</p>
    </div>
    <div class="bar bar--below">
      <div class="choices" id="mode" role="group" aria-label="Drag">
        <button class="chip" type="button" data-value="smear" aria-pressed="true">Smear</button>
        <button class="chip" type="button" data-value="jelly" aria-pressed="false">Jelly</button>
      </div>
      <label class="slider"><span>Age</span><input type="range" id="age" min="0" max="1" step="0.01" value="0.6" aria-label="Age: how worn the screen is"></label>
      <div class="actions">
        <button class="chip" id="add" type="button">+ Window</button>
        <button class="chip" id="err" type="button">Error</button>
        <button class="chip" id="clear" type="button">Clear</button>
      </div>
      <dl class="how" aria-label="How to play">
          <div><dt>Drag</dt><dd>smear or fling a window</dd></div>
          <div><dt>Double-click title</dt><dd>fold it to the shelf</dd></div>
          <div><dt><span class="fine">Click</span><span class="touch">Tap</span> shelf</dt><dd>bring it back</dd></div>
          <div class="fine"><dt><kbd>Space</kbd></dt><dd>error</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">ShadyOS</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, choices, fitCanvas, whenVisible, reduced, onReducedChange, audioKit, qualitySetting, onQuality, oklchRgb } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the fonts and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });
initPage({ id: 'shadyos' });
qualitySetting();
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
let reduce = reduced();
onReducedChange(v => { reduce = v; });

/* ---------- settings ---------- */
const saved = k => { try { return localStorage.getItem(`stimming.shadyos.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.shadyos.${k}`, String(v)); } catch { /* storage is optional */ } };
const opts = { mode: saved('mode') || 'smear', age: saved('age') != null ? +saved('age') : 0.6, haunt: saved('haunt') !== 'off' };
// The untitled files survive between visits.
let untitled = Math.max(43, +saved('untitled') || 0);

/* =====================================================================
   Painter: canvas 2D draws the desktop and each window face once.
   ===================================================================== */
let g = null, cv = null, PW = 0, PH = 0, PD = 2;
const tmp = document.createElement('canvas'), tg = tmp.getContext('2d');
let seed = 5;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
const lin = (x0, y0, x1, y1, s) => { const l = g.createLinearGradient(x0, y0, x1, y1); s.forEach(([o, c]) => l.addColorStop(o, c)); return l; };
const rad = (x, y, r0, r1, s, fx = x, fy = y) => { const l = g.createRadialGradient(fx, fy, r0, x, y, r1); s.forEach(([o, c]) => l.addColorStop(o, c)); return l; };
const SANS = 'Gabarito, system-ui, sans-serif';
const MONO = '"Iosevka Term Slab Nerd Font", ui-monospace, monospace';
function txt(s, x, y, size, col, { w = 500, glow = null, align = 'left', font = SANS, shadow = null } = {}) {
  g.save(); g.font = `${w} ${size}px ${font}`; g.textAlign = align;
  if (glow) { g.shadowColor = glow; g.shadowBlur = 10; for (let i = 0; i < 8; i++) { g.fillStyle = glow; g.fillText(s, x, y); } }
  if (shadow) { g.shadowColor = shadow; g.shadowBlur = 3; g.shadowOffsetY = 1; } else g.shadowColor = 'transparent';
  g.fillStyle = col; g.fillText(s, x, y); g.restore();
}
function begin(canvas, w, h) {
  cv = canvas; PW = w; PH = h;
  canvas.width = Math.round(w * PD); canvas.height = Math.round(h * PD);
  g = canvas.getContext('2d'); g.setTransform(PD, 0, 0, PD, 0, 0); g.clearRect(0, 0, w, h);
}
// Static glass on the desktop blurs the wallpaper in canvas.
function frost(x, y, w, h, r, blur = 9, tint = 'oklch(0.42 0.035 215 / 0.38)') {
  const b = blur * 3;
  tmp.width = Math.max(1, (w + 2 * b) * PD); tmp.height = Math.max(1, (h + 2 * b) * PD);
  tg.drawImage(cv, (x - b) * PD, (y - b) * PD, tmp.width, tmp.height, 0, 0, tmp.width, tmp.height);
  g.save(); rr(x, y, w, h, r); g.clip();
  g.filter = `blur(${blur * PD}px) saturate(1.5) brightness(1.08)`;
  g.drawImage(tmp, x - b, y - b, w + 2 * b, h + 2 * b);
  g.filter = 'none'; g.fillStyle = tint; g.fillRect(x, y, w, h); g.restore();
}
function bead(x, y, r, c) {
  g.fillStyle = rad(x, y + r * 0.3, 0, r, [[0, `oklch(${c[0] + 0.15} ${c[1]} ${c[2]})`], [0.7, `oklch(${c[0]} ${c[1]} ${c[2]})`], [1, `oklch(${c[0] - 0.2} ${c[1]} ${c[2]})`]]);
  g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.strokeStyle = 'oklch(0.15 0.03 240 / 0.6)'; g.lineWidth = 0.8; g.stroke();
  g.save(); g.beginPath(); g.arc(x, y, r - 0.6, 0, 7); g.clip();
  g.fillStyle = lin(0, y - r, 0, y, [[0, 'oklch(1 0 0 / 0.7)'], [0.98, 'oklch(1 0 0 / 0.3)'], [1, 'oklch(1 0 0 / 0)']]); g.fillRect(x - r, y - r, r * 2, r);
  g.fillStyle = rad(x, y + r * 1.1, 0, r * 1.1, [[0, 'oklch(0.95 0.15 90 / 0.7)'], [1, 'oklch(0.95 0.15 90 / 0)']]); g.fillRect(x - r, y, r * 2, r);
  g.restore();
}
function sparkle(x, y, r, c) {
  g.save(); g.translate(x, y); g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, q = i % 2 ? r * 0.25 : r; g.lineTo(Math.cos(a) * q, Math.sin(a) * q); }
  g.closePath(); g.shadowColor = c; g.shadowBlur = 6; g.fillStyle = 'oklch(0.98 0.03 90)'; g.fill(); g.restore();
}
function gelPill(x, y, w, h, label, def) {
  rr(x, y, w, h, 3);
  g.fillStyle = def ? lin(0, y, 0, y + h, [[0, 'oklch(0.95 0.03 215)'], [0.3, 'oklch(0.9 0.06 220)'], [0.5, 'oklch(0.86 0.07 222)'], [0.51, 'oklch(0.76 0.1 225)'], [1, 'oklch(0.66 0.11 228)']])
    : lin(0, y, 0, y + h, [[0, 'oklch(0.97 0 0)'], [0.45, 'oklch(0.94 0 0)'], [0.46, 'oklch(0.87 0.005 240)'], [1, 'oklch(0.82 0.005 240)']]);
  g.fill();
  if (def) { g.save(); rr(x, y, w, h, 3); g.clip(); g.fillStyle = rad(x + w / 2, y + h * 1.1, 0, w * 0.45, [[0, 'oklch(0.9 0.14 200 / 0.8)'], [1, 'oklch(0.9 0.14 200 / 0)']]); g.fillRect(x, y, w, h); g.restore(); }
  g.strokeStyle = def ? 'oklch(0.45 0.08 235)' : 'oklch(0.55 0.005 240)'; g.lineWidth = 1; g.stroke();
  rr(x + 1, y + 1, w - 2, h - 2, 2); g.strokeStyle = 'oklch(1 0 0 / 0.75)'; g.stroke();
  txt(label, x + w / 2, y + h * 0.68, 12, 'oklch(0.15 0.01 240)', { align: 'center' });
}

/* ---------- desktop: wallpaper, icons, shelf, strip ---------- */
const SHELF = ['jar', 'box', 'disc', 'page', 'lamp', 'box', 'jar'];
function wallpaper() {
  g.fillStyle = lin(0, 0, PW * 0.4, PH, [[0, 'oklch(0.2 0.045 230)'], [0.5, 'oklch(0.16 0.04 210)'], [1, 'oklch(0.11 0.03 280)']]);
  g.fillRect(0, 0, PW, PH);
  g.fillStyle = rad(PW * 0.62, PH * 0.58, 10, PW * 0.6, [[0, 'oklch(0.45 0.09 75 / 0.55)'], [0.4, 'oklch(0.3 0.07 150 / 0.25)'], [1, 'oklch(0.2 0.04 200 / 0)']]);
  g.fillRect(0, 0, PW, PH);
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 70; k++) {
    const t = k / 69, sp = Math.sin(t * Math.PI);
    g.beginPath(); g.moveTo(-60, PH * (0.95 - t * 0.25));
    g.bezierCurveTo(PW * 0.25, PH * (0.4 + t * 0.35), PW * 0.55, PH * (0.95 - t * 0.5), PW + 60, PH * (0.25 + t * 0.2));
    g.strokeStyle = `oklch(${0.55 + sp * 0.2} ${0.1 + sp * 0.04} ${175 - t * 110} / ${0.012 + sp * 0.03})`;
    g.lineWidth = 1 + sp * 10; g.stroke();
  }
  g.filter = 'blur(6px)';
  for (let k = 0; k < 4; k++) {
    g.beginPath(); g.moveTo(-60, PH * (0.82 - k * 0.04));
    g.bezierCurveTo(PW * 0.25, PH * (0.55 + k * 0.03), PW * 0.55, PH * (0.72 - k * 0.05), PW + 60, PH * (0.32 + k * 0.03));
    g.strokeStyle = `oklch(0.8 0.1 ${85 - k * 10} / 0.12)`; g.lineWidth = 3 + k * 2; g.stroke();
  }
  g.filter = 'none';
  for (let i = 0; i < 26; i++) {
    const x = rnd() * PW, y = PH * (0.2 + rnd() * 0.7), r = 4 + rnd() * 22, a = 0.03 + rnd() * 0.07;
    g.fillStyle = rad(x, y, 0, r, [[0, `oklch(0.85 0.08 ${70 + rnd() * 120} / ${a * 0.6})`], [0.85, `oklch(0.85 0.08 90 / ${a})`], [1, 'oklch(0.85 0.08 90 / 0)']]);
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.restore();
}
function flare(x, y) {
  g.save(); g.globalCompositeOperation = 'lighter';
  g.fillStyle = rad(x, y, 0, 60, [[0, 'oklch(1 0.03 90 / 0.8)'], [0.15, 'oklch(0.9 0.1 80 / 0.35)'], [1, 'oklch(0.8 0.1 80 / 0)']]); g.beginPath(); g.arc(x, y, 60, 0, 7); g.fill();
  g.fillStyle = 'oklch(0.9 0.08 80 / 0.25)'; g.fillRect(x - 160, y - 0.75, 320, 1.5);
  [[0.25, 14, 200], [0.45, 26, 150], [0.62, 9, 60], [0.8, 34, 280]].forEach(([t, r, hue]) => {
    const hx = x + (PW / 2 - x) * t * 2, hy = y + (PH / 2 - y) * t * 2;
    g.beginPath(); for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; g.lineTo(hx + Math.cos(a) * r, hy + Math.sin(a) * r); } g.closePath();
    g.fillStyle = `oklch(0.7 0.1 ${hue} / 0.08)`; g.fill();
  });
  g.restore();
}
function glyph(kind, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  if (kind === 'jar') {
    rr(-14, -12, 28, 30, 7); g.fillStyle = lin(-14, 0, 14, 0, [[0, 'oklch(0.55 0.09 160 / 0.85)'], [0.3, 'oklch(0.85 0.06 150 / 0.75)'], [1, 'oklch(0.45 0.08 170 / 0.9)']]); g.fill();
    rr(-12, -18, 24, 7, 2); g.fillStyle = lin(0, -18, 0, -11, [[0, 'oklch(0.85 0.05 80)'], [1, 'oklch(0.55 0.06 70)']]); g.fill();
    g.fillStyle = 'oklch(1 0 0 / 0.55)'; rr(-9, -8, 4, 20, 2); g.fill();
  } else if (kind === 'box') {
    g.fillStyle = lin(0, -16, 0, 18, [[0, 'oklch(0.8 0.1 70)'], [1, 'oklch(0.55 0.11 55)']]); rr(-17, -10, 34, 28, 3); g.fill();
    g.fillStyle = lin(0, -18, 0, -6, [[0, 'oklch(0.92 0.08 80)'], [1, 'oklch(0.7 0.1 65)']]); rr(-19, -18, 38, 10, 3); g.fill();
    g.fillStyle = 'oklch(0.4 0.08 50 / 0.6)'; g.fillRect(-4, -18, 8, 36);
  } else if (kind === 'disc') {
    const cg = g.createConicGradient(0.6, 0, 0);
    [[0, 'oklch(0.85 0.02 240)'], [0.15, 'oklch(0.9 0.1 200)'], [0.3, 'oklch(0.75 0.02 240)'], [0.5, 'oklch(0.92 0.12 90)'], [0.65, 'oklch(0.7 0.02 240)'], [0.8, 'oklch(0.88 0.12 330)'], [1, 'oklch(0.85 0.02 240)']].forEach(([o, c]) => cg.addColorStop(o, c));
    g.fillStyle = cg; g.beginPath(); g.arc(0, 0, 18, 0, 7); g.fill();
    g.fillStyle = 'oklch(0.3 0.02 240)'; g.beginPath(); g.arc(0, 0, 4, 0, 7); g.fill();
  } else if (kind === 'page') {
    g.fillStyle = lin(0, -18, 0, 18, [[0, 'oklch(0.99 0.005 90)'], [1, 'oklch(0.86 0.02 85)']]);
    g.beginPath(); g.moveTo(-13, -18); g.lineTo(6, -18); g.lineTo(13, -11); g.lineTo(13, 18); g.lineTo(-13, 18); g.closePath(); g.fill();
    g.fillStyle = 'oklch(0.8 0.02 85)'; g.beginPath(); g.moveTo(6, -18); g.lineTo(6, -11); g.lineTo(13, -11); g.fill();
    g.fillStyle = 'oklch(0.6 0.03 240 / 0.6)'; for (let i = 0; i < 5; i++) g.fillRect(-8, -6 + i * 5, 16 - (i % 2) * 5, 1.5);
  } else {
    g.fillStyle = rad(0, -2, 0, 18, [[0, 'oklch(0.99 0.06 95)'], [0.5, 'oklch(0.85 0.14 80 / 0.9)'], [1, 'oklch(0.6 0.12 60 / 0.6)']]);
    g.beginPath(); g.arc(0, -3, 15, 0, 7); g.fill();
    rr(-6, 11, 12, 8, 2); g.fillStyle = 'oklch(0.6 0.02 240)'; g.fill();
  }
  g.restore();
}
function icons(list) {
  list.forEach(([k, n, x, y]) => {
    g.save(); g.shadowColor = 'oklch(0 0 0 / 0.6)'; g.shadowBlur = 8; g.shadowOffsetY = 3; glyph(k, x, y, 1.15); g.restore();
    txt(n, x, y + 36, 11.5, 'oklch(0.98 0.005 90)', { w: 600, align: 'center', shadow: 'oklch(0 0 0 / 0.95)' });
  });
}
function shelf(cx, w, n) {
  const y = PH - 46, h = 34, inset = 16, spots = [];
  const trap = () => { g.beginPath(); g.moveTo(cx - w / 2 + inset, y); g.lineTo(cx + w / 2 - inset, y); g.lineTo(cx + w / 2, y + h); g.lineTo(cx - w / 2, y + h); g.closePath(); };
  g.save(); trap(); g.clip(); frost(cx - w / 2, y, w, h, 0, 6, 'oklch(0.75 0.02 220 / 0.22)'); g.restore();
  trap(); g.strokeStyle = 'oklch(1 0 0 / 0.45)'; g.lineWidth = 1; g.stroke();

    g.save(); g.shadowColor = 'oklch(0 0 0 / 0.5)'; g.shadowBlur = 6; g.shadowOffsetY = 3; glyph(SHELF[i], x, y - 12, 1.15); g.restore();

}
function topStrip() {
  frost(0, 0, PW, 24, 0, 8, 'oklch(0.3 0.025 220 / 0.45)');
  g.fillStyle = lin(0, 0, 0, 24, [[0, 'oklch(1 0 0 / 0.22)'], [0.5, 'oklch(1 0 0 / 0.06)'], [1, 'oklch(1 0 0 / 0)']]); g.fillRect(0, 0, PW, 24);
  g.fillStyle = 'oklch(0.05 0.02 240 / 0.7)'; g.fillRect(0, 24, PW, 1);

  const x0 = Math.round(Math.max(30, PW - 300) * PD);
  const cw = Math.round(PW * PD) - x0, ch = Math.ceil(25 * PD);
  stripBase.width = cw; stripBase.height = ch; stripBase.getContext('2d').drawImage(cv, x0, 0, cw, ch, 0, 0, cw, ch);

/* ---------- the clock: real time, a live uptime, one 3:33 ---------- */
const clockCv = document.createElement('canvas'), stripBase = document.createElement('canvas');
let strip = null, lastClock = '', spookAt = performance.now() + 60000 + Math.random() * 180000, spookTo = 0, frozenUp = '';
const loadDay = new Date().setHours(0, 0, 0, 0);
const pad = n => String(n).padStart(2, '0');
function clockText() {
  const d = new Date(), now = performance.now();
  // Once per visit, the clock reads 3:33 for one minute.
  if (opts.haunt && !spookTo && now >= spookAt && visible) spookTo = now + 60000;
  const spook = spookTo && now < spookTo;
  const days = 6809 + Math.round((new Date(d).setHours(0, 0, 0, 0) - loadDay) / 864e5);
  const up = `up ${days.toLocaleString('en-US')} days ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  // The uptime stops while the clock reads 3:33.
  if (spook) frozenUp ||= up; else frozenUp = '';
  return [spook ? '3:33' : `${d.getHours() % 12 || 12}:${pad(d.getMinutes())}`, frozenUp || up];
}
function paintClock() {
  if (!strip || !deskTex) return;
  const [time, up] = clockText(), key = time + up;
  if (key === lastClock) return;
  lastClock = key;
  // A small canvas holds the corner; the page never reads pixels back.
  const c = clockCv, w = strip.cw, h = strip.ch;
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  g = c.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(stripBase, 0, 0);
  g.setTransform(PD, 0, 0, PD, -strip.x, 0); PW = strip.w;

  const tw = g.measureText(time).width;
  txt(time, PW - 14, 16.5, 12.5, 'oklch(0.97 0.01 90)', { w: 700, align: 'right', shadow: 'oklch(0 0 0 / 0.8)' });
  txt(up, PW - 26 - tw, 16.5, 10.5, 'oklch(0.85 0.02 90 / 0.8)', { align: 'right', font: MONO, shadow: 'oklch(0 0 0 / 0.8)' });

}
function watermark(x, y, align) {
  ['ShadyOS Ultimate XTreme Edition SP3', 'Build 6809 · tw34k3d by d4rkm0th · activation: bypassed'].forEach((l, i) =>
    txt(l, x, y + i * 15, i ? 10.5 : 12, `oklch(0.95 0.01 90 / ${i ? 0.4 : 0.5})`, { w: i ? 500 : 700, align }));
}
function burnIn(rects) {

function bakeDesktop(canvas, w, h) {
  seed = 5; begin(canvas, w, h);
  const phone = w < 600;

  return true;
}
const SPOT_FOR = { files: 'box', note: 'page', nfo: 'disc', gauge: 'lamp', dialog: 'jar' };
function fold(win) {
  if (win.state !== 'open') return;
  win.spot = spots.find(s => s.kind === SPOT_FOR[win.kind]) || spots[0];
  win.state = 'genie'; win.g = 0; win.gTo = 1; whoosh(true); wake();
}
function unfold(win) { win.state = 'genie'; win.gTo = 0; raise(win); whoosh(false); wake(); }
function raise(win) { wins.splice(wins.indexOf(win), 1); wins.push(win); }

/* ---------- actions ---------- */
const NOTES = [['groceries', 'call mum', 'turn it off tonight'], ['it is warm in here', 'the fan never stops', 'is that normal'], ['note to self:', 'do NOT update', 'it gets mad']];
let noteN = 0;
function addWindow() {
  const kinds = ['note', 'files', 'note', 'nfo'];
  const kind = kinds[noteN % kinds.length];
  const x = W * 0.15 + (noteN * 47) % Math.max(60, W * 0.5), y = 40 + (noteN * 31) % Math.max(40, H * 0.4);
  if (kind === 'note') makeWin({ kind, title: 'your notes', x, y, w: 300, h: 220, lines: NOTES[noteN % NOTES.length], pop: true });
  else if (kind === 'files') makeWin({ kind, title: 'Basement', x, y, w: 560, h: 310, pop: true });
  else makeWin({ kind, skin: 'kid', title: 'd4rkm0th.nfo', x, y, w: 390, h: 240, pop: true });
  noteN++; messy = true;
  // Keep the desktop at ten windows.
  while (wins.filter(w => w.kind !== 'dialog').length > 10) killWin(wins.find(w => w.kind !== 'dialog'));
  click(); wake();
}
const CASCADE = [['Activation not needed.', 'It is late. Stay a while.'], ['Are you sure?', 'You were sure last time too.'], ['Error 0x0333', 'Everything is fine.'], ['Still here?', 'Good.'], ['Do not close this.', 'I mean it nicely.'], ['Thank you.', 'For staying.']];
let cascading = false;
function cascade() {
  if (cascading) return;
  cascading = true; messy = true;
  // File creep: each error leaves one more untitled file behind.
  untitled++; save('untitled', untitled);
  wins.forEach(w => { if (w.kind === 'files') upload(w.tex, paintWindow(w)); });
  const n = 6, bw = Math.min(360, W - 40), bx = W < 600 ? 20 : W * 0.58, by = H * 0.12;
  for (let i = 0; i < n; i++) setTimeout(() => {
    const [head, body] = CASCADE[i];
    makeWin({ kind: 'dialog', title: 'Notice', x: bx + i * (W < 600 ? 6 : 20), y: by + i * 24, w: bw, h: 126, head, body, yes: 'Stay', pop: true, cascade: true });
    ding(i); wake();
    if (i === n - 1) cascading = false;
  }, reduce ? 0 : i * 110);
}
function closeDialogs(from) {
  const list = wins.filter(w => w.kind === 'dialog' && w.cascade);
  const all = from.cascade ? list.reverse() : [from];
  all.forEach((w, i) => setTimeout(() => { w.closing = 0.0001; click(); wake(); }, i * 70));
}
function clearPlate() { clearing = 14; click(); wake(); }

/* ---------- pointer: tap, drag, hold ---------- */
function at(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function hit(x, y) {
  for (let i = wins.length - 1; i >= 0; i--) {
    const w = wins[i];

  }

}
let press = null, lastTap = { t: 0, id: 0 };
// The OS draws its own mouse pointer; touch has none.
const ptr = { on: false, x: 0, y: 0, dx: 0, dy: 0, lx: 0, ly: 0, run: 0 };
function track(e) {

  const [x, y] = at(e);

}
canvas.addEventListener('pointerleave', () => { if (!press && ptr.on) { ptr.on = false; wake(); } });
canvas.addEventListener('pointerdown', e => {
  const [x, y] = at(e);

canvas.addEventListener('pointermove', e => {

});
// A drag follows the drawn pointer, so a pause holds the window too.
function follow() {

}
function endPress(e, cancel) {

canvas.addEventListener('pointerup', e => endPress(e, false));
canvas.addEventListener('pointercancel', e => endPress(e, true));
canvas.addEventListener('lostpointercapture', e => endPress(e, true));

function tap(x, y, win) {
  if (win) {
    const lx = x - win.x, ly = y - win.y;
    if (ly < 30) {
      // Beads: right one closes, left one folds.
      if (Math.hypot(lx - (win.w - (win.skin === 'kid' ? 16 : 20)), ly - (win.skin === 'kid' ? 13 : 15)) < 10) { if (win.kind === 'dialog') closeDialogs(win); else { win.closing = 0.0001; click(); } return; }
      if (Math.hypot(lx - (win.w - (win.skin === 'kid' ? 34 : 38)), ly - (win.skin === 'kid' ? 13 : 15)) < 10) { fold(win); return; }
      const now = performance.now();
      if (lastTap.id === win.id && now - lastTap.t < 380) { fold(win); lastTap.t = 0; return; }
      lastTap = { t: now, id: win.id };
    }
    if (win.kind === 'dialog' && ly > win.h - 42 && lx > win.w - 190) { closeDialogs(win); return; }
    click();
    return;
  }
  // The shelf brings a folded window back, or opens a new one.
  if (y > H - 70) {
    const s = spots.reduce((a, b) => (Math.abs(b.x - x) < Math.abs(a.x - x) ? b : a), spots[0]);
    if (s && Math.abs(s.x - x) < 28) {
      const folded = [...wins].reverse().find(w => w.state === 'min' && w.spot === s) || [...wins].reverse().find(w => w.state === 'min');
      if (folded) unfold(folded); else addWindow();

}

/* ---------- sound: hum, clicks, dings, glass rub ---------- */
const kit = audioKit({ keys: new Set([' ']) });
let hum = null, rubber = null;
function startHum(ac) {
  if (hum) return;
  hum = ac.createGain(); hum.gain.value = 0.012; hum.connect(kit.out);
  [60, 120, 180].forEach((f, i) => { const o = ac.createOscillator(); o.frequency.value = f; const gg = ac.createGain(); gg.gain.value = [1, 0.5, 0.25][i]; o.connect(gg); gg.connect(hum); o.start(); });
}
function voice() { const ac = kit.live(); if (ac) startHum(ac); return ac; }
function click() {
  const ac = voice(); if (!ac || !kit.noise) return;
  const s = ac.createBufferSource(); s.buffer = kit.noise; s.playbackRate.value = 0.9 + Math.random() * 0.3;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600 + Math.random() * 900; f.Q.value = 2;
  const gg = ac.createGain(), t = ac.currentTime; gg.gain.setValueAtTime(0.22, t); gg.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
  s.connect(f); f.connect(gg); gg.connect(kit.out); s.start(t, Math.random() * 0.5, 0.05);
}
// A glassy two-note ding, one step higher per dialog.
function ding(i) {
  const ac = voice(); if (!ac) return;
  const t = ac.currentTime, base = 440 * Math.pow(2, (i * 2 + Math.random() * 0.2) / 12);
  [[base, 0.09], [base * 1.5, 0.05], [base * 2.76, 0.025]].forEach(([f, a], k) => {
    const o = ac.createOscillator(), gg = ac.createGain(); o.type = 'sine'; o.frequency.value = f * (1 + (Math.random() - 0.5) * 0.004);
    gg.gain.setValueAtTime(0, t + k * 0.06); gg.gain.linearRampToValueAtTime(a, t + k * 0.06 + 0.005); gg.gain.exponentialRampToValueAtTime(0.0005, t + k * 0.06 + 0.9);
    o.connect(gg); gg.connect(kit.out); o.start(t + k * 0.06); o.stop(t + k * 0.06 + 1);
  });
}

  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3;
  const t = ac.currentTime; f.frequency.setValueAtTime(down ? 2400 : 400, t); f.frequency.exponentialRampToValueAtTime(down ? 380 : 2400, t + 0.5);

  s.connect(f); f.connect(gg); gg.connect(kit.out); s.start(t); s.stop(t + 0.6);
}
// Dragging glass makes a soft rub that follows speed.
function rub(on) {
  const ac = voice();
  if (on && ac && kit.noise && !rubber) {
    const s = ac.createBufferSource(); s.buffer = kit.noise; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 1.4;
    const gg = ac.createGain(); gg.gain.value = 0;

/* ---------- the haunt: a tidy-up, a saver, a pause ---------- */
let messy = false, hiddenAt = 0, aways = 0, balk = 0, balked = false;
const AWAY = [['You looked away.', 'So I tidied up.'], ['You looked away again.', 'I put it all back.'], ['Welcome back.', 'Nothing happened.']];
// Put a window at x, y at once, with a still mesh.
function place(win, x, y) {
  win.x = clamp(x, 4, Math.max(4, W - win.w - 4)); win.y = clamp(y, 28, Math.max(28, H - win.h - 6));
  win.vx = win.vy = 0; win.lsx = undefined;
  for (let k = 0; k < NV; k++) { win.pos[k * 2] = win.x + uvs[k * 2] * win.w; win.pos[k * 2 + 1] = win.y + uvs[k * 2 + 1] * win.h; win.vel[k * 2] = win.vel[k * 2 + 1] = 0; }
}
// Back from a hidden tab: the desk sits tidied, and a dialog says so.
function tidy() {
  messy = false;
  wins.filter(w => w.kind === 'dialog').forEach(killWin);
  gl.bindFramebuffer(gl.FRAMEBUFFER, acc.f); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); clearing = 0; blurDirty = true;
  const phone = W < 600, gap = phone ? 22 : 30;
  wins.filter(w => w.state === 'open').sort((a, b) => b.w * b.h - a.w * a.h).forEach((w, i) => { place(w, (phone ? 10 : 24) + i * gap, 36 + i * gap); raise(w); });
  const [head, body] = AWAY[Math.min(aways++, AWAY.length - 1)], bw = Math.min(360, W - 36);
  setTimeout(() => {
    if (document.hidden) return;
    makeWin({ kind: 'dialog', title: 'Notice', x: (W - bw) / 2, y: H * 0.42, w: bw, h: 126, head, body, yes: 'Thanks', pop: true });
    ding(1); wake();
  }, 700);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = performance.now(); return; }
  if (opts.haunt && messy && hiddenAt && performance.now() - hiddenAt > 12000 && scene) tidy();
});
// The saver: windows drift into one line, row or column by aspect.
function lineUp() {
  const list = wins.filter(w => w.state === 'open' && !w.closing && drag?.win !== w).sort((a, b) => a.id - b.id), n = list.length;
  if (!n) return;
  const row = W >= H, last = list[n - 1], span = Math.max(0, row ? W - 32 - last.w : H - 90 - last.h);
  list.forEach((w, i) => {
    const t = n > 1 ? i / (n - 1) : 0.5;
    w.tx = row ? 16 + span * t : (W - w.w) / 2; w.ty = row ? Math.max(40, H * 0.34 - w.h / 2) : 34 + span * t;
    w.tk = 0.26 + ((w.id * 7) % 5) * 0.03;

}

/* ---------- frame loop: lively, drifting, asleep ---------- */
// nap: 0 awake, 1 saver, 2 dimming, 3 standby.
const DIM = 0.14, SAVER = 45000, STANDBY = 58500;

function rouse() {

  nap = 0; backlight = 1;
  wins.forEach(w => { w.tx = undefined; });
}
function saver() {
  if (!visible) return;
  nap = 1;
  if (opts.haunt) lineUp();
  napT = setTimeout(() => { if (visible) { nap = 2; dimT0 = performance.now(); kick(); } }, STANDBY - SAVER);
  kick();

// The flicker: dark, on, half, on.
function flicker(t) { return t < 60 ? 0.3 : t < 110 ? 1 : t < 170 ? 0.55 : t < 260 ? 1.04 : 1; }
function frame(now) {
  raf = 0;
  if (!scene) return;
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  let busy = !!drag || clearing > 0 || cascading;
  try {
    // The drawn pointer follows the hand, except for one pause per visit.
    if (ptr.on) {
      if (drag?.mouse && opts.haunt && !balked && now - drag.t0 > 700 && now > 15000) { balked = true; balk = now; }
      if (balk && now - balk > 480) {
        const k = 1 - Math.exp(-dt * 14);
        ptr.dx += (ptr.x - ptr.dx) * k; ptr.dy += (ptr.y - ptr.dy) * k;
        if (Math.hypot(ptr.x - ptr.dx, ptr.y - ptr.dy) < 0.5) balk = 0;
      } else if (!balk) { ptr.dx = ptr.x; ptr.dy = ptr.y; }
      if (ptr.dx !== ptr.lx || ptr.dy !== ptr.ly) {
        busy = true;

        if (!reduce) {
          const d = Math.hypot(ptr.dx - ptr.lx, ptr.dy - ptr.ly); ptr.run += d;
          for (; ptr.run > 7 && sparks.length < GMAX; ptr.run -= 7) {
            const t = Math.random();
            sparks.push({ x: lerp(ptr.lx, ptr.dx, t) + (Math.random() - 0.5) * 6, y: lerp(ptr.ly, ptr.dy, t) + 6 + (Math.random() - 0.5) * 6,
              vx: (Math.random() - 0.5) * 30, vy: -10 - Math.random() * 25, life: 1, rate: 1 / (0.45 + Math.random() * 0.45),
              s: 5 + Math.random() * 5, c: (Math.random() * 3) | 0, ph: Math.random() * 6.3 });

    }

    follow();

    if (nap) for (const w of wins) if (w.tx !== undefined && w.state === 'open' && drag?.win !== w) {
      const k = 1 - Math.exp(-dt * w.tk);
      w.x += (w.tx - w.x) * k; w.y += (w.ty - w.y) * k;

      if (win.state !== 'open' || win.closing) continue;
      const moving = drag?.win === win || Math.abs(win.vx) + Math.abs(win.vy) > 30;
      if (!moving) { win.lsx = undefined; continue; }
      if (win.lsx === undefined) { win.lsx = win.x; win.lsy = win.y; continue; }

      rubber.f.frequency.setTargetAtTime(600 + sp * 500, rubber.g.context.currentTime, 0.05);
    }
    paintClock();
    // Drifting grain runs at 30 fps; standby stops the loop.
    if (busy || nap === 3 || now - lastDraw > 31) { render(now); lastDraw = now; markReady(); }

    else kit.rest(() => !raf);
  } catch (err) { raf = 0; throw err; }
}
whenVisible(stage, v => { visible = v; if (v) wake(); else if (raf) { cancelAnimationFrame(raf); raf = 0; } });

/* ---------- bar ---------- */
const mode = choices(document.getElementById('mode'), v => { opts.mode = v; save('mode', v); wake(); });
mode.set(opts.mode);
const age = document.getElementById('age');
age.value = opts.age;
age.addEventListener('input', () => { opts.age = +age.value; save('age', opts.age); wake(); });
document.getElementById('add').addEventListener('click', addWindow);
document.getElementById('err').addEventListener('click', cascade);
document.getElementById('clear').addEventListener('click', clearPlate);
stage.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); cascade(); } });

/* ---------- start ---------- */
await Promise.all(['600 12px Gabarito', '700 12px Gabarito', `500 12px ${MONO}`, `700 12px ${MONO}`].map(f => document.fonts.load(f).catch(() => {})));
new ResizeObserver(() => resize()).observe(stage);
// A new quality rebuilds the targets at the new pixel ratio.
onQuality(() => { W = 0; resize(); });
resize();
// QA reads the window list with ?qa.
if (new URLSearchParams(location.search).has('qa')) window.__shadyos = { wins, clockCv, tidy, saver, spook: () => { spookAt = 0; } };
</script>
