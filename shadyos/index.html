<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShadyOS</title>
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="main.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.mjs">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm">
<style>
/* ShadyOS: a sentient bootleg desktop, half glass and half aqua. */
:root { --stage: oklch(0.12 0.02 230); }
.stage--shadyos canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; cursor: default; }
/* The hidden field takes typing for the focused window. */
.shady-field { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; pointer-events: none; font-size: 16px; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">ShadyOS</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--shadyos" id="stage" tabindex="0" role="application" aria-label="A haunted old desktop, half glass and half aqua. Drag a window to smear it, or fling it so it wobbles. Double-click a title bar to fold it into the dock. Open apps from the dock, the menus and the desktop icons. N opens a window, Space raises an error, C clears.">
      <p class="fail" hidden>This toy needs WebGL2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">ShadyOS</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
