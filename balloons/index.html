<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balloon letters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Balloon letters: foil letters on a deep violet stage. */
:root { --stage: oklch(0.17 0.04 292); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
/* Touch typing goes through this field; nobody sees it. */
.keys {
  position: absolute; left: 50%; top: 40%; width: 1px; height: 1px; margin: 0; padding: 0;
  font-size: 16px; color: transparent; background: transparent; border: 0; opacity: 0; pointer-events: none;
}
/* Each swatch shows its foil. */
.sw { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Balloon letters</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--balloons" id="stage" tabindex="0" role="application" aria-label="Foil balloon letters float on a dark stage, saying HI. Type to inflate more; drag to bat them, rub one to squeak it and hold one to prick it, or use the arrow keys to bat, Backspace to prick and Enter to let them all go.">
      <input class="keys" id="keys" type="text" tabindex="-1" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="Letters to inflate">
      <p class="fail" hidden>Balloon letters needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" role="group" aria-label="Foil">
        <button class="chip" type="button" data-foil="gold" aria-pressed="true"><span class="sw" style="--c: linear-gradient(135deg, oklch(0.95 0.08 95), oklch(0.8 0.15 80) 55%, oklch(0.6 0.12 70))" aria-hidden="true"></span>Gold</button>
        <button class="chip" type="button" data-foil="silver" aria-pressed="false"><span class="sw" style="--c: linear-gradient(135deg, oklch(0.97 0.01 250), oklch(0.8 0.015 255) 55%, oklch(0.58 0.02 260))" aria-hidden="true"></span>Silver</button>
        <button class="chip" type="button" data-foil="rose" aria-pressed="false"><span class="sw" style="--c: linear-gradient(135deg, oklch(0.93 0.06 20), oklch(0.78 0.12 15) 55%, oklch(0.58 0.12 10))" aria-hidden="true"></span>Rose</button>
        <button class="chip" type="button" data-foil="holo" aria-pressed="false"><span class="sw" style="--c: conic-gradient(from 40deg, oklch(0.82 0.15 350), oklch(0.88 0.14 90), oklch(0.86 0.14 165), oklch(0.8 0.13 240), oklch(0.8 0.15 300), oklch(0.82 0.15 350))" aria-hidden="true"></span>Holo</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Type</dt><dd>inflate</dd></div>
        <div><dt>Drag</dt><dd>bat it</dd></div>
        <div><dt>Hold</dt><dd>prick</dd></div>
        <div class="fine"><dt><kbd>Enter</kbd></dt><dd>let go</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Balloon letters</h1><div class="vignette" hidden></div></section>
</div>

<script type="importmap">
{ "imports": {

<script type="module">

    console.error(err);
    return failed();
  }
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (err) {
    console.error(err);
    return failed();
  }
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1;
  renderer.setClearColor(CLEAR);
  const canvas = renderer.domElement;
  canvas.setAttribute('aria-hidden', 'true');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 16 / 9, 0.1, 50);
  camera.position.set(0, 0, CAMZ);
  const fontP = fontReady();
  await idle();

  const pm = new THREE.PMREMGenerator(renderer), room = partyRoom();
  scene.environment = pm.fromScene(room, 0.02).texture;
  room.traverse(o => { o.geometry?.dispose(); o.material?.dispose(); });
  pm.dispose();
  await idle();

  bgMat = new THREE.ShaderMaterial({
    vertexShader: BG_VS, fragmentShader: BG_FS, depthTest: false, depthWrite: false,
    uniforms: {
      uRes: { value: new THREE.Vector2(1, 1) }, uN: { value: 0 },
      uTop: { value: new THREE.Color().setRGB(...linear(0.2, 0.05, 292)) },
      uLow: { value: new THREE.Color().setRGB(...linear(0.12, 0.035, 285)) },
      uHaze: { value: new THREE.Color().setRGB(...linear(0.3, 0.09, 320)) },
      uGlow: { value: Array.from({ length: 24 }, () => new THREE.Vector4()) },
      uGlowC: { value: Array.from({ length: 24 }, () => new THREE.Color()) },
      uBokeh: { value: BOKEH.map(b => new THREE.Vector4(b[0], b[1], b[2], b[3])) },
      uBokehC: { value: BOKEH.map(b => new THREE.Color().setRGB(...linear(...b[4]))) },
    },
  });
  const tri = new THREE.BufferGeometry();
  tri.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
  const bg = new THREE.Mesh(tri, bgMat);
  bg.frustumCulled = false;
  bg.renderOrder = -10;
  scene.add(bg);

  // One ribbon mesh draws all the strings.
  const rg = new THREE.BufferGeometry(), rv = ROPE_MAX * RPTS * 2, ri = [];
  rg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(rv * 3), 3).setUsage(THREE.DynamicDrawUsage));
  rg.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(rv * 3), 3).setUsage(THREE.DynamicDrawUsage));
  rg.setAttribute('color', new THREE.BufferAttribute(new Float32Array(rv * 3), 3).setUsage(THREE.DynamicDrawUsage));
  for (let s = 0; s < ROPE_MAX; s++) for (let k = 0; k < RPTS - 1; k++) {
    const a = (s * RPTS + k) * 2;
    ri.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  rg.setIndex(ri);
  ropeMesh = new THREE.Mesh(rg, new THREE.MeshStandardMaterial({ vertexColors: true, metalness: 0.45, roughness: 0.3, side: THREE.DoubleSide, envMapIntensity: 1.1 }));
  ropeMesh.frustumCulled = false;
  scene.add(ropeMesh);

  // One instanced quad draws each scrap of confetti.
  const cmat = new THREE.MeshStandardMaterial({ metalness: 1, roughness: 0.3, side: THREE.DoubleSide, envMapIntensity: 1.4 });
  // Scraps keep some colour when they face away from the light.
  cmat.onBeforeCompile = sh => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += diffuseColor.rgb * 0.28;');
  };
  const cm = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), cmat, CMAX);
  cm.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  cm.setColorAt(0, new THREE.Color(1, 1, 1));
  cm.count = 0;
  cm.frustumCulled = false;
  scene.add(cm);
  conf = {
    mesh: cm, n: 0, p: new Float32Array(CMAX * 3), v: new Float32Array(CMAX * 3), ax: new Float32Array(CMAX * 3),
    ang: new Float32Array(CMAX), spin: new Float32Array(CMAX), size: new Float32Array(CMAX), life: new Float32Array(CMAX), ph: new Float32Array(CMAX),
    m: new THREE.Matrix4(), q: new THREE.Quaternion(), e: new THREE.Vector3(), v3: new THREE.Vector3(), sc: new THREE.Vector3(), tc: new THREE.Color(),
  };
  const sm = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
    vertexShader: STAR_VS, fragmentShader: STAR_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uCol: { value: new THREE.Color().setRGB(...linear(0.97, 0.05, 85).map(v => v * 1.6)) } },
  }), SMX);
  sm.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  sm.count = 0;
  sm.frustumCulled = false;
  sm.renderOrder = 6;
  scene.add(sm);
  stars = { mesh: sm, items: [] };
  const pg = new THREE.PlaneGeometry(1, 1), fade = new THREE.InstancedBufferAttribute(new Float32Array(PMX), 1).setUsage(THREE.DynamicDrawUsage);
  pg.setAttribute('aFade', fade);
  const pmesh = new THREE.InstancedMesh(pg, new THREE.ShaderMaterial({
    vertexShader: PUFF_VS, fragmentShader: PUFF_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uCol: { value: new THREE.Color().setRGB(...linear(0.95, 0.03, 300)) } },
  }), PMX);
  pmesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  pmesh.count = 0;
  pmesh.frustumCulled = false;
  pmesh.renderOrder = 4;
  scene.add(pmesh);
  puffs = { mesh: pmesh, items: [], fade };
  for (let i = 0; i < 3; i++) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
      vertexShader: FLASH_VS, fragmentShader: FLASH_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uT: { value: 1 }, uCol: { value: new THREE.Color() } },
    }));
    m.visible = false;
    m.renderOrder = 5;
    scene.add(m);
    flashes.push({ mesh: m, t: 1 });
  }
  await fontP;
  rx.font = `600 ${FPX}px ${FONT}`;
  capPx = rx.measureText('H').actualBoundingBoxAscent || FPX * 0.7;
  await idle();

  panel.prepend(canvas);
  fitRenderer(2, onSize, 1.4e6);
  if (!panel.clientWidth) onSize(16, 9);
  // HI arrives already inflated.
  for (const ch of 'HI') {
    const L = makeLetter(glyph(ch));
    word.push(L);
  }
  layout();
  for (const L of letters) {
    Object.assign(L, { state: 'float', x: L.hx, y: L.hy, size: L.sizeT, k: L.sizeT, grow: 1, gs: 1, gi: 1 });
    makeRope(L);
    for (let i = 0; i < 160; i++) stepRope(L.rope, H);
  }
  await idle();
  // Every foil compiles before the first frame shows.
  const spare = [];
  for (const kind of Object.keys(FOILS)) {
    const m = new THREE.Mesh(letters[0].g.geo, foilMat(kind, foilUniforms()));
    m.position.set(0, -50, 0);
    scene.add(m);
    spare.push(m);
  }
  flashes.forEach(f => { f.mesh.visible = true; });
  stars.mesh.count = 1;
  puffs.mesh.count = 1;
  cm.count = 1;
  await renderer.compileAsync(scene, camera);
  for (const m of spare) { m.visible = false; }
  flashes.forEach(f => { f.mesh.visible = false; });
  cm.count = 0;
  stars.mesh.count = 0;
  puffs.mesh.count = 0;
  ready = true;
  lastPoke = performance.now();
  draw();
  requestAnimationFrame(() => canvas.classList.add('on'));
  wake();
  // The rest of the alphabet builds while nothing else is happening.
  for (const ch of 'AEOSTNRLDUCMPBGYKWFHVJXQZ0123456789!?') {
    await idle();
    glyph(ch);
  }
}
start().catch(err => { console.error(err); failed(); });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
</body>
