<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.12 0.01 50); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablecloth yank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./shapes.js">
<link rel="modulepreload" href="./sim.js">
<link rel="modulepreload" href="./scene.js">
<link rel="modulepreload" href="./ware.js">
<link rel="modulepreload" href="./sound.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">
<style>
/* Tablecloth yank: whip the cloth from under a set table. */
:root { --stage: oklch(0.12 0.01 50); }
.stage--tablecloth { background: var(--stage); }
.stage--tablecloth.hem { cursor: grab; }
.stage--tablecloth.held { cursor: grabbing; }
.stage--tablecloth canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--tablecloth canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--tablecloth canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Tablecloth yank</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--tablecloth" id="stage" tabindex="0" role="application" aria-label="A table set for two under a warm pendant lamp at night: a white cloth, two plates with knives and forks, a glass of red wine and a glass of water at each place, a lit candle in a brass stick. Grab the hem of the cloth where it hangs at the near end, and pull. Flick it fast and let go: the cloth whips out and the setting stays on the table. Pull it slowly and the setting slides with it, off the edge and onto the floor. Space yanks at the speed set; R sets the table again.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Tablecloth yank</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
