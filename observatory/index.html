<style>
/* Observatory: a dome on a hill under tonight's sky. */
:root { --stage: oklch(0.08 0.01 265); }
.stage--observatory canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
/* The ?dev pause for the cuts, over the letterbox and the dip. */
.cut-pause { position: absolute; left: 50%; top: 50%; translate: -50% -50%; z-index: 5; padding: 0.6em 1.4em; font: 600 15px/1 system-ui, sans-serif; color: #fff; background: oklch(0 0 0 / 0.55); border: 1px solid oklch(1 0 0 / 0.5); border-radius: 999px; cursor: pointer; }
.cut-pause[hidden] { display: none; }
/* DEV COMPOSITING STRIP: temporary, strip with its block in src/loop.ts. */
.dev-shots { position: absolute; left: 50%; bottom: 76px; translate: -50% 0; z-index: 6; display: flex; gap: 4px; padding: 4px; background: oklch(0 0 0 / 0.6); border: 1px solid oklch(1 0 0 / 0.25); border-radius: 8px; }
.dev-shots button { min-width: 34px; height: 30px; padding: 0 8px; font: 600 13px/1 system-ui, sans-serif; color: #fff; background: transparent; border: 1px solid oklch(1 0 0 / 0.3); border-radius: 5px; cursor: pointer; }
.dev-shots button[aria-pressed="true"] { background: #fff; color: #000; }
/* The cut lab, ?cuts&dev&lab: a tool row, then the contact sheet under it. */
.cut-lab { position: absolute; left: 12px; top: 12px; z-index: 7; display: flex; align-items: center; gap: 4px; padding: 4px; background: oklch(0 0 0 / 0.6); border: 1px solid oklch(1 0 0 / 0.25); border-radius: 8px; font: 600 13px/1 system-ui, sans-serif; color: #fff; }
.cut-lab button { height: 30px; padding: 0 10px; font: inherit; color: inherit; background: transparent; border: 1px solid oklch(1 0 0 / 0.3); border-radius: 5px; cursor: pointer; }
.cut-lab button[aria-pressed="true"] { background: #fff; color: #000; }
.cut-note { padding: 0 8px; font-weight: 500; opacity: 0.8; }
.cut-sheet { position: absolute; left: 12px; right: 12px; top: 56px; z-index: 7; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; padding: 8px; background: oklch(0 0 0 / 0.75); border-radius: 8px; max-height: calc(100dvh - 240px); overflow: auto; align-content: start; }
.cut-sheet[hidden] { display: none; }
.cut-cell { display: flex; flex-direction: column; gap: 4px; padding: 0; color: #fff; font: 600 12px/1.2 system-ui, sans-serif; text-align: left; background: none; border: 1px solid oklch(1 0 0 / 0.2); border-radius: 4px; cursor: pointer; overflow: hidden; }
.stage--observatory .cut-cell canvas { position: static; width: 100%; height: auto; display: block; }
.cut-cell span { padding: 2px 6px 5px; }
.cut-cell:hover { border-color: #fff; }
/* The celestial selector in the bar v3 look: corner ticks, a name, two words. */
.sel { --h: 44px; --ink: oklch(0.05 0.01 275); --edge: 3px; --acc-img: linear-gradient(oklch(0.86 0.09 250), oklch(0.86 0.09 250)); --acc-ink: oklch(0.86 0.09 250); position: absolute; inset: 0; z-index: 4; pointer-events: none; font: 500 11px/1 "Iosevka Term Slab Nerd Font", "Iosevka Term Slab", ui-monospace, monospace; letter-spacing: 0.07em; text-transform: uppercase; color: oklch(0.96 0.01 265 / 0.7); }
.sel[hidden], .sel-words[hidden] { display: none; }
.sel-lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.sel-ticks { fill: none; stroke: oklch(0.96 0.01 265 / 0.5); stroke-width: 1; }
.sel.is-locked .sel-ticks { stroke: oklch(0.98 0.01 265 / 0.95); }
.sel-line { stroke: oklch(0.96 0.01 265 / 0.28); stroke-width: 1; }
.sel-name { position: absolute; translate: 0 -50%; white-space: nowrap; -webkit-text-stroke: var(--edge) var(--ink); paint-order: stroke fill; }
.sel.is-locked .sel-name { color: oklch(0.98 0.01 265); }
.sel-words { position: absolute; display: flex; flex-direction: column; align-items: flex-start; margin-left: -11px; pointer-events: auto; }
.sel.is-left .sel-name { translate: -100% -50%; }
.sel.is-left .sel-words { translate: -100% 0; align-items: flex-end; margin: 0 -11px 0 0; }
.sel .sel-word { font: 700 12px/1 "Iosevka Term Slab Nerd Font", "Iosevka Term Slab", ui-monospace, monospace; letter-spacing: 0.06em; color: oklch(0.98 0.01 265 / 0.86); }
.sel .sel-word > span { -webkit-text-stroke: var(--edge) var(--ink); paint-order: stroke fill; }
</style>

  </section>
