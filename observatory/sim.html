<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telescope simulator</title>
<style>
/* Telescope simulator workbench: two telescopes, two ways of seeing. */
:root { color-scheme: dark; --ink: #d9d2c4; --dim: #8a8276; --brass: #c79a52; --felt: #121110; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden; }
body { font: 400 13px/1.3 "Segoe UI", system-ui, sans-serif; }
#stage { position: fixed; inset: 0; outline: none; touch-action: none; }
body[data-mode="eye"] #stage { cursor: grab; }
body[data-mode="camera"] #stage { cursor: default; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.status, .fail { position: absolute; left: 50%; top: 50%; translate: -50% -50%; margin: 0; color: var(--dim); }
.fail { color: #e06456; }

/* The telescope switch sits outside the scene, top left. */
.switch { position: fixed; left: 12px; top: 12px; z-index: 5; display: inline-flex; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 999px; overflow: hidden; background: rgba(0, 0, 0, 0.55); }
.switch label { padding: 5px 12px; cursor: pointer; color: #8f939a; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch label:has(input:checked) { background: rgba(255, 255, 255, 0.12); color: #e8e9eb; }
.switch label:has(input:focus-visible) { outline: 1px solid #8ab4e8; outline-offset: -2px; }
/* Over the full-screen program, the switch waits faintly until the pointer comes. */
body[data-mode="camera"] .switch { opacity: 0.25; transition: opacity 0.2s; }
body[data-mode="camera"] .switch:hover, body[data-mode="camera"] .switch:focus-within { opacity: 1; }
@media (prefers-reduced-motion: reduce) { body[data-mode="camera"] .switch { transition: none; } }

/* The eyepiece case: felt, brass rings, engraved numbers. */
.case { position: fixed; left: 50%; bottom: 18px; translate: -50% 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--felt); border: 1px solid #26231f; border-radius: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.04); }
.case button { width: 54px; height: 54px; border-radius: 50%; border: 0; cursor: pointer; color: var(--dim); font: 600 13px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: 0.02em;
  background: radial-gradient(circle at 50% 42%, #1d1c1b 0 44%, #0b0b0b 46% 58%, #2a2621 60% 70%, #15130f 72%); box-shadow: inset 0 -2px 3px rgba(0, 0, 0, 0.7), 0 1px 0 rgba(255, 255, 255, 0.05); }
.case button small { display: block; font-weight: 400; font-size: 9px; margin-top: 2px; opacity: 0.8; }
.case button[aria-pressed="true"] { color: #f0dcb4; background: radial-gradient(circle at 50% 42%, #24221f 0 44%, #0b0b0b 46% 56%, var(--brass) 58% 68%, #5a4524 70%); }
.case button:focus-visible { outline: 1px solid var(--brass); outline-offset: 2px; }
.case .sep { width: 1px; height: 40px; background: #2a2622; }
.case button.drive, .case button.drive[aria-pressed] { width: auto; height: 34px; padding: 0 12px; border-radius: 6px; background: #1a1816; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04); font-weight: 500; }
.case button.drive[aria-pressed="true"] { color: #f0dcb4; }
.case .drive::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; background: #3a3530; vertical-align: 0; }
.case .drive[aria-pressed="true"]::before { background: #d4583a; box-shadow: 0 0 6px #d4583a; }
.hint { position: fixed; left: 50%; bottom: 92px; translate: -50% 0; z-index: 5; margin: 0; color: rgba(217, 210, 196, 0.35); font-size: 12px; pointer-events: none; }
body[data-mode="camera"] .eye-only { display: none; }
/* In the toy's frame, a way back to the dome, top right. */
.back { display: none; position: fixed; right: 12px; top: 12px; z-index: 5; padding: 5px 12px; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 999px; background: rgba(0, 0, 0, 0.55); color: #8f939a; font: inherit; cursor: pointer; }
.back:hover, .back:focus-visible { color: #e8e9eb; }
.back kbd { margin-left: 6px; font: inherit; font-size: 11px; opacity: 0.6; }
.embed .back { display: block; }
/* The toy's own button holds the top left; the switch moves to the middle. */
.embed .switch { left: 50%; translate: -50% 0; }
body[data-mode="camera"] .back { opacity: 0.25; }
body[data-mode="camera"] .back:hover, body[data-mode="camera"] .back:focus-visible { opacity: 1; }
/* A tip in the case's felt and brass: a title, then a few plain lines. */
.tip { position: fixed; z-index: 6; max-width: 320px; padding: 10px 13px 11px; background: rgba(18, 17, 16, 0.96); border: 1px solid #3a332a; border-top-color: #6b5530; border-radius: 10px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65); color: var(--ink); font-size: 12.5px; line-height: 1.45; pointer-events: none; animation: tip-in 0.14s ease-out; }
.tip b { display: block; margin-bottom: 3px; color: #f0dcb4; font-weight: 600; font-size: 13px; letter-spacing: 0.01em; }
.tip em { display: block; margin-top: 6px; color: var(--brass); font-style: normal; font-weight: 600; }
.tip[hidden] { display: none; }
@keyframes tip-in { from { opacity: 0; translate: 0 3px; } }
@media (prefers-reduced-motion: reduce) { .tip { animation: none; } }
</style>
</head>
<body data-mode="eye">
<div id="stage" tabindex="0" role="application" aria-label="The view through the telescope. Arrow keys move it.">
  <canvas id="view"></canvas>
  <p class="status" id="status">Loading the star catalog…</p>
  <p class="fail" id="fail" hidden></p>
</div>

<div class="switch" role="radiogroup" aria-label="Telescope">
  <label data-tip="small"><input type="radio" name="scope" value="small" checked>Great refractor</label>
  <label data-tip="big"><input type="radio" name="scope" value="big">1 m reflector</label>
</div>

<button type="button" class="back" id="back">Back to the dome<kbd>Esc</kbd></button>

<div class="case eye-only" role="group" aria-label="Eyepiece case">
  <button type="button" data-ep="0" data-tip="0" aria-pressed="true" aria-label="55 mm eyepiece, 89×">55<small>mm</small></button>
  <button type="button" data-ep="1" data-tip="1" aria-pressed="false" aria-label="40 mm eyepiece, 122×">40<small>mm</small></button>
  <button type="button" data-ep="2" data-tip="2" aria-pressed="false" aria-label="25 mm eyepiece, 196×">25<small>mm</small></button>
  <button type="button" data-ep="3" data-tip="3" aria-pressed="false" aria-label="12 mm eyepiece, 408×">12<small>mm</small></button>
  <button type="button" data-ep="grating" data-tip="grating" aria-pressed="false" aria-label="Diffraction grating on the 25 mm eyepiece">⁂<small>grating</small></button>
  <span class="sep"></span>
  <button type="button" class="drive" id="drive" data-tip="drive" aria-pressed="true">Clock drive</button>
</div>
<p class="hint eye-only">Drag to move the tube · scroll to focus</p>
<div class="tip" id="tip" role="tooltip" hidden></div>

<script type="module" src="./dist/sim/main.js"></script>
</body>
</html>
