<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telescope simulator</title>
<style>
/* Telescope simulator workbench: the eyepiece shows the catalog sky. */
:root { color-scheme: dark; --bg: oklch(0.13 0.014 265); --ink: #eee; --dim: #9ab; --line: oklch(1 0 0 / 0.22); }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 500 13px/1.3 system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; box-sizing: border-box; }
h1 { font: 600 15px/1.2 system-ui, sans-serif; margin: 0; color: var(--dim); letter-spacing: 0.02em; }
#eye { width: min(88vw, 68vh, 600px); aspect-ratio: 1; border-radius: 50%; background: #000; display: block; touch-action: none; cursor: grab; box-shadow: 0 0 0 1px var(--line); }
#eye:focus-visible { outline: 2px solid #8cf; outline-offset: 4px; }
#eye:active { cursor: grabbing; }
.status { color: var(--dim); }
.fail { color: #f99; }
.readouts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; font-variant-numeric: tabular-nums; color: var(--dim); }
.readouts output { color: var(--ink); }
.panel { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 18px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: oklch(0 0 0 / 0.5); }
.panel label { display: inline-flex; align-items: center; gap: 8px; }
.panel input[type="range"] { width: 180px; }
.panel output { min-width: 3.6em; font-variant-numeric: tabular-nums; color: #bcd; }
.nudge { display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 30px); gap: 4px; }
.nudge button { font: inherit; color: var(--ink); background: oklch(1 0 0 / 0.08); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.nudge button:hover { background: oklch(1 0 0 / 0.16); }
.nudge button:focus-visible { outline: 2px solid #8cf; }
#up { grid-column: 2; grid-row: 1; } #left { grid-column: 1; grid-row: 2; } #right { grid-column: 3; grid-row: 2; } #down { grid-column: 2; grid-row: 3; }
#now, select { font: inherit; color: var(--ink); background: oklch(1 0 0 / 0.08); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
#now { cursor: pointer; }
.hint { color: var(--dim); font-size: 12px; text-align: center; max-width: 60ch; }
</style>
</head>
<body>
<h1>Telescope simulator</h1>

<canvas id="eye" tabindex="0" role="application" aria-label="Eyepiece view of the sky. Arrow keys move the tube; drag to pan."></canvas>
<p class="status" id="status">Loading the star catalog…</p>
<p class="fail" id="fail" hidden></p>

<div class="readouts" aria-live="off">
  <span>Field <output id="fov">–</output></span>
  <span>Magnification <output id="mag">–</output></span>
  <span>Tube alt <output id="alt-out">–</output> az <output id="az-out">–</output></span>
  <span><output id="count">–</output></span>
</div>
<div class="readouts">
  <span id="sky">–</span>
</div>

<div class="panel">
  <label>Altitude
    <input id="alt" type="range" min="10" max="88" step="0.1" value="40">
  </label>
  <label>Azimuth
    <input id="az" type="range" min="0" max="359.9" step="0.1" value="180">
  </label>
  <div class="nudge" role="group" aria-label="Move the tube">
    <button id="up" type="button" aria-label="Tube up">▲</button>
    <button id="left" type="button" aria-label="Tube left">◀</button>
    <button id="right" type="button" aria-label="Tube right">▶</button>
    <button id="down" type="button" aria-label="Tube down">▼</button>
  </div>
  <label>Eyepiece
    <select id="eyepiece">
      <option value="0" selected>40 mm</option>
      <option value="1">20 mm</option>
      <option value="2">10 mm</option>
      <option value="3">6 mm</option>
    </select>
  </label>
  <button id="now" type="button">Now</button>
</div>

<p class="hint">Arrow keys move the tube one degree; Shift makes the step a tenth. Drag the eyepiece to pan. The sky is fixed at load time until you press Now.</p>

<script type="module" src="./dist/sim/main.js"></script>
</body>
</html>
