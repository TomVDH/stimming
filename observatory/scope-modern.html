<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.13 0.014 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modern telescope viewer</title>
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">

<style>
/* Modern telescope viewer: the fork-mounted astrograph alone. */
/* A workbench page. */
:root { --stage: oklch(0.08 0.01 265); }
.stage--observatory canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.scope-ui { position: fixed; left: 50%; bottom: 16px; translate: -50% 0; z-index: 6; display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; padding: 10px 16px; font: 500 13px/1.2 system-ui, sans-serif; color: #eee; background: oklch(0 0 0 / 0.6); border: 1px solid oklch(1 0 0 / 0.25); border-radius: 10px; }
.scope-ui label { display: inline-flex; align-items: center; gap: 8px; }
.scope-ui output { min-width: 3.2em; font-variant-numeric: tabular-nums; color: #bcd; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Modern telescope viewer</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--observatory" id="stage" tabindex="0" role="application" aria-label="The modern telescope model, orbitable, with tube controls.">
      <p class="fail" hidden>This viewer cannot run in this browser. It needs WebGL 2.</p>
    </div>
  </main>
</div>

<script type="module" src="./dist/viewer-modern.js"></script>
</body>
</html>
