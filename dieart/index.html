<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.08 0.008 268); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Die art</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="../shared/gl.js">
<style>
/* Die art: metallurgical optical microscope over silicon dies. */
:root { --stage: oklch(0.08 0.008 268); }
.stage--dieart {
  background: var(--stage);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
.stage--dieart canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.45s ease; touch-action: none; cursor: grab;
}
.stage--dieart canvas.on { opacity: 1; }
.stage--dieart.dragging canvas { cursor: grabbing; }
.stage--dieart.tilting canvas { cursor: move; }

/* Etched optical micrograph scale legend (no pills, no boxes, sits clear above Focus slider). */
.da-scale-hud {
  position: absolute;
  right: max(18px, env(safe-area-inset-right));
  bottom: calc(max(18px, env(safe-area-inset-bottom)) + 48px);
  z-index: 2;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
  font-family: "Iosevka Term Slab", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
  color: oklch(0.96 0.008 90 / 0.88);
  text-shadow: 0 1px 3px oklch(0.03 0.01 268 / 0.95), 0 0 10px oklch(0.03 0.01 268 / 0.85);
}
.da-scale-hud[hidden] { display: none; }
.da-scale-chip {
  font-size: 10px;
  color: oklch(0.88 0.012 90 / 0.72);
}
.da-scale-opt {
  font-size: 10px;
  color: oklch(0.94 0.01 90 / 0.82);
}
.da-scale-row {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.da-scale-bar {
  position: relative;
  display: inline-block;
  height: 1.5px;
  background: oklch(0.97 0.008 90 / 0.92);
  box-shadow: 0 1px 3px oklch(0.03 0.01 268 / 0.95);
}
.da-scale-bar::before,
.da-scale-bar::after {
  content: "";
  position: absolute;
  top: -3.5px;
  width: 1.5px;
  height: 8.5px;
  background: oklch(0.97 0.008 90 / 0.92);
  box-shadow: 0 1px 3px oklch(0.03 0.01 268 / 0.95);
}
.da-scale-bar::before { left: 0; }
.da-scale-bar::after { right: 0; }
.da-scale-val {
  font-weight: 700;
  color: oklch(0.97 0.008 90 / 0.94);
}

@media (max-width: 640px) {
  .da-scale-hud {
    right: max(12px, env(safe-area-inset-right));
    bottom: calc(max(12px, env(safe-area-inset-bottom)) + 52px);
  }
  .da-scale-chip { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .stage--dieart canvas { transition: none; }
}
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/dieart.svg)"></span><span class="intro-name">Die art</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--dieart" id="stage" tabindex="0" role="application" aria-label="Metallurgical optical microscope over silicon dies. Drag to pan the stage, scroll or pinch to zoom from 4x to 160x, shift-drag to tilt the condenser, rack focus across silicon, metal layers and wirebonds, and switch Brightfield, Darkfield, DIC or NIR 1050 nm illumination.">
      <div class="da-scale-hud" id="da-scale-hud" aria-hidden="true">
        <span class="da-scale-chip" id="da-scale-chip">NMOS-79 · 5 μm NMOS · 1M</span>
        <span class="da-scale-opt" id="da-scale-opt">12× · NA 0.33 · M2</span>
        <span class="da-scale-row">
          <span class="da-scale-bar" id="da-scale-bar" style="width: 72px"></span>
          <span class="da-scale-val" id="da-scale-val">500 μm</span>
        </span>
      </div>
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Die art</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./dist/main.js?v=2"></script>
</body>
</html>
