<!doctype html><meta charset="utf-8"><title>Share card samples</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="../../../shared/fonts/fonts.css">
<style>
:root{color-scheme:dark}
body{margin:0;background:#111;color:#eee;font:500 14px system-ui,sans-serif;padding:24px;display:flex;flex-wrap:wrap;gap:24px}
/* Each card draws at 1200 x 630; the page shows it at half size. */
.wrap{width:600px;height:315px;overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px #2a2a2a}
.wrap>div{width:1200px;height:630px;transform:scale(.5);transform-origin:0 0}
</style>
<script type="module">
// The card lives in accesslab/share-card.js; the bench's Share tab uses it too.
import { drawCard } from '../../../accesslab/share-card.js';
const toys = await (await fetch('../../../toys.json')).json();
const ids = ['morpher', 'balloons', 'aquarium', 'railgun', 'supercon', 'cauldron', 'galaxy', 'fidget'];
for (const id of ids) {
  if (!toys[id]) continue;
  const wrap = document.body.appendChild(Object.assign(document.createElement('div'), { className: 'wrap' }));
  drawCard(wrap.appendChild(document.createElement('div')), id, toys[id]);
}
</script>
