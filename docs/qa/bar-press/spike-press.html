<!doctype html>
<html lang="en" class="stim2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bar v2 press cue</title>
<link rel="stylesheet" href="../../../shared/fonts/fonts.css">
<link rel="stylesheet" href="../../../shared/stim.css">
<style>
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--fg); font-family: var(--sans); }
  h1 { font: 700 22px/1.2 "B612", var(--sans); margin: 0 auto 18px; max-width: 1240px; }
  .grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); max-width: 1240px; margin: 0 auto; }
  figure { margin: 0; }
  figcaption { font: 700 12px/1 var(--slab, monospace); letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 8px; color: var(--muted); }
  figcaption b { color: var(--fg); margin-right: 8px; }
  .box { position: relative; aspect-ratio: 16 / 10; min-height: 320px; border-radius: 18px; overflow: hidden; background: #000 center / cover no-repeat; }
  .box.light { background-image: url(../../../shared/stills/pool.webp); }
  .box.dark { background-image: url(../../../shared/stills/prism.webp); }
  .stim-ui .s2-sheet { display: none; }
  /* The shell moves the choice on phones; this page hides it there. */
  @media (max-width: 640px) { .box .s2-tl .s2-seg, .box .s2-br { display: none; } .box { min-height: 260px; } }
  .stim-ui .s2-sheet.is-open { display: grid; }
  .pick { display: flex; gap: 8px; max-width: 1240px; margin: 0 auto 18px; font: 500 11px/1 var(--slab, monospace); text-transform: uppercase; letter-spacing: 0.08em; }
  .pick button { all: unset; cursor: pointer; padding: 6px 10px; border: 1px solid var(--line); color: var(--muted); }
  .pick button[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }

  /* Every new cue drops the hard offset shadow and the hover lift. */
  [data-opt]:not([data-opt="now"]) .stim-ui :is(.s2-chip, .snd, .s2-set, .s2-info, .s2-seg, .s2-step, .s2-sheet) { box-shadow: none; transform: none; }
  :where([data-opt]:not([data-opt="now"])) .stim-ui :is(.s2-chip, .snd, .s2-set, .s2-info, .s2-seg, .s2-step):is(:hover, .is-hover) {
    box-shadow: none; transform: none;
  }

  /* A: flat flash. Hover brightens the slab; a press steps it smaller. */
  [data-opt="a"] .stim-ui :is(.s2-chip, .snd, .s2-set, .s2-info):is(:hover, .is-hover) {
    color: var(--fg); border-color: oklch(0.94 0.008 275 / 0.7); background: oklch(0.22 0.014 275 / 0.92);
  }
  [data-opt="a"] .stim-ui :is(.s2-chip, .snd, .s2-set, .s2-info):is(:active, .is-active) { transform: scale(0.92); transition: transform 0.066s steps(2, end); }
  [data-opt="a"] .stim-ui :is(.s2-chip[aria-pressed="true"], .s2-set[aria-expanded="true"]):is(:hover, .is-hover) { color: var(--bg); background: var(--fg); }

  /* B: edge bar. A bar fills in along the foot; a pick keeps a dark bar inside the flash box. */
  [data-opt="b"] .stim-ui :is(.s2-chip, .snd, .s2-set, .s2-info) { transition: color 0.15s, border-color 0.15s, box-shadow 0.1s steps(3, end); }
  [data-opt="b"] .stim-ui :is(.s2-chip, .snd, .s2-set, .s2-info):is(:hover, .is-hover) { color: var(--fg); box-shadow: inset 0 -2px 0 var(--fg); }
  [data-opt="b"] .stim-ui :is(.s2-chip, .snd, .s2-set, .s2-info):is(:active, .is-active) { box-shadow: inset 0 -5px 0 var(--fg); }
  [data-opt="b"] .stim-ui :is(.s2-chip[aria-pressed="true"], .s2-set[aria-expanded="true"]) { box-shadow: inset 0 -3px 0 var(--bg); }
  [data-opt="b"] .stim-ui .s2-seg .s2-chip[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--bg); }
  [data-opt="b"] .stim-ui .s2-sheet { border-top-width: 4px; }

  /* C: offset ring. A thin ring stands off the slab; a press snaps it in. */
  [data-opt="c"] .stim-ui :is(.s2-chip, .snd, .s2-set, .s2-info) { position: relative; }
  [data-opt="c"] .stim-ui :is(.s2-chip, .snd, .s2-set, .s2-info)::after {
    content: ""; position: absolute; inset: -4px; border: 1px solid var(--fg); border-radius: 3px;
    opacity: 0; pointer-events: none; transition: inset 0.066s steps(2, end), opacity 0.1s steps(2, end);
  }
  [data-opt="c"] .stim-ui .s2-seg .s2-chip::after { display: none; }
  [data-opt="c"] .stim-ui :is(.s2-chip, .snd, .s2-set, .s2-info):is(:hover, .is-hover) { color: var(--fg); border-color: oklch(0.94 0.008 275 / 0.45); }
  [data-opt="c"] .stim-ui :is(.s2-chip, .snd, .s2-set, .s2-info):is(:hover, .is-hover)::after { opacity: 0.6; }
  [data-opt="c"] .stim-ui :is(.s2-chip, .snd, .s2-set, .s2-info):is(:active, .is-active)::after { inset: -1px; opacity: 1; }
  [data-opt="c"] .stim-ui :is(.s2-chip[aria-pressed="true"], .s2-set[aria-expanded="true"])::after { opacity: 1; }
  [data-opt="c"] .stim-ui .s2-seg:has([aria-pressed="true"]) { outline: 1px solid oklch(0.94 0.008 275 / 0.6); outline-offset: 3px; }
  [data-opt="c"] .stim-ui .s2-sheet { outline: 1px solid oklch(0.94 0.008 275 / 0.6); outline-offset: 3px; }

  /* The strip shows each state at rest, so no hover is needed to judge it. */
  .strip.stim-ui { position: static; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 4px 0; zoom: 1.3; pointer-events: auto; }
  .strip > span { font-size: 9px; color: var(--muted); letter-spacing: 0.12em; margin-right: -6px; }
  .strip > * { pointer-events: auto; }
  /* A pick keeps its flash-box ink under the pointer. */
  [data-opt] .stim-ui :is(.s2-chip[aria-pressed="true"], .s2-set[aria-expanded="true"]):is(:hover, .is-hover) { color: var(--bg); background: var(--fg); border-color: var(--fg); }
  [data-opt="now"] .strip .is-hover:not([aria-pressed="true"]) { color: var(--fg); border-color: oklch(0.94 0.008 275 / 0.45); transform: translate(-1px, -1px); box-shadow: var(--lift); }
  [data-opt="now"] .strip .is-active { transform: translate(1px, 1px); box-shadow: none; color: var(--fg); }
</style>
</head>
<body>
<h1>Bar v2 press cue</h1>
<div class="pick" role="group" aria-label="Backdrop">
  <button type="button" data-bg="light" aria-pressed="true">Bright still</button>
  <button type="button" data-bg="dark" aria-pressed="false">Dark still</button>
</div>
<div class="grid" id="grid"></div>

<template id="panel">
  <figure>
    <figcaption></figcaption>
    <div class="box light">
      <div class="stim-ui">
        <div class="s2-tl">
          <a class="s2-back" href="#"><span class="mark">Stimming</span></a>
          <span class="s2-name">Caustic pool</span>
          <div class="s2-seg" role="group">
            <button class="s2-chip" aria-pressed="true">Beam</button>
            <button class="s2-chip" aria-pressed="false">Fan</button>
            <button class="s2-chip" aria-pressed="false">Disco</button>
          </div>
        </div>
        <div class="s2-tr">
          <button class="snd s2-icon" aria-pressed="false" aria-label="Sound"><svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M12 5.5c1 1.4 1 3.6 0 5"/></svg></button>
          <button class="s2-set s2-icon" aria-expanded="false" aria-label="Settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
          <button class="s2-info s2-icon" aria-label="Info">i</button>
        </div>
        <div class="s2-sheet s2-sheet--right">
          <div class="s2-hd">Settings <em>S</em></div>
          <div class="s2-sec">
            <div class="s2-lab">Graphics</div>
            <div class="s2-row">Quality <div class="s2-seg"><button class="s2-chip" aria-pressed="false">Std</button><button class="s2-chip" aria-pressed="true">High</button></div></div>
          </div>
          <div class="s2-ft"><button class="s2-chip">Reset</button></div>
        </div>
        <div class="s2-bl">
          <button class="s2-chip">Shuffle <span class="s2-kbd">R</span></button>
          <button class="s2-chip" data-toggle aria-pressed="false">Hold</button>
          <button class="s2-chip">Clear</button>
        </div>
        <div class="s2-br">
          <label class="s2-slider">Spread <input type="range" value="40" style="--v: 40%"></label>
        </div>
      </div>
    </div>
    <div class="strip stim-ui">
      <span>rest</span><button class="s2-chip">Shuffle</button>
      <span>hover</span><button class="s2-chip is-hover">Shuffle</button>
      <span>press</span><button class="s2-chip is-active">Shuffle</button>
      <span>on</span><button class="s2-chip" aria-pressed="true">Hold</button>
      <span>on + hover</span><button class="s2-chip is-hover" aria-pressed="true">Hold</button>
    </div>
  </figure>
</template>

<script>
  // Each option is one panel on the same controls.
  const opts = [
    ['now', 'Now', 'hard offset shadow'],
    ['a', 'A', 'flat flash'],
    ['b', 'B', 'edge bar'],
    ['c', 'C', 'offset ring'],
  ];
  const grid = document.getElementById('grid');
  const tpl = document.getElementById('panel');
  for (const [id, key, label] of opts) {
    const f = tpl.content.firstElementChild.cloneNode(true);
    f.dataset.opt = id;
    f.querySelector('figcaption').innerHTML = `<b>${key}</b>${label}`;
    grid.append(f);
  }
  // A segment keeps one pick; a toggle flips; Settings opens its sheet.
  grid.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    e.preventDefault();
    const seg = b.parentElement.closest('.s2-seg');
    if (seg) seg.querySelectorAll('.s2-chip').forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
    else if (b.matches('[data-toggle], .snd')) b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
    else if (b.matches('.s2-set')) {
      const open = b.getAttribute('aria-expanded') !== 'true';
      b.setAttribute('aria-expanded', String(open));
      b.closest('.stim-ui').querySelector('.s2-sheet').classList.toggle('is-open', open);
    }
  });
  grid.addEventListener('input', (e) => e.target.style.setProperty('--v', e.target.value + '%'));
  // The backdrop switch tests both a bright and a dark stage.
  document.querySelector('.pick').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    document.querySelectorAll('.pick button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    document.querySelectorAll('.box').forEach((x) => x.className = 'box ' + b.dataset.bg);
  });
</script>
</body>
</html>
