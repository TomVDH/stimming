<svg width="100%" viewBox="0 0 680 980" role="img"><title>Gas giant dive, orbit to crush</title><desc>A cross-section of the whole dive with times for a held dive: orbit, the decks and voids, the new cyclone void, then the shear and crush layers where the hull fails.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="100" y="40" width="540" height="80" class="c-blue" stroke-width="0.5"/><rect x="100" y="120" width="540" height="30" class="c-gray" stroke-width="0.5"/><rect x="100" y="150" width="540" height="45" class="c-teal" stroke-width="0.5"/><rect x="100" y="195" width="540" height="90" class="c-purple" stroke-width="0.5"/><rect x="100" y="285" width="540" height="25" class="c-teal" stroke-width="0.5"/><rect x="100" y="310" width="540" height="40" class="c-purple" stroke-width="0.5"/><rect x="100" y="350" width="540" height="40" class="c-teal" stroke-width="0.5"/><rect x="100" y="390" width="540" height="40" class="c-gray" stroke-width="0.5"/><rect x="100" y="430" width="540" height="25" class="c-gray" stroke-width="0.5"/><rect x="100" y="455" width="540" height="70" class="c-purple" stroke-width="0.5"/><rect x="100" y="525" width="540" height="35" class="c-teal" stroke-width="0.5"/><rect x="100" y="560" width="540" height="220" class="c-purple" stroke-width="0.5"/><rect x="100" y="780" width="540" height="70" class="c-coral" stroke-width="0.5"/><rect x="100" y="850" width="540" height="80" class="c-red" stroke-width="0.5"/><text class="ts" x="40" y="52" dominant-baseline="central">0:00</text><g class="c-blue"><text class="th" x="112" y="56" dominant-baseline="central">Orbit and entry</text><text class="ts" x="240" y="56" dominant-baseline="central">260 to 40 km</text><text class="ts" x="112" y="76" dominant-baseline="central">Rings, plasma on the pane</text></g><text class="ts" x="40" y="132" dominant-baseline="central">0:24</text><g class="c-gray"><text class="th" x="112" y="135.0" dominant-baseline="central">Haze lid</text><text class="ts" x="240" y="135.0" dominant-baseline="central">40 to 22</text></g><text class="ts" x="40" y="162" dominant-baseline="central">0:29</text><g class="c-teal"><text class="th" x="112" y="166" dominant-baseline="central">Ammonia deck</text><text class="ts" x="240" y="166" dominant-baseline="central">22 to 0</text><text class="ts" x="112" y="186" dominant-baseline="central">Popcorn heads, swirls</text></g><text class="ts" x="40" y="207" dominant-baseline="central">0:37</text><g class="c-purple"><text class="th" x="112" y="211" dominant-baseline="central">Upper void</text><text class="ts" x="240" y="211" dominant-baseline="central">0 to -40</text><text class="ts" x="112" y="231" dominant-baseline="central">Twisters, god rays</text><text class="ts" x="112" y="249" dominant-baseline="central">Funnels, cards, rolling bake</text></g><text class="ts" x="40" y="297" dominant-baseline="central">0:46</text><g class="c-teal"><text class="th" x="112" y="297.5" dominant-baseline="central">Brown deck</text><text class="ts" x="240" y="297.5" dominant-baseline="central">-40 to -50</text></g><text class="ts" x="40" y="322" dominant-baseline="central">0:49</text><g class="c-purple"><text class="th" x="112" y="326" dominant-baseline="central">Mushball fall</text><text class="ts" x="240" y="326" dominant-baseline="central">-50 to -64</text><text class="ts" x="112" y="346" dominant-baseline="central">Slush hail; light motes rise</text></g><text class="ts" x="40" y="362" dominant-baseline="central">0:52</text><g class="c-teal"><text class="th" x="112" y="366" dominant-baseline="central">Water deck</text><text class="ts" x="240" y="366" dominant-baseline="central">-64 to -92</text><text class="ts" x="112" y="386" dominant-baseline="central">Lightning; slick on the glass</text></g><text class="ts" x="40" y="402" dominant-baseline="central">1:03</text><g class="c-gray"><text class="th" x="112" y="406" dominant-baseline="central">Shelves</text><text class="ts" x="240" y="406" dominant-baseline="central">-92 to -140</text><text class="ts" x="112" y="426" dominant-baseline="central">Violet sheets; gasbags drift</text></g><text class="ts" x="40" y="442" dominant-baseline="central">1:16</text><g class="c-gray"><text class="th" x="112" y="442.5" dominant-baseline="central">Veil</text><text class="ts" x="240" y="442.5" dominant-baseline="central">-140 to -158</text></g><text class="ts" x="40" y="467" dominant-baseline="central">1:23</text><g class="c-purple"><text class="th" x="112" y="471" dominant-baseline="central">Nave</text><text class="ts" x="240" y="471" dominant-baseline="central">-158 to -230</text><text class="ts" x="112" y="491" dominant-baseline="central">Columns 72 km tall</text><text class="ts" x="112" y="509" dominant-baseline="central">A vast manta glides past</text></g><text class="ts" x="40" y="537" dominant-baseline="central">1:37</text><g class="c-teal"><text class="th" x="112" y="541" dominant-baseline="central">Indigo deck</text><text class="ts" x="240" y="541" dominant-baseline="central">-230 to -262</text></g><text class="ts" x="40" y="572" dominant-baseline="central">1:50</text><g class="c-purple"><text class="th" x="112" y="576" dominant-baseline="central">Cyclone void</text><text class="ts" x="240" y="576" dominant-baseline="central">-262 to -425</text><text class="ts" x="112" y="596" dominant-baseline="central">New. Over the crest: it looms</text><text class="ts" x="112" y="614" dominant-baseline="central">below, 300 km off, its bolts</text><text class="ts" x="112" y="632" dominant-baseline="central">bending along the bands.</text><text class="ts" x="112" y="668" dominant-baseline="central">Then down beside the wall:</text><text class="ts" x="112" y="686" dominant-baseline="central">it fills the window, turning.</text><text class="ts" x="112" y="704" dominant-baseline="central">Shapes in the bolt light</text></g><text class="ts" x="40" y="792" dominant-baseline="central">2:23</text><g class="c-coral"><text class="th" x="112" y="796" dominant-baseline="central">Shear</text><text class="ts" x="240" y="796" dominant-baseline="central">-425 to -500</text><text class="ts" x="112" y="816" dominant-baseline="central">New. Shredding wind, strobe,</text><text class="ts" x="112" y="834" dominant-baseline="central">the first cracks</text></g><text class="ts" x="40" y="862" dominant-baseline="central">2:54</text><g class="c-red"><text class="th" x="112" y="866" dominant-baseline="central">Crush</text><text class="ts" x="240" y="866" dominant-baseline="central">-500 to -640</text><text class="ts" x="112" y="886" dominant-baseline="central">New. Black heat, pane bows,</text><text class="ts" x="112" y="904" dominant-baseline="central">the hull fails at 3:52</text></g><path d="M370 104 Q500 50 630 104" fill="none" stroke="#85B7EB" stroke-width="3" opacity="0.8"/><path d="M380 110 Q500 64 620 110" fill="none" stroke="#B5D4F4" stroke-width="1.5" opacity="0.8"/><path d="M370 195 q15 -14 30 0 q15 -12 30 0 q15 -16 30 0 q15 -12 30 0 q15 -14 30 0 q15 -12 30 0 q15 -14 30 0 q15 -12 30 0 q15 -14 30 0" fill="none" stroke="#1D9E75" stroke-width="1.5"/><path d="M408 197 L432 197 L423 283 L417 283 Z" fill="#7F77DD" opacity="0.75"/><path d="M493 197 L517 197 L508 283 L502 283 Z" fill="#7F77DD" opacity="0.75"/><path d="M578 197 L602 197 L593 283 L587 283 Z" fill="#7F77DD" opacity="0.75"/><rect x="395" y="457" width="9" height="66" rx="3" fill="#7F77DD" opacity="0.6"/><rect x="430" y="457" width="9" height="66" rx="3" fill="#7F77DD" opacity="0.6"/><rect x="470" y="457" width="9" height="66" rx="3" fill="#7F77DD" opacity="0.6"/><rect x="520" y="457" width="9" height="66" rx="3" fill="#7F77DD" opacity="0.6"/><rect x="560" y="457" width="9" height="66" rx="3" fill="#7F77DD" opacity="0.6"/><rect x="605" y="457" width="9" height="66" rx="3" fill="#7F77DD" opacity="0.6"/><polyline points="440,352 446,362 440,370 448,382" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linejoin="round"/><polyline points="560,358 566,368 560,376 568,388" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linejoin="round"/><polyline points="470,527 476,537 470,545 478,557" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linejoin="round"/><polyline points="590,531 596,541 590,549 598,561" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linejoin="round"/><path d="M372 600 Q505 548 636 600 L604 776 L420 776 Z" fill="#534AB7" opacity="0.6"/><path d="M389 625 Q505 599 624 629" fill="none" stroke="#CECBF6" stroke-width="1.5" opacity="0.85"/><path d="M398 680 Q505 654 618 684" fill="none" stroke="#CECBF6" stroke-width="1.5" opacity="0.7"/><path d="M407 735 Q505 709 613 739" fill="none" stroke="#CECBF6" stroke-width="1.5" opacity="0.6"/><polyline points="460,612 474,640 462,658 482,690 470,712 490,745" fill="none" stroke="#FAC775" stroke-width="2.5" stroke-linejoin="round"/><polyline points="560,615 548,645 566,668 552,700 570,730" fill="none" stroke="#FAC775" stroke-width="2.5" stroke-linejoin="round"/><polyline points="510,690 526,706 514,724 532,752" fill="none" stroke="#EF9F27" stroke-width="2" stroke-linejoin="round"/><line x1="380" y1="790" x2="420" y2="836" stroke="#D85A30" stroke-width="1.5" opacity="0.8"/><line x1="424" y1="798" x2="464" y2="830" stroke="#D85A30" stroke-width="1.5" opacity="0.8"/><line x1="468" y1="790" x2="508" y2="824" stroke="#D85A30" stroke-width="1.5" opacity="0.8"/><line x1="512" y1="798" x2="552" y2="836" stroke="#D85A30" stroke-width="1.5" opacity="0.8"/><line x1="556" y1="790" x2="596" y2="830" stroke="#D85A30" stroke-width="1.5" opacity="0.8"/><line x1="600" y1="798" x2="640" y2="824" stroke="#D85A30" stroke-width="1.5" opacity="0.8"/><path d="M380 925 Q500 860 630 925" fill="none" stroke="#E24B4A" stroke-width="2" opacity="0.7"/><circle cx="400" cy="318" r="2.5" fill="#ED93B1"/><circle cx="430" cy="334" r="2" fill="#ED93B1"/><circle cx="470" cy="322" r="3" fill="#ED93B1"/><circle cx="520" cy="340" r="2" fill="#ED93B1"/><circle cx="560" cy="326" r="2.5" fill="#ED93B1"/><circle cx="600" cy="336" r="2" fill="#ED93B1"/><circle cx="620" cy="318" r="1.8" fill="#ED93B1"/><path d="M372 372 q8 -10 16 0 q8 10 16 0" fill="none" stroke="#D4537E" stroke-width="2"/><ellipse cx="420" cy="410" rx="13" ry="9" fill="#ED93B1" opacity="0.85"/><line x1="420" y1="419" x2="420" y2="427" stroke="#D4537E" stroke-width="1"/><ellipse cx="530" cy="402" rx="13" ry="9" fill="#ED93B1" opacity="0.85"/><line x1="530" y1="411" x2="530" y2="419" stroke="#D4537E" stroke-width="1"/><ellipse cx="610" cy="416" rx="13" ry="9" fill="#ED93B1" opacity="0.85"/><line x1="610" y1="425" x2="610" y2="433" stroke="#D4537E" stroke-width="1"/><path d="M470 492 Q500 474 530 488 Q560 474 590 492 Q560 498 530 504 Q500 498 470 492 Z" fill="#993556" opacity="0.85"/><path d="M600 640 Q614 628 628 640 Q614 650 600 640 Z" fill="#993556" opacity="0.7"/><line x1="330" y1="46" x2="330" y2="920" stroke="var(--t)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><circle cx="330" cy="585" r="4.5" fill="#EF9F27"/><circle cx="330" cy="712" r="4.5" fill="#EF9F27"/><circle cx="330" cy="815" r="4.5" fill="#D85A30"/><circle cx="330" cy="926" r="4.5" fill="#E24B4A"/><text class="ts" x="40" y="956" dominant-baseline="central">Held-dive times, by the dive's speed law. Not to scale. Pink: signs of life.</text></svg>