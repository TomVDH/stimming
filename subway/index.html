<style>
/* Subway: a dim cabin; tunnel lamps sweep light over the floor. */
:root { --stage: oklch(0.1 0.01 260); }
.stage--subway { cursor: pointer; touch-action: none; }
.stage--subway canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--subway canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--subway canvas { transition: none; } }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.012 260 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
</style>

<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Subway</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--subway" id="stage" tabindex="0" role="application" aria-label="A dim subway cabin seen at a tilt. Tunnel lamps pass the windows and sweep light and pole shadows over the floor and seats. Hold to brake.">

    </div>

        <button class="chip" type="button" data-value="mixed" aria-pressed="false">Mixed</button>
      </div>
      <label class="slider"><span>Speed</span><input type="range" id="speed" min="0" max="1" step="0.01" value="0.45" aria-label="Speed: standing to fast"></label>

        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings"></div>

  </section>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { initPage, choices, whenVisible, reduced, onReducedChange, pixelRatio, qualitySetting, onQuality, audioKit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });
initPage({ id: 'subway' });

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.subway.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.subway.${k}`, String(v)); } catch { /* storage is optional */ } };
const opts = {
  lamps: saved('lamps') || 'sodium',
  speed: saved('speed') != null ? +saved('speed') : 0.45,
};
// The Speed slider maps to cruise speed in metres per second.
const cruise = v => v * 28;

/* ---------- scene ---------- */
// Subway: one fixed, tilted view of a cabin in a tunnel.
// The cabin is the frame; the tunnel lamps move past it along x.
// Units are metres. The floor is y = 0; the walls are z = -1.4 and z = 1.4.
function build({ THREE }) {
const HALF = 1.4, ROOF = 2.25;
const GAP = 6.5, LAMP_Y = 2.05, LAMP_Z = 2.25, TUBE = 0.3, SHUT = 1 / 30;
const WRAP = GAP * 64;

// Openings in each side wall: x0, x1, y0, y1. Both sides match.
const WIN = [
  [-3.3, -1.5, 1.0, 1.8], [-0.9, 0.9, 1.0, 1.8], [1.5, 3.3, 1.0, 1.8],
  [4.12, 4.6, 0.95, 1.9], [4.8, 5.28, 0.95, 1.9],
  [-5.28, -4.8, 0.95, 1.9], [-4.6, -4.12, 0.95, 1.9],
];
// Occluders: a plane z, an x span and a top y. They stand on the floor.
const R = 0.02;
const POLES = [[-3.75, -0.9], [3.75, -0.9], [-3.75, 0.9], [3.75, 0.9], [-1.2, 0.0], [4.7, 0.0], [-4.7, 0.0]];
const BENCH = 3.6;
const OCC = [
  ...POLES.map(([x, z]) => [z, x - R, x + R, ROOF]),
  // Each bench blocks with its front edge and with its back.
  [-0.95, -BENCH, BENCH, 0.46], [-1.3, -BENCH, BENCH, 0.96],
  [0.95, -BENCH, BENCH, 0.46], [1.3, -BENCH, BENCH, 0.96],
];
const NW = WIN.length, NO = OCC.length;

const U = {
  uTravel: { value: 0 },
  uSmear: { value: 0 },
  uJolt: { value: 0 },
  uTime: { value: 0 },
  uCam: { value: new THREE.Vector3() },
  uColA: { value: new THREE.Color(1.0, 0.5, 0.16) },
  uColB: { value: new THREE.Color(1.0, 0.5, 0.16) },
  uMix: { value: 0 },
  uWin: { value: WIN.map(w => new THREE.Vector4(...w)) },
  uOcc: { value: OCC.map(o => new THREE.Vector4(...o)) },
};

const GLSL = /* glsl */`
#define NW ${NW}
#define NO ${NO}
uniform float uTravel, uSmear, uJolt, uTime, uMix;
uniform vec3 uCam, uColA, uColB;
uniform vec4 uWin[NW];
uniform vec4 uOcc[NO];
const float GAP = ${GAP.toFixed(3)}, LY = ${LAMP_Y.toFixed(3)}, LZ = ${LAMP_Z.toFixed(3)}, TUBE = ${TUBE.toFixed(3)};
const float HALF = ${HALF.toFixed(3)}, POWER = 22.0;

float hash1(float n) { return fract(sin(n * 12.9898) * 43758.5453); }
float hash2(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash2(i), hash2(i + vec2(1, 0)), u.x), mix(hash2(i + vec2(0, 1)), hash2(i + vec2(1, 1)), u.x), u.y);
}

// Lamp number id on side sg: x in the cabin frame, and 0 for a gap.
vec2 lampAt(float id, float sg) {
  float n = mod(id, 64.0) + (sg > 0.0 ? 64.0 : 0.0);
  float x = id * GAP + (hash1(n + 0.37) - 0.5) * 2.4 + (sg > 0.0 ? GAP * 0.5 : 0.0) - uTravel;
  return vec2(x, step(hash1(n), 0.86));
}
vec3 lampColour(float id, float sg) {
  float n = mod(id, 64.0) + (sg > 0.0 ? 64.0 : 0.0);
  return hash1(n + 0.71) < uMix ? uColB : uColA;
}
// The lamp id nearest to cabin x on side sg.
float lampId(float x, float sg) { return floor((x + uTravel - (sg > 0.0 ? GAP * 0.5 : 0.0)) / GAP + 0.5); }

// A soft band: 1 inside [y0, y1], with edges w wide.
float band(float y, float y0, float y1, float w) {
  return clamp((y - y0) / w + 0.5, 0.0, 1.0) * clamp((y1 - y) / w + 0.5, 0.0, 1.0);
}
// The lamp x range that a vertical slot [a, b] lets through to P.
// t is where the ray crosses the slot's plane, from P (0) to the lamp line (1).
vec2 slot(vec3 P, float t, float a, float b) { float k = (1.0 - t) * P.x; return vec2(a - k, b - k) / t; }
float overlap(vec2 a, vec2 b) { return max(0.0, min(a.y, b.y) - max(a.x, b.x)); }

// Tunnel light at P: each lamp is a box in x, its tube plus the shutter's travel.
// Each window passes one interval of lamp x; each occluder takes one away.
vec3 tunnelLight(vec3 P, vec3 N) {
  vec3 sum = vec3(0.0);
  float ly = LY + uJolt;
  for (int s = 0; s < 2; s++) {
    float sg = s == 0 ? -1.0 : 1.0;
    float zl = LZ * sg, dz = zl - P.z;
    float tw = (HALF * sg - P.z) / dz;
    // A point on this side's wall faces away from this side's lamps.
    if (tw < 0.002) continue;
    float yw = P.y + tw * (ly - P.y);
    float ew = tw * 0.14 + 0.004;
    // The occluder tests that do not depend on the lamp run once per side.
    float ot[NO], oh[NO];
    for (int k = 0; k < NO; k++) {
      float t = (uOcc[k].x - P.z) / dz;
      oh[k] = (t > 0.002 && t < 1.0) ? band(P.y + t * (ly - P.y), -1.0, uOcc[k].w, t * 0.14 + 0.004) : 0.0;
      ot[k] = t;
    }
    float i0 = lampId(P.x, sg);
    for (int j = -2; j <= 2; j++) {
      float id = i0 + float(j);
      vec2 l = lampAt(id, sg);
      if (l.y < 0.5) continue;
      vec2 box = vec2(l.x - TUBE * 0.5, l.x + TUBE * 0.5 + uSmear);
      float lit = 0.0, mid = 0.0;
      for (int w = 0; w < NW; w++) {
        vec4 o = uWin[w];
        float v = band(yw, o.z, o.w, ew);
        if (v <= 0.0) continue;
        vec2 I = slot(P, tw, o.x, o.y);
        I = vec2(max(I.x, box.x), min(I.y, box.y));
        float len = I.y - I.x;
        if (len <= 0.0) continue;
        float keep = 1.0;
        for (int k = 0; k < NO; k++) {
          if (oh[k] <= 0.0) continue;
          keep *= 1.0 - oh[k] * min(1.0, overlap(I, slot(P, ot[k], uOcc[k].y, uOcc[k].z)) / len);
        }
        float c = len * v * keep;
        lit += c;
        mid += (I.x + I.y) * 0.5 * c;
      }
      if (lit <= 0.0) continue;
      vec3 L = vec3(mid / lit, ly, zl) - P;
      float d2 = dot(L, L);
      float ndl = max(dot(N, L) * inversesqrt(d2), 0.0);
      sum += lampColour(id, sg) * (lit / (box.y - box.x)) * ndl / d2;
    }
  }
  return sum * POWER;
}

// The dim cabin: one warm strip down the middle of the roof.
vec3 cabinLight(vec3 P, vec3 N) {
  vec2 d = vec2(${(ROOF - 0.05).toFixed(3)} - P.y, -P.z);
  float irr = max(dot(N.yz, normalize(d)), 0.0) * 0.9 / (dot(d, d) + 0.4);
  return vec3(1.0, 0.78, 0.55) * (irr + 0.1) * 0.035;
}

// A box filter of stripes w wide every p metres, over a window s wide.
float stripes(float x, float p, float w, float s) {
  s = max(s, 0.002);
  float a = x - s * 0.5, b = x + s * 0.5;
  float fa = floor(a / p) * w + clamp(fract(a / p) * p, 0.0, w);
  float fb = floor(b / p) * w + clamp(fract(b / p) * p, 0.0, w);
  return (fb - fa) / s;
}

// The tunnel seen through an opening on side sg.
vec3 tunnel(vec3 P, float sg) {
  vec3 d = normalize(P - uCam);
  if (d.z * sg <= 0.001) return vec3(0.0);
  float ly = LY + uJolt;
  // The lamps hang on brackets in front of the tunnel wall.
  vec3 q = P + d * ((2.75 * sg - P.z) / d.z);
  vec3 ql = P + d * ((LZ * sg - P.z) / d.z);
  float xt = q.x + uTravel, s = uSmear;
  // The lining: rings every 1.3 m and cable runs along the wall.
  float alb = 0.11 + 0.06 * vnoise(vec2(xt * 1.2 / (1.0 + s * 4.0), q.y * 6.0));
  alb *= 1.0 - 0.5 * stripes(xt, 1.3, 0.16, s);
  alb *= 1.0 - 0.7 * (band(q.y, 0.42, 0.47, 0.01) + band(q.y, 0.52, 0.56, 0.01) + band(q.y, 1.32, 1.37, 0.01));
  vec3 c = vec3(0.0);
  float i0 = lampId(q.x, sg);
  for (int j = -1; j <= 1; j++) {
    float id = i0 + float(j);
    vec2 l = lampAt(id, sg);
    if (l.y < 0.5) continue;
    vec3 col = lampColour(id, sg);
    // The wall pool: the lamp smeared over the shutter lights the lining.
    float hw = (TUBE + s) * 0.5, cx = l.x + s * 0.5;
    float dx = max(abs(q.x - cx) - hw, 0.0), dy = q.y - ly;
    float d2 = dx * dx + dy * dy + 0.25;
    c += col * alb * 2.2 / (d2 * sqrt(d2));
    // The lamp itself: a capsule of light along the travel.
    float lx = max(abs(ql.x - cx) - hw, 0.0), lyy = ql.y - ly;
    float r = 0.035;
    float k = (TUBE + r) / (TUBE + r + s);
    c += col * (exp(-(lx * lx + lyy * lyy) / (r * r)) * 40.0 + exp(-(lx * lx + lyy * lyy) / 0.05) * 0.6) * k;
  }
  return c;
}
`;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 60);

// Every surface shares one shader; kind picks the wall, floor or roof extras.
const KIND = { plain: 0, wall: 1, floor: 2, roof: 3 };
function mat(albedo, kind = 'plain', side = 0) {
  return new THREE.ShaderMaterial({
    uniforms: { ...U, uAlb: { value: new THREE.Color(...albedo) }, uKind: { value: KIND[kind] }, uSide: { value: side } },
    vertexShader: /* glsl */`
    varying vec3 vW, vN;
    void main() {
      vec4 w = modelMatrix * vec4(position, 1.0);
      vW = w.xyz;
      vN = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
    fragmentShader: /* glsl */`
    uniform vec3 uAlb;
    uniform float uKind, uSide;
    varying vec3 vW, vN;
    ${GLSL}
    // A rounded box in the wall plane; negative inside.
    float sdBox(vec2 p, vec2 c, vec2 h, float r) { vec2 q = abs(p - c) - h + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
    void main() {
      vec3 P = vW, N = normalize(vN);
      vec3 alb = uAlb;
      if (uKind == 1.0) {
        // Openings show the tunnel; a dark gasket rings each one.
        float sd = 1e3;
        for (int w = 0; w < NW; w++) {
          vec4 o = uWin[w];
          sd = min(sd, sdBox(P.xy, vec2(o.x + o.y, o.z + o.w) * 0.5, vec2(o.y - o.x, o.w - o.z) * 0.5, 0.07));
        }
        if (sd < 0.0) {
          vec3 c = tunnel(P, uSide);
          // The glass holds a faint warm reflection of the cabin.
          c += vec3(1.0, 0.8, 0.6) * 0.012 * (0.6 + 0.4 * P.y);
          gl_FragColor = vec4(c, 1.0);
          return;
        }
        if (sd < 0.035) alb = vec3(0.03);
      } else if (uKind == 2.0) {
        // Rubber flooring with a fine fleck.
        alb *= 0.8 + 0.4 * vnoise(P.xz * 60.0);
      } else if (uKind == 3.0) {
        // The roof strip glows dim and warm.
        if (abs(P.z) < 0.14) { gl_FragColor = vec4(vec3(1.0, 0.8, 0.58) * 0.16, 1.0); return; }
      }
      vec3 c = alb * (cabinLight(P, N) + tunnelLight(P, N));
      gl_FragColor = vec4(c, 1.0);
    }`,
  });
}

/* ---------- the cabin ---------- */
const LEN = 16;
const add = (geo, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); scene.add(o); return o; };
const FLOOR = [0.2, 0.21, 0.24], WALLC = [0.55, 0.54, 0.5], SEAT = [0.09, 0.12, 0.3], BASE = [0.1, 0.1, 0.11], POLE = [0.75, 0.5, 0.06];
add(new THREE.PlaneGeometry(LEN, HALF * 2).rotateX(-Math.PI / 2), mat(FLOOR, 'floor'));
add(new THREE.PlaneGeometry(LEN, HALF * 2).rotateX(Math.PI / 2), mat(WALLC, 'roof'), 0, ROOF, 0);
add(new THREE.PlaneGeometry(LEN, ROOF).translate(0, ROOF / 2, 0), mat(WALLC, 'wall', -1), 0, 0, -HALF);
add(new THREE.PlaneGeometry(LEN, ROOF).translate(0, ROOF / 2, 0).rotateY(Math.PI), mat(WALLC, 'wall', 1), 0, 0, HALF);
add(new THREE.PlaneGeometry(HALF * 2, ROOF).translate(0, ROOF / 2, 0).rotateY(Math.PI / 2), mat(WALLC), -LEN / 2, 0, 0);
add(new THREE.PlaneGeometry(HALF * 2, ROOF).translate(0, ROOF / 2, 0).rotateY(-Math.PI / 2), mat(WALLC), LEN / 2, 0, 0);
// Benches run along both walls between the doors.
const seatM = mat(SEAT), baseM = mat(BASE), poleM = mat(POLE);
for (const sg of [-1, 1]) {
  add(new THREE.BoxGeometry(BENCH * 2, 0.1, 0.45), seatM, 0, 0.41, sg * (HALF - 0.225));
  add(new THREE.BoxGeometry(BENCH * 2, 0.36, 0.36), baseM, 0, 0.18, sg * (HALF - 0.2));
  add(new THREE.BoxGeometry(BENCH * 2, 0.5, 0.08), seatM, 0, 0.71, sg * (HALF - 0.07));
  // A grab rail runs above each bench.
  add(new THREE.CylinderGeometry(R, R, BENCH * 2, 10).rotateZ(Math.PI / 2), poleM, 0, 1.9, sg * 0.78);
}
for (const [x, z] of POLES) add(new THREE.CylinderGeometry(R, R, ROOF, 12), poleM, x, ROOF / 2, z);

/* ---------- framing ---------- */
// A fixed, tilted look down across the aisle at the far bench and windows.
function frame(w, h) {
  camera.aspect = w / h;
  const wide = w >= h;
  camera.fov = wide ? 52 : 74;
  camera.position.set(wide ? -3.0 : -0.7, 1.7, 1.0);
  camera.up.set(0, 1, 0);
  camera.lookAt(wide ? 0.4 : 1.7, 0.45, -1.0);
  camera.rotateZ(THREE.MathUtils.degToRad(wide ? 13 : 10));
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  U.uCam.value.copy(camera.position);
}

/* ---------- motion ---------- */
let time = 0, travel = 0, speed = 0, target = 12, brake = false, mk = 1;
const LAMPS = {
  sodium: { a: [1.0, 0.5, 0.16], b: [1.0, 0.5, 0.16], mix: 0 },
  white: { a: [0.82, 0.9, 1.0], b: [0.82, 0.9, 1.0], mix: 0 },
  mixed: { a: [1.0, 0.5, 0.16], b: [0.6, 0.95, 0.85], mix: 0.4 },
};
let lamps = LAMPS.sodium;
// Each wheelset kicks the carriage as it crosses a rail joint.
// The pairs sit 2.6 m apart; the far bogie kicks softer.
const JOINT = 18, KICK = [[0, 1], [2.6, 1], [13, 0.45], [15.6, 0.45]];
function jolt() {
  if (speed < 0.5) return 0;
  let y = 0;
  for (const [b, wt] of KICK) {
    const t = ((((travel - b) % JOINT) + JOINT) % JOINT) / speed;
    y += wt * Math.exp(-t / 0.09) * Math.sin(t * 55);
  }
  return y * Math.min(1, speed / 20);
}
function update(dt, pace) {
  // The train eases to cruise, brakes on a hold, and stops when idle.
  const goal = brake ? 0 : target * pace;
  speed += (goal - speed) * Math.min(1, dt * (goal < speed ? 0.9 : 0.6));
  if (goal === 0 && speed < 0.05) speed = 0;
  travel = (travel + speed * dt) % WRAP;
  time += dt;
  mk = Math.min(1, mk + dt * 1.5);
  // The cabin bounces on the springs; the lamps outside do not.
  U.uJolt.value = -jolt() * 0.012;
  U.uTravel.value = travel;
  U.uTime.value = time;
  U.uSmear.value = speed * SHUT;
  // Lamp colours ease to the new choice.
  const e = Math.min(1, dt * 3);
  U.uColA.value.lerp(new THREE.Color(...lamps.a), e);
  U.uColB.value.lerp(new THREE.Color(...lamps.b), e);
  U.uMix.value += (lamps.mix - U.uMix.value) * e;
}
return {
  scene, camera, frame, update,
  get speed() { return speed; },
  get travel() { return travel; },
  setSpeed(v) { target = v; },
  setBrake(on) { brake = on; },
  lively: () => speed > 0.05 || mk < 1 || (!brake && target > 0 && speed < target * 0.99),
  setLamps(v, now) {
    lamps = LAMPS[v] || LAMPS.sodium;
    mk = 0;
    if (now) { U.uColA.value.setRGB(...lamps.a); U.uColB.value.setRGB(...lamps.b); U.uMix.value = lamps.mix; mk = 1; }
  },
  post: { bloom: [0.75, 0.55, 0.85], tint: [0.0008, 0.0007, 0.0009], vig: 0.5, vigIn: 0.4, grain: 0.035 },
};
}

/* ---------- end scene ---------- */

const stage = document.getElementById('stage');
const canvas = document.createElement('canvas');
canvas.setAttribute('aria-hidden', 'true');
stage.prepend(canvas);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const S = build({ THREE });

/* Post chain: render, half-resolution bloom, grade, output. */
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(S.scene, S.camera));
const [bS, bR, bT] = S.post.bloom;
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), bS, bR, bT);
// The bloom runs at half resolution.
const bloomSize = bloom.setSize.bind(bloom);
bloom.setSize = (w, h) => bloomSize(Math.max(1, w / 2), Math.max(1, h / 2));
composer.addPass(bloom);

// The grade adds a tint, a vignette and fixed grain.
const grade = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null },
    uRes: { value: new THREE.Vector2(1, 1) },
    uTint: { value: new THREE.Vector3(...S.post.tint) },
    uVig: { value: S.post.vig },
    uVigIn: { value: S.post.vigIn },
    uGrain: { value: S.post.grain },
  },
  vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform sampler2D tDiffuse;
  uniform vec2 uRes;
  uniform vec3 uTint;
  uniform float uVig, uVigIn, uGrain;
  varying vec2 vUv;
  // Interleaved gradient noise: fine grain with no banding.
  float h(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
  void main() {
    vec3 c = texture2D(tDiffuse, vUv).rgb + uTint;
    float asp = uRes.x / uRes.y;
    vec2 q = (vUv - 0.5) * vec2(asp, 1.0);
    c *= 1.0 - uVig * smoothstep(uVigIn, 1.1, length(q));
    float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
    c *= 1.0 + (h(vUv * uRes) - 0.5) * uGrain * (0.6 + 0.4 * smoothstep(0.0, 0.3, lum)) * 2.0;
    gl_FragColor = vec4(max(c, 0.0), 1.0);
  }`,
});
composer.addPass(grade);
composer.addPass(new OutputPass());

/* ---------- size ---------- */
// Slow frames step down one rung: High to Standard, Standard to 1x.
let rung = 0, size = { w: 1, h: 1, dpr: 1 };
function resize(force = false) {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  const dpr = pixelRatio(w, h, { maxDpr: 2, budget: 2.6e6, low: rung > 0 });
  if (!force && w === size.w && h === size.h && dpr === size.dpr) return;
  size = { w, h, dpr };
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
  grade.uniforms.uRes.value.set(w * dpr, h * dpr);
  S.frame(w, h);
  if (ready) draw();
}
let runT = 0, avg = 1 / 60, slowT = 0;
function watchdog(dt) {
  if (!dt || rung) return;
  runT += dt;
  avg += (dt - avg) * 0.1;
  if (runT < 4) return;
  slowT = avg > 1 / 38 ? slowT + dt : 0;
  if (slowT > 2) { rung = 1; resize(true); }
}

/* ---------- sound ---------- */
// The bogies rumble, the tunnel roars, and each rail joint clacks.
const kit = audioKit({ gain: 0.6, noiseSeconds: 2 });
const JOINT = 18, BOGIE = [0, 2.6, 13, 15.6];
let V = null, joint = null;
function loopNoise(ac, type, f, q) {
  const src = ac.createBufferSource(); src.buffer = kit.noise; src.loop = true;
  const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = ac.createGain(); g.gain.value = 0;
  src.connect(fl).connect(g).connect(kit.out);
  src.start(0, Math.random() * kit.noise.duration);
  return { fl, g };
}
function voices() {
  const ac = kit.live();
  if (!ac || !kit.noise) return null;
  V ||= { roar: loopNoise(ac, 'bandpass', 420, 0.6), rumble: loopNoise(ac, 'lowpass', 150, 0.7) };
  return V;
}
function burst(ac, at, { f, q, dur, level, type = 'bandpass' }) {
  const src = ac.createBufferSource(); src.buffer = kit.noise;
  const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = ac.createGain();
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(level, at + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0005, at + dur);
  src.connect(fl).connect(g).connect(kit.out);
  src.start(at, Math.random() * (kit.noise.duration - dur - 0.05), dur + 0.02);
}
// One wheel on one joint: a click of steel and a low thump.
function clack(ac, at, level) {
  burst(ac, at, { f: 1100 + Math.random() * 500, q: 1.4, dur: 0.035, level: level * 0.35 });
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(95, at); o.frequency.exponentialRampToValueAtTime(48, at + 0.09);
  g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(level * 0.5, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0005, at + 0.12);
  o.connect(g).connect(kit.out);
  o.start(at); o.stop(at + 0.14);
}
function voice() {
  const v = voices();
  if (!v) return;
  const ac = kit.ac, now = ac.currentTime, sp = S.speed, k = Math.min(1, sp / 22);
  // The tunnel walls throw the noise back; the roar climbs with speed.
  v.roar.g.gain.setTargetAtTime(0.16 * Math.pow(k, 1.2), now, 0.25);
  v.roar.fl.frequency.setTargetAtTime(300 + 400 * k, now, 0.3);
  v.rumble.g.gain.setTargetAtTime(0.32 * Math.pow(k, 0.8), now, 0.2);
  v.rumble.fl.frequency.setTargetAtTime(110 + 90 * k, now, 0.3);
  // Each bogie wheel crosses the joint in turn; the gap shrinks with speed.
  const j = Math.floor(S.travel / JOINT);
  if (joint !== null && j !== joint && sp > 2) for (const b of BOGIE) clack(ac, now + b / sp, 0.25 + 0.5 * k);
  joint = j;
}
function hush() {
  if (!V || !kit.ac) return;
  const now = kit.ac.currentTime;
  V.roar.g.gain.setTargetAtTime(0, now, 0.15);
  V.rumble.g.gain.setTargetAtTime(0, now, 0.15);
}

/* ---------- loop ---------- */
// Full rate while the train moves, then sleep.
// QA can shorten the sleep with ?sleep=<ms>.
const SLEEP = +new URLSearchParams(location.search).get('sleep') || 60000;
let raf = 0, lastT = 0, lastInput = performance.now(), pace = reduced() ? 0 : 1, visible = true, ready = false;
function draw() { composer.render(); }
function loop(now) {
  raf = 0;
  if (!visible) return;
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000);
  lastT = now;
  // Ambient motion eases out over 2 s once idle; reduced motion keeps it off.
  const awake = !reduced() && now - lastInput < SLEEP;
  pace = awake ? Math.min(1, pace + dt / 2) : Math.max(0, pace - dt / 2);
  S.update(dt, pace);
  voice();
  draw();
  watchdog(dt);
  if (!S.lively()) { hush(); kit.rest(() => !raf); return; }
  raf = requestAnimationFrame(loop);
}
function wake() {
  lastInput = performance.now();
  if (ready && visible && !raf) { lastT = performance.now(); raf = requestAnimationFrame(loop); }
}

/* ---------- input ---------- */
// A hold brakes the train; a release lets it run on.
let press = null;
stage.addEventListener('pointerdown', e => {
  if (e.button > 0 || press) return;
  try { stage.setPointerCapture(e.pointerId); } catch { /* capture is optional */ }
  press = e.pointerId;
  S.setBrake(true);
  wake();
});
function endPress(e) {
  if (press !== e.pointerId) return;
  press = null;
  S.setBrake(false);
  wake();
}
stage.addEventListener('pointerup', endPress);
stage.addEventListener('pointercancel', endPress);

/* ---------- bar ---------- */
function popover(box, btn) {
  const set = on => { box.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!box.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
// Settings holds the site-wide Quality choice.
qualitySetting(document.getElementById('sets'));
onQuality(() => { rung = 0; resize(true); wake(); });

// The lamps ease to the new colour.
const lampChoice = choices(document.getElementById('lamps'), v => { opts.lamps = v; save('lamps', v); S.setLamps(v); wake(); });
lampChoice.set(opts.lamps);
S.setLamps(opts.lamps, true);
const speedEl = document.getElementById('speed');
speedEl.value = String(opts.speed);
S.setSpeed(cruise(opts.speed));
speedEl.addEventListener('input', () => { opts.speed = +speedEl.value; save('speed', opts.speed); S.setSpeed(cruise(opts.speed)); wake(); });
const KEYS = { Digit1: 'sodium', Digit2: 'white', Digit3: 'mixed' };
addEventListener('keydown', e => {
  if (e.target.closest?.('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (KEYS[e.code]) lampChoice.set(KEYS[e.code], true);
});

/* ---------- start ---------- */
onReducedChange(() => wake());
whenVisible(stage, v => {
  visible = v;
  if (v) { if (ready) draw(); wake(); } else { cancelAnimationFrame(raf); raf = 0; lastT = 0; hush(); }
});
new ResizeObserver(() => resize()).observe(stage);
// Compile first, then draw the first composed frame inside the intro.
(async () => {
  resize(true);
  if (renderer.extensions.has('KHR_parallel_shader_compile')) await renderer.compileAsync(S.scene, S.camera);
  else renderer.compile(S.scene, S.camera);
  draw();
  // One finished frame folds the shader work into the intro.
  renderer.getContext().finish();
  ready = true;
  markReady();
  requestAnimationFrame(() => canvas.classList.add('on'));
  wake();
})().catch(err => { console.error(err); stage.querySelector('.fail').hidden = false; markReady(); });
</script>
</body>
</html>
