<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { initPage, whenVisible, reduced, onReducedChange, onQuality, audioKit } from '../shared/stim.js';
import { detail } from '../shared/detail.js';
import { intro as playIntro } from '../shared/intro.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.subway.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.subway.${k}`, String(v)); } catch { /* storage is optional */ } };
const SHOT_NAMES = ['straps', 'seats', 'window', 'door', 'floor'];
const opts = {
  shot: SHOT_NAMES.includes(saved('shot')) ? saved('shot') : 'straps',
  speed: saved('speed') != null ? +saved('speed') : 0.45,
};
// The shell builds every control from this one spec.
// Handlers bind once the scene is up; early input does nothing.
const act = { shot() {}, speed() {} };
initPage({ id: 'subway', bar: {
  choice: { label: 'Shot', value: opts.shot, options: [
    { value: 'straps', label: 'Straps', key: '1' },
    { value: 'seats', label: 'Seats', key: '2' },
    { value: 'window', label: 'Window', key: '3' },
    { value: 'door', label: 'Door', key: '4' },
    { value: 'floor', label: 'Floor', key: '5' },
  ], onPick: v => act.shot(v) },
  slider: { label: 'Speed', min: 0, max: 1, step: 0.01, value: opts.speed, onInput: v => act.speed(v) },
  quality: true,
  keys: [['hold', 'brake the train'], ['1-5', 'pick a shot']],
  // Bar v3 lists every input in How to play: one instruction per row.
  help: [['hold', 'Brake the train'], ['release', 'Let the train run on'], ['1 2 3 4 5', 'Pick a shot']],
} });
// The Speed slider maps to cruise speed in metres per second.
const cruise = v => v * 28;

/* ---------- scene ---------- */
// Subway: one fixed, tilted view of a cabin in a tunnel.
// The cabin is the frame; the tunnel lamps move past it along x.
// Units are metres. The floor is y = 0; the walls are z = -1.4 and z = 1.4.
function build({ THREE }) {
const HALF = 1.4, ROOF = 2.25;
const GAP = 6.5, LAMP_Y = 2.05, LAMP_Z = 2.25, TUBE = 0.3, SHUT = 1 / 30;
const WRAP = GAP * 256;

// Openings in each side wall: x0, x1, y0, y1. Both sides match.
const WIN = [
  [-3.3, -1.5, 1.0, 1.8], [-0.9, 0.9, 1.0, 1.8], [1.5, 3.3, 1.0, 1.8],
  [4.12, 4.6, 0.95, 1.9], [4.8, 5.28, 0.95, 1.9],
  [-5.28, -4.8, 0.95, 1.9], [-4.6, -4.12, 0.95, 1.9],
];
// Occluders: a plane z, an x span and a top y. They stand on the floor.
const R = 0.02;
const POLES = [[-3.75, -0.9], [3.75, -0.9], [-3.75, 0.9], [3.75, 0.9], [-1.2, 0.0], [4.7, 0.0], [-4.7, 0.0]];
const BENCH = 3.6, SEATS = 14;
const OCC = [
  ...POLES.map(([x, z]) => [z, x - R, x + R, ROOF]),
  // Each bench blocks with its front edge and with its back.
  [-0.95, -BENCH, BENCH, 0.46], [-1.3, -BENCH, BENCH, 0.96],
  [0.95, -BENCH, BENCH, 0.46], [1.3, -BENCH, BENCH, 0.96],
];
const NW = WIN.length, NO = OCC.length;

const U = {
  uZero: { value: 0 },
  uTravel: { value: 0 },
  uSmear: { value: 0 },
  uJolt: { value: 0 },
  uTime: { value: 0 },
  uSwing: { value: 0 },
  uSway: { value: 0 },
  uCam: { value: new THREE.Vector3() },
  uColA: { value: new THREE.Color(1.0, 0.5, 0.16) },
  uMix: { value: 1 },
  uWin: { value: WIN.map(w => new THREE.Vector4(...w)) },
  uOcc: { value: OCC.map(o => new THREE.Vector4(...o)) },
};

// Shared GLSL: uniforms, hashes, noise and the lamp layout.
const GLSL_BASE = /* glsl */`
#define NW ${NW}
#define NO ${NO}
// Loop counts add a uniform zero, so the D3D compiler keeps them as loops.
// It fails to unroll these nests and spends minutes retrying.
uniform int uZero;
#define DYN(n) ((n) + uZero)
uniform float uTravel, uSmear, uJolt, uTime, uMix;
uniform vec3 uCam, uColA;
uniform vec4 uWin[NW];
uniform vec4 uOcc[NO];
const float GAP = ${GAP.toFixed(3)}, LY = ${LAMP_Y.toFixed(3)}, LZ = ${LAMP_Z.toFixed(3)}, TUBE = ${TUBE.toFixed(3)};
const float HALF = ${HALF.toFixed(3)}, ROOF = ${ROOF.toFixed(3)}, POWER = 16.0;

float hash1(float n) { return fract(sin(n * 12.9898) * 43758.5453); }
float hash2(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash2(i), hash2(i + vec2(1, 0)), u.x), mix(hash2(i + vec2(0, 1)), hash2(i + vec2(1, 1)), u.x), u.y);
}
// A soft band: 1 inside [y0, y1], with edges w wide.
float band(float y, float y0, float y1, float w) {
  return clamp((y - y0) / w + 0.5, 0.0, 1.0) * clamp((y1 - y) / w + 0.5, 0.0, 1.0);
}
// A rounded box in a plane; negative inside.
float sdBox(vec2 p, vec2 c, vec2 h, float r) { vec2 q = abs(p - c) - h + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }

// The mixed palette: mostly sodium, then white, green, a red signal, a blue work lamp.
vec3 palette(float h) {
  if (h < 0.42) return vec3(1.0, 0.5, 0.16);
  if (h < 0.66) return vec3(0.82, 0.9, 1.0) * 0.85;
  if (h < 0.82) return vec3(0.4, 1.0, 0.72) * 0.9;
  if (h < 0.93) return vec3(1.0, 0.1, 0.04) * 0.7;
  return vec3(0.3, 0.45, 1.0) * 0.85;
}
// Lamp number id on side sg: x in the cabin frame, 0 or 1 for a gap, and its colour.
// Lamps come in runs of eight: a dark run, a normal run or a dense run of one colour.
vec2 lampAt(float id, float sg, out vec3 col) {
  float n = mod(id, 256.0) + (sg > 0.0 ? 256.0 : 0.0);
  float bt = hash1(floor(n / 8.0) * 3.7 + 11.0);
  float dark = step(bt, 0.3), dense = step(0.72, bt);
  float on = step(hash1(n), mix(mix(0.4, 0.05, dark), 0.75, dense));
  float x = id * GAP + (hash1(n + 0.37) - 0.5) * mix(2.4, 0.4, dense) + (sg > 0.0 ? GAP * 0.5 : 0.0) - uTravel;
  float h = mix(hash1(n + 0.71), hash1(floor(n / 8.0) + 0.53), dense);
  // A lone lamp in a dark run burns brighter.
  float k = (0.6 + 0.8 * hash1(n + 0.19)) * (1.0 + 0.6 * dark);
  col = mix(uColA, palette(h), uMix) * k;
  return vec2(x, on);
}
// The lamp id nearest to cabin x on side sg.
float lampId(float x, float sg) { return floor((x + uTravel - (sg > 0.0 ? GAP * 0.5 : 0.0)) / GAP + 0.5); }
// A filter weight: 1 when a pattern of scale g is sharp, 0 when it is sub-pixel.
float sharp(vec2 g) { return clamp(1.5 - 1.2 * max(length(fwidth(g)), 0.0), 0.0, 1.0); }
`;

// Cabin light: the tunnel lamps through the windows, and the roof strips.
const GLSL_LIGHT = /* glsl */`

// The lamp x range that a vertical slot [a, b] lets through to P.
// t is where the ray crosses the slot's plane, from P (0) to the lamp line (1).
vec2 slot(vec3 P, float t, float a, float b) { float k = (1.0 - t) * P.x; return vec2(a - k, b - k) / t; }
float overlap(vec2 a, vec2 b) { return max(0.0, min(a.y, b.y) - max(a.x, b.x)); }

// Tunnel light at P: each lamp is a box in x, its tube plus the shutter's travel.
// Each window passes one interval of lamp x; each occluder takes one away.
void tunnelLight(vec3 P, vec3 N, vec3 V, float rough, vec3 F0, out vec3 dif, out vec3 spe) {
  dif = vec3(0.0);
  spe = vec3(0.0);
  float ly = LY + uJolt;
  for (int s = 0; s < DYN(2); s++) {
    float sg = s == 0 ? -1.0 : 1.0;
    float zl = LZ * sg, dz = zl - P.z;
    float tw = (HALF * sg - P.z) / dz;
    // A point on this side's wall faces away from this side's lamps.
    if (tw < 0.002) continue;
    float yw = P.y + tw * (ly - P.y);
    float ew = tw * 0.14 + 0.004;
    float i0 = lampId(P.x, sg);
    for (int j = -2; j <= DYN(2); j++) {
      float id = i0 + float(j);
      vec3 col;
      vec2 l = lampAt(id, sg, col);
      if (l.y < 0.5) continue;
      vec2 box = vec2(l.x - TUBE * 0.5, l.x + TUBE * 0.5 + uSmear);
      float lit = 0.0, mid = 0.0;
      for (int w = 0; w < DYN(NW); w++) {
        vec4 o = uWin[w];
        float v = band(yw, o.z, o.w, ew);
        if (v <= 0.0) continue;
        vec2 I = slot(P, tw, o.x, o.y);
        I = vec2(max(I.x, box.x), min(I.y, box.y));
        float len = I.y - I.x;
        if (len <= 0.0) continue;
        float keep = 1.0;
        // Each occluder takes its slot out of the interval.
        // The test runs inline: a local array makes the D3D compiler fail to unroll.
        for (int k = 0; k < DYN(NO); k++) {
          vec4 oc = uOcc[k];
          float t = (oc.x - P.z) / dz;
          if (t <= 0.002 || t >= 1.0) continue;
          float h = band(P.y + t * (ly - P.y), -1.0, oc.w, t * 0.14 + 0.004);
          if (h <= 0.0) continue;
          keep *= 1.0 - h * min(1.0, overlap(I, slot(P, t, oc.y, oc.z)) / len);
        }
        float c = len * v * keep;
        lit += c;
        mid += (I.x + I.y) * 0.5 * c;
      }
      if (lit <= 0.0) continue;
      vec3 L = vec3(mid / lit, ly, zl) - P;
      float d2 = dot(L, L);
      vec3 Ln = L * inversesqrt(d2);
      vec3 e = col * (lit / (box.y - box.x)) / d2;
      float nl = max(dot(N, Ln), 0.0);
      dif += e * nl;
      // GGX lobe, Schlick fresnel, Kelemen visibility: one microfacet term per lamp.
      vec3 H = normalize(Ln + V);
      float nh = max(dot(N, H), 0.0), vh = max(dot(V, H), 0.0);
      float a2 = rough * rough * rough * rough;
      float dd = nh * nh * (a2 - 1.0) + 1.0;
      vec3 F = F0 + (1.0 - F0) * pow(1.0 - vh, 5.0);
      // The lamps are small: 0.2 keeps the peak near the old Blinn highlight.
      spe += e * nl * F * (a2 / (3.14159265 * dd * dd)) * 0.05 / max(vh * vh, 0.04);
    }
  }
  dif *= POWER;
  spe *= POWER;
}

// The dim cabin: two warm diffuser strips along the roof.
vec3 cabinLight(vec3 P, vec3 N) {
  float irr = 0.0;
  for (int i = 0; i < DYN(2); i++) {
    vec2 d = vec2(ROOF - 0.04 - P.y, (i == 0 ? -0.55 : 0.55) - P.z);
    irr += max(dot(N.yz, normalize(d)), 0.0) * 0.5 / (dot(d, d) + 0.4);
  }
  return vec3(1.0, 0.78, 0.55) * (irr + 0.1) * 0.035;
}

`;

// The tunnel seen through the glass. Only the glass shader uses it.
const GLSL_TUNNEL = /* glsl */`
// A box filter of stripes w wide every p metres, over a window s wide.
float stripes(float x, float p, float w, float s) {
  s = max(s, 0.002);
  float a = x - s * 0.5, b = x + s * 0.5;
  float fa = floor(a / p) * w + clamp(fract(a / p) * p, 0.0, w);
  float fb = floor(b / p) * w + clamp(fract(b / p) * p, 0.0, w);
  return (fb - fa) / s;
}

// The tunnel seen through an opening on side sg.
// glow is the lamp light that falls on the glass itself.
// bk blurs the view: grease on the pane scatters it.
// lamp is the brightest lamp's image on the pane (x, y) and its strength.
vec3 tunnel(vec3 P, float sg, float bk, out vec3 glow, out vec3 lamp) {
  glow = vec3(0.0);
  lamp = vec3(0.0);
  vec3 d = normalize(P - uCam);
  if (d.z * sg <= 0.001) return vec3(0.0);
  float ly = LY + uJolt;
  // The lamps hang on brackets in front of the tunnel wall.
  vec3 q = P + d * ((2.75 * sg - P.z) / d.z);
  vec3 ql = P + d * ((LZ * sg - P.z) / d.z);
  float xt = q.x + uTravel, s = uSmear + bk * 0.25;
  // The lining: rings every 1.3 m and cable runs along the wall.
  float alb = 0.11 + 0.06 * vnoise(vec2(xt * 1.2 / (1.0 + s * 4.0), q.y * 6.0));
  alb *= 1.0 - 0.5 * stripes(xt, 1.3, 0.16, s);
  alb *= 1.0 - 0.7 * (band(q.y, 0.42, 0.47, 0.01) + band(q.y, 0.52, 0.56, 0.01) + band(q.y, 1.32, 1.37, 0.01));
  vec3 c = vec3(0.0);
  float i0 = lampId(q.x, sg);
  for (int j = -1; j <= DYN(1); j++) {
    float id = i0 + float(j);
    vec3 col;
    vec2 l = lampAt(id, sg, col);
    if (l.y < 0.5) continue;
    // The wall pool: the lamp smeared over the shutter lights the lining.
    float hw = (TUBE + s) * 0.5, cx = l.x + s * 0.5;
    float dx = max(abs(q.x - cx) - hw, 0.0), dy = q.y - ly;
    float d2 = dx * dx + dy * dy + 0.25;
    c += col * alb * 1.2 / (d2 * sqrt(d2));
    // The lamp itself: a capsule of light along the travel.
    float lx = max(abs(ql.x - cx) - hw, 0.0), lyy = ql.y - ly;
    // A wide, soft lamp: the outside blurs the way a moving window does.
    float r = 0.09 + 0.16 * bk;
    float k = (TUBE + r) / (TUBE + r + s);
    c += col * (exp(-(lx * lx + lyy * lyy) / (r * r)) * 9.0 * 0.09 / r + exp(-(lx * lx + lyy * lyy) / 0.2) * 0.3) * k;
    // The same lamp lights the pane, 0.85 m away.
    float gx = max(abs(P.x - cx) - hw, 0.0), gy = P.y - ly;
    glow += col / (gx * gx + gy * gy + 0.7);
    // The lamp's image sits where the line from the eye to it crosses the glass.
    vec3 Lw = vec3(cx, ly, LZ * sg);
    vec2 lp = uCam.xy + (Lw.xy - uCam.xy) * ((HALF * sg - uCam.z) / (Lw.z - uCam.z));
    float lk = dot(col, vec3(0.3, 0.5, 0.2)) * k;
    if (lk > lamp.z) lamp = vec3(lp, lk);
  }
  return c;
}
`;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 60);

// Straps swing about their pivot on the rail; the cabin's pull sets the angle.
const SWING_VERT = /* glsl */`
  attribute vec3 aPivot;
  attribute float aPhase;
  uniform float uSwing, uSway, uTime;
  varying vec3 vW, vN;
  void main() {
    float a = uSwing * (0.8 + 0.4 * aPhase) + sin(uTime * 1.9 + aPhase * 6.28) * 0.05 * uSway;
    mat2 r = mat2(cos(a), sin(a), -sin(a), cos(a));
    vec3 p = position - aPivot;
    p.xy = r * p.xy;
    vec3 n = normal;
    n.xy = r * n.xy;
    vW = p + aPivot;
    vN = n;
    gl_Position = projectionMatrix * viewMatrix * vec4(vW, 1.0);
  }`;
const PLAIN_VERT = /* glsl */`
  varying vec3 vW, vN;
  void main() {
    vec4 w = modelMatrix * vec4(position, 1.0);
    vW = w.xyz;
    vN = normalize(mat3(modelMatrix) * normal);
    gl_Position = projectionMatrix * viewMatrix * w;
  }`;

// Glass marks: grease, wipes, a print, scratches. Only the glass shader uses them.
const GLASS_FN = /* glsl */`
    // fbm that turns each octave, so no lattice shows.
    float fbm(vec2 p) {
      float s = 0.0, a = 0.5;
      for (int i = 0; i < DYN(5); i++) { s += a * vnoise(p); p = mat2(0.8, -0.6, 0.6, 0.8) * p * 2.03 + 1.7; a *= 0.5; }
      return s;
    }

    // Grease from hands: warped patches, after Train Ride's smudges.
    float smudges(vec2 p, float seed) {
      vec2 w = vec2(fbm(p * 2.5 + seed), fbm(p * 2.5 + seed + 5.2));
      return smoothstep(0.56, 0.8, fbm(p * 4.0 + w * 1.3 + seed * 1.7));
    }

    // A hand pressed flat on the glass: the heel of the palm and four fingertips.
    float handPrint(vec2 q, float seed) {
      if (hash1(seed + 9.1) < 0.5) return 0.0;
      vec2 h = vec2((hash1(seed + 3.3) - 0.5) * 0.5, (hash1(seed + 4.4) - 0.6) * 0.3);
      float a = (hash1(seed + 5.5) - 0.5) * 0.9;
      vec2 p = mat2(cos(a), sin(a), -sin(a), cos(a)) * (q - h);
      float m = smoothstep(1.0, 0.2, length(p / vec2(0.035, 0.04)));
      for (int i = 0; i < DYN(4); i++) {
        float fi = float(i);
        vec2 f = vec2(-0.03 + 0.02 * fi, 0.075 + 0.012 * sin(fi * 1.9));
        m = max(m, smoothstep(1.0, 0.25, length((p - f) / vec2(0.008, 0.011))));
      }
      // Skin oil is patchy at the millimetre scale.
      vec2 g = p * 300.0;
      return m * (0.6 + 0.4 * mix(0.5, vnoise(g), sharp(g)));
    }

    // Cloth wipes: arcs swept about an elbow below the pane.
    // Returns the grease; str is the fibre-line strength, t the line direction.
    float wipes(vec2 q, float seed, out float str, out vec2 t) {
      float m = 0.0;
      str = 0.0;
      t = vec2(1.0, 0.0);
      // The pixel's footprint, taken outside the loop: a derivative inside forces an unroll.
      float fq = length(fwidth(q));
      for (int i = 0; i < DYN(3); i++) {
        float s = seed + float(i) * 7.31;
        if (hash1(s + 0.7) < 0.3) continue;
        vec2 c = vec2((hash1(s) - 0.5) * 1.4, -0.45 - 0.5 * hash1(s + 1.1));
        float R = 0.55 + 0.45 * hash1(s + 2.3), w = 0.05 + 0.09 * hash1(s + 3.7);
        vec2 d = q - c;
        float r = length(d), ang = atan(d.y, d.x);
        float a0 = 0.8 + 0.9 * hash1(s + 4.9), span = 0.4 + 0.8 * hash1(s + 6.1);
        // The band's edges are ragged, and it thins where the cloth lifted.
        float rag = (vnoise(vec2(ang * 9.0, s)) - 0.5) * 0.05;
        float across = smoothstep(w, w * 0.4, abs(r - R + rag));
        float along = smoothstep(a0, a0 + 0.2, ang) * smoothstep(a0 + span, a0 + span - 0.3, ang);
        float k = across * along * (0.35 + 0.65 * vnoise(vec2(ang * 4.0, s + 3.0)));
        if (k <= m) continue;
        // Fibre lines: fast across the radius, slow along the arc.
        vec2 g = vec2((r - R) * 320.0, ang * R * 6.0 + s);
        m = k;
        // Two scales of noise space the lines unevenly, as cloth fibres do.
        float fib = vnoise(g) * 0.6 + vnoise(g * vec2(2.7, 1.3) + 3.1) * 0.4;
        // g changes 320 per metre across the arc and 6R/r along it.
        float sh = clamp(1.5 - 1.2 * fq * length(vec2(320.0, 6.0 * R / max(r, 0.05))), 0.0, 1.0);
        str = k * smoothstep(0.58, 0.82, mix(0.5, fib, sh));
        t = vec2(-d.y, d.x) / max(r, 1e-4);
      }
      return m;
    }

    // Hairline scratches, cleaning swirls and wipe fibres, after Train Ride.
    // Each line glints where it lies across the line to the lamp.
    vec3 marks(vec2 p, vec2 q, float seed, vec3 lp, float str, vec2 wt) {
      float fw = max(fwidth(p.x), 1e-6);
      vec3 lc = vec3(1.0, 0.82, 0.6) * lp.z;
      vec2 r = p - lp.xy;
      float dist = length(r);
      vec2 rn = r / max(dist, 1e-4);
      // Away from a lamp the marks stay all but invisible.
      vec3 amb = vec3(1.0, 0.8, 0.6) * 0.0015;
      vec3 s = vec3(0.0);
      for (int l = 0; l < DYN(3); l++) {
        float cs = l == 0 ? 0.006 : l == 1 ? 0.011 : 0.024;
        vec2 g = p / cs + float(l) * 17.3 + seed;
        // The cell id wraps at 512, so the hash keeps its precision.
        vec2 id = mod(floor(g), 512.0), f = fract(g) - 0.5;
        if (hash2(id + 3.1) > (l == 2 ? 0.12 : 0.3)) continue;
        float a = hash2(id) * 3.14159;
        vec2 t = vec2(cos(a), sin(a));
        float along = dot(f, t), across = dot(f, vec2(-t.y, t.x));
        // Long scratches bow a little.
        across += along * along * (hash2(id + 7.7) - 0.5) * 0.5;
        float w = fw / cs * (l == 2 ? 1.5 : 1.1);
        float line = smoothstep(w, 0.0, abs(across)) * smoothstep(0.5, 0.2, abs(along)) * (0.35 + 0.65 * hash2(id + 1.3));
        float al = dot(rn, t);
        s += line * (amb * (l == 2 ? 0.55 : 0.3) + lc * exp(-al * al * 90.0) * exp(-dist / 0.15) * 0.5);
      }
      // Cleaning swirls: broken arcs round one centre per pane, left by a cloth.
      vec2 sc = q - vec2(hash1(seed + 11.0) - 0.5, hash1(seed + 12.0) - 0.5) * vec2(0.8, 0.4);
      float rr = length(sc), ring = floor(rr / 0.005);
      float seg = floor((atan(sc.y, sc.x) + 3.14159) * 5.0 + hash1(ring * 1.3 + seed) * 9.0);
      if (hash1(ring * 3.1 + seg * 7.7 + seed) < 0.16) {
        float arc = smoothstep(fw / 0.005 * 1.2, 0.0, abs(fract(rr / 0.005) - 0.5)) * smoothstep(0.22, 0.02, rr);
        float al = dot(rn, vec2(-sc.y, sc.x) / max(rr, 1e-4));
        s += arc * (amb * 0.18 + lc * exp(-al * al * 60.0) * exp(-dist / 0.2) * 0.35);
      }
      // Wipe fibres: long curved lines that light up across the lamp's line.
      float al = dot(rn, wt);
      s += str * lc * exp(-al * al * 30.0) * exp(-dist / 0.35) * 0.25;
      return s;
    }
`;

// Every surface shares one shader; kind picks the detail of each part.
const KIND = { plain: 0, wall: 1, floor: 2, roof: 3, seat: 4, end: 5, grille: 6, ticket: 7 };
// spec is [strength, Blinn-style shine]; the shine maps to GGX roughness in the shader.
function mat(albedo, kind = 'plain', { side = 0, spec = [0, 0], vert = PLAIN_VERT, metal = 0 } = {}) {
  return new THREE.ShaderMaterial({
    uniforms: { ...U, uAlb: { value: new THREE.Color(...albedo) }, uKind: { value: KIND[kind] }, uSide: { value: side }, uSpec: { value: new THREE.Vector2(...spec) }, uMetal: { value: metal } },
    vertexShader: vert,
    fragmentShader: /* glsl */`
    uniform vec3 uAlb;
    uniform float uKind, uSide, uMetal;
    uniform vec2 uSpec;
    varying vec3 vW, vN;
    ${GLSL_BASE}
    ${GLSL_LIGHT}

    // The ad strip over the windows: backlit cards with blocks of art and lines of copy.
    vec3 adCard(vec2 p, float id) {
      float h = hash1(id * 7.1 + 3.0);
      vec3 base = h < 0.25 ? vec3(0.1, 0.35, 0.38) : h < 0.5 ? vec3(0.6, 0.38, 0.08) : h < 0.75 ? vec3(0.45, 0.1, 0.3) : vec3(0.22, 0.25, 0.32);
      vec3 c = base * 0.5;
      // The art block sits on one side.
      float left = step(0.5, hash1(id + 1.3));
      vec2 q = vec2(mix(p.x, 1.0 - p.x, left), p.y);
      c = mix(c, base * 1.6 + 0.1, band(q.x, 0.06, 0.36, 0.01) * band(q.y, 0.15, 0.85, 0.02));
      // The copy: three pale lines of different length.
      for (int i = 0; i < DYN(3); i++) {
        float y = 0.72 - float(i) * 0.2;
        float len = 0.25 + 0.3 * hash1(id * 3.0 + float(i));
        c = mix(c, vec3(0.85), band(q.y, y - 0.04, y + 0.04, 0.01) * band(q.x, 0.45, 0.45 + len, 0.01) * (i == 0 ? 1.0 : 0.6));
      }
      return c;
    }

    void main() {
      vec3 P = vW, N = normalize(vN);
      vec3 V = normalize(uCam - P);
      vec3 alb = uAlb, emit = vec3(0.0);
      float ks = uSpec.x, shin = uSpec.y, ao = 1.0, metal = uMetal;

      if (uKind == 1.0) {
        // ---- Side wall ----
        float ax = abs(P.x);
        bool door = ax > 3.98 && ax < 5.42;
        // Openings: the glass is its own material, so the wall leaves them open.
        float sd = 1e3;
        for (int w = 0; w < DYN(NW); w++) {
          vec4 o = uWin[w];
          sd = min(sd, sdBox(P.xy, vec2(o.x + o.y, o.z + o.w) * 0.5, vec2(o.y - o.x, o.w - o.z) * 0.5, 0.07));
        }
        // A round sticker on each door pane: a red ring round a pale field and a hand.
        float stk = 1.0;
        if (door) stk = length(vec2(abs(ax - 4.36) < 0.35 ? ax - 4.36 : ax - 5.04, P.y - 1.12)) - 0.055;
        bool sticker = sd < 0.0 && stk < 0.0;
        // The glass shows through; the wall keeps only the door stickers there.
        if (sd < 0.0 && !sticker) discard;
        if (sticker) {
          vec2 q = vec2(abs(ax - 4.36) < 0.35 ? ax - 4.36 : ax - 5.04, P.y - 1.12);
          alb = stk > -0.012 ? vec3(0.6, 0.04, 0.03) : vec3(0.75, 0.72, 0.66);
          // The hand: a palm and four fingers in dark grey.
          float palm = sdBox(q, vec2(0.0, -0.012), vec2(0.016, 0.014), 0.006);
          float fing = sdBox(vec2(abs(q.x + 0.001) - 0.0, q.y), vec2(0.0, 0.016), vec2(0.014, 0.016), 0.005);
          if (min(palm, fing) < 0.0 && stk < -0.012) alb = vec3(0.08);
          // A slash crosses the hand.
          if (abs(q.x + q.y) * 0.7071 < 0.005 && stk < -0.008) alb = vec3(0.6, 0.04, 0.03);
          ks = 0.5; shin = 50.0;
        }
        else if (sd < 0.028) { alb = vec3(0.02); ks = 0.3; shin = 20.0; }
        else if (sd < 0.07) {
          // An aluminium frame with a bevel that turns toward the opening.
          alb = vec3(0.5, 0.5, 0.52); ks = 0.8; shin = 40.0; metal = 1.0;
        } else if (sd < 0.1) ao = 0.6 + 4.0 * (sd - 0.07);
        if (sd >= 0.07) {
          if (door && P.y < 2.0) {
            // Door leaves: a centre seam and rubber edges.
            alb = vec3(0.3, 0.32, 0.36); ks = 0.25; shin = 30.0;
            float seam = min(abs(ax - 4.7), min(abs(ax - 3.99), abs(ax - 5.41)));
            if (seam < 0.016) { alb = vec3(0.015); ks = 0.0; }
            // A yellow warning band runs along each leading edge.
            else if (abs(ax - 4.7) < 0.05) alb = vec3(0.7, 0.5, 0.04);
          } else if (door) {
            // The route strip over the door: a line of stops, one blinking.
            alb = vec3(0.03); ks = 0.4; shin = 30.0;
            float u = (ax - 4.0) / 1.4;
            float line = band(P.y, 2.1, 2.12, 0.004) * band(u, 0.05, 0.95, 0.01);
            emit += vec3(0.9, 0.4, 0.05) * line * 0.25;
            float stop = fract(u * 9.0), sid = floor(u * 9.0);
            float pip = smoothstep(0.012, 0.006, length(vec2((stop - 0.5) / 9.0 * 1.4, P.y - 2.11))) * band(u, 0.0, 1.0, 0.001);
            float here = sid == 5.0 ? step(0.5, fract(uTime * 1.2)) * 2.5 : 0.5;
            emit += vec3(1.0, 0.85, 0.6) * pip * here * 0.3;
          } else if (P.y > 1.9 && P.y < 2.2) {
            // Backlit cards sit in a strip between the windows and the roof.
            float cw = 1.15, cid = floor(P.x / cw + 0.5);
            vec2 p = vec2(fract(P.x / cw + 0.5), (P.y - 1.9) / 0.3);
            float edge = min(min(p.x, 1.0 - p.x) * cw, min(p.y, 1.0 - p.y) * 0.3);
            if (edge < 0.02) { alb = vec3(0.04); ks = 0.5; shin = 30.0; }
            else { alb = adCard(p, cid + uSide * 17.0) * 0.4; emit += adCard(p, cid + uSide * 17.0) * 0.045; ks = 0.6; shin = 60.0; }
          } else if (P.y >= 2.2) { alb = vec3(0.2); ao = 0.5; }
          else {
            // Panels: a dado rail at the seat back and seams at each pier.
            float dado = band(P.y, 0.97, 1.0, 0.004);
            float pier = min(abs(ax - 1.2), abs(ax - 3.6));
            alb = mix(alb, vec3(0.62, 0.62, 0.64), dado);
            ks = mix(0.15, 0.8, dado); shin = mix(16.0, 40.0, dado);
            if (pier < 0.005 && P.y > 1.0) alb *= 0.35;
            if (P.y < 0.97) alb *= 0.45;
            // Scuffs gather low on the panels.
            alb *= 1.0 - 0.25 * smoothstep(0.55, 0.85, vnoise(P.xy * vec2(3.0, 9.0))) * smoothstep(1.4, 1.0, P.y);
            // The wall meets the floor and the seat back in a soft shadow.
            ao *= 1.0 - 0.5 * exp(-P.y / 0.1);
            // A door button sits on the pier beside each door, its ring lit green.
            vec2 bq = vec2(ax - 3.87, P.y - 1.15);
            float plate = sdBox(bq, vec2(0.0), vec2(0.045, 0.075), 0.012);
            if (plate < 0.0) {
              alb = vec3(0.12, 0.12, 0.13); ks = 0.5; shin = 40.0;
              float r = length(bq - vec2(0.0, 0.015));
              if (r < 0.026) { alb = vec3(0.55); ks = 0.8; }
              emit += vec3(0.2, 1.0, 0.45) * smoothstep(0.004, 0.0, abs(r - 0.029)) * 0.6;
            }
          }
        }
      } else if (uKind == 2.0) {
        // ---- Floor ----
        float ax = abs(P.x), az = abs(P.z);
        bool door = ax > 3.98 && ax < 5.42;
        // Studded rubber; the studs fade out where they turn sub-pixel.
        vec2 g = P.xz / 0.055;
        vec2 f = fract(g) - 0.5;
        float stud = smoothstep(0.3, 0.22, length(f)) * sharp(g);
        alb *= 0.85 + 0.3 * vnoise(P.xz * 60.0);
        alb *= 1.0 + 0.25 * stud;
        N = normalize(N + vec3(f.x, 0.0, f.y) * stud * 1.6);
        // The aisle is polished by feet and catches the light.
        float wear = smoothstep(0.75, 0.15, az) * (0.6 + 0.4 * vnoise(P.xz * vec2(0.8, 3.0)));
        alb *= 1.0 + 0.2 * wear;
        ks = 0.12 + 0.35 * wear; shin = 24.0;
        // Panel joints cross the floor.
        if (abs(fract(P.x / 2.4 + 0.5) - 0.5) * 2.4 < 0.006) alb *= 0.4;
        if (door && az > 1.16) {
          // A grooved aluminium threshold at each door.
          vec2 gg = vec2(P.z / 0.014, 0.0);
          alb = vec3(0.42, 0.42, 0.44) * (0.75 + 0.25 * mix(0.5, step(0.5, fract(gg.x)), sharp(gg)));
          ks = 0.9; shin = 30.0;
        } else if (door && az > 0.98) {
          // Yellow tactile dots warn of the door edge.
          vec2 gd = P.xz / 0.04;
          float dots = smoothstep(0.3, 0.2, length(fract(gd) - 0.5)) * sharp(gd);
          alb = vec3(0.72, 0.52, 0.04) * (0.85 + 0.25 * dots);
          ks = 0.3; shin = 20.0;
        }
        // Contact shadows at the walls, under the benches and round each pole.
        ao *= 1.0 - 0.6 * exp(-(HALF - az) / 0.08);
        if (ax < ${BENCH.toFixed(2)}) ao *= 1.0 - 0.75 * smoothstep(0.92, 1.04, az);
        ${POLES.map(([x, z]) => `ao *= 1.0 - 0.5 * exp(-length(P.xz - vec2(${x.toFixed(2)}, ${z.toFixed(2)})) / 0.05);`).join('\n        ')}
      } else if (uKind == 3.0) {
        // ---- Roof ----
        float az = abs(P.z);
        // Two diffuser strips glow dim and warm.
        if (abs(az - 0.55) < 0.11) {
          float cell = abs(fract(P.x / 1.6) - 0.5) * 1.6;
          gl_FragColor = vec4(vec3(1.0, 0.8, 0.58) * (cell < 0.01 ? 0.03 : 0.14), 1.0);
          return;
        }
        // A slotted vent runs down the middle.
        if (az < 0.16) alb *= az > 0.14 ? 0.3 : 0.5 + 0.5 * mix(0.5, step(0.5, fract(P.x / 0.05)), sharp(vec2(P.x / 0.05, 0.0)));
        if (abs(fract(P.x / 1.6) - 0.5) * 1.6 < 0.004) alb *= 0.4;
        ao *= 1.0 - 0.6 * exp(-(HALF - az) / 0.12);
      } else if (uKind == 4.0) {
        // ---- Seats ----
        // Moquette: a dense diamond weave in deep blue with ochre and red flecks.
        vec2 uv = abs(N.y) > 0.5 ? P.xz : P.xy;
        vec2 g = uv * 34.0;
        vec2 c = floor(g), f = fract(g) - 0.5;
        float h = hash2(c);
        vec3 acc = h < 0.4 ? vec3(0.6, 0.36, 0.06) : h < 0.7 ? vec3(0.5, 0.06, 0.1) : vec3(0.1, 0.36, 0.38);
        float dia = smoothstep(0.34, 0.26, abs(f.x) + abs(f.y)) * step(0.5, hash2(c + 3.1));
        vec3 base = vec3(0.06, 0.08, 0.24);
        vec3 pat = mix(base, acc, dia) * (0.85 + 0.3 * vnoise(uv * 140.0));
        alb = mix(base * 1.25 + acc * 0.12, pat, sharp(g));
        // Each seat is its own cushion; the seams dip and darken.
        float sw = ${(BENCH * 2 / SEATS).toFixed(4)};
        float q = fract((P.x + ${BENCH.toFixed(2)}) / sw);
        float m = min(q, 1.0 - q) * sw;
        alb *= 0.3 + 0.7 * smoothstep(0.0, 0.035, m);
        if (abs(N.x) < 0.5) N = normalize(N + vec3(sign(q - 0.5) * (1.0 - smoothstep(0.0, 0.06, m)) * 0.8, 0.0, 0.0));
        ks = 0.05; shin = 8.0;
      } else if (uKind == 5.0) {
        // ---- End wall: the gangway door and its window ----
        float az = abs(P.z);
        if (az < 0.42 && P.y < 1.95) {
          float wsd = sdBox(vec2(P.z, P.y), vec2(0.0, 1.38), vec2(0.24, 0.34), 0.06);
          if (wsd < 0.0) {
            // The next car shows dim and warm through the glass.
            gl_FragColor = vec4(vec3(1.0, 0.8, 0.6) * (0.02 + 0.03 * smoothstep(1.1, 1.6, P.y)), 1.0);
            return;
          }
          alb = wsd < 0.025 ? vec3(0.02) : vec3(0.3, 0.32, 0.36);
          ks = 0.3; shin = 30.0;
          if (abs(az - 0.42) < 0.015 || abs(P.y - 1.95) < 0.015) alb = vec3(0.02);
        }
        ao *= 1.0 - 0.5 * exp(-P.y / 0.1);
      } else if (uKind == 7.0) {
        // ---- Ticket: a magenta band and a dark stripe on the back ----
        vec2 tq = vec2(dot(P.xz - vec2(4.0, 0.1), vec2(cos(0.5), -sin(0.5))), dot(P.xz - vec2(4.0, 0.1), vec2(sin(0.5), cos(0.5))));
        if (tq.x < -0.02) alb = vec3(0.55, 0.1, 0.35);
        if (abs(tq.y + 0.012) < 0.004) alb = vec3(0.05);
        // A corner is folded up and catches less light.
        if (tq.x + tq.y > 0.05) alb *= 0.6;
        ao = 0.85;
      } else if (uKind == 6.0) {
        // ---- Heater grille under each bench ----
        float y = P.y / 0.028;
        alb *= 0.4 + 0.6 * mix(0.5, step(0.45, fract(y)), sharp(vec2(y, 0.0)));
        ao = 0.6;
      }

      // Roughness: the shine sets the base; grime and wear roughen it per pixel.
      float rough = sqrt(2.0 / (shin + 2.0));
      rough = clamp(rough + 0.12 * (vnoise(P.xy * 7.0 + P.z * 5.0) - 0.5), 0.05, 1.0);
      // Dielectrics reflect 4% at normal incidence, scaled by strength; metals tint with albedo.
      vec3 F0 = mix(vec3(0.48 * ks), alb * ks, metal);
      vec3 dif, spe;
      tunnelLight(P, N, V, rough, F0, dif, spe);
      vec3 col = alb * (1.0 - metal) * (cabinLight(P, N) * ao + dif) + spe + emit;
      gl_FragColor = vec4(col, 1.0);
    }`,
  });
}

add(new THREE.PlaneGeometry(LEN, HALF * 2).rotateX(-Math.PI / 2), mat(FLOOR, 'floor'));

add(new THREE.PlaneGeometry(LEN, ROOF).translate(0, ROOF / 2, 0).rotateY(Math.PI), mat(WALLC, 'wall', { side: 1 }), 0, 0, HALF);

      float sd = 1e3, pid = 0.0;

      for (int w = 0; w < DYN(NW); w++) {
        vec4 o = uWin[w];

        float s = sdBox(P.xy, b.xy, b.zw, 0.07);
        if (s < sd) { sd = s; pid = float(w); pane = b; }

    }`,

}
for (const sg of [-1, 1]) {
  const g = mergeGeometries(WIN.map(([x0, x1, y0, y1]) => new THREE.PlaneGeometry(x1 - x0, y1 - y0).translate((x0 + x1) / 2, (y0 + y1) / 2, 0)));
  // The near wall's quads turn to face into the cabin; the openings are symmetric in x.
  if (sg > 0) g.rotateY(Math.PI);
  add(g, glassMat(sg), 0, 0, sg * (HALF + 0.004));
}
const endM = mat(WALLC, 'end', { spec: [0.15, 16] });
add(new THREE.PlaneGeometry(HALF * 2, ROOF).translate(0, ROOF / 2, 0).rotateY(Math.PI / 2), endM, -LEN / 2, 0, 0);
add(new THREE.PlaneGeometry(HALF * 2, ROOF).translate(0, ROOF / 2, 0).rotateY(-Math.PI / 2), endM, LEN / 2, 0, 0);
// Benches run along both walls between the doors.
const seatM = mat(SEAT, 'seat'), grilleM = mat(BASE, 'grille');
const poleM = mat(POLE, 'plain', { spec: [0.9, 36], metal: 1 }), steelM = mat([0.5, 0.5, 0.52], 'plain', { spec: [0.9, 40], metal: 1 });
for (const sg of [-1, 1]) {
  add(new THREE.BoxGeometry(BENCH * 2, 0.1, 0.45), seatM, 0, 0.41, sg * (HALF - 0.225));
  add(new THREE.BoxGeometry(BENCH * 2, 0.36, 0.36), grilleM, 0, 0.18, sg * (HALF - 0.2));
  add(new THREE.BoxGeometry(BENCH * 2, 0.5, 0.08), seatM, 0, 0.71, sg * (HALF - 0.07));
  // A grab rail runs above each bench.
  add(new THREE.CylinderGeometry(R, R, BENCH * 2, 24).rotateZ(Math.PI / 2), poleM, 0, 1.9, sg * 0.78);
  // Each bench end has a screen frame: two tubes from the wall to the pole.
  for (const xe of [-BENCH - 0.15, BENCH + 0.15]) {
    for (const y of [0.92, 1.45]) add(new THREE.CylinderGeometry(0.016, 0.016, 0.5, 8).rotateX(Math.PI / 2), poleM, xe, y, sg * (HALF - 0.25));
    add(new THREE.CylinderGeometry(0.016, 0.016, 0.53, 8), poleM, xe, 1.185, sg * (HALF - 0.02));
  }
}
for (const [x, z] of POLES) {
  add(new THREE.CylinderGeometry(R, R, ROOF, 28), poleM, x, ROOF / 2, z);
  // Steel collars hold each pole at the floor and the roof.
  add(new THREE.CylinderGeometry(0.034, 0.04, 0.05, 14), steelM, x, 0.025, z);
  add(new THREE.CylinderGeometry(0.04, 0.034, 0.05, 14), steelM, x, ROOF - 0.025, z);
}
// Someone left a folded umbrella against the bench-end screen.
{
  const g = new THREE.Group();
  const cloth = mat([0.36, 0.04, 0.06], 'plain', { spec: [0.35, 30] }), dark = mat([0.05, 0.04, 0.035], 'plain', { spec: [0.6, 40] });
  const part = (geo, m, y) => { const o = new THREE.Mesh(geo, m); o.position.y = y; g.add(o); };
  part(new THREE.CylinderGeometry(0.004, 0.004, 0.86, 8), steelM, 0.43);
  // The folded canopy tapers to the tip and bulges near the strap.
  part(new THREE.LatheGeometry([[0.004, 0], [0.02, 0.1], [0.036, 0.42], [0.03, 0.56], [0.008, 0.62]].map(([r, y]) => new THREE.Vector2(r, y)), 18), cloth, 0.06);
  part(new THREE.TorusGeometry(0.036, 0.009, 8, 20, Math.PI), dark, 0.86);
  g.children[2].position.x = 0.036;
  g.position.set(3.68, 0.0, 0.93);
  g.rotation.set(0.12, -0.6, 0.2);
  scene.add(g);
}
// A used ticket lies face up on the floor by the door.
{
  const t = new THREE.Mesh(new THREE.PlaneGeometry(0.086, 0.054).rotateX(-Math.PI / 2), mat([0.78, 0.74, 0.62], 'ticket', { spec: [0.2, 20] }));
  t.position.set(4.0, 0.003, 0.1);
  t.rotation.y = 0.5;
  scene.add(t);
}
// Hand straps hang from both rails; one merged mesh swings them all.
{
  const parts = [];
  let i = 0;
  for (const sg of [-1, 1]) {
    for (let x = -BENCH + 0.3; x <= BENCH - 0.2; x += 0.55, i++) {
      // Near-side straps by the camera would fill the frame.
      if (sg > 0 && x < 1.2) continue;
      const z = sg * 0.78, ph = (Math.sin(i * 12.9898) * 43758.5453) % 1;
      const strap = new THREE.BoxGeometry(0.024, 0.2, 0.008).translate(x, 1.78, z);
      const ring = new THREE.TorusGeometry(0.055, 0.009, 12, 40).translate(x, 1.625, z);
      for (const g of [strap, ring]) {
        const n = g.attributes.position.count;
        g.setAttribute('aPivot', new THREE.Float32BufferAttribute(new Array(n).fill([x, 1.89, z]).flat(), 3));
        g.setAttribute('aPhase', new THREE.Float32BufferAttribute(new Array(n).fill(Math.abs(ph)), 1));
        parts.push(g);
      }
    }
  }
  add(mergeGeometries(parts), mat([0.13, 0.13, 0.14], 'plain', { spec: [0.4, 30], vert: SWING_VERT }));
}

/* ---------- framing ---------- */
// Still, tight shots with long lenses: camera, target, roll and horizontal fov.
const SHOTS = {
  straps: { pos: [-2.2, 1.25, 0.35], at: [0.6, 1.72, -0.9], roll: -10, hfov: 32 },
  seats: { pos: [-3.3, 0.44, -0.45], at: [2.0, 0.5, -1.25], roll: 6, hfov: 34 },
  window: { pos: [-0.3, 1.42, 0.55], at: [0.95, 1.5, -1.4], roll: -5, hfov: 36 },
  door: { pos: [3.15, 1.3, 1.0], at: [4.72, 1.5, -1.4], roll: 6, hfov: 36 },
  floor: { pos: [4.95, 0.32, -1.05], at: [3.2, 0.02, 0.55], roll: -8, hfov: 42 },
};
let shot = SHOTS.straps, view = [1, 1];
function frame(w = view[0], h = view[1]) {
  view = [w, h];
  const a = w / h;
  // Portrait keeps most of the landscape width in view.
  const hf = THREE.MathUtils.degToRad(shot.hfov * (a < 1 ? 0.8 : 1));
  camera.aspect = a;
  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(hf / 2) / a));
  camera.position.set(...shot.pos);
  camera.up.set(0, 1, 0);
  camera.lookAt(...shot.at);
  camera.rotateZ(THREE.MathUtils.degToRad(shot.roll));
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  U.uCam.value.copy(camera.position);
}

/* ---------- motion ---------- */
let time = 0, travel = 0, speed = 0, last = 0, target = 12, brake = false, mk = 1;
let swing = 0, swingV = 0;
// Each wheelset kicks the carriage as it crosses a rail joint.
// The pairs sit 2.6 m apart; the far bogie kicks softer.
const JOINT = 18, KICK = [[0, 1], [2.6, 1], [13, 0.45], [15.6, 0.45]];
function jolt() {
  if (speed < 0.5) return 0;
  let y = 0;
  for (const [b, wt] of KICK) {
    const t = ((((travel - b) % JOINT) + JOINT) % JOINT) / speed;
    y += wt * Math.exp(-t / 0.09) * Math.sin(t * 55);
  }
  return y * Math.min(1, speed / 20);
}
function update(dt, pace) {
  // The train eases to cruise, brakes on a hold, and stops when idle.
  const goal = brake ? 0 : target * pace;
  speed += (goal - speed) * Math.min(1, dt * (goal < speed ? 0.9 : 0.6));
  if (goal === 0 && speed < 0.05) speed = 0;
  travel = (travel + speed * dt) % WRAP;
  time += dt;
  mk = Math.min(1, mk + dt * 1.5);
  const j = jolt();
  // The straps are pendulums: a change of speed swings them, a joint kicks them.
  if (dt > 0) {
    const acc = (speed - last) / dt;
    swingV += (-39 * swing - 1.4 * swingV - acc * 1.2 + j * 6) * dt;
    swing = Math.max(-0.6, Math.min(0.6, swing + swingV * dt));
  }
  last = speed;
  // The cabin bounces on the springs; the lamps outside do not.
  U.uJolt.value = -j * 0.012;
  U.uTravel.value = travel;
  U.uTime.value = time;
  U.uSmear.value = speed * SHUT;
  U.uSwing.value = swing;
  U.uSway.value = Math.min(1, speed / 20);
}
return {
  scene, camera, frame, update,
  get speed() { return speed; },
  get travel() { return travel; },
  setSpeed(v) { target = v; },
  setBrake(on) { brake = on; },
  lively: () => speed > 0.05 || mk < 1 || Math.abs(swingV) > 0.003 || Math.abs(swing) > 0.003 || (!brake && target > 0 && speed < target * 0.99),
  // A new shot is a hard cut.
  setShot(v) { shot = SHOTS[v] || SHOTS.straps; frame(); },
  post: { bloom: [0.22, 0.5, 0.92], tint: [0.0008, 0.0007, 0.0009], vig: 0.5, vigIn: 0.4, grain: 0.035 },
};
}

/* ---------- end scene ---------- */

const stage = document.getElementById('stage');
const canvas = document.createElement('canvas');
canvas.setAttribute('aria-hidden', 'true');
stage.prepend(canvas);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const S = build({ THREE });

/* Post chain: render, half-resolution bloom, grade, output. */
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(S.scene, S.camera));
const [bS, bR, bT] = S.post.bloom;
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), bS, bR, bT);
// The bloom runs at half resolution.
const bloomSize = bloom.setSize.bind(bloom);
bloom.setSize = (w, h) => bloomSize(Math.max(1, w / 2), Math.max(1, h / 2));
composer.addPass(bloom);

// The grade adds a tint, a vignette and fixed grain.
const grade = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null },
    uRes: { value: new THREE.Vector2(1, 1) },
    uTint: { value: new THREE.Vector3(...S.post.tint) },
    uVig: { value: S.post.vig },
    uVigIn: { value: S.post.vigIn },
    uGrain: { value: S.post.grain },
  },
  vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform sampler2D tDiffuse;
  uniform vec2 uRes;
  uniform vec3 uTint;
  uniform float uVig, uVigIn, uGrain;
  varying vec2 vUv;
  // Interleaved gradient noise: fine grain with no banding.
  float h(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
  void main() {
    vec3 c = texture2D(tDiffuse, vUv).rgb + uTint;
    float asp = uRes.x / uRes.y;
    vec2 q = (vUv - 0.5) * vec2(asp, 1.0);
    c *= 1.0 - uVig * smoothstep(uVigIn, 1.1, length(q));
    float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
    c *= 1.0 + (h(vUv * uRes) - 0.5) * uGrain * (0.6 + 0.4 * smoothstep(0.0, 0.3, lum)) * 2.0;
    gl_FragColor = vec4(max(c, 0.0), 1.0);
  }`,
});
composer.addPass(grade);
composer.addPass(new OutputPass());

/* ---------- size ---------- */
// Slow frames step down one rung: High to Standard, Standard to 1x.
const D = detail({ maxDpr: 2, budget: 2.6e6, onChange: () => resize(true) });
let size = { w: 1, h: 1, dpr: 1 };
function resize(force = false) {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  const dpr = D.dpr(w, h);
  if (!force && w === size.w && h === size.h && dpr === size.dpr) return;
  size = { w, h, dpr };
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
  grade.uniforms.uRes.value.set(w * dpr, h * dpr);
  S.frame(w, h);
  if (ready) draw();
}

/* ---------- sound ---------- */
// The bogies rumble, the tunnel roars, and each rail joint clacks.
const kit = audioKit({ gain: 0.6, noiseSeconds: 2 });
const JOINT = 18, BOGIE = [0, 2.6, 13, 15.6];
let V = null, joint = null;
function loopNoise(ac, type, f, q) {
  const src = ac.createBufferSource(); src.buffer = kit.noise; src.loop = true;
  const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = ac.createGain(); g.gain.value = 0;
  src.connect(fl).connect(g).connect(kit.out);
  src.start(0, Math.random() * kit.noise.duration);
  return { fl, g };
}
function voices() {
  const ac = kit.live();
  if (!ac || !kit.noise) return null;
  V ||= { roar: loopNoise(ac, 'bandpass', 420, 0.6), rumble: loopNoise(ac, 'lowpass', 150, 0.7) };
  return V;
}
function burst(ac, at, { f, q, dur, level, type = 'bandpass' }) {
  const src = ac.createBufferSource(); src.buffer = kit.noise;
  const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = ac.createGain();
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(level, at + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0005, at + dur);
  src.connect(fl).connect(g).connect(kit.out);
  src.start(at, Math.random() * (kit.noise.duration - dur - 0.05), dur + 0.02);
}
// One wheel on one joint: a click of steel and a low thump.
function clack(ac, at, level) {
  burst(ac, at, { f: 1100 + Math.random() * 500, q: 1.4, dur: 0.035, level: level * 0.35 });
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(95, at); o.frequency.exponentialRampToValueAtTime(48, at + 0.09);
  g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(level * 0.5, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0005, at + 0.12);
  o.connect(g).connect(kit.out);
  o.start(at); o.stop(at + 0.14);
}
function voice() {
  const v = voices();
  if (!v) return;
  const ac = kit.ac, now = ac.currentTime, sp = S.speed, k = Math.min(1, sp / 22);
  // The tunnel walls throw the noise back; the roar climbs with speed.
  v.roar.g.gain.setTargetAtTime(0.16 * Math.pow(k, 1.2), now, 0.25);
  v.roar.fl.frequency.setTargetAtTime(300 + 400 * k, now, 0.3);
  v.rumble.g.gain.setTargetAtTime(0.32 * Math.pow(k, 0.8), now, 0.2);
  v.rumble.fl.frequency.setTargetAtTime(110 + 90 * k, now, 0.3);
  // Each bogie wheel crosses the joint in turn; the gap shrinks with speed.
  const j = Math.floor(S.travel / JOINT);
  if (joint !== null && j !== joint && sp > 2) for (const b of BOGIE) clack(ac, now + b / sp, 0.25 + 0.5 * k);
  joint = j;
}
function hush() {
  if (!V || !kit.ac) return;
  const now = kit.ac.currentTime;
  V.roar.g.gain.setTargetAtTime(0, now, 0.15);
  V.rumble.g.gain.setTargetAtTime(0, now, 0.15);
}

/* ---------- loop ---------- */
// Full rate while the train moves, then sleep.
// QA can shorten the sleep with ?sleep=<ms>.
const SLEEP = +new URLSearchParams(location.search).get('sleep') || 60000;
let raf = 0, lastT = 0, lastInput = performance.now(), pace = reduced() ? 0 : 1, visible = true, ready = false;
function draw() { composer.render(); }
function loop(now) {
  raf = 0;
  if (!visible) return;
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000);
  lastT = now;
  // Ambient motion eases out over 2 s once idle; reduced motion keeps it off.
  const awake = !reduced() && now - lastInput < SLEEP;
  pace = awake ? Math.min(1, pace + dt / 2) : Math.max(0, pace - dt / 2);
  S.update(dt, pace);
  voice();
  draw();
  D.frame(dt);
  if (!S.lively()) { hush(); kit.rest(() => !raf); return; }
  raf = requestAnimationFrame(loop);
}
function wake() {
  lastInput = performance.now();
  if (ready && visible && !raf) { lastT = performance.now(); raf = requestAnimationFrame(loop); }
}

/* ---------- input ---------- */
// A hold brakes the train; a release lets it run on.
let press = null;
stage.addEventListener('pointerdown', e => {
  if (e.button > 0 || press) return;
  try { stage.setPointerCapture(e.pointerId); } catch { /* capture is optional */ }
  press = e.pointerId;
  S.setBrake(true);
  wake();
});
function endPress(e) {
  if (press !== e.pointerId) return;
  press = null;
  S.setBrake(false);
  wake();
}
stage.addEventListener('pointerup', endPress);
stage.addEventListener('pointercancel', endPress);

/* ---------- bar ---------- */
// The detail driver resizes on a new quality choice first.
onQuality(() => wake());
// Each shot cuts straight to its camera.
Object.assign(act, {
  shot: v => { opts.shot = v; save('shot', v); S.setShot(v); if (ready) draw(); wake(); },
  speed: v => { opts.speed = v; save('speed', v); S.setSpeed(cruise(v)); wake(); },
});
S.setShot(opts.shot);
S.setSpeed(cruise(opts.speed));

/* ---------- start ---------- */
onReducedChange(() => wake());
whenVisible(stage, v => {
  visible = v;
  if (v) { if (ready) draw(); wake(); } else { cancelAnimationFrame(raf); raf = 0; lastT = 0; hush(); }
});
new ResizeObserver(() => resize()).observe(stage);
// Compile first, then draw the first composed frame inside the intro.
(async () => {
  resize(true);
  if (renderer.extensions.has('KHR_parallel_shader_compile')) await renderer.compileAsync(S.scene, S.camera);
  else renderer.compile(S.scene, S.camera);
  draw();
  // One finished frame folds the shader work into the intro.
  renderer.getContext().finish();
  ready = true;
  markReady();
  requestAnimationFrame(() => canvas.classList.add('on'));
  wake();
})().catch(err => { console.error(err); stage.querySelector('.fail').hidden = false; markReady(); });
</script>
</body>
</html>
