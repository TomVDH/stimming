<style>
/* Layout: header row, the stage at full width, one chip row. */
:root {
  --bg: oklch(0.16 0.012 275);
  --surface: oklch(0.195 0.014 275);
  --line: oklch(0.29 0.016 275);
  --fg: oklch(0.94 0.008 275);
  --muted: oklch(0.64 0.02 275);
  --focus: oklch(0.84 0.13 205);
  --pick: oklch(0.7 0.18 320 / 0.35);

  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  -webkit-font-smoothing: antialiased;

}

.wrap { max-width: 1160px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: clamp(20px, 3.4vw, 40px); }

h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.tools { display: flex; align-items: center; gap: 8px; }
.home { font-size: 14px; color: var(--muted); text-decoration: none; border-radius: 4px; transition: color 0.2s ease; }
.home:hover { color: var(--fg); }
/* The sound toggle sits as quietly as the home link. */
.snd {
  display: grid; place-items: center; width: 28px; height: 28px; margin-block: -4px; padding: 0;
  color: var(--muted); background: none; border: 0; border-radius: 6px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: color 0.2s ease;

.snd[aria-pressed="true"] .off, .snd[aria-pressed="false"] .on { display: none; }
@media (pointer: coarse) { .snd { width: 40px; height: 40px; margin-block: -10px; } }
main { display: grid; gap: 14px; min-width: 0; }
/* The stage is 16:9, 4:5 on phones, and a dark gradient. */
.stage {
  position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: max(320px, calc(100svh - 176px));
  border-radius: 18px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 44%, oklch(0.2 0.03 330), var(--stage) 60%, oklch(0.11 0.012 300));

}
.stage:focus-visible { outline-offset: 3px; }
@media (max-width: 640px) { .stage { aspect-ratio: 4 / 5; } }

.fail {
  position: absolute; inset: 0; margin: 0; padding: 16px; display: grid; place-items: center; text-align: center;
  font-size: 14px; color: oklch(0.64 0.02 275);

  font: inherit; font-size: 13px; color: var(--muted);

<div class="wrap">
  <header>
    <h1>Ribbon</h1>
    <div class="tools">
      <button class="snd" id="snd" type="button" aria-label="Sound" aria-pressed="true">

          <path class="off" d="M13.2 8l4 4M17.2 8l-4 4"/>
        </svg>

      <a class="home" href="../index.html">Stimming</a>
    </div>
  </header>
  <main>
    <div class="stage" id="stage" tabindex="0" role="application" aria-label="A long silk ribbon that follows you. Move or drag to lead it, flick to crack it and hold still to make it spiral; arrow keys lead it and Space performs a flourish.">
      <canvas aria-hidden="true"></canvas>

    </div>
    <div class="foot">

        <button class="chip" type="button" data-pal="ocean" aria-pressed="false"><span class="sw" style="background: linear-gradient(90deg, oklch(0.5 0.18 278), oklch(0.68 0.15 228), oklch(0.88 0.11 170))" aria-hidden="true"></span>Ocean</button>
        <button class="chip" type="button" data-pal="prism" aria-pressed="false"><span class="sw" style="background: linear-gradient(90deg, oklch(0.65 0.22 25), oklch(0.85 0.17 95), oklch(0.8 0.18 155), oklch(0.68 0.15 240), oklch(0.62 0.22 315))" aria-hidden="true"></span>Prism</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt><span class="fine">Move</span><span class="touch">Drag</span></dt><dd>lead</dd></div>
        <div><dt>Flick</dt><dd>crack</dd></div>
        <div><dt>Hold still</dt><dd>spiral</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>flourish</dd></div>
      </dl>
    </div>
  </main>
</div>

<script type="module">

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
function lin(L, C, h) {

    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,

// Five stops run from the stick end to the tip.
// Unwrapped hues make each gradient turn the intended way.
// The back face is deeper and sits further round the hue wheel.
const PALS = {
  sunset: {
    stops: [[0.5, 0.2, 345], [0.62, 0.22, 374], [0.72, 0.2, 402], [0.8, 0.17, 428], [0.86, 0.16, 452]],
    turn: 14, iri: 0.25, bg: [[0.2, 0.034, 338], [0.148, 0.022, 322], [0.1, 0.012, 300]],
  },
  ocean: {
    stops: [[0.42, 0.18, 284], [0.54, 0.18, 260], [0.66, 0.15, 230], [0.76, 0.14, 198], [0.83, 0.14, 170]],
    turn: -16, iri: 0.25, bg: [[0.2, 0.034, 248], [0.148, 0.022, 254], [0.1, 0.012, 266]],
  },
  prism: {
    stops: [[0.63, 0.23, 22], [0.82, 0.17, 88], [0.8, 0.2, 150], [0.66, 0.16, 238], [0.58, 0.24, 318]],
    turn: 40, iri: 1, bg: [[0.2, 0.028, 296], [0.148, 0.018, 290], [0.1, 0.01, 280]],
  },

const bgOf = pal => pal.bg.map(c => linear(...c));
const KEY = unit([-0.45, 0.78, 0.55]), RIM = unit([0.78, 0.2, -0.6]), FILL = unit([0.6, -0.45, 0.66]);
const FILLC = linear(0.88, 0.04, 330).map(v => v * 0.6);
const KEYC = linear(0.98, 0.025, 85).map(v => v * 2.1), RIMC = linear(0.92, 0.04, 300).map(v => v * 1.5);
const SKYC = linear(0.62, 0.05, 285).map(v => v * 0.46), GNDC = linear(0.42, 0.05, 25).map(v => v * 0.28);

/* ---------- sound: synthesised, started by the first gesture ---------- */
const SKEY = 'stimming.ribbon.sound', MAXV = 14, LEAD = 0.004;
let soundOn = true;
try { soundOn = localStorage.getItem(SKEY) !== '0'; } catch (err) { /* storage is optional */ }
let ac = null, out = null, noise = null, askedAt = -1e9, voices = 0, crackNext = 0, sheenNext = 0, restT = 0, sw = null;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.08 * voices);

function audio() {

    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (err) { return; }

    comp.attack.value = 0.002; comp.release.value = 0.12;

    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);

    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  if (!visible) { ac.suspend()?.catch(() => {}); return; }
  if (ac.state !== 'running') { askedAt = performance.now(); ac.resume()?.catch(() => {}); }
}
// A context still waking queues sounds for a moment.
function live() {
  if (!soundOn || !ac || ac.state === 'closed') return null;
  return ac.state === 'running' || performance.now() - askedAt < 250 ? ac : null;
}
function track(src, ...tails) {
  voices++;

// Once the ribbon rests, the context sleeps until the next gesture.
function rest() {

  if (!soundOn || (e.type === 'keydown' && !GESTURE_KEYS.has(e.key))) return;

  if (e.target instanceof Element && e.target.closest('#snd')) return;

// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// Each voice pans with its place on the stage.
function bus(a, x) {
  const p = a.createStereoPanner ? a.createStereoPanner() : a.createGain();
  if (p.pan) p.pan.value = clamp(x, -1, 1) * 0.6;
  p.connect(out);

// A noise burst through one filter; it tidies itself up.
function burst(a, dst, t, type, f, q, g, tau, len) {
  const src = a.createBufferSource(), fl = a.createBiquadFilter(), ng = a.createGain();

  fl.frequency.value = f;
  fl.Q.value = q;

  ng.gain.linearRampToValueAtTime(g, t + 0.0006);
  ng.gain.setTargetAtTime(0, t + 0.0006, tau);

// The swish is soft fluttering noise that follows the tip.
function swishVoice() {

  if (!sw) return;
  const t = ac.currentTime;

// Level and brightness follow the tip's speed.
function swishTo(sp, x) {
  if (!sw) return;

// The crack is a soft snap, a papery flap and a thump.

/* ---------- the ribbon: a centre line with a twisting frame ---------- */

const Wf = new Float64Array(NV * 3), Tg = new Float64Array(NV * 3), To = new Float64Array(NV * 3);
const Om = new Float64Array(NV), Sx = new Float64Array(NV);

  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, palTex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, GN, 4);
  texParams(gl.LINEAR);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, GN, 4, gl.RGBA, gl.FLOAT, PALD);
  gl.activeTexture(gl.TEXTURE0);
  spVao = gl.createVertexArray();
  gl.bindVertexArray(spVao);
  spBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, spBuf);
  gl.bufferData(gl.ARRAY_BUFFER, SPD.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 32, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 16);
  gl.bindVertexArray(null);
  camera();
}
function texParams(f) {
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}
function uploadPal() {
  if (!gl) return;
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, palTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, GN, 4, gl.RGBA, gl.FLOAT, PALD);
  gl.activeTexture(gl.TEXTURE0);
}
// The camera steps back from the stage plane and frames it exactly.
function camera() {
  if (!gl) return;
  const a = hx / hy, f = CAMZ / hy, nr = 0.5, fr = 14, A = (fr + nr) / (nr - fr), B = (2 * fr * nr) / (nr - fr);
  VP.set([f / a, 0, 0, 0, 0, f, 0, 0, 0, 0, A, -1, 0, 0, B - A * CAMZ, CAMZ]);
  gl.useProgram(P.rib.p);
  gl.uniformMatrix4fv(P.rib.u.uVP, false, VP);
  gl.useProgram(P.sp.p);
  gl.uniformMatrix4fv(P.sp.u.uVP, false, VP);
  gl.uniform1f(P.sp.u.uPx, canvas.height * 0.5 * f);
}
function fit() {
  const w = panel.clientWidth, h = panel.clientHeight;
  if (!w || !h) return;
  rect = null;
  const p = Math.min(devicePixelRatio || 1, lowDpr ? 1 : 2, Math.sqrt(1.4e6 / (w * h)));
  const cw = Math.round(w * p), ch = Math.round(h * p), a = w / h;
  if (a >= 1) { hx = a; hy = 1; } else { hx = 1; hy = 1 / a; }
  if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
  camera();
  // A resized canvas is blank until drawn, so draw now.
  if (ready && visible) render();
}

// The drawn wave adds a bulge and one full turn.
function pack() {
  for (let i = 0; i < NV; i++) {
    const o = i * 3, p = i * 4, q = (NV + i) * 4;
    let x = X[o], y = X[o + 1], z = X[o + 2], wx = Wf[o], wy = Wf[o + 1], wz = Wf[o + 2];
    if (waves.length) {
      const tx = Tg[o], ty = Tg[o + 1], tz = Tg[o + 2];
      let ang = 0;
      for (const wv of waves) {
        const e = (Sx[i] - wv.s) / 0.24;
        if (e > -4 && e < 4) {
          const g = 0.11 * wv.k * Math.exp(-e * e), d = wv.dx * tx + wv.dy * ty + wv.dz * tz;
          x += (wv.dx - d * tx) * g;
          y += (wv.dy - d * ty) * g;
          z += (wv.dz - d * tz) * g;
        }
        ang += TAU * sstep(-1, 1, -e * 0.8);
      }
      ang %= TAU;
      if (ang) {
        const c = Math.cos(ang), s = Math.sin(ang), nx = ty * wz - tz * wy, ny = tz * wx - tx * wz, nz = tx * wy - ty * wx;
        wx = wx * c + nx * s;
        wy = wy * c + ny * s;
        wz = wz * c + nz * s;
      }
    }
    TEXD[p] = x; TEXD[p + 1] = y; TEXD[p + 2] = z; TEXD[p + 3] = Sx[i];
    TEXD[q] = wx; TEXD[q + 1] = wy; TEXD[q + 2] = wz; TEXD[q + 3] = Glow[i];
  }
}
function render() {
  pack();
  const cw = canvas.width, ch = canvas.height;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, cw, ch);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, dataTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, NV, 2, gl.RGBA, gl.FLOAT, TEXD);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, palTex);
  gl.activeTexture(gl.TEXTURE0);
  gl.depthMask(true);
  gl.clearDepth(1);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  gl.bindVertexArray(vao);
  gl.useProgram(P.bg.p);
  const k = clamp(dye);
  gl.uniform2f(P.bg.u.uRes, cw, ch);
  ['uC0', 'uC1', 'uC2'].forEach((n, j) => gl.uniform3f(P.bg.u[n], ...bgFrom[j].map((v, c) => lerp(v, bgTo[j][c], k))));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.useProgram(P.rib.p);
  gl.uniform1f(P.rib.u.uDye, dye);
  gl.uniform1f(P.rib.u.uIri, PALS[palName].iri);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, NV * 2);
  if (sparks.length) {
    let o = 0;
    for (const s of sparks) {
      const t = 1 - s.age / s.life;
      // A negative size marks the ring, which grows as it fades.
      const size = s.kind === 2 ? -s.size * (0.25 + 0.75 * Math.sqrt(1 - t)) : s.size * (s.kind === 1 ? 0.5 + 0.5 * t : 1);
      const a = s.kind === 1 ? t * t * t : s.kind === 2 ? t * t * 0.8 : t * t * (0.7 + 0.3 * Math.sin(s.age * 38 + s.ph));
      SPD.set([s.x, s.y, s.z, size, s.c[0], s.c[1], s.c[2], a], o);
      o += 8;
    }
    gl.bindVertexArray(spVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, spBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, SPD, 0, o);
    gl.useProgram(P.sp.p);
    gl.depthMask(false);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.drawArrays(gl.POINTS, 0, sparks.length);
    gl.disable(gl.BLEND);
    gl.depthMask(true);
  }
  gl.bindVertexArray(null);
}

/* ---------- one loop: always alive in view, at rest when reduced ---------- */
let slow = 0, frames = 0, drawn = 0;
function wake() {
  if (!raf && visible) {
    last = performance.now();
    raf = requestAnimationFrame(frame);
    if (soundOn && ac && ac.state !== 'running') audio();
  }
}
function frame(now) {
  raf = 0;
  if (!visible) return;
  const raw = Math.max(0, (now - last) / 1000), dt = raw > 0 ? Math.min(raw, 1 / 20) : 1 / 60;
  last = now;
  // Sustained slow frames drop the pixel ratio to 1.
  if (!lowDpr && ++frames > 30) {
    slow = raw > 0.024 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 40) { lowDpr = true; fit(); }
  }
  const busy = step(dt);
  render();
  if (++drawn === 2) canvas.classList.add('on');
  // Reduced motion stills the wind, so the loop rests when calm.
  if (!reduce || busy || drawn < 3) raf = requestAnimationFrame(frame);
  else rest();
}
// Off screen or hidden, the ribbon pauses and goes quiet.
function sync() {
  const v = ready && onScreen && !document.hidden;
  if (v === visible) return;
  visible = v;
  if (v) wake();
  else {
    cancelAnimationFrame(raf);
    raf = 0;
    if (ac && ac.state === 'running') {
      hush();
      ac.suspend()?.catch(() => {});
    }
  }
}

/* ---------- input ---------- */
let rect = null;
addEventListener('scroll', () => { rect = null; }, { passive: true });
function ndc(e) {
  const r = rect || (rect = panel.getBoundingClientRect());
  return [clamp(((e.clientX - r.left) / r.width) * 2 - 1, -1.1, 1.1), clamp(1 - ((e.clientY - r.top) / r.height) * 2, -1.1, 1.1)];
}
panel.addEventListener('pointerdown', e => {
  if (!ready || (e.pointerType === 'mouse' && e.button !== 0)) return;
  if (lead.down && lead.id !== e.pointerId) return;
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  const touch = e.pointerType !== 'mouse';
  // A finger lands anywhere, so the head glides over first.
  if (touch || !lead.on) softT = 0.5;
  lead.on = lead.down = true;
  lead.id = e.pointerId;
  lead.src = touch ? 'touch' : 'mouse';
  [lead.nx, lead.ny] = ndc(e);
  kb.on = false;
  cancelFlourish();
  wake();
});
panel.addEventListener('pointermove', e => {
  if (!ready || (lead.down ? e.pointerId !== lead.id : e.pointerType !== 'mouse')) return;
  const list = e.getCoalescedEvents?.() || [];
  const [nx, ny] = ndc(list.length ? list[list.length - 1] : e);
  if (!lead.on) { softT = 0.5; lead.on = true; lead.src = 'mouse'; }
  if (flo && Math.hypot(nx - flo.nx, ny - flo.ny) > 0.04) cancelFlourish();
  lead.nx = nx;
  lead.ny = ny;
  kb.on = false;
  wake();
});
const lift = e => {
  if (e.pointerId !== lead.id) return;
  lead.down = false;
  lead.id = -1;
  // A lifted finger lets the ribbon drift.
  if (e.pointerType !== 'mouse') lead.on = false;
};
panel.addEventListener('pointerup', lift);
panel.addEventListener('pointercancel', lift);
panel.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !lead.down) lead.on = false; });
panel.addEventListener('contextmenu', e => e.preventDefault());

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const k = e.key;
  if (ARROWS[k]) {
    e.preventDefault();
    if (!ready) return;
    if (!kb.on) {
      [kb.x, kb.y] = toNdc(centre);
      kb.vx = kb.vy = 0;
      kb.on = true;
      lead.on = false;
    }
    cancelFlourish();
    if (!held.has(k)) held.set(k, performance.now());
    kb.at = clock;
    wake();
  } else if (k === ' ') {
    // Buttons and links keep Space for themselves.
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (!e.repeat) flourish();
  }
});
addEventListener('keyup', e => {
  const t0 = held.get(e.key);
  if (t0 === undefined) return;
  held.delete(e.key);
  // A quick tap dashes and stops, so the ribbon cracks.
  if (performance.now() - t0 < 200) {
    const d = ARROWS[e.key];
    kb.vx += (d[0] * DASH) / hx;
    kb.vy += (d[1] * DASH) / hy;
    fDir[0] = d[0];
    fDir[1] = d[1];
    fDir[2] = 0;
    launch(V_FLICK + 4);
  }
  kb.at = clock;
  wake();
});
addEventListener('blur', () => held.clear());

const chips = [...document.querySelectorAll('[data-pal]')];
function setPal(name) {
  if (!PALS[name] || name === palName) return;
  const k = clamp(dye);
  bgFrom = bgFrom.map((c, j) => c.map((v, i) => lerp(v, bgTo[j][i], k)));
  bgTo = bgOf(PALS[name]);
  palName = name;
  chips.forEach(c => c.setAttribute('aria-pressed', String(c.dataset.pal === name)));
  // Old colours move down; new ones flow in from the stick.
  PALD.copyWithin(GN * 2 * 4, 0, GN * 2 * 4);
  bake(PALS[name], 0);
  uploadPal();
  dye = reduce ? 1.3 : -0.08;
  shimmer();
  wake();
}
chips.forEach(c => c.addEventListener('click', () => setPal(c.dataset.pal)));
const sndB = document.getElementById('snd');
const showSound = () => sndB.setAttribute('aria-pressed', String(soundOn));
showSound();
sndB.addEventListener('click', () => {
  soundOn = !soundOn;
  showSound();
  try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (err) { /* storage is optional */ }
  if (soundOn) audio();
  else if (ac) {
    hush();
    ac.suspend()?.catch(() => {});
  }
});

/* ---------- start: shaders link while the ribbon settles ---------- */
bake(PALS.sunset, 0);
bake(PALS.sunset, 2);
function failed() {
  ready = false;
  sync();
  canvas.hidden = true;
  panel.querySelector('.fail').hidden = false;
  chips.forEach(c => { c.disabled = true; });
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; sync(); });
canvas.addEventListener('webglcontextrestored', async () => {
  try {
    await initGL();
    ready = true;
    sync();
  } catch (err) { console.error(err); failed(); }
});
async function boot() {
  await idle();
  fit();
  const gate = initGL();
  gate.catch(() => {});
  await idle();
  seed();
  // Two seconds of drifting run in idle slices before the first frame.
  for (let c = 0; c < 4; c++) {
    for (let k = 0; k < 30; k++) step(1 / 60);
    await idle();
  }
  try { await gate; } catch (err) { console.error(err); failed(); return; }
  ready = true;
  new ResizeObserver(fit).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; sync(); }).observe(panel);
  document.addEventListener('visibilitychange', sync);
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
