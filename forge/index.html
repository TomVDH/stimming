<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.09 0.008 50); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">
<link rel="modulepreload" href="./shaders.js">
<link rel="modulepreload" href="./smithy.js">
<link rel="modulepreload" href="./steel.js">
<link rel="modulepreload" href="./sparks.js">
<link rel="modulepreload" href="./steam.js">
<link rel="modulepreload" href="./sound.js">
<style>
/* Forge: a coal forge in a dim smithy; heat, hammer and quench a bar. */
:root { --stage: oklch(0.09 0.008 50); }
.stage--forge { background: var(--stage); cursor: pointer; }
.stage--forge.grab { cursor: grab; }
.stage--forge.drag { cursor: grabbing; }
.stage--forge canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--forge canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--forge canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Forge</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--forge" id="stage" tabindex="0" role="application" aria-label="A blacksmith's coal forge in a dim smithy: the hearth with a bellows, an anvil, a water trough, and a steel bar held in tongs. Pump the bellows to heat the bar through red, orange and yellow. Drag the bar to the anvil and tap to hammer it; each blow rings and throws sparks. Plunge it in the trough to quench it in steam. Keys 1 to 3 move the bar, Space strikes, B pumps.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Forge</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
