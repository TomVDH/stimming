<style>
/* Star trails: one horizon, the turning sky, a shutter you hold open. */
:root { --stage: oklch(0.1 0.02 265); }
.stage--trails { cursor: crosshair; }
.stage--trails canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--trails canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--trails canvas { transition: none; } }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.012 275 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
</style>

<body>
<div class="intro" aria-hidden="true" data-done>
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/trails.svg)"></span><span class="intro-name">Star trails</span><span class="intro-sub">Stimming No. 29</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--trails" id="stage" tabindex="0" role="application" aria-label="A night sky over a dark horizon. Hold the pointer or Space to open the shutter; the turning stars draw arcs.">
      <p class="fail" hidden>Star trails needs WebGL2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" id="sky" role="group" aria-label="Sky">
        <button class="chip" type="button" data-value="north" aria-pressed="true">North</button>
        <button class="chip" type="button" data-value="south" aria-pressed="false">South</button>
        <button class="chip" type="button" data-value="equator" aria-pressed="false">Equator</button>
      </div>
      <label class="slider"><span>Exposure</span><input type="range" id="expo" min="0" max="1" step="0.01" value="0.5" aria-label="Exposure: how long trails stay"></label>
      <div class="actions">
        <button class="chip" id="clear" type="button">Clear</button>
      </div>
      <div class="edge">
        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings">
            <div class="group"><span>Stars</span><div class="choices" id="count" role="group" aria-label="Stars">
              <button class="chip" type="button" data-value="2000" aria-pressed="false">Few</button>
              <button class="chip" type="button" data-value="4500" aria-pressed="true">Some</button>
              <button class="chip" type="button" data-value="9000" aria-pressed="false">Many</button>
            </div></div>
            <div class="group"><span>Colour</span><div class="choices" id="tint" role="group" aria-label="Colour">
              <button class="chip" type="button" data-value="true" aria-pressed="true">True</button>
              <button class="chip" type="button" data-value="mono" aria-pressed="false">Mono</button>
            </div></div>
            <div class="group"><span>Meteors</span><div class="choices" id="meteors" role="group" aria-label="Meteors">
              <button class="chip" type="button" data-value="0" aria-pressed="false">Off</button>
              <button class="chip" type="button" data-value="1" aria-pressed="true">Some</button>

            </div></div>
          </div>
        </div>
        <dl class="how" aria-label="How to play">
          <div><dt>Hold</dt><dd>open the shutter</dd></div>
          <div><dt>Release</dt><dd>close it</dd></div>

        </dl>
      </div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Star trails</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module">
import { initPage, audioKit, choices, fitCanvas, whenVisible, reduced, onReducedChange, linFit, qualitySetting, onQuality, stage as mark, pageReady } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

mark('libs');
// The intro holds until the page, the font and the first frame are ready.
playIntro({ ready: pageReady() });
initPage({ id: 'trails' });
// Settings holds the site-wide Quality choice.
qualitySetting(document.getElementById('sets'));

const PI = Math.PI, TAU = PI * 2, D2R = PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.trails.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.trails.${k}`, String(v)); } catch { /* storage is optional */ } };
const opts = {
  sky: saved('sky') || 'north',
  expo: saved('expo') != null ? +saved('expo') : 0.5,
  count: +(saved('count') || 4500),
  tint: saved('tint') || 'true',
  meteors: saved('meteors') != null ? +saved('meteors') : 1,
};
let reduce = reduced();
onReducedChange(v => { reduce = v; });

// Each sky sets the latitude and where the camera points.
// The dome is the town glow azimuth, in degrees.
const SKIES = {
  north: { lat: 51, az: 0, fov: 74, pole: true, dome: 28 },
  south: { lat: -34, az: 180, fov: 66, pole: false, dome: 152 },
  equator: { lat: 0.5, az: 90, fov: 62, pole: false, dome: 116 },
};
const OMEGA = 0.055;  // sky turn in radians per second, sped up
// Plate energy per unit of star brightness per second.
const FLUX = 11;
// Exposure maps the slider to how long trails last, in seconds.
const tau = () => 1.5 * Math.pow(40, opts.expo);

/* ---------- WebGL2 ---------- */
mark('build');
const stage = document.getElementById('stage');
const canvas = document.createElement('canvas');
canvas.setAttribute('aria-hidden', 'true');
stage.prepend(canvas);
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
// The fail line counts as the first frame, so the intro lifts.
const fail = () => { stage.querySelector('.fail').hidden = false; mark('first-frame'); throw new Error('no webgl2'); };
if (!gl) fail();
// Half floats keep faint trails smooth; bytes are the fallback.
const FLOAT = !!gl.getExtension('EXT_color_buffer_float');

const QUAD_VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
const NOISE = `
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
`;
// The ridge line in pixels; the bloom and final passes share it.
const RIDGE = `
float ridgeY(float x, vec2 res, float horizon, float seed) {
  float u = x / res.y;
  return horizon + res.y * (0.06 * fbm(vec2(u * 1.1 + seed, 1.0)) + 0.012 * fbm(vec2(u * 8.0 + seed, 4.0)) - 0.036);
}`;

/* ---------- K1: accumulation and decay ---------- */
// Sonar and Cloud chamber copy this section.
// Two float targets ping-pong; each frame fades the plate by exp(-dt/tau).
const DECAY = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform float uK, uEps; in vec2 vUv; out vec4 o;
void main() { vec4 c = texture(uSrc, vUv) * uK; o = max(c - uEps, 0.0); }`;
// A segment draws as a soft line with ramped ends.
// Adjacent segments overlap their ramps, so joins add up to one.
const SEG_VS = `#version 300 es
in vec2 aCorner; in vec4 aSeg; in vec4 aCol;
uniform vec2 uRes;
out vec2 vP; flat out vec4 vSeg; flat out vec4 vCol;
void main() {
  vec2 a = aSeg.xy, b = aSeg.zw; float w = aCol.a;
  vec2 d = b - a; float L = length(d);
  vec2 t = L > 1e-3 ? d / L : vec2(1, 0), n = vec2(-t.y, t.x);
  float r = w * 3.0 + 1.0;
  vec2 p = mix(a, b, aCorner.x * 0.5 + 0.5) + t * aCorner.x * r + n * aCorner.y * r;
  vP = p; vSeg = aSeg; vCol = aCol;
  gl_Position = vec4(p / uRes * 2.0 - 1.0, 0.0, 1.0);
}`;
const SEG_FS = `#version 300 es
precision highp float;
in vec2 vP; flat in vec4 vSeg; flat in vec4 vCol; out vec4 o;
void main() {
  vec2 a = vSeg.xy, b = vSeg.zw; float w = vCol.a;
  vec2 d = b - a; float L = length(d);
  float k;
  if (L < 0.05) { float r = length(vP - a) / w; k = exp(-r * r); }
  else {
    vec2 t = d / L; float s = dot(vP - a, t); float q = dot(vP - a, vec2(-t.y, t.x)) / w;
    float h = w * 1.2;
    k = exp(-q * q) * clamp((s + h) / (2.0 * h), 0.0, 1.0) * clamp((L + h - s) / (2.0 * h), 0.0, 1.0);
  }
  o = vec4(vCol.rgb * k, 1.0);
}`;
// The sky: gradient, airglow, a turning Milky Way, then the exposed plate.
const SKY_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uRes; uniform float uFocal, uTime;
uniform vec3 uF, uR, uU, uP, uB1, uB2, uGal, uGC;
uniform float uTheta, uMono, uDomeAz;
in vec2 vUv; out vec4 o;
${NOISE}
void main() {
  vec2 px = vUv * uRes - uRes * 0.5;
  vec3 d = normalize(uF + uR * px.x / uFocal + uU * px.y / uFocal);
  float el = d.y, up = max(el, 0.0);
  vec3 zen = vec3(0.0012, 0.0021, 0.0068), hor = vec3(0.014, 0.019, 0.034);
  vec3 c = mix(hor, zen, pow(clamp(el, 0.0, 1.0), 0.42));
  // Airglow lies as a faint green band a few degrees up.
  c += vec3(0.004, 0.012, 0.006) * exp(-pow((el - 0.12) / 0.08, 2.0));
  // A distant town lights a warm dome low on one side.
  float da = atan(d.x, -d.z) - uDomeAz; da = atan(sin(da), cos(da));
  c += vec3(0.042, 0.021, 0.008) * exp(-up * 10.0) * exp(-da * da * 2.2);
  c += vec3(0.011, 0.011, 0.014) * exp(-up * 34.0);
  // Back to sky coordinates, then turn by -theta.
  float cp = cos(-uTheta), sp = sin(-uTheta);
  vec3 q = vec3(dot(d, uB1), dot(d, uB2), dot(d, uP));
  vec3 e = vec3(cp * q.x - sp * q.y, sp * q.x + cp * q.y, q.z);
  float g = dot(e, uGal);
  vec2 gp = vec2(atan(e.y, e.x) * 3.0, g * 9.0);
  // The core of the galaxy is wider, brighter and warmer.
  float core = smoothstep(0.2, 1.0, dot(e, uGC));
  float wide = mix(30.0, 9.0, core);
  float band = exp(-g * g * wide) * (0.3 + 0.7 * fbm(gp * 1.6)) * (0.55 + 0.7 * fbm(gp * 4.0 + 3.0));
  float dust = smoothstep(0.5, 0.72, fbm(gp * 2.4 + 9.0)) * exp(-g * g * 110.0);
  vec3 mw = mix(vec3(0.034, 0.036, 0.046), vec3(0.075, 0.06, 0.045), core) * (1.0 + 1.6 * core);
  c += mw * band * (1.0 - dust * 0.85) * smoothstep(-0.02, 0.25, el);
  // The plate holds raw light; a soft curve keeps cores from clipping.
  vec3 acc = texture(uSrc, vUv).rgb;
  acc = mix(acc, vec3(dot(acc, vec3(0.3, 0.5, 0.2))), uMono);
  c += 1.0 - exp(-acc * 1.6);
  o = vec4(c, 1.0);
}`;
// Bloom input: bright parts only, with the ridge cut out.
const BRIGHT_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uRes; uniform float uHorizon, uSeed;
in vec2 vUv; out vec4 o;
${NOISE}${RIDGE}
void main() {
  vec3 c = texture(uSrc, vUv).rgb;
  vec2 px = vUv * uRes;
  c *= smoothstep(-1.5, 1.5, px.y - ridgeY(px.x, uRes, uHorizon, uSeed));
  float l = max(c.r, max(c.g, c.b));
  o = vec4(c * smoothstep(0.1, 0.7, l), 1.0);
}`;
// A nine-tap Gaussian in five reads, along one axis.
const BLUR_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uDir; in vec2 vUv; out vec4 o;
void main() {
  vec3 s = texture(uSrc, vUv).rgb * 0.227027;
  s += (texture(uSrc, vUv + uDir * 1.384615).rgb + texture(uSrc, vUv - uDir * 1.384615).rgb) * 0.316216;
  s += (texture(uSrc, vUv + uDir * 3.230769).rgb + texture(uSrc, vUv - uDir * 3.230769).rgb) * 0.070270;
  o = vec4(s, 1.0);
}`;
// The final pass: the ridge, bloom, grain, vignette and output curve.
const OUT_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc, uB1, uB2; uniform vec2 uRes; uniform float uHorizon, uTime, uSeed;
in vec2 vUv; out vec4 o;
${NOISE}${RIDGE}
void main() {
  vec3 c = texture(uSrc, vUv).rgb;
  vec2 px = vUv * uRes;
  float ridge = ridgeY(px.x, uRes, uHorizon, uSeed);
  float m = smoothstep(ridge - 1.2, ridge + 1.2, px.y);
  // The land holds a trace of sky light, darker toward the frame foot.
  float below = max(ridge - px.y, 0.0) / uRes.y;
  vec3 land = vec3(0.0016, 0.0019, 0.003) * (0.4 + 0.6 * exp(-below * 12.0));
  c = mix(land, c, m);
  // Lens bloom spreads over the ridge edge, as glare does.
  c += texture(uB1, vUv).rgb * 0.32 + texture(uB2, vUv).rgb * 0.22;
  vec2 q = vUv - 0.5;
  c *= 1.0 - dot(q * vec2(1.0, 1.3), q) * 0.8;
  c = pow(max(c, 0.0), vec3(1.0 / 2.2));
  // Grain is coarser in the shadows, as on film.
  float lum = dot(c, vec3(0.3, 0.55, 0.15));
  c += (hash12(px + fract(uTime * 7.13) * 911.0) - 0.5) * mix(0.022, 0.008, clamp(lum * 3.0, 0.0, 1.0));
  o = vec4(c, 1.0);
}`;

function program(vs, fs, attrs) {
  const p = gl.createProgram();
  [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(([type, src]) => {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(sh)); fail(); }
    gl.attachShader(p, sh);
  });
  attrs.forEach((name, i) => gl.bindAttribLocation(p, i, name));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); fail(); }
  const u = {};
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(p, i).name; u[n] = gl.getUniformLocation(p, n); }
  return { p, u };
}
const P = {
  decay: program(QUAD_VS, DECAY, ['aPos']),
  seg: program(SEG_VS, SEG_FS, ['aCorner', 'aSeg', 'aCol']),
  sky: program(QUAD_VS, SKY_FS, ['aPos']),
  bright: program(QUAD_VS, BRIGHT_FS, ['aPos']),
  blur: program(QUAD_VS, BLUR_FS, ['aPos']),
  out: program(QUAD_VS, OUT_FS, ['aPos']),
};

const corners = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
const quadVao = gl.createVertexArray();
gl.bindVertexArray(quadVao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, corners, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// Segment data: a.xy, b.xy in pixels, then rgb energy and width.
const MAXSEG = 9000 * 6;
const inst = new Float32Array(MAXSEG * 8);
const segVao = gl.createVertexArray();
gl.bindVertexArray(segVao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, corners, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const instBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
gl.bufferData(gl.ARRAY_BUFFER, inst.byteLength, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(1);
gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 0);
gl.vertexAttribDivisor(1, 1);
gl.enableVertexAttribArray(2);
gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16);
gl.vertexAttribDivisor(2, 1);
gl.bindVertexArray(null);

function target(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (FLOAT) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
  [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fb, w, h };
}
const drop = t => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); };
let acc = [], ai = 0, frame = null;
const clearAcc = () => acc.forEach(a => { gl.bindFramebuffer(gl.FRAMEBUFFER, a.fb); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); });

function decayPass(dt) {
  const src = acc[ai], dst = acc[1 - ai];
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, dst.w, dst.h);
  gl.useProgram(P.decay.p); gl.bindVertexArray(quadVao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(P.decay.u.uSrc, 0);
  gl.uniform1f(P.decay.u.uK, Math.exp(-dt / tau()));
  gl.uniform1f(P.decay.u.uEps, FLOAT ? 0.0004 * dt : 0.6 / 255);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ai = 1 - ai;
}
function segPass(dst, count) {
  if (!count) return;
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, dst.w, dst.h);
  gl.useProgram(P.seg.p); gl.bindVertexArray(segVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst, 0, count * 8);
  gl.uniform2f(P.seg.u.uRes, dst.w, dst.h);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
  gl.disable(gl.BLEND);
}
/* ---------- end K1 ---------- */

/* ---------- the sky ---------- */
// Seeded random keeps the same sky on every visit.
function mulberry(a) {
  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const MAXSTAR = 9000;
const star = { ra: new Float32Array(MAXSTAR), cd: new Float32Array(MAXSTAR), sd: new Float32Array(MAXSTAR), b: new Float32Array(MAXSTAR), col: new Float32Array(MAXSTAR * 3), ph: new Float32Array(MAXSTAR) };
const unit = v => { const l = Math.hypot(...v); return v.map(x => x / l); };
const GAL = unit([0.45, -0.55, 0.7]);
// The galactic core lies in the plane, at a right angle to its pole.
const GC = unit([GAL[1] * 1 - GAL[2] * 0.2, GAL[2] * 0.6 - GAL[0] * 1, GAL[0] * 0.2 - GAL[1] * 0.6]);
{
  const rand = mulberry(11);
  for (let i = 0; i < MAXSTAR; i++) {
    // A third of the stars crowd toward the Milky Way plane.
    let x, y, z;
    for (;;) {
      z = rand() * 2 - 1; const a = rand() * TAU, r = Math.sqrt(1 - z * z);
      x = r * Math.cos(a); y = r * Math.sin(a);
      const g = x * GAL[0] + y * GAL[1] + z * GAL[2];
      if (rand() < 0.62 || Math.abs(g) < 0.18 * rand()) break;
    }
    star.ra[i] = Math.atan2(y, x);
    star.sd[i] = z; star.cd[i] = Math.sqrt(1 - z * z);
    // Brightness follows a steep power law: few bright, many faint.
    star.b[i] = 0.04 + 2.6 * Math.pow(rand(), 9);
    // Temperature sets hue: cool stars orange, hot stars blue.
    const T = rand();
    const u = T < 0.38 ? T / 0.38 : (T - 0.7) / 0.3;
    const lc = T < 0.38 ? linFit(lerp(0.8, 0.93, u), lerp(0.15, 0.05, u), lerp(45, 78, u))
      : T < 0.7 ? linFit(0.96, 0.025, 92)
      : linFit(0.9, lerp(0.04, 0.12, u), 255);
    star.col.set(lc, i * 3);
    star.ph[i] = rand() * TAU;
  }
  // The pole star sits half a degree off the pole.
  star.ra[0] = 0.4; star.sd[0] = Math.sin(89.3 * D2R); star.cd[0] = Math.cos(89.3 * D2R); star.b[0] = 2.2;
  star.col.set(linFit(0.95, 0.02, 90), 0);
}

const cam = { F: [0, 0, -1], R: [1, 0, 0], U: [0, 1, 0], P: [0, 0, 1], B1: [0, 1, 0], B2: [1, 0, 0], focal: 600, horizon: 0 };
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
function setCamera() {
  const S = SKIES[opts.sky];
  // The horizon sits high enough to clear the bar; portrait needs more room.
  const hf = W < H ? 0.27 : 0.19;
  const az = S.az * D2R, lat = S.lat * D2R, el = Math.atan((1 - 2 * hf) * Math.tan(S.fov * D2R / 2));
  cam.F = [Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)];
  const r = [Math.cos(az), 0, Math.sin(az)];
  cam.R = r;
  cam.U = [r[1] * cam.F[2] - r[2] * cam.F[1], r[2] * cam.F[0] - r[0] * cam.F[2], r[0] * cam.F[1] - r[1] * cam.F[0]];
  // North is -z, up is +y, east is +x; the pole lifts by the latitude.
  const N = [0, 0, -1], Up = [0, 1, 0], E = [1, 0, 0];
  cam.P = N.map((n, i) => Math.cos(lat) * n + Math.sin(lat) * Up[i]);
  cam.B1 = N.map((n, i) => -Math.sin(lat) * n + Math.cos(lat) * Up[i]);
  cam.B2 = E.map(v => -v);
  cam.focal = H / 2 / Math.tan(S.fov * D2R / 2);
  // The horizon line sits where elevation is zero.
  cam.horizon = H / 2 - Math.tan(el) * cam.focal;
}
// Star i at sky angle th, in pixels; null when hidden.
const tmp = [0, 0, 0];
function project(i, th, out) {
  const h = star.ra[i] + th, cd = star.cd[i], sd = star.sd[i];
  const ch = Math.cos(h) * cd, shh = Math.sin(h) * cd;
  for (let k = 0; k < 3; k++) tmp[k] = sd * cam.P[k] + ch * cam.B1[k] + shh * cam.B2[k];
  const z = dot(tmp, cam.F);
  if (z < 0.08) return false;
  out[0] = W / 2 + dot(tmp, cam.R) / z * cam.focal;
  out[1] = H / 2 + dot(tmp, cam.U) / z * cam.focal;
  out[2] = tmp[1];
  return true;
}

/* ---------- state ---------- */
let W = 1, H = 1, dpr = 1, theta = 0.6, t = 0;
let shutter = false, closedAt = -1e9, ready = false;
const meteors = [];
const pa = [0, 0, 0], pb = [0, 0, 0];

function starWeight(i, el) {
  if (i === 0 && !SKIES[opts.sky].pole) return 0;
  // Air near the horizon dims and reddens the light.
  return star.b[i] * clamp((el + 0.02) / 0.2) ** 1.5;
}
// The shift moves colour between red and blue for low stars.
function pushSeg(n, a, b, i, k, width, shift = 0) {
  const o = n * 8;
  inst[o] = a[0]; inst[o + 1] = a[1]; inst[o + 2] = b[0]; inst[o + 3] = b[1];
  const lo = clamp(a[2] * 4);
  inst[o + 4] = star.col[i * 3] * k * (1 + shift);
  inst[o + 5] = star.col[i * 3 + 1] * k * (0.8 + 0.2 * lo);
  inst[o + 6] = star.col[i * 3 + 2] * k * (0.6 + 0.4 * lo) * (1 - shift);
  inst[o + 7] = width;
}
// Scintillation: low stars flicker in brightness and colour.
// It follows sky time, so trails bead the same at any frame rate.
const scint = { k: 1, shift: 0 };
function scintillate(i, th, el) {
  const s = th / OMEGA, p = star.ph[i];
  const amp = 0.06 + 0.8 * clamp(1 - el * 5) ** 2;
  const a = Math.sin(s * (2.1 + (i % 5) * 0.37) + p) + 0.6 * Math.sin(s * (3.7 + (i % 3) * 0.51) + p * 2.3);
  scint.k = 1 + amp * a * 0.6;
  scint.shift = amp * 0.45 * Math.sin(s * (1.7 + (i % 4) * 0.29) + p * 3.1);
  return scint;
}
// Arcs from th0 to th1, split so each piece stays short.
// Energy per piece is flux times dwell time, so slow stars burn in.
// The fade, in radians, dims older pieces as the plate decay does.
function exposeArcs(th0, th1, gain, step = 0.006, fade = Infinity) {
  const steps = Math.min(600, Math.max(1, Math.ceil(Math.abs(th1 - th0) / step)));
  const dts = Math.abs(th1 - th0) / steps / OMEGA;
  const age = new Float32Array(steps);
  for (let s = 0; s < steps; s++) age[s] = gain * Math.exp(-Math.abs(th1 - lerp(th0, th1, (s + 0.5) / steps)) / fade);
  let n = 0;
  const count = Math.min(opts.count, MAXSTAR);
  for (let i = 0; i < count; i++) {
    const width = (0.55 + 0.5 * Math.min(1, star.b[i])) * dpr;
    // Each piece starts where the last one ended, so one projection per step.
    let ok = project(i, th0, pb);
    for (let s = 0; s < steps; s++) {
      pa[0] = pb[0]; pa[1] = pb[1]; pa[2] = pb[2];
      const was = ok;
      ok = project(i, lerp(th0, th1, (s + 1) / steps), pb);
      if (!was || !ok) continue;
      const el = (pa[2] + pb[2]) / 2;
      const w = starWeight(i, el);
      if (w <= 0.002) continue;
      const L = Math.hypot(pb[0] - pa[0], pb[1] - pa[1]);
      const dwell = dts * Math.min(1, 1.8 * width / Math.max(L, 1e-4));
      const sc = scintillate(i, lerp(th0, th1, (s + 0.5) / steps), el);
      pushSeg(n++, pa, pb, i, w * FLUX * dwell * sc.k * age[s], width, sc.shift);
      if (n >= MAXSEG) { segPass(acc[ai], n); n = 0; }
    }
  }
  segPass(acc[ai], n);
}
function drawLiveStars(dst) {
  let n = 0;
  const count = Math.min(opts.count, MAXSTAR);
  for (let i = 0; i < count; i++) {
    if (!project(i, theta, pa)) continue;
    let w = starWeight(i, pa[2]);
    if (w <= 0.004) continue;
    // Low stars twinkle more through thicker air.
    let shift = 0;
    if (!reduce) {
      const sc = scintillate(i, t * OMEGA * 2.4, pa[2]);
      w *= sc.k; shift = sc.shift;
    }
    pushSeg(n++, pa, pa, i, w * 0.9, (0.65 + 0.7 * Math.min(1.4, star.b[i])) * dpr, shift);
  }
  segPass(dst, n);
}
function drawMeteors(dt) {
  let n = 0;
  for (let k = meteors.length - 1; k >= 0; k--) {
    const m = meteors[k];
    const a = m.age / m.life, b = Math.min(1, (m.age + dt) / m.life);
    m.age += dt;
    const p0 = [lerp(m.x0, m.x1, a), lerp(m.y0, m.y1, a), 1], p1 = [lerp(m.x0, m.x1, b), lerp(m.y0, m.y1, b), 1];
    // A meteor swells, flares once and burns out, green at its brightest.
    const mid = (a + b) / 2;
    const env = Math.sin(PI * mid) ** 1.4 * (1 + 1.2 * Math.exp(-(((mid - m.flare) / 0.06) ** 2))) * (0.85 + 0.3 * Math.random());
    const g = env * m.k;
    const o = n * 8;
    inst.set([p0[0], p0[1], p1[0], p1[1], 1.3 * g, 2.1 * g, 1.6 * g, (0.7 + 0.35 * env) * dpr], o);
    n++;
    if (m.age >= m.life) { meteors.splice(k, 1); if (!meteors.length) rest(); }
  }
  segPass(acc[ai], n);
}
function spawnMeteor() {
  const a = Math.random() * TAU, len = (0.15 + Math.random() * 0.25) * W;
  const x0 = W * (0.15 + Math.random() * 0.7), y0 = cam.horizon + (H - cam.horizon) * (0.35 + Math.random() * 0.55);
  meteors.push({ x0, y0, x1: x0 + Math.cos(a) * len, y1: Math.max(cam.horizon, y0 + Math.sin(a) * len * 0.6 - len * 0.3), age: 0, life: 0.35 + Math.random() * 0.4, k: 0.5 + Math.random() * 0.8, flare: 0.45 + Math.random() * 0.35 });
  meteorTick(meteors[meteors.length - 1]);
}

/* ---------- loop ---------- */
let raf = 0, last = 0, visible = true;
const idle = () => !shutter && !meteors.length && t - closedAt > tau() * 5.5;
function frameFn(now) {
  raf = 0;
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
  last = now;
  step(dt);
  render();
  if (visible && !idle()) raf = requestAnimationFrame(frameFn);
}
function wake() { if (visible && ready && !raf) { last = 0; raf = requestAnimationFrame(frameFn); } }

function step(dt) {
  t += dt;
  const th0 = theta;
  if (!reduce || shutter) theta += OMEGA * dt * (reduce ? 0 : 1);
  decayPass(dt);
  if (shutter && !reduce) exposeArcs(th0, theta, 1);
  if (opts.meteors && Math.random() < opts.meteors * 0.05 * dt) spawnMeteor();
  if (meteors.length) drawMeteors(dt);
}
function render() {
  // The sky and plate go into the frame target first.
  gl.bindFramebuffer(gl.FRAMEBUFFER, frame.fb); gl.viewport(0, 0, W, H);
  gl.useProgram(P.sky.p); gl.bindVertexArray(quadVao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, acc[ai].tex);
  const u = P.sky.u;
  gl.uniform1i(u.uSrc, 0);
  gl.uniform2f(u.uRes, W, H);
  gl.uniform1f(u.uFocal, cam.focal);
  gl.uniform1f(u.uTime, t);
  gl.uniform3fv(u.uF, cam.F); gl.uniform3fv(u.uR, cam.R); gl.uniform3fv(u.uU, cam.U);
  gl.uniform3fv(u.uP, cam.P); gl.uniform3fv(u.uB1, cam.B1); gl.uniform3fv(u.uB2, cam.B2);
  gl.uniform3fv(u.uGal, GAL); gl.uniform3fv(u.uGC, GC);
  gl.uniform1f(u.uTheta, theta);
  gl.uniform1f(u.uMono, opts.tint === 'mono' ? 1 : 0);
  gl.uniform1f(u.uDomeAz, SKIES[opts.sky].dome * D2R);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  drawLiveStars(frame);
  const seed = { north: 3.1, south: 11.7, equator: 21.4 }[opts.sky];
  bloomPass(seed);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(P.out.p); gl.bindVertexArray(quadVao);
  [frame, bloom[0], bloom[3]].forEach((b, k) => { gl.activeTexture(gl.TEXTURE0 + k); gl.bindTexture(gl.TEXTURE_2D, b.tex); });
  gl.uniform1i(P.out.u.uSrc, 0); gl.uniform1i(P.out.u.uB1, 1); gl.uniform1i(P.out.u.uB2, 2);
  gl.uniform2f(P.out.u.uRes, W, H);
  gl.uniform1f(P.out.u.uHorizon, cam.horizon);
  gl.uniform1f(P.out.u.uTime, t);
  gl.uniform1f(P.out.u.uSeed, seed);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.activeTexture(gl.TEXTURE0);
}
// Bloom: bright pass at half size, then a blur at half and quarter size.
// bloom[0] holds the near glow; bloom[3] holds the wide halo.
let bloom = [];
function quadInto(dst, prog, src) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, dst.w, dst.h);
  gl.useProgram(prog.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(prog.u.uSrc, 0);
}
function blur(dst, src, dx, dy) {
  quadInto(dst, P.blur, src);
  gl.uniform2f(P.blur.u.uDir, dx / dst.w, dy / dst.h);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function bloomPass(seed) {
  const [h1, h2, q1, q2] = bloom;
  gl.bindVertexArray(quadVao);
  quadInto(h1, P.bright, frame);
  gl.uniform2f(P.bright.u.uRes, W, H);
  gl.uniform1f(P.bright.u.uHorizon, cam.horizon);
  gl.uniform1f(P.bright.u.uSeed, seed);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  blur(h2, h1, 1, 0); blur(h1, h2, 0, 1);
  blur(q1, h1, 1, 0); blur(q2, q1, 0, 1);
}

/* ---------- sound ---------- */
// Space and Enter work the shutter, so they count as gestures.
const kit = audioKit({ keys: new Set([' ', 'Enter']), sleepMs: 3000 });
let V = null, T = null, toneLoad = null;
// The context sleeps once the shutter is shut and the sky is still.
const rest = () => kit.rest(() => !shutter && !meteors.length);
// The first live call loads Tone; voices answer once it lands.
function voices() {
  if (!kit.live()) return null;
  if (V) return V;
  toneLoad ||= kit.tone().then(m => {
    toneLoad = null;
    if (m && !V) { T = m; V = buildVoices(); if (shutter) padOpen(); }
  });
  return null;
}
function buildVoices() {
  // The pad runs at zero gain; the open shutter lifts it.
  const padGain = new T.Gain(0).connect(kit.out);
  const padF = new T.Filter({ type: 'lowpass', frequency: 150, Q: 0.8, rolloff: -24 }).connect(padGain);
  const pad = ['A1', 'E2', 'B2', 'F#3'].map((n, k) => new T.FatOscillator({ frequency: n, type: 'sawtooth', count: 3, spread: 22 + k * 6, volume: -12 - k * 4 }).connect(padF).start());
  // The click is a dry, bright noise tick over a small body thump.
  const clickF = new T.Filter({ type: 'highpass', frequency: 2200, Q: 0.7 }).connect(kit.out);
  const click = new T.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.0005, decay: 0.014, sustain: 0, release: 0.004 }, volume: -14 }).connect(clickF);
  const thump = new T.MembraneSynth({ pitchDecay: 0.018, octaves: 2.5, envelope: { attack: 0.001, decay: 0.08, sustain: 0, release: 0.02 }, volume: -16 }).connect(kit.out);
  const tickP = new T.Panner(0).connect(kit.out);
  const tick = new T.Synth({ oscillator: { type: 'triangle' }, envelope: { attack: 0.001, decay: 0.07, sustain: 0, release: 0.04 }, volume: -24 }).connect(tickP);
  return { pad, padF, padGain, click, thump, tick, tickP };
}
// Two quick clicks: the curtain, then the latch.
function shutterClick(opening) {
  const v = voices(); if (!v) return;
  const t0 = kit.ac.currentTime + 0.004;
  v.click.triggerAttackRelease(0.012, t0, opening ? 0.9 : 0.6);
  v.click.triggerAttackRelease(0.012, t0 + (opening ? 0.034 : 0.021), opening ? 0.45 : 0.85);
  v.thump.triggerAttackRelease(opening ? 'D2' : 'A1', 0.05, t0, 0.55);
}
// The pad filter opens over the exposure time.
function padOpen() {
  const v = voices(); if (!v) return;
  const t0 = kit.ac.currentTime;
  v.padGain.gain.cancelAndHoldAtTime(t0);
  v.padGain.gain.linearRampToValueAtTime(0.42, t0 + 0.8);
  v.padF.frequency.cancelAndHoldAtTime(t0);
  v.padF.frequency.exponentialRampToValueAtTime(2400, t0 + Math.max(2, tau() * 1.2));
}
function padClose() {
  if (!V) return;
  const t0 = kit.ac.currentTime;
  V.padGain.gain.cancelAndHoldAtTime(t0);
  V.padGain.gain.setTargetAtTime(0, t0, 0.45);
  V.padF.frequency.cancelAndHoldAtTime(t0);
  V.padF.frequency.exponentialRampToValueAtTime(150, t0 + 1.8);
}
// A meteor ticks once, panned to where it starts.
function meteorTick(m) {
  const v = voices(); if (!v) return;
  const t0 = kit.ac.currentTime + 0.004;
  v.tickP.pan.setValueAtTime(clamp(m.x0 / W * 2 - 1, -1, 1) * 0.7, t0);
  v.tick.triggerAttackRelease(2200 + Math.random() * 1800, 0.03, t0, 0.25 + 0.35 * m.k);
}

/* ---------- shutter ---------- */
function open() {
  if (shutter) return;
  shutter = true;
  stage.classList.add('held');
  shutterClick(true); padOpen();
  // Reduced motion draws the whole arc at once.
  if (reduce) { const th0 = theta; theta += 0.7; exposeArcs(th0, theta, 1); }
  wake();
}
function close() {
  if (!shutter) return;
  shutter = false;
  closedAt = t;
  stage.classList.remove('held');
  shutterClick(false); padClose(); rest();
  wake();
}
// A closed shutter shows a plate already exposed for the chosen time.
// The arc spans about two decay times; older light is dimmer.
function preExpose() {
  clearAcc();
  const span = Math.min(3.4, OMEGA * tau() * 2.2);
  exposeArcs(theta - span, theta, 1, Math.max(0.006, span / 400), OMEGA * tau());
  closedAt = t;
}
// Slider drags redraw the plate at most once per frame.
let rebuild = 0;
function queuePreExpose() {
  if (rebuild || shutter) return;
  rebuild = requestAnimationFrame(() => { rebuild = 0; if (!shutter) { preExpose(); render(); } });
}

/* ---------- size ---------- */
function resize() {
  const fit = fitCanvas(canvas, { budget: 2.2e6 });
  if (fit.W === W && fit.H === H && acc.length) return;
  W = fit.W; H = fit.H; dpr = fit.dpr;
  acc.forEach(drop); bloom.forEach(drop); if (frame) drop(frame);
  acc = [target(W, H), target(W, H)]; ai = 0;
  frame = target(W, H);
  const hw = Math.max(1, W >> 1), hh = Math.max(1, H >> 1), qw = Math.max(1, W >> 2), qh = Math.max(1, H >> 2);
  bloom = [target(hw, hh), target(hw, hh), target(qw, qh), target(qw, qh)];
  setCamera();
  preExpose();
  if (ready) { render(); wake(); }
}

/* ---------- input ---------- */
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture?.(e.pointerId);
  open();
});
stage.addEventListener('pointerup', close);
stage.addEventListener('pointercancel', close);
stage.addEventListener('lostpointercapture', close);
stage.addEventListener('keydown', e => {
  if (e.key !== ' ' && e.key !== 'Enter') return;
  e.preventDefault();
  if (!e.repeat) open();
});
stage.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') close(); });
stage.addEventListener('blur', close);

/* ---------- bar ---------- */
function popover(box, btn) {
  const set = on => { box.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!box.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
const expoEl = document.getElementById('expo');
expoEl.value = String(opts.expo);
expoEl.addEventListener('input', () => { opts.expo = +expoEl.value; save('expo', opts.expo); queuePreExpose(); wake(); });
choices(document.getElementById('sky'), v => { opts.sky = v; save('sky', v); setCamera(); preExpose(); render(); wake(); }).set(opts.sky);
choices(document.getElementById('count'), v => { opts.count = +v; save('count', v); preExpose(); render(); wake(); }).set(String(opts.count));
choices(document.getElementById('tint'), v => { opts.tint = v; save('tint', v); render(); wake(); }).set(opts.tint);
choices(document.getElementById('meteors'), v => { opts.meteors = +v; save('meteors', v); }).set(String(opts.meteors));
document.getElementById('clear').addEventListener('click', () => { clearAcc(); closedAt = -1e9; render(); });

/* ---------- start ---------- */
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
resize();
render();
ready = true;
mark('first-frame');
requestAnimationFrame(() => canvas.classList.add('on'));
whenVisible(stage, v => { visible = v; if (v) wake(); });
wake();
</script>
