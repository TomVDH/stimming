<!doctype html>
<html lang="en">

<style>

}

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",

  }

<body>
<canvas id="c" aria-label="Wind farm blockout"></canvas>
<div class="cams" role="group" aria-label="Camera"></div>
<script type="module">
// Wind farm blockout: one still frame per camera, in three.js.
// One shared fog function feeds the sky, sea, turbines and lights.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const canvas = document.getElementById('c');

/* ---------- look: murk ---------- */
// Colours are linear light.
const LOOK = {
  zen: [0.012, 0.02, 0.036], hor: [0.02, 0.03, 0.045],
  fog: [0.024, 0.036, 0.055], sun: [0.05, 0.075, 0.11],
  deep: [0.001, 0.003, 0.006], paint: [0.3, 0.34, 0.4],
  red: [1, 0.012, 0],
};

/* ---------- farm ---------- */
// Rows of turbines 900 m apart along the row, rows 800 m apart.
// Row 0 starts 1.5 km out and runs away almost along the sea camera's view.
// Seen on the long lens, it steps right and shrinks into the fog.
const FIRST = [-76, -1500], ALONG = 2.4 * Math.PI / 180, SU = 900, SV = 800;
const ROWS = [-6, 2], PER_ROW = 17;
function rand(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const farm = [];
{
  const u = [Math.sin(ALONG), -Math.cos(ALONG)], v = [Math.cos(ALONG), Math.sin(ALONG)];
  for (let j = ROWS[0]; j <= ROWS[1]; j++) for (let i = 0; i < PER_ROW; i++) {
    // Rows start staggered, so the farm edge runs at an angle.
    const k = (j + 10) * 31 + i, i0 = j < 0 ? -j : 0;
    const x = FIRST[0] + (i + i0) * SU * u[0] + j * SV * v[0] + (rand(k) - 0.5) * 40;
    const z = FIRST[1] + (i + i0) * SU * u[1] + j * SV * v[1] + (rand(k + 99) - 0.5) * 40;
    farm.push([x, z, rand(k + 7) * 2.094]);
  }
}
// All rotors face the wind, which comes from the right.
const YAW = -0.35;

/* ---------- shared uniforms ---------- */
const U = {
  uRes: { value: new THREE.Vector2(1, 1) },
  uFocal: { value: 1 },
  uSD: { value: new THREE.Vector3(0.1, 0.02, -1).normalize() },
  uZen: { value: new THREE.Vector3(...LOOK.zen) }, uHorC: { value: new THREE.Vector3(...LOOK.hor) },
  uFog: { value: new THREE.Vector3(...LOOK.fog) }, uSun: { value: new THREE.Vector3(...LOOK.sun) },
  uDeep: { value: new THREE.Vector3(...LOOK.deep) }, uPaint: { value: new THREE.Vector3(...LOOK.paint) },
  uRed: { value: new THREE.Vector3(...LOOK.red) },
  uCamWorld: { value: new THREE.Matrix4() }, uInvProj: { value: new THREE.Matrix4() },
};

/* ---------- fog ---------- */
// Fog is a short ray march through height layers and drifting banks.
// Sixteen steps, spaced wider with distance, jittered per pixel.
// The jitter shows as grain, which the look wants.
const FOG = `
uniform vec3 uSD, uFog, uSun;
float hash12(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y);
}
float fbm3(vec2 p) { return 0.5 * vnoise(p) + 0.3 * vnoise(p * 2.03 + 7.1) + 0.2 * vnoise(p * 4.1 + 3.3); }
// Extinction per metre at a world point.
float fogSigma(vec3 p) {
  float y = max(p.y, 0.0);
  // A base layer that hugs the sea, broken into banks a few km wide.
  float bank = 0.25 + 1.5 * smoothstep(0.3, 0.7, fbm3(p.xz / 2200.0));
  float s = exp(-y / 55.0) * bank / 3200.0;
  // A low sheet at 35 m and a deck at 72 m; the hubs stand clear of it.
  s += exp(-pow((y - 35.0) / 14.0, 2.0)) * smoothstep(0.5, 0.68, fbm3(p.xz / 900.0 + 11.0)) / 900.0;
  s += exp(-pow((y - 72.0) / 16.0, 2.0)) * smoothstep(0.45, 0.72, fbm3(p.xz / 1400.0 + 23.0)) / 380.0;
  // Dense low banks sit between the rows, clear of the sea camera.
  // The lane along row 0 stays clear, so the sea camera sees down it.
  float lane = smoothstep(180.0, 520.0, abs(dot(p.xz - vec2(-76.0, -1500.0), vec2(0.9991, 0.0419))));
  s += smoothstep(0.5, 0.75, fbm3(p.xz / 1700.0 + 5.0)) * exp(-y / 55.0) * lane / 140.0;
  return s;
}
// Light the fog sends toward the eye: murk plus a dull glow round the sun.
vec3 fogLight(vec3 d) {
  float a = acos(clamp(dot(d, uSD), -1.0, 1.0));
  return uFog + uSun * (0.5 * exp(-a / 0.12) + 0.3 * exp(-a / 0.5));
}
// March from ro along d to tMax. Returns inscatter in rgb, transmittance in a.
vec4 fogMarch(vec3 ro, vec3 d, float tMax, float jitter) {
  // The fog ends at 320 m: rays start where they enter it and stop where they leave.
  float tS = 0.0;
  if (ro.y > 320.0) { if (d.y >= 0.0) return vec4(0.0, 0.0, 0.0, 1.0); tS = (ro.y - 320.0) / -d.y; }
  if (d.y > 0.0) tMax = min(tMax, max(320.0 - ro.y, 0.0) / d.y);
  if (tMax <= tS) return vec4(0.0, 0.0, 0.0, 1.0);
  vec3 o = ro + d * tS;
  float len = tMax - tS;
  float T = 1.0, t0 = 0.0;
  const int N = 16;
  float tMin = 12.0;
  vec3 L = fogLight(d);
  vec3 S = vec3(0.0);
  for (int i = 1; i <= N; i++) {
    float t1 = len <= tMin ? len * float(i) / float(N) : tMin * pow(len / tMin, (float(i) - 1.0 + jitter) / float(N - 1));
    t1 = min(t1, len);
    float dt = t1 - t0;
    if (dt <= 0.0) continue;
    float a = exp(-fogSigma(o + d * (t0 + dt * 0.5)) * dt);
    S += T * (1.0 - a) * L;
    T *= a;
    t0 = t1;
  }
  return vec4(S, T);
}
`;

/* ---------- sky and sea ---------- */
const BACK_FS = FOG + `
uniform vec2 uRes;
uniform mat4 uCamWorld, uInvProj;
uniform vec3 uZen, uHorC, uDeep;
// Sky: a near-black zenith; the horizon takes the colour of deep fog.
vec3 sky(vec3 d) {
  float e = max(d.y, 0.0);
  return mix(fogLight(d), uZen, smoothstep(0.0, 0.9, e));
}
// Swell: a few long waves; each fades once a pixel spans its length.
vec3 seaNormal(vec2 p, float fp) {
  vec2 g = vec2(0.0);
  const vec3 W[5] = vec3[5](vec3(0.9, 0.42, 0.05), vec3(-0.5, 0.86, 0.08), vec3(0.2, 0.98, 0.13), vec3(0.95, -0.3, 0.21), vec3(-0.75, 0.66, 0.34));
  for (int i = 0; i < 5; i++) {
    vec2 dd = normalize(W[i].xy); float k = W[i].z;
    g += dd * cos(dot(p, dd) * k + float(i) * 1.7) * 0.03 * clamp(1.0 - fp * k / 2.1, 0.0, 1.0);
  }
  return normalize(vec3(-g.x, 1.0, -g.y));
}
void main() {
  vec2 ndc = gl_FragCoord.xy / uRes * 2.0 - 1.0;
  vec4 v = uInvProj * vec4(ndc, 1.0, 1.0);
  vec3 d = normalize((uCamWorld * vec4(v.xyz / v.w, 0.0)).xyz);
  vec3 ro = cameraPosition;
  vec3 c; float tMax = 30000.0;
  if (d.y >= 0.0) c = sky(d);
  else {
    float t = ro.y / -d.y;
    tMax = t;
    vec3 p = ro + d * t;
    // A pixel's footprint on the sea grows with distance and grazing angle.
    float fp = t / max(-d.y, 0.02) / 1500.0;
    vec3 n = seaNormal(p.xz, fp);
    vec3 r = reflect(d, n); r.y = abs(r.y);
    float fr = 0.02 + 0.98 * pow(1.0 - max(dot(-d, n), 0.0), 5.0);
    vec4 fr4 = fogMarch(p, r, 4000.0, 0.5);
    c = mix(uDeep, sky(r) * fr4.a + fr4.rgb, fr * 0.8);
  }
  vec4 f = fogMarch(ro, d, tMax, hash12(gl_FragCoord.xy));
  gl_FragColor = vec4(c * f.a + f.rgb, 1.0);
}`;

/* ---------- turbines ---------- */
// Parts: 0 tower, 1 nacelle, 2 blade.
const TURB_VS = `
attribute float aPart;
attribute float aAngle;
varying vec3 vW;
varying vec3 vN;
// The rotor turns about the hub axis, which runs along local z.
const vec3 HUB = vec3(0.0, 112.0, 6.0);
uniform float uYaw;
vec3 yaw(vec3 v) { float c = cos(uYaw), s = sin(uYaw); return vec3(c * v.x + s * v.z, v.y, -s * v.x + c * v.z); }
void main() {
  vec3 p = position, n = normal;
  if (aPart > 1.5) {
    float c = cos(aAngle), s = sin(aAngle);
    p.xy = HUB.xy + mat2(c, s, -s, c) * (p.xy - HUB.xy);
    n.xy = mat2(c, s, -s, c) * n.xy;
  }
  p = yaw(p); n = yaw(n);
  vec4 w = modelMatrix * instanceMatrix * vec4(p, 1.0);
  vW = w.xyz; vN = n;
  gl_Position = projectionMatrix * viewMatrix * w;
}`;
const TURB_FS = FOG + `
uniform vec3 uPaint, uZen, uHorC, uDeep;
varying vec3 vW;
varying vec3 vN;
void main() {
  vec3 d = normalize(vW - cameraPosition);
  float t = length(vW - cameraPosition);
  vec3 n = normalize(vN);
  if (dot(n, d) > 0.0) n = -n;
  // Fog light from all round, darker from the sea below.
  float up = n.y * 0.5 + 0.5;
  vec3 amb = mix(uFog * 0.15, uFog * 0.6 + uZen * 1.2, up);
  vec3 c = uPaint * (amb + uSun * 0.35 * max(dot(n, uSD), 0.0));
  vec4 f = fogMarch(cameraPosition, d, t, hash12(gl_FragCoord.xy));
  gl_FragColor = vec4(c * f.a + f.rgb, 1.0);
}`;

// One turbine in metres: tower 110 m, rotor radius 80 m.
function turbineGeometry() {
  const P = [], N = [], K = [];
  const tri = (a, b, c, n, k) => { P.push(...a, ...b, ...c); for (let i = 0; i < 3; i++) { N.push(...n); K.push(k); } };
  const quad = (a, b, c, d, n, k) => { tri(a, b, c, n, k); tri(a, c, d, n, k); };
  // Tower: a tapered tube with twelve sides.
  const S = 12, R0 = 3.6, R1 = 2.2, H = 110;
  for (let i = 0; i < S; i++) {
    const a0 = i / S * Math.PI * 2, a1 = (i + 1) / S * Math.PI * 2, am = (a0 + a1) / 2;
    quad([Math.cos(a0) * R0, 0, Math.sin(a0) * R0], [Math.cos(a0) * R1, H, Math.sin(a0) * R1],
      [Math.cos(a1) * R1, H, Math.sin(a1) * R1], [Math.cos(a1) * R0, 0, Math.sin(a1) * R0], [Math.cos(am), 0.012, Math.sin(am)], 0);
  }
  // Nacelle: a box from the tower top to the hub.
  const box = (x0, x1, y0, y1, z0, z1, k) => {
    quad([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], [0, 0, 1], k);
    quad([x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0], [0, 0, -1], k);
    quad([x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [1, 0, 0], k);
    quad([x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], [-1, 0, 0], k);
    quad([x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0], [0, 1, 0], k);
    quad([x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], [0, -1, 0], k);
  };
  box(-2.4, 2.4, 109, 115, -9, 5, 1);
  box(-1.6, 1.6, 110.4, 113.6, 5, 7.5, 1);
  // Blades: three flat tapers in the rotor plane, slightly swept.
  const L = 80;
  for (let b = 0; b < 3; b++) {
    const a = b * Math.PI * 2 / 3, ca = Math.cos(a), sa = Math.sin(a);
    const at = (r, c) => [ca * c - sa * r, 112 + sa * c + ca * r, 6.6];
    const root = 1.6, chord = 3.4, tip = 0.5, sweep = 1.8;
    const p = [at(1.5, -root), at(1.5, root), at(L * 0.22, chord), at(L, tip + sweep), at(L, sweep - tip), at(L * 0.22, -chord * 0.4)];
    const n = [0, 0, 1];
    tri(p[0], p[1], p[2], n, 2); tri(p[0], p[2], p[5], n, 2);
    tri(p[5], p[2], p[3], n, 2); tri(p[5], p[3], p[4], n, 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
  g.setAttribute('aPart', new THREE.Float32BufferAttribute(K, 1));
  return g;
}

/* ---------- aviation lights ---------- */
// Each turbine carries one light on the nacelle and three round the tower.
// A core sprite holds the lamp; a halo sprite grows with the fog in front.
const LIGHT_VS = FOG + `
attribute float aKind;
uniform float uFocal, uHalo;
varying float vT;
varying float vTau;
void main() {
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  gl_Position = projectionMatrix * mv;
  float t = -mv.z;
  vec3 d = normalize(position - cameraPosition);
  vec4 f = fogMarch(cameraPosition, d, length(position - cameraPosition), 0.5);
  vT = f.a; vTau = -log(max(f.a, 1e-4));
  // The nacelle lamp is larger than the tower lamps.
  float lamp = aKind > 0.5 ? 1.2 : 2.2;
  float core = max(1.6, lamp * uFocal / t);
  gl_PointSize = uHalo > 0.5 ? min(core * (3.0 + 6.0 * min(vTau, 2.5)), 160.0) : core * 2.0;
}`;
const LIGHT_FS = `
uniform vec3 uRed;
uniform float uHalo;
varying float vT;
varying float vTau;
void main() {
  vec2 q = gl_PointCoord * 2.0 - 1.0;
  float r2 = dot(q, q);
  if (r2 > 1.0) discard;
  // Both sprites fall to zero at the rim, so no edge shows.
  float edge = (1.0 - r2) * (1.0 - r2);
  float k = uHalo > 0.5
    ? exp(-r2 * 2.5) * edge * 0.9 * min(vTau, 2.5) * vT
    : exp(-r2 * 9.0) * edge * 12.0 * vT;
  gl_FragColor = vec4(uRed * k, 1.0);
}`;
function lightGeometry() {
  const P = [], K = [];
  const c = Math.cos(YAW), s = Math.sin(YAW);
  for (const [x, z] of farm) {
    // Nacelle top, toward the rear.
    const lx = 0, lz = -5;
    P.push(x + c * lx + s * lz, 115.6, z - s * lx + c * lz); K.push(0);
    for (let k = 0; k < 3; k++) {
      const a = k * 2.094 + 0.4;
      P.push(x + Math.cos(a) * 3.3, 62, z + Math.sin(a) * 3.3); K.push(1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('aKind', new THREE.Float32BufferAttribute(K, 1));
  return g;
}

/* ---------- scene ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
// The grade pass does the curve and gamma, so targets hold linear light.
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(10, 1, 5, 40000);
camera.rotation.order = 'YXZ';

const back = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: U, depthTest: false, depthWrite: false,
  vertexShader: 'void main() { gl_Position = vec4(position.xy, 1.0, 1.0); }',
  fragmentShader: BACK_FS,
}));
back.frustumCulled = false; back.renderOrder = -10;
scene.add(back);

const turbines = new THREE.InstancedMesh(turbineGeometry(), new THREE.ShaderMaterial({
  uniforms: { ...U, uYaw: { value: YAW } }, vertexShader: TURB_VS, fragmentShader: TURB_FS, side: THREE.DoubleSide,
}), farm.length);
{
  const m = new THREE.Matrix4(), ang = new Float32Array(farm.length);
  farm.forEach(([x, z, a], i) => { m.makeTranslation(x, 0, z); turbines.setMatrixAt(i, m); ang[i] = a; });
  turbines.geometry.setAttribute('aAngle', new THREE.InstancedBufferAttribute(ang, 1));
}
turbines.frustumCulled = false;
scene.add(turbines);

const lightGeo = lightGeometry();
for (const halo of [0, 1]) {
  const pts = new THREE.Points(lightGeo, new THREE.ShaderMaterial({
    uniforms: { ...U, uHalo: { value: halo } }, vertexShader: LIGHT_VS, fragmentShader: LIGHT_FS,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  }));
  pts.frustumCulled = false; pts.renderOrder = 5 + halo;
  scene.add(pts);
}

/* ---------- post ---------- */
// Bloom runs at half size; the grade adds the curve, vignette and grain.
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.45, 0.85, 1.2);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uRes: U.uRes, uExp: { value: 1.8 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
uniform sampler2D tDiffuse;
uniform vec2 uRes;
uniform float uExp;
varying vec2 vUv;
float hash12(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
// ACES: the fitted RRT and ODT, with its input and output matrices.
const mat3 ACES_IN = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
const mat3 ACES_OUT = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
vec3 rrtOdt(vec3 v) { return (v * (v + 0.0245786) - 0.000090537) / (v * (0.983729 * v + 0.4329510) + 0.238081); }
void main() {
  vec3 c = texture2D(tDiffuse, vUv).rgb * uExp;
  // A cool white balance pushes the murk toward blue.
  c *= vec3(0.86, 0.98, 1.18);
  c = clamp(ACES_OUT * rrtOdt(ACES_IN * c), 0.0, 1.0);
  vec2 q = (vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
  c *= 1.0 - 0.4 * dot(q, q);
  c = pow(c, vec3(1.0 / 2.2));
  // Split tone: shadows lean blue, a little contrast in the mids.
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c += vec3(-0.012, 0.0, 0.03) * (1.0 - smoothstep(0.0, 0.5, l));
  c = mix(c, c * c * (3.0 - 2.0 * c), 0.35);
  // Film grain, strongest in the mid tones.
  float g = hash12(gl_FragCoord.xy) + hash12(gl_FragCoord.xy + 71.3) - 1.0;
  c += g * 0.04 * (0.4 + c * (1.0 - c) * 2.4);
  gl_FragColor = vec4(c, 1.0);
}`,
});
composer.addPass(grade);

/* ---------- cameras ---------- */
// The ground position of turbine i in row j, without jitter.
function at(i, j) {
  const u = [Math.sin(ALONG), -Math.cos(ALONG)], v = [Math.cos(ALONG), Math.sin(ALONG)];
  return [FIRST[0] + i * SU * u[0] + j * SV * v[0], FIRST[1] + i * SU * u[1] + j * SV * v[1]];
}
// Yaw that turns the camera from pos toward a ground point.
const aim = (pos, [x, z]) => Math.atan2(-(x - pos[0]), -(z - pos[2]));
// Each camera returns its position, yaw, pitch and focal length in pixels.
const CAMS = [
  // Rows: a long telephoto down one row; the near rotors loom.
  { name: 'Rows', shot: (W, H, tall) => {
    const f = W * 5.9 * (1 - tall) + H * 5.2 * tall;
    const hor = 0.74 + 0.06 * tall;
    return { pos: [0, 10, 0], yaw: -0.012 * tall, pitch: Math.atan((hor - 0.5) * H / f), f };
  } },
  // Foot: on the water by one tower, looking up into its rotor.
  { name: 'Foot', shot: (W, H, tall) => {
    // The camera stands in front of the rotor, so the blades show face-on.
    const [x, z] = at(0, 0), pos = [x - 25, 6, z + 125];
    const f = H * (0.72 - 0.22 * tall);
    return { pos, yaw: aim(pos, [x, z]) - 0.32 * (1 - tall) - 0.1, pitch: 0.5, f, exp: 2.6 };
  } },
  // Above: high and oblique over the farm; fog banks lie between the rows.
  { name: 'Above', shot: (W, H, tall) => {
    const pos = [1400, 420, -600];
    const f = W * 2.0 * (1 - tall) + H * 1.5 * tall;
    return { pos, yaw: aim(pos, at(7, -3)), pitch: -0.2, f, exp: 3.4 };
  } },
  // Across: a boat between two rows, looking out across the farm.
  { name: 'Across', shot: (W, H, tall) => {
    const [x, z] = at(4, 0), pos = [x - 400, 8, z];
    const f = W * 1.5 * (1 - tall) + H * 1.3 * tall;
    return { pos, yaw: aim(pos, at(12, -5)), pitch: Math.atan(0.2 * H / f), f, exp: 2.2 };
  } },
  // Hub: on top of one nacelle, looking down the row at eye level with the lights.
  { name: 'Hub', shot: (W, H, tall) => {
    const [x, z] = at(0, 0), pos = [x + 40, 119, z - 10];
    const f = W * 4.2 * (1 - tall) + H * 3.4 * tall;
    return { pos, yaw: aim(pos, at(8, 0)) + 0.02, pitch: -0.012, f };
  } },
  // Grid: outside the farm's side, looking through the rows on a long lens.
  { name: 'Grid', shot: (W, H, tall) => {
    const [x, z] = at(4, 2.6), pos = [x, 22, z];
    const f = W * 3.2 * (1 - tall) + H * 2.8 * tall;
    return { pos, yaw: aim(pos, at(9, -6)), pitch: Math.atan(0.2 * H / f), f, exp: 2 };
  } },
];
const bar = document.querySelector('.cams');
CAMS.forEach((c, i) => {
  const b = document.createElement('button');
  b.textContent = c.name; b.dataset.cam = i;
  bar.append(b);
});
let cam = Math.max(0, Math.min(CAMS.length - 1, Number(new URLSearchParams(location.search).get('cam') ?? 0) || 0));

function frame() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
  const W = Math.round(w * dpr), H = Math.round(h * dpr);
  const tall = Math.min(1, Math.max(0, (H / W - 0.8) / 1.4));
  const c = CAMS[cam].shot(W, H, tall);
  camera.aspect = W / H;
  camera.fov = 2 * Math.atan(H / 2 / c.f) * 180 / Math.PI;
  camera.position.set(...c.pos);
  camera.rotation.set(c.pitch, c.yaw, 0);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  U.uRes.value.set(W, H);
  U.uFocal.value = c.f;
  U.uCamWorld.value.copy(camera.matrixWorld);
  U.uInvProj.value.copy(camera.projectionMatrixInverse);
  // A cold glow sits low, far down the row.
  U.uSD.value.set(0.05, 0.01, -1).normalize();
  grade.uniforms.uExp.value = c.exp ?? 1.8;
  composer.render();
}

document.querySelectorAll('.cams button').forEach(b => b.addEventListener('click', () => {
  cam = Number(b.dataset.cam);
  document.querySelectorAll('.cams button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  frame();
}));
document.querySelectorAll('.cams button').forEach(x => x.setAttribute('aria-pressed', String(Number(x.dataset.cam) === cam)));
addEventListener('keydown', e => { const n = Number(e.key); if (n >= 1 && n <= CAMS.length) document.querySelector(`[data-cam="${n - 1}"]`).click(); });
addEventListener('resize', frame);
frame();
</script>
</body>
