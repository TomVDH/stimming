<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lava lamp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",

<style>
/* Lava lamp: a soft clay lamp floating in the dark. */
:root { --stage: oklch(0.13 0.02 30); }
.stage--lava { cursor: grab; }
.stage--lava.held { cursor: grabbing; }
/* Each swatch shows the wax over its liquid. */
.sw { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--w) 0 50%, var(--l) 50% 100%); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Lava lamp</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--lava" id="stage" tabindex="0" role="application" aria-label="A lava lamp. Drag a blob to pull it apart, hold the liquid to warm it, drag around the lamp to tip it. Arrow keys tip it, F flips it, Space warms the bulb.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Lava lamp needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" role="group" aria-label="Colours">
        <button class="chip" type="button" data-value="classic" aria-pressed="true"><span class="sw" style="--w: oklch(0.82 0.16 70); --l: oklch(0.5 0.2 25)" aria-hidden="true"></span>Classic</button>
        <button class="chip" type="button" data-value="violet" aria-pressed="false"><span class="sw" style="--w: oklch(0.8 0.15 350); --l: oklch(0.45 0.2 305)" aria-hidden="true"></span>Violet</button>
        <button class="chip" type="button" data-value="sea" aria-pressed="false"><span class="sw" style="--w: oklch(0.82 0.13 182); --l: oklch(0.38 0.15 260)" aria-hidden="true"></span>Sea</button>
      </div>
      <div class="actions">
        <button class="chip" id="flip" type="button" aria-keyshortcuts="F">Flip</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag a blob</dt><dd>pull it apart</dd></div>
        <div><dt>Hold the liquid</dt><dd>warm it</dd></div>
        <div><dt>Drag the lamp</dt><dd>tip it</dd></div>
        <div class="fine"><dt><kbd>Arrows</kbd> <kbd>F</kbd></dt><dd>tip, flip</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Lava lamp</h1><div class="vignette" hidden></div></section>
</div>

<script type="module">
import { gsap } from 'gsap';
import { initPage, sound, audioKit, choices, reduced, onReducedChange, linFit } from '../shared/stim.js';
initPage({ id: 'lava' });
const panel = document.getElementById('stage'), canvas = panel.querySelector('canvas');
let reduce = reduced();
onReducedChange(v => { reduce = v; wake(); });
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));
const nextFrame = () => new Promise(r => requestAnimationFrame(r));

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
// Hot and cool wax, liquid glow, liquid tint, clay body, backdrop.
function palette(hot, cool, liq, tint, body, bg) {

  const abs = T.map(v => -Math.log(Math.max(v, 0.002)) * 1.7);
  const glow = Lq.map((v, i) => v * 0.75 + H[i] * 0.3);
  return [...H, ...linFit(...cool), ...Lq, ...abs, ...glow, ...linFit(...body), ...linFit(...bg)];
}
const PALS = {
  classic: palette([0.84, 0.19, 78], [0.64, 0.22, 44], [0.5, 0.21, 27], [0.64, 0.2, 30], [0.34, 0.08, 18], [0.17, 0.03, 30]),
  violet: palette([0.82, 0.15, 352], [0.62, 0.22, 356], [0.42, 0.2, 304], [0.56, 0.2, 302], [0.33, 0.08, 300], [0.16, 0.03, 300]),
  sea: palette([0.86, 0.15, 172], [0.68, 0.14, 190], [0.38, 0.15, 258], [0.52, 0.15, 254], [0.35, 0.06, 236], [0.16, 0.03, 250]),
};
let palName = 'classic';
const pal = Float32Array.from(PALS.classic);

/* ---------- the lamp: units are lamp heights, y runs up the lamp ---------- */
// The glass runs from Y0 to Y1; TH is its wall.
const Y0 = 0.27, Y1 = 0.865, TH = 0.004, KB = 0.036, MAXB = 12, MINB = 6, MAXG = 4;
// The glass profile: a wide bulb, then a long taper, with a soft shoulder.
function prof(y) {
  const l1 = 0.118 + (y - Y0) * 0.62, l2 = 0.212 - (y - 0.43) * 0.24;
  const h = clamp(0.5 + (0.5 * (l2 - l1)) / 0.07);
  return lerp(l2, l1, h) - 0.07 * h * (1 - h);
}
const inR = y => prof(y) - TH;
const TOP = Y1 - TH - 0.003;
// The lamp turns about its middle; the camera looks at that point.
const PIV = 0.5;
const CAM = { pos: [0, 0.6, 2.6], at: [0, PIV, 0] };
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm3 = v => { const l = Math.hypot(...v); return v.map(x => x / l); };

const CZ = norm3(sub3(CAM.at, CAM.pos)), CX = norm3(cross3(CZ, [0, 1, 0])), CY = cross3(CX, CZ);
let tanF = 0.23;
// The key light comes from the upper left, in front.
const KEY = norm3([-0.5, 0.72, 0.6]);

/* ---------- the lamp's pose: tipped by hand, flipped by GSAP ---------- */
// th is the angle; w is the turn rate; rest is where it settles.
const lamp = { th: 0, w: 0, rest: 0, grab: null, tw: null, prev: 0 };
// World up and the pool's surface normal, both in the lamp frame.
let up = [0, 1], pn = [0, 1], pa = 0, pw = 0;
function lampStep(h) {
  if (!lamp.tw) {
    if (lamp.grab !== null) lamp.w += ((lamp.grab - lamp.th) * 140 - lamp.w * 18) * h;
    // A released lamp rocks back to rest, upright or upside down.
    else lamp.w += ((lamp.rest - lamp.th) * 26 - lamp.w * 3.4) * h;
    lamp.th += lamp.w * h;
    if (lamp.grab === null && Math.abs(lamp.rest - lamp.th) < 1e-4 && Math.abs(lamp.w) < 1e-3) { lamp.th = lamp.rest; lamp.w = 0; }
  }
  up = [Math.sin(lamp.th), Math.cos(lamp.th)];
  // The pool surface leans toward level, then sloshes.
  const a = Math.atan2(up[0], up[1]), aa = Math.abs(a);
  const target = Math.sign(a) * Math.min(0.7, 0.75 * Math.min(aa, Math.PI - aa));
  pw += ((target - pa) * 34 - pw * 3) * h;
  pa += pw * h;
  pn = [Math.sin(pa), Math.cos(pa)];
}

/* ---------- sound: Tone.js voices on the shared audio kit ---------- */
const LEAD = 0.004;
const kit = audioKit({ keys: new Set([' ', 'Enter', 'f', 'F', 'ArrowLeft', 'ArrowRight']) });
let T = null, V = null, toneLoad = null, gloopNext = 0, humAt = 0, creakL = 0;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// The first live call loads Tone; the voices answer once it lands.
function voices() {
  if (!kit.live()) return null;
  if (V) return V;
  toneLoad ||= kit.tone().then(m => {
    toneLoad = null;
    if (m && !V) { T = m; V = buildVoices(); }
  });
  return null;
}
function buildVoices() {
  // The bulb hums at twice the mains rate, low and faint.
  const hum = new T.Gain(0).connect(kit.out);
  const hlp = new T.Filter({ type: 'lowpass', frequency: 340, Q: 0.6 }).connect(hum);
  for (const [f, db, type] of [[100, -6, 'sine'], [100.35, -12, 'sine'], [200, -16, 'sine'], [300, -28, 'triangle']]) {
    new T.Oscillator({ frequency: f, type, volume: db }).connect(hlp).start();
  }
  // A stretching neck creaks: trembling noise in a narrow band.
  const creak = new T.Gain(0).connect(kit.out);
  const trem = new T.Tremolo({ frequency: 19, depth: 0.75 }).connect(creak).start();
  const cf = new T.Filter({ type: 'bandpass', Q: 7, frequency: 240 }).connect(trem);
  new T.Noise('pink').connect(cf).start();
  // A turning lamp sloshes: brown noise through a moving lowpass.
  const slosh = new T.Gain(0).connect(kit.out);
  const sf = new T.Filter({ type: 'lowpass', frequency: 260, Q: 3 }).connect(slosh);
  new T.Noise('brown').connect(sf).start();
  // Gloops: sine voices with a pitch slide, taken in turn.
  const gl = new T.Filter({ type: 'lowpass', frequency: 640, Q: 1.1 }).connect(kit.out);
  const gloops = Array.from({ length: 4 }, () => new T.Synth({
    oscillator: { partials: [1, 0.18] }, envelope: { attack: 0.014, decay: 0.24, sustain: 0, release: 0.1 }, volume: -8,
  }).connect(gl));
  return { hum, creak, cf, slosh, sf, gloops, gi: 0 };
}
// A warm low gloop marks each pinch, tear and merge.
// It rises on a pinch and falls on a merge.
function gloop(size, rise, k = 1) {
  if (seeding || !sound.on) return;
  const v = voices();
  if (!v) return;
  const t = kit.ac.currentTime + LEAD;
  if (t < gloopNext) return;
  gloopNext = t + rand(0.16, 0.3);
  const f = lerp(190, 78, clamp((size - 0.02) / 0.04)) * jit(0.06);
  const [f0, f1, f2] = rise ? [f * 0.78, f * 1.45, f * 1.3] : [f * 1.35, f * 0.95, f * 0.72];
  const s = v.gloops[v.gi++ % v.gloops.length];
  s.triggerAttackRelease(f0, 0.1, t, clamp(0.75 * k * jit(0.08)));
  s.frequency.setValueAtTime(f0, t);
  s.frequency.exponentialRampToValueAtTime(f1, t + 0.07);
  s.frequency.exponentialRampToValueAtTime(f2, t + 0.26);
}
// Creak, slosh and hum follow the lamp each frame.
function soundFrame(now, dt) {
  if (!sound.on) return;
  const v = voices();
  if (!v) return;
  let c = 0;
  for (const b of blobs) {
    if (!b.body || b.rejoin) continue;
    c = Math.max(c, b.u * clamp((Math.abs(b.u - b.u0) / Math.max(dt, 1e-3)) * 1.5));
    b.u0 = b.u;
  }
  creakL += (c - creakL) * (1 - Math.exp(-dt / 0.05));
  v.creak.gain.rampTo(0.2 * creakL, 0.05);
  v.cf.frequency.rampTo(200 + 260 * creakL, 0.05);
  const sl = clamp(Math.abs(lamp.w) / 5 + Math.abs(pw) / 4);
  v.slosh.gain.rampTo(0.55 * sl, 0.08);
  v.sf.frequency.rampTo(180 + 420 * sl, 0.08);
  if (now - humAt > 250) {
    humAt = now;
    v.hum.gain.rampTo((0.015 + 0.024 * warm + 0.012 * fingers()) * heat, 0.35);
  }
}

/* ---------- the wax: blobs, a pool, heat and hands ---------- */
const G = 0.38, T0 = 0.45, DRAG = 1.3, V0 = 9e-4;
const IDLE = () => (reduce ? 25 : 150);
// A lobe pulled from the pool hangs on this marker.
const POOL = { pool: true };
let blobs = [], poolV = V0, poolY = 0.325, heat = 1, warm = 0, spawnAcc = 0, simT = 0, idleT = 0, nextId = 1;
let seeding = false, motion = 1, coldT = 0;
const poolLevel = () => clamp(0.325 + (poolV - V0) * 14, 0.305, 0.35);
// Height above the pool surface, along its normal.
const poolDist = (x, y) => x * pn[0] + (y - poolY) * pn[1];
function makeBlob(o) {
  return Object.assign({
    x: 0, y: 0.5, z: 0, vx: 0, vy: 0, vz: 0, r: 0.04, rt: 0.04, s: 1, lean: 0, T: 0.5, lat: 0, hot: 0, u: 0, u0: 0,
    state: 'free', sib: null, sibT: 0, fromPool: false, flash: 0, grab: null, top: false, body: null, tug: null, rejoin: false, id: nextId++,
  }, o);
}
// A mound sits on the pool and rises along its normal as it grows.
function placeMound(b, k) {
  const o = -b.r * 0.55 + b.r * 0.8 * k;
  b.x = b.lat * pn[1] + pn[0] * o;
  b.y = poolY - b.lat * pn[0] + pn[1] * o;
}
// A fresh mound swells out of the pool.
function spawn(lat, z) {
  if (blobs.length >= MAXB) return null;
  const a = rand(0, TAU), rr = Math.sqrt(Math.random()) * inR(poolY) * 0.55;
  const b = makeBlob({ lat: lat ?? Math.cos(a) * rr, z: z ?? Math.sin(a) * rr, r: 0.014, rt: rand(0.032, 0.052), T: 0.62, state: 'grow', fromPool: true });
  placeMound(b, 0);

  return b;
}
const half = b => b.r * b.s;
const wide = b => b.r / Math.sqrt(b.s);
const size = b => (wide(b) + half(b)) / 2;
function remove(b) {
  const i = blobs.indexOf(b);
  if (i >= 0) blobs.splice(i, 1);
  for (const o of blobs) {
    if (o.sib === b) o.sib = null;
    if (o.tug === b) o.tug = null;
    if (o.body === b) { o.body = null; o.rejoin = false; }
  }
}
// The first blob keeps the mass, momentum and heat of both.
function merge(a, b, k0 = 1) {
  const ma = a.r ** 3, mb = b.r ** 3, m = ma + mb, k = mb / m;
  const dx = Math.abs(b.x - a.x), dy = Math.abs(b.y - a.y);
  for (const p of ['x', 'y', 'z', 'vx', 'vy', 'vz', 'T']) a[p] = lerp(a[p], b[p], k);
  a.r = a.rt = Math.cbrt(m);
  // The pair's axis becomes the new blob's stretch.
  a.s = clamp(1 + (0.9 * (dy - dx)) / (a.r * 2), 0.8, 1.45);
  a.flash = Math.max(a.flash, b.flash, 0.4);
  a.fromPool = false;
  if (b.grab && !a.grab) a.grab = b.grab;
  if (a.tug === b) a.tug = null;
  for (const g of grabs.values()) if (g.b === b) g.b = a;
  remove(b);
  gloop(a.r, false, k0);

// A stretched blob necks into two along its axis.
function split(b, dx, dy) {
  if (blobs.length >= MAXB) return;
  const f = rand(0.42, 0.58), ra = b.r * Math.cbrt(f), rb = b.r * Math.cbrt(1 - f), h = half(b);
  const oa = Math.max(0, h - ra) * 0.9, ob = Math.max(0, h - rb) * 0.9;
  const c = makeBlob({ x: b.x - dx * ob, y: b.y - dy * ob, z: b.z, vx: b.vx - dx * 0.012, vy: b.vy - dy * 0.012, vz: b.vz, r: rb, rt: rb, s: 1.15, T: clamp(b.T - 0.05), lean: b.lean * 0.5 });
  b.x += dx * oa;
  b.y += dy * oa;
  b.vx += dx * 0.02;
  b.vy += dy * 0.02;
  b.r = b.rt = ra;
  b.s = 1.15;
  b.T = clamp(b.T + 0.05);
  b.sib = c;
  c.sib = b;
  b.sibT = c.sibT = 4;
  blobs.push(c);

// A neck snaps: the lobe stays on the finger, the body springs back.
function tear(g) {

    const dx = B.x - L.x, dy = B.y - L.y, d = Math.hypot(dx, dy) || 1;
    B.vx += (dx / d) * 0.12;
    B.vy += (dy / d) * 0.12;

    L.sib = B;
    B.sibT = L.sibT = 1.2;

// Total finger heat, for the light and the hum.
function fingers() {

  return s;
}
function step(h) {

  const turning = Math.abs(lamp.w) > 0.02 || Math.abs(pw) > 0.02;

    for (const g of grabs.values()) {
      if (g.kind !== 'heat') continue;
      const dx = g.x - b.x, dy = g.y - b.y, d = Math.hypot(dx, dy, b.z * 0.5) + 1e-6, e = g.s * Math.exp(-Math.max(d - size(b), 0) / 0.06);

    if (b.state === 'grow') {

      b.r = nr;
      const k = (b.r - 0.014) / (b.rt - 0.014);

      placeMound(b, k);
      b.vx = b.vy = 0;
      if ((k >= 1 && b.T > 0.58) || b.grab || !facing) { b.state = 'free'; b.vx = pn[0] * 0.004; b.vy = pn[1] * 0.004; }
      act += 0.01;

  new ResizeObserver(fit).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; sync(); }).observe(panel);
  document.addEventListener('visibilitychange', sync);
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
