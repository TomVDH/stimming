<script type="module">
import { gsap } from 'gsap';
import { initPage, sound, audioKit, choices, reduced, onReducedChange, linFit } from '../shared/stim.js';

const TAU = Math.PI * 2;

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
// Hot and cool wax, liquid glow, liquid tint.
function palette(hot, cool, liq, tint) {

  classic: palette([0.84, 0.19, 78], [0.64, 0.22, 44], [0.5, 0.21, 27], [0.64, 0.2, 30]),
  violet: palette([0.82, 0.15, 352], [0.62, 0.22, 356], [0.42, 0.2, 304], [0.56, 0.2, 302]),

let palName = 'classic';
const pal = Float32Array.from(PALS.classic);

/* ---------- the lamp: units are lamp heights, y runs up the lamp ---------- */

const Y0 = 0.27, Y1 = 0.865, TH = 0.004, KB = 0.036, MAXB = 12, MINB = 6, MAXG = 4;

const TOP = Y1 - TH - 0.003;
// The lamp stands on the desk at y = 0 and turns about its middle.
const PIV = 0.5;
const CAM = { pos: [0, 0.6, 2.5], at: [0, 0.482, 0] };
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];

// The key light comes from the upper left, in front.
const KEY = norm3([-0.5, 0.72, 0.6]);

/* ---------- the lamp in the hand: springs, a tip, a flip ---------- */
// th is the angle, w its rate, rest where it settles.

// World up and the pool's surface normal, both in the lamp frame.
let up = [0, 1], pn = [0, 1], pa = 0, pw = 0;

const LQ = { E: 0, S: [0, 0], D: [0.13, 0.41, 0.77] };
function lampStep(h) {

    if (lamp.grab !== null) lamp.w += ((lamp.grab - lamp.th) * 140 - lamp.w * 18) * h;
    // A released lamp rocks back to rest, upright or upside down.

    lamp.th += lamp.w * h;

/* ---------- the swirl: curl noise, as in the snow globe ---------- */
// A seeded source keeps the field the same on each load.
function rng(s) {
  return () => {
    s = (s + 0x6d2b79f5) | 0;

    const d = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];

/* ---------- sound: Tone.js voices on the shared audio kit ---------- */
const LEAD = 0.004;

// The first live call loads Tone; the voices answer once it lands.

    if (m && !V) { T = m; V = buildVoices(); }

  const cf = new T.Filter({ type: 'bandpass', Q: 7, frequency: 240 }).connect(trem);

// A warm low gloop marks each pinch, tear and merge.

/* ---------- the wax: blobs, a pool, heat and hands ---------- */

    }
  }
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  grabs.set(e.pointerId, g);
  retarget(g);
  if (g.kind !== 'heat') panel.classList.add('held');
});
panel.addEventListener('pointermove', e => {
  const g = grabs.get(e.pointerId);
  if (!g) return;
  idleT = 0;
  const [sx, sy] = local(e);
  g.sx = sx;
  g.sy = sy;
  if (g.kind === 'lift') {
    // The lamp follows the hand, from the desk up.
    const [wx, wy] = worldAt(rayAt(sx, sy), 0), mx = Math.max(0.06, (tanF * CAMD * W) / H - 0.24);
    lamp.tx = clamp(g.o0[0] + wx - g.w0[0], -mx, mx);
    lamp.ty = clamp(g.o0[1] + wy - g.w0[1], 0, 0.18);
    return;
  }
  if (g.kind === 'tip') {
    // Near the middle the angle is noise, so it holds.
    if (Math.hypot(sx - W / 2, sy - H / 2) < 30) return;
    const a = angleAt(sx, sy);
    g.acc += Math.atan2(Math.sin(a - g.a), Math.cos(a - g.a));
    g.a = a;
    lamp.grab = g.th0 + g.acc;
    return;
  }
  retarget(g);
});
function lift(e) {
  const g = grabs.get(e.pointerId);
  if (!g) return;
  grabs.delete(e.pointerId);
  if (g.kind === 'lift') {
    // Let go, the lamp drops back to its place on the desk.
    lamp.hand = false;
    lamp.grab = null;
    lamp.tx = lamp.ty = 0;
  } else if (g.kind === 'tip') {
    lamp.grab = null;
    lamp.rest = Math.round(lamp.th / Math.PI) * Math.PI;
  } else if (g.kind !== 'heat') {
    const L = g.b;
    L.grab = null;
    if (g.kind === 'blob' && L.body) { L.body.tug = null; L.rejoin = true; }
    if (g.kind === 'pool' && L.body) {
      L.body = null;
      // A short pull sinks back; a long one floats free.
      if (poolDist(L.x, L.y) < L.tearD * 0.6) L.state = 'sink';
      else L.T = Math.max(L.T, 0.8);
    }
  }
  if (![...grabs.values()].some(o => o.kind !== 'heat')) panel.classList.remove('held');
}
panel.addEventListener('pointerup', lift);
panel.addEventListener('pointercancel', lift);
panel.addEventListener('contextmenu', e => e.preventDefault());

// Flip turns the lamp over; the wax settles the other way.
function flip() {
  if (!ready) return;
  wake();
  if (lamp.tw) return;
  for (const [id, g] of grabs) if (g.kind === 'tip' || g.kind === 'lift') grabs.delete(id);
  panel.classList.remove('held');
  lamp.hand = false;
  lamp.grab = null;
  lamp.tx = lamp.ty = 0;
  lamp.rest = Math.round(lamp.th / Math.PI) * Math.PI + Math.PI;
  lamp.w = 0;
  lamp.prev = lamp.th;
  lamp.tw = gsap.to(lamp, {
    th: lamp.rest, duration: reduce ? 0.4 : 1.15, ease: reduce ? 'power2.inOut' : 'back.inOut(1.3)',
    onComplete: () => { lamp.tw = null; lamp.w = 0; },
  });
}
document.getElementById('flip').addEventListener('click', flip);

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented || !ready) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    // Chip groups keep their own arrows.
    if (e.target.closest?.('.choices')) return;
    e.preventDefault();
    wake();
    if (!lamp.tw) lamp.w += e.key === 'ArrowLeft' ? 2.4 : -2.4;
  } else if (e.key === 'f' || e.key === 'F') {
    if (!e.repeat) flip();
  } else if (e.key === ' ') {
    // Buttons and links keep Space for themselves.
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    wake();
    // Holding Space keeps the shake going.
    if (lamp.shakeT <= 0) lamp.shakeAge = 0;
    lamp.shakeT = Math.max(lamp.shakeT, e.repeat ? 0.4 : 0.95);
  }
});

choices(document.querySelector('.choices'), v => { palName = v; wake(); });
sound.onChange(on => { if (on) wake(); });

/* ---------- start: the shaders link while the wax is seeded ---------- */
function failed() {
  ready = false;
  sync();
  canvas.hidden = true;
  panel.querySelector('.fail').hidden = false;
  document.querySelectorAll('.bar .chip').forEach(c => { c.disabled = true; });
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; sync(); });
canvas.addEventListener('webglcontextrestored', async () => {
  try {
    await initGL();
    ready = true;
    fit();
    sync();
  } catch (err) { console.error(err); failed(); }
});
async function boot() {
  await idle();
  fit();
  let gate;
  try { gate = initGL(); } catch (err) { console.error(err); failed(); return; }
  gate.catch(() => {});
  await idle();
  buildCurl();
  seed();
  try { await gate; } catch (err) { console.error(err); failed(); return; }
  ready = true;
  fit();
  new ResizeObserver(fit).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; sync(); }).observe(panel);
  document.addEventListener('visibilitychange', sync);
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
