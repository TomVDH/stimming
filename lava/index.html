<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}/* The how-to line is as quiet as the home link. */
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 28px; }

}

<title>Lava lamp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600&display=swap">
<style>
/* Layout: header row, the lamp stage at full width, one chip row. */
:root {
  --bg: oklch(0.16 0.012 275);
  --surface: oklch(0.195 0.014 275);
  --line: oklch(0.29 0.016 275);
  --fg: oklch(0.94 0.008 275);
  --muted: oklch(0.64 0.02 275);
  --focus: oklch(0.84 0.13 205);
  --pick: oklch(0.7 0.18 320 / 0.35);
  --room: oklch(0.14 0.012 30);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
::selection { background: var(--pick); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: clamp(20px, 3.4vw, 40px); }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.tools { display: flex; align-items: center; gap: 8px; }
.home { font-size: 14px; color: var(--muted); text-decoration: none; border-radius: 4px; transition: color 0.2s ease; }
.home:hover { color: var(--fg); }
/* The sound toggle sits as quietly as the home link. */
.snd {
  display: grid; place-items: center; width: 28px; height: 28px; margin-block: -4px; padding: 0;
  color: var(--muted); background: none; border: 0; border-radius: 6px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: color 0.2s ease;
}
.snd:hover { color: var(--fg); }
.snd svg {
  width: 18px; height: 18px; fill: none; stroke: currentColor;
  stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
}
.snd[aria-pressed="true"] .off, .snd[aria-pressed="false"] .on { display: none; }
@media (pointer: coarse) { .snd { width: 40px; height: 40px; margin-block: -10px; } }
main { display: grid; gap: 14px; min-width: 0; }
/* The stage is 16:9, 4:5 on phones, and a dark room. */
.stage {
  position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: max(320px, calc(100svh - 176px));
  border-radius: 18px; overflow: hidden; background: var(--room); cursor: grab;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
.stage.held { cursor: grabbing; }
.stage:focus-visible { outline-offset: 3px; }
@media (max-width: 640px) { .stage { aspect-ratio: 4 / 5; } }

  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
/* On the dark stage the line keeps the dark muted tone. */
.fail {
  position: absolute; inset: 0; margin: 0; padding: 16px; display: grid; place-items: center; text-align: center;
  font-size: 14px; color: oklch(0.64 0.02 275);
}
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; cursor: pointer;
  font: inherit; font-size: 13px; color: var(--muted);
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.2s ease, border-color 0.2s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);

.chip:hover { color: var(--fg); border-color: var(--muted); }
.chip:active { transform: scale(0.94); transition-duration: 0.08s; }
.chip:disabled { opacity: 0.45; cursor: default; }
.chip[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }

.sw { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--w) 0 50%, var(--l) 50% 100%); }
@media (pointer: coarse) { .chip { padding: 10px 16px; } }
@media (prefers-reduced-motion: reduce) { .chip, .home, .snd, .stage canvas { transition: none; } }

<body>

<div class="wrap">
  <header>
    <h1>Lava lamp</h1>
    <div class="tools">
      <button class="snd" id="snd" type="button" aria-label="Sound" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 8h2.6l3.9-3.2v10.4L5.6 12H3z"/>
          <path class="on" d="M12.8 8.1a3 3 0 0 1 0 3.8M15.1 6.1a6 6 0 0 1 0 7.8"/>
          <path class="off" d="M13.2 8l4 4M17.2 8l-4 4"/>
        </svg>
      </button>
      <a class="home" href="../index.html">Stimming</a>
    </div>
  </header>
  <main>
    <div class="stage" id="stage" tabindex="0" role="application" aria-label="A lava lamp on a desk. Drag a blob to pull it through the liquid, or tap the base to warm the bulb. Space warms the bulb; arrow keys nudge the nearest blob.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Lava lamp needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="foot">
      <div class="ctl" role="group" aria-label="Colours">
        <button class="chip" type="button" data-pal="classic" aria-pressed="true"><span class="sw" style="--w: oklch(0.82 0.16 70); --l: oklch(0.5 0.2 25)" aria-hidden="true"></span>Classic</button>
        <button class="chip" type="button" data-pal="violet" aria-pressed="false"><span class="sw" style="--w: oklch(0.8 0.15 350); --l: oklch(0.45 0.2 305)" aria-hidden="true"></span>Violet</button>
        <button class="chip" type="button" data-pal="sea" aria-pressed="false"><span class="sw" style="--w: oklch(0.82 0.13 182); --l: oklch(0.38 0.15 260)" aria-hidden="true"></span>Sea</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag a blob</dt><dd>pull it</dd></div>
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span> the base</dt><dd>warm it</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>warm</dd></div>
        <div class="fine"><dt><kbd>Arrows</kbd></dt><dd>nudge</dd></div>
      </dl>
    </div>
  </main>
</div>

<script type="module">
const panel = document.getElementById('stage'), canvas = panel.querySelector('canvas');

  violet: palette([0.82, 0.15, 352], [0.62, 0.22, 356], [0.42, 0.2, 304], [0.54, 0.21, 302]),

const pal = Float32Array.from(PALS.classic);

/* ---------- the lamp: units are lamp heights, y runs up ---------- */

let soundOn = true;

// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.12 * voices);

    const AC = window.AudioContext || window.webkitAudioContext;

  if (wax(ro) < 0.0) return shadeWax(ro, rd, normalize(vec3(ro.x, 0.0, ro.z) + vec3(0.0, 0.0, 1e-4)));
  vec3 T = vec3(1.0), S = vec3(0.0), p = ro;
  // The nearest miss of the wax, kept to soften its edge.
  vec3 bT = vec3(1.0), bS = vec3(0.0);
  float t = 0.0, bq = 1e9, bt = 0.0;
  int hit = 0;
  for (int i = 0; i < 90; i++) {
    p = ro + rd * t;
    float dw = wax(p), dl = -sdGlass(p, TH);
    float q = dw / (uPix * (tc + t));
    if (q < bq) { bq = q; bt = t; bT = T; bS = S; }
    if (dw < 0.0007) {
      // Two secant steps settle the hit onto the surface.
      for (int k = 0; k < 2; k++) { t += dw; p = ro + rd * t; dw = wax(p); }
      hit = 1;
      break;
    }
    if (dl < 0.001 && t > 0.004) { hit = 2; break; }
    float h = min(min(max(dw, 0.0008), max(dl, 0.002)), 0.022);
    float lift = exp(-max(p.y - Y0, 0.0) * 4.5), beam = exp(-dot(p.xz, p.xz) * 110.0);
    vec3 sc = uLiq * (0.45 + 4.2 * lift * (0.6 + 0.6 * beam)) + uHot * exp(-dw * 40.0) * (0.25 + 2.4 * lift);
    S += T * sc * (uLight * h);
    T *= exp(-uAbs * h);
    t += h;
  }
  vec3 back;
  if (hit == 1) back = shadeWax(p, rd, nWax(p));
  else {
    vec3 n = nGlass(p, TH);
    vec3 r2 = refract(rd, -n, 1.12);
    if (dot(r2, r2) < 0.5) r2 = reflect(rd, -n);
    back = room(p, r2) * 0.9 + env(reflect(rd, -n), 0.15) * 0.05;
    if (bq < 1.0) {
      vec3 pb = ro + rd * bt;
      return mix(S + T * back, bS + bT * shadeWax(pb, rd, nWax(pb)), clamp(1.0 - bq, 0.0, 1.0));
    }
  }
  return S + T * back;
}
vec3 shadeGlass(vec3 p, vec3 rd, float tc) {
  vec3 n = nGlass(p, 0.0);
  float c = clamp(dot(-rd, n), 0.0, 1.0);
  float F = 0.04 + 0.96 * pow(1.0 - c, 5.0);
  vec3 r = reflect(rd, n);
  vec3 refl = env(r, 0.0) + room(p, r);
  vec3 r1 = refract(rd, n, 1.0 / 1.12);
  vec3 inner = liquid(p + r1 * (TH / max(dot(r1, -n), 0.25) + 0.002), r1, tc);
  // The glass edge thickens toward the silhouette.
  inner *= mix(1.0, 0.6, pow(1.0 - c, 3.0));
  return mix(inner, refl, F);
}
// Brushed metal: fine rings spread the highlights up and down.
vec3 shadeMetal(vec3 p, vec3 rd) {
  vec3 n = nMetal(p);
  float az = atan(p.x, p.z);
  float ln = noise1(p.y * 1300.0 + noise1(az * 9.0) * 3.0) * 0.55 + noise1(p.y * 3100.0 + 17.0) * 0.45;
  vec3 nb = normalize(n + vec3(0.0, (ln - 0.5) * 0.09, 0.0));
  vec3 r = reflect(rd, nb);
  float c = clamp(dot(-rd, nb), 0.0, 1.0);
  vec3 F0 = vec3(0.72, 0.7, 0.68);
  vec3 F = F0 + (1.0 - F0) * pow(1.0 - c, 5.0);
  vec3 q = p + n * 0.003;
  vec3 refl = env(r, 0.55) + room(q, r);
  vec4 v = seeLamp(q, r, 0.04);
  refl = mix(refl, v.rgb, v.a);
  return F * refl * (0.8 + 0.4 * ln) + F0 * lampLight(q, n, false) * 0.3;
}
vec2 cyl(vec3 ro, vec3 rd, float r, float y0, float y1) {
  float a = dot(rd.xz, rd.xz), b = dot(ro.xz, rd.xz), c = dot(ro.xz, ro.xz) - r * r, h = b * b - a * c;
  if (h < 0.0) return vec2(1.0, -1.0);
  h = sqrt(h);
  float ta = (y0 - ro.y) / rd.y, tb = (y1 - ro.y) / rd.y;
  return vec2(max(max((-b - h) / a, min(ta, tb)), 0.0), min((-b + h) / a, max(ta, tb)));
}
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
vec3 srgb(vec3 c) { return mix(12.92 * c, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / (0.5 * uRes.y);
  vec3 ro = uRo, rd = normalize(uCz + uTan * (uv.x * uCx + uv.y * uCy));
  vec3 col = room(ro, rd);
  vec2 tb = cyl(ro, rd, 0.17, -0.01, 1.01);
  if (tb.x < tb.y) {
    float t = tb.x, best = 1e9, bt = 0.0;
    bool hit = false;
    for (int i = 0; i < 90; i++) {
      float d = sdLamp(ro + rd * t), w = uPix * t;
      if (d < w * 0.25) { hit = true; break; }
      if (d / w < best) { best = d / w; bt = t; }
      t += max(d, w * 0.25);
      if (t > tb.y) break;
    }
    // Rays that just miss still cover part of the pixel.
    float a = hit ? 1.0 : clamp((1.0 - best) / 0.75, 0.0, 1.0);
    if (a > 0.0) {
      if (!hit) t = bt;
      vec3 p = ro + rd * t;
      vec3 lc = sdGlass(p, 0.0) < sdMetal(p) ? shadeGlass(p, rd, t) : shadeMetal(p, rd);
      col = mix(col, lc, a);
    }
  }
  vec2 v = gl_FragCoord.xy / uRes - 0.5;
  col = aces(col * 1.05) * (1.0 - 0.28 * dot(v, v));
  o = vec4(srgb(col) + (hash(gl_FragCoord.xy + fract(uTime) * 61.0) - 0.5) / 255.0, 1.0);
}`;

let gl = null, prog = null, U = {}, vao = null, ready = false;
const UB = new Float32Array(4 * MAXB), UE = new Float32Array(4 * MAXB);
async function initGL() {
  gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
  if (!gl) throw new Error('WebGL 2 unavailable');
  const par = gl.getExtension('KHR_parallel_shader_compile');
  const sh = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  };
  const p = gl.createProgram(), v = sh(gl.VERTEX_SHADER, TRI), f = sh(gl.FRAGMENT_SHADER, FS);
  gl.attachShader(p, v);
  gl.attachShader(p, f);
  gl.linkProgram(p);
  // Polling lets the driver link off the main thread.
  if (par) while (!gl.isContextLost() && !gl.getProgramParameter(p, par.COMPLETION_STATUS_KHR)) await nextFrame();
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getShaderInfoLog(f) || gl.getShaderInfoLog(v) || gl.getProgramInfoLog(p) || 'link failed');
  prog = p;
  for (const n of ['uRes', 'uRo', 'uCx', 'uCy', 'uCz', 'uTan', 'uPix', 'uTime', 'uPool', 'uLight', 'uHeat', 'uN', 'uB', 'uE', 'uHot', 'uCool', 'uLiq', 'uAbs', 'uGlow']) U[n] = gl.getUniformLocation(p, n);
  gl.useProgram(p);
  gl.uniform3fv(U.uRo, CAM.pos);
  gl.uniform3fv(U.uCx, CX);
  gl.uniform3fv(U.uCy, CY);
  gl.uniform3fv(U.uCz, CZ);
  gl.uniform1f(U.uTan, CAM.tan);
  vao = gl.createVertexArray();
}

/* ---------- drawing ---------- */
// Render scale steps down on slow machines.
const SCALES = [1, 0.8, 0.66, 0.5];
let scaleI = 0, light = 1;
function fit() {
  const w = panel.clientWidth, h = panel.clientHeight;
  if (!w || !h) return;
  W = w;
  H = h;
  rect = null;
  const p = Math.min(devicePixelRatio || 1, 2, Math.sqrt(1.4e6 / (w * h))) * SCALES[scaleI];
  const cw = Math.max(1, Math.round(w * p)), ch = Math.max(1, Math.round(h * p));
  if (canvas.width !== cw || canvas.height !== ch) {
    canvas.width = cw;
    canvas.height = ch;
  }
  if (ready) render();
}
function render() {
  const cw = canvas.width, ch = canvas.height, n = Math.min(MAXB, blobs.length);
  for (let i = 0; i < n; i++) {
    const b = blobs[i];
    UB[i * 4] = b.x; UB[i * 4 + 1] = b.y; UB[i * 4 + 2] = b.z; UB[i * 4 + 3] = wide(b);
    UE[i * 4] = half(b); UE[i * 4 + 1] = b.lean; UE[i * 4 + 2] = b.T; UE[i * 4 + 3] = b.flash;
  }
  gl.viewport(0, 0, cw, ch);
  gl.useProgram(prog);
  gl.uniform2f(U.uRes, cw, ch);
  gl.uniform1f(U.uPix, (2 * CAM.tan) / ch);
  gl.uniform1f(U.uTime, simT % 1000);
  gl.uniform1f(U.uPool, pool);
  gl.uniform1f(U.uLight, light);
  gl.uniform1f(U.uHeat, heat);
  gl.uniform1i(U.uN, n);
  gl.uniform4fv(U.uB, UB);
  gl.uniform4fv(U.uE, UE);
  gl.uniform3fv(U.uHot, pal.subarray(0, 3));
  gl.uniform3fv(U.uCool, pal.subarray(3, 6));
  gl.uniform3fv(U.uLiq, pal.subarray(6, 9));
  gl.uniform3fv(U.uAbs, pal.subarray(9, 12));
  gl.uniform3fv(U.uGlow, pal.subarray(12, 15));
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------- one loop, running while the wax moves ---------- */
let raf = 0, last = 0, running = false, onScreen = false, resting = false, frames = 0, slow = 0, humAt = 0;
function frame(now) {
  raf = 0;
  if (!running) return;
  const raw = Math.max(0, (now - last) / 1000), dt = Math.min(raw, 1 / 20);
  last = now;
  // Sustained slow frames lower the render scale.
  if (++frames > 30 && scaleI < SCALES.length - 1) {
    slow = raw > 0.024 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 30) { scaleI++; slow = 0; fit(); }
  }
  idleT += dt;
  const speed = reduce ? 0.5 : 1;
  simulate(dt * speed);
  // The bulb's light follows its heat and the warm boost.
  const lt = (0.6 + 0.4 * heat) * (1 + 0.45 * warm);
  light += (lt - light) * (1 - Math.exp(-dt / 0.25));
  const tp = PALS[palName];
  let dp = 0;
  for (let i = 0; i < pal.length; i++) {
    pal[i] += (tp[i] - pal[i]) * (1 - Math.exp(-dt / (reduce ? 0.08 : 0.28)));
    dp = Math.max(dp, Math.abs(tp[i] - pal[i]));
  }
  if (now - humAt > 250) { humAt = now; humLevel(); }
  render();
  if (frames === 2) canvas.classList.add('on');
  // At rest the loop stops and the context sleeps.
  if (heat === 0 && warm === 0 && motion < 0.0015 && dp < 1e-3 && Math.abs(lt - light) < 1e-3 && !grabs.size) {
    resting = true;
    sync();
    return;
  }
  raf = requestAnimationFrame(frame);
}
function sync() {
  const run = ready && onScreen && !document.hidden && !resting;
  if (run === running) return;
  running = run;
  if (run) {
    last = performance.now();
    raf = requestAnimationFrame(frame);
    if (soundOn && ac && ac.state !== 'running') audio();
  } else {
    cancelAnimationFrame(raf);
    raf = 0;
    if (ac && ac.state === 'running') ac.suspend()?.catch(() => {});
  }
}
// Any touch wakes a resting lamp.
function wake() {
  idleT = 0;
  if (!resting) return;
  resting = false;
  sync();
}

/* ---------- input ---------- */
const grabs = new Map();
function warmUp() {
  warm = Math.min(1, warm + 0.55);
  heat = Math.max(heat, 0.35);
  spawnAcc += 0.6;
  for (const b of blobs) if (b.y - half(b) < pool + 0.05) b.T = clamp(b.T + 0.12);
  wake();
  humLevel();
}
panel.addEventListener('pointerdown', e => {
  if (!ready || (e.pointerType === 'mouse' && e.button !== 0)) return;
  wake();
  const [x, y] = local(e), d = rayAt(x, y), [bx, by] = onPlane(d, 0);
  // The metal base is the bulb's switch.
  if (by > -0.02 && by < 0.29 && Math.abs(bx) < 0.17 - by * 0.25) { warmUp(); return; }
  let best = null, bd = 1e9;
  for (const b of blobs) {
    if (b.state === 'sink') continue;
    const [px, py] = onPlane(d, b.z), dd = Math.hypot(px - b.x, py - b.y) - b.r;
    if (dd < bd) { bd = dd; best = b; }
  }
  // Near the pool and clear of blobs, a press draws out fresh wax.
  if (bd > 0.035 && blobs.length < MAXB && by > Y0 && by < pool + 0.07 && Math.abs(bx) < inR(pool) * 0.8) {
    best = spawn(bx * 0.9, 0);
    best.y = pool;
    best.T = 0.7;
  }
  if (!best) return;
  // A mound pulled from the pool comes away at a fair size.
  if (best.state === 'grow') {
    const r = Math.max(best.r, 0.034);
    poolV -= r ** 3 - best.r ** 3;
    best.r = best.rt = r;
    best.state = 'free';
  }
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  const [px, py] = onPlane(d, best.z);
  const g = { b: best, zp: best.z, ox: best.x - px, oy: best.y - py };
  grabs.set(e.pointerId, g);
  best.grab = { x: best.x, y: best.y, z: best.z };
  best.flash = 1;
  focus = best;
  panel.classList.add('held');
});
panel.addEventListener('pointermove', e => {
  const g = grabs.get(e.pointerId);
  if (!g) return;
  idleT = 0;
  const [x, y] = local(e), [px, py] = onPlane(rayAt(x, y), g.zp), b = g.b;
  if (!blobs.includes(b)) return;
  const [tx, ty] = inside(px + g.ox, py + g.oy, b);
  b.grab = { x: tx, y: ty, z: g.zp * 0.6 };
  b.flash = Math.max(b.flash, 0.5);
});
function lift(e) {
  const g = grabs.get(e.pointerId);
  if (!g) return;
  grabs.delete(e.pointerId);
  g.b.grab = null;
  if (!grabs.size) panel.classList.remove('held');
}
panel.addEventListener('pointerup', lift);
panel.addEventListener('pointercancel', lift);
panel.addEventListener('contextmenu', e => e.preventDefault());

const DIRS = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented || !ready) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  if (DIRS[e.key]) {
    e.preventDefault();
    wake();
    // The same blob takes each nudge until it merges or sinks.
    if (!focus || !blobs.includes(focus) || focus.state === 'sink') focus = nearest(...focusAt);
    if (!focus) return;
    const [dx, dy] = DIRS[e.key];
    if (focus.state === 'grow') focus.state = 'free';
    focus.vx += dx * 0.13;
    focus.vy += dy * 0.13;
    focus.flash = 1;
    focusAt = [focus.x, focus.y];
  } else if (e.key === ' ') {
    // Buttons and links keep Space for themselves.
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (!e.repeat) warmUp();
  }
});

const chips = [...document.querySelectorAll('[data-pal]')];
chips.forEach(c => c.addEventListener('click', () => {
  palName = c.dataset.pal;
  chips.forEach(o => o.setAttribute('aria-pressed', String(o === c)));
  wake();
}));
const sndB = document.getElementById('snd');
const showSound = () => sndB.setAttribute('aria-pressed', String(soundOn));
showSound();
sndB.addEventListener('click', () => {
  soundOn = !soundOn;
  showSound();
  try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (err) { /* storage is optional */ }
  humLevel();
  if (soundOn) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});

/* ---------- start: the shader links while the wax is seeded ---------- */
function failed() {
  ready = false;
  sync();
  canvas.hidden = true;
  panel.querySelector('.fail').hidden = false;
  chips.forEach(c => { c.disabled = true; });
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; sync(); });
canvas.addEventListener('webglcontextrestored', async () => {
  try {
    await initGL();
    ready = true;
    fit();
    sync();
  } catch (err) { console.error(err); failed(); }
});
async function boot() {
  await idle();
  fit();
  let gate;
  try { gate = initGL(); } catch (err) { console.error(err); failed(); return; }
  gate.catch(() => {});
  await idle();
  seed();
  try { await gate; } catch (err) { console.error(err); failed(); return; }
  ready = true;
  fit();
  new ResizeObserver(fit).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; sync(); }).observe(panel);
  document.addEventListener('visibilitychange', sync);
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
