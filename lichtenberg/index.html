<!doctype html>
<html lang="en">

:root { --stage: oklch(0.12 0.012 60); }

  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;

@media (prefers-reduced-motion: reduce) { .stage--lichtenberg canvas { transition: none; } }

<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Lichtenberg burn</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--lichtenberg" id="stage" tabindex="0" role="application" aria-label="A painted panel. Press and hold to send a high-voltage spark tree across it; release to freeze the burn.">
      <p class="fail" hidden>Lichtenberg burn needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, whenVisible, fitCanvas, onQuality, oklchLinear, reduced, audioKit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);

let voltage = 0.6, board = 'wood';
// The board eases from wood (0) to acrylic (1).
let boardMix = 0;
// The handlers bind once the GL exists.
const act = { board() {}, clear() {}, still() {} };
// Settings: branching sets the DBM exponent, ember life the cooling times.
let branching = 0.4, emberLife = 0.35, glow = 1;
const tauGlow = () => 1.5 + 4.5 * emberLife, tauSmoulder = () => 8 + 28 * emberLife;
const ui = initPage({ id: 'lichtenberg', bar: {
  choice: { label: 'Board', value: 'wood', options: [
    { value: 'wood', label: 'Panel' }, { value: 'acrylic', label: 'Acrylic' },
  ], onPick: v => act.board(v) },
  slider: { label: 'Voltage', min: 0.2, max: 1, step: 0.01, value: voltage, onInput: v => { voltage = v; } },
  actions: [{ verb: 'clear', key: 'C', onPress: () => act.clear() }],
  settings: [
    { type: 'slider', id: 'branching', label: 'Branching', min: 0, max: 1, step: 0.01, value: 0.4, persist: true, onInput: v => { branching = v; } },
    { type: 'slider', id: 'embers', label: 'Ember life', min: 0, max: 1, step: 0.01, value: 0.35, persist: true, onInput: v => { emberLife = v; } },
    { type: 'slider', id: 'glow', label: 'Glow', min: 0, max: 1.5, step: 0.01, value: 1, persist: true, onInput: v => { glow = v; act.still(); } },
  ],
  quality: true,
  keys: [['hold', 'burn'], ['release', 'freeze'], ['click', 'zap'], ['space', 'burn']],
} });

branching = ui.setting('branching')?.value ?? branching;
emberLife = ui.setting('embers')?.value ?? emberLife;
glow = ui.setting('glow')?.value ?? glow;
// Touch screens have no Space key, so its entry hides.
const COARSE = matchMedia('(pointer: coarse)');
function touchKeys() {
  const row = [...stage.parentElement.querySelectorAll('.s2-keys > div')][3];
  if (row) row.hidden = COARSE.matches;
}
touchKeys();
COARSE.addEventListener?.('change', touchKeys);

let markReady;
const glReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, glReady]) });

/* ---------- random ---------- */
// Seeded random keeps the first frame the same on every load.
function mulberry(a) {
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rnd = mulberry(7193);

/* ---------- board grid ---------- */
// One cell is 2.5 CSS px; the grid takes the stage's aspect at boot and on Clear.
const CELL = 2.5;
let GW = 0, GH = 0;
let old = null;      // 1 where an earlier burn charred the cell
let oldId = null;    // index into burns for old char, or -1
const burns = [];    // finished burns: first segment and count
let dOld = null;     // cell distance to the nearest old char
let owner = null;    // index of the live burn's cell, or -1
let candAt = null;   // index of the candidate on this cell, or -1
function grid() {
  const r = stage.getBoundingClientRect();
  GW = Math.max(40, Math.round(r.width / CELL));
  GH = Math.max(40, Math.round(r.height / CELL));
  const n = GW * GH;
  old = new Uint8Array(n);
  oldId = new Int16Array(n).fill(-1);
  burns.length = 0;
  dOld = new Float32Array(n).fill(1e4);
  owner = new Int32Array(n).fill(-1);
  candAt = new Int32Array(n).fill(-1);
}
// A two-pass chamfer transform gives the distance to old char.
function distance() {
  const D = dOld, A = 1, B = Math.SQRT2;
  for (let i = 0; i < D.length; i++) D[i] = old[i] ? 0 : 1e4;
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const i = y * GW + x;
    let d = D[i];
    if (x > 0) d = Math.min(d, D[i - 1] + A);
    if (y > 0) {
      d = Math.min(d, D[i - GW] + A);
      if (x > 0) d = Math.min(d, D[i - GW - 1] + B);
      if (x < GW - 1) d = Math.min(d, D[i - GW + 1] + B);
    }
    D[i] = d;
  }
  for (let y = GH - 1; y >= 0; y--) for (let x = GW - 1; x >= 0; x--) {
    const i = y * GW + x;
    let d = D[i];
    if (x < GW - 1) d = Math.min(d, D[i + 1] + A);
    if (y < GH - 1) {
      d = Math.min(d, D[i + GW] + A);
      if (x < GW - 1) d = Math.min(d, D[i + GW + 1] + B);
      if (x > 0) d = Math.min(d, D[i + GW - 1] + B);
    }
    D[i] = d;
  }
}

/* ---------- segments ---------- */
// One instance per segment: a.xy, b.xy, width, birth, flags, spare, parent id, child id.
const STRIDE = 10, MAXSEG = 262144;
const seg = new Float32Array(MAXSEG * STRIDE);
let nSeg = 0;
const BRANCH = 1, PATH = 2;
// Width follows the tips a segment feeds, as current does.
const widthOf = tips => Math.min(2.8, 0.26 + 0.27 * Math.log2(tips));

/* ---------- DBM: dielectric breakdown, charge superposition ---------- */
// Kim, Sewall and Lin (2007): each cell adds 1 - R1 / r to every candidate.
const R1 = 0.5;
// The ladder's last rung lowers the cell cap and steps per frame.
const maxCells = () => (rung >= 3 ? 5000 : 10000), maxSteps = () => (rung >= 3 ? 30 : 60);
let rung = 0;
let burn = null;
function newBurn(bx, by, eta) {
  const gx = clamp(Math.floor(bx), 0, GW - 1), gy = clamp(Math.floor(by), 0, GH - 1);
  burn = {
    eta, seg0: nSeg, n: 0, done: false, end: '', t0: simT, held: 0,
    cx: [], cy: [], par: [], tips: [], segOf: [], px: [], py: [],
    kx: [], ky: [], kphi: [], kpar: [],
    rx: gx, ry: gy, hot: 0,
  };
  addCell(gx, gy, -1, bx, by);
  return burn;
}
function addCell(gx, gy, parent, fx, fy) {
  const B = burn, k = B.n++;
  const i = gy * GW + gx;
  owner[i] = k;
  B.cx.push(gx); B.cy.push(gy); B.par.push(parent); B.tips.push(1);
  // Each cell sits off its grid centre, so lines never look ruled.
  let px = fx ?? gx + 0.5 + (rnd() - 0.5) * 0.76, py = fy ?? gy + 0.5 + (rnd() - 0.5) * 0.76;
  // Each step bends toward its parent's heading, so paths curve.
  const gp = parent >= 0 ? B.par[parent] : -1;
  if (fx == null && gp >= 0) {
    px += (2 * B.px[parent] - B.px[gp] - px) * 0.35;
    py += (2 * B.py[parent] - B.py[gp] - py) * 0.35;
  }
  B.px.push(px); B.py.push(py);
  // A parent with a child already makes this a new branch.
  let flags = 0;
  if (parent >= 0 && B.tips[parent] > 1) flags |= BRANCH;
  const s = nSeg < MAXSEG ? nSeg++ : -1;
  B.segOf.push(s);
  if (s >= 0) {
    const o = s * STRIDE, ax = parent >= 0 ? B.px[parent] : px, ay = parent >= 0 ? B.py[parent] : py;
    seg[o] = ax; seg[o + 1] = ay; seg[o + 2] = px; seg[o + 3] = py;
    seg[o + 4] = widthOf(1); seg[o + 5] = simT; seg[o + 6] = flags; seg[o + 7] = 0;
    seg[o + 8] = parent >= 0 ? B.segOf[parent] : s; seg[o + 9] = s;
  }
  // Every ancestor now feeds one more tip.
  for (let p = parent; p >= 0; p = B.par[p]) {
    const t = ++B.tips[p], sp = B.segOf[p];
    if (sp >= 0) seg[sp * STRIDE + 4] = widthOf(t);
  }
  // The new charge raises every candidate's potential.
  for (let c = 0; c < B.kx.length; c++) {
    const dx = B.kx[c] - gx, dy = B.ky[c] - gy;
    B.kphi[c] += 1 - R1 / Math.sqrt(dx * dx + dy * dy);
  }
  const ci = candAt[i];
  if (ci >= 0) dropCand(ci);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = gx + dx, ny = gy + dy;
    if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
    const j = ny * GW + nx;
    if (owner[j] >= 0 || candAt[j] >= 0) continue;
    let phi = 0;
    for (let q = 0; q < B.n; q++) {
      const ex = B.cx[q] - nx, ey = B.cy[q] - ny;
      phi += 1 - R1 / Math.sqrt(ex * ex + ey * ey);
    }
    candAt[j] = B.kx.length;
    B.kx.push(nx); B.ky.push(ny); B.kphi.push(phi); B.kpar.push(k);
  }
}
// Swap-remove keeps the candidate lists dense.
function dropCand(c) {
  const B = burn, last = B.kx.length - 1;
  candAt[B.ky[c] * GW + B.kx[c]] = -1;
  if (c !== last) {
    B.kx[c] = B.kx[last]; B.ky[c] = B.ky[last]; B.kphi[c] = B.kphi[last]; B.kpar[c] = B.kpar[last];
    candAt[B.ky[c] * GW + B.kx[c]] = c;
  }
  B.kx.pop(); B.ky.pop(); B.kphi.pop(); B.kpar.pop();
}
const wts = new Float64Array(1 << 16);
// One growth step: pick a candidate by normalized potential to the power eta.
function step() {
  const B = burn, n = B.kx.length;
  if (!n) return finish('stuck');
  let lo = Infinity, hi = -Infinity;
  for (let c = 0; c < n; c++) { const p = B.kphi[c]; if (p < lo) lo = p; if (p > hi) hi = p; }
  const span = hi - lo || 1;
  let sum = 0;
  for (let c = 0; c < n; c++) {
    // Old char conducts, so the tree reaches for it.
    const d = dOld[B.ky[c] * GW + B.kx[c]];
    const w = Math.pow((B.kphi[c] - lo) / span, B.eta) * (1 + 2 * Math.exp(-d / 6));
    wts[c] = w;
    sum += w;
  }
  let r = rnd() * sum, c = 0;
  for (; c < n - 1; c++) { r -= wts[c]; if (r <= 0) break; }
  const gx = B.kx[c], gy = B.ky[c], par = B.kpar[c];
  addCell(gx, gy, par);
  // The board edge and old char close the circuit.
  const far = Math.hypot(gx - B.rx, gy - B.ry) > 8;
  if (gx === 0 || gy === 0 || gx === GW - 1 || gy === GH - 1) return finish('edge');
  if (far && dOld[gy * GW + gx] <= 1.5) { B.hit = touched(gx, gy); return finish('arc'); }
  if (B.n >= maxCells() || nSeg >= MAXSEG) finish('full');
}
// The nearest old burn within two cells of the contact.
function touched(gx, gy) {
  for (let r = 1; r <= 2; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const x = gx + dx, y = gy + dy;
    if (x >= 0 && y >= 0 && x < GW && y < GH && oldId[y * GW + x] >= 0) return oldId[y * GW + x];
  }
  return -1;
}
// The burn stops: its cells join the old char.
function finish(why) {
  const B = burn;
  if (!B || B.done) return;
  B.done = true;
  B.end = why;
  B.tEnd = simT;
  if (why === 'edge' || why === 'arc') {
    // The path from the contact back to the root carries the arc.
    for (let p = B.n - 1; p >= 0; p = B.par[p]) {
      const s = B.segOf[p];
      if (s >= 0) seg[s * STRIDE + 6] = seg[s * STRIDE + 6] | PATH;
    }
    arcT = simT;
    arcOld = B.hit >= 0 ? burns[B.hit] : null;
  }
  const id = burns.length;
  burns.push({ seg0: B.seg0, n: Math.min(B.n, nSeg - B.seg0) });
  for (let k = 0; k < B.n; k++) { const i = B.cy[k] * GW + B.cx[k]; old[i] = 1; oldId[i] = id; }
  for (let c = 0; c < B.kx.length; c++) candAt[B.ky[c] * GW + B.kx[c]] = -1;
  for (let k = 0; k < B.n; k++) owner[B.cy[k] * GW + B.cx[k]] = -1;
  B.kx.length = B.ky.length = B.kphi.length = B.kpar.length = 0;
  distance();
  hotUntil = Math.max(hotUntil, simT + tauSmoulder() * 2.5);
  // A user burn takes its last cells into the char at once.
  if (B.user) { upload(B.seg0, B.n); stamp(B.seg0, B.n, 1); lastHot = simT; }
  if (B.user && (why === 'arc' || why === 'edge')) {
    snap(B.px[B.n - 1]);
    // The arc-over throws a burst of sparks from the contact.
    for (let i = 0; i < 28; i++) spit(B.px[B.n - 1], B.py[B.n - 1], 1, 0, 70, Math.PI * 2);
  }
  // The arc runs through the old tree, so it heats up again.
  if (B.user && arcOld) stamp(arcOld.seg0, arcOld.n, 0.6);
}

/* ---------- shaders ---------- */
const HEAD = `#version 300 es
precision highp float;
precision highp sampler2D;
`;
const TRI = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
// Each segment draws as a capsule quad in board cells.
const STROKE_VS = `#version 300 es
layout(location = 0) in vec4 aSeg;
layout(location = 1) in vec4 aInfo;
layout(location = 2) in vec2 aIds;
uniform vec4 uMap;     // ndc = p * uMap.xy + uMap.zw
uniform float uPad;    // halo reach, cells
uniform float uPx;     // cells per target pixel
uniform float uJit;    // live jitter, cells
uniform float uFrame;
out vec2 vP;
flat out vec4 vSeg;
flat out vec4 vInfo;
flat out float vId;
vec2 h2(float n, float f) {
  vec3 q = fract(vec3(n * 0.1031, n * 0.1030 + f * 0.0973, f * 0.1099 + 0.37));
  q += dot(q, q.yzx + 33.33);
  return fract((q.xx + q.yz) * q.zy) - 0.5;
}
void main() {
  vec2 a = aSeg.xy, b = aSeg.zw;
  // The live spark crawls: end points shake each frame, shared by neighbours.
  if (uJit > 0.0) { a += h2(aIds.x, uFrame) * uJit; b += h2(aIds.y, uFrame) * uJit; }
  vec2 d = b - a;
  float L = length(d);
  vec2 t = L > 1e-4 ? d / L : vec2(1.0, 0.0), n = vec2(-t.y, t.x);
  float R = aInfo.x * 0.5 + uPad + uPx * 1.5;
  int v = gl_VertexID;
  int k = v == 0 ? 0 : v == 1 || v == 4 ? 1 : v == 2 || v == 3 ? 2 : 3;
  float s = (k & 1) == 0 ? -1.0 : 1.0, q = k < 2 ? -1.0 : 1.0;
  vec2 p = (s < 0.0 ? a - t * R : b + t * R) + n * R * q;
  vP = p;
  vSeg = vec4(a, b);
  vInfo = aInfo;
  vId = aIds.y;
  gl_Position = vec4(p * uMap.xy + uMap.zw, 0.0, 1.0);
}`;
const SEGD = `
in vec2 vP;
flat in vec4 vSeg;
flat in vec4 vInfo;
flat in float vId;
out vec4 o;
float segD() {
  vec2 pa = vP - vSeg.xy, ba = vSeg.zw - vSeg.xy;
  float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
  return length(pa - ba * h);
}`;
// Char: R is the black core, G the scorch halo; both deepen with age.
const CHAR_FS = HEAD + SEGD + `
uniform float uNow, uPx;
void main() {
  float d = segD(), w = vInfo.x * 0.5;
  float depth = clamp((uNow - vInfo.y) * 1.4 + 0.35, 0.0, 1.0);
  float core = clamp((w * 0.8 - d) / uPx + 0.5, 0.0, 1.0) * depth;
  float halo = exp(-pow(d / (w + 1.0), 2.0)) * depth * 0.85;
  o = vec4(core, halo, 0.0, 1.0);
}`;
// Heat: G is the glow, B the slow smoulder; thick trunks run hotter.
const HEAT_FS = HEAD + SEGD + `
uniform float uHeat;
void main() {
  float d = segD(), w = vInfo.x * 0.5;
  float t = (0.35 + 0.65 * clamp(vInfo.x / 2.0, 0.0, 1.0)) * uHeat;
  float h = exp(-pow(d / (w + 0.6), 2.0)) * t;
  o = vec4(0.0, h, h, 1.0);
}`;
// The spark: a magenta-white core and a violet halo, flashing as each step lands.
const SPARK_FS = HEAD + SEGD + `
uniform float uNow, uLive, uArc, uArcAll, uFrame, uPx, uFlick;
float hash(float n) { return fract(sin(n * 0.3183 + uFrame * 1.731) * 43758.5453); }
void main() {
  float d = segD(), w = vInfo.x * 0.5;
  float age = uNow - vInfo.y;
  float flags = vInfo.z;
  bool branch = mod(flags, 2.0) > 0.5, path = mod(floor(flags / 2.0), 2.0) > 0.5;
  float r = d / (w * 0.55 + uPx * 0.9);
  float core = exp(-r * r);
  float halo = exp(-d / (w + 0.5));
  // Trunks hum steadily; fresh tips and new forks flash hottest.
  float I = 0.12 + 0.45 * clamp(vInfo.x / 2.0, 0.0, 1.0);
  I += (branch ? 3.0 : 1.4) * exp(-age / 0.07) + 0.7 * exp(-age / 0.35);
  I *= mix(1.0, 0.45 + 1.1 * hash(vId), uFlick);
  I *= uLive;
  if (path || uArcAll > 0.5) I += uArc * (6.0 + 2.0 * clamp(vInfo.x, 0.0, 1.5));
  // The core clips near white; the halo carries the violet into the bloom.
  // A touched old tree flashes as a thin line, with no halo.
  if (uArcAll > 0.5) halo = 0.0;
  vec3 c = vec3(0.92, 0.6, 1.0) * core * min(I, 1.5) * 0.55 + vec3(0.55, 0.06, 1.0) * halo * min(I, 3.0) * 0.16;
  o = vec4(c, 1.0);
}`;
// Flying sparks: short streaks thrown off the growing tips.
const FLY_FS = HEAD + SEGD + `
uniform float uPx;
void main() {
  float d = segD(), w = vInfo.x * 0.5;
  float r = d / (w + uPx * 0.8);
  float I = vInfo.y;
  vec3 c = vec3(1.0, 0.82, 1.0) * exp(-r * r) * I * 1.6 + vec3(0.6, 0.12, 1.0) * exp(-d / (w * 3.0 + 0.5)) * I * 0.3;
  o = vec4(c, 1.0);
}`;
// Board space: the fragment's cell, from the cover-fit mapping.
const BOARD = `
uniform vec2 uRes, uGrid, uOff;
uniform float uScale;
vec2 boardAt(vec2 frag) { return (vec2(frag.x, uRes.y - frag.y) - uOff) / uScale; }
vec2 texAt(vec2 b) { return vec2(b.x / uGrid.x, 1.0 - b.y / uGrid.y); }
float hash(vec2 p) {
  vec3 q = fract(p.xyx * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; }
  return s;
}
// Voronoi: x is the distance to the nearest point, y the distance to an edge.

  if (e.code !== 'Space' || !spaceHeld) return;
  spaceHeld = false;
  release(false);
});

// A stage that boots unsized gets a fresh board once it has a size.
function misfit() {
  const r = stage.getBoundingClientRect();
  return r.width > 0 && (Math.abs(r.width / CELL - GW) > GW * 0.15 || Math.abs(r.height / CELL - GH) > GH * 0.15);
}
new ResizeObserver(() => {
  if (!userBurned && misfit()) { reboard(); return; }
  if (burn && !burn.done) finish('freeze');
  layout();
  still();
}).observe(stage);
onQuality(() => { layout(); still(); });
// A hidden tab stops the loop and the sim clock with it.
whenVisible(stage, v => {
  visible = v;
  if (!v) { cancelAnimationFrame(raf); raf = 0; silence(); return; }
  if (busy()) wake(); else still();
});
</script>
</body>
