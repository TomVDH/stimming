<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}/* The how-to line is as quiet as the home link. */
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 28px; }

  font-size: 13px; color: var(--muted);
}

<title>Marbling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600&display=swap">
<style>
/* Layout: header row, the tray at full width, one chip row. */
:root {
  --bg: oklch(0.16 0.012 275);
  --surface: oklch(0.195 0.014 275);
  --line: oklch(0.29 0.016 275);
  --fg: oklch(0.94 0.008 275);
  --muted: oklch(0.64 0.02 275);
  --focus: oklch(0.84 0.13 205);
  --pick: oklch(0.7 0.18 320 / 0.35);
  --tray: oklch(0.9 0.035 86);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
::selection { background: var(--pick); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: clamp(20px, 3.4vw, 40px); }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.tools { display: flex; align-items: center; gap: 8px; }
.home { font-size: 14px; color: var(--muted); text-decoration: none; border-radius: 4px; transition: color 0.2s ease; }
.home:hover { color: var(--fg); }
/* The sound toggle sits as quietly as the home link. */
.snd {
  display: grid; place-items: center; width: 28px; height: 28px; margin-block: -4px; padding: 0;
  color: var(--muted); background: none; border: 0; border-radius: 6px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: color 0.2s ease;
}
.snd:hover { color: var(--fg); }
.snd svg {
  width: 18px; height: 18px; fill: none; stroke: currentColor;
  stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
}
.snd[aria-pressed="true"] .off, .snd[aria-pressed="false"] .on { display: none; }
@media (pointer: coarse) { .snd { width: 40px; height: 40px; margin-block: -10px; } }
main { display: grid; gap: 14px; min-width: 0; }
/* The tray is 16:9, 4:5 on phones, and cream in both cases. */
.stage {
  position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: max(320px, calc(100svh - 176px));
  border-radius: 18px; overflow: hidden; background: var(--tray);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
.stage:focus-visible { outline-offset: 3px; }
@media (max-width: 640px) { .stage { aspect-ratio: 4 / 5; } }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
/* On the cream tray the line keeps a dark tone. */
.fail {
  position: absolute; inset: 0; margin: 0; padding: 16px; display: grid; place-items: center; text-align: center;
  font-size: 14px; color: oklch(0.4 0.03 70);
}
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; cursor: pointer;
  font: inherit; font-size: 13px; color: var(--muted);
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.chip:hover { color: var(--fg); border-color: var(--muted); }
.chip:active { transform: scale(0.94); transition-duration: 0.08s; }
/* While the paper is down, the chips rest dimmed. */
.chip[aria-disabled="true"] { opacity: 0.45; cursor: default; }
.chip[aria-disabled="true"]:hover { color: var(--muted); border-color: var(--line); }

@media (prefers-reduced-motion: reduce) { .chip, .home, .snd, .stage canvas { transition: none; } }

<body>

<div class="wrap">
  <header>
    <h1>Marbling</h1>
    <div class="tools">
      <button class="snd" id="snd" type="button" aria-label="Sound" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 8h2.6l3.9-3.2v10.4L5.6 12H3z"/>
          <path class="on" d="M12.8 8.1a3 3 0 0 1 0 3.8M15.1 6.1a6 6 0 0 1 0 7.8"/>
          <path class="off" d="M13.2 8l4 4M17.2 8l-4 4"/>
        </svg>
      </button>
      <a class="home" href="../index.html">Stimming</a>
    </div>
  </header>
  <main>
    <div class="stage" id="stage" tabindex="0" role="application" aria-label="A marbling tray of floating ink. Tap to drop ink and hold to grow it; drag to swirl. Space drops ink at random, arrow keys swirl, C combs and P prints.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Marbling needs WebGL 2 with float targets, which this browser lacks.</p>
    </div>
    <div class="foot">
      <div class="ctl">
        <button class="chip" id="comb" type="button" aria-keyshortcuts="C">Comb</button>
        <button class="chip" id="print" type="button" aria-keyshortcuts="P">Print</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>drop ink</dd></div>
        <div><dt>Drag</dt><dd>swirl</dd></div>
        <div class="fine"><dt><kbd>C</kbd></dt><dd>comb</dd></div>
        <div class="fine"><dt><kbd>P</kbd></dt><dd>print</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>random drop</dd></div>
      </dl>
    </div>
  </main>
</div>

<script type="module">
const panel = document.getElementById('stage'), canvas = panel.querySelector('canvas');
const combB = document.getElementById('comb'), printB = document.getElementById('print');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;

const TAU = Math.PI * 2, PI = Math.PI, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));
const nextFrame = () => new Promise(r => requestAnimationFrame(r));
// Seeded random keeps the opening pattern the same on every load.
const rng = s => () => {
  s = (s + 0x6d2b79f5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
function lin(L, C, h) {
  const a = C * Math.cos(h * D2R), b = C * Math.sin(h * D2R);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,

// Chroma shrinks until the colour fits sRGB.
function linear(L, C, h) {
  let c = lin(L, C, h);
  for (let i = 0; i < 24 && (Math.min(...c) < -1e-4 || Math.max(...c) > 1.0001); i++) c = lin(L, (C *= 0.9), h);
  return c.map(v => clamp(v));

// Indigo, oxblood, ochre, deep teal and sumi black.
const INKS = [[0.35, 0.13, 266], [0.41, 0.145, 24], [0.75, 0.145, 76], [0.47, 0.085, 198], [0.22, 0.012, 255]];
const CREAM = linear(0.93, 0.036, 86), PAPER = linear(0.975, 0.013, 92);
const WOOD = linear(0.45, 0.075, 52), STEEL = linear(0.7, 0.012, 250);
let inkI = 0;
// Each drop varies a touch in tone, so repeated rings stay distinct.
function nextInk(R = Math.random) {
  const [L, C, h] = INKS[inkI++ % INKS.length];
  return linear(L + (R() - 0.5) * 0.05, C * (0.92 + 0.12 * R()), h + (R() - 0.5) * 6);

/* ---------- sound: synthesised, started by the first gesture ---------- */
const SKEY = 'stimming.marble.sound', MAXV = 14, LEAD = 0.004;
let soundOn = true;
try { soundOn = localStorage.getItem(SKEY) !== '0'; } catch (err) { /* storage is optional */ }
let ac = null, out = null, noise = null, askedAt = -1e9, voices = 0, plipNext = 0, restT = 0, swish = null;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.07 * voices);

  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (err) { return; }

    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;

    out.gain.value = 0.55;
    out.connect(comp);
    comp.connect(ac.destination);

    noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    swishVoice();
  }

}
// A context still waking queues sounds for a moment.
function live() {
  if (!soundOn || !ac || ac.state === 'closed') return null;
  return ac.state === 'running' || performance.now() - askedAt < 250 ? ac : null;
}
function track(src, ...tails) {
  voices++;
  src.onended = () => { voices--; tails.forEach(n => n.disconnect()); };
}
// Once the tray settles, the context sleeps until the next gesture.
function rest() {
  clearTimeout(restT);
  if (!ac || ac.state !== 'running') return;
  restT = setTimeout(() => {
    if (!raf && !ptrs.size && ac.state === 'running') ac.suspend()?.catch(() => {});
  }, 1500);
}
const GESTURE_KEYS = new Set(['c', 'C', 'p', 'P', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter']);
function unlock(e) {
  if (!soundOn || (e.type === 'keydown' && !GESTURE_KEYS.has(e.key))) return;

  if (!ac && e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
  audio();
}
// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// Each voice pans with its place on the tray.
function bus(a, x) {
  const p = a.createStereoPanner ? a.createStereoPanner() : a.createGain();
  if (p.pan) p.pan.value = clamp(x, -1, 1) * 0.6;
  p.connect(out);
  return p;
}
// A drop lands: a small rising bubble over a soft thump.

  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;

  og.gain.linearRampToValueAtTime(0.2 * g, t + 0.004);
  og.gain.setTargetAtTime(0, t + 0.006, 0.026);

  o.stop(t + 0.22);

  bg.gain.setValueAtTime(0, t);
  bg.gain.linearRampToValueAtTime(0.22 * g, t + 0.003);
  bg.gain.setTargetAtTime(0, t + 0.004, 0.022);

  b.stop(t + 0.2);

// The swish: looped noise through a broad and a narrow band.
function swishVoice() {

  src.loop = true;

  hi.type = 'bandpass'; hi.frequency.value = 900; hi.Q.value = 4.5;

// Loudness and brightness follow the stroke's speed.
function swishTo(speed) {
  if (!swish) return;
  const k = live() ? clamp(speed / 1.6) : 0;
  if (k < 0.01 && swish.k < 0.01) return;
  swish.k = k;

  swish.g.gain.setTargetAtTime(0.32 * k ** 0.7, t, 0.07);

// Paper rustle: crackling noise under a soft swell.
function rustle(dur, amp, f) {
  const a = live();
  if (!a || voices >= MAXV) return;

/* ---------- the tray: units of tray height, y up ---------- */

// A tap lays this much ink; holding adds more each second.
// Tines grip the water loosely, so ink slips past and folds.
const GRIP = 0.4;

let comb = null, combN = 0, sheet = null, flowT = 0, speed = 0, spaceDrop = null;

function addDrop(x, y, held) {
  if (drops.length >= MAXD) return null;
  const r = TAP_R * rand(0.86, 1.14);

    ripples.push({ x, y, t: 0, r0: r * 0.7, amp: 0.05 });

// Ink spreads fast, then slows; held ink keeps pouring.
function stepDrops(dt) {
  const k = 1 - Math.exp(-dt / SPREAD);
  for (const d of drops) {
    d.prev = d.A;
    if (d.held) d.T = Math.min(AMAX, d.T + FLUX * dt);

function stepRipples(dt) {
  for (let i = ripples.length - 1; i >= 0; i--) if ((ripples[i].t += dt) > 1.3) ripples.splice(i, 1);
}

// The rake runs left, down, right, then up, offset on the return.
function startComb() {
  if (!ready || comb || sheet) return;
  const k = combN++ % 4, axis = k % 2, dir = k === 0 || k === 3 ? 1 : -1, span = axis ? 1 : TA, M = 0.07;
  comb = { axis, dir, span, M, t: 0, dur: 1.2 + 0.75 * span, sp: 0.05, phase: k >= 2 ? 0.5 : 0, pos: 0, prev: 0, v: 0, o: 0 };

  const c = comb;
  if (!c) return;
  c.t = Math.min(1, c.t + dt / c.dur);

// Arrow keys draw a wavy stylus line through the tray.
const lanes = { h: 0, v: 0 };
function laneAt(n, span, gap) {

/* ---------- the print: paper down, soak, turn over, hold, lift ---------- */

    mode: 'wait', cx: e.clientX, cy: e.clientY, x0: x, y0: y, x, y, px: x, py: y, vx: 0, vy: 0, t: 0, o: 0, drop: null,
    slop: e.pointerType === 'mouse' ? 5 : 10, r: e.pointerType === 'touch' ? 0.011 : 0.0085,
  });
  wake();
});
panel.addEventListener('pointermove', e => {
  const s = ptrs.get(e.pointerId);
  if (!s) return;
  [s.x, s.y] = toTray(e.clientX, e.clientY);
  const far = Math.hypot(e.clientX - s.cx, e.clientY - s.cy);
  if (s.mode === 'wait' && far > s.slop) {
    s.mode = 'stir';
    s.px = s.x0;
    s.py = s.y0;
  } else if (s.mode === 'drop' && far > s.slop * 2.5) {
    // Dragging out of a growing drop stops it and starts a swirl.
    if (s.drop) s.drop.held = false;
    s.drop = null;
    s.mode = 'stir';
    s.px = s.x;
    s.py = s.y;
  }
});
function lift(e) {
  const s = ptrs.get(e.pointerId);
  if (!s) return;
  ptrs.delete(e.pointerId);
  if (s.mode === 'wait' && e.type === 'pointerup') addDrop(s.x0, s.y0, false);
  if (s.drop) s.drop.held = false;
  if (s.mode === 'stir') ghosts.push(s);
  wake();
}
['pointerup', 'pointercancel'].forEach(t => panel.addEventListener(t, lift));
panel.addEventListener('lostpointercapture', lift);
panel.addEventListener('contextmenu', e => e.preventDefault());

// A stylus drags water along the segment it moved this frame.
function stylus(s, dt) {
  const k = 1 - Math.exp(-dt * 30);
  s.vx = lerp(s.vx, (s.x - s.px) / dt, k);
  s.vy = lerp(s.vy, (s.y - s.py) / dt, k);
  const v = Math.hypot(s.vx, s.vy);
  if (v > 5) { s.vx *= 5 / v; s.vy *= 5 / v; }
  if (nSeg < MAXS) {
    segA.set([s.px, s.py, s.x, s.y], nSeg * 4);
    segV.set([s.vx, s.vy, s.r, 1], nSeg * 4);
    nSeg++;
  }
  s.px = s.x;
  s.py = s.y;
  s.o = Math.min(1, s.o + dt * 9);
  speed = Math.max(speed, Math.min(v, 5));
  flowT = SETTLE;
}
function stepInput(dt) {
  nSeg = 0;
  for (const s of ptrs.values()) {
    s.t += dt;
    if (s.mode === 'wait' && s.t > HOLD) {
      s.drop = addDrop(s.x0, s.y0, true);
      s.mode = 'drop';
    }
    if (s.mode === 'stir') stylus(s, dt);
  }
  for (let i = strokes.length - 1; i >= 0; i--) {
    const s = strokes[i];
    s.t = Math.min(1, s.t + dt / s.dur);
    [s.x, s.y] = strokeAt(s);
    stylus(s, dt);
    if (s.t >= 1) { strokes.splice(i, 1); ghosts.push(s); }
  }
  for (let i = ghosts.length - 1; i >= 0; i--) if ((ghosts[i].o -= dt * 6) <= 0) ghosts.splice(i, 1);
}

const ARROWS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const k = e.key;
  if (k === 'c' || k === 'C') { if (!e.repeat) startComb(); }
  else if (k === 'p' || k === 'P') { if (!e.repeat) startPrint(); }
  else if (k === ' ') {
    // Buttons and links keep Space for themselves.
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (e.repeat || !ready) return;
    if (sheet) { skipHold(); return; }
    spaceDrop = addDrop(rand(0.12, 0.88) * TA, rand(0.12, 0.88), true);
  } else if (ARROWS.has(k)) {
    e.preventDefault();
    if (ready && !sheet && strokes.length < 3) stroke(k);
  }
});
// Holding Space keeps the ink pouring.
function letGo() {
  if (spaceDrop) spaceDrop.held = false;
  spaceDrop = null;
}
addEventListener('keyup', e => { if (e.key === ' ') letGo(); });
addEventListener('blur', letGo);
combB.addEventListener('click', startComb);
printB.addEventListener('click', startPrint);
function chips() {
  const off = !ready || !!sheet;
  printB.setAttribute('aria-disabled', String(off));
  combB.setAttribute('aria-disabled', String(off || !!comb));
}
chips();
const sndB = document.getElementById('snd');
const showSound = () => sndB.setAttribute('aria-pressed', String(soundOn));
showSound();
sndB.addEventListener('click', () => {
  soundOn = !soundOn;
  showSound();
  try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (err) { /* storage is optional */ }
  if (soundOn) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});

/* ---------- one loop, running only while something moves ---------- */
let raf = 0, last = 0, running = false, onScreen = false, slow = 0, frames = 0;
const busy = () => ptrs.size || drops.length || flowT > 0 || comb || sheet || strokes.length || ripples.length || ghosts.length;
function frame(now) {
  raf = 0;
  if (!running || !ready) return;
  const raw = Math.max(0, (now - last) / 1000), dt = clamp(raw, 1 / 240, 1 / 30);
  last = now;
  // Sustained slow frames step the grids down.
  if (quality < 2 && ++frames > 40) {
    slow = raw > 0.026 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 40) { quality++; slow = frames = 0; fit(); }
  }
  speed = 0;
  stepInput(dt);
  stepComb(dt);
  stepDrops(dt);
  stepSheet(dt);
  const flowing = flowT > 0;
  if (flowing) {
    simStep(dt);
    flowT -= dt;
    if (flowT <= 0) [vel.r, vel.w, pres.r, pres.w].forEach(wipe);
  }
  if (flowing && drops.length) dyeStep(dt);
  else if (flowing) dyeFlow(dt);
  else if (drops.length) dyeStill();
  else mode = '';
  // A finished drop leaves the list.
  // Still water then takes a fresh copy.
  for (let i = drops.length - 1; i >= 0; i--) {
    if (drops[i].held || drops[i].A !== drops[i].T) continue;
    drops.splice(i, 1);
    if (mode === 'still') mode = '';
  }
  stepRipples(dt);
  render();
  canvas.classList.add('on');
  swishTo(speed);
  if (busy()) raf = requestAnimationFrame(frame);
  else { swishTo(0); rest(); }
}
function wake() {
  if (!running || !ready || raf) return;
  last = performance.now();
  raf = requestAnimationFrame(frame);
}
// Off screen or hidden, the tray pauses and goes quiet.
function sync() {
  const run = ready && onScreen && !document.hidden;
  if (run === running) return;
  running = run;
  if (run) {
    render();
    canvas.classList.add('on');
    if (busy()) wake();
  } else {
    cancelAnimationFrame(raf);
    raf = 0;
    swishTo(0);
    if (ac && ac.state === 'running') ac.suspend()?.catch(() => {});
  }
}
function fit() {
  const w = panel.clientWidth, h = panel.clientHeight;
  if (!w || !h) return;
  rect = null;
  const p = Math.min(devicePixelRatio || 1, 2, Math.sqrt(1.4e6 / (w * h))) * QS[quality];
  const cw = Math.round(w * p), ch = Math.round(h * p);
  if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
  if (!ready) { TA = w / h; return; }
  alloc(w / h, ch);
  // A resized canvas is blank until drawn, so draw now.
  if (running) render();
}

/* ---------- start: shaders link before the first paint ---------- */
function failed() {
  ready = false;
  sync();
  canvas.hidden = true;
  panel.querySelector('.fail').hidden = false;
  chips();
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; sync(); });
canvas.addEventListener('webglcontextrestored', async () => {
  try {
    await initGL();
    alloc(TA, canvas.height);
    seed();
    ready = true;
    sync();
  } catch (err) { console.error(err); failed(); }
});
async function boot() {
  await idle();
  fit();
  if (!canvas.width) { canvas.width = 1160; canvas.height = 652; }
  try {
    await initGL();
    alloc(TA, canvas.height);
    seed();
  } catch (err) { console.error(err); failed(); return; }
  ready = true;
  chips();
  new ResizeObserver(fit).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; sync(); }).observe(panel);
  document.addEventListener('visibilitychange', sync);
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
</body>
