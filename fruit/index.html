}

<style>
/* Fruit slice: a toony fruit to squish and slice. */
:root { --stage: oklch(0.13 0.02 160); }
.stage--fruit { background: var(--stage); cursor: grab; }
.stage--fruit.drag { cursor: grabbing; }
.stage--fruit canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--fruit canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--fruit canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Fruit slice</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--fruit" id="stage" tabindex="0" role="application" aria-label="A big toony fruit on a dark ground: a kiwi, a pomegranate, a blood orange or a peach. Press it to squish it; it springs back. Swipe across it to slice it in two: the halves fall open on the juicy inside. Tap a half to make it wobble; tap the gap to join them. Keys 1 to 4 pick a fruit, Space slices or joins.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Fruit slice</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
