<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<script type="module">
import { initPage, sound, choices } from '../shared/stim.js';
initPage({ id: 'tvtree' });
const panel = document.getElementById('stage');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; wake(); });
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));
// Seeded random keeps the tree the same on every visit.
const rng = s => () => {
  s = (s + 0x6d2b79f5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
function lin(L, C, h) {
  const a = C * Math.cos(h * D2R), b = C * Math.sin(h * D2R);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
  ];
}
// Chroma shrinks until the colour fits sRGB.
function linear(L, C, h) {
  let c = lin(L, C, h);
  for (let i = 0; i < 24 && (Math.min(...c) < -1e-4 || Math.max(...c) > 1.0001); i++) c = lin(L, (C *= 0.9), h);
  return c.map(v => clamp(v));
}
const PAL = {
  bark: linear(0.3, 0.075, 20), barkTip: linear(0.46, 0.1, 38), barkRim: linear(0.62, 0.12, 300),
  leaf: linear(0.42, 0.1, 168), leafLit: linear(0.62, 0.13, 150),
  cream: linear(0.8, 0.04, 85), dark: linear(0.2, 0.012, 270), cord: linear(0.17, 0.01, 280),
  bgTop: linear(0.17, 0.035, 290), bgMid: linear(0.215, 0.05, 300), bgLow: linear(0.12, 0.025, 280),
  key: linear(0.95, 0.04, 75), rim: linear(0.78, 0.1, 290), sky: linear(0.42, 0.05, 280), ground: linear(0.18, 0.03, 330),
};
// Cheerful set colours as lightness, chroma and hue.
// Neighbours on the tree differ in hue and lightness.
const SET_COLS = [[0.66, 0.17, 28], [0.77, 0.14, 86], [0.68, 0.17, 148], [0.7, 0.13, 238], [0.64, 0.17, 302], [0.76, 0.14, 352],
  [0.8, 0.16, 118], [0.72, 0.12, 200], [0.66, 0.15, 272], [0.72, 0.17, 52], [0.78, 0.11, 172], [0.62, 0.2, 330]];

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 24, LEAD = 0.004;
let ac = null, out = null, noise = null, askedAt = -1e9, voices = 0, restT = 0;
let hum = null, humAt = 0;
const gap = { clunk: 0, hiss: 0, zip: 0, on: 0, bonk: 0, sync: 0, thunk: 0 };
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.07 * voices);

function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (err) { return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;
    out = ac.createGain();
    out.gain.value = 0.55;
    out.connect(comp);
    comp.connect(ac.destination);
    // One second of white noise feeds every burst.
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    buildHum();
  }
  // Off screen, the tree stays silent until it returns.
  if (!visible) { ac.suspend()?.catch(() => {}); return; }
  if (ac.state !== 'running') { askedAt = performance.now(); ac.resume()?.catch(() => {}); }
}
// A context still waking queues sounds for a moment.
function live() {
  if (!sound.on || !ac || ac.state === 'closed') return null;
  return ac.state === 'running' || performance.now() - askedAt < 250 ? ac : null;
}
function track(src, ...tails) {
  voices++;
  src.onended = () => { voices--; tails.forEach(n => n.disconnect()); };
}
// Once the tree rests, the context sleeps until the next gesture.
function rest() {
  clearTimeout(restT);
  if (!ac || ac.state !== 'running') return;
  restT = setTimeout(() => {
    if (!raf && !held && ac.state === 'running') ac.suspend()?.catch(() => {});
  }, 1500);
}
const GESTURE_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter']);
function unlock(e) {
  if (!sound.on || (e.type === 'keydown' && !GESTURE_KEYS.has(e.key))) return;
  // A touch counts as a gesture only once the finger lifts.
  if (!ac && e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
  audio();
}
// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// The mains hum stacks 50 Hz harmonics under a low-pass.
// Static and swishing branches ride on looped noise.
function buildHum() {
  const N = 12, re = new Float32Array(N), im = new Float32Array(N);
  [0, 0.55, 1, 0.3, 0.38, 0.1, 0.14, 0.04, 0.05, 0, 0, 0].forEach((v, i) => { im[i] = v; });
  const wave = ac.createPeriodicWave(re, im);
  const gain = v => { const g = ac.createGain(); g.gain.value = v; return g; };
  const o1 = ac.createOscillator(), o2 = ac.createOscillator();
  o1.setPeriodicWave(wave);
  o2.setPeriodicWave(wave);
  o1.frequency.value = 50;
  // A slightly detuned twin makes the hum beat slowly.
  o2.frequency.value = 50.23;
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 310;
  lp.Q.value = 0.7;
  const hg = gain(0);
  o1.connect(lp);
  o2.connect(gain(0.5)).connect(lp);
  lp.connect(hg).connect(out);
  const ns = ac.createBufferSource();
  ns.buffer = noise;
  ns.loop = true;
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 2600;
  bp.Q.value = 0.45;
  const sg = gain(0);
  ns.connect(bp).connect(sg).connect(out);
  const ws = ac.createBufferSource();
  ws.buffer = noise;
  ws.loop = true;
  ws.playbackRate.value = 0.61;
  const wl = ac.createBiquadFilter();
  wl.type = 'lowpass';
  wl.frequency.value = 400;
  wl.Q.value = 0.6;
  const wg = gain(0);
  ws.connect(wl).connect(wg).connect(out);
  [o1, o2, ns, ws].forEach(n => n.start());
  hum = { hg, sg, wg, wl };
}
// The bed follows lit sets, lost signals and the swaying tree.
function humLevel(on, snow, sway, now) {
  const a = live();
  if (!a || !hum || now - humAt < 80) return;
  humAt = now;
  const t = a.currentTime;
  hum.hg.gain.setTargetAtTime(0.03 * Math.sqrt(on), t, 0.25);
  hum.sg.gain.setTargetAtTime(0.028 * Math.min(1, snow), t, 0.07);
  hum.wg.gain.setTargetAtTime(Math.min(0.14, sway * 0.09), t, 0.08);
  hum.wl.frequency.setTargetAtTime(260 + Math.min(1, sway) * 700, t, 0.08);
}
// Each voice pans with its place on the stage.
function bus(a, x) {
  const p = a.createStereoPanner ? a.createStereoPanner() : a.createGain();
  if (p.pan) p.pan.value = clamp(x, -1, 1) * 0.7;
  p.connect(out);
  return p;
}
// A noise burst through one filter; it tidies itself up.
function burst(a, dst, t, type, f, q, g, tau, len) {
  const src = a.createBufferSource(), fl = a.createBiquadFilter(), ng = a.createGain();
  src.buffer = noise;
  fl.type = type;
  fl.frequency.value = f;
  fl.Q.value = q;
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(g, t + 0.0008);
  ng.gain.setTargetAtTime(0, t + 0.0008, tau);
  src.connect(fl).connect(ng).connect(dst);
  src.onended = () => ng.disconnect();
  src.start(t, Math.random() * 0.7, len);
}
// A pitched blip glides from f0 to f1.
function tone(a, dst, t, f0, f1, dur, g, type = 'sine') {
  const o = a.createOscillator(), og = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(g, t + 0.004);
  og.gain.setTargetAtTime(0, t + 0.004, dur / 3);
  o.connect(og).connect(dst);
  o.start(t);
  o.stop(t + dur * 2.2 + 0.05);
  return [o, og];
}
// The tuner knob gives two detent clicks over a dull thump.
function clunk(x) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < gap.clunk) return;
  gap.clunk = t + 0.05;
  const g = level() * jit(0.08), d = bus(a, x);
  burst(a, d, t, 'bandpass', 2300 * jit(0.1), 1.3, 0.5 * g, 0.004, 0.03);
  burst(a, d, t + 0.042 * jit(0.15), 'bandpass', 1650 * jit(0.1), 1.5, 0.38 * g, 0.005, 0.03);
  burst(a, d, t, 'lowpass', 320, 0.8, 0.55 * g, 0.022, 0.1);
  const [o, og] = tone(a, d, t, 165 * jit(0.05), 72, 0.08, 0.42 * g);
  track(o, og, d);
}
// Static is band-limited noise with a quick swell and soft tail.
function hiss(x, dur, k = 1) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < gap.hiss) return;
  gap.hiss = t + 0.06;
  const g = level() * k * jit(0.1), d = bus(a, x);
  const src = a.createBufferSource(), hp = a.createBiquadFilter(), lp = a.createBiquadFilter(), ng = a.createGain();
  src.buffer = noise;
  hp.type = 'highpass';
  hp.frequency.value = 650;
  lp.type = 'lowpass';
  lp.frequency.value = 5400;
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(0.15 * g, t + 0.012);
  ng.gain.setValueAtTime(0.15 * g, t + dur * 0.55);
  ng.gain.linearRampToValueAtTime(0, t + dur);
  src.connect(hp).connect(lp).connect(ng).connect(d);
  src.start(t, Math.random() * 0.4, dur + 0.05);
  track(src, hp, lp, ng, d);
}
// Power off makes a tick, a falling zip and a fading fizz.
function zip(x) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < gap.zip) return;
  gap.zip = t + 0.08;
  const g = level() * jit(0.06), d = bus(a, x);
  burst(a, d, t, 'bandpass', 1700, 1.2, 0.32 * g, 0.004, 0.03);
  const o = a.createOscillator(), og = a.createGain(), lp = a.createBiquadFilter();
  o.type = 'triangle';
  o.frequency.setValueAtTime(560 * jit(0.04), t);
  o.frequency.exponentialRampToValueAtTime(46, t + 0.36);
  lp.type = 'lowpass';
  lp.frequency.value = 1300;
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(0.2 * g, t + 0.012);
  og.gain.setTargetAtTime(0, t + 0.22, 0.06);
  o.connect(lp).connect(og).connect(d);
  o.start(t);
  o.stop(t + 0.62);
  burst(a, d, t + 0.04, 'highpass', 2800, 0.5, 0.045 * g, 0.14, 0.45);
  track(o, lp, og, d);
}
// Power on makes a thump, a crackle and a low swell.
function powerOn(x) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < gap.on) return;
  gap.on = t + 0.08;
  const g = level() * jit(0.06), d = bus(a, x);
  burst(a, d, t, 'lowpass', 260, 0.9, 0.6 * g, 0.03, 0.12);
  for (let i = 0; i < 7; i++) burst(a, d, t + 0.02 + Math.random() * 0.28, 'highpass', rnd(2500, 5000), 0.7, rnd(0.08, 0.2) * g, 0.002, 0.012);
  const [o, og] = tone(a, d, t + 0.01, 52, 104, 0.32, 0.22 * g, 'triangle');
  track(o, og, d);
}
// Two sets bump with a plastic knock.
function bonk(x, v) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < gap.bonk) return;
  gap.bonk = t + 0.035;
  const g = level() * clamp(v / 1.3, 0.14, 0.9) * jit(0.12), d = bus(a, x);
  burst(a, d, t, 'bandpass', 950 * jit(0.15), 2.2, 0.55 * g, 0.012, 0.06);
  const [o, og] = tone(a, d, t, 420 * jit(0.1), 300, 0.05, 0.28 * g);
  track(o, og, d);
}
// A sitting set lands back in its fork.
function thunk(x, v) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < gap.thunk) return;
  gap.thunk = t + 0.06;
  const g = level() * clamp(v / 1.8, 0.12, 0.8) * jit(0.1), d = bus(a, x);
  burst(a, d, t, 'lowpass', 420, 1.1, 0.7 * g, 0.03, 0.12);
  burst(a, d, t, 'bandpass', 700, 1.5, 0.25 * g, 0.015, 0.05);
  const [o, og] = tone(a, d, t, 120, 70, 0.1, 0.3 * g);
  track(o, og, d);
}
// When the sets agree, a soft chord rises out of the static.
function syncSound(dur) {
  const a = live();
  if (!a || voices >= MAXV - 4) return;
  const t = a.currentTime + LEAD;
  if (t < gap.sync) return;
  gap.sync = t + dur;
  const g = level(), d = bus(a, 0), lp = a.createBiquadFilter(), vg = a.createGain();
  lp.type = 'lowpass';
  lp.Q.value = 2.2;
  lp.frequency.setValueAtTime(180, t);
  lp.frequency.exponentialRampToValueAtTime(1500, t + 0.7);
  lp.frequency.exponentialRampToValueAtTime(420, t + dur);
  vg.gain.setValueAtTime(0, t);
  vg.gain.linearRampToValueAtTime(0.055 * g, t + 0.6);
  vg.gain.setValueAtTime(0.055 * g, t + dur - 0.6);
  vg.gain.linearRampToValueAtTime(0, t + dur);
  lp.connect(vg).connect(d);
  let first = null;
  for (const f of [110, 138.59, 164.81, 220.5]) {
    const o = a.createOscillator();
    o.type = 'sawtooth';
    o.frequency.value = f * jit(0.003);
    o.connect(lp);
    o.start(t);
    o.stop(t + dur + 0.05);
    first = first || o;
  }
  track(first, lp, vg, d);
}

/* ---------- the tree, in scene units: it stands about 3.2 tall ---------- */
// Each branch: points, base and tip radius, wobble slot, curl sense.
const CURLY_TREE = [
  { pts: [[0, -0.12, 0], [0.05, 0.42, 0.02], [-0.07, 0.98, 0], [0.0, 1.46, -0.02], [0.02, 1.76, 0]], r: [0.19, 0.115], w: 0 },
  { pts: [[-0.02, 1.0, 0], [-0.42, 1.2, 0.03], [-0.92, 1.3, 0.05], [-1.38, 1.47, 0.02], [-1.62, 1.72, 0]], r: [0.085, 0.034], w: 1, curl: -1 },
  { pts: [[0.02, 1.12, 0], [0.46, 1.28, -0.03], [0.98, 1.37, -0.02], [1.44, 1.56, 0.02], [1.66, 1.84, 0]], r: [0.082, 0.032], w: 2, curl: 1 },
  { pts: [[0.0, 1.66, 0], [-0.32, 2.0, 0.02], [-0.76, 2.28, -0.02], [-1.16, 2.43, 0], [-1.4, 2.66, 0]], r: [0.078, 0.03], w: 3, curl: -1 },
  { pts: [[0.03, 1.68, 0], [0.36, 2.02, -0.02], [0.8, 2.26, 0.02], [1.18, 2.4, 0], [1.42, 2.62, 0]], r: [0.076, 0.03], w: 4, curl: 1 },
  { pts: [[0.24, 1.92, -0.12], [0.18, 2.38, -0.14], [0.26, 2.8, -0.1], [0.5, 3.06, -0.06], [0.78, 3.02, -0.03]], r: [0.05, 0.026], w: 5, crook: 1 },
  { pts: [[-0.6, 1.25, -0.06], [-0.69, 1.52, -0.12], [-0.64, 1.78, -0.14]], r: [0.04, 0.02], w: 1, curl: 1, from: 0.45 },
  { pts: [[0.74, 1.33, -0.06], [0.86, 1.6, -0.12], [0.8, 1.84, -0.14]], r: [0.04, 0.02], w: 2, curl: -1, from: 0.5 },
];
const NW = 6;
// The trunk bends about this height; each scene sets its own.
let HREF = 1.8;
// Sets: branch, place along it, cord length, kind, scale, resting turn.
// Branch -1 marks a fork seat with its own wobble slot.
const CURLY_SETS = [
  { b: 1, t: 0.86, L: 0.26, kind: 'classic', s: 1.0, yaw: 0.18 },
  { b: 1, t: 0.5, L: 0.5, kind: 'portable', s: 1.0, yaw: 0.1 },
  { b: 2, t: 0.86, L: 0.24, kind: 'wide', s: 0.95, yaw: -0.2 },
  { b: 2, t: 0.47, L: 0.52, kind: 'orb', s: 1.0, yaw: -0.08 },
  { b: 3, t: 0.93, L: 0.12, kind: 'portable', s: 0.9, yaw: 0.22 },
  { b: 3, t: 0.6, L: 0.1, kind: 'cube', s: 0.86, yaw: 0.05 },
  { b: 4, t: 0.84, L: 0.2, kind: 'classic', s: 0.92, yaw: -0.22 },
  { b: 4, t: 0.47, L: 0.18, kind: 'orb', s: 0.9, yaw: -0.05 },

  // Every scene's shaders build now, so a switch never stalls.
  const shown = [leafMesh.visible, grassMesh.visible, flakes.visible];
  leafMesh.visible = grassMesh.visible = flakes.visible = true;
  await renderer.compileAsync(scene, camera);
  [leafMesh.visible, grassMesh.visible, flakes.visible] = shown;
  await renderer.compileAsync(atlasScene, atlasCam);
  renderer.setRenderTarget(null);
  await renderer.compileAsync(pre([fin.material]), camera);
  ready = true;
  step(0, performance.now());
  draw();
  // The lit sets show at once, even before the loop runs.
  canvas.classList.add('on');
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; vis(); }).observe(panel);
  document.addEventListener('visibilitychange', vis);
}
start().catch(err => { console.error(err); failed(); });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
