const TAU = Math.PI * 2, D2R = Math.PI / 180;

const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
function lin(L, C, h) {
  const a = C * Math.cos(h * D2R), b = C * Math.sin(h * D2R);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,

}
// Chroma shrinks until the colour fits sRGB.
function linear(L, C, h) {

}

  leaf: linear(0.42, 0.1, 168), leafLit: linear(0.62, 0.13, 150),

// Cheerful set colours as lightness, chroma and hue.
// Neighbours on the tree differ in hue and lightness.
const SET_COLS = [[0.66, 0.17, 28], [0.77, 0.14, 86], [0.68, 0.17, 148], [0.7, 0.13, 238], [0.64, 0.17, 302], [0.76, 0.14, 352],
  [0.8, 0.16, 118], [0.72, 0.12, 200], [0.66, 0.15, 272], [0.72, 0.17, 52], [0.78, 0.11, 172], [0.62, 0.2, 330]];

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 24, LEAD = 0.004;
let ac = null, out = null, noise = null, askedAt = -1e9, voices = 0, restT = 0;
let hum = null, humAt = 0;
const gap = { clunk: 0, hiss: 0, zip: 0, on: 0, bonk: 0, sync: 0, thunk: 0 };
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.07 * voices);

function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (err) { return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;
    out = ac.createGain();
    out.gain.value = 0.55;
    out.connect(comp);
    comp.connect(ac.destination);
    // One second of white noise feeds every burst.
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    buildHum();
  }
  // Off screen, the tree stays silent until it returns.
  if (!visible) { ac.suspend()?.catch(() => {}); return; }
  if (ac.state !== 'running') { askedAt = performance.now(); ac.resume()?.catch(() => {}); }
}
// A context still waking queues sounds for a moment.
function live() {
  if (!sound.on || !ac || ac.state === 'closed') return null;
  return ac.state === 'running' || performance.now() - askedAt < 250 ? ac : null;
}
function track(src, ...tails) {
  voices++;
  src.onended = () => { voices--; tails.forEach(n => n.disconnect()); };
}
// Once the tree rests, the context sleeps until the next gesture.
function rest() {
  clearTimeout(restT);
  if (!ac || ac.state !== 'running') return;
  restT = setTimeout(() => {
    if (!raf && !held && ac.state === 'running') ac.suspend()?.catch(() => {});
  }, 1500);
}
const GESTURE_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter', 's', 'S', 't', 'T', 'e', 'E', 'p', 'P', 'l', 'L']);
function unlock(e) {
  if (!sound.on || (e.type === 'keydown' && !GESTURE_KEYS.has(e.key))) return;
  // A touch counts as a gesture only once the finger lifts.
  if (!ac && e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
  audio();
}
// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// The mains hum stacks 50 Hz harmonics under a low-pass.
// Static and swishing branches ride on looped noise.
function buildHum() {
  const N = 12, re = new Float32Array(N), im = new Float32Array(N);
  [0, 0.55, 1, 0.3, 0.38, 0.1, 0.14, 0.04, 0.05, 0, 0, 0].forEach((v, i) => { im[i] = v; });
  const wave = ac.createPeriodicWave(re, im);
  const gain = v => { const g = ac.createGain(); g.gain.value = v; return g; };
  const o1 = ac.createOscillator(), o2 = ac.createOscillator();
  o1.setPeriodicWave(wave);
  o2.setPeriodicWave(wave);
  o1.frequency.value = 50;
  // A slightly detuned twin makes the hum beat slowly.
  o2.frequency.value = 50.23;
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 310;
  lp.Q.value = 0.7;
  const hg = gain(0);
  o1.connect(lp);
  o2.connect(gain(0.5)).connect(lp);
  lp.connect(hg).connect(out);
  const ns = ac.createBufferSource();
  ns.buffer = noise;
  ns.loop = true;
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 2600;
  bp.Q.value = 0.45;
  const sg = gain(0);
  ns.connect(bp).connect(sg).connect(out);
  const ws = ac.createBufferSource();
  ws.buffer = noise;
  ws.loop = true;
  ws.playbackRate.value = 0.61;
  const wl = ac.createBiquadFilter();
  wl.type = 'lowpass';
  wl.frequency.value = 400;
  wl.Q.value = 0.6;
  const wg = gain(0);
  ws.connect(wl).connect(wg).connect(out);
  [o1, o2, ns, ws].forEach(n => n.start());
  hum = { hg, sg, wg, wl };
}
// The bed follows lit sets, lost signals and the swaying tree.
function humLevel(on, snow, sway, now) {
  const a = live();
  if (!a || !hum || now - humAt < 80) return;
  humAt = now;
  const t = a.currentTime;
  hum.hg.gain.setTargetAtTime(0.03 * Math.sqrt(on), t, 0.25);
  hum.sg.gain.setTargetAtTime(0.028 * Math.min(1, snow), t, 0.07);
  hum.wg.gain.setTargetAtTime(Math.min(0.14, sway * 0.09), t, 0.08);
  hum.wl.frequency.setTargetAtTime(260 + Math.min(1, sway) * 700, t, 0.08);
}
// Each voice pans with its place on the stage.
function bus(a, x) {
  const p = a.createStereoPanner ? a.createStereoPanner() : a.createGain();
  if (p.pan) p.pan.value = clamp(x, -1, 1) * 0.7;
  p.connect(out);
  return p;
}
// A noise burst through one filter; it tidies itself up.
function burst(a, dst, t, type, f, q, g, tau, len) {
  const src = a.createBufferSource(), fl = a.createBiquadFilter(), ng = a.createGain();
  src.buffer = noise;
  fl.type = type;
  fl.frequency.value = f;
  fl.Q.value = q;
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(g, t + 0.0008);
  ng.gain.setTargetAtTime(0, t + 0.0008, tau);
  src.connect(fl).connect(ng).connect(dst);
  src.onended = () => ng.disconnect();

// A pitched blip glides from f0 to f1.
function tone(a, dst, t, f0, f1, dur, g, type = 'sine') {
  const o = a.createOscillator(), og = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(g, t + 0.004);
  og.gain.setTargetAtTime(0, t + 0.004, dur / 3);
  o.connect(og).connect(dst);

// The tuner knob gives two detent clicks over a dull thump.
function clunk(x) {

  const t = a.currentTime + LEAD;

  burst(a, d, t + 0.042 * jit(0.15), 'bandpass', 1650 * jit(0.1), 1.5, 0.38 * g, 0.005, 0.03);

// Each extra set on one channel rings a step higher.
function matchTone(x, n) {

  const t = a.currentTime + LEAD, g = level(), d = bus(a, x), f = [523.25, 659.25, 783.99][Math.min(n, 4) - 2];

// Static is band-limited noise with a quick swell and soft tail.
function hiss(x, dur, k = 1) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < gap.hiss) return;
  gap.hiss = t + 0.06;
  const g = level() * k * jit(0.1), d = bus(a, x);

  lp.frequency.value = 5400;

  ng.gain.linearRampToValueAtTime(0.15 * g, t + 0.012);
  ng.gain.setValueAtTime(0.15 * g, t + dur * 0.55);

// Power off makes a tick, a falling zip and a fading fizz.
function zip(x) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < gap.zip) return;
  gap.zip = t + 0.08;
  const g = level() * jit(0.06), d = bus(a, x);
  burst(a, d, t, 'bandpass', 1700, 1.2, 0.32 * g, 0.004, 0.03);
  const o = a.createOscillator(), og = a.createGain(), lp = a.createBiquadFilter();
  o.type = 'triangle';
  o.frequency.setValueAtTime(560 * jit(0.04), t);
  o.frequency.exponentialRampToValueAtTime(46, t + 0.36);
  lp.type = 'lowpass';
  lp.frequency.value = 1300;

  og.gain.linearRampToValueAtTime(0.2 * g, t + 0.012);
  og.gain.setTargetAtTime(0, t + 0.22, 0.06);

  o.stop(t + 0.62);

// Power on makes a thump, a crackle and a low swell.
function powerOn(x) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < gap.on) return;
  gap.on = t + 0.08;
  const g = level() * jit(0.06), d = bus(a, x);

// Two sets bump with a plastic knock.
function bonk(x, v) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;

// A sitting set lands back in its fork.
function thunk(x, v) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < gap.thunk) return;

function syncSound(dur) {
  const a = live();
  if (!a || voices >= MAXV - 4) return;
  const t = a.currentTime + LEAD;
  if (t < gap.sync) return;

  lp.Q.value = 2.2;

  vg.gain.linearRampToValueAtTime(0.055 * g, t + 0.6);
  vg.gain.setValueAtTime(0.055 * g, t + dur - 0.6);

  for (const f of [110, 138.59, 164.81, 220.5]) {
    const o = a.createOscillator();
    o.type = 'sawtooth';
    o.frequency.value = f * jit(0.003);
    o.connect(lp);
    o.start(t);
    o.stop(t + dur + 0.05);
    first = first || o;

      uSway: { value: new THREE.Vector2() }, uWob: { value: Array.from({ length: 8 }, v3) },
      uBark: { value: V(PAL.bark) }, uTip: { value: V(PAL.barkTip) }, uRim: { value: V(PAL.barkRim) }, uKey: { value: V(PAL.key).multiplyScalar(0.55) },
      uKeyDir: { value: new THREE.Vector3(-2.5, 4, 5).normalize() }, uSky: { value: V(PAL.sky).multiplyScalar(0.4) }, uGround: { value: V(PAL.ground).multiplyScalar(0.4) },
      uTvP: { value: Array.from({ length: 16 }, () => new THREE.Vector3(0, -50, 0)) }, uTvC: { value: Array.from({ length: 16 }, v3) },
      uLanP: { value: new THREE.Vector3(0, -50, 0) }, uLanC: { value: v3() },
    },
  });
  treeMesh = new THREE.Mesh(new THREE.BufferGeometry(), treeMat);
  treeMesh.frustumCulled = false;
  const TU = treeMat.uniforms;
  const groundMat = new THREE.ShaderMaterial({
    vertexShader: GROUND_VS, fragmentShader: GROUND_FS, transparent: true, depthWrite: false,
    uniforms: { uSoil: { value: V(linear(0.17, 0.025, 300)) }, uMoon: { value: V(PAL.rim) }, uLanP: TU.uLanP, uLanC: TU.uLanC, uTvP: TU.uTvP, uTvC: TU.uTvC },
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(16, 16).rotateX(-Math.PI / 2), groundMat);
  ground.frustumCulled = false;
  const shrubMat = new THREE.ShaderMaterial({
    vertexShader: SHRUB_VS, fragmentShader: SHRUB_FS,
    uniforms: {
      uLeaf: { value: V(PAL.leaf).multiplyScalar(0.35) }, uLeafLit: { value: V(PAL.leafLit).multiplyScalar(0.3) }, uRim: { value: V(PAL.rim) },
      uKey: TU.uKey, uKeyDir: TU.uKeyDir, uSky: TU.uSky, uGround: TU.uGround, uLanP: TU.uLanP, uLanC: TU.uLanC, uTvP: TU.uTvP, uTvC: TU.uTvC,
    },
  });
  scene.add(bg, treeMesh, ground, buildShrubs(shrubMat), buildLantern());

  atlasRT = new THREE.WebGLRenderTarget(TW * TC, TH * TC, { depthBuffer: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false });
  const v4 = () => Array.from({ length: 16 }, () => new THREE.Vector4());
  // The group shaders share one set of uniforms.
  const atlasU = { uTime: { value: 0 }, uA: { value: v4() }, uB: { value: v4() }, uC: { value: v4() }, uD: { value: v4() }, uBig: { value: new THREE.Vector4() } };
  atlasMats = GROUPS.map(code => new THREE.ShaderMaterial({ vertexShader: QUAD_VS, fragmentShader: atlasFS(code), depthTest: false, depthWrite: false, uniforms: atlasU }));
  atlasMat = atlasMats[0];
  atlasScene = new THREE.Scene();
  atlasQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), atlasMat);
  atlasQuad.frustumCulled = false;
  atlasScene.add(atlasQuad);
  atlasCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  makeSets();
  await idle();

  const rt = new THREE.WebGLRenderTarget(16, 9, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  // A faint bloom lifts only what passes full white: the screens.
  const bloom = new UnrealBloomPass(new THREE.Vector2(16, 9), 0.32, 0.55, 0.95);
  composer.addPass(bloom);
  const fin = new ShaderPass({ uniforms: { tDiffuse: { value: null } }, vertexShader: FINAL_VS, fragmentShader: FINAL_FS });
  composer.addPass(fin);

  // The stored Lantern choice lights the lantern at once, without the match.
  lantern.on = ui.setting('lantern').value;
  lantern.fade = lantern.on ? 1 : 0;
  panel.prepend(canvas);
  fitRenderer(renderer, panel, 2, onSize, 1.4e6);
  // Corners that move, resize or stack refit the tree.
  if (layer) {
    const refit = () => { if (sized && panel.clientWidth && panel.clientHeight) onSize(panel.clientWidth, panel.clientHeight); };
    const ro = new ResizeObserver(refit);
    layer.querySelectorAll(':scope > :is(.s2-tl, .s2-tr, .s2-bl, .s2-br, .s2-keys)').forEach(el => ro.observe(el));
    new MutationObserver(refit).observe(layer.parentElement, { attributes: true, attributeFilter: ['data-narrow', 'data-stack', 'data-tight'] });
  }
  // A panel with no size yet still gets a frame.
  if (!sized) onSize(16, 9);
  quiet = false;
  await idle();
  // Async compile keeps the shader builds off the main thread.
  // Programs match their targets: offscreen first, then the screen.
  const quad = new THREE.PlaneGeometry(2, 2), pre = mats => { const s = new THREE.Scene(); mats.forEach(m => s.add(new THREE.Mesh(quad, m))); return s; };
  renderer.setRenderTarget(composer.readBuffer);
  await renderer.compileAsync(scene, camera);
  await renderer.compileAsync(pre(atlasMats), atlasCam);
  renderer.setRenderTarget(null);
  await renderer.compileAsync(pre([bloom.materialHighPassFilter, ...bloom.separableBlurMaterials, bloom.compositeMaterial, bloom.blendMaterial]), camera);
  await renderer.compileAsync(pre([fin.material]), camera);
  ready = true;
  step(0, performance.now());
  draw();
  // The lit sets show at once, even before the loop runs.
  canvas.classList.add('on');
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; vis(); }).observe(panel);
  document.addEventListener('visibilitychange', vis);
}
start().catch(err => { console.error(err); failed(); });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
</body>
