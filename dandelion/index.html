<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>html { background: oklch(0.16 0.012 275); }</style>

<title>Dandelion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Dandelion: a seed head in a golden meadow. */
:root { --stage: oklch(0.3 0.05 105); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
/* On the warm stage the line keeps a pale tone. */
.stage--dandelion .fail { color: oklch(0.8 0.03 95); }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Dandelion</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--dandelion" id="stage" tabindex="0" role="application" aria-label="A dandelion seed head in a golden meadow. Drag across it to blow the seeds away, or press and hold for a stronger gust. Space blows a gust, arrow keys blow that way, and R regrows the head.">
      <p class="fail" hidden>Dandelion needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="actions">
        <button class="chip" id="regrow" type="button" aria-keyshortcuts="R" aria-disabled="true">Regrow</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag</dt><dd>blow</dd></div>
        <div><dt>Hold</dt><dd>stronger gust</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>gust</dd></div>
        <div class="fine"><dt><kbd>R</kbd></dt><dd>regrow</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Dandelion</h1><div class="vignette" hidden></div></section>
</div>

const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
</body>
</html>
