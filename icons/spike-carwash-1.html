<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Car wash 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Car wash 1</h1>
<p class="lede">Car wash, round 1: the pylon at night as one bold object, after Tom's note that the old icon was too detailed, with thin lines. A: free on the ground. D: on a block of desert lot with the road.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };



  // The toy's tokens: faded cream paint, sign red, sodium amber, the two neons.
  const CREAM = [[0, 'oklch(0.9 0.04 88)'], [1, 'oklch(0.7 0.05 72)']];
  const RED = 'oklch(0.55 0.19 28)';
  const AMBER = [[0, 'oklch(0.8 0.13 80)'], [1, 'oklch(0.56 0.12 58)']];
  const STEEL = [[0, 'oklch(0.66 0.01 80)'], [1, 'oklch(0.4 0.012 70)']];
  const BOX = [[0, 'oklch(0.3 0.015 270)'], [1, 'oklch(0.14 0.01 270)']];
  const NEON_R = 'oklch(0.66 0.25 28)', NEON_B = 'oklch(0.7 0.16 248)';
  const BULB_ON = 'oklch(0.96 0.11 90)', BULB_DEAD = 'oklch(0.44 0.07 62)';
  // The arrow's bulbs run along its middle; most are dead.
  const BULBS = [20, 31, 42, 53, 64, 75, 86, 99, 109];
  const LIVE = [1, 0, 1, 1, 0, 1, 0, 1, 1];
  // This dead bulb tries to light when the pointer comes in.
  const TRIER = 4;
  const ARROW = 'M12 51H90V43L118 59L90 75V67H12Z';
  const PANEL = 'M30 42L36 8H98L92 42Z';
  const NBOX = 'M35 74H93Q96 74 96 77V95Q96 98 93 98H35Q32 98 32 95V77Q32 74 35 74Z';
  const LEGS = ['M50 30H57V122H50Z', 'M71 30H78V122H71Z'];

  // The pylon in its own frame: the foot at 64 122.
  const pylonDefs = u => `${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}g`, 1.8)}
    ${lg(`${u}cream`, CREAM)}${lg(`${u}amber`, AMBER)}${lg(`${u}box`, BOX)}
    ${lg(`${u}steel`, STEEL, 'x1="0" y1="0" x2="1" y2="0"')}
    ${rg(`${u}halo`, [[0, 'oklch(0.9 0.14 85)', 0.9], [1, 'oklch(0.8 0.14 70)', 0]])}`;
  const pylonMarkup = u => `
    <ellipse cx="64" cy="122" rx="28" ry="3.6" fill="oklch(0.05 0.01 275)" opacity="0.55" filter="url(#${u}b)"/>
    ${LEGS.map(d => body(d, u, 'steel')).join('')}
    <path d="${NBOX}" transform="translate(2.5 2.5)" fill="oklch(0.08 0.01 270)"/>
    ${body(NBOX, u, 'box')}
    <g class="neon">
      <g filter="url(#${u}g)" opacity="0.8">
        <path class="open" d="M42 82.5H63" stroke="${NEON_R}" stroke-width="7" stroke-linecap="round"/>
        <path d="M70 82.5H86M42 91H86" stroke="${NEON_B}" stroke-width="6" stroke-linecap="round"/>
      </g>
      <path class="open" d="M42 82.5H63" stroke="${NEON_R}" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M70 82.5H86M42 91H86" stroke="${NEON_B}" stroke-width="4" stroke-linecap="round"/>
    </g>
    <ellipse class="warm" cx="66" cy="59" rx="62" ry="26" fill="url(#${u}halo)" opacity="0.18"/>
    <path d="${ARROW}" transform="translate(2.5 3)" fill="oklch(0.36 0.08 50)"/>
    ${body(ARROW, u, 'amber')}
    <g class="halos">${BULBS.map((x, i) => `<circle cx="${x}" cy="59" r="9" fill="url(#${u}halo)" opacity="${LIVE[i] ? 0.55 : 0}"/>`).join('')}</g>
    <g class="bulbs">${BULBS.map((x, i) => `<circle cx="${x}" cy="59" r="3.8" fill="${LIVE[i] ? BULB_ON : BULB_DEAD}"/>`).join('')}</g>
    <path d="${PANEL}" transform="translate(3 3)" fill="oklch(0.42 0.05 55)"/>
    ${body(PANEL, u, 'cream')}
    <text x="64" y="33.5" transform="skewX(-10) translate(4.4 0)" text-anchor="middle" font-family="Gabarito, sans-serif" font-weight="900" font-size="23" letter-spacing="0.5" fill="${RED}">WASH</text>`;

  // The pylon's life: the chase, the stutter, the trier and the pointer glow.
  // to(p) maps a tile point into the pylon's own frame.
  const pylon = (svg, to) => {
    const bulbs = [...svg.querySelectorAll('.bulbs circle')], halos = [...svg.querySelectorAll('.halos circle')];
    const opens = svg.querySelectorAll('.open');
    let chase = null, live = false;
    const glow = i => (LIVE[i] ? 0.55 : 0);
    return {
      enter(p) {
        live = true;
        chase?.kill();
        // The live bulbs light one after another, toward the arrow's head.
        chase = gsap.timeline({ repeat: -1, repeatDelay: 0.15 });
        BULBS.forEach((x, i) => { if (LIVE[i]) chase.to(halos[i], { opacity: 1, scale: 1.25, svgOrigin: `${x} 59`, duration: 0.12, yoyo: true, repeat: 1, ease: 'power1.inOut' }, i * 0.11); });
        // Two short dips in the OPEN tube.
        gsap.timeline().to(opens, { opacity: 0.2, duration: 0.05 }).to(opens, { opacity: 1, duration: 0.05 }, 0.12)
          .to(opens, { opacity: 0.25, duration: 0.05 }, 0.45).to(opens, { opacity: 1, duration: 0.05 }, 0.56);
        // The dead bulb flickers, then holds.
        gsap.timeline().set(bulbs[TRIER], { attr: { fill: BULB_ON } }, 0.2).set(bulbs[TRIER], { attr: { fill: BULB_DEAD } }, 0.28)
          .set(bulbs[TRIER], { attr: { fill: BULB_ON } }, 0.5).to(halos[TRIER], { opacity: 0.6, duration: 0.2 }, 0.5);
        gsap.to(svg.querySelector('.warm'), { opacity: 0.4, duration: 0.5, overwrite: true });
        if (p) this.move(p);
      },
      // Bulbs near the pointer swell; live ones flare.
      move(p) {
        if (!p || !live) return;
        const q = to(p);
        bulbs.forEach((b, i) => {
          const near = Math.max(0, 1 - Math.hypot(q[0] - BULBS[i], q[1] - 59) / 24);
          gsap.to(b, { scale: 1 + 0.45 * near, svgOrigin: `${BULBS[i]} 59`, duration: 0.25, overwrite: 'auto' });
        });
      },
      leave() {
        live = false;
        chase?.kill(); chase = null;
        gsap.to(bulbs, { scale: 1, duration: 0.4, overwrite: 'auto' });
        gsap.set(bulbs[TRIER], { attr: { fill: BULB_DEAD } });
        halos.forEach((h, i) => gsap.to(h, { opacity: glow(i), scale: 1, duration: 0.4, overwrite: 'auto' }));
        gsap.to(opens, { opacity: 1, duration: 0.3, overwrite: true });
        gsap.to(svg.querySelector('.warm'), { opacity: 0.18, duration: 0.5, overwrite: true });
      },
    };
  };

  // The emblem's pylon: black strokes cut the parts apart.
  const CUT = 'stroke="#000" stroke-width="3" stroke-linejoin="round"';
  const pylonEmblem = `<path d="M50 30H57V122H50ZM71 30H78V122H71Z" fill="#fff"/><path d="${NBOX}" fill="#9a9a9a"/><path d="${ARROW}" fill="#fff"/><path d="${PANEL}" fill="#fff" ${CUT}/>`;

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<path d="M4 104H124" stroke="oklch(0.42 0.02 80)" stroke-width="1.5"/>
        <path d="M66 104V84H122V104Z" fill="oklch(0.6 0.03 85)"/>
        <path d="M84 104V90H104V104Z" fill="oklch(0.84 0.05 200)" opacity="0.8"/>
        <path d="M60 80L110 83V86L60 83Z" fill="oklch(0.62 0.05 195)"/>
        <path d="M64 83V104M106 85V104" stroke="oklch(0.45 0.01 80)" stroke-width="1.2"/>
        <g fill="oklch(0.86 0.06 80)"><rect x="70" y="87" width="5" height="3"/><rect x="77" y="87" width="5" height="3"/><rect x="108" y="87" width="5" height="3"/></g>
        <path d="M118 104V58M118 59H112" stroke="oklch(0.38 0.03 60)" stroke-width="1.6" fill="none"/>
        <ellipse class="lamp" cx="111" cy="60" rx="3.4" ry="1.5" fill="oklch(0.82 0.15 62)"/>
        <path d="M27 104V16M33 104V16" stroke="oklch(0.5 0.01 80)" stroke-width="1.8"/>
        <path d="M18 14L42 11V35L18 38Z" fill="oklch(0.82 0.04 85)" stroke="oklch(0.5 0.15 28)" stroke-width="1.4"/>
        <path d="M23 21L36 19.5M23 28L37 26.5" stroke="oklch(0.5 0.15 28)" stroke-width="3" stroke-linecap="round"/>
        <path d="M15 43H45V38L57 46L45 54V49H15Z" fill="oklch(0.74 0.12 85)"/>
        <g class="bulbs" fill="oklch(0.9 0.14 75)">
          <circle cx="17" cy="45" r="1.5"/><circle cx="25" cy="45" r="1.5"/><circle cx="33" cy="45" r="1.5"/><circle cx="41" cy="45" r="1.5"/><circle cx="47" cy="41.5" r="1.5"/><circle cx="54" cy="46" r="1.5"/><circle cx="47" cy="50.5" r="1.5"/><circle cx="41" cy="47.5" r="1.5"/><circle cx="29" cy="47.5" r="1.5"/><circle cx="19" cy="47.5" r="1.5"/>
        </g>
        <rect x="17" y="58" width="26" height="15" rx="1.5" fill="oklch(0.14 0.01 270)"/>
        <path class="open" d="M21 62.5H39" stroke="oklch(0.64 0.25 28)" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M21 68.5H27M32 68.5H39" stroke="oklch(0.68 0.15 248)" stroke-width="2.2" stroke-linecap="round"/>`;
      const bulbs = [...svg.querySelector('.bulbs').children], open = svg.querySelector('.open'), lamp = svg.querySelector('.lamp');
      const LIVE0 = [1, 0, 1, 1, 0, 1, 0, 1, 0, 0], DIM = 0.22;
      let chase = null;
      const rest = () => bulbs.forEach((b, i) => gsap.to(b, { opacity: LIVE0[i] ? 0.85 : DIM, duration: 0.5, overwrite: 'auto' }));
      rest();
      const c = {
        enter(p) {
          chase?.kill();
          chase = gsap.timeline({ repeat: -1 });
          bulbs.forEach((b, i) => { if (LIVE0[i]) chase.to(b, { opacity: 1, duration: 0.12, yoyo: true, repeat: 1, ease: 'power1.inOut' }, i * 0.14); });
          gsap.timeline().to(open, { opacity: 0.25, duration: 0.05 }).to(open, { opacity: 1, duration: 0.05 }, 0.12)
            .to(open, { opacity: 0.3, duration: 0.05 }, 0.5).to(open, { opacity: 1, duration: 0.05 }, 0.62);
          gsap.to(lamp, { opacity: 1, duration: 0.4 });
          if (p) c.move(p);
        },
        move(p) {
          if (!p) return;
          bulbs.forEach(b => {
            const d = Math.hypot(p[0] - +b.getAttribute('cx'), p[1] - +b.getAttribute('cy'));
            gsap.to(b, { scale: 1 + 0.6 * Math.max(0, 1 - d / 26), transformOrigin: '50% 50%', duration: 0.25, overwrite: 'auto' });
          });
        },
        leave() {
          chase?.kill(); chase = null;
          gsap.to(bulbs, { scale: 1, duration: 0.5, overwrite: 'auto' });
          rest();
          gsap.to(open, { opacity: 1, duration: 0.3 });
        },
      };
      return c;
    },
  });

  /* ================= A: Shaded object ================= */

  // The pylon alone, free on the ground.
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [12, 8, 106, 115],
    idea: 'The pylon as one bold object: two steel pipes, the slanted cream panel with WASH in sign red, the amber arrow with a row of big bulbs, and the OPEN 24 HRS neon box. Most bulbs are dead. Enter: the live bulbs chase toward the arrow head, the red tube stutters twice, and one dead bulb flickers on and holds. The bulbs nearest the pointer swell.',
    art(svg, u) {
      svg.innerHTML = `<defs>${pylonDefs(u)}</defs>${pylonMarkup(u)}`;
      return pylon(svg, p => p);
    },
    emblem: `${EMB_HEAD}${pylonEmblem}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The lot is the block: sand on top, the road's asphalt across it, earth on the faces.
  const CY = 94, HALF = 30, T = 14;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const [N, E, S, W] = D_TOP;
  const down = p => [p[0], p[1] + T];
  // The road runs along one axis, in front of the pylon.
  const D_ROAD = poly([iso(-HALF, 12), iso(HALF, 12), iso(HALF, 24), iso(-HALF, 24)]);
  // The pylon stands on the block's middle at this scale.
  const DS = 0.74, DX = 64, DY = CY + 2;
  const dPylon = `translate(${DX} ${DY}) scale(${DS}) translate(-64 -122)`;
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [12, 11, 104, 127],
    idea: 'The lot is the block: pale desert sand on top with a strip of road asphalt across the front, earth on the faces, a rim on the top edges. The same pylon stands on it. Enter starts the chase and the stutter; the bulbs nearest the pointer swell.',
    art(svg, u) {
      svg.innerHTML = `<defs>${pylonDefs(u)}${blur(`${u}s`, 2.6)}
          ${lg(`${u}sand`, [[0, 'oklch(0.78 0.06 75)'], [1, 'oklch(0.6 0.07 60)']], 'x1="0.3" y1="0" x2="0.6" y2="1"')}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 290)" opacity="0.5" filter="url(#${u}s)" transform="translate(0 4)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="oklch(0.46 0.06 50)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="oklch(0.32 0.05 45)"/>
        <path d="${poly(D_TOP)}" fill="url(#${u}sand)"/>
        <path d="${D_ROAD}" fill="oklch(0.28 0.012 260)"/>
        <path d="${poly(D_TOP)}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g transform="${dPylon}">${pylonMarkup(u)}</g>`;
      return pylon(svg, p => [(p[0] - DX) / DS + 64, (p[1] - DY) / DS + 122]);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/><path d="${D_ROAD}" fill="#444"/><g transform="${dPylon}">${pylonEmblem}</g></svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = 'Car wash';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-carwash';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `carwash-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
