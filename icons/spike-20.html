<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 20</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<h1>Icon spike 20</h1>
<p class="lede">Window seat: the current icon and five directions. Lean with the pointer; flick it up or down for turbulence.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  // A pointer control from three plain functions; focus plays a demo.
  const ctl = (aim, rest, demo, start = () => {}) => {
    let tl = null;
    return {
      enter(p) { start(); if (p) aim(p); else tl = demo(); },
      move(p) { if (p && !tl) aim(p); },
      leave() { tl?.kill(); tl = null; rest(); },
    };
  };
  // A repeat that runs while the pointer stays.
  const every = (dt, fn) => {
    let dc = null;
    const go = () => { fn(); dc = gsap.delayedCall(dt, go); };
    return { start() { if (!dc) go(); }, stop() { dc?.kill(); dc = null; } };
  };

  /* ================= Window seat kit ================= */

  // Tile geometry: the face and its hard shadow, as the menu draws them.
  const T0 = 16, SHADOW = 'oklch(0.07 0.01 260)';
  const tileBack = (svg, fill) => {
    el('rect', { x: 22, y: 22, width: 92, height: 92, fill: SHADOW }, svg);
    return el('rect', { x: T0, y: T0, width: 92, height: 92, fill }, svg);
  };
  // The port: a tall rounded window, tipped a little, centred on the tile.
  const PORT = { x: 36, y: 28, w: 52, h: 68, r: 24, tilt: 'rotate(-6 62 62)' };
  const port = (svg, attrs, grow = 0) => el('rect', { x: PORT.x - grow, y: PORT.y - grow, width: PORT.w + 2 * grow, height: PORT.h + 2 * grow, rx: PORT.r + grow, transform: PORT.tilt, ...attrs }, svg);
  // The wing in port space: root low right, swept up left to the winglet.
  const WING = 'M110 72L50 58L43 38L48 38L57 66L110 112Z';
  const FLAP = 'M110 98L62 72L57 66L110 112Z';
  const LE = 'M110 72L50 58L43 38';
  const TIP = [45, 39];

  // Lean: each layer shifts by its own depth; the wing, nearest, shifts most.
  // A quick move is turbulence: the wing flexes about its root, then settles.
  // While the pointer stays, the wingtip strobe double-flashes.
  const leanCtl = ({ layers, wing, root = '110 96', strobe, extra, demoPath }) => {
    let last = null, flash = null;
    const aim = p => {
      const dx = clamp((p[0] - 62) / 46, -1, 1), dy = clamp((p[1] - 62) / 46, -1, 1);
      for (const [g, k] of layers) gsap.to(g, { x: -dx * k, y: -dy * k * 0.75, duration: 0.5, ease: 'power2.out', overwrite: 'auto' });
      if (wing && last) {
        const kick = clamp((p[1] - last[1]) * 0.5, -6, 6);
        if (Math.abs(kick) > 0.6) gsap.fromTo(wing, { rotation: kick, svgOrigin: root }, { rotation: 0, svgOrigin: root, duration: 1.1, ease: 'elastic.out(1, 0.35)' });
      }
      last = p;
      extra?.(dx, dy);
    };
    const start = () => {
      if (flash || !strobe) return;
      flash = gsap.timeline({ repeat: -1, repeatDelay: 0.9 })
        .to(strobe, { opacity: 0.95, duration: 0.03 }).to(strobe, { opacity: 0, duration: 0.1 })
        .to(strobe, { opacity: 0.95, duration: 0.03 }, '+=0.08').to(strobe, { opacity: 0, duration: 0.12 });
    };
    const rest = () => {
      last = null; flash?.kill(); flash = null;
      if (strobe) gsap.to(strobe, { opacity: 0, duration: 0.2, overwrite: 'auto' });
      for (const [g] of layers) gsap.to(g, { x: 0, y: 0, rotation: 0, duration: 0.7, ease: 'power2.out', overwrite: 'auto' });
      extra?.(0, 0);
    };
    // With no pointer, the head sways slowly.
    const demo = () => {
      const d = { t: 0 };
      return gsap.to(d, { t: 1, duration: 5, repeat: -1, ease: 'none', onUpdate: () => aim(demoPath ? demoPath(d.t) : [62 + 36 * Math.sin(d.t * TAU), 62 + 16 * Math.sin(d.t * TAU * 2)]) });
    };
    return ctl(aim, rest, demo, start);
  };
  const strobeDot = (g, r = 6) => el('circle', { cx: TIP[0], cy: TIP[1], r, fill: 'oklch(0.98 0.01 250)', opacity: 0 }, g);

  const DIRS = [
    {
      toy: 'window', l: 'Current', name: 'Porthole',
      // The menu icon: the port, its bezel, and the wing through it.
      art(svg, id) {
        const defs = el('defs', {}, svg);
        const sky = el('linearGradient', { id: `${id}s`, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
        [[0, 'oklch(0.2 0.07 285)'], [0.5, 'oklch(0.42 0.13 330)'], [0.78, 'oklch(0.74 0.16 55)'], [1, 'oklch(0.86 0.12 80)']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, sky));
        const cp = el('clipPath', { id: `${id}c` }, defs);
        port(cp, {});
        tileBack(svg, 'oklch(0.3 0.012 60)');
        port(svg, { fill: 'oklch(0.36 0.012 60)' }, 9);
        port(svg, { fill: 'oklch(0.16 0.01 60)' }, 6);
        const glass = el('g', { 'clip-path': `url(#${id}c)` }, svg);
        const view = el('g', {}, glass);
        el('rect', { x: 20, y: 16, width: 90, height: 52, fill: `url(#${id}s)` }, view);
        el('circle', { cx: 70, cy: 60, r: 3.4, fill: 'oklch(0.98 0.05 90)' }, view);
        el('path', { d: 'M20 64L110 58V70L20 76Z', fill: 'oklch(0.4 0.06 330)' }, view);
        el('path', { d: 'M20 72L110 66V112H20Z', fill: 'oklch(0.16 0.03 285)' }, view);
        const wing = el('g', {}, glass);
        el('path', { d: WING, fill: 'oklch(0.62 0.012 265)' }, wing);
        el('path', { d: FLAP, fill: 'oklch(0.47 0.012 265)' }, wing);
        el('path', { d: LE, fill: 'none', stroke: 'oklch(0.9 0.05 60)', 'stroke-width': 1.6, 'stroke-linejoin': 'round' }, wing);
        el('circle', { cx: TIP[0], cy: TIP[1], r: 2, fill: 'oklch(0.66 0.24 25)' }, wing);
        const st = strobeDot(wing);
        return leanCtl({ layers: [[view, 5], [wing, 10]], wing, strobe: st });
      },
    },
    {
      toy: 'window', l: 'A', name: 'Shaded object',
      // A moulded port with depth, dusk cloud tops below, a lit wing with a soft glint.
      art(svg, id) {
        const defs = el('defs', {}, svg);
        const lin = (n, x2, y2, stops) => { const g = el('linearGradient', { id: `${id}${n}`, x1: 0, y1: 0, x2, y2 }, defs); stops.forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, g)); };
        lin('wall', 1, 1, [[0, 'oklch(0.36 0.014 60)'], [1, 'oklch(0.25 0.012 60)']]);
        lin('bez', 1, 1, [[0, 'oklch(0.52 0.014 60)'], [0.5, 'oklch(0.34 0.012 60)'], [1, 'oklch(0.22 0.01 60)']]);
        lin('rec', 1, 1, [[0, 'oklch(0.1 0.01 60)'], [1, 'oklch(0.24 0.012 60)']]);
        lin('sky', 0, 1, [[0, 'oklch(0.18 0.06 280)'], [0.45, 'oklch(0.36 0.12 320)'], [0.72, 'oklch(0.66 0.17 40)'], [0.86, 'oklch(0.86 0.13 75)']]);
        lin('wng', 1, 1, [[0, 'oklch(0.8 0.02 70)'], [0.45, 'oklch(0.6 0.014 265)'], [1, 'oklch(0.4 0.014 265)']]);
        const rg = el('radialGradient', { id: `${id}sun` }, defs);
        el('stop', { offset: 0, 'stop-color': 'oklch(0.98 0.06 90)' }, rg);
        el('stop', { offset: 0.25, 'stop-color': 'oklch(0.9 0.12 70)', 'stop-opacity': 0.8 }, rg);
        el('stop', { offset: 1, 'stop-color': 'oklch(0.7 0.16 45)', 'stop-opacity': 0 }, rg);
        const ng = el('radialGradient', { id: `${id}nav` }, defs);
        el('stop', { offset: 0, 'stop-color': 'oklch(0.75 0.22 25)' }, ng);
        el('stop', { offset: 1, 'stop-color': 'oklch(0.6 0.24 25)', 'stop-opacity': 0 }, ng);
        const cp = el('clipPath', { id: `${id}c` }, defs);
        port(cp, {});
        tileBack(svg, `url(#${id}wall)`);
        port(svg, { fill: `url(#${id}bez)` }, 10);
        port(svg, { fill: `url(#${id}rec)` }, 6);
        // The rim of the recess catches the cabin light along its top.
        port(svg, { fill: 'none', stroke: 'oklch(0.62 0.02 60)', 'stroke-width': 1, opacity: 0.6 }, 9.5);
        const glass = el('g', { 'clip-path': `url(#${id}c)` }, svg);
        const view = el('g', {}, glass);
        el('rect', { x: 18, y: 14, width: 94, height: 54, fill: `url(#${id}sky)` }, view);
        const sun = el('circle', { cx: 72, cy: 58, r: 9, fill: `url(#${id}sun)` }, view);
        el('circle', { cx: 72, cy: 58, r: 2.4, fill: 'oklch(0.99 0.03 95)' }, view);
        const tops = el('g', {}, glass);
        [[34, 70, 14, 4], [58, 67, 16, 4.5], [86, 66, 14, 4], [46, 76, 18, 5], [78, 74, 20, 5.5]].forEach(([x, y, rx, ry], i) =>
          el('ellipse', { cx: x, cy: y, rx, ry, fill: i < 3 ? 'oklch(0.62 0.09 20)' : 'oklch(0.48 0.07 330)' }, tops));
        el('rect', { x: 18, y: 76, width: 94, height: 40, fill: 'oklch(0.3 0.05 300)' }, tops);
        const wing = el('g', {}, glass);
        el('path', { d: WING, fill: `url(#${id}wng)` }, wing);
        el('path', { d: FLAP, fill: 'oklch(0.38 0.012 265)', opacity: 0.85 }, wing);
        el('path', { d: 'M110 84L60 64', fill: 'none', stroke: 'oklch(0.5 0.012 265)', 'stroke-width': 0.8 }, wing);
        el('path', { d: LE, fill: 'none', stroke: 'oklch(0.95 0.05 70)', 'stroke-width': 1.8, 'stroke-linejoin': 'round' }, wing);
        const glint = el('ellipse', { cx: 82, cy: 70, rx: 10, ry: 2.4, fill: 'oklch(0.98 0.04 80)', opacity: 0.35, transform: 'rotate(14 82 70)' }, wing);
        el('circle', { cx: TIP[0], cy: TIP[1], r: 5, fill: `url(#${id}nav)` }, wing);
        el('circle', { cx: TIP[0], cy: TIP[1], r: 1.6, fill: 'oklch(0.75 0.22 25)' }, wing);
        const st = strobeDot(wing, 7);
        // The pane mirrors the cabin: a soft curved sheen across the glass.
        el('path', { d: 'M41 40C44 31 52 27 61 26', fill: 'none', stroke: 'oklch(0.98 0.01 250)', 'stroke-width': 2.6, 'stroke-linecap': 'round', opacity: 0.2 }, svg);
        return leanCtl({
          layers: [[view, 3], [tops, 6], [wing, 11]], wing, strobe: st,
          // The sun swells, and the glint slides along the wing as the head moves.
          extra: (dx, dy) => {
            gsap.to(sun, { attr: { r: 9 + 5 * Math.max(0, 1 - Math.hypot(dx - 0.3, dy + 0.2)) }, duration: 0.5, overwrite: 'auto' });
            gsap.to(glint, { attr: { cx: 82 - dx * 14 }, opacity: 0.2 + 0.4 * Math.max(0, -dy), duration: 0.5, overwrite: 'auto' });
          },
        });
      },
      emblem: '',
    },
    {
      toy: 'window', l: 'B', name: 'Stencil cut-out',
      // The port is a hole cut through a pale tile; the wing is a stencil behind it.
      art(svg, id) {
        const defs = el('defs', {}, svg);
        const m = el('mask', { id: `${id}m` }, defs);
        el('rect', { x: T0, y: T0, width: 92, height: 92, fill: '#fff' }, m);
        port(m, { fill: '#000' }, 2);
        const cp = el('clipPath', { id: `${id}c` }, defs);
        port(cp, {}, 2);
        el('rect', { x: 22, y: 22, width: 92, height: 92, fill: SHADOW }, svg);
        const back = el('g', { 'clip-path': `url(#${id}c)` }, svg);
        el('rect', { x: 20, y: 16, width: 90, height: 96, fill: 'oklch(0.2 0.05 280)' }, back);
        const view = el('g', {}, back);
        el('path', { d: 'M18 64L112 56V60L18 68Z', fill: 'oklch(0.78 0.15 55)' }, view);
        const wing = el('g', {}, back);
        el('path', { d: WING, fill: 'oklch(0.9 0.04 75)' }, wing);
        el('circle', { cx: TIP[0], cy: TIP[1], r: 2.2, fill: 'oklch(0.66 0.24 25)' }, wing);
        const st = strobeDot(wing, 6);
        el('rect', { x: T0, y: T0, width: 92, height: 92, fill: 'oklch(0.9 0.04 75)', mask: `url(#${id}m)` }, svg);
        return leanCtl({ layers: [[view, 4], [wing, 9]], wing, strobe: st });
      },
      emblem: '',
    },
    {
      toy: 'window', l: 'C', name: 'Single-weight line',
      // One line weight: the port, the horizon, the wing; the horizon banks with the pointer.
      art(svg, id) {
        const defs = el('defs', {}, svg);
        const cp = el('clipPath', { id: `${id}c` }, defs);
        port(cp, {});
        tileBack(svg, 'oklch(0.2 0.02 265)');
        const ink = { fill: 'none', stroke: 'oklch(0.93 0.02 70)', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
        port(svg, ink, 7);
        port(svg, ink, 0);
        const glass = el('g', { 'clip-path': `url(#${id}c)` }, svg);
        const view = el('g', {}, glass);
        el('path', { d: 'M18 64L112 56', ...ink }, view);
        el('path', { d: 'M28 72Q36 68 44 72M64 70Q74 65 84 69', ...ink, opacity: 0.55 }, view);
        el('circle', { cx: 72, cy: 50, r: 3, ...ink }, view);
        const wing = el('g', {}, glass);
        el('path', { d: 'M110 72L50 58L43 38L48 38L57 66L110 106', ...ink }, wing);
        el('path', { d: 'M110 92L62 72', ...ink, opacity: 0.55 }, wing);
        el('circle', { cx: TIP[0], cy: TIP[1], r: 1.8, fill: 'oklch(0.7 0.22 25)' }, wing);
        const st = strobeDot(wing, 5);
        return leanCtl({
          layers: [[view, 4], [wing, 9]], wing, strobe: st,
          // Left and right bank the plane: the horizon tilts the other way.
          extra: dx => gsap.to(view, { rotation: dx * 10, svgOrigin: '62 62', duration: 0.6, ease: 'power2.out', overwrite: false }),
        });
      },
      emblem: '',
    },
    {
      toy: 'window', l: 'D', name: 'Isometric block',
      // A block of cabin wall; the port sits in its top face, the wing beyond.
      art(svg, id) {
        const L = [20, 54], Tp = [64, 32], B = [64, 76], R = [108, 54], DEP = 18;
        const P = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
        const dn = p => [p[0], p[1] + DEP];
        el('path', { d: P([L, B, R, dn(R), dn(B), dn(L)].map(p => [p[0] + 6, p[1] + 6])), fill: SHADOW }, svg);
        el('path', { d: P([L, B, dn(B), dn(L)]), fill: 'oklch(0.3 0.012 60)' }, svg);
        el('path', { d: P([B, R, dn(R), dn(B)]), fill: 'oklch(0.2 0.01 60)' }, svg);
        el('path', { d: P([L, Tp, R, B]), fill: 'oklch(0.4 0.014 60)' }, svg);
        // Face space is the tile square; a matrix maps it onto the rhombus.
        const a = (Tp[0] - L[0]) / 92, b = (Tp[1] - L[1]) / 92, c = (B[0] - L[0]) / 92, d = (B[1] - L[1]) / 92;
        const e = L[0] - 16 * a - 16 * c, g0 = L[1] - 16 * b - 16 * d;
        const face = el('g', { transform: `matrix(${f(a)} ${f(b)} ${f(c)} ${f(d)} ${f(e)} ${f(g0)})` }, svg);
        const defs = el('defs', {}, svg);
        const sky = el('linearGradient', { id: `${id}s`, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
        [[0, 'oklch(0.2 0.07 285)'], [0.6, 'oklch(0.45 0.13 330)'], [0.85, 'oklch(0.76 0.15 55)']].forEach(([o, cl]) => el('stop', { offset: o, 'stop-color': cl }, sky));
        const cp = el('clipPath', { id: `${id}c` }, defs);
        port(cp, {});
        port(face, { fill: 'oklch(0.18 0.01 60)' }, 7);
        const glass = el('g', { 'clip-path': `url(#${id}c)` }, face);
        const view = el('g', {}, glass);
        el('rect', { x: 18, y: 14, width: 94, height: 54, fill: `url(#${id}s)` }, view);
        el('path', { d: 'M18 66L112 58V112H18Z', fill: 'oklch(0.16 0.03 285)' }, view);
        const wing = el('g', {}, glass);
        el('path', { d: WING, fill: 'oklch(0.66 0.012 265)' }, wing);
        el('path', { d: FLAP, fill: 'oklch(0.48 0.012 265)' }, wing);
        el('circle', { cx: TIP[0], cy: TIP[1], r: 2.2, fill: 'oklch(0.66 0.24 25)' }, wing);
        const st = strobeDot(wing, 6);
        const lc = leanCtl({ layers: [[view, 5], [wing, 11]], wing, strobe: st });
        // The pointer maps back from the rhombus to face space.
        const det = a * d - b * c;
        const inv = p => { const x = p[0] - e, y = p[1] - g0; return [(d * x - c * y) / det, (a * y - b * x) / det]; };
        return { enter: p => lc.enter(p && inv(p)), move: p => lc.move(p && inv(p)), leave: lc.leave };
      },
      emblem: '',
    },
    {
      toy: 'window', l: 'E', name: 'Abstract mark',
      // A heavy ring and one wedge; the pointer banks the wedge, the dot flashes.
      art(svg) {
        tileBack(svg, 'oklch(0.86 0.06 65)');
        const ink = 'oklch(0.18 0.02 270)';
        port(svg, { fill: 'none', stroke: ink, 'stroke-width': 8 }, 2);
        const mark = el('g', {}, svg);
        el('path', { d: 'M84 70L46 56L84 86Z', fill: ink }, mark);
        const dot = el('circle', { cx: 46, cy: 48, r: 4.4, fill: 'oklch(0.6 0.22 28)' }, mark);
        let blink = null;
        const aim = p => {
          const dx = clamp((p[0] - 62) / 46, -1, 1), dy = clamp((p[1] - 62) / 46, -1, 1);
          gsap.to(mark, { rotation: -dx * 14, y: dy * 5, svgOrigin: '72 72', duration: 0.5, ease: 'power2.out', overwrite: 'auto' });
        };
        const start = () => { if (!blink) blink = gsap.to(dot, { opacity: 0.15, duration: 0.08, repeat: -1, yoyo: true, repeatDelay: 0.7 }); };
        const rest = () => { blink?.kill(); blink = null; gsap.to(dot, { opacity: 1, duration: 0.2 }); gsap.to(mark, { rotation: 0, y: 0, svgOrigin: '72 72', duration: 0.7, ease: 'power2.out', overwrite: 'auto' }); };
        const demo = () => { const d = { t: 0 }; return gsap.to(d, { t: 1, duration: 4, repeat: -1, ease: 'none', onUpdate: () => aim([62 + 40 * Math.sin(d.t * TAU), 62]) }); };
        return ctl(aim, rest, demo, start);
      },
      emblem: '',
    },
  ];
  // The emblems live as files; the gallery shows them by url.
  for (const D of DIRS) if (D.l !== 'Current') { D.emblemUrl = `spike/emblems/window-${D.l.toLowerCase()}.svg`; delete D.emblem; }


  /* ================= Gallery ================= */

  const NAMES = { window: 'Window seat' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || (D.emblem ? `spike/emblems/${file}.svg` : '');
      if (D.emblem) window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const c = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => c.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => c.leave());
        tile.addEventListener('focus', () => c.enter(null));
        tile.addEventListener('blur', () => c.leave());
      });
    }
  }
})();
</script>
</body>
</html>
