<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 20</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<h1>Icon spike 20</h1>
<p class="lede">Window seat, round 2: the current icon and five directions. Left and right lean your head; up and down pull the shade. Flick for turbulence.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  // A pointer control from three plain functions; focus plays a demo.
  const ctl = (aim, rest, demo, start = () => {}) => {
    let tl = null;
    return {
      enter(p) { start(); if (p) aim(p); else tl = demo(); },
      move(p) { if (p && !tl) aim(p); },
      leave() { tl?.kill(); tl = null; rest(); },
    };
  };
  // A repeat that runs while the pointer stays.
  const every = (dt, fn) => {
    let dc = null;
    const go = () => { fn(); dc = gsap.delayedCall(dt, go); };
    return { start() { if (!dc) go(); }, stop() { dc?.kill(); dc = null; } };
  };

  /* ================= Window seat kit ================= */

  // Tile geometry: the face and its hard shadow, as the menu draws them.
  const T0 = 16, SHADOW = 'oklch(0.07 0.01 260)';
  const tileBack = (svg, fill) => {
    el('rect', { x: 22, y: 22, width: 92, height: 92, fill: SHADOW }, svg);
    return el('rect', { x: T0, y: T0, width: 92, height: 92, fill }, svg);
  };
  const lin = (defs, id, x2, y2, stops, extra = {}) => {
    const g = el('linearGradient', { id, x1: 0, y1: 0, x2, y2, ...extra }, defs);
    stops.forEach(([o, c, a = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g));
    return `url(#${id})`;
  };
  const rad = (defs, id, stops, extra = {}) => {
    const g = el('radialGradient', { id, ...extra }, defs);
    stops.forEach(([o, c, a = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g));
    return `url(#${id})`;
  };
  const shadowFilter = (defs, id, dx, dy, blur, op) => {
    const fl = el('filter', { id, x: '-30%', y: '-30%', width: '160%', height: '160%' }, defs);
    el('feDropShadow', { dx, dy, stdDeviation: blur, 'flood-color': 'oklch(0.05 0.01 260)', 'flood-opacity': op }, fl);
    return `url(#${id})`;
  };
  // The window object: a moulded panel, its recess and the glass, upright.
  const W = { px: 28, py: 12, pw: 68, ph: 100, pr: 32, gx: 38, gy: 24, gw: 48, gh: 76, gr: 22 };
  const rr = (parent, x, y, w, h, r, attrs) => el('rect', { x, y, width: w, height: h, rx: r, ...attrs }, parent);
  const glassRect = (parent, attrs, grow = 0) => rr(parent, W.gx - grow, W.gy - grow, W.gw + 2 * grow, W.gh + 2 * grow, W.gr + grow, attrs);
  // The wing in glass space: root low right, swept up left to the winglet.
  const WING = 'M100 76L52 63L46 46L50.5 46L58 70L100 106Z';
  const FLAP = 'M100 96L63 74L58 70L100 106Z';
  const LE = 'M100 76L52 63L46 46';
  const TIP = [47.6, 47];
  const HOR = 66;

  // Dusk outside: sky, sun bloom, lit cloud tops, the deck below.
  const duskScene = (defs, id, g) => {
    el('rect', { x: 20, y: 10, width: 90, height: 70, fill: lin(defs, `${id}sky`, 0, 1, [[0, 'oklch(0.2 0.07 280)'], [0.4, 'oklch(0.34 0.12 310)'], [0.66, 'oklch(0.6 0.17 30)'], [0.8, 'oklch(0.84 0.14 70)']]) }, g);
    el('path', { d: 'M38 34L86 30M42 41L84 37', stroke: 'oklch(0.6 0.12 330)', 'stroke-width': 0.7, opacity: 0.6 }, g);
    const sun = el('circle', { cx: 72, cy: HOR - 2, r: 13, fill: rad(defs, `${id}sun`, [[0, 'oklch(0.99 0.04 95)'], [0.18, 'oklch(0.95 0.1 85)', 0.95], [0.45, 'oklch(0.82 0.15 60)', 0.45], [1, 'oklch(0.7 0.16 40)', 0]]) }, g);
    el('circle', { cx: 72, cy: HOR - 2, r: 2.6, fill: 'oklch(0.99 0.03 95)' }, g);
    const tops = el('g', {}, g);
    el('path', { d: 'M20 69C26 64 30 66 34 65C38 61 44 62 47 65C52 63 56 64 60 66C64 63 70 63 74 66C79 64 84 64 88 67C94 64 100 65 110 66V80H20Z', fill: 'oklch(0.56 0.11 20)' }, tops);
    el('path', { d: 'M20 69C26 64 30 66 34 65C38 61 44 62 47 65C52 63 56 64 60 66C64 63 70 63 74 66C79 64 84 64 88 67C94 64 100 65 110 66', fill: 'none', stroke: 'oklch(0.86 0.1 55)', 'stroke-width': 0.9 }, tops);
    el('path', { d: 'M20 74C30 71 40 73 50 72C62 70 74 73 86 72C96 71 104 72 110 72V112H20Z', fill: 'oklch(0.32 0.07 310)' }, tops);
    el('path', { d: 'M20 84C34 82 50 85 64 83C80 81 96 84 110 83V112H20Z', fill: 'oklch(0.22 0.05 290)' }, tops);
    return { sun, tops };
  };
  // The wing: a lit top skin, a darker flap, a bright leading edge, a red light.
  const wingArt = (defs, id, g) => {
    el('path', { d: WING, fill: lin(defs, `${id}wg`, 1, 1, [[0, 'oklch(0.86 0.03 70)'], [0.35, 'oklch(0.68 0.016 270)'], [1, 'oklch(0.44 0.016 270)']]) }, g);
    el('path', { d: FLAP, fill: 'oklch(0.4 0.014 270)', opacity: 0.9 }, g);
    el('path', { d: 'M100 87L61 70M100 81L58 67', fill: 'none', stroke: 'oklch(0.5 0.014 270)', 'stroke-width': 0.6 }, g);
    el('path', { d: LE, fill: 'none', stroke: 'oklch(0.97 0.05 75)', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, g);
    const glint = el('ellipse', { cx: 80, cy: 75, rx: 9, ry: 1.8, fill: 'oklch(0.98 0.05 85)', opacity: 0.35, transform: 'rotate(16 80 75)' }, g);
    el('circle', { cx: TIP[0], cy: TIP[1], r: 5.5, fill: rad(defs, `${id}nav`, [[0, 'oklch(0.75 0.22 25)', 0.9], [1, 'oklch(0.6 0.24 25)', 0]]) }, g);
    el('circle', { cx: TIP[0], cy: TIP[1], r: 1.5, fill: 'oklch(0.8 0.2 25)' }, g);
    const strobe = el('circle', { cx: TIP[0], cy: TIP[1], r: 7, fill: rad(defs, `${id}stb`, [[0, 'oklch(1 0 0)'], [0.3, 'oklch(0.97 0.01 250)', 0.8], [1, 'oklch(0.9 0.02 250)', 0]]), opacity: 0 }, g);
    return { glint, strobe };
  };
  // The shade: ribbed plastic that slides down from the top of the glass.
  const shadeArt = (defs, id, parent) => {
    const g = el('g', {}, parent);
    const body = el('rect', { x: W.gx - 2, y: W.gy - 60, width: W.gw + 4, height: 60, fill: lin(defs, `${id}sh`, 0, 1, [[0, 'oklch(0.8 0.012 80)'], [1, 'oklch(0.9 0.01 80)']]) }, g);
    const ribs = el('path', { d: Array.from({ length: 12 }, (_, i) => `M${W.gx} ${W.gy - 58 + i * 5}H${W.gx + W.gw}`).join(''), stroke: 'oklch(0.7 0.012 80)', 'stroke-width': 0.6 }, g);
    const lip = el('rect', { x: W.gx - 2, y: W.gy - 3, width: W.gw + 4, height: 4, rx: 1.5, fill: 'oklch(0.62 0.014 80)' }, g);
    el('rect', { x: W.gx + W.gw / 2 - 6, y: W.gy, width: 12, height: 2.4, rx: 1.2, fill: 'oklch(0.5 0.014 80)' }, g);
    el('rect', { x: W.gx - 2, y: W.gy + 1, width: W.gw + 4, height: 3, fill: 'oklch(0.05 0.01 260)', opacity: 0.25 }, g);
    return g;
  };

  // Lean and pull: pointer x leans the head; pointer y pulls the shade.
  // Each layer shifts by its own depth; the wing, nearest, shifts most.
  // A quick move is turbulence: the wing flexes about its root, then settles.
  // While the pointer stays, the wingtip strobe double-flashes.
  const winCtl = ({ layers, wing, root = '100 100', strobe, shade, shadeRest = 10, shadeMax = 62, yLean = 0.75, extra, map }) => {
    let last = null, flash = null;
    const aim = q => {
      const p = map ? map(q) : q;
      const dx = clamp((p[0] - 62) / 40, -1, 1), dy = clamp((p[1] - 62) / 46, -1, 1);
      for (const [g, k] of layers) gsap.to(g, { x: -dx * k, y: shade ? 0 : -dy * k * yLean, duration: 0.5, ease: 'power2.out', overwrite: 'auto' });
      if (shade) gsap.to(shade, { y: clamp(p[1] - W.gy - 10, 0, shadeMax), duration: 0.35, ease: 'power2.out', overwrite: 'auto' });
      if (wing && last) {
        const kick = clamp((p[1] - last[1]) * 0.45, -6, 6);
        if (Math.abs(kick) > 0.7) gsap.fromTo(wing, { rotation: kick, svgOrigin: root }, { rotation: 0, svgOrigin: root, duration: 1.1, ease: 'elastic.out(1, 0.35)' });
      }
      last = p;
      extra?.(dx, dy);
    };
    const start = () => {
      if (flash || !strobe) return;
      flash = gsap.timeline({ repeat: -1, repeatDelay: 0.9 })
        .to(strobe, { opacity: 1, duration: 0.03 }).to(strobe, { opacity: 0, duration: 0.1 })
        .to(strobe, { opacity: 1, duration: 0.03 }, '+=0.08').to(strobe, { opacity: 0, duration: 0.12 });
    };
    const rest = () => {
      last = null; flash?.kill(); flash = null;
      if (strobe) gsap.to(strobe, { opacity: 0, duration: 0.2, overwrite: 'auto' });
      for (const [g] of layers) gsap.to(g, { x: 0, y: 0, rotation: 0, duration: 0.7, ease: 'power2.out', overwrite: 'auto' });
      if (shade) gsap.to(shade, { y: shadeRest, duration: 0.9, ease: 'elastic.out(1, 0.5)', overwrite: 'auto' });
      extra?.(0, 0);
    };
    if (shade) gsap.set(shade, { y: shadeRest });
    // With no pointer, the head sways and the shade bobs.
    const demo = () => {
      const d = { t: 0 };
      return gsap.to(d, { t: 1, duration: 5, repeat: -1, ease: 'none', onUpdate: () => aim([62 + 34 * Math.sin(d.t * TAU), 46 + 14 * Math.sin(d.t * TAU * 2)]) });
    };
    return ctl(aim, rest, demo, start);
  };

  const DIRS = [
    {
      toy: 'window', l: 'Current', name: 'Porthole',
      // The menu icon as it stands.
      art(svg, id) {
        const PORT = { x: 36, y: 28, w: 52, h: 68, r: 24, tilt: 'rotate(-6 62 62)' };
        const port = (p, attrs, grow = 0) => el('rect', { x: PORT.x - grow, y: PORT.y - grow, width: PORT.w + 2 * grow, height: PORT.h + 2 * grow, rx: PORT.r + grow, transform: PORT.tilt, ...attrs }, p);
        const defs = el('defs', {}, svg);
        const cp = el('clipPath', { id: `${id}c` }, defs);
        port(cp, {});
        tileBack(svg, 'oklch(0.3 0.012 60)');
        port(svg, { fill: 'oklch(0.36 0.012 60)' }, 9);
        port(svg, { fill: 'oklch(0.16 0.01 60)' }, 6);
        const glass = el('g', { 'clip-path': `url(#${id}c)` }, svg);
        const view = el('g', {}, glass);
        el('rect', { x: 20, y: 16, width: 90, height: 52, fill: lin(defs, `${id}s`, 0, 1, [[0, 'oklch(0.2 0.07 285)'], [0.5, 'oklch(0.42 0.13 330)'], [0.78, 'oklch(0.74 0.16 55)'], [1, 'oklch(0.86 0.12 80)']]) }, view);
        el('circle', { cx: 70, cy: 60, r: 3.4, fill: 'oklch(0.98 0.05 90)' }, view);
        el('path', { d: 'M20 64L110 58V70L20 76Z', fill: 'oklch(0.4 0.06 330)' }, view);
        el('path', { d: 'M20 72L110 66V112H20Z', fill: 'oklch(0.16 0.03 285)' }, view);
        const wing = el('g', {}, glass);
        el('path', { d: 'M110 72L50 58L43 38L48 38L57 66L110 112Z', fill: 'oklch(0.62 0.012 265)' }, wing);
        el('path', { d: 'M110 98L62 72L57 66L110 112Z', fill: 'oklch(0.47 0.012 265)' }, wing);
        el('path', { d: 'M110 72L50 58L43 38', fill: 'none', stroke: 'oklch(0.9 0.05 60)', 'stroke-width': 1.6, 'stroke-linejoin': 'round' }, wing);
        el('circle', { cx: 45, cy: 39, r: 2, fill: 'oklch(0.66 0.24 25)' }, wing);
        const st = el('circle', { cx: 45, cy: 39, r: 6, fill: 'oklch(0.98 0.01 250)', opacity: 0 }, wing);
        return winCtl({ layers: [[view, 5], [wing, 10]], wing, root: '110 96', strobe: st });
      },
    },
    {
      toy: 'window', l: 'A', name: 'Shaded object',
      // A moulded cabin window: a bevelled bezel, a deep recess, a dusk scene and a ribbed shade.
      art(svg, id) {
        const defs = el('defs', {}, svg);
        const gc = el('clipPath', { id: `${id}g` }, defs);
        glassRect(gc, {});
        const shadow = shadowFilter(defs, `${id}f`, 3, 5, 3.5, 0.6);
        const obj = el('g', { filter: shadow }, svg);
        // The bezel: moulded plastic, lit from the cabin above and left.
        rr(obj, W.px, W.py, W.pw, W.ph, W.pr, { fill: lin(defs, `${id}bz`, 0.7, 1, [[0, 'oklch(0.93 0.012 80)'], [0.55, 'oklch(0.8 0.014 80)'], [1, 'oklch(0.6 0.016 75)']]) });
        rr(obj, W.px + 1, W.py + 1, W.pw - 2, W.ph - 2, W.pr - 1, { fill: 'none', stroke: 'oklch(0.98 0.01 80)', 'stroke-width': 1, opacity: 0.7 });
        // The recess: a tunnel that narrows to the glass; its top lies in shadow.
        rr(obj, W.gx - 5, W.gy - 5, W.gw + 10, W.gh + 10, W.gr + 5, { fill: lin(defs, `${id}rc`, 0, 1, [[0, 'oklch(0.36 0.012 75)'], [0.5, 'oklch(0.56 0.014 78)'], [1, 'oklch(0.74 0.014 80)']]) });
        rr(obj, W.gx - 5, W.gy - 5, W.gw + 10, W.gh + 10, W.gr + 5, { fill: 'none', stroke: 'oklch(0.3 0.012 70)', 'stroke-width': 0.8 });
        glassRect(obj, { fill: 'oklch(0.12 0.02 280)' }, 1.2);
        const glass = el('g', { 'clip-path': `url(#${id}g)` }, obj);
        const view = el('g', {}, glass);
        const { sun, tops } = duskScene(defs, id, view);
        const wing = el('g', {}, glass);
        const { glint, strobe } = wingArt(defs, id, wing);
        // The pane mirrors the cabin: a broad sheen and one bright arc.
        el('path', { d: 'M38 24H64L38 60Z', fill: lin(defs, `${id}gl`, 1, 1, [[0, 'oklch(1 0 0)', 0.16], [1, 'oklch(1 0 0)', 0]]) }, glass);
        const shade = shadeArt(defs, id, glass);
        el('path', { d: 'M42 34C44 28 49 25.5 55 25', fill: 'none', stroke: 'oklch(1 0 0)', 'stroke-width': 1.4, 'stroke-linecap': 'round', opacity: 0.45 }, obj);
        return winCtl({
          layers: [[view, 3], [tops, 3], [wing, 10]], wing, strobe, shade,
          // The sun swells, and the glint slides along the wing as the head moves.
          extra: dx => {
            gsap.to(sun, { attr: { r: 13 + 6 * Math.max(0, 1 - Math.abs(dx - 0.35) * 1.6) }, duration: 0.5, overwrite: 'auto' });
            gsap.to(glint, { attr: { cx: 80 - dx * 14 }, opacity: 0.2 + 0.45 * Math.max(0, 1 - Math.abs(dx + 0.3)), duration: 0.5, overwrite: 'auto' });
          },
        });
      },
    },
    {
      toy: 'window', l: 'B', name: 'Stencil cut-out',
      // A paper-cut diorama: each layer is cut card with its own shadow, at its own depth.
      art(svg, id) {
        const defs = el('defs', {}, svg);
        const sh = shadowFilter(defs, `${id}f`, 1.2, 1.6, 1.1, 0.55);
        const hole = el('mask', { id: `${id}m` }, defs);
        el('rect', { x: T0, y: T0, width: 92, height: 92, fill: '#fff' }, hole);
        glassRect(hole, { fill: '#000' }, 3);
        const gc = el('clipPath', { id: `${id}c` }, defs);
        glassRect(gc, {}, 3);
        el('rect', { x: 22, y: 22, width: 92, height: 92, fill: SHADOW }, svg);
        const box = el('g', { 'clip-path': `url(#${id}c)` }, svg);
        el('rect', { x: 20, y: 10, width: 90, height: 100, fill: 'oklch(0.26 0.08 285)' }, box);
        const l1 = el('g', { filter: sh }, box);
        el('circle', { cx: 70, cy: 56, r: 9, fill: 'oklch(0.86 0.14 75)' }, l1);
        const l2 = el('g', { filter: sh }, box);
        el('path', { d: 'M20 62C28 56 34 60 40 57C46 53 52 56 58 58C64 54 72 55 78 58C84 55 92 56 110 58V112H20Z', fill: 'oklch(0.66 0.15 35)' }, l2);
        const l3 = el('g', { filter: sh }, box);
        el('path', { d: 'M20 72C30 67 40 71 50 68C60 65 70 69 80 67C90 65 100 68 110 67V112H20Z', fill: 'oklch(0.44 0.12 330)' }, l3);
        const l4 = el('g', { filter: sh }, box);
        el('path', { d: WING, fill: 'oklch(0.93 0.03 80)' }, l4);
        el('path', { d: FLAP, fill: 'oklch(0.8 0.03 75)' }, l4);
        el('circle', { cx: TIP[0], cy: TIP[1], r: 2.4, fill: 'oklch(0.6 0.22 28)' }, l4);
        const strobe = el('circle', { cx: TIP[0], cy: TIP[1], r: 5.5, fill: 'oklch(0.99 0.01 90)', opacity: 0 }, l4);
        // The front card: the tile with the window cut out of it.
        const front = el('g', { filter: shadowFilter(defs, `${id}f2`, 1.6, 2.4, 1.6, 0.7) }, svg);
        el('rect', { x: T0, y: T0, width: 92, height: 92, fill: 'oklch(0.9 0.035 78)', mask: `url(#${id}m)` }, front);
        glassRect(front, { fill: 'none', stroke: 'oklch(0.8 0.04 75)', 'stroke-width': 1.2 }, 6);
        return winCtl({ layers: [[l1, 1.5], [l2, 3.5], [l3, 6], [l4, 10]], wing: l4, root: '100 100', strobe, yLean: 0.6 });
      },
    },
    {
      toy: 'window', l: 'C', name: 'Single-weight line',
      // One line weight: the window, its shade, the clouds, the wing; the horizon banks.
      art(svg, id) {
        const defs = el('defs', {}, svg);
        const gc = el('clipPath', { id: `${id}c` }, defs);
        glassRect(gc, {});
        tileBack(svg, 'oklch(0.19 0.025 270)');
        const ink = { fill: 'none', stroke: 'oklch(0.93 0.025 75)', 'stroke-width': 1.8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
        rr(svg, W.px + 3, W.py + 3, W.pw - 6, W.ph - 6, W.pr - 3, ink);
        glassRect(svg, ink, 0);
        const glass = el('g', { 'clip-path': `url(#${id}c)` }, svg);
        const view = el('g', {}, glass);
        el('path', { d: `M20 ${HOR}L110 ${HOR - 4}`, ...ink }, view);
        el('path', { d: 'M24 74C30 70 34 73 38 71C42 68 47 70 50 72M62 72C66 68 71 70 74 69C78 66 84 68 86 71', ...ink, 'stroke-width': 1.2, opacity: 0.6 }, view);
        el('circle', { cx: 72, cy: 55, r: 3.6, ...ink }, view);
        el('path', { d: 'M72 47V45M79 50L80.5 48.6M65 50L63.5 48.6', ...ink, 'stroke-width': 1.2 }, view);
        const wing = el('g', {}, glass);
        el('path', { d: 'M104 77L52 63L46 46L50.5 46L58 70L104 104', ...ink }, wing);
        el('path', { d: 'M104 94L63 74', ...ink, 'stroke-width': 1.2, opacity: 0.6 }, wing);
        el('circle', { cx: TIP[0], cy: TIP[1], r: 1.8, fill: 'oklch(0.7 0.22 25)' }, wing);
        const strobe = el('circle', { cx: TIP[0], cy: TIP[1], r: 4.5, fill: 'none', stroke: 'oklch(0.98 0.01 250)', 'stroke-width': 1.4, opacity: 0 }, wing);
        // The shade's ribs, drawn as lines, pulled a little way down.
        const shade = el('g', {}, glass);
        el('path', { d: `M${W.gx} ${W.gy - 1}H${W.gx + W.gw}` + Array.from({ length: 8 }, (_, i) => `M${W.gx + 4} ${W.gy - 9 - i * 6}H${W.gx + W.gw - 4}`).join(''), ...ink, 'stroke-width': 1.2, opacity: 0.6 }, shade);
        el('path', { d: `M${W.gx} ${W.gy + 2}H${W.gx + W.gw}M${W.gx + 18} ${W.gy + 5}H${W.gx + 30}`, ...ink }, shade);
        return winCtl({
          layers: [[view, 4], [wing, 9]], wing, strobe, shade, shadeRest: 6,
          // Left and right bank the plane: the horizon tilts the other way.
          extra: dx => gsap.to(view, { rotation: dx * 10, svgOrigin: '62 62', duration: 0.6, ease: 'power2.out', overwrite: false }),
        });
      },
    },
    {
      toy: 'window', l: 'D', name: 'Isometric block',
      // A block of cabin wall; the moulded window sits in its top face, the wing beyond.
      art(svg, id) {
        const L = [16, 56], Tp = [64, 30], B = [64, 82], R = [112, 56], DEP = 16;
        const P = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
        const dn = p => [p[0], p[1] + DEP];
        const defs = el('defs', {}, svg);
        el('path', { d: P([L, B, R, dn(R), dn(B), dn(L)].map(p => [p[0] + 5, p[1] + 6])), fill: SHADOW }, svg);
        el('path', { d: P([L, B, dn(B), dn(L)]), fill: lin(defs, `${id}lf`, 1, 0, [[0, 'oklch(0.62 0.014 78)'], [1, 'oklch(0.54 0.014 78)']]) }, svg);
        el('path', { d: P([B, R, dn(R), dn(B)]), fill: lin(defs, `${id}rt`, 1, 0, [[0, 'oklch(0.4 0.012 75)'], [1, 'oklch(0.32 0.012 75)']]) }, svg);
        // Wall layers show in the cut edges: skin, insulation, trim.
        el('path', { d: `M${L[0]} ${L[1] + 5}L${B[0]} ${B[1] + 5}L${R[0]} ${R[1] + 5}`, fill: 'none', stroke: 'oklch(0.72 0.04 85)', 'stroke-width': 1.4 }, svg);
        el('path', { d: `M${L[0]} ${L[1] + 11}L${B[0]} ${B[1] + 11}L${R[0]} ${R[1] + 11}`, fill: 'none', stroke: 'oklch(0.75 0.02 250)', 'stroke-width': 1 }, svg);
        el('path', { d: P([L, Tp, R, B]), fill: lin(defs, `${id}tp`, 1, 1, [[0, 'oklch(0.92 0.012 80)'], [1, 'oklch(0.78 0.014 80)']]) }, svg);
        // Face space is the window kit's space; a matrix maps it onto the rhombus.
        const s0 = 12, S = 100;
        const a = (Tp[0] - L[0]) / S, b = (Tp[1] - L[1]) / S, c = (B[0] - L[0]) / S, d = (B[1] - L[1]) / S;
        const e = L[0] - s0 * a - s0 * c, g0 = L[1] - s0 * b - s0 * d;
        const face = el('g', { transform: `matrix(${f(a)} ${f(b)} ${f(c)} ${f(d)} ${f(e)} ${f(g0)})` }, svg);
        const gc = el('clipPath', { id: `${id}g` }, defs);
        glassRect(gc, {});
        rr(face, W.gx - 6, W.gy - 6, W.gw + 12, W.gh + 12, W.gr + 6, { fill: lin(defs, `${id}rc`, 1, 1, [[0, 'oklch(0.4 0.012 75)'], [1, 'oklch(0.7 0.014 80)']]) });
        glassRect(face, { fill: 'oklch(0.12 0.02 280)' }, 1.2);
        const glass = el('g', { 'clip-path': `url(#${id}g)` }, face);
        const view = el('g', {}, glass);
        const { tops } = duskScene(defs, id, view);
        const wing = el('g', {}, glass);
        const { strobe } = wingArt(defs, id, wing);
        const shade = shadeArt(defs, id, glass);
        // The pointer maps back from the rhombus to face space.
        const det = a * d - b * c;
        const map = p => { const x = p[0] - e, y = p[1] - g0; return [(d * x - c * y) / det, (a * y - b * x) / det]; };
        return winCtl({ layers: [[view, 4], [tops, 2], [wing, 11]], wing, strobe, shade, map });
      },
    },
    {
      toy: 'window', l: 'E', name: 'Abstract mark',
      // A window as negative space in a bold tile; one band, one wedge, one red dot, one shade bar.
      art(svg, id) {
        const defs = el('defs', {}, svg);
        const gc = el('clipPath', { id: `${id}c` }, defs);
        glassRect(gc, {}, 4);
        tileBack(svg, 'oklch(0.24 0.06 275)');
        glassRect(svg, { fill: 'oklch(0.93 0.04 78)' }, 4);
        const glass = el('g', { 'clip-path': `url(#${id}c)` }, svg);
        const view = el('g', {}, glass);
        el('rect', { x: 20, y: 60, width: 90, height: 8, fill: 'oklch(0.72 0.17 45)' }, view);
        const wing = el('g', {}, glass);
        el('path', { d: 'M104 72L46 56L104 100Z', fill: 'oklch(0.24 0.06 275)' }, wing);
        el('circle', { cx: 46, cy: 48, r: 4.6, fill: 'oklch(0.62 0.23 28)' }, wing);
        const strobe = el('circle', { cx: 46, cy: 48, r: 8, fill: 'none', stroke: 'oklch(0.62 0.23 28)', 'stroke-width': 2, opacity: 0 }, wing);
        const shade = el('g', {}, glass);
        el('rect', { x: 20, y: W.gy - 80, width: 90, height: 80, fill: 'oklch(0.24 0.06 275)' }, shade);
        el('rect', { x: 20, y: W.gy - 4, width: 90, height: 4, fill: 'oklch(0.72 0.17 45)' }, shade);
        return winCtl({ layers: [[view, 3], [wing, 8]], wing, root: '104 90', strobe, shade, shadeRest: 4 });
      },
    },
  ];
  // The emblems live as files; the gallery shows them by url.
  for (const D of DIRS) if (D.l !== 'Current') D.emblemUrl = `spike/emblems/window-${D.l.toLowerCase()}.svg`;


  /* ================= Gallery ================= */

  const NAMES = { window: 'Window seat' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || (D.emblem ? `spike/emblems/${file}.svg` : '');
      if (D.emblem) window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const c = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => c.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => c.leave());
        tile.addEventListener('focus', () => c.enter(null));
        tile.addEventListener('blur', () => c.leave());
      });
    }
  }
})();
</script>
