<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Singing bowl 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; align-items: center; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.emb > .mono { width: 28px; height: 28px; background: var(--bg); color: var(--fg); }
.emb > .mono i { width: 28px; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Singing bowl 1</h1>
<p class="lede">Singing bowl, round 1: the hammered bronze bowl with dark water and its wooden wand, in the toy's warm light. No sparkle dots: the rings on the water and the glowing rim carry the sound. A: free on the ground. D: on a block of table wood.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const lerp2 = (p, q, t) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t)];
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The toy's tokens: hammered bronze, dark water, a wooden wand.
  const BRONZE = [[0, 'oklch(0.86 0.13 82)'], [0.22, 'oklch(0.5 0.1 60)'], [0.6, 'oklch(0.68 0.13 70)'], [1, 'oklch(0.3 0.07 48)']];
  const HOLLOW = [[0, 'oklch(0.9 0.13 86)'], [1, 'oklch(0.56 0.12 66)']];
  const WATER = [[0, 'oklch(0.5 0.06 232)'], [1, 'oklch(0.27 0.06 58)']];
  const LIP = 'oklch(0.9 0.11 86)', RING = 'oklch(0.95 0.035 90)', SING = 'oklch(0.98 0.06 92)';
  // An engraved groove rings the outer wall.
  const GROOVE = 'oklch(0.4 0.08 52)';
  const WOOD = 'oklch(0.55 0.1 52)', FELT = 'oklch(0.32 0.05 30)';
  const { sin, cos, atan2, PI } = Math;
  const TAU = 2 * PI;
  // The shortest turn from angle a to angle b.
  const turn = (a, b) => { let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; };

  // The bowl at centre [cx, cy] with rim radius R; the menu bowl has R 50.
  const bowlShape = (cx, cy, R) => {
    const s = R / 50, P = (x, y) => `${f(cx + (x - 64) * s)} ${f(cy + (y - 44) * s)}`;
    const wall = `M${P(14, 44)}C${P(9, 52)} ${P(8, 64)} ${P(14, 74)}C${P(22, 89)} ${P(40, 99)} ${P(64, 99)}C${P(88, 99)} ${P(106, 89)} ${P(114, 74)}C${P(120, 64)} ${P(119, 52)} ${P(114, 44)}`;
    return { wall, body: `${wall}A${f(R)} ${f(R * 0.42)} 0 0 1 ${P(14, 44)}Z`, bottom: cy + 55 * s };
  };

  // A live bowl: the wand circles the rim and the water rings.
  // g: centre, rim radius R, wand length len, rest angle rest, a scale k.
  const bowlMarkup = (u, g) => {
    const B = bowlShape(g.cx, g.cy, g.R), wy = g.cy + 0.14 * g.R;
    return `
      <g class="wand-b"></g>
      <path d="${B.body}" fill="url(#${u}bronze)"/>
      <g clip-path="url(#${u}bc)">
        <path d="M${f(g.cx - 1.1 * g.R)} ${f(g.cy + 0.22 * g.R)}A${f(1.1 * g.R)} ${f(0.46 * g.R)} 0 0 0 ${f(g.cx + 1.1 * g.R)} ${f(g.cy + 0.22 * g.R)}" fill="none" stroke="${GROOVE}" stroke-width="${f(3.2 * g.k)}" opacity="0.65"/>
        <ellipse cx="${f(g.cx - 0.7 * g.R)}" cy="${f(g.cy + 0.5 * g.R)}" rx="${f(0.07 * g.R)}" ry="${f(0.26 * g.R)}" transform="rotate(-14 ${f(g.cx - 0.7 * g.R)} ${f(g.cy + 0.5 * g.R)})" fill="#fff" opacity="0.5" filter="url(#${u}sb)"/>
      </g>
      <path d="${B.body}" fill="url(#${u}lit)"/>
      <clipPath id="${u}bc"><path d="${B.body}"/></clipPath>
      <ellipse cx="${g.cx}" cy="${g.cy}" rx="${g.R}" ry="${f(g.R * 0.42)}" fill="url(#${u}hollow)"/>
      <ellipse cx="${g.cx}" cy="${f(wy)}" rx="${f(g.R * 0.74)}" ry="${f(g.R * 0.28)}" fill="url(#${u}water)"/>
      <g clip-path="url(#${u}pool)" fill="none" stroke="${RING}" stroke-width="${f(2.6 * g.k)}">
        <ellipse class="ring"/><ellipse class="ring"/><ellipse class="ring"/>
      </g>
      <ellipse cx="${g.cx}" cy="${g.cy}" rx="${g.R}" ry="${f(g.R * 0.42)}" fill="none" stroke="${LIP}" stroke-width="${f(3.4 * g.k)}"/>
      <ellipse class="sing" cx="${g.cx}" cy="${g.cy}" rx="${g.R}" ry="${f(g.R * 0.42)}" fill="none" stroke="${SING}" stroke-width="${f(5 * g.k)}" filter="url(#${u}sb)" opacity="0"/>
      <path d="${B.wall}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
      <g class="wand-f"></g>
      <clipPath id="${u}pool"><ellipse cx="${g.cx}" cy="${f(wy)}" rx="${f(g.R * 0.74)}" ry="${f(g.R * 0.28)}"/></clipPath>`;
  };
  const bowlDefs = u => `${light(u)}${blur(`${u}sb`, 1.6)}
    ${lg(`${u}bronze`, BRONZE)}
    ${lg(`${u}hollow`, HOLLOW)}
    ${lg(`${u}water`, WATER)}`;
  // The wand: its felt tip on the rim at angle th, the handle out and up.
  const wandPts = (g, th) => {
    const c = [g.cx + g.R * 1.02 * cos(th), g.cy + g.R * 0.43 * sin(th)];
    const e = [c[0] + cos(th) * g.len * 0.62, c[1] - g.len * 0.78];
    return [c, e];
  };
  const wandMarkup = (g, th, wood = WOOD, felt = FELT) => {
    const [c, e] = wandPts(g, th), w = 7 * g.k;
    // The felt sleeve covers the first quarter of the wand.
    const m = lerp2(c, e, 0.28);
    return `<path d="M${f(c[0])} ${f(c[1])}L${f(e[0])} ${f(e[1])}" stroke="${wood}" stroke-width="${f(w)}" stroke-linecap="round"/><path d="M${f(c[0])} ${f(c[1])}L${f(m[0])} ${f(m[1])}" stroke="${felt}" stroke-width="${f(w + 1)}" stroke-linecap="round"/>`;
  };
  const bowl = (svg, u, g) => {
    const $q = s => svg.querySelector(s);
    const rings = [...svg.querySelectorAll('.ring')], sing = $q('.sing'), wandB = $q('.wand-b'), wandF = $q('.wand-f');
    const wy = g.cy + 0.14 * g.R, maxR = g.R * 0.8;
    // e: the bowl's voice, 0 to 1. ph: the rings' phase.
    const st = { th: g.rest, thTo: g.rest, e: 0, eTo: 0, ph: 0, t: 0, live: false, hit: 0 };
    const draw = () => {
      // The rings run out from the centre; the voice sets their strength.
      rings.forEach((r, i) => {
        const q = (st.ph + i / 3) % 1, rx = (0.12 + 0.95 * q) * maxR;
        r.setAttribute('cx', g.cx); r.setAttribute('cy', f(wy));
        r.setAttribute('rx', f(rx)); r.setAttribute('ry', f(rx * 0.38));
        r.setAttribute('opacity', f((1 - q) * (0.35 + 0.65 * Math.max(st.e, st.hit))));
      });
      sing.setAttribute('opacity', f(0.85 * Math.max(st.e, st.hit)));
      // The wand goes behind the bowl on the far half of the rim.
      const far = sin(st.th) < -0.2;
      (far ? wandB : wandF).innerHTML = wandMarkup(g, st.th);
      (far ? wandF : wandB).innerHTML = '';
    };
    const loop = clock(time => {
      const dt = Math.min(0.1, time - (st.t || time));
      st.t = time;
      const d = turn(st.th, st.thTo) * 0.25;
      st.th += d;
      // A steady turn of the wand builds the voice; it fades slowly.
      st.eTo = Math.max(0, st.eTo - dt * 0.5);
      st.eTo = Math.min(1, st.eTo + Math.abs(d) * 0.5);
      st.e += (st.eTo - st.e) * 0.06;
      st.hit = Math.max(0, st.hit - dt * 0.6);
      st.ph += dt * (0.22 + 0.9 * Math.max(st.e, st.hit));
      draw();
      if (!st.live && Math.abs(turn(st.th, g.rest)) < 0.01 && st.e + st.hit < 0.01) {
        Object.assign(st, { th: g.rest, e: 0, eTo: 0, hit: 0 }); draw(); loop.stop();
      }
    });
    draw();
    return {
      enter(p) { st.live = true; st.eTo = Math.max(st.eTo, 0.3); loop.start(); this.move(p); },
      // The pointer's angle round the bowl puts the wand on the rim.
      move(p) { if (p) st.thTo = st.th + turn(st.th, atan2((p[1] - g.cy) / 0.43, p[0] - g.cx)); },
      // A press strikes the bowl like a bell.
      down() { st.hit = 1; st.ph = 0; loop.start(); },
      leave() { st.live = false; st.thTo = st.th + turn(st.th, g.rest); loop.start(); },
    };
  };
  const bowlEmblem = (g, hollow = '#9a9a9a', water = '#5a5a5a') => {
    const B = bowlShape(g.cx, g.cy, g.R), wy = g.cy + 0.14 * g.R;
    return `<g>${wandMarkup(g, g.rest, '#fff', '#fff')}</g><path d="${B.body}" fill="#fff"/><ellipse cx="${g.cx}" cy="${g.cy}" rx="${g.R}" ry="${f(g.R * 0.42)}" fill="${hollow}"/><ellipse cx="${g.cx}" cy="${f(wy)}" rx="${f(g.R * 0.74)}" ry="${f(g.R * 0.28)}" fill="${water}"/><ellipse cx="${g.cx}" cy="${f(wy)}" rx="${f(g.R * 0.4)}" ry="${f(g.R * 0.15)}" fill="none" stroke="#fff" stroke-width="${f(4.5 * g.k)}"/>`;
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover loop.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}
          <linearGradient id="${u}body" gradientUnits="userSpaceOnUse" x1="0" y1="56" x2="0" y2="99">
            <stop offset="0" stop-color="oklch(0.84 0.13 82)"/><stop offset="0.22" stop-color="oklch(0.46 0.1 58)"/><stop offset="0.6" stop-color="oklch(0.64 0.13 68)"/><stop offset="1" stop-color="oklch(0.25 0.06 45)"/>
          </linearGradient>
          <linearGradient id="${u}in" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.9 0.13 86)"/><stop offset="1" stop-color="oklch(0.56 0.12 66)"/></linearGradient>
          <linearGradient id="${u}water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.56 0.06 232)"/><stop offset="1" stop-color="oklch(0.3 0.06 58)"/></linearGradient>
          <clipPath id="${u}pool"><ellipse cx="64" cy="51" rx="37" ry="14"/></clipPath></defs>
        <ellipse cx="64" cy="102" rx="42" ry="6" fill="oklch(0.05 0.01 60)" opacity="0.5"/>
        <path d="M14 44C9 52 8 64 14 74C22 89 40 99 64 99C88 99 106 89 114 74C120 64 119 52 114 44A50 21 0 0 1 14 44Z" fill="url(#${u}body)"/>
        <path d="M14 44C9 52 8 64 14 74C22 89 40 99 64 99C88 99 106 89 114 74C120 64 119 52 114 44A50 21 0 0 1 14 44Z" fill="url(#${u}lit)"/>
        <ellipse cx="64" cy="44" rx="50" ry="21" fill="url(#${u}in)"/>
        <ellipse cx="64" cy="51" rx="37" ry="14" fill="url(#${u}water)"/>
        <g clip-path="url(#${u}pool)" fill="none" stroke="oklch(0.95 0.035 90)" stroke-width="2.2">
          ${[0, 1, 2, 3].map(() => '<g class="fan"><ellipse rx="6" ry="2.6" opacity="0.9"/><ellipse rx="12" ry="5.2" opacity="0.65"/><ellipse rx="18" ry="7.8" opacity="0.4"/></g>').join('')}
        </g>
        <g fill="oklch(0.97 0.025 215)">${[0, 1, 2, 3].map(() => '<circle class="drop" r="3.2"/>').join('')}</g>
        <ellipse cx="64" cy="44" rx="50" ry="21" fill="none" stroke="oklch(0.9 0.11 86)" stroke-width="3.2"/>
        <path d="M14 44C9 52 8 64 14 74C22 89 40 99 64 99C88 99 106 89 114 74C120 64 119 52 114 44" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>`;
      const fans = [...svg.querySelectorAll('.fan')], drops = [...svg.querySelectorAll('.drop')];
      const rings = fans.map(fg => [...fg.children]);
      const S = { th: PI / 4 }, HOP = { 0: 12, 1: 7, 2: 9, 3: 13 }, hop = { ...HOP };
      const FADE = [0.9, 0.65, 0.4];
      const place = () => fans.forEach((fg, k) => {
        const a = S.th + (k * PI) / 2, x = 64 + 37 * cos(a), y = 51 + 14 * sin(a);
        gsap.set(fg, { x, y });
        drops[k].setAttribute('cx', x.toFixed(1));
        drops[k].setAttribute('cy', (y - hop[k]).toFixed(1));
      });
      place();
      let tl = null;
      return {
        enter() {
          tl?.kill();
          tl = gsap.timeline();
          rings.forEach(rs => rs.forEach((r, i) => tl.fromTo(r, { scale: 0.3, opacity: 0.95 },
            { scale: 1.25, opacity: 0, duration: 1.2, ease: 'none', transformOrigin: '50% 50%', repeat: -1 }, i * 0.4)));
          drops.forEach((d, k) => tl.fromTo(hop, { [k]: 0 },
            { [k]: 16 + 5 * (k % 2), duration: 0.32, ease: 'power2.out', yoyo: true, repeat: -1, repeatDelay: 0.08 * k, onUpdate: place }, 0.13 * k));
        },
        move(p) {
          if (!p) return;
          const a = atan2((p[1] - 51) / 0.38, p[0] - 64) + PI / 4, q = PI / 2;
          const d = a - S.th, to = S.th + d - q * Math.round(d / q);
          gsap.to(S, { th: to, duration: 0.35, ease: 'power2.out', overwrite: 'auto', onUpdate: place });
        },
        leave() {
          tl?.kill(); tl = null;
          rings.forEach(rs => rs.forEach((r, i) => gsap.to(r, { scale: 1, opacity: FADE[i], duration: 0.4, overwrite: true })));
          gsap.to(hop, { ...HOP, duration: 0.4, ease: 'power2.out', onUpdate: place, overwrite: true });
          const q = PI / 2, home = PI / 4 + Math.round((S.th - PI / 4) / q) * q;
          gsap.to(S, { th: home, duration: 0.6, ease: 'power2.inOut', onUpdate: place, overwrite: true });
        },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // One deep bronze bowl, free on the ground, the wand at rest on the far rim.
  const A = { cx: 64, cy: 50, R: 46, len: 30, rest: -1.05, k: 1 };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [14, 9, 100, 91],
    idea: 'A deep hammered bronze bowl seen from above at an angle, dark water in it, and the wooden wand with its felt tip resting on the far rim. The pointer is the wand: it goes round the rim with the pointer, behind the bowl on the far half. A steady circle builds the voice, so the rim glows and rings run out over the water faster and brighter. A press strikes it like a bell. Leave lets the bowl ring on and fade.',
    art(svg, u) {
      const B = bowlShape(A.cx, A.cy, A.R);
      svg.innerHTML = `<defs>${bowlDefs(u)}${blur(`${u}h`, 2.4)}</defs>
        <ellipse cx="${A.cx}" cy="${f(B.bottom + 2)}" rx="40" ry="5" fill="oklch(0.05 0.01 60)" opacity="0.55" filter="url(#${u}h)"/>
        ${bowlMarkup(u, A)}`;
      return bowl(svg, u, A);
    },
    emblem: `${EMB_HEAD}${bowlEmblem(A)}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The bowl stands on a block of dark table wood.
  const CY = 86, HALF = 28, T = 12;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const [N, E, S, W] = D_TOP;
  const down = p => [p[0], p[1] + T];
  const D = { cx: 64, cy: 57, R: 30, len: 22, rest: -1.05, k: 0.7 };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [15.5, 28.7, 97, 97.3],
    idea: 'The bowl stands on a block of dark table wood: warm top, mid left face, dark right face, a rim on the top edges, a soft shadow of the bowl on the top. The wand rests on the far rim. The pointer takes the wand round the rim; a steady circle makes the rim glow and the rings run; a press strikes it.',
    art(svg, u) {
      svg.innerHTML = `<defs>${bowlDefs(u)}${blur(`${u}s`, 2.6)}${blur(`${u}h`, 2)}
          ${lg(`${u}wood`, [[0, 'oklch(0.46 0.06 52)'], [1, 'oklch(0.32 0.05 44)']], 'x1="0.3" y1="0" x2="0.6" y2="1"')}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 290)" opacity="0.5" filter="url(#${u}s)" transform="translate(0 4)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="oklch(0.3 0.05 46)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="oklch(0.2 0.035 40)"/>
        <path d="${poly(D_TOP)}" fill="url(#${u}wood)"/>
        <path d="${poly(D_TOP)}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <ellipse cx="${D.cx}" cy="${f(bowlShape(D.cx, D.cy, D.R).bottom - 2)}" rx="${f(D.R * 0.95)}" ry="${f(D.R * 0.36)}" fill="oklch(0.08 0.02 40)" opacity="0.6" filter="url(#${u}h)"/>
        ${bowlMarkup(u, D)}`;
      return bowl(svg, u, D);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/>${bowlEmblem(D, '#9a9a9a', '#4a4a4a')}</svg>`,
  });

  /* ================= Gallery ================= */
  const ID = 'bowl', NAME = "Singing bowl";
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = `row-${ID}`;
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `${ID}-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div><div class="mono"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      // A press is a strike, where the icon has one.
      if (c.down) tileEl.addEventListener('pointerdown', e => c.down(local(svg, e)));
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
