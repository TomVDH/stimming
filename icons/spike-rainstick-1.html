<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Rain stick 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Rain stick 1</h1>
<p class="lede">Rain stick, round 1. The toy is not built; this is an icon only. A: the glass tube on a slant, pins and a heap of beads; the pointer tips it. D: a walnut plinth, the tube rocks on a brass post.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The toy's tokens: clear glass, walnut caps, brass pins, bright glass beads.
  const GLASS = [[0, 'oklch(0.9 0.03 220)', 0.42], [0.35, 'oklch(0.7 0.03 220)', 0.08], [0.75, 'oklch(0.7 0.03 220)', 0.08], [1, 'oklch(0.9 0.03 220)', 0.38]];
  const WOOD = [[0, 'oklch(0.58 0.08 55)'], [1, 'oklch(0.34 0.06 45)']];
  const PIN = 'oklch(0.7 0.11 80)', PIN_LIT = 'oklch(0.94 0.13 88)';
  const BEADS = [['oklch(0.82 0.15 75)', 'oklch(0.6 0.16 55)'], ['oklch(0.8 0.12 190)', 'oklch(0.52 0.12 210)'], ['oklch(0.78 0.16 25)', 'oklch(0.55 0.17 20)'], ['oklch(0.95 0.03 90)', 'oklch(0.74 0.04 80)']];

  // One rain stick, drawn in its own frame: the axis runs along x.
  // len and wid set the tube; pins stand in two staggered rows.
  const NB = 14;
  const stick = (u, len, wid) => {
    const h = len / 2, r = wid / 2, cap = wid * 0.62;
    const tubeD = `M${-h + cap} ${-r}H${h - cap}V${r}H${-h + cap}Z`;
    const capD = s => { const x0 = s < 0 ? -h : h - cap - 2; return `M${x0 + (s < 0 ? r * 0.5 : 0)} ${-r - 2}H${x0 + cap + 2 - (s > 0 ? r * 0.5 : 0)}${s > 0 ? `Q${h} ${-r - 2} ${h} ${-r * 0.4}V${r * 0.4}Q${h} ${r + 2} ${h - r * 0.5} ${r + 2}` : `V${r + 2}`}H${x0 + (s < 0 ? r * 0.5 : 0)}${s < 0 ? `Q${-h} ${r + 2} ${-h} ${r * 0.4}V${-r * 0.4}Q${-h} ${-r - 2} ${-h + r * 0.5} ${-r - 2}` : `V${-r - 2}`}Z`; };
    const pins = [];
    for (let i = 0; i < 9; i++) pins.push([-h + cap + 8 + i * ((len - 2 * cap - 16) / 8), (i % 2 ? 1 : -1) * r * 0.42]);
    const markup = `<defs>
        ${lg(`${u}glass`, GLASS)}${lg(`${u}wood`, WOOD)}
        ${BEADS.map(([a, b], i) => rg(`${u}b${i}`, [[0, a], [1, b]], 'cx="0.36" cy="0.32" r="0.7"')).join('')}
        ${rg(`${u}pg`, [[0, PIN_LIT, 0.9], [1, PIN_LIT, 0]])}
        <clipPath id="${u}tc"><path d="${tubeD}"/></clipPath></defs>
      <path d="${tubeD}" fill="oklch(0.16 0.02 240)" opacity="0.55"/>
      <g clip-path="url(#${u}tc)">
        ${pins.map(([x, y]) => `<circle class="pg" cx="${f(x)}" cy="${f(y)}" r="7" fill="url(#${u}pg)" opacity="0"/>`).join('')}
        ${pins.map(([x, y]) => `<circle class="pin" cx="${f(x)}" cy="${f(y)}" r="2.1" fill="${PIN}"/>`).join('')}
        ${Array.from({ length: NB }, (_, i) => `<circle class="bd" r="${f(r * 0.34)}" fill="url(#${u}b${i % 4})"/>`).join('')}
      </g>
      <path d="${tubeD}" fill="url(#${u}glass)"/>
      <path d="${tubeD}" fill="url(#${u}lit)"/>
      <path d="M${-h + cap + 4} ${f(-r + 2.6)}H${h - cap - 4}" stroke="#fff" stroke-opacity="0.45" stroke-width="2.4" stroke-linecap="round"/>
      <path d="${tubeD}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
      ${[-1, 1].map(s => body(capD(s), u, 'wood')).join('')}`;
    return { markup, pins, h, r, cap, tubeD, capD };
  };

  // The beads, shared by A and D.
  // Tilt sends them along the tube; each pin lights as a bead runs past it.
  // At rest the tube leans left and the beads lie in a heap at the low end.
  const run = (svg, S, place, restDeg, maxDeg) => {
    const beads = [...svg.querySelectorAll('.bd')], pg = [...svg.querySelectorAll('.pg')];
    const lo = -S.h + S.cap + S.r * 0.4, hi = S.h - S.cap - S.r * 0.4, sp = S.r * 0.62;
    // A bead's slot in the heap: two lanes, stacked back from the end.
    const slot = (k, dir) => (dir > 0 ? hi - Math.floor(k / 2) * sp : lo + Math.floor(k / 2) * sp);
    const lane = k => (k % 2 ? 1 : -1) * S.r * 0.3 + (Math.floor(k / 2) % 2 ? 0.8 : -0.8);
    const B = beads.map((el, i) => ({ el, x: slot(i, restDeg > 0 ? 1 : -1), y: lane(i), v: 0 }));
    const glow = pg.map(() => 0);
    const st = { deg: restDeg, to: restDeg, live: false };
    const draw = () => {
      place(st.deg);
      B.forEach(b => { b.el.setAttribute('cx', f(b.x)); b.el.setAttribute('cy', f(b.y)); });
      pg.forEach((g, i) => g.setAttribute('opacity', f(glow[i])));
    };
    const step = () => {
      st.deg += (st.to - st.deg) * 0.1;
      const a = Math.sin(st.deg * Math.PI / 180), dir = a >= 0 ? 1 : -1;
      // Rank the beads from the low end, so each takes the next slot in the heap.
      const order = B.slice().sort((p, q) => dir * (q.x - p.x));
      let moving = 0;
      order.forEach((b, k) => {
        const target = slot(k, dir), ty = lane(k);
        b.v = (b.v + a * 0.16) * 0.94;
        b.x += b.v;
        // A bead stops at its slot; one left behind trickles on.
        if ((dir > 0 && b.x > target) || (dir < 0 && b.x < target)) { b.x = target; b.v = 0; }
        const free = Math.abs(b.x - target) > 0.5;
        if (free) moving++;
        // Pins knock a running bead from side to side.
        b.y += ((free ? S.r * 0.32 * Math.sin(b.x * 0.55 + k) : ty) - b.y) * 0.25;
        if (free) S.pins.forEach(([px, py], i) => { if (Math.hypot(px - b.x, py - b.y) < S.r * 0.62) glow[i] = 1; });
      });
      for (let i = 0; i < glow.length; i++) glow[i] *= 0.9;
      draw();
      if (!st.live && Math.abs(st.deg - st.to) < 0.1 && !moving && glow.every(g => g < 0.02)) { glow.fill(0); draw(); loop.stop(); }
    };
    const loop = clock(step);
    draw();
    return {
      enter(p) { st.live = true; loop.start(); if (p) this.move(p); },
      // The pointer presses its end down: the beads run toward it.
      move(p) { if (!p) return; st.to = clamp((p[0] - 64) / 34, -1, 1) * maxDeg; },
      leave() { st.live = false; st.to = restDeg; loop.start(); },
    };
  };

  const DIRS = [];

  /* ================= Current ================= */

  // Rain stick is not built; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NOT BUILT</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // The tube alone, free on the ground, leaning on a slant.
  const A_REST = -32;
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [12, 12, 104, 104],
    idea: 'A long glass tube with walnut caps, leaning on a slant: two staggered rows of brass pins inside and a heap of bright glass beads at the low end. The pointer presses its end down: the tube tips toward it, the beads trickle through the pins, side to side, and every pin a bead passes lights up and fades. Leave, and the tube leans back and the beads run home.',
    art(svg, u) {
      const S = stick(u, 118, 24);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}</defs>
        <ellipse cx="64" cy="112" rx="44" ry="4" fill="oklch(0.05 0.01 240)" opacity="0.55" filter="url(#${u}b)"/>
        <g class="stick">${S.markup}</g>`;
      const g = svg.querySelector('.stick');
      return run(svg, S, deg => g.setAttribute('transform', `translate(64 64) rotate(${f(deg)})`), A_REST, 34);
    },
    emblem: (() => {
      const S = stick('e', 118, 24);
      return `${EMB_HEAD}<g transform="translate(64 64) rotate(${A_REST})"><path d="${S.tubeD}${S.capD(-1)}${S.capD(1)}" fill="#fff"/>${Array.from({ length: 6 }, (_, k) => `<circle cx="${f(-S.h + S.cap + S.r * 0.4 + Math.floor(k / 2) * S.r * 0.62)}" cy="${f((k % 2 ? 1 : -1) * S.r * 0.3)}" r="${f(S.r * 0.34)}" fill="#000"/>`).join('')}</g></svg>`;
    })(),
  });

  /* ================= D: Isometric block ================= */

  // A walnut plinth is the block; the tube rocks on a brass post above it.
  const CY = 94, HALF = 20, T = 14;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const [N, E, S, W] = D_TOP;
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  const PIVOT = [64, 52], D_REST = -24;
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [12, 26, 104, 100],
    idea: 'A walnut plinth is the block, a rim on its top edges. A brass post rises from it, and the glass tube rocks on the post like a seesaw, beads heaped at its low end. The pointer presses its end down: the tube tips, the beads trickle through the pins and light them as they pass.',
    art(svg, u) {
      const St = stick(u, 104, 21);
      const top = poly(D_TOP);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}
          ${lg(`${u}top`, [[0, 'oklch(0.56 0.08 55)'], [1, 'oklch(0.44 0.07 50)']], 'x1="0" y1="0" x2="0.4" y2="1"')}
          ${lg(`${u}brass`, [[0, 'oklch(0.86 0.11 85)'], [1, 'oklch(0.58 0.11 70)']], 'x1="0" y1="0" x2="1" y2="0"')}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="oklch(0.42 0.07 50)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="oklch(0.3 0.055 45)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <ellipse cx="64" cy="${CY}" rx="7" ry="4" fill="oklch(0.62 0.1 75)"/>
        ${body(`M60.5 ${CY}V${PIVOT[1] + 2}H67.5V${CY}Z`, u, 'brass')}
        <g class="stick">${St.markup}</g>
        <circle cx="${PIVOT[0]}" cy="${PIVOT[1]}" r="4.2" fill="url(#${u}brass)"/>`;
      const g = svg.querySelector('.stick');
      return run(svg, St, deg => g.setAttribute('transform', `translate(${PIVOT[0]} ${PIVOT[1]}) rotate(${f(deg)})`), D_REST, 28);
    },
    emblem: (() => {
      const St = stick('e', 104, 21);
      return `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/><path d="M60.5 ${CY}V${PIVOT[1]}H67.5V${CY}Z" fill="#fff"/><g transform="translate(${PIVOT[0]} ${PIVOT[1]}) rotate(${D_REST})"><path d="${St.tubeD}${St.capD(-1)}${St.capD(1)}" fill="#fff"/></g></svg>`;
    })(),
  });


  /* ================= Gallery ================= */
  const NAME = 'Rain stick';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-rainstick';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `rainstick-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
