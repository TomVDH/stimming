<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Observatory 2</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --faint: oklch(0.42 0.02 275);
  --line: oklch(0.26 0.014 275);
  --focus: oklch(0.84 0.13 205);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 clamp(24px, 4vw, 40px); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
section { margin-bottom: clamp(40px, 6vw, 64px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
/* One row per candidate: the label, then its tiles. */
.rows { display: grid; gap: 14px; width: fit-content; max-width: 100%; padding: 16px 20px; background: var(--bg); }
.r { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.lab { width: 150px; display: grid; gap: 2px; }
.lab b { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.lab span { color: var(--muted); font-size: 12px; }
.cell { display: grid; justify-items: center; gap: 6px; }
.cell i { font-style: normal; color: var(--faint); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
.hd { display: flex; flex-wrap: wrap; gap: 12px 18px; padding-left: 168px; color: var(--muted); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
.hd span { text-align: center; }
/* Tiles sit on the menu ground; a hairline marks the square. */
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.26 0.014 275); cursor: pointer; touch-action: none; border-radius: 2px; }
.tile:focus-visible { outline: 2px solid var(--focus); }
.tile svg { display: block; overflow: visible; }
.s64, .s64 svg { width: 64px; height: 64px; }
.s128, .s128 svg { width: 128px; height: 128px; }
.s256, .s256 svg { width: 256px; height: 256px; }
/* The shelf mock: the live menu in a frame. */
.pick { display: inline-flex; gap: 4px; padding: 3px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 999px; }
.pick button { font: inherit; font-size: 13px; padding: 5px 14px; color: var(--muted); background: none; border: 0; border-radius: 999px; cursor: pointer; }
.pick button:hover { color: var(--fg); }
.pick button[aria-pressed="true"] { color: var(--bg); background: var(--fg); }
.pick button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.shelfwrap { max-width: 100%; overflow-x: auto; }
#shelf { display: block; width: 900px; height: 236px; border: 0; background: var(--bg); }
#shelfcap { display: block; margin: 0 0 6px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Observatory 2</h1>

<section>
  <h2>Sheet</h2>
  <div class="rows" id="sheet">
    <div class="hd"><span style="width:128px">Rest</span><span style="width:128px">Play</span><span style="width:64px">Rest</span><span style="width:64px">Play</span></div>
  </div>
</section>

<section>
  <h2>2x</h2>
  <div class="rows" id="x2"></div>
</section>

<section>
  <h2>Shelf</h2>
  <div class="pick" id="pick" role="group" aria-label="Candidate on the shelf"></div>
  <div class="shelfwrap" id="shelfwrap"><span id="shelfcap"></span><iframe id="shelf" title="Shelf mock" src="../index.html?all" scrolling="no"></iframe></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RAD = Math.PI / 180, TAU = Math.PI * 2;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const P = p => `${f(p[0])} ${f(p[1])}`;
  const poly = pts => 'M' + pts.map(P).join('L') + 'Z';
  const path = pts => 'M' + pts.map(P).join('L');
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const stops = s => s.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('');
  const lg = (id, s, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops(s)}</linearGradient>`;
  const rg = (id, s, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops(s)}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body: one gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, cls = '') => {
    const c = cls ? ` class="${cls}"` : '';
    return `<path${c} d="${d}" fill="url(#${u}${fill})"/><path${c} d="${d}" fill="url(#${u}lit)"/><path${c} d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  };
  // A soft ground shadow under an object.
  const shadow = (u, cx, cy, rx, ry, op = 0.6) => `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${rx}" ry="${ry}" fill="oklch(0.05 0.01 270)" opacity="${op}" filter="url(#${u}b)"/>`;
  const set = (node, attrs) => { for (const k in attrs) node.setAttribute(k, typeof attrs[k] === 'number' ? f(attrs[k]) : attrs[k]); };

  // A state eases to its goal on the shared ticker, then stops.
  // A settled icon does no per-frame work.
  const chase = (st, rate, draw) => {
    const to = { ...st };
    let on = false;
    const tick = () => {
      let off = 0;
      for (const k in to) {
        const d = to[k] - st[k];
        st[k] += d * (rate[k] ?? 0.2);
        off = Math.max(off, Math.abs(d));
      }
      draw(st);
      if (off < 0.003) { Object.assign(st, to); draw(st); on = false; gsap.ticker.remove(tick); }
    };
    draw(st);
    return { to, go(t) { Object.assign(to, t); if (!on) { on = true; gsap.ticker.add(tick); } } };
  };
  // Pointer glue for one icon.
  // A point aims the icon; null runs a slow sweep instead.
  const glue = ({ aim, wake, rest, sweep }) => {
    let tw = null;
    const calm = () => { tw?.kill(); tw = null; };
    return {
      enter(p) {
        wake();
        if (p) { aim(p); return; }
        const v = { x: sweep[0][0], y: sweep[0][1] };
        tw = gsap.to(v, { x: sweep[1][0], y: sweep[1][1], duration: 3.2, ease: 'sine.inOut', yoyo: true, repeat: -1, onUpdate: () => aim([v.x, v.y]) });
      },
      move(p) { if (!p) return; calm(); aim(p); },
      leave() { calm(); rest(); },
    };
  };
  // Monotone chain: the convex hull of a point set.
  const hull = pts => {
    const s = [...pts].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], hi = [];
    for (const p of s) { while (lo.length > 1 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    for (const p of s.reverse()) { while (hi.length > 1 && cross(hi[hi.length - 2], hi[hi.length - 1], p) <= 0) hi.pop(); hi.push(p); }
    return [...lo.slice(0, -1), ...hi.slice(0, -1)];
  };
  const bbox = pts => {
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const x = Math.min(...xs), y = Math.min(...ys);
    return [x, y, Math.max(...xs) - x, Math.max(...ys) - y];
  };
  // A bold four-point star.
  const starPath = (x, y, r) => `M${f(x)} ${f(y - r)}Q${f(x + r * 0.16)} ${f(y - r * 0.16)} ${f(x + r)} ${f(y)}Q${f(x + r * 0.16)} ${f(y + r * 0.16)} ${f(x)} ${f(y + r)}Q${f(x - r * 0.16)} ${f(y + r * 0.16)} ${f(x - r)} ${f(y)}Q${f(x - r * 0.16)} ${f(y - r * 0.16)} ${f(x)} ${f(y - r)}Z`;

  // An observatory dome seen from the front, a little from above.
  // World x runs right, y up, z toward the eye.
  const domeKit = (OX, OY, R, E) => {
    const ce = Math.cos(E), se = Math.sin(E);
    const scr = (x, y, z) => [OX + x, OY - y * ce + z * se];
    // A point on the dome: azimuth phi, height th, east offset e.
    const on = (phi, th, e = 0) => scr(R * Math.cos(th) * Math.sin(phi) + e * Math.cos(phi), R * Math.sin(th), R * Math.cos(th) * Math.cos(phi) - e * Math.sin(phi));
    // Points on a level circle from angle t0 to t1.
    // The front half runs from 0 to pi.
    const level = (r, y, t0, t1, n = 32) => Array.from({ length: n + 1 }, (_, i) => { const t = lerp(t0, t1, i / n); return scr(r * Math.cos(t), y, r * Math.sin(t)); });
    const ring = (r, y) => poly(level(r, y, 0, TAU, 48).slice(0, -1));
    // The front face of a band from height y0 to y1.
    const band = (r, y0, y1) => poly([...level(r, y0, Math.PI, 0), ...level(r, y1, 0, Math.PI)]);
    const dome = `M${f(OX - R)} ${f(OY)}A${R} ${R} 0 0 1 ${f(OX + R)} ${f(OY)}A${R} ${f(R * se)} 0 0 1 ${f(OX - R)} ${f(OY)}Z`;
    // The slit: an even band at azimuth phi, heights a to b.
    const slit = (phi, w, a, b, n = 14) => {
      const L = [], Rr = [];
      for (let i = 0; i <= n; i++) { const th = lerp(a, b, i / n); L.push(on(phi, th, -w)); Rr.push(on(phi, th, w)); }
      return poly([...L, ...Rr.reverse()]);
    };
    return { scr, on, level, ring, band, dome, slit, ce, se };
  };

  // The toy's colours: white steel, stone, a red lamp, a green beam.
  const DOME = [[0, 'oklch(0.97 0.008 95)'], [0.55, 'oklch(0.82 0.014 250)'], [1, 'oklch(0.55 0.025 262)']];
  const STEEL = [[0, 'oklch(0.86 0.012 250)'], [1, 'oklch(0.5 0.022 260)']];
  const STONE = [[0, 'oklch(0.6 0.03 62)'], [0.4, 'oklch(0.54 0.03 58)'], [1, 'oklch(0.34 0.026 50)']];
  const INSIDE = [[0, 'oklch(0.13 0.025 275)'], [0.55, 'oklch(0.22 0.06 24)'], [1, 'oklch(0.42 0.13 28)']];
  const LAMP = 'oklch(0.86 0.12 78)', LAMP_HOT = 'oklch(0.97 0.05 92)';
  const DOOR = [[0, 'oklch(0.9 0.1 85)'], [1, 'oklch(0.7 0.14 62)']];
  const BEAM = 'oklch(0.93 0.14 142)', BEAM_HALO = 'oklch(0.8 0.19 145)';
  const GLASS = [[0, 'oklch(0.26 0.06 268)'], [0.7, 'oklch(0.15 0.035 272)'], [1, 'oklch(0.09 0.02 275)']];
  const STAR = 'oklch(0.97 0.04 250)';
  // The objective: a steel cell round dark glass.
  const CELL = 'oklch(0.6 0.02 255)', DARK = 'oklch(0.1 0.02 272)';

  const DIRS = [];

  /* ================= A0: round 1, icon A ================= */

  // The first round's A, as the Lab shows it today.
  {
    const R = 34, OX = 64, OY = 72;
    const A_DOME = `M${OX - R} ${OY}A${R} ${R} 0 0 1 ${OX + R} ${OY}Z`;
    const A_DRUM = `M${OX - R - 2} ${OY - 2}H${OX + R + 2}V${OY + 34}Q${OX + R + 2} ${OY + 38} ${OX + R - 2} ${OY + 38}H${OX - R + 2}Q${OX - R - 2} ${OY + 38} ${OX - R - 2} ${OY + 34}Z`;
    const A_DOOR = 'M58 110V96Q58 90 64 90Q70 90 70 96V110Z';
    const proj = (phi, th, e) => [OX + R * Math.cos(th) * Math.sin(phi) + e * Math.cos(phi), OY - R * Math.sin(th)];
    const slitPath = (phi, w) => {
      const L = [], Rr = [];
      for (let i = 0; i <= 12; i++) { const th = (i / 12) * 90 * RAD; L.push(proj(phi, th, -w)); Rr.push(proj(phi, th, w)); }
      return poly([...L, ...Rr.reverse()]);
    };
    const tubePath = (a, b, w) => {
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, nx = -dy / l * w / 2, ny = dx / l * w / 2;
      return poly([[a[0] + nx, a[1] + ny], [b[0] + nx, b[1] + ny], [b[0] - nx, b[1] - ny], [a[0] - nx, a[1] - ny]]);
    };
    const REST = { phi: -28 * RAD, th: 52 * RAD, w: 4.2, sx: 98, sy: 22 };
    DIRS.push({
      l: 'A0', name: 'Round 1, A', box: [28, 14, 72, 98], play: [92, 24],
      art(svg, u) {
        svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}
            ${rg(`${u}dome`, [[0, 'oklch(0.96 0.01 95)'], [0.6, 'oklch(0.8 0.015 250)'], [1, 'oklch(0.56 0.025 260)']], 'cx="0.36" cy="0.3" r="0.85"')}
            ${lg(`${u}stone`, [[0, 'oklch(0.64 0.03 62)'], [1, 'oklch(0.42 0.03 50)']], 'x1="0" y1="0" x2="1" y2="1"')}
            ${rg(`${u}glow`, [[0, 'oklch(0.96 0.09 95)', 0.7], [1, 'oklch(0.96 0.09 95)', 0]])}
            <mask id="${u}tm" maskUnits="userSpaceOnUse" x="-20" y="-20" width="168" height="168"><rect x="-20" y="-20" width="168" height="168" fill="#fff"/><path d="${A_DOME}" fill="#000"/><path class="slitm" fill="#fff"/></mask>
            <clipPath id="${u}dc"><path d="${A_DOME}"/></clipPath></defs>
          ${shadow(u, 64, 111, 40, 4)}
          ${body(A_DRUM, u, 'stone')}
          <path d="${A_DOOR}" fill="oklch(0.28 0.03 45)"/><path d="M60.5 108V97Q60.5 93 64 93Q67.5 93 67.5 97V108Z" fill="oklch(0.78 0.12 75)" opacity="0.85"/>
          ${body(A_DOME, u, 'dome')}
          <path class="slit" clip-path="url(#${u}dc)" fill="oklch(0.17 0.035 272)"/>
          <g mask="url(#${u}tm)"><path class="tube" fill="oklch(0.84 0.02 250)"/><path class="tubehi" fill="none" stroke="oklch(0.97 0.01 250)" stroke-width="2.4" stroke-linecap="round"/><circle class="lens" r="4.2" fill="oklch(0.3 0.05 260)"/></g>
          <circle class="sg" r="10" fill="url(#${u}glow)"/><path class="star" fill="oklch(0.96 0.09 95)"/>`;
        const q = s => svg.querySelector(s);
        const slit = q('.slit'), slitm = q('.slitm'), tube = q('.tube'), hi = q('.tubehi'), lens = q('.lens'), star = q('.star'), sg = q('.sg');
        const piv = [OX, OY - 6];
        const ch = chase({ ...REST }, { phi: 0.05, th: 0.09, w: 0.1, sx: 0.25, sy: 0.25 }, st => {
          const d = slitPath(st.phi, st.w);
          slit.setAttribute('d', d); slitm.setAttribute('d', d);
          const L = R * 1.42, c = Math.cos(st.th);
          const tip = [piv[0] + L * c * Math.sin(st.phi), piv[1] - L * Math.sin(st.th)];
          tube.setAttribute('d', tubePath(piv, tip, 9));
          const mid = [lerp(piv[0], tip[0], 0.45), lerp(piv[1], tip[1], 0.45)];
          hi.setAttribute('d', `M${f(mid[0] - 1.8)} ${f(mid[1])}L${f(tip[0] - 1.8)} ${f(tip[1])}`);
          set(lens, { cx: tip[0], cy: tip[1] });
          star.setAttribute('d', starPath(st.sx, st.sy, 6.5));
          set(sg, { cx: st.sx, cy: st.sy });
        });
        return glue({
          aim: p => {
            const k = clamp((p[0] - 64) / 38, -1, 1);
            ch.go({ phi: k * 55 * RAD, th: clamp(lerp(82, 26, (p[1] - 16) / 58), 26, 82) * RAD, sx: clamp(p[0], 24, 104), sy: clamp(p[1], 12, 62) });
          },
          wake: () => ch.go({ w: 6.2 }),
          rest: () => ch.go({ ...REST }),
          sweep: [[40, 44], [90, 30]],
        });
      },
    });
  }

  /* ================= 1: Dome and beam ================= */

  // The dome from the front on its catwalk ring and drum.
  // The beam leaves the slit top; the pointer aims it.
  // The beam is quick; the dome turns slowly to follow.
  {
    const K = domeKit(64, 80, 40, 12 * RAD);
    const RB = 44, RD = 38, TOP = 88 * RAD;
    const RING_TOP = K.ring(RB, 0), RING = K.band(RB, 0, -6), DRUM = K.band(RD, -6, -22);
    const db = K.scr(0, -22, RD)[1], dt = K.scr(0, -15, RD)[1];
    const DOOR_P = `M58.5 ${f(db - 0.4)}V${f(dt)}A5.5 5.5 0 0 1 69.5 ${f(dt)}V${f(db - 0.4)}Z`;
    const REST = { phi: 24 * RAD, w: 3, a: 62 * RAD, L: 38, k: 0.8 };
    // A bar from a to b, tapering from width w0 to w1.
    const taper = (a, b, w0, w1) => {
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
      return poly([[a[0] + nx * w0 / 2, a[1] + ny * w0 / 2], [b[0] + nx * w1 / 2, b[1] + ny * w1 / 2], [b[0] - nx * w1 / 2, b[1] - ny * w1 / 2], [a[0] - nx * w0 / 2, a[1] - ny * w0 / 2]]);
    };
    const geo = st => {
      const alt = st.a <= Math.PI / 2 ? st.a : Math.PI - st.a;
      const o = K.on(st.phi, TOP), e = [o[0] + st.L * Math.cos(st.a), o[1] - st.L * Math.sin(st.a)];
      // The objective shows only once the slit is open.
      return { slit: K.slit(st.phi, st.w, 0, 96 * RAD), obj: K.on(st.phi, clamp(alt, 24 * RAD, 72 * RAD)), r: clamp((st.w - 3.4) * 1.6, 0, 6.2), o, e };
    };
    DIRS.push({
      l: '1', name: 'Dome and beam', box: [20, 9, 88, 104], play: [100, 18],
      art(svg, u) {
        svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}h`, 2.2)}
            ${rg(`${u}dome`, DOME, 'cx="0.36" cy="0.28" r="0.85"')}
            ${lg(`${u}steel`, STEEL, 'x1="0" y1="0" x2="1" y2="0.3"')}
            ${lg(`${u}top`, [[0, 'oklch(0.78 0.014 250)'], [1, 'oklch(0.6 0.02 258)']], 'x1="0" y1="0" x2="1" y2="0"')}
            ${lg(`${u}stone`, STONE, 'x1="0" y1="0" x2="1" y2="0"')}
            ${lg(`${u}door`, DOOR)}
            ${rg(`${u}pool`, [[0, LAMP, 0.5], [1, LAMP, 0]])}
            <linearGradient id="${u}in" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="88">${stops(INSIDE)}</linearGradient>
            <linearGradient id="${u}beam" gradientUnits="userSpaceOnUse">${stops([[0, BEAM], [0.6, BEAM, 0.85], [1, BEAM, 0]])}</linearGradient>
            <linearGradient id="${u}halo" gradientUnits="userSpaceOnUse">${stops([[0, BEAM_HALO, 0.42], [1, BEAM_HALO, 0]])}</linearGradient>
            <clipPath id="${u}dc"><path d="${K.dome}"/></clipPath>
            <clipPath id="${u}rc"><path d="${DRUM}"/></clipPath></defs>
          ${shadow(u, 64, 110, 46, 6)}
          ${body(DRUM, u, 'stone')}
          <ellipse cx="64" cy="${f(db - 6)}" rx="18" ry="10" fill="url(#${u}pool)" clip-path="url(#${u}rc)"/>
          <path d="${DOOR_P}" fill="url(#${u}door)"/>
          <path d="${RING_TOP}" fill="url(#${u}top)"/>
          ${body(RING, u, 'steel')}
          ${body(K.dome, u, 'dome')}
          <g clip-path="url(#${u}dc)"><path class="slit" fill="url(#${u}in)"/>
            <circle class="cell" fill="${CELL}"/><circle class="glass" fill="${DARK}"/></g>
          <g class="beam"><path class="halo" fill="none" stroke="url(#${u}halo)" stroke-width="8" stroke-linecap="round" filter="url(#${u}h)"/>
            <path class="core" fill="url(#${u}beam)"/></g>`;
        const q = s => svg.querySelector(s);
        const slit = q('.slit'), cell = q('.cell'), glass = q('.glass'), beam = q('.beam'), halo = q('.halo'), core = q('.core');
        const gb = q(`#${u}beam`), gh = q(`#${u}halo`);
        const ch = chase({ ...REST }, { phi: 0.06, w: 0.12, a: 0.3, L: 0.25, k: 0.2 }, st => {
          const g = geo(st);
          slit.setAttribute('d', g.slit);
          set(cell, { cx: g.obj[0], cy: g.obj[1], r: g.r });
          set(glass, { cx: g.obj[0], cy: g.obj[1], r: g.r * 0.66 });
          core.setAttribute('d', taper(g.o, g.e, 4.6, 2.8));
          halo.setAttribute('d', path([g.o, g.e]));
          for (const gr of [gb, gh]) set(gr, { x1: g.o[0], y1: g.o[1], x2: g.e[0], y2: g.e[1] });
          beam.setAttribute('opacity', f(st.k));
        });
        return glue({
          aim: p => {
            const o = K.on(ch.to.phi, TOP);
            let a = Math.atan2(o[1] - p[1], p[0] - o[0]);
            // A point below the root lays the beam flat on that side.
            if (a < 0) a = a < -Math.PI / 2 ? Math.PI : 0;
            a = clamp(a, 16 * RAD, 164 * RAD);
            ch.go({ a, L: clamp(Math.hypot(p[0] - o[0], p[1] - o[1]) + 12, 30, 80), phi: clamp((Math.PI / 2 - a) * 0.85, -62 * RAD, 62 * RAD) });
          },
          wake: () => ch.go({ w: 7.4, k: 1 }),
          rest: () => ch.go({ ...REST }),
          sweep: [[30, 30], [100, 24]],
        });
      },
      // The emblem: a white dome, ring and beam; a grey drum.
      emblem() {
        const k = domeKit(64, 78, 42, 0), phi = 22 * RAD;
        return [
          '<path d="M22 78A42 42 0 0 1 106 78Z" fill="#fff"/>',
          `<path d="${k.slit(phi, 4.6, 0, 90 * RAD)}" fill="#000"/>`,
          `<path d="${taper(k.on(phi, 90 * RAD), [106, 7], 8, 6)}" fill="#fff"/>`,
          '<rect x="14" y="82" width="100" height="9" rx="3" fill="#fff"/>',
          '<path d="M24 95H104V115Q104 120 99 120H29Q24 120 24 115Z" fill="#8c8c8c"/>',
          '<path d="M55 120V105A9 9 0 0 1 73 105V120Z" fill="#000"/>',
        ];
      },
    });
  }

  /* ================= 2: Objective glass ================= */

  // The refractor's front end in three-quarter view, glass deep inside.
  // A star sits sharp in the glass at rest.
  // The pointer is the star; the tube turns to it.
  // The star blurs while the tube slews.
  {
    // The tube turns round its middle, M, as on a real mount.
    const M = [50, 65], RS = 29, RT = 19, RG = 21.5, LT = 100, DS = 24, DEPTH = 9, SEE = 64;
    // Two unit vectors that span the lens plane for an axis n.
    const basis = (nx, ny) => {
      const nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny)), h = Math.hypot(nx, ny);
      const a = h < 1e-4 ? [1, 0, 0] : [ny / h, -nx / h, 0];
      return [a, [ny * a[2] - nz * a[1], nz * a[0] - nx * a[2], nx * a[1] - ny * a[0]]];
    };
    // The screen outline of a circle of radius r round c.
    const circ = (c, r, [a, b], n = 56) => Array.from({ length: n }, (_, i) => {
      const t = (i / n) * TAU;
      return [c[0] + r * (Math.cos(t) * a[0] + Math.sin(t) * b[0]), c[1] - r * (Math.cos(t) * a[1] + Math.sin(t) * b[1])];
    });
    const REST = { nx: 0.52, ny: 0.42, tx: 0.47, ty: 0.47, q: 0 };
    const geo = st => {
      const B = basis(st.nx, st.ny), at = k => [M[0] + (k + LT / 2) * st.nx, M[1] - (k + LT / 2) * st.ny];
      const C = at(0), face = circ(C, RS, B), gc = at(-DEPTH);
      // The dew shield is wider than the tube behind it.
      const shield = hull([...face, ...circ(at(-DS), RS, B)]);
      const tube = hull([...circ(at(-DS + 2), RT, B), ...circ(at(-LT), RT, B)]);
      // The star's offset is the angle between the aim and the star.
      let ox = (st.tx - st.nx) * SEE, oy = -(st.ty - st.ny) * SEE;
      const m = Math.hypot(ox, oy), cap = RG * 0.56;
      if (m > cap) { ox *= cap / m; oy *= cap / m; }
      const h = Math.hypot(st.nx, st.ny) || 1, mid = at(-LT / 2);
      // The lit side of the tube faces the top left.
      let px = st.ny / h, py = st.nx / h;
      if (px + py > 0) { px = -px; py = -py; }
      return {
        face, shield, tube, gc, bore: circ(C, RG, B), glass: circ(gc, RG, B),
        // The coating sheen: the glass less a copy moved down and right.
        sheen: poly(circ(gc, RG, B)) + poly(circ([gc[0] + 6, gc[1] + 6], RG, B)),
        star: [gc[0] + ox, gc[1] + oy], lit: [mid[0] + px * RS, mid[1] + py * RS], dim: [mid[0] - px * RS, mid[1] - py * RS],
      };
    };
    const g0 = geo(REST), BOX = bbox([...g0.shield, ...g0.tube]);
    DIRS.push({
      l: '2', name: 'Objective glass', box: BOX, play: [70, 8],
      art(svg, u) {
        svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}
            <linearGradient id="${u}tube" gradientUnits="userSpaceOnUse">${stops([[0, 'oklch(0.92 0.01 250)'], [0.5, 'oklch(0.72 0.02 255)'], [1, 'oklch(0.42 0.025 262)']])}</linearGradient>
            ${rg(`${u}face`, [[0, 'oklch(0.94 0.07 90)'], [0.6, 'oklch(0.8 0.11 76)'], [1, 'oklch(0.56 0.1 60)']], 'cx="0.34" cy="0.3" r="0.8"')}
            ${rg(`${u}glass`, GLASS, 'cx="0.42" cy="0.38" r="0.7"')}
            ${lg(`${u}sheen`, [[0, 'oklch(0.66 0.14 300)', 0.6], [0.55, 'oklch(0.66 0.14 300)', 0]], 'x1="0" y1="0" x2="1" y2="1"')}
            ${rg(`${u}glow`, [[0, STAR, 0.85], [0.4, STAR, 0.3], [1, STAR, 0]])}
            <clipPath id="${u}bc"><path class="borec"/></clipPath>
            <clipPath id="${u}gc"><path class="glassc"/></clipPath></defs>
          ${shadow(u, BOX[0] + BOX[2] * 0.42, BOX[1] + BOX[3] + 3, 30, 4, 0.45)}
          ${body('', u, 'tube', 'tube')}
          ${body('', u, 'tube', 'shield')}
          ${body('', u, 'face', 'face')}
          <path class="bore" fill="oklch(0.2 0.02 262)"/>
          <g clip-path="url(#${u}bc)"><path class="glass" fill="url(#${u}glass)"/>
            <g clip-path="url(#${u}gc)"><path class="sheen" fill="url(#${u}sheen)" fill-rule="evenodd"/>
            <circle class="glow" fill="url(#${u}glow)"/><circle class="ring" fill="none" stroke="${STAR}" stroke-width="2.6"/><path class="core" fill="${STAR}"/></g></g>`;
        const q = s => svg.querySelector(s), qa = s => svg.querySelectorAll(s);
        const tube = qa('.tube'), shield = qa('.shield'), face = qa('.face'), bore = q('.bore'), borec = q('.borec');
        const glass = q('.glass'), glassc = q('.glassc'), sheen = q('.sheen');
        const glow = q('.glow'), ring = q('.ring'), core = q('.core'), gt = q(`#${u}tube`);
        let ch = null;
        ch = chase({ ...REST }, { nx: 0.07, ny: 0.07, tx: 0.35, ty: 0.35, q: 0.12 }, st => {
          const g = geo(st), bd = poly(g.bore), gd = poly(g.glass);
          for (const [nodes, pts] of [[tube, g.tube], [shield, g.shield], [face, g.face]]) { const d = poly(pts); nodes.forEach(n => n.setAttribute('d', d)); }
          bore.setAttribute('d', bd); borec.setAttribute('d', bd);
          glass.setAttribute('d', gd); glassc.setAttribute('d', gd);
          sheen.setAttribute('d', g.sheen);
          set(gt, { x1: g.lit[0], y1: g.lit[1], x2: g.dim[0], y2: g.dim[1] });
          // A slewing tube blurs the star; a settled tube brings it sharp.
          const slew = ch ? Math.hypot(ch.to.nx - st.nx, ch.to.ny - st.ny) : 0, k = 1 - clamp(slew * 7), lit = lerp(0.75, 1, st.q);
          const [sx, sy] = g.star;
          set(glow, { cx: sx, cy: sy, r: lerp(6, lerp(9, 12, st.q), k), opacity: lerp(0.3, 0.9, k) * lit });
          set(ring, { cx: sx, cy: sy, r: lerp(7, 0.8, k), 'stroke-opacity': (1 - k) * 0.85 * lit });
          set(core, { d: starPath(sx, sy, lerp(1.6, 6, k)), opacity: lerp(0.4, 1, k) * lit });
        });
        // The pointer gives a direction out of the glass.
        const dir = p => {
          let x = (p[0] - M[0]) / 60, y = -(p[1] - M[1]) / 60;
          const m = Math.hypot(x, y, 1);
          x /= m; y /= m;
          const h = Math.hypot(x, y), cap = 0.7;
          if (h > cap) { x *= cap / h; y *= cap / h; }

        };
        return glue({
          aim: p => { const [x, y] = dir(p); ch.go({ tx: x, ty: y, nx: x, ny: y }); },
          wake: () => ch.go({ q: 1 }),
          rest: () => ch.go({ ...REST }),
          sweep: [[34, 40], [110, 24]],
        });
      },
      // The emblem: a white tube, a black glass, a white star.
      emblem() {
        const [bx, by, bw, bh] = BOX, s = 114 / Math.max(bw, bh);
        const ox = 64 - (bx + bw / 2) * s, oy = 64 - (by + bh / 2) * s;
        const m = pts => pts.map(p => [p[0] * s + ox, p[1] * s + oy]);
        const gc = m([g0.gc])[0], glass = poly(m(g0.glass));
        const cut = m(g0.glass.map(p => [p[0] + 6, p[1] + 6]));
        return [
          `<clipPath id="g"><path d="${glass}"/></clipPath>`,
          `<path d="${poly(m(g0.tube))}" fill="#fff"/>`,
          `<path d="${poly(m(g0.shield))}" fill="#fff" stroke="#000" stroke-width="3" stroke-linejoin="round"/>`,
          `<path d="${poly(m(g0.face))}" fill="#fff" stroke="#000" stroke-width="3"/>`,
          `<path d="${poly(m(g0.bore))}" fill="#000"/>`,
          `<path d="${glass}${poly(cut)}" fill="#8c8c8c" fill-rule="evenodd" clip-path="url(#g)"/>`,
          `<path d="${starPath(gc[0] + 2, gc[1] + 3, 10)}" fill="#fff"/>`,
        ];
      },
    });
  }

  /* ================= 3: Three-quarter, door lamp ================= */

  // The dome and drum in three-quarter view, from above.
  // The shutter stands half open; the door lamp lights the stone.
  // The pointer turns the dome; the shutter opens; the tube looks out.
  {
    const R = 32, RD = 32, H = 32, AZ0 = -36 * RAD, BOX = [30, 21, 68, 76];
    const K = domeKit(64, 54, R, 20 * RAD);
    // Night stone: the lamp gives it its warmth.
    const NIGHT = [[0, 'oklch(0.5 0.026 62)'], [0.4, 'oklch(0.42 0.024 58)'], [1, 'oklch(0.25 0.02 52)']];
    // A steel skirt rings the dome's foot.
    // The stone drum runs below it.
    const SKIRT = K.band(R + 1, 0, -4), SIDE = K.band(RD, -4, -H);
    const onDrum = (u, y) => { const az = AZ0 + u / RD; return K.scr(RD * Math.sin(az), y, RD * Math.cos(az)); };
    const DOOR_PTS = [onDrum(-6.2, -H), onDrum(-6.2, -H + 11)];
    for (let i = 1; i < 12; i++) { const t = Math.PI * (1 - i / 12); DOOR_PTS.push(onDrum(6.2 * Math.cos(t), -H + 11 + 6.2 * Math.sin(t))); }
    DOOR_PTS.push(onDrum(6.2, -H + 11), onDrum(6.2, -H));
    const DOOR_P = poly(DOOR_PTS), LAMP_AT = onDrum(0, -10.5);
    const POOL = K.scr(RD * 1.12 * Math.sin(AZ0), -H, RD * 1.12 * Math.cos(AZ0));
    const REST = { phi: 26 * RAD, th0: 50 * RAD, lamp: 0.72, tob: 54 * RAD };
    const geo = st => ({
      open: K.slit(st.phi, 5.2, st.th0, 98 * RAD),
      shut: K.slit(st.phi, 5.2, 0, st.th0),
      lip: path([K.on(st.phi, st.th0, -5.2), K.on(st.phi, st.th0, 5.2)]),
      obj: K.on(st.phi, st.tob),
    });
    DIRS.push({
      l: '3', name: 'Three-quarter, lamp', box: BOX, play: [92, 28],
      art(svg, u) {
        svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 3)}
            ${rg(`${u}dome`, DOME, 'cx="0.36" cy="0.26" r="0.85"')}
            <linearGradient id="${u}stone" gradientUnits="userSpaceOnUse" x1="32" y1="0" x2="96" y2="0">${stops(NIGHT)}</linearGradient>
            ${lg(`${u}steel`, STEEL, 'x1="0" y1="0" x2="1" y2="0.3"')}
            ${lg(`${u}door`, DOOR)}
            <radialGradient id="${u}pool" gradientUnits="userSpaceOnUse" cx="${f(LAMP_AT[0])}" cy="${f(LAMP_AT[1])}" r="24">${stops([[0, LAMP, 0.8], [0.5, LAMP, 0.28], [1, LAMP, 0]])}</radialGradient>
            <radialGradient id="${u}bounce" gradientUnits="userSpaceOnUse" cx="${f(LAMP_AT[0])}" cy="${f(LAMP_AT[1])}" r="30">${stops([[0, LAMP, 0.42], [1, LAMP, 0]])}</radialGradient>
            ${rg(`${u}lglow`, [[0, LAMP_HOT, 0.9], [0.35, LAMP, 0.45], [1, LAMP, 0]])}
            <linearGradient id="${u}in" gradientUnits="userSpaceOnUse" x1="0" y1="22" x2="0" y2="66">${stops(INSIDE)}</linearGradient>
            <clipPath id="${u}dc"><path d="${K.dome}"/></clipPath>
            <clipPath id="${u}oc"><path class="openc"/></clipPath></defs>
          ${shadow(u, 66, 96, 38, 6)}
          <ellipse class="lit" cx="${f(POOL[0])}" cy="${f(POOL[1] + 1)}" rx="13" ry="4" fill="${LAMP}" filter="url(#${u}b)"/>
          ${body(SIDE, u, 'stone')}
          <path class="lit" d="${SIDE}" fill="url(#${u}pool)"/>
          <path d="${DOOR_P}" fill="url(#${u}door)"/>
          <path d="${K.ring(R + 1, 0)}" fill="oklch(0.7 0.016 252)"/>
          ${body(SKIRT, u, 'steel')}
          ${body(K.dome, u, 'dome')}
          <path class="lit" d="${K.dome}" fill="url(#${u}bounce)"/>
          <g clip-path="url(#${u}dc)">
            <path class="open" fill="url(#${u}in)"/>
            <g clip-path="url(#${u}oc)" class="tob"><circle class="cell" r="5.4" fill="${CELL}"/><circle class="glass" r="3.6" fill="${DARK}"/></g>
            <path class="shut" fill="oklch(0.72 0.02 255)"/>
            <path class="lip" fill="none" stroke="oklch(0.46 0.025 262)" stroke-width="2.6" stroke-linecap="round"/>
          </g>
          <circle class="lit" cx="${f(LAMP_AT[0])}" cy="${f(LAMP_AT[1])}" r="9" fill="url(#${u}lglow)"/>
          <circle cx="${f(LAMP_AT[0])}" cy="${f(LAMP_AT[1])}" r="2.6" fill="${LAMP_HOT}"/>`;
        const q = s => svg.querySelector(s);
        const open = q('.open'), openc = q('.openc'), shut = q('.shut'), lip = q('.lip'), cell = q('.cell'), glass = q('.glass');
        const lit = svg.querySelectorAll('.lit'), tob = q('.tob');
        const ch = chase({ ...REST }, { phi: 0.05, th0: 0.08, lamp: 0.15, tob: 0.15 }, st => {
          const g = geo(st);
          open.setAttribute('d', g.open); openc.setAttribute('d', g.open);
          shut.setAttribute('d', g.shut); lip.setAttribute('d', g.lip);
          set(cell, { cx: g.obj[0], cy: g.obj[1] }); set(glass, { cx: g.obj[0], cy: g.obj[1] });
          lit.forEach(n => n.setAttribute('opacity', f(st.lamp)));
          // The tube shows once the shutter is well open.
          tob.setAttribute('opacity', f(clamp((34 * RAD - st.th0) / (20 * RAD))));
        });
        return glue({
          aim: p => ch.go({ phi: clamp((p[0] - 64) / 40, -1, 1) * 60 * RAD, tob: clamp(lerp(66, 26, (p[1] - 18) / 64), 26, 66) * RAD }),
          wake: () => ch.go({ th0: 4 * RAD, lamp: 1 }),
          rest: () => ch.go({ ...REST }),
          sweep: [[36, 40], [96, 28]],
        });
      },
      // The emblem: a white dome on a grey drum, half open.
      emblem() {
        const st = REST, g = geo(st);
        const s = 112 / Math.max(BOX[2], BOX[3]), ox = 64 - (BOX[0] + BOX[2] / 2) * s, oy = 64 - (BOX[1] + BOX[3] / 2) * s;
        const m = d => d.replace(/(-?[\d.]+) (-?[\d.]+)/g, (_, x, y) => `${f(+x * s + ox)} ${f(+y * s + oy)}`);
        const mp = p => [p[0] * s + ox, p[1] * s + oy];

          `<clipPath id="d"><path d="${domeM}"/></clipPath>`,

          `<circle cx="${f(lamp[0])}" cy="${f(lamp[1])}" r="4" fill="#fff"/>`,
          `<path d="${m(SKIRT)}" fill="#fff"/>`,
          `<path d="${domeM}" fill="#fff" stroke="#000" stroke-width="3"/>`,
          `<g clip-path="url(#d)"><path d="${m(g.open)}" fill="#000"/><path d="${m(g.shut)}" fill="#8c8c8c"/></g>`,
        ];
      },
    });
  }

  /* ================= 4: The dome looks back ================= */

  // A big dome on its ring.
  // At rest the slit is a sleepy eye.
  // On enter the slit opens; the objective follows the pointer.
  {
    const K = domeKit(64, 82, 46, 12 * RAD);
    const RB = 50, RD = 43;
    const RING_TOP = K.ring(RB, 0), RING = K.band(RB, 0, -6), DRUM = K.band(RD, -6, -15);
    const REST = { phi: 0, w: 4.6, th: 36 * RAD, ex: 0 };
    const W_OPEN = 13, RO = 9.2;
    const geo = st => {
      const c = K.on(st.phi, st.th, st.ex), squash = 1 - 0.3 * Math.min(1, Math.abs(st.ex) / 6);
      return { slit: K.slit(st.phi, st.w, 0, 98 * RAD), c, squash };
    };
    DIRS.push({
      l: '4', name: 'The dome looks back', box: [14, 35, 100, 75], play: [94, 34],
      art(svg, u) {
        svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}
            ${rg(`${u}dome`, DOME, 'cx="0.36" cy="0.26" r="0.85"')}
            ${lg(`${u}steel`, STEEL, 'x1="0" y1="0" x2="1" y2="0.3"')}
            ${lg(`${u}top`, [[0, 'oklch(0.78 0.014 250)'], [1, 'oklch(0.6 0.02 258)']], 'x1="0" y1="0" x2="1" y2="0"')}
            ${lg(`${u}stone`, STONE, 'x1="0" y1="0" x2="1" y2="0"')}
            ${rg(`${u}cell`, [[0, 'oklch(0.86 0.012 250)'], [1, 'oklch(0.5 0.022 260)']], 'cx="0.35" cy="0.3" r="0.8"')}
            <linearGradient id="${u}in" gradientUnits="userSpaceOnUse" x1="0" y1="38" x2="0" y2="92">${stops(INSIDE)}</linearGradient>
            <clipPath id="${u}sc"><path class="slitc"/></clipPath>
            <clipPath id="${u}dc"><path d="${K.dome}"/></clipPath></defs>
          ${shadow(u, 64, 104, 50, 6)}
          ${body(DRUM, u, 'stone')}
          <path d="${RING_TOP}" fill="url(#${u}top)"/>
          ${body(RING, u, 'steel')}
          ${body(K.dome, u, 'dome')}
          <g clip-path="url(#${u}dc)"><path class="slit" fill="url(#${u}in)"/>
            <g clip-path="url(#${u}sc)"><g class="eye"><ellipse class="cell" fill="url(#${u}cell)"/><ellipse class="glass" fill="${DARK}"/><circle class="glint" r="2.2" fill="#fff" opacity="0.85"/></g></g></g>`;
        const q = s => svg.querySelector(s);
        const slit = q('.slit'), slitc = q('.slitc'), cell = q('.cell'), glass = q('.glass'), glint = q('.glint');
        const ch = chase({ ...REST }, { phi: 0.05, w: 0.12, th: 0.2, ex: 0.2 }, st => {

        });
        return glue({
          aim: p => {
            const k = clamp((p[0] - 64) / 52, -1, 1);
            ch.go({ phi: k * 38 * RAD, ex: k * (W_OPEN - RO + 1), th: clamp(lerp(74, 16, (p[1] - 26) / 70), 16, 74) * RAD });
          },
          wake: () => ch.go({ w: W_OPEN }),
          rest: () => ch.go({ ...REST }),
          sweep: [[30, 40], [100, 40]],
        });
      },
    });
  }

  /* ================= Page ================= */

  // Each icon's long side fills 110 of the 128 box.
  const fitIcon = (svg, box) => {
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
    svg.style.overflow = 'visible';
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  let uid = 0;
  // One live icon in a host.
  // A play tile goes back to its play pose.
  const mount = (host, D, play, doc = document) => {
    const svg = doc.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('aria-hidden', 'true');
    host.append(svg);
    const c = D.art(svg, `u${++uid}`);
    fitIcon(svg, D.box);
    if (play) c.enter(D.play);
    if (reduce) return c;
    host.addEventListener('pointerenter', e => c.enter(local(svg, e)));
    host.addEventListener('pointermove', e => c.move(local(svg, e)));
    host.addEventListener('pointerleave', () => (play ? c.move(D.play) : c.leave()));
    host.addEventListener('focus', () => c.enter(play ? D.play : null));
    host.addEventListener('blur', () => (play ? c.move(D.play) : c.leave()));
    return c;
  };
  const tile = (D, size, play, cap) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = `<div class="tile s${size}" tabindex="0" aria-label="Observatory ${D.l}, ${play ? 'play' : 'rest'}, ${size}"></div>${cap ? `<i>${cap}</i>` : ''}`;
    mount(cell.firstElementChild, D, play);
    return cell;
  };
  const label = D => `<div class="lab"><b>${D.l}</b><span>${D.name}</span></div>`;
  const sheet = document.getElementById('sheet'), x2 = document.getElementById('x2');
  for (const D of DIRS) {
    const row = document.createElement('div');
    row.className = 'r';
    row.id = `sheet-${D.l}`;
    row.innerHTML = label(D);
    row.append(tile(D, 128, false), tile(D, 128, true), tile(D, 64, false), tile(D, 64, true));
    sheet.append(row);
    const big = document.createElement('div');
    big.className = 'r';
    big.id = `x2-${D.l}`;
    big.innerHTML = label(D);
    big.append(tile(D, 256, false, 'Rest'), tile(D, 256, true, 'Play'));
    x2.append(big);
  }

  // Emblems ride in the page as markup; ?dump lists them for export.
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const LETTER = { 1: 'a', 2: 'b', 3: 'c' };
  window.EMBLEMS = {};
  for (const D of DIRS) if (D.emblem) window.EMBLEMS[`observatory2-${LETTER[D.l]}`] = `${EMB_HEAD}\n  ${D.emblem().join('\n  ')}\n</svg>\n`;
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }

  // The shelf mock: four live main-shelf tiles, the candidate in the middle.
  const REAL = ['prism', 'fidget', 'putty', 'fire'];
  const frame = document.getElementById('shelf'), pick = document.getElementById('pick'), cap = document.getElementById('shelfcap');
  let slot = null, live = null, current = null;
  const show = D => {
    current = D;
    cap.textContent = `${D.l} · ${D.name}`;
    for (const b of pick.children) b.setAttribute('aria-pressed', String(b.dataset.l === D.l));
    if (!slot) return;
    slot.replaceChildren();
    live = mount(slot, D, false, slot.ownerDocument);
    slot.lastElementChild.classList.add('art');
  };
  for (const D of DIRS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.l = D.l;
    b.textContent = D.l;
    b.addEventListener('click', () => show(D));
    pick.append(b);
  }
  show(DIRS[1]);
  const dress = () => {
    const doc = frame.contentDocument, main = doc?.querySelector('main');
    const lis = REAL.map(id => doc?.getElementById(id)?.closest('li'));
    if (!main || lis.some(li => !li)) return;
    const ul = doc.createElement('ul');
    ul.className = 'mockrow';
    ul.append(lis[0], lis[1]);
    const li = doc.createElement('li');
    li.innerHTML = '<a class="toy is-in" href="#" id="mock-obs"><span class="obj"></span><span class="name">Observatory</span></a>';
    ul.append(li, lis[2], lis[3]);
    main.prepend(ul);
    slot = li.querySelector('.obj');
    const css = doc.createElement('style');
    css.textContent = `
      html, body { background: oklch(0.16 0.012 275) !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important; min-height: 0 !important; }
      body > :not(.wrap):not(svg.defs):not(script):not(style):not(link) { display: none !important; }
      .wrap { display: block !important; margin: 0 !important; padding: 28px 0 0 !important; min-height: 0 !important; max-width: none !important; }
      .wrap > :not(main) { display: none !important; }
      main { display: block !important; margin: 0 !important; padding: 0 !important; }
      main > :not(.mockrow) { display: none !important; }
      .mockrow { display: grid !important; grid-template-columns: repeat(5, 150px); gap: 28px; justify-content: center; margin: 0; padding: 0; list-style: none; visibility: visible !important; }
      .mockrow li { display: block !important; }
      .mockrow .toy { opacity: 1 !important; filter: none !important; transform: none !important; transition: none !important; }
      .mockrow .toy .obj::after, .mockrow .toy .obj .series { display: none !important; }`;
    doc.head.append(css);
    // A click on a mock tile stays on this page.
    doc.addEventListener('click', e => { if (e.target.closest?.('a')) e.preventDefault(); }, true);
    show(current);
  };
  frame.addEventListener('load', () => setTimeout(dress, 1200), { once: true });
})();
</script>
</body>
</html>
