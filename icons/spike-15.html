<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 15</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- The stencil tile: bright foil at the top left, dull at the foot. -->
    <linearGradient id="fo-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.9 0.008 250)"/>
      <stop offset="0.55" style="stop-color: oklch(0.66 0.01 250)"/>
      <stop offset="1" style="stop-color: oklch(0.5 0.012 250)"/>
    </linearGradient>
    <!-- The glint: a warm strip of light, soft at both edges. -->
    <linearGradient id="fo-glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" style="stop-color: oklch(0.99 0.02 85)" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

<h1>Icon spike 15</h1>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const line = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L');
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };
  // A seeded random stream keeps every sheet the same on each load.
  const rng = a => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  // A crumpled sheet: a jittered grid, cut into tilted triangle facets.
  // The edge points pull inward, so the outline reads as scrunched.
  function sheet(seed, N, map, jit, pull) {
    const R = rng(seed), P = [];
    for (let i = 0; i <= N; i++) {
      P.push([]);
      for (let j = 0; j <= N; j++) {
        const edge = i === 0 || j === 0 || i === N || j === N;
        let u = j / N, v = i / N;
        if (!edge) { u += (R() - 0.5) * jit; v += (R() - 0.5) * jit; }
        else {
          if (i === 0) v += R() * pull; if (i === N) v -= R() * pull;
          if (j === 0) u += R() * pull; if (j === N) u -= R() * pull;
          if (i === 0 || i === N) u += (R() - 0.5) * pull * 0.6 * (j > 0 && j < N);
          if (j === 0 || j === N) v += (R() - 0.5) * pull * 0.6 * (i > 0 && i < N);
        }
        P[i].push(map(u, v));
      }
    }
    const tris = [];
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      const a = P[i][j], b = P[i][j + 1], c = P[i + 1][j], d = P[i + 1][j + 1];
      const pair = R() < 0.5 ? [[a, b, d], [a, d, c]] : [[a, b, c], [b, d, c]];
      for (const t of pair) { const r = Math.sqrt(R()) * 0.9, th = R() * TAU; tris.push({ p: t, n: [r * Math.cos(th), r * Math.sin(th)] }); }
    }
    const outline = [...P[0], ...P.slice(1).map(r => r[N]), ...P[N].slice(0, N).reverse(), ...P.slice(1, N).map(r => r[0]).reverse()];
    // Inner edges are the creases; the outline is not one of them.
    const seen = new Map();
    for (const t of tris) for (let k = 0; k < 3; k++) {
      const p = t.p[k], q = t.p[(k + 1) % 3], key = [p, q].map(x => x.join()).sort().join('|');
      seen.set(key, (seen.get(key) || { p, q, n: 0 })); seen.get(key).n++;
    }
    const creases = [...seen.values()].filter(e => e.n === 2).map(e => [e.p, e.q]);
    return { P, tris, outline, creases };
  }
  // Facet brightness: a dull base plus a mirror flash when it faces the light.
  const shade = (n, phi, w = 0.08) => {
    const l = [Math.cos(phi) * 0.55, Math.sin(phi) * 0.55];
    const spec = Math.exp(-((n[0] - l[0]) ** 2 + (n[1] - l[1]) ** 2) / w);
    const dif = 0.5 - 0.22 * (n[0] * 0.6 + n[1] * 0.8);
    return { b: clamp(0.18 + 0.32 * dif + 0.62 * spec, 0, 1), spec };
  };
  const foilFill = s => `oklch(${f(0.24 + 0.74 * s.b)} ${f(0.004 + 0.035 * s.spec)} ${s.spec > 0.4 ? 85 : 250})`;
  // The light turns once round while hovered, then settles at rest.
  const sweep = (st, rest, dur, draw) => hoverLoop(
    () => gsap.fromTo(st, { phi: rest }, { phi: rest + TAU, duration: dur, ease: 'none', repeat: -1, onUpdate: draw }),
    () => gsap.to(st, { phi: rest + TAU * Math.round((st.phi - rest) / TAU), duration: 0.5, ease: 'power2.out', onUpdate: draw, overwrite: true }));
  const REST = -2.2;

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover: direction A, the light turning.
  {
    const S = sheet(107, 5, (u, v) => [16 + 92 * u, 16 + 92 * v], 0.12, 0.08);
    const SH = S.outline.map(([x, y]) => [x + 7, y + 7]);
    DIRS.push({
      toy: 'foil', l: 'Current', name: 'Menu icon', emblemUrl: '../shared/emblems/foil.svg',
      box: [16, 16, 99, 99],
      art(svg) {
        svg.innerHTML = `
          <path d="${poly(SH)}" fill="oklch(0.07 0.01 260)"/>
          <g class="f" stroke="oklch(0.22 0.006 250)" stroke-width="0.5" stroke-linejoin="round">${S.tris.map(t => `<path d="${poly(t.p)}"/>`).join('')}</g>
          <path d="${poly(S.outline)}" fill="none" stroke="url(#rim)" stroke-width="1.4" stroke-linejoin="round"/>`;
        const paths = [...svg.querySelectorAll('.f path')];
        const st = { phi: REST };
        const draw = () => paths.forEach((p, k) => p.setAttribute('fill', foilFill(shade(S.tris[k].n, st.phi))));
        draw();
        return sweep(st, REST, 2.6, draw);
      },
    });
  }

  /* ================= A · Shaded object ================= */

  // A scrunched sheet on its hard shadow; each facet flashes as the light turns.
  {
    const S = sheet(107, 5, (u, v) => [16 + 92 * u, 16 + 92 * v], 0.12, 0.08);
    const SH = S.outline.map(([x, y]) => [x + 7, y + 7]);
    DIRS.push({
      toy: 'foil', l: 'A', name: 'Shaded object',
      box: [16, 16, 99, 99],
      art(svg) {
        svg.innerHTML = `
          <path d="${poly(SH)}" fill="oklch(0.07 0.01 260)"/>
          <g class="f" stroke="oklch(0.22 0.006 250)" stroke-width="0.5" stroke-linejoin="round">${S.tris.map(t => `<path d="${poly(t.p)}"/>`).join('')}</g>
          <path d="${poly(S.outline)}" fill="none" stroke="url(#rim)" stroke-width="1.4" stroke-linejoin="round"/>`;
        const paths = [...svg.querySelectorAll('.f path')];
        const st = { phi: REST };
        const draw = () => paths.forEach((p, k) => p.setAttribute('fill', foilFill(shade(S.tris[k].n, st.phi))));
        draw();
        return sweep(st, REST, 2.6, draw);
      },
      // The emblem: lit facets in white, dark facets cut away, on the shadow.
      emblem: emb(`
        <path d="${poly(SH)}" fill="#fff" fill-opacity="0.35"/>
        <path d="${poly(S.outline)}" fill="#000"/>
        <g fill="#fff">
        ${S.tris.filter(t => shade(t.n, REST).b > 0.36).map(t => `<path d="${poly(t.p)}"/>`).join('\n')}
        </g>
        <path d="${poly(S.outline)}" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      `),
    });
  }

  /* ================= B · Stencil cut-out ================= */

  // A bright foil tile with its crease network cut through; vertices stay as bridges.
  {
    const S = sheet(23, 4, (u, v) => [14 + 100 * u, 14 + 100 * v], 0.2, 0);
    const cut = ([p, q], gap) => {
      const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy), k = Math.min(0.45, gap / L);
      return `M${f(p[0] + dx * k)} ${f(p[1] + dy * k)}L${f(q[0] - dx * k)} ${f(q[1] - dy * k)}`;
    };
    DIRS.push({
      toy: 'foil', l: 'B', name: 'Stencil cut-out',
      box: [14, 14, 100, 100],
      art(svg, id) {
        svg.innerHTML = `
          <defs><clipPath id="${id}c"><rect x="14" y="14" width="100" height="100" rx="14"/></clipPath></defs>
          <rect x="14" y="14" width="100" height="100" rx="14" fill="url(#fo-tile)"/>
          <g clip-path="url(#${id}c)"><rect class="gl" x="40" y="-30" width="22" height="190" fill="url(#fo-glint)" transform="rotate(30 64 64)" opacity="0"/></g>
          <g fill="none" style="stroke: var(--bg)" stroke-width="3.4" stroke-linecap="round">${S.creases.map(e => `<path d="${cut(e, 4)}"/>`).join('')}</g>
          <rect x="14" y="14" width="100" height="100" rx="14" fill="none" stroke="url(#rim)" stroke-width="1.6"/>`;
        const gl = svg.querySelector('.gl');
        return hoverLoop(
          () => gsap.timeline({ repeat: -1, repeatDelay: 0.2 }).set(gl, { opacity: 1 }).fromTo(gl, { x: -90 }, { x: 90, duration: 1.1, ease: 'sine.inOut' }),
          () => gsap.to(gl, { opacity: 0, duration: 0.25, overwrite: true }));
      },
      emblem: emb(`
        <mask id="m">
        <rect x="14" y="14" width="100" height="100" rx="14" fill="#fff"/>
        <g fill="none" stroke="#000" stroke-width="4.6" stroke-linecap="round">
        ${S.creases.map(e => `<path d="${cut(e, 5)}"/>`).join('\n')}
        </g>
        </mask>
        <rect x="14" y="14" width="100" height="100" rx="14" fill="#fff" mask="url(#m)"/>
      `),
    });
  }

  /* ================= C · Single-weight line ================= */

  // One stroke weight: a scrunched outline and its creases; hover crinkles it.
  {
    const S = sheet(61, 3, (u, v) => [18 + 92 * u, 18 + 92 * v], 0.22, 0.1);
    const INK = 'oklch(0.9 0.01 250)';
    const R = rng(9);
    // Each point gets one fixed kick; hover blends it in and out.
    const KICK = new Map();
    S.P.flat().forEach(p => KICK.set(p, [(R() - 0.5) * 9, (R() - 0.5) * 9]));
    DIRS.push({
      toy: 'foil', l: 'C', name: 'Single-weight line',
      box: [18, 18, 92, 92],
      art(svg) {
        svg.innerHTML = `
          <g fill="none" stroke="${INK}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <path class="o"/>${S.creases.map(() => '<path class="c"/>').join('')}
          </g>`;
        const o = svg.querySelector('.o'), cs = [...svg.querySelectorAll('.c')];
        const st = { k: 0 };
        const at = p => { const d = KICK.get(p); return [p[0] + d[0] * st.k, p[1] + d[1] * st.k]; };
        const draw = () => { o.setAttribute('d', poly(S.outline.map(at))); cs.forEach((c, i) => c.setAttribute('d', line(S.creases[i].map(at)))); };
        draw();
        return hoverLoop(
          () => gsap.to(st, { k: 1, duration: 0.45, ease: 'back.out(3)', yoyo: true, repeat: -1, repeatDelay: 0.15, onUpdate: draw }),
          () => gsap.to(st, { k: 0, duration: 0.4, ease: 'power2.out', onUpdate: draw, overwrite: true }));
      },
      emblem: emb(`
        <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="${poly(S.outline)}"/>
        ${S.creases.map(e => `<path d="${line(e)}"/>`).join('\n')}
        </g>
      `),
    });
  }

  /* ================= D · Isometric block ================= */

  // A slab: crumpled foil laid on its top face; the light turns across the facets.
  {
    const T = [64, 22], UR = [110, 48.6], C0 = [64, 75.2], UL = [18, 48.6];
    const LL = [18, 62.6], BB = [64, 89.2], LR = [110, 62.6];
    const iso = (u, v) => [T[0] + (UR[0] - T[0]) * u + (UL[0] - T[0]) * v, T[1] + (UR[1] - T[1]) * u + (UL[1] - T[1]) * v];
    const S = sheet(5, 4, iso, 0.2, 0);
    DIRS.push({
      toy: 'foil', l: 'D', name: 'Isometric block',
      box: [18, 22, 92, 68],
      art(svg) {
        svg.innerHTML = `
          <path d="${poly([UL, C0, BB, LL])}" fill="oklch(0.42 0.01 250)"/>
          <path d="${poly([C0, UR, LR, BB])}" fill="oklch(0.2 0.01 255)"/>
          <g class="f" stroke="oklch(0.22 0.006 250)" stroke-width="0.5" stroke-linejoin="round">${S.tris.map(t => `<path d="${poly(t.p)}"/>`).join('')}</g>
          <path d="${poly([T, UR, C0, UL])}" fill="none" stroke="url(#rim)" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M${C0[0]} ${C0[1]}V${BB[1]}" stroke="oklch(0.9 0.01 250 / 0.35)" stroke-width="1.2"/>`;
        const paths = [...svg.querySelectorAll('.f path')];
        const st = { phi: REST };
        const draw = () => paths.forEach((p, k) => p.setAttribute('fill', foilFill(shade(S.tris[k].n, st.phi))));
        draw();
        return sweep(st, REST, 2.6, draw);
      },
      emblem: emb(`
        <path d="${poly([T, UR, LR, BB, LL, UL])}" fill="#fff"/>
        <path d="${poly([T, UR, C0, UL])}" fill="#000"/>
        <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
        ${S.creases.map(e => `<path d="${line(e)}"/>`).join('\n')}
        </g>
        <path d="M${C0[0]} ${C0[1]}V${BB[1]}" stroke="#000" stroke-width="3"/>
      `),
    });
  }

  /* ================= E · Abstract mark ================= */

  // Three heavy zigzags: hover scrunches them tight, then lets them out.
  {
    const ROWS = [[36, 0], [64, 1], [92, 0]], N = 6, W0 = 84, A0 = 6;
    const SEG = Math.hypot(W0 / (2 * N), A0);
    const zig = (y, ph, k) => {
      const w = W0 * (1 - 0.38 * k), h = Math.sqrt(Math.max(0, SEG * SEG - (w / (2 * N)) ** 2)), x0 = 64 - w / 2;
      const pts = [];
      for (let i = 0; i <= 2 * N; i++) pts.push([x0 + (w * i) / (2 * N), y + ((i + (ph ? 1 : 0)) % 2 ? h : -h)]);
      return line(pts);
    };
    const COL = ['oklch(0.9 0.01 250)', 'oklch(0.97 0.03 85)', 'oklch(0.72 0.012 250)'];
    DIRS.push({
      toy: 'foil', l: 'E', name: 'Abstract mark',
      box: [18, 26, 92, 76],
      art(svg) {
        svg.innerHTML = `<g fill="none" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">${ROWS.map((_, i) => `<path stroke="${COL[i]}"/>`).join('')}</g>`;
        const paths = [...svg.querySelectorAll('path')];
        const st = { k: 0 };
        const draw = () => paths.forEach((p, i) => p.setAttribute('d', zig(ROWS[i][0], ROWS[i][1], st.k)));
        draw();
        return hoverLoop(
          () => gsap.to(st, { k: 1, duration: 0.5, ease: 'power3.inOut', yoyo: true, repeat: -1, repeatDelay: 0.25, onUpdate: draw }),
          () => gsap.to(st, { k: 0, duration: 0.4, ease: 'power2.out', onUpdate: draw, overwrite: true }));
      },
      emblem: emb(`
        <g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        ${ROWS.map(([y, ph]) => `<path d="${zig(y, ph, 0)}"/>`).join('\n')}
        </g>
      `),
    });
  }

  /* ================= Gallery ================= */

  const NAMES = { foil: 'Crinkle foil' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || (D.emblem ? `spike/emblems/${file}.svg` : '');
      if (D.emblem) window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
