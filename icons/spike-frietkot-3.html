<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Frietkot 3</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; max-width: 70ch; }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.icons { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t256, .t256 svg { width: 256px; height: 256px; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
@media (max-width: 420px) { .t256, .t256 svg { width: 220px; height: 220px; } }
</style>
</head>
<body>
<h1>Icon spike: Frietkot 3</h1>
<p class="lede">Round 3: four takes on the cone (round 2 A). Each shows at 256, 128 and 64. Move the pointer over a tile and around it; focus a tile with the keyboard for a demo.</p>
<div class="row" id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  gsap.ticker.fps(60);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +(+n).toFixed(2);
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const set = (e, a) => { for (const k in a) e.setAttribute(k, typeof a[k] === 'number' ? f(a[k]) : a[k]); };
  const grad = (defs, type, id, attrs, stops) => {
    const g = el(type, { id, ...attrs }, defs);
    stops.forEach(([o, c, a = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g));
    return g;
  };
  const blurF = (defs, id, sd, merge = true) => {
    const g = el('filter', { id, x: -0.5, y: -0.5, width: 2, height: 2 }, defs);
    el('feGaussianBlur', { stdDeviation: sd, result: 'b' }, g);
    if (merge) { const m = el('feMerge', {}, g); el('feMergeNode', { in: 'b' }, m); el('feMergeNode', { in: 'SourceGraphic' }, m); }
    return g;
  };
  // A seeded random: every tile draws the same object.
  const rng = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
  const pts = P => P.map(p => `${f(p[0])} ${f(p[1])}`).join('L');
  // A control: aim from the pointer, a demo on focus, a rest on leave.
  const ctl = ({ aim, rest, demo, enter = () => {}, leave = () => {} }) => {
    let tl = null;
    return {
      enter(p) { enter(); if (p) aim(p); else tl = demo(); },
      move(p) { if (p && !tl) aim(p); },
      leave() { tl?.kill(); tl = null; leave(); rest(); },
    };
  };
  const INK = 'oklch(0.06 0.012 262)', SHADOW = 'oklch(0.07 0.01 260)';

  const DIRS = [];

  /* ================= Cones ================= */

  // One cone builder, four takes. A paper cone of fries as a 3D object:
  // seeded fries stand on the rim plane, each a lit golden stick; the paper
  // wraps them. The pointer turns the cone and tips it toward you.
  const SAUCES = [
    ['Mayonnaise', 'oklch(0.97 0.04 95)'], ['Andalouse', 'oklch(0.74 0.15 50)'],
    ['Samurai', 'oklch(0.66 0.18 38)'], ['Stoofvlees', 'oklch(0.36 0.07 45)'],
    ['Curry', 'oklch(0.52 0.18 28)'], ['Tartaar', 'oklch(0.9 0.05 120)'],
  ];
  const cone = (o) => (svg, id) => {
    const C = [64, 52], R = 23, APEX = [64, 112];
    const r = rng(o.seed ?? 77);
    const FRIES = Array.from({ length: 26 }, () => {
      const a = r() * TAU, rr = Math.sqrt(r()) * (R - 4);
      return { a, rr, h: 20 + r() * 20, w: 3.6 + r() * 1.2, lean: (r() - 0.5) * 0.35, tw: (r() - 0.5) * 0.5 };
    });
    const REST = { yaw: 0.4, tilt: 0.34, pop: 1, steam: 0, salt: 0, dx: 0, dy: 0, rot: 0, flip: 0, squirt: 0, blob: 1, drip: o.drip ? 1 : 0 };
    const defs = el('defs', {}, svg);
    grad(defs, 'linearGradient', `${id}fry`, { x1: 0, y1: 0, x2: 0, y2: 1 }, [[0, 'oklch(0.62 0.13 60)'], [0.18, 'oklch(0.86 0.15 85)'], [1, 'oklch(0.9 0.12 92)']]);
    grad(defs, 'linearGradient', `${id}fryS`, { x1: 0, y1: 0, x2: 1, y2: 0 }, [[0, '#000', 0], [0.6, '#000', 0], [1, '#000', 0.35]]);
    const paperStops = o.paper === 'kraft'
      ? [[0, 'oklch(0.72 0.07 70)'], [0.55, 'oklch(0.64 0.07 65)'], [1, 'oklch(0.42 0.06 55)']]
      : [[0, 'oklch(0.97 0.02 90)'], [0.55, 'oklch(0.9 0.025 85)'], [1, 'oklch(0.62 0.03 70)']];
    grad(defs, 'linearGradient', `${id}paper`, { x1: 0, y1: 0, x2: 1, y2: 0 }, paperStops);
    grad(defs, 'linearGradient', `${id}shade`, { x1: 0, y1: 0, x2: 1, y2: 0 }, [[0, '#fff', 0.18], [0.45, '#000', 0], [1, '#000', 0.4]]);
    grad(defs, 'radialGradient', `${id}halo`, { cx: 64, cy: 50, r: 46, gradientUnits: 'userSpaceOnUse' }, [[0, 'oklch(0.78 0.14 70)', 0.45], [1, 'oklch(0.4 0.1 40)', 0]]);
    blurF(defs, `${id}soft`, 1.4, false);
    const ck = el('pattern', { id: `${id}check`, width: 7, height: 7, patternUnits: 'userSpaceOnUse' }, defs);
    el('rect', { width: 3.5, height: 3.5, fill: 'oklch(0.5 0.14 255)', opacity: 0.85 }, ck);
    el('rect', { x: 3.5, y: 3.5, width: 3.5, height: 3.5, fill: 'oklch(0.5 0.14 255)', opacity: 0.85 }, ck);
    const clip = el('clipPath', { id: `${id}cc` }, defs);
    const clipPath = el('path', {}, clip);
    const halo = el('circle', { cx: 64, cy: 50, r: 46, fill: `url(#${id}halo)` }, svg);
    const all = el('g', {}, svg);
    const shadow = el('path', { fill: SHADOW }, all);
    const back = el('path', { fill: o.paper === 'kraft' ? 'oklch(0.4 0.05 55)' : 'oklch(0.55 0.03 70)' }, all);
    const fryG = el('g', {}, all);
    const fries = FRIES.map(() => { const g = el('g', {}, fryG); return [el('path', { fill: `url(#${id}fry)` }, g), el('path', { fill: `url(#${id}fryS)` }, g), el('path', { fill: 'none', stroke: 'oklch(0.97 0.08 95)', 'stroke-width': 0.5, opacity: 0.6 }, g)]; });
    const flyer = el('path', { fill: `url(#${id}fry)`, opacity: 0 }, all);
    const fork = el('path', { fill: 'oklch(0.72 0.08 70)', stroke: 'oklch(0.45 0.06 60)', 'stroke-width': 0.4 }, all);
    const stream = el('path', { fill: 'none', 'stroke-width': 2.4, 'stroke-linecap': 'round', opacity: 0 }, all);
    const sauce = el('path', {}, all);
    const sauceHi = el('path', { fill: 'none', stroke: '#fff', 'stroke-width': 1, 'stroke-linecap': 'round', opacity: 0.8 }, all);
    const paper = el('path', { fill: `url(#${id}paper)` }, all);
    const print = el('g', { 'clip-path': `url(#${id}cc)` }, all);
    const stripes = o.paper === 'stripe' ? Array.from({ length: 5 }, () => el('path', { fill: 'oklch(0.55 0.2 27)', opacity: 0.9 }, print)) : [];
    const check = o.paper === 'check' ? el('rect', { x: 20, y: 40, width: 100, height: 80, fill: `url(#${id}check)` }, print) : null;
    const stamp = o.paper === 'kraft' ? el('g', {}, print) : null;
    if (stamp) { el('circle', { r: 7, fill: 'none', stroke: 'oklch(0.5 0.18 27)', 'stroke-width': 1.4 }, stamp); el('path', { d: 'M-3 3L0-4L3 3Z', fill: 'oklch(0.5 0.18 27)' }, stamp); }
    el('path', {}, print);
    const shade = el('path', { fill: `url(#${id}shade)` }, all);
    const drip = el('path', {}, all);
    const seam = el('path', { fill: 'none', stroke: 'oklch(0.5 0.03 70)', 'stroke-width': 0.6 }, all);
    const lip = el('path', { fill: 'none', stroke: o.paper === 'kraft' ? 'oklch(0.8 0.06 75)' : 'oklch(0.99 0.01 90)', 'stroke-width': 1.2 }, all);
    // A hand from below: four fingers wrap the cone, the thumb on the near side.
    const hand = o.hand ? el('g', { fill: INK }, all) : null;
    if (hand) {
      // Palm and wrist below the grip; fingers as separate pads with a hairline between.
      el('path', { d: 'M54 92C52 100 54 110 56 120H74C76 110 78 100 76 92Z' }, hand);
      [0, 1, 2, 3].forEach(i => el('rect', { x: 51 + i * 6.2, y: 80 + Math.abs(i - 1.5) * 1.8, width: 5.6, height: 13, rx: 2.8, stroke: 'oklch(0.22 0.02 262)', 'stroke-width': 0.6 }, hand));
      el('path', { d: 'M50 94C45 90 45 82 50 80C52 79 54 80 55 82L56 92Z', stroke: 'oklch(0.22 0.02 262)', 'stroke-width': 0.6 }, hand);
    }
    const steam = [0, 1, 2].map(() => el('path', { fill: 'none', stroke: 'oklch(0.97 0.01 260)', 'stroke-width': 3.4, 'stroke-linecap': 'round', opacity: 0, filter: `url(#${id}soft)` }, svg));
    const salt = Array.from({ length: 14 }, () => el('rect', { width: 0.9, height: 0.9, fill: '#fff', opacity: 0 }, svg));
    const st = { ...REST, sc: 0 };
    const paint = () => {
      all.setAttribute('transform', `translate(${f(st.dx)} ${f(st.dy)}) rotate(${f(st.rot)} 64 100)`);
      const ry = R * st.tilt;
      const L = [C[0] - R, C[1]], Rt = [C[0] + R, C[1]];
      const front = Array.from({ length: 17 }, (_, i) => [C[0] - R * Math.cos(i / 16 * Math.PI), C[1] + ry * Math.sin(i / 16 * Math.PI)]);
      const backArc = Array.from({ length: 17 }, (_, i) => [C[0] + R * Math.cos(i / 16 * Math.PI), C[1] - ry * Math.sin(i / 16 * Math.PI)]);
      const body = `M${pts([L, APEX, Rt])}L${pts(front.slice().reverse())}Z`;
      paper.setAttribute('d', body); clipPath.setAttribute('d', body); shade.setAttribute('d', body);
      shadow.setAttribute('d', `M${pts([[L[0] + 6, L[1] + 6], [APEX[0] + 6, APEX[1] + 6], [Rt[0] + 6, Rt[1] + 6]])}Z`);
      back.setAttribute('d', `M${pts([...front, ...backArc])}Z`);
      lip.setAttribute('d', `M${pts(front)}`);
      // The print slides round with the yaw, so the paper reads as round.
      stripes.forEach((s, i) => {
        const u = ((i / stripes.length + st.yaw / TAU) % 1 + 1) % 1, x = C[0] - R + u * 2 * R;
        s.setAttribute('d', `M${pts([[x - 1.4, C[1] - 2], [x + 1.4, C[1] - 2], [APEX[0] + (x - C[0]) * 0.2 + 0.6, APEX[1]], [APEX[0] + (x - C[0]) * 0.2 - 0.6, APEX[1]]])}Z`);
      });
      if (check) check.setAttribute('transform', `translate(${f(((st.yaw * 14) % 7) - 7)} 0) skewX(-12)`);
      if (stamp) { const u = Math.sin(st.yaw - 0.4); stamp.setAttribute('transform', `translate(${f(64 + u * 11)} 72) scale(${f(Math.max(0.05, Math.cos(st.yaw - 0.4)))} 1)`); stamp.setAttribute('opacity', f(Math.cos(st.yaw - 0.4) > 0 ? 1 : 0)); }
      seam.setAttribute('d', `M${f(C[0] + Math.sin(st.yaw * 1.3) * R * 0.6)} ${f(C[1] + ry * 0.9)}L${APEX[0]} ${APEX[1]}`);
      const order = FRIES.map((q, i) => ({ q, i, z: Math.sin(q.a + st.yaw) })).sort((a, b) => a.z - b.z);
      order.forEach(({ q, i, z }) => {
        const bx = C[0] + Math.cos(q.a + st.yaw) * q.rr, by = C[1] + Math.sin(q.a + st.yaw) * q.rr * st.tilt;
        const h = q.h * st.pop, tx = bx + q.lean * h, ty = by - h, w = q.w * (0.85 + 0.15 * (z + 1) / 2), tw = q.tw * w * 0.4;
        const d = `M${pts([[bx - w / 2, by + 3], [tx - w / 2 + tw, ty + 0.6], [tx + w / 2 + tw, ty], [bx + w / 2, by + 3]])}Z`;
        fryG.appendChild(fries[i][0].parentNode);
        fries[i][0].setAttribute('d', d); fries[i][1].setAttribute('d', d);
        fries[i][2].setAttribute('d', `M${f(bx - w / 2 + 0.8)} ${f(by)}L${f(tx - w / 2 + tw + 0.8)} ${f(ty + 1.2)}`);
        fries[i][0].parentNode.setAttribute('opacity', f(0.72 + 0.28 * (z + 1) / 2));
      });
      // One fry flips out of the cone and drops back in.
      if (st.flip > 0 && st.flip < 1) {
        const u = st.flip, x = C[0] + 4 + u * 18, y = C[1] - 30 - Math.sin(u * Math.PI) * 26, a = u * 540;
        flyer.setAttribute('d', `M${f(x - 2)} ${f(y - 11)}h4v22h-4Z`);
        flyer.setAttribute('transform', `rotate(${f(a)} ${f(x)} ${f(y)})`);
        flyer.setAttribute('opacity', 1);
      } else flyer.setAttribute('opacity', 0);
      const fx = C[0] + Math.cos(0.4 + st.yaw) * 10, fy = C[1] + Math.sin(0.4 + st.yaw) * 10 * st.tilt - 14 * st.pop;
      fork.setAttribute('d', `M${f(fx)} ${f(fy + 22)}L${f(fx + 7)} ${f(fy - 10)}L${f(fx + 8.6)} ${f(fy - 10)}L${f(fx + 6.4)} ${f(fy - 15)}L${f(fx + 5.2)} ${f(fy - 10.4)}L${f(fx + 3.8)} ${f(fy - 15.6)}L${f(fx + 3.2)} ${f(fy - 10.6)}L${f(fx + 1.6)} ${f(fy + 22)}Z`);
      // The sauce: a blob on the fries, in the current sauce's colour.
      const col = SAUCES[st.sc % SAUCES.length][1];
      const mx = C[0] - 7 + Math.sin(st.yaw) * 4, my = C[1] - 10 * st.pop + 2, b = st.blob;
      sauce.setAttribute('fill', col);
      sauce.setAttribute('d', `M${f(mx - 9 * b)} ${f(my + 3)}C${f(mx - 11 * b)} ${f(my - 4 * b)} ${f(mx - 3 * b)} ${f(my - 8 * b)} ${f(mx)} ${f(my - 5 * b)}C${f(mx + 4 * b)} ${f(my - 10 * b)} ${f(mx + 11 * b)} ${f(my - 3 * b)} ${f(mx + 8 * b)} ${f(my + 3)}C${f(mx + 4 * b)} ${f(my + 6)} ${f(mx - 5 * b)} ${f(my + 6)} ${f(mx - 9 * b)} ${f(my + 3)}Z`);
      sauceHi.setAttribute('d', `M${f(mx - 5 * b)} ${f(my - 2 * b)}Q${f(mx - 2 * b)} ${f(my - 6 * b)} ${f(mx + 2 * b)} ${f(my - 4 * b)}`);
      sauceHi.setAttribute('opacity', f(b > 0.3 ? 0.8 : 0));
      // The squirt: a stream from the top of the frame onto the blob.
      stream.setAttribute('stroke', col);
      stream.setAttribute('d', `M${f(mx + 2)} 2Q${f(mx + 6)} ${f(my - 30)} ${f(mx)} ${f(my - 4)}`);
      stream.setAttribute('opacity', f(st.squirt));
      // A drip of the sauce runs down the paper over the lip.
      drip.setAttribute('fill', col);
      const dl = 14 * st.drip, dx0 = C[0] - 14;
      drip.setAttribute('d', st.drip > 0.02 ? `M${f(dx0 - 3)} ${f(C[1] + ry * 0.75)}C${f(dx0 - 3)} ${f(C[1] + ry + dl * 0.6)} ${f(dx0 - 1.6)} ${f(C[1] + ry + dl)} ${f(dx0)} ${f(C[1] + ry + dl)}C${f(dx0 + 1.6)} ${f(C[1] + ry + dl)} ${f(dx0 + 2)} ${f(C[1] + ry + dl * 0.5)} ${f(dx0 + 3)} ${f(C[1] + ry * 0.8)}Z` : '');
      steam.forEach((s, i) => {
        const t = st.steam + i * 0.33, u = t % 1, x0 = C[0] - 10 + i * 10 + st.dx, y0 = C[1] - 30 - u * 26 + st.dy;
        s.setAttribute('d', `M${pts(Array.from({ length: 6 }, (_, k) => [x0 + Math.sin(k * 1.3 + t * 7 + i) * (2 + k), y0 - k * 4]))}`);
        s.setAttribute('opacity', f(st.steam > 0 ? Math.sin(u * Math.PI) * 0.45 : 0));
      });
      salt.forEach((g, i) => {
        const u = (st.salt + i / salt.length) % 1;
        set(g, { x: C[0] - 16 + ((i * 37) % 32) + st.dx, y: C[1] - 46 + u * 40, opacity: st.salt > 0 ? (1 - u) * 0.9 : 0 });
      });
    };
    paint();
    let loop = null;
    const aim = p => {
      const to = { yaw: clamp((p[0] - 64) / 50, -1, 1) * 1.4 + 0.4, tilt: clamp(0.34 + (64 - p[1]) / 220, 0.18, 0.52) };
      // Held in a hand, the cone also follows the pointer a little and leans into the move.
      if (o.hand) Object.assign(to, { dx: clamp((p[0] - 64) * 0.18, -10, 10), dy: clamp((p[1] - 64) * 0.12, -6, 6), rot: clamp((p[0] - 64) * 0.12, -8, 8) });
      gsap.to(st, { ...to, duration: 0.5, ease: 'power2.out', overwrite: 'auto', onUpdate: paint });
    };
    return ctl({
      aim,
      enter() {
        const tl = gsap.timeline({ onUpdate: paint });
        tl.to(st, { pop: 0.55, duration: 0.14, ease: 'power2.in' }).to(st, { pop: 1, duration: 0.5, ease: 'back.out(3)' });
        if (o.hand) tl.fromTo(st, { flip: 0 }, { flip: 1, duration: 0.9, ease: 'power1.inOut' }, 0.1);
        if (o.squirt) {
          // The next sauce: the old blob shrinks, a stream squirts in, the new blob swells.
          tl.to(st, { blob: 0, duration: 0.15 }, 0).add(() => { st.sc++; }, 0.15)
            .to(st, { squirt: 1, duration: 0.08 }, 0.18).to(st, { blob: 1.15, duration: 0.45, ease: 'power2.out' }, 0.22)
            .to(st, { squirt: 0, duration: 0.12 }, 0.6).to(st, { blob: 1, duration: 0.2 }, 0.67);
        }
        if (o.drip) tl.fromTo(st, { drip: 0.4 }, { drip: 1.4, duration: 1.4, ease: 'power1.in' }, 0.2);
        if (!loop) loop = gsap.to(st, { steam: '+=1', salt: '+=1', duration: 2.4, repeat: -1, ease: 'none', onUpdate: paint });
      },
      leave() { loop?.kill(); loop = null; st.steam = 0; st.salt = 0; },
      rest: () => gsap.to(st, { ...REST, duration: 0.8, ease: 'power2.inOut', overwrite: 'auto', onUpdate: paint }),
      demo: () => { const q = { a: 0 }; return gsap.to(q, { a: 1, duration: 5, repeat: -1, ease: 'none', onUpdate: () => aim([64 + 44 * Math.cos(q.a * TAU), 60 + 24 * Math.sin(q.a * TAU)]) }); },
    });
  };
  DIRS.push(
    { l: 'A1', name: 'Stripe', box: [30, 8, 74, 110], art: cone({ paper: 'stripe' }),
      idea: 'Round 2 A, refined: the red and white striped cone, softer steam. The pointer turns and tips it; hover tosses the fries, steam curls off, salt falls.' },
    { l: 'A2', name: 'Puntzak', box: [30, 8, 74, 110], art: cone({ paper: 'check', drip: true, seed: 12 }),
      idea: 'The blue check paper of a village frituur, a mayo drip already over the lip. Hover tosses the fries and the drip runs further down the paper.' },
    { l: 'A3', name: 'In hand', box: [26, 8, 80, 116], art: cone({ paper: 'kraft', hand: true, seed: 41 }),
      idea: 'Plain brown paper with a stamp, held in an ink hand from below. The cone follows the pointer a little and leans into the move. Hover jiggles it and one fry flips out and drops back in.' },
    { l: 'A4', name: 'Sauce', box: [30, 0, 74, 118], art: cone({ paper: 'stripe', squirt: true, seed: 5 }),
      idea: 'Each hover squirts the next sauce from above: mayonnaise, andalouse, samurai, stoofvlees, curry, tartaar. The old blob shrinks away and the new one swells in.' },
  );

  /* ================= Gallery ================= */

  const fitIcon = (svg, box) => {
    const b = { x: box[0], y: box[1], width: box[2], height: box[3] }, side = Math.max(b.width, b.height);
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  for (const D of DIRS) {
    const card = document.createElement('article');
    card.className = 'dir';
    card.innerHTML = `<header><b>${D.l}</b><span>· ${D.name}</span></header>
      <div class="icons"><div class="tile t256" tabindex="0"></div><div class="tile t128" tabindex="0"></div><div class="tile t64" tabindex="0"></div></div>
      <p class="idea">${D.idea}</p>`;
    out.append(card);
    card.querySelectorAll('.tile').forEach(tile => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tile.addEventListener('pointermove', e => c.move(local(svg, e)));
      tile.addEventListener('pointerleave', () => c.leave());
      tile.addEventListener('focus', () => c.enter(null));
      tile.addEventListener('blur', () => c.leave());
    });
  }
})();
</script>
</body>
</html>
