<script>
  // The menu opens on the Clock. ?all shows the whole shelf; ?lab shows the Lab.
  {
    const q = new URLSearchParams(location.search);
    document.documentElement.dataset.view = q.has('lab') ? 'lab' : q.has('all') ? 'all' : 'clock';
    // The words wait for their fonts, 1.2 s at most; then a late font changes them in view.
    if (document.fonts && document.fonts.load) {
      const d = document.documentElement.dataset, t0 = performance.now();
      d.fonts = 'wait';
      // A wait too short to see ends with no fade.
      const show = () => { if (d.fonts !== 'wait') return; if (performance.now() - t0 > 120) { d.fonts = 'in'; setTimeout(() => delete d.fonts, 400); } else delete d.fonts; };

      setTimeout(show, 1200);
    }
    // A script that stalls leaves the whole shelf, as a failed one does.
    // The reveal goes too: its observer starts only when the page is whole.
    setTimeout(() => { const r = document.documentElement, d = r.dataset; if (d.view === 'clock' && !d.clock) { delete d.view; r.classList.remove('js-reveal'); } }, 8000);

    <script>
      // Toys fade in through grain as they enter the view, a few frames apart.
      (() => {
        if (!('IntersectionObserver' in window)) return;
        document.documentElement.classList.add('js-reveal');
        let batch = 0, batchT = 0;
        const io = new IntersectionObserver(entries => {
          entries.forEach(e => {
            if (!e.isIntersecting) return;
            clearTimeout(batchT);
            e.target.style.setProperty('--d', `${(batch++ % 12) * 0.06}s`);
            e.target.classList.add('is-in');
            io.unobserve(e.target);
          });
          batchT = setTimeout(() => { batch = 0; }, 120);
        }, { rootMargin: '0px 0px -6% 0px' });
        const watch = () => document.querySelectorAll('.toy').forEach(t => io.observe(t));
        document.readyState === 'loading' ? addEventListener('DOMContentLoaded', watch) : watch();
      })();
      // toys.json names each toy's series; series.json holds the badge.
      // Series badges and their links stay off for now (Tom, 2026-11-09).
      const SERIES_ON = false;
      (async () => {
        if (!SERIES_ON) return;
        try {
          const [toys, series] = await Promise.all(['toys.json', 'series.json'].map(u => fetch(u).then(r => r.json())));
          for (const [id, t] of Object.entries(toys)) {
            const s = t.series && series[t.series];
            // Badges show in the Lab only, for now.
            const obj = s && document.querySelector(`.lab a.toy#${CSS.escape(id)} .obj`);
            if (!obj) continue;
            const b = Object.assign(document.createElement('img'), { className: 'series', src: s.badge, alt: '', title: s.name, draggable: false });
            obj.append(b);
            obj.closest('.toy').dataset.series = t.series;
            const li = obj.closest('li');
            li.dataset.series = t.series;
            li.style.setProperty('--series', s.color);
          }
          // Constellation runs in the Lab only; the main shelf keeps just the badges.
          document.querySelectorAll('.lab .shelf').forEach(shelf => constellation(shelf, series));
        } catch { /* The menu works without badges. */ }
      })();
      // Series: a switch groups the shelf in view by series, under Wave dividers,
      // or lays it flat again. series.json names each series' icon: a shot.
      (() => {
        const root = document.documentElement, lab = root.dataset.view === 'lab', KEY = 'stimming.series';
        // The Clock deals its own dozen; it shows no sections.
        if (root.dataset.view === 'clock') return;
        const shelf = () => document.querySelector(lab ? '.lab > .shelf' : 'main > .shelf');
        let saved = null;
        try { saved = localStorage.getItem(KEY); } catch (e) {}
        // The Lab opens in sections; the main shelf opens flat.
        let on = saved ? saved === 'on' : lab, flat = null, files = null;
        const load = () => files ||= Promise.all([fetch('toys.json').then(r => r.json()), fetch('series.json').then(r => r.json()), import('../../../shared/series/shots.js')]);
        const parsed = () => document.readyState === 'loading' ? new Promise(r => addEventListener('DOMContentLoaded', r, { once: true })) : null;

        const btn = Object.assign(document.createElement('button'), { type: 'button', className: 'series-toggle' });
        btn.innerHTML = '<svg viewBox="0 0 26 8" aria-hidden="true"><path d="M1 4Q4 0 7 4T13 4T19 4T25 4"/></svg>Series';
        btn.setAttribute('aria-pressed', on);
        document.querySelector('main').prepend(btn);

        async function group() {
          const [toys, series, { shotIcon }] = await load();
          await parsed();
          const home = shelf();
          if (!home || flat) return;
          // The flat order comes back when the switch goes off.
          flat = [...home.children];
          const groups = new Map(Object.keys(series).map(k => [k, []])), rest = [];
          for (const li of flat) (groups.get(toys[li.querySelector('a.toy')?.id]?.series) || rest).push(li);
          const add = (label, tiles) => {
            const sec = Object.assign(document.createElement('section'), { className: 'sec' });
            const ul = Object.assign(document.createElement('ul'), { className: 'shelf' });
            sec.setAttribute('aria-label', label);
            ul.append(...tiles);
            sec.append(ul);
            home.before(sec);
            return sec;
          };
          for (const [k, tiles] of groups) {

            sec.style.setProperty('--c', s.color);

      // Hover or focus on a series tile lights its siblings and draws their links.
      function constellation(shelf, series) {
        if (!shelf.querySelector(':scope > li[data-series]')) return;
        const NS = 'http://www.w3.org/2000/svg';

        let current = null;
        const light = li => {
          const key = li?.dataset.series || null;
          if (key === current && key) return;
          current = key;
          shelf.classList.toggle('lit', !!key);
          if (!key) return;
          const s = series[key];
          shelf.style.setProperty('--series', s.color);
          const on = [...shelf.children].filter(x => x.dataset.series === key);
          [...shelf.children].forEach(x => x.classList.toggle('on', x.dataset.series === key));
          const bb = shelf.getBoundingClientRect();
          const mid = x => { const r = x.querySelector('.obj').getBoundingClientRect(); return [r.left - bb.left + r.width / 2, r.top - bb.top + r.height / 2]; };
          const pts = on.map(mid);
          svg.setAttribute('viewBox', `0 0 ${bb.width} ${bb.height}`);
          svg.replaceChildren();
          const path = document.createElementNS(NS, 'path');
          path.setAttribute('d', 'M' + pts.map(p => p.map(n => n.toFixed(1)).join(' ')).join('L'));
          svg.append(path);
          for (const [x, y] of pts) {
            const c = document.createElementNS(NS, 'circle');
            c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1)); c.setAttribute('r', 3);
            svg.append(c);

          if (!still.matches) {
            const L = path.getTotalLength();
            path.animate([{ strokeDasharray: L, strokeDashoffset: L }, { strokeDasharray: L, strokeDashoffset: 0 }], { duration: 600, easing: 'ease-out', fill: 'forwards' });
          }
          const count = Object.assign(document.createElement('span'), { textContent: `${on.length} toys` });
          tag.replaceChildren(Object.assign(document.createElement('img'), { src: s.badge, alt: '', draggable: false }), s.name, count);
          const [x, y] = mid(li);
          const top = li.querySelector('.obj').getBoundingClientRect().top - bb.top;
          tag.style.left = `${x.toFixed(1)}px`;
          tag.style.top = `${(top - 26).toFixed(1)}px`;
        };

        shelf.addEventListener('pointerover', e => { if (e.pointerType !== 'touch') light(tileOf(e)); });
        shelf.addEventListener('pointerleave', () => light(null));
        shelf.addEventListener('focusin', e => light(tileOf(e)));

        const idle = window.requestIdleCallback || (f => setTimeout(f, 1200));
        addEventListener('load', () => idle(() => SHELL.forEach(warm), { timeout: 4000 }));
        // A specifier resolves through the page's importmap, then against the page.
        const resolve = (spec, map, base) => {
          if (map[spec]) return map[spec];
          const pre = Object.keys(map).filter(k => k.endsWith('/') && spec.startsWith(k)).sort((a, b) => b.length - a.length)[0];
          if (pre) return map[pre] + spec.slice(pre.length);
          return /^(\.{0,2}\/|https:)/.test(spec) ? new URL(spec, base).href : null;
        };
        // A hover, focus or touch on a tile warms that toy's page, emblem and modules.
        const aim = async a => {
          const res = await warm(a.href);
          if (!res || !res.ok) return;
          warm(`../../../shared/emblems/${a.id}.svg`);
          const html = await res.text();
          let map = {};
          try { map = JSON.parse(html.match(/<script type="importmap">([\s\S]*?)<\/script>/)?.[1] || '{}').imports || {}; } catch {}
          for (const m of html.matchAll(/(?:\bfrom\s*|\bimport\s*\(?\s*)(['"])([^'"\n]+)\1/g)) {
            const url = resolve(m[2], map, a.href);
            if (url) warm(url);
          }

        const onTile = e => { const a = e.target.closest?.('a.toy'); if (a) aim(a); };

        // A pointer that only crosses a tile warms nothing.
        let dwell = 0;
        main.addEventListener('pointerover', e => { clearTimeout(dwell); dwell = setTimeout(onTile, 90, e); }, { passive: true });

        main.addEventListener('touchstart', onTile, { passive: true });
        main.addEventListener('focusin', onTile);
      })();

  // Rest blends the frozen frame back to the 3:2 knot.
