  // The menu opens on the Clock. ?all shows the whole shelf; ?lab shows the Lab.
  {
    const q = new URLSearchParams(location.search);
    document.documentElement.dataset.view = q.has('lab') ? 'lab' : q.has('all') ? 'all' : 'clock';
    // The words wait for their fonts, 1.2 s at most; then a late font changes them in view.
    if (document.fonts && document.fonts.load) {
      const d = document.documentElement.dataset, t0 = performance.now();
      d.fonts = 'wait';
      // A wait too short to see ends with no fade.
      const show = () => { if (d.fonts !== 'wait') return; if (performance.now() - t0 > 120) { d.fonts = 'in'; setTimeout(() => delete d.fonts, 400); } else delete d.fonts; };
      Promise.all(['700 1em B612', '400 1em B612', '500 1em "Iosevka Term Slab"', '500 1em Gabarito'].map(f => document.fonts.load(f))).then(show, show);
      setTimeout(show, 1200);
    }
    // A script that stalls leaves the whole shelf, as a failed one does.
    // The reveal goes too: its observer starts only when the page is whole.
    setTimeout(() => { const r = document.documentElement, d = r.dataset; if (d.view === 'clock' && !d.clock) { delete d.view; r.classList.remove('js-reveal'); } }, 8000);

    <script>
      // Toys fade in through grain as they enter the view, a few frames apart.
      (() => {
        if (!('IntersectionObserver' in window)) return;
        document.documentElement.classList.add('js-reveal');
        let batch = 0, batchT = 0;
        const io = new IntersectionObserver(entries => {
          entries.forEach(e => {
            if (!e.isIntersecting) return;
            clearTimeout(batchT);
            e.target.style.setProperty('--d', `${(batch++ % 12) * 0.06}s`);
            e.target.classList.add('is-in');
            io.unobserve(e.target);
          });
          batchT = setTimeout(() => { batch = 0; }, 120);
        }, { rootMargin: '0px 0px -6% 0px' });

        document.readyState === 'loading' ? addEventListener('DOMContentLoaded', watch) : watch();
      })();
      // toys.json names each toy's series; series.json holds the badge.
      // Series badges and their links stay off for now (Tom, 2026-11-09).
      const SERIES_ON = false;
      (async () => {
        if (!SERIES_ON) return;
        try {
          const [toys, series] = await Promise.all(['toys.json', 'series.json'].map(u => fetch(u).then(r => r.json())));
          for (const [id, t] of Object.entries(toys)) {

            // Badges show in the Lab only, for now.
