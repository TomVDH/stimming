<script>
// A snapshot of an earlier menu for the icon sheet: one tile, live.
window.__miss = (e, l) => (window.__misses ||= []).push((l ?? '') + ' ' + String(e && e.message || e));
addEventListener('error', e => window.__miss(e.error || e.message));
// The page sits three folders down; its fetches resolve from the site root.
(() => {
  const here = new URL('./', location.href).href, root = new URL('../../../', location.href).href, f = window.fetch.bind(window);
  window.fetch = (u, o) => {
    if (u instanceof Request) return f(u, o);
    // Hover warm-ups fetch toy pages and emblems; a snapshot skips them.
    if (o && o.priority === 'low') return Promise.resolve(null);
    const s = new URL(String(u), location.href).href;
    return f(s.startsWith(here) ? root + s.slice(here.length) : s, o);
  };
  // Series badges are hidden here, so they load nothing; other images resolve from the root.
  const src = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
  Object.defineProperty(HTMLImageElement.prototype, 'src', { ...src, set(v) {
    if (this.classList.contains('series') || v == null || v === 'null' || v === 'undefined') return;
    const s = new URL(String(v), location.href).href;
    src.set.call(this, s.startsWith(here) ? root + s.slice(here.length) : s);
  } });
  // The menu focused its first tile; here that would play the tile at rest.
  HTMLElement.prototype.focus = function () {};
  // The series switch stays off here; the switch only reads, it never writes.
  const get = Storage.prototype.getItem;
  Storage.prototype.getItem = function (k) { return k === 'stimming.series' ? 'off' : get.call(this, k); };
  // One broken tile must not stop the others: each forEach step runs on its own.
  for (const P of [Array.prototype, NodeList.prototype]) {
    const each = P.forEach;
    P.forEach = function (fn, that) { return each.call(this, function (...a) { try { return fn.apply(this, a); } catch (e) { window.__miss(e, 'each'); } }, that); };
  }
})();
</script>

main { width: 100%; }
/* Rows wrap and centre, so a short last row sits in the middle. */
.shelf {

.shelf > li { width: clamp(96px, 26vw, 150px); }

/* The main shelf holds six toys a row at most and wraps on smaller screens. */

a.toy { cursor: pointer; }
a.toy:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }

/* Each toy arrives through grainy blur as it scrolls into view. */

        if (!('IntersectionObserver' in window)) return;

          entries.forEach(e => {
            if (!e.isIntersecting) return;

            e.target.style.setProperty('--d', `${(batch++ % 12) * 0.06}s`);
            e.target.classList.add('is-in');
            io.unobserve(e.target);

        }, { rootMargin: '0px 0px -6% 0px' });
