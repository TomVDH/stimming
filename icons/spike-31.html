<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 31</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; -webkit-mask: var(--emblem) center / contain no-repeat; -webkit-mask-source-type: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike 31</h1>
<p class="lede">Ten seconds, round 3: the twilight plume in five print styles. Stencil, line, isometric block, abstract mark, halftone. Pointer y is the Dawn slider in each. Each shows at 256, 128 and 64.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const set = (e, a) => { for (const k in a) e.setAttribute(k, a[k]); };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const polyD = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const rng = seed => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';

  /* ================= Shared kit ================= */

  const SHADOW = 'oklch(0.07 0.01 265)';
  const HOT = 'oklch(0.99 0.03 95)', GOLD = 'oklch(0.88 0.16 78)', ROSE = 'oklch(0.64 0.19 14)', COLD = 'oklch(0.52 0.035 262)', CREAM = 'oklch(0.92 0.035 85)';
  const rad = (defs, id, cx, cy, r, stops) => {
    const g = el('radialGradient', { id, cx, cy, r }, defs);
    stops.forEach(([o, c, a = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g));
    return g;
  };
  const glowF = (defs, id, sd = 1.6) => {
    const g = el('filter', { id, x: -0.5, y: -0.5, width: 2, height: 2 }, defs);
    el('feGaussianBlur', { stdDeviation: sd, result: 'b' }, g);
    const m = el('feMerge', {}, g);
    el('feMergeNode', { in: 'b' }, m);
    el('feMergeNode', { in: 'SourceGraphic' }, m);
  };
  const block = (svg, fill) => {
    el('rect', { x: 20, y: 20, width: 94, height: 94, fill: SHADOW }, svg);
    return el('rect', { x: 14, y: 14, width: 94, height: 94, fill }, svg);
  };
  const clipBlock = (defs, id) => { const c = el('clipPath', { id }, defs); el('rect', { x: 14, y: 14, width: 94, height: 94 }, c); return `url(#${id})`; };
  // A clip that keeps only what lies above the shadow line; its rect moves with the knob.
  const clipAbove = (defs, id) => { const c = el('clipPath', { id }, defs); const r = el('rect', { x: 0, y: -40, width: 128, height: 100 }, c); return { url: `url(#${id})`, rect: r }; };
  const ctl = ({ aim, rest, demo, enter = () => {}, leave = () => {} }) => {
    let tl = null;
    return {
      enter(p) { enter(); if (p) aim(p); else tl = demo(); },
      move(p) { if (p && !tl) aim(p); },
      leave() { tl?.kill(); tl = null; leave(); rest(); },
    };
  };
  const knob = (v, draw) => {
    const st = { v };
    draw(st.v);
    return {
      st,
      to(v, d = 0.35, ease = 'power2.out') { gsap.to(st, { v, duration: d, ease, overwrite: 'auto', onUpdate: () => draw(st.v) }); },
      sweep(a, b, d = 1.8) { return gsap.fromTo(st, { v: a }, { v: b, duration: d, ease: 'sine.inOut', yoyo: true, repeat: -1, onUpdate: () => draw(st.v) }); },
    };
  };
  // The Dawn knob every direction shares: pointer y to the shadow line.
  const dawnCtl = k => ctl({
    aim: p => k.to(clamp((118 - p[1]) / 100, 0, 1)),
    rest: () => k.to(0.42, 0.8, 'power3.out'),
    demo: () => k.sweep(0.05, 1, 2.4),
  });
  const shadowY = u => lerp(122, 12, u);

  /* ================= The plume, as geometry ================= */

  const P0 = [42, 116], P1 = [46, 62], P2 = [90, 20];
  const at = t => [(1 - t) * (1 - t) * P0[0] + 2 * (1 - t) * t * P1[0] + t * t * P2[0], (1 - t) * (1 - t) * P0[1] + 2 * (1 - t) * t * P1[1] + t * t * P2[1]];
  const radius = t => 2.6 + 9.5 * Math.pow(t, 0.85);
  // The puffs, as spike 29 A draws them.
  const PUFFS = (() => {
    const r = rng(41), N = 46, out = [];
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1), p = at(t), q = at(Math.min(1, t + 0.01));
      const dx = q[0] - p[0], dy = q[1] - p[1], m = Math.hypot(dx, dy) || 1;
      const rad = radius(t), j = (r() - 0.5) * rad * 0.7;
      out.push({ x: p[0] - (dy / m) * j, y: p[1] + (dx / m) * j, r: rad * (0.8 + 0.4 * r()), t });
    }
    return out;
  })();
  // The silhouette: the centreline offset by the radius, with scallops where puffs bulge.
  const silhouette = (bump = 0.22, k = 1, n = 60) => {
    const L = [], R = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, p = at(t), q = at(Math.min(1, t + 0.005));
      const dx = q[0] - p[0], dy = q[1] - p[1], m = Math.hypot(dx, dy) || 1, nx = -dy / m, ny = dx / m;
      const r = radius(t) * k * (1 + bump * Math.abs(Math.sin(t * 34 + 0.4)) * Math.min(1, t * 4));
      L.push([p[0] + nx * r, p[1] + ny * r]); R.push([p[0] - nx * r, p[1] - ny * r]);
    }
    const tip = at(1), rt = radius(1) * k;
    return polyD([...L, [tip[0] + rt * 0.3, tip[1] - rt * 0.9], ...R.reverse()]);
  };
  // Coverage of the plume at a point, 0 to 1, from the puffs.
  const coverage = (x, y) => {
    let c = 0;
    for (const p of PUFFS) { const d = Math.hypot(x - p.x, y - p.y) / p.r; if (d < 1) c += (1 - d * d) * 0.9; }
    return clamp(c, 0, 1);
  };

  /* ================= Current: spike 29 A, now on the menu ================= */

  const CURRENT_ART = (svg, id) => {
    const defs = el('defs', {}, svg);
    rad(defs, `${id}d`, 0.5, 0.5, 0.5, [[0, 'oklch(0.48 0.03 262)', 1], [0.72, 'oklch(0.34 0.03 266)', 0.9], [1, 'oklch(0.28 0.03 270)', 0]]);
    rad(defs, `${id}l`, 0.42, 0.4, 0.6, [[0, 'oklch(0.98 0.05 92)', 1], [0.55, 'oklch(0.88 0.14 72)', 1], [0.86, 'oklch(0.7 0.15 22)', 0.9], [1, 'oklch(0.6 0.14 15)', 0]]);
    glowF(defs, `${id}g`, 1.6);
    block(svg, 'oklch(0.13 0.022 268)');
    const inner = el('g', { 'clip-path': clipBlock(defs, `${id}c`) }, svg);
    const sky = el('rect', { x: 14, width: 94, height: 60, fill: 'oklch(0.2 0.04 300)', opacity: 0.55 }, inner);
    const dark = PUFFS.map(p => el('circle', { cx: f(p.x), cy: f(p.y), r: f(p.r), fill: `url(#${id}d)` }, inner));
    const lit = PUFFS.map(p => el('circle', { cx: f(p.x), cy: f(p.y), r: f(p.r * 1.08), fill: `url(#${id}l)` }, inner));
    const head = el('rect', { x: f(P2[0] - 1.8), y: f(P2[1] - 1.8), width: 3.6, height: 3.6, fill: HOT, filter: `url(#${id}g)` }, inner);
    return dawnCtl(knob(0.42, u => {
      const sh = shadowY(u);
      set(sky, { y: f(sh - 60) });
      PUFFS.forEach((p, i) => { const w = sstep(sh + 7, sh - 7, p.y); set(lit[i], { opacity: f(w) }); set(dark[i], { opacity: f(1 - 0.5 * w) }); });
      set(head, { opacity: f(sstep(sh + 4, sh - 4, P2[1])) });
    }));
  };

  /* ================= Round 3: print styles ================= */

  const DIRS = [
    { l: 'Current', name: 'Twilight plume', box: [10, 10, 110, 110], art: CURRENT_ART },
    {
      l: 'B', name: 'Stencil',
      idea: 'A three-ink print. The plume is one cream cut-out on ink blue; above the shadow line the gold ink prints over it, and where gold meets cream a rose band bleeds. Hard edges, no gradients. The line is the Dawn slider.',
      box: [10, 10, 110, 110],
      art(svg, id) {
        const defs = el('defs', {}, svg);
        block(svg, 'oklch(0.24 0.08 266)');
        const inner = el('g', { 'clip-path': clipBlock(defs, `${id}c`) }, svg);
        const d = silhouette(0.2);
        el('path', { d, fill: CREAM }, inner);
        const above = clipAbove(defs, `${id}a`);
        const gold = el('g', { 'clip-path': above.url }, inner);
        el('path', { d, fill: GOLD }, gold);
        // The rose bleed: the same cut-out, printed a hair off, only in a band at the line.
        const band = el('clipPath', { id: `${id}b` }, defs); const bandR = el('rect', { x: 0, width: 128, height: 7 }, band);
        const rose = el('g', { 'clip-path': `url(#${id}b)` }, inner);
        el('path', { d, fill: ROSE, transform: 'translate(1.2 0.6)' }, rose);
        // A speck of hot ink at the head, printed only when the head is in the sun.
        const head = el('rect', { x: f(P2[0] - 2.5), y: f(P2[1] - 2.5), width: 5, height: 5, fill: HOT }, inner);
        return dawnCtl(knob(0.42, u => {
          const sh = shadowY(u);
          set(above.rect, { y: f(sh - 100) });
          set(bandR, { y: f(sh - 3) });
          set(head, { opacity: sh < P2[1] ? 1 : 0 });
        }));
      },
      emblem() {
        return `${EMB_HEAD}\n  <path d="${silhouette(0.2)}" fill="#8a8a8a"/>\n  <clipPath id="a"><rect x="0" y="0" width="128" height="62"/></clipPath>\n  <path d="${silhouette(0.2)}" fill="#fff" clip-path="url(#a)"/>\n</svg>\n`;
      },
    },
    {
      l: 'C', name: 'Line',
      idea: 'One weight of line on a dark tile: the plume as a scalloped contour, the shadow line as a dashed rule. Above the rule the plume fills with diagonal hatching, gold. Drag the rule down and the hatch grows.',
      box: [10, 10, 110, 110],
      art(svg, id) {
        const defs = el('defs', {}, svg);
        block(svg, 'oklch(0.15 0.025 272)');
        const inner = el('g', { 'clip-path': clipBlock(defs, `${id}c`) }, svg);
        const d = silhouette(0.3);
        // Hatching lives inside the plume, above the line.
        const pc = el('clipPath', { id: `${id}p` }, defs); el('path', { d }, pc);
        const above = clipAbove(defs, `${id}a`);
        const hatchG = el('g', { 'clip-path': `url(#${id}p)` }, inner);
        const hatch = el('g', { 'clip-path': above.url, stroke: GOLD, 'stroke-width': 1.1 }, hatchG);
        for (let k = -120; k < 140; k += 3.6) el('path', { d: `M${k} 128L${k + 128} 0` }, hatch);
        el('path', { d, fill: 'none', stroke: 'oklch(0.93 0.03 85)', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, inner);
        const rule = el('path', { stroke: ROSE, 'stroke-width': 1.2, 'stroke-dasharray': '3 2.5', fill: 'none' }, inner);
        const head = el('circle', { cx: f(P2[0]), cy: f(P2[1]), r: 2.4, fill: HOT }, inner);
        return dawnCtl(knob(0.42, u => {
          const sh = shadowY(u);
          set(above.rect, { y: f(sh - 100) });
          set(rule, { d: `M14 ${f(sh)}H108` });
          set(head, { opacity: sh < P2[1] ? 1 : 0 });
        }));
      },
      emblem() {
        const hatch = []; for (let k = -120; k < 140; k += 5) hatch.push(`<path d="M${k} 128L${k + 128} 0" stroke="#fff" stroke-width="2"/>`);
        return `${EMB_HEAD}\n  <clipPath id="p"><path d="${silhouette(0.3)}"/></clipPath>\n  <clipPath id="a"><rect x="0" y="0" width="128" height="60"/></clipPath>\n  <g clip-path="url(#p)"><g clip-path="url(#a)">${hatch.join('')}</g></g>\n  <path d="${silhouette(0.3)}" fill="none" stroke="#fff" stroke-width="4"/>\n  <path d="M8 60H120" stroke="#8a8a8a" stroke-width="3" stroke-dasharray="6 5"/>\n</svg>\n`;
      },
    },
    {
      l: 'D', name: 'Isometric block',
      idea: 'A slab of marsh in isometric, hard shadow under it. The plume stands on it as a stack of discs that widen as they rise and drift downrange; discs above the shadow line turn gold. Pointer y lifts the line through the stack.',
      box: [6, 2, 118, 118],
      art(svg, id) {
        const defs = el('defs', {}, svg);
        glowF(defs, `${id}g`, 1.3);
        const iso = (x, y, z) => [64 + (x - z) * 0.866, 86 + (x + z) * 0.5 - y];
        const P = pts => polyD(pts.map(q => iso(...q)));
        const S = 34, T = 9;
        // The slab: a hard shadow, then three faces.
        el('path', { d: polyD([iso(-S, 0, S), iso(S, 0, S), iso(S, 0, -S), iso(S, -T, -S), iso(S, -T, S), iso(-S, -T, S)].map(p => [p[0] + 6, p[1] + 6])), fill: SHADOW }, svg);
        el('path', { d: P([[-S, 0, S], [S, 0, S], [S, -T, S], [-S, -T, S]]), fill: 'oklch(0.2 0.04 300)' }, svg);
        el('path', { d: P([[S, 0, S], [S, 0, -S], [S, -T, -S], [S, -T, S]]), fill: 'oklch(0.14 0.03 300)' }, svg);
        el('path', { d: P([[-S, 0, -S], [S, 0, -S], [S, 0, S], [-S, 0, S]]), fill: 'oklch(0.28 0.05 305)' }, svg);
        // Reeds: short iso bars along the near edges.
        const r = rng(9);
        for (let i = 0; i < 18; i++) { const x = -S + 4 + r() * (2 * S - 8), z = S - 3 - r() * 5, h = 4 + r() * 5; const a = iso(x, 0, z), b = iso(x, h, z); el('path', { d: `M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}`, stroke: 'oklch(0.1 0.02 290)', 'stroke-width': 1.3 }, svg); }
        // The stack: discs rise from the pad, widen, lean downrange.
        const N = 13, discs = [];
        for (let i = 0; i < N; i++) {
          const t = i / (N - 1), y = 2 + t * 92, x = -10 + t * t * 26, z = -6 - t * 8, rad = 3 + 9 * Math.pow(t, 0.9);
          const c = iso(x, y, z);
          const g = el('g', {}, svg);
          el('ellipse', { cx: f(c[0]), cy: f(c[1] + rad * 0.5), rx: f(rad), ry: f(rad * 0.5), fill: 'oklch(0.3 0.03 265)' }, g);
          el('rect', { x: f(c[0] - rad), y: f(c[1] - rad * 0.5), width: f(rad * 2), height: f(rad), fill: 'oklch(0.3 0.03 265)' }, g);
          const top = el('ellipse', { cx: f(c[0]), cy: f(c[1] - rad * 0.5), rx: f(rad), ry: f(rad * 0.5), fill: 'oklch(0.44 0.03 262)' }, g);
          const side = g.children[0], body = g.children[1];
          discs.push({ y: c[1], top, side, body, g });
        }
        const tip = iso(16, 94, -14);
        const head = el('rect', { x: f(tip[0] - 2), y: f(tip[1] - 2), width: 4, height: 4, fill: HOT, filter: `url(#${id}g)` }, svg);
        return dawnCtl(knob(0.42, u => {
          const sh = lerp(104, 4, u);
          discs.forEach(dsc => {
            const w = sstep(sh + 5, sh - 5, dsc.y);
            set(dsc.top, { fill: w > 0.5 ? GOLD : 'oklch(0.44 0.03 262)' });
            set(dsc.body, { fill: w > 0.5 ? 'oklch(0.74 0.15 55)' : 'oklch(0.3 0.03 265)' });
            set(dsc.side, { fill: w > 0.5 ? 'oklch(0.6 0.15 35)' : 'oklch(0.3 0.03 265)' });
          });
          set(head, { opacity: sh < tip[1] ? 1 : 0 });
        }));
      },
      emblem() {
        const iso = (x, y, z) => [64 + (x - z) * 0.866 * 1.15, 88 + ((x + z) * 0.5 - y) * 1.15];
        const P = pts => polyD(pts.map(q => iso(...q)));
        const S = 34, T = 9, parts = [];
        parts.push(`<path d="${P([[-S, 0, -S], [S, 0, -S], [S, 0, S], [-S, 0, S]])}" fill="#4a4a4a"/>`);
        parts.push(`<path d="${P([[-S, 0, S], [S, 0, S], [S, -T, S], [-S, -T, S]])}" fill="#2e2e2e"/>`);
        parts.push(`<path d="${P([[S, 0, S], [S, 0, -S], [S, -T, -S], [S, -T, S]])}" fill="#1e1e1e"/>`);
        for (let i = 0; i < 13; i++) { const t = i / 12, c = iso(-10 + t * t * 26, 2 + t * 92, -6 - t * 8), rad = (3 + 9 * Math.pow(t, 0.9)) * 1.15; parts.push(`<ellipse cx="${f(c[0])}" cy="${f(c[1])}" rx="${f(rad)}" ry="${f(rad * 0.55)}" fill="${t > 0.5 ? '#fff' : '#bdbdbd'}"/>`); }
        return `${EMB_HEAD}\n  ${parts.join('\n  ')}\n</svg>\n`;
      },
    },
    {
      l: 'E', name: 'Abstract mark',
      idea: 'Three shapes. A thick slanted bar is the climb; a hairline slit across the tile is the shadow line; the bar is cold below the slit and gold above it. Nothing else. Pointer y moves the slit, and the colour follows.',
      box: [10, 10, 110, 110],
      art(svg, id) {
        const defs = el('defs', {}, svg);
        block(svg, 'oklch(0.17 0.03 275)');
        const inner = el('g', { 'clip-path': clipBlock(defs, `${id}c`) }, svg);
        const bar = polyD([[30, 112], [50, 112], [96, 22], [76, 22]]);
        el('path', { d: bar, fill: COLD }, inner);
        const above = clipAbove(defs, `${id}a`);
        const gold = el('g', { 'clip-path': above.url }, inner);
        el('path', { d: bar, fill: GOLD }, gold);
        const slit = el('rect', { x: 14, width: 94, height: 1.6, fill: ROSE }, inner);
        return dawnCtl(knob(0.42, u => {
          const sh = shadowY(u);
          set(above.rect, { y: f(sh - 100) });
          set(slit, { y: f(sh - 0.8) });
        }));
      },
      emblem() {
        const bar = polyD([[30, 118], [54, 118], [100, 10], [76, 10]]);
        return `${EMB_HEAD}\n  <path d="${bar}" fill="#8a8a8a"/>\n  <clipPath id="a"><rect x="0" y="0" width="128" height="60"/></clipPath>\n  <path d="${bar}" fill="#fff" clip-path="url(#a)"/>\n  <rect x="8" y="59" width="112" height="3" fill="#fff"/>\n</svg>\n`;
      },
    },
    {
      l: 'F', name: 'Halftone',
      idea: 'The frame as print: a grid of dots sized by how much plume sits under each. Gold dots above the shadow line, cold grey below, and a faint dot of paper grain everywhere else. Pointer y is the Dawn slider; the dots recolour as the line moves.',
      box: [10, 10, 110, 110],
      art(svg, id) {
        const defs = el('defs', {}, svg);
        block(svg, 'oklch(0.14 0.02 270)');
        const inner = el('g', { 'clip-path': clipBlock(defs, `${id}c`) }, svg);
        const STEP = 4.7, dots = [];
        for (let y = 16.3; y < 108; y += STEP) for (let x = 16.3; x < 108; x += STEP) {
          const c = coverage(x, y), rr = c > 0.02 ? (STEP / 2) * Math.sqrt(c) * 1.15 : 0.55;
          dots.push({ y, c, e: el('circle', { cx: f(x), cy: f(y), r: f(rr), fill: 'oklch(0.3 0.03 270)' }, inner) });
        }
        return dawnCtl(knob(0.42, u => {
          const sh = shadowY(u);
          dots.forEach(d => {
            if (d.c <= 0.02) return;
            const lit = d.y < sh;
            set(d.e, { fill: lit ? (d.c > 0.7 ? HOT : GOLD) : COLD });
          });
        }));
      },
      emblem() {
        const STEP = 4.7, out = [];
        for (let y = 2.3; y < 128; y += STEP) for (let x = 2.3; x < 128; x += STEP) {
          const c = coverage(x, y); if (c <= 0.02) continue;
          out.push(`<circle cx="${f(x)}" cy="${f(y)}" r="${f((STEP / 2) * Math.sqrt(c) * 1.2)}" fill="${y < 62 ? '#fff' : '#8a8a8a'}"/>`);
        }
        return `${EMB_HEAD}\n  ${out.join('\n  ')}\n</svg>\n`;
      },
    },
  ];

  /* ================= Gallery ================= */

  const NAME = 'Ten seconds';
  const fitIcon = (svg, box) => {
    const b = box === 'auto' ? svg.getBBox() : box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : { x: 14, y: 14, width: 100, height: 100 }, side = Math.max(b.width, b.height);
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-launch';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  window.CTL = {};
  for (const D of DIRS) {
    const file = `launch31-${D.l.toLowerCase()}`;
    const url = D.l === 'Current' ? '' : `spike/emblems/${file}.svg`;
    if (D.emblem) window.EMBLEMS[file] = D.emblem();
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = D.l === 'Current' ? 'launch-current' : file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tile => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      (window.CTL[D.l] ||= []).push({ c, svg });
      if (reduce) return;
      tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tile.addEventListener('pointermove', e => c.move(local(svg, e)));
      tile.addEventListener('pointerleave', () => c.leave());
      tile.addEventListener('focus', () => c.enter(null));
      tile.addEventListener('blur', () => c.leave());
    });
  }
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
