<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon sets</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* Icon sets: every toy, each direction as its colour icon and its transition emblem. */
:root { --bg: oklch(0.16 0.012 275); --fg: oklch(0.95 0.008 275); --muted: oklch(0.6 0.02 275); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--fg); font: 500 13px/1.35 "Gabarito", system-ui, sans-serif; padding-inline: max(16px, env(safe-area-inset-left, 0px)); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 40px 72px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.show { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; padding-block: 10px; background: oklch(0.16 0.012 275 / 0.92); }
.show button {
  padding: 6px 11px; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer;
  background: none; border: 1px solid oklch(0.26 0.014 275); border-radius: 999px; -webkit-tap-highlight-color: transparent;
}
.show button:hover { color: var(--fg); }
.show button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
iframe { display: block; width: 100%; height: 0; border: 0; background: var(--bg); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Icon sets</h1>
  <div class="show" role="group" aria-label="Show" id="show">
    <button type="button" data-v="both" aria-pressed="true">Both</button>
    <button type="button" data-v="icon" aria-pressed="false">Icon</button>
    <button type="button" data-v="trans" aria-pressed="false">Transition</button>
  </div>
  <div id="frames"></div>
</div>
<script type="module">
// The galleries, in order; each holds one to three toys.
const SPIKES = 11;
// Each gallery shows its toys: the colour icon and the luminance emblem.
const CSS = `
html, body { background: transparent !important; }
body { margin: 0 !important; padding: 0 !important; overflow: hidden; }
.wrap, #out, main { max-width: none !important; margin: 0 !important; padding: 0 !important; gap: 0 !important; display: block !important; }
h1, .lede, .idea, .pick, .size { display: none !important; }
section { display: grid !important; gap: 12px !important; margin: 0 !important; padding: 20px 0 !important; border-top: 1px solid oklch(0.26 0.014 275); }
section > h2 { margin: 0 !important; font-size: 22px !important; font-weight: 700 !important; letter-spacing: -0.01em !important; text-transform: none !important; color: oklch(0.95 0.008 275) !important; }
section > h2 small { display: none; }
.dirs, .row { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) !important; gap: 12px !important; }
.icons { gap: 14px !important; align-items: center !important; }
.t64, .icons > div:has(.s64) { display: none !important; }
body.icon .emb, body.icon .embs { display: none !important; }
body.trans .icons { display: none !important; }
`;
// Both, Icon or Transition (the luminance emblem); the choice applies to every gallery.
let view = 'both';
const docs = [];
const setView = v => {
  view = v;
  document.querySelectorAll('#show button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  docs.forEach(d => { d.body.classList.toggle('icon', v === 'icon'); d.body.classList.toggle('trans', v === 'trans'); });
};
document.getElementById('show').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); });
const names = await fetch('../toys.json').then(r => r.json()).catch(() => ({}));
const base = new URL('./', location.href).href;
const box = document.getElementById('frames');
// Galleries load one at a time; the local server drops large bursts.
for (let n = 1; n <= SPIKES; n++) {
  const src = await fetch(`spike-${n}.html`).then(r => r.text()).catch(() => '');
  if (!src) continue;
  const frame = document.createElement('iframe');
  frame.title = `Spike ${n}`;
  frame.setAttribute('scrolling', 'no');
  frame.srcdoc = src.replace(/<head>/i, `<head><base href="${base}">`).replace(/<\/head>/i, `<style>${CSS}</style></head>`);
  box.append(frame);
  await new Promise(r => frame.addEventListener('load', r, { once: true }));
  const doc = frame.contentDocument, win = frame.contentWindow;
  docs.push(doc);
  setView(view);
  const rows = [...doc.querySelectorAll('section')];
  for (const sec of rows) {
    const first = sec.querySelector('.dir');
    const toy = sec.id?.replace(/^row-/, '') || (first?.id || first?.dataset.key || '').split('-')[0];
    sec.querySelector('h2').textContent = names[toy]?.name ?? toy;
  }
  const fit = () => { frame.style.height = `${Math.ceil(Math.max(0, ...rows.map(s => s.getBoundingClientRect().bottom)) + win.scrollY)}px`; };
  new win.ResizeObserver(fit).observe(doc.body);
  fit();
}
</script>
</body>
</html>
