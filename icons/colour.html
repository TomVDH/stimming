<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon colours</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* Colour sheet: one toy at a time, each direction at rest and mid-hover. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --focus: oklch(0.84 0.13 205);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--fg); font: 500 13px/1.35 var(--sans); padding-inline: max(16px, env(safe-area-inset-left, 0px)); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 40px 72px; display: grid; gap: 24px; }
h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.toys { display: flex; flex-wrap: wrap; gap: 6px; }
.toys button {
  padding: 5px 10px; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer;
  background: none; border: 1px solid var(--line); border-radius: 999px; -webkit-tap-highlight-color: transparent;
  transition: color 0.2s ease, border-color 0.2s ease;
}
.toys button:hover { color: var(--fg); border-color: var(--muted); }
.toys button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
.title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.title h2 { margin: 0; font-size: clamp(28px, 5vw, 44px); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
.title a { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; }
.title a:hover { color: var(--fg); }
.title span { margin-left: auto; color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
iframe { display: block; width: 100%; height: 480px; border: 0; background: var(--bg); }
@media (pointer: coarse) { .toys button { padding: 9px 14px; } }
@media (prefers-reduced-motion: reduce) { .toys button { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Icon colours</h1>
  <div class="toys" role="group" aria-label="Toy" id="toys"></div>
  <div class="title"><h2 id="name"></h2><a id="gallery" href="#"></a><span>Rest · Hover</span></div>
  <iframe id="view" title="Icon directions"></iframe>
</div>
<script type="module">
// Each gallery and the toys it holds, in gallery order.
const SPIKES = [
  [1, ['chladni', 'walker', 'fire']],
  [2, ['rain', 'tvtree', 'balloons']],
  [3, ['morpher', 'pop']],
  [4, ['neon', 'glass']],
  [5, ['fidget', 'pendulum']],
  [6, ['ferro', 'pool']],
  [7, ['kaleido', 'soap']],
  [8, ['prism', 'domino']],
  [9, ['magnet', 'putty']],
  [10, ['pins', 'scope']],
  [11, ['galaxy']],
];
const TOYS = SPIKES.flatMap(([n, ids]) => ids.map(id => ({ id, n })));

// The gallery shows one toy; each direction's small tile grows to full size and plays.
const CSS = `
html, body { background: transparent !important; }
body { padding: 0 !important; }
.wrap { max-width: none !important; margin: 0 !important; padding: 0 !important; gap: 0 !important; }
h1, .lede, h2, .emb, .embs, .idea, .pick, .size { display: none !important; }
section { display: none !important; }
section.only { display: grid !important; }
.dirs, .row { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) !important; gap: 16px !important; }
.icons { gap: 14px !important; align-items: center !important; }
.t64, .t64 svg, .s64 { width: 128px !important; height: 128px !important; }
.t64, .s64 { pointer-events: none; }
`;

const names = await fetch('../toys.json').then(r => r.json()).catch(() => ({}));
const nameOf = id => names[id]?.name ?? id;
const view = document.getElementById('view');
const bar = document.getElementById('toys');
bar.innerHTML = TOYS.map(t => `<button type="button" data-id="${t.id}" aria-pressed="false">${nameOf(t.id)}</button>`).join('');
const buttons = [...bar.children];

let current = null;
const show = id => {
  const toy = TOYS.find(t => t.id === id) ?? TOYS[0];
  current = toy;
  buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === toy.id)));
  document.getElementById('name').textContent = nameOf(toy.id);
  const link = document.getElementById('gallery');
  link.textContent = `Spike ${toy.n}`;
  link.href = `spike-${toy.n}.html`;
  history.replaceState(null, '', `#${toy.id}`);
  // The query makes each toy a fresh load, so old loops stop.
  view.src = `spike-${toy.n}.html?${toy.id}`;
};

view.addEventListener('load', () => {
  const doc = view.contentDocument, win = view.contentWindow;
  if (!doc || !current) return;
  const style = doc.createElement('style');
  style.textContent = CSS;
  doc.head.append(style);
  const sec = doc.getElementById(`row-${current.id}`) ?? doc.querySelector(`[id^="${current.id}-"]`)?.closest('section');
  sec?.classList.add('only');
  // The keyboard path plays each icon's full transition, with no pointer aim.
  sec?.querySelectorAll('.t64, .s64').forEach(t => {
    t.dispatchEvent(new win.FocusEvent('focus'));
    t.dispatchEvent(new win.FocusEvent('focusin', { bubbles: true }));
  });
  // The frame takes the shown toy's height, so it also shrinks.
  const fit = () => { view.style.height = `${Math.ceil(sec?.getBoundingClientRect().bottom ?? doc.body.scrollHeight) + 8}px`; };
  fit();
  new win.ResizeObserver(fit).observe(doc.body);
});

bar.addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.id); });
// Arrow keys step through the toys.
addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const i = TOYS.indexOf(current) + (e.key === 'ArrowRight' ? 1 : -1);
  show(TOYS[(i + TOYS.length) % TOYS.length].id);
});
show(location.hash.slice(1));
</script>
</body>
</html>
