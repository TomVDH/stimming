<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon sets</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* Icon sets: every toy, each direction at rest beside its hover transition. */
:root { --bg: oklch(0.16 0.012 275); --fg: oklch(0.95 0.008 275); --muted: oklch(0.6 0.02 275); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--fg); font: 500 13px/1.35 "Gabarito", system-ui, sans-serif; padding-inline: max(16px, env(safe-area-inset-left, 0px)); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 40px 72px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.key { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
iframe { display: block; width: 100%; height: 0; border: 0; background: var(--bg); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Icon sets</h1>
  <span class="key">Rest · Hover</span>
  <div id="frames"></div>
</div>
<script type="module">
// The galleries, in order; each holds one to three toys.
const SPIKES = 11;
// Each gallery shows its toys; the small tile grows to full size and plays.
const CSS = `
html, body { background: transparent !important; }
body { margin: 0 !important; padding: 0 !important; overflow: hidden; }
.wrap, #out, main { max-width: none !important; margin: 0 !important; padding: 0 !important; gap: 0 !important; display: block !important; }
h1, .lede, .emb, .embs, .idea, .pick, .size { display: none !important; }
section { display: grid !important; gap: 12px !important; margin: 0 !important; padding: 20px 0 !important; border-top: 1px solid oklch(0.26 0.014 275); }
section > h2 { margin: 0 !important; font-size: 22px !important; font-weight: 700 !important; letter-spacing: -0.01em !important; text-transform: none !important; color: oklch(0.95 0.008 275) !important; }
section > h2 small { display: none; }
.dirs, .row { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) !important; gap: 12px !important; }
.icons { gap: 14px !important; align-items: center !important; }
.t64, .t64 svg, .s64 { width: 128px !important; height: 128px !important; }
.t64, .s64 { pointer-events: none; }
`;
const names = await fetch('../toys.json').then(r => r.json()).catch(() => ({}));
const base = new URL('./', location.href).href;
const box = document.getElementById('frames');
// Galleries load one at a time; the local server drops large bursts.
for (let n = 1; n <= SPIKES; n++) {
  const src = await fetch(`spike-${n}.html`).then(r => r.text()).catch(() => '');
  if (!src) continue;
  const frame = document.createElement('iframe');
  frame.title = `Spike ${n}`;
  frame.setAttribute('scrolling', 'no');
  frame.srcdoc = src.replace(/<head>/i, `<head><base href="${base}">`).replace(/<\/head>/i, `<style>${CSS}</style></head>`);
  box.append(frame);
  await new Promise(r => frame.addEventListener('load', r, { once: true }));
  const doc = frame.contentDocument, win = frame.contentWindow;
  const rows = [...doc.querySelectorAll('section')];
  for (const sec of rows) {
    const first = sec.querySelector('.dir');
    const toy = sec.id?.replace(/^row-/, '') || (first?.id || first?.dataset.key || '').split('-')[0];
    sec.querySelector('h2').textContent = names[toy]?.name ?? toy;
  }
  // The keyboard path plays each icon's full transition, with no pointer aim.
  doc.querySelectorAll('.t64, .s64').forEach(t => {
    t.dispatchEvent(new win.FocusEvent('focus'));
    t.dispatchEvent(new win.FocusEvent('focusin', { bubbles: true }));
  });
  const fit = () => { frame.style.height = `${Math.ceil(Math.max(0, ...rows.map(s => s.getBoundingClientRect().bottom)) + win.scrollY)}px`; };
  new win.ResizeObserver(fit).observe(doc.body);
  fit();
}
</script>
</body>
</html>
