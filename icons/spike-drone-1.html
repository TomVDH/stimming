<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Zena 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Zena 1</h1>
<p class="lede">Zena, round 1. A: the craft from above, indigo, four coaxial rotors; the pointer flies it. D: the landing pad is the block; the pointer lifts the craft off it.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const bodyMarkup = (cls, u, fill) => `<path class="${cls}" fill="url(#${u}${fill})"/><path class="${cls}" fill="url(#${u}lit)"/><path class="${cls}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The toy's tokens: indigo paint, pale camo, black booms, blue rotor lights.
  const PAINT = [[0, 'oklch(0.5 0.17 279)'], [0.55, 'oklch(0.36 0.16 278)'], [1, 'oklch(0.24 0.11 276)']];
  const CAMO = 'oklch(0.86 0.04 285)', BOOM = 'oklch(0.2 0.01 270)', POD = 'oklch(0.26 0.012 270)';
  const LED = 'oklch(0.72 0.17 255)', DISC = 'oklch(0.9 0.02 250)', BLADE = 'oklch(0.16 0.01 270)';
  const GLASS = 'oklch(0.14 0.02 270)';

  // The craft in its own frame: u to the right, v forward (up the screen), w up.
  // Hubs sit wide and short, as on the real airframe.
  const HUBS = [[-40, 17], [40, 17], [-40, -17], [40, -17]];
  const ROT = 17;
  // A flier: the craft's shape at a lean, drawn through a projection.
  // proj(u, v, w) gives the screen point; it carries the lean and the view.
  function craftShapes(proj) {
    const P = (u, v, w = 0) => proj(u, v, w);
    // Fuselage: a capsule along v, its outline sampled round.
    const fus = [];
    for (let i = 0; i <= 24; i++) {
      const a = i / 24 * Math.PI * 2, s = Math.sin(a), c = Math.cos(a);
      // Fuller at the tail, tapered at the nose.
      const v = s * 25, half = 7.5 * Math.sqrt(Math.max(0, 1 - Math.pow(Math.abs(s), 2.6))) * (s > 0 ? 1 - .2 * s : 1);
      fus.push(P(c >= 0 ? half : -half, v, 4));
    }
    // Arms: wide lobes at the body that taper into booms at each hub.
    const arms = HUBS.map(([hu, hv]) => {
      const su = Math.sign(hu), sv = Math.sign(hv);
      return poly([P(su * 5, sv * 3, 2), P(su * 5, sv * 19, 2), P(hu - su * 3, hv + sv * 4, 1), P(hu + su * 1, hv, 1), P(hu - su * 3, hv - sv * 3.5, 1), P(su * 14, sv * 4, 2)]);
    });
    // Camo blotches on each lobe, flat and bold.
    const camo = HUBS.map(([hu, hv]) => {
      const su = Math.sign(hu), sv = Math.sign(hv);
      return poly([P(su * 11, sv * 8, 2.5), P(su * 18, sv * 13, 2.5), P(su * 24, sv * 12, 2), P(su * 20, sv * 8.5, 2), P(su * 15, sv * 6.5, 2)]);
    });
    return { fus: poly(fus), arms, camo, nose: P(0, 26, 3), hubs: HUBS.map(([u, v]) => ({ base: P(u, v, 0), top: P(u, v, 7), low: P(u, v, -4) })) };
  }
  // A rotor disc as an ellipse path at the hub, squashed by the view.
  const discPath = (c, rx, ry) => `M${f(c[0] - rx)} ${f(c[1])}A${f(rx)} ${f(ry)} 0 1 0 ${f(c[0] + rx)} ${f(c[1])}A${f(rx)} ${f(ry)} 0 1 0 ${f(c[0] - rx)} ${f(c[1])}Z`;
  // One blade pair across the disc at angle t.
  const bladePath = (c, rx, ry, t) => {
    const ca = Math.cos(t), sa = Math.sin(t), w = 2.3;
    const a = [c[0] + ca * rx, c[1] + sa * ry], b = [c[0] - ca * rx, c[1] - sa * ry];
    const nx = -sa * w, ny = ca * w * ry / rx;
    return poly([[a[0] + nx, a[1] + ny], [b[0] + nx, b[1] + ny], [b[0] - nx, b[1] - ny], [a[0] - nx, a[1] - ny]]);
  };

  // A craft at rest or flying: lean, drift, lift and spin, shared by A and D.
  const flier = (draw, rest, map) => {
    const st = { ...rest, spin: 0, ang: 0, to: { ...rest, spin: 0 }, live: false };
    const step = () => {
      for (const k of ['roll', 'pitch', 'dx', 'dy', 'lift']) st[k] += (st.to[k] - st[k]) * 0.12;
      st.spin += (st.to.spin - st.spin) * 0.08;
      st.ang += st.spin;
      draw(st);
      const off = ['roll', 'pitch', 'dx', 'dy', 'lift', 'spin'].reduce((s, k) => s + Math.abs(st[k] - st.to[k]), 0);
      if (!st.live && off < 0.02) { Object.assign(st, rest, { spin: 0 }); draw(st); loop.stop(); }
    };
    const loop = clock(step);
    draw(st);
    return {
      enter(p) { st.live = true; st.to.spin = 0.9; Object.assign(st.to, rest.flying || {}); loop.start(); if (p) this.move(p); },
      move(p) { if (!p) return; Object.assign(st.to, map(p)); },
      leave() { st.live = false; st.to = { ...rest, spin: 0 }; loop.start(); },
    };
  };

  // Paints one craft into a group; returns a function that redraws it.
  // squash: how far the view flattens a level disc.
  function craftGroup(g, u, scale, squash) {
    g.innerHTML = `
      ${HUBS.map((_, i) => `<path class="dl${i}" fill="${DISC}" opacity="0.18"/>`).join('')}
      ${HUBS.map((_, i) => `<path class="arm${i}" fill="${BOOM}"/>`).join('')}
      ${HUBS.map((_, i) => `<path class="arm${i}" fill="url(#${u}paint)"/><path class="camo${i}" fill="${CAMO}" opacity="0.9"/>`).join('')}
      ${bodyMarkup('fus', u, 'paint')}
      <circle class="nose" r="${4.6 * scale}" fill="${GLASS}"/><circle class="noseHi" r="${1.5 * scale}" fill="#fff" opacity="0.7"/>
      ${HUBS.map((_, i) => `<path class="pod${i}" fill="${POD}"/><circle class="led${i}" r="${2.2 * scale}" fill="${LED}"/>`).join('')}
      ${HUBS.map((_, i) => `<path class="du${i}" fill="url(#${u}disc)"/><path class="bl${i}" fill="${BLADE}"/>`).join('')}`;
    const q = s => g.querySelectorAll(s);
    return (proj, st) => {
      const S = craftShapes(proj);
      q('.fus').forEach(p => p.setAttribute('d', S.fus));
      S.arms.forEach((d, i) => q(`.arm${i}`).forEach(p => p.setAttribute('d', d)));
      S.camo.forEach((d, i) => q(`.camo${i}`).forEach(p => p.setAttribute('d', d)));
      const nose = q('.nose')[0], nh = q('.noseHi')[0];
      nose.setAttribute('cx', f(S.nose[0])); nose.setAttribute('cy', f(S.nose[1]));
      nh.setAttribute('cx', f(S.nose[0] - 1.4 * scale)); nh.setAttribute('cy', f(S.nose[1] - 1.4 * scale));
      // Spinning blades fade into the disc; a still blade reads as a bold bar.
      const blur = clamp(st.spin / 0.6);
      S.hubs.forEach((h, i) => {
        const rx = ROT * scale, ry = ROT * scale * squash;
        q(`.pod${i}`)[0].setAttribute('d', poly([[h.low[0] - 3.4 * scale, h.low[1]], [h.top[0] - 3.4 * scale, h.top[1]], [h.top[0] + 3.4 * scale, h.top[1]], [h.low[0] + 3.4 * scale, h.low[1]]]));
        const led = q(`.led${i}`)[0];
        led.setAttribute('cx', f(h.base[0])); led.setAttribute('cy', f(h.base[1]));
        led.setAttribute('opacity', f(0.55 + 0.45 * blur));
        q(`.dl${i}`)[0].setAttribute('d', discPath(h.low, rx * 0.92, ry * 0.92));
        q(`.du${i}`)[0].setAttribute('d', discPath(h.top, rx, ry));
        q(`.du${i}`)[0].setAttribute('opacity', f(0.35 + 0.5 * blur));
        const b = q(`.bl${i}`)[0];
        b.setAttribute('d', bladePath(h.top, rx, ry, st.ang * (i % 3 === 0 ? 1 : -1) + i * 0.7));
        b.setAttribute('opacity', f(1 - 0.75 * blur));
      });
    };
  }

  const DIRS = [];

  /* ================= Current ================= */

  // Zena is in the Lab with no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // The craft from above and a little behind; the view squashes depth.
  const AK = 0.62, AY = 62;
  const aProj = st => (u, v, w) => {
    // The lean: a bank lowers one side, a pitch lowers the nose or the tail.
    const h = w - u * Math.sin(st.roll) * 0.9 + v * Math.sin(st.pitch) * 0.9;
    return [64 + st.dx + u, AY + st.dy - v * AK - h * 0.8];
  };
  const A_REST = { roll: 0, pitch: 0, dx: 0, dy: 0, lift: 0 };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [5, 32, 118, 62],
    idea: 'The craft from above, nose away: an indigo capsule on four wide lobes with pale camo, a black boom to each coaxial rotor pod, a blue light on each pod and a dark gimbal ball in the nose. At rest the blades stand still. The pointer flies it: the craft banks and pitches toward the pointer and drifts a little after it, the rotors spin up into pale discs and the lights brighten. On leave it levels out and the blades stop.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 3)}
          ${lg(`${u}paint`, PAINT, 'x1="0.2" y1="0" x2="0.8" y2="1"')}
          ${rg(`${u}disc`, [[0, DISC, 0.1], [0.7, DISC, 0.45], [1, DISC, 0.2]])}</defs>
        <ellipse class="sh" cx="64" cy="98" rx="44" ry="7" fill="oklch(0.05 0.01 270)" opacity="0.55" filter="url(#${u}b)"/>
        <g class="craft"></g>`;
      const g = svg.querySelector('.craft'), sh = svg.querySelector('.sh');
      const paint = craftGroup(g, u, 1, AK);
      return flier(st => {
        const pr = aProj(st);
        paint((cu, cv, cw) => pr(cu, cv, cw), st);
        sh.setAttribute('cx', f(64 + st.dx * 0.6));
      }, A_REST, p => {
        const kx = clamp((p[0] - 64) / 44, -1, 1), ky = clamp((p[1] - 62) / 34, -1, 1);
        return { roll: kx * 0.42, pitch: -ky * 0.32, dx: kx * 5, dy: ky * 3 };
      });
    },
    emblem: (() => {
      const pr = aProj(A_REST), S = craftShapes(pr);
      const rings = S.hubs.map(h => `<path d="${discPath(h.top, ROT, ROT * AK)}" fill="none" stroke="#fff" stroke-width="5"/>`).join('');
      return `${EMB_HEAD}${S.arms.map(d => `<path d="${d}" fill="#fff"/>`).join('')}<path d="${S.fus}" fill="#fff"/><circle cx="${f(S.nose[0])}" cy="${f(S.nose[1])}" r="4.6" fill="#000"/>${rings}</svg>`;
    })(),
  });

  /* ================= D: Isometric block ================= */

  // The landing pad is the block; the craft sits on it and lifts off.
  const CY = 84, HALF = 34, T = 12;
  const iso = (gx, gy, h = 0) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5 - h];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const [N, E, S2, W] = D_TOP;
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // A circle on the pad's top, as a path.
  const isoCircle = (r, h = 0) => poly(Array.from({ length: 48 }, (_, i) => { const a = i / 48 * Math.PI * 2; return iso(Math.cos(a) * r, Math.sin(a) * r, h); }));
  // The painted H, lying on the pad.
  const H_PARTS = [[-11, -9, -6, 9], [6, -9, 11, 9], [-6, -2.5, 6, 2.5]].map(([x0, y0, x1, y1]) => poly([iso(x0, y0), iso(x1, y0), iso(x1, y1), iso(x0, y1)]));
  const D_SCALE = 0.62;
  // The craft in the iso view: u along the pad's right edge, v along its left.
  const dProj = st => (u, v, w) => {
    const s = D_SCALE, h = 6 + st.lift + (w - u * Math.sin(st.roll) * 0.9 + v * Math.sin(st.pitch) * 0.9) * s;
    return iso(u * s * 0.7 + v * s * 0.7 + st.dx, -u * s * 0.7 + v * s * 0.7 + st.dy, h);
  };
  const D_REST = { roll: 0, pitch: 0, dx: 0, dy: 0, lift: 0, flying: { lift: 26 } };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [16, 22, 96, 92],
    idea: 'The landing pad is the block: dark asphalt with a pale ring and the H on its top, a rim on the top edges. The craft sits on the H, blades still. The pointer is the pilot: the rotors spin up, the craft lifts off and hovers over the pad toward the pointer, banking as it goes, its shadow shrinking on the pad. On leave it settles back onto the H.',
    art(svg, u) {
      const top = poly(D_TOP);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}s`, 1.8)}
          ${lg(`${u}paint`, PAINT, 'x1="0.2" y1="0" x2="0.8" y2="1"')}
          ${rg(`${u}disc`, [[0, DISC, 0.1], [0.7, DISC, 0.45], [1, DISC, 0.2]])}
          ${lg(`${u}top`, [[0, 'oklch(0.36 0.008 270)'], [1, 'oklch(0.26 0.008 270)']], 'x1="0" y1="0" x2="0.4" y2="1"')}</defs>
        <path d="${poly([E, S2, W, down(W), down(S2), down(E)])}" fill="oklch(0.05 0.01 270)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${poly([W, S2, down(S2), down(W)])}" fill="oklch(0.3 0.008 270)"/>
        <path d="${poly([S2, E, down(E), down(S2)])}" fill="oklch(0.2 0.008 270)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="${isoCircle(27)}" fill="none" stroke="oklch(0.88 0.01 90)" stroke-width="2.6"/>
        ${H_PARTS.map(d => `<path d="${d}" fill="oklch(0.9 0.01 90)"/>`).join('')}
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S2[0])} ${f(S2[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <ellipse class="sh" rx="26" ry="13" fill="oklch(0.05 0.01 270)" filter="url(#${u}s)"/>
        <g class="craft"></g>`;
      const g = svg.querySelector('.craft'), sh = svg.querySelector('.sh');
      const paint = craftGroup(g, u, D_SCALE, .58);
      return flier(st => {
        const pr = dProj(st);
        paint(pr, st);
        // The shadow stays on the pad; it shrinks and fades as the craft climbs.
        const c = iso(st.dx, st.dy, 0), k = 1 - st.lift / 60;
        sh.setAttribute('cx', f(c[0])); sh.setAttribute('cy', f(c[1]));
        sh.setAttribute('rx', f(26 * k)); sh.setAttribute('ry', f(13 * k));
        sh.setAttribute('opacity', f(0.55 * k));
      }, D_REST, p => {
        const kx = clamp((p[0] - 64) / 40, -1, 1), ky = clamp((p[1] - 60) / 40, -1, 1);
        return { roll: kx * 0.35, pitch: -ky * 0.3, dx: (kx + ky) * 9, dy: (ky - kx) * 9 };
      });
    },
    emblem: (() => {
      const pr = dProj(D_REST), Sx = craftShapes(pr);
      const rings = Sx.hubs.map(h => `<path d="${discPath(h.top, ROT * D_SCALE, ROT * D_SCALE * .58)}" fill="none" stroke="#fff" stroke-width="3.5"/>`).join('');
      return `${EMB_HEAD}<path d="${poly([W, S2, down(S2), down(W)])}" fill="#5a5a5a"/><path d="${poly([S2, E, down(E), down(S2)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/>${Sx.arms.map(d => `<path d="${d}" fill="#fff"/>`).join('')}<path d="${Sx.fus}" fill="#fff"/>${rings}</svg>`;
    })(),
  });

  /* ================= Gallery ================= */
  const NAME = 'Zena';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-drone';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `drone-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
