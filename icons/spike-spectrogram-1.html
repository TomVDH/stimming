<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Spectrogram 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Spectrogram 1</h1>
<p class="lede">Spectrogram, round 1. No pick yet; A goes on the menu until Tom picks. A: a dark glass slab with a three-stroke rainbow brush, a note and two overtones, drawn up to a bright pen. D: an indigo block whose dark right face is the screen.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const line = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L');
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The toy's tokens: deep indigo glass and rainbow ink that runs cool to hot.
  const SLAB = [[0, 'oklch(0.3 0.06 282)'], [1, 'oklch(0.14 0.035 275)']];
  // Each stroke fades in from the left and runs its hues up to the pen.
  const INK = [
    [[0, 'oklch(0.62 0.17 295)', 0.2], [0.45, 'oklch(0.74 0.15 215)', 0.85], [0.8, 'oklch(0.86 0.16 88)'], [1, 'oklch(0.97 0.05 90)']],
    [[0, 'oklch(0.6 0.16 330)', 0.2], [0.45, 'oklch(0.72 0.17 350)', 0.85], [0.8, 'oklch(0.8 0.15 50)'], [1, 'oklch(0.95 0.06 60)']],
    [[0, 'oklch(0.6 0.12 250)', 0.2], [0.45, 'oklch(0.76 0.13 180)', 0.85], [0.8, 'oklch(0.86 0.15 135)'], [1, 'oklch(0.96 0.05 130)']],
  ];
  // Overtones 2 and 3 stand an octave and a twelfth above the note.
  const OCT = 0.27, UP = [0, OCT, OCT * Math.log2(3)], WIDE = [6.5, 5, 4];
  const NH = 34;
  // The rest stroke: a rise, a fall, then a held note with vibrato.
  const restQ = i => {
    const t = i / (NH - 1);
    const sweep = t < 0.72 ? 0.06 + 0.36 * Math.sin(Math.PI * Math.min(1, t / 0.72)) ** 1.4 : 0.06;
    return sweep + (t > 0.6 ? 0.014 * Math.sin(i * 1.7) * clamp((t - 0.6) * 6) : 0) + (t > 0.72 ? 0.07 * clamp((t - 0.72) * 5) : 0);
  };
  const REST = Array.from({ length: NH }, (_, i) => restQ(i));

  // The state both icons share: the paper scrolls and the pen follows the pointer's height.
  // At rest the stroke eases back to its rest shape and the clock stops.
  const run = draw => {
    const st = { q: REST.slice(), pen: REST[NH - 1], to: REST[NH - 1], live: false, t: 0, held: 0, acc: 0, last: 0, pointer: false };
    const step = time => {
      const dt = Math.min(0.1, time - (st.last || time));
      st.last = time; st.t = time;
      if (st.live) {
        // With no pointer, the pen sweeps up and down by itself.
        if (!st.pointer) st.to = 0.24 + 0.2 * Math.sin(time * 2.2);
        st.pen += (st.to - st.pen) * 0.3;
        st.held += dt;
        st.acc += dt * 30;
        while (st.acc >= 1) {
          st.acc -= 1;
          st.q.shift();
          st.q.push(st.pen + 0.016 * Math.sin(time * 34) * clamp(st.held * 2));
        }
      } else {
        let off = 0;
        for (let i = 0; i < NH; i++) { st.q[i] += (REST[i] - st.q[i]) * 0.14; off += Math.abs(REST[i] - st.q[i]); }
        st.pen = st.q[NH - 1];
        if (off < 0.004) { st.q = REST.slice(); st.pen = REST[NH - 1]; st.last = 0; draw(st); loop.stop(); return; }
      }
      draw(st);
    };
    const loop = clock(step);
    draw(st);
    return {
      enter(p) { st.live = true; st.held = 0; st.pointer = !!p; loop.start(); if (p) this.move(p); },
      move(p, toQ) { if (p && toQ) { st.pointer = true; st.to = toQ(p); } },
      leave() { st.live = false; loop.start(); },
    };
  };
  // The three strokes as polylines, through a map from (sample, q) to the screen.
  const strokes = (q, map) => UP.map(du => line(q.map((v, i) => map(i, v + du))));

  const DIRS = [];

  /* ================= Current ================= */

  // Spectrogram is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // The slab: a glass screen; the history runs to a pen near its right end.
  const A_SLAB = 'M18 24H110Q120 24 120 34V94Q120 104 110 104H18Q8 104 8 94V34Q8 24 18 24Z';
  const A_X0 = 15, A_PEN = 96, A_FOOT = 95, A_SPAN = 72;
  const aMap = (i, q) => [A_X0 + (i / (NH - 1)) * (A_PEN - A_X0), A_FOOT - q * A_SPAN];
  const aQ = p => clamp((A_FOOT - p[1]) / A_SPAN, 0.02, 0.38);
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [8, 20, 112, 86],
    idea: 'A dark indigo glass slab is the screen. A note and its two overtones run across it as three bold strokes, faint on the left and burning toward a bright pen bead near the right edge: a rise, a fall, then a held note with vibrato. The pointer plays: the paper scrolls left and the pen follows the pointer\'s height, so you draw with it. It eases back to its rest stroke when the pointer leaves.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}g`, 2.2)}
          ${lg(`${u}slab`, SLAB)}
          ${INK.map((s, k) => lg(`${u}k${k}`, s, `gradientUnits="userSpaceOnUse" x1="${A_X0}" y1="0" x2="${A_PEN}" y2="0"`)).join('')}
          ${rg(`${u}bead`, [[0, '#fff'], [0.35, 'oklch(0.93 0.1 85)', 0.9], [1, 'oklch(0.8 0.16 60)', 0]])}
          ${lg(`${u}beam`, [[0, 'oklch(0.95 0.08 85)', 0.7], [1, 'oklch(0.9 0.1 85)', 0]], 'x1="0" y1="0" x2="1" y2="0"')}</defs>
        <ellipse cx="64" cy="110" rx="50" ry="3.5" fill="oklch(0.05 0.01 240)" opacity="0.6" filter="url(#${u}b)"/>
        ${body(A_SLAB, u, 'slab')}
        <path class="glow" fill="none" stroke="oklch(0.8 0.14 60)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#${u}g)"/>
        ${[2, 1, 0].map(k => `<path class="k k${k}" fill="none" stroke="url(#${u}k${k})" stroke-width="${WIDE[k]}" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}
        <rect class="slit" x="${A_PEN - 1.5}" y="31" width="3" height="66" rx="1.5" fill="oklch(0.78 0.08 260)" opacity="0.55"/>
        ${[0, 1, 2].map(k => `<rect class="beam b${k}" x="${A_PEN}" width="16" height="${WIDE[k] - 1.5}" rx="1" fill="url(#${u}beam)"/>`).join('')}
        <circle class="bead" cx="${A_PEN}" r="7" fill="url(#${u}bead)"/>`;
      const ks = [0, 1, 2].map(k => svg.querySelector(`.k${k}`)), glow = svg.querySelector('.glow');
      const beams = [0, 1, 2].map(k => svg.querySelector(`.b${k}`)), bead = svg.querySelector('.bead');
      const c = run(st => {
        const d = strokes(st.q, aMap);
        ks.forEach((p, k) => p.setAttribute('d', d[k]));
        glow.setAttribute('d', d[0]);
        beams.forEach((b, k) => b.setAttribute('y', f(aMap(0, st.pen + UP[k])[1] - (WIDE[k] - 1.5) / 2)));
        bead.setAttribute('cy', f(aMap(0, st.pen)[1]));
      });
      return { enter: p => c.enter(p), move: p => c.move(p, aQ), leave: () => c.leave() };
    },
    // The emblem: the slab in grey, the three strokes and the bead in white.
    emblem: `${EMB_HEAD}<path d="${A_SLAB}" fill="#4a4a4a"/>${strokes(REST, aMap).map((d, k) => `<path d="${d}" fill="none" stroke="#fff" stroke-width="${[11, 9, 8][k]}" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}<rect x="${A_PEN - 2}" y="30" width="4" height="68" rx="2" fill="#bbb"/><circle cx="${A_PEN}" cy="${f(aMap(0, REST[NH - 1])[1])}" r="10" fill="#fff"/></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The block's dark right face is the screen; the strokes lie in its plane.
  const CY = 40, HX = 16, HY = 28, T = 40;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // Face coordinates: x 0 to 100 from S to E, y 0 to 100 from top to foot.
  const faceAt = (x, y) => [S[0] + (x / 100) * (E[0] - S[0]), S[1] + (x / 100) * (E[1] - S[1]) + (y / 100) * T];
  const D_X0 = 8, D_PEN = 80, D_FOOT = 90, D_SPAN = 92;
  const dMap = (i, q) => faceAt(D_X0 + (i / (NH - 1)) * (D_PEN - D_X0), D_FOOT - q * D_SPAN);
  const dQ = p => clamp(0.04 + 0.34 * (1 - (p[1] - 30) / 64), 0.02, 0.38);
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [24, 16, 80, 90],
    idea: 'An indigo block: light top, mid left face, and a dark right face that is the screen. The three-stroke brush lies in that face, burning toward a bright pen near its far edge. The pointer plays: the paper scrolls and the pen follows the pointer\'s height. It eases back when the pointer leaves.',
    art(svg, u) {
      const top = poly([N, E, S, W]), right = poly([S, E, down(E), down(S)]);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 1.6)}
          ${lg(`${u}top`, [[0, 'oklch(0.58 0.07 282)'], [1, 'oklch(0.46 0.07 280)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}left`, [[0, 'oklch(0.38 0.06 280)'], [1, 'oklch(0.28 0.05 278)']])}
          ${lg(`${u}right`, [[0, 'oklch(0.2 0.04 278)'], [1, 'oklch(0.12 0.03 275)']])}
          ${INK.map((s, k) => lg(`${u}k${k}`, s, `gradientUnits="userSpaceOnUse" x1="${f(faceAt(D_X0, 50)[0])}" y1="0" x2="${f(faceAt(D_PEN, 50)[0])}" y2="0"`)).join('')}
          ${rg(`${u}bead`, [[0, '#fff'], [0.35, 'oklch(0.93 0.1 85)', 0.9], [1, 'oklch(0.8 0.16 60)', 0]])}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}left)"/>
        <path d="${right}" fill="url(#${u}right)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path class="glow" fill="none" stroke="oklch(0.8 0.14 60)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#${u}g)"/>
        ${[2, 1, 0].map(k => `<path class="k k${k}" fill="none" stroke="url(#${u}k${k})" stroke-width="${WIDE[k] * 0.78}" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}
        <path class="slit" d="${line([faceAt(D_PEN, 6), faceAt(D_PEN, 94)])}" stroke="oklch(0.78 0.08 260)" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round"/>
        <circle class="bead" r="5.5" fill="url(#${u}bead)"/>`;
      const ks = [0, 1, 2].map(k => svg.querySelector(`.k${k}`)), glow = svg.querySelector('.glow'), bead = svg.querySelector('.bead');
      const c = run(st => {
        const d = strokes(st.q, dMap);
        ks.forEach((p, k) => p.setAttribute('d', d[k]));
        glow.setAttribute('d', d[0]);
        const b = dMap(NH - 1, st.pen);
        bead.setAttribute('cx', f(b[0])); bead.setAttribute('cy', f(b[1]));
      });
      return { enter: p => c.enter(p), move: p => c.move(p, dQ), leave: () => c.leave() };
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/>${strokes(REST, dMap).map((d, k) => `<path d="${d}" fill="none" stroke="#fff" stroke-width="${[9, 7.5, 6.5][k]}" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}<circle cx="${f(dMap(NH - 1, REST[NH - 1])[0])}" cy="${f(dMap(NH - 1, REST[NH - 1])[1])}" r="7.5" fill="#fff"/></svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = 'Spectrogram';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-spectrogram';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `spectrogram-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
