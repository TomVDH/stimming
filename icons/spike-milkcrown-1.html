<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Milk crown 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Milk crown 1</h1>
<p class="lede">Milk crown, round 1. No pick yet; A goes on the menu until Tom picks. A: a white milk crown on its pool of milk, a bead on every point, the next drop above. D: the pool of milk is the block, the crown stands on it.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  const DIRS = [];

  // The toy's tokens: white milk shaded blue by the studio, a deep blue backdrop.
  const MILKC = [[0, 'oklch(0.99 0.004 250)'], [1, 'oklch(0.82 0.03 250)']];
  const WALLC = [[0, 'oklch(0.97 0.006 250)'], [0.55, 'oklch(0.9 0.02 250)'], [1, 'oklch(0.74 0.045 252)']];
  const INNERC = [[0, 'oklch(0.52 0.07 255)'], [1, 'oklch(0.84 0.03 250)']];
  const POOLC = [[0, 'oklch(0.95 0.01 250)'], [0.7, 'oklch(0.78 0.04 252)'], [1, 'oklch(0.5 0.08 255)', 0]];
  const BLUE = [[0, 'oklch(0.5 0.13 258)'], [1, 'oklch(0.34 0.12 262)']];
  const BLUED = [[0, 'oklch(0.32 0.11 262)'], [1, 'oklch(0.22 0.09 264)']];

  // The crown in an ellipse frame: centre x, base y, base radius, squash k, height h.
  // Its points sit round the top ellipse; front points are drawn over the wall.
  const crownGeo = ({ cx, by, rb, k, h, n = 14, pl = 9, br = 3.1, flare = 1.33 }) => {
    const rt = rb * flare, ty = by - h;
    const wall = `M${f(cx - rt)} ${f(ty)}L${f(cx - rb)} ${f(by)}A${f(rb)} ${f(rb * k)} 0 0 0 ${f(cx + rb)} ${f(by)}L${f(cx + rt)} ${f(ty)}A${f(rt)} ${f(rt * k)} 0 0 1 ${f(cx - rt)} ${f(ty)}Z`;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i + 0.5) / n * Math.PI * 2 + 0.11;
      const x = cx + rt * Math.cos(a), y = ty + rt * k * Math.sin(a);
      // Depth: 1 at the front, 0.6 at the back.
      const z = 0.8 + 0.2 * Math.sin(a);
      const L = pl * z, dx = Math.cos(a) * pl * 0.5 * z, w = 3.3 * z;
      const tip = [x + dx, y - L];
      const path = `M${f(x - w)} ${f(y + 1)}Q${f(x + dx * 0.4 - w * 0.25)} ${f(y - L * 0.5)} ${f(tip[0])} ${f(tip[1])}Q${f(x + dx * 0.4 + w * 0.25)} ${f(y - L * 0.5)} ${f(x + w)} ${f(y + 1)}Z`;
      pts.push({ a, x, y, tip, path, r: br * z, front: Math.sin(a) > 0, dx });
    }
    // The next drop waits above, as in the classic photograph.
    const dr = rb * 0.17, dy = ty - pl - rb * 0.72;
    return { cx, by, rb, k, h, rt, ty, wall, pts, dr, dy };
  };
  // A crown in the menu's language. Classes: crown, bead, drop.
  const crownArt = (u, G) => {
    const point = p => `<path d="${p.path}" fill="url(#${u}milk)"/><circle class="bead" data-dx="${f(p.dx * 0.5)}" cx="${f(p.tip[0])}" cy="${f(p.tip[1] - p.r * 0.6)}" r="${f(p.r)}" fill="url(#${u}bead)"/>`;
    return `<g class="crown" data-o="${f(G.cx)} ${f(G.by)}">
        ${G.pts.filter(p => !p.front).map(point).join('')}
        <ellipse cx="${f(G.cx)}" cy="${f(G.ty)}" rx="${f(G.rt)}" ry="${f(G.rt * G.k)}" fill="url(#${u}inner)"/>
        <ellipse cx="${f(G.cx)}" cy="${f(G.ty + G.h * 0.55)}" rx="${f(G.rb * 0.8)}" ry="${f(G.rb * G.k * 0.8)}" fill="oklch(0.62 0.05 254)" opacity="0.45" filter="url(#${u}b)"/>
        ${body(G.wall, u, 'wall')}
        <path d="M${f(G.cx - G.rt * 0.62)} ${f(G.ty + G.rt * G.k * 0.8)}L${f(G.cx - G.rb * 0.66)} ${f(G.by + G.rb * G.k * 0.72)}" stroke="#fff" stroke-width="${f(G.rb * 0.16)}" stroke-linecap="round" opacity="0.55" filter="url(#${u}s)"/>
        <path d="M${f(G.cx - G.rt)} ${f(G.ty)}A${f(G.rt)} ${f(G.rt * G.k)} 0 0 0 ${f(G.cx + G.rt)} ${f(G.ty)}" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity="0.95"/>
        ${G.pts.filter(p => p.front).map(point).join('')}
      </g>
      <g class="drop"><ellipse cx="${f(G.cx)}" cy="${f(G.dy)}" rx="${f(G.dr)}" ry="${f(G.dr * 1.06)}" fill="url(#${u}bead)"/><ellipse cx="${f(G.cx)}" cy="${f(G.dy)}" rx="${f(G.dr)}" ry="${f(G.dr * 1.06)}" fill="url(#${u}lit)"/></g>`;
  };
  // The shared motion: a drop falls; the crown sinks, then springs up and throws its beads.
  // Leave settles everything back to the photograph.
  const run = (svg, G) => {
    const crown = svg.querySelector('.crown'), beads = svg.querySelectorAll('.bead'), drop = svg.querySelector('.drop');
    const o = crown.dataset.o;
    let tl = null;
    return {
      enter() {
        if (tl) tl.kill();
        tl = gsap.timeline();
        tl.to(crown, { scaleY: 0.35, svgOrigin: o, duration: 0.18, ease: 'power2.in' })
          .to(beads, { opacity: 0, duration: 0.1 }, '<')
          .to(drop, { y: G.by - G.dy - G.h * 0.3, duration: 0.24, ease: 'power2.in' }, '<')
          .set(drop, { opacity: 0, y: -24 })
          .set(beads, { opacity: 1, y: 0, x: 0 })
          .to(crown, { scaleY: 1.1, svgOrigin: o, duration: 0.34, ease: 'back.out(2.2)' })
          .to(beads, { y: -9, x: (i, b) => +b.dataset.dx, duration: 0.5, ease: 'power2.out', stagger: { each: 0.012, from: 'random' } }, '<0.12')
          .to(crown, { scaleY: 1, svgOrigin: o, duration: 0.5, ease: 'sine.inOut' }, '<0.2')
          .to(drop, { opacity: 1, y: 0, duration: 0.7, ease: 'power1.in' }, '<0.3');
      },
      move() {},
      leave() {
        if (tl) tl.kill();
        tl = null;
        gsap.to(drop, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' });
        gsap.to(crown, { scaleY: 1, svgOrigin: o, duration: 0.4, ease: 'power2.out' });
        gsap.to(beads, { y: 0, x: 0, opacity: 1, duration: 0.5, ease: 'power2.inOut' });
      },
    };
  };
  const defs = u => `${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}s`, 1.2)}${blur(`${u}h`, 9)}
          ${lg(`${u}milk`, MILKC)}${lg(`${u}wall`, WALLC, 'x1="0" y1="0" x2="1" y2="0.25"')}${lg(`${u}inner`, INNERC)}
          ${rg(`${u}bead`, MILKC, 'cx="0.35" cy="0.3" r="0.8"')}${rg(`${u}pool`, POOLC, 'cx="0.45" cy="0.4" r="0.6"')}`;
  // The emblem's crown: white wall and points, the opening cut dark.
  const embCrown = G => `<path d="${G.wall}" fill="#fff"/><ellipse cx="${f(G.cx)}" cy="${f(G.ty)}" rx="${f(G.rt - 1.6)}" ry="${f(G.rt * G.k - 1.2)}" fill="#9a9a9a"/>${G.pts.map(p => `<path d="${p.path}" fill="#fff"/><circle cx="${f(p.tip[0])}" cy="${f(p.tip[1] - p.r * 0.6)}" r="${f(p.r)}" fill="#fff"/>`).join('')}<ellipse cx="${f(G.cx)}" cy="${f(G.dy)}" rx="${f(G.dr)}" ry="${f(G.dr * 1.06)}" fill="#fff"/>`;

  /* ================= Current ================= */

  // Milk crown is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  const GA = crownGeo({ cx: 64, by: 90, rb: 31, k: 0.27, h: 18, n: 12, pl: 13, br: 4.3, flare: 1.3 });
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [8, GA.dy - GA.dr - 1, 112, 110 - (GA.dy - GA.dr - 1)],
    idea: 'A white milk crown on its pool of milk in a blue studio glow, the next drop waiting above: a flared wall, the opening shaded blue, twelve points round the rim, a bead on every point. The pointer drops a drop: the crown sinks, springs up and throws its beads; leave and it settles back.',
    art(svg, u) {
      svg.innerHTML = `<defs>${defs(u)}</defs>
        <ellipse cx="64" cy="70" rx="44" ry="30" fill="oklch(0.48 0.14 258)" opacity="0.55" filter="url(#${u}h)"/>
        <ellipse cx="64" cy="95" rx="56" ry="14" fill="url(#${u}pool)"/>
        <ellipse cx="64" cy="95" rx="48" ry="11.5" fill="none" stroke="#fff" stroke-width="1.6" opacity="0.4"/>
        <ellipse cx="64" cy="95" rx="40" ry="9.4" fill="none" stroke="oklch(0.6 0.07 254)" stroke-width="1.6" opacity="0.45"/>
        <ellipse cx="66" cy="93" rx="34" ry="7" fill="oklch(0.5 0.08 256)" opacity="0.35" filter="url(#${u}b)"/>
        ${crownArt(u, GA)}`;
      return run(svg, GA);
    },
    emblem: `${EMB_HEAD}<ellipse cx="64" cy="95" rx="56" ry="14" fill="#6a6a6a"/>${embCrown(GA)}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The pool is the block: a milk top on blue studio faces; the crown stands on it.
  const CY = 80, HX = 32, HY = 32, T = 15;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  const GD = crownGeo({ cx: 64, by: CY + 4, rb: 18, k: 0.5, h: 13, n: 10, pl: 10, br: 3.4, flare: 1.32 });
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [8, GD.dy - GD.dr - 1, 112, S[1] + T - (GD.dy - GD.dr - 1)],
    idea: 'The pool of milk as the block at 30 degrees: a white milk top, a blue left face, a deep blue right face, a rim on the top edges. The crown stands on the milk with a bead on every point. The pointer drops a drop and the crown springs, as A does.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${defs(u)}
          ${lg(`${u}top`, [[0, 'oklch(0.97 0.006 250)'], [1, 'oklch(0.8 0.03 252)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, BLUE)}${lg(`${u}R`, BLUED)}</defs>
        <ellipse cx="64" cy="${f(GD.ty)}" rx="34" ry="22" fill="oklch(0.48 0.14 258)" opacity="0.45" filter="url(#${u}h)"/>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <ellipse cx="66" cy="${CY + 6}" rx="22" ry="9" fill="oklch(0.55 0.07 256)" opacity="0.4" filter="url(#${u}b)"/>
        ${crownArt(u, GD)}`;
      return run(svg, GD);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/>${embCrown(GD)}</svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Milk crown';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-milkcrown';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `milkcrown-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
