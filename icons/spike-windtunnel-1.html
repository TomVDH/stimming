<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Wind tunnel 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Wind tunnel 1</h1>
<p class="lede">Wind tunnel, round 1. A: a steel cylinder in bold smoke ribbons; the pointer lifts it and hover turns the wind up. D: a test-section block with a post on its floor; move across the flow to slide the post.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const path = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L');
  const TAU = Math.PI * 2;
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');

  // The toy's accent runs from cream smoke to a cool blue.
  const CREAM = 'oklch(0.96 0.02 85)', COOL = 'oklch(0.8 0.1 220)';

  // The potential-flow streamline that starts at height yi, at offset dx from a cylinder of radius R.
  const stream = (dx, yi, R) => {
    let y = yi + (Math.sign(yi) || 1) * R * 0.6;
    for (let i = 0; i < 8; i++) {
      const r2 = dx * dx + y * y;
      y -= (y - (y * R * R) / r2 - yi) / (1 - (R * R * (dx * dx - y * y)) / (r2 * r2));
    }
    return y;
  };
  // A whirl: a spiral of four half turns round (x, y); side picks the turn.
  const curl = (x, y, r, side) => {
    let d = `M${f(x + r)} ${f(y)}`;
    [1, -0.72, 0.46, -0.22].reduce((a, b) => {
      const rr = (r * (Math.abs(a) + Math.abs(b))) / 2;
      d += `A${f(rr)} ${f(rr)} 0 0 ${side} ${f(x + r * b)} ${f(y)}`;
      return b;
    });
    return d;
  };
  // One flow field: lines in, the wake wave and the whirls on its crests.
  // P holds the geometry; st holds cy (body place), ph (wake phase), amp (wind).
  const flow = (P, st) => {
    const lines = P.Y0.map(Y => {
      const yi = Y - st.cy, pts = [];
      for (let x = P.X0; x <= P.X1 + 0.01; x += 2) {
        const dx = x - P.CX;
        let y = st.cy + stream(dx, yi, P.R);
        // Behind the body the wake wave grows downstream, strongest near the axis.
        if (dx > 0) y += st.amp * P.WAVE * Math.min(1, dx / P.GROW) * Math.exp(-Math.abs(yi) / P.FALL) * Math.sin(dx * P.K - st.ph);
        pts.push([x, y]);
      }
      return pts;
    });
    const curls = [];
    for (let n = -1; n < 3; n++) for (const side of [0, 1]) {
      const dx = (Math.PI / 2 + side * Math.PI + st.ph + TAU * n) / P.K;
      if (dx < P.R + 6 || dx > P.X1 - P.CX - 4) continue;
      const grow = Math.min(1, dx / P.GROW), r = P.CR[0] + P.CR[1] * grow;
      const y = st.cy + (side ? 1 : -1) * (st.amp * P.WAVE * grow * 0.45 + 1);
      const op = clamp(Math.min((dx - P.R - 6) / 8, (P.X1 - P.CX - 4 - dx) / 10)) * (0.4 + 0.6 * st.amp);
      curls.push({ x: P.CX + dx, y, r, side, op });
    }
    return { lines, curls };
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    box: [10, 24, 108, 80],
    art(svg, u) {
      svg.innerHTML = `
        <defs><clipPath id="${u}clip"><rect x="10" y="24" width="108" height="80" rx="3"/></clipPath></defs>
        <rect x="10" y="24" width="108" height="80" rx="3" fill="oklch(0.07 0.012 255)"/>
        <g clip-path="url(#${u}clip)" fill="none" stroke="oklch(0.95 0.015 85)" stroke-linecap="round">
          <g class="lines" stroke-width="1.5">${[0.7, 0.8, 0.9, 1, 1, 0.9, 0.8, 0.7].map(o => `<path opacity="${o}"/>`).join('')}</g>
          <g class="curls" stroke-width="1.2">${'<path d="M0 0" opacity="0"/>'.repeat(6)}</g>
        </g>
        <g class="body">
          <circle cx="42" cy="64" r="10.5" fill="oklch(0.2 0.012 255)" stroke="oklch(0.92 0.02 85)" stroke-opacity="0.35"/>
          <path d="M32.1 60.4A10.5 10.5 0 0 1 45.6 54.1" fill="none" stroke="oklch(0.92 0.02 85)" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
          <path d="M42 64H49.9" stroke="oklch(0.92 0.02 85)" stroke-width="0.8" opacity="0.4"/>
        </g>`;
      const lines = [...svg.querySelectorAll('.lines path')], curls = [...svg.querySelectorAll('.curls path')], body = svg.querySelector('.body');
      const CX = 42, R = 10.5, X0 = 14, X1 = 114;
      const Y0 = [32, 41, 50, 58.5, 69.5, 78, 87, 96], REST = { cy: 64, ph: 0.9, amp: 0.6 };
      const st = { ...REST };
      const draw = () => {
        lines.forEach((p, i) => {
          const yi = Y0[i] - st.cy;
          let d = '';
          for (let x = X0; x <= X1; x += 3) {
            const dx = x - CX;
            let y = st.cy + stream(dx, yi, R);
            if (dx > 0) y += st.amp * 8 * Math.min(1, dx / 34) * Math.exp(-Math.abs(yi) / 15) * Math.sin(dx * 0.17 - st.ph);
            d += `${x === X0 ? 'M' : 'L'}${f(x)} ${f(y)}`;
          }
          p.setAttribute('d', d);
        });
        let k = 0;
        for (let n = -1; n < 3; n++) for (const side of [0, 1]) {
          const dx = (Math.PI / 2 + side * Math.PI + st.ph + TAU * n) / 0.17;
          if (dx < 10 || dx > X1 - CX - 6 || k >= curls.length) continue;
          const grow = Math.min(1, dx / 34), r = 2.6 + 3 * grow;
          const y = st.cy + (side ? 1 : -1) * (st.amp * 8 * grow * 0.6 + 1.5);
          curls[k].setAttribute('d', curl(CX + dx, y, r, side));
          curls[k++].setAttribute('opacity', f(Math.max(0, Math.min(1, (dx - 10) / 8, (X1 - CX - 6 - dx) / 10)) * st.amp));
        }
        for (; k < curls.length; k++) curls[k].setAttribute('opacity', '0');
        body.setAttribute('transform', `translate(0 ${f(st.cy - 64)})`);
      };
      draw();
      let wind = null;
      return {
        enter() {
          wind ||= gsap.to(st, { ph: `+=${TAU}`, duration: 1.8, ease: 'none', repeat: -1, onUpdate: draw });
          gsap.to(st, { amp: 1, duration: 0.6, ease: 'power2.out', overwrite: 'auto' });
        },
        move(p) { if (p) gsap.to(st, { cy: clamp(p[1], 46, 82), duration: 0.5, ease: 'power2.out', overwrite: 'auto', onUpdate: draw }); },
        leave() {
          wind?.kill(); wind = null;
          const ph = st.ph + ((((REST.ph - st.ph) % TAU) + TAU) % TAU);
          gsap.to(st, { cy: REST.cy, amp: REST.amp, ph, duration: 0.8, ease: 'power2.out', overwrite: true, onUpdate: draw });
        },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // A steel cylinder, seen end on, in six bold smoke ribbons.
  const A = { CX: 40, R: 17, X0: 8, X1: 120, Y0: [27, 41, 54, 74, 87, 101], WAVE: 7, GROW: 40, FALL: 18, K: 0.13, CR: [3, 3] };
  const A_REST = { cy: 64, ph: 0.9, amp: 0.6 };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [6, 22, 116, 84],
    idea: 'A steel cylinder, end on, in six bold smoke ribbons that run from cream to the toy\'s cool blue. The wake waves and rolls into whirls. The pointer lifts and lowers the cylinder; hover turns the wind up and the street flows.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 3)}
          ${lg(`${u}smoke`, [[0, CREAM], [0.45, CREAM], [1, COOL]], `gradientUnits="userSpaceOnUse" x1="${A.X0}" y1="0" x2="${A.X1}" y2="0"`)}
          ${lg(`${u}steel`, [[0, 'oklch(0.74 0.05 228)'], [0.55, 'oklch(0.5 0.06 244)'], [1, 'oklch(0.3 0.05 258)']], 'x1="0.15" y1="0" x2="0.85" y2="1"')}
          ${lg(`${u}hub`, [[0, 'oklch(0.34 0.04 255)'], [1, 'oklch(0.58 0.05 235)']], 'x1="0.2" y1="0" x2="0.8" y2="1"')}</defs>
        <g class="lines" fill="none" stroke="url(#${u}smoke)" stroke-width="4.4" stroke-linecap="round">${A.Y0.map(() => '<path/>').join('')}</g>
        <g class="curls" fill="none" stroke="url(#${u}smoke)" stroke-width="3" stroke-linecap="round">${'<path/>'.repeat(6)}</g>
        <g class="body">
          <circle cx="${A.CX}" cy="64" r="${A.R}" fill="url(#${u}steel)"/>
          <circle cx="${A.CX}" cy="64" r="${A.R}" fill="url(#${u}lit)"/>
          <circle cx="${A.CX}" cy="64" r="${A.R - 1}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
          <circle cx="${A.CX}" cy="64" r="6" fill="url(#${u}hub)"/>
        </g>`;
      const lines = [...svg.querySelectorAll('.lines path')], curls = [...svg.querySelectorAll('.curls path')], body = svg.querySelector('.body');
      const st = { ...A_REST };
      const draw = () => {
        const fl = flow(A, st);
        fl.lines.forEach((pts, i) => lines[i].setAttribute('d', path(pts)));
        curls.forEach((p, i) => {
          const c = fl.curls[i];
          p.setAttribute('d', c ? curl(c.x, c.y, c.r, c.side) : 'M0 0');
          p.setAttribute('opacity', c ? f(c.op) : 0);
        });
        body.setAttribute('transform', `translate(0 ${f(st.cy - 64)})`);
      };
      draw();
      let wind = null;
      return {
        enter(p) {
          // The wind comes up and the street flows downstream.
          wind ||= gsap.to(st, { ph: `+=${TAU}`, duration: 1.6, ease: 'none', repeat: -1, onUpdate: draw });
          gsap.to(st, { amp: 1, duration: 0.6, ease: 'power2.out', overwrite: 'auto' });
          // With no pointer, the cylinder bobs by itself.
          if (!p) gsap.to(st, { cy: 56, duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: -1 });
        },
        move(p) {
          if (!p) return;
          // The cylinder follows the pointer up and down, inside the ribbons.
          gsap.to(st, { cy: clamp(p[1], 52, 76), duration: 0.5, ease: 'power2.out', overwrite: 'auto' });
        },
        leave() {
          // The wind drops; the street settles on its resting frame.
          wind?.kill(); wind = null;
          const ph = st.ph + ((((A_REST.ph - st.ph) % TAU) + TAU) % TAU);
          gsap.to(st, { cy: A_REST.cy, amp: A_REST.amp, ph, duration: 0.8, ease: 'power2.out', overwrite: true, onUpdate: draw });
        },
      };
    },
    emblem: (() => {
      const fl = flow(A, A_REST);
      const lines = fl.lines.map(path).join('');
      const curls = fl.curls.map(c => `<path d="${curl(c.x, c.y, c.r, c.side)}" stroke-opacity="${f(c.op)}"/>`).join('');
      return `${EMB_HEAD}<g fill="none" stroke="#fff" stroke-linecap="round"><path d="${lines}" stroke-width="4.4"/><g stroke-width="3">${curls}</g></g><circle cx="${A.CX}" cy="64" r="${A.R + 3}" fill="#000"/><circle cx="${A.CX}" cy="64" r="${A.R}" fill="#fff"/><circle cx="${A.CX}" cy="64" r="6" fill="#000"/></svg>`;
    })(),
  });

  /* ================= D: Isometric block ================= */

  // The test section as a block: a steel frame round a dark floor window.
  // Grid x runs with the wind, grid y across it; 30 degree view.
  const iso = (gx, gy, h = 0) => [64 + (gx - gy) * 0.52, 60 + (gx + gy - 128) * 0.3 - h];
  const G0 = 14, G1 = 114, M = 10, T = 14, H = 26;
  const W0 = G0 + M, W1 = G1 - M;
  // The flow in grid units; the post stands at grid x 46.
  const D = { CX: 46, R: 10, X0: W0 - 2, X1: W1 + 2, Y0: [36, 51, 77, 92], WAVE: 7, GROW: 34, FALL: 20, K: 0.15, CR: [2.6, 3] };
  const D_REST = { cy: 64, ph: 0.9, amp: 0.6 };
  const D_CORNERS = [[G0, G0], [G1, G0], [G1, G1], [G0, G1]].map(([x, y]) => iso(x, y));
  const D_WIN = [[W0, W0], [W1, W0], [W1, W1], [W0, W1]].map(([x, y]) => iso(x, y));
  const down = p => [p[0], p[1] + T];
  // A circle on the floor projects to an ellipse with these radii.
  const PRX = D.R * 0.52 * Math.SQRT2, PRY = D.R * 0.3 * Math.SQRT2;
  // The post: a body from the floor to its cap, and the cap ellipse.
  const post = gy => {
    const [bx, by] = iso(D.CX, gy), ty = by - H;
    return {
      body: `M${f(bx - PRX)} ${f(ty)}V${f(by)}A${f(PRX)} ${f(PRY)} 0 0 0 ${f(bx + PRX)} ${f(by)}V${f(ty)}Z`,
      cap: [bx, ty],
    };
  };
  // The flow field in grid units, then projected onto the floor.
  const dFlow = st => {
    const fl = flow(D, st);
    return {
      lines: fl.lines.map(pts => pts.map(([gx, gy]) => iso(gx, gy))),
      curls: fl.curls.map(c => ({ ...c, pts: spiral(c) })),
    };
  };
  // A whirl on the floor: spiral points in grid units, projected.
  const spiral = c => {
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const t = i / 40, a = t * TAU * 1.75 * (c.side ? 1 : -1), r = c.r * (1 - t * 0.8);
      pts.push(iso(c.x + Math.cos(a) * r, c.y + Math.sin(a) * r));
    }
    return pts;
  };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [12, 20, 104, 84],
    idea: 'The test section as a block: a light steel frame round a dark floor window, a blue smoke rake at the inlet edge, a steel post on the floor. Ribbons part round the post and roll into whirls. Move across the flow to slide the post; hover turns the wind up.',
    art(svg, u) {
      const [c0, c1, c2, c3] = D_CORNERS;
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}
          ${lg(`${u}frame`, [[0, 'oklch(0.84 0.025 235)'], [1, 'oklch(0.66 0.035 245)']], 'x1="0" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}win`, [[0, 'oklch(0.09 0.012 255)'], [1, 'oklch(0.17 0.02 250)']], 'x1="0" y1="0" x2="0.4" y2="1"')}
          ${lg(`${u}smoke`, [[0, CREAM], [0.5, CREAM], [1, COOL]], `gradientUnits="userSpaceOnUse" x1="${f(D_WIN[0][0])}" y1="${f(D_WIN[0][1])}" x2="${f(D_WIN[2][0] + 30)}" y2="${f(D_WIN[2][1] - 10)}"`)}
          ${lg(`${u}steel`, [[0, 'oklch(0.76 0.05 228)'], [0.5, 'oklch(0.52 0.06 244)'], [1, 'oklch(0.3 0.05 258)']], 'x1="0" y1="0" x2="1" y2="0"')}
          <clipPath id="${u}clip"><path d="${poly(D_WIN)}"/></clipPath></defs>
        <path d="${poly([c1, c2, c3, down(c3), down(c2), down(c1)])}" fill="oklch(0.05 0.01 260)" opacity="0.45" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${poly([c3, c2, down(c2), down(c3)])}" fill="oklch(0.5 0.04 246)"/>
        <path d="${poly([c2, c1, down(c1), down(c2)])}" fill="oklch(0.33 0.035 256)"/>
        <path d="${poly([c0, c1, c2, c3])}" fill="url(#${u}frame)"/>
        <path d="${poly([c0, c1, c2, c3])}" fill="url(#${u}lit)" opacity="0.4"/>
        <path d="M${f(c3[0])} ${f(c3[1])}L${f(c2[0])} ${f(c2[1])}L${f(c1[0])} ${f(c1[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="1.5" fill="none"/>
        <path d="${poly(D_WIN)}" fill="url(#${u}win)"/>
        <path d="${path([iso(W0, W0 + 2, 0), iso(W0, W1 - 2, 0)])}" stroke="${COOL}" stroke-width="4" stroke-linecap="round" transform="translate(-2 -1)"/>
        <g clip-path="url(#${u}clip)">
          <g class="lines" fill="none" stroke="url(#${u}smoke)" stroke-width="3.6" stroke-linecap="round">${D.Y0.map(() => '<path/>').join('')}</g>
          <g class="curls" fill="none" stroke="url(#${u}smoke)" stroke-width="2.6" stroke-linecap="round">${'<path/>'.repeat(6)}</g>
        </g>
        <g class="post">
          <ellipse class="foot" rx="${f(PRX + 3)}" ry="${f(PRY + 2)}" fill="oklch(0.05 0.01 260)" opacity="0.6" filter="url(#${u}b)"/>
          <path class="pb" fill="url(#${u}steel)"/>
          <path class="pl" fill="url(#${u}lit)" opacity="0.7"/>
          <ellipse class="pc" rx="${f(PRX)}" ry="${f(PRY)}" fill="oklch(0.8 0.04 228)"/>
          <ellipse class="pr" rx="${f(PRX - 0.8)}" ry="${f(PRY - 0.5)}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
        </g>`;
      const q = s => svg.querySelector(s);
      const lines = [...svg.querySelectorAll('.lines path')], curls = [...svg.querySelectorAll('.curls path')];
      const [foot, pb, pl, pc, pr] = ['.foot', '.pb', '.pl', '.pc', '.pr'].map(q);
      const st = { ...D_REST };
      const draw = () => {
        const fl = dFlow(st);
        fl.lines.forEach((pts, i) => lines[i].setAttribute('d', path(pts)));
        curls.forEach((p, i) => {
          const c = fl.curls[i];
          p.setAttribute('d', c ? path(c.pts) : 'M0 0');
          p.setAttribute('opacity', c ? f(c.op) : 0);
        });
        const P = post(st.cy), [bx, by] = iso(D.CX, st.cy);
        foot.setAttribute('cx', f(bx + 1.5)); foot.setAttribute('cy', f(by + 1));
        pb.setAttribute('d', P.body); pl.setAttribute('d', P.body);
        [pc, pr].forEach(e => { e.setAttribute('cx', f(P.cap[0])); e.setAttribute('cy', f(P.cap[1])); });
      };
      draw();
      // The pointer's grid y on the floor, from its screen place.
      const across = p => {
        const a = (p[0] - 64) / 0.52, b = (p[1] - 60) / 0.3 + 128;
        return (b - a) / 2;
      };
      let wind = null, bob = null;
      return {
        enter(p) {
          wind ||= gsap.to(st, { ph: `+=${TAU}`, duration: 1.6, ease: 'none', repeat: -1, onUpdate: draw });
          gsap.to(st, { amp: 1, duration: 0.6, ease: 'power2.out', overwrite: 'auto' });
          // With no pointer, the post slides to and fro by itself.
          if (!p) bob = gsap.fromTo(st, { cy: 56 }, { cy: 72, duration: 1.2, ease: 'sine.inOut', yoyo: true, repeat: -1 });
        },
        move(p) {
          if (!p) return;
          bob?.kill(); bob = null;
          // The post slides across the flow under the pointer.
          gsap.to(st, { cy: clamp(across(p), 50, 78), duration: 0.5, ease: 'power2.out', overwrite: 'auto' });
        },
        leave() {
          bob?.kill(); bob = null;
          wind?.kill(); wind = null;
          const ph = st.ph + ((((D_REST.ph - st.ph) % TAU) + TAU) % TAU);
          gsap.to(st, { cy: D_REST.cy, amp: D_REST.amp, ph, duration: 0.8, ease: 'power2.out', overwrite: true, onUpdate: draw });
        },
      };
    },
    emblem: (() => {
      const [c0, c1, c2, c3] = D_CORNERS;
      const fl = dFlow(D_REST), P = post(64);
      const lines = fl.lines.map(path).join('');
      const curls = fl.curls.map(c => `<path d="${path(c.pts)}" stroke-opacity="${f(c.op)}"/>`).join('');
      return `${EMB_HEAD}<path d="${poly([c3, c2, down(c2), down(c3)])}" fill="#5a5a5a"/><path d="${poly([c2, c1, down(c1), down(c2)])}" fill="#3a3a3a"/><path d="${poly([c0, c1, c2, c3])}" fill="#9a9a9a"/><path d="${poly(D_WIN)}" fill="#000"/><g fill="none" stroke="#fff" stroke-linecap="round"><path d="${lines}" stroke-width="3.6"/><g stroke-width="2.6">${curls}</g></g><path d="${P.body}" fill="#fff"/><ellipse cx="${f(P.cap[0])}" cy="${f(P.cap[1])}" rx="${f(PRX)}" ry="${f(PRY)}" fill="#fff"/></svg>`;
    })(),
  });

  /* ================= Gallery ================= */
  const NAME = 'Wind tunnel';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-windtunnel';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `windtunnel-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
