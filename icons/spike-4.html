<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 4</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.dir header b { font-size: 15px; font-weight: 800; color: var(--fg); }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<h1>Icon spike 4</h1>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2, PI = Math.PI;
  const f = n => +(+n).toFixed(2);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).join('\n')}\n</svg>\n`;
  const pts = a => a.map(p => `${f(p[0])} ${f(p[1])}`).join('L');
  const poly = a => 'M' + pts(a) + 'Z';
  const line = a => 'M' + pts(a);
  // Seeded noise keeps every load the same.
  const rng = seed => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };

  const DIRS = [];

  /* ================= Neon sign ================= */

  // Current: the menu's crescent tube; it sputters on hover.
  DIRS.push({
    toy: 'neon', l: 'Current', file: '../shared/emblems/neon.svg',
    art(svg, u) {
      svg.innerHTML = `
        <defs><linearGradient id="${u}t" gradientUnits="userSpaceOnUse" x1="20" y1="22" x2="92" y2="104"><stop offset="0" stop-color="oklch(0.86 0.16 98)"/><stop offset="1" stop-color="oklch(0.74 0.15 80)"/></linearGradient></defs>
        <g transform="translate(64 64) scale(0.78) rotate(-14) translate(-64 -64)">
          <path d="M84 22A46 46 0 1 0 92 98A36 36 0 1 1 84 22Z" fill="none" style="stroke: var(--bg)" stroke-width="15" stroke-linejoin="round"/>
          <g class="lit">
            <path d="M84 22A46 46 0 1 0 92 98A36 36 0 1 1 84 22Z" fill="none" stroke="url(#${u}t)" stroke-width="8" stroke-linejoin="round"/>
            <path d="M84 22A46 46 0 1 0 92 98A36 36 0 1 1 84 22Z" fill="none" stroke="oklch(0.99 0.06 100 / 0.85)" stroke-width="2.2" stroke-linejoin="round" transform="translate(-1.2 -1.2)"/>
          </g>
        </g>`;
      const lit = svg.querySelector('.lit');
      return hoverLoop(
        () => gsap.timeline({ repeat: -1 })
          .to(lit, { keyframes: [
            { opacity: 0.25, duration: 0.05 }, { opacity: 1, duration: 0.04 }, { opacity: 0.55, duration: 0.07 },
            { opacity: 1, duration: 0.6 }, { opacity: 0.1, duration: 0.04 }, { opacity: 0.85, duration: 0.05 },
            { opacity: 0.35, duration: 0.03 }, { opacity: 1, duration: 1.1 },
          ], ease: 'none' }),
        () => gsap.set(lit, { opacity: 1 }));
    },
  });

  // A five-point star, rounded by the tube joins.
  const star = (cx, cy, R, r) => poly(Array.from({ length: 10 }, (_, k) => {
    const a = -PI / 2 + (k * PI) / 5, q = k % 2 ? r : R;
    return [cx + q * Math.cos(a), cy + q * Math.sin(a)];
  }));
  const STAR = star(64, 76, 27, 12);

  // A: a sign box hung on two chains; the pointer sets it swinging.
  DIRS.push({
    toy: 'neon', l: 'A', name: 'Shaded object',
    art(svg, u) {
      svg.innerHTML = `
        <defs>
          <linearGradient id="${u}box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.31 0.035 290)"/><stop offset="1" stop-color="oklch(0.19 0.02 280)"/></linearGradient>
          <linearGradient id="${u}st" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.74 0.02 260)"/><stop offset="1" stop-color="oklch(0.44 0.02 260)"/></linearGradient>
          <linearGradient id="${u}t" gradientUnits="userSpaceOnUse" x1="40" y1="50" x2="88" y2="100"><stop offset="0" stop-color="oklch(0.82 0.16 355)"/><stop offset="1" stop-color="oklch(0.64 0.23 348)"/></linearGradient>
        </defs>
        <rect x="18" y="8" width="92" height="6" rx="3" fill="url(#${u}st)"/>
        <circle cx="24" cy="11" r="1.4" style="fill: var(--bg)"/><circle cx="104" cy="11" r="1.4" style="fill: var(--bg)"/>
        <g class="sw">
          <path d="M40 14V37M88 14V37" fill="none" stroke="oklch(0.62 0.02 260)" stroke-width="2.6" stroke-dasharray="3.4 1.8"/>
          <rect x="14" y="36" width="100" height="78" rx="8" fill="url(#${u}box)"/>
          <rect x="14" y="36" width="100" height="78" rx="8" fill="url(#lit)" opacity="0.35"/>
          <rect x="14" y="36" width="100" height="78" rx="8" fill="none" stroke="url(#rim)" stroke-width="1.2"/>
          <path d="${STAR}" fill="none" stroke="url(#${u}t)" stroke-width="6.5" stroke-linejoin="round"/>
          <path d="${STAR}" fill="none" stroke="oklch(0.97 0.05 350 / 0.85)" stroke-width="1.8" stroke-linejoin="round" transform="translate(-0.9 -0.9)"/>
          <rect x="54.5" y="83" width="5" height="7" rx="1" fill="oklch(0.3 0.02 280)"/>
          <rect x="68.5" y="83" width="5" height="7" rx="1" fill="oklch(0.3 0.02 280)"/>
        </g>`;
      const sw = svg.querySelector('.sw');
      // A damped spring swings the box about the bar.
      const st = { a: 0, v: 0, on: false, last: null };
      const tick = (t, dt) => {
        const s = Math.min(dt, 50) / 1000;
        st.v += (-90 * st.a - 3.2 * st.v) * s;
        st.a = clamp(st.a + st.v * s, -12, 12);
        sw.setAttribute('transform', `rotate(${f(st.a)} 64 11)`);
        if (!st.on && Math.abs(st.a) < 0.04 && Math.abs(st.v) < 0.1) { st.a = st.v = 0; sw.removeAttribute('transform'); gsap.ticker.remove(tick); st.run = false; }
      };
      const wake = () => { if (!st.run) { st.run = true; gsap.ticker.add(tick); } };
      return {
        enter(p) { st.on = true; st.last = p; st.v += p ? (p[0] < 64 ? -26 : 26) : 30; wake(); },
        move(p) { if (p && st.last) st.v += (p[0] - st.last[0]) * 2.6; st.last = p; wake(); },
        leave() { st.on = false; st.last = null; wake(); },
      };
    },
    emblem: emb(`
      <rect x="18" y="8" width="92" height="7" rx="3.5" fill="#fff"/>
      <path d="M40 14V37M88 14V37" stroke="#fff" stroke-width="4"/>
      <rect x="14" y="36" width="100" height="78" rx="8" fill="#fff"/>
      <path d="${STAR}" fill="none" stroke="#000" stroke-width="6.5" stroke-linejoin="round"/>
    `),
  });

  // B: a steel plate with an arrow channel cut through; bridges hold the plate.
  {
    const A0 = [19, 31], RAD = 26, BR = 4;
    const L1 = 51, L2 = (PI * RAD) / 2, L3 = 31;
    const LEN = L1 + L2 + L3;
    // A point along the shaft: run right, bend down, run down.
    const at = s => {
      if (s <= L1) return [A0[0] + s, A0[1]];
      if (s <= L1 + L2) { const a = -PI / 2 + (s - L1) / RAD; return [A0[0] + L1 + RAD * Math.cos(a), A0[1] + RAD + RAD * Math.sin(a)]; }
      return [A0[0] + L1 + RAD, A0[1] + RAD + (s - L1 - L2)];
    };
    const seg = (s0, s1) => {
      const n = Math.max(1, Math.ceil((s1 - s0) / 2));
      return line(Array.from({ length: n + 1 }, (_, k) => at(s0 + ((s1 - s0) * k) / n)));
    };
    const NSEG = 5, SL = (LEN - (NSEG - 1) * BR) / NSEG;
    const SEGS = Array.from({ length: NSEG }, (_, k) => seg(k * (SL + BR), k * (SL + BR) + SL));
    const HEAD = 'M80 90L96 106L112 90';
    const ALL = [...SEGS, HEAD];
    DIRS.push({
      toy: 'neon', l: 'B', name: 'Stencil cut-out',
      art(svg, u) {
        svg.innerHTML = `
          <defs><linearGradient id="${u}pl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.84 0.025 255)"/><stop offset="1" stop-color="oklch(0.58 0.045 270)"/></linearGradient></defs>
          <rect x="9" y="9" width="110" height="110" rx="8" fill="url(#${u}pl)"/>
          ${ALL.map(d => `<path d="${d}" fill="none" style="stroke: var(--bg)" stroke-width="12" stroke-linejoin="miter"/>`).join('')}
          ${ALL.map(d => `<path d="${d}" fill="none" stroke="oklch(0.36 0.07 350)" stroke-width="3.6"/>`).join('')}
          <g class="lit">${ALL.map(d => `<path d="${d}" fill="none" stroke="oklch(0.78 0.19 352)" stroke-width="3.6"/>`).join('')}</g>`;
        const lit = [...svg.querySelectorAll('.lit path')];
        // The arrow lights one section at a time, tail to head.
        return hoverLoop(
          () => {
            const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5 });
            tl.set(lit, { opacity: 0 }, 0.15);
            lit.forEach((p, k) => tl.set(p, { opacity: 1 }, 0.3 + k * 0.13));
            return tl.to({}, { duration: 0.5 });
          },
          () => gsap.set(lit, { opacity: 1 }));
      },
      emblem: emb(`
        <rect x="9" y="9" width="110" height="110" rx="8" fill="#fff"/>
        <path d="${ALL.join('')}" fill="none" stroke="#000" stroke-width="13" stroke-linejoin="miter"/>
      `),
    });
  }

  // C: a coiled tube in one hairline weight; the pointer picks the gas.
  {
    const a = 4.4, b = 13, h = 21, y0 = 54;
    const X = t => 64 - a * 4 * PI + a * t - b * Math.sin(t);
    const P = t => [X(t), y0 - h * Math.cos(t)];
    // Half-loop pieces draw in order, so each crossing reads as over-under.
    const PIECES = [];
    const start = P(PI), end = P(7 * PI);
    PIECES.push(line([[start[0], start[1] + 24], start]));
    for (let k = 1; k < 7; k++) PIECES.push(line(Array.from({ length: 25 }, (_, i) => P(k * PI + (PI * i) / 24))));
    PIECES.push(line([end, [end[0], end[1] + 24]]));
    const ELEC = [start[0], end[0]].map(x => [x - 3.5, start[1] + 24]);
    const GAS = ['oklch(0.72 0.2 35)', 'oklch(0.78 0.17 355)', 'oklch(0.74 0.16 305)', 'oklch(0.76 0.13 240)', 'oklch(0.86 0.17 145)'];
    const tube = (outer, inner, wo, wi) => PIECES.map(d =>
      `<path d="${d}" fill="none" ${outer} stroke-width="${wo}" stroke-linejoin="round"/><path d="${d}" fill="none" ${inner} stroke-width="${wi}" stroke-linejoin="round"/>`).join('');
    DIRS.push({
      toy: 'neon', l: 'C', name: 'Single-weight line',
      art(svg) {
        const ln = 'stroke="oklch(0.66 0.025 275)" stroke-width="1.5"';
        svg.innerHTML = `
          <g class="gas" style="color: ${GAS[0]}">${tube('stroke="currentColor"', 'style="stroke: var(--bg)"', 7, 4)}</g>
          ${ELEC.map(([x, y]) => `<rect x="${f(x)}" y="${f(y)}" width="7" height="12" rx="1.5" fill="none" ${ln}/><path d="M${f(x + 3.5)} ${f(y + 12)}V${f(y + 22)}" fill="none" ${ln}/>`).join('')}
          <path d="M${f(ELEC[0][0] + 3.5)} ${f(ELEC[0][1] + 22)}H${f(ELEC[1][0] + 3.5)}" fill="none" ${ln} stroke-dasharray="2 3"/>`;
        const g = svg.querySelector('.gas');
        let cur = 0;
        const pick = k => { if (k === cur) return; cur = k; gsap.to(g, { color: GAS[k], duration: 0.3, ease: 'power2.out', overwrite: true }); };
        const fromX = p => pick(clamp(Math.floor(((p[0] - 12) / 104) * GAS.length), 0, GAS.length - 1));
        return { enter: p => (p ? fromX(p) : pick(3)), move: p => p && fromX(p), leave: () => pick(0) };
      },
      emblem: emb(`
        ${tube('stroke="#fff"', 'stroke="#000"', 12, 4.6)}
        ${ELEC.map(([x, y]) => `<rect x="${f(x - 1)}" y="${f(y)}" width="9" height="13" rx="2" fill="#fff"/><path d="M${f(x + 3.5)} ${f(y + 12)}V${f(y + 22)}" stroke="#fff" stroke-width="3.6"/>`).join('')}
      `),
    });
  }

  // D: an isometric block of brick wall with a tube on its long face; a knock rattles it.
  {
    const L = 72, D = 22, H = 44, cx = 42.4, cy = 62.5, c = 0.866;
    const P = (x, y, z) => [cx + (x - z) * c, cy + (x + z) * 0.5 - y];
    const TOP = poly([P(0, H, 0), P(L, H, 0), P(L, H, D), P(0, H, D)]);
    const LONG = poly([P(0, H, D), P(L, H, D), P(L, 0, D), P(0, 0, D)]);
    const SHORT = poly([P(L, H, D), P(L, H, 0), P(L, 0, 0), P(L, 0, D)]);
    // Face frames: u runs along the face, v runs down from the top.
    const MLONG = `matrix(${c} 0.5 0 1 ${f(cx - c * D)} ${f(cy + 0.5 * D - H)})`;
    const MSHORT = `matrix(${-c} 0.5 0 1 ${f(cx + c * L)} ${f(cy + 0.5 * L - H)})`;
    const course = 8.8, brick = 18;
    const mortar = w => {
      let d = '';
      for (let k = 1; k < 5; k++) d += `M0 ${f(k * course)}H${w}`;
      for (let k = 0; k < 5; k++) for (let x = (k % 2 ? brick / 2 : brick); x < w - 1; x += brick) d += `M${f(x)} ${f(k * course)}V${f((k + 1) * course)}`;
      return d;
    };
    const TUBE = 'M10 31C16 8 26 8 30 21S42 36 47 22S58 8 63 18';
    DIRS.push({
      toy: 'neon', l: 'D', name: 'Isometric block',
      art(svg, u) {
        svg.innerHTML = `
          <defs>
            <linearGradient id="${u}lf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.47 0.11 33)"/><stop offset="1" stop-color="oklch(0.36 0.09 30)"/></linearGradient>
            <linearGradient id="${u}tb" gradientUnits="userSpaceOnUse" x1="10" y1="8" x2="63" y2="31"><stop offset="0" stop-color="oklch(0.9 0.12 195)"/><stop offset="1" stop-color="oklch(0.74 0.15 215)"/></linearGradient>
          </defs>
          <g class="blk">
            <path d="${TOP}" fill="oklch(0.58 0.08 40)"/>
            <path d="${LONG}" fill="url(#${u}lf)"/>
            <path d="${SHORT}" fill="oklch(0.3 0.07 30)"/>
            <path d="${mortar(L)}" transform="${MLONG}" fill="none" stroke="oklch(0.24 0.03 30)" stroke-width="1.3"/>
            <path d="${mortar(D)}" transform="${MSHORT}" fill="none" stroke="oklch(0.2 0.03 30)" stroke-width="1.3"/>
            <path d="${line([P(0, H, D), P(L, H, D), P(L, H, 0)])}M${pts([P(L, H, D)])}L${pts([P(L, 0, D)])}" fill="none" stroke="url(#rim)" stroke-width="1"/>
            <g transform="${MLONG}"><g class="tube">
              <path d="${TUBE}" fill="none" stroke="url(#${u}tb)" stroke-width="5" stroke-linecap="round"/>
              <path d="${TUBE}" fill="none" stroke="oklch(0.98 0.04 200 / 0.85)" stroke-width="1.4" stroke-linecap="round" transform="translate(-0.6 -0.8)"/>
              <rect x="7.5" y="31" width="5" height="5" rx="1" fill="oklch(0.22 0.02 270)"/>
              <rect x="60.5" y="17" width="5" height="5" rx="1" transform="rotate(-50 63 19.5)" fill="oklch(0.22 0.02 270)"/>
            </g></g>
          </g>`;
        const blk = svg.querySelector('.blk'), tube = svg.querySelector('.tube');
        // A knock jolts the block; the tube rocks on its clips and settles.
        return hoverLoop(
          () => gsap.timeline({ repeat: -1, repeatDelay: 0.55 })
            .to(blk, { keyframes: [{ x: 1.6, y: -0.6, duration: 0.04 }, { x: -1.2, y: 0.4, duration: 0.05 }, { x: 0.5, y: 0, duration: 0.05 }, { x: 0, duration: 0.06 }] }, 0)
            .fromTo(tube, { rotation: 7, svgOrigin: '36 21' }, { rotation: 0, svgOrigin: '36 21', duration: 1.1, ease: 'elastic.out(1.2, 0.18)' }, 0.02),
          () => { gsap.to(blk, { x: 0, y: 0, duration: 0.2, overwrite: true }); gsap.to(tube, { rotation: 0, svgOrigin: '36 21', duration: 0.3, overwrite: true }); });
      },
      emblem: emb(`
        <path d="${TOP}" fill="#fff"/>
        <path d="${LONG}" fill="#fff"/>
        <path d="${SHORT}" fill="#fff"/>
        <path d="${line([P(0, H, D), P(L, H, D), P(L, H, 0)])}M${pts([P(L, H, D)])}L${pts([P(L, 0, D)])}" fill="none" stroke="#000" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="${mortar(D)}" transform="${MSHORT}" fill="none" stroke="#000" stroke-width="2"/>
        <path d="${TUBE}" transform="${MLONG}" fill="none" stroke="#000" stroke-width="5.5" stroke-linecap="round"/>
      `),
    });
  }

  // E: the tube reduced to one bold meander between two electrodes.
  {
    const MEANDER = 'M28 100V40A14 14 0 0 1 56 40V88A14 14 0 0 0 84 88V40A14 14 0 0 1 112 40V100';
    const CAPS = [[21, 100], [105, 100]];
    DIRS.push({
      toy: 'neon', l: 'E', name: 'Abstract mark',
      art(svg, u) {
        svg.innerHTML = `

            ${CR.rad.map(d => `<path d="${d}" pathLength="1" stroke-dasharray="${R0} 2"/>`).join('')}
          </g>
          <g transform="${tf}"><path d="M2 -4H-50V4H2Z" fill="#fff"/><path d="M-66 -16H-50V16H-66Z" fill="#fff"/></g>
        `);
      })(),
    });
  }

  // D: an isometric glass slab; the pieces lift and part along the cracks.
  {
    const R = 30, Yc = 54, T = 11, C0 = [0.12, -0.08];
    const P = (u, v, h) => [64 + (u - v) * 0.866 * R, Yc + (u + v) * 0.5 * R - h];
    const ANG = [-80, -15, 40, 100, 165, 220].map(d => (d * PI) / 180);
    const hit = a => {
      const dx = Math.cos(a), dy = Math.sin(a);
      const ts = [dx > 0 ? (1 - C0[0]) / dx : dx < 0 ? (-1 - C0[0]) / dx : Infinity, dy > 0 ? (1 - C0[1]) / dy : dy < 0 ? (-1 - C0[1]) / dy : Infinity];
      const t = Math.min(...ts);
      return [C0[0] + dx * t, C0[1] + dy * t];
    };
    const norm = a => ((a % TAU) + TAU) % TAU;
    const corners = [[1, 1], [-1, 1], [-1, -1], [1, -1]].map(p => ({ p, a: Math.atan2(p[1] - C0[1], p[0] - C0[0]) }));
    const PIECES = ANG.map((a0, k) => {
      const a1 = ANG[(k + 1) % ANG.length] + (k === ANG.length - 1 ? TAU : 0);
      const mid = corners.filter(c => norm(c.a - a0) < norm(a1 - a0)).sort((x, y) => norm(x.a - a0) - norm(y.a - a0)).map(c => c.p);
      const q = [C0, hit(a0), ...mid, hit(a1)];
      const c = q.reduce((s, p) => [s[0] + p[0] / q.length, s[1] + p[1] / q.length], [0, 0]);
      const d = Math.hypot(c[0] - C0[0], c[1] - C0[1]);
      return { q, c, dir: [(c[0] - C0[0]) / d, (c[1] - C0[1]) / d], lift: 5 + (k % 3) * 3 };
    }).sort((a, b) => a.c[0] + a.c[1] - (b.c[0] + b.c[1]));
    // One piece: its visible sides, then its top.
    const pieceD = (pc, s) => {
      const o = [pc.dir[0] * 0.17 * s, pc.dir[1] * 0.17 * s], h = pc.lift * s;
      const q = pc.q.map(p => [p[0] + o[0], p[1] + o[1]]);
      // The quad winds clockwise in uv, so outward normals point right of each edge.
      const sideA = [], sideB = [];
      q.forEach((a, i) => {
        const b = q[(i + 1) % q.length], nu = b[1] - a[1], nv = -(b[0] - a[0]);
        if (nu + nv <= 1e-6) return;
        (nu > nv ? sideA : sideB).push(poly([P(a[0], a[1], h), P(b[0], b[1], h), P(b[0], b[1], h + T), P(a[0], a[1], h + T)]));
      });
      return { a: sideA.join(''), b: sideB.join(''), top: poly(q.map(p => P(p[0], p[1], h + T))) };
    };
    // Winding check: flip the order when the area is negative.
    PIECES.forEach(pc => {
      let A = 0;
      pc.q.forEach((a, i) => { const b = pc.q[(i + 1) % pc.q.length]; A += a[0] * b[1] - b[0] * a[1]; });
      if (A < 0) pc.q.reverse();
    });
    DIRS.push({
      toy: 'glass', l: 'D', name: 'Isometric block',
      art(svg, u) {
        svg.innerHTML = `
          <defs><linearGradient id="${u}tp" gradientUnits="userSpaceOnUse" x1="38" y1="16" x2="96" y2="86"><stop offset="0" stop-color="oklch(0.88 0.05 195)"/><stop offset="1" stop-color="oklch(0.62 0.08 220)"/></linearGradient></defs>
          ${PIECES.map(() => `<g><path class="sa" fill="oklch(0.6 0.12 168)"/><path class="sb" fill="oklch(0.46 0.1 175)"/><path class="tp" fill="url(#${u}tp)" style="stroke: var(--bg)" stroke-width="1.3" stroke-linejoin="round"/><path class="tl" fill="url(#lit)" opacity="0.5"/></g>`).join('')}`;
        const gs = [...svg.children].filter(n => n.tagName === 'g');
        const st = { s: 0 };
        const draw = () => PIECES.forEach((pc, k) => {
          const d = pieceD(pc, st.s), g = gs[k];
          g.querySelector('.sa').setAttribute('d', d.a); g.querySelector('.sb').setAttribute('d', d.b);
          g.querySelector('.tp').setAttribute('d', d.top); g.querySelector('.tl').setAttribute('d', d.top);
        });
        draw();
        return hoverLoop(
          () => gsap.timeline({ repeat: -1, repeatDelay: 0.35, onUpdate: draw })
            .to(st, { s: 1, duration: 0.55, ease: 'power3.out' })
            .to(st, { s: 0, duration: 0.5, ease: 'power2.in' }, '+=0.35'),
          () => gsap.to(st, { s: 0, duration: 0.3, overwrite: true, onUpdate: draw }));
      },
      emblem: (() => {
        const ds = PIECES.map(pc => pieceD(pc, 0));
        return emb(`
          <g fill="#fff" stroke="#000" stroke-width="2.6" stroke-linejoin="round">
          ${ds.map(d => `<path d="${d.a}${d.b}"/><path d="${d.top}"/>`).join('\n')}
          </g>
        `);
      })(),
    });
  }

  // E: a square split by one jagged crack; the halves part and snap back.
  {
    const CK = [[50, 14], [60, 38], [49, 52], [72, 74], [61, 88], [78, 114]];
    const LEFT = poly([[14, 14], ...CK, [14, 114]]);
    const RIGHT = poly([[114, 14], [114, 114], ...CK.slice().reverse()]);
    const GAP = 1.8;
    DIRS.push({
      toy: 'glass', l: 'E', name: 'Abstract mark',
      art(svg, u) {
        svg.innerHTML = `
          <defs>
            <linearGradient id="${u}l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.9 0.05 195)"/><stop offset="1" stop-color="oklch(0.66 0.1 225)"/></linearGradient>
            <linearGradient id="${u}r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.8 0.1 310)"/><stop offset="1" stop-color="oklch(0.58 0.15 335)"/></linearGradient>
          </defs>
          <path class="lh" d="${LEFT}" fill="url(#${u}l)" transform="translate(${-GAP} 0)"/>
          <path class="rh" d="${RIGHT}" fill="url(#${u}r)" transform="translate(${GAP} 0)"/>`;
        const lh = svg.querySelector('.lh'), rh = svg.querySelector('.rh');
        gsap.set(lh, { x: -GAP }); gsap.set(rh, { x: GAP });
        return hoverLoop(
          () => gsap.timeline({ repeat: -1, repeatDelay: 0.45 })
            .to(lh, { x: -7, y: 2, rotation: -4, svgOrigin: '14 114', duration: 0.3, ease: 'power3.out' }, 0)
            .to(rh, { x: 7, y: -2, rotation: -4, svgOrigin: '114 14', duration: 0.3, ease: 'power3.out' }, 0)
            .to([lh, rh], { x: i => (i ? GAP : -GAP), y: 0, rotation: 0, duration: 0.6, ease: 'elastic.out(1, 0.4)' }, 0.55),
          () => gsap.to([lh, rh], { x: i => (i ? GAP : -GAP), y: 0, rotation: 0, duration: 0.3, overwrite: true }));
      },
      emblem: emb(`
        <path d="${LEFT}" fill="#fff" transform="translate(-2.2 0)"/>
        <path d="${RIGHT}" fill="#fff" transform="translate(2.2 0)"/>
      `),
    });
  }

  /* ================= Gallery ================= */

  const NAMES = { neon: 'Neon sign', glass: 'Glass' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = svg => {
    const b = svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const key = `${toy}-${D.l.toLowerCase()}`;
      const src = D.file || `spike/emblems/${key}.svg`;
      if (D.emblem) window.EMBLEMS[key] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = key;
      card.innerHTML = `<header>${D.name ? `<b>${D.l}</b> · ${D.name}` : `<b>${D.l}</b>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        <div class="emb"><div class="flash"><i style="--emblem: url(${src})"></i></div><div class="glass"><i style="--emblem: url(${src})"></i></div></div>`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
