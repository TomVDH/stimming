<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 26</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike 26</h1>
<p class="lede">Smoke ring cannon, round 4 A made soft and smoky: four variants beside round 4 A. Each shows at 256, 128 and 64. Move the pointer over a tile.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';


  /* ================= Shared kit ================= */

  const SHADOW = 'oklch(0.07 0.01 265)', GREEN = 'oklch(0.88 0.27 142)';
  const lin = (defs, id, x1, y1, x2, y2, stops, user) => {
    const g = el('linearGradient', { id, x1, y1, x2, y2, ...(user ? { gradientUnits: 'userSpaceOnUse' } : {}) }, defs);
    stops.forEach(([o, c, a = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g));
    return g;
  };
  const rad = (defs, id, cx, cy, r, stops, user) => {
    const g = el('radialGradient', { id, cx, cy, r, ...(user ? { gradientUnits: 'userSpaceOnUse' } : {}) }, defs);
    stops.forEach(([o, c, a = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g));
    return g;
  };
  const glowF = (defs, id, sd = 1.6) => {
    const g = el('filter', { id, x: -0.5, y: -0.5, width: 2, height: 2 }, defs);
    el('feGaussianBlur', { stdDeviation: sd, result: 'b' }, g);
    const m = el('feMerge', {}, g);
    el('feMergeNode', { in: 'b' }, m);
    el('feMergeNode', { in: 'SourceGraphic' }, m);
  };
  // The menu sheen: a lit spot and a rim, as #lit and #rim give it.
  const sheenDefs = (defs, id) => {
    rad(defs, `${id}lit`, 0.32, 0.26, 0.7, [[0, '#fff', 0.38], [1, '#fff', 0]]);
    lin(defs, `${id}rim`, 0, 0, 1, 1, [[0, '#fff', 0.62], [0.5, '#fff', 0]]);
  };
  const sheen = (svg, id, rx = 7, outline = 'oklch(0.34 0.03 258)') => {
    el('rect', { x: 14, y: 14, width: 100, height: 100, rx, fill: `url(#${id}lit)`, opacity: 0.4, 'pointer-events': 'none' }, svg);
    el('rect', { x: 14.9, y: 14.9, width: 98.2, height: 98.2, rx: rx - 0.8, fill: 'none', stroke: `url(#${id}rim)`, 'stroke-width': 1.8, 'pointer-events': 'none' }, svg);
    el('rect', { x: 14, y: 14, width: 100, height: 100, rx, fill: 'none', stroke: outline, 'stroke-width': 1, 'pointer-events': 'none' }, svg);
  };
  // The menu tile: a hard shadow and a rounded face.
  const face = (svg, fill, rx = 7) => {
    el('rect', { x: 20, y: 20, width: 100, height: 100, rx, fill: SHADOW }, svg);
    return el('rect', { x: 14, y: 14, width: 100, height: 100, rx, fill }, svg);
  };
  const clipFace = (defs, id, rx = 7) => { const c = el('clipPath', { id }, defs); el('rect', { x: 14, y: 14, width: 100, height: 100, rx }, c); return `url(#${id})`; };
  // A smoke churn: noise drifts while the pointer stays; scale eases in and out.
  const churnF = (defs, id, freq = 0.06, seed = 3) => {
    const g = el('filter', { id, x: -0.2, y: -0.2, width: 1.4, height: 1.4 }, defs);
    el('feTurbulence', { type: 'fractalNoise', baseFrequency: freq, numOctaves: 2, seed, result: 'n' }, g);
    const off = el('feOffset', { in: 'n', dx: 0, dy: 0, result: 'm' }, g);
    const disp = el('feDisplacementMap', { in: 'SourceGraphic', in2: 'm', scale: 0, xChannelSelector: 'R', yChannelSelector: 'G' }, g);
    const st = { x: 0, k: 0 };
    let run = null;
    const put = () => { off.setAttribute('dx', f(st.x)); disp.setAttribute('scale', f(st.k)); };
    return {
      on(k) { gsap.to(st, { k, duration: 0.5, overwrite: 'auto', onUpdate: put }); if (!run) run = gsap.to(st, { x: '+=60', duration: 6, repeat: -1, ease: 'none', onUpdate: put }); },
      off() { run?.kill(); run = null; gsap.to(st, { k: 0, duration: 0.7, ease: 'power2.out', overwrite: 'auto', onUpdate: put }); },
    };
  };
  // A control: aim from the pointer, a demo on focus, a rest on leave.
  const ctl = ({ aim, rest, demo, enter = () => {}, leave = () => {} }) => {
    let tl = null;
    return {
      enter(p) { enter(); if (p) aim(p); else tl = demo(); },
      move(p) { if (p && !tl) aim(p); },
      leave() { tl?.kill(); tl = null; leave(); rest(); },
    };
  };
  // A tweened scalar with a draw callback.
  const knob = (v, draw) => {
    const st = { v };
    draw(st.v);
    return {
      st,
      to(v, d = 0.35, ease = 'power2.out') { gsap.to(st, { v, duration: d, ease, overwrite: 'auto', onUpdate: () => draw(st.v) }); },
      sweep(a, b, d = 1.8) { return gsap.fromTo(st, { v: a }, { v: b, duration: d, ease: 'sine.inOut', yoyo: true, repeat: -1, onUpdate: () => draw(st.v) }); },
    };
  };
  const polyD = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const lineD = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L');

  // The vortex ring's rolled core: an Archimedean spiral of smoke, two and a half turns.
  // A plane at offset u cuts it at these radial offsets, as nested rings.
  const TURNS = 2.5;
  const cuts = u => {
    const out = [], n = 600, F = s => (s / (TAU * TURNS)) * Math.sin(s) - u;
    let pa = 0, fa = F(0.0001);
    for (let i = 1; i <= n; i++) {
      const s = (i / n) * TAU * TURNS, fb = F(s);
      if ((fa < 0) !== (fb < 0)) { const t = fa / (fa - fb), q = pa + (s - pa) * t; out.push({ q: (q / (TAU * TURNS)) * Math.cos(q), w: q / (TAU * TURNS) }); }
      pa = s; fa = fb;
    }
    return out;
  };

  // The menu icon today: spike 24 D.
  const OLD = [
    {
      l: 'D', name: 'Isometric block',
      idea: 'A block of the room: the cannon box fires a ring of smoke cubes through the sheet. Left and right move the ring; cubes inside the sheet light green.',
      box: [10, 8, 112, 112],
      art(svg, id) {
        const defs = el('defs', {}, svg);
        glowF(defs, `${id}g`, 1.1);
        lin(defs, `${id}fl`, 0, 0, 1, 0, [[0, 'oklch(0.3 0.02 255)'], [1, 'oklch(0.22 0.02 262)']]);
        lin(defs, `${id}sh`, 0, 0, 0, 1, [[0, 'oklch(0.85 0.24 142)', 0.5], [1, 'oklch(0.7 0.2 142)', 0.08]]);
        const iso = (x, y, z) => [64 + (x - z) * 0.866, 74 + (x + z) * 0.5 - y];
        const P = pts => polyD(pts.map(q => iso(...q)));
        const BX = 44, BZ = 30, F = -30, T = 9;
        el('path', { d: polyD([iso(-BX, F, BZ), iso(BX, F, BZ), iso(BX, F, -BZ), iso(BX, F - T, -BZ), iso(BX, F - T, BZ), iso(-BX, F - T, BZ)].map(p => [p[0] + 6, p[1] + 6])), fill: SHADOW }, svg);
        el('path', { d: P([[-BX, F, BZ], [BX, F, BZ], [BX, F - T, BZ], [-BX, F - T, BZ]]), fill: 'oklch(0.2 0.016 262)' }, svg);
        el('path', { d: P([[BX, F, BZ], [BX, F, -BZ], [BX, F - T, -BZ], [BX, F - T, BZ]]), fill: 'oklch(0.14 0.014 266)' }, svg);
        el('path', { d: P([[-BX, F, -BZ], [BX, F, -BZ], [BX, F, BZ], [-BX, F, BZ]]), fill: `url(#${id}fl)` }, svg);
        const SX = 10;
        // The cannon: a box with a dark round mouth on its front face.
        const cb = { x0: -BX + 2, x1: -BX + 18, y1: F + 30, z: 13 };
        el('path', { d: P([[cb.x0, F, cb.z], [cb.x1, F, cb.z], [cb.x1, cb.y1, cb.z], [cb.x0, cb.y1, cb.z]]), fill: 'oklch(0.52 0.03 60)' }, svg);
        el('path', { d: P([[cb.x1, F, cb.z], [cb.x1, F, -cb.z], [cb.x1, cb.y1, -cb.z], [cb.x1, cb.y1, cb.z]]), fill: 'oklch(0.66 0.04 62)' }, svg);
        el('path', { d: P([[cb.x0, cb.y1, -cb.z], [cb.x1, cb.y1, -cb.z], [cb.x1, cb.y1, cb.z], [cb.x0, cb.y1, cb.z]]), fill: 'oklch(0.8 0.04 70)' }, svg);
        const mouth = []; for (let i = 0; i < 24; i++) { const a = (i / 24) * TAU; mouth.push(iso(cb.x1, F + 15 + 8 * Math.sin(a), 8 * Math.cos(a))); }
        el('path', { d: polyD(mouth), fill: 'oklch(0.18 0.02 60)' }, svg);
        el('path', { d: P([[SX, F, -BZ], [SX, F, BZ], [SX, 44, BZ], [SX, 44, -BZ]]), fill: `url(#${id}sh)` }, svg);
        el('path', { d: lineD([iso(SX, F, -BZ), iso(SX, F, BZ)]), stroke: GREEN, 'stroke-width': 2.2, filter: `url(#${id}g)` }, svg);
        const cubes = el('g', {}, svg), glow = el('g', { filter: `url(#${id}g)` }, svg);
        const pool = [];
        const S = 5.2, R = 20, A = 7.5, YC = F + 33;
        const cube = (x, y, z, hot, i) => {
          if (!pool[i]) pool[i] = [0, 1, 2].map(() => el('path', {}, cubes));
          const h = S / 2, q = pool[i];
          const top = [[x - h, y + h, z - h], [x + h, y + h, z - h], [x + h, y + h, z + h], [x - h, y + h, z + h]];
          const fx = [[x + h, y - h, z - h], [x + h, y - h, z + h], [x + h, y + h, z + h], [x + h, y + h, z - h]];
          const fz = [[x - h, y - h, z + h], [x + h, y - h, z + h], [x + h, y + h, z + h], [x - h, y + h, z + h]];
          const C = hot ? ['oklch(0.96 0.19 142)', 'oklch(0.78 0.25 142)', 'oklch(0.6 0.21 145)'] : ['oklch(0.95 0.012 245)', 'oklch(0.74 0.02 250)', 'oklch(0.52 0.022 256)'];
          [top, fx, fz].forEach((pts, j) => { q[j].setAttribute('d', P(pts)); q[j].setAttribute('fill', C[j]); q[j].setAttribute('display', ''); });
          (hot ? glow : cubes).append(...q);
        };
        const k = knob(SX - 6, u => {
          const list = [];
          // Voxels on a fixed grid; the torus slides through it, so cubes pop in and out.
          for (let gx = -12; gx <= 12; gx++) for (let gy = -6; gy <= 6; gy++) for (let gz = -6; gz <= 6; gz++) {
            const x = gx * S, y = gy * S, z = gz * S, q = Math.hypot(y, z) - R, d = Math.hypot(q, x - u);
            if (d < A) list.push([x, YC + y, z]);
          }
          // Painter's order: far cubes first.
          list.sort((a, b) => (a[0] + a[2] + a[1]) - (b[0] + b[2] + b[1]));
          list.forEach((c, i) => cube(c[0], c[1], c[2], Math.abs(c[0] - SX) < S * 0.6, i));
          for (let i = list.length; i < pool.length; i++) pool[i].forEach(e => e.setAttribute('display', 'none'));
        });
        return ctl({
          aim: p => k.to(lerp(-BX + 30, BX - 8, clamp((p[0] - 22) / 84, 0, 1)), 0.3),
          rest: () => k.to(SX - 6, 0.8, 'power3.out'),
          demo: () => k.sweep(-BX + 30, BX - 8, 2.2),
        });
      },
      emblem() {
        const iso = (x, y, z) => [64 + (x - z) * 0.866 * 1.8, 64 + ((x + z) * 0.5 - y) * 1.8];
        const S = 5.2, R = 20, A = 7.5;
        let grey = '', white = '';
        for (let gx = -2; gx <= 2; gx++) for (let gy = -6; gy <= 6; gy++) for (let gz = -6; gz <= 6; gz++) {
          const x = gx * S, y = gy * S, z = gz * S;
          if (Math.hypot(Math.hypot(y, z) - R, x) >= A) continue;
          const h = S / 2, top = [[x - h, y + h, z - h], [x + h, y + h, z - h], [x + h, y + h, z + h], [x - h, y + h, z + h]].map(q => iso(...q));
          const d = polyD(top);
          if (gx === 0) white += d; else grey += d;
        }
        return `${EMB_HEAD}
  <path d="${grey}" fill="#8c8c8c"/>
  <path d="${white}" fill="#fff"/>
</svg>
`;
      },
    },
  ];
  const CURRENT_ART = OLD[0].art;

  /* ================= Round 4 kit ================= */

  const set = (e, a) => { for (const k in a) e.setAttribute(k, a[k]); };
  const norm = v => { const l = Math.hypot(...v); return v.map(c => c / l); };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  // Points on a circle of radius R round centre c, in the plane normal to n.
  const ringPts = (c, n, R, N) => {
    n = norm(n);
    const a = Math.abs(n[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0], u = norm(cross(n, a)), v = cross(n, u);
    return Array.from({ length: N }, (_, i) => { const t = (i / N) * TAU; return [0, 1, 2].map(j => c[j] + R * (u[j] * Math.cos(t) + v[j] * Math.sin(t))); });
  };
  // A camera with yaw and a look down; the third value is distance, far is large.
  const camera = (yaw, pitch, ox = 64, oy = 64) => {
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    return ([x, y, z]) => { const X = x * cy - z * sy, Z = x * sy + z * cy; return [ox + X, oy - (y * cp - Z * sp), -(Z * cp + y * sp)]; };
  };
  // Smoke beads: five depth shades, lit from the top left, and two greens.
  const beadDefs = (defs, id) => {
    [[0.97, 0.006], [0.88, 0.01], [0.78, 0.014], [0.67, 0.018], [0.56, 0.02]].forEach(([L, C], b) =>
      rad(defs, `${id}b${b}`, 0.36, 0.3, 0.78, [[0, `oklch(${L} ${C} 245)`], [0.55, `oklch(${f(L * 0.72)} ${C} 250)`], [1, `oklch(${f(L * 0.4)} 0.02 258)`]]));
    rad(defs, `${id}h1`, 0.36, 0.3, 0.78, [[0, 'oklch(0.99 0.1 142)'], [0.5, 'oklch(0.87 0.25 142)'], [1, 'oklch(0.5 0.17 145)']]);
    rad(defs, `${id}h0`, 0.36, 0.3, 0.78, [[0, 'oklch(0.93 0.07 150)'], [0.55, 'oklch(0.7 0.13 148)'], [1, 'oklch(0.38 0.07 150)']]);
    glowF(defs, `${id}g`, 1.5);
  };
  // A bead layer: circles drawn far to near, with an optional hard shadow.
  const beads = (parent, id, shadow = 0) => {
    const sh = shadow ? el('g', { fill: SHADOW, transform: `translate(${shadow} ${shadow})` }, parent) : null;
    const body = el('g', {}, parent);
    const pb = [], ps = [];
    return list => {
      list.sort((a, b) => b.z - a.z);
      let zn = Infinity, zf = -Infinity;
      list.forEach(b => { zn = Math.min(zn, b.z); zf = Math.max(zf, b.z); });
      const span = Math.max(1e-3, zf - zn);
      list.forEach((b, i) => {
        if (!pb[i]) { pb[i] = el('circle', {}, body); if (sh) ps[i] = el('circle', {}, sh); }
        const bin = clamp(Math.round(((b.z - zn) / span) * 4), 0, 4), hot = b.hot || 0;
        const fill = hot > 0.66 ? `url(#${id}h1)` : hot > 0.25 ? `url(#${id}h0)` : `url(#${id}b${bin})`;
        set(pb[i], { cx: f(b.x), cy: f(b.y), r: f(b.r), fill, display: '', opacity: f(b.a ?? 1) });
        hot > 0.66 ? pb[i].setAttribute('filter', `url(#${id}g)`) : pb[i].removeAttribute('filter');
        if (sh) set(ps[i], { cx: f(b.x), cy: f(b.y), r: f(b.r), display: '', opacity: f(b.a ?? 1) });
      });
      for (let i = list.length; i < pb.length; i++) { pb[i].setAttribute('display', 'none'); if (sh) ps[i].setAttribute('display', 'none'); }
    };
  };
  // Emblem beads: each bead is a filled disc with a black edge.
  const embBeads = (list, fill) => list.sort((a, b) => b.z - a.z)
    .map(b => `  <circle cx="${f(b.x)}" cy="${f(b.y)}" r="${f(b.r)}" fill="${fill(b)}" stroke="#000" stroke-width="1.4"/>`).join('\n');
  // Fits a list of beads into the 128 frame, with an 8 margin.
  const fitBeads = (list, pad = 8) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    list.forEach(b => { x0 = Math.min(x0, b.x - b.r); y0 = Math.min(y0, b.y - b.r); x1 = Math.max(x1, b.x + b.r); y1 = Math.max(y1, b.y + b.r); });
    const s = (128 - pad * 2) / Math.max(x1 - x0, y1 - y0), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    return list.map(b => ({ ...b, x: 64 + (b.x - cx) * s, y: 64 + (b.y - cy) * s, r: b.r * s }));
  };

  /* ---- A: the glossy ring ---- */
  const A_CAM = camera(1.0, 0.24, 64, 62), A_R = 30, A_r = 12.5, A_SX = 0;
  const aBeads = (x, wob) => ringPts([x, 0, 0], [1, 0.14 + 0.12 * Math.sin(wob), 0.55], A_R, 60).map(p => {
    const s = A_CAM(p);
    return { x: s[0], y: s[1], z: s[2], r: A_r, hot: clamp(1.3 - Math.abs(p[0] - A_SX) / A_r, 0, 1) };
  });


  /* ================= Round 4 A, soft ================= */

  // The soft ring: the sheet lights only a thin slice, half-width W.
  const W = 4.5;
  const softRing = (x, wob) => ringPts([x, 0, 0], [1, 0.14 + 0.12 * Math.sin(wob), 0.55], A_R, 60).map(p => {
    const s = A_CAM(p);
    return { x: s[0], y: s[1], z: s[2], r: A_r, hot: clamp(1.25 - Math.abs(p[0] - A_SX) / W, 0, 1) };
  });

  // A bead layer with its own paint: paint(bead, depth bin) gives the fill.
  const softBeads = (parent, paint, scale = 1) => {
    const pb = [];
    return list => {
      list.sort((a, b) => b.z - a.z);
      let zn = Infinity, zf = -Infinity;
      list.forEach(b => { zn = Math.min(zn, b.z); zf = Math.max(zf, b.z); });
      const span = Math.max(1e-3, zf - zn);
      list.forEach((b, i) => {
        if (!pb[i]) pb[i] = el('circle', {}, parent);
        const bin = clamp(Math.round(((b.z - zn) / span) * 4), 0, 4);
        set(pb[i], { cx: f(b.x), cy: f(b.y), r: f(b.r * scale), fill: paint(b, bin), display: '' });
      });
      for (let i = list.length; i < pb.length; i++) pb[i].setAttribute('display', 'none');
    };
  };
  // Smoke: blur the beads into one tube, then roll noise through the edge.
  // On hover the noise drifts, so the smoke churns round the tube.
  const smokeF = (defs, id, { blur = 1.8, disp = 7, freq = 0.07, seed = 4 } = {}) => {
    const g = el('filter', { id, x: -0.3, y: -0.3, width: 1.6, height: 1.6 }, defs);
    el('feGaussianBlur', { in: 'SourceGraphic', stdDeviation: blur, result: 'b' }, g);
    el('feTurbulence', { type: 'fractalNoise', baseFrequency: freq, numOctaves: 3, seed, result: 'n' }, g);
    const off = el('feOffset', { in: 'n', dx: 0, dy: 0, result: 'm' }, g);
    el('feDisplacementMap', { in: 'b', in2: 'm', scale: disp, xChannelSelector: 'R', yChannelSelector: 'G' }, g);
    const st = { x: 0, y: 0 };
    let run = null;
    const put = () => { off.setAttribute('dx', f(st.x)); off.setAttribute('dy', f(st.y)); };
    return {
      on() { if (!run) run = gsap.to(st, { x: '+=40', y: '-=24', duration: 4, repeat: -1, ease: 'none', onUpdate: put }); },
      off() { run?.kill(); run = null; },
    };
  };
  // Smoke greys by depth, lit from the top left; green mixes in near the sheet.
  const smokeDefs = (defs, id, L = [0.95, 0.86, 0.76, 0.66, 0.56]) => {
    L.forEach((l, b) => rad(defs, `${id}b${b}`, 0.36, 0.3, 0.8, [[0, `oklch(${l} 0.008 245)`], [0.6, `oklch(${f(l * 0.74)} 0.014 250)`], [1, `oklch(${f(l * 0.45)} 0.02 258)`]]));
    [[0.45, 0.1], [0.75, 0.2], [0.96, 0.26]].forEach(([c, k], h) =>
      rad(defs, `${id}h${h}`, 0.36, 0.3, 0.8, [[0, `oklch(${f(0.9 + k * 0.35)} ${f(c * 0.4)} 142)`], [0.55, `oklch(${f(0.66 + k * 0.5)} ${f(c * 0.25 + 0.04)} 143)`], [1, `oklch(0.42 ${f(c * 0.14)} 148)`]]));
  };
  const smokePaint = id => (b, bin) => b.hot > 0.72 ? `url(#${id}h2)` : b.hot > 0.42 ? `url(#${id}h1)` : b.hot > 0.15 ? `url(#${id}h0)` : `url(#${id}b${bin})`;
  // The fan: a soft green wedge of haze with a grain, from a point up high.
  const softFan = (svg, defs, id, cam, sx) => {
    const ap = cam([sx, 62, 0]), b0 = cam([sx, -46, -52]), b1 = cam([sx, -46, 52]);
    lin(defs, `${id}f`, 0, 0, 0, 1, [[0, 'oklch(0.9 0.25 142)', 0.5], [1, 'oklch(0.7 0.2 142)', 0.02]]);
    const fb = el('filter', { id: `${id}fb`, x: -0.2, y: -0.2, width: 1.4, height: 1.4 }, defs);
    el('feGaussianBlur', { stdDeviation: 2.2 }, fb);
    el('path', { d: polyD([ap, b0, b1]), fill: `url(#${id}f)`, filter: `url(#${id}fb)` }, svg);
    glowF(defs, `${id}g`, 1.6);
    el('path', { d: lineD([b0, b1]), stroke: GREEN, 'stroke-width': 2.2, 'stroke-linecap': 'round', filter: `url(#${id}g)`, opacity: 0.85 }, svg);
  };
  // The ring control: x flies the ring through the sheet; hover churns the smoke.
  const softCtl = (st, render, sm, REST = 15) => {
    let w = null;
    return ctl({
      aim: p => gsap.to(st, { x: lerp(-38, 38, clamp((p[0] - 18) / 92, 0, 1)), duration: 0.35, ease: 'power2.out', overwrite: 'auto', onUpdate: render }),
      rest: () => gsap.to(st, { x: REST, duration: 0.9, ease: 'power3.out', overwrite: 'auto', onUpdate: render }),
      demo: () => gsap.fromTo(st, { x: -38 }, { x: 38, duration: 2.2, ease: 'sine.inOut', yoyo: true, repeat: -1, onUpdate: render }),
      enter: () => { sm.forEach(s => s.on()); if (!w) w = gsap.to(st, { wob: `+=${TAU}`, duration: 2, repeat: -1, ease: 'none', onUpdate: render }); },
      leave: () => { sm.forEach(s => s.off()); w?.kill(); w = null; gsap.to(st, { wob: 0, duration: 0.6, onUpdate: render }); },
    });
  };
  // Emblem: the soft ring as a luminance mask, blurred like the icon.
  const softEmblem = (core = false) => {
    const bs = fitBeads(softRing(8, 0), 10);
    return `${EMB_HEAD}
  <defs><filter id="s" x="-0.2" y="-0.2" width="1.4" height="1.4"><feGaussianBlur stdDeviation="2.4" result="b"/><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="4"/><feDisplacementMap in="b" scale="9" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
  <g filter="url(#s)">
${bs.sort((a, b) => b.z - a.z).map(b => `    <circle cx="${f(b.x)}" cy="${f(b.y)}" r="${f(b.r)}" fill="${b.hot > 0.42 ? '#fff' : '#8c8c8c'}"/>`).join('\n')}
  </g>${core ? `
  <g fill="#fff">
${bs.filter(b => b.hot > 0.42).map(b => `    <circle cx="${f(b.x)}" cy="${f(b.y)}" r="${f(b.r * 0.4)}"/>`).join('\n')}
  </g>` : ''}
</svg>
`;
  };

  const DIRS = [
    {
      l: 'Current', name: 'Isometric block',
      box: [10, 8, 112, 112],
      art: CURRENT_ART,
    },
    {
      l: 'A', name: 'Round 4 A',
      idea: 'Round 4 as it stood: hard beads, a flat green swap.',
      box: 'auto',
      art(svg, id) {
        const defs = el('defs', {}, svg);
        beadDefs(defs, id);
        lin(defs, `${id}f`, 0, 0, 0, 1, [[0, 'oklch(0.9 0.25 142)', 0.55], [1, 'oklch(0.7 0.2 142)', 0.04]]);
        const ap = A_CAM([A_SX, 60, 0]), b0 = A_CAM([A_SX, -46, -50]), b1 = A_CAM([A_SX, -46, 50]);
        el('path', { d: polyD([ap, b0, b1]), fill: `url(#${id}f)` }, svg);
        el('path', { d: lineD([b0, b1]), stroke: GREEN, 'stroke-width': 2.4, 'stroke-linecap': 'round', filter: `url(#${id}g)` }, svg);
        const draw = beads(svg, id, 5);
        const st = { x: 15, wob: 0 };
        const render = () => draw(aBeads(st.x, st.wob));
        render();
        return softCtl(st, render, []);
      },
    },
    {
      l: 'A1', name: 'Soft smoke',
      idea: 'The beads blur into one tube and the edge frays with noise. Green scatters into the smoke where the sheet cuts it. Hover churns the smoke and flies the ring.',
      box: 'auto',
      art(svg, id) {
        const defs = el('defs', {}, svg);
        smokeDefs(defs, id);
        softFan(svg, defs, id, A_CAM, A_SX);
        const sm = smokeF(defs, `${id}s`, { blur: 1.8, disp: 7 });
        const shf = smokeF(defs, `${id}x`, { blur: 2.4, disp: 7 });
        const sh = el('g', { transform: 'translate(5 5)', filter: `url(#${id}x)`, opacity: 0.9 }, svg);
        const body = el('g', { filter: `url(#${id}s)` }, svg);
        const dS = softBeads(sh, () => SHADOW), dB = softBeads(body, smokePaint(id));
        const st = { x: 8, wob: 0 };
        const render = () => { const l = softRing(st.x, st.wob); dS(l.map(b => ({ ...b }))); dB(l); };
        render();
        return softCtl(st, render, [sm, shf], 8);
      },
      emblem: () => softEmblem(),
    },
    {
      l: 'A2', name: 'Wisps',
      idea: 'A1 with the smoke it sheds: a wake trails back toward the cannon and loose wisps peel off the rim. The edge frays harder.',
      box: 'auto',
      art(svg, id) {
        const defs = el('defs', {}, svg);
        smokeDefs(defs, id);
        softFan(svg, defs, id, A_CAM, A_SX);
        const sm = smokeF(defs, `${id}s`, { blur: 2, disp: 10, freq: 0.08 });
        const wf = smokeF(defs, `${id}w`, { blur: 3, disp: 14, freq: 0.05, seed: 9 });
        const shf = smokeF(defs, `${id}x`, { blur: 2.6, disp: 10 });
        const wake = el('g', { filter: `url(#${id}w)`, opacity: 0.55 }, svg);
        const sh = el('g', { transform: 'translate(5 5)', filter: `url(#${id}x)`, opacity: 0.85 }, svg);
        const body = el('g', { filter: `url(#${id}s)` }, svg);
        const dW = softBeads(wake, () => 'oklch(0.6 0.016 250)', 0.55), dS = softBeads(sh, () => SHADOW), dB = softBeads(body, smokePaint(id));
        const st = { x: 8, wob: 0 };
        const render = () => {
          const l = softRing(st.x, st.wob);
          // The wake: thin rings left behind at falling size along the flight.
          const w = [1, 2, 3].flatMap(k => softRing(st.x - 16 * k, st.wob - k * 0.6).filter((_, i) => i % 2 === 0).map(b => ({ ...b, r: b.r * (1 - k * 0.22), hot: 0 })));
          dW(w); dS(l.map(b => ({ ...b }))); dB(l);
        };
        render();
        return softCtl(st, render, [sm, wf, shf], 8);
      },
      emblem: () => softEmblem(),
    },
    {
      l: 'A3', name: 'Lit core',
      idea: 'Volume: a wide faint haze, the smoke tube, and a bright rolled core inside it. Where the sheet cuts, the core burns green through the smoke.',
      box: 'auto',
      art(svg, id) {
        const defs = el('defs', {}, svg);
        smokeDefs(defs, id, [0.86, 0.78, 0.7, 0.62, 0.54]);
        softFan(svg, defs, id, A_CAM, A_SX);
        const hz = smokeF(defs, `${id}z`, { blur: 4.5, disp: 10, freq: 0.05, seed: 2 });
        const sm = smokeF(defs, `${id}s`, { blur: 2, disp: 8 });
        const cf = el('filter', { id: `${id}k`, x: -0.3, y: -0.3, width: 1.6, height: 1.6 }, defs);
        el('feGaussianBlur', { stdDeviation: 1.6 }, cf);
        const shf = smokeF(defs, `${id}x`, { blur: 3, disp: 8 });
        const sh = el('g', { transform: 'translate(5 5)', filter: `url(#${id}x)`, opacity: 0.8 }, svg);
        const haze = el('g', { filter: `url(#${id}z)`, opacity: 0.32 }, svg);
        const body = el('g', { filter: `url(#${id}s)`, opacity: 0.9 }, svg);
        const core = el('g', { filter: `url(#${id}k)`, style: 'mix-blend-mode: screen' }, svg);
        const dS = softBeads(sh, () => SHADOW), dZ = softBeads(haze, () => 'oklch(0.72 0.012 248)', 1.4), dB = softBeads(body, smokePaint(id));
        const dC = softBeads(core, b => b.hot > 0.3 ? `oklch(0.95 0.24 142 / ${f(0.4 + b.hot * 0.6)})` : `oklch(0.98 0.01 240 / ${f(b.bin ?? 0.5)})`, 0.32);
        const st = { x: 8, wob: 0 };
        const render = () => {
          const l = softRing(st.x, st.wob);
          dS(l.map(b => ({ ...b }))); dZ(l.map(b => ({ ...b }))); dB(l.map(b => ({ ...b })));
          // The core shows on the near half only.
          const zs = l.map(b => b.z), zm = (Math.min(...zs) + Math.max(...zs)) / 2;
          dC(l.filter(b => b.z < zm || b.hot > 0.3).map(b => ({ ...b, bin: 0.55 })));
        };
        render();
        return softCtl(st, render, [hz, sm, shf], 8);
      },
      emblem: () => softEmblem(true),
    },
    {
      l: 'A4', name: 'Backlit',
      idea: 'The ring as the toy shows it: dark smoke against the sheet, lit from behind. Green bleeds round the rim on the sheet side and fills the cut.',
      box: 'auto',
      art(svg, id) {
        const defs = el('defs', {}, svg);
        smokeDefs(defs, id, [0.5, 0.45, 0.4, 0.35, 0.3]);
        softFan(svg, defs, id, A_CAM, A_SX);
        const rf = smokeF(defs, `${id}r`, { blur: 3.2, disp: 9, seed: 6 });
        const sm = smokeF(defs, `${id}s`, { blur: 1.6, disp: 8 });
        const shf = smokeF(defs, `${id}x`, { blur: 2.6, disp: 8 });
        const sh = el('g', { transform: 'translate(5 5)', filter: `url(#${id}x)`, opacity: 0.9 }, svg);
        const rim = el('g', { filter: `url(#${id}r)` }, svg);
        const body = el('g', { filter: `url(#${id}s)` }, svg);
        const dS = softBeads(sh, () => SHADOW);
        const dR = softBeads(rim, b => `oklch(${f(0.7 + b.hot * 0.25)} ${f(0.14 + b.hot * 0.12)} 142)`, 1.08);
        const dB = softBeads(body, (b, bin) => b.hot > 0.42 ? `url(#${id}h${b.hot > 0.72 ? 2 : 1})` : `url(#${id}b${bin})`, 0.92);
        const st = { x: 8, wob: 0 };
        const render = () => {
          const l = softRing(st.x, st.wob);
          dS(l.map(b => ({ ...b })));
          // The rim sits a little toward the sheet, so light spills round that edge.
          dR(l.map(b => ({ ...b, x: b.x - 2.4, y: b.y - 1.6 })));
          dB(l);
        };
        render();
        return softCtl(st, render, [rf, sm, shf], 8);
      },
      emblem: () => softEmblem(),
    },
  ];

  /* ================= Gallery ================= */

  const NAME = 'Smoke ring cannon';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box === 'auto' ? svg.getBBox() : box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : { x: 14, y: 14, width: 100, height: 100 }, side = Math.max(b.width, b.height);
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-vortex';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  window.CTL = {};
  for (const D of DIRS) {
    const file = `vortex26-${D.l.toLowerCase()}`;
    const url = D.l === 'Current' ? '' : `spike/emblems/${file}.svg`;
    if (D.emblem) window.EMBLEMS[file] = D.emblem();
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = D.l === 'Current' ? 'vortex-current' : file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach((tile, ti) => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      (window.CTL[D.l] ||= []).push({ c, svg });
      if (reduce) return;
      tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tile.addEventListener('pointermove', e => c.move(local(svg, e)));
      tile.addEventListener('pointerleave', () => c.leave());
      tile.addEventListener('focus', () => c.enter(null));
      tile.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
