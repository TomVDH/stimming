<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Soup cauldron 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Soup cauldron 1</h1>
<p class="lede">Soup cauldron, round 1. Circle the pointer round the pot to stir: the marbled soup turns and the duck rides it. On hover the fire flickers, bubbles pop and steam rises.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  const DEG = Math.PI / 180;

  // An ellipse as one path, so a ring can cut a hole with evenodd.
  const ell = (cx, cy, rx, ry) => `M${f(cx - rx)} ${f(cy)}a${f(rx)} ${f(ry)} 0 1 0 ${f(2 * rx)} 0a${f(rx)} ${f(ry)} 0 1 0 ${f(-2 * rx)} 0Z`;
  // A flame: a base, two bulging sides and a tip that can lean.
  const flame = ([x, y, w, h, lean = 0]) => `M${f(x - w / 2)} ${f(y)}C${f(x - w / 2)} ${f(y - h * 0.45)} ${f(x - w * 0.12 + lean * 0.3)} ${f(y - h * 0.62)} ${f(x + lean)} ${f(y - h)}C${f(x + w * 0.28 + lean * 0.3)} ${f(y - h * 0.58)} ${f(x + w / 2)} ${f(y - h * 0.4)} ${f(x + w / 2)} ${f(y)}Q${f(x)} ${f(y + w * 0.3)} ${f(x - w / 2)} ${f(y)}Z`;

  // The toy's colours: black iron, a bright rolled rim, caramel soup, a white-hot fire.
  const IRON = [[0, 'oklch(0.3 0.012 260)'], [0.5, 'oklch(0.18 0.01 260)'], [0.8, 'oklch(0.24 0.05 40)'], [1, 'oklch(0.56 0.17 45)']];
  const RIM = [[0, 'oklch(0.34 0.01 260)'], [0.45, 'oklch(0.48 0.012 260)'], [0.8, 'oklch(0.8 0.01 250)'], [1, 'oklch(0.52 0.012 260)']];
  const SOUP = [[0, 'oklch(0.87 0.11 84)'], [0.55, 'oklch(0.73 0.14 68)'], [1, 'oklch(0.56 0.13 55)']];
  const FIRE = [[0, 'oklch(0.97 0.07 95)'], [0.2, 'oklch(0.87 0.16 80)'], [0.55, 'oklch(0.7 0.21 47)'], [1, 'oklch(0.56 0.22 30)', 0.75]];
  const DUCK = 'oklch(0.9 0.17 98)', BEAK = 'oklch(0.7 0.19 48)';
  // The marbled swirl, drawn at radius 36 and squashed onto the soup.
  const SWIRL = [
    ['M0 0C8-8 20-4 20 6C20 18 4 26-10 22C-28 16-30-6-18-20C-4-34 24-32 36-14', 'oklch(0.55 0.18 32)', 5.2, 0.72],
    ['M0 0C-8 8-20 4-20-6C-20-18-4-26 10-22C28-16 30 6 18 20C4 34-24 32-36 14', 'oklch(0.94 0.06 88)', 4.2, 0.62],
  ];

  // One pot: the fire, the iron belly, the rim, the soup and its riders.
  // P holds the geometry; the A and D icons differ only in it.
  const potMarkup = (u, P) => {
    const [cx, cy] = P.rim, { rx, ry, t } = P;
    const [sx, sy] = P.soup, srx = rx - t - 1, sry = ry - t * 0.8 - 1, s = srx / 38;
    return `
      <ellipse class="glow" cx="${P.glow[0]}" cy="${P.glow[1]}" rx="${P.glow[2]}" ry="${P.glow[3]}" fill="url(#${u}glow)"/>
      <g class="flames">${P.back.map(fl => `<path d="${flame(fl)}" fill="url(#${u}fire)"/>`).join('')}</g>
      <path d="${P.belly}" fill="url(#${u}iron)"/>
      <path d="${P.belly}" fill="url(#${u}lit)" opacity="0.55"/>
      <path d="${P.belly}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
      <g class="flames">${P.front.map(fl => `<path d="${flame(fl)}" fill="url(#${u}fire)"/>`).join('')}</g>
      <ellipse cx="${P.bed[0]}" cy="${P.bed[1]}" rx="${P.bed[2]}" ry="${P.bed[3]}" fill="oklch(0.97 0.07 95)"/>
      <path d="${ell(cx, cy, rx, ry)}${ell(cx, cy + 1, rx - t, ry - t * 0.8)}" fill="url(#${u}ring)" fill-rule="evenodd"/>
      <path d="${ell(cx, cy, rx, ry)}${ell(cx, cy + 1, rx - t, ry - t * 0.8)}" fill="url(#${u}lit)" fill-rule="evenodd" opacity="0.6"/>
      <path d="${ell(cx, cy, rx, ry)}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
      <path d="${ell(cx, cy + 1, rx - t, ry - t * 0.8)}" fill="oklch(0.12 0.01 260)"/>
      <g clip-path="url(#${u}clip)">
        <path d="${ell(sx, sy, srx, sry)}" fill="url(#${u}soup)"/>
        <g transform="translate(${sx} ${sy}) scale(${f(s)} ${f(s * sry / srx)})"><g class="swirl" fill="none" stroke-linecap="round">
          ${SWIRL.map(([d, c, w, o]) => `<path d="${d}" stroke="${c}" stroke-width="${f(w / s)}" opacity="${o}"/>`).join('')}
        </g></g>
        <path d="${ell(sx, sy, srx, sry)}" fill="url(#${u}lit)" opacity="0.7"/>
        <g class="bub"><circle class="bb" r="${f(3.6 * P.k)}" fill="oklch(0.9 0.1 85)" opacity="0"/><circle class="bl" r="${f(3.6 * P.k)}" fill="url(#${u}lit)" opacity="0"/>
          <ellipse class="ring" rx="${f(4 * P.k)}" ry="${f(1.7 * P.k)}" fill="none" stroke="oklch(0.95 0.06 88)" stroke-width="2" opacity="0"/></g>
      </g>
      <g class="duck"><g transform="scale(${P.dk})">
        <path d="M-8 -1C-9 3-5 5 0 5C6 5 9 2 8-2C6 0 2 0 0-1C-3-2-6-3-8-1Z" fill="${DUCK}"/>
        <path d="M-8.6-1.6L-11-5L-6-2.6Z" fill="${DUCK}"/>
        <circle cx="3.8" cy="-5" r="4.2" fill="${DUCK}"/>
        <path d="M7 -5.8C9.6-6 11.2-5.2 10.8-4C10.4-3 8.6-3 7-3.4Z" fill="${BEAK}"/>
        <circle cx="5" cy="-6.2" r="1" fill="oklch(0.15 0 0)"/>
        <circle cx="3.8" cy="-5" r="4.2" fill="url(#${u}lit)"/>
      </g></g>
      <g class="steam" fill="oklch(0.96 0.01 80)" filter="url(#${u}soft)">
        <ellipse cx="${sx - srx * 0.3}" cy="${sy - 4}" rx="${f(7 * P.k)}" ry="${f(5 * P.k)}" opacity="0"/>
        <ellipse cx="${sx + srx * 0.25}" cy="${sy - 6}" rx="${f(8 * P.k)}" ry="${f(5.5 * P.k)}" opacity="0"/>
        <ellipse cx="${sx}" cy="${sy - 2}" rx="${f(6 * P.k)}" ry="${f(4.5 * P.k)}" opacity="0"/>
      </g>`;
  };
  const potDefs = (u, P) => {
    const [sx, sy] = P.soup;
    return light(u) + blur(`${u}soft`, 2.6)
      + lg(`${u}iron`, IRON) + lg(`${u}ring`, RIM) + lg(`${u}fire`, FIRE, `gradientUnits="userSpaceOnUse" x1="0" y1="${P.fire[0]}" x2="0" y2="${P.fire[1]}"`)
      + rg(`${u}soup`, SOUP, 'cx="0.4" cy="0.32" r="0.78"')
      + rg(`${u}glow`, [[0, 'oklch(0.74 0.19 52)', 0.62], [1, 'oklch(0.74 0.19 52)', 0]])
      + `<clipPath id="${u}clip"><path d="${ell(P.rim[0], P.rim[1] + 1, P.rx - P.t, P.ry - P.t * 0.8)}"/></clipPath>`;
  };

  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false, last = 0;
    const tick = (t, dt) => fn(Math.min(dt, 50) / 1000);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The pot's life: circling the pointer stirs; hover lights the fire, pops bubbles and lifts steam.
  const cook = (svg, P, extra = {}) => {
    const q = s => svg.querySelector(s), qa = s => [...svg.querySelectorAll(s)];
    const swirl = q('.swirl'), duck = q('.duck'), bub = q('.bub'), glow = q('.glow');
    const flames = qa('.flames path'), puffs = qa('.steam ellipse');
    const [bb, bl, ring] = [q('.bb'), q('.bl'), q('.ring')];
    const [sx, sy] = P.soup, srx = P.rx - P.t - 1, sry = P.ry - P.t * 0.8 - 1, SQ = sry / srx;
    // a: the swirl's turn in degrees; w: its speed; base: the simmer's own turn.
    const st = { a: 0, w: 0, base: 0, last: null, bob: 0, live: false };
    let face = 1;
    const draw = () => {
      swirl.setAttribute('transform', `rotate(${f(st.a)})`);
      // The duck rides the swirl and faces the way the soup carries it.
      const ang = st.a * 0.7 + 20;
      if (Math.abs(st.w) > 5) face = -Math.sin(ang * DEG) * st.w >= 0 ? 1 : -1;
      const r = srx * 0.46;
      duck.setAttribute('transform', `translate(${f(sx + r * Math.cos(ang * DEG))} ${f(sy + r * SQ * Math.sin(ang * DEG) + Math.sin(st.bob) * 0.8)}) scale(${face} 1)`);
    };
    const loop = clock(s => {
      // The spin eases back to the simmer, so a stir coasts on.
      st.w += (st.base - st.w) * (1 - Math.exp(-s / 0.9));
      st.a += st.w * s;
      st.bob += s * 5;
      draw();
      if (!st.live && Math.abs(st.w) < 0.5) loop.stop();
    });
    draw();
    // One bubble at a time swells at a random spot, then pops into a ring.
    let next = null;
    const pop = () => {
      if (!st.live) return;
      const a = Math.random() * 360, rr = 0.25 + Math.random() * 0.45;
      bub.setAttribute('transform', `translate(${f(sx + Math.cos(a * DEG) * srx * rr)} ${f(sy + Math.sin(a * DEG) * sry * rr)})`);
      gsap.timeline()
        .fromTo([bb, bl], { scale: 0, opacity: 1, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.32, ease: 'back.out(2)' })
        .to([bb, bl], { scale: 1.3, opacity: 0, duration: 0.08 })
        .fromTo(ring, { scale: 0.4, opacity: 1, transformOrigin: '50% 50%' }, { scale: 2.3, opacity: 0, duration: 0.45, ease: 'power2.out' }, '<');
      next = gsap.delayedCall(0.5 + Math.random() * 0.6, pop);
    };
    let fx = null;
    return {
      enter(p) {
        st.live = true; st.base = 40; st.last = null;
        loop.start();
        fx?.kill();
        fx = gsap.timeline()
          .to(flames, { scaleY: 1.28, scaleX: 0.88, transformOrigin: '50% 100%', duration: 0.2, ease: 'sine.inOut', stagger: { each: 0.07, repeat: -1, yoyo: true } }, 0)
          .to(glow, { opacity: 0.7, duration: 0.16, ease: 'sine.inOut', repeat: -1, yoyo: true }, 0)
          .fromTo(puffs, { y: 0, scale: 0.6, opacity: 0, transformOrigin: '50% 50%' },
            { keyframes: { y: [0, -10 * P.k, -24 * P.k], opacity: [0, 0.45, 0], scale: [0.6, 1, 1.5] }, duration: 1.8, ease: 'none', stagger: { each: 0.6, repeat: -1 } }, 0);
        extra.enter?.();
        next?.kill(); pop();
        if (p) this.move(p);
      },
      // Circling the pointer round the pot stirs it.
      move(p) {
        if (!p || !st.live) return;
        const a = Math.atan2((p[1] - sy) / SQ, p[0] - sx) / DEG;
        if (st.last != null) {
          let d = a - st.last;
          d -= Math.round(d / 360) * 360;
          st.w = clamp(st.w + d * 7, -720, 720);
        }
        st.last = a;
      },
      leave() {
        st.live = false; st.base = 0; st.last = null;
        fx?.kill(); fx = null; next?.kill(); next = null;
        gsap.to(flames, { scaleY: 1, scaleX: 1, transformOrigin: '50% 100%', duration: 0.3, overwrite: true });
        gsap.to(glow, { opacity: 1, duration: 0.3, overwrite: true });
        gsap.to(puffs, { opacity: 0, duration: 0.4, overwrite: true });
        extra.leave?.();
      },
    };
  };

  // The emblem pot: white iron, a black mouth, grey soup, a white duck.
  // Black strokes keep the front flames apart from the belly.
  const potEmblem = P => {
    const [cx, cy] = P.rim, { rx, ry, t } = P, [sx, sy] = P.soup, srx = rx - t - 1, sry = ry - t * 0.8 - 1;
    const dx = sx + srx * 0.46 * Math.cos(20 * DEG), dy = sy + sry * 0.46 * Math.sin(20 * DEG);
    return `<path d="${P.back.map(flame).join('')}" fill="#fff"/>`
      + `<path d="${P.belly}" fill="#fff"/>`
      + `<path d="${P.front.map(flame).join('')}" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke"/>`
      + `<path d="${ell(cx, cy, rx, ry)}" fill="#fff"/>`
      + `<path d="${ell(cx, cy + 1, rx - t, ry - t * 0.8)}" fill="#000"/>`
      + `<path d="${ell(sx, sy, srx, sry)}" fill="#7a7a7a"/>`
      + `<ellipse cx="${P.bed[0]}" cy="${P.bed[1]}" rx="${P.bed[2]}" ry="${P.bed[3]}" fill="#fff"/>`
      + `<g transform="translate(${f(dx)} ${f(dy)}) scale(${P.dk})"><path d="M-8 -1C-9 3-5 5 0 5C6 5 9 2 8-2C6 0 2 0 0-1C-3-2-6-3-8-1Z M-8.6-1.6L-11-5L-6-2.6Z M7 -5.8C9.6-6 11.2-5.2 10.8-4C10.4-3 8.6-3 7-3.4Z" fill="#fff"/><circle cx="3.8" cy="-5" r="4.2" fill="#fff"/></g>`;
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg, u) {
      svg.innerHTML = `
        <defs>
          <radialGradient id="${u}soup" cx="0.45" cy="0.4" r="0.7"><stop offset="0" stop-color="oklch(0.82 0.13 80)"/><stop offset="1" stop-color="oklch(0.6 0.15 58)"/></radialGradient>
          <linearGradient id="${u}fire" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="oklch(0.93 0.12 92)"/><stop offset="0.45" stop-color="oklch(0.74 0.18 55)"/><stop offset="1" stop-color="oklch(0.56 0.21 32)" stop-opacity="0"/></linearGradient>
          <radialGradient id="${u}glow"><stop offset="0" stop-color="oklch(0.72 0.18 50)" stop-opacity="0.55"/><stop offset="1" stop-color="oklch(0.72 0.18 50)" stop-opacity="0"/></radialGradient>
          <linearGradient id="${u}iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.22 0.008 270)"/><stop offset="0.72" stop-color="oklch(0.16 0.01 270)"/><stop offset="1" stop-color="oklch(0.45 0.13 45)"/></linearGradient>
          <clipPath id="${u}clip"><ellipse cx="64" cy="51" rx="42" ry="15"/></clipPath>
        </defs>
        <ellipse cx="64" cy="114" rx="54" ry="14" fill="url(#${u}glow)"/>
        <g class="back" fill="url(#${u}fire)">
          <path d="M14 118C8 107 12 96 18 85C20 96 27 105 23 118Z"/>
          <path d="M105 118C101 105 107 95 111 84C114 96 119 105 114 118Z"/>
        </g>
        <path d="M36 98L31 115M92 98L97 115" fill="none" stroke="oklch(0.18 0.008 270)" stroke-width="5" stroke-linecap="round"/>
        <path d="M17 51C10 74 24 107 64 108C104 107 118 74 111 51Z" fill="url(#${u}iron)"/>
        <g class="front" fill="url(#${u}fire)">
          <path d="M44 123C39 114 42 106 46 99C48 106 53 112 50 123Z"/>
          <path d="M60 125C55 115 59 105 64 97C67 105 72 114 68 125Z"/>
          <path d="M80 123C76 114 80 106 84 100C86 107 90 114 87 123Z"/>
        </g>
        <ellipse cx="64" cy="50" rx="47" ry="18.5" fill="none" stroke="oklch(0.3 0.008 270)" stroke-width="6"/>
        <path d="M22 44C34 33 60 30 86 33" fill="none" stroke="oklch(0.66 0.01 270)" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
        <ellipse cx="64" cy="51" rx="42" ry="15" fill="url(#${u}soup)"/>
        <g clip-path="url(#${u}clip)"><g transform="translate(64 51) scale(1 0.36)"><g class="swirl" fill="none" stroke-linecap="round">
          <path d="M0 0C8-8 20-4 20 6C20 18 4 26-10 22C-28 16-30-6-18-20C-4-34 24-32 36-14" stroke="oklch(0.6 0.2 30)" stroke-width="3.2" opacity="0.75"/>
          <path d="M0 0C-8 8-20 4-20-6C-20-18-4-26 10-22C28-16 30 6 18 20C4 34-24 32-36 14" stroke="oklch(0.9 0.08 90)" stroke-width="2.6" opacity="0.6"/>
        </g></g></g>
        <g class="coin" transform="translate(51 54)"><ellipse rx="5" ry="2.4" fill="oklch(0.7 0.17 50)"/><ellipse rx="2.4" ry="1.1" fill="oklch(0.82 0.13 68)"/></g>
        <g class="duck" transform="translate(82 49)">
          <ellipse rx="7" ry="4.6" fill="oklch(0.88 0.17 96)"/>
          <circle cx="3.6" cy="-4.4" r="3.8" fill="oklch(0.88 0.17 96)"/>
          <ellipse cx="7.6" cy="-4" rx="2.6" ry="1.2" fill="oklch(0.7 0.18 48)"/>
          <circle cx="4.6" cy="-5.4" r="0.8" fill="oklch(0.15 0 0)"/>
          <circle cx="1.6" cy="-6.2" r="1" fill="oklch(1 0 0)" opacity="0.8"/>
        </g>
        <g class="steam" fill="none" stroke="oklch(0.92 0.01 80)" stroke-width="2.4" stroke-linecap="round" opacity="0.5">
          <path d="M46 36C42 30 50 26 46 18"/><path d="M64 34C60 26 68 22 64 12"/><path d="M82 36C78 30 86 26 82 18"/>
        </g>`;
      const q = s => svg.querySelector(s);
      const swirl = q('.swirl'), duck = q('.duck'), coin = q('.coin');
      const flames = [...q('.back').children, ...q('.front').children], steam = [...q('.steam').children];
      const C = [64, 51], SQ = 0.36;
      const st = { a: 0, w: 0, base: 0, last: null, bob: 0 };
      const place = (e, ang, r, lift, face = 1) => e.setAttribute('transform',
        `translate(${f(C[0] + r * Math.cos(ang * DEG))} ${f(C[1] + r * SQ * Math.sin(ang * DEG) + lift)}) scale(${face} 1)`);
      let face = 1, on = false, loops = null;
      const draw = () => {
        swirl.setAttribute('transform', `rotate(${f(st.a)})`);
        const ang = st.a * 0.7 + 20;
        if (Math.abs(st.w) > 5) face = -Math.sin(ang * DEG) * st.w >= 0 ? 1 : -1;
        place(duck, ang, 16, Math.sin(st.bob) * 0.8 - 1, face);
        place(coin, st.a * 0.7 + 165, 13, Math.sin(st.bob + 2) * 0.5);
      };
      draw();
      const tick = (t, dt) => {
        const s = Math.min(dt, 50) / 1000;
        st.w += (st.base - st.w) * (1 - Math.exp(-s / 0.9));
        st.a += st.w * s; st.bob += s * 5;
        draw();
        if (!on && Math.abs(st.w) < 0.5) gsap.ticker.remove(tick);
      };
      return {
        enter(p) {
          on = true; st.base = 40; st.last = null;
          gsap.ticker.remove(tick); gsap.ticker.add(tick);
          loops?.kill();
          loops = gsap.timeline()
            .to(flames, { scaleY: 1.3, transformOrigin: '50% 100%', duration: 0.22, ease: 'sine.inOut', stagger: { each: 0.09, repeat: -1, yoyo: true } }, 0)
            .fromTo(steam, { y: 4, opacity: 0 }, { keyframes: { y: [4, -4, -12], opacity: [0, 0.9, 0] }, duration: 1.8, ease: 'none', stagger: { each: 0.6, repeat: -1 } }, 0);
          if (p) this.move(p);
        },
        move(p) {
          if (!p || !on) return;
          const a = Math.atan2((p[1] - C[1]) / SQ, p[0] - C[0]) / DEG;
          if (st.last != null) { let d = a - st.last; d -= Math.round(d / 360) * 360; st.w = clamp(st.w + d * 7, -720, 720); }
          st.last = a;
        },
        leave() {
          on = false; st.base = 0; st.last = null;
          loops?.kill(); loops = null;
          gsap.to(flames, { scaleY: 1, transformOrigin: '50% 100%', duration: 0.3, overwrite: true });
          gsap.to(steam, { y: 0, opacity: 1, duration: 0.4, overwrite: true });
        },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // The pot seen a little from above: a wide rolled rim, a deep belly, fire round its foot.
  const PA = {
    rim: [64, 50], rx: 50, ry: 21, t: 7, soup: [64, 52.5], k: 1, dk: 1.3,
    belly: 'M15 52C12 80 34 106 64 106C94 106 116 80 113 52Z',
    glow: [64, 110, 60, 16], fire: [122, 66], bed: [64, 119.5, 18, 3],
    back: [[24, 114, 16, 30, -5], [104, 114, 16, 30, 5], [38, 116, 18, 22, -2], [90, 116, 18, 22, 2]],
    front: [[48, 120, 15, 16, -2], [58, 121, 17, 21, -1], [70, 121, 17, 20, 1], [80, 120, 15, 15, 2]],
  };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [11, 29, 106, 94],
    idea: 'The black pot with its bright rolled rim, caramel soup marbled red and cream, a rubber duck afloat and the fire round its foot. Circle the pointer to stir; hover pops bubbles and lifts steam.',
    art(svg, u) {
      svg.innerHTML = `<defs>${potDefs(u, PA)}</defs>${potMarkup(u, PA)}`;
      return cook(svg, PA);
    },
    emblem: `${EMB_HEAD}${potEmblem(PA)}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A flagstone hearth block in 30 degree iso; the pot sits on its fire.
  const TOP = [64, 46], RT = [116, 76], LT = [12, 76], T = 14;
  const at = (uu, vv) => [TOP[0] + uu * (RT[0] - TOP[0]) + vv * (LT[0] - TOP[0]), TOP[1] + uu * (RT[1] - TOP[1]) + vv * (LT[1] - TOP[1])];
  const BT = at(1, 1), down = p => [p[0], p[1] + T];
  const mid = (a, b, k = 0.5) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  // Four top stones with mortar gaps.
  const G = 0.018;
  const STONES = [[0, 0], [1, 0], [0, 1], [1, 1]].map(([i, j]) => [at(i / 2 + G, j / 2 + G), at((i + 1) / 2 - G, j / 2 + G), at((i + 1) / 2 - G, (j + 1) / 2 - G), at(i / 2 + G, (j + 1) / 2 - G)]);
  // Each side face is two stones; the gap sits in the middle.
  const face = (a, b) => [[a, mid(a, b, 0.485), down(mid(a, b, 0.485)), down(a)], [mid(a, b, 0.515), b, down(b), down(mid(a, b, 0.515))]];
  const PD = {
    rim: [64, 36], rx: 37, ry: 18.5, t: 6, soup: [64, 38.5], k: 0.8, dk: 1,
    belly: 'M28 38C26 64 44 82 64 82C84 82 102 64 100 38Z',
    glow: [64, 80, 46, 25], fire: [94, 56], bed: [64, 91, 18, 3],
    back: [[36, 80, 16, 24, -5], [92, 80, 16, 24, 5]],
    front: [[50, 91, 14, 14, -2], [58, 92, 15, 19, -1], [70, 92, 15, 18, 1], [78, 91, 14, 13, 2]],
  };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [12, 17, 104, 103],
    idea: 'A flagstone hearth block with the pot on its fire. The fire light flickers on the stones. Circle the pointer to stir; hover pops bubbles and lifts steam.',
    art(svg, u) {
      const stone = lg(`${u}stone`, [[0, 'oklch(0.6 0.015 60)'], [1, 'oklch(0.47 0.015 55)']], 'x1="0" y1="0" x2="0.6" y2="1"');
      const warm = rg(`${u}warm`, [[0, 'oklch(0.75 0.18 55)', 0.75], [0.6, 'oklch(0.62 0.18 40)', 0.25], [1, 'oklch(0.6 0.18 40)', 0]]);
      svg.innerHTML = `<defs>${potDefs(u, PD)}${stone}${warm}${blur(`${u}b`, 2.4)}
          <clipPath id="${u}top"><path d="${poly([TOP, RT, BT, LT])}"/></clipPath></defs>
        <path d="${poly([LT, BT, RT, down(RT), down(BT), down(LT)])}" fill="oklch(0.05 0.01 260)" opacity="0.45" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${poly([LT, BT, down(BT), down(LT)])}" fill="oklch(0.3 0.01 50)"/>
        <path d="${poly([BT, RT, down(RT), down(BT)])}" fill="oklch(0.2 0.01 50)"/>
        ${face(LT, BT).map(q => `<path d="${poly(q)}" fill="oklch(0.42 0.014 55)"/>`).join('')}
        ${face(BT, RT).map(q => `<path d="${poly(q)}" fill="oklch(0.29 0.012 50)"/>`).join('')}
        <path d="${poly([TOP, RT, BT, LT])}" fill="oklch(0.3 0.01 50)"/>
        ${STONES.map(q => `<path d="${poly(q)}" fill="url(#${u}stone)"/>`).join('')}
        <path d="${poly([TOP, RT, BT, LT])}" fill="url(#${u}lit)" opacity="0.4"/>
        <g clip-path="url(#${u}top)"><ellipse class="warm" cx="64" cy="80" rx="54" ry="31" fill="url(#${u}warm)"/></g>
        <path d="M${LT[0]} ${LT[1]}L${BT[0]} ${BT[1]}L${RT[0]} ${RT[1]}" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5" fill="none"/>
        ${potMarkup(u, PD)}`;
      const warmEl = svg.querySelector('.warm');
      let wt = null;
      return cook(svg, PD, {
        enter() { wt?.kill(); wt = gsap.to(warmEl, { opacity: 0.65, duration: 0.14, ease: 'sine.inOut', repeat: -1, yoyo: true, repeatRefresh: true }); },
        leave() { wt?.kill(); wt = null; gsap.to(warmEl, { opacity: 1, duration: 0.3 }); },
      });
    },
    emblem: (() => {
      const top = poly([TOP, RT, BT, LT]);
      return `${EMB_HEAD}<path d="${poly([LT, BT, down(BT), down(LT)])}" fill="#5a5a5a"/><path d="${poly([BT, RT, down(RT), down(BT)])}" fill="#3a3a3a"/><path d="${top}" fill="#8a8a8a"/>${potEmblem(PD)}</svg>`;
    })(),
  });

  /* ================= Gallery ================= */
  const NAME = 'Soup cauldron';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-cauldron';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `cauldron-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
