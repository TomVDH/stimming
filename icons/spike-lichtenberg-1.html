        const mc = disc(T.defs, `${id}mc`, root), mv = ring(T.defs, `${id}mv`, root), mp = ring(T.defs, `${id}mp`, root), mo = ring(T.defs, `${id}mo`, root);
        const ch = charLayers(T.body, segs); set(ch, { mask: mc.url });
        const og = el('g', { mask: mo.url }, T.body);
        strokes(og, segs, C.ember, w => w * 0.9 + 0.6, { filter: T.blurS, opacity: 0.55 });
        strokes(og, segs, C.emberHot, w => w * 0.45 + 0.15);
        const pg = el('g', { mask: mp.url }, T.body);
        strokes(pg, segs, C.pink, w => w * 0.9 + 0.8, { filter: T.blurS, opacity: 0.7 });
        strokes(pg, segs, C.core, w => w * 0.4 + 0.2);
        const vg = el('g', { mask: mv.url }, T.body);
        strokes(vg, segs, C.violet, w => w + 2.2, { filter: T.blurM, opacity: 0.85 });
        strokes(vg, segs, C.core, w => Math.max(0.5, w * 0.55));
        const glints = el('g', { filter: T.blurS }, T.body);
        const gl = segs.filter((s, i) => s[4] > 0.9 && i % 23 === 0).slice(0, 9).map(s => el('circle', { cx: s[2], cy: s[3], r: 0.9, fill: C.ember, opacity: 0.8 }, glints));
        const fly = sparks(T.body, 10, C.core);
        T.finish();
        const st = { r: R + 60 };
        const draw = () => { mc.c.setAttribute('r', f(Math.max(0, st.r - 4))); mv.set(st.r, 9); mp.set(st.r - 9, 10); mo.set(st.r - 22, 18); set(glints, { opacity: f(clamp((st.r - R - 20) / 30, 0, 1)) }); };
        draw();
        let tl;
        return {
          enter() {
            tl?.kill(); st.r = 0; draw();
            tl = gsap.timeline().to(st, { r: R + 60, duration: 2.6, ease: 'power1.in', onUpdate: draw });
            gl.forEach((c, i) => gsap.to(c, { attr: { r: 1.4 }, duration: 0.5 + i * 0.07, yoyo: true, repeat: 5, ease: 'sine.inOut' }));
            [0.5, 1.1, 1.7].forEach(t => gsap.delayedCall(t, () => { const s = segs[Math.floor(Math.random() * segs.length)]; throwSparks(fly.slice(0, 4), s[2], s[3]); }));
          },
          move() {}, leave() { tl?.kill(); tl = gsap.to(st, { r: R + 60, duration: 0.5, onUpdate: draw }); },
        };
      },
      emblem: () => treeEmblem(GEO.main.segs),
    },
    {
      l: 'B', name: 'Arc-over',
      idea: 'Two old burns sit cold in the paint. On hover a third crawls out between them, reaches for the char and touches it: the path back to the root flashes white, the old tree lights violet, the board flashes and sparks fly from the contact.',
      art(svg, id) {
        const T = panel(svg, id), A = GEO.arc, root = A.root, R = Math.max(...A.segs.map(s => dist(s, root))) + 1.5;
        charLayers(T.body, GEO.oldA.segs); charLayers(T.body, GEO.oldB.segs);
        const mc = disc(T.defs, `${id}mc`, root), mv = ring(T.defs, `${id}mv`, root), mo = ring(T.defs, `${id}mo`, root);
        const ch = charLayers(T.body, A.segs); set(ch, { mask: mc.url });
        strokes(T.body, A.segs, C.ember, w => w * 0.6 + 0.3, { filter: T.blurS, mask: mo.url });
        const vg = el('g', { mask: mv.url }, T.body);
        strokes(vg, A.segs, C.violet, w => w + 2.2, { filter: T.blurM });
        strokes(vg, A.segs, C.core, w => Math.max(0.5, w * 0.55));
        // The touched tree: whichever old one the tip sits nearer.
        const near = (t) => Math.min(...t.segs.map(s => Math.hypot(s[2] - A.tip[0], s[3] - A.tip[1])));
        const old = near(GEO.oldA) < near(GEO.oldB) ? GEO.oldA : GEO.oldB;
        const oldFlash = strokes(T.body, old.segs, C.violet, w => w * 0.7 + 0.4, { opacity: 0 });
        const path = el('g', { opacity: 0 }, T.body);
        strokes(path, A.segs, C.violet, w => w + 4, { filter: T.blurM }, s => s[6]);
        strokes(path, A.segs, '#fff', w => w * 0.8 + 0.6, {}, s => s[6]);
        const flash = el('rect', { x: 14, y: 14, width: 100, height: 100, fill: C.violet, opacity: 0, 'pointer-events': 'none' }, T.body);
        const fly = sparks(T.body, 16, C.core);
        T.finish();
        const st = { r: R + 40 };
        const draw = () => { mc.c.setAttribute('r', f(Math.max(0, st.r - 3))); mv.set(st.r > R + 20 ? 0 : Math.min(st.r, R + 8), 10); mo.set(st.r - 16, 22); };
        draw();
        let tl;
        return {
          enter() {
            tl?.kill(); st.r = 0; draw();
            tl = gsap.timeline()
              .to(st, { r: R, duration: 1.4, ease: 'power1.in', onUpdate: draw })
              .call(() => throwSparks(fly, A.tip[0], A.tip[1]))
              .set([path, oldFlash], { opacity: 1 }).set(flash, { opacity: 0.28 })
              .to(flash, { opacity: 0, duration: 0.35 }, '>')
              .to([path, oldFlash], { opacity: 0, duration: 0.45 }, '<0.1')
              .to(st, { r: R + 40, duration: 1.2, ease: 'none', onUpdate: draw }, '<');
          },
          move() {}, leave() { tl?.kill(); gsap.set([path, oldFlash, flash], { opacity: 0 }); tl = gsap.to(st, { r: R + 40, duration: 0.4, onUpdate: draw }); },
        };
      },
      emblem: () => `${embHead(GEO.oldA, GEO.oldB, GEO.arc)}${[GEO.oldA, GEO.oldB].map(t => buckets(t.segs).map(([w, d]) => `<path d="${d}" fill="none" stroke="#fff" stroke-width="${f(w * 1.1 + 0.4)}" stroke-linecap="round" opacity="0.45"/>`).join('')).join('')}${buckets(GEO.arc.segs).map(([w, d]) => `<path d="${d}" fill="none" stroke="#fff" stroke-width="${f(w * 1.25 + 0.5)}" stroke-linecap="round"/>`).join('')}</svg>\n`,
    },
    {
      l: 'C', name: 'Acrylic block',
      idea: 'The other board: a dark violet block lit from its left edge, the tree etched inside at four depths. Move the pointer and the block tilts, the deep planes slide against the front one and the fractures sparkle.',
      art(svg, id) {
        const defs = el('defs', {}, svg);
        el('rect', { x: 20, y: 20, width: 100, height: 100, rx: 4, fill: SHADOW }, svg);
        const cp = el('clipPath', { id: `${id}c` }, defs); el('rect', { x: 14, y: 14, width: 100, height: 100, rx: 4 }, cp);
        const bl = (n, s) => { const fl = el('filter', { id: `${id}${n}`, x: -0.3, y: -0.3, width: 1.6, height: 1.6 }, defs); el('feGaussianBlur', { stdDeviation: s }, fl); return `url(#${id}${n})`; };
        const bS = bl('s', 0.7), bM = bl('m', 1.6);
        const lg = el('linearGradient', { id: `${id}l`, x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
        el('stop', { offset: 0, 'stop-color': C.led, 'stop-opacity': 0.55 }, lg); el('stop', { offset: 0.45, 'stop-color': C.led, 'stop-opacity': 0.08 }, lg); el('stop', { offset: 1, 'stop-color': C.led, 'stop-opacity': 0.02 }, lg);
        const g = el('g', { 'clip-path': `url(#${id}c)` }, svg);
        el('rect', { x: 14, y: 14, width: 100, height: 100, fill: C.block }, g);
        const led = el('rect', { x: 14, y: 14, width: 100, height: 100, fill: `url(#${id}l)`, opacity: 0.7 }, g);
        const segs = GEO.main.segs;
        const planes = [3, 2, 1].map(k => strokes(g, segs, C.led, w => w * 0.8 + 0.3, { filter: k > 1 ? bM : bS, opacity: f(0.5 / k) }));
        const front = el('g', {}, g);
        strokes(front, segs, C.violet, w => w + 2, { filter: bM, opacity: 0.6 });
        strokes(front, segs, C.frac, w => w * 0.55 + 0.2);
        const spk = el('g', {}, g);
        const dots = segs.filter((s, i) => i % 41 === 0).map(s => el('circle', { cx: s[2], cy: s[3], r: 0.7, fill: '#fff', opacity: 0, filter: bS }, spk));
        const sheen = el('rect', { x: -40, y: 40, width: 220, height: 7, fill: '#fff', opacity: 0.05, transform: 'rotate(-28 64 64)' }, g);
        const st = { x: 0, y: 0 };
        const draw = () => {
          planes.forEach((p, i) => { const k = 3 - i; set(p, { transform: `translate(${f(-1.3 * k + st.x * k * 2.2)} ${f(0.9 * k + st.y * k * 2.2)})` }); });
          set(sheen, { transform: `rotate(-28 64 64) translate(0 ${f(st.y * 30 - st.x * 12)})` });
          set(led, { opacity: f(0.6 + 0.3 * (0.5 - st.x)) });
        };
        draw();
        let tw;
        const tw2 = dots.map(d => gsap.to(d, { opacity: 0.9, duration: 0.15, yoyo: true, repeat: -1, repeatDelay: 0.6 + Math.random() * 2.4, delay: Math.random() * 2, paused: true }));
        return {
          enter(p) { tw2.forEach(t => t.play()); if (p) this.move(p); },
          move(p) { if (!p) return; tw?.kill(); tw = gsap.to(st, { x: (p[0] - 64) / 100, y: (p[1] - 64) / 100, duration: 0.5, ease: 'power2.out', onUpdate: draw }); },
          leave() { tw?.kill(); tw = gsap.to(st, { x: 0, y: 0, duration: 0.7, onUpdate: draw }); tw2.forEach(t => { t.pause(); }); dots.forEach(d => set(d, { opacity: 0 })); },
        };
      },
      emblem: () => treeEmblem(GEO.main.segs, 1, 1).replace('<svg xmlns="http://www.w3.org/2000/svg"', '<svg xmlns="http://www.w3.org/2000/svg" data-c="1"').replace(/viewBox="[^"]+"/, 'viewBox="14 14 100 100"').replace('</svg>', '<rect x="16" y="16" width="96" height="96" rx="5" fill="none" stroke="#fff" stroke-width="3.5" opacity="0.55"/></svg>'),
    },
    {
      l: 'D', name: 'Smoulder',
      idea: 'The burn just after release: charcoal groove, embers along the trunks. On hover the embers breathe up orange, sparks spit off the hottest points and smoke curls off the channel.',
      art(svg, id) {
        const T = panel(svg, id), segs = GEO.main.segs;
        charLayers(T.body, segs);
        const hotSegs = segs.filter(s => s[4] > 0.95);
        const ember = strokes(T.body, segs, C.ember, w => w * 0.7 + 0.3, { filter: T.blurS, opacity: 0.35 }, s => s[4] > 0.95);
        const spots = el('g', { filter: T.blurS }, T.body);
        const pts = hotSegs.filter((s, i) => i % 4 === 0).map(s => el('circle', { cx: s[2], cy: s[3], r: 1.1, fill: C.emberHot, opacity: 0.25 }, spots));
        const smoke = el('g', { filter: T.blurL }, T.body);
        const puffs = [0, 1, 2, 3].map(i => { const s = hotSegs[Math.floor((i + 0.5) / 4 * hotSegs.length)]; return { s, e: el('ellipse', { cx: s[2], cy: s[3], rx: 5, ry: 3.4, fill: C.smoke, opacity: 0 }, smoke) }; });
        const fly = sparks(T.body, 12, C.emberHot);
        T.finish();
        let tws = [];
        return {
          enter() {
            tws.forEach(t => t.kill());
            tws = [gsap.to(ember, { opacity: 0.9, duration: 0.6, ease: 'sine.out' })];
            pts.forEach(p => tws.push(gsap.to(p, { opacity: 1, attr: { r: 1.7 }, duration: 0.4 + Math.random() * 0.6, yoyo: true, repeat: -1, ease: 'sine.inOut', delay: Math.random() * 0.4 })));
            puffs.forEach(({ s, e }, i) => tws.push(gsap.fromTo(e, { attr: { cx: s[2], cy: s[3], rx: 3, ry: 2 }, opacity: 0.4 }, { attr: { cx: s[2] + 6 + i, cy: s[3] - 18, rx: 8, ry: 5 }, opacity: 0, duration: 1.8, repeat: -1, delay: i * 0.45, ease: 'sine.out' })));
            tws.push(gsap.to({}, { duration: 0.35, repeat: -1, onRepeat() { const s = hotSegs[Math.floor(Math.random() * hotSegs.length)]; throwSparks(fly.slice(0, 3), s[2], s[3]); } }));
          },
          move() {}, leave() {
            tws.forEach(t => t.kill());
            tws = [gsap.to(ember, { opacity: 0.35, duration: 0.8 }), gsap.to(pts, { opacity: 0.25, attr: { r: 1.1 }, duration: 0.8 }), gsap.to(puffs.map(p => p.e), { opacity: 0, duration: 0.5 })];
          },
        };
      },
      emblem: () => treeEmblem(GEO.main.segs, 1, 0.75, GEO.main.segs.filter(s => s[4] > 0.95).filter((s, i) => i % 4 === 0).map(s => `<circle cx="${s[2]}" cy="${s[3]}" r="2.6" fill="#fff"/>`).join('')),
    },
  ];
    /* ================= Gallery ================= */

  const NAME = 'Lichtenberg burn';
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : { x: 14, y: 14, width: 100, height: 100 }, side = Math.max(b.width, b.height);
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-lichtenberg';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `lichtenberg1-${D.l.toLowerCase()}`;
    const url = `spike/emblems/${file}.svg`;
    window.EMBLEMS[file] = D.emblem();
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header><b>${D.l}</b><span>· ${D.name}</span></header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      <div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>
      <p class="idea">${D.idea}</p>`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
