<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Washing line 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Washing line 1</h1>
<p class="lede">Washing line, round 1. A (picked, no sun): the washing leans away from the pointer; a fast move is a gust. D: move along the line to reel the washing; the pulley wheels turn.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const set = (e, a) => { for (const k in a) e.setAttribute(k, a[k]); };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');

  // The toy's wardrobe: a cream sheet, a blue shirt, a coral towel.
  // Each has a base and a shade.
  const CLOTH = [
    { t: [0.07, 0.36], h: 33, base: 'oklch(0.93 0.03 85)', shade: 'oklch(0.76 0.04 75)' },
    { t: [0.42, 0.62], h: 26, base: 'oklch(0.6 0.14 250)', shade: 'oklch(0.42 0.13 256)' },
    { t: [0.68, 0.9], h: 21, base: 'oklch(0.72 0.15 35)', shade: 'oklch(0.55 0.15 30)' },
  ];
  const PEG = 'oklch(0.78 0.1 65)';

  // A sagging line as a quadratic: two ends and a low middle.
  const sagLine = (A, B, sag) => {
    const C = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2 + sag * 2];
    return t => [lerp(lerp(A[0], C[0], t), lerp(C[0], B[0], t), t), lerp(lerp(A[1], C[1], t), lerp(C[1], B[1], t), t)];
  };
  // One piece of washing: its top follows the line; its hem waves and blows.
  // sway pushes the hem sideways; wave ripples it; flat bends a hem flatter.
  const piecePts = (at, t0, t1, h, sway, wave) => {
    const top = [], bot = [];
    for (let i = 0; i <= 6; i++) top.push(at(lerp(t0, t1, i / 6)));
    for (let i = 6; i >= 0; i--) {
      const p = top[i], k = i / 6;
      bot.push([p[0] + sway * h * 0.55, p[1] + h * (1 - Math.abs(sway) * 0.18) + Math.sin(wave + k * 4.2) * 1.4]);
    }
    return [...top, ...bot];
  };
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } }, once: tick };
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `
        <rect x="22" y="22" width="92" height="92" fill="oklch(0.07 0.01 260)"/>
        <rect x="16" y="16" width="92" height="92" fill="oklch(0.72 0.06 235)"/>
        <circle cx="62" cy="58" r="9" fill="oklch(0.97 0.03 80)"/>
        <path d="M16 38Q62 52 108 38" stroke="oklch(0.2 0.01 260)" stroke-width="1.6" fill="none"/>
        <g class="sh">
          <path d="M24 41L44 46V70L26 66Z" fill="oklch(0.92 0.03 85)"/>
          <path d="M50 47L74 47V76L52 74Z" fill="oklch(0.68 0.15 40 / 0.9)"/>
          <path d="M80 46L100 41L102 64L82 68Z" fill="oklch(0.8 0.14 82)"/>
        </g>`;
      const sheets = [...svg.querySelectorAll('.sh path')];
      let tl = null;
      return {
        enter() {
          if (tl) return;
          tl = gsap.timeline({ repeat: -1, repeatDelay: 0.3 })
            .to(sheets, { skewY: -9, scaleX: 0.86, svgOrigin: '62 44', duration: 0.35, ease: 'power2.out', stagger: 0.12 })
            .to(sheets, { skewY: 0, scaleX: 1, svgOrigin: '62 44', duration: 0.6, ease: 'elastic.out(1, 0.4)', stagger: 0.12 });
        },
        move() {},
        leave() { tl?.kill(); tl = null; gsap.to(sheets, { skewY: 0, scaleX: 1, svgOrigin: '62 44', duration: 0.4, overwrite: true }); },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // Two posts, a sagging line and three pieces.
  const A_ENDS = [[22, 37], [106, 40]], A_SAG = 6;
  const aLine = sagLine(A_ENDS[0], A_ENDS[1], A_SAG);
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [12, 26, 104, 84],
    idea: 'Tom\'s pick, without the sun. Two weathered posts, a pulley line and three pieces in the toy\'s colours. The washing leans away from the pointer; a quick move is a gust.',
    art(svg, u) {
      const defs = CLOTH.map((c, i) => lg(`${u}c${i}`, [[0, c.base], [1, c.shade]], 'x1="0" y1="0" x2="0.4" y2="1"')).join('');
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.2)}
          ${lg(`${u}post`, [[0, 'oklch(0.6 0.04 65)'], [0.45, 'oklch(0.44 0.04 58)'], [1, 'oklch(0.27 0.03 50)']], 'x1="0" y1="0" x2="1" y2="0"')}
          ${defs}</defs>
        <ellipse cx="64" cy="106" rx="50" ry="3.6" fill="oklch(0.05 0.01 260)" opacity="0.55" filter="url(#${u}b)"/>
        <path class="post" d="M17 106V35Q17 31 20 31H21Q24 31 24 35V106Z" fill="url(#${u}post)"/>
        <path d="M17.6 104V35Q17.6 32 20 31.8" stroke="url(#${u}rim)" stroke-width="1" fill="none"/>
        <g transform="rotate(-3 107 106)"><path d="M104 106V38Q104 34 107 34H108Q111 34 111 38V106Z" fill="url(#${u}post)"/>
        <path d="M104.6 104V38Q104.6 35 107 34.8" stroke="url(#${u}rim)" stroke-width="1" fill="none"/></g>
        <path class="line" fill="none" stroke="oklch(0.22 0.01 260)" stroke-width="1.3"/>
        <g class="halo"></g><g class="cloth"></g>
        <g class="wheels"></g>`;
      const q = s => svg.querySelector(s);
      const line = q('.line'), cloth = q('.cloth'), wheels = q('.wheels');
      let d = 'M' + aLine(0).map(f).join(' ');
      for (let i = 1; i <= 24; i++) d += 'L' + aLine(i / 24).map(f).join(' ');
      line.setAttribute('d', d);
      // Each piece: the cloth, the shared light and two pegs.
      const parts = CLOTH.map((c, i) => ({
        c,
        body: el('path', { fill: `url(#${u}c${i})` }, cloth),
        lit: el('path', { fill: `url(#${u}lit)`, opacity: 0.5 }, cloth),
        rim: el('path', { fill: 'none', stroke: `url(#${u}rim)`, 'stroke-width': 0.8, opacity: 0.7 }, cloth),
        pegs: [el('rect', { width: 2.2, height: 4.4, rx: 0.6, fill: PEG }, cloth), el('rect', { width: 2.2, height: 4.4, rx: 0.6, fill: PEG }, cloth)],
        sway: 0, v: 0,
      }));
      // Pulley wheels at the line's two ends.
      const wheel = ([x, y]) => {
        const g = el('g', { transform: `translate(${x} ${y})` }, wheels);
        el('circle', { r: 3.8, fill: 'oklch(0.32 0.01 250)', stroke: 'oklch(0.7 0.01 250)', 'stroke-width': 1.1 }, g);
        el('circle', { r: 1.1, fill: 'oklch(0.85 0.01 250)' }, g);
        return g;
      };
      A_ENDS.forEach(wheel);
      const st = { px: null, wind: 0, last: null, live: false };
      const draw = time => {
        parts.forEach((p, i) => {
          // A spring pulls each hem toward the wind; each piece lags a little.
          // A piece leans away from a near pointer; the gust adds on top.
          const top = piecePts(aLine, p.c.t[0], p.c.t[1], p.c.h, 0, 0), cx = (top[0][0] + top[6][0]) / 2;
          const push = st.px == null ? 0 : Math.sign(cx - st.px) * Math.exp(-Math.abs(cx - st.px) / 16) * 0.42;
          const target = push + st.wind * (1 - i * 0.12) + (st.live ? Math.sin(time * 2.1 + i * 1.7) * 0.05 : 0);
          p.v += (target - p.sway) * 0.22; p.v *= 0.72; p.sway += p.v;
          const pts = piecePts(aLine, p.c.t[0], p.c.t[1], p.c.h, p.sway, (st.live ? time * 3.2 : 0) + i * 2);
          const dd = poly(pts);
          [p.body, p.lit, p.rim].forEach(e => e.setAttribute('d', dd));
          [pts[0], pts[6]].forEach((pt, j) => set(p.pegs[j], { x: f(pt[0] - 1.1 + (j ? -2 : 2)), y: f(pt[1] - 2.2) }));
        });
        st.wind *= 0.9;
        // The clock stops once the pointer has left and every hem is at rest.
        if (!st.live && parts.every(p => Math.abs(p.sway) < 0.004 && Math.abs(p.v) < 0.004)) loop.stop();
      };
      const loop = clock(draw);
      draw(0);
      let demo = null;
      return {
        enter(p) {
          st.live = true; loop.start();
          // With no pointer, a breeze comes and goes by itself.
          if (!p) { demo = gsap.to(st, { wind: 0.35, duration: 0.9, yoyo: true, repeat: -1, ease: 'sine.inOut' }); return; }
          st.last = p; st.px = p[0];
        },
        move(p) {
          if (!p) return;
          demo?.kill(); demo = null;
          // A fast move blows the washing the same way.
          st.px = p[0];
          if (st.last) st.wind = clamp(st.wind + (p[0] - st.last[0]) * 0.035, -0.6, 0.6);
          st.last = p;
        },
        leave() {
          demo?.kill(); demo = null; st.last = null; st.px = null; st.live = false; st.wind = 0;
        },
      };
    },
    emblem: (() => {
      const body = CLOTH.map(c => poly(piecePts(aLine, c.t[0], c.t[1], c.h, 0, 0))).join('');
      let line = 'M' + aLine(0).map(f).join(' ');
      for (let i = 1; i <= 24; i++) line += 'L' + aLine(i / 24).map(f).join(' ');
      return `${EMB_HEAD}<path d="M17 106V35Q17 31 20.5 31Q24 31 24 35V106Z" fill="#fff"/><path d="M104 106V38Q104 34 107.5 34Q111 34 111 38V106Z" fill="#fff" transform="rotate(-3 107 106)"/><path d="${line}" stroke="#fff" stroke-width="2.4" fill="none"/><path d="${body}" fill="#fff"/></svg>`;
    })(),
  });

  /* ================= D: Isometric block ================= */

  // A block of cliff-top turf; the line runs corner to corner, level across the face.
  const iso = (gx, gy, h = 0) => [64 + (gx - gy) * 0.6, 64 + (gx + gy - 128) * 0.42 - h];
  const G0 = 22, G1 = 106, T = 12, POST_H = 36;
  const PA = [32, 96], PB = [96, 32];
  const D_TOP = [iso(...PA, POST_H - 2), iso(...PB, POST_H - 2)];
  const dLine = sagLine(D_TOP[0], D_TOP[1], 4);
  // The pieces as line spans; the reel slides them along together.
  const D_CLOTH = [
    { t: [0.08, 0.34], h: 20, c: CLOTH[0] },
    { t: [0.4, 0.6], h: 16, c: CLOTH[1] },
    { t: [0.66, 0.88], h: 13, c: CLOTH[2] },
  ];
  const D_CORNERS = [[G0, G0], [G1, G0], [G1, G1], [G0, G1]].map(([x, y]) => iso(x, y));
  const down = p => [p[0], p[1] + T];
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [12, 12, 104, 104],
    idea: 'A block of cliff-top turf with a pulley line across it. Move along the line to reel: the washing slides with the pointer and both wheels turn. Thrift grows at the front edge.',
    art(svg, u) {
      const [c0, c1, c2, c3] = D_CORNERS;
      const turf = lg(`${u}turf`, [[0, 'oklch(0.78 0.12 135)'], [1, 'oklch(0.62 0.12 140)']], 'x1="0" y1="0" x2="0.6" y2="1"');
      const post = lg(`${u}post`, [[0, 'oklch(0.6 0.04 65)'], [0.5, 'oklch(0.44 0.04 58)'], [1, 'oklch(0.27 0.03 50)']], 'x1="0" y1="0" x2="1" y2="0"');
      const cl = D_CLOTH.map((d, i) => lg(`${u}c${i}`, [[0, d.c.base], [1, d.c.shade]], 'x1="0" y1="0" x2="0.3" y2="1"')).join('');
      // Tufts and thrift: a seeded scatter, the same on every tile.
      let s = 7;
      const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
      let tufts = '', pinks = '';
      for (let i = 0; i < 26; i++) {
        const gx = lerp(G0 + 4, G1 - 4, rnd()), gy = lerp(G0 + 4, G1 - 4, rnd()), [x, y] = iso(gx, gy);
        tufts += `M${f(x - 1.4)} ${f(y)}l${f(0.6)} -2.6M${f(x)} ${f(y)}l0 -3.2M${f(x + 1.4)} ${f(y)}l-0.6 -2.4`;
      }
      for (let i = 0; i < 9; i++) {
        const gx = lerp(G0 + 6, G1 - 6, rnd()), gy = G1 - 3 - rnd() * 6, [x, y] = iso(gx, gy);
        pinks += `<circle cx="${f(x)}" cy="${f(y - 2)}" r="${f(1.2 + rnd() * 0.6)}"/>`;
      }
      const postPath = (g, h) => { const [bx, by] = iso(...g), w = 2.6; return `M${f(bx - w)} ${f(by)}V${f(by - h)}Q${f(bx)} ${f(by - h - 2.6)} ${f(bx + w)} ${f(by - h)}V${f(by)}Z`; };
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}${turf}${post}${cl}</defs>
        <path d="${poly([c1, c2, c3, down(c3), down(c2), down(c1)])}" fill="oklch(0.05 0.01 260)" opacity="0.45" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${poly([c3, c2, down(c2), down(c3)])}" fill="oklch(0.5 0.05 62)"/>
        <path d="${poly([c2, c1, down(c1), down(c2)])}" fill="oklch(0.34 0.04 55)"/>
        <path d="${poly([c0, c1, c2, c3])}" fill="url(#${u}turf)"/>
        <path d="${poly([c0, c1, c2, c3])}" fill="url(#${u}lit)" opacity="0.35"/>
        <path d="M${f(c3[0])} ${f(c3[1])}L${f(c2[0])} ${f(c2[1])}L${f(c1[0])} ${f(c1[1])}" stroke="#fff" stroke-opacity="0.55" stroke-width="1" fill="none"/>
        <path d="${tufts}" stroke="oklch(0.5 0.12 140)" stroke-width="0.9" stroke-linecap="round" fill="none"/>
        <g fill="oklch(0.78 0.13 350)">${pinks}</g>
        <path class="shadow" fill="oklch(0.25 0.06 150)" opacity="0.28" filter="url(#${u}b)"/>
        <path d="${postPath(PA, POST_H)}" fill="url(#${u}post)"/>
        <path class="line" fill="none" stroke="oklch(0.2 0.01 260)" stroke-width="1.1"/>
        <g class="cloth"></g>
        <path d="${postPath(PB, POST_H)}" fill="url(#${u}post)"/>
        <g class="wheels"></g>`;
      const q = sel => svg.querySelector(sel);
      let ld = 'M' + dLine(0).map(f).join(' ');
      for (let i = 1; i <= 20; i++) ld += 'L' + dLine(i / 20).map(f).join(' ');
      q('.line').setAttribute('d', ld);
      const cloth = q('.cloth'), shadow = q('.shadow'), wheels = q('.wheels');
      const parts = D_CLOTH.map((d, i) => ({
        d,
        body: el('path', { fill: `url(#${u}c${i})` }, cloth),
        lit: el('path', { fill: `url(#${u}lit)`, opacity: 0.45 }, cloth),
        rim: el('path', { fill: 'none', stroke: `url(#${u}rim)`, 'stroke-width': 0.7, opacity: 0.7 }, cloth),
        sway: 0, v: 0,
      }));
      // A wheel in iso: an ellipse in the line's plane with one spoke that turns.
      const spokes = D_TOP.map(([x, y]) => {
        const g = el('g', { transform: `translate(${f(x)} ${f(y)})` }, wheels);
        el('ellipse', { rx: 3.2, ry: 3.6, fill: 'oklch(0.32 0.01 250)', stroke: 'oklch(0.72 0.01 250)', 'stroke-width': 1 }, g);
        return el('line', { x1: 0, y1: -2.6, x2: 0, y2: 2.6, stroke: 'oklch(0.85 0.01 250)', 'stroke-width': 0.9 }, g);
      });
      const st = { reel: 0, last: null, live: false, wind: 0 };
      const draw = time => {
        let shadowD = '';
        parts.forEach((p, i) => {
          const target = st.wind * (1 - i * 0.15) + (st.live ? Math.sin(time * 2.3 + i * 1.9) * 0.04 : 0);
          p.v += (target - p.sway) * 0.22; p.v *= 0.72; p.sway += p.v;
          const t0 = clamp(p.d.t[0] + st.reel, 0.02, 0.98), t1 = clamp(p.d.t[1] + st.reel, 0.02, 0.98);
          const pts = piecePts(dLine, t0, t1, p.d.h, p.sway, (st.live ? time * 3 : 0) + i * 2);
          const dd = poly(pts);
          [p.body, p.lit, p.rim].forEach(e => e.setAttribute('d', dd));
          // The cloth's shadow falls on the turf below and to the right.
          const foot = pts.map(([x, y]) => [x + 7, y + 24 - (y - pts[0][1]) * 0.5]);
          shadowD += poly(foot);
        });
        shadow.setAttribute('d', shadowD);
        spokes.forEach(sp => sp.setAttribute('transform', `rotate(${f(st.reel * 900)})`));
        st.wind *= 0.9;
      };
      const loop = clock(draw);
      draw(0);
      // The pointer's place along the line, from 0 at the left post to 1 at the right.
      const along = p => {
        const [A, B] = D_TOP, dx = B[0] - A[0], dy = B[1] - A[1];
        return clamp(((p[0] - A[0]) * dx + (p[1] - A[1]) * dy) / (dx * dx + dy * dy));
      };
      let demo = null, grab = null;
      return {
        enter(p) {
          st.live = true; loop.start();
          if (!p) { demo = gsap.timeline({ repeat: -1, yoyo: true }).to(st, { reel: 0.1, duration: 1.2, ease: 'sine.inOut' }).to(st, { reel: -0.06, duration: 1.2, ease: 'sine.inOut' }); return; }
          grab = along(p) - st.reel; st.last = p;
        },
        move(p) {
          if (!p) return;
          // Reel: the washing keeps its place under the pointer, within the line.
          if (grab == null) grab = along(p) - st.reel;
          const r = clamp(along(p) - grab, -0.06, 0.12);
          if (st.last) st.wind = clamp(st.wind + (r - st.reel) * 6, -0.5, 0.5);
          gsap.to(st, { reel: r, duration: 0.25, ease: 'power2.out', overwrite: true });
          st.last = p;
        },
        leave() {
          demo?.kill(); demo = null; grab = null; st.last = null;
          gsap.to(st, { reel: 0, duration: 0.8, ease: 'power2.inOut', overwrite: true, onComplete: () => { st.live = false; gsap.delayedCall(0.6, () => { if (!st.live) loop.stop(); }); } });
        },
      };
    },
    emblem: (() => {
      const [c0, c1, c2, c3] = D_CORNERS;
      const body = D_CLOTH.map(d => poly(piecePts(dLine, d.t[0], d.t[1], d.h, 0, 0))).join('');
      const post = g => { const [bx, by] = iso(...g); return `M${f(bx - 2.8)} ${f(by)}V${f(by - POST_H)}H${f(bx + 2.8)}V${f(by)}Z`; };
      let line = 'M' + dLine(0).map(f).join(' ');
      for (let i = 1; i <= 20; i++) line += 'L' + dLine(i / 20).map(f).join(' ');
      return `${EMB_HEAD}<path d="${poly([c3, c2, down(c2), down(c3)])}" fill="#5a5a5a"/><path d="${poly([c2, c1, down(c1), down(c2)])}" fill="#3a3a3a"/><path d="${poly([c0, c1, c2, c3])}" fill="#8a8a8a"/><path d="${post(PA)}${post(PB)}" fill="#fff"/><path d="${line}" stroke="#fff" stroke-width="2.2" fill="none"/><path d="${body}" fill="#fff"/></svg>`;
    })(),
  });

  /* ================= Gallery ================= */
  const NAME = 'Washing line';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-washline';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `washline-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
