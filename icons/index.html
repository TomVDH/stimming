<style>
/* Three icon directions for the six main toys, side by side. */
.wrap { gap: clamp(32px, 5vw, 56px); }
section { display: grid; gap: 10px; }
h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
section p { margin: 0; color: var(--muted); font-size: 14px; }
.row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: clamp(12px, 2vw, 24px); margin-top: 14px; }
@media (max-width: 760px) { .row { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
figure { margin: 0; display: grid; justify-items: center; gap: 10px; }
figure svg { width: 100%; max-width: 140px; aspect-ratio: 1; overflow: visible; transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
figure:hover svg { transform: translateY(-4px) rotate(-3deg); }
figcaption { font-size: 14px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { figure svg { transition: none; } }
</style>
