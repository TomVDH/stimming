<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Leaf shadows 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Leaf shadows 1</h1>
<p class="lede">Leaf shadows, round 1. No pick yet; A goes on the menu until Tom picks. A: a backlit sprig of leaves over a tile of sunlit plaster, its cool shadow and gold dapples on the tile. D: a block of plaster with the sprig's shadow and the dapples on its top, the sprig above it.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  const DIRS = [];

  // The toy's tokens: backlit leaves, sunlit lime plaster, a cool shadow, gold dapples.
  const LEAF = [[0, 'oklch(0.9 0.16 118)'], [0.5, 'oklch(0.74 0.18 132)'], [1, 'oklch(0.5 0.14 145)']];
  const STEM = [[0, 'oklch(0.66 0.09 95)'], [1, 'oklch(0.44 0.07 70)']];
  const PLASTER = [[0, 'oklch(0.96 0.045 90)'], [0.55, 'oklch(0.87 0.08 80)'], [1, 'oklch(0.72 0.1 62)']];
  const SHADE = 'oklch(0.52 0.045 250)';
  const DAPPLE = 'oklch(0.99 0.1 95)';
  const GLOW = 'oklch(0.86 0.15 82)';

  // An ovate leaf from its base b to its tip t, w wide, its midrib bowed by bow.
  const leafShape = (b, t, w, bow = 0.08) => {
    const ax = t[0] - b[0], ay = t[1] - b[1], L = Math.hypot(ax, ay), nx = -ay / L, ny = ax / L;
    const at = (e, off) => {
      const c = bow * L * 4 * e * (1 - e);
      return [b[0] + ax * e + nx * (off + c), b[1] + ay * e + ny * (off + c)];
    };
    // Widest a third of the way up, then a long drawn-out tip.
    const half = e => (w / 2) * Math.pow(e, 0.55) * Math.pow(1 - e, 0.9) / 0.381;
    const left = [], right = [], rib = [];
    for (let i = 0; i <= 28; i++) { const e = i / 28; left.push(at(e, -half(e))); right.push(at(e, half(e))); rib.push(at(e, 0)); }
    return {
      d: poly(left.concat(right.slice().reverse())),
      // The near half of the blade catches more light.
      lit: poly(rib.concat(right.slice().reverse())),
      rib: 'M' + rib.slice(2, 25).map(p => `${f(p[0])} ${f(p[1])}`).join('L'),
    };
  };
  // A tapered stem along a quadratic curve.
  const stemShape = (a, c, b, w0, w1) => {
    const at = e => { const u = 1 - e; return [u * u * a[0] + 2 * u * e * c[0] + e * e * b[0], u * u * a[1] + 2 * u * e * c[1] + e * e * b[1]]; };
    const n = 16, pts = Array.from({ length: n + 1 }, (_, i) => at(i / n));
    const L = [], R = [];
    pts.forEach((p, i) => {
      const q = pts[Math.min(n, i + 1)], o = pts[Math.max(0, i - 1)];
      const dx = q[0] - o[0], dy = q[1] - o[1], l = Math.hypot(dx, dy), w = (w0 + (w1 - w0) * i / n) / 2;
      L.push([p[0] - dy / l * w, p[1] + dx / l * w]); R.push([p[0] + dy / l * w, p[1] - dx / l * w]);
    });
    return { d: poly(L.concat(R.reverse())), at };
  };
  // The sprig: a stem and four leaves, each leaf its own group so it can flutter.
  const SPRIG = (() => {
    const stem = stemShape([6, 12], [36, 22], [62, 54], 4.2, 2.4);
    const spec = [[0.28, [44, 2], 18], [0.5, [16, 66], 19], [0.74, [80, 26], 18], [1, [94, 92], 22]];
    const leaves = spec.map(([e, tip, w]) => { const b = stem.at(e); return { b, ...leafShape(b, tip, w, e === 1 ? -0.06 : 0.07) }; });
    return { stem, leaves, base: [6, 12] };
  })();
  const sprigArt = (u, cls) => `<g class="${cls}">
        ${body(SPRIG.stem.d, u, 'stem')}
        ${SPRIG.leaves.map((L, i) => `<g class="${cls}${i}">${body(L.d, u, 'leaf')}<path d="${L.lit}" fill="#fff" opacity="0.16"/><path d="${L.rib}" fill="none" stroke="oklch(0.95 0.1 112)" stroke-width="2" stroke-linecap="round" opacity="0.45"/></g>`).join('')}</g>`;
  // The shadow of the sprig: one flat cool shape, a little soft at its edge.
  const shadeArt = (u, cls) => `<g class="${cls}" fill="${SHADE}" opacity="0.85" filter="url(#${u}c)">
        <path d="${SPRIG.stem.d}"/>${SPRIG.leaves.map((L, i) => `<path class="${cls}${i}" d="${L.d}"/>`).join('')}</g>`;
  // Dapples: soft gold ellipses, stretched down the slant of the light.
  const dappleArt = (u, pts) => pts.map(([x, y, s], i) => `<g class="dp${i}" transform="translate(${x} ${y}) rotate(38)"><ellipse rx="${f(9 * s)}" ry="${f(5.4 * s)}" fill="${GLOW}" opacity="0.6" filter="url(#${u}g)"/><ellipse rx="${f(6.4 * s)}" ry="${f(3.8 * s)}" fill="${DAPPLE}"/></g>`).join('');

  // The shared motion: the pointer brings a breeze.
  // The sprig sways and its leaves flutter; the shadow follows; the dapples blink.
  const run = (svg, sh, dn) => {
    const st = { live: false, k: 0, last: 0 };
    const q = c => svg.querySelector(c);
    const sprig = q('.sp'), shade = q('.sh');
    const leaves = [0, 1, 2, 3].map(i => [q(`.sp${i}`), q(`.sh${i}`)]);
    const dapples = Array.from({ length: dn }, (_, i) => q(`.dp${i}`));
    const [bx, by] = SPRIG.base;
    const paint = time => {
      const k = st.k;
      const sway = (Math.sin(time * 3.1) * 4 + Math.sin(time * 7.3 + 1) * 1.4) * k;
      sprig.setAttribute('transform', `rotate(${f(sway)} ${bx} ${by})`);
      shade.setAttribute('transform', `${sh} rotate(${f(sway)} ${bx} ${by})`);
      leaves.forEach(([a, b], i) => {
        const L = SPRIG.leaves[i], fl = (Math.sin(time * 9.5 + i * 1.9) * 7 + Math.sin(time * 15 + i) * 2) * k;
        const tr = `rotate(${f(fl)} ${f(L.b[0])} ${f(L.b[1])})`;
        a.setAttribute('transform', tr); b.setAttribute('transform', tr);
      });
      dapples.forEach((d, i) => d.setAttribute('opacity', f(1 - k * (0.45 + 0.45 * Math.sin(time * (8 + i * 1.7) + i * 2.3)) * (0.5 + 0.5 * Math.sin(time * 2.1 + i)))));
    };
    const step = time => {
      const dt = Math.min(0.1, time - (st.last || time));
      st.last = time;
      st.k = st.live ? Math.min(1, st.k + dt * 2.5) : Math.max(0, st.k - dt * 1.2);
      paint(time);
      if (!st.live && st.k <= 0 && st.last > 0) { st.last = 0; loop.stop(); }
    };
    const loop = clock(step);
    return {
      enter() { st.live = true; loop.start(); },
      move() {},
      leave() { st.live = false; loop.start(); },
    };
  };
  const defs = u => `${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 2.8)}${blur(`${u}c`, 1.1)}${lg(`${u}leaf`, LEAF, 'x1="0" y1="0" x2="0.5" y2="1"')}${lg(`${u}stem`, STEM)}${lg(`${u}plaster`, PLASTER, 'x1="0" y1="0" x2="0.8" y2="1"')}${rg(`${u}sun`, [[0, GLOW, 0.32], [1, GLOW, 0]])}`;

  /* ================= Current ================= */

  // Leaf shadows is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // A tile of sunlit plaster, turned a little; the sprig hangs over its upper left.
  const roundRect = (x, y, w, h, r) => `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
  const TILE = roundRect(28, 30, 92, 92, 12), TILE_T = 'rotate(-7 74 76)';
  const A_SH = 'translate(15 17)';
  const A_DAPPLES = [[50, 94, 1.55], [105, 50, 1.3], [94, 110, 1.15], [113, 84, 1.0]];
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [5, 3, 118, 122],
    idea: 'A tile of warm lime plaster in late sun, turned a little. A sprig of four backlit leaves, fresh yellow-green with a lit half and a pale midrib, hangs over its upper left. On the tile lies the sprig’s shadow, cool grey-blue and a little soft, and four gold dapples stretched down the slant of the light. The pointer brings a breeze: the sprig sways and its leaves flutter, the shadow moves with it, the dapples blink.',
    art(svg, u) {
      svg.innerHTML = `<defs>${defs(u)}<clipPath id="${u}clip"><path d="${TILE}" transform="${TILE_T}"/></clipPath></defs>
        <ellipse cx="74" cy="123" rx="46" ry="4" fill="oklch(0.05 0.01 240)" opacity="0.6" filter="url(#${u}b)"/>
        <circle cx="80" cy="74" r="50" fill="url(#${u}sun)"/>
        <g transform="${TILE_T}">${body(TILE, u, 'plaster')}</g>
        <g clip-path="url(#${u}clip)">${shadeArt(u, 'sh')}${dappleArt(u, A_DAPPLES)}</g>
        ${sprigArt(u, 'sp')}`;
      svg.querySelector('.sh').setAttribute('transform', A_SH);
      return run(svg, A_SH, A_DAPPLES.length);
    },
    // The emblem: the tile grey, its shadow dark, the dapples and the sprig white.
    emblem: `${EMB_HEAD}<clipPath id="c"><path d="${TILE}" transform="${TILE_T}"/></clipPath><path d="${TILE}" transform="${TILE_T}" fill="#6e6e6e"/><g clip-path="url(#c)"><g transform="${A_SH}" fill="#3c3c3c"><path d="${SPRIG.stem.d}"/>${SPRIG.leaves.map(L => `<path d="${L.d}"/>`).join('')}</g>${A_DAPPLES.map(([x, y, s]) => `<ellipse rx="${f(6.4 * s)}" ry="${f(3.8 * s)}" transform="translate(${x} ${y}) rotate(38)" fill="#fff"/>`).join('')}</g><path d="${SPRIG.stem.d}" fill="#fff"/>${SPRIG.leaves.map(L => `<path d="${L.d}" fill="#fff"/>`).join('')}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A block of plaster; the shadow and the dapples lie on its top; the sprig hangs above.
  const CY = 82, HX = 34, HY = 34, T = 14;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // Flat ground space onto the top face.
  const ON_TOP = `matrix(0.866 0.5 -0.866 0.5 64 ${CY})`;
  // The sprig, small, above the block's left corner.
  const D_SPRIG = 'translate(4 -4) scale(0.72)';
  // Its shadow on the top: the same sprig laid flat, offset down the light.
  const D_SH = `${ON_TOP} translate(-32 -34) scale(0.72)`;
  const D_DAPPLES = [[16, 22, 1.45], [24, -18, 1.2], [-18, 24, 1.15]];
  const dDapples = u => D_DAPPLES.map(([gx, gy, s], i) => `<g class="dp${i}" transform="${ON_TOP} translate(${gx} ${gy}) rotate(-20)"><ellipse rx="${f(8 * s)}" ry="${f(4.8 * s)}" fill="${GLOW}" opacity="0.6" filter="url(#${u}g)"/><ellipse rx="${f(5.6 * s)}" ry="${f(3.4 * s)}" fill="${DAPPLE}"/></g>`).join('');
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [6, 4, 116, 112],
    idea: 'A block of lime plaster at 30 degrees: a warm sunlit top, a mid ochre left face, a dark right face, a rim on the top edges. The sprig’s cool shadow and three gold dapples lie on the top; the backlit sprig hangs above the block’s left corner. The pointer brings a breeze: the sprig sways and flutters, its shadow follows on the top, the dapples blink.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${defs(u)}
          ${lg(`${u}L`, [[0, 'oklch(0.74 0.08 72)'], [1, 'oklch(0.6 0.07 62)']])}
          ${lg(`${u}R`, [[0, 'oklch(0.52 0.06 60)'], [1, 'oklch(0.4 0.05 55)']])}
          <clipPath id="${u}clip"><path d="${top}"/></clipPath></defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}plaster)"/>
        <g clip-path="url(#${u}clip)">${shadeArt(u, 'sh')}${dDapples(u)}</g>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.5" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g transform="${D_SPRIG}">${sprigArt(u, 'sp')}</g>`;
      svg.querySelector('.sh').setAttribute('transform', D_SH);
      return run(svg, D_SH, D_DAPPLES.length);
    },
    emblem: `${EMB_HEAD}<clipPath id="c"><path d="${poly([N, E, S, W])}"/></clipPath><path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/><g clip-path="url(#c)"><g transform="${D_SH}" fill="#4a4a4a"><path d="${SPRIG.stem.d}"/>${SPRIG.leaves.map(L => `<path d="${L.d}"/>`).join('')}</g>${D_DAPPLES.map(([gx, gy, s]) => `<ellipse rx="${f(5.6 * s)}" ry="${f(3.4 * s)}" transform="${ON_TOP} translate(${gx} ${gy}) rotate(-20)" fill="#fff"/>`).join('')}</g><g transform="${D_SPRIG}" fill="#fff"><path d="${SPRIG.stem.d}"/>${SPRIG.leaves.map(L => `<path d="${L.d}"/>`).join('')}</g></svg>`,
  });

  // ?menu prints A's markup for the menu tile, with the toy's id on its defs.
  window.MENU_A = () => {
    const D = DIRS[1], svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' });
    D.art(svg, 'leafshadows-');
    const side = Math.max(D.box[2], D.box[3]), size = side * 128 / 110, cx = D.box[0] + D.box[2] / 2, cy = D.box[1] + D.box[3] / 2;
    return { viewBox: `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`, inner: svg.innerHTML };
  };

  /* ================= Gallery ================= */
  const NAME = 'Leaf shadows';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-leafshadows';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `leafshadows-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
