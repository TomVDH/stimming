<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Frietkot 2</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; max-width: 70ch; }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.icons { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t256, .t256 svg { width: 256px; height: 256px; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
@media (max-width: 420px) { .t256, .t256 svg { width: 220px; height: 220px; } }
</style>
</head>
<body>
<h1>Icon spike: Frietkot 2</h1>
<p class="lede">Round 2: four objects, each live under the pointer. Each shows at 256, 128 and 64. Move the pointer over a tile and around it; focus a tile with the keyboard for a demo.</p>
<div class="row" id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  gsap.ticker.fps(60);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +(+n).toFixed(2);
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const set = (e, a) => { for (const k in a) e.setAttribute(k, typeof a[k] === 'number' ? f(a[k]) : a[k]); };
  const grad = (defs, type, id, attrs, stops) => {
    const g = el(type, { id, ...attrs }, defs);
    stops.forEach(([o, c, a = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g));
    return g;
  };
  const blurF = (defs, id, sd, merge = true) => {
    const g = el('filter', { id, x: -0.5, y: -0.5, width: 2, height: 2 }, defs);
    el('feGaussianBlur', { stdDeviation: sd, result: 'b' }, g);
    if (merge) { const m = el('feMerge', {}, g); el('feMergeNode', { in: 'b' }, m); el('feMergeNode', { in: 'SourceGraphic' }, m); }
    return g;
  };
  // A seeded random: every tile draws the same object.
  const rng = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
  const pts = P => P.map(p => `${f(p[0])} ${f(p[1])}`).join('L');
  // A control: aim from the pointer, a demo on focus, a rest on leave.
  const ctl = ({ aim, rest, demo, enter = () => {}, leave = () => {} }) => {
    let tl = null;
    return {
      enter(p) { enter(); if (p) aim(p); else tl = demo(); },
      move(p) { if (p && !tl) aim(p); },
      leave() { tl?.kill(); tl = null; leave(); rest(); },
    };
  };
  const INK = 'oklch(0.06 0.012 262)', SHADOW = 'oklch(0.07 0.01 260)';

  const DIRS = [];

  /* ================= A · Cone ================= */

  // A paper cone of fries as a 3D object. The fries stand on the rim plane at
  // seeded spots, each a lit golden stick; the paper wraps them with a printed stripe.
  // The pointer turns the cone and tips it toward you. Hover tosses the fries
  // up and back, steam curls off, and salt falls.
  {
    const C = [64, 52], R = 23, APEX = [64, 112];
    const r = rng(77);
    const FRIES = Array.from({ length: 26 }, (_, i) => {
      const a = r() * TAU, rr = Math.sqrt(r()) * (R - 4);
      return { a, rr, h: 20 + r() * 20, w: 3.6 + r() * 1.2, lean: (r() - 0.5) * 0.35, tone: r(), tw: (r() - 0.5) * 0.5 };
    });
    const REST = { yaw: 0.4, tilt: 0.34, pop: 1, steam: 0, salt: 0 };
    DIRS.push({
      l: 'A', name: 'Cone', box: [30, 8, 74, 110],
      idea: 'A cone of fries as a real object: 26 golden sticks stand on the rim, each lit from the upper left and darker at the tips, inside a printed paper cone with a wooden fork and a blob of mayo. The pointer turns it and tips it toward you. Hover tosses the fries, steam curls off the top, salt falls.',
      art(svg, id) {
        const defs = el('defs', {}, svg);
        grad(defs, 'linearGradient', `${id}fry`, { x1: 0, y1: 0, x2: 0, y2: 1 }, [[0, 'oklch(0.62 0.13 60)'], [0.18, 'oklch(0.86 0.15 85)'], [1, 'oklch(0.9 0.12 92)']]);
        grad(defs, 'linearGradient', `${id}fryS`, { x1: 0, y1: 0, x2: 1, y2: 0 }, [[0, '#000', 0], [0.6, '#000', 0], [1, '#000', 0.35]]);
        grad(defs, 'linearGradient', `${id}paper`, { x1: 0, y1: 0, x2: 1, y2: 0 }, [[0, 'oklch(0.97 0.02 90)'], [0.55, 'oklch(0.9 0.025 85)'], [1, 'oklch(0.62 0.03 70)']]);
        grad(defs, 'radialGradient', `${id}halo`, { cx: 64, cy: 50, r: 46, gradientUnits: 'userSpaceOnUse' }, [[0, 'oklch(0.78 0.14 70)', 0.45], [1, 'oklch(0.4 0.1 40)', 0]]);
        el('clipPath', { id: `${id}cc` }, defs);
        const clip = defs.lastChild;
        const clipPath = el('path', {}, clip);
        const halo = el('circle', { cx: 64, cy: 50, r: 46, fill: `url(#${id}halo)` }, svg);
        const shadow = el('path', { fill: SHADOW }, svg);
        const back = el('path', { fill: 'oklch(0.55 0.03 70)' }, svg);
        const fryG = el('g', {}, svg);
        const fries = FRIES.map(() => { const g = el('g', {}, fryG); return [el('path', { fill: `url(#${id}fry)` }, g), el('path', { fill: `url(#${id}fryS)` }, g), el('path', { fill: 'none', stroke: 'oklch(0.97 0.08 95)', 'stroke-width': 0.5, opacity: 0.6 }, g)]; });
        const fork = el('path', { fill: 'oklch(0.72 0.08 70)', stroke: 'oklch(0.45 0.06 60)', 'stroke-width': 0.4 }, svg);
        const mayo = el('path', { fill: 'oklch(0.98 0.02 95)' }, svg);
        const mayoHi = el('path', { fill: 'none', stroke: '#fff', 'stroke-width': 1, 'stroke-linecap': 'round' }, svg);
        const paper = el('path', { fill: `url(#${id}paper)` }, svg);
        const print = el('g', { 'clip-path': `url(#${id}cc)` }, svg);
        const stripes = Array.from({ length: 5 }, () => el('path', { fill: 'oklch(0.55 0.2 27)', opacity: 0.9 }, print));
        const seam = el('path', { fill: 'none', stroke: 'oklch(0.55 0.03 70)', 'stroke-width': 0.6 }, svg);
        const lip = el('path', { fill: 'none', stroke: 'oklch(0.99 0.01 90)', 'stroke-width': 1.2 }, svg);
        const steam = [0, 1, 2].map(() => el('path', { fill: 'none', stroke: 'oklch(0.95 0.01 260)', 'stroke-width': 2.2, 'stroke-linecap': 'round', opacity: 0 }, svg));
        const salt = Array.from({ length: 14 }, () => el('rect', { width: 0.9, height: 0.9, fill: '#fff', opacity: 0 }, svg));
        const st = { ...REST };
        const paint = () => {
          const ry = R * st.tilt, rim = a => [C[0] + Math.cos(a + st.yaw) * R, C[1] + Math.sin(a + st.yaw) * ry];
          // The cone's outline: the rim's two side tangents down to the apex.
          const L = [C[0] - R, C[1]], Rt = [C[0] + R, C[1]];
          const front = Array.from({ length: 17 }, (_, i) => [C[0] - R * Math.cos(i / 16 * Math.PI), C[1] + ry * Math.sin(i / 16 * Math.PI)]);
          const backArc = Array.from({ length: 17 }, (_, i) => [C[0] + R * Math.cos(i / 16 * Math.PI), C[1] - ry * Math.sin(i / 16 * Math.PI)]);
          const body = `M${pts([L, APEX, Rt])}L${pts(front.slice().reverse())}Z`;
          set(paper, { d: body });
          set(clipPath, { d: body });
          set(shadow, { d: `M${pts([[L[0] + 6, L[1] + 6], [APEX[0] + 6, APEX[1] + 6], [Rt[0] + 6, Rt[1] + 6]])}Z` });
          set(back, { d: `M${pts([...front, ...backArc])}Z` });
          set(lip, { d: `M${pts(front)}` });
          // The printed stripes wrap the cone: they slide with the yaw.
          stripes.forEach((s, i) => {
            const u = ((i / stripes.length + st.yaw / TAU) % 1 + 1) % 1, x = C[0] - R + u * 2 * R;
            s.setAttribute('d', `M${pts([[x - 1.4, C[1] - 2], [x + 1.4, C[1] - 2], [APEX[0] + (x - C[0]) * 0.2 + 0.6, APEX[1]], [APEX[0] + (x - C[0]) * 0.2 - 0.6, APEX[1]]])}Z`);
          });
          const sx = C[0] + Math.sin(st.yaw * 1.3) * R * 0.6;
          set(seam, { d: `M${f(sx)} ${f(C[1] + ry * 0.9)}L${APEX[0]} ${APEX[1]}` });
          // Fries: back to front, each a tapered stick from the rim plane up.
          const order = FRIES.map((q, i) => ({ q, i, z: Math.sin(q.a + st.yaw) })).sort((a, b) => a.z - b.z);
          order.forEach(({ q, i, z }, k) => {
            const bx = C[0] + Math.cos(q.a + st.yaw) * q.rr, by = C[1] + Math.sin(q.a + st.yaw) * q.rr * st.tilt;
            const h = q.h * st.pop, lx = q.lean * h, tx = bx + lx, ty = by - h, w = q.w * (0.85 + 0.15 * (z + 1) / 2);
            const tw = q.tw * w * 0.4;
            const d = `M${pts([[bx - w / 2, by + 3], [tx - w / 2 + tw, ty + 0.6], [tx + w / 2 + tw, ty], [bx + w / 2, by + 3]])}Z`;
            fryG.appendChild(fries[i][0].parentNode);
            fries[i][0].setAttribute('d', d); fries[i][1].setAttribute('d', d);
            fries[i][2].setAttribute('d', `M${f(bx - w / 2 + 0.8)} ${f(by)}L${f(tx - w / 2 + tw + 0.8)} ${f(ty + 1.2)}`);
            fries[i][0].parentNode.setAttribute('opacity', f(0.72 + 0.28 * (z + 1) / 2));
          });
          // A wooden fork stuck in on the right; mayo on the front left.
          const fx = C[0] + Math.cos(0.4 + st.yaw) * 10, fy = C[1] + Math.sin(0.4 + st.yaw) * 10 * st.tilt - 14 * st.pop;
          set(fork, { d: `M${f(fx)} ${f(fy + 22)}L${f(fx + 7)} ${f(fy - 10)}L${f(fx + 8.6)} ${f(fy - 10)}L${f(fx + 6.4)} ${f(fy - 15)}L${f(fx + 5.2)} ${f(fy - 10.4)}L${f(fx + 3.8)} ${f(fy - 15.6)}L${f(fx + 3.2)} ${f(fy - 10.6)}L${f(fx + 1.6)} ${f(fy + 22)}Z` });
          const mx = C[0] - 7 + Math.sin(st.yaw) * 4, my = C[1] - 10 * st.pop + 2;
          set(mayo, { d: `M${f(mx - 9)} ${f(my + 3)}C${f(mx - 11)} ${f(my - 4)} ${f(mx - 3)} ${f(my - 8)} ${f(mx)} ${f(my - 5)}C${f(mx + 4)} ${f(my - 10)} ${f(mx + 11)} ${f(my - 3)} ${f(mx + 8)} ${f(my + 3)}C${f(mx + 4)} ${f(my + 6)} ${f(mx - 5)} ${f(my + 6)} ${f(mx - 9)} ${f(my + 3)}Z` });
          set(mayoHi, { d: `M${f(mx - 5)} ${f(my - 2)}Q${f(mx - 2)} ${f(my - 6)} ${f(mx + 2)} ${f(my - 4)}` });
          // Steam: three wisps that rise and curl.
          steam.forEach((s, i) => {
            const t = st.steam + i * 0.33, u = t % 1, x0 = C[0] - 10 + i * 10, y0 = C[1] - 30 - u * 26;
            const p = Array.from({ length: 6 }, (_, k) => [x0 + Math.sin(k * 1.3 + t * 7 + i) * (2 + k), y0 - k * 4]);
            s.setAttribute('d', `M${pts(p)}`);
            s.setAttribute('opacity', f(st.steam > 0 ? Math.sin(u * Math.PI) * 0.55 : 0));
          });
          salt.forEach((g, i) => {
            const u = (st.salt + i / salt.length) % 1;
            set(g, { x: C[0] - 16 + ((i * 37) % 32), y: C[1] - 46 + u * 40, opacity: st.salt > 0 ? (1 - u) * 0.9 : 0 });
          });
        };
        paint();
        let loop = null;
        const aim = p => gsap.to(st, { yaw: clamp((p[0] - 64) / 50, -1, 1) * 1.4 + 0.4, tilt: clamp(0.34 + (64 - p[1]) / 220, 0.18, 0.52), duration: 0.5, ease: 'power2.out', overwrite: 'auto', onUpdate: paint });
        return ctl({
          aim,
          enter() {
            gsap.timeline({ onUpdate: paint }).to(st, { pop: 0.55, duration: 0.14, ease: 'power2.in' }).to(st, { pop: 1, duration: 0.5, ease: 'back.out(3)' });
            if (!loop) loop = gsap.to(st, { steam: '+=1', salt: '+=1', duration: 2.4, repeat: -1, ease: 'none', onUpdate: paint });
          },
          leave() { loop?.kill(); loop = null; st.steam = 0; st.salt = 0; },
          rest: () => gsap.to(st, { ...REST, duration: 0.8, ease: 'power2.inOut', overwrite: 'auto', onUpdate: paint }),
          demo: () => { const o = { a: 0 }; return gsap.to(o, { a: 1, duration: 5, repeat: -1, ease: 'none', onUpdate: () => aim([64 + 44 * Math.cos(o.a * TAU), 60 + 24 * Math.sin(o.a * TAU)]) }); },
        });
      },
    });
  }

  /* ================= B · Kotje ================= */

  // The shack as a small turntable model: boxes in 3D, faces lit and sorted, decals
  // on the front face (window, ribs, the lit board), wet cobbles under it.
  // The pointer orbits it. Hover strikes the board's lamps in turn, steam
  // puffs from the vent, and someone walks up to the window.
  {
    const C = [64, 76], S = 1.55;
    // Boxes: [x0, x1, y0, y1, z0, z1, colour].
    const BOX = [
      { b: [-20, 6, 0, 18, -11, 11], col: [0.46, 0.16, 25], ribs: 1 },
      { b: [6, 22, 0, 15, -9, 9], col: [0.4, 0.14, 25], ribs: 1 },
      { b: [-18, 4, 18, 27, 7, 10], col: [0.16, 0.02, 260] },
      { b: [-20.5, 6.5, 18, 19, -11.5, 11.5], col: [0.22, 0.02, 260] },
      { b: [6, 22, 15, 15.8, -9.5, 9.5], col: [0.22, 0.02, 260] },
      { b: [-6, -4, 19, 25, -4, -2], col: [0.3, 0.01, 250] },
    ];
    const REST = { yaw: -0.42, lamps: 0, walk: 0, puff: 0, glow: 0.85 };
    const proj = (x, y, z, yaw) => {
      const c = Math.cos(yaw), s = Math.sin(yaw), xr = x * c - z * s, zr = x * s + z * c;
      return [C[0] + xr * S, C[1] - y * S + zr * S * 0.42, zr];
    };
    const oklch = ([l, c, h], k = 1) => `oklch(${f(clamp(l * k, 0, 1))} ${c} ${h})`;
    DIRS.push({
      l: 'B', name: 'Kotje', box: [12, 14, 104, 100],
      idea: 'The frietkot as a small turntable model: the ribbed red shack, its annex, the roof box with the cream board, the vent, all real boxes lit from the upper left, on a puddle of wet cobbles that holds the window light. The pointer orbits it. Hover strikes the three board lamps in turn, steam puffs from the vent, and a figure walks up to the window.',
      art(svg, id) {
        const defs = el('defs', {}, svg);
        grad(defs, 'radialGradient', `${id}pool`, { cx: 0.5, cy: 0.35, r: 0.6 }, [[0, 'oklch(0.82 0.14 70)', 0.55], [1, 'oklch(0.3 0.06 50)', 0]]);
        grad(defs, 'radialGradient', `${id}lamp`, { cx: 0.5, cy: 1, r: 1 }, [[0, 'oklch(0.97 0.08 85)', 0.95], [1, 'oklch(0.9 0.1 80)', 0]]);
        blurF(defs, `${id}soft`, 1.2);
        const disc = el('ellipse', { fill: 'oklch(0.13 0.02 262)' }, svg);
        const discSh = el('ellipse', { fill: SHADOW }, svg);
        svg.insertBefore(discSh, disc);
        const pool = el('ellipse', { fill: `url(#${id}pool)` }, svg);
        const setts = el('g', { stroke: 'oklch(0.2 0.02 262)', 'stroke-width': 0.4, fill: 'none' }, svg);
        const refl = el('path', { fill: 'oklch(0.85 0.13 75)', opacity: 0.35 }, svg);
        const faces = el('g', {}, svg);
        const deco = el('g', {}, svg);
        const lampsG = el('g', {}, svg);
        const puffs = [0, 1, 2, 3].map(() => el('circle', { fill: 'oklch(0.92 0.01 260)', opacity: 0 }, svg));
        const walker = el('g', { fill: INK }, svg);
        el('circle', { cx: 0, cy: -19.5, r: 2.6 }, walker);
        el('path', { d: 'M-2.6-16.4H2.6L2.2-8H-2.2Z' }, walker);
        const legs = el('path', { stroke: INK, 'stroke-width': 2, fill: 'none' }, walker);
        const r = rng(9);
        const cob = Array.from({ length: 40 }, () => [(r() - 0.5) * 70, (r() - 0.5) * 34]);
        const st = { ...REST };
        const paint = () => {
          const y = st.yaw;
          set(disc, { cx: C[0], cy: C[1] + 2, rx: 46, ry: 17 });
          set(discSh, { cx: C[0] + 5, cy: C[1] + 7, rx: 46, ry: 17 });
          // The window's light on the wet ground, out in front of the shack.
          const wf = proj(-7, 0, 11, y);
          set(pool, { cx: wf[0], cy: wf[1] + 6, rx: 22, ry: 9, opacity: st.glow });
          setts.innerHTML = '';
          cob.forEach(([x, z]) => { const p = [C[0] + x, C[1] + 2 + z * 0.5]; if (((p[0] - C[0]) / 46) ** 2 + ((p[1] - C[1] - 2) / 17) ** 2 < 0.9) el('path', { d: `M${f(p[0] - 1.6)} ${f(p[1])}h3.2` }, setts); });
          set(refl, { d: `M${f(wf[0] - 8)} ${f(wf[1] + 2)}h16l-3 14h-10Z`, opacity: 0.25 * st.glow });
          // Faces: every box, every visible face, painted back to front.
          const quads = [];
          BOX.forEach(({ b, col, ribs }, bi) => {
            const [x0, x1, y0, y1, z0, z1] = b;
            const V = (x, yy, z) => proj(x, yy, z, y);
            const F = [
              { n: [0, 0, 1], p: [V(x0, y0, z1), V(x1, y0, z1), V(x1, y1, z1), V(x0, y1, z1)], front: 1 },
              { n: [0, 0, -1], p: [V(x1, y0, z0), V(x0, y0, z0), V(x0, y1, z0), V(x1, y1, z0)] },
              { n: [1, 0, 0], p: [V(x1, y0, z1), V(x1, y0, z0), V(x1, y1, z0), V(x1, y1, z1)] },
              { n: [-1, 0, 0], p: [V(x0, y0, z0), V(x0, y0, z1), V(x0, y1, z1), V(x0, y1, z0)] },
              { n: [0, 1, 0], p: [V(x0, y1, z1), V(x1, y1, z1), V(x1, y1, z0), V(x0, y1, z0)] },
            ];
            F.forEach(fc => {
              const c = Math.cos(y), s = Math.sin(y), nz = fc.n[0] * s + fc.n[2] * c, nx = fc.n[0] * c - fc.n[2] * s;
              if (fc.n[1] === 0 && nz <= 0.02) return;
              const lit = fc.n[1] ? 1.35 : 0.75 + 0.35 * (-nx * 0.6 + nz * 0.5);
              const z = fc.p.reduce((a, q) => a + q[2], 0) / 4;
              quads.push({ z: z + bi * 0.01 + (fc.n[1] ? 0.5 : 0), d: `M${pts(fc.p)}Z`, fill: oklch(col, lit), fc, ribs, b });
            });
          });
          quads.sort((a, b) => a.z - b.z);
          faces.innerHTML = '';
          deco.innerHTML = '';
          quads.forEach(q => el('path', { d: q.d, fill: q.fill, stroke: 'oklch(0.08 0.01 260)', 'stroke-width': 0.35, 'stroke-linejoin': 'round' }, faces));
          // Decals on the shack's front face: ribs, the lit window, the counter, the board.
          const c = Math.cos(y), s = Math.sin(y);
          if (s * 0 + c > 0.05) {
            const P = (x, yy) => proj(x, yy, 11.05, y);
            for (let x = -19; x < 6; x += 1.6) { const a = P(x, 0.5), b = P(x, 17.5); el('path', { d: `M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}`, stroke: 'oklch(0.36 0.13 25)', 'stroke-width': 0.35 }, deco); }
            el('path', { d: `M${pts([P(-17, 7), P(1, 7), P(1, 15), P(-17, 15)])}Z`, fill: `oklch(${f(0.55 + 0.35 * st.glow)} 0.13 75)` }, deco);
            const cook = P(-6, 7);
            el('path', { d: `M${pts([P(-8, 7), P(-4, 7), P(-4.4, 11.6), P(-7.6, 11.6)])}Z`, fill: INK, opacity: 0.85 }, deco);
            el('circle', { cx: f(cook[0]), cy: f(P(-6, 12.8)[1]), r: 1.6 * S * 0.6, fill: INK, opacity: 0.85 }, deco);
            el('path', { d: `M${pts([P(-18, 6.4), P(2, 6.4), P(2, 7.1), P(-18, 7.1)])}Z`, fill: 'oklch(0.7 0.01 250)' }, deco);
            const B = (x, yy) => proj(x, yy, 10.06, y);
            el('path', { d: `M${pts([B(-17, 19), B(3, 19), B(3, 26), B(-17, 26)])}Z`, fill: `oklch(${f(0.42 + 0.48 * st.lamps)} 0.04 85)` }, deco);
            const t0 = B(-7, 23.5);
            el('text', { x: f(t0[0]), y: f(t0[1] + 1.4), 'font-family': 'Gabarito', 'font-weight': 800, 'font-size': 5.2, 'text-anchor': 'middle', fill: 'oklch(0.45 0.18 25)', transform: `skewY(${f(Math.atan2(B(3, 19)[1] - B(-17, 19)[1], B(3, 19)[0] - B(-17, 19)[0]) * 57.3)})`, 'transform-origin': `${f(t0[0])} ${f(t0[1])}` }, deco).textContent = 'FRITUUR';
          }
          // Three lamps under the board, each throwing a cone up its face.
          lampsG.innerHTML = '';
          [-13, -7, -1].forEach((x, i) => {
            const on = clamp(st.lamps * 3 - i, 0, 1), p = proj(x, 18.6, 11, y);
            el('ellipse', { cx: f(p[0]), cy: f(p[1] - 6), rx: 5, ry: 7, fill: `url(#${id}lamp)`, opacity: f(on * 0.9) }, lampsG);
            el('rect', { x: f(p[0] - 1.5), y: f(p[1] - 0.5), width: 3, height: 1.1, fill: on > 0.5 ? 'oklch(0.97 0.06 90)' : 'oklch(0.3 0.01 260)' }, lampsG);
          });
          // Steam from the vent; the walker comes in from the right.
          const vt = proj(-5, 25, -3, y);
          puffs.forEach((pc, i) => {
            const u = (st.puff + i / puffs.length) % 1;
            set(pc, { cx: vt[0] + Math.sin(u * 6 + i) * 3 + u * 6, cy: vt[1] - u * 22, r: 2 + u * 5, opacity: st.puff > 0 ? (1 - u) * 0.5 : 0 });
          });
          const goal = proj(4, 0, 15, y), from = [C[0] + 60, goal[1] + 6];
          const wx = from[0] + (goal[0] - from[0]) * st.walk, wy = from[1] + (goal[1] - from[1]) * st.walk;
          walker.setAttribute('transform', `translate(${f(wx)} ${f(wy)}) scale(${f(0.62)}) scale(-1 1)`);
          walker.setAttribute('opacity', f(st.walk > 0 ? 1 : 0));
          const ph = st.walk * 18;
          legs.setAttribute('d', `M-1.2-8L${f(-1.2 - 2 * Math.sin(ph))} 0M1.2-8L${f(1.2 + 2 * Math.sin(ph))} 0`);
        };
        paint();
        let loop = null;
        const aim = p => gsap.to(st, { yaw: clamp((p[0] - 64) / 56, -1, 1) * 0.9 - 0.2, duration: 0.6, ease: 'power2.out', overwrite: 'auto', onUpdate: paint });
        return ctl({
          aim,
          enter() {
            gsap.timeline({ onUpdate: paint })
              .set(st, { lamps: 0 })
              .to(st, { lamps: 1, duration: 0.7, ease: 'steps(9)' })
              .fromTo(st, { walk: 0 }, { walk: 1, duration: 1.6, ease: 'power1.out' }, 0.2);
            if (!loop) loop = gsap.to(st, { puff: '+=1', duration: 2, repeat: -1, ease: 'none', onUpdate: paint });
          },
          leave() { loop?.kill(); loop = null; st.puff = 0; },
          rest: () => gsap.to(st, { yaw: REST.yaw, lamps: 0, walk: 0, duration: 0.8, ease: 'power2.inOut', overwrite: 'auto', onUpdate: paint }),
          demo: () => { const o = { a: 0 }; return gsap.to(o, { a: 1, duration: 6, repeat: -1, ease: 'sine.inOut', yoyo: true, onUpdate: () => aim([20 + 88 * o.a, 64]) }); },
        });
      },
    });
  }

  /* ================= C · Neon ================= */

  // The wall neon as real hardware: bent glass tube on standoffs over brick,
  // with electrodes, wire leads and a transformer. Each tube has glass,
  // gas colour, a white-hot core and a spill on the wall.
  // Hover strikes the tubes one by one with a buzz and flicker; the pointer
  // slides a glint along the glass.
  {
    const SEG = [
      { d: 'M34 50H94L64 104Z', col: 'oklch(0.66 0.25 27)' },
      { d: 'M46 50V30', col: 'oklch(0.88 0.17 88)' },
      { d: 'M56 50V20', col: 'oklch(0.88 0.17 88)' },
      { d: 'M66 50V24', col: 'oklch(0.88 0.17 88)' },
      { d: 'M76 50V18', col: 'oklch(0.88 0.17 88)' },
      { d: 'M86 50V32', col: 'oklch(0.88 0.17 88)' },
      { d: 'M64 70m-5 0a5 5 0 1 0 10 0a5 5 0 1 0-10 0', col: 'oklch(0.97 0.03 95)' },
    ];
    const ENDS = [[34, 50], [46, 30], [56, 20], [66, 24], [76, 18], [86, 32]];
    DIRS.push({
      l: 'C', name: 'Neon', box: [14, 10, 100, 104],
      idea: 'The wall neon made as real hardware: a cone of fries bent in red and yellow glass over dark brick, on standoffs, with electrode caps, wire leads and a little transformer. Each tube has dim glass, gas colour, a white-hot core and a soft spill on the wall. Hover strikes the tubes one by one with a flicker; the pointer slides a glint along the glass.',
      art(svg, id) {
        const defs = el('defs', {}, svg);
        blurF(defs, `${id}spill`, 5, false);
        blurF(defs, `${id}glow`, 1.6, false);
        grad(defs, 'radialGradient', `${id}vig`, { cx: 0.5, cy: 0.45, r: 0.7 }, [[0, 'oklch(0.2 0.03 30)'], [1, 'oklch(0.09 0.015 262)']]);
        el('rect', { x: 20, y: 16, width: 92, height: 94, fill: SHADOW }, svg);
        el('rect', { x: 14, y: 10, width: 92, height: 94, fill: `url(#${id}vig)` }, svg);
        // Brick: rows in running bond, each brick a slightly different tone.
        const r = rng(31), bricks = el('g', {}, svg);
        for (let row = 0; row < 16; row++) for (let k = -1; k < 8; k++) {
          const x = 14 + k * 13 + (row % 2) * 6.5, w = 12.2;
          if (x + w < 14 || x > 106) continue;
          const x0 = Math.max(14, x), x1 = Math.min(106, x + w);
          el('rect', { x: f(x0), y: f(10 + row * 5.9), width: f(x1 - x0), height: 5.2, fill: `oklch(${f(0.16 + r() * 0.05)} 0.03 ${f(30 + r() * 20)})`, opacity: 0.9 }, bricks);
        }
        el('rect', { x: 14, y: 10, width: 92, height: 94, fill: `url(#${id}vig)`, opacity: 0.55 }, svg);
        const spill = el('g', { filter: `url(#${id}spill)` }, svg);
        const wires = el('g', { fill: 'none', stroke: 'oklch(0.12 0.01 260)', 'stroke-width': 0.9 }, svg);
        // Short leads run off the top edge; the cone's lead drops to the transformer.
        ENDS.forEach(([x, y], i) => el('path', { d: i ? `M${x} ${y - 3}C${x} ${y - 8} ${x + 3} ${f(10 + i)} ${x + 4} 10` : `M64 104C70 104 84 100 88 96` }, wires));
        el('rect', { x: 86, y: 92, width: 16, height: 9, fill: 'oklch(0.22 0.01 260)', stroke: 'oklch(0.1 0.01 260)', 'stroke-width': 0.6 }, svg);
        el('rect', { x: 88, y: 94, width: 5, height: 1.2, fill: 'oklch(0.5 0.01 260)' }, svg);
        const glass = el('g', { fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
        const L = SEG.map(s => ({
          sp: el('path', { d: s.d, stroke: s.col, 'stroke-width': 7, opacity: 0, fill: 'none' }, spill),
          gl: el('path', { d: s.d, stroke: 'oklch(0.32 0.02 260)', 'stroke-width': 3.6 }, glass),
          halo: el('path', { d: s.d, stroke: s.col, 'stroke-width': 4.2, opacity: 0, filter: `url(#${id}glow)` }, glass),
          col: el('path', { d: s.d, stroke: s.col, 'stroke-width': 2.4, opacity: 0.12 }, glass),
          core: el('path', { d: s.d, stroke: 'oklch(0.99 0.03 95)', 'stroke-width': 0.8, opacity: 0 }, glass),
        }));
        // Standoffs and electrode caps.
        [[40, 50], [64, 50], [88, 50], [49, 77], [79, 77], [56, 34], [76, 30]].forEach(([x, y]) => el('rect', { x: x - 1.2, y: y - 1.2, width: 2.4, height: 2.4, fill: 'oklch(0.5 0.01 250)' }, svg));
        ENDS.forEach(([x, y]) => el('rect', { x: x - 1.6, y: y - (y === 50 ? 0 : 3), width: 3.2, height: 3, fill: 'oklch(0.2 0.01 260)' }, svg));
        const glint = el('circle', { r: 1.3, fill: '#fff', opacity: 0.7 }, svg);
        const st = { on: SEG.map(() => 1), gx: 0.3 };
        const paint = () => {
          L.forEach((l, i) => {
            const o = st.on[i];
            l.sp.setAttribute('opacity', f(0.35 * o)); l.halo.setAttribute('opacity', f(0.75 * o));
            l.col.setAttribute('opacity', f(0.12 + 0.88 * o)); l.core.setAttribute('opacity', f(0.9 * o));
          });
          const p = L[0].gl.getPointAtLength(L[0].gl.getTotalLength() * st.gx);
          set(glint, { cx: p.x, cy: p.y - 0.6 });
        };
        paint();
        const strike = () => {
          const tl = gsap.timeline({ onUpdate: paint });
          tl.set(st.on, { ...SEG.map(() => 0) });
          SEG.forEach((_, i) => {
            const t = 0.12 + i * 0.13, o = st.on;
            tl.to(o, { [i]: 1, duration: 0.03 }, t).to(o, { [i]: 0.15, duration: 0.03 }, t + 0.05)
              .to(o, { [i]: 0.9, duration: 0.02 }, t + 0.11).to(o, { [i]: 0.3, duration: 0.02 }, t + 0.14).to(o, { [i]: 1, duration: 0.04 }, t + 0.2);
          });
          return tl;
        };
        let buzz = null;
        return ctl({
          aim: p => gsap.to(st, { gx: clamp((p[0] - 30) / 70, 0, 1), duration: 0.4, overwrite: 'auto', onUpdate: paint }),
          enter() {
            strike();
            if (!buzz) buzz = gsap.to({}, { duration: 0.09, repeat: -1, onRepeat: () => { st.on[4] = Math.random() < 0.08 ? 0.25 : 1; paint(); } });
          },
          leave() { buzz?.kill(); buzz = null; },
          rest: () => { st.on.fill(1); paint(); },
          demo: () => { const o = { a: 0 }; return gsap.to(o, { a: 1, duration: 3, repeat: -1, yoyo: true, ease: 'sine.inOut', onUpdate: () => { st.gx = o.a; paint(); } }); },
        });
      },
    });
  }

  /* ================= D · Wipe ================= */

  // The service window misted from the inside. Through the fog: warm tiles,
  // the fryer bubbling, the cook in a paper cap. At rest a fries cone is drawn
  // in the mist with a finger. The pointer wipes the glass clear; the mist
  // slowly closes in again. Drops run down and leave clear tracks.
  {
    const W = [20, 18, 88, 84];
    DIRS.push({
      l: 'D', name: 'Wipe', box: [14, 12, 100, 100],
      idea: 'The service window, misted from the inside. Through the fog: warm tiles, the fryer bubbling, the cook in a paper cap. At rest someone has drawn a cone of fries in the mist with a finger. The pointer wipes the glass clear and the mist slowly closes again; drops run down and leave clear tracks.',
      art(svg, id) {
        const defs = el('defs', {}, svg);
        grad(defs, 'linearGradient', `${id}in`, { x1: 0, y1: 0, x2: 0, y2: 1 }, [[0, 'oklch(0.86 0.1 80)'], [1, 'oklch(0.62 0.15 55)']]);
        const tp = el('pattern', { id: `${id}tile`, width: 7, height: 7, patternUnits: 'userSpaceOnUse' }, defs);
        el('rect', { width: 7, height: 7, fill: 'none', stroke: 'oklch(0.55 0.1 60)', 'stroke-width': 0.5, opacity: 0.6 }, tp);
        const fog = el('filter', { id: `${id}fog`, x: 0, y: 0, width: 1, height: 1 }, defs);
        el('feTurbulence', { type: 'fractalNoise', baseFrequency: 0.06, numOctaves: 3, seed: 4, result: 'n' }, fog);
        el('feColorMatrix', { in: 'n', type: 'matrix', values: '0 0 0 0 0.95  0 0 0 0 0.86  0 0 0 0 0.78  0 0 0 0.45 0.42' }, fog);
        const mask = el('mask', { id: `${id}m`, maskUnits: 'userSpaceOnUse', x: W[0], y: W[1], width: W[2], height: W[3] }, defs);
        el('rect', { x: W[0], y: W[1], width: W[2], height: W[3], fill: '#fff' }, mask);
        const doodle = el('g', { fill: 'none', stroke: '#000', 'stroke-width': 3.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', transform: 'translate(-16 0)' }, mask);
        el('path', { d: 'M52 56L64 82L76 56Z' }, doodle);
        el('path', { d: 'M55 55V42M60 55V37M65 55V39M70 55V36M74 55V44' }, doodle);
        const wipes = el('g', {}, mask);
        const tracks = el('g', { stroke: '#000', 'stroke-width': 1.2, fill: 'none', 'stroke-linecap': 'round' }, mask);
        // The frame and the scene behind the glass.
        el('rect', { x: W[0] + 6, y: W[1] + 6, width: W[2], height: W[3], fill: SHADOW }, svg);
        el('rect', { x: W[0] - 3, y: W[1] - 3, width: W[2] + 6, height: W[3] + 6, fill: 'oklch(0.46 0.16 25)' }, svg);
        el('rect', { x: W[0], y: W[1], width: W[2], height: W[3], fill: `url(#${id}in)` }, svg);
        el('rect', { x: W[0], y: W[1], width: W[2], height: W[3], fill: `url(#${id}tile)` }, svg);
        el('rect', { x: 26, y: 70, width: 36, height: 16, fill: 'oklch(0.6 0.01 250)' }, svg);
        el('rect', { x: 28, y: 66, width: 32, height: 5, fill: 'oklch(0.45 0.1 65)' }, svg);
        const bubbles = Array.from({ length: 8 }, (_, i) => el('circle', { cx: 30 + i * 4, cy: 68, r: 0.9, fill: 'oklch(0.95 0.08 90)', opacity: 0.8 }, svg));
        const cook = el('g', { fill: INK }, svg);
        el('rect', { x: 71, y: 34, width: 14, height: 4, fill: 'oklch(0.95 0.01 90)' }, cook);
        el('circle', { cx: 78, cy: 43, r: 6 }, cook);
        el('path', { d: 'M68 50h20l3 38H65Z' }, cook);
        const arm = el('path', { d: 'M70 54L60 64', stroke: INK, 'stroke-width': 4, 'stroke-linecap': 'round' }, cook);
        el('rect', { x: W[0], y: 84, width: W[2], height: 6, fill: 'oklch(0.7 0.01 250)' }, svg);
        // The mist, masked by the doodle, the wipes and the drop tracks.
        el('rect', { x: W[0], y: W[1], width: W[2], height: W[3], filter: `url(#${id}fog)`, mask: `url(#${id}m)` }, svg);
        const drops = [0, 1, 2].map(i => el('circle', { r: 1.1, fill: 'oklch(0.97 0.01 90)', opacity: 0.85 }, svg));
        el('rect', { x: W[0] - 3, y: W[1] - 3, width: W[2] + 6, height: W[3] + 6, fill: 'none', stroke: 'oklch(0.22 0.01 260)', 'stroke-width': 2 }, svg);
        const st = { t: 0, scoop: 0 };
        const dropX = [32, 58, 96];
        const paint = () => {
          bubbles.forEach((b, i) => b.setAttribute('cy', f(68 - ((st.t * 3 + i * 0.37) % 1) * 3)));
          arm.setAttribute('d', `M70 54L${f(60 + Math.sin(st.scoop) * 3)} ${f(64 - Math.abs(Math.cos(st.scoop)) * 4)}`);
          drops.forEach((d, i) => { const u = (st.t * 0.4 + i * 0.31) % 1; set(d, { cx: dropX[i], cy: W[1] + 4 + u * 74 }); });
        };
        paint();
        let last = null, loop = null;
        // A wipe: a soft clear stroke that mists over in about three seconds.
        const wipe = p => {
          if (p[0] < W[0] || p[0] > W[0] + W[2] || p[1] < W[1] || p[1] > W[1] + W[3]) { last = null; return; }
          const a = last ?? p;
          const line = el('path', { d: `M${f(a[0])} ${f(a[1])}L${f(p[0])} ${f(p[1])}`, stroke: '#000', 'stroke-width': 11, 'stroke-linecap': 'round', fill: 'none' }, wipes);
          gsap.to(line, { opacity: 0, duration: 3.2, delay: 0.6, ease: 'power1.in', onComplete: () => line.remove() });
          last = p;
        };
        const track = () => {
          dropX.forEach((x, i) => {
            const u = (st.t * 0.4 + i * 0.31) % 1, y = W[1] + 4 + u * 74;
            const tr = el('path', { d: `M${x} ${f(y - 3)}L${x} ${f(y)}`, opacity: 0.9 }, tracks);
            gsap.to(tr, { opacity: 0, duration: 4, onComplete: () => tr.remove() });
          });
        };
        return ctl({
          aim: wipe,
          enter() { if (!loop) loop = gsap.to(st, { t: '+=10', scoop: '+=30', duration: 10, repeat: -1, ease: 'none', onUpdate: () => { paint(); if (Math.random() < 0.5) track(); } }); },
          leave() { loop?.kill(); loop = null; last = null; },
          rest: () => {},
          demo: () => { const o = { a: 0 }; return gsap.to(o, { a: 1, duration: 3, repeat: -1, ease: 'none', onUpdate: () => wipe([64 + 30 * Math.sin(o.a * TAU), 50 + 22 * Math.sin(o.a * TAU * 2)]) }); },
        });
      },
    });
  }

  /* ================= Gallery ================= */

  const fitIcon = (svg, box) => {
    const b = { x: box[0], y: box[1], width: box[2], height: box[3] }, side = Math.max(b.width, b.height);
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  for (const D of DIRS) {
    const card = document.createElement('article');
    card.className = 'dir';
    card.innerHTML = `<header><b>${D.l}</b><span>· ${D.name}</span></header>
      <div class="icons"><div class="tile t256" tabindex="0"></div><div class="tile t128" tabindex="0"></div><div class="tile t64" tabindex="0"></div></div>
      <p class="idea">${D.idea}</p>`;
    out.append(card);
    card.querySelectorAll('.tile').forEach(tile => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tile.addEventListener('pointermove', e => c.move(local(svg, e)));
      tile.addEventListener('pointerleave', () => c.leave());
      tile.addEventListener('focus', () => c.enter(null));
      tile.addEventListener('blur', () => c.leave());
    });
  }
})();
</script>
</body>
