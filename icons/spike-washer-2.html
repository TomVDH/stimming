<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Pressure washer 2</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Pressure washer 2</h1>
<p class="lede">Pressure washer, round 2: the toy's own floor under the low evening sun. A grimy herringbone patio; the fan jet cuts a clean, wet stripe and muddy water runs off. A: a round paver, free on the ground. D: the paver is the block.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };


  // The toy's tokens: warm patio brick, moss grime, mud, the low evening sun.
  const BRICK = ['oklch(0.66 0.15 42)', 'oklch(0.58 0.15 32)', 'oklch(0.74 0.13 55)', 'oklch(0.62 0.14 38)'];
  const MORTAR = 'oklch(0.42 0.05 50)';
  const GRIME = ['oklch(0.27 0.04 95)', 'oklch(0.22 0.03 75)', 'oklch(0.31 0.05 115)', 'oklch(0.24 0.04 65)'];
  const MOSS = 'oklch(0.44 0.1 132)';
  const MUD = 'oklch(0.5 0.1 58)', FOAM = 'oklch(0.98 0.02 220)';
  const WET = 'oklch(0.97 0.05 85)', SUN = 'oklch(0.86 0.12 78)';
  const STEEL = [[0, 'oklch(0.95 0.01 250)'], [0.45, 'oklch(0.72 0.015 250)'], [1, 'oklch(0.42 0.015 250)']];
  const TIP = [[0, 'oklch(0.84 0.16 140)'], [1, 'oklch(0.55 0.15 135)']];
  const GRIP = [[0, 'oklch(0.88 0.15 78)'], [1, 'oklch(0.62 0.18 42)']];
  const { sin, cos, atan2, hypot } = Math;
  // A fixed hash: the same drops on every load.
  const hash = i => { const x = sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  // Herringbone in a tile of 4 by 4 brick units; one unit is U.
  // A flat brick sits at (k + s, k), a standing one at (k + s, k + 1).
  // The colour index (k + s) mod 4 keeps the tile seamless.
  const U = 6.5, JT = 0.5;
  const herring = (id, ground, cols) => {
    let r = `<rect width="${4 * U}" height="${4 * U}" fill="${ground}"/>`;
    for (let s = -8; s <= 8; s += 4) for (let k = -6; k <= 6; k++) {
      const ci = (((k + s) % 4) + 4) % 4;
      for (const [x, y, w, h, c] of [[k + s, k, 2, 1, ci], [k + s, k + 1, 1, 2, (ci + 2) % 4]]) {
        if (x >= 4 || y >= 4 || x + w <= 0 || y + h <= 0) continue;
        r += `<rect x="${f(x * U + JT)}" y="${f(y * U + JT)}" width="${f(w * U - 2 * JT)}" height="${f(h * U - 2 * JT)}" rx="0.8" fill="${cols[c]}"/>`;
      }
    }
    return `<pattern id="${id}" patternUnits="userSpaceOnUse" width="${4 * U}" height="${4 * U}" patternTransform="rotate(45)">${r}</pattern>`;
  };

  // The floor lies flat in its own plane; a matrix [a b c d e f] maps it to the tile.
  const map = (m, p) => [m[0] * p[0] + m[2] * p[1] + m[4], m[1] * p[0] + m[3] * p[1] + m[5]];
  const unmap = (m, p) => {
    const det = m[0] * m[3] - m[1] * m[2], x = p[0] - m[4], y = p[1] - m[5];
    return [(m[3] * x - m[2] * y) / det, (m[0] * y - m[1] * x) / det];
  };
  const curve = P => `M${P[0].join(' ')}C${P.slice(1).map(p => p.join(' ')).join(' ')}`;
  // The lance in its own frame: the nozzle tip at the origin, the shaft up.
  const LANCE = { tip: [-6.5, -14, 13, 14, 4.5], tube: [-4, -30, 8, 18, 4], grip: [-7.5, -45, 15, 17, 7] };
  const rr = ([x, y, w, h, r]) => `M${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}H${x + r}Q${x} ${y + h} ${x} ${y + h - r}V${y + r}Q${x} ${y} ${x + r} ${y}Z`;
  // The bar of the fan on the floor, across the stroke, in tile space.
  const barEnds = (g, j, a) => {
    const pp = [-sin(a), cos(a)];
    return [map(g.m, [j[0] - pp[0] * g.hl, j[1] - pp[1] * g.hl]), map(g.m, [j[0] + pp[0] * g.hl, j[1] + pp[1] * g.hl])];
  };

  // The jet as a live model on the toy's floor.
  // A mask cuts the stripe out of the grime; the jet adds to the stripe.
  // g: matrix m, floor clip, rest stripe, stripe width w, lance offset and lean.
  const washer = (svg, u, g) => {
    const $q = s => svg.querySelector(s);
    const trails = svg.querySelectorAll('.trail'), fan = $q('.fan'), fanG = $q(`#${u}fan`), bar = $q('.bar');
    const glow = $q('.glow'), mist = $q('.mist'), lance = $q('.lance'), drops = [...svg.querySelectorAll('.drop')], mud = $q('.mud');
    const restDv = [cos(2 * g.restA), sin(2 * g.restA)];
    const st = { j: [...g.restJ], jT: [...g.restJ], dv: [...restDv], on: 0, onTo: 0, ta: 0, trail: [], t: 0, live: false, auto: false };
    const draw = () => {
      const a = atan2(st.dv[1], st.dv[0]) / 2, Jp = map(g.m, st.j), [B1, B2] = barEnds(g, st.j, a);
      const sway = st.on * sin(st.t * 3.1) * 2;
      const N = [Jp[0] + g.noz[0] + sway, Jp[1] + g.noz[1]];
      lance.setAttribute('transform', `translate(${f(N[0])} ${f(N[1])}) rotate(${f(g.lean + sway * 1.5)})`);
      fan.setAttribute('d', poly([[N[0] - 3, N[1]], [N[0] + 3, N[1]], B2, B1]));
      fanG.setAttribute('x1', f(N[0])); fanG.setAttribute('y1', f(N[1])); fanG.setAttribute('x2', f(Jp[0])); fanG.setAttribute('y2', f(Jp[1]));
      fan.setAttribute('opacity', f(0.8 + 0.2 * st.on * (0.8 + 0.2 * sin(st.t * 47))));
      bar.setAttribute('d', `M${f(B1[0])} ${f(B1[1])}L${f(B2[0])} ${f(B2[1])}`);
      glow.setAttribute('cx', f(Jp[0])); glow.setAttribute('cy', f(Jp[1]));
      glow.setAttribute('rx', f(g.gr * (1 + 0.3 * st.on))); glow.setAttribute('ry', f(g.gr * 0.7 * (1 + 0.3 * st.on)));
      mist.setAttribute('cx', f(Jp[0] + 3)); mist.setAttribute('cy', f(Jp[1] - 8));
      mist.setAttribute('opacity', f(0.4 + 0.4 * st.on));
      // Drops leap off the bar ends in short arcs while the jet is live.
      drops.forEach((e, i) => {
        const life = (st.t * 1.6 + hash(i)) % 1, side = i % 2 ? 1 : -1, B = side > 0 ? B2 : B1;
        const x = B[0] + side * (3 + 11 * life) * (0.6 + 0.6 * hash(i + 9)), y = B[1] - 16 * life * (1 - life) * (1 + hash(i + 3)) + 4 * life;
        e.setAttribute('cx', f(x)); e.setAttribute('cy', f(y));
        e.setAttribute('opacity', f(st.on * (1 - life)));
      });
      // Mud washes off downhill from the bar; it spreads while live.
      const mw = 1 + 0.35 * st.on * (1 + 0.3 * sin(st.t * 2.2));
      mud.setAttribute('cx', f(Jp[0] - 1)); mud.setAttribute('cy', f(Jp[1] + g.gr * 0.55 * mw));
      mud.setAttribute('rx', f(g.gr * 1.2 * mw)); mud.setAttribute('ry', f(g.gr * 0.6 * mw));
      const td = st.trail.length > 1 ? 'M' + st.trail.map(p => `${f(p[0])} ${f(p[1])}`).join('L') : '';
      trails.forEach(e => { e.setAttribute('d', td); e.setAttribute('stroke-opacity', f(st.ta)); });
    };
    const loop = clock(time => {
      const dt = Math.min(0.1, time - (st.t || time));
      st.t = time;
      if (st.auto) st.jT = g.clamp([g.r * 0.55 * sin(time * 1.1), g.r * 0.35 * sin(time * 1.7)]);
      const prev = [...st.j], k = st.live ? 0.2 : 0.08;
      st.j = [st.j[0] + (st.jT[0] - st.j[0]) * k, st.j[1] + (st.jT[1] - st.j[1]) * k];
      // The fan lies across the stroke; doubled angles give it no head.
      const v = [st.j[0] - prev[0], st.j[1] - prev[1]], sp = hypot(...v), va = 2 * atan2(v[1], v[0]);
      const want = !st.live ? restDv : sp > 0.08 ? [cos(va), sin(va)] : st.dv;
      st.dv = [st.dv[0] + (want[0] - st.dv[0]) * 0.2, st.dv[1] + (want[1] - st.dv[1]) * 0.2];
      st.on += (st.onTo - st.on) * 0.15;
      if (st.live) {
        const last = st.trail[st.trail.length - 1];
        if (!last || hypot(st.j[0] - last[0], st.j[1] - last[1]) > 1.2) st.trail.push([...st.j]);
        if (st.trail.length > 240) st.trail.shift();
        st.ta = 1;
      } else if (st.ta > 0) {
        // The grime grows back over the new stripe.
        st.ta = Math.max(0, st.ta - dt / 2.4);
        if (!st.ta) st.trail = [];
      }
      draw();
      // The clock stops once the jet rests at the end of its stripe.
      if (!st.live && !st.trail.length && st.on < 0.01 && hypot(st.j[0] - g.restJ[0], st.j[1] - g.restJ[1]) < 0.05) {
        Object.assign(st, { j: [...g.restJ], jT: [...g.restJ], dv: [...restDv], on: 0 }); draw(); loop.stop();
      }
    });
    draw();
    return {
      enter(p) {
        st.live = true; st.onTo = 1; st.trail = [[...st.j]]; st.ta = 1; st.auto = !p; loop.start();
        if (p) this.move(p);
      },
      // The pointer steers the jet over the floor.
      move(p) { if (p) { st.auto = false; st.jT = g.clamp(unmap(g.m, p)); } },
      leave() { st.live = false; st.auto = false; st.onTo = 0; st.jT = [...g.restJ]; loop.start(); },
    };
  };

  const washerDefs = (u, g) => `${light(u)}${blur(`${u}gb`, 2.2)}${blur(`${u}mb`, 4)}${blur(`${u}s`, 3)}
    ${herring(`${u}brick`, MORTAR, BRICK)}
    ${herring(`${u}grime`, MOSS, GRIME)}
    ${lg(`${u}wet`, [[0, WET, 0.42], [0.5, WET, 0.1], [1, WET, 0]], `gradientUnits="userSpaceOnUse" x1="${-g.r}" y1="${-g.r}" x2="${g.r}" y2="${g.r * 0.6}"`)}
    ${lg(`${u}sun`, [[0, SUN, 0.3], [0.45, SUN, 0], [0.7, '#000', 0], [1, '#000', 0.3]], `gradientUnits="userSpaceOnUse" x1="${-g.r}" y1="${-g.r}" x2="${g.r}" y2="${g.r}"`)}
    ${rg(`${u}dark`, [[0, 'oklch(0.16 0.03 70)', 0.7], [1, 'oklch(0.16 0.03 70)', 0]])}
    ${rg(`${u}mossb`, [[0, 'oklch(0.55 0.13 135)', 0.35], [1, MOSS, 0]])}
    ${rg(`${u}mud`, [[0, MUD, 0.95], [0.6, MUD, 0.7], [1, MUD, 0]])}
    ${lg(`${u}fan`, [[0, '#fff', 1], [1, FOAM, 0.8]], 'gradientUnits="userSpaceOnUse"')}
    ${rg(`${u}glow`, [[0, '#fff', 1], [0.5, FOAM, 0.8], [1, FOAM, 0]])}
    ${lg(`${u}steel`, STEEL, 'x1="0" y1="0" x2="1" y2="0"')}
    ${lg(`${u}tip`, TIP, 'x1="0" y1="0" x2="1" y2="0"')}
    ${lg(`${u}grip`, GRIP, 'x1="0" y1="0" x2="1" y2="1"')}
    ${lg(`${u}side`, g.sideCols, 'x1="0" y1="0" x2="1" y2="0"')}`;
  // The layers, far to near: slab, floor in its plane, mud, jet, lance.
  const washerMarkup = (u, g) => {
    const blots = [[-28, -20, 18, 'dark'], [22, 18, 22, 'dark'], [36, -8, 14, 'dark'], [-6, 34, 16, 'dark'], [-10, 26, 14, 'mossb'], [30, -26, 14, 'mossb'], [-38, 6, 13, 'mossb'], [8, -30, 12, 'mossb']]
      .map(([x, y, r, k]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${u}${k})"/>`).join('');
    const rest = curve(g.rest), W = g.w, big = 'x="-80" y="-80" width="160" height="160"';
    return `
      ${g.under(u)}
      <g transform="matrix(${g.m.join(' ')})">
        <clipPath id="${u}clip">${g.clip}</clipPath>
        <mask id="${u}mg" maskUnits="userSpaceOnUse" ${big}>
          <rect ${big} fill="#fff"/>
          <g fill="none" stroke="#000" stroke-width="${W}" stroke-linecap="round" stroke-linejoin="round"><path d="${rest}"/><path class="trail"/></g>
        </mask>
        <mask id="${u}mw" maskUnits="userSpaceOnUse" ${big}>
          <g fill="none" stroke="#fff" stroke-width="${W}" stroke-linecap="round" stroke-linejoin="round"><path d="${rest}"/><path class="trail"/></g>
        </mask>
        <g clip-path="url(#${u}clip)">
          <rect ${big} fill="url(#${u}brick)"/>
          <rect ${big} fill="url(#${u}wet)" mask="url(#${u}mw)"/>
          <g mask="url(#${u}mg)"><rect ${big} fill="url(#${u}grime)"/>${blots}</g>
          <rect ${big} fill="url(#${u}sun)"/>
        </g>
      </g>
      <path d="${g.top}" fill="url(#${u}lit)"/>
      <path d="${g.top}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
      <clipPath id="${u}tc"><path d="${g.top}"/></clipPath>
      <g clip-path="url(#${u}tc)"><ellipse class="mud" fill="url(#${u}mud)" filter="url(#${u}gb)"/></g>
      <ellipse class="mist" rx="${f(g.gr * 2.2)}" ry="${f(g.gr * 1.6)}" fill="${FOAM}" filter="url(#${u}mb)"/>
      <ellipse class="glow" fill="url(#${u}glow)" filter="url(#${u}gb)"/>
      <path class="fan" fill="url(#${u}fan)"/>
      <path class="bar" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <g fill="${FOAM}">${[0, 1, 2, 3, 4, 5].map(i => `<circle class="drop" r="${f(1.7 + hash(i + 20) * 0.9)}" opacity="0"/>`).join('')}</g>
      <g class="lance">
        <path d="${rr(LANCE.tube)}" fill="url(#${u}steel)"/>
        ${body(rr(LANCE.grip), u, 'grip')}
        ${body(rr(LANCE.tip), u, 'tip')}
      </g>`;
  };
  // The emblem: the floor at rest in grey; stripe, jet and lance in white.
  const washerEmblem = g => {
    const Jp = map(g.m, g.restJ), [B1, B2] = barEnds(g, g.restJ, g.restA), N = [Jp[0] + g.noz[0], Jp[1] + g.noz[1]];
    return `${EMB_HEAD}${g.emUnder}<path d="${g.top}" fill="#8a8a8a"/><g transform="matrix(${g.m.join(' ')})"><clipPath id="c">${g.clip}</clipPath><path d="${curve(g.rest)}" clip-path="url(#c)" fill="none" stroke="#fff" stroke-width="${g.w}" stroke-linecap="round"/></g><path d="${poly([[N[0] - 3, N[1]], [N[0] + 3, N[1]], B2, B1])}" fill="#fff"/><path d="M${f(B1[0])} ${f(B1[1])}L${f(B2[0])} ${f(B2[1])}" stroke="#fff" stroke-width="4" stroke-linecap="round"/><g transform="translate(${f(N[0])} ${f(N[1])}) rotate(${g.lean})" fill="#fff"><path d="${rr(LANCE.tube)}"/><path d="${rr(LANCE.grip)}"/><path d="${rr(LANCE.tip)}"/></g></svg>`;
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover code.
  const GUN = 'M24 40H62Q72 40 72 50V62Q72 72 62 72H48L39 100Q37 106 31 106H25Q18 106 19 99L26 72Q14 71 14 60V50Q14 40 24 40Z';
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    box: [10, 36, 106, 84],
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}
          <linearGradient id="${u}body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.88 0.15 78)"/><stop offset="1" stop-color="oklch(0.62 0.18 42)"/></linearGradient>
          <linearGradient id="${u}steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.95 0.01 250)"/><stop offset="0.45" stop-color="oklch(0.72 0.015 250)"/><stop offset="1" stop-color="oklch(0.42 0.015 250)"/></linearGradient>
          <linearGradient id="${u}tip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.84 0.16 140)"/><stop offset="1" stop-color="oklch(0.55 0.15 135)"/></linearGradient>
          <linearGradient id="${u}jet" gradientUnits="userSpaceOnUse" x1="113" y1="0" x2="150" y2="0"><stop offset="0" stop-color="oklch(0.98 0.02 220)" stop-opacity="0.95"/><stop offset="1" stop-color="oklch(0.98 0.02 220)" stop-opacity="0.1"/></linearGradient>
          <filter id="${u}soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6"/></filter></defs>
        <g class="gun"><g class="shake">
          <path d="M30 104Q26 114 14 116" fill="none" stroke="oklch(0.28 0.02 250)" stroke-width="7" stroke-linecap="round"/>
          <g class="water" opacity="0">
            <ellipse cx="146" cy="56" rx="10" ry="13" fill="oklch(0.97 0.02 220)" opacity="0.4" filter="url(#${u}soft)"/>
            <path d="M113 52L150 40V72L113 60Z" fill="url(#${u}jet)"/>
            <g class="spray" fill="oklch(0.98 0.02 220)"><circle cx="144" cy="47" r="2.8"/><circle cx="147" cy="58" r="2.5"/><circle cx="142" cy="66" r="3"/><circle cx="149" cy="52" r="2.2"/></g>
          </g>
          <rect x="68" y="51" width="34" height="10" rx="5" fill="url(#${u}steel)"/>
          <rect x="98" y="46" width="16" height="20" rx="5.5" fill="url(#${u}tip)"/>
          <rect x="98" y="46" width="16" height="20" rx="5.5" fill="url(#${u}lit)"/>
          <path class="trigger" d="M50 72L44 92Q43 96 46 94L56 76Q57 72 53 72Z" fill="oklch(0.32 0.02 250)"/>
          <path d="${GUN}" fill="url(#${u}body)"/>
          <path d="${GUN}" fill="url(#${u}lit)"/>
          <path d="${GUN}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
          <rect x="22" y="49" width="9" height="14" rx="3.5" fill="oklch(0.5 0.16 38)" opacity="0.6"/>
        </g></g>`;
      const $q = s => svg.querySelector(s);
      const gun = $q('.gun'), shake = $q('.shake'), water = $q('.water'), trigger = $q('.trigger'), drops = [...$q('.spray').children];
      const PIVOT = [32, 76], BASE = (Math.atan2(56 - PIVOT[1], 114 - PIVOT[0]) * 180) / Math.PI;
      const st = { a: 0, on: 0 };
      let tl = null, nod = null;
      const draw = () => {
        gun.setAttribute('transform', `rotate(${st.a.toFixed(2)} ${PIVOT[0]} ${PIVOT[1]})`);
        trigger.setAttribute('transform', `rotate(${(-16 * st.on).toFixed(2)} 52 73)`);
        water.setAttribute('opacity', st.on.toFixed(2));
      };
      // The gun turns toward the pointer, within thirty degrees of level.
      const aim = p => {
        const deg = (Math.atan2(p[1] - PIVOT[1], p[0] - PIVOT[0]) * 180) / Math.PI - BASE;
        gsap.to(st, { a: clamp(deg, -30, 30), duration: 0.3, ease: 'power2.out', overwrite: 'auto', onUpdate: draw });
      };
      draw();
      return {
        enter(p) {
          gsap.to(st, { on: 1, duration: 0.14, onUpdate: draw });
          tl?.kill();
          tl = gsap.timeline({ repeat: -1 })
            .fromTo(shake, { x: 0 }, { x: -1.4, duration: 0.05, yoyo: true, repeat: 3, ease: 'none' }, 0)
            .fromTo(drops, { x: 0, y: 0, opacity: 1 }, { x: i => [10, 14, 8, 16][i], y: i => [-9, 2, 10, -4][i], opacity: 0, duration: 0.34, stagger: 0.06, ease: 'power1.out' }, 0);
          if (p) { aim(p); return; }
          nod?.kill();
          nod = gsap.fromTo(st, { a: -18 }, { a: 18, duration: 1, yoyo: true, repeat: -1, ease: 'sine.inOut', onUpdate: draw });
        },
        move(p) { if (p && !nod) aim(p); },
        leave() {
          nod?.kill(); nod = null; tl?.kill(); tl = null;
          gsap.set(shake, { x: 0 });
          gsap.to(st, { on: 0, duration: 0.2, onUpdate: draw });
          gsap.to(st, { a: 0, duration: 0.8, delay: 0.1, ease: 'back.out(2)', overwrite: 'auto', onUpdate: draw });
        },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // A round patio paver, free on the ground, seen from above at a slant.
  const AR = 50, ACY = 68, AT = 10, AK = 0.58, ARY = AR * AK;
  const aSide = `M${64 - AR} ${ACY}L${64 - AR} ${ACY + AT}A${AR} ${ARY} 0 0 0 ${64 + AR} ${ACY + AT}L${64 + AR} ${ACY}A${AR} ${ARY} 0 0 1 ${64 - AR} ${ACY}Z`;
  const A = {
    m: [1, 0, 0, AK, 64, ACY], r: AR, w: 20, hl: 13, gr: 11, noz: [10, -24], lean: 38,
    clip: `<circle r="${AR}"/>`,
    top: `M${64 - AR} ${ACY}A${AR} ${ARY} 0 1 1 ${64 + AR} ${ACY}A${AR} ${ARY} 0 1 1 ${64 - AR} ${ACY}Z`,
    rest: [[-64, 18], [-36, 24], [-16, -12], [12, -6]], restJ: [12, -6], restA: atan2(6, 28),
    sideCols: [[0, 'oklch(0.58 0.12 45)'], [0.5, 'oklch(0.44 0.1 40)'], [1, 'oklch(0.3 0.07 35)']],
    clamp: p => { const d = hypot(...p), k = Math.min(1, (AR - 10) / (d || 1)); return [p[0] * k, p[1] * k]; },
    under: u => `<ellipse cx="64" cy="${ACY + AT + 3}" rx="${AR}" ry="${f(ARY)}" fill="oklch(0.05 0.01 290)" opacity="0.55" filter="url(#${u}s)"/>${body(aSide, u, 'side')}`,
    emUnder: `<path d="${aSide}" fill="#555"/>`,
  };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [12, 6, 104, 86],
    idea: 'The toy\'s own floor as one round paver: warm herringbone brick under dark grime, moss bright in the joints, lit gold by the low evening sun. A clean, wet stripe runs across it to the jet: a glowing fan of water from the green nozzle, mist over it, mud running off downhill. Hover opens the jet; the pointer steers it and it cuts a new stripe through the grime. Off the tile, the grime grows back over the new stripe.',
    art(svg, u) {
      svg.innerHTML = `<defs>${washerDefs(u, A)}</defs>${washerMarkup(u, A)}`;
      return washer(svg, u, A);
    },
    emblem: washerEmblem(A),
  });

  /* ================= D: Isometric block ================= */

  // The paver is the block: the floor on top, brick on the faces.
  const CY = 66, H = 30, T = 13;
  const DM = [0.866, 0.5, -0.866, 0.5, 64, CY];
  const D_TOP = [[-H, -H], [H, -H], [H, H], [-H, H]].map(p => map(DM, p));
  const [, E0, S0, W0] = D_TOP;
  const down = p => [p[0], p[1] + T];
  const D = {
    m: DM, r: H, w: 16, hl: 11, gr: 10, noz: [9, -23], lean: 38,
    clip: `<rect x="${-H}" y="${-H}" width="${2 * H}" height="${2 * H}"/>`,
    top: poly(D_TOP),
    rest: [[-38, 12], [-18, 16], [-6, -8], [10, -4]], restJ: [10, -4], restA: atan2(4, 16),
    sideCols: [[0, '#000'], [1, '#000']],
    clamp: p => p.map(v => clamp(v, -H + 7, H - 7)),
    under: u => `<path d="${poly([E0, S0, W0, down(W0), down(S0), down(E0)])}" fill="oklch(0.05 0.01 290)" opacity="0.5" filter="url(#${u}s)" transform="translate(0 4)"/>
      <path d="${poly([W0, S0, down(S0), down(W0)])}" fill="oklch(0.5 0.12 42)"/>
      <path d="${poly([S0, E0, down(E0), down(S0)])}" fill="oklch(0.34 0.08 36)"/>
      <path d="${poly([W0, S0, down(S0), down(W0)])}" fill="url(#${u}lit)"/>`,
    emUnder: `<path d="${poly([W0, S0, down(S0), down(W0)])}" fill="#5a5a5a"/><path d="${poly([S0, E0, down(E0), down(S0)])}" fill="#3a3a3a"/>`,
  };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [12, 9, 104, 107],
    idea: 'The paver is the block: the grimy herringbone floor on top, warm brick on the faces, a rim on the top edges. The lance hangs over it; its fan has cut one clean, wet stripe. Hover opens the jet and the pointer steers it over the top; the grime grows back once the pointer leaves.',
    art(svg, u) {
      svg.innerHTML = `<defs>${washerDefs(u, D)}</defs>${washerMarkup(u, D)}`;
      return washer(svg, u, D);
    },
    emblem: washerEmblem(D),
  });

  /* ================= Gallery ================= */
  const NAME = 'Pressure washer';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-washer';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `washer-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
