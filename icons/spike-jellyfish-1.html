<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Jellyfish tank 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Jellyfish tank 1</h1>
<p class="lede">Jellyfish tank, round 1. No pick yet; A goes on the menu until Tom picks. A: a moon jelly, a pale glowing bell with four gonad rings, a short fringe and four frilled arms, in a blue glow. D: a block of deep blue water with the jelly inside it.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  const DIRS = [];

  // The toy's tokens: a pale glowing bell, violet gonads, deep tank blue.
  const BELL = [[0, 'oklch(0.96 0.03 230)', 0.95], [0.55, 'oklch(0.83 0.08 240)', 0.9], [1, 'oklch(0.64 0.12 252)', 0.88]];
  const ARM = [[0, 'oklch(0.92 0.05 235)', 0.95], [1, 'oklch(0.72 0.11 250)', 0.55]];
  const GON = 'oklch(0.8 0.08 292)';
  const FRINGE = 'oklch(0.9 0.05 235)';
  const GLOW = 'oklch(0.6 0.16 250)';

  // The jelly in a 128 box: the bell's apex at (64, 20), half-width 42.
  const J = { cx: 64, top: 20, R: 42 };
  J.my = J.top + J.R * 0.82;
  J.ry = J.R * 0.26;
  const BELLD = `M${J.cx - J.R} ${f(J.my)}C${J.cx - J.R} ${f(J.top + 10)} ${f(J.cx - J.R * 0.55)} ${J.top} ${J.cx} ${J.top}C${f(J.cx + J.R * 0.55)} ${J.top} ${J.cx + J.R} ${f(J.top + 10)} ${J.cx + J.R} ${f(J.my)}A${J.R} ${f(J.ry)} 0 0 1 ${J.cx - J.R} ${f(J.my)}Z`;
  const MARGIN = `M${J.cx - J.R + 1} ${f(J.my)}A${J.R - 1} ${f(J.ry - 1)} 0 0 0 ${J.cx + J.R - 1} ${f(J.my)}`;
  // Four gonad rings on the dome, seen from a little above.
  // A clover round the centre: left, right, back and front.
  const RINGS = [0, 1, 2, 3].map(i => {
    const a = i * Math.PI / 2;
    return { x: f(J.cx + 16 * Math.cos(a)), y: f(J.top + 16 + 7.5 * Math.sin(a)), rx: f(6.6 + 0.4 * Math.sin(a)), ry: f(3.5 + 0.5 * Math.sin(a)) };
  });
  // A frilled oral arm: a ribbon whose edges ruffle down its length.
  const arm = (x0, y0, x1, y1, wid, bow, ph) => {
    const L = [], R = [], n = 14, dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy), nx = -dy / l, ny = dx / l;
    for (let i = 0; i <= n; i++) {
      const t = i / n, b = Math.sin(Math.PI * t) * bow;
      const cx = x0 + dx * t + nx * b, cy = y0 + dy * t + ny * b;
      const w = wid * (1 - 0.55 * t) * (0.75 + 0.25 * Math.sin(t * 9 + ph));
      const fr = 1.4 * Math.sin(t * 26 + ph);
      L.push([cx + nx * (w + fr), cy + ny * (w + fr)]);
      R.push([cx - nx * (w - fr), cy - ny * (w - fr)]);
    }
    return poly([...L, ...R.reverse()]);
  };
  const ARMS = [arm(58, 58, 47, 104, 5.2, -4, 0.3), arm(62, 60, 58, 112, 5.6, 3, 1.9), arm(66, 60, 73, 110, 5.6, -3, 3.4), arm(70, 58, 83, 101, 5.2, 4, 5.1)];
  // The fringe: short tentacles along the front of the margin.
  const STRANDS = Array.from({ length: 13 }, (_, i) => {
    const t = (i + 0.5) / 13, a = Math.PI * t;
    const x = J.cx - (J.R - 1.5) * Math.cos(a), y = J.my + (J.ry - 1.5) * Math.sin(a);
    const len = 8 + 4 * Math.sin(i * 1.7) * Math.sin(i * 0.6 + 1);
    return `M${f(x)} ${f(y)}q${f(-2 - Math.cos(a) * 2)} ${f(len * 0.5)} ${f(-1 - Math.cos(a) * 3)} ${f(len)}`;
  }).join('');

  // The jelly's art, in groups the motion drives.
  const jellyArt = u => `
        <g class="jel">
          <g class="arms">${ARMS.map(d => `<path d="${d}" fill="url(#${u}arm)"/>`).join('')}</g>
          <g class="bell">
            ${body(BELLD, u, 'bell')}
            <path d="${MARGIN}" fill="none" stroke="#fff" stroke-width="2" opacity="0.55"/>
            ${RINGS.map(r => `<ellipse cx="${r.x}" cy="${r.y}" rx="${r.rx}" ry="${r.ry}" fill="none" stroke="${GON}" stroke-width="3" opacity="0.9"/>`).join('')}
          </g>
          <g class="fringe"><path d="${STRANDS}" fill="none" stroke="${FRINGE}" stroke-width="2.6" stroke-linecap="round" opacity="0.8"/></g>
        </g>`;
  const defs = u => `${light(u)}${blur(`${u}h`, 9)}${blur(`${u}b`, 2.6)}${lg(`${u}bell`, BELL)}${lg(`${u}arm`, ARM)}`;

  // The stroke: a quick close, then a slow open.
  const stroke = p => p < 0.3 ? Math.sin(p / 0.3 * Math.PI / 2) : 1 - (1 - Math.pow(1 - (p - 0.3) / 0.7, 2));
  // The shared motion: the pointer makes the jelly pulse and rise.
  // The bell closes and lifts; the fringe and the arms follow late.
  const run = svg => {
    const st = { live: false, ph: 0, lift: 0, last: 0 };
    const q = c => svg.querySelector(c);
    const jel = q('.jel'), bell = q('.bell'), fr = q('.fringe'), arms = q('.arms'), halo = q('.halo');
    const paint = time => {
      const k = stroke(st.ph % 1), sx = 1 - 0.13 * k, sy = 1 + 0.12 * k, dy = J.R * 0.82 * 0.12 * k;
      jel.setAttribute('transform', `translate(0 ${f(-st.lift)})`);
      bell.setAttribute('transform', `translate(${J.cx} ${J.top}) scale(${f(sx)} ${f(sy)}) translate(${-J.cx} ${-J.top})`);
      fr.setAttribute('transform', `translate(0 ${f(dy)}) translate(${J.cx} 0) scale(${f(sx)} 1) translate(${-J.cx} 0)`);
      const sw = Math.sin(time * 2.4) * 3 * Math.min(1, st.lift / 4);
      arms.setAttribute('transform', `translate(0 ${f(dy * 0.6)}) translate(${J.cx} 60) skewX(${f(sw)}) scale(1 ${f(1 - 0.07 * k)}) translate(${-J.cx} -60)`);
      if (halo) halo.setAttribute('opacity', f(0.35 + 0.2 * k));
    };
    const step = time => {
      const dt = Math.min(0.1, time - (st.last || time));
      st.last = time;
      const p = st.ph % 1;
      // At rest the bell finishes its stroke, then stays open.
      if (st.live || p > 0.001) st.ph = st.live || p + dt / 1.05 < 1 ? st.ph + dt / 1.05 : Math.ceil(st.ph);
      const k = stroke(st.ph % 1);
      st.lift = st.live ? Math.min(7, st.lift + k * dt * 9) : Math.max(0, st.lift - dt * 6);
      paint(time);
      if (!st.live && st.ph % 1 === 0 && st.lift <= 0 && st.last > 0) { st.last = 0; loop.stop(); }
    };
    const loop = clock(step);
    return {
      enter() { st.live = true; loop.start(); },
      move() {},
      leave() { st.live = false; loop.start(); },
    };
  };

  /* ================= Current ================= */

  // Jellyfish tank is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  const EMB_JELLY = `<path d="${BELLD}" fill="#fff"/>${RINGS.map(r => `<ellipse cx="${r.x}" cy="${r.y}" rx="${r.rx}" ry="${r.ry}" fill="none" stroke="#000" stroke-width="3.8"/>`).join('')}<path d="${MARGIN}" fill="none" stroke="#000" stroke-width="2.4"/>${ARMS.map(d => `<path d="${d}" fill="#fff"/>`).join('')}<path d="${STRANDS}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [19, 16, 90, 98],
    idea: 'A moon jelly seen from a little above, in a soft blue glow: a pale translucent bell with four violet gonad rings on its dome, a fringe of short tentacles along its margin, and four frilled oral arms hanging below. The pointer makes it pulse: the bell closes and opens, it rises a little, the fringe and arms trail and sway. It settles when the pointer leaves.',
    art(svg, u) {
      svg.innerHTML = `<defs>${defs(u)}</defs>
        <ellipse class="halo" cx="64" cy="58" rx="46" ry="44" fill="${GLOW}" opacity="0.35" filter="url(#${u}h)"/>
        ${jellyArt(u)}`;
      return run(svg);
    },
    // The emblem: the bell white with the rings and the margin cut, white arms and fringe.
    emblem: `${EMB_HEAD}${EMB_JELLY}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A block of deep blue water; the jelly floats inside it.
  const CY = 44, HX = 22, HY = 22, T = 40;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // The jelly at 0.4, its bell just under the water's top.
  const D_JEL = 'translate(64 69) scale(0.4) translate(-64 -20)';
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [25, 20, 78, 90],
    idea: 'A block of tank water at 30 degrees: a lit blue top, a deep blue left face, a near-black right face, a rim on the top edges. The moon jelly floats inside it, glowing through the front faces. The pointer makes it pulse and rise.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${defs(u)}
          ${lg(`${u}top`, [[0, 'oklch(0.62 0.12 238)'], [1, 'oklch(0.45 0.14 250)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.36 0.13 254)'], [1, 'oklch(0.2 0.09 262)']])}
          ${lg(`${u}R`, [[0, 'oklch(0.24 0.1 260)'], [1, 'oklch(0.13 0.05 265)']])}
          ${lg(`${u}sheen`, [[0, '#fff', 0.16], [0.6, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"')}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <ellipse class="halo" cx="64" cy="84" rx="20" ry="18" fill="${GLOW}" opacity="0.35" filter="url(#${u}h)"/>
        <g transform="${D_JEL}">${jellyArt(u)}</g>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}sheen)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="url(#${u}rim)" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.5" stroke-width="2" fill="none" stroke-linejoin="round"/>`;
      return run(svg);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/><g transform="${D_JEL}">${EMB_JELLY}</g></svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Jellyfish tank';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-jellyfish';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `jellyfish-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
