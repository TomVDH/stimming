<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Forge 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Forge 1</h1>
<p class="lede">Forge, round 1. No pick yet; A goes on the menu until Tom picks. A: an anvil with a bar at forging heat on its face, sparks thrown wide. D: the stump is the block, the anvil stands on it.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  const DIRS = [];

  // The toy's tokens: gunmetal iron, a polished face, steel at forging heat.
  const IRONC = [[0, 'oklch(0.4 0.012 250)'], [0.5, 'oklch(0.25 0.012 250)'], [1, 'oklch(0.15 0.01 250)']];
  const FACEC = [[0, 'oklch(0.86 0.01 250)'], [1, 'oklch(0.6 0.012 250)']];
  // The bar: yellow at the tip, orange, cherry, then cold iron.
  const HOTC = [[0, 'oklch(0.97 0.09 95)'], [0.18, 'oklch(0.86 0.16 75)'], [0.38, 'oklch(0.7 0.2 45)'], [0.58, 'oklch(0.48 0.17 30)'], [0.78, 'oklch(0.3 0.03 30)'], [1, 'oklch(0.26 0.01 250)']];
  const GLOWC = [[0, 'oklch(0.8 0.17 65)', 0.9], [1, 'oklch(0.6 0.2 40)', 0]];
  const WOODT = [[0, 'oklch(0.58 0.07 60)'], [1, 'oklch(0.44 0.06 55)']];
  const WOODL = [[0, 'oklch(0.4 0.06 50)'], [1, 'oklch(0.3 0.05 48)']];
  const WOODR = [[0, 'oklch(0.27 0.045 45)'], [1, 'oklch(0.19 0.035 40)']];

  // A London-pattern anvil in side view, horn to the left.
  // s scales it about (ox, oy), the middle of its foot.
  const anvilGeo = (ox, oy, s) => {
    const P = (x, y) => `${f(ox + (x - 64) * s)} ${f(oy + (y - 106) * s)}`;
    const body = `M${P(10, 56)}Q${P(24, 49.5)} ${P(38, 50)}L${P(46, 50.5)}L${P(46, 47)}L${P(116, 47)}Q${P(119, 47)} ${P(119, 50)}L${P(119, 55)}Q${P(110, 58)} ${P(100, 62)}Q${P(90, 66)} ${P(88, 74)}Q${P(85, 86)} ${P(92, 96)}L${P(106, 100)}L${P(106, 106)}L${P(40, 106)}L${P(40, 100)}L${P(54, 96)}Q${P(61, 86)} ${P(58, 74)}Q${P(55, 67)} ${P(44, 65)}Q${P(24, 63)} ${P(10, 56)}Z`;
    const face = `M${P(46, 47)}L${P(116, 47)}Q${P(119, 47)} ${P(119, 50)}L${P(46, 50.5)}Z`;
    // The bar lies on the face; its hot end overhangs the step, drawn out flat.
    const bar = `M${P(28, 44.4)}Q${P(34, 41.2)} ${P(48, 41.4)}L${P(126, 41.6)}L${P(126, 47)}L${P(48, 47)}Q${P(34, 47.4)} ${P(28, 45.8)}Z`;
    const hot = [ox + (44 - 64) * s, oy + (44.5 - 106) * s];
    // Sparks: short streaks thrown low and wide from the hot end.
    const sp = [];
    const ang = [-176, -162, -146, -128, -52, -34, -18, -6, -170, -12];
    ang.forEach((a, i) => {
      const r0 = (6 + (i % 3) * 3) * s, len = (8 + (i * 7) % 10) * s, t = a * Math.PI / 180;
      const x0 = hot[0] + Math.cos(t) * r0, y0 = hot[1] + Math.sin(t) * r0 * 0.8;
      sp.push({ d: `M${f(x0)} ${f(y0)}L${f(x0 + Math.cos(t) * len)} ${f(y0 + Math.sin(t) * len * 0.8)}`, dx: f(Math.cos(t) * 10 * s), dy: f(Math.sin(t) * 8 * s + 4 * s), w: f((1.6 + (i % 2) * 0.6) * s) });
    });
    return { body, face, bar, hot, sp, s, ox, oy, P };
  };
  // An anvil in the menu's language. Classes: anvil, bar, glow, spark.
  const anvilArt = (u, G) => `
      <ellipse class="glow" cx="${f(G.hot[0] + 6 * G.s)}" cy="${f(G.hot[1] + 4 * G.s)}" rx="${f(30 * G.s)}" ry="${f(22 * G.s)}" fill="url(#${u}glow)" filter="url(#${u}h)"/>
      <g class="anvil" data-o="${f(G.ox)} ${f(G.oy)}">
        ${body(G.body, u, 'iron')}
        <path d="${G.face}" fill="url(#${u}face)"/>
        <path d="M${G.P(48, 51)}Q${G.P(30, 53)} ${G.P(16, 57)}" stroke="oklch(0.75 0.17 55)" stroke-width="${f(2 * G.s)}" stroke-linecap="round" fill="none" opacity="0.5" filter="url(#${u}s)"/>
        <path class="bar" d="${G.bar}" fill="url(#${u}hot)"/>
        <ellipse class="hotspot" cx="${f(G.hot[0])}" cy="${f(G.hot[1])}" rx="${f(9 * G.s)}" ry="${f(4 * G.s)}" fill="oklch(0.98 0.07 95)" opacity="0.75" filter="url(#${u}s)"/>
      </g>
      <g class="sparks">${G.sp.map(p => `<path class="spark" d="${p.d}" data-dx="${p.dx}" data-dy="${p.dy}" stroke="oklch(0.9 0.15 78)" stroke-width="${p.w}" stroke-linecap="round" fill="none"/>`).join('')}</g>`;
  // The shared motion: a blow. The anvil jolts, the bar flares, sparks fly.
  // Leave lets the glow settle and the sparks come home.
  const run = svg => {
    const anvil = svg.querySelector('.anvil'), sparks = svg.querySelectorAll('.spark'), glow = svg.querySelector('.glow'), spot = svg.querySelector('.hotspot');
    const o = anvil.dataset.o;
    let tl = null;
    const blow = () => {
      const t = gsap.timeline();
      t.to(anvil, { y: 1.6, duration: 0.06, ease: 'power3.in' })
        .to(anvil, { y: 0, duration: 0.3, ease: 'elastic.out(1.2, 0.4)' })
        .fromTo(spot, { opacity: 1, scale: 1.5, svgOrigin: o }, { opacity: 0.75, scale: 1, duration: 0.5, ease: 'power2.out' }, 0.05)
        .fromTo(glow, { opacity: 1 }, { opacity: 0.75, duration: 0.6, ease: 'power2.out' }, 0.05)
        .fromTo(sparks, { x: 0, y: 0, opacity: 1 }, { x: (i, s) => +s.dataset.dx, y: (i, s) => +s.dataset.dy, opacity: 0, duration: 0.55, ease: 'power2.out', stagger: { each: 0.008, from: 'random' } }, 0.05);
      return t;
    };
    return {
      enter() {
        if (tl) tl.kill();
        // Two blows in the smith's rhythm, then a rest.
        tl = gsap.timeline({ repeat: -1, repeatDelay: 0.35 });
        tl.add(blow()).add(blow(), 0.5);
      },
      move() {},
      leave() {
        if (tl) tl.kill();
        tl = null;
        gsap.to(anvil, { y: 0, duration: 0.3, ease: 'power2.out' });
        gsap.to(spot, { opacity: 0.75, scale: 1, svgOrigin: o, duration: 0.4 });
        gsap.to(glow, { opacity: 0.75, duration: 0.4 });
        gsap.to(sparks, { x: 0, y: 0, opacity: 1, duration: 0.45, ease: 'power2.inOut' });
      },
    };
  };
  const defs = u => `${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}s`, 1.2)}${blur(`${u}h`, 8)}
          ${lg(`${u}iron`, IRONC, 'x1="0.2" y1="0" x2="0.6" y2="1"')}${lg(`${u}face`, FACEC)}
          ${lg(`${u}hot`, HOTC, 'x1="0" y1="0" x2="1" y2="0"')}${rg(`${u}glow`, GLOWC)}`;
  // The emblem's anvil: a white silhouette, the bar in grey above the face.
  const embAnvil = G => `<path d="${G.body}" fill="#fff"/><path d="${G.bar}" fill="#b0b0b0"/>${G.sp.slice(0, 8).map(p => `<path d="${p.d}" stroke="#fff" stroke-width="${f(+p.w + 0.6)}" stroke-linecap="round" fill="none"/>`).join('')}`;

  /* ================= Current ================= */

  // Forge is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  const GA = anvilGeo(64, 104, 1);
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [9, 28, 117, 78],
    idea: 'A gunmetal London-pattern anvil, a polished face, a long horn, flared feet; a bar lies on the face, its drawn-out end glowing yellow into orange and cherry, sparks thrown low and wide, the anvil lit warm from below the glow. The pointer strikes two blows in rhythm: the anvil jolts, the bar flares, sparks fly; leave and it settles.',
    art(svg, u) {
      svg.innerHTML = `<defs>${defs(u)}</defs>${anvilArt(u, GA)}`;
      return run(svg);
    },
    emblem: `${EMB_HEAD}${embAnvil(GA)}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The stump is the block: an end-grain top and two wooden faces; the anvil stands on it.
  const CY = 82, HX = 30, HY = 30, T = 18;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  const GD = anvilGeo(66, CY + 4, 0.62);
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [9, 40, 112, S[1] + T - 40],
    idea: 'The anvil\'s stump as the block at 30 degrees: an end-grain top, a mid left face, a dark right face, a rim on the top edges. The anvil stands on it with the glowing bar on its face. The pointer strikes, as A does.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${defs(u)}
          ${lg(`${u}top`, WOODT, 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, WOODL)}${lg(`${u}R`, WOODR)}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <ellipse cx="64" cy="${CY}" rx="20" ry="11" fill="none" stroke="oklch(0.42 0.06 55)" stroke-width="1.4" opacity="0.6"/>
        <ellipse cx="64" cy="${CY}" rx="11" ry="6" fill="none" stroke="oklch(0.42 0.06 55)" stroke-width="1.4" opacity="0.5"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <ellipse cx="66" cy="${CY + 4}" rx="26" ry="7" fill="oklch(0.1 0.01 40)" opacity="0.55" filter="url(#${u}b)"/>
        ${anvilArt(u, GD)}`;
      return run(svg);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/>${embAnvil(GD)}</svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = 'Forge';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-forge';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `forge-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    const A = DIRS.find(d => d.l === 'A');
    const m = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' });
    A.art(m, 'forge-');
    fitIcon(m, A.box);
    m.setAttribute('class', 'art');
    pre.textContent = JSON.stringify({ ...window.EMBLEMS, menu: m.outerHTML });
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
