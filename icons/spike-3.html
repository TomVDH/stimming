<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 3</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- The current menu icons. -->
    <linearGradient id="g-morph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: #f7b65b"/>
      <stop offset="1" style="stop-color: #d23c34"/>
    </linearGradient>
    <linearGradient id="g-blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: #f7a1c4"/>
      <stop offset="1" style="stop-color: #d63b6e"/>
    </linearGradient>
    <linearGradient id="g-cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.92 0.1 165)"/>
      <stop offset="1" style="stop-color: oklch(0.64 0.13 225)"/>
    </linearGradient>
    <!-- Morpher. -->
    <linearGradient id="m-goo" gradientUnits="userSpaceOnUse" x1="24" y1="40" x2="100" y2="104">
      <stop offset="0" style="stop-color: oklch(0.8 0.11 305)"/>
      <stop offset="1" style="stop-color: oklch(0.64 0.17 330)"/>
    </linearGradient>
    <linearGradient id="m-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.83 0.13 72)"/>
      <stop offset="1" style="stop-color: oklch(0.58 0.19 30)"/>
    </linearGradient>
    <linearGradient id="m-jelly" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.93 0.1 160)"/>
      <stop offset="1" style="stop-color: oklch(0.74 0.13 182)"/>
    </linearGradient>
    <!-- Pop field. -->
    <radialGradient id="p-shade" cx="0.4" cy="0.36" r="0.68">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="p-film" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.42 0.06 190)"/>
      <stop offset="1" style="stop-color: oklch(0.3 0.06 240)"/>
    </linearGradient>
  </defs>
</svg>

<h1>Icon spike 3</h1>
<p class="lede">Morpher, Pop field. The current icon, then five directions each. Hover or tab to the tiles.</p>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2;
  const BG = 'oklch(0.16 0.012 275)';
  const f = n => +n.toFixed(2);
  const f1 = n => Math.round(n * 10) / 10;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mix = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const ring = (n, r, rot = -Math.PI / 2, cx = 64, cy = 64) =>
    Array.from({ length: n }, (_, k) => [cx + r * Math.cos(rot + (k * TAU) / n), cy + r * Math.sin(rot + (k * TAU) / n)]);
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };

  /* ---------- Distance fields: the Morpher's own maths ---------- */

  const sdCircle = (x, y, cx, cy, r) => Math.hypot(x - cx, y - cy) - r;
  const sdBox = (x, y, cx, cy, hw, hh, r) => {
    const qx = Math.abs(x - cx) - hw + r, qy = Math.abs(y - cy) - hh + r;
    return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
  };
  // An equilateral triangle, point up, centred on its centroid.
  const sdTri = (x, y, cx, cy, r) => {
    const k = Math.sqrt(3);
    let px = Math.abs(x - cx) - r, py = cy - y + r / k;
    if (px + k * py > 0) [px, py] = [(px - k * py) / 2, (-k * px - py) / 2];
    px -= clamp(px, -2 * r, 0);
    return -Math.hypot(px, py) * Math.sign(py);
  };
  // The smooth minimum melts two shapes into one.
  const smin = (a, b, k) => {
    if (k <= 0) return Math.min(a, b);
    const h = Math.max(k - Math.abs(a - b), 0) / k;
    return Math.min(a, b) - h * h * k * 0.25;
  };
  // A field sampled on a grid of step s.
  const field = (fn, x0, y0, x1, y1, s) => {
    const nx = Math.ceil((x1 - x0) / s) + 1, ny = Math.ceil((y1 - y0) / s) + 1;
    const g = new Float32Array(nx * ny);
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) g[j * nx + i] = fn(x0 + i * s, y0 + j * s);
    return { g, nx, ny, x0, y0, s };
  };
  // Marching squares: the level line of a field as closed path loops.
  const contour = (F, lv = 0) => {
    const { g, nx, ny, x0, y0, s } = F;
    const v = (i, j) => g[j * nx + i] - lv;
    const pts = new Map(), adj = new Map();
    const ep = (i, j, h) => {
      const key = 2 * (j * nx + i) + (h ? 0 : 1);
      if (!pts.has(key)) {
        const a = v(i, j), b = h ? v(i + 1, j) : v(i, j + 1), t = a / (a - b);
        pts.set(key, h ? [x0 + (i + t) * s, y0 + j * s] : [x0 + i * s, y0 + (j + t) * s]);
      }
      return key;
    };
    const link = (a, b) => {
      if (!adj.has(a)) adj.set(a, []);
      if (!adj.has(b)) adj.set(b, []);
      adj.get(a).push(b); adj.get(b).push(a);
    };
    for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
      const a = v(i, j), b = v(i + 1, j), c = v(i + 1, j + 1), d = v(i, j + 1);
      const idx = (a < 0 ? 8 : 0) | (b < 0 ? 4 : 0) | (c < 0 ? 2 : 0) | (d < 0 ? 1 : 0);
      if (idx === 0 || idx === 15) continue;
      const T = () => ep(i, j, true), R = () => ep(i + 1, j, false), B = () => ep(i, j + 1, true), L = () => ep(i, j, false);
      const mid = a + b + c + d < 0;
      switch (idx) {
        case 1: case 14: link(L(), B()); break;
        case 2: case 13: link(B(), R()); break;
        case 3: case 12: link(L(), R()); break;
        case 4: case 11: link(T(), R()); break;
        case 6: case 9: link(T(), B()); break;
        case 7: case 8: link(L(), T()); break;
        case 5: if (mid) { link(L(), T()); link(B(), R()); } else { link(T(), R()); link(L(), B()); } break;
        case 10: if (mid) { link(T(), R()); link(L(), B()); } else { link(L(), T()); link(B(), R()); } break;
      }
    }
    const seen = new Set();
    let out = '';
    for (const start of adj.keys()) {
      if (seen.has(start)) continue;
      const loop = [];
      let prev = -1, cur = start;
      while (cur !== undefined && !seen.has(cur)) {
        seen.add(cur);
        loop.push(pts.get(cur));
        const nb = adj.get(cur), next = nb[0] !== prev ? nb[0] : nb[1];
        prev = cur; cur = next;
      }
      if (loop.length > 2) out += 'M' + loop.map(p => `${f1(p[0])} ${f1(p[1])}`).join('L') + 'Z';
    }
    return out;
  };
  const iso = (fn, box, s, lv) => contour(field(fn, ...box, s), lv);

  const DIRS = [];

  /* ================= Morpher ================= */

  // Current: the menu icon, copied as is.
  DIRS.push({
    toy: 'morpher', l: 'Current', current: '../shared/emblems/morpher.svg',
    art(svg, u) {
      svg.innerHTML = `
        <clipPath id="${u}d"><circle cx="52" cy="76" r="34"/></clipPath>
        <circle cx="52" cy="76" r="34" fill="url(#g-blob)"/>
        <circle cx="52" cy="76" r="34" fill="url(#lit)"/>
        <circle cx="52" cy="76" r="34" fill="none" stroke="url(#rim)" stroke-width="2"/>
        <path class="m-tri" d="M82 20.72L122 90H42Z" fill="url(#g-morph)"/>
        <path class="m-tri" d="M82 20.72L122 90H42Z" fill="url(#lit)"/>
        <path class="m-tri" d="M82 20.72L122 90H42Z" fill="none" stroke="url(#rim)" stroke-width="2" stroke-linejoin="round"/>
        <g clip-path="url(#${u}d)"><path class="m-tri" d="M82 20.72L122 90H42Z" style="fill: var(--bg)"/></g>`;
      const tris = [...svg.querySelectorAll('.m-tri')];
      let turn = 0;
      const turnTri = () => {
        turn += 120;
        gsap.to(tris, { rotation: turn, svgOrigin: '82 66.91', duration: 0.6, ease: 'back.inOut(1.6)', overwrite: true });
      };
      return { enter: turnTri, move() {}, leave() {} };
    },
  });

  // A: a glossy square of goo; a mint drop follows the pointer and melts in.
  {
    const REST = { x: 92, y: 38 };
    const goo = (x, y, o) => smin(sdBox(x, y, 52, 74, 28, 28, 14), sdCircle(x, y, o.x, o.y, 16), 16);
    const BOX = [10, 10, 120, 118];
    DIRS.push({
      toy: 'morpher', l: 'A',
      art(svg, u) {
        svg.innerHTML = `
          <radialGradient id="${u}m" gradientUnits="userSpaceOnUse" cx="${REST.x}" cy="${REST.y}" r="34">
            <stop offset="0.35" style="stop-color: oklch(0.88 0.13 165)"/>
            <stop offset="1" style="stop-color: oklch(0.88 0.13 165)" stop-opacity="0"/>
          </radialGradient>
          <path class="g" fill="url(#m-goo)"/>
          <path class="g" fill="url(#${u}m)"/>
          <path class="g" fill="url(#lit)"/>
          <path class="g" fill="none" stroke="url(#rim)" stroke-width="1.6"/>`;
        const P = [...svg.querySelectorAll('.g')], grad = svg.getElementById(`${u}m`);
        const o = { ...REST };
        const draw = () => {
          const d = iso((x, y) => goo(x, y, o), BOX, 2);
          P.forEach(p => p.setAttribute('d', d));
          grad.setAttribute('cx', f(o.x)); grad.setAttribute('cy', f(o.y));
        };
        draw();
        const aim = p => p && gsap.to(o, { x: clamp(p[0], 30, 94), y: clamp(p[1], 36, 98), duration: 0.55, ease: 'power3.out', overwrite: true, onUpdate: draw });
        return {
          enter: p => aim(p || [70, 60]), move: aim,
          leave: () => gsap.to(o, { ...REST, duration: 1.1, ease: 'elastic.out(1, 0.5)', overwrite: true, onUpdate: draw }),
        };
      },
      emblem: emb(`
        <path d="${iso((x, y) => goo(x, y, REST), BOX, 1)}" fill="#fff"/>
        <path d="${iso((x, y) => goo(x, y, REST), BOX, 1, -6)}" fill="none" stroke="#000" stroke-width="2.4"/>
        <circle cx="40" cy="58" r="4.5" fill="#000"/>
      `),
    });
  }

  // B: a plate with a stencil hole; hover melts it from shape to shape.
  {
    const S = [
      (x, y) => sdCircle(x, y, 64, 64, 33),
      (x, y) => sdTri(x, y, 64, 70, 34) - 4,
      (x, y) => sdBox(x, y, 64, 64, 29, 29, 7),
    ];
    // The bridge keeps the stencil in one piece.
    const hole = (x, y, st) => {
      const i = Math.floor(st.t), e = smooth(0.3, 0.85, st.t - i);
      const d = mix(mix(S[i % 3](x, y), S[(i + 1) % 3](x, y), e), S[0](x, y), st.r);
      return Math.max(d, -sdBox(x, y, 64, 64, 2.8, 70, 0));
    };
    const BOX = [20, 20, 108, 108];
    const CORNERS = [[23, 23], [105, 23], [23, 105], [105, 105]];
    DIRS.push({
      toy: 'morpher', l: 'B',
      art(svg) {
        svg.innerHTML = `
          <rect x="12" y="12" width="104" height="104" rx="10" fill="url(#m-plate)"/>
          <rect x="12" y="12" width="104" height="104" rx="10" fill="url(#lit)"/>
          <rect x="12" y="12" width="104" height="104" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
          <g style="fill: ${BG}">${CORNERS.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.2"/>`).join('')}</g>
          <path class="h" style="fill: ${BG}"/>`;
        const h = svg.querySelector('.h');
        const st = { t: 0, r: 0 };
        const draw = () => h.setAttribute('d', iso((x, y) => hole(x, y, st), BOX, 1.5));
        draw();
        return hoverLoop(
          () => { gsap.killTweensOf(st); st.r = 0; return gsap.timeline({ repeat: -1 }).fromTo(st, { t: 0 }, { t: 3, duration: 3.9, ease: 'none', onUpdate: draw }); },
          () => gsap.to(st, { r: 1, duration: 0.45, ease: 'power2.out', onUpdate: draw, onComplete: () => { st.t = 0; st.r = 0; draw(); } }));
      },
      emblem: emb(`
        <rect x="12" y="12" width="104" height="104" rx="10" fill="#fff"/>
        ${CORNERS.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.6" fill="#000"/>`).join('\n')}
        <path d="${iso((x, y) => hole(x, y, { t: 0, r: 0 }), BOX, 1)}" fill="#000"/>
      `),
    });
  }

  // C: distance contours round a circle and a square; hover draws them together.
  {
    const LV = [-8, 0, 8, 16];
    const HUE = ['oklch(0.82 0.14 350)', 'oklch(0.88 0.09 310)', 'oklch(0.78 0.1 270)', 'oklch(0.68 0.1 240)'];
    const fn = s => (x, y) => smin(sdCircle(x, y, 44 + 13 * s, 46 + 13 * s, 22), sdBox(x, y, 84, 82, 20, 20, 4), 12 + 10 * s);
    const lines = (s, step) => { const F = field(fn(s), -6, -6, 134, 134, step); return LV.map(lv => contour(F, lv)); };
    DIRS.push({
      toy: 'morpher', l: 'C',
      art(svg) {
        svg.innerHTML = `<g fill="none" stroke-width="2.2" stroke-linejoin="round">${HUE.map(c => `<path style="stroke: ${c}"/>`).join('')}</g>`;
        const P = [...svg.querySelectorAll('path')];
        const st = { t: 0 };
        const draw = () => lines((1 - Math.cos(TAU * st.t)) / 2, 2).forEach((d, k) => P[k].setAttribute('d', d));
        draw();
        return hoverLoop(
          () => gsap.timeline({ repeat: -1 }).fromTo(st, { t: 0 }, { t: 1, duration: 2.8, ease: 'none', onUpdate: draw }),
          () => gsap.to(st, { t: st.t < 0.5 ? 0 : 1, duration: 0.6, ease: 'power2.out', onUpdate: draw }));
      },
      emblem: emb(`
        ${lines(0, 1).map(d => `<path d="${d}" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"/>`).join('\n')}
      `),
    });
  }

  // D: an isometric plinth; a jelly of two blobs melts and turns on top.
  {
    const U = 48, OY = 66;
    const P3 = (x, y, z) => [64 + (x - y) * 0.866 * U, OY + (x + y) * 0.5 * U - z * U];
    const TOP = [P3(0, 0, 1), P3(1, 0, 1), P3(1, 1, 1), P3(0, 1, 1)];
    const LEFT = [P3(0, 1, 0), P3(1, 1, 0), P3(1, 1, 1), P3(0, 1, 1)];
    const RIGHT = [P3(1, 0, 0), P3(1, 1, 0), P3(1, 1, 1), P3(1, 0, 1)];
    const HULL = [P3(0, 0, 1), P3(1, 0, 1), P3(1, 0, 0), P3(1, 1, 0), P3(0, 1, 0), P3(0, 1, 1)];
    const C = P3(1, 1, 1), B = P3(1, 1, 0);
    // Top-face plane: u and v run 0 to 100.
    const MT = `matrix(${f(0.00866 * U)} ${f(0.005 * U)} ${f(-0.00866 * U)} ${f(0.005 * U)} 64 ${f(OY - U)})`;
    const jelly = t => {
      const a = TAU * t, s = 16 + 5 * Math.sin(2 * a), c = Math.cos(a), n = Math.sin(a);
      return (x, y) => smin(sdCircle(x, y, 50 - s * c, 50 - s * n, 24), sdCircle(x, y, 50 + s * c, 50 + s * n, 16), 16);
    };
    const DEPTH = 8;
    DIRS.push({
      toy: 'morpher', l: 'D',
      art(svg, u) {
        svg.innerHTML = `
          <defs><path id="${u}j"/></defs>
          <path d="${poly(TOP)}" fill="oklch(0.56 0.08 292)"/>
          <path d="${poly(LEFT)}" fill="oklch(0.43 0.09 290)"/>
          <path d="${poly(RIGHT)}" fill="oklch(0.31 0.07 284)"/>
          <path d="${poly(TOP)}" fill="url(#lit)"/>
          <path d="M${P3(0, 1, 1).join(' ')}L${C.join(' ')}L${P3(1, 0, 1).join(' ')}M${C.join(' ')}L${B.join(' ')}" fill="none" stroke="oklch(0.86 0.04 290 / 0.4)" stroke-width="1.2"/>
          <path d="${poly(HULL)}" fill="none" stroke="url(#rim)" stroke-width="1.5" stroke-linejoin="round"/>
          <g transform="translate(2.5 1.5)"><g transform="${MT}"><use href="#${u}j" fill="#000" fill-opacity="0.28"/></g></g>

  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const src = D.current || `spike/emblems/${file}.svg`;
      const label = D.current ? 'Current' : `${D.l} · ${RUBRIC[D.l]}`;
      if (!D.current) window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.current ? '<b>Current</b>' : `<b>${D.l}</b><span>· ${RUBRIC[D.l]}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${label}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${label}, 64"></div></div>
        <div class="emb"><div class="flash"><i style="--emblem: url(${src})"></i></div><div class="glass"><i style="--emblem: url(${src})"></i></div></div>`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg);
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
