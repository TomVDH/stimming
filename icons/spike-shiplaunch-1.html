<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Ship launch 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Ship launch 1</h1>
<p class="lede">Ship launch, round 1. No pick yet; A goes on the menu until Tom picks. A: the coaster in profile over a strip of canal, her spray along the waterline; D: the berth as a block with the coaster tipping off its edge. The pointer launches her; rest settles her.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };


  // The toy's tokens: a green coaster over a red-brown bottom, a white house, canal water, white spray in low sun.
  const HULL = [[0, 'oklch(0.52 0.11 152)'], [1, 'oklch(0.34 0.08 155)']];
  const BOTTOM = [[0, 'oklch(0.46 0.12 32)'], [1, 'oklch(0.3 0.09 30)']];
  const HOUSE = [[0, 'oklch(0.97 0.006 90)'], [1, 'oklch(0.8 0.012 250)']];
  const WATER = [[0, 'oklch(0.48 0.05 200)'], [1, 'oklch(0.26 0.04 215)']];
  const SPRAY = [[0, 'oklch(0.99 0.02 85)'], [1, 'oklch(0.82 0.02 240)']];
  const SPRAY_D = [[0, 'oklch(0.74 0.02 240)'], [1, 'oklch(0.6 0.03 230)']];
  const CONC = [[0, 'oklch(0.74 0.012 80)'], [1, 'oklch(0.56 0.012 80)']];
  const FLAGS = ['oklch(0.6 0.2 28)', 'oklch(0.85 0.15 90)', 'oklch(0.52 0.14 255)', 'oklch(0.97 0.01 90)', 'oklch(0.6 0.14 150)'];

  // Spray billows along a waterline: they climb and swell with k.
  const billows = (x0, x1, y, n, r0, k, t, sc = 1, dx = 0, dy = 0) => {
    let d = '';
    for (let i = 0; i < n; i++) {
      const u = (i + 0.5) / n, x = x0 + (x1 - x0) * u;
      const h = Math.sin(Math.PI * u) ** 0.6;
      const R = (r0 * (0.55 + 0.6 * k) * (0.75 + 0.35 * Math.sin(i * 2.7))) * sc;
      const cx = x + Math.sin(t * 2.3 + i) * 1.1 * k + dx, cy = y - (2 + 13 * k) * h * (0.7 + 0.3 * Math.sin(i * 1.9)) + dy;
      d += `M${f(cx + R)} ${f(cy)}A${f(R)} ${f(R)} 0 1 0 ${f(cx - R)} ${f(cy)}A${f(R)} ${f(R)} 0 1 0 ${f(cx + R)} ${f(cy)}Z`;
    }
    return d;
  };
  // Pennants hang along a sagging line; each swings with its own phase.
  const pennants = (pts, k, t) => {
    let out = '', n = 0;
    for (let s = 0; s < pts.length - 1; s++) {
      const [a, b] = [pts[s], pts[s + 1]], m = Math.max(2, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / 7));
      for (let i = 0; i < m; i++) {
        const u = (i + 0.5) / m, x = lerp(a[0], b[0], u), y = lerp(a[1], b[1], u) + 3 * 4 * u * (1 - u);
        const sw = (0.15 + 0.6 * k) * Math.sin(t * 6 + n * 0.9);
        out += `<path d="M${f(x - 1.9)} ${f(y)}L${f(x + 1.9)} ${f(y)}L${f(x + sw * 2)} ${f(y + 4.2)}Z" fill="${FLAGS[n++ % FLAGS.length]}"/>`;
      }
    }
    return out;
  };

  // The state both icons share: the pointer cuts the rope; rest lets her settle.
  const run = draw => {
    const st = { e: 0, to: 0, t: 0, live: false };
    const step = time => {
      st.t = time;
      st.e += (st.to - st.e) * (st.live ? 0.07 : 0.03);
      draw(st);
      if (!st.live && st.e < 0.01) { Object.assign(st, { e: 0, t: 0 }); draw(st); loop.stop(); }
    };
    const loop = clock(step);
    draw(st);
    return {
      enter() { st.live = true; st.to = 1; loop.start(); },
      move() {},
      leave() { st.live = false; st.to = 0; loop.start(); },
    };
  };
  // One frame: the hull heels and rocks, the spray climbs, the bunting swings.
  const animate = (svg, P) => {
    const hull = svg.querySelector('.hull'), sp = [...svg.querySelectorAll('.sp')], sq = [...svg.querySelectorAll('.sq')], bt = svg.querySelector('.bt');
    return run(st => {
      const rock = st.e * (P.heel + 3 * Math.sin(st.t * 2.2) * st.e);
      hull.setAttribute('transform', `translate(0 ${f(P.drop * st.e)}) rotate(${f(rock)} ${P.pivot[0]} ${P.pivot[1]})`);
      const d = billows(P.s[0], P.s[1], P.s[2], P.s[3], P.s[4], st.e, st.t);
      sp.forEach(p => p.setAttribute('d', d));
      const q = billows(P.s[0], P.s[1], P.s[2], P.s[3], P.s[4], st.e, st.t, 0.78, -1.2, -1.6);
      sq.forEach(p => p.setAttribute('d', q));
      bt.innerHTML = pennants(P.flags, st.e, st.t);
    });
  };
  const defs = u => `${light(u)}${blur(`${u}b`, 2.4)}
    ${lg(`${u}hull`, HULL)}${lg(`${u}bot`, BOTTOM)}${lg(`${u}house`, HOUSE)}${lg(`${u}water`, WATER)}
    ${lg(`${u}spray`, SPRAY)}${lg(`${u}sprayd`, SPRAY_D)}${lg(`${u}conc`, CONC)}`;
  // Spray in the menu's language: a shaded body, lit billows up and left of it.
  const sprayG = u => `<g><path class="sp" fill="url(#${u}sprayd)"/><path class="sq" fill="url(#${u}spray)"/><path class="sq" fill="url(#${u}lit)"/></g>`;

  const DIRS = [];

  /* ================= Current ================= */

  // Ship launch is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif">none yet</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // The coaster in profile: a raked bow on the left, a cruiser stern under the house on the right.
  const A_HULL = 'M10 55L16 54L112 57L114 73Q113 84 104 86L24 86Q16 80 10 55Z';
  const A_BOT = 'M17 77L111 77Q110 84 104 86L24 86Q19 82 17 77Z';
  const A_HOUSE = 'M84 57L84 36L104 36L104 57Z';
  const A_BRIDGE = 'M81 36L81 31L107 31L107 36Z';
  const A_HATCH = 'M30 57L30 52L80 52L80 57Z';
  const A_WATER = 'M2 92Q64 86 126 92L126 104Q64 112 2 104Z';
  const A_P = { heel: -9, drop: 4, pivot: [62, 86], s: [6, 122, 93, 15, 8.5], flags: [[11, 54], [20, 40], [96, 24], [113, 56]] };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [2, 18, 124, 92],
    idea: 'The coaster in profile, green over a red-brown bottom, a white house aft and bunting from bow to mast to bridge, over a strip of canal water. The pointer cuts the rope: she drops and heels into the water, a sheet of spray climbs along her whole waterline and the pennants swing; rest lets her settle upright.',
    art(svg, u) {
      svg.innerHTML = `<defs>${defs(u)}</defs>
        <ellipse cx="64" cy="108" rx="60" ry="4" fill="oklch(0.05 0.01 240)" opacity="0.55" filter="url(#${u}b)"/>
        ${body(A_WATER, u, 'water')}
        <g class="hull">
          <path d="M20 54L20 38" stroke="oklch(0.92 0.01 90)" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M96 31L96 22" stroke="oklch(0.92 0.01 90)" stroke-width="1.8" stroke-linecap="round"/>
          <g class="bt"></g>
          ${body(A_HATCH, u, 'hull')}
          ${body(A_HOUSE, u, 'house')}
          ${body(A_BRIDGE, u, 'house')}
          <path d="M84 41L104 41" stroke="oklch(0.3 0.02 250)" stroke-width="2.4"/>
          ${body(A_HULL, u, 'hull')}
          <path d="${A_BOT}" fill="url(#${u}bot)"/>
          <path d="M17 76.5L111 76.5" stroke="oklch(0.18 0.01 250)" stroke-width="1.6"/>
        </g>
        ${sprayG(u)}`;
      return animate(svg, A_P);
    },
    // The emblem: the hull and house in white, the spray in white, the water grey.
    emblem: `${EMB_HEAD}<path d="${A_WATER}" fill="#5a5a5a"/><path d="M20 54L20 38" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="${A_HATCH}" fill="#fff"/><path d="${A_HOUSE}" fill="#fff"/><path d="${A_BRIDGE}" fill="#fff"/><path d="${A_HULL}" fill="#fff"/><path d="M84 41L104 41" stroke="#000" stroke-width="2.6"/><path d="${A_BOT}" fill="#9a9a9a"/><path d="${billows(6, 122, 93, 15, 8.5, 0.55, 0)}" fill="#fff"/></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The berth is the block: concrete with its ways on top, the canal water at its foot.
  const CY = 70, HX = 30, HY = 22, T = 16;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  const D_WATER = poly([[W[0] - 14, W[1] + T + 8], [down(W)[0], down(W)[1]], [down(S)[0], down(S)[1]], [down(S)[0] - 14, down(S)[1] + 8]]);
  // The hull lies along the block's long axis, tipping off its front-left edge.
  const hullPts = (k) => {
    const a = iso(-24, 6), b = iso(24, 6), off = 6 + 4 * k;
    return { a, b, off };
  };
  const D_HULL = (() => { const a = iso(-25, 9), b = iso(25, 9); return `M${f(a[0] - 4)} ${f(a[1] - 14)}L${f(b[0] + 2)} ${f(b[1] - 14)}L${f(b[0])} ${f(b[1] - 3)}L${f(a[0] + 3)} ${f(a[1] - 3)}Z`; })();
  const D_HOUSE = (() => { const b = iso(18, 9); return `M${f(b[0] - 3)} ${f(b[1] - 14)}L${f(b[0] - 3)} ${f(b[1] - 27)}L${f(b[0] + 6)} ${f(b[1] - 31.5)}L${f(b[0] + 6)} ${f(b[1] - 18.5)}Z`; })();
  const D_P = { heel: -7, drop: 5, pivot: [W[0] + 26, W[1] - 4], s: [W[0] - 10, S[0] + 2, W[1] + 18, 11, 7], flags: [[iso(-25, 9)[0] - 4, iso(-25, 9)[1] - 14], [iso(-18, 9)[0], iso(-18, 9)[1] - 30], [iso(19, 9)[0], iso(19, 9)[1] - 36], [iso(25, 9)[0] + 2, iso(25, 9)[1] - 14]] };
  void hullPts;
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [4, 14, 118, 104],
    idea: 'The berth is the block: lit concrete with two ways across its top, the canal at its foot. The coaster stands along it, green over red-brown with a white house. The pointer launches her: she drops and heels off the front edge, the spray climbs along her side and the bunting swings; rest sets her back.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      const way = (g) => { const a = iso(-HX, g), b = iso(HX, g); return `M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}`; };
      svg.innerHTML = `<defs>${defs(u)}${lg(`${u}sl`, [[0, 'oklch(0.5 0.012 80)'], [1, 'oklch(0.38 0.012 80)']])}${lg(`${u}sr`, [[0, 'oklch(0.4 0.012 80)'], [1, 'oklch(0.28 0.012 80)']])}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${D_WATER}" fill="url(#${u}water)"/><path d="${D_WATER}" fill="url(#${u}lit)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}sl)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}sr)"/>
        <path d="${top}" fill="url(#${u}conc)"/><path d="${top}" fill="url(#${u}lit)"/>
        <path d="${way(-8)}${way(4)}" stroke="oklch(0.36 0.02 60)" stroke-width="2.2" fill="none"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g class="hull">
          <g class="bt"></g>
          ${body(D_HOUSE, u, 'house')}
          ${body(D_HULL, u, 'hull')}
          <path d="M${f(iso(-25, 9)[0] + 2)} ${f(iso(-25, 9)[1] - 6.5)}L${f(iso(25, 9)[0] + 1)} ${f(iso(25, 9)[1] - 6.5)}L${f(iso(25, 9)[0])} ${f(iso(25, 9)[1] - 3)}L${f(iso(-25, 9)[0] + 3)} ${f(iso(-25, 9)[1] - 3)}Z" fill="url(#${u}bot)"/>
        </g>
        ${sprayG(u)}`;
      return animate(svg, D_P);
    },
    emblem: `${EMB_HEAD}<path d="${D_WATER}" fill="#3a3a3a"/><path d="${poly([W, S, down(S), down(W)])}" fill="#3a3a3a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#5a5a5a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/><path d="${D_HOUSE}" fill="#fff"/><path d="${D_HULL}" fill="#fff"/><path d="${billows(W[0] - 10, S[0] + 2, W[1] + 18, 11, 7, 0.5, 0)}" fill="#fff"/></svg>`,
  });

  // The menu tile: A's art with fixed ids, for index.html.
  window.TILE = () => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'art'); DIRS[1].art(s, 'shiplaunch-'); fitIcon(s, DIRS[1].box); s.setAttribute('aria-hidden', 'true'); return s.outerHTML; };

  /* ================= Gallery ================= */
  const NAME = 'Ship launch';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-shiplaunch';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `shiplaunch-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
