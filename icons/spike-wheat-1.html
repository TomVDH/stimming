<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Wheat storm 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Wheat storm 1</h1>
<p class="lede">Wheat storm, round 1. No pick yet; A goes on the menu until Tom picks. A: three ripe ears bend under a storm cloud while a bolt strikes beside them. D: a block of wheat field with ears on its top, the bolt striking it from the cloud above.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  const DIRS = [];

  // The toy's tokens: ripe gold ears, a slate storm cloud lit warm from below, a white bolt.
  const GOLD = [[0, 'oklch(0.94 0.11 92)'], [0.5, 'oklch(0.86 0.15 84)'], [1, 'oklch(0.68 0.15 66)']];
  const FIELD = [[0, 'oklch(0.78 0.14 76)'], [1, 'oklch(0.52 0.12 52)']];
  const STRAW = [[0, 'oklch(0.8 0.11 80)'], [1, 'oklch(0.5 0.1 60)']];
  const CLOUD = [[0, 'oklch(0.52 0.045 290)'], [0.55, 'oklch(0.34 0.045 285)'], [1, 'oklch(0.22 0.035 280)']];
  const WARM = 'oklch(0.78 0.13 58)';
  const VIOLET = 'oklch(0.78 0.13 295)';
  const SEED = 'oklch(0.7 0.15 66)';

  // An ear of wheat: a stalk from base b, a head from h0 to h1, scalloped by its spikelets.
  // lean: degrees the whole ear turns about its base. s: its scale.
  const ear = (b, h0, h1, w = 6.2) => {
    const ax = h1[0] - h0[0], ay = h1[1] - h0[1], L = Math.hypot(ax, ay), ux = ax / L, uy = ay / L, nx = -uy, ny = ux;
    const at = (e, off) => [h0[0] + ax * e + nx * off, h0[1] + ay * e + ny * off];
    const half = e => w * Math.sin(Math.PI * Math.sqrt(Math.min(1, e * 0.94 + 0.03)));
    // Seven spikelets a side, staggered: each one swells the edge.
    const bump = (e, side) => 0.8 + 0.2 * Math.abs(Math.sin(e * Math.PI * 7 + (side > 0 ? 0 : Math.PI / 2)));
    const left = [], right = [];
    for (let i = 0; i <= 48; i++) { const e = i / 48; left.push(at(e, -half(e) * bump(e, -1))); right.push(at(e, half(e) * bump(e, 1))); }
    const head = poly(left.concat(right.reverse()));
    // The stalk: a tapered strip, bowed a little toward the lean.
    const mid = [(b[0] + h0[0]) / 2 + nx * 3, (b[1] + h0[1]) / 2 + ny * 3];
    const sw = 2.5;
    const bx = h0[0] - b[0], by = h0[1] - b[1], bl = Math.hypot(bx, by), sx = -by / bl * sw, sy = bx / bl * sw;
    const stalk = `M${f(b[0] - sx)} ${f(b[1] - sy)}Q${f(mid[0] - sx * 0.8)} ${f(mid[1] - sy * 0.8)} ${f(h0[0] - sx * 0.55)} ${f(h0[1] - sy * 0.55)}L${f(h0[0] + sx * 0.55)} ${f(h0[1] + sy * 0.55)}Q${f(mid[0] + sx * 0.8)} ${f(mid[1] + sy * 0.8)} ${f(b[0] + sx)} ${f(b[1] + sy)}Z`;
    // The spikelets: bold flat scales, darker, in two staggered rows.
    let seeds = '';
    for (let i = 0; i < 7; i++) for (const side of [-1, 1]) {
      const e = 0.1 + (i + (side > 0 ? 0.5 : 0)) * 0.115;
      if (e > 0.9) continue;
      const c = at(e, side * half(e) * 0.42), r = half(e) * 0.5;
      const ang = Math.atan2(uy, ux) * 180 / Math.PI + side * 28;
      seeds += `<ellipse cx="${f(c[0])}" cy="${f(c[1])}" rx="${f(L * 0.075)}" ry="${f(r)}" transform="rotate(${f(ang)} ${f(c[0])} ${f(c[1])})"/>`;
    }
    // The awns: a few bold tapered spines off the upper spikelets.
    let awns = '';
    for (const [e, side, len] of [[0.55, -1, 0.5], [0.7, 1, 0.55], [0.82, -1, 0.6], [0.95, 0, 0.7], [0.88, 1, 0.5]]) {
      const p = at(e, side * half(e) * 0.8), a = Math.atan2(uy, ux) + side * 0.32;
      const tip = [p[0] + Math.cos(a) * L * len, p[1] + Math.sin(a) * L * len], q1 = [p[0] - Math.sin(a) * 1.3, p[1] + Math.cos(a) * 1.3], q2 = [p[0] + Math.sin(a) * 1.3, p[1] - Math.cos(a) * 1.3];
      awns += poly([q1, tip, q2]);
    }
    return { head, stalk, seeds, awns };
  };
  const earArt = (u, E, cls) => `<g class="${cls}">
        <path d="${E.awns}" fill="oklch(0.86 0.09 82)" opacity="0.85"/>
        ${body(E.stalk, u, 'straw')}
        ${body(E.head, u, 'gold')}
        <g fill="${SEED}" opacity="0.38">${E.seeds}</g></g>`;

  // The storm cloud: a flat base, billows on top, warm light along its underside.
  const cloudPath = (x, y, s) => {
    const P = (a, b) => `${f(x + a * s)} ${f(y + b * s)}`;
    return `M${P(0, 0)}C${P(-8, 0)} ${P(-10, -12)} ${P(0, -14)}C${P(0, -24)} ${P(12, -29)} ${P(20, -23)}C${P(24, -35)} ${P(44, -38)} ${P(52, -27)}C${P(60, -34)} ${P(76, -31)} ${P(76, -19)}C${P(86, -19)} ${P(90, -8)} ${P(84, 0)}Z`;
  };
  // The bolt: a bold zigzag, from the cloud base to the tip.
  const boltPath = (x, y, s) => poly([[0, 0], [12, 0], [4, 18], [13, 18], [-1, 40], [6, 40], [-12, 70], [-7, 46], [-15, 46], [-5, 24], [-12, 24]].map(([a, b]) => [x + a * s, y + b * s]));

  // The shared motion: the pointer brings a gust and a strike.
  // The ears lean away and flutter, the bolt flares twice, the cloud's base glows.
  const run = (svg, ears) => {
    const st = { live: false, k: 0, last: 0, t0: 0 };
    const q = c => svg.querySelector(c);
    const bolt = q('.bolt'), halo = q('.halo'), glow = q('.base'), hit = q('.hit');
    const paint = time => {
      const k = st.k, a = time - st.t0;
      // Two strokes: the leader's stroke, then a restrike a beat later.
      const fl = st.live ? Math.max(Math.exp(-a * 9), 0.8 * Math.exp(-Math.max(0, a - 0.16) * 12) * (a > 0.16 ? 1 : 0)) : 0;
      bolt.setAttribute('opacity', f(0.88 + 0.12 * k));
      halo.setAttribute('opacity', f(0.25 + 0.35 * k + 0.4 * fl));
      glow.setAttribute('opacity', f(0.5 + 0.3 * k + 0.2 * fl));
      hit.setAttribute('opacity', f(0.45 + 0.3 * k + 0.25 * fl));
      ears.forEach(([cls, bx, by, d], i) => {
        const sway = Math.sin(time * 5.2 + i * 1.3) * 2.2 + Math.sin(time * 8.7 + i) * 0.8;
        q(`.${cls}`).setAttribute('transform', `rotate(${f(-(d + sway) * k)} ${bx} ${by})`);
      });
    };
    const step = time => {
      const dt = Math.min(0.1, time - (st.last || time));
      st.last = time;
      st.k = st.live ? Math.min(1, st.k + dt * 3) : Math.max(0, st.k - dt * 1.4);
      paint(time);
      if (!st.live && st.k <= 0 && st.last > 0) { st.last = 0; loop.stop(); }
    };
    const loop = clock(step);
    return {
      enter() { st.live = true; st.t0 = gsap.ticker.time; loop.start(); },
      move() {},
      leave() { st.live = false; loop.start(); },
    };
  };
  const boltArt = (u, d, hx, hy) => `
        <path class="halo" d="${d}" fill="${VIOLET}" opacity="0.25" filter="url(#${u}g)" stroke="${VIOLET}" stroke-width="6" stroke-linejoin="round"/>
        <path class="bolt" d="${d}" fill="#fff" opacity="0.88"/>
        <path d="${d}" fill="url(#${u}lit)"/>
        <ellipse class="hit" cx="${hx}" cy="${hy}" rx="14" ry="5" fill="#fff" opacity="0.45" filter="url(#${u}g)"/>`;
  const cloudArt = (u, d, base) => `
        ${body(d, u, 'cloud')}
        <path class="base" d="${base}" fill="none" stroke="${WARM}" stroke-width="6" stroke-linecap="round" opacity="0.5" filter="url(#${u}g)"/>`;
  const defs = u => `${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 3.4)}${blur(`${u}c`, 1.3)}${lg(`${u}gold`, GOLD, 'x1="0" y1="0" x2="0.4" y2="1"')}${lg(`${u}straw`, STRAW)}${lg(`${u}cloud`, CLOUD)}${lg(`${u}field`, FIELD)}`;

  /* ================= Current ================= */

  // Wheat storm is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // Three ears lean left in the wind; the cloud hangs over them; the bolt lands to their right.
  const A_EARS = [ear([27, 110], [19, 72], [8, 38], 7.6), ear([44, 111], [39, 68], [31, 31], 8.2), ear([60, 110], [57, 76], [51, 44], 7.2)];
  const A_CLOUD = cloudPath(44, 40, 0.93), A_BASE = 'M46 40.5Q80 43 120 40.5';
  const A_BOLT = boltPath(94, 38, 0.92);
  // The patch of field the ears stand in and the bolt lands on.
  const A_FIELD = 'M8 110A56 11 0 1 0 120 110A56 11 0 1 0 8 110Z';
  const A_ROWS = [0, 1, 2].map(i => `M${18 + i * 6} ${106 + i * 4}Q64 ${100 + i * 4} ${110 - i * 6} ${106 + i * 4}`).join('');
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [2, 2, 120, 120],
    idea: 'Three ripe ears of wheat, bold gold heads scalloped by their spikelets with a few awns, lean left in the wind. Over them hangs a slate storm cloud, lit warm along its flat base by the low sun. A white bolt with a violet glow drops from the cloud and lands beside the ears. The pointer brings a gust and a strike: the ears lean away and flutter, the bolt flares twice, the cloud base glows.',
    art(svg, u) {
      svg.innerHTML = `<defs>${defs(u)}</defs>
        <ellipse cx="64" cy="121" rx="54" ry="4" fill="oklch(0.05 0.01 240)" opacity="0.6" filter="url(#${u}b)"/>
        ${body(A_FIELD, u, 'field')}
        <path d="${A_ROWS}" fill="none" stroke="oklch(0.55 0.12 55)" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
        ${boltArt(u, A_BOLT, 80, 104)}
        ${cloudArt(u, A_CLOUD, A_BASE)}
        ${earArt(u, A_EARS[0], 'e0')}${earArt(u, A_EARS[2], 'e2')}${earArt(u, A_EARS[1], 'e1')}`;
      return run(svg, [['e0', 27, 110, 9], ['e1', 44, 111, 7], ['e2', 60, 110, 11]]);
    },
    // The emblem: the cloud grey, the bolt and the ears white.
    emblem: `${EMB_HEAD}<path d="${A_FIELD}" fill="#5a5a5a"/><path d="${A_CLOUD}" fill="#8c8c8c"/><path d="${A_BOLT}" fill="#fff"/>${A_EARS.map(E => `<path d="${E.stalk}" fill="#fff"/><path d="${E.head}" fill="#fff"/><path d="${E.awns}" fill="#fff"/>`).join('')}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A block of wheat field; ears stand on its top; the bolt strikes it from the cloud above.
  const CY = 88, HX = 30, HY = 30, T = 12;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // Furrows: bold darker rows across the top.
  const rows = [-18, -6, 6, 18].map(g => poly([iso(-HX + 2, g - 2.2), iso(HX - 2, g - 2.2), iso(HX - 2, g + 2.2), iso(-HX + 2, g + 2.2)])).join('');
  // Ears on the top: front ones bigger, all leaning left.
  const D_EARS = [[-14, -10, 1.25], [8, -16, 1.2], [-4, 8, 1.3], [18, 8, 1.3], [-22, 20, 1.35]].map(([gx, gy, s]) => {
    const b = iso(gx, gy);
    return { b, E: ear(b, [b[0] - 3 * s, b[1] - 13 * s], [b[0] - 8 * s, b[1] - 31 * s], 4.2 * s) };
  });
  const D_CLOUD = cloudPath(26, 32, 0.98), D_BASE = 'M28 32.5Q66 35 108 32.5';
  const D_BOLT = boltPath(82, 30, 0.8);
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [12, 0, 104, 112],
    idea: 'A block of wheat field at 30 degrees: a gold top with darker rows, a mid brown left face, a dark right face, a rim on the top edges. Six ears stand on the top, leaning left. A slate storm cloud hangs over it, warm along its base, and a white bolt strikes the block. The pointer brings a gust and a strike: the ears lean and flutter, the bolt flares twice.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${defs(u)}
          ${lg(`${u}top`, [[0, 'oklch(0.82 0.13 78)'], [1, 'oklch(0.64 0.13 60)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.46 0.08 50)'], [1, 'oklch(0.34 0.06 45)']])}
          ${lg(`${u}R`, [[0, 'oklch(0.3 0.05 45)'], [1, 'oklch(0.21 0.04 40)']])}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${rows}" fill="oklch(0.6 0.12 55)" opacity="0.55"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.5" stroke-width="2" fill="none" stroke-linejoin="round"/>
        ${boltArt(u, D_BOLT, 72, 87)}
        ${D_EARS.map(({ E }, i) => earArt(u, E, `e${i}`)).join('')}
        ${cloudArt(u, D_CLOUD, D_BASE)}`;
      return run(svg, D_EARS.map(({ b }, i) => [`e${i}`, f(b[0]), f(b[1]), 8 + (i % 3) * 2]));
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/><path d="${D_CLOUD}" fill="#8c8c8c"/><path d="${D_BOLT}" fill="#fff"/>${D_EARS.map(({ E }) => `<path d="${E.stalk}" fill="#fff"/><path d="${E.head}" fill="#fff"/>`).join('')}</svg>`,
  });

  // ?menu prints A's markup for the menu tile, with the toy's id on its defs.
  window.MENU_A = () => {
    const D = DIRS[1], svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' });
    D.art(svg, 'wheat-');
    const side = Math.max(D.box[2], D.box[3]), size = side * 128 / 110, cx = D.box[0] + D.box[2] / 2, cy = D.box[1] + D.box[3] / 2;
    return { viewBox: `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`, inner: svg.innerHTML };
  };

  /* ================= Gallery ================= */
  const NAME = 'Wheat storm';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-wheat';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `wheat-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
