<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Soap cutting 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Soap cutting 1</h1>
<p class="lede">Soap cutting, round 1. Current stays on the menu until Tom picks. A: the toy's Layers bar, a knife scoring a groove along its top and a thick purple curl rolling up ahead of the tip. D: the bar is the block, scored into cubes that pop loose in a wave from the pointer.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The menu tile's ids take the tile prefix, so three copies can live.
  const ids = (m, u) => m.replace(/id="([^"]+)"/g, `id="${u}$1"`).replace(/url\(#([^)]+)\)/g, `url(#${u}$1)`).replace(/href="#([^"]+)"/g, `href="#${u}$1"`);

  const DIRS = [];

  // The toy's Layers soap: a purple top, a cream middle, a pink foot.
  const PUR_TOP = [[0, 'oklch(0.88 0.09 310)'], [1, 'oklch(0.76 0.15 306)']];
  const PUR = [[0, 'oklch(0.6 0.22 302)'], [1, 'oklch(0.5 0.22 299)']];
  const PUR_END = 'oklch(0.44 0.2 298)';
  const CREAM = 'oklch(0.95 0.035 92)', CREAM_END = 'oklch(0.8 0.05 80)';
  const PINK = 'oklch(0.72 0.19 12)', PINK_END = 'oklch(0.56 0.19 10)';
  // A fresh cut is pale and matte; a deep groove is in shade.
  const CUT = 'oklch(0.82 0.11 310)', GROOVE = 'oklch(0.36 0.17 298)';
  const STEEL = [[0, 'oklch(0.97 0.006 260)'], [0.55, 'oklch(0.82 0.012 260)'], [1, 'oklch(0.62 0.02 260)']];
  const HANDLE = [[0, 'oklch(0.42 0.03 260)'], [1, 'oklch(0.22 0.02 260)']];
  const { sin, cos, PI } = Math;
  // An emblem takes its icon's frame, so its long side fills 110 of 128.
  const embHead = box => {
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    return EMB_HEAD.replace('0 0 128 128', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const BOX_A = [19, 21, 99, 83], BOX_D = [21, 24, 100, 84];
  // A polygon with round corners: a quadratic turn of radius r at each corner.
  const roundPoly = (pts, r) => {
    const n = pts.length;
    let d = '';
    for (let i = 0; i < n; i++) {
      const p = pts[i], a = pts[(i + n - 1) % n], b = pts[(i + 1) % n];
      const la = Math.hypot(a[0] - p[0], a[1] - p[1]), lb = Math.hypot(b[0] - p[0], b[1] - p[1]);
      const ra = Math.min(r, la / 2), rb = Math.min(r, lb / 2);
      const s = [p[0] + ((a[0] - p[0]) * ra) / la, p[1] + ((a[1] - p[1]) * ra) / la];
      const e = [p[0] + ((b[0] - p[0]) * rb) / lb, p[1] + ((b[1] - p[1]) * rb) / lb];
      d += `${i ? 'L' : 'M'}${f(s[0])} ${f(s[1])}Q${f(p[0])} ${f(p[1])} ${f(e[0])} ${f(e[1])}`;
    }
    return d + 'Z';
  };


  /* ================= Current ================= */

  // The menu icon today, copied with its hover loop.
  const CUR = `<clipPath id="soap-skin"><rect x="12" y="12" width="104" height="104" rx="18"/></clipPath>
              <rect x="18" y="18" width="104" height="104" rx="18" fill="oklch(0.46 0.16 345)"/>
              <g clip-path="url(#soap-skin)">
                <rect x="12" y="12" width="104" height="104" fill="oklch(0.4 0.14 330)"/>
                <g class="soap-cube" data-k="0"><rect x="13.5" y="13.5" width="23" height="23" fill="oklch(0.74 0.18 300)"/><rect x="13.5" y="13.5" width="23" height="23" fill="url(#lit)"/></g><g class="soap-cube" data-k="1"><rect x="39.5" y="13.5" width="23" height="23" fill="oklch(0.74 0.18 315)"/><rect x="39.5" y="13.5" width="23" height="23" fill="url(#lit)"/></g><g class="soap-cube" data-k="2"><rect x="65.5" y="13.5" width="23" height="23" fill="oklch(0.74 0.18 330)"/><rect x="65.5" y="13.5" width="23" height="23" fill="url(#lit)"/></g><g class="soap-cube" data-k="3"><rect x="91.5" y="13.5" width="23" height="23" fill="oklch(0.74 0.18 345)"/><rect x="91.5" y="13.5" width="23" height="23" fill="url(#lit)"/></g><g class="soap-cube" data-k="1"><rect x="13.5" y="39.5" width="23" height="23" fill="oklch(0.74 0.18 315)"/><rect x="13.5" y="39.5" width="23" height="23" fill="url(#lit)"/></g><g class="soap-cube" data-k="2"><rect x="39.5" y="39.5" width="23" height="23" fill="oklch(0.74 0.18 330)"/><rect x="39.5" y="39.5" width="23" height="23" fill="url(#lit)"/></g><g class="soap-cube" data-k="3"><rect x="65.5" y="39.5" width="23" height="23" fill="oklch(0.74 0.18 345)"/><rect x="65.5" y="39.5" width="23" height="23" fill="url(#lit)"/></g><g class="soap-cube" data-k="4"><rect x="91.5" y="39.5" width="23" height="23" fill="oklch(0.74 0.18 0)"/><rect x="91.5" y="39.5" width="23" height="23" fill="url(#lit)"/></g><g class="soap-cube" data-k="2"><rect x="13.5" y="65.5" width="23" height="23" fill="oklch(0.74 0.18 330)"/><rect x="13.5" y="65.5" width="23" height="23" fill="url(#lit)"/></g><g class="soap-cube" data-k="3"><rect x="39.5" y="65.5" width="23" height="23" fill="oklch(0.74 0.18 345)"/><rect x="39.5" y="65.5" width="23" height="23" fill="url(#lit)"/></g><g class="soap-cube" data-k="4"><rect x="65.5" y="65.5" width="23" height="23" fill="oklch(0.74 0.18 0)"/><rect x="65.5" y="65.5" width="23" height="23" fill="url(#lit)"/></g><g class="soap-cube" data-k="5"><rect x="91.5" y="65.5" width="23" height="23" fill="oklch(0.74 0.18 15)"/><rect x="91.5" y="65.5" width="23" height="23" fill="url(#lit)"/></g><g class="soap-cube" data-k="3"><rect x="13.5" y="91.5" width="23" height="23" fill="oklch(0.74 0.18 345)"/><rect x="13.5" y="91.5" width="23" height="23" fill="url(#lit)"/></g><g class="soap-cube" data-k="4"><rect x="39.5" y="91.5" width="23" height="23" fill="oklch(0.74 0.18 0)"/><rect x="39.5" y="91.5" width="23" height="23" fill="url(#lit)"/></g><g class="soap-cube" data-k="5"><rect x="65.5" y="91.5" width="23" height="23" fill="oklch(0.74 0.18 15)"/><rect x="65.5" y="91.5" width="23" height="23" fill="url(#lit)"/></g><g class="soap-cube" data-k="6"><rect x="91.5" y="91.5" width="23" height="23" fill="oklch(0.74 0.18 30)"/><rect x="91.5" y="91.5" width="23" height="23" fill="url(#lit)"/></g>
              </g>
              <g id="soap-blade" opacity="0"><path d="M0 60.5H46L52 64L46 67.5H0Z" fill="oklch(0.86 0.01 260)"/><path d="M0 60.5H46" stroke="oklch(0.98 0 0)" stroke-width="1.2"/></g>`;
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    box: [12, 12, 110, 110],
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}</defs>${ids(CUR, u)}`;
      const cubes = [...svg.querySelectorAll('.soap-cube')], blade = svg.getElementById(`${u}soap-blade`);
      let tl = null;
      const rest = () => { gsap.to(cubes, { scale: 1, y: 0, duration: 0.3, overwrite: true }); gsap.set(blade, { opacity: 0, x: -56 }); };
      return {
        enter() {
          tl?.kill();
          tl = gsap.timeline({ repeat: -1, repeatDelay: 0.4 })
            .fromTo(blade, { x: -56, opacity: 1 }, { x: 134, duration: 0.5, ease: 'power2.in' })
            .to(cubes, { scale: 1.14, y: -4, transformOrigin: '50% 50%', duration: 0.16, ease: 'power2.out', stagger: i => +cubes[i].dataset.k * 0.06 }, 0.22)
            .to(cubes, { scale: 1, y: 0, duration: 0.45, ease: 'back.out(3)', stagger: i => +cubes[i].dataset.k * 0.06 }, 0.38)
            .set(blade, { opacity: 0 });
        },
        move() {},
        leave() { tl?.kill(); tl = null; rest(); },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // The bar in a front three-quarter view: x runs along it, y up, z back.
  const AL = 78, AH = 34, AD = 36, ZX = 0.55, ZY = 0.62, AOX = 20, AOY = 104;
  const P = (x, y, z) => [AOX + x + z * ZX, AOY - y - z * ZY];
  // The layers from the foot: pink, cream, then the thick purple top.
  const BANDS = [[0, 10, PINK, PINK_END], [10, 20, CREAM, CREAM_END]];
  const SIL = [P(0, 0, 0), P(AL, 0, 0), P(AL, 0, AD), P(AL, AH, AD), P(0, AH, AD), P(0, AH, 0)];
  const TOPF = [P(0, AH, 0), P(AL, AH, 0), P(AL, AH, AD), P(0, AH, AD)];
  const FRONT = [P(0, 0, 0), P(AL, 0, 0), P(AL, AH, 0), P(0, AH, 0)];
  const END = [P(AL, 0, 0), P(AL, 0, AD), P(AL, AH, AD), P(AL, AH, 0)];
  // The knife scores a groove along the bar, a little back from the front.
  const ZG = 13, GW = 11, GD = 7, XS = -6, REST_A = 46;
  const Z0 = ZG - GW / 2, Z1 = ZG + GW / 2;
  // The curl: a spiral that grows with the groove's length.
  const curlPts = (bx, z, inset = 0) => {
    const len = Math.max(0, bx - XS), R = 8 + len * 0.12, rin = 3.2 + len * 0.014, turns = 0.75 + len * 0.009;
    // The root sits in the groove at the knife's tip.
    const A0 = PI * 1.15, cx = bx + 1 - R * cos(A0), cy = AH - 2 - R * sin(A0);
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const t = i / 40, r = lerp(R, rin, t) - inset, a = A0 - t * 2 * PI * turns;
      pts.push(P(cx + r * cos(a), cy + r * sin(a), z));
    }
    return pts;
  };
  const line = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L');
  // The knife in its own frame: the tip at 0 0, the blade back along -u, the edge on +v.
  const KNIFE_BLADE = 'M0 0Q3 -10 2 -40L-11 -42Q-14 -20 -6 -3Q-3 2 0 0Z';
  const KNIFE_HANDLE = 'M-1 -40L-11 -42Q-13 -48 -12 -54Q-6 -58 -1 -55Q1 -48 -1 -40Z';
  const knifeAt = bx => {
    const tip = P(bx + 1.5, AH - GD + 1, ZG);
    return `translate(${f(tip[0])} ${f(tip[1])}) rotate(-36)`;
  };
  const aDefs = u => `${light(u)}${blur(`${u}h`, 3.2)}
    ${lg(`${u}top`, PUR_TOP, 'x1="0.2" y1="0" x2="0.4" y2="1"')}
    ${lg(`${u}pur`, PUR)}
    ${lg(`${u}steel`, STEEL, 'x1="0" y1="0" x2="1" y2="0.3"')}
    ${lg(`${u}hdl`, HANDLE, 'x1="0" y1="0" x2="1" y2="0"')}
    <clipPath id="${u}sil"><path d="${roundPoly(SIL, 13)}"/></clipPath>
    <clipPath id="${u}above"><rect x="-40" y="-40" width="220" height="${f(P(0, AH, ZG)[1] + 41)}"/></clipPath>`;
  const bandFront = ([y0, y1, c]) => `<path d="${poly([P(0, y0, 0), P(AL, y0, 0), P(AL, y1, 0), P(0, y1, 0)])}" style="fill: ${c}"/>`;
  const bandEnd = ([y0, y1, , c]) => `<path d="${poly([P(AL, y0, 0), P(AL, y0, AD), P(AL, y1, AD), P(AL, y1, 0)])}" style="fill: ${c}"/>`;
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: BOX_A,
    idea: 'The toy\'s Layers bar, plump and round at the corners: a purple top over cream and pink. A knife scores a groove along the top and a thick purple curl rolls up ahead of its tip, the fresh cut pale. The pointer drives the knife along the bar; the groove follows and the curl winds bigger the farther it goes. Leave, and the knife slides back.',
    art(svg, u) {
      const sil = roundPoly(SIL, 13);
      svg.innerHTML = `<defs>${aDefs(u)}</defs>
        <ellipse class="halo" cx="${f(P(AL / 2, 0, AD / 2)[0])}" cy="${f(P(AL / 2, 0, AD / 2)[1] + 2)}" rx="56" ry="13" fill="oklch(0.05 0.01 290)" opacity="0.55" filter="url(#${u}h)"/>
        <g clip-path="url(#${u}sil)">
          <path d="${poly(FRONT)}" fill="url(#${u}pur)"/>
          ${BANDS.map(bandFront).join('')}
          <path d="${poly(END)}" style="fill: ${PUR_END}"/>
          ${BANDS.map(bandEnd).join('')}
          <path d="${poly(TOPF)}" fill="url(#${u}top)"/>
          <path class="groove" style="fill: ${GROOVE}"/>
          <path class="wall" style="fill: ${CUT}"/>
          <path d="${sil}" fill="url(#${u}lit)"/>
        </g>
        <path d="${sil}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
        <g clip-path="url(#${u}above)"><g class="knife">
          <path d="${KNIFE_HANDLE}" fill="url(#${u}hdl)"/>
          <path d="${KNIFE_BLADE}" fill="url(#${u}steel)"/>
          <path d="${KNIFE_BLADE}" fill="none" stroke="url(#${u}rim)" stroke-width="1.6" stroke-linejoin="round"/>
        </g></g>
        <g class="curl" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>`;
      const groove = svg.querySelector('.groove'), wall = svg.querySelector('.wall'), knife = svg.querySelector('.knife'), curlG = svg.querySelector('.curl');
      // The curl: its back edge in shade, its front edge in skin, the fresh cut inside.
      const back = el('path', { style: 'stroke: oklch(0.4 0.19 298)', 'stroke-width': 6.4 }, curlG);
      const front = el('path', { style: 'stroke: oklch(0.66 0.2 304)', 'stroke-width': 6.4 }, curlG);
      const edge = el('path', { style: `stroke: ${CUT}`, 'stroke-width': 2.6 }, curlG);
      const st = { bx: REST_A };
      const draw = () => {
        const bx = st.bx;
        groove.setAttribute('d', roundPoly([P(XS, AH, Z0), P(bx, AH, Z0), P(bx, AH, Z1), P(XS, AH, Z1)], 3));
        wall.setAttribute('d', poly([P(XS + 2, AH, Z1), P(bx, AH, Z1), P(bx, AH - GW * ZY * 0.5, Z1), P(XS + 2, AH - GW * ZY * 0.5, Z1)]));
        knife.setAttribute('transform', knifeAt(bx));
        back.setAttribute('d', line(curlPts(bx, ZG + 3)));
        front.setAttribute('d', line(curlPts(bx, ZG - 2)));
        edge.setAttribute('d', line(curlPts(bx, ZG - 2, 1.5)));
      };
      draw();
      const aim = p => p && gsap.to(st, { bx: clamp(p[0] - AOX - 4, 26, 68), duration: 0.5, ease: 'power3.out', overwrite: true, onUpdate: draw });
      return {
        enter: p => aim(p || [AOX + 70, 60]),
        move: aim,
        leave: () => gsap.to(st, { bx: REST_A, duration: 0.9, ease: 'power2.inOut', overwrite: true, onUpdate: draw }),
      };
    },
    emblem: (() => {
      const sil = roundPoly(SIL, 13);
      const bx = REST_A;
      const g = roundPoly([P(XS, AH, Z0), P(bx, AH, Z0), P(bx, AH, Z1), P(XS, AH, Z1)], 3);
      const grey = (pts, c) => `<path d="${poly(pts)}" fill="${c}"/>`;
      const band = ([y0, y1], c, e) => grey([P(0, y0, 0), P(AL, y0, 0), P(AL, y1, 0), P(0, y1, 0)], c) + grey([P(AL, y0, 0), P(AL, y0, AD), P(AL, y1, AD), P(AL, y1, 0)], e);
      const k = knifeAt(bx);
      return `${embHead(BOX_A)}<defs><clipPath id="s"><path d="${sil}"/></clipPath><clipPath id="ab"><rect x="-40" y="-40" width="220" height="${f(P(0, AH, ZG)[1] + 41)}"/></clipPath></defs>
        <g clip-path="url(#s)">${grey(FRONT, '#c4c4c4')}${grey(END, '#8a8a8a')}${band([0, 10], '#9a9a9a', '#6a6a6a')}${band([10, 20], '#f2f2f2', '#b0b0b0')}${grey(TOPF, '#e2e2e2')}<path d="${g}" fill="#444"/></g>
        <g clip-path="url(#ab)"><path d="${KNIFE_HANDLE}" fill="#7a7a7a" transform="${k}"/><path d="${KNIFE_BLADE}" fill="#fff" transform="${k}"/></g>
        <g fill="none" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"><path d="${line(curlPts(bx, ZG + 3))}" stroke="#8a8a8a"/><path d="${line(curlPts(bx, ZG - 2))}" stroke="#fff"/></g></svg>`;
    })(),
  });

  /* ================= D: Isometric block ================= */

  // The bar is the block: four by three cubes scored on a pink foot.
  const NX = 4, NY = 3, S = 16.5, CYD = 50, GAP = 0.05;
  const ZB = 0.55, ZC = 1.0, ZT = 1.55;
  const iso = (x, y, z) => [64 + (x - y) * 0.866 * S, CYD + (x + y) * 0.5 * S - z * S];
  const quad = (a, b, c, d) => poly([a, b, c, d]);
  const CUBES = [];
  for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++) CUBES.push({ i, j, z: 0, v: 0, kick: 0 });
  // Near cubes draw last.
  CUBES.sort((a, b) => a.i + a.j - (b.i + b.j));
  // One cube's faces at lift h: top, then the left (y+) and right (x+) faces in two bands.
  const cubeFaces = (i, j, h) => {
    const x0 = i ? i + GAP : 0, x1 = i < NX - 1 ? i + 1 - GAP : NX, y0 = j ? j + GAP : 0, y1 = j < NY - 1 ? j + 1 - GAP : NY;
    const t = ZT + h, m = ZC + h, b = ZB + h;
    return {
      top: quad(iso(x0, y0, t), iso(x1, y0, t), iso(x1, y1, t), iso(x0, y1, t)),
      lp: quad(iso(x0, y1, t), iso(x1, y1, t), iso(x1, y1, m), iso(x0, y1, m)),
      lc: quad(iso(x0, y1, m), iso(x1, y1, m), iso(x1, y1, b), iso(x0, y1, b)),
      rp: quad(iso(x1, y1, t), iso(x1, y0, t), iso(x1, y0, m), iso(x1, y1, m)),
      rc: quad(iso(x1, y1, m), iso(x1, y0, m), iso(x1, y0, b), iso(x1, y1, b)),
    };
  };
  const BASE_TOP = quad(iso(0, 0, ZB), iso(NX, 0, ZB), iso(NX, NY, ZB), iso(0, NY, ZB));
  const BASE_L = quad(iso(0, NY, ZB), iso(NX, NY, ZB), iso(NX, NY, 0), iso(0, NY, 0));
  const BASE_R = quad(iso(NX, NY, ZB), iso(NX, 0, ZB), iso(NX, 0, 0), iso(NX, NY, 0));
  const FOOT = poly([iso(0, NY, 0), iso(NX, NY, 0), iso(NX, 0, 0), iso(NX, 0, ZT), iso(0, 0, ZT), iso(0, NY, ZT)]);
  const dDefs = u => `${light(u)}${blur(`${u}h`, 3)}
    ${lg(`${u}ctop`, [[0, 'oklch(0.82 0.13 308)'], [1, 'oklch(0.68 0.19 303)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}`;
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: BOX_D,
    idea: 'The Layers bar is the block, scored into four by three cubes: purple tops over a cream band, on a pink foot. Point at it and the cubes pop loose in a wave from the pointer, those under it standing highest, their cream sides and the pink floor showing; leave and they sink back into the bar.',
    art(svg, u) {
      svg.innerHTML = `<defs>${dDefs(u)}</defs>
        <path class="halo" d="${FOOT}" fill="oklch(0.05 0.01 290)" opacity="0.5" filter="url(#${u}h)" transform="translate(0 5)"/>
        <path d="${BASE_TOP}" fill="oklch(0.44 0.15 8)"/>
        <path d="${BASE_L}" style="fill: ${PINK}"/>
        <path d="${BASE_R}" style="fill: ${PINK_END}"/>
        <g class="cubes"></g>`;
      const G = svg.querySelector('.cubes');
      const parts = CUBES.map(() => {
        const g = el('g', {}, G);
        return {
          lp: el('path', { style: 'fill: oklch(0.6 0.21 303)' }, g), lc: el('path', { style: `fill: ${CREAM}` }, g),
          rp: el('path', { style: `fill: ${PUR_END}` }, g), rc: el('path', { style: `fill: ${CREAM_END}` }, g),
          top: el('path', { fill: `url(#${u}ctop)` }, g), lit: el('path', { fill: `url(#${u}lit)` }, g),
          rim: el('path', { fill: 'none', stroke: `url(#${u}rim)`, 'stroke-width': 2, 'stroke-linejoin': 'round' }, g),
        };
      });
      const draw = () => CUBES.forEach((c, n) => {
        const F = cubeFaces(c.i, c.j, c.z), p = parts[n];
        p.lp.setAttribute('d', F.lp); p.lc.setAttribute('d', F.lc); p.rp.setAttribute('d', F.rp); p.rc.setAttribute('d', F.rc);
        p.top.setAttribute('d', F.top); p.lit.setAttribute('d', F.top); p.rim.setAttribute('d', F.top);
      });
      // The pointer in grid units on the cube tops.
      const st = { live: false, px: 2, py: 1.5, t: 0 };
      const toGrid = p => {
        const a = (p[0] - 64) / (0.866 * S), b = (p[1] - CYD + ZT * S) / (0.5 * S);
        return [(a + b) / 2, (b - a) / 2];
      };
      const loop = clock(time => {
        const dt = Math.min(0.05, time - (st.t || time));
        st.t = time;
        let rest = !st.live;
        for (const c of CUBES) {
          const d = Math.hypot(c.i + 0.5 - st.px, c.j + 0.5 - st.py);
          const goal = st.live ? 0.16 + 0.5 * Math.exp(-(d * d) / 1.1) : 0;
          if (c.kick && time >= c.kick) { c.v += 3.6; c.kick = 0; }
          c.v += ((goal - c.z) * 120 - c.v * 11) * dt;
          c.z += c.v * dt;
          if (c.kick || Math.abs(c.v) > 0.01 || Math.abs(goal - c.z) > 0.004) rest = false;
        }
        draw();
        if (rest) { CUBES.forEach(c => { c.z = 0; c.v = 0; }); draw(); loop.stop(); }
      });
      draw();
      return {
        enter(p) {
          if (p) [st.px, st.py] = toGrid(p);
          st.live = true;
          const now = gsap.ticker.time;
          // The pop runs out from the pointer, cube by cube.
          for (const c of CUBES) c.kick = now + 0.02 + Math.hypot(c.i + 0.5 - st.px, c.j + 0.5 - st.py) * 0.08;
          loop.start();
        },
        move(p) { if (p) [st.px, st.py] = toGrid(p); },
        leave() { st.live = false; CUBES.forEach(c => { c.kick = 0; }); loop.start(); },
      };
    },
    emblem: (() => {
      const cubes = CUBES.map(c => { const F = cubeFaces(c.i, c.j, 0); return `<path d="${F.lp}" fill="#b4b4b4"/><path d="${F.lc}" fill="#e0e0e0"/><path d="${F.rp}" fill="#6e6e6e"/><path d="${F.rc}" fill="#9a9a9a"/><path d="${F.top}" fill="#fff"/>`; }).join('');
      return `${embHead(BOX_D)}<path d="${BASE_TOP}" fill="#222"/><path d="${BASE_L}" fill="#8c8c8c"/><path d="${BASE_R}" fill="#5a5a5a"/>${cubes}</svg>`;
    })(),
  });

  /* ================= Gallery ================= */
  const NAME = "Soap cutting";
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-soap';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `soap-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      // A menu tile with no data-box fits its drawn bounds, as the menu does.
      const bb = D.box === "bbox" && svg.getBBox();
      fitIcon(svg, bb ? [bb.x, bb.y, bb.width, bb.height] : D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
