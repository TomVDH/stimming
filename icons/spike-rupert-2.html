<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Rupert's drop 2</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Rupert's drop 2</h1>
<p class="lede">Rupert's drop, round 2: one clear glass drop with the true shape of a real drop, its trapped stress lit by the toy's polariser as fringes that follow the form. A: free on the ground. D: on a block of the toy's black acrylic that mirrors it.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };
  const { sin, cos, PI, exp, sqrt, hypot, atan2 } = Math;
  // A fixed hash: the same chips and frost on every load.
  const hash = i => { const x = sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  // The toy's tokens: dark glass, the polariser's fringe colours, frost, heat.
  const GLASS = [[0, 'oklch(0.4 0.05 250)'], [0.55, 'oklch(0.22 0.04 265)'], [1, 'oklch(0.13 0.03 275)']];
  const EDGE = 'oklch(0.12 0.03 275)';
  // The fringe order from the skin in, as in the toy.
  const FRINGE = ['oklch(0.6 0.17 255)', 'oklch(0.86 0.15 95)', 'oklch(0.62 0.24 330)', 'oklch(0.93 0.05 215)', 'oklch(0.24 0.06 285)', 'oklch(0.8 0.17 160)'];
  const FROST = [[0, 'oklch(0.99 0.01 240)'], [1, 'oklch(0.84 0.03 250)']];
  const HEAT = [[0, 'oklch(0.97 0.1 95)'], [0.4, 'oklch(0.8 0.18 60)'], [1, 'oklch(0.55 0.2 32)']];
  const SPEC = 'oklch(0.99 0.01 90)', CAUSTIC = 'oklch(0.95 0.1 95)';

  // The drop model, from the photo on Wikimedia Commons:
  // "Prince Ruperts drops.jpg", Michael Grogan, 2006, public domain.
  // Distances are in head radii R behind the head centre.
  // On that photo the radius is 0.64 R at 1.8 R.
  // On that photo the radius is 0.21 R at 3.5 R.
  // A Gaussian taper with sigma 2.6 R fits these points.
  // The icon uses sigma 2.2 R, so the head reads rounder.
  // The tail then runs on as a thread and curls up.
  // u: the arc length from the head centre, in drop units.
  const radius = (g, u) => g.rT + (g.R - g.rT) * exp(-((u / (2.2 * g.R)) ** 2));
  // The spine in world space: x right, y away, z up.
  // The body lies on its belly.
  // Past u0 the tail lifts and curls.
  const spine = g => {
    const N = 96, out = [], M = 960, du = g.L / M;
    let x = 0, y = 0, z = 0, k = 0;
    const cb = cos(g.beta), sb = sin(g.beta);
    for (let j = 0; j <= M; j++) {
      const u = j * du;
      if (j === Math.round((k * M) / N)) {
        const zc = radius(g, Math.min(u, g.u0)) + z;
        out.push({ p: [x, y, zc], r: radius(g, u), u });
        k++;
      }
      const th = u < g.u0 ? 0 : g.th * ((u - g.u0) / (g.L - g.u0)) ** g.pw;
      x += cos(th) * cb * du; y += cos(th) * sb * du; z += sin(th) * du;
    }
    return out;
  };
  // The screen samples: centre X, Y and the screen radius.
  const project = (S, proj, k, mirror = false) => S.map(s => {
    const [X, Y] = proj([s.p[0], s.p[1], mirror ? -s.p[2] : s.p[2]]);
    return { X, Y, r: s.r * k, u: s.u };
  });
  // The tangents of the screen spine.
  const frame = P => P.map((c, i) => {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)];
    const dx = b.X - a.X, dy = b.Y - a.Y, l = hypot(dx, dy) || 1;
    return { tx: dx / l, ty: dy / l, ds: l / (Math.min(P.length - 1, i + 1) - Math.max(0, i - 1)) };
  });
  // A body of sweep circles: the true envelope, with round caps.
  // rr: the radius at each sample. i0: the first sample.
  // jag: the depth of a ragged front.
  const outline = (P, T, rr, i0 = 0, jag = 0, seed = 0) => {
    let m = i0;
    while (m + 1 < P.length && rr[m + 1] > 0.35) m++;
    if (rr[i0] <= 0.35) return '';
    const L = [], Rt = [];
    for (let i = i0; i <= m; i++) {
      const t = T[i], c = P[i], r = rr[i];
      const dr = clamp((rr[Math.min(m, i + 1)] - rr[Math.max(i0, i - 1)]) / (2 * t.ds), -0.9, 0.9);
      const q = sqrt(1 - dr * dr), nx = -t.ty, ny = t.tx;
      L.push([c.X + r * (-dr * t.tx + q * nx), c.Y + r * (-dr * t.ty + q * ny)]);
      Rt.push([c.X + r * (-dr * t.tx - q * nx), c.Y + r * (-dr * t.ty - q * ny)]);
    }
    // A cap: a half turn about a centre.
    const cap = (c, r, a0, dir) => { const o = []; for (let j = 1; j < 12; j++) { const a = a0 + (dir * PI * j) / 12; o.push([c.X + r * cos(a), c.Y + r * sin(a)]); } return o; };
    const tm = T[m], am = atan2(tm.tx, -tm.ty);
    const pts = [...L, ...cap(P[m], rr[m], am, -1), ...Rt.reverse()];
    if (i0 === 0) {
      const t0 = T[0], a0 = atan2(-t0.tx, t0.ty);
      pts.push(...cap(P[0], rr[0], a0, -1));
    } else if (jag) {
      // The frost front: fingers across the section, fixed by the hash.
      const a = pts[pts.length - 1], b = pts[0], t = T[i0];
      for (let j = 1; j < 6; j++) {
        const s = j / 6, d = (hash(j + seed) - 0.35) * jag;
        pts.push([lerp(a[0], b[0], s) - t.tx * d, lerp(a[1], b[1], s) - t.ty * d]);
      }
    }
    return poly(pts);
  };
  // The fringe depth: wide bands in the head, close in the tail.
  const depth = (r, r0, q) => q * sqrt(r * r0);
  // QS: the clear skin of the glass.
  // QE: the depth where the fringes start.
  const QS = 0.07, QE = 0.2, NB = 9;
  // Fringes crowd near the skin, as on a dome.
  // The path through glass changes fastest at the edge.
  // A linear share keeps the edge bands bold.
  const qOf = k => { const l = clamp(k / NB); return QE + (1 - QE) * (0.7 * l + 0.3 * (1 - sqrt(1 - l * l))); };
  // A crisp light band on an arc, thin at both ends.
  // rm: the mid radius. hw: the half width.
  const arcBand = (c, rm, hw, a0, a1) => {
    const o = [], i = [];
    for (let j = 0; j <= 16; j++) {
      const a = lerp(a0, a1, j / 16), w = hw * sin((PI * j) / 16) ** 0.7;
      o.push([c.X + (rm + w) * cos(a), c.Y + (rm + w) * sin(a)]); i.push([c.X + (rm - w) * cos(a), c.Y + (rm - w) * sin(a)]);
    }
    return poly([...o, ...i.reverse()]);
  };

  // One drop on screen: glass, fringes, light, frost and heat.
  // c.proj maps world to screen; c.k scales; c.mirror draws the reflection.
  const dropLayer = (g, u, root, c) => {
    const S = spine(g), P = project(S, c.proj, c.k, c.mirror), T = frame(P);
    const R0 = P[0].r, rr = P.map(p => p.r), base = outline(P, T, rr);
    const at = du => P.findIndex(p => p.u >= du);
    const off = q => outline(P, T, rr.map(r => r - depth(r, R0, q)));
    const grp = el('g', {}, root);
    el('path', { d: base, fill: `url(#${u}glass)` }, grp);
    // The dark line where the skin bends the light away.
    el('path', { d: off(QS) + off(QE), 'fill-rule': 'evenodd', fill: `url(#${u}edge)` }, grp);
    const fr = el('g', c.mirror ? { class: 'fr' } : { class: 'fr', id: `${u}fr` }, grp);
    const bands = Array.from({ length: NB + 1 }, () => el('path', {}, fr));
    const L = { grp, P, T, rr, R0, base, bands, fr, at };
    if (!c.mirror) {
      // The form: the far side of the glass falls into shade.
      el('path', { d: base, fill: `url(#${u}form)` }, grp);
      el('path', { d: base, fill: `url(#${u}hlit)` }, grp);
      const h = P[0];
      // Two long lights run along the skin, as on a glass rod.
      // edgeBand: a band at share m of the radius, on one side.
      const side = T[at(g.R)].tx > 0 ? -1 : 1;
      const edgeBand = (sd, m, hw, u0, u1, a0, a1) => {
        const i0 = at(u0), i1 = at(u1), o = [], n = [];
        // The head part: an arc about the head centre.
        for (let j = 0; j <= 10; j++) {
          const a = lerp(a0, a1, j / 10), w = hw * sin((PI * j) / 20) ** 0.7;
          o.push([h.X + R0 * (m + w) * cos(a), h.Y + R0 * (m + w) * sin(a)]); n.push([h.X + R0 * (m - w) * cos(a), h.Y + R0 * (m - w) * sin(a)]);
        }
        // The neck part: along the spine, thin at its end.
        for (let i = i0; i <= i1; i++) {
          const t = T[i], w = hw * Math.min(1, ((i1 - i) / (i1 - i0)) * 1.6) ** 0.8, nx = sd * -t.ty, ny = sd * t.tx;
          o.push([P[i].X + nx * rr[i] * (m + w), P[i].Y + ny * rr[i] * (m + w)]); n.push([P[i].X + nx * rr[i] * (m - w), P[i].Y + ny * rr[i] * (m - w)]);
        }
        return poly([...o, ...n.reverse()]);
      };
      // The softbox on the top; light refracted through it on the belly.
      const ang = sd => { const t = T[at(g.R * 0.5)]; return atan2(sd * t.tx, sd * -t.ty); };
      const top = edgeBand(side, 0.84, 0.08, g.R * 0.5, g.R * 3.8, ang(side) - 1.7, ang(side));
      const belly = edgeBand(-side, 0.86, 0.075, g.R * 0.5, g.R * 2.6, ang(-side) + 1.3, ang(-side));
      el('path', { d: belly, fill: CAUSTIC, filter: `url(#${u}b1)`, opacity: 0.8 }, grp);
      el('path', { d: belly, fill: SPEC, opacity: 0.75 }, grp);
      el('path', { d: top, fill: SPEC, opacity: 0.9 }, grp);
      el('path', { d: base, fill: 'none', stroke: `url(#${u}rim)`, 'stroke-width': 2, 'stroke-linejoin': 'round' }, grp);
    }
    L.frost = el('path', { fill: `url(#${u}frost)`, opacity: 0 }, grp);
    L.heat = el('path', { d: base, fill: `url(#${u}heat)`, opacity: 0 }, grp);
    // ph: the fringe phase; ring: a stress ring from the core out.
    L.drawBands = (ph, ring, ringOn) => {
      const fl = Math.floor(ph), fp = ph - fl;
      for (let k = 0; k <= NB; k++) {
        const q = qOf(Math.max(0, k - fp));
        bands[k].setAttribute('d', off(q));
        bands[k].setAttribute('fill', FRINGE[(((k + fl) % 6) + 6) % 6]);
      }
      if (L.ring) {
        L.ring.setAttribute('d', ringOn > 0.01 ? off(lerp(0.95, QE + 0.03, ring)) : '');
        L.ring.setAttribute('opacity', f(ringOn));
      }
    };
    // sf: the frost front, as a share from the tip.
    L.drawFrost = (sf, on) => {
      const i0 = Math.round((1 - sf) * (P.length - 1));
      L.frost.setAttribute('d', on > 0 && sf > 0 ? outline(P, T, rr, Math.min(i0, P.length - 2), R0 * 0.45, i0) : '');
      L.frost.setAttribute('opacity', f(on));
    };
    if (!c.mirror) L.ring = el('path', { fill: 'none', stroke: '#fff', 'stroke-width': f(R0 * 0.14), 'stroke-linejoin': 'round' }, fr);
    return L;
  };

  // The live drop: a hammer on the head, pliers on the tail.
  // dr: the main drop; mr: its mirror, or null.
  const rupert = (svg, u, g, dr, mr) => {
    const $q = s => svg.querySelector(s);
    const hold = $q('.hold'), flash = $q('.flash'), glow = $q('.glow'), chipsG = $q('.chips');
    const P = dr.P, R0 = dr.R0;
    // Chips start in the glass and fall to the ground line.
    const chips = Array.from({ length: 22 }, (_, i) => {
      const s = P[Math.floor(hash(i + 10) ** 1.8 * (P.length * 0.55))], a = hash(i + 30) * 2 * PI, rad = s.r * sqrt(hash(i + 50));
      const x0 = s.X + cos(a) * rad, y0 = s.Y + sin(a) * rad, sp = 6 + hash(i + 70) * 12;
      return { x0, y0, vx: cos(a) * sp, vy: sin(a) * sp * 0.6 - 18, gy: g.floorY(x0) - 1.5, r: f(R0 * (0.07 + hash(i + 90) * 0.06)),
        el: el('circle', { fill: i % 3 ? '#fff' : FRINGE[i % 6], opacity: 0 }, chipsG) };
    });
    // b: the time into a burst, or -1.
    // ring: the time since the last tap.
    const st = { t: 0, live: false, s: null, flow: 0, ph: 0, kick: 0, ring: 9, nextTap: 0, b: -1, cool: 0, over: 0 };
    const draw = () => {
      // The stress breathes while the pointer is on the drop.
      const ph = 0.55 * st.flow * sin(st.t * 1.7) + st.kick;
      const rp = clamp(st.ring / 0.6), ringOn = st.ring < 0.6 ? 0.9 * (1 - rp) : 0;
      dr.drawBands(ph, rp, ringOn);
      mr?.drawBands(ph, 0, 0);
      // A tap jolts the drop down onto the ground and back.
      const jolt = st.ring < 0.5 ? R0 * 0.06 * exp(-st.ring * 8) * cos(st.ring * 40) : 0;
      const b = st.b;
      // The burst, in steps: frost, white hold, burst, drip, cool.
      const run = b < 0 ? 0 : clamp((b - 0.1) / 0.9);
      const sf = run < 0.4 ? run * 1.6 : 0.64 + (run - 0.4) * 0.6;
      const gone = b < 0 ? 0 : clamp((b - 1.25) / 0.12) * (1 - clamp((b - 2.3) / 0.01));
      const drip = b < 2.3 ? 0 : 1 - clamp((b - 2.3) / 0.45) ** 2;
      const hot = b < 2.3 ? 0 : 1 - clamp((b - 2.9) / 1.4);
      const frostOn = b >= 0 && b < 2.3 ? 1 : 0;
      for (const L of [dr, mr]) {
        if (!L) continue;
        L.drawFrost(sf, frostOn);
        L.heat.setAttribute('opacity', f(hot));
        L.fr.setAttribute('opacity', f(1 - hot));
        L.grp.setAttribute('opacity', f(1 - gone));
        L.grp.setAttribute('transform', `translate(0 ${f((L === mr ? 1 : -1) * drip * g.dripH + (L === mr ? -jolt : jolt))})`);
      }
      glow.setAttribute('opacity', f(0.3 * (1 - gone)));
      // The tap: a pop of light where the hammer meets the head.
      flash.setAttribute('opacity', f(st.ring < 0.3 ? 1 - st.ring / 0.3 : 0));
      hold.setAttribute('opacity', f(1 - gone));
      // The chips fly out, fall and lie on the ground, then fade.
      const ct = b - 1.3, cOn = ct > 0 && b < 3.4 ? 1 - clamp((b - 2.6) / 0.8) : 0;
      for (const p of chips) {
        const tt = Math.max(0, ct), x = p.x0 + p.vx * tt * (1 - Math.min(tt, 0.9) * 0.5), y = Math.min(p.gy, p.y0 + p.vy * tt + 60 * tt * tt);
        p.el.setAttribute('cx', f(x)); p.el.setAttribute('cy', f(y)); p.el.setAttribute('r', p.r);
        p.el.setAttribute('opacity', f(cOn));
      }
    };
    const loop = clock(time => {
      const dt = Math.min(0.1, time - (st.t || time));
      st.t = time;
      st.flow += ((st.live ? 1 : 0) - st.flow) * 0.06;
      st.kick *= 0.9;
      st.ring += dt;
      st.cool = Math.max(0, st.cool - dt);
      if (st.b >= 0) { st.b += dt; if (st.b > 4.4) { st.b = -1; st.cool = 0.6; } }
      // On the head the hammer taps.
      // At the tail end the pliers snip.
      if (st.live && st.s != null && st.b < 0) {
        if (st.s < 0.32 && time > st.nextTap) { st.ring = 0; st.kick += 1; st.nextTap = time + 0.95; }
        st.over = st.s > 0.62 ? st.over + dt : 0;
        if (st.over > 0.2 && st.cool <= 0) { st.b = 0; st.over = 0; }
      }
      draw();
      const busy = st.b >= 0 || st.flow > 0.01 || Math.abs(st.kick) > 0.01 || st.ring < 0.6;
      if (!st.live && !busy) { Object.assign(st, { flow: 0, kick: 0, ring: 9 }); draw(); loop.stop(); }
    });
    draw();
    // The pointer as a share of the length from the head.
    const along = p => {
      let best = 1e9, bi = 0;

        <use class="glow" href="#${u}fr" filter="url(#${u}b6)"/>
        <g class="main"></g>
        <g class="chips"></g>
        <circle class="flash" cx="${f(D_H.X + R0 * 0.15)}" cy="${f(D_H.Y - R0 * 0.95)}" r="${f(R0 * 0.7)}" fill="#fff" filter="url(#${u}b3)" opacity="0"/>`;
      const mr = dropLayer(D, u, svg.querySelector('.mirror'), { proj: projD, k: DS, mirror: true });
      const dr = dropLayer(D, u, svg.querySelector('.main'), { proj: projD, k: DS });
      dr.grp.id = `${u}drop`;
      return rupert(svg, u, D, dr, mr);
    },
    emblem: embFit(D_BOX, `<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/><clipPath id="rt"><path d="${poly(D_TOP)}"/></clipPath><path d="${D_MIR.d}" clip-path="url(#rt)" fill="#6a6a6a"/><path d="${D_REST.d}" fill="#fff"/>`),
  });

  /* ================= Gallery ================= */
  const ID = 'rupert', NAME = "Rupert's drop";
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = `row-${ID}`;
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `${ID}-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      // A press is a snip, where the icon has one.
      if (c.down) tileEl.addEventListener('pointerdown', e => c.down(local(svg, e)));
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
