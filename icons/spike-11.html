<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 11</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- The current menu icon. -->
    <linearGradient id="g-galaxy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.86 0.12 70)"/>
      <stop offset="1" style="stop-color: oklch(0.7 0.14 250)"/>
    </linearGradient>
    <!-- The accretion disk: hot white inside, gold, then ember at the edge. -->
    <radialGradient id="gx-disk">
      <stop offset="0.36" style="stop-color: oklch(0.98 0.03 235)"/>
      <stop offset="0.52" style="stop-color: oklch(0.93 0.08 88)"/>
      <stop offset="0.78" style="stop-color: oklch(0.78 0.14 66)"/>
      <stop offset="1" style="stop-color: oklch(0.56 0.15 42)"/>
    </radialGradient>
    <linearGradient id="gx-jet" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" style="stop-color: oklch(0.95 0.05 230)"/>
      <stop offset="1" style="stop-color: oklch(0.8 0.1 250)" stop-opacity="0"/>
    </linearGradient>
    <!-- The merger: gold dust into the blue cores. -->
    <linearGradient id="gx-merge" gradientUnits="userSpaceOnUse" x1="16" y1="18" x2="112" y2="110">
      <stop offset="0" style="stop-color: oklch(0.88 0.11 82)"/>
      <stop offset="0.45" style="stop-color: oklch(0.78 0.13 62)"/>
      <stop offset="1" style="stop-color: oklch(0.66 0.12 255)"/>
    </linearGradient>
    <!-- The block: deep space faces. -->
    <linearGradient id="gx-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.3 0.07 285)"/>
      <stop offset="1" style="stop-color: oklch(0.2 0.05 270)"/>
    </linearGradient>
    <!-- The rosette glyph. -->
    <linearGradient id="gx-rose" gradientUnits="userSpaceOnUse" x1="14" y1="14" x2="114" y2="114">
      <stop offset="0" style="stop-color: oklch(0.9 0.1 85)"/>
      <stop offset="0.5" style="stop-color: oklch(0.78 0.14 60)"/>
      <stop offset="1" style="stop-color: oklch(0.72 0.12 250)"/>
    </linearGradient>
  </defs>
</svg>

<h1>Icon spike 11</h1>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2;
  const BG = 'oklch(0.16 0.012 275)';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };
  // A two-stop OKLCH mix; hue takes the short way round.
  const mixL = (a, b, t) => {
    let dh = b[2] - a[2];
    if (dh > 180) dh -= 360;
    if (dh < -180) dh += 360;
    return `oklch(${f(a[0] + (b[0] - a[0]) * t)} ${f(a[1] + (b[1] - a[1]) * t)} ${f((a[2] + dh * t + 360) % 360)})`;
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  {
    const ARMS = 'M76 58C100 70 92 108 50 106C32 105 18 92 12 74C26 88 44 94 58 91C76 87 82 72 72 64ZM52 70C28 58 36 20 78 22C96 23 110 36 116 54C102 40 84 34 70 37C52 41 46 56 56 64Z';
    DIRS.push({
      toy: 'galaxy', l: 'Current', name: 'Menu icon', emblemUrl: '../shared/emblems/galaxy.svg',
      art(svg) {
        svg.innerHTML = `
          <g class="stars">
            <path d="${ARMS}" fill="url(#g-galaxy)"/>
            <path d="${ARMS}" fill="url(#lit)"/>
            <path d="${ARMS}" fill="none" stroke="url(#rim)" stroke-width="2"/>
          </g>
          <rect x="17" y="20" width="9" height="9" fill="oklch(0.92 0.05 230)"/><rect x="101" y="94" width="9" height="9" fill="oklch(0.92 0.05 230)"/><rect x="104" y="18" width="5" height="5" fill="oklch(0.92 0.05 230)"/>
          <circle cx="64" cy="64" r="16" fill="oklch(0.96 0.07 88)" style="stroke: var(--bg)" stroke-width="4"/>
          <circle cx="64" cy="64" r="14" fill="url(#lit)"/>`;
        // Circling the pointer spins the disc; it coasts to a stop.
        const disc = svg.querySelector('.stars');
        let spin = 0, turn = 0, last = null;
        const coast = () => {
          turn += spin;
          spin *= 0.95;
          gsap.set(disc, { rotation: turn, svgOrigin: '64 64' });
          if (Math.abs(spin) < 0.02) { spin = 0; gsap.ticker.remove(coast); }
        };
        const kick = w => {
          if (!spin) gsap.ticker.add(coast);
          spin = Math.max(-14, Math.min(14, spin + w));
        };
        return {
          enter: p => { last = p; if (!p) kick(6); },
          move(p) {
            if (last && p) {
              const ax = last[0] - 64, ay = last[1] - 64, bx = p[0] - 64, by = p[1] - 64;
              kick(((ax * by - ay * bx) / Math.max(ax * ax + ay * ay, 200)) * 40);
            }
            last = p;
          },
          leave: () => (last = null),
        };
      },
    });
  }

  /* ================= A · Shaded object ================= */

  // A: the black hole; the pointer tilts its disk, and it feeds while hovered.
  {
    const R0 = 21, R1 = 55;
    const REST = { tilt: -16, incl: 0.24, jet: 0.5 };
    // Streak rings: radius, dash, gap, laps per flow loop.
    const STREAKS = [[28, 5, 9, 3], [37, 9, 11, 2], [47, 6, 14, 1]];
    // An elliptic ring: outer and inner edge, squashed by k.
    const annulus = (ro, ri, k) => `M${64 - ro} 64A${ro} ${f(ro * k)} 0 1 0 ${64 + ro} 64A${ro} ${f(ro * k)} 0 1 0 ${64 - ro} 64ZM${64 - ri} 64A${ri} ${f(ri * k)} 0 1 0 ${64 + ri} 64A${ri} ${f(ri * k)} 0 1 0 ${64 - ri} 64Z`;
    const jetD = (j, w) => { const L = 16 + 34 * j; return `M${64 - w} 64L64 ${f(64 - L)}L${64 + w} 64Z`; };
    // The back clip keeps the far half; the front clip keeps the near half.
    const clips = u => `<clipPath id="${u}b"><rect x="8" y="30" width="112" height="34"/></clipPath><clipPath id="${u}f"><rect x="8" y="64" width="112" height="34"/></clipPath>`;
    DIRS.push({
      toy: 'galaxy', l: 'A', name: 'Shaded object',
      // Rotated groups inflate getBBox, so the frame is given.
      box: [11, 32, 106, 64],
      art(svg, u) {
        const half = side => `<g clip-path="url(#${u}${side})"><path class="disk" fill="url(#gx-disk)" fill-rule="evenodd"/><g fill="none" stroke-linecap="round">${STREAKS.map(([, d, g]) => `<ellipse class="sk" cx="64" cy="64" stroke="oklch(0.99 0.02 90 / 0.55)" stroke-width="1.1" stroke-dasharray="${d} ${g}"/>`).join('')}</g></g>`;
        svg.innerHTML = `
          ${clips(u)}
          <g class="tilt">
            ${half('b')}
            <path class="jet" fill="url(#gx-jet)"/>
            <path class="jet" fill="url(#gx-jet)" transform="rotate(180 64 64)"/>
          </g>
          <circle cx="64" cy="64" r="19.6" fill="none" stroke="oklch(0.9 0.1 80)" stroke-width="3.2"/>
          <circle cx="64" cy="64" r="16" fill="oklch(0.09 0.012 275)"/>
          <circle cx="64" cy="64" r="16.7" fill="none" stroke="oklch(0.97 0.03 230)" stroke-width="1.1"/>
          <g class="tilt">${half('f')}</g>`;
        const tilts = [...svg.querySelectorAll('.tilt')], disks = [...svg.querySelectorAll('.disk')];
        const sks = [...svg.querySelectorAll('.sk')], jets = [...svg.querySelectorAll('.jet')];
        const st = { ...REST, flow: 0 };
        const draw = () => {
          tilts.forEach(g => g.setAttribute('transform', `rotate(${f(st.tilt)} 64 64)`));
          const d = annulus(R1, R0, st.incl);
          disks.forEach(p => p.setAttribute('d', d));
          sks.forEach((e, i) => {
            const [r, da, ga, n] = STREAKS[i % STREAKS.length];
            e.setAttribute('rx', r);
            e.setAttribute('ry', f(r * st.incl));
            // Whole dash periods keep the flow loop seamless.
            e.setAttribute('stroke-dashoffset', f(-st.flow * (da + ga) * n));
          });
          jets.forEach(j => j.setAttribute('d', jetD(st.jet, 3)));
        };
        draw();
        let flow = null;
        const aim = p => p && gsap.to(st, {
          tilt: REST.tilt + clamp((p[0] - 64) * 0.3, -14, 14), incl: clamp(REST.incl - (p[1] - 64) * 0.005, 0.1, 0.46),
          duration: 0.5, ease: 'power3.out', overwrite: 'auto', onUpdate: draw,
        });
        return {
          enter(p) {
            aim(p || [52, 40]);
            gsap.to(st, { jet: 1, duration: 0.7, ease: 'power2.out', overwrite: 'auto', onUpdate: draw });
            if (!flow) flow = gsap.fromTo(st, { flow: 0 }, { flow: 1, duration: 2.2, ease: 'none', repeat: -1, onUpdate: draw });
          },
          move: aim,
          leave() {
            flow?.kill(); flow = null;
            gsap.to(st, { ...REST, flow: st.flow > 0.5 ? 1 : 0, duration: 1.1, ease: 'power3.out', overwrite: 'auto', onUpdate: draw, onComplete() { st.flow = 0; draw(); } });
          },
        };
      },
      emblem: emb(`
        ${clips('')}
        <g transform="rotate(${REST.tilt} 64 64)">
          <path d="${annulus(R1, R0, REST.incl)}" fill="#fff" fill-rule="evenodd" clip-path="url(#b)"/>
          <ellipse cx="64" cy="64" rx="38" ry="${f(38 * REST.incl)}" fill="none" stroke="#000" stroke-width="2.2" clip-path="url(#b)"/>
          <path d="${jetD(REST.jet, 3.4)}" fill="#fff"/>
          <path d="${jetD(REST.jet, 3.4)}" fill="#fff" transform="rotate(180 64 64)"/>
        </g>
        <circle cx="64" cy="64" r="21.5" fill="#fff"/>
        <circle cx="64" cy="64" r="15.5" fill="#000"/>
        <g transform="rotate(${REST.tilt} 64 64)">
          <path d="${annulus(R1, R0, REST.incl)}" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-width="3" clip-path="url(#f)"/>
          <ellipse cx="64" cy="64" rx="38" ry="${f(38 * REST.incl)}" fill="none" stroke="#000" stroke-width="2.2" clip-path="url(#f)"/>
        </g>
      `),
    });
  }

  /* ================= B · Stencil cut-out ================= */

  // B: two galaxies merged into one solid shape; hover sets them orbiting.
  {
    const MID = [65, 65];
    // Disc: offset from the middle, radius, arm phase.
    const DISCS = [[-19, -17, 28, 0.5], [19, 17, 23, 2.4]];
    // A tapered log-spiral gap, in disc-local units.
    const arm = (R, ph) => {
      const n = 40, P = s => { const r = 4 + (R + 3 - 4) * s, t = ph + Math.log(r / 4) * 2.1; return [r * Math.cos(t), r * Math.sin(t)]; };
      const L = [], Rt = [];
      for (let i = 0; i <= n; i++) {
        const s = i / n, p = P(s), a = P(Math.max(0, s - 0.01)), b = P(Math.min(1, s + 0.01));
        const tx = b[0] - a[0], ty = b[1] - a[1], m = Math.hypot(tx, ty) || 1, w = (0.8 + 3 * s) / 2;
        L.push([p[0] - (ty / m) * w, p[1] + (tx / m) * w]);
        Rt.unshift([p[0] + (ty / m) * w, p[1] - (tx / m) * w]);
      }
      return poly(L.concat(Rt));
    };
    const cuts = (R, ph) => arm(R, ph) + arm(R, ph + Math.PI);
    const place = (t, k) => {
      const [dx, dy] = DISCS[k], a = -TAU * t, sep = 1 - 0.14 * Math.sin(Math.PI * t) ** 2;
      return [MID[0] + sep * (dx * Math.cos(a) - dy * Math.sin(a)), MID[1] + sep * (dx * Math.sin(a) + dy * Math.cos(a))];
    };
    DIRS.push({
      toy: 'galaxy', l: 'B', name: 'Stencil cut-out',
      art(svg) {
        svg.innerHTML = `
          ${DISCS.map(() => '<circle class="d" fill="url(#gx-merge)"/>').join('')}
          ${DISCS.map(() => '<circle class="d" fill="url(#lit)"/>').join('')}
          ${DISCS.map(([, , R, ph]) => `<g class="c"><path d="${cuts(R, ph)}" style="fill: ${BG}"/><circle r="6.5" fill="none" style="stroke: ${BG}" stroke-width="2.4"/></g>`).join('')}`;
        const D = [...svg.querySelectorAll('.d')], C = [...svg.querySelectorAll('.c')];
        const st = { t: 0 };
        const draw = () => DISCS.forEach(([, , R], k) => {
          const [x, y] = place(st.t, k);
          [D[k], D[k + DISCS.length]].forEach(c => { c.setAttribute('cx', f(x)); c.setAttribute('cy', f(y)); c.setAttribute('r', R); });
          // Each disc turns two full turns per orbit.
          C[k].setAttribute('transform', `translate(${f(x)} ${f(y)}) rotate(${f(-720 * st.t)})`);
        });
        draw();
        return hoverLoop(
          () => gsap.timeline({ repeat: -1 }).fromTo(st, { t: 0 }, { t: 1, duration: 7, ease: 'none', onUpdate: draw }),
          () => gsap.to(st, { t: st.t < 0.5 ? 0 : 1, duration: 0.9, ease: 'power2.out', onUpdate: draw, onComplete() { st.t = 0; draw(); } }));
      },
      emblem: emb(`
        ${DISCS.map(([, , R], k) => { const [x, y] = place(0, k); return `<circle cx="${f(x)}" cy="${f(y)}" r="${R}" fill="#fff"/>`; }).join('\n')}
        ${DISCS.map(([, , R, ph], k) => { const [x, y] = place(0, k); return `<g transform="translate(${f(x)} ${f(y)})"><path d="${cuts(R, ph)}" fill="#000"/><circle r="6.5" fill="none" stroke="#000" stroke-width="2.8"/></g>`; }).join('\n')}
      `),
    });
  }

  /* ================= C · Single-weight line ================= */

  // C: a spacetime grid; the well follows the pointer and deepens.
  {
    const N = 8, A0 = 14, A1 = 114, STEP = (A1 - A0) / (N - 1), SAMPLES = 44;
    const REST = { x: 64, y: 64, a: 0.62, s: 28 };
    const LINE = 'oklch(0.84 0.06 245)';
    const warp = (x, y, w) => {
      const dx = x - w.x, dy = y - w.y, k = w.a * Math.exp(-(dx * dx + dy * dy) / (w.s * w.s));
      return [x - dx * k, y - dy * k];
    };
    const lines = w => {
      const out = [];
      for (let i = 0; i < N; i++) {
        const c = A0 + i * STEP;
        let h = '', v = '';
        for (let j = 0; j <= SAMPLES; j++) {
          const t = A0 + ((A1 - A0) * j) / SAMPLES, p = warp(t, c, w), q = warp(c, t, w);
          h += (j ? 'L' : 'M') + `${f(p[0])} ${f(p[1])}`;
          v += (j ? 'L' : 'M') + `${f(q[0])} ${f(q[1])}`;
        }
        out.push(h, v);
      }
      return out;
    };
    DIRS.push({
      toy: 'galaxy', l: 'C', name: 'Single-weight line',
      art(svg) {
        svg.innerHTML = `
          <g fill="none" stroke="${LINE}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            ${Array.from({ length: N * 2 }, () => '<path class="g"/>').join('')}
            <circle class="w" r="5" stroke="oklch(0.86 0.12 75)"/>
          </g>`;
        const P = [...svg.querySelectorAll('.g')], W = svg.querySelector('.w');
        const st = { ...REST };
        const draw = () => {
          lines(st).forEach((d, i) => P[i].setAttribute('d', d));
          W.setAttribute('cx', f(st.x));
          W.setAttribute('cy', f(st.y));
        };
        draw();
        const aim = p => p && gsap.to(st, { x: clamp(p[0], 32, 96), y: clamp(p[1], 32, 96), a: 0.82, duration: 0.45, ease: 'power3.out', overwrite: true, onUpdate: draw });
        return {
          enter: p => aim(p || [48, 46]), move: aim,
          leave: () => gsap.to(st, { ...REST, duration: 1.2, ease: 'elastic.out(1, 0.45)', overwrite: true, onUpdate: draw }),
        };
      },
      emblem: emb(`
        <g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
          ${lines(REST).map(d => `<path d="${d}"/>`).join('\n')}
        </g>
      `),
    });
  }

  /* ================= D · Isometric block ================= */

  // D: a block of night with the galaxy on its top face; dust streams in.
  {
    const H = 27 * Math.sqrt(3), DEPTH = 40;
    const T = [64, 10], UR = [64 + H, 37], C0 = [64, 64], UL = [64 - H, 37];
    const LR = [64 + H, 37 + DEPTH], B = [64, 64 + DEPTH], LL = [64 - H, 37 + DEPTH];
    const TOP = [T, UR, C0, UL], LEFT = [UL, C0, B, LL], RIGHT = [C0, UR, LR, B];
    // The top face is a 54-unit square in iso; galaxy units map onto it.
    const ISO = 'matrix(0.866 0.5 -0.866 0.5 64 37)';
    const PER = 16, RI = 4, RO = 28;
    // Lane: angle spread, phase, size scale.
    const LANES = [[0, 0, 1], [-0.32, 0.5, 0.62], [0.32, 0.25, 0.62]];
    const ICE = [0.97, 0.03, 235], GOLD = [0.87, 0.13, 80], EMBER = [0.66, 0.16, 42];
    const dust = (t, scale = 1) => {
      const out = [];
      for (let a = 0; a < 2; a++) LANES.forEach(([sp, ph, sc]) => {
        for (let i = 0; i < PER; i++) {
          // Dust slides one slot inward per loop, so the loop is seamless.
          const u = ((((i + ph - t) / PER) % 1) + 1) % 1;
          const r = RI + (RO - RI) * u, th = a * Math.PI + 0.3 + Math.log(r / RI) * 1.7 + sp * (0.25 + u);
          const s = (3.8 - 1.9 * u) * sc * scale * Math.min(1, (1 - u) / 0.12);
          out.push([r * Math.cos(th), r * Math.sin(th), s, u < 0.45 ? mixL(ICE, GOLD, u / 0.45) : mixL(GOLD, EMBER, (u - 0.45) / 0.55)]);
        }
      });
      return out;
    };
    const SPECKS = [[30, 56, 1.6], [42, 76, 1.2], [24, 74, 1], [96, 62, 1.4], [86, 84, 1], [104, 78, 1.2]];
    DIRS.push({
      toy: 'galaxy', l: 'D', name: 'Isometric block',
      art(svg) {
        const n = 2 * LANES.length * PER;
        svg.innerHTML = `
          <path d="${poly(LEFT)}" fill="oklch(0.36 0.08 288)"/>
          <path d="${poly(RIGHT)}" fill="oklch(0.25 0.06 280)"/>
          <path d="${poly(TOP)}" fill="url(#gx-top)"/>
          <path d="${poly(TOP)}" fill="url(#lit)"/>
          <g fill="oklch(0.92 0.04 240 / 0.7)">${SPECKS.map(([x, y, r]) => `<rect x="${x - r}" y="${y - r}" width="${2 * r}" height="${2 * r}"/>`).join('')}</g>
          <g transform="${ISO}">
            ${Array.from({ length: n }, () => '<rect class="p"/>').join('')}
            <rect x="-3.6" y="-3.6" width="7.2" height="7.2" fill="oklch(0.98 0.03 235)"/>
          </g>
          <path d="M${UL.join(' ')}L64 64L${UR.join(' ')}M64 64V${B[1]}" fill="none" stroke="oklch(0.88 0.04 260 / 0.35)" stroke-width="1.2"/>
          <path d="${poly([T, UR, LR, B, LL, UL])}" fill="none" stroke="url(#rim)" stroke-width="1.5" stroke-linejoin="round"/>`;
        const R = [...svg.querySelectorAll('.p')];
        const st = { t: 0 };
        const draw = () => dust(st.t).forEach(([x, y, s, c], i) => {
          const e = R[i];
          e.setAttribute('x', f(x - s / 2)); e.setAttribute('y', f(y - s / 2));
          e.setAttribute('width', f(Math.max(0, s))); e.setAttribute('height', f(Math.max(0, s)));
          e.style.fill = c;
        });
        draw();
        return hoverLoop(
          () => gsap.timeline({ repeat: -1 }).fromTo(st, { t: 0 }, { t: 1, duration: 0.55, ease: 'none', onUpdate: draw }),
          () => gsap.to(st, { t: st.t < 0.5 ? 0 : 1, duration: 0.4, ease: 'power2.out', onUpdate: draw, onComplete() { st.t = 0; draw(); } }));
      },
      emblem: emb(`
        <path d="${poly([T, UR, LR, B, LL, UL])}" fill="#fff"/>
        <path d="M64 64V${B[1]}" stroke="#000" stroke-width="3"/>
        <path d="${poly(TOP)}" fill="#000"/>
        <g transform="${ISO}">
          ${dust(0, 1.25).filter(p => p[2] > 1).map(([x, y, s]) => `<rect x="${f(x - s / 2)}" y="${f(y - s / 2)}" width="${f(s)}" height="${f(s)}" fill="#fff"/>`).join('\n')}
          <rect x="-4.4" y="-4.4" width="8.8" height="8.8" fill="#fff"/>
        </g>
      `),
    });
  }

  /* ================= E · Abstract mark ================= */

  // E: a vortex of offset arcs; hover turns each ring at its own speed.
  {
    // Ring: radius, start angle, turns per loop (inner rings run faster).
    const RINGS = [[9, 200, 5], [18, 248, 4], [27, 296, 3], [36, 344, 2], [45, 32, 1]];
    const SWEEP = 250, W = 6.4;
    const arc = (r, a0) => {
      const a = (a0 * Math.PI) / 180, b = ((a0 + SWEEP) * Math.PI) / 180;
      return `M${f(64 + r * Math.cos(a))} ${f(64 + r * Math.sin(a))}A${r} ${r} 0 1 1 ${f(64 + r * Math.cos(b))} ${f(64 + r * Math.sin(b))}`;
    };
    DIRS.push({
      toy: 'galaxy', l: 'E', name: 'Abstract mark',
      art(svg) {
        svg.innerHTML = `
          <g fill="none" stroke="url(#gx-rose)" stroke-width="${W}">
            ${RINGS.map(([r, a0]) => `<path class="r" d="${arc(r, a0)}"/>`).join('')}
          </g>
          <circle cx="64" cy="64" r="3.4" fill="oklch(0.97 0.04 90)"/>`;
        const P = [...svg.querySelectorAll('.r')];
        const st = { t: 0 };
        // Whole turns per ring keep the loop seamless.
        const draw = () => P.forEach((p, k) => p.setAttribute('transform', `rotate(${f(-360 * RINGS[k][2] * st.t)} 64 64)`));
        return hoverLoop(
          () => gsap.timeline({ repeat: -1 }).fromTo(st, { t: 0 }, { t: 1, duration: 9, ease: 'none', onUpdate: draw }),
          () => gsap.to(st, { t: st.t < 0.5 ? 0 : 1, duration: 1, ease: 'power2.inOut', onUpdate: draw, onComplete() { st.t = 0; draw(); } }));
      },
      emblem: emb(`
        <g fill="none" stroke="#fff" stroke-width="${W + 0.4}">
          ${RINGS.map(([r, a0]) => `<path d="${arc(r, a0)}"/>`).join('\n')}
        </g>
        <circle cx="64" cy="64" r="4" fill="#fff"/>
      `),
    });
  }

  /* ================= Gallery ================= */

  const NAMES = { galaxy: 'Galaxy' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || `spike/emblems/${file}.svg`;
      if (D.emblem) window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.emblemUrl ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        <div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
