<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: East Van postcards 2</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: East Van postcards 2</h1>
<p class="lede">East Van postcards, round 2: the postcard with the toy's own first card on its face, East 4th at 4:52 pm in the rain. A: free on the ground, a corner folded up. D: standing on a stack of postcards.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };



  // The toy's tokens: card 1, East 4th, rain at dusk.
  // Deep indigo sky, ochre house, warm porch light.
  const PAPER = [[0, 'oklch(0.97 0.022 88)'], [1, 'oklch(0.84 0.04 78)']];
  const BACK = [[0, 'oklch(0.99 0.012 90)'], [1, 'oklch(0.86 0.03 80)']];
  const SKY = [[0, 'oklch(0.2 0.08 274)'], [0.62, 'oklch(0.29 0.11 282)'], [1, 'oklch(0.38 0.1 292)']];
  const GABLE_G = [[0, 'oklch(0.5 0.09 92)'], [0.55, 'oklch(0.62 0.11 86)'], [1, 'oklch(0.72 0.13 72)']];
  const POLE_G = [[0, 'oklch(0.72 0.13 62)'], [0.5, 'oklch(0.58 0.12 52)'], [1, 'oklch(0.34 0.07 45)']];
  const STREET_G = [[0, 'oklch(0.2 0.04 280)'], [1, 'oklch(0.1 0.025 275)']];
  const PINE = 'oklch(0.14 0.035 280)', ROOF = 'oklch(0.18 0.03 275)', BARGE = 'oklch(0.36 0.05 80)';
  const PORCH = 'oklch(0.27 0.05 178)', BEAM = 'oklch(0.48 0.09 80)', POST = 'oklch(0.7 0.08 85)';
  const DOOR = 'oklch(0.62 0.21 31)', WARM = 'oklch(0.86 0.13 68)', HOT = 'oklch(0.95 0.09 85)';
  const ATTIC = 'oklch(0.7 0.15 246)', GREENWIN = 'oklch(0.52 0.13 158)', CAT = 'oklch(0.16 0.02 280)';
  const NEIGH_L = 'oklch(0.3 0.03 262)', NEIGH_R = 'oklch(0.3 0.08 338)', NEIGH_R_ROOF = 'oklch(0.2 0.05 330)';
  const LAWN = 'oklch(0.4 0.11 145)', WALK = 'oklch(0.5 0.025 280)', CURB = 'oklch(0.68 0.04 75)', STEP = 'oklch(0.36 0.02 280)';
  const LEAF = ['oklch(0.52 0.13 52)', 'oklch(0.6 0.13 70)', 'oklch(0.44 0.11 40)'];
  // The porch string: five bulbs in the toy's party colours.
  const BULBS = ['oklch(0.7 0.2 28)', 'oklch(0.78 0.17 145)', 'oklch(0.72 0.15 250)', 'oklch(0.88 0.16 90)', 'oklch(0.7 0.2 340)'];
  // The card is 104 by 72.
  // The picture sits 4 in, and 7 at the foot.
  const CW = 52, CH = 36, PX = 48, PT = -32, PB = 29;
  // The lower right corner folds up; the flap shows the card's back.
  const C1 = [37, 36], C2 = [52, 23], FLAP = [40.6, 21.4];
  const CARD = `M-48 -36H48Q52 -36 52 -32V${C2[1]}L${C1[0]} 36H-48Q-52 36 -52 32V-32Q-52 -36 -48 -36Z`;
  const FLAP_D = poly([C1, C2, FLAP]);
  const PIC = `M${-PX} ${PT}H${PX}V${PB}H${-PX}Z`;
  // The house is drawn small, then scaled up to fill the frame.
  // Its porch floor (y 10) lands on the lawn line (y 13).
  const HOUSE_T = 'translate(-3 13) scale(1.22) translate(2 -10)';
  const GABLE = 'M-19 -8L-2 -24L15 -8V-4H-19Z';
  const ROOF_L = 'M-24 -5L-2 -26L-2 -21L-20 -4Z', ROOF_R = 'M20 -5L-2 -26L-2 -21L16 -4Z';
  const SIDE_WALL = 'M15 -8L19 -10V8H15Z';
  const PINES = 'M-22 -42L-15 -4H-29ZM19 -46L26 -8H12ZM46 -38L52 -4H40Z';
  const CAT_D = 'M10.5 5V2.3Q10.5 0.6 11.6 0.4L11.3 -1.4L12.5 -0.3L13.7 -1.4L13.4 0.4Q14.5 0.6 14.5 2.3V5Z';
  const HOUSE_SIL = 'M-24 -5L-2 -26L20 -5H18V10H-22V-5Z';
  // Rain drops repeat every 30 down, so the fall can loop.
  const DROPS = [[-40, -10], [-30, -26], [-20, -2], [-9, -20], [2, -30], [12, -6], [23, -24], [33, -12], [43, -28], [-36, 8], [6, 12], [28, 6]];
  const rainPath = DROPS.flatMap(([x, y]) => [-1, 0, 1].map(k => `M${x} ${y + k * 30}l-1.6 6`)).join('');
  // Street reflections: each lit thing drops a streak into the wet road.
  const REFL = [[-7.9, 8.5, DOOR, 0.95], [4.3, 15.9, WARM, 0.8], [-21.3, 8.5, GREENWIN, 0.7], [-45, 10, WARM, 0.6], [26, 6, WARM, 0.55], [37, 4, 'oklch(0.62 0.12 55)', 0.75]];
  const ROAD = 19;

  const cardDefs = u => `${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 2.2)}${blur(`${u}g2`, 1.1)}${blur(`${u}g3`, 3.4)}
    <filter id="${u}rb" x="-40%" y="-10%" width="180%" height="120%"><feGaussianBlur stdDeviation="0.9 0.3"/></filter>
    ${lg(`${u}paper`, PAPER, 'x1="0" y1="0" x2="0.4" y2="1"')}${lg(`${u}back`, BACK, 'x1="1" y1="1" x2="0.3" y2="0"')}
    ${lg(`${u}sky`, SKY)}${lg(`${u}gable`, GABLE_G)}${lg(`${u}pole`, POLE_G, 'x1="0" y1="0" x2="1" y2="0"')}
    ${lg(`${u}street`, STREET_G)}
    ${rg(`${u}warm`, [[0, 'oklch(0.88 0.14 72)', 0.85], [0.45, 'oklch(0.72 0.15 60)', 0.32], [1, 'oklch(0.6 0.12 50)', 0]])}
    ${rg(`${u}blue`, [[0, 'oklch(0.78 0.15 246)', 0.85], [1, 'oklch(0.6 0.15 250)', 0]])}
    ${rg(`${u}mist`, [[0, 'oklch(0.5 0.1 300)', 0.55], [1, 'oklch(0.4 0.1 300)', 0]])}
    ${lg(`${u}fade`, [[0, '#fff', 1], [1, '#fff', 0.05]])}
    ${lg(`${u}gloss`, [[0, '#fff', 0.16], [0.42, '#fff', 0.03], [1, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"')}
    ${lg(`${u}sheen`, [[0, '#fff', 0], [0.5, '#fff', 0.24], [1, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="0"')}
    <clipPath id="${u}pc"><path d="${PIC}"/></clipPath><clipPath id="${u}cc"><path d="${CARD}"/></clipPath>
    <mask id="${u}rm"><rect x="${-PX}" y="${ROAD}" width="${2 * PX}" height="${PB - ROAD}" fill="url(#${u}fade)"/></mask>`;

  // The house: ochre gable, porch, red door, warm window.
  const house = u => `
    <path d="${SIDE_WALL}" fill="oklch(0.36 0.07 88)"/>
    <path d="${GABLE}" fill="url(#${u}gable)"/>
    <path d="${GABLE}" fill="url(#${u}lit)"/>
    <ellipse cx="-2" cy="-14" rx="10" ry="8" fill="url(#${u}blue)"/>
    <path class="attic" d="M-5 -18H1V-11H-5Z" fill="${ATTIC}"/>
    <path d="${ROOF_L}" fill="${ROOF}"/><path d="${ROOF_R}" fill="${ROOF}"/>
    <path d="M-24 -5L-2 -26L20 -5" fill="none" stroke="${BARGE}" stroke-width="1.4" stroke-linejoin="round" opacity="0.85"/>
    <path d="M-21 -2H17V8H-21Z" fill="${PORCH}"/>
    <path d="M-17 -1H-10V5H-17Z" fill="${GREENWIN}"/>
    <path d="M3 -3H19V7H3Z" fill="${WARM}" filter="url(#${u}g3)" opacity="0.85"/>
    <path class="glow" d="M5 -1H17V5.5H5Z" fill="${WARM}"/>
    <path d="${CAT_D}" fill="${CAT}"/>
    <path d="M-6 -1H1V8H-6Z" fill="oklch(0.66 0.2 34)" filter="url(#${u}g)" opacity="0.9"/>
    <path class="door" d="M-6 -1H1V8H-6Z" fill="${DOOR}"/>
    <path d="M-4.2 0.6H-0.8V3H-4.2Z" fill="${HOT}"/>
    <ellipse cx="-2" cy="3" rx="22" ry="10" fill="url(#${u}warm)" opacity="0.7"/>
    <path d="M-22 -5H18V-2H-22Z" fill="${BEAM}"/>
    <path d="M-22 -5H18V-4H-22Z" fill="#fff" opacity="0.18"/>
    <path d="M-22 -2H-19.5V8H-22ZM15.5 -2H18V8H15.5Z" fill="${POST}"/>
    <g class="bulbs" filter="url(#${u}g2)">${BULBS.map((c, i) => `<circle cx="${-16 + i * 7.5}" cy="-1.3" r="2" fill="${c}"/>`).join('')}</g>
    <g>${BULBS.map((c, i) => `<circle class="bulb" cx="${-16 + i * 7.5}" cy="-1.3" r="1.2" fill="${c}"/>`).join('')}</g>
    <path d="M-22 8H18V10H-22Z" fill="oklch(0.2 0.025 275)"/>
    <path d="M-8 8H3V9.6H-8ZM-9 9.6H4V12H-9Z" fill="${STEP}"/>`;

  // The scene: card 1 of the toy, in its own light.
  const scene = u => `
    <path d="${PIC}" fill="url(#${u}sky)"/>
    <ellipse cx="-4" cy="-4" rx="50" ry="18" fill="url(#${u}mist)"/>
    <path d="${PINES}" fill="${PINE}"/>
    <path d="M-48 -14H-29L-27 -11V13H-48Z" fill="${NEIGH_L}"/>
    <ellipse cx="-40" cy="-3" rx="13" ry="11" fill="url(#${u}warm)"/>
    <path class="glow" d="M-45 -8H-35V1H-45Z" fill="${WARM}"/>
    <path d="M24 -4L37 -19L50 -4V13H24Z" fill="${NEIGH_R}"/>
    <path d="M21 -3L37 -21.5L53 -3" fill="none" stroke="${NEIGH_R_ROOF}" stroke-width="3.2" stroke-linejoin="miter"/>
    <ellipse cx="29" cy="3" rx="9" ry="9" fill="url(#${u}warm)" opacity="0.8"/>
    <path class="glow" d="M26 -2H32V7H26Z" fill="${WARM}"/>
    <path d="M-33.5 -32Q-32.5 -12 -32 13H-29Q-28.5 -12 -30.5 -32Z" fill="oklch(0.2 0.03 40)"/>
    <circle cx="-41" cy="-31" r="8" fill="${LEAF[2]}"/><circle cx="-29" cy="-35" r="7" fill="${LEAF[0]}"/><circle cx="-36" cy="-23" r="6" fill="${LEAF[1]}"/>
    <g transform="${HOUSE_T}">${house(u)}</g>
    <path d="M${-PX} 13H${PX}V15H${-PX}Z" fill="${LAWN}"/>
    <path d="M${-PX} 15H${PX}V17.5H${-PX}Z" fill="${WALK}"/>
    <ellipse cx="-3" cy="16" rx="22" ry="3" fill="url(#${u}warm)" opacity="0.7"/>
    <path d="M37 -32H41V17.5H37Z" fill="url(#${u}pole)"/>
    <path d="M32.5 -26H37V-19H32.5Z" fill="oklch(0.56 0.1 78)"/>
    <path d="M32.5 -26H34V-19H32.5Z" fill="#fff" opacity="0.25"/>
    <path d="M39 -24Q22 -25 6 -34M39 -24L49 -21" fill="none" stroke="oklch(0.1 0.02 280)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M${-PX} 17.5H${PX}V${ROAD}H${-PX}Z" fill="${CURB}"/>
    <path d="M${-PX} ${ROAD}H${PX}V${PB}H${-PX}Z" fill="url(#${u}street)"/>
    <g class="refl" mask="url(#${u}rm)"><g filter="url(#${u}rb)">${REFL.map(([x, w, c, o]) => `<path d="M${x} ${ROAD}h${w}V${PB}h${-w}Z" fill="${c}" opacity="${o}"/>`).join('')}</g></g>
    <path class="rain" d="${rainPath}" fill="none" stroke="oklch(0.88 0.04 250)" stroke-width="1.5" stroke-linecap="round" opacity="0"/>
    <path d="${PIC}" fill="url(#${u}gloss)"/>`;

  // One card, centred on 0 0: paper, the scene, the folded corner.
  const cardMarkup = u => `
    ${body(CARD, u, 'paper')}
    <g clip-path="url(#${u}pc)">${scene(u)}</g>
    <path d="${PIC}" fill="none" stroke="oklch(0.3 0.04 70)" stroke-opacity="0.35" stroke-width="0.8"/>
    <path d="${poly([C1, C2, [44, 31]])}" fill="oklch(0.1 0.02 280)" opacity="0.45" filter="url(#${u}g2)"/>
    ${body(FLAP_D, u, 'back')}
    <g clip-path="url(#${u}cc)"><path class="sheen" d="M-30 -60H0L-20 60H-50Z" fill="url(#${u}sheen)" opacity="0"/></g>`;

  // On entry: rain, a brighter porch, a chase of bulbs.
  // to(p) maps a tile point to the card frame.
  // tilt(dx, dy, up) moves the card.
  const life = (svg, to, tilt) => {
    const $ = s => svg.querySelector(s), $$ = s => svg.querySelectorAll(s);
    const rain = $('.rain'), sheen = $('.sheen'), refl = $('.refl'), door = $('.door'), attic = $('.attic');
    const bulbs = [...$$('.bulb'), ...$$('.bulbs circle')], glows = $$('.glow');
    let fall = null, chase = null, live = false;
    return {
      enter(p) {
        live = true;
        fall?.kill(); chase?.kill();
        fall = gsap.fromTo(rain, { y: 0, x: 0 }, { y: 30, x: -8, duration: 0.5, ease: 'none', repeat: -1 });
        gsap.to(rain, { opacity: 0.6, duration: 0.3 });
        // The bulbs chase along the porch beam.
        chase = gsap.to(bulbs, { opacity: 0.25, duration: 0.18, stagger: { each: 0.09, repeat: -1, yoyo: true } });
        // The porch and the windows warm up; the road shimmers.
        gsap.to(glows, { attr: { fill: HOT }, duration: 0.25 });
        gsap.to(door, { attr: { fill: 'oklch(0.7 0.2 36)' }, duration: 0.25 });
        gsap.fromTo(attic, { opacity: 1 }, { opacity: 0.55, duration: 0.12, yoyo: true, repeat: 3 });
        gsap.to(refl, { scaleX: 1.25, transformOrigin: '50% 0%', duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: -1 });
        gsap.to(sheen, { opacity: 1, duration: 0.3 });
        if (p) this.move(p); else tilt(0, 0, true);
      },
      move(p) {
        if (!p || !live) return;
        const q = to(p), dx = clamp(q[0] / CW, -1, 1), dy = clamp(q[1] / CH, -1, 1);
        gsap.to(sheen, { x: q[0] + 20, duration: 0.3, overwrite: 'auto' });
        tilt(dx, dy, true);
      },
      leave() {
        live = false;
        fall?.kill(); chase?.kill(); fall = chase = null;
        gsap.to(rain, { opacity: 0, duration: 0.3, overwrite: true });
        gsap.to(bulbs, { opacity: 1, duration: 0.3, overwrite: true });
        gsap.to(glows, { attr: { fill: WARM }, duration: 0.5, overwrite: true });
        gsap.to(door, { attr: { fill: DOOR }, duration: 0.5, overwrite: true });
        gsap.to(refl, { scaleX: 1, duration: 0.4, overwrite: true });
        gsap.to(sheen, { opacity: 0, duration: 0.3 });
        tilt(0, 0, false);
      },
    };
  };

  // The emblem's card: white paper, a dark picture, the house in white.
  const embCard = `<path d="${CARD}" fill="#fff"/><path d="${PIC}" fill="#2e2e2e"/><path d="${PINES}" fill="#4a4a4a"/>
    <path d="M24 -4L37 -19L50 -4V13H24ZM-48 -14H-29L-27 -11V13H-48Z" fill="#555"/>
    <g transform="${HOUSE_T}"><path d="${HOUSE_SIL}" fill="#fff"/><path d="M-6 -1H1V8H-6ZM5 -1H17V5.5H5ZM-5 -18H1V-11H-5Z" fill="#8a8a8a"/></g>
    <path d="M37 -32H41V17.5H37Z" fill="#d0d0d0"/><path d="M${-PX} 17.5H${PX}V${ROAD}H${-PX}Z" fill="#bbb"/>
    <path d="M-7.9 ${ROAD}h8.5V${PB}h-8.5ZM4.3 ${ROAD}h15.9V27h-15.9Z" fill="#777"/><path d="${FLAP_D}" fill="#ccc"/>`;

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg, u) {
      svg.innerHTML = `<defs>
          <linearGradient id="${u}sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="oklch(0.32 0.07 265)"/>
            <stop offset="0.7" stop-color="oklch(0.5 0.09 285)"/>
            <stop offset="1" stop-color="oklch(0.66 0.1 330)"/>
          </linearGradient>
          <clipPath id="${u}clip"><rect x="22" y="34" width="84" height="56"/></clipPath>
        </defs>
        <rect x="14" y="26" width="100" height="76" rx="3" fill="oklch(0.94 0.03 90)"/>
        <rect x="22" y="34" width="84" height="56" fill="url(#${u}sky)"/>
        <g clip-path="url(#${u}clip)">
          <rect x="22" y="78" width="84" height="12" fill="oklch(0.26 0.03 275)"/>
          <path d="M46 78V62L60 50L74 62V78Z" fill="oklch(0.36 0.06 200)"/>
          <path d="M42 64L60 48L78 64" fill="none" stroke="oklch(0.2 0.03 285)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
          <rect x="51" y="66" width="8" height="7" fill="oklch(0.88 0.12 82)"/>
          <rect x="51" y="80" width="8" height="5" fill="oklch(0.6 0.1 82)" opacity="0.5"/>
          <rect x="88" y="44" width="2" height="34" fill="oklch(0.2 0.02 270)"/>
          <path d="M22 50Q56 56 89 48Q98 50 106 49" fill="none" stroke="oklch(0.2 0.02 270)" stroke-width="1"/>
          <g class="rain" stroke="oklch(0.86 0.04 250)" stroke-width="1" stroke-linecap="round" opacity="0.55">
            <path d="M30 20l-3 9M44 26l-3 9M58 18l-3 9M72 28l-3 9M86 22l-3 9M100 26l-3 9M36 44l-3 9M52 40l-3 9M66 46l-3 9M80 38l-3 9M96 44l-3 9M28 62l-3 9M42 58l-3 9M70 64l-3 9M84 60l-3 9M98 66l-3 9"/>
          </g>
        </g>`;
      const rain = svg.querySelector('.rain');
      let tl = null;
      return {
        enter() { tl?.kill(); tl = gsap.fromTo(rain, { x: 6, y: -18 }, { x: 0, y: 0, duration: 0.5, ease: 'none', repeat: -1 }); },
        move() {},
        leave() { tl?.kill(); tl = null; gsap.to(rain, { x: 0, y: 0, duration: 0.2, overwrite: true }); },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // One postcard, free on the ground, at a slight tilt.
  const ROT = -5;
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [9, 24, 110, 84],
    idea: 'The postcard itself, with card 1 of the toy on its face: East 4th at 4:52 pm in the rain. The ochre gable house under a deep indigo sky, dark pines behind it, the porch beam with its string of party bulbs, the glowing red door, the warm window with the cat, the blue attic window. The wooden pole and its wires at the right, the lit neighbours either side, the wet road holding every light as a streak. The lower right corner folds up to show the card\'s back. Enter: rain falls, the bulbs chase, the windows warm and the road shimmers; the card lifts and tilts after the pointer under a gloss sheen.',
    art(svg, u) {
      svg.innerHTML = `<defs>${cardDefs(u)}</defs>
        <ellipse class="shadow" cx="64" cy="104" rx="44" ry="5" fill="oklch(0.05 0.01 275)" opacity="0.55" filter="url(#${u}b)"/>
        <g class="card" transform="translate(64 64) rotate(${ROT})">${cardMarkup(u)}</g>`;
      const card = svg.querySelector('.card'), shadow = svg.querySelector('.shadow');
      gsap.set(card, { svgOrigin: '0 0', x: 64, y: 64, rotation: ROT });
      const rad = (ROT * Math.PI) / 180;
      const to = p => { const x = p[0] - 64, y = p[1] - 64; return [x * Math.cos(rad) + y * Math.sin(rad), -x * Math.sin(rad) + y * Math.cos(rad)]; };
      return life(svg, to, (dx, dy, up) => {
        gsap.to(card, { rotation: ROT + dx * 4, y: 64 - (up ? 4 : 0) + dy * 1.5, scale: up ? 1.03 : 1, duration: up ? 0.4 : 0.9, ease: up ? 'power2.out' : 'elastic.out(1, 0.45)', overwrite: 'auto' });
        gsap.to(shadow, { opacity: up ? 0.32 : 0.55, attr: { rx: up ? 40 : 44 }, duration: 0.4, overwrite: 'auto' });
      });
    },
    emblem: `${EMB_HEAD}<g transform="translate(64 64) rotate(${ROT})">${embCard}</g></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A stack of postcards is the block.
  // The hero card stands on it.
  const DCY = 80, HALF = 28, T = 15, KD = 0.78;
  const iso = (a, b) => [64 + (a - b) * 0.866, DCY + (a + b) * 0.5];
  const [N, E, S, W] = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([a, b]) => iso(a, b));
  const dn = (p, t) => [p[0], p[1] + t];
  // Card edges show as bands: cream, red and violet.
  const BANDS = ['oklch(0.92 0.03 88)', 'oklch(0.62 0.2 30)', 'oklch(0.86 0.035 82)', 'oklch(0.46 0.11 285)', 'oklch(0.92 0.03 88)'];
  const BH = T / BANDS.length;
  const face = (a, b, shade) => BANDS.map((c, i) => `<path d="${poly([dn(a, i * BH), dn(b, i * BH), dn(b, (i + 1) * BH), dn(a, (i + 1) * BH)])}" fill="${c}"/>`).join('') +
    `<path d="${poly([a, b, dn(b, T), dn(a, T)])}" fill="oklch(0.1 0.02 280)" opacity="${shade}"/>`;
  // The top card lies face down: its back shows a red stamp.
  const STAMP = poly([iso(10, 6), iso(22, 6), iso(22, 18), iso(10, 18)]);
  const STAMP_IN = poly([iso(12, 8), iso(20, 8), iso(20, 16), iso(12, 16)]);
  // The standing card's foot sits on the block's centre line.
  const FOOT = DCY + 4;
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [15, 27, 98, 97],
    idea: 'A stack of postcards is the block: card edges in bands on the faces, cream with a red card and a violet card among them, mid on the left and dark on the right. The top card lies face down with a red stamp. The hero card stands up on the stack, facing out, with the same rainy East 4th scene. Enter: the card rocks after the pointer, rain falls, the bulbs chase and the windows warm.',
    art(svg, u) {
      svg.innerHTML = `<defs>${cardDefs(u)}${lg(`${u}top`, BACK, 'x1="0.2" y1="0" x2="0.6" y2="1"')}</defs>
        <path d="${poly([E, S, W, dn(W, T), dn(S, T), dn(E, T)])}" fill="oklch(0.05 0.01 290)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 4)"/>
        ${face(W, S, 0.1)}${face(S, E, 0.42)}
        <path d="${poly([N, E, S, W])}" fill="url(#${u}top)"/>
        <path d="${STAMP}" fill="oklch(0.58 0.19 30)"/><path d="${STAMP_IN}" fill="oklch(0.8 0.09 60)"/>
        <path d="${poly([N, E, S, W])}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <ellipse class="cs" cx="64" cy="${FOOT}" rx="36" ry="4" fill="oklch(0.1 0.02 280)" opacity="0.4" filter="url(#${u}g)"/>
        <g class="stand" transform="translate(64 ${FOOT})"><g transform="translate(0 ${-CH * KD}) scale(${KD})">${cardMarkup(u)}</g></g>`;
      const stand = svg.querySelector('.stand'), cs = svg.querySelector('.cs');
      gsap.set(stand, { svgOrigin: '0 0', x: 64, y: FOOT });
      // A tile point goes back to the card frame.
      const to = p => [(p[0] - 64) / KD, (p[1] - FOOT) / KD + CH];
      return life(svg, to, (dx, dy, up) => {
        gsap.to(stand, { rotation: up ? dx * 5 : 0, y: FOOT - (up ? 2 : 0), duration: up ? 0.4 : 0.9, ease: up ? 'power2.out' : 'elastic.out(1, 0.4)', overwrite: 'auto' });
        gsap.to(cs, { opacity: up ? 0.28 : 0.4, duration: 0.4, overwrite: 'auto' });
      });
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, dn(S, T), dn(W, T)])}" fill="#5a5a5a"/><path d="${poly([S, E, dn(E, T), dn(S, T)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/><path d="${STAMP}" fill="#555"/><g transform="translate(64 ${FOOT - CH * KD}) scale(${KD})">${embCard}</g></svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = 'East Van postcards';
  // Each icon frames its drawing: the long side fills 110.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-postcard';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `postcard-${D.l.toLowerCase()}`;
    // The emblem rides in the page; a file link shows it too.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
