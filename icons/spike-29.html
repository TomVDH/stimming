<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 29</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; -webkit-mask: var(--emblem) center / contain no-repeat; -webkit-mask-source-type: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike 29</h1>
<p class="lede">Ten seconds, round 2: four live miniatures of the toy itself, drawn by code, steered by the pointer. No horizon box, no ring. Each shows at 256, 128 and 64. Move the pointer over a tile.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const set = (e, a) => { for (const k in a) e.setAttribute(k, a[k]); };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const polyD = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  // A seeded random stream, so every tile draws the same marsh.
  const rng = seed => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';

  /* ================= Shared kit ================= */

  const SHADOW = 'oklch(0.07 0.01 265)';
  const HOT = 'oklch(0.99 0.03 95)', GOLD = 'oklch(0.9 0.15 85)', EMBER = 'oklch(0.72 0.17 45)';
  const rad = (defs, id, cx, cy, r, stops) => {
    const g = el('radialGradient', { id, cx, cy, r }, defs);
    stops.forEach(([o, c, a = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g));
    return g;
  };
  const glowF = (defs, id, sd = 1.6) => {
    const g = el('filter', { id, x: -0.5, y: -0.5, width: 2, height: 2 }, defs);
    el('feGaussianBlur', { stdDeviation: sd, result: 'b' }, g);
    const m = el('feMerge', {}, g);
    el('feMergeNode', { in: 'b' }, m);
    el('feMergeNode', { in: 'SourceGraphic' }, m);
  };
  // A square block with a hard offset shadow. Returns both, so a direction can move them.
  const block = (svg, fill) => {
    const sh = el('rect', { x: 20, y: 20, width: 94, height: 94, fill: SHADOW }, svg);
    const face = el('rect', { x: 14, y: 14, width: 94, height: 94, fill }, svg);
    return { sh, face };
  };
  const clipBlock = (defs, id) => { const c = el('clipPath', { id }, defs); el('rect', { x: 14, y: 14, width: 94, height: 94 }, c); return `url(#${id})`; };
  // A control: aim from the pointer, a demo on focus, a rest on leave.
  const ctl = ({ aim, rest, demo, enter = () => {}, leave = () => {} }) => {
    let tl = null;
    return {
      enter(p) { enter(); if (p) aim(p); else tl = demo(); },
      move(p) { if (p && !tl) aim(p); },
      leave() { tl?.kill(); tl = null; leave(); rest(); },
    };
  };
  // A tweened scalar with a draw callback.
  const knob = (v, draw) => {
    const st = { v };
    draw(st.v);
    return {
      st,
      to(v, d = 0.35, ease = 'power2.out') { gsap.to(st, { v, duration: d, ease, overwrite: 'auto', onUpdate: () => draw(st.v) }); },
      sweep(a, b, d = 1.8) { return gsap.fromTo(st, { v: a }, { v: b, duration: d, ease: 'sine.inOut', yoyo: true, repeat: -1, onUpdate: () => draw(st.v) }); },
    };
  };

  /* ================= Current: the menu tile today ================= */

  const CURRENT_ART = (svg, id) => {
    const defs = el('defs', {}, svg);
    const lin = (gid, stops) => { const g = el('linearGradient', { id: gid, x1: 0, y1: stops.y1, x2: 0, y2: stops.y2, gradientUnits: 'userSpaceOnUse' }, defs); stops.s.forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, g)); };
    lin(`${id}sky`, { y1: 16, y2: 80, s: [[0, 'oklch(0.2 0.06 270)'], [0.7, 'oklch(0.32 0.08 320)'], [1, 'oklch(0.66 0.14 50)']] });
    lin(`${id}glow`, { y1: 80, y2: 30, s: [[0, 'oklch(0.5 0.03 270)'], [0.55, 'oklch(0.58 0.04 270)'], [0.8, 'oklch(0.88 0.14 80)']] });
    const c = el('clipPath', { id: `${id}c` }, defs); el('rect', { x: 16, y: 16, width: 92, height: 92 }, c);
    el('rect', { x: 22, y: 22, width: 92, height: 92, fill: 'oklch(0.07 0.01 260)' }, svg);
    el('rect', { x: 16, y: 16, width: 92, height: 92, fill: `url(#${id}sky)` }, svg);
    const g = el('g', { 'clip-path': `url(#${id}c)` }, svg);
    const plume = el('path', { d: 'M58 80C58 66 59 52 66 34', stroke: `url(#${id}glow)`, 'stroke-width': 3.2, 'stroke-linecap': 'round', fill: 'none' }, g);
    const rocket = el('circle', { cx: 61, cy: 57, r: 2.4, fill: 'oklch(0.97 0.05 90)' }, g);
    el('rect', { x: 16, y: 78, width: 92, height: 3, fill: 'oklch(0.11 0.02 280)' }, g);
    el('rect', { x: 16, y: 81, width: 92, height: 27, fill: 'oklch(0.2 0.05 310)' }, g);
    el('rect', { x: 16, y: 81, width: 92, height: 2, fill: 'oklch(0.55 0.12 45)', opacity: 0.7 }, g);
    const reeds = el('g', { stroke: 'oklch(0.08 0.01 280)', 'stroke-width': 1.6, 'stroke-linecap': 'square', fill: 'oklch(0.08 0.01 280)' }, g);
    el('path', { d: 'M20 108L18 86M25 108L27 82M30 108L29 90M34 108L37 94M90 108L88 92M95 108L98 80M100 108L102 86M105 108L103 90' }, reeds);
    el('path', { d: 'M16 108V98L24 96L32 99L40 104L48 108ZM84 108L90 101L98 97L108 96V108Z', stroke: 'none' }, reeds);
    const st = { p: 0.55 };
    const len = plume.getTotalLength() || 60;
    plume.style.strokeDasharray = len;
    const draw = () => { const pt = plume.getPointAtLength(st.p * len); set(rocket, { cx: f(pt.x), cy: f(pt.y) }); plume.style.strokeDashoffset = f(len * (1 - st.p)); };
    draw();
    let flight = null;
    const fly = () => { st.p = 0; draw(); flight = gsap.to(st, { p: 1, duration: 1.6, ease: 'power2.in', onUpdate: draw, onComplete: () => { flight = gsap.delayedCall(0.3, fly); } }); };
    return ctl({
      aim() {},
      enter() { if (!flight) fly(); },
      rest() { flight?.kill(); flight = null; gsap.fromTo(st, { p: 0 }, { p: 0.55, duration: 0.5, ease: 'power1.out', overwrite: true, onUpdate: draw }); },
      demo: () => ({ kill() {} }),
    });
  };

  /* ================= Round 2: live miniatures ================= */

  // A plume column: puffs along a bent path, each a dark body and a lit body on top.
  const PLUME = (() => {
    const r = rng(41);
    const P0 = [42, 116], P1 = [46, 62], P2 = [90, 20];
    const at = t => [(1 - t) * (1 - t) * P0[0] + 2 * (1 - t) * t * P1[0] + t * t * P2[0], (1 - t) * (1 - t) * P0[1] + 2 * (1 - t) * t * P1[1] + t * t * P2[1]];
    const N = 46, puffs = [];
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1), p = at(t), q = at(Math.min(1, t + 0.01));
      const dx = q[0] - p[0], dy = q[1] - p[1], m = Math.hypot(dx, dy) || 1;
      const rad = 2.6 + 9.5 * Math.pow(t, 0.85), j = (r() - 0.5) * rad * 0.7;
      puffs.push({ x: p[0] - (dy / m) * j, y: p[1] + (dx / m) * j, r: rad * (0.8 + 0.4 * r()), t });
    }
    return { puffs, head: at(1) };
  })();

  // Reeds: a seeded bed of tapered stalks with a plume wedge, each pivoting at its foot.
  const BED = (() => {
    const r = rng(7);
    const reeds = [];
    for (let i = 0; i < 120; i++) {
      const x = 12 + r() * 104, h = 26 + r() * 58, w = 0.9 + r() * 1.4, lean = (r() - 0.5) * 0.2, tone = Math.pow(r(), 2.2);
      reeds.push({ x, h, w, lean, tone, d: Math.abs(x - 64) });
    }
    reeds.sort((a, b) => a.h - b.h);
    return reeds;
  })();

  const DIRS = [
    {
      l: 'Current', name: 'Sky box',
      box: [10, 10, 110, 110],
      art: CURRENT_ART,
    },
    {
      l: 'A', name: 'Twilight plume',
      idea: 'The hero moment: a column of exhaust climbs a dark tile. Below the shadow line it is cold blue-grey; above it the sun, still under the horizon, lights it gold and rose. Pointer y is the Dawn slider: the shadow line falls and the plume lights from the top down.',
      box: [10, 10, 110, 110],
      art(svg, id) {
        const defs = el('defs', {}, svg);
        rad(defs, `${id}d`, 0.5, 0.5, 0.5, [[0, 'oklch(0.48 0.03 262)', 1], [0.72, 'oklch(0.34 0.03 266)', 0.9], [1, 'oklch(0.28 0.03 270)', 0]]);
        rad(defs, `${id}l`, 0.42, 0.4, 0.6, [[0, 'oklch(0.98 0.05 92)', 1], [0.55, 'oklch(0.88 0.14 72)', 1], [0.86, 'oklch(0.7 0.15 22)', 0.9], [1, 'oklch(0.6 0.14 15)', 0]]);
        glowF(defs, `${id}g`, 1.6);
        block(svg, 'oklch(0.13 0.022 268)');
        const inner = el('g', { 'clip-path': clipBlock(defs, `${id}c`) }, svg);
        // The shadow line's own faint edge: the air above it is a shade lighter.
        const sky = el('rect', { x: 14, width: 94, fill: 'oklch(0.2 0.04 300)', opacity: 0.55 }, inner);
        const dark = PLUME.puffs.map(p => el('circle', { cx: f(p.x), cy: f(p.y), r: f(p.r), fill: `url(#${id}d)` }, inner));
        const lit = PLUME.puffs.map(p => el('circle', { cx: f(p.x), cy: f(p.y), r: f(p.r * 1.08), fill: `url(#${id}l)` }, inner));
        const head = el('rect', { x: f(PLUME.head[0] - 1.8), y: f(PLUME.head[1] - 1.8), width: 3.6, height: 3.6, fill: HOT, filter: `url(#${id}g)` }, inner);
        const k = knob(0.42, u => {
          const sh = lerp(122, 12, u);
          set(sky, { y: f(sh - 60), height: f(60) });
          PLUME.puffs.forEach((p, i) => {
            const w = sstep(sh + 7, sh - 7, p.y);
            set(lit[i], { opacity: f(w) });
            set(dark[i], { opacity: f(1 - 0.5 * w) });
          });
          set(head, { opacity: f(sstep(sh + 4, sh - 4, PLUME.head[1])) });
        });
        return ctl({
          aim: p => k.to(clamp((118 - p[1]) / 100, 0, 1)),
          rest: () => k.to(0.42, 0.8, 'power3.out'),
          demo: () => k.sweep(0.05, 1, 2.4),
        });
      },
      emblem() {
        const sh = 62;
        const parts = PLUME.puffs.map(p => `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${f(p.r * 1.15)}" fill="${p.y < sh ? '#fff' : '#8a8a8a'}"/>`).join('\n  ');
        return `${EMB_HEAD}\n  ${parts}\n</svg>\n`;
      },
    },
    {
      l: 'B', name: 'Reed bed',
      idea: 'The foreground the toy hides behind: a hundred and twenty stalks on a dark tile, nothing else. On hover a speck flashes deep in the bed; a beat later a wave rolls out and every reed leans away as it passes. The sound, ten seconds after the light. Pointer x parks the wave.',
      box: [10, 10, 110, 110],
      art(svg, id) {
        const defs = el('defs', {}, svg);
        glowF(defs, `${id}g`, 2);
        block(svg, 'oklch(0.21 0.05 305)');
        const inner = el('g', { 'clip-path': clipBlock(defs, `${id}c`) }, svg);
        // Flat ground, a hair lighter than the sky, with the dawn's last warmth at the join.
        el('rect', { x: 14, y: 74, width: 94, height: 34, fill: 'oklch(0.16 0.03 300)' }, inner);
        el('rect', { x: 14, y: 73, width: 94, height: 1.2, fill: EMBER, opacity: 0.55 }, inner);
        const speck = el('rect', { x: 62.5, y: 69, width: 3, height: 3, fill: HOT, filter: `url(#${id}g)`, opacity: 0 }, inner);
        const groups = BED.map(rd => {
          const g = el('g', {}, inner);
          const top = [rd.x + rd.lean * rd.h, 108 - rd.h];
          const col = `oklch(${f(0.06 + 0.26 * rd.tone)} ${f(0.012 + 0.05 * rd.tone)} ${f(285 + 60 * rd.tone)})`;
          el('path', { d: polyD([[rd.x - rd.w, 108], [rd.x + rd.w, 108], [top[0] + rd.w * 0.35, top[1]], [top[0] - rd.w * 0.35, top[1]]]), fill: col }, g);
          // The plume: a slim wedge off the tip, leaning with the stalk.
          el('path', { d: polyD([[top[0] - 1.6, top[1] + 1], [top[0] + 1.6, top[1] + 1], [top[0] + 6 + rd.lean * 12, top[1] - 8 - rd.h * 0.1], [top[0] + 2, top[1] - 10 - rd.h * 0.12]]), fill: col }, g);
          return g;
        });
        const wave = knob(-30, R => {
          BED.forEach((rd, i) => {
            const d = rd.d - R, lean = Math.sign(rd.x - 64 || 1) * 17 * Math.exp(-(d * d) / 140) * sstep(130, 10, R);
            groups[i].setAttribute('transform', `rotate(${f(lean)} ${f(rd.x)} 108)`);
          });
        });
        let seq = null;
        const fire = () => {
          seq?.kill();
          seq = gsap.timeline()
            .fromTo(speck, { opacity: 1 }, { opacity: 0, duration: 0.45, ease: 'power2.in' }, 0)
            .fromTo(wave.st, { v: 0 }, { v: 125, duration: 1.3, ease: 'power1.out', onUpdate: () => wave.to(wave.st.v, 0) }, 0.5);
          return seq;
        };
        let loop = null;
        const start = () => { if (loop) return; fire(); loop = gsap.delayedCall(2.4, function again() { fire(); loop = gsap.delayedCall(2.4, again); }); };
        return ctl({
          aim: p => { if (loop) { loop.kill(); loop = null; seq?.kill(); } wave.to(clamp(Math.abs(p[0] - 64) * 1.9, 4, 125), 0.25); },
          rest() { loop?.kill(); loop = null; seq?.kill(); seq = null; set(speck, { opacity: 0 }); wave.to(-30, 0.7, 'power3.out'); },
          demo: () => { start(); return { kill() {} }; },
          enter: start,
        });
      },
      emblem() {
        const parts = BED.filter((_, i) => i % 2 === 0).map(rd => { const top = [rd.x + rd.lean * rd.h, 118 - rd.h * 1.1]; return `<path d="${polyD([[rd.x - rd.w * 1.4, 118], [rd.x + rd.w * 1.4, 118], [top[0] + 0.6, top[1]], [top[0] - 0.6, top[1]]])}" fill="#fff"/>`; }).join('\n  ');
        return `${EMB_HEAD}\n  ${parts}\n  <rect x="60" y="66" width="8" height="8" fill="#fff"/>\n</svg>\n`;
      },
    },
    {
      l: 'C', name: 'Late shadow',
      idea: 'Nothing drawn but the block. On hover the face flashes white: the light. The hard shadow waits, then kicks loose and judders back: the sound, late. Ten ticks along the base count the gap. The menu kit itself tells the joke.',
      box: [10, 10, 110, 110],
      art(svg, id) {
        const FACE = 'oklch(0.24 0.06 305)';
        const { sh, face } = block(svg, FACE);
        const TICK = 'oklch(0.33 0.05 305)';
        const ticks = Array.from({ length: 10 }, (_, i) => el('rect', { x: f(22 + i * 8.4), y: 98, width: 3.2, height: 5, fill: TICK }, svg));
        const inner = el('g', {}, svg);
        // The flash is a white sheet over the face; colours never tween, opacity does.
        const flash = el('rect', { x: 14, y: 14, width: 94, height: 94, fill: HOT, opacity: 0 }, inner);
        const ring = el('circle', { cx: 61, cy: 61, r: 6, fill: 'none', stroke: SHADOW, 'stroke-width': 2, opacity: 0 }, inner);
        let seq = null;
        const reset = () => { set(face, { x: 14, y: 14 }); set(flash, { opacity: 0 }); set(sh, { x: 20, y: 20 }); ticks.forEach(t => set(t, { fill: TICK })); set(ring, { opacity: 0 }); };
        const fire = () => {
          seq?.kill(); reset();
          const tl = gsap.timeline();
          // The light: a white flash that cools over a third of a second.
          tl.set(flash, { opacity: 1 }, 0).to(flash, { opacity: 0, duration: 0.35, ease: 'power2.out' }, 0.05);
          // The count: ten ticks, one every twentieth of a second.
          ticks.forEach((t, i) => tl.set(t, { attr: { fill: GOLD } }, 0.1 + i * 0.05));
          // The sound: the shadow kicks away and judders back; a dark ring crosses the face.
          tl.to(sh, { attr: { x: 27, y: 27 }, duration: 0.06, ease: 'power1.in' }, 0.62)
            .to(sh, { attr: { x: 20, y: 20 }, duration: 0.6, ease: 'elastic.out(1.2, 0.3)' }, 0.68)
            .to(face, { attr: { x: 13, y: 15 }, duration: 0.04, yoyo: true, repeat: 3 }, 0.62)
            .set(face, { attr: { x: 14, y: 14 } }, 0.8)
            .fromTo(ring, { attr: { r: 4 }, opacity: 0.7 }, { attr: { r: 78 }, opacity: 0, duration: 0.55, ease: 'power1.out' }, 0.62)
            .call(() => ticks.forEach(t => set(t, { fill: TICK })), null, 1.4);
          seq = tl;
          return tl;
        };
        let loop = null;
        const start = () => { if (loop) return; fire(); loop = gsap.delayedCall(2.2, function again() { fire(); loop = gsap.delayedCall(2.2, again); }); };
        return ctl({
          aim() {},
          rest() { loop?.kill(); loop = null; seq?.kill(); seq = null; gsap.killTweensOf([face, sh, ring, flash]); reset(); },
          demo: () => { start(); return { kill() {} }; },
          enter: start,
        });
      },
      emblem() {
        const ticks = Array.from({ length: 10 }, (_, i) => `<rect x="${f(22 + i * 8.6)}" y="100" width="4" height="8" fill="#fff"/>`).join('\n  ');
        return `${EMB_HEAD}
  <rect x="22" y="22" width="90" height="90" fill="#8a8a8a"/>
  <rect x="14" y="14" width="90" height="90" fill="#fff"/>
  <rect x="26" y="26" width="66" height="66" fill="#000"/>
  ${ticks.replace(/fill="#fff"/g, 'fill="#000"')}
</svg>
`;
      },
    },
    {
      l: 'D', name: 'Ground cloud',
      idea: 'The liftoff cloud: from a hot core low on the tile, billows blast out to both sides along the ground, lit orange from within, then grow, darken and thin as they travel. Pointer x is the wind: the cloud leans and rolls to one side. Hover fires the blast again.',
      box: [10, 10, 110, 110],
      art(svg, id) {
        const defs = el('defs', {}, svg);
        rad(defs, `${id}p`, 0.45, 0.55, 0.5, [[0, 'oklch(0.96 0.07 80)', 1], [0.55, 'oklch(0.72 0.15 50)', 1], [0.85, 'oklch(0.45 0.1 40)', 0.9], [1, 'oklch(0.35 0.06 40)', 0]]);
        rad(defs, `${id}k`, 0.5, 0.45, 0.5, [[0, 'oklch(0.5 0.03 290)', 1], [0.7, 'oklch(0.32 0.03 292)', 0.95], [1, 'oklch(0.24 0.03 295)', 0]]);
        rad(defs, `${id}core`, 0.5, 0.5, 0.5, [[0, HOT, 1], [0.35, GOLD, 0.8], [1, EMBER, 0]]);
        block(svg, 'oklch(0.12 0.02 275)');
        const inner = el('g', { 'clip-path': clipBlock(defs, `${id}c`) }, svg);
        el('rect', { x: 14, y: 96, width: 94, height: 12, fill: 'oklch(0.09 0.012 280)' }, inner);
        const r = rng(19);
        // Each billow: a side, a birth time, a speed, a size, a wobble phase.
        const B = Array.from({ length: 36 }, (_, i) => ({ s: i % 2 ? 1 : -1, t0: r() * 0.55, v: 28 + r() * 40, k: 0.6 + r() * 0.8, ph: r() * 6.28, lift: 4 + r() * 10 }));
        const hot = B.map(() => el('circle', { fill: `url(#${id}p)`, opacity: 0 }, inner));
        const cold = B.map(() => el('circle', { fill: `url(#${id}k)`, opacity: 0 }, inner));
        const core = el('circle', { cx: 61, cy: 95, r: 7, fill: `url(#${id}core)`, opacity: 0 }, inner);
        const st = { t: 1.4, wind: 0 };
        const draw = () => {
          const T = st.t, W = st.wind;
          set(core, { opacity: f(clamp(1.1 - T * 0.6, 0, 1)), r: f(5 + 9 * clamp(T * 3, 0, 1)) });
          B.forEach((b, i) => {
            const a = T - b.t0;
            if (a <= 0) { set(hot[i], { opacity: 0 }); set(cold[i], { opacity: 0 }); return; }
            // Position: out along the ground, slowing; the wind carries every billow one way.
            const dist = b.v * (1 - Math.exp(-a * 1.6)) * 1.1, x = 61 + b.s * dist + W * a * 14, y = 95 - b.lift * (1 - Math.exp(-a * 2)) - Math.sin(b.ph + a * 3) * 1.5;
            const rad = (3 + 11 * b.k) * (0.4 + 0.6 * (1 - Math.exp(-a * 2.2)));
            const age = clamp(a / 1.6, 0, 1);
            set(hot[i], { cx: f(x), cy: f(y), r: f(rad), opacity: f(Math.pow(1 - age, 1.4)) });
            set(cold[i], { cx: f(x), cy: f(y), r: f(rad * 1.08), opacity: f(sstep(0.15, 0.7, age) * (1 - sstep(1.3, 1.9, a))) });
          });
        };
        draw();
        let seq = null, loop = null;
        const fire = () => { seq?.kill(); seq = gsap.fromTo(st, { t: 0 }, { t: 1.9, duration: 1.9, ease: 'none', onUpdate: draw }); return seq; };
        const start = () => { if (loop) return; fire(); loop = gsap.delayedCall(2.3, function again() { fire(); loop = gsap.delayedCall(2.3, again); }); };
        return ctl({
          aim: p => { gsap.to(st, { wind: clamp((p[0] - 61) / 40, -1, 1), duration: 0.3, overwrite: 'auto', onUpdate: draw }); start(); },
          rest() { loop?.kill(); loop = null; seq?.kill(); seq = null; gsap.to(st, { wind: 0, t: 1.4, duration: 0.6, overwrite: 'auto', onUpdate: draw }); },
          demo: () => { start(); return { kill() {} }; },
          enter: start,
        });
      },
      emblem() {
        const r = rng(19);
        const B = Array.from({ length: 36 }, (_, i) => ({ s: i % 2 ? 1 : -1, t0: r() * 0.55, v: 28 + r() * 40, k: 0.6 + r() * 0.8, ph: r() * 6.28, lift: 4 + r() * 10 }));
        const T = 0.75;
        const parts = B.map(b => { const a = T - b.t0; if (a <= 0) return ''; const dist = b.v * (1 - Math.exp(-a * 1.6)) * 1.1, x = 64 + b.s * dist, y = 92 - b.lift * (1 - Math.exp(-a * 2)); const rad = (3 + 11 * b.k) * (0.4 + 0.6 * (1 - Math.exp(-a * 2.2))); return `<circle cx="${f(x)}" cy="${f(y)}" r="${f(rad * 1.1)}" fill="${a < 0.35 ? '#fff' : '#8a8a8a'}"/>`; }).join('\n  ');
        return `${EMB_HEAD}\n  ${parts}\n  <circle cx="64" cy="92" r="9" fill="#fff"/>\n</svg>\n`;
      },
    },
  ];

  /* ================= Gallery ================= */

  const NAME = 'Ten seconds';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box === 'auto' ? svg.getBBox() : box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : { x: 14, y: 14, width: 100, height: 100 }, side = Math.max(b.width, b.height);
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-launch';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  window.CTL = {};
  for (const D of DIRS) {
    const file = `launch29-${D.l.toLowerCase()}`;
    const url = D.l === 'Current' ? '' : `spike/emblems/${file}.svg`;
    if (D.emblem) window.EMBLEMS[file] = D.emblem();
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = D.l === 'Current' ? 'launch-current' : file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tile => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      (window.CTL[D.l] ||= []).push({ c, svg });
      if (reduce) return;
      tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tile.addEventListener('pointermove', e => c.move(local(svg, e)));
      tile.addEventListener('pointerleave', () => c.leave());
      tile.addEventListener('focus', () => c.enter(null));
      tile.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
