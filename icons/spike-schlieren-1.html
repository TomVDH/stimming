<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Schlieren candle 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Schlieren candle 1</h1>
<p class="lede">Schlieren candle, round 1. A: a cream pillar candle; its heat rises as a knife-edged plume and leans away from the pointer. D: the candle is the block; the pointer turns the knife edge, so the bright side of the plume faces it.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const set = (e, a) => { for (const k in a) e.setAttribute(k, a[k]); };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } }, once: tick };
  };

  // The toy's colours: cream wax and the graphite of the knife edge.
  const WAX = ['oklch(0.96 0.035 85)', 'oklch(0.86 0.045 80)', 'oklch(0.68 0.05 72)'];
  const KNIFE = ['oklch(0.93 0.012 255)', 'oklch(0.62 0.012 255)', 'oklch(0.36 0.012 255)'];
  const FLAME = ['oklch(0.99 0.03 95)', 'oklch(0.9 0.13 85)', 'oklch(0.72 0.17 55)'];

  // A smooth closed path through the points, as Catmull-Rom curves.
  const loopPath = pts => {
    const n = pts.length, g = i => pts[(i + n) % n];
    let s = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < n; i++) {
      const a = g(i - 1), b = g(i), c = g(i + 1), d = g(i + 2);
      s += `C${f(b[0] + (c[0] - a[0]) / 6)} ${f(b[1] + (c[1] - a[1]) / 6)} ${f(c[0] - (d[0] - b[0]) / 6)} ${f(c[1] - (d[1] - b[1]) / 6)} ${f(c[0])} ${f(c[1])}`;
    }
    return s + 'Z';
  };
  // A ribbon round a centre line; w gives each point its half width.
  const ribbon = (pts, w) => {
    const L = [], R = [];
    pts.forEach((p, i) => {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1], n = Math.hypot(dx, dy) || 1;
      L.push([p[0] - (dy / n) * w[i], p[1] + (dx / n) * w[i]]);
      R.push([p[0] + (dy / n) * w[i], p[1] - (dx / n) * w[i]]);
    });
    return loopPath([...L, ...R.reverse()]);
  };
  // The heat plume: a column, a puff that rolls into two hooks, a wisp above.
  // P holds the phase, the waver and the lean; k scales the whole plume.
  const plume = (P, base, H, k = 1) => {
    const at = h => [base[0] + P.lean * h * h + P.amp * (0.4 + 5 * h * h) * Math.sin(P.ph + h * 7), base[1] - h * H];
    const col = Array.from({ length: 7 }, (_, i) => at((0.56 * i) / 6));
    const cw = col.map((_, i) => k * (1.6 + i * 0.75));
    const [cx, cy] = at(0.56);
    const hook = s => {
      const q = 1 + 0.16 * Math.sin(P.ph * 2 + s) + P.curl * 0.25;
      return [[cx, cy], [cx + s * 6 * q * k, cy - 8 * k], [cx + s * 14 * q * k, cy - 11 * k], [cx + s * 20 * q * k, cy - 7 * k], [cx + s * 20 * q * k, cy - 0.5 * k], [cx + s * 15 * q * k, cy + 1.5 * k]];
    };
    const hw = [6, 6.2, 5.6, 4.6, 3.6, 2.6].map(v => v * k);
    const top = Array.from({ length: 5 }, (_, i) => at(0.56 + (0.44 * i) / 4));
    const tw = [5, 4.4, 3.6, 2.8, 2].map(v => v * k);
    return ribbon(col, cw) + ribbon(hook(-1), hw) + ribbon(hook(1), hw) + ribbon(top, tw);
  };
  // A flame from its base to a tip that leans with the plume.
  const flamePath = (b, h, w, lean) => {
    const t = [b[0] + lean, b[1] - h];
    return `M${f(b[0])} ${f(b[1])}C${f(b[0] - w)} ${f(b[1] - 1)} ${f(b[0] - w * 0.9)} ${f(b[1] - h * 0.55)} ${f(t[0])} ${f(t[1])}C${f(b[0] + w * 0.9)} ${f(b[1] - h * 0.55)} ${f(b[0] + w)} ${f(b[1] - 1)} ${f(b[0])} ${f(b[1])}Z`;
  };
  // A spring that moves P toward its goal each frame.
  const spring = (P, G) => {
    for (const key of ['lean', 'amp', 'curl']) { P['v' + key] = ((P['v' + key] || 0) + (G[key] - P[key]) * 0.2) * 0.72; P[key] += P['v' + key]; }
  };
  const still = (P, G) => ['lean', 'amp', 'curl'].every(key => Math.abs(G[key] - P[key]) < 0.01 && Math.abs(P['v' + key] || 0) < 0.01);
  // The plume layers: the body, the shared light and a rim inside the edge.
  // An eroded copy masks the rim, so seams between ribbons stay hidden.
  const heatMarkup = (u, litOp) => `<filter id="${u}er" x="-10%" y="-10%" width="120%" height="120%"><feMorphology operator="erode" radius="2"/></filter>
        <mask id="${u}rm" maskUnits="userSpaceOnUse" x="-40" y="-40" width="208" height="208"><path class="m1" fill="#fff"/><path class="m2" fill="#000" filter="url(#${u}er)"/></mask>
        <g class="heat"><path class="hb" fill="url(#${u}heat)"/><path class="hl" fill="url(#${u}lit)" opacity="${litOp}"/><path class="hr" fill="url(#${u}rim)" mask="url(#${u}rm)"/></g>`;
  const heatEls = svg => ['.hb', '.hl', '.hr', '.m1', '.m2'].map(s => svg.querySelector(s));

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    box: [10, 10, 108, 108],
    art(svg, u) {
      svg.innerHTML = `
        <defs>
          <clipPath id="${u}disc"><circle cx="64" cy="64" r="50"/></clipPath>
          <filter id="${u}knife" x="0" y="0" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
            <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
            <feDiffuseLighting surfaceScale="3.2" diffuseConstant="1.05" lighting-color="oklch(0.86 0.006 260)">
              <feDistantLight azimuth="180" elevation="48"/>
            </feDiffuseLighting>
          </filter>
        </defs>
        <circle cx="64" cy="64" r="54" fill="oklch(0.2 0.008 260)"/>
        <g clip-path="url(#${u}disc)">
          <g filter="url(#${u}knife)" fill="none" stroke="oklch(0 0 0)" stroke-linecap="round">
            <path class="plume" stroke-width="5"/>
            <path class="hl" stroke-width="3.6"/>
            <path class="hr" stroke-width="3.6"/>
            <path class="top" stroke-width="3"/>
          </g>
          <path d="M57 86.5h14v42H57z" fill="oklch(0.09 0.006 260)"/>
          <path class="flame" d="M64 70.5c-2.6 4.6-3.2 8.6 0 11.8c3.2-3.2 2.6-7.2 0-11.8z" fill="oklch(0.97 0.035 85)"/>
          <path d="M64 86.5v-4.3" stroke="oklch(0.09 0.006 260)" stroke-width="1.1"/>
        </g>`;
      const q = s => svg.querySelector(s);
      const plumeEl = q('.plume'), hookL = q('.hl'), hookR = q('.hr'), top = q('.top'), flame = q('.flame');
      const P = { ph: 0, amp: 0.8, lean: 0 };
      // The centre line: laminar low down, wider and wilder higher up.
      const at = h => [64 + P.lean * h * h + P.amp * (0.5 + 9 * h * h) * Math.sin(P.ph + h * 8.5), 70 - h * 66];
      const path = pts => pts.reduce((s, c, i) => {
        if (!i) return `M${c[0].toFixed(1)} ${c[1].toFixed(1)}`;
        const a = pts[i - 2] || pts[i - 1], b = pts[i - 1], d = pts[i + 1] || c;
        return s + `C${(b[0] + (c[0] - a[0]) / 6).toFixed(1)} ${(b[1] + (c[1] - a[1]) / 6).toFixed(1)} ${(c[0] - (d[0] - b[0]) / 6).toFixed(1)} ${(c[1] - (d[1] - b[1]) / 6).toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)}`;
      }, '');
      const hook = s => {
        const [x, y] = at(0.54), k = 1 + 0.18 * Math.sin(P.ph * 2 + s);
        return [[x, y], [x + s * 4 * k, y - 6], [x + s * 10 * k, y - 8.5], [x + s * 14.5 * k, y - 5.5], [x + s * 14 * k, y - 0.5], [x + s * 10.5 * k, y + 1]];
      };
      const draw = () => {
        plumeEl.setAttribute('d', path(Array.from({ length: 7 }, (_, i) => at((0.54 * i) / 6))));
        hookL.setAttribute('d', path(hook(-1)));
        hookR.setAttribute('d', path(hook(1)));
        top.setAttribute('d', path(Array.from({ length: 6 }, (_, i) => at(0.6 + (0.46 * i) / 5))));
      };
      draw();
      let sway = null;
      return {
        // The column wavers and the flame flickers.
        enter(p) {
          sway?.kill();
          gsap.to(P, { amp: 1, duration: 0.6, ease: 'power2.out', overwrite: 'auto', onUpdate: draw });
          sway = gsap.timeline({ repeat: -1 })
            .to(P, { ph: `+=${Math.PI * 2}`, duration: 2.6, ease: 'none', onUpdate: draw }, 0)
            .to(flame, { scaleY: 0.86, scaleX: 1.08, svgOrigin: '64 82', duration: 0.18, ease: 'sine.inOut', yoyo: true, repeat: 13 }, 0);
          if (p) this.move(p);
        },
        // The hand pushes the plume away and stirs it.
        move(p) {
          if (!p) return;
          const dx = p[0] - 64;
          gsap.to(P, { lean: Math.max(-1, Math.min(1, -dx / 26)) * 18, amp: 1 + 1.2 * Math.exp(-(dx * dx) / 500), duration: 0.45, ease: 'power2.out', overwrite: 'auto', onUpdate: draw });
        },
        leave() {
          sway?.kill(); sway = null;
          gsap.to(P, { lean: 0, amp: 0.8, ph: Math.round(P.ph / (Math.PI * 2)) * Math.PI * 2, duration: 0.7, ease: 'power2.inOut', overwrite: 'auto', onUpdate: draw });
          gsap.to(flame, { scaleY: 1, scaleX: 1, svgOrigin: '64 82', duration: 0.3, overwrite: true });
        },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // A cream pillar candle; its heat plume rises above it.
  const A_FLAME = [64, 83], A_FH = 17, A_BASE = [64, 64], A_H = 58;
  const A_REST = { ph: 0.4, amp: 0.9, lean: 0, curl: 0 };
  const A_BODY = 'M45 84V112A19 5.2 0 0 0 83 112V84A19 5.2 0 0 1 45 84Z';
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [32, 6, 64, 113],
    idea: 'A cream pillar candle with a bold wax drip. Its heat rises as a knife-edged plume: light on the left, graphite on the right, as the mirror shows it. The plume and the flame lean away from the pointer and stir near it.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}
          ${lg(`${u}wax`, [[0, WAX[0]], [0.55, WAX[1]], [1, WAX[2]]], 'x1="0" y1="0" x2="1" y2="0"')}
          ${lg(`${u}pool`, [[0, 'oklch(0.9 0.07 82)'], [1, 'oklch(0.8 0.09 72)']])}
          ${lg(`${u}heat`, [[0, KNIFE[0]], [0.5, KNIFE[1]], [1, KNIFE[2]]], 'x1="0" y1="0" x2="1" y2="0"')}
          ${lg(`${u}fl`, [[0, FLAME[0]], [0.55, FLAME[1]], [1, FLAME[2]]], 'x1="0" y1="0" x2="0" y2="1"')}
          ${rg(`${u}glow`, [[0, 'oklch(0.9 0.12 80)', 0.55], [1, 'oklch(0.9 0.12 80)', 0]])}</defs>
        <ellipse cx="64" cy="117" rx="26" ry="3.4" fill="oklch(0.05 0.01 260)" opacity="0.55" filter="url(#${u}b)"/>
        ${heatMarkup(u, 0.55)}
        <path d="${A_BODY}" fill="url(#${u}wax)"/>
        <path d="${A_BODY}" fill="url(#${u}lit)"/>
        <path d="M69 88.8C69 94 68 99 70.5 103C73 106.5 77 105 76.5 99.5C76 95 76.5 91 76.5 87.6Z" fill="${WAX[0]}"/>
        <ellipse cx="64" cy="84" rx="19" ry="5.2" fill="${WAX[0]}"/>
        <ellipse cx="64" cy="84.6" rx="11" ry="2.8" fill="url(#${u}pool)"/>
        <path d="${A_BODY}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
        <circle class="glow" cx="64" cy="75" r="15" fill="url(#${u}glow)"/>
        <path class="flame" fill="url(#${u}fl)"/>
        <path d="M64 85V80.5" stroke="oklch(0.22 0.01 260)" stroke-width="2" stroke-linecap="round"/>`;
      const q = s => svg.querySelector(s);
      const heat = heatEls(svg), flame = q('.flame'), glow = q('.glow');
      const P = { ...A_REST }, G = { ...A_REST };
      let live = false;
      const draw = time => {
        if (live) P.ph = A_REST.ph + time * 2.4;
        spring(P, G);
        const d = plume(P, [A_BASE[0] + P.lean * 0.05, A_BASE[1]], A_H);
        heat.forEach(e => e.setAttribute('d', d));
        flame.setAttribute('d', flamePath(A_FLAME, A_FH * (1 + 0.05 * Math.sin(P.ph * 5)), 5.2, P.lean * 0.18));
        glow.setAttribute('opacity', f(0.85 + 0.15 * Math.sin(P.ph * 4)));
        // The clock stops once the pointer has left and the plume is at rest.
        if (!live && still(P, G)) loop.stop();
      };
      const loop = clock(draw);
      draw(0);
      let demo = null;
      return {
        enter(p) {
          live = true; loop.start();
          G.amp = 1.3;
          // With no pointer, a draught pushes the plume to and fro.
          if (!p) { demo = gsap.to(G, { lean: 12, duration: 1.4, yoyo: true, repeat: -1, ease: 'sine.inOut' }); return; }
          this.move(p);
        },
        move(p) {
          if (!p) return;
          demo?.kill(); demo = null;
          // The hand pushes the plume away; near the column it stirs.
          const dx = p[0] - 64;
          G.lean = clamp(-dx / 24, -1, 1) * 16;
          G.amp = 1.3 + 1.6 * Math.exp(-(dx * dx) / 300);
          G.curl = Math.exp(-(dx * dx) / 400) * clamp((90 - p[1]) / 60);
        },
        leave() {
          demo?.kill(); demo = null; live = false;
          Object.assign(G, { lean: 0, amp: A_REST.amp, curl: 0 });
          gsap.to(P, { ph: A_REST.ph, duration: 0.6, ease: 'power2.out' });
        },
      };
    },
    emblem: (() => {
      const d = plume(A_REST, [64, 62], 56);
      return `${EMB_HEAD}<path d="${A_BODY}" fill="#fff"/><ellipse cx="64" cy="84" rx="19" ry="5.2" fill="#fff"/><path d="${flamePath([64, 81], 15, 5, 0)}" fill="#fff"/><path d="${d}" fill="#bbb"/></svg>`;
    })(),
  });

  /* ================= D: Isometric block ================= */

  // The candle is the block: a square pillar of wax in 30 degree view.
  const C30 = Math.cos(Math.PI / 6), S30 = 0.5;
  const SIDE = 32, D_H = 36, TOP = [64, 72];
  // Corners of the top: back, right, front, left.
  const D_TOPC = [[0, -1], [1, 0], [0, 1], [-1, 0]].map(([a, b]) => [TOP[0] + a * SIDE * C30, TOP[1] + b * SIDE * S30]);
  const dn = p => [p[0], p[1] + D_H];
  const D_FLAME = [64, 71], D_FH = 16, D_BASE = [64, 53], D_PH = 50;
  const D_REST = { ph: 0.4, amp: 0.9, lean: 0, curl: 0 };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [34, 3, 60, 112],
    idea: 'The candle is the block: a square pillar of cream wax with a melt pool on top and a drip down its front. The pointer turns the knife edge, so the bright side of the plume faces it; near the flame the plume stirs.',
    art(svg, u) {
      const [b, r, fr, l] = D_TOPC;
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}
          ${lg(`${u}top`, [[0, WAX[0]], [1, 'oklch(0.91 0.04 83)']], 'x1="0" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}left`, [[0, 'oklch(0.85 0.045 80)'], [1, 'oklch(0.78 0.05 76)']])}
          ${lg(`${u}right`, [[0, 'oklch(0.66 0.05 72)'], [1, 'oklch(0.56 0.05 68)']])}
          ${lg(`${u}pool`, [[0, 'oklch(0.9 0.07 82)'], [1, 'oklch(0.8 0.09 72)']])}
          <linearGradient id="${u}heat" class="knife" x1="0" y1="0.5" x2="1" y2="0.5">
            <stop offset="0" style="stop-color: ${KNIFE[0]}"/><stop offset="0.5" style="stop-color: ${KNIFE[1]}"/><stop offset="1" style="stop-color: ${KNIFE[2]}"/></linearGradient>
          ${lg(`${u}fl`, [[0, FLAME[0]], [0.55, FLAME[1]], [1, FLAME[2]]])}
          ${rg(`${u}glow`, [[0, 'oklch(0.9 0.12 80)', 0.55], [1, 'oklch(0.9 0.12 80)', 0]])}</defs>
        <path d="${poly([r, fr, l, dn(l), dn(fr), dn(r)])}" fill="oklch(0.05 0.01 260)" opacity="0.5" filter="url(#${u}b)" transform="translate(3 4)"/>
        ${heatMarkup(u, 0.5)}
        <path d="${poly([l, fr, dn(fr), dn(l)])}" fill="url(#${u}left)"/>
        <path d="${poly([fr, r, dn(r), dn(fr)])}" fill="url(#${u}right)"/>
        <path d="${poly([b, r, fr, l])}" fill="url(#${u}top)"/>
        <path d="${poly([b, r, fr, l])}" fill="url(#${u}lit)" opacity="0.6"/>
        <ellipse cx="${TOP[0]}" cy="${TOP[1]}" rx="15" ry="8.6" fill="url(#${u}pool)"/>
        <path d="M${f(fr[0] - 15)} ${f(fr[1] - 8.6)}L${f(fr[0] - 9)} ${f(fr[1] - 5.2)}C${f(fr[0] - 9)} ${f(fr[1] + 6)} ${f(fr[0] - 8)} ${f(fr[1] + 12)} ${f(fr[0] - 11.5)} ${f(fr[1] + 13)}C${f(fr[0] - 15)} ${f(fr[1] + 13)} ${f(fr[0] - 15)} ${f(fr[1] + 4)} ${f(fr[0] - 15)} ${f(fr[1] - 8.6)}Z" fill="${WAX[0]}"/>
        <path d="M${f(l[0])} ${f(l[1])}L${f(fr[0])} ${f(fr[1])}L${f(r[0])} ${f(r[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" stroke-linejoin="round" fill="none"/>
        <path d="M${f(l[0])} ${f(l[1])}L${f(b[0])} ${f(b[1])}L${f(r[0])} ${f(r[1])}" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round" fill="none"/>
        <circle class="glow" cx="64" cy="62" r="14" fill="url(#${u}glow)"/>
        <path class="flame" fill="url(#${u}fl)"/>
        <path d="M64 73V68.5" stroke="oklch(0.22 0.01 260)" stroke-width="2" stroke-linecap="round"/>`;
      const q = s => svg.querySelector(s);
      const heat = heatEls(svg), flame = q('.flame'), glow = q('.glow'), knife = q('.knife');
      const P = { ...D_REST, knife: Math.PI }, G = { ...D_REST, knife: Math.PI };
      let live = false;
      const draw = time => {
        if (live) P.ph = D_REST.ph + time * 2.4;
        spring(P, G);
        // The knife angle takes the short way round to its goal.
        let da = G.knife - P.knife;
        da = Math.atan2(Math.sin(da), Math.cos(da));
        P.knife += da * 0.2;
        // The bright end of the gradient faces the knife angle.
        const c = Math.cos(P.knife) * 0.5, s = Math.sin(P.knife) * 0.5;
        set(knife, { x1: f(0.5 + c), y1: f(0.5 + s), x2: f(0.5 - c), y2: f(0.5 - s) });
        const d = plume(P, D_BASE, D_PH, 0.95);
        heat.forEach(e => e.setAttribute('d', d));
        flame.setAttribute('d', flamePath(D_FLAME, D_FH * (1 + 0.05 * Math.sin(P.ph * 5)), 5, P.lean * 0.18));
        glow.setAttribute('opacity', f(0.85 + 0.15 * Math.sin(P.ph * 4)));
        if (!live && still(P, G) && Math.abs(da) < 0.01) loop.stop();
      };
      const loop = clock(draw);
      draw(0);
      let demo = null;
      return {
        enter(p) {
          live = true; loop.start(); G.amp = 1.2;
          // With no pointer, the knife sweeps round by itself.
          if (!p) { demo = gsap.to(G, { knife: `+=${Math.PI * 2}`, duration: 4, repeat: -1, ease: 'none' }); return; }
          this.move(p);
        },
        move(p) {
          if (!p) return;
          demo?.kill(); demo = null;
          // The knife turns to the pointer, seen from the plume's middle.
          G.knife = Math.atan2(p[1] - 32, p[0] - 64);
          const dx = p[0] - 64;
          G.lean = clamp(-dx / 30, -1, 1) * 7;
          G.amp = 1.2 + 1.4 * Math.exp(-(dx * dx) / 300);
          G.curl = Math.exp(-(dx * dx) / 400) * clamp((80 - p[1]) / 60);
        },
        leave() {
          demo?.kill(); demo = null; live = false;
          G.knife = P.knife + Math.atan2(Math.sin(Math.PI - P.knife), Math.cos(Math.PI - P.knife));
          Object.assign(G, { lean: 0, amp: D_REST.amp, curl: 0 });
          gsap.to(P, { ph: D_REST.ph, duration: 0.6, ease: 'power2.out' });
        },
      };
    },
    emblem: (() => {
      const [b, r, fr, l] = D_TOPC;
      const d = plume(D_REST, D_BASE, D_PH, 0.95);
      return `${EMB_HEAD}<path d="${poly([l, fr, dn(fr), dn(l)])}" fill="#6a6a6a"/><path d="${poly([fr, r, dn(r), dn(fr)])}" fill="#444"/><path d="${poly([b, r, fr, l])}" fill="#9a9a9a"/><path d="${flamePath(D_FLAME, D_FH, 5, 0)}" fill="#fff"/><path d="${d}" fill="#fff"/></svg>`;
    })(),
  });

  /* ================= Gallery ================= */
  const NAME = 'Schlieren candle';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-schlieren';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `schlieren-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
