<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Cloud chamber 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Cloud chamber 1</h1>
<p class="lede">Cloud chamber, round 1. No pick yet. A: a glass drum on a black cold plate, the toy's tracks on its floor: the alpha star, a cosmic ray, a beta curl. D: a glass box on a black plate block, the tracks under the glass.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The menu tile's ids take the tile prefix, so three copies can live.
  const ids = (m, u) => m.replace(/id="([^"]+)"/g, `id="${u}$1"`).replace(/url\(#([^)]+)\)/g, `url(#${u}$1)`).replace(/href="#([^"]+)"/g, `href="#${u}$1"`);

  const DIRS = [];

  // The toy's tokens: a black cold plate, cold glass, white vapour tracks, a blue lamp mist.
  const PLATE = [[0, 'oklch(0.34 0.01 260)'], [1, 'oklch(0.12 0.01 260)']];
  const FLOOR = [[0, 'oklch(0.2 0.015 255)'], [1, 'oklch(0.1 0.01 260)']];
  const GLASS = [[0, 'oklch(0.9 0.03 220)', 0.22], [0.5, 'oklch(0.8 0.03 225)', 0.06], [1, 'oklch(0.9 0.03 220)', 0.2]];
  const TRACK = 'oklch(0.97 0.01 240)';
  const MIST = 'oklch(0.7 0.06 245)';

  /* ================= Current ================= */

  // The menu icon today: a dark square, an alpha star, a curling beta track.
  const CUR = `<rect x="16" y="16" width="92" height="92" fill="oklch(0.17 0.014 260)"/>
    <path d="M16 16H50L16 74Z" fill="oklch(0.24 0.02 250)" opacity="0.7"/>
    <g id="chamber-tracks" fill="none" stroke="oklch(0.96 0.01 240)" stroke-linecap="round">
      <g stroke-width="3.5">
        <path pathLength="1" d="M54 66L79.1 59.3"/>
        <path pathLength="1" d="M54 66L60.8 47.2"/>
        <path pathLength="1" d="M54 66L38.6 47.6"/>
        <path pathLength="1" d="M54 66L32.7 71.7"/>
        <path pathLength="1" d="M54 66L47.8 82.9"/>
        <path pathLength="1" d="M54 66L70.1 85.2"/>
      </g>
      <path pathLength="1" stroke-width="1.3" d="M56 64C70 50 92 40 98 54C102 64 92 70 88 63C85 58 90 55 92 58"/>
    </g>
    <circle cx="54" cy="66" r="2.2" fill="oklch(0.97 0.02 80)"/>`;
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    box: 'bbox',
    art(svg, u) {
      svg.innerHTML = ids(CUR, u);
      const tracks = svg.querySelectorAll(`#${u}chamber-tracks path`);
      let tl = null;
      return {
        enter() {
          tl = gsap.timeline({ repeat: -1, repeatDelay: 0.3 })
            .fromTo(tracks, { strokeDasharray: 1, strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, duration: 0.18, ease: 'power2.out', stagger: { each: 0.16, from: 'random' } })
            .to(tracks, { opacity: 0.15, duration: 1.1, ease: 'sine.in', stagger: 0.08 }, '+=0.4');
        },
        move() {},
        leave() { tl?.kill(); gsap.to(tracks, { strokeDashoffset: 0, opacity: 1, duration: 0.3, overwrite: true }); },
      };
    },
  });

  /* ================= The tracks ================= */

  // Tracks in floor units: the floor is the square from -1 to 1.
  // The source pin and its alpha star: short, fat, straight.
  const SRC = [-0.18, 0.12];
  const RAYS = [[-12, 0.66], [38, 0.58], [92, 0.52], [146, 0.72], [200, 0.6], [252, 0.55], [312, 0.64]];
  const MUON = [[-0.95, -0.42], [0.92, 0.5]];
  // The beta track: a light electron curls in the magnet field.
  const BETA = Array.from({ length: 28 }, (_, i) => { const t = i / 27, r = 0.24 * (1 - 0.62 * t), a = -0.6 + 3.2 * Math.PI * t; return [0.5 + r * Math.cos(a) - 0.12 * (1 - t), -0.12 + r * Math.sin(a)]; });
  const line = (pts, T) => 'M' + pts.map(p => T(p).map(f).join(' ')).join('L');
  const trackDefs = u => `<filter id="${u}glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  // T maps floor units to the viewBox; w scales the stroke widths.
  const tracks = (u, T, w = 1) => `<g fill="none" stroke="${TRACK}" stroke-linecap="round" filter="url(#${u}glow)">
      ${RAYS.map(([a, L]) => { const r = a * Math.PI / 180; return `<path class="ray" pathLength="1" stroke-width="${f(4.4 * w)}" d="${line([SRC, [SRC[0] + L * Math.cos(r), SRC[1] + L * Math.sin(r)]], T)}"/>`; }).join('')}
      <path class="muon" pathLength="1" stroke-width="${f(2 * w)}" d="${line(MUON, T)}"/>
      <path class="beta" pathLength="1" stroke-width="${f(1.8 * w)}" d="${line(BETA, T)}"/>
      <path class="hit" pathLength="1" stroke-width="${f(2.2 * w)}" d="M0 0" opacity="0"/>
    </g>
    <circle cx="${f(T(SRC)[0])}" cy="${f(T(SRC)[1])}" r="${f(2.6 * w)}" fill="oklch(0.92 0.06 80)"/>`;

  // The shared motion: the source fires its alpha star again and again; the tracks condense, then fade.
  // A cosmic ray streaks through the floor under the pointer on each burst. Leave lets the floor settle.
  // toFloor maps a viewBox point to floor units; T maps back.
  const run = (svg, T, toFloor) => {
    const rays = [...svg.querySelectorAll('.ray')], rest = [...svg.querySelectorAll('.muon, .beta')], hit = svg.querySelector('.hit');
    let tl = null, aim = [0.3, -0.2];
    // The cosmic ray: a long straight line through the aim; the floor clips it.
    const strike = () => {
      const a = (-30 + Math.random() * 60) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
      const ends = [-1.6, 1.6].map(k => [aim[0] + c * k, aim[1] + s * k]);
      hit.setAttribute('d', line(ends, T));
    };
    return {
      enter(p) {
        if (p) aim = toFloor(p).map(v => clamp(v, -0.9, 0.9));
        gsap.to(rest, { opacity: 0.12, duration: 0.5, overwrite: true });
        tl = gsap.timeline({ repeat: -1, repeatDelay: 0.25 })
          .call(strike)
          .fromTo(rays, { strokeDasharray: 1, strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, duration: 0.16, ease: 'power2.out', stagger: { each: 0.05, from: 'random' } })
          .fromTo(hit, { strokeDasharray: 1, strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, duration: 0.12, ease: 'none' }, 0.12)
          .to([...rays, hit], { opacity: 0.12, duration: 1.1, ease: 'sine.in', stagger: 0.04 }, '+=0.35');
      },
      move(p) { if (p) aim = toFloor(p).map(v => clamp(v, -0.9, 0.9)); },
      leave() {
        tl?.kill();
        gsap.to(rays, { strokeDashoffset: 0, opacity: 1, duration: 0.4, overwrite: true });
        gsap.to(rest, { opacity: 1, duration: 0.6, overwrite: true });
        gsap.to(hit, { opacity: 0, duration: 0.4, overwrite: true });
      },
    };
  };
  const tracksEmblem = (T, w = 1) => `<g fill="none" stroke="#fff" stroke-linecap="round">${RAYS.map(([a, L]) => { const r = a * Math.PI / 180; return `<path stroke-width="${f(4.2 * w)}" d="${line([SRC, [SRC[0] + L * Math.cos(r), SRC[1] + L * Math.sin(r)]], T)}"/>`; }).join('')}<path stroke-width="${f(2.6 * w)}" d="${line(MUON, T)}"/><path stroke-width="${f(2.4 * w)}" d="${line(BETA, T)}"/></g>`;

  /* ================= A: Shaded object ================= */

  // A glass drum on a black cold plate, seen from above and in front.
  const CX = 64, TOPY = 50, FLY = 74, RX = 50, RY = 27;
  const ell = (cx, cy, rx, ry) => `M${f(cx - rx)} ${f(cy)}A${f(rx)} ${f(ry)} 0 1 0 ${f(cx + rx)} ${f(cy)}A${f(rx)} ${f(ry)} 0 1 0 ${f(cx - rx)} ${f(cy)}Z`;
  const A_T = ([x, y]) => [CX + x * RX * 0.86, FLY + y * RY * 0.86];
  const A_FROM = p => [(p[0] - CX) / (RX * 0.86), (p[1] - FLY) / (RY * 0.86)];
  // The glass wall: the near half of the drum between rim and floor.
  const WALL = `M${CX - RX} ${TOPY}V${FLY}A${RX} ${RY} 0 0 0 ${CX + RX} ${FLY}V${TOPY}A${RX} ${RY} 0 0 1 ${CX - RX} ${TOPY}Z`;
  const PLATE_SIDE = `M${CX - RX - 6} ${FLY + 3}V${FLY + 11}A${RX + 6} ${RY + 4} 0 0 0 ${CX + RX + 6} ${FLY + 11}V${FLY + 3}Z`;
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [8, 21, 112, 98],
    idea: 'A cloud chamber as a lab object: a squat glass drum on a black cold plate, seen from above and in front. Through the glass the dark floor holds the tracks the toy draws: the fat white alpha star round its source pin, one long straight cosmic ray, one curling beta track, a blue mist from the lamp. The pointer fires the source: the star condenses ray by ray and fades, and a cosmic ray streaks through the floor under the pointer on each burst.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}m`, 5)}${trackDefs(u)}
          ${lg(`${u}plate`, PLATE)}${rg(`${u}floor`, FLOOR, 'cx="0.4" cy="0.4" r="0.7"')}${lg(`${u}glass`, GLASS, 'x1="0" y1="0" x2="1" y2="0"')}
          <clipPath id="${u}fl"><path d="${ell(CX, FLY, RX, RY)}"/></clipPath></defs>
        <ellipse cx="${CX}" cy="${FLY + 20}" rx="56" ry="10" fill="oklch(0.05 0.01 260)" opacity="0.6" filter="url(#${u}b)"/>
        <path d="${PLATE_SIDE}" fill="oklch(0.16 0.01 260)"/>
        ${body(ell(CX, FLY + 3, RX + 6, RY + 4), u, 'plate')}
        <path d="${ell(CX, FLY, RX, RY)}" fill="url(#${u}floor)"/>
        <g clip-path="url(#${u}fl)">
          <ellipse cx="${CX - 26}" cy="${FLY - 4}" rx="30" ry="12" fill="${MIST}" opacity="0.32" filter="url(#${u}m)"/>
          ${tracks(u, A_T)}
        </g>
        <path d="${WALL}" fill="url(#${u}glass)"/>
        <path d="${WALL}" fill="url(#${u}lit)" opacity="0.5"/>
        <path d="${ell(CX, TOPY, RX, RY)}" fill="oklch(0.9 0.02 220)" opacity="0.06"/>
        <path d="${ell(CX, TOPY, RX, RY)}" fill="none" stroke="oklch(0.95 0.02 220)" stroke-width="2.4" opacity="0.85"/>
        <path d="M${CX - RX} ${TOPY}V${FLY}M${CX + RX} ${TOPY}V${FLY}" stroke="url(#${u}rim)" stroke-width="2"/>
        <path d="M${CX - RX} ${FLY}A${RX} ${RY} 0 0 0 ${CX + RX} ${FLY}" fill="none" stroke="oklch(0.9 0.02 220)" stroke-width="2" opacity="0.5"/>
        <path d="M${CX - RX + 9} ${TOPY + 10}V${FLY + 6}" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.32"/>
        <path d="M${CX + RX - 8} ${TOPY + 10}V${FLY + 4}" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.22"/>`;
      return run(svg, A_T, A_FROM);
    },
    emblem: `${EMB_HEAD}<path d="${PLATE_SIDE}" fill="#fff"/><path d="${ell(CX, FLY + 3, RX + 6, RY + 4)}" fill="#fff"/><path d="${WALL}" fill="#5a5a5a"/><path d="${ell(CX, FLY, RX, RY)}" fill="#000"/>${tracksEmblem(A_T)}<path d="${ell(CX, TOPY, RX, RY)}" fill="none" stroke="#fff" stroke-width="4"/></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A black cold plate is the block; a glass box stands on it; the tracks lie on the plate.
  const CY = 74, HX = 30, HY = 30, PT = 9, G = 27, GH = 22;
  const iso = (gx, gy, h = 0) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5 - h];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = p => [p[0], p[1] + PT];
  const D_T = ([x, y]) => iso(x * 26, y * 26);
  const D_FROM = p => { const a = (p[0] - 64) / 0.866, b = (p[1] - CY) / 0.5; return [(a + b) / 2 / 26, (b - a) / 2 / 26]; };
  const g = (gx, gy, h) => iso(gx * G, gy * G, h);
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [12, 21, 104, 92],
    idea: 'The black cold plate is the block at 30 degrees: a dark top, a mid left face, a dark right face, a rim on the top edges. A glass box stands on it, its edges lit. The tracks lie on the plate under the glass: the alpha star round its pin, a cosmic ray, a beta curl, a blue mist. The pointer fires the source and sends a cosmic ray through the plate under it, as in A.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}m`, 5)}${trackDefs(u)}
          ${lg(`${u}top`, [[0, 'oklch(0.26 0.012 260)'], [1, 'oklch(0.14 0.01 260)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.3 0.01 260)'], [1, 'oklch(0.22 0.01 260)']])}
          ${lg(`${u}R`, [[0, 'oklch(0.16 0.01 260)'], [1, 'oklch(0.1 0.01 260)']])}
          ${lg(`${u}glass`, GLASS, 'x1="0" y1="0" x2="1" y2="0"')}
          <clipPath id="${u}fl"><path d="${poly([g(-1, -1, 0), g(1, -1, 0), g(1, 1, 0), g(-1, 1, 0)])}"/></clipPath></defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 260)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)" opacity="0.6"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="url(#${u}rim)" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="${poly([g(-1, -1, 0), g(-1, -1, GH), g(1, -1, GH), g(1, -1, 0)])}" fill="url(#${u}glass)" opacity="0.6"/>
        <path d="${poly([g(-1, -1, 0), g(-1, -1, GH), g(-1, 1, GH), g(-1, 1, 0)])}" fill="url(#${u}glass)" opacity="0.6"/>
        <g clip-path="url(#${u}fl)">
          <ellipse cx="${f(g(-0.6, 0.2, 0)[0])}" cy="${f(g(-0.6, 0.2, 0)[1])}" rx="22" ry="11" fill="${MIST}" opacity="0.3" filter="url(#${u}m)"/>
          ${tracks(u, D_T, 0.85)}
        </g>
        <path d="${poly([g(-1, 1, 0), g(-1, 1, GH), g(1, 1, GH), g(1, 1, 0)])}" fill="url(#${u}glass)"/>
        <path d="${poly([g(1, 1, 0), g(1, 1, GH), g(1, -1, GH), g(1, -1, 0)])}" fill="url(#${u}glass)"/>
        <path d="${poly([g(-1, -1, GH), g(1, -1, GH), g(1, 1, GH), g(-1, 1, GH)])}" fill="url(#${u}lit)" opacity="0.35"/>
        <path d="${poly([g(-1, -1, GH), g(1, -1, GH), g(1, 1, GH), g(-1, 1, GH)])}" fill="none" stroke="oklch(0.95 0.02 220)" stroke-width="2" stroke-linejoin="round" opacity="0.85"/>
        <path d="M${g(-1, 1, 0).map(f).join(' ')}V${f(g(-1, 1, GH)[1])}M${g(1, 1, 0).map(f).join(' ')}V${f(g(1, 1, GH)[1])}M${g(1, -1, 0).map(f).join(' ')}V${f(g(1, -1, GH)[1])}" stroke="oklch(0.95 0.02 220)" stroke-width="2" opacity="0.7"/>
        <path d="M${g(-1, 1, 0).map(f).join(' ')}L${g(1, 1, 0).map(f).join(' ')}L${g(1, -1, 0).map(f).join(' ')}" fill="none" stroke="oklch(0.9 0.02 220)" stroke-width="2" opacity="0.4"/>
        <path d="M${g(-0.7, 1, 6).map(f).join(' ')}L${g(-0.7, 1, GH - 6).map(f).join(' ')}" stroke="#fff" stroke-width="3.6" stroke-linecap="round" opacity="0.28"/>`;
      return run(svg, D_T, D_FROM);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#8a8a8a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#5a5a5a"/><path d="${poly([N, E, S, W])}" fill="#000"/>${tracksEmblem(D_T, 0.85)}<path d="${poly([g(-1, -1, GH), g(1, -1, GH), g(1, 1, GH), g(-1, 1, GH)])}" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M${g(-1, 1, 0).map(f).join(' ')}V${f(g(-1, 1, GH)[1])}M${g(1, 1, 0).map(f).join(' ')}V${f(g(1, 1, GH)[1])}M${g(1, -1, 0).map(f).join(' ')}V${f(g(1, -1, GH)[1])}" stroke="#fff" stroke-width="3"/><path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-width="3" fill="none"/></svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = "Cloud chamber";
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-chamber';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `chamber-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      // A menu tile with no data-box fits its drawn bounds, as the menu does.
      const bb = D.box === "bbox" && svg.getBBox();
      fitIcon(svg, bb ? [bb.x, bb.y, bb.width, bb.height] : D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
