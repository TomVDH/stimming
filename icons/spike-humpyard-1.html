<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Hump yard 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Hump yard 1</h1>
<p class="lede">Hump yard, round 1. No pick yet; A goes on the menu until Tom picks. A: a rust-red box van cresting the hump over a sparking retarder. D: the hump is the block, the van on its ridge.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const line = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L');
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // The same body, its three paths tagged for a redraw.
  const bodyP = (p, u, fill) => `<path data-p="${p}" fill="url(#${u}${fill})"/><path data-p="${p}" fill="url(#${u}lit)"/><path data-p="${p}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  const { sin, cos, atan2, hypot, PI } = Math;
  const rad = d => d * PI / 180;
  // A fixed hash: the same sparks on every load.
  const hash = i => { const x = sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  // An ellipse path, turned by a degrees about its centre.
  const ell = (cx, cy, rx, ry, a = 0) => {
    const t = a * PI / 180, c = cos(t), s = sin(t);
    const P = (x, y) => `${f(cx + x * c - y * s)} ${f(cy + x * s + y * c)}`;
    return `M${P(rx, 0)}A${f(rx)} ${f(ry)} ${f(a)} 1 1 ${P(-rx, 0)}A${f(rx)} ${f(ry)} ${f(a)} 1 1 ${P(rx, 0)}Z`;
  };
  // A spark: a pointed tail at (x, y), a round head toward (dx, dy).
  const streak = (x, y, dx, dy, len, w) => {
    const m = hypot(dx, dy), ux = dx / m, uy = dy / m, nx = -uy * w / 2, ny = ux * w / 2;
    const hx = x + ux * len, hy = y + uy * len;
    return `M${f(x)} ${f(y)}L${f(hx + nx)} ${f(hy + ny)}Q${f(hx + ux * w * 1.2)} ${f(hy + uy * w * 1.2)} ${f(hx - nx)} ${f(hy - ny)}Z`;
  };
  // A spray: n sparks fly back and down, some forward; d: origin of spark i.
  const spray = (n, origin, k = 1) => Array.from({ length: n }, (_, i) => {
    const fwd = i % 3 === 2;
    const a = rad(fwd ? 15 + 35 * hash(i) : 140 + 75 * hash(i + 20)), v = (15 + 13 * hash(i + 40)) * k;
    const [x, y] = origin(i);
    return { x, y, dx: f(cos(a) * v), dy: f(sin(a) * v) };
  });

  // The toy's tokens: a rust-red van, sodium light, warm ballast, hot sparks.
  const SODIUM = 'oklch(0.78 0.14 65)';
  const VAN = [[0, 'oklch(0.62 0.16 38)'], [0.5, 'oklch(0.5 0.15 33)'], [1, 'oklch(0.34 0.11 28)']];
  const VANEND = [[0, 'oklch(0.52 0.14 35)'], [1, 'oklch(0.3 0.09 28)']];
  const ROOF = [[0, 'oklch(0.84 0.07 74)'], [1, 'oklch(0.6 0.06 58)']];
  const STEEL = [[0, 'oklch(0.38 0.02 66)'], [1, 'oklch(0.17 0.01 250)']];
  const WHEEL = [[0, 'oklch(0.66 0.05 72)'], [0.6, 'oklch(0.42 0.03 62)'], [1, 'oklch(0.26 0.02 50)']];
  const BALLAST = [[0, 'oklch(0.48 0.045 64)'], [1, 'oklch(0.2 0.02 50)']];
  const RET = [[0, 'oklch(0.7 0.08 76)'], [1, 'oklch(0.36 0.03 60)']];
  const SPARK = [[0, 'oklch(0.99 0.04 95)'], [0.45, 'oklch(0.93 0.13 86)'], [1, 'oklch(0.78 0.17 60)']];
  const HALO = [[0, SODIUM, 0.34], [0.55, SODIUM, 0.1], [1, SODIUM, 0]];
  const HOT = [[0, 'oklch(0.9 0.14 80)', 0.9], [0.5, 'oklch(0.78 0.16 62)', 0.4], [1, 'oklch(0.7 0.16 55)', 0]];
  const RIB = 'oklch(0.42 0.13 31)', DOOR = 'oklch(0.46 0.13 33)', TRACKRAIL = 'oklch(0.3 0.06 30)';
  const PLATE = 'oklch(0.8 0.13 190)', FRAME = 'oklch(0.27 0.03 40)', BOX = 'oklch(0.56 0.03 70)', SHINE = 'oklch(0.86 0.1 75)';
  const defs = u => `${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}h`, 3)}
    ${lg(`${u}van`, VAN, 'x1="0.2" y1="0" x2="0.5" y2="1"')}${lg(`${u}end`, VANEND)}${lg(`${u}roof`, ROOF, 'x1="0" y1="0" x2="1" y2="1"')}
    ${lg(`${u}steel`, STEEL)}${lg(`${u}sole`, [[0, 'oklch(0.42 0.06 40)'], [1, 'oklch(0.22 0.03 35)']])}${rg(`${u}wheel`, WHEEL, 'cx="0.4" cy="0.35" r="0.65"')}${lg(`${u}ballast`, BALLAST)}${lg(`${u}ret`, RET)}
    ${rg(`${u}spark`, SPARK, 'cx="0.8" cy="0.5" r="0.7"')}${rg(`${u}halo`, HALO)}${rg(`${u}hot`, HOT)}`;

  // The shared motion: the van rolls off the crest into the retarder.
  // Sparks fly, the van clanks, fades, and the next van crests.
  // P: the van's place at rest, braked, recoiled, gone, back, at the crest.
  // The pointer leans the van on its springs.
  const run = (svg, M) => {
    const P = M.P, st = { x: P.rest, op: 1, lean: 0 };
    const sparks = svg.querySelectorAll('.spark'), rest = svg.querySelector('.rest'), glow = svg.querySelector('.glow');
    const draw = M.bind(svg);
    const pose = () => draw(st);
    pose();
    let tl = null;
    const cycle = () => gsap.timeline({ defaults: { onUpdate: pose } })
      .to(rest, { opacity: 0, duration: 0.15 }, 0)
      .to(st, { x: P.brake, duration: 0.75, ease: 'power2.out' }, 0)
      .fromTo(sparks, { x: 0, y: 0, opacity: 1, scale: 1 }, { keyframes: { x: [(i, d) => +d.dataset.dx * 0.6, (i, d) => +d.dataset.dx], y: [(i, d) => +d.dataset.dy * 0.6, (i, d) => +d.dataset.dy + P.drop] }, opacity: 0, scale: 0.5, svgOrigin: (i, d) => d.dataset.o, duration: 0.45, ease: 'power1.out', stagger: 0.05 }, 0)
      .fromTo(glow, { opacity: 0.6 }, { keyframes: { opacity: [1, 1, 0] }, duration: 0.8 }, 0)
      .to(st, { x: P.recoil, duration: 0.08, ease: 'power1.out' })
      .to(st, { x: P.brake, duration: 0.4, ease: 'elastic.out(1, 0.4)' })
      .to(st, { x: P.out, op: 0, duration: 0.3, ease: 'power1.in' })
      .set(st, { x: P.back })
      .to(st, { x: P.crest, op: 1, duration: 0.9, ease: 'sine.out' })
      .to(st, { x: P.rest, duration: 0.5, ease: 'power2.in' })
      .to(glow, { opacity: 0.6, duration: 0.3 }, '<');
    return {
      enter(p) {
        if (tl) tl.kill();
        tl = gsap.timeline({ repeat: -1, repeatDelay: 0.25 });
        if (Math.abs(st.x - P.rest) > 0.01 || st.op < 1) gsap.set(st, { x: P.rest, op: 1 });
        tl.add(cycle());
        if (p) this.move(p);
      },
      move(p) {
        if (!p) return;
        gsap.to(st, { lean: M.lean(p), duration: 0.4, overwrite: 'auto', onUpdate: pose });
      },
      leave() {
        if (tl) tl.kill();
        tl = null;
        gsap.to(st, { x: P.rest, op: 1, lean: 0, duration: 0.5, ease: 'power2.out', overwrite: 'auto', onUpdate: pose });
        gsap.to(sparks, { opacity: 0, duration: 0.2 });
        gsap.to(rest, { opacity: 1, duration: 0.3, delay: 0.3 });
        gsap.to(glow, { opacity: 0.6, duration: 0.3 });
      },
    };
  };
  // The sparks as markup: a static spray at rest, a pool for the burst.
  const sparkMarkup = (u, restS, pool) => `
      <g class="rest">${restS.map(s => `<path d="${streak(s.x, s.y, s.dx, s.dy, s.len, s.w)}" fill="url(#${u}spark)"/>`).join('')}</g>
      <g class="sparks">${pool.map(s => `<path class="spark" d="${streak(s.x, s.y, s.dx, s.dy, s.len, s.w)}" data-dx="${s.dx}" data-dy="${s.dy}" data-o="${f(s.x)} ${f(s.y)}" fill="url(#${u}spark)" opacity="0"/>`).join('')}</g>`;

  const DIRS = [];

  /* ================= Current ================= */

  // Hump yard is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // The hump is an arc of radius R; the crest sits at (64, 82).
  // The van turns about the arc's centre, so it rolls along the rail.
  const R = 160, OX = 64, OY = 82 + R, WR = 7.2;
  const arcP = (a, r) => [OX + r * sin(rad(a)), OY - r * cos(rad(a))];
  const arc = (r, a0, a1) => { const p = arcP(a0, r), q = arcP(a1, r); return `M${f(p[0])} ${f(p[1])}A${r} ${r} 0 0 1 ${f(q[0])} ${f(q[1])}`; };
  // A bogie sits 31 along the arc from the van's middle, turned to the rail.
  const BOG = 31, BOGA = (BOG / R) * 180 / PI;
  // The retarder grips the rail from 9 to 19 degrees past the crest.
  const RET0 = 9, RET1 = 19;
  // Spark origins: the front bogie's wheels on the retarder, at the van's place x.
  const contactA = (x, side) => arcP(x + BOGA + side * (8 / R) * 180 / PI, R + 2);
  // The burst follows the braking ease from 3 to 7 degrees.
  const PA = { drop: 12, rest: 3, brake: 7, recoil: 6.4, out: 8.5, back: -10, crest: -1 };
  const poolA = spray(12, i => { const t = clamp((i * 0.05) / 0.75), e = 1 - (1 - t) ** 2; return contactA(PA.rest + (PA.brake - PA.rest) * e, 1); }).map(s => ({ ...s, len: 7, w: 3.2 }));
  // The rest spray fans from the front wheel, back and down over the ballast.
  const restA = [[200, 13], [184, 17], [168, 15], [153, 12], [139, 8], [30, 9], [12, 7]].map(([a, len]) => {
    const [x, y] = contactA(PA.rest, 1), dx = cos(rad(a)), dy = sin(rad(a));
    return { x: x + dx * 2.5, y: y + dy * 2.5, dx, dy, len, w: 3.4 };
  });
  // A wheel: a steel disc, a bar that shows the turn, an axle box over it.
  const wheel = (u, x) => `<g class="wheel" data-c="${x} ${-WR}">${body(ell(x, -WR, WR, WR), u, 'wheel')}<rect x="${f(x - 5.6)}" y="${f(-WR - 1.5)}" width="11.2" height="3" rx="1.5" fill="oklch(0.3 0.02 50)"/></g>`;
  const bogie = (u, side) => {
    const a = side * BOGA, p = [R * sin(rad(a)), R * (1 - cos(rad(a)))];
    return `<g transform="translate(${f(p[0])} ${f(p[1])}) rotate(${f(a)})">
          ${wheel(u, -8)}${wheel(u, 8)}
          ${body('M-14 -19H14L7 -6H-7Z', u, 'steel')}
          <rect x="-10.2" y="-9.4" width="4.4" height="4.4" rx="1" fill="${BOX}"/><rect x="5.8" y="-9.4" width="4.4" height="4.4" rx="1" fill="${BOX}"/>
        </g>`;
  };
  // The van in its own frame: the rail top at its middle is the origin.
  // The far side shows up and to the left: the left end and the roof.
  // The sole bar joins the body to the bogies; the headstocks drop at the ends.
  const SOLE = 'M-47 -20H47V-8.5Q47 -7.5 46 -7.5H40V-11H-40V-7.5H-46Q-47 -7.5 -47 -8.5Z';
  const SIDE = 'M-44 -17L-44 -50Q0 -58 44 -50L44 -17Z';
  const END = 'M-44 -17L-44 -50L-51 -56L-51 -23Z';
  const ROOFD = 'M-44 -50Q0 -58 44 -50L37 -56Q-7 -64 -51 -56Z';
  const vanArt = u => `
      <g class="wagon"><g transform="translate(64 82)">
        ${bogie(u, -1)}${bogie(u, 1)}
        ${body(SOLE, u, 'sole')}
        <rect x="-53" y="-17" width="7" height="5" rx="2" fill="${BOX}"/><rect x="46" y="-17" width="7" height="5" rx="2" fill="${BOX}"/>
        <g class="vbody">
          ${body(END, u, 'end')}
          <path d="${SIDE}" fill="url(#${u}van)"/>
          ${[-40, -31, 31, 40].map(x => `<rect x="${x - 1.6}" y="-50" width="3.2" height="33" fill="${RIB}"/>`).join('')}
          <rect x="-13" y="-49" width="26" height="31" fill="${DOOR}"/>
          <rect x="-16" y="-50.5" width="42" height="3.4" fill="${TRACKRAIL}"/><rect x="-16" y="-20.4" width="42" height="3.4" fill="${TRACKRAIL}"/>
          <rect x="7" y="-36" width="3" height="9" rx="1.5" fill="${TRACKRAIL}"/>
          <rect x="-27" y="-31" width="12" height="7" rx="1" fill="${PLATE}"/>
          <path d="${SIDE}" fill="url(#${u}lit)"/>
          ${body(ROOFD, u, 'roof')}
          <path d="${SIDE}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
        </g>
      </g></g>`;
  const bindA = svg => {
    const wagon = svg.querySelector('.wagon'), vbody = svg.querySelector('.vbody'), wheels = [...svg.querySelectorAll('.wheel')];
    return st => {
      wagon.setAttribute('transform', `rotate(${f(st.x)} ${OX} ${OY})`);
      wagon.setAttribute('opacity', f(st.op));
      vbody.setAttribute('transform', `rotate(${f(st.lean)} 0 -17)`);
      wheels.forEach(w => w.setAttribute('transform', `rotate(${f(st.x * R / WR)} ${w.dataset.c})`));
    };
  };
  const MOUND = `${arc(R - 6, -27, 27)}L134 112L-6 112Z`;
  const retA = `${arc(R + 6.5, RET0, RET1)}L${arcP(RET1, R - 0.5).map(f).join(' ')}A${R - 0.5} ${R - 0.5} 0 0 0 ${arcP(RET0, R - 0.5).map(f).join(' ')}Z`;
  const hotA = arcP((RET0 + RET1) / 2 + 1, R + 2);
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [4, 16, 120, 96],
    idea: 'A rust-red box van with a sodium-lit roof crests the hump: its front bogie runs into the retarder on the far slope and sparks spray off the wheels over the dark ballast. Ribs, a sliding door and a teal track plate on its side; a sodium halo behind. The pointer leans the van on its springs; hover rolls it down into the retarder, sparks fly, it clanks, fades, and the next van comes over the crest.',
    art(svg, u) {
      svg.innerHTML = `<defs>${defs(u)}
          <mask id="${u}fade" maskUnits="userSpaceOnUse" x="-20" y="0" width="168" height="128"><rect x="-20" y="0" width="168" height="128" fill="url(#${u}fadeg)"/></mask>
          ${lg(`${u}fadeg`, [[0, '#000'], [0.16, '#fff'], [0.84, '#fff'], [1, '#000']], 'gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="128" y2="0"')}</defs>
        <ellipse cx="46" cy="46" rx="62" ry="48" fill="url(#${u}halo)"/>
        <g mask="url(#${u}fade)">
          ${body(MOUND, u, 'ballast')}
          <path d="${arc(R - 2.5, -27, 27)}" fill="none" stroke="oklch(0.32 0.02 60)" stroke-width="5"/>
          <path d="${arc(R - 1, -27, 27)}" fill="none" stroke="${SHINE}" stroke-width="2"/>
        </g>
        <ellipse class="glow" cx="${f(hotA[0])}" cy="${f(hotA[1])}" rx="20" ry="11" fill="url(#${u}hot)" opacity="0.6"/>
        ${vanArt(u)}
        ${body(retA, u, 'ret')}
        ${sparkMarkup(u, restA, poolA)}`;
      return run(svg, { P: PA, bind: bindA, lean: p => clamp((p[0] - 64) * 0.05, -3, 3) });
    },
    emblem: `${EMB_HEAD}<path d="${arc(R - 6, -22, 22)}L118 112L10 112Z" fill="#5a5a5a"/><path d="${arc(R - 2.5, -22, 22)}" fill="none" stroke="#9a9a9a" stroke-width="5"/>
      <g transform="rotate(${PA.rest} ${OX} ${OY}) translate(64 82)"><path d="${END}" fill="#c8c8c8"/><path d="${SIDE}" fill="#fff"/><path d="${ROOFD}" fill="#e6e6e6"/><rect x="-13" y="-49" width="26" height="31" fill="#b4b4b4"/><rect x="-27" y="-31" width="12" height="7" fill="#000"/>
      ${[-1, 1].map(side => { const a = side * BOGA, p = [R * sin(rad(a)), R * (1 - cos(rad(a)))]; return `<g transform="translate(${f(p[0])} ${f(p[1])}) rotate(${f(a)})"><path d="${ell(-8, -WR, WR, WR)}${ell(8, -WR, WR, WR)}" fill="#fff"/><path d="M-14 -19H14L7 -6H-7Z" fill="#8a8a8a"/></g>`; }).join('')}<path d="${SOLE}" fill="#5a5a5a"/></g>
      <path d="${retA}" fill="#8a8a8a"/>${restA.map(s => `<path d="${streak(s.x, s.y, s.dx, s.dy, s.len, s.w)}" fill="#fff"/>`).join('')}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The hump is the block: a ballast ridge with the track along its length.
  // Iso: gx runs down right, gy runs down left, z is up.
  const DCY = 66, HX = 40, HY = 17, T = 12, HA = 10;
  const iso = (gx, gy, z) => [64 + (gx - gy) * 0.866, DCY + (gx + gy) * 0.5 - z];
  // The ridge: a cosine bump, flat at both ends of the block.
  const hD = x => Math.abs(x) >= HX ? 0 : HA * 0.5 * (1 + cos(PI * x / HX));
  const slD = x => Math.abs(x) >= HX ? 0 : -HA * 0.5 * (PI / HX) * sin(PI * x / HX);
  const run2 = (a, b, n = 16) => Array.from({ length: n + 1 }, (_, i) => a + (b - a) * i / n);
  const edge = (gy, a, b, dz = 0) => run2(a, b).map(x => iso(x, gy, hD(x) + dz));
  const TOP_UP = poly([...edge(-HY, -HX, 0), ...edge(HY, 0, -HX)]);
  const TOP_DN = poly([...edge(-HY, 0, HX), ...edge(HY, HX, 0)]);
  const LEFT = poly([...edge(HY, -HX, HX), iso(HX, HY, -T), iso(-HX, HY, -T)]);
  const RIGHT = poly([iso(HX, -HY, 0), iso(HX, HY, 0), iso(HX, HY, -T), iso(HX, -HY, -T)]);
  const STRIP = poly([...edge(-6.5, -HX, HX), ...edge(6.5, HX, -HX)]);
  const SHADOW = poly([iso(HX, -HY, 0), iso(HX, HY, -T), iso(-HX, HY, -T), iso(-HX, HY, 0)]);
  // The van: half length L, half width W; the body runs from 10 to 27 over the pivots.
  // The wheels run on the rails, GA either side of the middle.
  const GA = 4.2, L = 26, W = 7.6, WB = 10, WT = 27, BUL = 2.6, BP = 15, DWR = 4.3;
  const RET0D = 12, RET1D = 32;
  const vanD = (s, lean = 0) => {
    const gr = s - BP, gf = s + BP, zr = hD(gr), zf = hD(gf);
    const oz = (zr + zf) / 2, ph = atan2(zf - zr, 2 * BP), c = cos(ph), sn = sin(ph), cl = cos(lean), sl = sin(lean);
    // A point in the van's frame: u along, v across, w up.
    const B = (u, v, w) => {
      const v2 = v * cl - (w - WB) * sl, w2 = WB + v * sl + (w - WB) * cl;
      return iso(s + u * c - w2 * sn, v2, oz + u * sn + w2 * c);
    };
    const roofW = v => WT + BUL * (1 - (v / W) ** 2);
    const across = (u, a, b) => run2(a, b, 8).map(v => B(u, v, roofW(v)));
    const quad = (u0, u1, w0, w1, v = W + 0.05) => poly([B(u0, v, w0), B(u1, v, w0), B(u1, v, w1), B(u0, v, w1)]);
    // A wheel stands on the rail at track place x; its circle lies in the plane gy.
    const wheelD = (x, gy, k = 1) => { const z = hD(x) + DWR, r = DWR * k; return poly(run2(0, 2 * PI, 20).map(t => iso(x + r * cos(t), gy, z + r * sin(t)))); };
    const frame = (gb, gy) => {
      const ps = atan2(slD(gb), 1), pc = cos(ps), pn = sin(ps), z = hD(gb);
      const Q = (a, b) => iso(gb + a * pc - b * pn, gy, z + a * pn + b * pc);
      return poly([Q(-4, 4.6), Q(4, 4.6), Q(8, 7.4), Q(-8, 7.4)]);
    };
    const wheels = (gy, k) => [gr - 5.8, gr + 5.8, gf - 5.8, gf + 5.8].map(x => wheelD(x, gy, k)).join('');
    return {
      far: wheels(-GA),
      near: wheels(GA),
      hubs: wheels(GA + 0.1, 0.42),
      frames: frame(gr, GA + 0.3) + frame(gf, GA + 0.3),
      under: quad(-L - 1, L + 1, 7.6, WB),
      side: quad(-L, L, WB, WT, W),
      end: poly([B(L, W, WB), B(L, -W, WB), ...across(L, -W, W)]),
      roof: poly([...across(-L, W, -W), ...across(L, -W, W)]),
      door: quad(-6.5, 6.5, 11, 25.4),
      ribs: [-21, 14, 21].map(u => quad(u - 1.3, u + 1.3, WB, WT)).join(''),
      drail: quad(-9, 18, 25, 26.8),
      plate: quad(-17, -10, 16, 21),
      contact: side => iso(gf + side * 5.8, GA + 1.4, hD(gf + side * 5.8) + 0.6),
    };
  };
  // The retarder: a steel beam outside the near rail on the down slope.
  const retTop = poly([...edge(GA + 1.2, RET0D, RET1D, 2.8), ...edge(GA + 3.8, RET1D, RET0D, 2.8)]);
  const retFace = poly([...edge(GA + 3.8, RET0D, RET1D, 2.8), ...edge(GA + 3.8, RET1D, RET0D, 0)]);
  const PD = { drop: 5, rest: 4, brake: 14, recoil: 12.8, out: 17, back: -14, crest: -2 };
  const poolD = spray(12, i => { const t = clamp((i * 0.05) / 0.75), e = 1 - (1 - t) ** 2; return vanD(PD.rest + (PD.brake - PD.rest) * e).contact(1); }, 0.75).map(s => ({ ...s, len: 5.5, w: 2.8 }));
  const restD = [[196, 10], [178, 13], [161, 12], [145, 9], [28, 7]].map(([a, len]) => {
    const [x, y] = vanD(PD.rest).contact(1), dx = cos(rad(a)), dy = sin(rad(a));
    return { x: x + dx * 2, y: y + dy * 2, dx, dy, len, w: 3 };
  });
  const hotD = iso((RET0D + RET1D) / 2 + 2, GA + 2, hD(24));
  const bindD = svg => {
    const parts = {};
    svg.querySelectorAll('[data-p]').forEach(e => (parts[e.dataset.p] ||= []).push(e));
    const wagon = svg.querySelector('.wagon');
    return st => {
      const g = vanD(st.x, st.lean);
      for (const k in parts) parts[k].forEach(e => e.setAttribute('d', g[k]));
      wagon.setAttribute('opacity', f(st.op));
    };
  };
  const rails = gy => line(run2(-HX, HX, 24).map(x => iso(x, gy, hD(x) + 0.6)));
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [8, 9, 112, 100],
    idea: 'The hump is the block at 30 degrees: a ballast ridge with a lit up slope, a shaded down slope, earth faces and a rim on the top edges; the track runs along the ridge. The rust-red van stands on the crest, its front bogie in the retarder on the down slope, sparks at its wheels. Hover rolls it down into the retarder and the next van crests, as A does; the pointer rocks the van on its springs.',
    art(svg, u) {
      svg.innerHTML = `<defs>${defs(u)}
          ${lg(`${u}up`, [[0, 'oklch(0.66 0.06 72)'], [1, 'oklch(0.52 0.05 64)']], 'x1="0" y1="0" x2="1" y2="1"')}
          ${lg(`${u}dn`, [[0, 'oklch(0.46 0.045 62)'], [1, 'oklch(0.38 0.04 58)']], 'x1="0" y1="0" x2="1" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.42 0.05 56)'], [1, 'oklch(0.32 0.045 52)']])}${lg(`${u}R`, [[0, 'oklch(0.28 0.035 50)'], [1, 'oklch(0.21 0.03 46)']])}</defs>
        <ellipse cx="54" cy="40" rx="60" ry="44" fill="url(#${u}halo)"/>
        <path d="${SHADOW}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${LEFT}" fill="url(#${u}L)"/>
        <path d="${RIGHT}" fill="url(#${u}R)"/>
        <path d="${TOP_UP}" fill="url(#${u}up)"/>
        <path d="${TOP_DN}" fill="url(#${u}dn)"/>
        <path d="${poly([...edge(-HY, -HX, HX), ...edge(HY, HX, -HX)])}" fill="url(#${u}lit)"/>
        <path d="${STRIP}" fill="oklch(0.27 0.03 50)"/>
        <path d="${line([iso(-HX, HY, 0), iso(-HX, -HY, 0), ...edge(-HY, -HX, HX)])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="${line([...edge(HY, -HX, HX), iso(HX, -HY, 0)])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="${rails(-GA)}" fill="none" stroke="${SHINE}" stroke-width="2.6" stroke-linecap="round"/>
        <path d="${rails(GA)}" fill="none" stroke="${SHINE}" stroke-width="2.6" stroke-linecap="round"/>
        <ellipse class="glow" cx="${f(hotD[0])}" cy="${f(hotD[1])}" rx="16" ry="9" fill="url(#${u}hot)" opacity="0.6"/>
        <g class="wagon-w">
          <path data-p="far" fill="oklch(0.2 0.01 250)"/>
          <path data-p="near" fill="oklch(0.34 0.02 60)"/>
          <path data-p="near" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
          <path data-p="hubs" fill="oklch(0.66 0.05 72)"/>
          ${bodyP('frames', u, 'steel')}
        </g>
        <path d="${retFace}" fill="oklch(0.4 0.03 60)"/>
        ${body(retTop, u, 'ret')}
        <g class="wagon">
          ${bodyP('roof', u, 'roof')}
          ${bodyP('end', u, 'end')}
          <path data-p="under" fill="${FRAME}"/>
          <path data-p="side" fill="url(#${u}van)"/>
          <path data-p="ribs" fill="${RIB}"/>
          <path data-p="door" fill="${DOOR}"/>
          <path data-p="drail" fill="${TRACKRAIL}"/>
          <path data-p="plate" fill="${PLATE}"/>
          <path data-p="side" fill="url(#${u}lit)"/>
          <path data-p="side" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
        </g>
        ${sparkMarkup(u, restD, poolD)}`;
      // The wheels fade with the van.
      const M = { P: PD, lean: p => clamp((p[0] - 64) * 0.006, -0.12, 0.12) };
      M.bind = s => { const d = bindD(s), ww = s.querySelector('.wagon-w'); return st => { d(st); ww.setAttribute('opacity', f(st.op)); }; };
      return run(svg, M);
    },
    emblem: (() => {
      const g = vanD(PD.rest);
      return `${EMB_HEAD}<path d="${LEFT}" fill="#5a5a5a"/><path d="${RIGHT}" fill="#3a3a3a"/><path d="${TOP_UP}" fill="#9a9a9a"/><path d="${TOP_DN}" fill="#7a7a7a"/><path d="${STRIP}" fill="#444"/>
        <path d="${g.near}" fill="#fff"/><path d="${g.frames}" fill="#8a8a8a"/><path d="${retTop}${retFace}" fill="#8a8a8a"/>
        <path d="${g.roof}" fill="#e6e6e6"/><path d="${g.end}" fill="#c8c8c8"/><path d="${g.under}" fill="#000"/><path d="${g.side}" fill="#fff"/><path d="${g.door}" fill="#b4b4b4"/><path d="${g.plate}" fill="#000"/>${restD.map(s => `<path d="${streak(s.x, s.y, s.dx, s.dy, s.len, s.w)}" fill="#fff"/>`).join('')}</svg>`;
    })(),
  });

  /* ================= Gallery ================= */
  const NAME = 'Hump yard';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-humpyard';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `humpyard-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    const A = DIRS.find(d => d.l === 'A');
    const m = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' });
    A.art(m, 'humpyard-');
    fitIcon(m, A.box);
    m.setAttribute('class', 'art');
    pre.textContent = JSON.stringify({ ...window.EMBLEMS, menu: m.outerHTML });
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
