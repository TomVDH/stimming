<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Terrarium 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Terrarium 1</h1>
<p class="lede">Terrarium, round 1. A: the toy's jar with moss and a fern; hover mists it and the pointer wipes the fogged glass. D: the ground is the block, a glass cloche stands on the moss.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The toy's tokens: green glass, moss, fern, soil, pebbles.
  const GLASS = [[0, 'oklch(0.86 0.05 165)', 0.5], [0.28, 'oklch(0.62 0.05 165)', 0.1], [0.78, 'oklch(0.62 0.05 165)', 0.1], [1, 'oklch(0.86 0.05 165)', 0.45]];
  const MOSS = [[0, 'oklch(0.74 0.17 136)'], [1, 'oklch(0.42 0.12 142)']];
  const FERN = [[0, 'oklch(0.78 0.18 140)'], [1, 'oklch(0.5 0.15 148)']];
  const SOIL = 'oklch(0.3 0.045 55)', PEBBLE = 'oklch(0.62 0.012 80)', PEBBLE2 = 'oklch(0.48 0.012 80)';
  const CAP = 'oklch(0.66 0.13 50)', STEM = 'oklch(0.9 0.03 85)';
  const FOG = 'oklch(0.93 0.02 175)', DROP = 'oklch(0.97 0.02 190)';

  // One fern frond: a tapered blade along a curve, its edge cut into leaflets.
  const frond = (p0, c, p1, W) => {
    const n = 72, L = [], R = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, a = 1 - t;
      const p = [a * a * p0[0] + 2 * a * t * c[0] + t * t * p1[0], a * a * p0[1] + 2 * a * t * c[1] + t * t * p1[1]];
      const d = [2 * a * (c[0] - p0[0]) + 2 * t * (p1[0] - c[0]), 2 * a * (c[1] - p0[1]) + 2 * t * (p1[1] - c[1])];
      const l = Math.hypot(d[0], d[1]), nx = -d[1] / l, ny = d[0] / l;
      // The leaflets: the width dips between them, wide at the base, none at the tip.
      const saw = (t * 9) % 1;
      const w = W * Math.pow(1 - t, 0.8) * Math.min(1, t / 0.08 + 0.3) * (0.3 + 0.7 * saw);
      L.push([p[0] + nx * w, p[1] + ny * w]); R.push([p[0] - nx * w, p[1] - ny * w]);
    }
    return poly([...L, ...R.reverse()]);
  };

  // Fog on the glass. The pointer wipes it clear; drops run down the wiped path.
  // fogEl carries the mask; holes and drops are groups the caller supplies.
  const fogWipe = (svg, fogEl, holes, drops, inside, rest = 0.1, wet = 0.55) => {
    const pts = [];
    let last = null, live = false;
    gsap.set(fogEl, { opacity: rest });
    const wipe = p => {
      const hole = el('circle', { cx: f(p[0]), cy: f(p[1]), r: 9.5, fill: '#000' }, holes);
      // A drop runs down from the bottom of the wipe and clears a trail.
      const trail = el('rect', { x: f(p[0] - 2.2), y: f(p[1]), width: 4.4, height: 0.1, rx: 2.2, fill: '#000' }, holes);
      const drop = el('ellipse', { cx: f(p[0]), cy: f(p[1] + 8), rx: 2.6, ry: 3.4, fill: DROP, opacity: 0.85 }, drops);
      const run = 10 + Math.random() * 16;
      gsap.timeline({ onComplete: () => { hole.remove(); trail.remove(); drop.remove(); } })
        .to(drop, { attr: { cy: p[1] + 8 + run }, duration: 0.9 + run / 30, ease: 'power1.in' }, 0)
        .to(trail, { attr: { height: run + 8 }, duration: 0.9 + run / 30, ease: 'power1.in' }, 0)
        .to(drop, { opacity: 0, duration: 0.4 }, '>-0.2')
        .to([hole, trail], { opacity: 0, duration: 2.4, ease: 'power1.in' }, 0.8);
      pts.push(hole);
      if (pts.length > 16) pts.shift();
    };
    return {
      enter(p) {
        live = true; last = null;
        // Hover mists the jar: the fog thickens.
        gsap.to(fogEl, { opacity: wet, duration: 0.7, ease: 'power1.out', overwrite: true });
        if (p) this.move(p);
      },
      move(p) {
        if (!p || !live || !inside(p)) return;
        if (last && Math.hypot(p[0] - last[0], p[1] - last[1]) < 6) return;
        last = p; wipe(p);
      },
      leave() {
        live = false;
        gsap.to(fogEl, { opacity: rest, duration: 1.2, delay: 0.4, ease: 'power1.inOut', overwrite: true });
      },
    };
  };
  // The fern stirs on hover, as the mist lands.
  const stir = (g, ox, oy) => ({
    on() { gsap.fromTo(g, { rotation: 0 }, { rotation: 3, svgOrigin: `${ox} ${oy}`, duration: 0.5, ease: 'sine.inOut', yoyo: true, repeat: 3, overwrite: true }); },
    off() { gsap.to(g, { rotation: 0, svgOrigin: `${ox} ${oy}`, duration: 0.4, overwrite: true }); },
  });
  const both = (a, b) => ({
    enter(p) { a.on(); b.enter(p); }, move(p) { b.move(p); }, leave() { a.off(); b.leave(); },
  });

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover loop.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg, u) {
      const J = 'M30 104V50A34 32 0 0 1 98 50V104A34 6 0 0 1 30 104Z';
      svg.innerHTML = `<defs>${light(u)}
          <linearGradient id="${u}glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="oklch(0.82 0.05 160)" stop-opacity="0.5"/><stop offset="0.3" stop-color="oklch(0.6 0.05 160)" stop-opacity="0.12"/><stop offset="0.8" stop-color="oklch(0.6 0.05 160)" stop-opacity="0.12"/><stop offset="1" stop-color="oklch(0.82 0.05 160)" stop-opacity="0.45"/></linearGradient>
          <linearGradient id="${u}moss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.72 0.17 138)"/><stop offset="1" stop-color="oklch(0.42 0.12 140)"/></linearGradient>
          <clipPath id="${u}in"><path d="${J}"/></clipPath></defs>
        <ellipse cx="64" cy="8" rx="40" ry="6" fill="oklch(0.95 0.06 95)" opacity="0.35"/>
        <ellipse cx="64" cy="108" rx="40" ry="6" fill="oklch(0.05 0.01 160)" opacity="0.5"/>
        <g clip-path="url(#${u}in)">
          <rect x="30" y="90" width="68" height="20" fill="oklch(0.26 0.04 55)"/>
          <path d="M30 92Q46 80 62 88T98 86V96H30Z" fill="url(#${u}moss)"/>
          <g class="fern" fill="oklch(0.66 0.18 140)"><path d="M52 90C48 72 40 62 30 58C42 58 52 68 55 88Z"/><path d="M56 90C58 68 66 56 80 52C70 60 62 72 60 90Z"/><path d="M58 90C56 76 54 66 48 56C58 62 62 76 61 90Z"/></g>
          <g fill="oklch(0.62 0.12 55)"><path d="M76 84a6 4 0 0 1 12 0Z"/><rect x="81" y="84" width="2" height="5"/></g>
          <rect class="fog" x="30" y="16" width="68" height="94" fill="oklch(0.9 0.02 160)" opacity="0.12"/>
          <g class="mist" fill="oklch(0.95 0.03 200)" opacity="0"><circle cx="46" cy="40" r="1.6"/><circle cx="58" cy="32" r="1.3"/><circle cx="70" cy="44" r="1.8"/><circle cx="82" cy="36" r="1.4"/><circle cx="64" cy="52" r="1.2"/><circle cx="52" cy="58" r="1.5"/><circle cx="78" cy="60" r="1.3"/></g>
        </g>
        <path d="${J}" fill="url(#${u}glass)"/><path d="${J}" fill="url(#${u}lit)"/>
        <circle cx="64" cy="15" r="4" fill="oklch(0.85 0.04 160)"/>
        <path d="${J}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>`;
      const mist = svg.querySelector('.mist'), fog = svg.querySelector('.fog'), fern = svg.querySelector('.fern');
      let tl = null;
      return {
        enter() {
          tl?.kill();
          tl = gsap.timeline({ repeat: -1 })
            .fromTo(mist, { opacity: 0, y: -6 }, { opacity: 0.9, y: 4, duration: 0.6, ease: 'power1.out' }, 0)
            .to(mist, { opacity: 0, y: 14, duration: 0.8, ease: 'power1.in' }, 0.6)
            .fromTo(fog, { opacity: 0.12 }, { opacity: 0.32, duration: 0.7, ease: 'power1.out' }, 0.2)
            .to(fog, { opacity: 0.12, duration: 1.2, ease: 'power1.inOut' }, 0.9)
            .fromTo(fern, { rotation: 0 }, { rotation: 3, svgOrigin: '57 90', duration: 0.5, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0);
        },
        move() {},
        leave() {
          tl?.kill(); tl = null;
          gsap.to(mist, { opacity: 0, y: 0, duration: 0.3, overwrite: true });
          gsap.to(fog, { opacity: 0.12, duration: 0.4, overwrite: true });
          gsap.to(fern, { rotation: 0, svgOrigin: '57 90', duration: 0.4, overwrite: true });
        },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // The toy's jar: round shoulders, a short neck, a glass lid with a knob.
  const A_JAR = 'M26 98V58Q26 42 46 40V33H82V40Q102 42 102 58V98Q102 112 88 112H40Q26 112 26 98Z';
  const A_LID = 'M40 33Q40 27 46 27H82Q88 27 88 33Z';
  const LID = [[0, 'oklch(0.88 0.04 165)'], [1, 'oklch(0.6 0.04 165)']];
  const A_FERN = [
    frond([60, 92], [44, 76], [30, 62], 6.2),
    frond([62, 92], [52, 66], [50, 46], 6.4),
    frond([64, 92], [74, 66], [84, 50], 6.4),
    frond([66, 92], [84, 80], [96, 70], 5.6),
  ];
  const A_MOSS = 'M26 94Q34 80 50 84Q62 76 76 84Q92 78 102 90V112H26Z';
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [25, 14, 78, 100],
    idea: 'The toy\'s jar: round shoulders, a short neck, a glass lid with a knob. Inside, pebbles under dark soil, a moss mound, one fern of four fronds with cut leaflets and a small mushroom. Hover mists the jar and the fern stirs. The pointer wipes the fogged glass clear; a drop runs down from each wipe and leaves a clear trail; the fog closes in again.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}fb`, 1.6)}
          ${lg(`${u}glass`, GLASS, 'x1="0" y1="0" x2="1" y2="0"')}
          ${lg(`${u}moss`, MOSS)}${lg(`${u}fern`, FERN)}${lg(`${u}lid`, LID)}
          <clipPath id="${u}in"><path d="${A_JAR}"/></clipPath>
          <mask id="${u}fm" maskUnits="userSpaceOnUse" x="-20" y="-20" width="168" height="168"><rect x="-20" y="-20" width="168" height="168" fill="#fff"/><g class="holes" filter="url(#${u}fb)"></g></mask></defs>
        <ellipse cx="64" cy="113" rx="42" ry="4" fill="oklch(0.05 0.01 160)" opacity="0.6" filter="url(#${u}b)"/>
        <g clip-path="url(#${u}in)">
          <rect x="24" y="98" width="80" height="16" fill="${SOIL}"/>
          <g>${[[34, 106, 5], [47, 108, 4.4], [60, 106.5, 5.2], [74, 108, 4.6], [88, 106, 5], [97, 108.5, 4]].map(([x, y, r], i) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${f(r * 0.72)}" fill="${i % 2 ? PEBBLE2 : PEBBLE}"/>`).join('')}</g>
          <path d="${A_MOSS}" fill="url(#${u}moss)"/>
          <g class="fern"><path d="${A_FERN.join('')}" fill="url(#${u}fern)"/></g>
          <path d="M80 86Q86 77 92 86Z" fill="${CAP}"/><rect x="85" y="85.5" width="2.6" height="5.5" rx="1" fill="${STEM}"/>
          <rect class="fog" x="24" y="30" width="80" height="84" fill="${FOG}" mask="url(#${u}fm)"/>
          <g class="drops"></g>
        </g>
        <path d="${A_JAR}" fill="url(#${u}glass)"/>
        <path d="${A_JAR}" fill="url(#${u}lit)"/>
        <path d="M31 60Q31 50 38 47V92Q31 90 31 84Z" fill="#fff" opacity="0.28"/>
        <path d="${A_JAR}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
        ${body(A_LID, u, 'lid')}
        <circle cx="64" cy="22" r="5" fill="oklch(0.84 0.04 165)"/><circle cx="64" cy="22" r="5" fill="url(#${u}lit)"/>`;
      const inside = p => p[0] > 28 && p[0] < 100 && p[1] > 42 && p[1] < 104;
      return both(
        stir(svg.querySelector('.fern'), 63, 92),
        fogWipe(svg, svg.querySelector('.fog'), svg.querySelector('.holes'), svg.querySelector('.drops'), inside),
      );
    },
    emblem: `${EMB_HEAD}<path d="${A_JAR}${A_LID}" fill="#fff"/><circle cx="64" cy="22" r="5" fill="#fff"/><path d="${A_FERN.join('')}" fill="#000"/><path d="${A_MOSS}" fill="#000"/></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The ground is the block: moss on top, soil and pebbles in its faces.
  // A glass cloche stands on the moss with the fern inside.
  const CY = 88, HALF = 24, T = 18;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const [N, E, S, W] = D_TOP;
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // A band on a face from depth v0 to v1.
  const band = (a, b, v0, v1) => poly([down(a, v0), down(b, v0), down(b, v1), down(a, v1)]);
  // The cloche: a glass bell on the moss, its foot an ellipse round the middle.
  const RX = 27, RY = 15.6, SH = 14;
  const D_BELL = `M${64 - RX} ${CY}V${CY - SH}A${RX} ${RX * 0.95} 0 0 1 ${64 + RX} ${CY - SH}V${CY}A${RX} ${RY} 0 0 1 ${64 - RX} ${CY}Z`;
  const D_FERN = [
    frond([62, CY + 2], [50, CY - 10], [42, CY - 22], 4.6),
    frond([63, CY + 2], [58, CY - 22], [58, CY - 38], 4.8),
    frond([65, CY + 2], [72, CY - 20], [80, CY - 30], 4.8),
    frond([66, CY + 2], [78, CY - 6], [86, CY - 12], 4.2),
  ];
  const KNOB_Y = CY - SH - RX * 0.95 - 3;
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [21, KNOB_Y - 6, 86, CY + HALF + T - KNOB_Y + 6],
    idea: 'The ground is the block: moss on the top, soil and pebbles in its left and right faces, a rim on the top edges. A glass cloche stands on the moss with the fern inside. Hover mists the cloche and the fern stirs; the pointer wipes the glass clear and drops run down the wiped path.',
    art(svg, u) {
      const top = poly(D_TOP);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}fb`, 1.4)}
          ${lg(`${u}glass`, GLASS, 'x1="0" y1="0" x2="1" y2="0"')}
          ${lg(`${u}moss`, MOSS, 'x1="0" y1="0" x2="0.4" y2="1"')}${lg(`${u}fern`, FERN)}
          <clipPath id="${u}in"><path d="${D_BELL}"/></clipPath>
          <mask id="${u}fm" maskUnits="userSpaceOnUse" x="-20" y="-20" width="168" height="168"><rect x="-20" y="-20" width="168" height="168" fill="#fff"/><g class="holes" filter="url(#${u}fb)"></g></mask></defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 160)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${band(W, S, 0, 0.22)}" fill="oklch(0.46 0.11 142)"/>
        <path d="${band(W, S, 0.22, 0.62)}" fill="oklch(0.34 0.05 55)"/>
        <path d="${band(W, S, 0.62, 1)}" fill="oklch(0.5 0.012 80)"/>
        <path d="${band(S, E, 0, 0.22)}" fill="oklch(0.34 0.09 145)"/>
        <path d="${band(S, E, 0.22, 0.62)}" fill="oklch(0.24 0.04 55)"/>
        <path d="${band(S, E, 0.62, 1)}" fill="oklch(0.37 0.01 80)"/>
        <path d="${top}" fill="url(#${u}moss)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g class="fern"><path d="${D_FERN.join('')}" fill="url(#${u}fern)"/></g>
        <path d="M74 ${CY - 4}Q78 ${CY - 11} 82 ${CY - 4}Z" fill="${CAP}"/><rect x="77" y="${CY - 4.5}" width="2" height="4" rx="1" fill="${STEM}"/>
        <g clip-path="url(#${u}in)">
          <rect class="fog" x="30" y="${KNOB_Y}" width="68" height="${CY + RY - KNOB_Y}" fill="${FOG}" mask="url(#${u}fm)"/>
          <g class="drops"></g>
        </g>
        <path d="${D_BELL}" fill="url(#${u}glass)"/>
        <path d="${D_BELL}" fill="url(#${u}lit)"/>
        <path d="M${64 - RX + 5} ${CY - SH - 2}Q${64 - RX + 7} ${CY - SH - 14} ${64 - RX + 14} ${CY - SH - 20}V${CY - 6}H${64 - RX + 5}Z" fill="#fff" opacity="0.25"/>
        <path d="${D_BELL}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="64" cy="${f(KNOB_Y)}" r="4.4" fill="oklch(0.84 0.04 165)"/><circle cx="64" cy="${f(KNOB_Y)}" r="4.4" fill="url(#${u}lit)"/>`;
      const inside = p => Math.abs(p[0] - 64) < RX - 2 && p[1] > KNOB_Y + 6 && p[1] < CY + 6;
      return both(
        stir(svg.querySelector('.fern'), 64, CY + 2),
        fogWipe(svg, svg.querySelector('.fog'), svg.querySelector('.holes'), svg.querySelector('.drops'), inside),
      );
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/><path d="${D_BELL}" fill="#fff"/><circle cx="64" cy="${f(KNOB_Y)}" r="4.4" fill="#fff"/><path d="${D_FERN.join('')}" fill="#000"/></svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Terrarium';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-terrarium';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `terrarium-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
