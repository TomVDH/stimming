<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike railgun-2</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike railgun-2</h1>
<p class="lede">Railgun, the far shot in the toy's own perspective. Move the pointer over a tile; rest on it to fire.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NAME = 'Railgun';
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const DEG = Math.PI / 180;
  // A point turned by a degrees, counterclockwise on screen, about c.
  const turn = (p, c, a) => {
    const s = Math.sin(-a * DEG), k = Math.cos(-a * DEG), x = p[0] - c[0], y = p[1] - c[1];
    return [c[0] + x * k - y * s, c[1] + x * s + y * k];
  };
  // A jagged arc along y = y0 from x0 to x1, j units wild.
  const jag = (x0, x1, y0, j, n = 9) => Array.from({ length: n + 1 }, (_, i) => `${f(x0 + (x1 - x0) * i / n)},${f(y0 + (i && i < n ? (Math.random() - 0.5) * 2 * j : 0))}`).join(' ');

  // The shot cycle every direction shares.
  // It charges for 1.3 s, fires, lets the blast play, then a new rock comes in.
  // o.charge(c) draws the charge; o.fire() plays the blast and returns its length.
  function cycle(o) {
    const st = { c: 0 };
    let tl = null;
    const start = () => {
      tl?.kill();
      tl = gsap.timeline({ repeat: -1, repeatDelay: 0.4 })
        .to(st, { c: 1, duration: 1.3, ease: 'power1.in', onUpdate: () => o.charge(st.c) })
        .add(() => { st.c = 0; o.charge(0); o.fire(); })
        .to({}, { duration: 2.1 });
    };
    const stop = () => { tl?.kill(); tl = null; gsap.to(st, { c: 0, duration: 0.3, onUpdate: () => o.charge(st.c) }); o.rest(); };
    return {
      enter(p) { if (p) o.aim(p, true); start(); },
      move(p) { if (p) o.aim(p); },
      leave() { stop(); },
    };
  }

  const DIRS = [];

  /* ================= The far shot, again ================= */

  // The toy's own frame, cropped square: x 30 to 620, y 18 to 608 of an 800 wide still.
  // A low horizon; the gun small at lower left; the trail sweeps in from the top left.
  const PAL = {
    dusk: {
      sky: ['oklch(0.6 0.035 295)', 'oklch(0.76 0.045 335)', 'oklch(0.87 0.05 62)'], ground: ['oklch(0.46 0.045 52)', 'oklch(0.34 0.04 45)'],
      far: 'oklch(0.72 0.04 45)', cloud: 'oklch(0.9 0.03 50)', cloudA: 0.55, cirrus: 'oklch(0.95 0.02 60)', cirrusA: 0.32,
      smoke: ['oklch(0.66 0.14 42)', 'oklch(0.5 0.05 330)', 'oklch(0.62 0.03 305)'], lip: 'oklch(0.84 0.035 330)', gun: 'oklch(0.27 0.025 45)', stars: 0,
    },
    night: {
      sky: ['oklch(0.13 0.035 272)', 'oklch(0.19 0.045 282)', 'oklch(0.28 0.05 295)'], ground: ['oklch(0.2 0.025 40)', 'oklch(0.12 0.015 40)'],
      far: 'oklch(0.2 0.03 285)', cloud: 'oklch(0.42 0.035 270)', cloudA: 0.5, cirrus: 'oklch(0.62 0.03 265)', cirrusA: 0.3,
      smoke: ['oklch(0.72 0.17 45)', 'oklch(0.55 0.15 38)', 'oklch(0.32 0.04 300)'], lip: 'oklch(0.85 0.12 70)', gun: 'oklch(0.07 0.012 280)', stars: 1,
    },
  };
  // The trail's centre line, from the rock back up its track.
  const TRAIL = [[0, 0], [-8.6, -6.2], [-24.2, -16.4], [-43, -27.3], [-62.4, -38.2], [-90, -53.5]];
  function trailPath(top) {
    // Even samples along the line; the width grows away from the rock.
    const seg = TRAIL.slice(1).map((p, i) => Math.hypot(p[0] - TRAIL[i][0], p[1] - TRAIL[i][1]));
    const total = seg.reduce((a, b) => a + b, 0), N = 44, L = [], R = [];
    for (let i = 0; i <= N; i++) {
      let d = total * i / N, k = 0;
      while (k < seg.length - 1 && d > seg[k]) d -= seg[k++];
      const a = TRAIL[k], b = TRAIL[k + 1], u = d / seg[k];
      const x = a[0] + (b[0] - a[0]) * u, y = a[1] + (b[1] - a[1]) * u;
      const tx = (b[0] - a[0]) / seg[k], ty = (b[1] - a[1]) / seg[k], nx = -ty, ny = tx;
      const t = i / N, w = (4.4 + 10.5 * Math.pow(t, 0.65)) * (1 + 0.14 * Math.sin(i * 1.9 + 0.7) + 0.1 * Math.sin(i * 4.3) + 0.06 * Math.sin(i * 7.7 + 1));
      // The lit lip is the upper third of the smoke.
      const w0 = top ? w * 0.35 : -w, w1 = w * (1 + 0.1 * Math.sin(i * 2.7 + 2));
      L.push([x + nx * w1, y + ny * w1]); R.push([x + nx * w0, y + ny * w0]);
    }
    const pts = [...L, ...R.reverse()];
    return 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  }

  const farShot = (key, l, name, idea) => DIRS.push({
    l, name, idea, box: [16, 16, 98, 98],
    art(svg, u) {
      const P = PAL[key];
      const T = [42, 82], MUZ = [59.6, 82], REST = [101, 54.5];
      const TOWER = 'M44 92C43.5 86 43 80 45 75.5C43.5 72 46 68.5 49 69.5C49.5 66.5 54 65.5 56 68C58.5 66.5 61.5 68.5 60.5 71.5C63 74 62.5 84 64 92Z M41 67.5C48 64.3 60 63.6 74 65.3C66 66.6 52 67.6 41 67.5Z';
      const HEAPS = 'M77 87C77 84 79.5 82.6 82 83.6C83 80.8 87.5 80.4 89.4 82.8C91.3 80.8 95.5 81.6 95.6 84.6C98.4 84.4 100.6 85.8 100.6 87.8H77Z M14 84C14 82 15.6 80.8 17.4 81.6C18.2 79.8 21 79.8 22 81.6C23.6 81.4 24.6 82.6 24.6 84Z';
      const CIR = 'M10 37H64M30 44H112M10 55H84M58 60H114M10 66H48M66 71H112';
      const stars = P.stars ? '<g fill="oklch(0.92 0.02 260)"><circle cx="22" cy="24" r="0.45"/><circle cx="64" cy="20" r="0.4"/><circle cx="88" cy="26" r="0.5"/><circle cx="104" cy="38" r="0.4"/><circle cx="30" cy="50" r="0.35"/><circle cx="72" cy="47" r="0.4"/><circle cx="48" cy="31" r="0.35"/></g><circle cx="27" cy="31" r="1.6" fill="oklch(0.96 0.02 90)" opacity="0.9"/>' : '';
      svg.innerHTML = `
        <defs>
          <linearGradient id="${u}-sky" x1="0" y1="16" x2="0" y2="94" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${P.sky[0]}"/><stop offset="0.6" stop-color="${P.sky[1]}"/><stop offset="1" stop-color="${P.sky[2]}"/></linearGradient>
          <linearGradient id="${u}-gr" x1="0" y1="93" x2="0" y2="108" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${P.ground[0]}"/><stop offset="1" stop-color="${P.ground[1]}"/></linearGradient>
          <linearGradient id="${u}-sm" x1="0" y1="0" x2="-90" y2="-53.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${P.smoke[0]}"/><stop offset="0.28" stop-color="${P.smoke[1]}"/><stop offset="1" stop-color="${P.smoke[2]}"/></linearGradient>
          <radialGradient id="${u}-rk" cx="0.42" cy="0.42" r="0.6"><stop offset="0" stop-color="oklch(1 0.02 95)"/><stop offset="0.55" stop-color="oklch(0.95 0.07 85)"/><stop offset="1" stop-color="oklch(0.75 0.15 55)"/></radialGradient>
          <radialGradient id="${u}-halo"><stop offset="0" stop-color="oklch(0.95 0.1 80)" stop-opacity="0.7"/><stop offset="1" stop-color="oklch(0.85 0.12 60)" stop-opacity="0"/></radialGradient>
          <radialGradient id="${u}-fb"><stop offset="0" stop-color="oklch(1 0.02 95)"/><stop offset="0.4" stop-color="oklch(0.95 0.1 80)"/><stop offset="1" stop-color="oklch(0.75 0.16 45)" stop-opacity="0"/></radialGradient>
          <filter id="${u}-gl" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="${u}-soft" x="-0.2" y="-0.2" width="1.4" height="1.4"><feGaussianBlur stdDeviation="0.5"/></filter>
          <clipPath id="${u}-cl"><rect x="16" y="16" width="92" height="92"/></clipPath>
        </defs>
        <rect x="22" y="22" width="92" height="92" fill="oklch(0.07 0.01 280)"/>
        <g clip-path="url(#${u}-cl)">
          <g id="${u}-scene">
            <rect x="10" y="10" width="104" height="84" fill="url(#${u}-sky)"/>
            ${stars}
            <path d="${CIR}" stroke="${P.cirrus}" stroke-width="2.2" stroke-linecap="round" opacity="${P.cirrusA}" filter="url(#${u}-soft)"/>
            <path id="${u}-cirL" d="${CIR}" stroke="oklch(0.98 0.05 80)" stroke-width="2.4" stroke-linecap="round" opacity="0" filter="url(#${u}-soft)"/>
            <path d="${TOWER}" fill="${P.cloud}" opacity="${P.cloudA}" filter="url(#${u}-soft)"/>
            <path id="${u}-towL" d="${TOWER}" fill="oklch(0.98 0.06 80)" opacity="0" filter="url(#${u}-soft)"/>
            <path d="${HEAPS}" fill="${P.cloud}" opacity="${P.cloudA}" filter="url(#${u}-soft)"/>
            <path id="${u}-hpL" d="${HEAPS}" fill="oklch(0.98 0.06 80)" opacity="0" filter="url(#${u}-soft)"/>
            <path d="M62.8 93.6V91.2L64 90.7H69.6L70.6 93.6Z M95.5 93.6V91.5L96.6 90.8H105.4L106.4 93.6Z M14 93.6V92H19.6L20.4 93.6Z" fill="${P.far}"/>
            <rect x="10" y="93.5" width="104" height="20" fill="url(#${u}-gr)"/>
            <rect id="${u}-plain" x="10" y="93.5" width="104" height="20" fill="oklch(0.95 0.08 75)" opacity="0"/>
            <g id="${u}-rock" transform="translate(${REST[0]} ${REST[1]})">
              <g id="${u}-trail">
                <path d="${trailPath(false)}" fill="url(#${u}-sm)" filter="url(#${u}-soft)"/>
                <path id="${u}-lip" d="${trailPath(true)}" fill="${P.lip}" opacity="0.45" filter="url(#${u}-soft)"/>
              </g>
              <circle id="${u}-halo" r="10" fill="url(#${u}-halo)"/>
              <circle id="${u}-ball" r="4.3" fill="url(#${u}-rk)"/>
              <g id="${u}-sh" fill="oklch(0.8 0.14 55)"></g>
            </g>
            <g fill="${P.gun}">
              <path d="M18 94.6H64V93H58.5V91.6H21.5V93H18Z"/>
              <path d="M24 92V84.5L25.6 83.2V80.4H35L36.8 79.4H40.8V92Z"/>
              <path d="M37.6 92L42 82.4L46.4 92H44.6L42 86.2L39.4 92Z"/>
              <path d="M27.8 81L21.4 72.6M31 80.2L27.4 72.4M20.8 72.6H28.2M34.6 80V74.2" stroke="${P.gun}" stroke-width="0.85" fill="none"/>
              <g id="${u}-gun">
                <g id="${u}-slide">
                  <rect x="37.6" y="79.8" width="9.4" height="4.4"/>
                  <rect x="46.4" y="80.9" width="12.2" height="2.2"/>
                  <rect x="58" y="80.3" width="2.4" height="3.4"/>
                  <g fill="oklch(0.8 0.14 90)" opacity="${P.stars ? 0.55 : 0.9}"><rect x="49" y="80.9" width="0.9" height="2.2"/><rect x="53" y="80.9" width="0.9" height="2.2"/><rect x="56.4" y="80.9" width="0.9" height="2.2"/></g>
                  <circle id="${u}-core" cx="43" cy="82" r="1.6" fill="oklch(0.95 0.06 230)" opacity="0" filter="url(#${u}-gl)"/>
                  <polyline id="${u}-arc" fill="none" stroke="oklch(0.92 0.08 230)" stroke-width="0.6" opacity="0" filter="url(#${u}-gl)"/>
                </g>
              </g>
            </g>
            <circle id="${u}-muz" r="1" fill="oklch(0.98 0.05 220)" opacity="0" filter="url(#${u}-gl)"/>
            <line id="${u}-bolt" stroke="oklch(0.99 0.03 230)" stroke-width="0.9" stroke-linecap="round" opacity="0" filter="url(#${u}-gl)"/>
            <circle id="${u}-fb" r="2" fill="url(#${u}-fb)" opacity="0"/>
            <circle id="${u}-ring" r="2" fill="none" stroke="oklch(0.98 0.04 85)" stroke-width="1" opacity="0"/>
            <circle id="${u}-ring2" r="2" fill="none" stroke="oklch(0.98 0.04 85)" stroke-width="0.6" opacity="0"/>
          </g>
          <rect id="${u}-fl" x="16" y="16" width="92" height="92" fill="oklch(0.99 0.04 85)" opacity="0"/>
        </g>`;
      const $ = id => svg.querySelector(`#${u}-${id}`);
      const gun = $('gun'), slide = $('slide'), arc = $('arc'), core = $('core'), bolt = $('bolt'), rock = $('rock'), ball = $('ball'), halo = $('halo');
      const trail = $('trail'), lip = $('lip'), sh = $('sh'), ring = $('ring'), ring2 = $('ring2'), fb = $('fb'), fl = $('fl'), muz = $('muz'), scene = $('scene'), plain = $('plain');
      const lit = [$('cirL'), $('towL'), $('hpL')];
      const shards = Array.from({ length: 8 }, () => el('path', { d: 'M-0.9 -0.7L0.8 -0.9L0.9 0.8L-0.7 0.9Z', opacity: 0 }, sh));
      const st = { x: REST[0], y: REST[1], a: 0, rec: 0 };
      const angle = () => clamp(Math.atan2(T[1] - st.y, st.x - T[0]) / DEG, 8, 44);
      st.a = angle();
      const draw = () => {
        gun.setAttribute('transform', `rotate(${f(-st.a)} ${T[0]} ${T[1]})`);
        slide.setAttribute('transform', `translate(${f(-st.rec * 3)} 0)`);
        rock.setAttribute('transform', `translate(${f(st.x)} ${f(st.y)})`);
      };
      draw();
      const aim = (p, snap) => {
        const x = clamp(p[0], 66, 104), y = clamp(p[1], 30, 72);
        gsap.to(st, { x, y, duration: snap ? 0.35 : 0.7, ease: 'power2.out', overwrite: 'auto', onUpdate() { st.a = angle(); draw(); } });
      };
      return cycle({
        aim,
        charge(c) {
          arc.setAttribute('points', jag(44, 59, 82, 0.3 + 1.3 * c, 8));
          arc.setAttribute('opacity', f(c * c));
          core.setAttribute('opacity', f(c));
          core.setAttribute('r', f(1 + 1.6 * c));
          const k = c > 0.55 ? (c - 0.55) * 1.1 : 0;
          scene.setAttribute('transform', k ? `translate(${f((Math.random() - 0.5) * k)} ${f((Math.random() - 0.5) * k)})` : '');
        },
        fire() {
          const m = turn(MUZ, T, st.a), hx = st.x, hy = st.y;
          gsap.set(bolt, { attr: { x1: m[0], y1: m[1], x2: hx, y2: hy }, opacity: 1 });
          gsap.to(bolt, { opacity: 0, duration: 0.4, ease: 'power2.in' });
          gsap.fromTo(muz, { attr: { cx: m[0], cy: m[1], r: 1 }, opacity: 1 }, { attr: { r: 7 }, opacity: 0, duration: 0.45, ease: 'power2.out' });
          gsap.fromTo(st, { rec: 1 }, { rec: 0, duration: 0.9, ease: 'elastic.out(1, 0.5)', onUpdate: draw });
          const tl = gsap.timeline({ delay: 0.14 });
          // The rock bursts into a fireball; two shells run out.
          tl.to([ball, halo], { opacity: 0, duration: 0.12 }, 0)
            .fromTo(fb, { attr: { cx: hx, cy: hy, r: 3 }, opacity: 1 }, { attr: { r: 15 }, opacity: 0, duration: 1.3, ease: 'power2.out' }, 0)
            .fromTo(fl, { opacity: P.stars ? 0.5 : 0.65 }, { opacity: 0, duration: 0.9, ease: 'power2.out' }, 0)
            .fromTo(ring, { attr: { cx: hx, cy: hy, r: 3 }, opacity: 0.9 }, { attr: { r: 60 }, opacity: 0, duration: 1.8, ease: 'power2.out' }, 0)
            .fromTo(ring2, { attr: { cx: hx, cy: hy, r: 2 }, opacity: 0.7 }, { attr: { r: 34 }, opacity: 0, duration: 1.5, ease: 'power2.out' }, 0.15)
            .fromTo(plain, { opacity: 0.5 }, { opacity: 0, duration: 1.1 }, 0)
            .fromTo(lip, { opacity: 1 }, { opacity: 0.45, duration: 1 }, 0)
            .to(trail, { opacity: 0.25, duration: 1.6, ease: 'power1.in' }, 0.3);
          shards.forEach((s, i) => {
            const a = i / shards.length * Math.PI * 2 + Math.random() * 0.6;
            tl.fromTo(s, { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: Math.cos(a) * 11, y: Math.sin(a) * 11 + 5, rotation: 200, opacity: 0, duration: 1.3, ease: 'power2.out' }, 0);
          });
          // Light reaches each layer by its distance from the hit.
          lit.forEach((l, i) => tl.fromTo(l, { opacity: 0 }, { opacity: [0.9, 0.7, 0.75][i], duration: 0.1, yoyo: true, repeat: 1, repeatDelay: 0.3 + 0.12 * i }, 0.02 + 0.09 * i));
          // A fresh rock and a fresh trail come in.
          const g = { k: 0, t: 0 };
          const grow = () => {
            ball.setAttribute('r', f(4.3 * g.k)); halo.setAttribute('r', f(10 * g.k));
            trail.setAttribute('transform', `scale(${f(Math.max(g.t, 0.001))})`);
          };
          tl.add(() => { gsap.set([ball, halo, trail], { opacity: 1 }); grow(); }, 1.7)
            .to(g, { k: 1, duration: 0.5, ease: 'power2.out', onUpdate: grow }, 1.7)
            .to(g, { t: 1, duration: 1.1, ease: 'power2.out', onUpdate: grow }, 1.7);
        },
        rest() { aim(REST); },
      });
    },
  });
  farShot('dusk', 'A', 'Far shot, dusk', 'The toy’s frame, square: the gun small at lower left, the trail sweeping in from the top left. The rock follows the pointer; rest to fire.');
  farShot('night', 'B', 'Far shot, night', 'The same frame at night: the trail burns orange, the moon low on the left.');

  /* ================= mount ================= */

  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : { x: 14, y: 14, width: 100, height: 100 }, side = Math.max(b.width, b.height);
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.CTL = {};
  for (const D of DIRS) {
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = `railgun-${D.l.toLowerCase()}`;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tile => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      (window.CTL[D.l] ||= []).push({ c, svg });
      if (reduce) return;
      tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tile.addEventListener('pointermove', e => c.move(local(svg, e)));
      tile.addEventListener('pointerleave', () => c.leave());
      tile.addEventListener('focus', () => c.enter(null));
      tile.addEventListener('blur', () => c.leave());
    });
  }
})();
</script>
</body>
</html>
