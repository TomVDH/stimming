/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);

  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;

h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>

      const trail = q('trail'), lip = q('lip'), ring = q('ring'), ring2 = q('ring2'), fb = q('fb'), fl = q('fl'), muz = q('muz'), scene = q('scene'), plain = q('plain');
      const lit = [q('cirL'), q('towL'), q('hpL')];
      const shards = Array.from({ length: 8 }, () => el('path', { d: 'M-0.9 -0.7L0.8 -0.9L0.9 0.8L-0.7 0.9Z', opacity: 0 }, q('sh')));
      // A point turned a degrees counterclockwise about c.
      const turn = (p, c, a) => {
        const s = Math.sin(-a * DEG), k = Math.cos(-a * DEG), x = p[0] - c[0], y = p[1] - c[1];
        return [c[0] + x * k - y * s, c[1] + x * s + y * k];
      };
      // A jagged arc along the barrel; j sets how wild it is.
      const jag = (x0, x1, y0, j, n) => Array.from({ length: n + 1 }, (_, i) => `${f(x0 + (x1 - x0) * i / n)},${f(y0 + (i && i < n ? (Math.random() - 0.5) * 2 * j : 0))}`).join(' ');
      const st = { x: REST[0], y: REST[1], a: 0, rec: 0, c: 0 };
      const angle = () => clamp(Math.atan2(T[1] - st.y, st.x - T[0]) / DEG, 8, 44);
      const draw = () => {
        gun.setAttribute('transform', `rotate(${f(-st.a)} ${T[0]} ${T[1]})`);
        slide.setAttribute('transform', `translate(${f(-st.rec * 3)} 0)`);
        rock.setAttribute('transform', `translate(${f(st.x)} ${f(st.y)})`);
      };
      st.a = angle();
      draw();
      const aim = (p, snap) => gsap.to(st, { x: clamp(p[0], 66, 104), y: clamp(p[1], 30, 72), duration: snap ? 0.35 : 0.7, ease: 'power2.out', overwrite: 'auto', onUpdate() { st.a = angle(); draw(); } });
      const charge = c => {
        arc.setAttribute('points', jag(44, 59, 82, 0.3 + 1.3 * c, 8));
        arc.setAttribute('opacity', f(c * c));
        core.setAttribute('opacity', f(c));
        core.setAttribute('r', f(1 + 1.6 * c));
        // A full charge shakes the frame.
        const k = c > 0.55 ? (c - 0.55) * 1.1 : 0;
        scene.setAttribute('transform', k ? `translate(${f((Math.random() - 0.5) * k)} ${f((Math.random() - 0.5) * k)})` : '');
      };
      const fire = () => {
        const m = turn(MUZ, T, st.a), hx = st.x, hy = st.y;
        gsap.set(bolt, { attr: { x1: m[0], y1: m[1], x2: hx, y2: hy }, opacity: 1 });
        gsap.to(bolt, { opacity: 0, duration: 0.4, ease: 'power2.in' });
        gsap.fromTo(muz, { attr: { cx: m[0], cy: m[1], r: 1 }, opacity: 1 }, { attr: { r: 7 }, opacity: 0, duration: 0.45, ease: 'power2.out' });
        gsap.fromTo(st, { rec: 1 }, { rec: 0, duration: 0.9, ease: 'elastic.out(1, 0.5)', onUpdate: draw });
        // The rock bursts into a fireball; two shells run out.
        const tl = gsap.timeline({ delay: 0.14 });
        tl.to([ball, halo], { opacity: 0, duration: 0.12 }, 0)
          .fromTo(fb, { attr: { cx: hx, cy: hy, r: 3 }, opacity: 1 }, { attr: { r: 15 }, opacity: 0, duration: 1.3, ease: 'power2.out' }, 0)
          .fromTo(fl, { opacity: 0.65 }, { opacity: 0, duration: 0.9, ease: 'power2.out' }, 0)
          .fromTo(ring, { attr: { cx: hx, cy: hy, r: 3 }, opacity: 0.9 }, { attr: { r: 60 }, opacity: 0, duration: 1.8, ease: 'power2.out' }, 0)
          .fromTo(ring2, { attr: { cx: hx, cy: hy, r: 2 }, opacity: 0.7 }, { attr: { r: 34 }, opacity: 0, duration: 1.5, ease: 'power2.out' }, 0.15)
          .fromTo(plain, { opacity: 0.5 }, { opacity: 0, duration: 1.1 }, 0)
          .fromTo(lip, { opacity: 1 }, { opacity: 0.45, duration: 1 }, 0)
          .to(trail, { opacity: 0.25, duration: 1.6, ease: 'power1.in' }, 0.3);
        shards.forEach((s, i) => {
          const a = i / shards.length * Math.PI * 2 + Math.random() * 0.6;
          tl.fromTo(s, { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: Math.cos(a) * 11, y: Math.sin(a) * 11 + 5, rotation: 200, opacity: 0, duration: 1.3, ease: 'power2.out' }, 0);
        });
        // Light reaches each cloud layer by its distance from the hit.
        lit.forEach((l, i) => tl.fromTo(l, { opacity: 0 }, { opacity: [0.9, 0.7, 0.75][i], duration: 0.1, yoyo: true, repeat: 1, repeatDelay: 0.3 + 0.12 * i }, 0.02 + 0.09 * i));
        // A fresh rock and a fresh trail grow back.
        const g = { k: 0, t: 0 };
        const grow = () => {
          ball.setAttribute('r', f(4.3 * g.k)); halo.setAttribute('r', f(10 * g.k));
          trail.setAttribute('transform', `scale(${f(Math.max(g.t, 0.001))})`);
        };
        tl.add(() => { gsap.set([ball, halo, trail], { opacity: 1 }); grow(); }, 1.7)
          .to(g, { k: 1, duration: 0.5, ease: 'power2.out', onUpdate: grow }, 1.7)
          .to(g, { t: 1, duration: 1.1, ease: 'power2.out', onUpdate: grow }, 1.7);
      };
      let cyc = null;
      const start = () => {
        cyc?.kill();
        cyc = gsap.timeline({ repeat: -1, repeatDelay: 0.4 })
          .to(st, { c: 1, duration: 1.3, ease: 'power1.in', onUpdate: () => charge(st.c) })
          .add(() => { st.c = 0; charge(0); fire(); })
          .to({}, { duration: 2.1 });
      };
      return {
        enter(p) { if (p) aim(p, true); start(); },
        move(p) { if (p) aim(p); },
        leave() { cyc?.kill(); cyc = null; gsap.to(st, { c: 0, duration: 0.3, onUpdate: () => charge(st.c) }); aim(REST); },
      };
    },
  });

  // The toy's tokens: dusty sand paint, dark steel rails, copper coils, a violet arc, a burning rock.
  const PAINT = [[0, 'oklch(0.66 0.045 75)'], [1, 'oklch(0.4 0.035 65)']];
  const STEEL = [[0, 'oklch(0.5 0.015 260)'], [1, 'oklch(0.24 0.012 260)']];
  const COPPER = [[0, 'oklch(0.78 0.11 60)'], [1, 'oklch(0.5 0.11 45)']];
  const ARC = 'oklch(0.82 0.16 300)';
  const FIRE = [[0, 'oklch(0.98 0.06 95)'], [0.4, 'oklch(0.86 0.15 70)'], [1, 'oklch(0.6 0.2 35)', 0]];
  const gunDefs = u => `${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 2.2)}${blur(`${u}h`, 5)}
    ${lg(`${u}paint`, PAINT)}${lg(`${u}steel`, STEEL)}${lg(`${u}copper`, COPPER, 'x1="0" y1="0" x2="1" y2="0"')}
    ${rg(`${u}fire`, FIRE)}${lg(`${u}trail`, [[0, 'oklch(0.9 0.12 75)', 0.9], [1, 'oklch(0.7 0.16 40)', 0]], 'x1="0" y1="0" x2="1" y2="0"')}`;

  // The gun in its own frame: the pivot at 0 0, the barrel along +x.
  // The rails and the breech ride on a slide that recoils.
  const RAILS = 'M-4 -11H54Q57 -11 57 -8.6V-4.6H-4ZM-4 4.6H57V8.6Q57 11 54 11H-4Z';
  const BREECH = 'M-16 -13H8Q12 -13 12 -9V9Q12 13 8 13H-16Q-20 13 -20 9V-9Q-20 -13 -16 -13Z';
  const gun = u => `<g class="slide">
      ${body(RAILS, u, 'steel')}
      ${[18, 31, 44].map(x => `<path d="M${x} -13.4H${x + 5}V-4.6H${x}ZM${x} 4.6H${x + 5}V13.4H${x}Z" fill="url(#${u}copper)"/><path d="M${x} -13.4H${x + 5}" stroke="#fff" stroke-width="1.4" opacity="0.5"/>`).join('')}
      <polyline class="arc" points="12,0 56,0" fill="none" stroke="${ARC}" stroke-width="2.2" stroke-linejoin="round" filter="url(#${u}g)" opacity="0.35"/>
      <polyline class="arc2" points="12,0 56,0" fill="none" stroke="#fff" stroke-width="1" opacity="0.2"/>
      ${body(BREECH, u, 'paint')}
      <circle class="core" cx="4" cy="0" r="3.4" fill="${ARC}" opacity="0.4" filter="url(#${u}g)"/>
    </g>`;
  // The mount: a plinth and a sloped housing under the pivot.
  const mount = u => `<path d="M14 104H78Q80 104 80 106V110Q80 112 78 112H14Q12 112 12 110V106Q12 104 14 104Z" fill="url(#${u}steel)"/>
    ${body('M20 104L25 86Q26 82 30 82H62Q66 82 67 86L72 104Z', u, 'paint')}
    <path d="M30 92H44M30 97H44" stroke="oklch(0.25 0.02 60)" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>`;
  // The rock: a fire trail up and to the right, a hot ball, a halo.
  const rockArt = u => `<g class="rock">
      <path class="trail" d="M0 -4.6L34 -24L38 -16L0 4.6Z" fill="url(#${u}trail)" transform="rotate(4)"/>
      <circle class="halo" r="11" fill="url(#${u}fire)" opacity="0.8"/>
      <circle class="ball" r="5" fill="oklch(0.97 0.07 90)"/>
    </g>
    <circle class="fb" r="3" fill="url(#${u}fire)" opacity="0"/>
    <circle class="ring" r="3" fill="none" stroke="oklch(0.95 0.06 80)" stroke-width="2" opacity="0"/>
    <line class="bolt" stroke="oklch(0.95 0.08 300)" stroke-width="2.6" stroke-linecap="round" opacity="0" filter="url(#${u}g)"/>
    <circle class="muz" r="2" fill="oklch(0.95 0.08 300)" opacity="0" filter="url(#${u}g)"/>`;

  // The shared motion: the rock follows the pointer and the barrel tracks it.
  // While the pointer stays, the arc charges and the gun fires: a bolt, a recoil, a fireball; a new rock grows back.
  // P: the pivot. ROCK: the rock at rest. box: where the rock may go. len: the muzzle's distance from the pivot.
  const run = (svg, P, ROCK, box, len) => {
    const q = c => svg.querySelector(c);
    const barrel = q('.barrel'), slide = q('.slide'), arc = q('.arc'), arc2 = q('.arc2'), core = q('.core'), rock = q('.rock'), ball = q('.ball'), halo = q('.halo'), trail = q('.trail');
    const fb = q('.fb'), ring = q('.ring'), bolt = q('.bolt'), muz = q('.muz');
    const st = { x: ROCK[0], y: ROCK[1], a: 0, rec: 0, c: 0 };
    const angle = () => clamp(Math.atan2(P[1] - st.y, st.x - P[0]) * 180 / Math.PI, 8, 60);
    const draw = () => {
      barrel.setAttribute('transform', `translate(${P[0]} ${P[1]}) rotate(${f(-st.a)})`);
      slide.setAttribute('transform', `translate(${f(-st.rec * 6)} 0)`);
      rock.setAttribute('transform', `translate(${f(st.x)} ${f(st.y)})`);
    };
    const jag = j => Array.from({ length: 9 }, (_, i) => `${f(12 + 44 * i / 8)},${f(i && i < 8 ? (Math.random() - 0.5) * 2 * j : 0)}`).join(' ');
    const charge = c => {
      arc.setAttribute('points', jag(0.6 + 2.6 * c));
      arc2.setAttribute('points', jag(0.4 + 1.6 * c));
      arc.setAttribute('opacity', f(0.35 + 0.65 * c));
      arc2.setAttribute('opacity', f(0.2 + 0.8 * c));
      core.setAttribute('opacity', f(0.4 + 0.6 * c));
      core.setAttribute('r', f(3.4 + 3 * c));
    };
    st.a = angle();
    draw();
    const aim = (p, snap) => gsap.to(st, { x: clamp(p[0], box[0], box[2]), y: clamp(p[1], box[1], box[3]), duration: snap ? 0.35 : 0.7, ease: 'power2.out', overwrite: 'auto', onUpdate() { st.a = angle(); draw(); } });
    const fire = () => {
      const r = st.a * Math.PI / 180, m = [P[0] + Math.cos(r) * len, P[1] - Math.sin(r) * len], hx = st.x, hy = st.y;
      gsap.set(bolt, { attr: { x1: m[0], y1: m[1], x2: hx, y2: hy }, opacity: 1 });
      gsap.to(bolt, { opacity: 0, duration: 0.4, ease: 'power2.in' });
      gsap.fromTo(muz, { attr: { cx: m[0], cy: m[1], r: 2 }, opacity: 1 }, { attr: { r: 10 }, opacity: 0, duration: 0.45, ease: 'power2.out' });
      gsap.fromTo(st, { rec: 1 }, { rec: 0, duration: 0.9, ease: 'elastic.out(1, 0.5)', onUpdate: draw });
      const g = { k: 0 };
      const grow = () => { ball.setAttribute('r', f(5 * g.k)); halo.setAttribute('r', f(11 * g.k)); trail.setAttribute('transform', `rotate(4) scale(${f(Math.max(g.k, 0.001))})`); };
      gsap.timeline({ delay: 0.12 })
        .to([ball, halo, trail], { opacity: 0, duration: 0.1 }, 0)
        .fromTo(fb, { attr: { cx: hx, cy: hy, r: 4 }, opacity: 1 }, { attr: { r: 20 }, opacity: 0, duration: 1.2, ease: 'power2.out' }, 0)
        .fromTo(ring, { attr: { cx: hx, cy: hy, r: 4 }, opacity: 0.9 }, { attr: { r: 40 }, opacity: 0, duration: 1.4, ease: 'power2.out' }, 0)
        .add(() => { g.k = 0; grow(); gsap.set([ball, halo, trail], { opacity: 1 }); }, 1.5)
        .to(g, { k: 1, duration: 0.7, ease: 'power2.out', onUpdate: grow }, 1.5);
    };
    let cyc = null;
    return {
      enter(p) {
        if (p) aim(p, true);
        cyc?.kill();
        cyc = gsap.timeline({ repeat: -1, repeatDelay: 0.3 })
          .to(st, { c: 1, duration: 1.2, ease: 'power1.in', onUpdate: () => charge(st.c) })
          .add(() => { st.c = 0; charge(0); fire(); })
          .to({}, { duration: 2.2 });
      },
      move(p) { if (p) aim(p); },
      leave() { cyc?.kill(); cyc = null; gsap.to(st, { c: 0, duration: 0.3, onUpdate: () => charge(st.c) }); aim(ROCK); },
    };
  };
  // The emblem gun at an angle a, pivot P.
  const gunEmblem = (P, a) => `<g transform="translate(${P[0]} ${P[1]}) rotate(${-a})"><path d="${RAILS}" fill="#fff"/>${[18, 31, 44].map(x => `<path d="M${x} -13.4H${x + 5}V13.4H${x}Z" fill="#9a9a9a"/>`).join('')}<path d="M12 0H56" stroke="#fff" stroke-width="2.4"/><path d="${BREECH}" fill="#fff"/></g>`;
  const rockEmblem = ([x, y]) => `<g transform="translate(${x} ${y})"><path d="M0 -4.6L34 -24L38 -16L0 4.6Z" fill="#7a7a7a" transform="rotate(4)"/><circle r="7" fill="#fff"/></g>`;

  /* ================= A: Shaded object ================= */

  const A_P = [46, 84], A_ROCK = [104, 24];
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [12, 4, 112, 108],
    idea: 'The gun as the object: a sloped turret housing in dusty sand paint on a steel plinth, a heavy breech, twin dark rails with three copper coils, a violet arc between the rails. A burning rock falls in at the upper right, its fire trail behind it. The pointer moves the rock and the barrel tracks it. While the pointer stays, the arc charges and crackles, then the gun fires: a violet bolt, a recoil, a fireball and a shock ring; a new rock grows back.',
    art(svg, u) {
      svg.innerHTML = `<defs>${gunDefs(u)}</defs>
        <ellipse cx="46" cy="113" rx="40" ry="3.4" fill="oklch(0.05 0.01 60)" opacity="0.6" filter="url(#${u}b)"/>
        ${rockArt(u)}
        <g class="barrel">${gun(u)}</g>
        ${mount(u)}`;
      return run(svg, A_P, A_ROCK, [76, 10, 114, 58], 56);
    },
    emblem: `${EMB_HEAD}${rockEmblem(A_ROCK)}${gunEmblem(A_P, 38)}<path d="M14 104H78V112H14Z" fill="#fff"/><path d="M20 104L25 86Q26 82 30 82H62Q66 82 67 86L72 104Z" fill="#bdbdbd" stroke="#000" stroke-width="1.6"/></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A block of the desert: a sand top, two faces in dusty strata; the gun stands on it.
  const CY = 84, HX = 30, HY = 30, T = 16;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // The gun at 0.62, its plinth on the middle of the top.
  const GS = 0.7, GX = 64 - 46 * GS, GY = CY + 4 - 112 * GS;
  const D_P = [GX + A_P[0] * GS, GY + A_P[1] * GS], D_ROCK = [104, 18];
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [12, 4, 106, 112],
    idea: 'A block of the toy\'s desert at 30 degrees: a pale sand top, a left face and a right face in dusty strata, a rim on the top edges. The gun stands in the middle of the top; the burning rock falls in above. The pointer moves the rock, the barrel tracks it, and the gun charges and fires as in A.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      const band = (face, k0, k1, c) => `<path d="${face === 'L' ? poly([down(W, k0), down(S, k0), down(S, k1), down(W, k1)]) : poly([down(S, k0), down(E, k0), down(E, k1), down(S, k1)])}" fill="${c}"/>`;
      svg.innerHTML = `<defs>${gunDefs(u)}
          ${lg(`${u}top`, [[0, 'oklch(0.78 0.05 72)'], [1, 'oklch(0.62 0.05 60)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 60)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        ${band('L', 0, 0.45, 'oklch(0.56 0.05 60)')}${band('L', 0.45, 0.7, 'oklch(0.48 0.05 45)')}${band('L', 0.7, 1, 'oklch(0.42 0.045 50)')}
        ${band('R', 0, 0.45, 'oklch(0.4 0.04 60)')}${band('R', 0.45, 0.7, 'oklch(0.33 0.04 45)')}${band('R', 0.7, 1, 'oklch(0.28 0.035 50)')}
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="url(#${u}rim)" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <ellipse cx="64" cy="${CY + 4}" rx="20" ry="6" fill="oklch(0.25 0.03 60)" opacity="0.5" filter="url(#${u}b)"/>
        ${rockArt(u)}
        <g class="barrel">${gun(u).replace('<g class="slide">', `<g transform="scale(${GS})"><g class="slide">`)}</g></g>
        <g transform="translate(${f(GX)} ${f(GY)}) scale(${GS})">${mount(u)}</g>`;
      return run(svg, D_P, D_ROCK, [76, 6, 114, 46], 56 * GS);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#9a9a9a"/>${rockEmblem(D_ROCK)}<g transform="translate(${f(GX)} ${f(GY)}) scale(${GS})">${gunEmblem(A_P, 40)}<path d="M14 104H78V112H14Z" fill="#fff"/><path d="M20 104L25 86Q26 82 30 82H62Q66 82 67 86L72 104Z" fill="#bdbdbd" stroke="#000" stroke-width="1.6"/></g></svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = "Railgun";
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-railgun';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `railgun-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      // A menu tile with no data-box fits its drawn bounds, as the menu does.
      const bb = D.box === "bbox" && svg.getBBox();
      fitIcon(svg, bb ? [bb.x, bb.y, bb.width, bb.height] : D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
