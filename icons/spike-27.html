<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 27</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike 27</h1>
<p class="lede">Fireworks, a fresh start: one bloom as a real object, like Galaxy and Fire. Move the pointer over a tile.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const rad = (defs, id, cx, cy, r, stops, user) => {
    const g = el('radialGradient', { id, cx, cy, r, ...(user ? { gradientUnits: 'userSpaceOnUse' } : {}) }, defs);
    stops.forEach(([o, c, a = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g));
    return g;
  };
  const glowF = (defs, id, sd) => {
    const g = el('filter', { id, x: -0.3, y: -0.3, width: 1.6, height: 1.6 }, defs);
    el('feGaussianBlur', { stdDeviation: sd, result: 'b' }, g);
    const m = el('feMerge', {}, g);
    el('feMergeNode', { in: 'b' }, m);
    el('feMergeNode', { in: 'SourceGraphic' }, m);
  };
  // A control: aim from the pointer, a demo on focus, a rest on leave.
  const ctl = ({ aim, rest, demo, enter = () => {}, leave = () => {} }) => {
    let tl = null;
    return {
      enter(p) { enter(); if (p) aim(p); else tl = demo(); },
      move(p) { if (p && !tl) aim(p); },
      leave() { tl?.kill(); tl = null; leave(); rest(); },
    };
  };

  const DIRS = [];

  /* ================= Current ================= */

  DIRS.push({
    l: 'Current', name: 'Menu icon', box: [16, 16, 98, 98], emblemUrl: '../shared/emblems/fireworks.svg',
    art(svg) {
      svg.innerHTML = `
        <rect x="22" y="22" width="92" height="92" fill="oklch(0.07 0.01 260)"/>
        <rect x="16" y="16" width="92" height="92" fill="oklch(0.2 0.04 270)"/>
        <rect x="16" y="88" width="92" height="20" fill="oklch(0.13 0.03 260)"/>
        <path d="M16 88L40 80L62 86L84 78L108 84V88Z" fill="oklch(0.1 0.02 260)"/>
        <g stroke="oklch(0.84 0.16 80)" stroke-width="3" stroke-linecap="square">
          <path d="M62 30V40M62 64V74M40 52H50M74 52H84M46.4 36.4L53.5 43.5M70.5 60.5L77.6 67.6M46.4 67.6L53.5 60.5M70.5 43.5L77.6 36.4"/>
        </g>
        <circle cx="62" cy="52" r="3.4" fill="oklch(0.95 0.06 90)"/>
        <rect x="88" y="70" width="2.6" height="10" fill="oklch(0.78 0.18 30)"/>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A · Bloom ================= */

  // One shell's bloom as a 3D object: comet stars on a sphere, seen from outside.
  // Front stars are bright and wide; back stars are dim and thin.
  // Each comet droops under gravity, so its tail curves.
  // The pointer turns the sphere; hover fires it again in the next colours.
  {
    const C = [64, 58], R = 44, N = 72;
    // Stars on a Fibonacci sphere: even spacing, no seams.
    const DIR = Array.from({ length: N }, (_, i) => {
      const y = 1 - (2 * (i + 0.5)) / N, r = Math.sqrt(1 - y * y), a = i * 2.39996;
      return [r * Math.cos(a), y, r * Math.sin(a), 0.9 + ((i * 37) % 11) / 55];
    });
    // Colour pairs: the outer shell, then the inner pistil.
    const PAL = [
      ['oklch(0.7 0.24 350)', 'oklch(0.9 0.15 85)'],
      ['oklch(0.8 0.14 210)', 'oklch(0.97 0.03 95)'],
      ['oklch(0.82 0.2 140)', 'oklch(0.88 0.16 80)'],
      ['oklch(0.66 0.23 28)', 'oklch(0.95 0.04 260)'],
      ['oklch(0.66 0.21 305)', 'oklch(0.9 0.15 85)'],
    ];
    const HOT = 'oklch(0.99 0.03 95)';
    // Turn a direction by yaw, then pitch.
    const turn = ([x, y, z], yaw, pitch) => {
      const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
      const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
      return [x1, y * cp - z1 * sp, y * sp + z1 * cp];
    };
    // One comet: a tapered, drooping body from r0 to r1, as a closed path.
    const comet = (d, r0, r1, sag, w) => {
      const pt = k => [C[0] + d[0] * R * k, C[1] - d[1] * R * k + sag * k * k];
      const P = Array.from({ length: 7 }, (_, i) => pt(r0 + ((r1 - r0) * i) / 6));
      const Lf = [], Rt = [];
      P.forEach((p, i) => {
        const q = P[Math.min(6, i + 1)], o = P[Math.max(0, i - 1)], tx = q[0] - o[0], ty = q[1] - o[1], m = Math.hypot(tx, ty) || 1;
        const h = (w * (0.12 + 0.88 * (i / 6) ** 1.6)) / 2;
        Lf.push([p[0] - (ty / m) * h, p[1] + (tx / m) * h]); Rt.push([p[0] + (ty / m) * h, p[1] - (tx / m) * h]);
      });
      const hd = P[6];
      return { d: 'M' + [...Lf, ...Rt.reverse()].map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z', head: hd };
    };
    // A frame of the bloom: s is how far the stars have flown, from 0 to 1.
    const shape = (s, yaw, pitch) => DIR.map(d0 => {
      const d = turn(d0, yaw, pitch), front = (d[2] + 1) / 2, k = s * d0[3];
      const outer = comet(d, Math.max(0, k - 0.78), k, 12 * s * s, 1.1 + 2.4 * front);
      const inner = comet(d, Math.max(0, k * 0.52 - 0.34), k * 0.52, 5 * s * s, 0.9 + 1.7 * front);
      return { z: d[2], front, outer, inner };
    }).sort((a, b) => a.z - b.z);
    const REST = { s: 1, yaw: 0.5, pitch: -0.35 };
    // Glitter: a few sparks ride each outer tail at fixed fractions.
    const SPARK = DIR.map((_, i) => [0.35 + ((i * 53) % 17) / 40, 0.55 + ((i * 29) % 13) / 40]);
    DIRS.push({
      l: 'A', name: 'Bloom', box: [10, 6, 108, 112],
      idea: 'One bloom as a real object: comet stars on a sphere, each tail fading in from the dark and burning white at the head, drooping under gravity. Front stars are bright and wide, back stars dim. The pointer turns the sphere in space; hover fires it again in the next colours, with glitter.',
      art(svg, id) {
        const defs = el('defs', {}, svg);
        rad(defs, `${id}halo`, C[0], C[1], 64, [[0, 'oklch(0.8 0.13 70)', 0.5], [0.4, 'oklch(0.6 0.2 350)', 0.2], [1, 'oklch(0.3 0.1 300)', 0]], true);
        rad(defs, `${id}core`, C[0], C[1], 9, [[0, HOT], [0.5, 'oklch(0.92 0.14 85)', 0.8], [1, 'oklch(0.85 0.16 70)', 0]], true);
        // Tails fade in from the centre, burn in colour, go white at the rim.
        const og = rad(defs, `${id}o`, C[0], C[1] + 4, R + 8, [[0, '#000', 0], [0.3, '#000', 0], [0.72, '#000', 0.95], [0.94, HOT, 1]], true);
        const ig = rad(defs, `${id}i`, C[0], C[1] + 2, R * 0.56, [[0, '#000', 0], [0.35, '#000', 0.2], [0.85, '#000', 1], [1, HOT, 1]], true);
        const tint = (g, col) => { const st = g.querySelectorAll('stop'); [0, 1, 2].forEach(k => st[k].setAttribute('stop-color', col)); };
        glowF(defs, `${id}g`, 1.3);
        const halo = el('circle', { cx: C[0], cy: C[1], r: 64, fill: `url(#${id}halo)` }, svg);
        const body = el('g', { filter: `url(#${id}g)` }, svg);
        const core = el('circle', { cx: C[0], cy: C[1], r: 9, fill: `url(#${id}core)` }, svg);
        const O = [], I = [], H = [], S = [];
        for (let i = 0; i < N; i++) {
          I.push(el('path', { fill: `url(#${id}i)` }, body));
          O.push(el('path', { fill: `url(#${id}o)` }, body));
          H.push(el('circle', { fill: HOT }, body));
          S.push([el('circle', { fill: HOT, r: 0.55 }, body), el('circle', { fill: HOT, r: 0.45 }, body)]);
        }
        const st = { ...REST, pal: 0, flash: 0, tw: 0 };
        const paint = () => {
          const [oc, ic] = PAL[st.pal % PAL.length];
          tint(og, oc); tint(ig, ic);
          shape(st.s, st.yaw, st.pitch).forEach((c, i) => {
            const a = 0.3 + 0.7 * c.front, h = c.outer.head;
            I[i].setAttribute('d', c.inner.d); I[i].setAttribute('opacity', f(a));
            O[i].setAttribute('d', c.outer.d); O[i].setAttribute('opacity', f(a));
            H[i].setAttribute('cx', f(h[0])); H[i].setAttribute('cy', f(h[1]));
            H[i].setAttribute('r', f((0.45 + 0.95 * c.front) * Math.min(1, st.s * 1.4)));
            H[i].setAttribute('opacity', f(a));
            // Sparks sit back along the tail and twinkle while the bloom is live.
            S[i].forEach((sp, k) => {
              const u = SPARK[i][k], x = C[0] + (h[0] - C[0]) * u, y = C[1] + (h[1] - C[1]) * u + 3 * u;
              const on = Math.sin(st.tw * 9 + i * 1.7 + k * 2.3) > 0.35 ? 1 : 0.15;
              sp.setAttribute('cx', f(x)); sp.setAttribute('cy', f(y)); sp.setAttribute('opacity', f(a * on * Math.min(1, st.s)));
            });
          });
          core.setAttribute('r', f(4 + 10 * st.flash));
          halo.setAttribute('opacity', f(0.7 + 0.6 * st.flash));
        };
        paint();
        let loop = null, twk = null;
        const fire = () => {
          st.pal++;
          gsap.timeline()
            .set(st, { s: 0, flash: 1 })
            .to(st, { s: 1, duration: 1.2, ease: 'expo.out', onUpdate: paint }, 0)
            .to(st, { flash: 0, duration: 0.5, ease: 'power2.out', onUpdate: paint }, 0);
        };
        const aim = p => gsap.to(st, { yaw: clamp((p[0] - C[0]) / 64, -1, 1) * 1.1, pitch: clamp((p[1] - C[1]) / 64, -1, 1) * -0.9, duration: 0.5, ease: 'power2.out', overwrite: 'auto', onUpdate: paint });
        return ctl({
          aim,
          enter() {
            if (!loop) { fire(); loop = gsap.delayedCall(2.2, function again() { fire(); loop = gsap.delayedCall(2.2, again); }); }
            if (!twk) twk = gsap.to(st, { tw: '+=10', duration: 10, repeat: -1, ease: 'none', onUpdate: paint });
          },
          leave() { loop?.kill(); loop = null; twk?.kill(); twk = null; },
          rest: () => gsap.to(st, { yaw: REST.yaw, pitch: REST.pitch, s: 1, flash: 0, duration: 0.9, ease: 'power2.inOut', overwrite: 'auto', onUpdate: paint }),
          demo: () => { const o = { a: 0 }; return gsap.to(o, { a: 1, duration: 4, repeat: -1, ease: 'none', onUpdate: () => aim([64 + 40 * Math.cos(o.a * TAU), 58 + 30 * Math.sin(o.a * TAU)]) }); },
        });
      },
      emblem: () => {
        const cs = shape(1, REST.yaw, REST.pitch).filter(c => c.front > 0.3);
        return emb(cs.map(c => `<path d="${c.outer.d}" fill="#fff" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>`).join('\n') + `\n<circle cx="${C[0]}" cy="${C[1]}" r="8" fill="#fff"/>`);
      },
    });
  }

  /* ================= Gallery ================= */

  const NAME = 'Fireworks';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : { x: 14, y: 14, width: 100, height: 100 }, side = Math.max(b.width, b.height);
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-fireworks';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  window.CTL = {};
  if (location.search.includes('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(Object.fromEntries(DIRS.filter(D => D.emblem).map(D => [`fireworks27-${D.l.toLowerCase()}`, D.emblem()])));
    document.body.append(pre);
  }
  for (const D of DIRS) {
    const file = `fireworks27-${D.l.toLowerCase()}`;
    const url = D.emblemUrl || (D.emblem ? `spike/emblems/${file}.svg` : '');
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = D.l === 'Current' ? 'fireworks-current' : file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tile => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      (window.CTL[D.l] ||= []).push({ c, svg });
      if (reduce) return;
      tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tile.addEventListener('pointermove', e => c.move(local(svg, e)));
      tile.addEventListener('pointerleave', () => c.leave());
      tile.addEventListener('focus', () => c.enter(null));
      tile.addEventListener('blur', () => c.leave());
    });
  }
})();
</script>
</body>
</html>
