<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 16</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- The lightbox: warm and bright at the top left, cool at the foot. -->
    <linearGradient id="ik-box" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" style="stop-color: oklch(0.98 0.02 85)"/>
      <stop offset="0.6" style="stop-color: oklch(0.88 0.02 90)"/>
      <stop offset="1" style="stop-color: oklch(0.78 0.025 235)"/>
    </linearGradient>
    <!-- The ink: deep indigo in the core, a lighter tint at the thin edge. -->
    <radialGradient id="ik-ink" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" style="stop-color: oklch(0.52 0.15 262)"/>
      <stop offset="1" style="stop-color: oklch(0.3 0.15 268)"/>
    </radialGradient>
  </defs>
</svg>

<h1>Icon spike 16</h1>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };
  const loop = (o = {}) => gsap.timeline({ repeat: -1, ...o });

  // The menu icon's own fall: the plume sinks, the ring opens, the fingers draw, the tips pop.
  const fall = (svg, rise = 22) => {
    const plume = svg.querySelector('.plume'), ring = svg.querySelectorAll('.ring'), fingers = svg.querySelectorAll('.finger'), caps = svg.querySelectorAll('.cap');
    return hoverLoop(
      () => loop({ repeatDelay: 0.5 })
        .fromTo(plume, { y: -rise }, { y: 0, duration: 1.1, ease: 'power2.out' })
        .fromTo(ring, { scaleX: 0.35, scaleY: 0.7, transformOrigin: '50% 50%' }, { scaleX: 1, scaleY: 1, transformOrigin: '50% 50%', duration: 1.1, ease: 'power2.out' }, 0)
        .fromTo(fingers, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, stagger: 0.14, ease: 'power1.in' }, 0.7)
        .fromTo(caps, { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.5, stagger: 0.14, ease: 'back.out(2)' }, 1.2),
      () => {
        gsap.to(plume, { y: 0, duration: 0.3, overwrite: true });
        gsap.to(ring, { scaleX: 1, scaleY: 1, transformOrigin: '50% 50%', duration: 0.3, overwrite: true });
        gsap.to(fingers, { strokeDashoffset: 0, duration: 0.3, overwrite: true });
        gsap.to(caps, { scale: 1, duration: 0.3, overwrite: true });
      });
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  DIRS.push({
    toy: 'ink', l: 'Current', name: 'Menu icon', emblemUrl: '../shared/emblems/ink.svg',
    box: [16, 16, 98, 98],
    art(svg) {
      svg.innerHTML = `
        <rect x="22" y="22" width="92" height="92" fill="oklch(0.07 0.01 260)"/>
        <rect x="16" y="16" width="92" height="92" fill="oklch(0.88 0.025 85)"/>
        <path d="M16 16H60L16 66Z" fill="oklch(0.97 0.02 85)"/>
        <g class="plume">
          <path d="M63 20c-2 10 2 20-1 34" fill="none" stroke="oklch(0.5 0.14 262)" stroke-width="3" stroke-linecap="round"/>
          <g fill="none" stroke="oklch(0.42 0.17 266)" stroke-width="3.4" stroke-linecap="round">
            <path class="finger" pathLength="1" d="M52 60l-5 20"/>
            <path class="finger" pathLength="1" d="M62 62l1 26"/>
            <path class="finger" pathLength="1" d="M72 60l6 18"/>
          </g>
          <g fill="oklch(0.42 0.17 266)">
            <circle class="cap" cx="47" cy="80" r="4"/>
            <circle class="cap" cx="63" cy="88" r="4"/>
            <circle class="cap" cx="78" cy="78" r="4"/>
          </g>
          <g class="ring">
            <ellipse cx="62" cy="56" rx="16" ry="7" fill="oklch(0.42 0.17 266)"/>
            <ellipse cx="62" cy="55" rx="7" ry="2.4" fill="oklch(0.62 0.12 258)"/>
          </g>
        </g>`;
      return fall(svg, 24);
    },
  });

  // A teardrop: the tip at the top, a round belly of radius r centred at cx, cy.
  const tear = (cx, cy, r, h) => `M${cx} ${cy - h}C${f(cx + r * 0.18)} ${f(cy - h * 0.55)} ${cx + r} ${f(cy - r * 0.85)} ${cx + r} ${cy}A${r} ${r} 0 0 1 ${cx - r} ${cy}C${cx - r} ${f(cy - r * 0.85)} ${f(cx - r * 0.18)} ${f(cy - h * 0.55)} ${cx} ${cy - h}Z`;
  // A glossy drop: deep ink, the shared glint, a rim, and two highlights, as the bubbles have.
  const dropSvg = (id, cx, cy, r, h, hue, L = 0.5) => `
    <radialGradient id="${id}" cx="0.36" cy="0.42" r="0.75">
      <stop offset="0" style="stop-color: oklch(${L + 0.18} 0.15 ${hue})"/>
      <stop offset="0.7" style="stop-color: oklch(${L} 0.19 ${hue})"/>
      <stop offset="1" style="stop-color: oklch(${L - 0.2} 0.15 ${hue})"/>
    </radialGradient>
    <path d="${tear(cx, cy, r, h)}" fill="url(#${id})"/>
    <path d="${tear(cx, cy, r, h)}" fill="url(#lit)"/>
    <path d="${tear(cx, cy, r, h)}" fill="none" stroke="url(#rim)" stroke-width="${f(Math.max(1.2, r * 0.07))}"/>
    <ellipse cx="${f(cx - r * 0.42)}" cy="${f(cy - r * 0.38)}" rx="${f(r * 0.3)}" ry="${f(r * 0.15)}" transform="rotate(-50 ${f(cx - r * 0.42)} ${f(cy - r * 0.38)})" fill="#fff" fill-opacity="0.85"/>
    <circle cx="${f(cx + r * 0.5)}" cy="${f(cy + r * 0.48)}" r="${f(r * 0.08)}" fill="#fff" fill-opacity="0.55"/>`;

  /* ================= A · Shaded object ================= */

  // A porthole on dark water; side light catches a glowing ring of ink and its fine curls.
  DIRS.push({
    toy: 'ink', l: 'A', name: 'Shaded object', emblemUrl: 'spike/emblems/ink-a.svg',
    box: [12, 12, 104, 104],
    art(svg, id) {
      svg.innerHTML = `
        <defs>
          <clipPath id="${id}c"><circle cx="64" cy="64" r="50"/></clipPath>
          <radialGradient id="${id}w" cx="0.3" cy="0.28" r="0.85"><stop offset="0" style="stop-color: oklch(0.25 0.05 252)"/><stop offset="1" style="stop-color: oklch(0.1 0.03 266)"/></radialGradient>
          <linearGradient id="${id}t" gradientUnits="userSpaceOnUse" x1="0" y1="66" x2="0" y2="106"><stop offset="0" style="stop-color: oklch(0.62 0.16 258)"/><stop offset="1" style="stop-color: oklch(0.62 0.16 258)" stop-opacity="0"/></linearGradient>
          <linearGradient id="${id}r" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="48"><stop offset="0" style="stop-color: oklch(0.7 0.12 255)" stop-opacity="0"/><stop offset="1" style="stop-color: oklch(0.7 0.12 255)"/></linearGradient>
          <filter id="${id}b" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
        </defs>
        <circle cx="64" cy="64" r="50" fill="url(#${id}w)"/>
        <g clip-path="url(#${id}c)">
          <path d="M6 26L48 6L122 96L104 124Z" fill="oklch(0.9 0.04 240)" opacity="0.06"/>
          <g class="plume">
            <path class="fil" pathLength="1" d="M66 12c-4 12 4 22-2 36" fill="none" stroke="url(#${id}r)" stroke-width="1.6" stroke-linecap="round"/>
            <g fill="none" stroke="url(#${id}t)" stroke-width="2.6" stroke-linecap="round" filter="url(#${id}b)" opacity="0.9">
              <path d="M52 68c-6 10 6 18-2 30"/><path d="M64 70c6 12-6 20 2 34"/><path d="M76 68c6 10-6 16 2 28"/>
            </g>
            <g class="cap" filter="url(#${id}b)">
              <circle cx="49" cy="61" r="12" fill="oklch(0.58 0.18 264)"/>
              <circle cx="79" cy="61" r="12" fill="oklch(0.58 0.18 264)"/>
              <ellipse cx="64" cy="55" rx="20" ry="9" fill="oklch(0.68 0.15 258)"/>
            </g>
            <g fill="none" stroke="oklch(0.9 0.08 245)" stroke-width="1.2" stroke-linecap="round">
              <path class="fil" pathLength="1" d="M42 66c-7-4-3-15 6-13c7 2 6 11-1 10"/>
              <path class="fil" pathLength="1" d="M86 66c7-4 3-15-6-13c-7 2-6 11 1 10"/>
              <path class="fil" pathLength="1" d="M44 52c7-11 33-11 40 0"/>
            </g>
          </g>
        </g>
        <circle cx="64" cy="64" r="50" fill="url(#lit)" opacity="0.5"/>
        <circle cx="64" cy="64" r="49.2" fill="none" stroke="url(#rim)" stroke-width="1.8"/>
        <circle cx="64" cy="64" r="50" fill="none" stroke="oklch(0.34 0.04 262)" stroke-width="1"/>`;
      const plume = svg.querySelector('.plume'), cap = svg.querySelector('.cap'), fils = svg.querySelectorAll('.fil');
      return hoverLoop(
        () => loop({ repeatDelay: 0.4 })
          .fromTo(plume, { y: -16 }, { y: 4, duration: 2.2, ease: 'sine.out' })
          .fromTo(cap, { scaleX: 0.6, scaleY: 0.8, transformOrigin: '50% 50%' }, { scaleX: 1.08, scaleY: 1, transformOrigin: '50% 50%', duration: 2.2, ease: 'sine.out' }, 0)
          .fromTo(fils, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.4, stagger: 0.12, ease: 'sine.inOut' }, 0.3),
        () => {
          gsap.to(plume, { y: 0, duration: 0.4, overwrite: true });
          gsap.to(cap, { scaleX: 1, scaleY: 1, duration: 0.4, overwrite: true });
          gsap.to(fils, { strokeDashoffset: 0, duration: 0.4, overwrite: true });
        });
    },
  });

  /* ================= B · One drop ================= */

  // One glossy drop of indigo ink, the moment before it meets the water.
  DIRS.push({
    toy: 'ink', l: 'B', name: 'One drop', emblemUrl: 'spike/emblems/ink-b.svg',
    box: [30, 12, 68, 104],
    art(svg, id) {
      svg.innerHTML = `
        <ellipse class="ripple" cx="64" cy="112" rx="30" ry="4" fill="none" stroke="oklch(0.7 0.1 255)" stroke-width="1.4" opacity="0"/>
        <g class="drop">${dropSvg(`${id}d`, 64, 78, 30, 64, 266)}</g>`;
      const drop = svg.querySelector('.drop'), rip = svg.querySelector('.ripple');
      return hoverLoop(
        () => loop({ repeatDelay: 0.3 })
          .to(drop, { scaleY: 1.06, scaleX: 0.95, transformOrigin: '50% 100%', duration: 0.5, ease: 'sine.inOut' })
          .to(drop, { y: 18, opacity: 0, duration: 0.45, ease: 'power2.in' })
          .fromTo(rip, { opacity: 0.9, attr: { rx: 6, ry: 1 } }, { opacity: 0, attr: { rx: 40, ry: 6 }, duration: 0.8, ease: 'power2.out' }, '-=0.1')
          .fromTo(drop, { y: -20, opacity: 0, scaleX: 1, scaleY: 1 }, { y: 0, opacity: 1, duration: 0.6, ease: 'power2.out' }),
        () => {
          gsap.to(drop, { y: 0, opacity: 1, scaleX: 1, scaleY: 1, duration: 0.3, overwrite: true });
          gsap.to(rip, { opacity: 0, duration: 0.2, overwrite: true });
        });
    },
  });

  /* ================= C · Three drops ================= */

  // Indigo, carmine and saffron fall in a loose cascade, each with its own glint.
  DIRS.push({
    toy: 'ink', l: 'C', name: 'Three drops', emblemUrl: 'spike/emblems/ink-c.svg',
    box: [16, 12, 96, 100],
    art(svg, id) {
      svg.innerHTML = `
        <g class="dr">${dropSvg(`${id}a`, 44, 82, 24, 50, 266)}</g>
        <g class="dr">${dropSvg(`${id}b`, 88, 64, 17, 36, 18, 0.52)}</g>
        <g class="dr">${dropSvg(`${id}c`, 76, 30, 11, 24, 78, 0.7)}</g>`;
      const drs = svg.querySelectorAll('.dr');
      return hoverLoop(
        () => loop().to(drs, { y: 6, duration: 0.7, ease: 'sine.inOut', yoyo: true, repeat: 1, stagger: 0.18 }),
        () => gsap.to(drs, { y: 0, duration: 0.3, overwrite: true }));
    },
  });

  /* ================= D · Backlit slab ================= */

  // A lit slab of water on its hard shadow; the ink blooms in it like watercolour, dark core, pale edge.
  DIRS.push({
    toy: 'ink', l: 'D', name: 'Backlit slab', emblemUrl: 'spike/emblems/ink-d.svg',
    box: [12, 12, 110, 110],
    art(svg, id) {
      svg.innerHTML = `
        <defs>
          <clipPath id="${id}c"><rect x="12" y="12" width="104" height="104" rx="12"/></clipPath>
          <radialGradient id="${id}l" cx="0.34" cy="0.3" r="0.9"><stop offset="0" style="stop-color: oklch(0.99 0.02 85)"/><stop offset="0.6" style="stop-color: oklch(0.9 0.02 90)"/><stop offset="1" style="stop-color: oklch(0.76 0.03 235)"/></radialGradient>
          <filter id="${id}s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2"/></filter>
          <filter id="${id}m" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.2"/></filter>
        </defs>
        <rect x="18" y="18" width="104" height="104" rx="12" fill="oklch(0.07 0.01 260)"/>
        <rect x="12" y="12" width="104" height="104" rx="12" fill="url(#${id}l)"/>
        <g clip-path="url(#${id}c)" style="isolation: isolate">
          <g class="ink" style="mix-blend-mode: multiply">
            <path d="M66 14c-4 12 4 22-2 34" fill="none" stroke="oklch(0.62 0.12 262)" stroke-width="2.2" stroke-linecap="round" filter="url(#${id}m)"/>
            <g class="bl" fill="oklch(0.74 0.1 262)" filter="url(#${id}s)">
              <circle cx="48" cy="62" r="15"/><circle cx="80" cy="62" r="15"/><ellipse cx="64" cy="55" rx="22" ry="11"/>
              <path d="M50 70c-8 12 8 20-2 34M64 72c8 14-8 22 2 36M78 70c8 12-8 18 2 30" fill="none" stroke="oklch(0.74 0.1 262)" stroke-width="5" stroke-linecap="round"/>
            </g>
            <g class="bl" fill="oklch(0.4 0.17 266)" filter="url(#${id}m)">
              <circle cx="49" cy="62" r="9"/><circle cx="79" cy="62" r="9"/><ellipse cx="64" cy="56" rx="15" ry="6"/>
            </g>
          </g>
        </g>
        <rect x="12" y="12" width="104" height="104" rx="12" fill="url(#lit)" opacity="0.45"/>
        <rect x="12.8" y="12.8" width="102.4" height="102.4" rx="11.4" fill="none" stroke="url(#rim)" stroke-width="1.6"/>`;
      const ink = svg.querySelector('.ink'), bls = svg.querySelectorAll('.bl'), fils = svg.querySelectorAll('.fil');
      return hoverLoop(
        () => loop({ repeatDelay: 0.4 })
          .fromTo(ink, { y: -14 }, { y: 2, duration: 2.2, ease: 'sine.out' })
          .fromTo(bls, { scale: 0.6, transformOrigin: '50% 40%' }, { scale: 1.06, transformOrigin: '50% 40%', duration: 2.2, ease: 'sine.out' }, 0)
          .fromTo(fils, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.4, stagger: 0.12, ease: 'sine.inOut' }, 0.4),
        () => {
          gsap.to(ink, { y: 0, duration: 0.4, overwrite: true });
          gsap.to(bls, { scale: 1, duration: 0.4, overwrite: true });
          gsap.to(fils, { strokeDashoffset: 0, duration: 0.4, overwrite: true });
        });
    },
  });

  /* ================= E · Abstract mark ================= */

  // A brush ring in ink, heavy at the foot and thin where it opens, with one drop at the gap.
  DIRS.push({
    toy: 'ink', l: 'E', name: 'Brush ring', emblemUrl: 'spike/emblems/ink-e.svg',
    box: [18, 14, 92, 96],
    art(svg, id) {
      svg.innerHTML = `
        <defs>
          <linearGradient id="${id}g" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" style="stop-color: oklch(0.72 0.12 255)"/><stop offset="1" style="stop-color: oklch(0.42 0.18 266)"/></linearGradient>
          <mask id="${id}k"><rect x="0" y="0" width="128" height="128" fill="#fff"/><path class="gap" d="M64 64L118 6L128 40Z" fill="#000"/></mask>
        </defs>
        <g class="ring" mask="url(#${id}k)">
          <path d="M22 66a42 42 0 1 0 84 0a42 42 0 1 0 -84 0ZM34 61a32 32 0 1 0 64 0a32 32 0 1 0 -64 0Z" fill="url(#${id}g)" fill-rule="evenodd"/>
          <path d="M22 66a42 42 0 1 0 84 0a42 42 0 1 0 -84 0ZM34 61a32 32 0 1 0 64 0a32 32 0 1 0 -64 0Z" fill="url(#lit)" fill-rule="evenodd"/>
        </g>
        <g class="dot">${dropSvg(`${id}d`, 102, 26, 7, 15, 266)}</g>`;
      const ring = svg.querySelector('.ring'), dot = svg.querySelector('.dot');
      return hoverLoop(
        () => loop()
          .to(ring, { rotation: 360, svgOrigin: '64 64', duration: 6, ease: 'none' }, 0)
          .to(dot, { y: 8, duration: 0.75, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 0),
        () => {
          gsap.to(ring, { rotation: 0, svgOrigin: '64 64', duration: 0.5, overwrite: true });
          gsap.to(dot, { y: 0, duration: 0.3, overwrite: true });
        });
    },
  });

  /* ================= Gallery ================= */

  const NAMES = { ink: 'Ink in water' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const out = document.getElementById('out');
  let uid = 0;
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || '';
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', () => ctl.enter(null));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
