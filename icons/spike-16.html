<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 16</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- The lightbox: warm and bright at the top left, cool at the foot. -->
    <linearGradient id="ik-box" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" style="stop-color: oklch(0.98 0.02 85)"/>
      <stop offset="0.6" style="stop-color: oklch(0.88 0.02 90)"/>
      <stop offset="1" style="stop-color: oklch(0.78 0.025 235)"/>
    </linearGradient>
    <!-- The ink: deep indigo in the core, a lighter tint at the thin edge. -->
    <radialGradient id="ik-ink" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" style="stop-color: oklch(0.52 0.15 262)"/>
      <stop offset="1" style="stop-color: oklch(0.3 0.15 268)"/>
    </radialGradient>
  </defs>
</svg>

<h1>Icon spike 16</h1>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };
  const loop = (o = {}) => gsap.timeline({ repeat: -1, ...o });

  // The menu icon's own fall: the plume sinks, the ring opens, the fingers draw, the tips pop.
  const fall = (svg, rise = 22) => {
    const plume = svg.querySelector('.plume'), ring = svg.querySelectorAll('.ring'), fingers = svg.querySelectorAll('.finger'), caps = svg.querySelectorAll('.cap');
    return hoverLoop(
      () => loop({ repeatDelay: 0.5 })
        .fromTo(plume, { y: -rise }, { y: 0, duration: 1.1, ease: 'power2.out' })
        .fromTo(ring, { scaleX: 0.35, scaleY: 0.7, transformOrigin: '50% 50%' }, { scaleX: 1, scaleY: 1, transformOrigin: '50% 50%', duration: 1.1, ease: 'power2.out' }, 0)
        .fromTo(fingers, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, stagger: 0.14, ease: 'power1.in' }, 0.7)
        .fromTo(caps, { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.5, stagger: 0.14, ease: 'back.out(2)' }, 1.2),
      () => {
        gsap.to(plume, { y: 0, duration: 0.3, overwrite: true });
        gsap.to(ring, { scaleX: 1, scaleY: 1, transformOrigin: '50% 50%', duration: 0.3, overwrite: true });
        gsap.to(fingers, { strokeDashoffset: 0, duration: 0.3, overwrite: true });
        gsap.to(caps, { scale: 1, duration: 0.3, overwrite: true });
      });
  };

  // The new plume: a billowing cap whose ends roll under, a thin trail above, three wavy tendrils below.
  // Billows: cx, cy, r. The two small ones are the rolled-under ends of the vortex ring.
  const BILLOWS = [[46, 58, 12.5], [64, 50, 14.5], [82, 58, 12.5], [35, 66, 7], [93, 66, 7], [64, 63, 11]];
  const TRAIL = 'M65 8c-3 10 3 20-1 30';
  const TENDRILS = ['M50 68C43 80 57 86 48 99', 'M64 72C71 84 57 92 64 108', 'M78 68C85 80 71 86 80 99'];
  const TIPS = [[48, 99, 4.6], [64, 108, 4.6], [80, 99, 4.6]];
  // Each rolled end shows its curl: a short spiral inside the lobe.
  const CURLS = ['M39 64c-6-3-3-13 5-11c5 1 5 8 0 8', 'M89 64c6-3 3-13-5-11c-5 1-5 8 0 8'];
  const billowSvg = attrs => BILLOWS.map(([x, y, r]) => `<circle class="bil" cx="${x}" cy="${y}" r="${r}" ${attrs}/>`).join('');
  // The bloom: the plume sinks in, the billows swell from small, the tendrils draw down, the tips pop.
  const bloom = (svg, rise = 18) => {
    const plume = svg.querySelector('.plume'), bils = svg.querySelectorAll('.bil'), tens = svg.querySelectorAll('.ten'), tips = svg.querySelectorAll('.tip');
    return hoverLoop(
      () => loop({ repeatDelay: 0.6 })
        .fromTo(plume, { y: -rise }, { y: 0, duration: 1.3, ease: 'power2.out' })
        .fromTo(bils, { scale: 0.45, transformOrigin: '50% 50%' }, { scale: 1, duration: 1.1, stagger: { each: 0.06, from: 'center' }, ease: 'back.out(1.6)' }, 0.1)
        .fromTo(tens, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, stagger: 0.12, ease: 'sine.in' }, 0.8)
        .fromTo(tips, { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.4, stagger: 0.12, ease: 'back.out(2.4)' }, 1.5),
      () => {
        gsap.to(plume, { y: 0, duration: 0.3, overwrite: true });
        gsap.to(bils, { scale: 1, transformOrigin: '50% 50%', duration: 0.3, overwrite: true });
        gsap.to(tens, { strokeDashoffset: 0, duration: 0.3, overwrite: true });
        gsap.to(tips, { scale: 1, duration: 0.3, overwrite: true });
      });
  };
  // The plume as one shaded group: billows, curls, tendrils and tips.
  const plumeSvg = ({ ink, edge, curl, ten, trail, tw = 4.2 }) => `
    <g class="plume">
      <path d="${TRAIL}" fill="none" stroke="${trail}" stroke-width="2.6" stroke-linecap="round"/>
      <g fill="none" stroke="${ten}" stroke-width="${tw}" stroke-linecap="round">${TENDRILS.map(d => `<path class="ten" pathLength="1" d="${d}"/>`).join('')}</g>
      <g fill="${ten}">${TIPS.map(([x, y, r]) => `<circle class="tip" cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>
      <g fill="${ink}" stroke="${edge}" stroke-width="1.6">${billowSvg('')}</g>
      <g fill="${ink}">${billowSvg('')}</g>
      <g fill="none" stroke="${curl}" stroke-width="2.2" stroke-linecap="round">${CURLS.map(d => `<path d="${d}"/>`).join('')}</g>
    </g>`;

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  DIRS.push({
    toy: 'ink', l: 'Current', name: 'Menu icon', emblemUrl: '../shared/emblems/ink.svg',
    box: [16, 16, 98, 98],
    art(svg) {
      svg.innerHTML = `
        <rect x="22" y="22" width="92" height="92" fill="oklch(0.07 0.01 260)"/>
        <rect x="16" y="16" width="92" height="92" fill="oklch(0.88 0.025 85)"/>
        <path d="M16 16H60L16 66Z" fill="oklch(0.97 0.02 85)"/>
        <g class="plume">
          <path d="M63 20c-2 10 2 20-1 34" fill="none" stroke="oklch(0.5 0.14 262)" stroke-width="3" stroke-linecap="round"/>
          <g fill="none" stroke="oklch(0.42 0.17 266)" stroke-width="3.4" stroke-linecap="round">
            <path class="finger" pathLength="1" d="M52 60l-5 20"/>
            <path class="finger" pathLength="1" d="M62 62l1 26"/>
            <path class="finger" pathLength="1" d="M72 60l6 18"/>
          </g>
          <g fill="oklch(0.42 0.17 266)">
            <circle class="cap" cx="47" cy="80" r="4"/>
            <circle class="cap" cx="63" cy="88" r="4"/>
            <circle class="cap" cx="78" cy="78" r="4"/>
          </g>
          <g class="ring">
            <ellipse cx="62" cy="56" rx="16" ry="7" fill="oklch(0.42 0.17 266)"/>
            <ellipse cx="62" cy="55" rx="7" ry="2.4" fill="oklch(0.62 0.12 258)"/>
          </g>
        </g>`;
      return fall(svg, 24);
    },
  });

  /* ================= A · Shaded object ================= */

  // A backlit glass slab on its hard shadow; a billowing indigo plume hangs in the light.
  DIRS.push({
    toy: 'ink', l: 'A', name: 'Shaded object', emblemUrl: 'spike/emblems/ink-a.svg',
    box: [14, 6, 106, 108],
    art(svg) {
      svg.innerHTML = `
        <rect x="21" y="13" width="99" height="101" rx="8" fill="oklch(0.07 0.01 260)"/>
        <rect x="14" y="6" width="99" height="101" rx="8" fill="url(#ik-box)"/>
        <rect x="14" y="6" width="99" height="101" rx="8" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
        ${plumeSvg({ ink: 'url(#ik-ink)', edge: 'oklch(0.7 0.1 255)', curl: 'oklch(0.72 0.1 255)', ten: 'oklch(0.36 0.16 266)', trail: 'oklch(0.55 0.12 262)' })}`;
      return bloom(svg);
    },
  });

  /* ================= B · Stencil cut-out ================= */

  // A bright tile with the plume's silhouette cut through; the curls stay as bridges.
  DIRS.push({
    toy: 'ink', l: 'B', name: 'Stencil cut-out', emblemUrl: 'spike/emblems/ink-b.svg',
    box: [12, 6, 104, 108],
    art(svg, id) {
      svg.innerHTML = `
        <defs><mask id="${id}m">
          <rect x="12" y="6" width="104" height="108" rx="16" fill="#fff"/>
          ${plumeSvg({ ink: '#000', edge: '#000', curl: '#fff', ten: '#000', trail: '#000', tw: 5 })}
        </mask></defs>
        <rect x="12" y="6" width="104" height="108" rx="16" fill="url(#ik-box)" mask="url(#${id}m)"/>
        <rect x="12" y="6" width="104" height="108" rx="16" fill="none" stroke="url(#rim)" stroke-width="1.6"/>`;
      return bloom(svg);
    },
  });

  /* ================= C · Single-weight line ================= */

  // One glowing stroke: the cap's top edge, both rolled ends spiralling under, three wavy tendrils.
  DIRS.push({
    toy: 'ink', l: 'C', name: 'Single-weight line', emblemUrl: 'spike/emblems/ink-c.svg',
    box: [24, 6, 80, 108],
    art(svg) {
      const CAP = 'M30 68c-8-4-6-16 4-15c6 1 6 9 1 9M34 53c0-14 14-18 24-12c4-12 22-12 24 0c10-6 24-2 24 12M98 68c8-4 6-16-4-15c-6 1-6 9-1 9';
      svg.innerHTML = `
        <g class="plume" fill="none" stroke="oklch(0.84 0.1 258)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <path class="ten" pathLength="1" d="${TRAIL}"/>
          <path class="ten" pathLength="1" d="${CAP}"/>
          ${TENDRILS.map(d => `<path class="ten" pathLength="1" d="${d}"/>`).join('')}
          ${TIPS.map(([x, y]) => `<circle class="tip" cx="${x}" cy="${y}" r="3.6"/>`).join('')}
        </g>`;
      const tens = svg.querySelectorAll('.ten'), tips = svg.querySelectorAll('.tip');
      return hoverLoop(
        () => loop({ repeatDelay: 0.5 })
          .fromTo(tens, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, stagger: 0.18, ease: 'sine.inOut' })
          .fromTo(tips, { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.35, stagger: 0.1, ease: 'back.out(2.4)' }, '-=0.3'),
        () => {
          gsap.to(tens, { strokeDashoffset: 0, duration: 0.3, overwrite: true });
          gsap.to(tips, { scale: 1, duration: 0.3, overwrite: true });
        });
    },
  });

  /* ================= D · Isometric block ================= */

  // A block of lit water seen corner-on; the plume billows inside its wide front face.
  {
    const UL = [14, 30], C0 = [80, 54], UR = [110, 38], T = [44, 14];
    const LL = [14, 92], BB = [80, 116], LR = [110, 100];
    // The front face maps the 128 icon square: x runs to C0, y runs down.
    const FACE = `matrix(${f((C0[0] - UL[0]) / 128)} ${f((C0[1] - UL[1]) / 128)} 0 ${f((LL[1] - UL[1]) / 128)} ${UL[0]} ${UL[1]})`;
    DIRS.push({
      toy: 'ink', l: 'D', name: 'Isometric block', emblemUrl: 'spike/emblems/ink-d.svg',
      box: [14, 14, 96, 102],
      art(svg, id) {
        svg.innerHTML = `
          <defs><clipPath id="${id}f"><path d="${poly([UL, C0, BB, LL])}"/></clipPath></defs>
          <path d="${poly([UL, C0, BB, LL])}" fill="url(#ik-box)"/>
          <path d="${poly([C0, UR, LR, BB])}" fill="oklch(0.6 0.03 235)"/>
          <path d="${poly([T, UR, C0, UL])}" fill="oklch(0.97 0.02 85)"/>
          <g clip-path="url(#${id}f)"><g transform="${FACE}">
            ${plumeSvg({ ink: 'url(#ik-ink)', edge: 'oklch(0.7 0.1 255)', curl: 'oklch(0.72 0.1 255)', ten: 'oklch(0.36 0.16 266)', trail: 'oklch(0.55 0.12 262)', tw: 5 })}
          </g></g>
          <path d="${poly([T, UR, C0, UL])}" fill="none" stroke="url(#rim)" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M${C0[0]} ${C0[1]}V${BB[1]}" stroke="oklch(0.99 0.01 85 / 0.7)" stroke-width="1.2"/>`;
        return bloom(svg, 26);
      },
    });
  }

  /* ================= E · Abstract mark ================= */

  // Three inks overlap on the light and mix by absorption: green, violet and dark where they meet.
  {
    const DOTS = [[52, 52, 'oklch(0.55 0.17 266)'], [76, 52, 'oklch(0.86 0.15 85)'], [64, 73, 'oklch(0.6 0.21 18)']];
    DIRS.push({
      toy: 'ink', l: 'E', name: 'Abstract mark', emblemUrl: 'spike/emblems/ink-e.svg',
      box: [24, 26, 80, 84],
      art(svg) {
        svg.innerHTML = `<g style="isolation: isolate">${DOTS.map(([x, y, c]) => `<circle class="dot" cx="${x}" cy="${y}" r="21" fill="${c}" style="mix-blend-mode: multiply"/>`).join('')}</g>`;
        const dots = [...svg.querySelectorAll('.dot')];
        // Hover pulls the inks apart, then lets them run back together.
        return hoverLoop(
          () => {
            const tl = loop({ yoyo: true, repeatDelay: 0.2 });
            dots.forEach((d, i) => {
              const [x, y] = DOTS[i];
              tl.to(d, { x: (x - 64) * 0.5, y: (y - 59) * 0.5, duration: 0.9, ease: 'sine.inOut' }, 0);
            });
            return tl;
          },
          () => gsap.to(dots, { x: 0, y: 0, duration: 0.4, overwrite: true }));
      },
    });
  }

  /* ================= Gallery ================= */

  const NAMES = { ink: 'Ink in water' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const out = document.getElementById('out');
  let uid = 0;
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || '';
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', () => ctl.enter(null));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
