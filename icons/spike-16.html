<html lang="en">

<title>Icon spike 16</title>
<meta name="color-scheme" content="dark">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>

<h1>Icon spike 16</h1>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today is direction F; its art is copied in after F.
  DIRS.push({ toy: 'ink', l: 'Current', name: 'Menu icon', emblemUrl: '../shared/emblems/ink.svg' });

  // A teardrop: the tip at the top, a round belly of radius r centred at cx, cy.
  const tear = (cx, cy, r, h) => `M${cx} ${cy - h}C${f(cx + r * 0.18)} ${f(cy - h * 0.55)} ${cx + r} ${f(cy - r * 0.85)} ${cx + r} ${cy}A${r} ${r} 0 0 1 ${cx - r} ${cy}C${cx - r} ${f(cy - r * 0.85)} ${f(cx - r * 0.18)} ${f(cy - h * 0.55)} ${cx} ${cy - h}Z`;
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  // A ticker that runs while step() returns true.
  const sim = step => {
    let on = false;
    const tick = () => { if (!step()) { on = false; gsap.ticker.remove(tick); } };
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } } };
  };
  // Resamples a polyline to n points spread evenly along its length.
  const resample = (pts, n) => {
    const L = [0];
    for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const out = [];
    for (let k = 0; k < n; k++) {
      const s = (L[L.length - 1] * k) / (n - 1);
      let i = 1;
      while (i < L.length - 1 && L[i] < s) i++;
      const t = L[i] > L[i - 1] ? (s - L[i - 1]) / (L[i] - L[i - 1]) : 0;
      out.push([pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]);
    }
    return out;
  };
  // A smooth path through points: quadratic curves through the midpoints.
  const smooth = pts => {
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 1; i < pts.length - 1; i++) d += `Q${f(pts[i][0])} ${f(pts[i][1])} ${f((pts[i][0] + pts[i + 1][0]) / 2)} ${f((pts[i][1] + pts[i + 1][1]) / 2)}`;
    const e = pts[pts.length - 1];
    return d + `L${f(e[0])} ${f(e[1])}`;
  };
  const INKS = ['oklch(0.45 0.17 266)', 'oklch(0.56 0.2 18)', 'oklch(0.82 0.15 80)'];
  // The resting plume in a lit tank: a cap, two rolled ends, a trail and two tendrils.
  const PLUME = [[65, 20, 3], [64, 30, 3.6], [64, 40, 4.4], [64, 48, 5.5], [48, 60, 10], [64, 54, 12.5], [80, 60, 10], [40, 66, 6.5], [88, 66, 6.5], [54, 74, 4.4], [52, 85, 3.8], [55, 96, 3], [74, 74, 4.4], [76, 85, 3.8], [73, 96, 3]];

  /* ================= A · Stir ================= */

  // A porthole on dark water with a glowing plume; a drag through it stirs the ink, which drifts back.
  DIRS.push({
    toy: 'ink', l: 'A', name: 'Stir', emblemUrl: 'spike/emblems/ink-a.svg',
    box: [12, 12, 104, 104],
    art(svg, id) {
      svg.innerHTML = `
        <defs>
          <clipPath id="${id}c"><circle cx="64" cy="64" r="50"/></clipPath>
          <radialGradient id="${id}w" cx="0.3" cy="0.28" r="0.85"><stop offset="0" style="stop-color: oklch(0.25 0.05 252)"/><stop offset="1" style="stop-color: oklch(0.1 0.03 266)"/></radialGradient>
          <filter id="${id}b" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
          <filter id="${id}m" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.8"/></filter>
        </defs>
        <circle cx="64" cy="64" r="50" fill="url(#${id}w)"/>
        <g clip-path="url(#${id}c)">
          <path d="M6 26L48 6L122 96L104 124Z" fill="oklch(0.9 0.04 240)" opacity="0.06"/>
          <g class="s" fill="oklch(0.55 0.18 264)" filter="url(#${id}b)"><ellipse cx="48" cy="60" rx="10" ry="10"/><ellipse cx="64" cy="54" rx="12.5" ry="12.5"/><ellipse cx="80" cy="60" rx="10" ry="10"/><ellipse cx="40" cy="66" rx="6.5" ry="6.5"/><ellipse cx="88" cy="66" rx="6.5" ry="6.5"/><ellipse cx="65" cy="17" rx="2.4" ry="2.4"/><ellipse cx="64.64" cy="20.09" rx="2.71" ry="2.71"/><ellipse cx="64.29" cy="23.19" rx="3.02" ry="3.02"/><ellipse cx="63.93" cy="26.28" rx="3.33" ry="3.33"/><ellipse cx="63.57" cy="29.38" rx="3.64" ry="3.64"/><ellipse cx="63.71" cy="32.48" rx="3.95" ry="3.95"/><ellipse cx="63.97" cy="35.58" rx="4.26" ry="4.26"/><ellipse cx="64.22" cy="38.69" rx="4.57" ry="4.57"/><ellipse cx="64.48" cy="41.79" rx="4.88" ry="4.88"/><ellipse cx="64.26" cy="44.9" rx="5.19" ry="5.19"/><ellipse cx="64" cy="48" rx="5.5" ry="5.5"/><ellipse cx="54" cy="71" rx="4.6" ry="4.6"/><ellipse cx="52.99" cy="73.77" rx="4.38" ry="4.38"/><ellipse cx="51.99" cy="76.53" rx="4.16" ry="4.16"/><ellipse cx="50.98" cy="79.3" rx="3.94" ry="3.94"/><ellipse cx="50.02" cy="82.06" rx="3.72" ry="3.72"/><ellipse cx="50.86" cy="84.88" rx="3.5" ry="3.5"/><ellipse cx="51.71" cy="87.7" rx="3.28" ry="3.28"/><ellipse cx="52.56" cy="90.52" rx="3.06" ry="3.06"/><ellipse cx="52.62" cy="93.34" rx="2.84" ry="2.84"/><ellipse cx="51.81" cy="96.17" rx="2.62" ry="2.62"/><ellipse cx="51" cy="99" rx="2.4" ry="2.4"/><ellipse cx="74" cy="71" rx="4.6" ry="4.6"/><ellipse cx="75.01" cy="73.77" rx="4.38" ry="4.38"/><ellipse cx="76.01" cy="76.53" rx="4.16" ry="4.16"/><ellipse cx="77.02" cy="79.3" rx="3.94" ry="3.94"/><ellipse cx="77.98" cy="82.06" rx="3.72" ry="3.72"/><ellipse cx="77.14" cy="84.88" rx="3.5" ry="3.5"/><ellipse cx="76.29" cy="87.7" rx="3.28" ry="3.28"/><ellipse cx="75.44" cy="90.52" rx="3.06" ry="3.06"/><ellipse cx="75.38" cy="93.34" rx="2.84" ry="2.84"/><ellipse cx="76.19" cy="96.17" rx="2.62" ry="2.62"/><ellipse cx="77" cy="99" rx="2.4" ry="2.4"/><ellipse class="wisp" cx="58" cy="64" rx="3" ry="3"/><ellipse class="wisp" cx="70" cy="64" rx="3" ry="3"/><ellipse class="wisp" cx="45" cy="72" rx="2.6" ry="2.6"/><ellipse class="wisp" cx="84" cy="72" rx="2.6" ry="2.6"/><ellipse class="wisp" cx="64" cy="68" rx="2.4" ry="2.4"/><ellipse class="wisp" cx="60" cy="24" rx="1.6" ry="1.6"/><ellipse class="wisp" cx="68" cy="36" rx="1.6" ry="1.6"/></g>
          <g class="k" fill="oklch(0.84 0.1 250)" opacity="0.32" filter="url(#${id}m)"><circle cx="48" cy="60" r="6"/><circle cx="64" cy="54" r="7.5"/><circle cx="80" cy="60" r="6"/><circle cx="40" cy="66" r="3.9"/><circle cx="88" cy="66" r="3.9"/><circle cx="65" cy="17" r="1.44"/><circle cx="64.64" cy="20.09" r="1.63"/><circle cx="64.29" cy="23.19" r="1.81"/><circle cx="63.93" cy="26.28" r="2"/><circle cx="63.57" cy="29.38" r="2.18"/><circle cx="63.71" cy="32.48" r="2.37"/><circle cx="63.97" cy="35.58" r="2.56"/><circle cx="64.22" cy="38.69" r="2.74"/><circle cx="64.48" cy="41.79" r="2.93"/><circle cx="64.26" cy="44.9" r="3.11"/><circle cx="64" cy="48" r="3.3"/><circle cx="54" cy="71" r="2.76"/><circle cx="52.99" cy="73.77" r="2.63"/><circle cx="51.99" cy="76.53" r="2.5"/><circle cx="50.98" cy="79.3" r="2.36"/><circle cx="50.02" cy="82.06" r="2.23"/><circle cx="50.86" cy="84.88" r="2.1"/><circle cx="51.71" cy="87.7" r="1.97"/><circle cx="52.56" cy="90.52" r="1.84"/><circle cx="52.62" cy="93.34" r="1.7"/><circle cx="51.81" cy="96.17" r="1.57"/><circle cx="51" cy="99" r="1.44"/><circle cx="74" cy="71" r="2.76"/><circle cx="75.01" cy="73.77" r="2.63"/><circle cx="76.01" cy="76.53" r="2.5"/><circle cx="77.02" cy="79.3" r="2.36"/><circle cx="77.98" cy="82.06" r="2.23"/><circle cx="77.14" cy="84.88" r="2.1"/><circle cx="76.29" cy="87.7" r="1.97"/><circle cx="75.44" cy="90.52" r="1.84"/><circle cx="75.38" cy="93.34" r="1.7"/><circle cx="76.19" cy="96.17" r="1.57"/><circle cx="77" cy="99" r="1.44"/></g>
        </g>
        <g clip-path="url(#${id}c)"><circle class="glint" cx="64" cy="64" r="50" fill="url(#lit)" opacity="0.5"/></g>
        <circle cx="64" cy="64" r="49.2" fill="none" stroke="url(#rim)" stroke-width="1.8"/>
        <circle cx="64" cy="64" r="50" fill="none" stroke="oklch(0.34 0.04 262)" stroke-width="1"/>`;
      const glint = svg.querySelector('.glint');
      const soft = [...svg.querySelector('.s').children], core = [...svg.querySelector('.k').children];
      // Each blob keeps its rest point, an offset and a velocity; wisps move more freely.
      const B = soft.map(e => ({
        x0: +e.getAttribute('cx'), y0: +e.getAttribute('cy'), r: +e.getAttribute('rx'),
        m: e.classList.contains('wisp') ? 1.7 : 1, dx: 0, dy: 0, vx: 0, vy: 0,
      }));
      const draw = () => B.forEach((b, i) => {
        const x = f(b.x0 + b.dx), y = f(b.y0 + b.dy), v = Math.hypot(b.vx, b.vy), e = soft[i];
        // Fast ink stretches along its path and thins across it.
        e.setAttribute('cx', x); e.setAttribute('cy', y);
        e.setAttribute('rx', f(b.r * (1 + Math.min(v * 0.22, 1.1))));
        e.setAttribute('ry', f(b.r / (1 + Math.min(v * 0.1, 0.35))));
        e.setAttribute('transform', v > 0.05 ? `rotate(${f((Math.atan2(b.vy, b.vx) * 180) / Math.PI)} ${x} ${y})` : '');
        if (core[i]) { core[i].setAttribute('cx', x); core[i].setAttribute('cy', y); }
      });
      let last = null, demo = null, hover = false, on = false;
      // The stroke drags nearby ink along and rolls it to each side.
      const push = (p, v) => B.forEach(b => {
        const rx = b.x0 + b.dx - p[0], ry = b.y0 + b.dy - p[1], d = Math.hypot(rx, ry);
        if (d > 28) return;
        const w = (1 - d / 28) ** 2 * 0.26 * b.m, side = Math.sign(v[0] * ry - v[1] * rx);
        b.vx += (v[0] - v[1] * side * 0.4) * w;
        b.vy += (v[1] + v[0] * side * 0.4) * w;
      });
      // The water damps the ink; a weak pull brings it back to rest.
      const tick = () => {
        let m = 0;
        B.forEach(b => {
          b.vx = b.vx * 0.9 - b.dx * 0.003; b.vy = b.vy * 0.9 - b.dy * 0.003;
          b.dx += b.vx; b.dy += b.vy;
          // The porthole wall holds the ink inside.
          const ox = b.x0 + b.dx - 64, oy = b.y0 + b.dy - 64, o = Math.hypot(ox, oy);
          if (o > 42) { b.dx -= (ox * (o - 42)) / o; b.dy -= (oy * (o - 42)) / o; b.vx *= 0.5; b.vy *= 0.5; }
          m = Math.max(m, Math.abs(b.dx) + Math.abs(b.dy) + Math.abs(b.vx) + Math.abs(b.vy));
        });
        draw();
        if (!hover && m <= 0.06) { B.forEach(b => { b.dx = b.dy = b.vx = b.vy = 0; }); draw(); on = false; gsap.ticker.remove(tick); }
      };
      const wake = () => { if (!on) { on = true; gsap.ticker.add(tick); } };
      const moveTo = p => {
        if (last) {
          let v = [p[0] - last[0], p[1] - last[1]];
          const m = Math.hypot(v[0], v[1]);
          if (m > 6) v = v.map(c => (c * 6) / m);
          push(p, v);
        }
        last = p;
      };
      // The glass glint slides against the pointer, as a reflection does.
      const glintTo = p => gsap.to(glint, { x: p ? (64 - p[0]) * 0.18 : 0, y: p ? (64 - p[1]) * 0.18 : 0, duration: 0.6, ease: 'power2.out', overwrite: 'auto' });
      // With no pointer, one demo stroke stirs across the plume.
      const stroke = () => {
        const st = { a: 0 };
        return gsap.to(st, { a: 1, duration: 1.4, ease: 'sine.inOut', onUpdate: () => moveTo([26 + 76 * st.a, 64 + 16 * Math.sin(st.a * TAU)]) });
      };
      return {
        enter(p) {
          hover = true; wake();
          if (p) { last = p; glintTo(p); } else { demo?.kill(); last = null; demo = stroke(); }
        },
        move(p) { if (p && !demo) { moveTo(p); glintTo(p); } },
        leave() { hover = false; demo?.kill(); demo = null; last = null; glintTo(null); wake(); },
      };
    },
  });


  /* ================= B · Drop ================= */

  // A backlit tank: where the pointer goes, a drop falls in and blooms; the inks take turns and mix.
  DIRS.push({
    toy: 'ink', l: 'B', name: 'Drop', emblemUrl: 'spike/emblems/ink-b.svg',
    box: [12, 12, 110, 110],
    art(svg, id) {
      svg.innerHTML = `
        <defs>
          <clipPath id="${id}c"><rect x="12" y="12" width="104" height="104" rx="12"/></clipPath>
          <radialGradient id="${id}l" cx="0.34" cy="0.3" r="0.9"><stop offset="0" style="stop-color: oklch(0.99 0.02 85)"/><stop offset="0.6" style="stop-color: oklch(0.9 0.02 90)"/><stop offset="1" style="stop-color: oklch(0.76 0.03 235)"/></radialGradient>
          <filter id="${id}b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6"/></filter>
        </defs>
        <rect x="18" y="18" width="104" height="104" rx="12" fill="oklch(0.07 0.01 260)"/>
        <rect x="12" y="12" width="104" height="104" rx="12" fill="url(#${id}l)"/>
        <g clip-path="url(#${id}c)" style="isolation: isolate">
          <g style="mix-blend-mode: multiply" filter="url(#${id}b)" fill="oklch(0.48 0.16 264)">
            <ellipse cx="64" cy="66" rx="17" ry="7"/><path d="M57 70c-5 9 5 15-1 26M71 70c5 9-5 13 1 24" fill="none" stroke="oklch(0.48 0.16 264)" stroke-width="3.4" stroke-linecap="round"/>
          </g>
          <g class="drops"></g>
        </g>
        <rect x="12" y="12" width="104" height="104" rx="12" fill="url(#lit)" opacity="0.45"/>
        <rect x="12.8" y="12.8" width="102.4" height="102.4" rx="11.4" fill="none" stroke="url(#rim)" stroke-width="1.6"/>`;
      const layer = svg.querySelector('.drops');
      let n = 0, lastAt = 0, demo = null;
      const spawn = x => {
        x = f(clamp(x, 28, 100));
        const c = INKS[n++ % INKS.length];
        const g = el('g', { style: 'mix-blend-mode: multiply' }, layer);
        const drop = el('path', { d: tear(x, 22, 3.6, 8), fill: c }, g);
        const bloom = el('g', { filter: `url(#${id}b)`, opacity: 0 }, g);
        const cap = el('ellipse', { cx: x, cy: 48, rx: 3, ry: 2, fill: c }, bloom);
        const tens = [`M${x - 5} 52c-4 8 4 14-1 24`, `M${x + 5} 52c4 8-4 13 1 22`].map(d => el('path', { d, fill: 'none', stroke: c, 'stroke-width': 3, 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1 }, bloom));

      const bloom = svg.querySelector(`.${id}bloom`);
      const bands = [...svg.querySelectorAll(`.${id}band`)];
      const drift = svg.querySelector(`.${id}drift`), disp = svg.querySelector(`.${id}disp`);
      // Deeper bands sit further back, so they shift more.
      const DEPTH = [0.04, 0.1, 0.16, 0.22];
      const st = { px: 0, py: 0, tx: 0, ty: 0, s: 0, ts: 0, nx: 0, ny: 0, t: 0 };

      const draw = () => {

        drift.setAttribute('dx', f(st.nx + Math.sin(st.t) * 4)); drift.setAttribute('dy', f(st.ny + Math.cos(st.t * 0.7) * 4));
        disp.setAttribute('scale', f(st.s));
      };
      const tick = () => {
        st.px += (st.tx - st.px) * 0.12; st.py += (st.ty - st.py) * 0.12;
        // Stir energy decays; a hover keeps a slow swirl.
        st.ts *= 0.94;
        st.s += (Math.max(st.ts, hover ? 3.5 : 0) - st.s) * 0.15;
        // The swirl circles slowly; the stir offset springs back.
        if (hover) st.t += 0.03;
        st.nx *= 0.95; st.ny *= 0.95;

          Object.assign(st, { px: 0, py: 0, s: 0, ts: 0, nx: 0, ny: 0, t: 0 }); draw();

      const wake = () => { if (!on) { on = true; bloom.setAttribute('filter', `url(#${id}swirl)`); gsap.ticker.add(tick); } };

        move(p) { if (p && !demo) moveTo(p); },
        leave() { hover = false; demo?.kill(); demo = null; last = null; aim(null); wake(); },

  Object.assign(DIRS[0], { box: DIRS.find(d => d.l === 'F').box, art: DIRS.find(d => d.l === 'F').art });

  const NAMES = { ink: 'Ink Water' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);

    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };

  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || '';
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move?.(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
