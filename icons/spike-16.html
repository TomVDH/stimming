<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 16</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- The lightbox: warm and bright at the top left, cool at the foot. -->
    <linearGradient id="ik-box" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" style="stop-color: oklch(0.98 0.02 85)"/>
      <stop offset="0.6" style="stop-color: oklch(0.88 0.02 90)"/>
      <stop offset="1" style="stop-color: oklch(0.78 0.025 235)"/>
    </linearGradient>
    <!-- The ink: deep indigo in the core, a lighter tint at the thin edge. -->
    <radialGradient id="ik-ink" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" style="stop-color: oklch(0.52 0.15 262)"/>
      <stop offset="1" style="stop-color: oklch(0.3 0.15 268)"/>
    </radialGradient>
  </defs>
</svg>

<h1>Icon spike 16</h1>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today is direction A; its art is copied in after A.
  DIRS.push({ toy: 'ink', l: 'Current', name: 'Menu icon', emblemUrl: '../shared/emblems/ink.svg' });

  // A teardrop: the tip at the top, a round belly of radius r centred at cx, cy.
  const tear = (cx, cy, r, h) => `M${cx} ${cy - h}C${f(cx + r * 0.18)} ${f(cy - h * 0.55)} ${cx + r} ${f(cy - r * 0.85)} ${cx + r} ${cy}A${r} ${r} 0 0 1 ${cx - r} ${cy}C${cx - r} ${f(cy - r * 0.85)} ${f(cx - r * 0.18)} ${f(cy - h * 0.55)} ${cx} ${cy - h}Z`;
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  // A ticker that runs while step() returns true.
  const sim = step => {
    let on = false;
    const tick = () => { if (!step()) { on = false; gsap.ticker.remove(tick); } };
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } } };
  };
  // Resamples a polyline to n points spread evenly along its length.
  const resample = (pts, n) => {
    const L = [0];
    for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const out = [];
    for (let k = 0; k < n; k++) {
      const s = (L[L.length - 1] * k) / (n - 1);
      let i = 1;
      while (i < L.length - 1 && L[i] < s) i++;
      const t = L[i] > L[i - 1] ? (s - L[i - 1]) / (L[i] - L[i - 1]) : 0;
      out.push([pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]);
    }
    return out;
  };
  // A smooth path through points: quadratic curves through the midpoints.
  const smooth = pts => {
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 1; i < pts.length - 1; i++) d += `Q${f(pts[i][0])} ${f(pts[i][1])} ${f((pts[i][0] + pts[i + 1][0]) / 2)} ${f((pts[i][1] + pts[i + 1][1]) / 2)}`;
    const e = pts[pts.length - 1];
    return d + `L${f(e[0])} ${f(e[1])}`;
  };
  const INKS = ['oklch(0.45 0.17 266)', 'oklch(0.56 0.2 18)', 'oklch(0.82 0.15 80)'];
  // The resting plume in a lit tank: a cap, two rolled ends, a trail and two tendrils.
  const PLUME = [[65, 20, 3], [64, 30, 3.6], [64, 40, 4.4], [64, 48, 5.5], [48, 60, 10], [64, 54, 12.5], [80, 60, 10], [40, 66, 6.5], [88, 66, 6.5], [54, 74, 4.4], [52, 85, 3.8], [55, 96, 3], [74, 74, 4.4], [76, 85, 3.8], [73, 96, 3]];

  /* ================= A · Stir ================= */

  // A porthole on dark water with a glowing plume; a drag through it stirs the ink, which drifts back.
  DIRS.push({
    toy: 'ink', l: 'A', name: 'Stir', emblemUrl: 'spike/emblems/ink-a.svg',
    box: [12, 12, 104, 104],
    art(svg, id) {
      const B = PLUME.map(([x, y, r]) => ({ x0: x, y0: y, r, dx: 0, dy: 0 }));
      svg.innerHTML = `
        <defs>
          <clipPath id="${id}c"><circle cx="64" cy="64" r="50"/></clipPath>
          <radialGradient id="${id}w" cx="0.3" cy="0.28" r="0.85"><stop offset="0" style="stop-color: oklch(0.25 0.05 252)"/><stop offset="1" style="stop-color: oklch(0.1 0.03 266)"/></radialGradient>
          <filter id="${id}b" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
          <filter id="${id}m" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.8"/></filter>
        </defs>
        <circle cx="64" cy="64" r="50" fill="url(#${id}w)"/>
        <g clip-path="url(#${id}c)">
          <path d="M6 26L48 6L122 96L104 124Z" fill="oklch(0.9 0.04 240)" opacity="0.06"/>
          <g class="s" fill="oklch(0.55 0.18 264)" filter="url(#${id}b)">${B.map(b => `<circle r="${b.r}"/>`).join('')}</g>
          <g class="k" fill="oklch(0.84 0.1 250)" opacity="0.32" filter="url(#${id}m)">${B.map(b => `<circle r="${f(b.r * 0.6)}"/>`).join('')}</g>
        </g>
        <circle cx="64" cy="64" r="50" fill="url(#lit)" opacity="0.5"/>
        <circle cx="64" cy="64" r="49.2" fill="none" stroke="url(#rim)" stroke-width="1.8"/>
        <circle cx="64" cy="64" r="50" fill="none" stroke="oklch(0.34 0.04 262)" stroke-width="1"/>`;
      const soft = [...svg.querySelectorAll('.s circle')], core = [...svg.querySelectorAll('.k circle')];
      const draw = () => B.forEach((b, i) => {
        const x = f(b.x0 + b.dx), y = f(b.y0 + b.dy);
        soft[i].setAttribute('cx', x); soft[i].setAttribute('cy', y);
        core[i].setAttribute('cx', x); core[i].setAttribute('cy', y);
      });
      draw();
      let last = null, demo = null, hover = false;
      // The drag pushes nearby ink along its path, curling it a little sideways.
      const push = (p, v) => B.forEach(b => {
        const d = Math.hypot(b.x0 + b.dx - p[0], b.y0 + b.dy - p[1]);
        if (d > 24) return;
        const k = (1 - d / 24) * 0.9;
        b.dx = clamp(b.dx + (v[0] - v[1] * 0.35) * k, -22, 22);
        b.dy = clamp(b.dy + (v[1] + v[0] * 0.35) * k, -22, 22);
      });
      // Stirred ink drifts slowly back, as it does in still water.
      const S = sim(() => {
        let m = 0;
        B.forEach(b => { b.dx *= 0.97; b.dy *= 0.97; m = Math.max(m, Math.abs(b.dx) + Math.abs(b.dy)); });
        draw();
        return hover || m > 0.05;
      });
      const moveTo = p => {
        if (last) {
          let v = [p[0] - last[0], p[1] - last[1]];
          const m = Math.hypot(...v);
          if (m > 6) v = v.map(c => (c * 6) / m);
          push(p, v);
        }
        last = p;
      };
      return {
        enter(p) {
          hover = true; S.start();
          if (p) last = p;
          else { const st = { a: 0 }; demo = gsap.to(st, { a: 1, duration: 1.6, ease: 'sine.inOut', onUpdate: () => moveTo([28 + 72 * st.a, 66 + 16 * Math.sin(st.a * TAU)]) }); }
        },
        move(p) { if (p && !demo) moveTo(p); },
        leave() { hover = false; demo?.kill(); demo = null; last = null; S.start(); },
      };
    },
  });

  Object.assign(DIRS[0], { box: DIRS[1].box, art: DIRS[1].art });

  /* ================= B · Drop ================= */

  // A backlit tank: where the pointer goes, a drop falls in and blooms; the inks take turns and mix.
  DIRS.push({
    toy: 'ink', l: 'B', name: 'Drop', emblemUrl: 'spike/emblems/ink-b.svg',
    box: [12, 12, 110, 110],
    art(svg, id) {
      svg.innerHTML = `
        <defs>
          <clipPath id="${id}c"><rect x="12" y="12" width="104" height="104" rx="12"/></clipPath>
          <radialGradient id="${id}l" cx="0.34" cy="0.3" r="0.9"><stop offset="0" style="stop-color: oklch(0.99 0.02 85)"/><stop offset="0.6" style="stop-color: oklch(0.9 0.02 90)"/><stop offset="1" style="stop-color: oklch(0.76 0.03 235)"/></radialGradient>
          <filter id="${id}b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6"/></filter>
        </defs>
        <rect x="18" y="18" width="104" height="104" rx="12" fill="oklch(0.07 0.01 260)"/>
        <rect x="12" y="12" width="104" height="104" rx="12" fill="url(#${id}l)"/>
        <g clip-path="url(#${id}c)" style="isolation: isolate">
          <g style="mix-blend-mode: multiply" filter="url(#${id}b)" fill="oklch(0.48 0.16 264)">
            <ellipse cx="64" cy="66" rx="17" ry="7"/><path d="M57 70c-5 9 5 15-1 26M71 70c5 9-5 13 1 24" fill="none" stroke="oklch(0.48 0.16 264)" stroke-width="3.4" stroke-linecap="round"/>
          </g>
          <g class="drops"></g>
        </g>
        <rect x="12" y="12" width="104" height="104" rx="12" fill="url(#lit)" opacity="0.45"/>
        <rect x="12.8" y="12.8" width="102.4" height="102.4" rx="11.4" fill="none" stroke="url(#rim)" stroke-width="1.6"/>`;
      const layer = svg.querySelector('.drops');
      let n = 0, lastAt = 0, demo = null;
      const spawn = x => {
        x = f(clamp(x, 28, 100));
        const c = INKS[n++ % INKS.length];
        const g = el('g', { style: 'mix-blend-mode: multiply' }, layer);
        const drop = el('path', { d: tear(x, 22, 3.6, 8), fill: c }, g);
        const bloom = el('g', { filter: `url(#${id}b)`, opacity: 0 }, g);
        const cap = el('ellipse', { cx: x, cy: 48, rx: 3, ry: 2, fill: c }, bloom);
        const tens = [`M${x - 5} 52c-4 8 4 14-1 24`, `M${x + 5} 52c4 8-4 13 1 22`].map(d => el('path', { d, fill: 'none', stroke: c, 'stroke-width': 3, 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1 }, bloom));
        gsap.timeline({ onComplete: () => g.remove() })
          .fromTo(drop, { y: -12 }, { y: 24, duration: 0.42, ease: 'power2.in' })
          .to(drop, { opacity: 0, duration: 0.08 })
          .to(bloom, { opacity: 0.95, duration: 0.15 }, '<')
          .to(cap, { attr: { rx: 15, ry: 7, cy: 54 }, duration: 1.2, ease: 'power2.out' }, '<')
          .to(tens, { strokeDashoffset: 0, duration: 1.4, ease: 'sine.out' }, '<0.2')
          .to(bloom, { opacity: 0, y: 12, duration: 1.8, ease: 'sine.in' }, '+=0.3');
        while (layer.children.length > 7) layer.firstChild.remove();
      };
      return {
        enter(p) {
          if (p) { lastAt = performance.now(); spawn(p[0]); }
          else demo = gsap.timeline().call(() => spawn(44)).call(() => spawn(64), null, 0.35).call(() => spawn(84), null, 0.7);
        },
        // A moving pointer drops ink every 0.4 s at its own x.
        move(p) {
          if (!p) return;
          const now = performance.now();
          if (now - lastAt > 400) { lastAt = now; spawn(p[0]); }
        },
        leave() { demo?.kill(); demo = null; },
      };
    },
  });

  /* ================= C · Thread ================= */

  // A dark tank with a glowing thread of ink; the pointer is the pipette, and the thread follows it and sinks.
  DIRS.push({
    toy: 'ink', l: 'C', name: 'Thread', emblemUrl: 'spike/emblems/ink-c.svg',
    box: [12, 12, 110, 110],
    art(svg, id) {
      const N = 26;
      const REST = resample(Array.from({ length: 40 }, (_, i) => { const t = i / 39; return [36 + 56 * t, 26 + 66 * t + 12 * Math.sin(t * TAU * 1.1)]; }), N);
      let pts = REST.map(p => [...p]);
      svg.innerHTML = `
        <defs>
          <clipPath id="${id}c"><rect x="12" y="12" width="104" height="104" rx="12"/></clipPath>
          <radialGradient id="${id}w" cx="0.3" cy="0.26" r="0.9"><stop offset="0" style="stop-color: oklch(0.24 0.05 252)"/><stop offset="1" style="stop-color: oklch(0.1 0.03 266)"/></radialGradient>
          <filter id="${id}b" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
        </defs>
        <rect x="18" y="18" width="104" height="104" rx="12" fill="oklch(0.05 0.01 260)"/>
        <rect x="12" y="12" width="104" height="104" rx="12" fill="url(#${id}w)"/>
        <g clip-path="url(#${id}c)" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 30L52 8L124 94L104 124Z" fill="oklch(0.9 0.04 240)" opacity="0.06"/>
          <path class="glow" stroke="oklch(0.55 0.18 264)" stroke-width="6" filter="url(#${id}b)"/>
          <path class="core" stroke="oklch(0.86 0.1 250)" stroke-width="1.5"/>
          <circle class="bead" r="2.6" fill="oklch(0.94 0.05 250)" stroke="none"/>
        </g>
        <rect x="12" y="12" width="104" height="104" rx="12" fill="url(#lit)" opacity="0.45"/>
        <rect x="12.8" y="12.8" width="102.4" height="102.4" rx="11.4" fill="none" stroke="url(#rim)" stroke-width="1.6"/>`;
      const glow = svg.querySelector('.glow'), core = svg.querySelector('.core'), bead = svg.querySelector('.bead');
      const draw = () => {
        const d = smooth(pts);
        glow.setAttribute('d', d); core.setAttribute('d', d);
        const h = pts[pts.length - 1];
        bead.setAttribute('cx', f(h[0])); bead.setAttribute('cy', f(h[1]));
      };
      draw();
      let hover = false, demo = null, back = null, t = 0;
      // Laid ink sinks and sways a little; the newest point stays at the pipette.
      const S = sim(() => {
        t += 1;
        for (let i = 0; i < pts.length - 1; i++) { pts[i][1] = Math.min(112, pts[i][1] + 0.12); pts[i][0] += Math.sin(t * 0.05 + i * 0.6) * 0.04; }
        draw();
        return hover;
      });
      const moveTo = p => {
        const h = pts[pts.length - 1];
        if (Math.hypot(p[0] - h[0], p[1] - h[1]) < 2.5) return;
        pts.push([clamp(p[0], 16, 112), clamp(p[1], 16, 112)]);
        if (pts.length > N) pts.shift();
        draw();
      };
      return {
        enter(p) {
          back?.kill(); back = null;
          hover = true; S.start();
          if (p) moveTo(p);
          else { const st = { a: 0 }; demo = gsap.to(st, { a: 1, duration: 2, ease: 'sine.inOut', onUpdate: () => moveTo([64 + 34 * Math.sin(st.a * TAU), 64 + 22 * Math.sin(st.a * TAU * 2)]) }); }
        },
        move(p) { if (p && !demo) moveTo(p); },
        // On release the thread eases back to its resting curve.
        leave() {
          hover = false; demo?.kill(); demo = null;
          const from = resample(pts, N), st = { k: 0 };
          back = gsap.to(st, { k: 1, duration: 0.9, ease: 'power2.inOut', onUpdate: () => { pts = from.map((p, i) => [p[0] + (REST[i][0] - p[0]) * st.k, p[1] + (REST[i][1] - p[1]) * st.k]); draw(); } });
        },
      };
    },
  });

  /* ================= D · Light ================= */

  // A dark tank with a resting plume; the light comes from the pointer, so the lit edge and the beam turn to it.
  DIRS.push({
    toy: 'ink', l: 'D', name: 'Light', emblemUrl: 'spike/emblems/ink-d.svg',
    box: [12, 12, 110, 110],
    art(svg, id) {
      const C = [64, 60], HOME = [20, 20];
      svg.innerHTML = `
        <defs>
          <clipPath id="${id}c"><rect x="12" y="12" width="104" height="104" rx="12"/></clipPath>
          <radialGradient id="${id}p" gradientUnits="userSpaceOnUse" r="52"><stop offset="0" style="stop-color: oklch(0.86 0.1 250)"/><stop offset="0.45" style="stop-color: oklch(0.55 0.18 264)"/><stop offset="1" style="stop-color: oklch(0.22 0.1 268)"/></radialGradient>
          <filter id="${id}b" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
          <filter id="${id}w" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
        </defs>
        <rect x="18" y="18" width="104" height="104" rx="12" fill="oklch(0.05 0.01 260)"/>
        <rect x="12" y="12" width="104" height="104" rx="12" fill="oklch(0.11 0.03 262)"/>
        <g clip-path="url(#${id}c)">
          <path class="beam" fill="oklch(0.92 0.04 240)" opacity="0.13" filter="url(#${id}w)"/>
          <circle class="src" r="7" fill="oklch(0.95 0.03 90)" opacity="0.55" filter="url(#${id}w)"/>
          <g fill="url(#${id}p)" filter="url(#${id}b)">${PLUME.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>
        </g>
        <rect x="12" y="12" width="104" height="104" rx="12" fill="url(#lit)" opacity="0.3"/>
        <rect x="12.8" y="12.8" width="102.4" height="102.4" rx="11.4" fill="none" stroke="url(#rim)" stroke-width="1.6"/>`;
      const grad = svg.querySelector(`#${id}p`), beam = svg.querySelector('.beam'), src = svg.querySelector('.src');
      const L = { x: HOME[0], y: HOME[1] };
      const draw = () => {
        const dx = C[0] - L.x, dy = C[1] - L.y, m = Math.hypot(dx, dy) || 1, nx = -dy / m, ny = dx / m;
        grad.setAttribute('cx', f(C[0] - (dx / m) * 16)); grad.setAttribute('cy', f(C[1] - (dy / m) * 16));
        beam.setAttribute('d', `M${f(L.x)} ${f(L.y)}L${f(C[0] + nx * 26)} ${f(C[1] + ny * 26)}L${f(C[0] + dx * 0.6 + nx * 34)} ${f(C[1] + dy * 0.6 + ny * 34)}L${f(C[0] + dx * 0.6 - nx * 34)} ${f(C[1] + dy * 0.6 - ny * 34)}L${f(C[0] - nx * 26)} ${f(C[1] - ny * 26)}Z`);
        src.setAttribute('cx', f(L.x)); src.setAttribute('cy', f(L.y));
      };
      draw();
      let demo = null;
      const aim = (x, y, d = 0.35) => gsap.to(L, { x, y, duration: d, ease: 'power2.out', overwrite: true, onUpdate: draw });
      return {
        enter(p) {
          if (p) aim(p[0], p[1]);
          else { const st = { a: 0 }; demo = gsap.to(st, { a: 1, duration: 2.4, ease: 'none', onUpdate: () => { const a = -2.4 + st.a * TAU; L.x = 64 + 48 * Math.cos(a); L.y = 60 + 48 * Math.sin(a); draw(); } }); }
        },
        move(p) { if (p && !demo) aim(p[0], p[1]); },
        leave() { demo?.kill(); demo = null; aim(HOME[0], HOME[1], 0.8); },
      };
    },
  });

  /* ================= E · Mix ================= */

  // Three soft inks on a lit tank chase the pointer at their own pace; where they overlap, they mix.
  DIRS.push({
    toy: 'ink', l: 'E', name: 'Mix', emblemUrl: 'spike/emblems/ink-e.svg',
    box: [12, 12, 110, 110],
    art(svg, id) {
      const HOME = [[54, 56], [76, 56], [65, 74]], K = [0.16, 0.1, 0.065];
      const P = HOME.map(p => [...p]);
      svg.innerHTML = `
        <defs>
          <clipPath id="${id}c"><rect x="12" y="12" width="104" height="104" rx="12"/></clipPath>
          <radialGradient id="${id}l" cx="0.34" cy="0.3" r="0.9"><stop offset="0" style="stop-color: oklch(0.99 0.02 85)"/><stop offset="0.6" style="stop-color: oklch(0.92 0.02 90)"/><stop offset="1" style="stop-color: oklch(0.8 0.03 235)"/></radialGradient>
          <filter id="${id}b" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.8"/></filter>
        </defs>
        <rect x="18" y="18" width="104" height="104" rx="12" fill="oklch(0.07 0.01 260)"/>
        <rect x="12" y="12" width="104" height="104" rx="12" fill="url(#${id}l)"/>
        <g clip-path="url(#${id}c)" style="isolation: isolate">
          ${INKS.map(c => `<circle class="ink" r="18" fill="${c}" opacity="0.88" filter="url(#${id}b)" style="mix-blend-mode: multiply"/>`).join('')}
        </g>
        <rect x="12" y="12" width="104" height="104" rx="12" fill="url(#lit)" opacity="0.45"/>
        <rect x="12.8" y="12.8" width="102.4" height="102.4" rx="11.4" fill="none" stroke="url(#rim)" stroke-width="1.6"/>`;
      const dots = [...svg.querySelectorAll('.ink')];
      const draw = () => dots.forEach((d, i) => { d.setAttribute('cx', f(P[i][0])); d.setAttribute('cy', f(P[i][1])); });
      draw();
      let target = null, demo = null;
      // Each ink follows its own spring; the pointer pulls them into one shared mix.
      const S = sim(() => {
        let m = 0;
        P.forEach((p, i) => {
          const g = target ? [target[0] + (HOME[i][0] - 65) * 0.35, target[1] + (HOME[i][1] - 62) * 0.35] : HOME[i];
          const k = target ? K[i] : 0.08;
          p[0] += (g[0] - p[0]) * k; p[1] += (g[1] - p[1]) * k;
          m = Math.max(m, Math.abs(g[0] - p[0]) + Math.abs(g[1] - p[1]));
        });
        draw();
        return !!target || m > 0.05;
      });
      return {
        enter(p) {
          if (p) target = [clamp(p[0], 26, 102), clamp(p[1], 26, 102)];
          else { target = [64, 62]; const st = { a: 0 }; demo = gsap.to(st, { a: 1, duration: 2.4, ease: 'none', onUpdate: () => { target = [64 + 26 * Math.cos(st.a * TAU), 62 + 22 * Math.sin(st.a * TAU)]; } }); }
          S.start();
        },
        move(p) { if (p && !demo) { target = [clamp(p[0], 26, 102), clamp(p[1], 26, 102)]; S.start(); } },
        leave() { demo?.kill(); demo = null; target = null; S.start(); },
      };
    },
  });

  /* ================= Gallery ================= */

  const NAMES = { ink: 'Ink in water' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  // The pointer in the icon's own coordinates, as the menu passes it.
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || '';
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move?.(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
