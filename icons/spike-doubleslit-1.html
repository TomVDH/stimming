<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Double slit 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Double slit 1</h1>
<p class="lede">Double slit, round 1. No pick yet; A goes on the menu until Tom picks. A: a dark glass detector plate in a matte frame, five columns of blue photon dots on its face. D: a block of dark glass with the same face on its top.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  const DIRS = [];


  // The toy's tokens: dark blue glass, a matte frame, blue photon dots.
  const GLASS = [[0, 'oklch(0.33 0.05 262)'], [1, 'oklch(0.16 0.035 266)']];
  const FRAME = [[0, 'oklch(0.42 0.012 260)'], [1, 'oklch(0.22 0.01 262)']];
  const DOT = 'oklch(0.72 0.18 258)', HOT = 'oklch(0.88 0.1 252)';
  const FLASH = [[0, '#fff', 1], [0.3, 'oklch(0.86 0.12 252)', 0.9], [1, 'oklch(0.66 0.2 260)', 0]];

  // The fringes: five columns, tall in the middle, as the sinc envelope gives.
  // A seeded generator keeps the same dots on every load.
  const COLS = [0.45, 0.82, 1, 0.82, 0.45];
  const fringeDots = (dx, dy, rows) => {
    let s = 11;
    const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
    const out = [];
    COLS.forEach((w, k) => {
      for (let j = -rows; j <= rows; j++) {
        // A fringe is as tall as its share of the envelope.
        const reach = Math.abs(j) <= rows * (0.3 + 0.7 * w) + 0.2;
        const r = rnd(), jx = rnd() - 0.5, jy = rnd() - 0.5;
        if (reach && r < 0.5 + 0.45 * w) out.push({ x: (k - 2) * dx + jx * dx * 0.16, y: j * dy + jy * dy * 0.3, hot: k === 2 });
      }
    });
    // A few dark counts land between the fringes.
    [[-1.5, -2.6], [0.5, 3.2], [2.5, -0.8], [-2.6, 2.1]].forEach(([c, j]) => out.push({ x: c * dx, y: j * dy, hot: false, stray: true }));
    return out;
  };

  // The shared motion: play dims the plate and photons land one by one.
  // Each landing flashes and lights one dot; a full plate dims and starts again.
  const run = (dots, flashes, at) => {
    const st = { live: false, lit: dots.map(() => 1), next: 0, last: 0, wait: 0, fl: 0 };
    const paint = () => dots.forEach((d, i) => d.setAttribute('opacity', f(0.16 + 0.84 * st.lit[i])));
    const land = () => {
      const dim = st.lit.map((v, i) => (v < 0.5 ? i : -1)).filter(i => i >= 0);
      if (!dim.length) { st.wait = 0.9; return; }
      const i = dim[Math.floor(Math.random() * dim.length)];
      st.lit[i] = 1;
      const [x, y] = at(i);
      const c = flashes[st.fl++ % flashes.length];
      c.setAttribute('cx', f(x)); c.setAttribute('cy', f(y));
      gsap.fromTo(c, { attr: { r: 2 }, opacity: 1 }, { attr: { r: 9 }, opacity: 0, duration: 0.5, ease: 'power2.out' });
    };
    const step = time => {
      const dt = Math.min(0.1, time - (st.last || time));
      st.last = time;
      if (st.live) {
        if (st.wait > 0) {
          st.wait -= dt;
          if (st.wait <= 0) st.lit = st.lit.map(() => 0);
        } else if ((st.next -= dt) <= 0) {
          st.next = 0.07 + Math.random() * 0.09;
          land();
        }
      } else {
        st.lit = st.lit.map(v => Math.min(1, v + dt * 2.5));
      }
      paint();
      if (!st.live && st.lit.every(v => v >= 1) && st.last > 0) { st.last = 0; loop.stop(); }
    };
    const loop = clock(step);
    return {
      enter() { st.live = true; st.lit = st.lit.map(() => 0); st.wait = 0; st.next = 0.05; paint(); loop.start(); },
      move() {},
      leave() { st.live = false; loop.start(); },
    };
  };

  /* ================= Current ================= */

  // Double slit is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // A detector plate stands face on: a matte frame round dark glass.
  const AF = { x: 12, y: 24, w: 104, h: 70, r: 9 }, AG = { x: 19, y: 31, w: 90, h: 56, r: 4 };
  const rrect = ({ x, y, w, h, r }) => `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
  const A_DOTS = fringeDots(15, 4.6, 5).map(d => ({ ...d, x: 64 + d.x, y: 59 + d.y }));
  // The emblem draws each fringe as a straight column of bold dots.
  const A_EMB = COLS.flatMap((w, k) => { const n = [2, 4, 5, 4, 2][k]; return Array.from({ length: n }, (_, j) => [64 + (k - 2) * 16, 59 + (j - (n - 1) / 2) * 9.5]); });
  // A soft glow stands behind each fringe, so the stripes read small.
  const glowCols = (u, cx, cy, dx, h) => COLS.map((w, k) => `<ellipse cx="${f(cx + (k - 2) * dx)}" cy="${cy}" rx="4" ry="${f(h * (0.45 + 0.55 * w))}" fill="oklch(0.62 0.2 260)" opacity="${f(0.25 + 0.35 * w)}" filter="url(#${u}c)"/>`).join('');
  const A_DEPTH = rrect({ x: AF.x, y: AF.y + 6, w: AF.w, h: AF.h, r: AF.r });
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [10, 22, 108, 82],
    idea: 'A photon detector stands face on: a matte frame round a plate of dark blue glass. Five columns of blue dots lie on the glass, tall and bright in the middle, short at the sides, with a few strays between: the fringes of two slits, made of single hits. The pointer dims the plate, and photons land one at a time, each a white flash that leaves its dot, until the fringes stand again. They come back at once when the pointer leaves.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 5)}${blur(`${u}c`, 2.4)}
          ${lg(`${u}frame`, FRAME)}${lg(`${u}glass`, GLASS)}${rg(`${u}fl`, FLASH)}</defs>
        <ellipse cx="64" cy="103" rx="50" ry="4" fill="oklch(0.05 0.01 240)" opacity="0.6" filter="url(#${u}b)"/>
        <path d="${A_DEPTH}" fill="oklch(0.14 0.008 262)"/>
        ${body(rrect(AF), u, 'frame')}
        <path d="${rrect(AG)}" fill="url(#${u}glass)"/>
        <ellipse cx="64" cy="59" rx="22" ry="20" fill="oklch(0.6 0.2 260)" opacity="0.28" filter="url(#${u}g)"/>
        ${glowCols(u, 64, 59, 15, 22)}
        <g class="dots">${A_DOTS.map(d => `<circle cx="${f(d.x)}" cy="${f(d.y)}" r="${d.hot ? 2.4 : 2.2}" fill="${d.hot ? HOT : DOT}"${d.stray ? ' fill-opacity="0.7"' : ''}/>`).join('')}</g>
        <path d="${rrect(AG)}" fill="url(#${u}lit)" opacity="0.7"/>
        <g>${[0, 1, 2, 3, 4].map(() => `<circle class="fl" cx="64" cy="60" r="2" fill="url(#${u}fl)" opacity="0"/>`).join('')}</g>`;
      const dots = [...svg.querySelectorAll('.dots circle')], fl = [...svg.querySelectorAll('.fl')];
      return run(dots, fl, i => [A_DOTS[i].x, A_DOTS[i].y]);
    },
    // The emblem: a white frame round a dark face, the dots white on it.
    emblem: `${EMB_HEAD}<path d="${rrect(AF)}${rrect(AG)}" fill="#fff" fill-rule="evenodd"/>${A_EMB.map(([x, y]) => `<circle cx="${f(x)}" cy="${f(y)}" r="3.6" fill="#fff"/>`).join('')}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A block of dark glass; its top is the detector face.
  const CY = 40, HX = 34, HY = 26, T = 16;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  const IN = 6;
  const FACE = [iso(-HX + IN, -HY + IN), iso(HX - IN, -HY + IN), iso(HX - IN, HY - IN), iso(-HX + IN, HY - IN)];
  // The fringes run along gy; the columns step along gx.
  const D_DOTS = fringeDots(10.5, 3.6, 5).map(d => { const [x, y] = iso(d.x, d.y); return { ...d, x, y }; });
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [12, 10, 104, 76],
    idea: 'A block of dark blue glass at 30 degrees: light top, mid left face, dark right face, a rim on the top edges. Its top is the detector face, a darker inset with the five fringe columns of blue dots laid flat on it. The pointer dims the face and photons land one at a time with a white flash until the fringes stand again.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 5)}${blur(`${u}c`, 2)}
          ${lg(`${u}top`, [[0, 'oklch(0.42 0.05 262)'], [1, 'oklch(0.3 0.045 264)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.3 0.04 262)'], [1, 'oklch(0.22 0.035 264)']])}
          ${lg(`${u}R`, [[0, 'oklch(0.2 0.03 264)'], [1, 'oklch(0.14 0.025 266)']])}
          ${lg(`${u}glass`, GLASS, 'x1="0.2" y1="0" x2="0.6" y2="1"')}${rg(`${u}fl`, FLASH)}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${poly(FACE)}" fill="url(#${u}glass)"/>
        <ellipse cx="64" cy="${CY}" rx="22" ry="12" fill="oklch(0.6 0.2 260)" opacity="0.28" filter="url(#${u}g)"/>
        <g transform="matrix(0.866 0.5 -0.866 0.5 64 ${CY})">${glowCols(u, 0, 0, 10.5, 18).replaceAll('rx="4"', 'rx="3"')}</g>
        <g class="dots">${D_DOTS.map(d => `<ellipse cx="${f(d.x)}" cy="${f(d.y)}" rx="${d.hot ? 2.3 : 2.1}" ry="${d.hot ? 1.4 : 1.25}" fill="${d.hot ? HOT : DOT}"${d.stray ? ' fill-opacity="0.7"' : ''}/>`).join('')}</g>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g>${[0, 1, 2, 3, 4].map(() => `<circle class="fl" cx="64" cy="60" r="2" fill="url(#${u}fl)" opacity="0"/>`).join('')}</g>`;
      const dots = [...svg.querySelectorAll('.dots ellipse')], fl = [...svg.querySelectorAll('.fl')];
      return run(dots, fl, i => [D_DOTS[i].x, D_DOTS[i].y]);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/><path d="${poly(FACE)}" fill="#000"/>${COLS.flatMap((w, k) => { const n = [2, 4, 5, 4, 2][k]; return Array.from({ length: n }, (_, j) => iso((k - 2) * 11, (j - (n - 1) / 2) * 8)); }).map(([x, y]) => `<ellipse cx="${f(x)}" cy="${f(y)}" rx="3.6" ry="2.2" fill="#fff"/>`).join('')}</svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Double slit';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-doubleslit';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `doubleslit-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
