<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Snow globe 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --accent: oklch(0.93 0.04 230);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: white on black, the toy's accent, the flash box and the dark glass. */
.emb { display: flex; flex-wrap: wrap; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.ink { background: #000; color: #fff; }
.acc { background: #000; }
.acc i { background: var(--accent); }
.bar { background: #000; color: #fff; }
.bar i { width: 28px; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Snow globe 1</h1>
<p class="lede">Snow globe, round 1: a night scene under glass, a cabin and pines in the snow, on a gold collar and a walnut foot. A: free on the ground. D: the base is a walnut block.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const stops = s => s.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('');
  const lg = (id, s, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops(s)}</linearGradient>`;
  const rg = (id, s, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops(s)}</radialGradient>`;
  // A radial gradient in the art's own units.
  const rgU = (id, s, cx, cy, r) => rg(id, s, `gradientUnits="userSpaceOnUse" cx="${cx}" cy="${cy}" r="${r}"`);
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill) => `<path d="${d}" fill="url(#${u}${fill})"/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };
  const { sin, cos, hypot, sqrt, PI } = Math;
  // A fixed hash: the same flakes on every load.
  const hash = i => { const x = sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  // The toy's tokens: night glass, snow, pine, a red cabin, gold and walnut.
  const NIGHT = [[0, 'oklch(0.34 0.15 302)'], [0.5, 'oklch(0.3 0.12 280)'], [1, 'oklch(0.42 0.1 245)']];
  const SNOW = [[0, 'oklch(0.99 0.006 240)'], [1, 'oklch(0.82 0.05 252)']];
  const SNOW_BACK = [[0, 'oklch(0.9 0.03 255)'], [1, 'oklch(0.72 0.06 262)']];
  const PINE = [[0, 'oklch(0.6 0.12 150)'], [0.45, 'oklch(0.44 0.1 158)'], [1, 'oklch(0.28 0.07 168)']];
  const CABIN = [[0, 'oklch(0.64 0.17 30)'], [1, 'oklch(0.44 0.15 24)']];
  const WARM = 'oklch(0.9 0.14 85)', DOOR = 'oklch(0.32 0.08 30)', BARK = 'oklch(0.36 0.06 50)';
  // Gold and walnut take two specular bands; the right edge takes the toy's cool light.
  const GOLD = [[0, 'oklch(0.5 0.09 68)'], [0.2, 'oklch(0.95 0.09 92)'], [0.36, 'oklch(0.74 0.13 80)'], [0.78, 'oklch(0.44 0.09 62)'], [0.92, 'oklch(0.7 0.08 230)'], [1, 'oklch(0.45 0.08 65)']];
  const WOOD = [[0, 'oklch(0.28 0.06 42)'], [0.2, 'oklch(0.6 0.1 58)'], [0.3, 'oklch(0.72 0.09 66)'], [0.4, 'oklch(0.5 0.09 52)'], [0.78, 'oklch(0.27 0.06 42)'], [0.93, 'oklch(0.5 0.07 235)'], [1, 'oklch(0.3 0.05 45)']];

  // The base in the globe's units: a gold collar, then a walnut foot.
  const COLLAR_TOP = 33, COLLAR_BOT = 41, COLLAR_RX = 28, COLLAR_RY = 5.5;
  const COLLAR_FRONT = `M${-COLLAR_RX} ${COLLAR_TOP}A${COLLAR_RX} ${COLLAR_RY} 0 0 0 ${COLLAR_RX} ${COLLAR_TOP}L${COLLAR_RX} ${COLLAR_BOT}A${COLLAR_RX} ${COLLAR_RY} 0 0 1 ${-COLLAR_RX} ${COLLAR_BOT}Z`;
  const FOOT = 'M-27 40C-36 44-37.5 55-33 60A33 6 0 0 0 33 60C37.5 55 36 44 27 40Z';
  const GROOVE = 'M-40 50A40 6.5 0 0 0 40 50L40 54A40 6.5 0 0 1-40 54Z';
  // The glass's reflection: a bold crescent at the top left.
  const CRESCENT = 'M-32.9 12A35 35 0 0 1 12-32.9A44 44 0 0 0-32.9 12Z';
  // The scene: a far drift, a near drift, three pines and a cabin.
  const BACK = 'M-42 6C-30-2-18 2-8 6C4 10 18 0 42 4V44H-42Z';
  const FRONT = 'M-42 23C-28 15-10 17 2 23C14 29 28 19 42 21V44H-42Z';
  const ground = x => 12 + 3 * sin(x * 0.09);
  // A pine as three tiers; a snow cap sits on each tier.
  const pineTiers = (x, base, h, w) => [2, 1, 0].map(i => {
    const y0 = base - h + i * h * 0.26, y1 = y0 + h * 0.46, hw = w * (0.32 + 0.17 * i), th = y1 - y0;
    return { tier: poly([[x, y0], [x + hw, y1], [x - hw, y1]]), cap: poly([[x, y0], [x + hw * 0.4, y0 + th * 0.4], [x + hw * 0.08, y0 + th * 0.3], [x - hw * 0.16, y0 + th * 0.42], [x - hw * 0.4, y0 + th * 0.4]]) };
  });
  const pine = (u, x, base, h, w) => `<rect x="${f(x - 1.8)}" y="${f(base - h * 0.2)}" width="3.6" height="${f(h * 0.2)}" fill="${BARK}"/>` +
    pineTiers(x, base, h, w).map(p => `<path d="${p.tier}" fill="url(#${u}pine)"/><path d="${p.tier}" fill="url(#${u}lit)"/><path d="${p.cap}" fill="url(#${u}snow)"/>`).join('');
  // As in the toy: a big pine left, one right, a small one front left.
  const PINES = [[23, 9, 30, 15], [-21, 19, 43, 24], [-5, 29, 19, 11]];
  const ROOF = poly([[-12.5, 2.5], [1, -9.5], [14.5, 2.5]]);
  const CAB = poly([[-9, 1], [11, 1], [11, 14], [-9, 14]]);
  const cabin = u => `<circle cx="5.5" cy="7.5" r="9" fill="${WARM}" opacity="0.4" filter="url(#${u}wb)"/>
    <path d="${CAB}" fill="url(#${u}cabin)"/><path d="${CAB}" fill="url(#${u}lit)"/>
    <rect x="3" y="4.5" width="5.5" height="5.5" rx="0.8" fill="${WARM}"/>
    <rect x="-5.5" y="6" width="5" height="8" fill="${DOOR}"/>
    <rect x="7" y="-8" width="4" height="7" fill="oklch(0.42 0.12 28)"/><rect x="6.4" y="-9.4" width="5.2" height="2.4" rx="1" fill="oklch(0.97 0.01 240)"/>
    <path d="${ROOF}" fill="url(#${u}snow)"/><path d="M1-9.5L14.5 2.5H1Z" fill="oklch(0.78 0.05 255)" opacity="0.55"/>`;
  // Flake homes sit in the sky on a jittered grid; each is [x, y, r].
  const HOME = [[-20, -22], [-4, -30], [12, -27], [26, -14], [-30, -6], [-12, -12], [6, -16], [20, -2], [-24, 4], [32, 2], [-6, -2]]
    .map(([x, y], i) => [x + (hash(i + 1) - 0.5) * 4, y + (hash(i + 40) - 0.5) * 4, 2 + hash(i + 80) * 1]);
  // The globe's markup in its own units: the centre is 0 0, the glass radius is 40.
  // g: cx, cy, s (scale), fk (flake size factor), foot, pivot (the rock's centre).
  const globeMarkup = (u, g) => `
    <g transform="translate(${g.cx} ${g.cy}) scale(${g.s})"><g class="rot">
      ${g.foot ? `${body(FOOT, u, 'wood')}<path d="${GROOVE}" fill="oklch(0.2 0.05 40)" opacity="0.45" clip-path="url(#${u}fc)"/>` : ''}
      <ellipse cx="0" cy="${COLLAR_TOP}" rx="${COLLAR_RX}" ry="${COLLAR_RY}" fill="oklch(0.42 0.08 66)"/>
      <circle r="40" fill="url(#${u}night)"/>
      <g clip-path="url(#${u}in)">
        <circle cx="2" cy="4" r="30" fill="url(#${u}warm)"/>
        <path d="${BACK}" fill="url(#${u}back)"/>
        ${pine(u, ...PINES[0])}
        ${cabin(u)}
        ${pine(u, ...PINES[1])}
        <path d="${FRONT}" fill="url(#${u}snow)"/>
        ${pine(u, ...PINES[2])}
        <g class="flakes" fill="oklch(0.99 0.005 240)"></g>
      </g>
      <circle r="40" fill="url(#${u}lit)"/>
      <path d="${CRESCENT}" fill="url(#${u}cres)"/>
      <circle r="39" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
      ${body(COLLAR_FRONT, u, 'gold')}
    </g></g>`;
  const globeDefs = u => `${light(u)}${blur(`${u}wb`, 3)}${blur(`${u}ab`, 3)}
    <clipPath id="${u}in"><circle r="38.6"/></clipPath>
    <clipPath id="${u}fc"><path d="${FOOT}"/></clipPath>
    ${lg(`${u}night`, NIGHT)}
    ${lg(`${u}snow`, SNOW)}
    ${lg(`${u}back`, SNOW_BACK)}
    ${lg(`${u}pine`, PINE, 'x1="0" y1="0" x2="1" y2="0.3"')}
    ${lg(`${u}cabin`, CABIN, 'x1="0" y1="0" x2="1" y2="1"')}
    ${lg(`${u}gold`, GOLD, 'x1="0" y1="0" x2="1" y2="0"')}
    ${lg(`${u}wood`, WOOD, 'x1="0" y1="0" x2="1" y2="0"')}
    ${rg(`${u}warm`, [[0, WARM, 0.3], [1, WARM, 0]])}
    ${rg(`${u}aura`, [[0, 'oklch(0.6 0.12 270)', 0.32], [0.6, 'oklch(0.5 0.12 280)', 0.1], [1, 'oklch(0.5 0.12 280)', 0]])}
    ${lg(`${u}cres`, [[0, '#fff', 0.05], [0.45, '#fff', 0.36], [1, '#fff', 0.04]], 'x1="0" y1="1" x2="1" y2="0"')}`;

  // The live globe: the pointer rocks it; the snow swirls, then falls.
  const globe = (svg, g) => {
    const rot = svg.querySelector('.rot'), flakeG = svg.querySelector('.flakes');
    const fl = HOME.map(([hx, hy, r], i) => ({ hx, hy, x: hx, y: hy, vx: 0, vy: 0, i, t: 0, el: el('circle', { r: f(r * g.fk) }, flakeG) }));
    const st = { th: 0, w: 0, live: false, last: null, t: 0 };
    const draw = () => {
      rot.setAttribute('transform', `rotate(${f(st.th)} 0 ${g.pivot})`);
      for (const p of fl) { p.el.setAttribute('cx', f(p.x)); p.el.setAttribute('cy', f(p.y)); }
    };
    const respawn = p => { p.x = (hash(p.i + p.t * 7) - 0.5) * 50; p.y = -sqrt(34 * 34 - p.x * p.x) + 3; p.vx = 0; p.vy = 2; p.t += 1; };
    const loop = clock(time => {
      const dt = Math.min(0.1, time - (st.t || time));
      st.t = time;
      // A damped spring rights the globe.
      st.w += (-90 * st.th - 7 * st.w) * dt;
      st.th = clamp(st.th + st.w * dt, -10, 10);
      for (const p of fl) {
        if (st.live) {
          // The water lags the glass; the flakes sink and sway.
          p.vx += (5 * sin(time * 1.7 + p.hx) - 0.5 * st.w) * dt;
          p.vy += 13 * dt;
          const k = 1 - 1.4 * dt;
          p.vx *= k; p.vy *= k;
          p.x += p.vx * dt; p.y += p.vy * dt;
          const d = hypot(p.x, p.y);
          if (d > 35) { p.x *= 35 / d; p.y *= 35 / d; p.vx *= -0.4; p.vy *= -0.4; }
          if (p.y > ground(p.x)) respawn(p);
        } else {
          // At rest each flake drifts home.
          p.x += (p.hx - p.x) * 0.07; p.y += (p.hy - p.y) * 0.07; p.vx = p.vy = 0;
        }
      }
      draw();
      // The clock stops once the globe rests.
      if (!st.live && Math.abs(st.th) + Math.abs(st.w) * 0.1 < 0.03 && fl.every(p => Math.abs(p.x - p.hx) + Math.abs(p.y - p.hy) < 0.05)) {
        st.th = st.w = 0; fl.forEach(p => { p.x = p.hx; p.y = p.hy; }); draw(); loop.stop();
      }
    });
    draw();
    const toLocal = p => p && [(p[0] - g.cx) / g.s, (p[1] - g.cy) / g.s];
    return {
      enter(p) {
        st.live = true;
        const q = toLocal(p);
        // The entry shakes the globe away from the pointer's side.
        st.w += q && q[0] > 0 ? -70 : 70;
        fl.forEach((f2, i) => { f2.vx = (hash(i + 7 + st.t) - 0.5) * 40; f2.vy = -4 - hash(i + 9) * 18; });
        st.last = q; loop.start();
      },
      // A sideways pointer rocks the globe and stirs the snow.
      move(p) {
        const q = toLocal(p);
        if (!q) return;
        if (st.last) {
          const dx = clamp(q[0] - st.last[0], -8, 8);
          st.w = clamp(st.w + dx * 7, -140, 140);
          fl.forEach(f2 => { f2.vx += dx * 1.6; f2.vy -= Math.abs(dx) * 0.8; });
        }
        st.last = q;
      },
      leave() { st.live = false; st.last = null; loop.start(); },
    };
  };

  // The emblem's globe: white glass and base; the pines and cabin cut out.
  const emblemGlobe = g => {
    const trees = PINES.slice(0, 2).map(p => pineTiers(...p).map(t => t.tier).join('')).join('');
    return `<defs><clipPath id="ec${g.foot ? 'a' : 'd'}"><circle r="34"/></clipPath></defs>
    <g transform="translate(${g.cx} ${g.cy}) scale(${g.s})">
      ${g.foot ? `<path d="${FOOT}" fill="#fff"/>` : ''}
      <circle r="40" fill="#fff"/>
      <g clip-path="url(#ec${g.foot ? 'a' : 'd'})" fill="#000">
        <path d="${trees}"/><path d="${ROOF}"/><path d="${CAB}"/>
        <rect x="-23" y="${PINES[1][1] - 9}" width="4" height="9"/>
      </g>
      <path d="M-34 ${ground(-34) + 9}C-20 15-6 17 4 21C16 25 26 18 34 ${ground(34) + 8}" fill="none" stroke="#fff" stroke-width="5"/>
      <rect x="2.5" y="4" width="6.5" height="6.5" fill="#fff"/>
      ${[[-4, -24], [16, -20], [-26, -6], [24, -6]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.4" fill="#000"/>`).join('')}
      <path d="${COLLAR_FRONT}" fill="#fff"/>
      <path d="M${-COLLAR_RX - 2} ${COLLAR_TOP}A${COLLAR_RX + 2} ${COLLAR_RY + 1} 0 0 0 ${COLLAR_RX + 2} ${COLLAR_TOP}" fill="none" stroke="#000" stroke-width="3.4"/>
      ${g.foot ? `<path d="M${-COLLAR_RX} ${COLLAR_BOT}A${COLLAR_RX} ${COLLAR_RY} 0 0 0 ${COLLAR_RX} ${COLLAR_BOT}" fill="none" stroke="#000" stroke-width="3.4"/>` : ''}
    </g>`;
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover loop.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}<radialGradient id="${u}globe" cx="0.4" cy="0.35" r="0.7"><stop offset="0" style="stop-color: oklch(0.66 0.09 235)"/><stop offset="1" style="stop-color: oklch(0.36 0.09 258)"/></radialGradient><linearGradient id="${u}wd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: oklch(0.56 0.08 55)"/><stop offset="1" style="stop-color: oklch(0.36 0.06 45)"/></linearGradient></defs>
        <path d="M34 94H94L102 114H26Z" fill="url(#${u}wd)"/>
        <g class="globe">
          <circle cx="64" cy="56" r="38" fill="url(#${u}globe)"/>
          <ellipse cx="64" cy="86" rx="30" ry="7" fill="oklch(0.96 0.01 240)"/>
          <path d="M64 50L76 80H52Z" fill="oklch(0.6 0.13 155)"/>
          <g class="flakes" fill="oklch(0.98 0.005 240)"></g>
          <circle cx="64" cy="56" r="38" fill="url(#${u}lit)"/>
          <circle cx="64" cy="56" r="37" fill="none" stroke="url(#${u}rim)" stroke-width="1.5"/>
        </g>`;
      const globeEl = svg.querySelector('.globe');
      const flakes = Array.from({ length: 12 }, (_, k) => el('circle', {
        cx: (40 + ((k * 37) % 48)).toFixed(1), cy: (28 + ((k * 23) % 40)).toFixed(1), r: k % 3 ? 1.6 : 2.4,
      }, svg.querySelector('.flakes')));
      let tl = null;
      return {
        enter() {
          tl?.kill();
          // Snow drifts down inside the dome after a shake.
          tl = gsap.timeline({ repeat: -1 })
            .fromTo(globeEl, { rotation: -6, svgOrigin: '64 104' }, { rotation: 0, svgOrigin: '64 104', duration: 0.6, ease: 'elastic.out(1, 0.4)' })
            .fromTo(flakes, { y: -10, x: 0, opacity: 0 }, { y: 14, x: 'random(-6, 6)', opacity: 1, duration: 2.2, ease: 'sine.inOut', stagger: 0.12 }, 0);
        },
        move() {},
        leave() {
          tl?.kill(); tl = null;
          gsap.to(globeEl, { rotation: 0, svgOrigin: '64 104', duration: 0.3, overwrite: true });
          gsap.to(flakes, { y: 0, x: 0, opacity: 1, duration: 0.3, overwrite: true });
        },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // The globe free on the ground, on its gold collar and walnut foot.
  const A = { cx: 64, cy: 49, s: 1, fk: 1, foot: true, pivot: 66 };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    idea: 'The snow globe as a live model. Night glass, violet above and blue below, with a bold reflection; inside, a red cabin with a warm window between snow-capped pines on two drifts. The globe sits in a gold collar on a turned walnut foot. The pointer rocks it: the entry shakes it away from the pointer, a sideways move rocks it more, and a spring rights it. The snow lags the glass, swirls up and sinks; flakes that land fall again from the top. On leave the snow settles back to its picture.',
    art(svg, u) {
      svg.innerHTML = `<defs>${globeDefs(u)}</defs>
        <ellipse cx="64" cy="${A.cy + 66}" rx="38" ry="5" fill="oklch(0.05 0.01 290)" opacity="0.55" filter="url(#${u}ab)"/>
        <circle cx="64" cy="${A.cy}" r="50" fill="url(#${u}aura)"/>
        <g class="fit">${globeMarkup(u, A)}</g>`;
      return globe(svg, A);
    },
    emblem: emblemGlobe(A),
  });

  /* ================= D: Isometric block ================= */

  // The base is the block: walnut, with the gold collar set in its top.
  const CY = 84, HALF = 25, T = 15;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const [N, E, S, W] = D_TOP;
  const down = p => [p[0], p[1] + T];
  const D = { cx: 64, cy: 47, s: 0.78, fk: 1.2, foot: false, pivot: 46 };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    idea: 'The base is the block: walnut, lit on the top, mid on the left face, dark on the right, a rim on the top edges. The live globe sits in its gold collar on top and rocks on it; the snow swirls as in A.',
    art(svg, u) {
      svg.innerHTML = `<defs>${globeDefs(u)}${blur(`${u}s`, 2.6)}
          ${lg(`${u}top`, [[0, 'oklch(0.66 0.09 62)'], [1, 'oklch(0.48 0.09 52)']], 'x1="0.3" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}left`, [[0, 'oklch(0.4 0.07 48)'], [0.3, 'oklch(0.52 0.08 55)'], [0.42, 'oklch(0.4 0.07 48)'], [1, 'oklch(0.34 0.06 45)']], 'x1="0" y1="0" x2="1" y2="0"')}
          ${lg(`${u}right`, [[0, 'oklch(0.27 0.05 42)'], [0.75, 'oklch(0.22 0.04 40)'], [1, 'oklch(0.36 0.06 235)']], 'x1="0" y1="0" x2="1" y2="0"')}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 290)" opacity="0.5" filter="url(#${u}s)" transform="translate(0 4)"/>
        <circle cx="64" cy="${D.cy}" r="${40 * D.s + 9}" fill="url(#${u}aura)"/>
        <g class="fit">
          <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}left)"/>
          <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}right)"/>
          <path d="${poly(D_TOP)}" fill="url(#${u}top)"/>
          <path d="${poly(D_TOP)}" fill="url(#${u}lit)"/>
          <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
          <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
          <ellipse cx="64" cy="${CY + 1}" rx="${COLLAR_RX * D.s + 6}" ry="${(COLLAR_RY + 3) * D.s}" fill="oklch(0.2 0.04 40)" opacity="0.5" filter="url(#${u}ab)"/>
          ${globeMarkup(u, D)}
        </g>`;
      return globe(svg, D);
    },
    emblem: `<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/>${emblemGlobe(D)}`,
  });

  /* ================= Gallery ================= */
  const ID = 'snow', NAME = 'Snow globe';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitBox = svg => { const g = svg.querySelector('.fit'); if (!g) return null; const b = g.getBBox(); return [b.x, b.y, b.width, b.height]; };
  const viewOf = box => {
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    return `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`;
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = `row-${ID}`;
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const Dd of DIRS) {
    const file = `${ID}-${Dd.l.toLowerCase()}`;
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${Dd.l === 'Current' ? `<b>${Dd.l}</b>` : `<b>${Dd.l}</b><span>· ${Dd.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${Dd.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${Dd.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${Dd.l}, 64"></div></div>
      ${Dd.idea ? `<p class="idea">${Dd.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    let view = null;
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = Dd.art(svg, `u${++uid}`);
      // The frame is measured once, on the drawing at rest.
      const box = view ? null : fitBox(svg);
      if (box) view = viewOf(box);
      if (view) svg.setAttribute('viewBox', view);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
    if (!Dd.emblem) continue;
    // The emblem takes the icon's frame; it rides in the page as a data URI.
    const svgText = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${view}" width="128" height="128">${Dd.emblem}</svg>`;
    window.EMBLEMS[file] = svgText;
    const url = `'data:image/svg+xml,${encodeURIComponent(svgText)}'`;
    const emb = document.createElement('div');
    emb.className = 'emb';
    emb.innerHTML = ['ink', 'acc', 'bar', 'flash', 'glass'].map(k => `<div class="${k}"><i style="--emblem: url(${url})"></i></div>`).join('');
    card.querySelector('.icons').after(emb);
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
