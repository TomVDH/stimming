<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 1</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* Spike gallery: five icon directions per toy, each with its emblem. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --focus: oklch(0.84 0.13 205);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--fg); font: 500 13px/1.35 var(--sans); padding-inline: max(16px, env(safe-area-inset-left, 0px)); -webkit-font-smoothing: antialiased; }
.defs { position: absolute; width: 0; height: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 40px 72px; display: grid; gap: 56px; }
h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 6px 0 0; color: var(--muted); }
section { display: grid; gap: 16px; }
h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; display: flex; gap: 10px; align-items: baseline; }
h2 small { font-size: 12px; font-weight: 500; color: var(--muted); }
.dirs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1100px) { .dirs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .dirs { grid-template-columns: minmax(0, 1fr); } }
.dir { display: grid; gap: 12px; align-content: start; padding: 14px; border: 1px solid var(--line); border-radius: 14px; }
.tag { display: flex; gap: 8px; align-items: baseline; }
.tag b { font-size: 15px; font-weight: 800; }
.tag span { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
/* Icons sit on the menu ground: 128px and 64px squares. */
.icons { display: flex; gap: 14px; align-items: end; }
.toy { display: grid; place-items: center; color: inherit; border-radius: 10px; outline: none; cursor: pointer; }
.toy:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.toy.s128 { width: 128px; height: 128px; }
.toy.s64 { width: 64px; height: 64px; }
.toy svg { width: 100%; height: 100%; overflow: visible; }
.size { color: var(--muted); font-size: 10px; text-align: center; margin-top: 4px; }
/* Emblems: the intro flash box, then white on dark glass. */
.embs { display: flex; gap: 10px; }
.flash, .glass { position: relative; width: 96px; height: 96px; display: grid; place-items: center; border-radius: 2px; overflow: hidden; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: radial-gradient(circle at 30% 25%, var(--tint) 0%, transparent 70%), oklch(0.12 0.01 275); }
.glass::before { content: ""; position: absolute; inset: 0; background: oklch(0.1 0.01 275 / 0.35); }
.em { position: relative; width: 72px; height: 72px; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.idea { margin: 0; color: var(--fg); font-size: 13px; }
.pick { color: oklch(0.85 0.14 85); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
<div class="wrap">
  <header>
    <h1>Icon spike 1</h1>
    <p class="lede">Chladni plate, Beach walker, Fire. Five directions each. Hover or focus an icon.</p>
  </header>
  <main id="rows"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2, PI = Math.PI;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const f1 = n => (+n).toFixed(1);
  const pt = p => f1(p[0]) + ' ' + f1(p[1]);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  let uid = 0;
  // A gradient gets a unique id per icon instance.
  const grad = (svg, type, attrs, stops) => {
    let defs = svg.querySelector('defs') || el('defs', {}, svg);
    const id = 'g' + ++uid;
    const g = el(type, { id, ...attrs }, defs);
    stops.forEach(([o, c, op]) => el('stop', { offset: o, 'stop-color': c, ...(op != null ? { 'stop-opacity': op } : {}) }, g));
    return `url(#${id})`;
  };
  const clip = (svg, shape, attrs) => {
    let defs = svg.querySelector('defs') || el('defs', {}, svg);
    const id = 'c' + ++uid;
    const c = el('clipPath', { id }, defs);
    const s = el(shape, attrs, c);
    return { url: `url(#${id})`, shape: s };
  };
  const svgDoc = body => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">\n${body}\n</svg>\n`;
  // Seeded noise keeps every load the same.
  const rng = seed => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

  // ---------- Chladni geometry ----------
  // A free square plate: nodal lines are the zeros of this mode sum.
  const mode = (n, m, s) => (u, v) => Math.cos(n * PI * u) * Math.cos(m * PI * v) + s * Math.cos(m * PI * u) * Math.cos(n * PI * v);
  const MODES = [mode(1, 3, 1), mode(2, 4, 1), mode(3, 5, 1), mode(4, 6, 1), mode(3, 7, 1)];
  const REST = 1;
  // Marching squares trace the zero line; map sends u v to the drawing.
  const contour = (fn, N, map) => {
    const W = N + 1, val = new Float32Array(W * W);
    for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) val[j * W + i] = fn(i / N, j / N);
    let d = '';
    const P = (i, j) => pt(map(i / N, j / N));
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const a = val[j * W + i], b = val[j * W + i + 1], c = val[(j + 1) * W + i + 1], e = val[(j + 1) * W + i];
      const ps = [];
      if ((a > 0) !== (b > 0)) ps.push([i + a / (a - b), j]);
      if ((b > 0) !== (c > 0)) ps.push([i + 1, j + b / (b - c)]);
      if ((c > 0) !== (e > 0)) ps.push([i + 1 - c / (c - e), j + 1]);
      if ((e > 0) !== (a > 0)) ps.push([i, j + 1 - e / (e - a)]);
      for (let k = 0; k + 1 < ps.length; k += 2) d += 'M' + P(ps[k][0], ps[k][1]) + 'L' + P(ps[k + 1][0], ps[k + 1][1]);
    }
    return d;
  };
  // A fractional index blends two neighbouring modes.
  const blendAt = r => {
    const k = Math.min(MODES.length - 2, Math.floor(r)), t = smooth(clamp(r - k, 0, 1));
    const A = MODES[k], B = MODES[k + 1];
    return (u, v) => (1 - t) * A(u, v) + t * B(u, v);
  };
  // Sand grains settle where the plate is still.
  const GRAINS = 640;
  const grainSets = MODES.map((f, mi) => {
    const r = rng(17 + mi * 101), out = [];
    let guard = 0;
    while (out.length < GRAINS && guard++ < 400000) {
      const u = r(), v = r(), e = 1e-3;
      const gx = (f(u + e, v) - f(u - e, v)) / (2 * e), gy = (f(u, v + e) - f(u, v - e)) / (2 * e);
      const dist = Math.abs(f(u, v)) / (Math.hypot(gx, gy) + 1e-6);
      if (dist < 0.011 * (0.4 + r())) out.push([u, v]);
    }
    // Grains sort by angle so a mode change swirls instead of crossing.
    return out.sort((p, q) => Math.atan2(p[1] - 0.5, p[0] - 0.5) - Math.atan2(q[1] - 0.5, q[0] - 0.5));
  });

  // ---------- Jansen geometry ----------
  // The eleven holy numbers of the linkage, in its own units.
  const J = { a: 38, b: 41.5, c: 39.3, d: 40.1, e: 55.8, f: 39.4, g: 36.7, h: 65.7, i: 49, j: 50, k: 61.9, l: 7.8, m: 15 };
  const meet = (p, r1, q, r2, pick) => {
    const dx = q[0] - p[0], dy = q[1] - p[1], D = Math.hypot(dx, dy);
    const A = (r1 * r1 - r2 * r2 + D * D) / (2 * D), H = Math.sqrt(Math.max(0, r1 * r1 - A * A));
    const mx = p[0] + (A * dx) / D, my = p[1] + (A * dy) / D;
    const s1 = [mx - (H * dy) / D, my + (H * dx) / D], s2 = [mx + (H * dy) / D, my - (H * dx) / D];
    return pick(s1, s2) ? s1 : s2;
  };
  const up = (p, q) => p[1] > q[1], down = (p, q) => p[1] < q[1], left = (p, q) => p[0] < q[0];
  // One leg for crank angle th; y points up.
  const jansen = th => {
    const O = [0, 0], B = [-J.a, -J.l], M = [J.m * Math.cos(th), J.m * Math.sin(th)];
    const C = meet(M, J.j, B, J.b, up), D = meet(B, J.d, C, J.e, left), E = meet(M, J.k, B, J.c, down);
    const F = meet(D, J.f, E, J.g, left), G = meet(F, J.h, E, J.i, down);
    return { O, B, M, C, D, E, F, G };
  };
  // The mirror leg shares the crank pin.
  const pair = th => {
    const L = jansen(th), R0 = jansen(PI - th), R = {};
    for (const k in R0) R[k] = [-R0[k][0], R0[k][1]];
    return [L, R];
  };
  // The body travels this far per crank turn, in linkage units.
  const STRIDE = 115;
  const toScreen = (P, ax, ay, s) => { const o = {}; for (const k in P) o[k] = [ax + P[k][0] * s, ay - P[k][1] * s]; return o; };
  const legPaths = L => ({
    bars: `M${pt(L.O)}L${pt(L.M)}M${pt(L.M)}L${pt(L.C)}M${pt(L.M)}L${pt(L.E)}M${pt(L.B)}L${pt(L.E)}M${pt(L.D)}L${pt(L.F)}`,
    plates: `M${pt(L.B)}L${pt(L.C)}L${pt(L.D)}ZM${pt(L.E)}L${pt(L.F)}L${pt(L.G)}Z`,
    lines: `M${pt(L.B)}L${pt(L.C)}L${pt(L.D)}ZM${pt(L.E)}L${pt(L.F)}L${pt(L.G)}Z`,
  });
  // A lightening hole: the triangle shrunk toward its incentre.
  const inset = (a, b, c, k) => {
    const la = Math.hypot(b[0] - c[0], b[1] - c[1]), lb = Math.hypot(c[0] - a[0], c[1] - a[1]), lc = Math.hypot(a[0] - b[0], a[1] - b[1]), P = la + lb + lc;
    const I = [(a[0] * la + b[0] * lb + c[0] * lc) / P, (a[1] * la + b[1] * lb + c[1] * lc) / P];
    return 'M' + [a, b, c].map(q => pt([I[0] + (q[0] - I[0]) * k, I[1] + (q[1] - I[1]) * k])).join('L') + 'Z';
  };
  // A walker is a row of leg pairs on one body; phases spread the gait.
  const walkerPaths = (mods, ay, s, th) => {
    let bars = '', plates = '', xs = [];
    mods.forEach(([ax, ph]) => pair(th + ph).forEach(P => {
      const L = toScreen(P, ax, ay, s), q = legPaths(L);
      bars += q.bars; plates += q.plates; xs.push(L.B[0]);
    }));
    const body = `M${f1(Math.min(...xs))} ${f1(ay + J.l * s)}L${f1(Math.max(...xs))} ${f1(ay + J.l * s)}`;
    return { bars, plates, body };
  };
  const footPath = (ox, oy, s) => Array.from({ length: 121 }, (_, k) => {
    const G = jansen((k / 120) * TAU).G;
    return [ox + G[0] * s, oy - G[1] * s];
  });
  const FOOT_Y = 91.8;

  // ---------- Flame geometry ----------
  // A tongue: tip at the top, round base at by; sw bends the tip.
  const flameD = (cx, by, w, h, sw = 0) => {
    const tx = cx + sw * w * 0.3, ty = by - h, R = cx + w / 2, L = cx - w / 2;
    const n = v => f1(v);
    return `M${n(tx)} ${n(ty)}C${n(tx + w * 0.06)} ${n(ty + h * 0.3)} ${n(R + w * 0.02)} ${n(by - h * 0.56)} ${n(R)} ${n(by - h * 0.3)}` +
      `C${n(R)} ${n(by - h * 0.08)} ${n(cx + w * 0.3)} ${n(by)} ${n(cx)} ${n(by)}` +
      `C${n(cx - w * 0.3)} ${n(by)} ${n(L)} ${n(by - h * 0.08)} ${n(L)} ${n(by - h * 0.3)}` +
      `C${n(L)} ${n(by - h * 0.5)} ${n(tx - w * 0.28)} ${n(ty + h * 0.46)} ${n(tx)} ${n(ty)}Z`;
  };
  const SALTS = [
    { name: 'wood', stops: ['oklch(0.94 0.11 92)', 'oklch(0.8 0.18 62)', 'oklch(0.64 0.21 38)', 'oklch(0.5 0.2 27)'], core: ['oklch(0.99 0.03 95)', 'oklch(0.92 0.13 85)'] },
    { name: 'copper', stops: ['oklch(0.95 0.08 165)', 'oklch(0.84 0.19 150)', 'oklch(0.7 0.16 172)', 'oklch(0.56 0.12 195)'], core: ['oklch(0.99 0.03 165)', 'oklch(0.9 0.15 150)'] },
    { name: 'potassium', stops: ['oklch(0.9 0.07 320)', 'oklch(0.74 0.17 312)', 'oklch(0.6 0.21 302)', 'oklch(0.47 0.2 292)'], core: ['oklch(0.98 0.03 320)', 'oklch(0.86 0.11 315)'] },
    { name: 'sodium', stops: ['oklch(0.98 0.07 102)', 'oklch(0.91 0.17 96)', 'oklch(0.83 0.17 80)', 'oklch(0.7 0.16 62)'], core: ['oklch(0.99 0.03 100)', 'oklch(0.95 0.14 98)'] },
  ];
  const flameGrad = (svg, salt, y1, y2) => grad(svg, 'linearGradient', { gradientUnits: 'userSpaceOnUse', x1: 0, y1, x2: 0, y2 },
    salt.stops.map((c, k) => [k / 3, c]));
  const coreGrad = (svg, salt, y1, y2) => grad(svg, 'linearGradient', { gradientUnits: 'userSpaceOnUse', x1: 0, y1, x2: 0, y2 },
    [[0, salt.core[0]], [1, salt.core[1]]]);
  const IRON = ['oklch(0.36 0.012 260)', 'oklch(0.2 0.01 262)'];

  // A hover loop: play runs while hovered; rest returns to the finished pose.
  const loopToy = (play, rest) => ({ play, rest });
  const both = (...tls) => ({ kill: () => tls.forEach(t => t.kill()) });

  // =====================================================================
  const TOYS = [
    {
      id: 'chladni', name: 'Chladni plate', tint: 'oklch(0.55 0.14 75 / 0.55)', pick: 'A',
      dirs: [
        {
          letter: 'A', kind: 'Shaded object',
          idea: 'Real sand: 640 grains migrate to the next figure as the pointer tunes across the plate.',
          icon(svg) {
            const plate = grad(svg, 'linearGradient', { x1: 0, y1: 0, x2: 1, y2: 0 }, [
              [0, 'oklch(0.27 0.05 275)'], [0.28, 'oklch(0.44 0.07 50)'], [0.42, 'oklch(0.28 0.05 278)'],
              [0.7, 'oklch(0.3 0.05 270)'], [0.8, 'oklch(0.46 0.09 215)'], [1, 'oklch(0.26 0.05 275)']]);
            el('rect', { x: 9, y: 9, width: 110, height: 110, rx: 5, fill: plate }, svg);
            el('rect', { x: 9, y: 9, width: 110, height: 110, rx: 5, fill: 'url(#lit)', opacity: 0.6 }, svg);
            el('rect', { x: 9, y: 9, width: 110, height: 110, rx: 5, fill: 'none', stroke: 'url(#rim)', 'stroke-width': 1.5 }, svg);
            el('circle', { cx: 64, cy: 64, r: 3.2, fill: 'oklch(0.22 0.03 270)', stroke: 'oklch(0.55 0.03 270)', 'stroke-width': 1 }, svg);
            const sand = el('path', { fill: 'oklch(0.84 0.15 78)' }, svg);
            const at = (u, v) => [12 + u * 104, 12 + v * 104];
            const cur = grainSets[REST].map(([u, v]) => at(u, v));
            const draw = () => { let d = ''; for (const [x, y] of cur) d += `M${f1(x)} ${f1(y)}h1.5v1.5h-1.5z`; sand.setAttribute('d', d); };
            draw();
            const lag = grainSets[0].map((_, k) => (k * 7919 % 97) / 97 * 0.3);
            let idx = REST, from = null, to = null;
            const prox = { t: 0 };
            const migrate = k => {
              if (k === idx) return;
              idx = k; from = cur.map(p => p.slice()); to = grainSets[k].map(([u, v]) => at(u, v));
              prox.t = 0;
              gsap.to(prox, { t: 1, duration: 0.95, ease: 'none', overwrite: true, onUpdate() {
                for (let i = 0; i < cur.length; i++) {
                  const s = smooth(clamp((prox.t - lag[i]) / 0.7, 0, 1));
                  cur[i][0] = lerp(from[i][0], to[i][0], s); cur[i][1] = lerp(from[i][1], to[i][1], s);
                }
                draw();
              } });
            };
            const pick = p => migrate(clamp(Math.floor(((p[0] - 9) / 110) * MODES.length), 0, MODES.length - 1));
            return { enter: p => (p ? pick(p) : migrate(3)), move: p => p && pick(p), leave: () => migrate(REST) };
          },
          emblem() {
            // Bold grains along the nodal lines; no plate.
            const f = MODES[REST], r = rng(5), dots = [];
            let guard = 0;
            while (dots.length < 120 && guard++ < 200000) {
              const u = r(), v = r(), e = 1e-3;
              const gx = (f(u + e, v) - f(u - e, v)) / (2 * e), gy = (f(u, v + e) - f(u, v - e)) / (2 * e);
              if (Math.abs(f(u, v)) / (Math.hypot(gx, gy) + 1e-6) > 0.012) continue;
              const x = 12 + u * 104, y = 12 + v * 104;
              if (dots.every(([a, b]) => Math.hypot(a - x, b - y) > 7.4)) dots.push([x, y]);
            }
            return svgDoc(dots.map(([x, y]) => `  <circle cx="${f1(x)}" cy="${f1(y)}" r="2.9" fill="#fff"/>`).join('\n'));
          },
        },
        {
          letter: 'B', kind: 'Stencil cut-out',
          idea: 'Steel tile with the nodal figure cut through; on hover it hums from mode to mode.',
          icon(svg) {
            const c = clip(svg, 'rect', { x: 9, y: 9, width: 110, height: 110, rx: 6 });
            el('rect', { x: 9, y: 9, width: 110, height: 110, rx: 6, fill: grad(svg, 'linearGradient', { x1: 0, y1: 0, x2: 1, y2: 1 }, [[0, 'oklch(0.86 0.03 255)'], [1, 'oklch(0.6 0.05 270)']]) }, svg);
            const cut = el('path', { fill: 'none', style: 'stroke: var(--bg)', 'stroke-width': 3.4, 'stroke-linecap': 'round', 'clip-path': c.url }, svg);
            const SEQ = [1, 3, 2];
            const st = { p: 0 };
            const at = (u, v) => [9 + u * 110, 9 + v * 110];
            const draw = () => {
              const k = Math.floor(st.p) % 3, t = smooth(st.p - Math.floor(st.p));
              const A = MODES[SEQ[k]], B = MODES[SEQ[(k + 1) % 3]];
              cut.setAttribute('d', contour((u, v) => (1 - t) * A(u, v) + t * B(u, v), 44, at));
            };
            draw();
            return loopToy(
              () => gsap.timeline({ repeat: -1, onUpdate: draw })
                .to(st, { p: 1, duration: 1.1, ease: 'none' }, 0.5)
                .to(st, { p: 2, duration: 1.1, ease: 'none' }, '+=0.5')
                .to(st, { p: 3, duration: 1.1, ease: 'none' }, '+=0.5'),
              () => gsap.to(st, { p: st.p % 3 > 1.5 ? Math.ceil(st.p / 3) * 3 : Math.floor(st.p / 3) * 3, duration: 0.45, ease: 'power2.out', overwrite: true, onUpdate: draw, onComplete() { st.p = 0; draw(); } }),
            );
          },
          emblem() {
            const d = contour(MODES[REST], 64, (u, v) => [12 + u * 104, 12 + v * 104]);
            return svgDoc(`  <rect x="12" y="12" width="104" height="104" rx="6" fill="#fff"/>\n  <path d="${d}" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>`);
          },
        },
        {
          letter: 'C', kind: 'Single-weight line',
          idea: 'The plate on its post with the tuning rail; slide the pointer up and the sand redraws.',
          icon(svg) {
            const line = { fill: 'none', stroke: 'oklch(0.8 0.03 265)', 'stroke-width': 1.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
            // The plate in perspective: back edge short, front edge long.

        const wrap = h('div');
        const t = h('a', `toy s${size}`); t.tabIndex = 0; t.setAttribute('aria-label', `${toy.name} ${dir.letter}, ${size} pixels`);
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, t);
        const api = dir.icon(svg);
        wrap.append(t, h('div', 'size', `${size}`));
        icons.append(wrap);
        requestAnimationFrame(() => fitIcon(svg));
        wire(t, api);
      });
      card.append(icons);
      const svgText = dir.emblem();
      EMBLEMS[card.dataset.key] = svgText;
      const uri = `url("data:image/svg+xml;utf8,${encodeURIComponent(svgText)}")`;
      const embs = h('div', 'embs');
      embs.style.setProperty('--tint', toy.tint);
      ['flash', 'glass'].forEach(k => { const b = h('div', k); const m = h('i', 'em'); m.style.setProperty('--emblem', uri); b.append(m); embs.append(b); });
      card.append(embs, h('p', 'idea', dir.idea));
      dirs.append(card);
    });
    sec.append(dirs);
    rows.append(sec);
  });
  window.SPIKE_EMBLEMS = EMBLEMS;
})();
</script>
</body>
