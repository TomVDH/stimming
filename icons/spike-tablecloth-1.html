<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Tablecloth yank 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Tablecloth yank 1</h1>
<p class="lede">Tablecloth yank, round 1. No pick yet; A goes on the menu until Tom picks. A: a glass of red wine on a white cloth over the end of a walnut table; the cloth whips out and the glass rocks. D: the table top as an isometric walnut block under the cloth, the glass on top.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  const DIRS = [];

  // The toy's tokens: white satin, walnut, red wine, clear glass.
  const CLOTH = [[0, 'oklch(0.97 0.005 85)'], [1, 'oklch(0.84 0.012 80)']];
  const CLOTH_M = [[0, 'oklch(0.86 0.01 80)'], [1, 'oklch(0.72 0.014 75)']];
  const CLOTH_D = [[0, 'oklch(0.74 0.014 75)'], [1, 'oklch(0.6 0.016 70)']];
  const WOOD = [[0, 'oklch(0.48 0.08 50)'], [1, 'oklch(0.34 0.06 45)']];
  const WOOD_TOP = [[0, 'oklch(0.58 0.09 55)'], [1, 'oklch(0.46 0.08 50)']];
  const WOOD_D = [[0, 'oklch(0.3 0.05 45)'], [1, 'oklch(0.24 0.04 40)']];
  const WINE = [[0, 'oklch(0.5 0.19 20)'], [1, 'oklch(0.3 0.13 15)']];
  const GLASS = [[0, 'oklch(0.96 0.02 220)', 0.34], [1, 'oklch(0.82 0.03 220)', 0.12]];

  // A wine glass in its own frame: the foot's centre at the origin, up is -y.
  // A tulip: round at the base, widest low down, closing to the rim.
  const bowlR = (s, t) => (1.5 + 17 * Math.sin(Math.PI / 2 * Math.min(1, t / 0.42)) ** 0.7 * (1 - 0.24 * Math.max(0, (t - 0.42) / 0.58) ** 1.4)) * s;
  const bowlPath = s => {
    const pts = [];
    for (let i = 0; i <= 16; i++) {
      const t = i / 16, y = -22 - t * 40 * s;
      pts.push([bowlR(s, t), y]);
    }
    return 'M' + [...pts.map(([r, y]) => [-r, y]).reverse(), ...pts].map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  };
  // The wine: the bowl's lower part, with a level surface that tilts.
  const winePath = (s, lvl, tilt) => {
    const pts = [];
    for (let i = 0; i <= 8; i++) { const t = (i / 8) * lvl; pts.push([bowlR(s, t), -22 - t * 40 * s]); }
    const top = pts[pts.length - 1];
    return 'M' + [...pts.map(([r, y]) => [-r, y]).reverse(), ...pts].map(p => `${f(p[0])} ${f(p[1])}`).join('L') + `L${f(top[0])} ${f(top[1] - tilt)}L${f(-top[0])} ${f(top[1] + tilt)}Z`;
  };
  const glassG = (u, s, cls) => `<g class="${cls}">
      <ellipse cx="0" cy="0" rx="${f(13 * s)}" ry="${f(2.6 * s)}" fill="url(#${u}glass)"/>
      <path d="M${f(-1.6 * s)} ${f(-1)}L${f(-1.4 * s)} ${f(-22 * s)}L${f(1.4 * s)} ${f(-22 * s)}L${f(1.6 * s)} ${f(-1)}Z" fill="url(#${u}glass)"/>
      <path class="wine" d="${winePath(s, 0.42, 0)}" fill="url(#${u}wine)"/>
      ${body(bowlPath(s), u, 'glass')}
      <path d="M${f(-11 * s)} ${f(-48 * s)}Q${f(-13 * s)} ${f(-36 * s)} ${f(-9 * s)} ${f(-28 * s)}" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="${f(2.2 * s)}" stroke-linecap="round"/>
    </g>`;

  // The shared motion. st.k is the yank: 0 laid, 1 gone.
  // Enter whips the cloth out fast; leave lays it back slowly.
  const run = draw => {
    const st = { k: 0, live: false, last: 0, t: 0 };
    const step = time => {
      const dt = Math.min(0.1, time - (st.last || time));
      st.last = time;
      st.t += dt;
      st.k = st.live ? Math.min(1, st.k + dt * 2.6) : Math.max(0, st.k - dt * 1.3);
      draw(st);
      if (!st.live && st.k <= 0) { st.last = 0; draw(st); loop.stop(); }
      if (st.live && st.k >= 1 && st.t > 1.6) { st.last = 0; loop.stop(); }
    };
    const loop = clock(step);
    draw(st);
    return {
      enter() { st.live = true; st.t = 0; loop.start(); },
      move() {},
      leave() { st.live = false; loop.start(); },
    };
  };
  // The glass rocks after the cloth leaves, a damped wobble.
  const wobble = (k, t) => k > 0.55 ? 7 * Math.exp(-(t - 0.25) * 4) * Math.sin((t - 0.25) * 26) * (t > 0.25 ? 1 : 0) : 0;

  // An emblem fills the 128 box: its drawing box scales to 120 on the long side.
  const fitG = (box, inner) => {
    const k = 120 / Math.max(box[2], box[3]), tx = 64 - (box[0] + box[2] / 2) * k, ty = 64 - (box[1] + box[3] / 2) * k;
    return `<g transform="translate(${f(tx)} ${f(ty)}) scale(${f(k)})">${inner}</g>`;
  };

  /* ================= Current ================= */

  // Tablecloth yank is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // The end of a table seen from the side, a little above: a walnut slab on two legs.
  // A white cloth lies on it and hangs over the right end; a glass of wine stands on it.
  const TX0 = 6, TX1 = 104, TY = 78, TT = 9, TOPD = 7;
  const slabTop = poly([[TX0 + 6, TY - TOPD], [TX1 + 6, TY - TOPD], [TX1, TY], [TX0, TY]]);
  const slabFace = poly([[TX0, TY], [TX1, TY], [TX1, TY + TT], [TX0, TY + TT]]);
  const slabEnd = poly([[TX1, TY], [TX1 + 6, TY - TOPD], [TX1 + 6, TY + TT - TOPD], [TX1, TY + TT]]);
  const legs = poly([[TX0 + 6, TY + TT], [TX0 + 13, TY + TT], [TX0 + 12, 124], [TX0 + 7, 124]]) + poly([[TX1 - 13, TY + TT], [TX1 - 6, TY + TT], [TX1 - 7, 124], [TX1 - 12, 124]]);
  // The cloth for a yank of e: its left edge slides right; the hang grows and swings out.
  const clothA = e => {
    const x0 = TX0 - 2 + e * (TX1 - TX0 + 4), L = 30 + e * 70, sw = e * 0.9;
    const hx = TX1 + 8 + Math.sin(sw) * L, hy = TY - TOPD + Math.cos(sw) * L;
    const top = [[x0 + 6, TY - TOPD - 1], [TX1 + 7, TY - TOPD - 1]];
    const right = [[TX1 + 9, TY - TOPD + 4], [hx + 3, hy - 3], [hx - 2, hy + 2]];
    const hem = [[hx - 10, hy + 0.5], [hx - 16, hy + 3]];
    const back = [[TX1 - 1 + Math.sin(sw) * 18, TY + 16 - e * 4], [TX1 + 1, TY + 2]];
    const skirt = e < 0.96 ? [[TX1, TY + 12], [(x0 + TX1) / 2 + 8, TY + 14.5], [(x0 + TX1) / 2 - 8, TY + 12], [x0, TY + 14]] : [];
    return poly([...top, ...right, ...hem, ...back, ...skirt, [x0 - 1, TY - 1]]);
  };
  const clothFold = e => {
    const L = 30 + e * 70, sw = e * 0.9;
    const hx = TX1 + 8 + Math.sin(sw) * L, hy = TY - TOPD + Math.cos(sw) * L;
    return `M${f(TX1 + 6)} ${f(TY - 2)}Q${f(TX1 + 4 + Math.sin(sw) * 14)} ${f(TY + 10)} ${f(hx - 7)} ${f(hy - 1)}`;
  };
  const GA = [52, TY - 3.5], SA = 0.9;
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [4, 6, 120, 118],
    idea: 'A glass of red wine on a white cloth that lies over the end of a walnut table and hangs down its end. Point at it: the cloth whips out to the right and away, the glass rocks and the wine sloshes, and it stays standing on the bare wood. Leave, and the cloth slides back under it.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 3)}
          ${lg(`${u}cloth`, CLOTH, 'x1="0" y1="0" x2="0.3" y2="1"')}${lg(`${u}clothm`, CLOTH_M)}
          ${lg(`${u}wood`, WOOD)}${lg(`${u}woodt`, WOOD_TOP)}${lg(`${u}woodd`, WOOD_D)}
          ${lg(`${u}wine`, WINE)}${lg(`${u}glass`, GLASS, 'x1="0" y1="0" x2="1" y2="0.4"')}</defs>
        <ellipse cx="60" cy="123" rx="48" ry="4" fill="oklch(0.05 0.01 240)" opacity="0.55" filter="url(#${u}b)"/>
        <path d="${legs}" fill="url(#${u}woodd)"/>
        <path d="${slabEnd}" fill="url(#${u}woodd)"/>
        ${body(slabFace, u, 'wood')}
        ${body(slabTop, u, 'woodt')}
        <g class="cloth">
          <path class="cb" d="${clothA(0)}" fill="url(#${u}cloth)"/>
          <path class="cl" d="${clothA(0)}" fill="url(#${u}lit)"/>
          <path class="cf" d="${clothFold(0)}" fill="none" stroke="url(#${u}clothm)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
          <path class="cr" d="${clothA(0)}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
        </g>
        <g transform="translate(${GA[0]} ${GA[1]})"><g class="rock">${glassG(u, SA, 'gl')}</g></g>`;
      const cloth = svg.querySelector('.cloth'), parts = ['.cb', '.cl', '.cr'].map(s => svg.querySelector(s)), fold = svg.querySelector('.cf');
      const rock = svg.querySelector('.rock'), wine = svg.querySelector('.wine');
      return run(st => {
        const e = st.live ? 1 - (1 - st.k) ** 3 : st.k * st.k;
        const d = clothA(e);
        parts.forEach(p => p.setAttribute('d', d));
        fold.setAttribute('d', clothFold(e));
        cloth.setAttribute('opacity', f(clamp(1 - (e - 0.8) / 0.2)));
        const a = st.live ? wobble(st.k, st.t) : 0;
        // The glass rocks on the near edge of its foot.
        rock.setAttribute('transform', `rotate(${f(a)} ${a > 0 ? 13 : -13} 0) translate(${f(e * 2.5)} 0)`);
        wine.setAttribute('d', winePath(SA, 0.42, a * 0.6));
      });
    },
    // The emblem: the glass and the cloth white, the table dark grey, cuts between.
    emblem: (() => {
      const g = `<g transform="translate(${GA[0]} ${GA[1]})"><ellipse cx="0" cy="0" rx="${f(13 * SA + 2)}" ry="${f(2.6 * SA + 2)}" fill="#000"/><path d="${bowlPath(SA)}" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/><ellipse cx="0" cy="0" rx="${f(13 * SA)}" ry="${f(2.6 * SA)}" fill="#fff"/><path d="M${f(-1.6 * SA)} -1L${f(-1.4 * SA)} ${f(-22 * SA)}L${f(1.4 * SA)} ${f(-22 * SA)}L${f(1.6 * SA)} -1Z" fill="#fff"/><path d="${bowlPath(SA)}" fill="#fff"/><path d="${winePath(SA, 0.42, 0)}" fill="#8a8a8a"/></g>`;
      return `${EMB_HEAD}${fitG([4, 6, 120, 118], `<path d="${legs}" fill="#5a5a5a"/><path d="${slabEnd}" fill="#5a5a5a"/><path d="${slabFace}" fill="#5a5a5a"/><path d="${clothA(0)}" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/><path d="${clothA(0)}" fill="#fff"/><path d="${clothFold(0)}" fill="none" stroke="#a0a0a0" stroke-width="5" stroke-linecap="round"/>${g}`)}</svg>`;
    })(),
  });

  /* ================= D: Isometric block ================= */

  // The table top is the block: light top, mid left face, dark right face.
  // The cloth lies on the top and hangs a skirt down both faces; the glass stands on it.
  const CY = 82, GL = 40, GW = 26, GH = 12, SK = 13;
  const iso = (gx, gy, up = 0) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5 - up];
  const dTop = poly([iso(-GL, -GW, GH), iso(GL, -GW, GH), iso(GL, GW, GH), iso(-GL, GW, GH)]);
  const dLeft = poly([iso(-GL, GW, GH), iso(GL, GW, GH), iso(GL, GW, 0), iso(-GL, GW, 0)]);
  const dRight = poly([iso(GL, GW, GH), iso(GL, -GW, GH), iso(GL, -GW, 0), iso(GL, GW, 0)]);
  // The cloth slides along +gx for a yank of e; it drapes the faces it covers.
  const cTop = e => { const a = -GL - 2 + e * (2 * GL + 4); return poly([iso(a, -GW - 2, GH + 0.6), iso(GL + 2, -GW - 2, GH + 0.6), iso(GL + 2, GW + 2, GH + 0.6), iso(a, GW + 2, GH + 0.6)]); };
  const cLeft = e => {
    const a = -GL - 2 + e * (2 * GL + 4), m = (a + GL) / 2;
    return poly([iso(a, GW + 2, GH + 0.6), iso(GL + 2, GW + 2, GH + 0.6), iso(GL + 2, GW + 2, GH - SK), iso(m + 8, GW + 2, GH - SK - 2), iso(m - 6, GW + 2, GH - SK + 1), iso(a, GW + 2, GH - SK - 1)]);
  };
  const cRight = e => {
    const L = SK + e * 34, sw = e * 0.8;
    return poly([iso(GL + 2, GW + 2, GH + 0.6), iso(GL + 2, -GW - 2, GH + 0.6), iso(GL + 2 + Math.sin(sw) * L, -GW - 2, GH - Math.cos(sw) * L), iso(GL + 2 + Math.sin(sw) * L, -4, GH - Math.cos(sw) * L - 3), iso(GL + 2 + Math.sin(sw) * L, GW + 2, GH - Math.cos(sw) * L)]);
  };
  const GD = iso(-4, 2, GH + 0.6), SD = 0.8;
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [8, 8, 112, 112],
    idea: 'The table top as an isometric block of walnut: light top, mid left face, dark right face. A white cloth covers the top and hangs a skirt down both faces; a glass of red wine stands on it. Point at it: the cloth slides off past the right corner and away; the glass rocks and stays. Leave, and the cloth lays back.',
    art(svg, u) {
      const S = iso(GL, GW, -18), W = iso(-GL, GW, -18), E = iso(GL, -GW, -18);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 3)}
          ${lg(`${u}cloth`, CLOTH)}${lg(`${u}clothm`, CLOTH_M)}${lg(`${u}clothd`, CLOTH_D)}
          ${lg(`${u}top`, WOOD_TOP)}${lg(`${u}left`, WOOD)}${lg(`${u}right`, WOOD_D)}
          ${lg(`${u}wine`, WINE)}${lg(`${u}glass`, GLASS, 'x1="0" y1="0" x2="1" y2="0.4"')}</defs>
        <path d="${poly([W, S, E, [E[0], E[1] + 5], [S[0], S[1] + 5], [W[0], W[1] + 5]])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)"/>
        <path d="${poly([iso(-GL + 5, GW - 5, 0), iso(-GL + 5, GW - 5, -18), iso(-GL + 10, GW - 5, -18), iso(-GL + 10, GW - 5, 0)])}" fill="url(#${u}right)"/>
        <path d="${poly([iso(GL - 5, GW - 5, 0), iso(GL - 5, GW - 5, -18), iso(GL - 10, GW - 5, -18), iso(GL - 10, GW - 5, 0)])}" fill="url(#${u}right)"/>
        <path d="${poly([iso(GL - 5, -GW + 5, 0), iso(GL - 5, -GW + 5, -18), iso(GL - 5, -GW + 10, -18), iso(GL - 5, -GW + 10, 0)])}" fill="url(#${u}right)"/>
        <path d="${dRight}" fill="url(#${u}right)"/>
        <path d="${dLeft}" fill="url(#${u}left)"/>
        <path d="${dLeft}" fill="url(#${u}lit)"/>
        <path d="${dTop}" fill="url(#${u}top)"/>
        <path d="${dTop}" fill="url(#${u}lit)"/>
        <path d="M${poly([iso(-GL, GW, GH), iso(-GL, -GW, GH), iso(GL, -GW, GH)]).slice(1, -1)}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g class="cloth">
          <path class="cR" d="${cRight(0)}" fill="url(#${u}clothd)"/>
          <path class="cL" d="${cLeft(0)}" fill="url(#${u}clothm)"/>
          <path class="cT" d="${cTop(0)}" fill="url(#${u}cloth)"/>
          <path class="cTl" d="${cTop(0)}" fill="url(#${u}lit)"/>
          <path class="cTr" d="${cTop(0)}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
        </g>
        <g transform="translate(${f(GD[0])} ${f(GD[1])})"><g class="rock">${glassG(u, SD, 'gl')}</g></g>`;
      const q = s => svg.querySelector(s);
      const cloth = q('.cloth'), cR = q('.cR'), cL = q('.cL'), tops = [q('.cT'), q('.cTl'), q('.cTr')];
      const rock = q('.rock'), wine = q('.wine');
      return run(st => {
        const e = st.live ? 1 - (1 - st.k) ** 3 : st.k * st.k;
        const t = cTop(Math.min(e, 0.999));
        tops.forEach(p => p.setAttribute('d', t));
        cL.setAttribute('d', cLeft(Math.min(e, 0.999)));
        cR.setAttribute('d', cRight(e));
        cloth.setAttribute('opacity', f(clamp(1 - (e - 0.8) / 0.2)));
        const a = st.live ? wobble(st.k, st.t) : 0;
        rock.setAttribute('transform', `rotate(${f(a)} ${a > 0 ? 12 : -12} 0)`);
        wine.setAttribute('d', winePath(SD, 0.42, a * 0.6));
      });
    },
    emblem: (() => {
      const g = `<g transform="translate(${f(GD[0])} ${f(GD[1])})"><path d="${bowlPath(SD)}" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/><ellipse cx="0" cy="0" rx="${f(13 * SD + 2)}" ry="${f(2.6 * SD + 2)}" fill="#000"/><ellipse cx="0" cy="0" rx="${f(13 * SD)}" ry="${f(2.6 * SD)}" fill="#fff"/><path d="M${f(-1.6 * SD)} -1L${f(-1.4 * SD)} ${f(-22 * SD)}L${f(1.4 * SD)} ${f(-22 * SD)}L${f(1.6 * SD)} -1Z" fill="#fff"/><path d="${bowlPath(SD)}" fill="#fff"/><path d="${winePath(SD, 0.42, 0)}" fill="#8a8a8a"/></g>`;
      return `${EMB_HEAD}${fitG([8, 8, 112, 112], `<path d="${dRight}" fill="#3a3a3a"/><path d="${dLeft}" fill="#5a5a5a"/><path d="${cRight(0)}" fill="#b0b0b0"/><path d="${cLeft(0)}" fill="#d8d8d8"/><path d="${cTop(0)}" fill="#fff"/>${g}`)}</svg>`;
    })(),
  });

  /* ================= Gallery ================= */
  const NAME = 'Tablecloth yank';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-tablecloth';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `tablecloth-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems, and the A tile for the menu, for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    const A = DIRS.find(d => d.l === 'A'), svg = el('svg', { viewBox: '0 0 128 128', class: 'art', 'aria-hidden': 'true' });
    A.art(svg, 'tablecloth-');
    fitIcon(svg, A.box);
    pre.textContent = JSON.stringify({ emblems: window.EMBLEMS, menu: svg.outerHTML });
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
