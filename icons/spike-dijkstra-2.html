<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Dijkstra 2</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Dijkstra 2</h1>
<p class="lede">Dijkstra, round 2: a neat grid and a cityscape. Each shows at 256, 128 and 64. Move the pointer over a tile: light flows out along the streets, the path locks on the pointer, and the rest recedes.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  gsap.ticker.fps(60);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const set = (e, a) => { for (const k in a) e.setAttribute(k, a[k]); };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const SHADOW = 'oklch(0.07 0.01 265)';
  const lineD = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L');

  /* ================= The neat grid ================= */

  // Seven by seven junctions, evenly spaced; two merged blocks close their inner streets.
  // Row 2 is an avenue: light runs it faster.
  const N0 = 7, S0 = 13, O0 = 25, AVE = 2;
  const MERGED = [[1, 3, 3, 5], [4, 1, 6, 3]];
  const city = (() => {
    const X = [], Y = [], E = [];
    for (let j = 0; j < N0; j++) for (let i = 0; i < N0; i++) { X.push(O0 + i * S0); Y.push(O0 + j * S0); }
    const id = (i, j) => j * N0 + i;
    const inside = (i, j) => MERGED.some(([a, b, c, d]) => i > a && i < c && j > b && j < d);
    const cut = (i0, j0, i1, j1) => MERGED.some(([a, b, c, d]) => {
      const mi = (i0 + i1) / 2, mj = (j0 + j1) / 2;
      return mi > a && mi < c && mj > b && mj < d;
    });
    for (let j = 0; j < N0; j++) for (let i = 0; i < N0; i++) {
      if (i < N0 - 1 && !cut(i, j, i + 1, j)) E.push([id(i, j), id(i + 1, j), j === AVE ? 0.5 : 1]);
      if (j < N0 - 1 && !cut(i, j, i, j + 1)) E.push([id(i, j), id(i, j + 1), 1]);
    }
    const w = E.map(([a, b, m]) => Math.hypot(X[a] - X[b], Y[a] - Y[b]) * m);
    return { X, Y, E, w, N: X.length, inside };
  })();
  const run = s => {
    const { N, E, w } = city, d = new Array(N).fill(Infinity), par = new Array(N).fill(-1), done = new Array(N).fill(false);
    d[s] = 0;
    for (;;) {
      let u = -1;
      for (let i = 0; i < N; i++) if (!done[i] && d[i] < Infinity && (u < 0 || d[i] < d[u])) u = i;
      if (u < 0) break;
      done[u] = true;
      E.forEach(([a, b], k) => { const v = a === u ? b : b === u ? a : -1; if (v >= 0 && d[u] + w[k] < d[v]) { d[v] = d[u] + w[k]; par[v] = u; } });
    }
    return { d, par, max: Math.max(...d.filter(Number.isFinite)) };
  };
  const SRC = 42, TGT = 13;
  const near = (p, skip) => {
    let best = 0, bd = Infinity;
    city.X.forEach((x, i) => { const d = Math.hypot(x - p[0], city.Y[i] - p[1]); if (i !== skip && d < bd) { bd = d; best = i; } });
    return best;
  };
  const pathOf = (g, t) => { const a = []; for (let v = t; v >= 0; v = g.par[v]) a.unshift(v); return a; };
  // Heat: sodium near the source, rust far away; white is the path's.
  const heat = t => `oklch(${f(0.86 - 0.3 * t)} ${f(0.13 + 0.03 * t)} ${f(84 - 46 * t)})`;
  // Blocks between streets; merged blocks span their cells.
  const blocks = (inset) => {
    const out = [];
    for (let j = 0; j < N0 - 1; j++) for (let i = 0; i < N0 - 1; i++) {
      if (MERGED.some(([a, b, c, d]) => i >= a && i < c && j >= b && j < d)) continue;
      out.push([O0 + i * S0 + inset, O0 + j * S0 + inset, O0 + (i + 1) * S0 - inset, O0 + (j + 1) * S0 - inset, i, j]);
    }
    MERGED.forEach(([a, b, c, d]) => out.push([O0 + a * S0 + inset, O0 + b * S0 + inset, O0 + c * S0 - inset, O0 + d * S0 - inset, a, b, true]));
    return out;
  };

  /* ================= The flow ================= */

  // The wave clock W lights each street from its nearer end; a soft tip leads each front.
  // At the lock the path flashes on and the rest recedes, as in the toy.
  const flow = (svg, o) => {
    const { proj = p => p, cold, litW, pathW, tipR, src, tgt, dimTo = 0.22 } = o;
    const P = i => proj([city.X[i], city.Y[i]]);
    const gc = el('g', {}, svg), gl = el('g', {}, svg), gt = el('g', {}, svg), gp = el('g', {}, svg), gn = el('g', {}, svg);
    city.E.forEach(([a, b]) => { const A = P(a), B = P(b); el('line', { x1: f(A[0]), y1: f(A[1]), x2: f(B[0]), y2: f(B[1]), ...cold }, gc); });
    const litL = city.E.map(() => el('line', { 'stroke-width': litW, 'stroke-linecap': 'round' }, gl));
    const tips = city.E.map(() => el('circle', { r: tipR, fill: 'oklch(0.98 0.04 90)' }, gt));
    const pl = el('polyline', { fill: 'none', stroke: '#fff', 'stroke-width': pathW, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': 1 }, gp);
    const sM = src(gn), tM = tgt(gn);
    let g = run(SRC), s = SRC, t = TGT;
    const st = { W: 0, dim: 0, draw: 1 };
    const draw = () => {
      const W = st.W;
      city.E.forEach(([a, b], k) => {
        const [n0, n1] = g.d[a] <= g.d[b] ? [a, b] : [b, a];
        const fr = clamp((W - g.d[n0]) / city.w[k], 0, 1), L = litL[k], T = tips[k];
        if (!(fr > 0)) { L.setAttribute('display', 'none'); T.setAttribute('display', 'none'); return; }
        const A = P(n0), B = P(n1), q = [lerp(A[0], B[0], fr), lerp(A[1], B[1], fr)];
        set(L, { display: '', x1: f(A[0]), y1: f(A[1]), x2: f(q[0]), y2: f(q[1]), stroke: heat(g.d[n0] / g.max) });
        // The tip glows only while the light is still running down the street.
        if (fr < 1) set(T, { display: '', cx: f(q[0]), cy: f(q[1]), opacity: f(0.5 + 0.5 * Math.sin(fr * Math.PI)) });
        else T.setAttribute('display', 'none');
      });
      gl.setAttribute('opacity', f(1 - (1 - dimTo) * st.dim));
      const locked = W >= g.d[t];
      pl.setAttribute('display', locked ? '' : 'none');
      if (locked) set(pl, { points: pathOf(g, t).map(i => P(i).map(f).join(',')).join(' '), 'stroke-dashoffset': f(1 - st.draw) });
      sM(P(s)); tM(P(t), locked);
    };
    let tl = null;
    // One run: the flood flows out, the path draws on, then the rest recedes.
    const play = () => {
      tl?.kill();
      st.W = 0; st.dim = 0; st.draw = 0;
      const lockAt = g.d[t] / (g.max * 1.05) * 1.3;
      tl = gsap.timeline({ onUpdate: draw })
        .to(st, { W: g.max * 1.05, duration: 1.3, ease: 'none' }, 0)
        .to(st, { draw: 1, duration: 0.3, ease: 'power2.out' }, lockAt)
        .to(st, { dim: 1, duration: 0.9, ease: 'sine.inOut' }, lockAt + 0.35);
    };
    // Rest: the flood finished, the path on, nothing receded.
    const rest = () => { tl?.kill(); g = run(SRC); s = SRC; t = TGT; gsap.to(st, { W: g.max * 1.05, dim: 0, draw: 1, duration: 0.6, ease: 'power2.out', onUpdate: draw }); };
    st.W = g.max * 1.05; draw();
    let demo = null;
    return {
      enter(p) {
        if (!p) { demo?.kill(); play(); demo = gsap.timeline({ repeat: -1, repeatDelay: 2.6 }).call(() => { t = Math.floor(Math.random() * city.N); if (t === s || !Number.isFinite(g.d[t])) t = TGT; play(); }); return; }
        t = near(p, s); play();
      },
      // A new destination re-routes at once; the path draws on again.
      move(p) { if (!p) return; const n = near(p, s); if (n === t || !Number.isFinite(g.d[n])) return; t = n; if (st.W >= g.d[t]) gsap.fromTo(st, { draw: 0 }, { draw: 1, duration: 0.22, ease: 'power2.out', onUpdate: draw }); draw(); },
      leave() { demo?.kill(); demo = null; rest(); },
    };
  };
  const pinDot = (fill, r) => gn => { const c = el('rect', { width: r * 2, height: r * 2, fill }, gn); return p => set(c, { x: f(p[0] - r), y: f(p[1] - r) }); };
  const pinRing = (r, sw) => gn => { const c = el('rect', { width: r * 2, height: r * 2, fill: 'none', 'stroke-width': sw }, gn); return (p, lit) => set(c, { x: f(p[0] - r), y: f(p[1] - r), stroke: lit ? '#fff' : 'oklch(0.62 0.02 270)' }); };
  const rad = (defs, id, cx, cy, r, stops) => { const g = el('radialGradient', { id, cx, cy, r }, defs); stops.forEach(([o, c, a = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g)); };
  const glowF = (defs, id, sd) => { const g = el('filter', { id, x: -0.5, y: -0.5, width: 2, height: 2 }, defs); el('feGaussianBlur', { stdDeviation: sd, result: 'b' }, g); const m = el('feMerge', {}, g); el('feMergeNode', { in: 'b' }, m); el('feMergeNode', { in: 'SourceGraphic' }, m); };
  const tile = (svg, fill, rx = 6) => { el('rect', { x: 20, y: 20, width: 100, height: 100, rx, fill: SHADOW }, svg); el('rect', { x: 14, y: 14, width: 100, height: 100, rx, fill }, svg); };
  const edgesD = (proj = p => p) => city.E.map(([a, b]) => lineD([proj([city.X[a], city.Y[a]]), proj([city.X[b], city.Y[b]])])).join('');
  const defPath = (proj = p => p) => lineD(pathOf(run(SRC), TGT).map(i => proj([city.X[i], city.Y[i]])));
  const iso = ([x, y], h = 0) => [64 + (x - y) * 0.62, 66 + (x + y - 128) * 0.36 - h];

  /* ================= Directions ================= */

  const DIRS = [
    {
      l: 'A', name: 'Neat grid',
      idea: 'A clean street grid on a night tile. Light flows out along every street with a soft tip; the path draws on to the pointer and the rest recedes.',
      art(svg, id) {
        const defs = el('defs', {}, svg);
        glowF(defs, `${id}g`, 1.1);
        tile(svg, 'oklch(0.13 0.018 275)');
        const lg = el('g', { filter: `url(#${id}g)` }, svg);
        return flow(lg, {
          cold: { stroke: 'oklch(0.27 0.02 270)', 'stroke-width': 1.4, 'stroke-linecap': 'square' }, litW: 1.8, pathW: 2.6, tipR: 1.6,
          src: pinDot('#fff', 3.2), tgt: pinRing(4.6, 1.5),
        });
      },
      emblem: () => `${EMB_HEAD}
  <path d="${edgesD()}" stroke="#6e6e6e" stroke-width="2.4" stroke-linecap="square" fill="none"/>
  <path d="${defPath()}" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  <rect x="${city.X[SRC] - 6}" y="${city.Y[SRC] - 6}" width="12" height="12" fill="#fff"/>
</svg>
`,
    },
    {
      l: 'B', name: 'Cityscape',
      idea: 'The same grid as a small night city: neat towers on every block, two plazas. Light flows down the streets between them; the route glows white.',
      box: [10, 28, 108, 82],
      art(svg, id) {
        const defs = el('defs', {}, svg);
        glowF(defs, `${id}g`, 1);
        const T = 7, cs = [[18, 18], [110, 18], [110, 110], [18, 110]].map(p => iso(p)), dn = p => [p[0], p[1] + T];
        el('path', { d: lineD([cs[1], cs[2], cs[3], dn(cs[3]), dn(cs[2]), dn(cs[1])]) + 'Z', fill: SHADOW, transform: 'translate(4 4)' }, svg);
        el('path', { d: lineD([cs[3], cs[2], dn(cs[2]), dn(cs[3])]) + 'Z', fill: 'oklch(0.21 0.02 268)' }, svg);
        el('path', { d: lineD([cs[2], cs[1], dn(cs[1]), dn(cs[2])]) + 'Z', fill: 'oklch(0.15 0.016 270)' }, svg);
        el('path', { d: lineD(cs) + 'Z', fill: 'oklch(0.12 0.016 272)' }, svg);
        const lg = el('g', { filter: `url(#${id}g)` }, svg);
        const c = flow(lg, {
          proj: p => iso(p), cold: { stroke: 'oklch(0.27 0.02 270)', 'stroke-width': 1.2 }, litW: 1.8, pathW: 2.4, tipR: 1.4,
          src: pinDot('#fff', 2.6), tgt: pinRing(3.8, 1.3),
        });
        // Towers in neat steps, painted back to front; plazas stay low and green.
        const bg = el('g', {}, svg);
        blocks(3.2).sort((a, b) => (a[4] + a[5]) - (b[4] + b[5])).forEach(([x0, y0, x1, y1, i, j, big]) => {
          const h = big ? 1.2 : [2.5, 4.5, 6.5, 3.5, 5.5][(i * 3 + j * 2) % 5];
          const q = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], top = q.map(p => iso(p, h)), base = q.map(p => iso(p));
          const C = big ? ['oklch(0.24 0.04 150)', 'oklch(0.19 0.03 150)', 'oklch(0.3 0.05 150)'] : ['oklch(0.26 0.014 268)', 'oklch(0.18 0.014 270)', 'oklch(0.36 0.012 265)'];
          el('path', { d: lineD([base[3], base[2], top[2], top[3]]) + 'Z', fill: C[0] }, bg);
          el('path', { d: lineD([base[2], base[1], top[1], top[2]]) + 'Z', fill: C[1] }, bg);
          el('path', { d: lineD(top) + 'Z', fill: C[2] }, bg);
        });
        return c;
      },
      emblem: () => {
        let tops = '';
        blocks(3.2).forEach(([x0, y0, x1, y1, i, j, big]) => { const h = big ? 1.2 : [2.5, 4.5, 6.5, 3.5, 5.5][(i * 3 + j * 2) % 5]; tops += lineD([[x0, y0], [x1, y0], [x1, y1], [x0, y1]].map(p => iso(p, h))) + 'Z'; });
        return `${EMB_HEAD}
  <path d="${tops}" fill="#7a7a7a"/>
  <path d="${defPath(p => iso(p))}" stroke="#fff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
</svg>
`;
      },
    },
    {
      l: 'C', name: 'City blocks',
      idea: 'Seen from above: dark roofs fill the tile and the streets are the gaps between them. Light flows through the gaps and spills onto the roof edges.',
      art(svg, id) {
        const defs = el('defs', {}, svg);
        glowF(defs, `${id}g`, 1.6);
        tile(svg, 'oklch(0.1 0.014 275)');
        const lg = el('g', { filter: `url(#${id}g)` }, svg);
        const c = flow(lg, {
          cold: { stroke: 'oklch(0.18 0.016 270)', 'stroke-width': 2.4, 'stroke-linecap': 'square' }, litW: 2.6, pathW: 3, tipR: 2,
          src: pinDot('#fff', 3.4), tgt: pinRing(5, 1.6),
        });
        // Roofs sit over the glow, so light shows only in the gaps and at the edges.
        blocks(2.4).forEach(([x0, y0, x1, y1, , , big]) => {
          el('rect', { x: f(x0), y: f(y0), width: f(x1 - x0), height: f(y1 - y0), rx: 0.6, fill: big ? 'oklch(0.2 0.03 150)' : 'oklch(0.2 0.012 268)' }, svg);
          el('rect', { x: f(x0), y: f(y0), width: f(x1 - x0), height: 1, fill: big ? 'oklch(0.26 0.04 150)' : 'oklch(0.28 0.012 265)' }, svg);
        });
        return c;
      },
      emblem: () => {
        let r = '';
        blocks(2.4).forEach(([x0, y0, x1, y1]) => { r += `<rect x="${f(x0)}" y="${f(y0)}" width="${f(x1 - x0)}" height="${f(y1 - y0)}" fill="#6a6a6a"/>`; });
        return `${EMB_HEAD}
  ${r}
  <path d="${defPath()}" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="square" fill="none"/>
</svg>
`;
      },
    },
  ];

  /* ================= Gallery ================= */

  const NAME = 'Dijkstra';
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : { x: 14, y: 14, width: 100, height: 100 }, side = Math.max(b.width, b.height);
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-dijkstra';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `dijkstra2-${D.l.toLowerCase()}`;
    const url = `spike/emblems/${file}.svg`;
    window.EMBLEMS[file] = D.emblem();
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header><b>${D.l}</b><span>· ${D.name}</span></header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      <div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>
      <p class="idea">${D.idea}</p>`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
