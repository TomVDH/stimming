<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 22</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<h1>Icon spike 22</h1>
<p class="lede">Smoke ring cannon: the current icon and five directions. Slide the pointer across: the ring moves through the laser sheet, and the slice glows where they meet.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  // A pointer control from three plain functions; focus plays a demo.
  const ctl = (aim, rest, demo, start = () => {}) => {
    let tl = null;
    return {
      enter(p) { start(); if (p) aim(p); else tl = demo(); },
      move(p) { if (p && !tl) aim(p); },
      leave() { tl?.kill(); tl = null; rest(); },
    };
  };
  // A repeat that runs while the pointer stays.
  const every = (dt, fn) => {
    let dc = null;
    const go = () => { fn(); dc = gsap.delayedCall(dt, go); };
    return { start() { if (!dc) go(); }, stop() { dc?.kill(); dc = null; } };
  };

  /* ================= Smoke ring cannon kit ================= */

  // The hero frame: a smoke torus crossing the laser sheet.
  // The pointer slides the ring along its axis through the sheet; the slice glows where they meet.
  const SHADOW = 'oklch(0.07 0.01 265)', GREEN = 'oklch(0.88 0.27 142)', SMOKE = 'oklch(0.9 0.02 245)';
  const R = 23, A = 8.5;
  // A three-quarter view: yaw about the vertical, a touch of pitch.
  const YAW = 0.62, CY = Math.cos(YAW), SY = Math.sin(YAW);
  const proj = (x, y, z, c = [64, 60]) => [c[0] + x * CY - z * SY, c[1] - y, x * SY + z * CY];
  // A seeded torus cloud; its core is a rolled sheet, as in the toy.
  const cloud = (n, seed) => {
    let s = seed;
    const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const phi = rnd() * TAU, turn = rnd(), psi = turn * TAU * 2, rho = A * (0.25 + 0.75 * turn) + (rnd() - 0.5) * 1.6;
      pts.push({ lx: rho * Math.sin(psi), r: R + rho * Math.cos(psi), phi, b: 0.55 + 0.45 * rnd() });
    }
    return pts;
  };
  // The slice of a torus by the plane at axial offset u: two circles, or none.
  const slice = u => (Math.abs(u) < A ? [R - Math.sqrt(A * A - u * u), R + Math.sqrt(A * A - u * u)] : []);
  // Pointer x is the ring's place along its axis; the sheet stands at 0.
  const scrub = p => clamp((p[0] - 64) / 38, -1, 1) * (A + 7);
  // A control: aim from the pointer, a sweep demo on focus, ease back to the slice at rest.
  const scrubCtl = update => {
    const st = { u: 0 };
    const draw = () => update(st.u);
    draw();
    return ctl(
      p => gsap.to(st, { u: scrub(p), duration: 0.35, ease: 'power2.out', overwrite: 'auto', onUpdate: draw }),
      () => gsap.to(st, { u: 0, duration: 0.8, ease: 'power3.out', overwrite: 'auto', onUpdate: draw }),
      () => gsap.fromTo(st, { u: -(A + 7) }, { u: A + 7, duration: 1.8, ease: 'sine.inOut', yoyo: true, repeat: -1, onUpdate: draw }),
    );
  };
  // The sheet's fan, seen at the view angle: apex above, base on the floor.
  const fanPath = (half = 30, top = 70, floor = -44, c) => {
    const ap = proj(0, top, 0, c), b0 = proj(0, floor, -half, c), b1 = proj(0, floor, half, c);
    return `M${f(ap[0])} ${f(ap[1])}L${f(b0[0])} ${f(b0[1])}L${f(b1[0])} ${f(b1[1])}Z`;
  };
  const lineD = (a, b) => `M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}`;
  // A circle of radius r in the plane x = x0, as a projected path.
  const ringPath = (x0, r, c, n = 40) => {
    let d = '';
    for (let i = 0; i <= n; i++) { const t = (i / n) * TAU, q = proj(x0, r * Math.cos(t), r * Math.sin(t), c); d += `${i ? 'L' : 'M'}${f(q[0])} ${f(q[1])}`; }
    return d + 'Z';
  };
  const lin = (defs, id, x2, y2, stops) => { const g = el('linearGradient', { id, x1: 0, y1: 0, x2, y2 }, defs); stops.forEach(([o, c, a = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g)); };
  const glowF = (defs, id, sd = 1.6) => {
    const g = el('filter', { id, x: -0.5, y: -0.5, width: 2, height: 2 }, defs);
    el('feGaussianBlur', { stdDeviation: sd, result: 'b' }, g);
    const m = el('feMerge', {}, g);
    el('feMergeNode', { in: 'b' }, m);
    el('feMergeNode', { in: 'SourceGraphic' }, m);
  };
  // The menu tile: a hard shadow and a rounded face.
  const face = (svg, fill, rx = 7) => {
    el('rect', { x: 20, y: 20, width: 100, height: 100, rx, fill: SHADOW }, svg);
    return el('rect', { x: 14, y: 14, width: 100, height: 100, rx, fill }, svg);
  };
  const clipFace = (defs, id, rx = 7) => { const c = el('clipPath', { id }, defs); el('rect', { x: 14, y: 14, width: 100, height: 100, rx }, c); return `url(#${id})`; };

  const DIRS = [
    {
      toy: 'vortex', l: 'Current', name: 'Ring and blade',
      // The menu icon today.
      art(svg) {
        el('rect', { x: 22, y: 22, width: 92, height: 92, fill: SHADOW }, svg);
        el('rect', { x: 16, y: 16, width: 92, height: 92, fill: 'oklch(0.15 0.012 265)' }, svg);
        el('path', { d: 'M64 16H69L78 108H55Z', fill: 'oklch(0.72 0.2 142)', opacity: 0.22 }, svg);
        el('path', { d: 'M65.6 16H67.4L67.6 108H65.4Z', fill: GREEN, opacity: 0.7 }, svg);
        el('ellipse', { cx: 66, cy: 62, rx: 5, ry: 12, fill: 'none', stroke: 'oklch(0.92 0.25 142)', 'stroke-width': 3.8 }, svg);
        return ctl(() => {}, () => {}, () => null);
      },
    },
    {
      toy: 'vortex', l: 'A', name: 'Shaded object',
      // A fat smoke torus, lit from behind, crosses the green fan; the slice burns bright where they meet.
      // Turbulence frays its edge; while the pointer stays, the smoke churns.
      art(svg, id) {
        const defs = el('defs', {}, svg);
        const room = el('radialGradient', { id: `${id}r`, cx: 0.3, cy: 0.15, r: 1 }, defs);
        [[0, 'oklch(0.32 0.02 250)'], [0.5, 'oklch(0.16 0.014 262)'], [1, 'oklch(0.09 0.012 268)']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, room));
        lin(defs, `${id}f`, 0, 1, [[0, 'oklch(0.92 0.24 142)', 0.85], [0.5, 'oklch(0.7 0.2 142)', 0.3], [1, 'oklch(0.5 0.15 142)', 0.05]]);
        lin(defs, `${id}t`, 0.3, 1, [[0, 'oklch(0.98 0.01 240)'], [0.45, 'oklch(0.8 0.02 245)'], [1, 'oklch(0.42 0.02 255)']]);
        lin(defs, `${id}lit`, 1, 1, [[0, '#fff', 0.14], [0.5, '#fff', 0], [1, '#000', 0.25]]);
        // Smoke: fractal noise displaces the edge, then a soft blur.
        const sm = el('filter', { id: `${id}s`, x: -0.3, y: -0.3, width: 1.6, height: 1.6 }, defs);
        const turb = el('feTurbulence', { type: 'fractalNoise', baseFrequency: 0.07, numOctaves: 3, seed: 3, result: 'n' }, sm);
        const off = el('feOffset', { in: 'n', dx: 0, dy: 0, result: 'm' }, sm);
        el('feDisplacementMap', { in: 'SourceGraphic', in2: 'm', scale: 7, xChannelSelector: 'R', yChannelSelector: 'G', result: 'd' }, sm);
        el('feGaussianBlur', { in: 'd', stdDeviation: 0.7 }, sm);
        glowF(defs, `${id}g`, 1.8);
        face(svg, `url(#${id}r)`);
        const inner = el('g', { 'clip-path': clipFace(defs, `${id}c`) }, svg);
        const ringG = el('g', {}, inner);
        // The tube: a dark under-stroke for its shadow side, the lit stroke over it.
        const under = el('ellipse', { rx: 19, ry: 30, fill: 'none', stroke: 'oklch(0.3 0.02 258)', 'stroke-width': 17, filter: `url(#${id}s)` }, ringG);
        const tube = el('ellipse', { rx: 19, ry: 30, fill: 'none', stroke: `url(#${id}t)`, 'stroke-width': 13, filter: `url(#${id}s)`, transform: 'translate(-1.5 -1.5)' }, ringG);
        el('path', { d: 'M62 2L80 2L96 126L46 126Z', fill: `url(#${id}f)` }, inner);
        el('path', { d: 'M38 112L98 100', stroke: GREEN, 'stroke-width': 2, 'stroke-linecap': 'round', opacity: 0.8 }, inner);
        const sl = [0, 1].map(() => el('ellipse', { fill: 'none', stroke: GREEN, 'stroke-width': 2.4, filter: `url(#${id}g)` }, inner));
        el('rect', { x: 14, y: 14, width: 100, height: 100, rx: 7, fill: `url(#${id}lit)` }, svg);
        el('rect', { x: 14.5, y: 14.5, width: 99, height: 99, rx: 6.5, fill: 'none', stroke: 'oklch(0.38 0.03 255)', 'stroke-width': 1 }, svg);
        // The ring's centre slides along its axis; the slice sits fixed in the sheet at x 70.
        let churn = null;
        const c = scrubCtl(u => {
          const k = 1 + u * 0.012;
          ringG.setAttribute('transform', `translate(${f(70 + u * 1.5)} ${f(60 - u * 0.25)}) scale(${f(k)})`);
          const s = slice(u);
          sl.forEach((e, i) => {
            if (!s.length) { e.setAttribute('opacity', 0); return; }
            const r = s[i] * (30 / R);
            e.setAttribute('cx', 70); e.setAttribute('cy', 60);
            e.setAttribute('rx', f(r * 19 / 30)); e.setAttribute('ry', f(r));
            e.setAttribute('opacity', f(1 - Math.abs(u) / A * 0.6));
          });
        });
        return {
          enter(p) { c.enter(p); if (!churn) { const o = { v: 0 }; churn = gsap.to(o, { v: 60, duration: 6, repeat: -1, ease: 'none', onUpdate: () => off.setAttribute('dx', f(o.v)) }); } },
          move: c.move,
          leave() { c.leave(); churn?.kill(); churn = null; },
        };
      },
    },
    {
      toy: 'vortex', l: 'B', name: 'Stencil cut-out',
      // Two tones: a pale smoke ring with a frayed edge on the green fan; the slice cuts it in dark green.
      art(svg, id) {
        const defs = el('defs', {}, svg);
        const sm = el('filter', { id: `${id}s`, x: -0.3, y: -0.3, width: 1.6, height: 1.6 }, defs);
        el('feTurbulence', { type: 'fractalNoise', baseFrequency: 0.09, numOctaves: 2, seed: 8, result: 'n' }, sm);
        el('feDisplacementMap', { in: 'SourceGraphic', in2: 'n', scale: 6, xChannelSelector: 'R', yChannelSelector: 'G' }, sm);
        face(svg, 'oklch(0.2 0.03 265)', 4);
        const inner = el('g', { 'clip-path': clipFace(defs, `${id}c`, 4) }, svg);
        el('path', { d: 'M60 0L82 0L102 128L40 128Z', fill: 'oklch(0.72 0.21 142)' }, inner);
        const ringG = el('g', {}, inner);
        el('ellipse', { rx: 19, ry: 30, fill: 'none', stroke: 'oklch(0.95 0.02 245)', 'stroke-width': 14, filter: `url(#${id}s)` }, ringG);
        const sl = [0, 1].map(() => el('ellipse', { fill: 'none', stroke: 'oklch(0.3 0.12 150)', 'stroke-width': 3.2 }, inner));
        return scrubCtl(u => {
          ringG.setAttribute('transform', `translate(${f(70 + u * 1.5)} ${f(60 - u * 0.25)})`);
          const s = slice(u);
          sl.forEach((e, i) => {
            if (!s.length) { e.setAttribute('opacity', 0); return; }
            const r = s[i] * (30 / R);
            e.setAttribute('cx', 70); e.setAttribute('cy', 60); e.setAttribute('rx', f(r * 19 / 30)); e.setAttribute('ry', f(r)); e.setAttribute('opacity', 1);
          });
        });
      },
    },
    {
      toy: 'vortex', l: 'C', name: 'Single-weight line',
      // One line weight: the ring as five stacked contours, like its rolled-up sheet; the slice in green.
      art(svg, id) {
        const defs = el('defs', {}, svg);
        face(svg, 'oklch(0.16 0.02 265)');
        const inner = el('g', { 'clip-path': clipFace(defs, `${id}c`) }, svg);
        const ink = { fill: 'none', stroke: 'oklch(0.93 0.02 245)', 'stroke-width': 1.7 };
        el('path', { d: 'M71 6L58 122M71 6L84 122', ...ink, stroke: GREEN, opacity: 0.75 }, inner);
        const ringG = el('g', {}, inner);
        // Contours step inward and outward from the core, so the ring reads as layered smoke.
        [-1, -0.5, 0, 0.5, 1].forEach(k => el('ellipse', { rx: f(19 + k * 6), ry: f(30 + k * 6), ...ink, opacity: f(1 - Math.abs(k) * 0.45) }, ringG));
        const sl = [0, 1].map(() => el('ellipse', { ...ink, stroke: GREEN, 'stroke-width': 2.4 }, inner));
        return scrubCtl(u => {
          ringG.setAttribute('transform', `translate(${f(70 + u * 1.5)} ${f(60 - u * 0.25)})`);
          const s = slice(u);
          sl.forEach((e, i) => {
            if (!s.length) { e.setAttribute('opacity', 0); return; }
            const r = s[i] * (30 / R);
            e.setAttribute('cx', 70); e.setAttribute('cy', 60); e.setAttribute('rx', f(r * 19 / 30)); e.setAttribute('ry', f(r)); e.setAttribute('opacity', 1);
          });
        });
      },
    },
    {
      toy: 'vortex', l: 'D', name: 'Isometric block',
      // The room as an isometric block; the sheet stands in it; the motes glow where it cuts the ring.
      art(svg, id) {
        const iso = (x, y, z) => [64 + (x - z) * 0.87, 70 + (x + z) * 0.5 - y];
        const P = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
        const B = 38, F = -26;
        const defs = el('defs', {}, svg);
        glowF(defs, `${id}g`, 1.2);
        el('path', { d: P([iso(-B, F, B), iso(B, F, B), iso(B, F, -B), iso(B, F - 14, -B), iso(B, F - 14, B), iso(-B, F - 14, B)].map(p => [p[0] + 5, p[1] + 5])), fill: SHADOW }, svg);
        el('path', { d: P([iso(-B, F, B), iso(B, F, B), iso(B, F - 14, B), iso(-B, F - 14, B)]), fill: 'oklch(0.24 0.016 262)' }, svg);
        el('path', { d: P([iso(B, F, B), iso(B, F, -B), iso(B, F - 14, -B), iso(B, F - 14, B)]), fill: 'oklch(0.17 0.014 265)' }, svg);
        el('path', { d: P([iso(-B, F, -B), iso(B, F, -B), iso(B, F, B), iso(-B, F, B)]), fill: 'oklch(0.3 0.02 255)' }, svg);
        // The sheet: a green slab standing across the block at x = 0.
        el('path', { d: P([iso(0, F, -B), iso(0, F, B), iso(0, 44, B), iso(0, 44, -B)]), fill: 'oklch(0.75 0.2 142)', opacity: 0.18 }, svg);
        el('path', { d: lineD(iso(0, F, -B), iso(0, F, B)), stroke: GREEN, 'stroke-width': 2 }, svg);
        const pts = cloud(300, 11);
        const grey = el('g', {}, svg), lit = el('g', { filter: `url(#${id}g)` }, svg);
        const dots = pts.map(() => [el('circle', { r: 0.95, fill: SMOKE }, grey), el('circle', { r: 1.05, fill: GREEN }, lit)]);
        return scrubCtl(u => pts.forEach((q, i) => {
          const x = q.lx + u, p = iso(x, 12 + q.r * Math.cos(q.phi), q.r * Math.sin(q.phi)), s = Math.exp(-(x * x) / 1.2);
          for (const c of dots[i]) { c.setAttribute('cx', f(p[0])); c.setAttribute('cy', f(p[1])); }
          dots[i][0].setAttribute('opacity', f(q.b * 0.7 * (1 - 0.8 * s)));
          dots[i][1].setAttribute('opacity', f(s));
        }));
      },
    },
    {
      toy: 'vortex', l: 'E', name: 'Abstract mark',
      // A bold pale ring and one thin laser line; where the line cuts the ring, it burns green.
      art(svg, id) {
        const defs = el('defs', {}, svg);
        glowF(defs, `${id}g`, 2);
        face(svg, 'oklch(0.14 0.015 265)', 3);
        const inner = el('g', { 'clip-path': clipFace(defs, `${id}c`, 3) }, svg);
        el('rect', { x: 66, y: 14, width: 3, height: 100, fill: GREEN, opacity: 0.85 }, inner);
        const ring = el('path', { fill: 'oklch(0.93 0.02 245)', 'fill-rule': 'evenodd' }, inner);
        const bc = el('clipPath', { id: `${id}b` }, defs);
        el('rect', { x: 62, y: 14, width: 11, height: 100 }, bc);
        const hot = el('path', { fill: GREEN, 'fill-rule': 'evenodd', 'clip-path': `url(#${id}b)`, filter: `url(#${id}g)` }, inner);
        const oval = (cx, cy, rx, ry) => { let d = ''; for (let i = 0; i <= 40; i++) { const t = (i / 40) * TAU; d += `${i ? 'L' : 'M'}${f(cx + rx * Math.cos(t))} ${f(cy + ry * Math.sin(t))}`; } return d + 'Z'; };
        return scrubCtl(u => {
          const cx = 67.5 + u * 2;
          const d = oval(cx, 62, 30, 40) + oval(cx, 62, 15, 25);
          ring.setAttribute('d', d);
          hot.setAttribute('d', d);
        });
      },
    },
  ];
  // The emblems live as files; the gallery shows them by url.
  for (const D of DIRS) if (D.l !== 'Current') D.emblemUrl = `spike/emblems/vortex-${D.l.toLowerCase()}.svg`;


  /* ================= Gallery ================= */

  const NAMES = { vortex: 'Smoke ring cannon' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || (D.emblem ? `spike/emblems/${file}.svg` : '');
      if (D.emblem) window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const c = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => c.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => c.leave());
        tile.addEventListener('focus', () => c.enter(null));
        tile.addEventListener('blur', () => c.leave());
      });
    }
  }
})();
</script>
</body>
</html>
