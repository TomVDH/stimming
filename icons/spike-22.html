<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 22</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<h1>Icon spike 22</h1>
<p class="lede">Smoke ring cannon: the current icon and five directions. Point at a height; rings fire toward it and flare in the laser blade.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  // A pointer control from three plain functions; focus plays a demo.
  const ctl = (aim, rest, demo, start = () => {}) => {
    let tl = null;
    return {
      enter(p) { start(); if (p) aim(p); else tl = demo(); },
      move(p) { if (p && !tl) aim(p); },
      leave() { tl?.kill(); tl = null; rest(); },
    };
  };
  // A repeat that runs while the pointer stays.
  const every = (dt, fn) => {
    let dc = null;
    const go = () => { fn(); dc = gsap.delayedCall(dt, go); };
    return { start() { if (!dc) go(); }, stop() { dc?.kill(); dc = null; } };
  };

  /* ================= Smoke ring cannon kit ================= */

  // Tile geometry: the face and its hard shadow, as the menu draws them.
  const T0 = 16, SHADOW = 'oklch(0.07 0.01 265)';
  const tileBack = (svg, fill) => {
    el('rect', { x: 22, y: 22, width: 92, height: 92, fill: SHADOW }, svg);
    return el('rect', { x: T0, y: T0, width: 92, height: 92, fill }, svg);
  };
  // The muzzle sits low left; the laser blade stands at x 64 and fans down from the top.
  const MUZ = [26, 74], BLADE = 64, END = 104;
  // Rings stay inside the tile face.
  const clipTile = (svg, id) => {
    const cp = el('clipPath', { id: `${id}t` }, el('defs', {}, svg));
    el('rect', { x: T0, y: T0, width: 92, height: 92 }, cp);
    return `url(#${id}t)`;
  };
  const FAN = 'M60 16H68L80 108H48Z';
  const GREEN = 'oklch(0.86 0.27 142)';

  // The cannon: each ring flies from the muzzle toward the pointer.
  // A ring flares as it crosses the blade; while the pointer stays, it fires again.
  // ring(layer) builds one ring and returns { g, flare(v) }.
  // rest is a ring parked in the blade, shown while nothing flies.
  // muzzle, end and blade set the path; span limits the aim.
  const cannon = ({ layer, ring, rest, flash, aimY = 62, muzzle = MUZ, end = END, blade = BLADE, span = [32, 96] }) => {
    const pool = [];
    let rate = null, demo = null;
    const fire = () => {
      let r = pool.find(q => !q.busy);
      if (!r && pool.length < 4) { r = ring(layer); r.g.setAttribute('opacity', 0); pool.push(r); }
      if (!r) return;
      r.busy = true;
      const st = { t: 0 }, ty = aimY;
      if (rest) gsap.to(rest, { opacity: 0, duration: 0.15, overwrite: 'auto' });
      gsap.to(st, {
        t: 1, duration: 1.25, ease: 'power1.out',
        onUpdate() {
          const x = muzzle[0] + (end - muzzle[0]) * st.t, y = muzzle[1] + (ty - muzzle[1]) * st.t, k = 0.65 + 0.55 * st.t;
          r.g.setAttribute('transform', `translate(${f(x)} ${f(y)}) scale(${f(k)})`);
          r.g.setAttribute('opacity', f(Math.min(1, st.t * 10) * (1 - Math.max(0, st.t - 0.7) / 0.3)));
          const fl = Math.max(0, 1 - Math.abs(x - blade) / 7);
          r.flare(fl);
          flash?.(fl);
        },
        onComplete() { r.busy = false; r.g.setAttribute('opacity', 0); },
      });
    };
    const aim = p => { aimY = clamp(p[1], span[0], span[1]); };
    const start = () => { if (!rate) { fire(); rate = every(0.8, fire); rate.start(); } };
    const stop = () => {
      rate?.stop(); rate = null; demo?.kill(); demo = null;
      if (rest) gsap.to(rest, { opacity: 1, duration: 0.5, delay: 0.9, overwrite: 'auto' });
    };
    return {
      enter(p) {
        if (p) aim(p);
        else { const d = { t: 0 }, mid = (span[0] + span[1]) / 2, amp = (span[1] - span[0]) / 2; demo = gsap.to(d, { t: 1, duration: 3.2, repeat: -1, ease: 'none', onUpdate: () => aim([0, mid + amp * Math.sin(d.t * TAU)]) }); }
        start();
      },
      move(p) { if (p && !demo) aim(p); },
      leave: stop,
    };
  };
  // A ring seen three-quarter on: a tall ellipse.
  const RX = 5.5, RY = 13;

  const DIRS = [
    {
      toy: 'vortex', l: 'Current', name: 'Ring and blade',
      // The menu icon: a grey ring flies through a green blade and flares.
      art(svg, id) {
        tileBack(svg, 'oklch(0.15 0.012 265)');
        el('path', { d: 'M64 16H69L78 108H55Z', fill: 'oklch(0.72 0.2 142)', opacity: 0.22 }, svg);
        el('path', { d: 'M65.6 16H67.4L67.6 108H65.4Z', fill: GREEN, opacity: 0.7 }, svg);
        const layer = el('g', { 'clip-path': clipTile(svg, id) }, svg);
        const ring = parent => {
          const g = el('g', {}, parent);
          el('ellipse', { rx: 5, ry: 12, fill: 'none', stroke: 'oklch(0.84 0.02 250)', 'stroke-width': 3.4 }, g);
          const fl = el('ellipse', { rx: 5, ry: 12, fill: 'none', stroke: 'oklch(0.92 0.25 142)', 'stroke-width': 3.8, opacity: 0 }, g);
          return { g, flare: v => fl.setAttribute('opacity', f(v)) };
        };
        const rest = ring(svg);
        rest.g.setAttribute('transform', 'translate(66 62) scale(0.95)');
        rest.flare(1);
        return cannon({ layer, ring, rest: rest.g });
      },
    },
    {
      toy: 'vortex', l: 'A', name: 'Shaded object',
      // Haze in a dark room: a soft green fan, a floor line, rings of soft smoke with a rolled core.
      art(svg, id) {
        const defs = el('defs', {}, svg);
        const fan = el('linearGradient', { id: `${id}f`, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
        [[0, 'oklch(0.86 0.27 142)', 0.85], [0.5, 'oklch(0.6 0.2 142)', 0.35], [1, 'oklch(0.4 0.14 142)', 0.08]].forEach(([o, c, a]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, fan));
        const room = el('radialGradient', { id: `${id}r`, cx: 0.3, cy: 0.2, r: 0.9 }, defs);
        [[0, 'oklch(0.3 0.014 250)'], [1, 'oklch(0.12 0.012 265)']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, room));
        const soft = el('filter', { id: `${id}s`, x: -1, y: -1, width: 3, height: 3 }, defs);
        el('feGaussianBlur', { stdDeviation: 1.1 }, soft);
        const glow = el('filter', { id: `${id}g`, x: -1, y: -1, width: 3, height: 3 }, defs);
        el('feGaussianBlur', { stdDeviation: 2.2, result: 'b' }, glow);
        const mg = el('feMerge', {}, glow);
        el('feMergeNode', { in: 'b' }, mg);
        el('feMergeNode', { in: 'SourceGraphic' }, mg);
        const cp = el('clipPath', { id: `${id}c` }, defs);
        el('rect', { x: T0, y: T0, width: 92, height: 92 }, cp);
        tileBack(svg, `url(#${id}r)`);
        const inner = el('g', { 'clip-path': `url(#${id}c)` }, svg);
        el('path', { d: FAN, fill: `url(#${id}f)` }, inner);
        el('path', { d: 'M40 108L80 92', stroke: GREEN, 'stroke-width': 2.2, 'stroke-linecap': 'round', opacity: 0.8 }, inner);
        const sheen = el('path', { d: 'M63 16H65L65.6 108H62.4Z', fill: 'oklch(0.95 0.2 142)', opacity: 0.55 }, inner);
        const layer = el('g', {}, inner);
        const ring = parent => {
          const g = el('g', {}, parent);
          el('ellipse', { rx: RX, ry: RY, fill: 'none', stroke: 'oklch(0.86 0.02 245)', 'stroke-width': 4.2, opacity: 0.7, filter: `url(#${id}s)` }, g);
          el('ellipse', { rx: RX, ry: RY, fill: 'none', stroke: 'oklch(0.97 0.01 245)', 'stroke-width': 1.2, opacity: 0.8 }, g);
          const fl = el('ellipse', { rx: RX, ry: RY, fill: 'none', stroke: 'oklch(0.92 0.26 142)', 'stroke-width': 2.4, opacity: 0, filter: `url(#${id}g)` }, g);
          return { g, flare: v => fl.setAttribute('opacity', f(v)) };
        };
        const rest = ring(inner);
        rest.g.setAttribute('transform', 'translate(64 60)');
        rest.flare(1);
        // The blade brightens while a ring sits in it.
        return cannon({ layer, ring, rest: rest.g, flash: v => sheen.setAttribute('opacity', f(0.55 + 0.4 * v)) });
      },
    },
    {
      toy: 'vortex', l: 'B', name: 'Stencil cut-out',
      // A pale tile with the fan cut through to green; rings are holes punched in the tile.
      art(svg, id) {
        const defs = el('defs', {}, svg);
        const m = el('mask', { id: `${id}m` }, defs);
        el('rect', { x: T0, y: T0, width: 92, height: 92, fill: '#fff' }, m);
        el('path', { d: FAN, fill: '#000' }, m);
        const holes = el('g', {}, m);
        el('rect', { x: 22, y: 22, width: 92, height: 92, fill: SHADOW }, svg);
        el('rect', { x: T0, y: T0, width: 92, height: 92, fill: 'oklch(0.2 0.02 265)' }, svg);
        el('path', { d: FAN, fill: 'oklch(0.72 0.22 142)' }, svg);
        const lit = el('g', {}, svg);
        el('rect', { x: T0, y: T0, width: 92, height: 92, fill: 'oklch(0.9 0.02 245)', mask: `url(#${id}m)` }, svg);
        // Each ring is a hole in the mask, plus a green ring over the fan.
        const ring = () => {
          const g = el('g', {}, holes);
          el('ellipse', { rx: RX, ry: RY, fill: 'none', stroke: '#000', 'stroke-width': 3.6 }, g);
          const fl = el('ellipse', { rx: RX, ry: RY, fill: 'none', stroke: 'oklch(0.97 0.2 142)', 'stroke-width': 3.6, opacity: 0 }, lit);
          const sync = () => fl.setAttribute('transform', g.getAttribute('transform') || '');
          return { g, fl, flare: v => { sync(); fl.setAttribute('opacity', f(v)); } };
        };
        // The parked ring is a hole and a green ring; both hide while rings fly.
        const rest = ring();
        rest.g.setAttribute('transform', 'translate(64 60)');
        rest.flare(1);
        const parked = el('g', {}, lit);
        parked.append(rest.fl);
        return cannon({ layer: holes, ring, rest: [rest.g, parked] });
      },
    },
    {
      toy: 'vortex', l: 'C', name: 'Single-weight line',
      // One line weight: the fan's two edges, the floor line, rings as ellipses that turn green in the blade.
      art(svg, id) {
        tileBack(svg, 'oklch(0.19 0.02 265)');
        const ink = { fill: 'none', stroke: 'oklch(0.92 0.02 245)', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
        const fan = el('g', {}, svg);
        el('path', { d: 'M64 22L50 104M64 22L78 104', ...ink, stroke: GREEN, opacity: 0.8 }, fan);
        el('path', { d: 'M30 104H98', ...ink, opacity: 0.5 }, svg);
        el('path', { d: 'M20 74H30', ...ink }, svg);
        const layer = el('g', { 'clip-path': clipTile(svg, id) }, svg);
        const ring = parent => {
          const g = el('g', {}, parent);
          const e = el('ellipse', { rx: RX, ry: RY, ...ink }, g);
          return { g, flare: v => e.setAttribute('stroke', v > 0.3 ? GREEN : 'oklch(0.92 0.02 245)') };
        };
        const rest = ring(svg);
        rest.g.setAttribute('transform', 'translate(64 60)');
        rest.flare(1);
        return cannon({ layer, ring, rest: rest.g });
      },
    },
    {
      toy: 'vortex', l: 'D', name: 'Isometric block',
      // A block of haze; the laser sheet stands inside it as a green slab; rings cross its top face.
      art(svg) {
        const L = [16, 58], Tp = [64, 34], B = [64, 82], R = [112, 58], DEP = 20;
        const P = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
        const dn = p => [p[0], p[1] + DEP];
        el('path', { d: P([L, B, R, dn(R), dn(B), dn(L)].map(p => [p[0] + 6, p[1] + 6])), fill: SHADOW }, svg);
        el('path', { d: P([L, B, dn(B), dn(L)]), fill: 'oklch(0.24 0.014 265)' }, svg);
        el('path', { d: P([B, R, dn(R), dn(B)]), fill: 'oklch(0.17 0.012 265)' }, svg);
        el('path', { d: P([L, Tp, R, B]), fill: 'oklch(0.3 0.016 255)' }, svg);
        // The sheet: a vertical slab across the block's middle.
        const m0 = [40, 46], m1 = [88, 70];
        el('path', { d: P([m0, m1, [m1[0], m1[1] - 40], [m0[0], m0[1] - 40]]), fill: GREEN, opacity: 0.22 }, svg);
        el('path', { d: `M${m0[0]} ${m0[1]}L${m1[0]} ${m1[1]}`, stroke: GREEN, 'stroke-width': 2.4 }, svg);
        const layer = el('g', {}, svg);
        // Rings travel from the left corner to the right, square to the sheet.
        const ring = parent => {
          const g = el('g', {}, parent);
          el('ellipse', { rx: 4.5, ry: 11, fill: 'none', stroke: 'oklch(0.9 0.02 245)', 'stroke-width': 3, transform: 'rotate(-27)' }, g);
          const fl = el('ellipse', { rx: 4.5, ry: 11, fill: 'none', stroke: 'oklch(0.94 0.25 142)', 'stroke-width': 3.4, opacity: 0, transform: 'rotate(-27)' }, g);
          return { g, flare: v => fl.setAttribute('opacity', f(v)) };
        };
        // The parked ring sits where the path crosses the slab.
        const rest = ring(svg);
        rest.g.setAttribute('transform', 'translate(70 52)');
        rest.flare(1);
        return cannon({ layer, ring, rest: rest.g, muzzle: [36, 66], end: 96, blade: 70, aimY: 40, span: [32, 48] });
      },
    },
    {
      toy: 'vortex', l: 'E', name: 'Abstract mark',
      // A heavy ring and one green bar; the ring punches through and the bar flares.
      art(svg, id) {
        tileBack(svg, 'oklch(0.88 0.03 245)');
        const ink = 'oklch(0.18 0.02 265)';
        const bar = el('rect', { x: 60, y: 22, width: 8, height: 80, fill: 'oklch(0.66 0.22 142)' }, svg);
        const layer = el('g', { 'clip-path': clipTile(svg, id) }, svg);
        const ring = parent => {
          const g = el('g', {}, parent);
          el('ellipse', { rx: 7, ry: 15, fill: 'none', stroke: ink, 'stroke-width': 6.5 }, g);
          return { g, flare: () => {} };
        };
        const rest = ring(svg);
        rest.g.setAttribute('transform', 'translate(48 62)');
        return cannon({ layer, ring, rest: rest.g, flash: v => bar.setAttribute('fill', v > 0.2 ? 'oklch(0.86 0.27 142)' : 'oklch(0.66 0.22 142)') });
      },
    },
  ];
  // The emblems live as files; the gallery shows them by url.
  for (const D of DIRS) if (D.l !== 'Current') D.emblemUrl = `spike/emblems/vortex-${D.l.toLowerCase()}.svg`;


  /* ================= Gallery ================= */

  const NAMES = { vortex: 'Smoke ring cannon' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || (D.emblem ? `spike/emblems/${file}.svg` : '');
      if (D.emblem) window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const c = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => c.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => c.leave());
        tile.addEventListener('focus', () => c.enter(null));
        tile.addEventListener('blur', () => c.leave());
      });
    }
  }
})();
</script>
</body>
</html>
