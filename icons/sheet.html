<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icons</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* Icon sheet: one row per toy; Current, Shaded object, Isometric block. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --faint: oklch(0.42 0.02 275);
  --line: oklch(0.24 0.014 275);
  --panel: oklch(0.195 0.014 275);
  --mark: oklch(0.85 0.14 85);
  --focus: oklch(0.84 0.13 205);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --tile: 128px;
  --gap: 14px;
  --gutter: 32px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--fg); font: 500 14px/1.35 var(--sans); padding-inline: max(16px, env(safe-area-inset-left, 0px)); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 800px; margin: 0 auto; padding-block: 56px 96px; }
h1 { margin: 0; font-size: 36px; font-weight: 750; letter-spacing: -0.03em; }
.sum { margin: 6px 0 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.sum b { color: var(--fg); font-weight: 650; }
/* The bar and the column heads stick, so both stay in reach. */
.head { position: sticky; top: 0; z-index: 2; margin: 28px -16px 0; padding: 12px 16px 0; background: oklch(0.16 0.012 275 / 0.92); backdrop-filter: blur(10px); }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
.seg button, .chip { font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; background: none; border: 0; border-radius: 999px; -webkit-tap-highlight-color: transparent; transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease; }
.seg button { padding: 5px 13px; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { color: var(--bg); background: var(--fg); }
.marks { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.marks b { color: var(--mark); font-weight: 650; }
.chip { padding: 5px 12px; border: 1px solid var(--line); }
.chip:hover { color: var(--fg); border-color: var(--muted); }
.chip[hidden] { display: none; }
.cols, .row { display: grid; grid-template-columns: minmax(0, 1fr) var(--tile) calc(var(--tile) * 2 + var(--gap)); column-gap: var(--gutter); align-items: center; }
.cols { padding: 14px 0 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.cols .two { display: grid; grid-template-columns: var(--tile) var(--tile); gap: var(--gap); }
.cols { align-items: end; }
.cols .two { align-items: end; }
.cols em { display: block; font-style: normal; color: var(--mark); }
h3 { margin: 40px 0 0; padding-bottom: 10px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
h3 span { color: var(--faint); }
.row { padding: 12px 0; border-top: 1px solid var(--line); }
.row h2 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
.row h2 small { display: block; margin-top: 2px; color: var(--faint); font-size: 11px; font-weight: 500; letter-spacing: 0.04em; }
/* An earlier round sits under its toy, quieter, with no Current tile. */
.row.old { padding-top: 0; border-top: 0; }
.row.old h2 small { margin: 0; text-align: right; }
.row .none { width: var(--tile); }
/* All rounds: every icon of every round, wrapped in a wide third column. */
.all .wrap { max-width: 1180px; }
.all .cols, .all .row { grid-template-columns: minmax(0, 160px) var(--tile) minmax(0, 1fr); }
.all .alts { grid-template-columns: minmax(0, 1fr); }
.all .alts .slot { grid-column: 1; }
.all .cols .two { display: block; }
.all .alts iframe { height: calc(var(--tile) + 24px); }
/* Earlier menu tiles run live in a snapshot of their day; the still shows until it loads. */
.past { display: grid; grid-template-columns: repeat(auto-fill, var(--tile)); gap: 10px var(--gap); }
.past > div { display: grid; gap: 4px; width: var(--tile); cursor: pointer; }
.past .still { position: relative; display: block; width: var(--tile); height: var(--tile); border-radius: 14px; background: var(--panel); overflow: hidden; }
.past .still > img, .past .still > iframe { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; object-fit: contain; }
.past .still > iframe { opacity: 0; background: transparent; }
.past .live > iframe { opacity: 1; }
.past .live > img { visibility: hidden; }
/* The mark ring sits above the live frame. */
.past .still::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
.past .marked .still::after { box-shadow: inset 0 0 0 2px var(--mark); }
/* Icon lab directions keep the lab's own lift on hover. */
.past .fig > svg { position: absolute; inset: 7%; width: 86%; height: 86%; overflow: visible; transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
.past > div:hover .fig > svg, .past > div:focus-visible .fig > svg { transform: translateY(-4px) rotate(-3deg); }
.past p { margin: 0; overflow: hidden; color: oklch(0.6 0.02 275); font-size: 10px; line-height: 1.3; letter-spacing: 0.04em; white-space: nowrap; text-overflow: ellipsis; }
.past p b { color: var(--fg); font-weight: 700; }
.cell { position: relative; display: grid; gap: 6px; width: var(--tile); border-radius: 14px; cursor: pointer; }
.tile, .logo, .slot { width: var(--tile); aspect-ratio: 1; border-radius: 14px; }
/* The Current column sits on its own panel. */
.tile { background: var(--panel); }
/* The live menu lies over the Current column, so each icon keeps its hover. */
#rows { position: relative; }
#live { position: absolute; left: -10000px; top: 0; width: 1280px; height: 900px; border: 0; visibility: hidden; }
#live.on { left: 0; width: var(--tile); height: 100%; z-index: 1; background: transparent; visibility: visible; }
.trans #live.on { visibility: hidden; }
/* The intro logo: the emblem as a luminance mask, white on dark glass. */
.logo { display: none; place-items: center; background: oklch(0.12 0.01 275); }
.logo i { display: block; width: 70%; aspect-ratio: 1; background: #fff; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; -webkit-mask: var(--emblem) center / contain no-repeat; }
.trans .cell .tile { display: none; }
.trans .cell .logo, .both .cell .logo { display: grid; }
.alts { position: relative; display: grid; grid-template-columns: var(--tile) var(--tile); gap: var(--gap); align-self: start; }
.alts iframe { grid-column: 1 / -1; display: block; width: 100%; height: var(--tile); border: 0; background: var(--bg); }
.both .alts iframe { height: calc(var(--tile) * 2 + 6px); }
.alts iframe.wait { position: absolute; visibility: hidden; }
/* An empty slot says why it is empty. */
.slot { display: grid; place-items: center; border: 1px dashed oklch(0.3 0.016 275); color: var(--faint); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
.slot.load { border-style: solid; border-color: var(--line); }
.marked > .tile, .marked > .logo, .slot.marked { outline: 2px solid var(--mark); outline-offset: -2px; }
.note { margin: 28px 0 0; color: var(--faint); font-size: 12px; }
@media (max-width: 640px) {
  :root { --gap: 8px; --gutter: 8px; }
  .wrap { padding-block: 32px 72px; }
  .cols, .row { grid-template-columns: var(--tile) calc(var(--tile) * 2 + var(--gap)); row-gap: 8px; }
  .cols > :first-child { display: none; }
  .row h2 { grid-column: 1 / -1; }
  /* All rounds on a phone: the name goes above, the icons get the rest of the width. */
  .all .cols, .all .row { grid-template-columns: var(--tile) minmax(0, 1fr); }
}
@media (pointer: coarse) { .seg button { padding: 8px 14px; } .chip { padding: 8px 14px; } }
@media (prefers-reduced-motion: reduce) { .seg button, .chip, .past .fig > svg { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Icons</h1>
  <p class="sum" id="sum">Loading the menu.</p>
  <div class="head">
    <div class="bar">
      <div class="seg" role="group" aria-label="Show">
        <button id="v-icon" type="button" aria-pressed="true">Icon</button>
        <button id="v-trans" type="button" aria-pressed="false">Intro logo</button>
        <button id="v-both" type="button" aria-pressed="false">Both</button>
      </div>
      <div class="seg" role="group" aria-label="Rounds">
        <button id="r-all" type="button" aria-pressed="true">All rounds</button>
        <button id="r-latest" type="button" aria-pressed="false">Latest A and D</button>
      </div>
      <div class="marks"><span id="count"></span><button class="chip" id="copy" type="button" hidden>Copy marks</button><button class="chip" id="clear" type="button" hidden>Clear</button></div>
    </div>
    <div class="cols"><span>Toy</span><span>Current</span><span class="two"><span>Shaded object</span><span>Isometric block<em>The alt style</em></span></span></div>
  </div>
  <div id="rows"><div id="list"></div></div>
  <p class="note">Click a tile or an empty slot to mark it. Copy marks gives the list as JSON.</p>
</div>
<script type="module">
// The gallery that holds each toy's two alt styles.
// In every gallery, A is the Shaded object and D is the Isometric block.
const GALLERY = {
  chladni: [1, 'chladni-1'], walker: 1, fire: 1, rain: 2, tvtree: 2, balloons: 2, morpher: [3, 'morpher-1'], pop: [3, 'pop-1'], neon: 4, glass: [4, 'glass-1'],
  fidget: 5, pendulum: [5, 'pendulum-1'], ferro: [6, 'ferro-1'], pool: 6, kaleido: [7, 'kaleido-1'], soap: [7, 'soap-1'], prism: 8, domino: [8, 'domino-1'], magnet: [9, 'magnet-1'], putty: 9,
  pins: [10, 'pins-1'], scope: 10, galaxy: [11, 'galaxy-1'], bubbles: 12, trails: 13, oilslick: 'oilslick-1', foil: 15, fireworks: 17, sonar: 18,
  windmap: 19, window: 20, vortex: 24, launch: 31, dijkstra: 'dijkstra-1', spark: 'spark-16', washline: 'washline-1', cauldron: 'cauldron-1',
  meshball: 'meshball-1', washer: 'washer-2', ladder: 'ladder-1', windtunnel: 'windtunnel-1', schlieren: 'schlieren-1',
  lichtenberg: 'lichtenberg-2', steelwool: 'steelwool-1', lanterns: 'lanterns-1', tornado: 'tornado-3', drone: 'drone-1',
  terrarium: 'terrarium-1', wires: 'wires-1', subway: 'subway-1', bowl: 'bowl-1', marble: 'marble-1', plasma: 'plasma-1', snow: 'snow-1', postcard: 'postcard-2', rupert: 'rupert-2',
  windfarm: 'windfarm-1', harmono: 'harmono-1', carwash: 'carwash-2', rainstick: 'rainstick-1',
  calmjar: 'calmjar-1',
  deepvent: 'vent-1',
  spillway: 'spillway-1',
  aquarium: 'aquarium-1',
  chemgarden: 'chemgarden-1',
  moire: 'moire-1',
  waterwheel: 'waterwheel-1',
  volcano: 'volcano-1',
  shiplaunch: 'shiplaunch-1',
  spectrogram: 'spectrogram-1',
  bz: 'bz-1',
  jethover: 'jethover-1',
  peapod: 'peapod-1',
  calving: 'calving-1',
  doubleslit: 'doubleslit-1',
  aurora: 'aurora-1',
  hookloop: 'hookloop-1',
  geoboard: 'geoboard-1',
  wavemachine: 'wavemachine-1',
  epicycles: 'epicycles-1',
  piwalk: 'piwalk-1',
  traffic: 'traffic-1',
  contour: 'contour-1',
  sorting: 'sorting-1',
  jellyfish: 'jellyfish-2',
  wheat: 'wheat-1',
  leafshadows: 'leafshadows-1',
  desirepaths: 'desirepaths-1',
  supercon: 'supercon-1',
  lavacoast: 'lavacoast-1',
  gasgiant: 'gasgiant-1',
  hurricane: 'hurricane-1',
  steelworks: 'steelworks-1',
  lava: ['lava-1', 'lava-2'],
  eyes: 'eyes-1',
  shadyos: 'shadyos-1',
  chamber: 'chamber-1',
  ink: 'ink-1',
  frietkot: 'frietkot-5',
  railgun: ['railgun-1', 'railgun-2', 'railgun-3'],
  trainride: 'trainride-3',
  motorway: ['motorway-1', 'motorway-2'],
  kintsugi: 'kintsugi-1',
  crossing: 'crossing-1',
  observatory: ['observatory-1', 'observatory-3'],
  nvg: 'nvg-1',
  tide: 'tide-1',
  tablecloth: 'tablecloth-1',
  eclipse: 'eclipse-1',
  cloudbottle: 'cloudbottle-1',
  wreckingball: 'wreckingball-1',
  opal: 'opal-1',
  pickle: 'pickle-1',
  chromatography: 'chromatography-1',
  stirbar: 'stirbar-1',
  breakers: 'breakers-1',
  forge: 'forge-1',
  milkcrown: 'milkcrown-1',
  whiteout: 'whiteout-1',
  glowworm: 'glowworm-1',
  eventhorizon: 'eventhorizon-1',
  dichroic: 'dichroic-1',
  rosewindow: 'rosewindow-1',
  solarloop: 'solarloop-1',
  fruit: 'kiwi-1',
  icebreach: 'icebreach-1',
};
// A toy with more rounds lists them oldest first; the newest leads its row.
// Earlier rounds stay on the sheet under it, for comparison.
const ALL = !new URLSearchParams(location.search).has('latest');
// rounds.json keeps every gallery a toy ever had; the All view shows each one.
const archive = await fetch('rounds.json').then(r => r.json()).then(j => j.rounds || {}).catch(() => ({}));
const voted = id => [].concat(GALLERY[id] ?? []).map(String);
const rounds = id => {
  if (!ALL) return voted(id);
  const v = voted(id), all = [...(archive[id] || []).map(String)];
  for (const r of v) if (!all.includes(r)) all.push(r);
  // The newest voted round always leads.
  if (v.length) { all.splice(all.indexOf(v.at(-1)), 1); all.push(v.at(-1)); }
  return all;
};
// A gallery that lacks one of the two letters, by round.
const LACKS = { 31: ['a'], 'wires-1': ['d'] };
const COLS = [['a', 'Shaded object'], ['d', 'Isometric block']];
const KEY = 'stimming.icons.marks';

// Inside a gallery frame only one toy's A and D show, as two tiles.
const FRAME_CSS = `
html, body { background: transparent !important; }
body { margin: 0 !important; padding: 0 !important; overflow: hidden; }
.wrap, #out, main { max-width: none !important; margin: 0 !important; padding: 0 !important; gap: 0 !important; display: block !important; }
h1, h2, .lede, .dir > header, .dir > .tag, .idea, .pick, .size { display: none !important; }
/* The big tile hides only after the gallery fits its icons on it. */
body.fitted .dir > .big { display: none !important; }
.emb, .embs { display: none !important; }
body.trans .icons, body.trans .flash, body.both .flash { display: none !important; }
body.trans .emb, body.trans .embs, body.both .emb, body.both .embs { display: block !important; }
body.both .emb, body.both .embs { margin-top: 6px !important; }
.glass { width: var(--tile) !important; height: var(--tile) !important; border-radius: 14px; background: oklch(0.12 0.01 275) !important; }
.glass::before, .glass::after { display: none !important; }
.glass i, .glass .em { width: 70% !important; height: auto !important; aspect-ratio: 1; }
section { display: grid !important; grid-template-columns: var(--tile) var(--tile) !important; gap: var(--gap) !important; align-items: start; margin: 0 !important; padding: 0 !important; border: 0 !important; }
section > .row, section > .dirs { display: contents !important; }
.dir { grid-row: 1; position: relative; display: block !important; padding: 0 !important; border: 0 !important; border-radius: 14px; cursor: pointer; }
.dir[data-col="0"] { grid-column: 1; } .dir[data-col="1"] { grid-column: 2; }
.icons { display: block !important; }
.t128, .t128 svg, .s128 { width: var(--tile) !important; height: var(--tile) !important; outline: none !important; }
.t64, .icons > div:has(.s64) { position: absolute !important; visibility: hidden !important; pointer-events: none; }
.dir.slot { display: grid !important; place-items: center; align-content: center !important; width: var(--tile); aspect-ratio: 1; border: 1px dashed oklch(0.3 0.016 275) !important;
  color: oklch(0.42 0.02 275); font: 500 10px/1.35 Gabarito, system-ui, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; }
.dir.marked .t128, .dir.marked .s128, .dir.marked .glass, .dir.slot.marked { outline: 2px solid oklch(0.85 0.14 85) !important; outline-offset: -2px; border-radius: 14px; }
`;
// The All view lifts every card's 128 tile into one wrapping grid, each with its name under it.
const ALL_CSS = `
html, body { background: transparent !important; }
body { margin: 0 !important; padding: 0 !important; overflow: hidden; }
/* The page hides only after the grid exists, so each gallery fits its icons first. */
body.every > :not(#every) { display: none !important; }
#every { display: grid; grid-template-columns: repeat(auto-fill, var(--tile)); gap: 10px var(--gap); align-items: start; }
.pick2 { position: relative; display: grid; gap: 4px; width: var(--tile); cursor: pointer; }
.pick2 > .t128, .pick2 > .t128 svg, .pick2 > .s128, .pick2 > .s128 svg { display: block !important; width: var(--tile) !important; height: var(--tile) !important; outline: none !important; border-radius: 14px; }
.pick2 > p { margin: 0; overflow: hidden; color: oklch(0.6 0.02 275); font: 500 10px/1.3 Gabarito, system-ui, sans-serif; letter-spacing: 0.04em; white-space: nowrap; text-overflow: ellipsis; }
.pick2 > p b { color: oklch(0.95 0.008 275); font-weight: 700; }
.pick2 .emb, .pick2 .embs { display: none !important; }
.pick2 .glass { position: relative; display: grid; place-items: center; width: var(--tile) !important; height: var(--tile) !important; border-radius: 14px; background: oklch(0.12 0.01 275) !important; overflow: hidden; }
.pick2 .glass::before, .pick2 .glass::after { display: none !important; }
.pick2 .glass i, .pick2 .glass .em { display: block; width: 70% !important; height: auto !important; aspect-ratio: 1; background: #fff; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; -webkit-mask: var(--emblem) center / contain no-repeat; }
body.trans .pick2 > .t128, body.trans .pick2 > .s128 { display: none !important; }
body.trans .pick2 .emb, body.both .pick2 .emb, body.trans .pick2 .embs, body.both .pick2 .embs { display: block !important; }
body.trans .pick2 .flash, body.both .pick2 .flash { display: none !important; }
.pick2.cut > .t128, .pick2.cut > .s128 { opacity: 0.35; }
.pick2.marked > .t128, .pick2.marked > .s128, .pick2.marked .glass { outline: 2px solid oklch(0.85 0.14 85) !important; outline-offset: -2px; }
`;

const $ = id => document.getElementById(id);
const marks = (() => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch { return new Set(); } })();
// A mark from before rounds names no round: it was on the first round.
for (const k of [...marks]) {
  const m = k.match(/^(.+)-([ad])$/);
  if (m && voted(m[1]).length) { marks.delete(k); marks.add(`${k}@${voted(m[1])[0]}`); }
}
const docs = [];
let view = 'icon';

const names = await fetch('../toys.json').then(r => r.json()).catch(() => ({}));
// Tom's cut directions stay off the sheet; the slot says "cut".
const archived = await fetch('archive/cut.json').then(r => r.json()).catch(() => ({ cut: {} }));
const gone = new Set(Object.entries(archived.cut || {}).flatMap(([id, ls]) => ls.map(l => `${id}-${l.toLowerCase()}`)));
// Earlier menu tiles per toy, oldest first. The note in the file says how they were made.
const history = ALL ? await fetch('history/menu.json').then(r => r.json()).catch(() => ({})) : {};
const past = history.tiles || {}, pastNames = history.retired || {};
// The icon lab page holds three early directions; each figure names its toy.
const LAB_TOY = { 'Domino run': 'domino', Morphset: 'morphset' };
const early = {};
if (ALL) {
  const lab = new DOMParser().parseFromString(await fetch('index.html').then(r => r.text()).catch(() => ''), 'text/html');
  for (const sec of lab.querySelectorAll('section')) {
    const set = sec.querySelector('h2')?.textContent.trim();
    for (const fig of sec.querySelectorAll('figure')) {
      const cap = fig.querySelector('figcaption')?.textContent.trim() || '';
      const id = LAB_TOY[cap] || Object.keys(names).find(k => names[k]?.name === cap) || cap.toLowerCase();
      const svg = fig.querySelector('svg');
      if (set && svg) (early[id] ||= []).push({ set, svg: svg.outerHTML });
    }
  }
  // The lab's shared gradients come along, for the sphere glint.
  const defs = lab.querySelector('body > .wrap > svg defs, body > svg defs');
  if (defs) document.body.insertAdjacentHTML('beforeend', `<svg width="0" height="0" style="position: absolute" aria-hidden="true">${defs.outerHTML}</svg>`);
}
const slug = s => s.toLowerCase().replace(/\W+/g, '-');

// The menu gives the toy list and the Current icons.
// It loads off screen at full width first, because its script fits each icon.
const menuFrame = Object.assign(document.createElement('iframe'), { src: '../index.html?lab', title: 'Current menu icons', id: 'live' });
$('rows').append(menuFrame);
await new Promise(r => { menuFrame.addEventListener('load', r, { once: true }); setTimeout(r, 6000); });
// A slow server can hold the menu past that wait; the sheet waits for its tiles.
for (let t = 0; t < 40 && !menuFrame.contentDocument?.querySelector('a.toy[id]'); t++) await new Promise(r => setTimeout(r, 500));
await new Promise(r => setTimeout(r, 900));
const menu = menuFrame.contentDocument;
// The order is toys.json: the main shelf by number, then the Lab by name.
// The menu says which toys it shows and which sit in the Lab.
const links = new Map([...(menu?.querySelectorAll('a.toy[id]') || [])].map(a => [a.id, !!a.closest('.lab')]));
const listed = Object.keys(names).filter(id => names[id]?.name);
const toys = links.size
  ? [...listed.filter(id => links.has(id)), ...[...links.keys()].filter(id => !listed.includes(id))].map(id => ({ id, lab: links.get(id) }))
  : listed.map(id => ({ id, lab: names[id].number == null }));
const nameOf = id => names[id]?.name ?? menu?.querySelector(`a.toy#${id}`)?.textContent.trim() ?? id;
// have: the gallery holds it. cut: Tom cut it. none: nobody drew it.
// Tom's cuts date from the first round on the sheet, so only that round has them.
const newest = id => rounds(id).at(-1);
const stateOf = (id, l, r = newest(id)) => (r == null || LACKS[r]?.includes(l) ? 'none' : r === voted(id)[0] && gone.has(`${id}-${l}`) ? 'cut' : 'have');
const WORD = { have: '', cut: 'Cut', none: 'To draw' };
// An earlier round with no such letter shows an empty slot: nothing is left to draw there.
const wordOf = (id, s, r) => (s === 'none' && r !== newest(id) ? '' : WORD[s]);
// A mark names the toy, the letter and the round.
const keyOf = (id, l, r) => `${id}-${l}@${r}`;

// Rows: the name, the Current icon, then the two alt slots.
// An earlier round gets a row of its own: its name, no Current, its two slots.
const slot = (id, l, s, r) => `<div class="slot${s === 'have' ? ' load' : ''}" data-key="${keyOf(id, l, r)}" tabindex="0" role="button" aria-label="${nameOf(id)}, ${l === 'a' ? 'Shaded object' : 'Isometric block'}, round ${r}">${wordOf(id, s, r)}</div>`;
// The All view knows its cards only once the gallery loads; it holds one waiting slot.
const alts = (id, r) => (ALL ? `<div class="alts"><div class="slot load">${r}</div></div>` : `<div class="alts">${COLS.map(([l]) => slot(id, l, stateOf(id, l, r), r)).join('')}</div>`);
// Earlier menu tiles, newest first, under the rounds.
// Each runs live in a snapshot of its day's menu; the still is the fallback.
const day = d => new Date(`${d}T12:00:00`).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const span = t => (t.from === t.to ? day(t.from) : `${day(t.from)} to ${day(t.to)}`);
const hist = id => (past[id]?.length ? `<section class="row old" data-toy="${id}" data-round="">
    <h2><small>menu, earlier</small></h2>
    <div class="none"></div>
    <div class="alts"><div class="past">${past[id].map((t, i) => [t, i + 1]).reverse().map(([t, n]) => `<div data-key="${id}-menu${n}@menu" tabindex="0" role="button" aria-label="${nameOf(id)}, menu tile ${n}, ${span(t)}">
      <span class="still"><img src="${t.file}" alt="" width="128" height="128" loading="lazy" decoding="async">${t.page ? `<iframe src="${t.page}?lab#${t.id || id}" title="${nameOf(id)}, menu tile ${n}" loading="lazy" tabindex="-1" scrolling="no"></iframe>` : ''}</span>
      <p><b>Menu ${n}</b> · ${span(t)}</p>
    </div>`).join('')}</div></div>
  </section>` : '');
// Icon lab directions: live SVG, with the lab's own hover.
const labRow = id => (early[id]?.length ? `<section class="row old" data-toy="${id}" data-round="">
    <h2><small>icon lab, early</small></h2>
    <div class="none"></div>
    <div class="alts"><div class="past">${early[id].map(e => `<div data-key="${id}-${slug(e.set)}@lab" tabindex="0" role="button" aria-label="${nameOf(id)}, icon lab, ${e.set}">
      <span class="still fig">${e.svg}</span>
      <p><b>${e.set}</b> · icon lab</p>
    </div>`).join('')}</div></div>
  </section>` : '');
const row = ({ id }) => {
  const emb = names[id]?.emblem, rs = rounds(id), r = rs.at(-1);
  return `<section class="row" id="row-${id}" data-toy="${id}" data-round="${r ?? ''}">
    <h2>${nameOf(id)}${rs.length > 1 ? `<small>${r}</small>` : ''}</h2>
    <div class="cell" data-key="${id}-current" tabindex="0" role="button" aria-label="${nameOf(id)}, Current">
      <div class="tile"></div>
      <div class="logo">${emb ? `<i style="--emblem: url(../${emb})"></i>` : ''}</div>
    </div>
    ${alts(id, r)}
  </section>` + rs.slice(0, -1).reverse().map(o => `<section class="row old" data-toy="${id}" data-round="${o}">
    <h2><small>${o}</small></h2>
    <div class="none"></div>
    ${alts(id, o)}
  </section>`).join('') + hist(id) + labRow(id);
};
const group = (title, list) => (list.length ? `<h3>${title} <span>· ${list.length}</span></h3>${list.map(row).join('')}` : '');
// Toys that left the menu keep their earlier tiles, last on the sheet.
const gone2 = [...new Set([...Object.keys(past), ...Object.keys(early)])].filter(id => !toys.some(t => t.id === id));
const retired = gone2.length ? `<h3>Retired <span>· ${gone2.length}</span></h3>${gone2.map(id => `<section class="row" data-toy="${id}" data-round="">
    <h2>${pastNames[id] || id}<small>retired</small></h2>
  </section>${hist(id)}${labRow(id)}`).join('')}` : '';
$('list').innerHTML = group('Main shelf', toys.filter(t => !t.lab)) + group('Lab', toys.filter(t => t.lab)) + retired;

// The menu frame turns into the Current column: only its tiles stay, one on each row.
// A tile keeps its own listeners, styles and gradients, so its hover is the menu's own.
const tiles = new Map();
const NAKED = 'display: block !important; position: static !important; transform: none !important; filter: none !important; opacity: 1 !important; margin: 0 !important; padding: 0 !important; border: 0 !important; animation: none !important; transition: none !important; contain: none !important;';
function goLive() {
  if (!links.size) { menuFrame.remove(); return; }
  const keep = new Set(), off = n => n.style.setProperty('display', 'none', 'important');
  for (const a of menu.querySelectorAll('a.toy[id]')) {
    if (tiles.has(a.id) || !document.getElementById(`row-${a.id}`)) { off(a); continue; }
    tiles.set(a.id, a);
    for (let n = a.parentElement; n && n !== menu.documentElement; n = n.parentElement) keep.add(n);
  }
  // Everything that is not a tile, or on the way to one, goes.
  for (const n of keep) {
    for (const c of n.children) if (!keep.has(c) && !tiles.has(c.id) && !c.matches('svg.defs, script, style, link')) off(c);
    n.style.cssText += `; ${NAKED}`;
  }
  for (const a of tiles.values()) {
    for (const c of a.children) if (!c.matches('.obj')) off(c);
    a.style.cssText += '; position: absolute !important; left: 0 !important; display: grid !important; place-items: center !important; gap: 0 !important; margin: 0 !important; padding: 0 !important; opacity: 1 !important; filter: none !important; transform: none !important; transition: none !important;';
  }
  const css = menu.createElement('style');
  css.textContent = `
    html, body { background: transparent !important; overflow: hidden !important; margin: 0 !important; padding: 0 !important; min-height: 0 !important; }
    a.toy { width: var(--tile) !important; height: var(--tile) !important; border-radius: 14px !important; }
    a.toy .obj { width: 100% !important; height: 100% !important; max-width: none !important; }
    a.toy .obj svg { width: 90% !important; height: 90% !important; }
    a.toy .obj .series, a.toy .obj::after { display: none !important; }
    a.toy:focus-visible { outline: 2px solid oklch(0.84 0.13 205) !important; outline-offset: -2px !important; }`;
  menu.head.append(css);
  // A click marks the tile; it does not open the toy.
  menu.addEventListener('click', e => {
    const a = e.target.closest?.('a.toy');
    if (!a) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    toggle(`${a.id}-current`);

  menu.addEventListener('keydown', onKey);
  menuFrame.classList.add('on');
}
// Each tile sits on its row's Current cell.
const place = () => {
  if (!tiles.size) return;
  menuFrame.style.left = `${document.querySelector('.cell').offsetLeft}px`;
  for (const [id, a] of tiles) a.style.setProperty('top', `${document.querySelector(`#row-${id} .cell`).offsetTop}px`, 'important');
};
const count = l => toys.filter(t => stateOf(t.id, l) === 'have').length;
const older = toys.reduce((n, t) => n + Math.max(0, rounds(t.id).length - 1), 0);
const pastN = Object.values(past).flat().length;
const labN = Object.values(early).flat().length;
$('sum').innerHTML = `<b>${toys.length}</b> toys · <b>${count('a')}</b> shaded · <b>${count('d')}</b> isometric${older ? ` · <b>${older}</b> earlier rounds` : ''}${pastN ? ` · <b>${pastN}</b> earlier menu tiles` : ''}${labN ? ` · <b>${labN}</b> icon lab directions` : ''}`;

// The tile size fits three columns; the name moves above them on phones.
const layout = () => {
  const w = $('list').clientWidth, narrow = matchMedia('(max-width: 640px)').matches;
  const tile = Math.floor(Math.min(128, narrow ? (w - 8 - 8) / 3 : (w - 160 - 64 - 14) / 3));
  for (const el of [document.documentElement, menu?.documentElement, ...docs.map(d => d.documentElement)]) {
    el?.style.setProperty('--tile', `${tile}px`);
    el?.style.setProperty('--gap', narrow ? '8px' : '14px');
  }
  place();
};

// Marks: a click toggles one; the list goes out as JSON.
// The All view learns each card's own name as it mounts.
const titles = new Map();
const output = () => {
  const o = {};
  for (const id of [...toys.map(t => t.id), ...gone2]) {
    const ls = marks.has(`${id}-current`) ? ['Current'] : [];
    for (const k of marks) {
      const m = k.startsWith(`${id}-`) && k.slice(id.length + 1).match(/^(.+)@(.+)$/);
      if (!m) continue;
      const n = m[1].match(/^menu(\d+)$/)?.[1], t = n && past[id]?.[n - 1];
      const e = m[2] === 'lab' && early[id]?.find(x => slug(x.set) === m[1]);
      const word = t ? `Menu tile ${n}, ${t.from} to ${t.to}, ${t.sha}` : e ? `Icon lab, ${e.set}` : COLS.find(c => c[0] === m[1])?.[1] || m[1].toUpperCase();
      ls.push(`${word}${titles.get(k) ? ` · ${titles.get(k)}` : ''} (${m[2]})`);
    }
    if (ls.length) o[id] = ls;
  }
  return JSON.stringify({ marked: o }, null, 2);
};
const paint = () => {
  for (const d of [document, ...docs]) for (const c of d.querySelectorAll('[data-key]')) c.classList.toggle('marked', marks.has(c.dataset.key));
  $('count').innerHTML = marks.size ? `<b>${marks.size}</b> marked` : '';
  $('copy').hidden = $('clear').hidden = !marks.size;
};
const toggle = key => {
  marks.has(key) ? marks.delete(key) : marks.add(key);
  try { localStorage.setItem(KEY, JSON.stringify([...marks])); } catch {}
  paint();
};
const onClick = e => { const c = e.target.closest('[data-key]'); if (c) toggle(c.dataset.key); };
const onKey = e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const c = e.target.closest?.('[data-key]');
  if (c && (e.key === 'Enter' || e.key === ' ')) { toggle(c.dataset.key); e.preventDefault(); }
  else if (e.key.toLowerCase() === 't') show(VIEWS[(VIEWS.indexOf(view) + 1) % VIEWS.length]);
};
document.addEventListener('click', onClick);
document.addEventListener('keydown', onKey);
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(output()); $('copy').textContent = 'Copied'; } catch { $('copy').textContent = 'Copy failed'; }
  setTimeout(() => { $('copy').textContent = 'Copy marks'; }, 1400);
});
$('clear').addEventListener('click', () => { marks.clear(); try { localStorage.removeItem(KEY); } catch {} paint(); });

// Icon, Intro logo (the luminance emblem) or Both, stacked in each cell.
const VIEWS = ['icon', 'trans', 'both'];
const show = v => {
  view = v;
  for (const d of [document, ...docs]) { d.body.classList.toggle('trans', v === 'trans'); d.body.classList.toggle('both', v === 'both'); }
  for (const n of VIEWS) $(`v-${n}`).setAttribute('aria-pressed', String(n === v));
  fitAll();
  place();
};
for (const n of VIEWS) $(`v-${n}`).addEventListener('click', () => show(n));
// The rounds switch reloads the sheet in the other view.
document.documentElement.classList.toggle('all', ALL);
$('r-all').setAttribute('aria-pressed', String(ALL));
$('r-latest').setAttribute('aria-pressed', String(!ALL));
$('r-all').addEventListener('click', () => { if (!ALL) location.search = ''; });
$('r-latest').addEventListener('click', () => { if (ALL) location.search = '?latest'; });
if (ALL) document.querySelector('.cols .two').innerHTML = '<span>Every icon of every round, newest round first</span>';

// A gallery mounts when its row comes near the view, one at a time.
const base = new URL('./', location.href).href;
// Inside a gallery, each emblem comes from the gallery's own copy.
// A cut emblem without one comes from the archive; nothing asks for a moved file.
const EMB_FIX = `<script>
(() => {
  const CUT = new Set(${JSON.stringify([...gone])});
  const fix = el => {
    const v = el.getAttribute('style');
    if (!v || !v.includes('spike/emblems/')) return;
    const w = v.replace(/url\\((["']?)spike\\/emblems\\/([\\w-]+)\\.svg\\1\\)/g, (m, q, f) => {
      const s = window.EMBLEMS && window.EMBLEMS[f];
      if (s) return 'url("data:image/svg+xml,' + encodeURIComponent(s) + '")';
      return CUT.has(f) ? 'url(archive/emblems/' + f + '.svg)' : m;
    });
    if (w !== v) el.setAttribute('style', w);
  };
  new MutationObserver(ms => {
    for (const m of ms) {
      if (m.type === 'attributes') { fix(m.target); continue; }
      for (const n of m.addedNodes) if (n.nodeType === 1) { fix(n); n.querySelectorAll('[style*="spike/emblems/"]').forEach(fix); }
    }
  }).observe(document, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
})();
<\/script>`;
const sources = new Map();
// The local server drops some requests under load; a gallery gets three tries.
const fetchText = async (url, tries = 3) => {
  for (let i = 0; i < tries; i++) {
    try { const r = await fetch(url); if (r.ok) return await r.text(); if (r.status === 404) return ''; } catch {}
    await new Promise(res => setTimeout(res, 400 * (i + 1)));
  }
  return '';
};
const source = n => sources.get(n) ?? sources.set(n, fetchText(`spike-${n}.html`)).get(n);
async function mount(sec) {
  if (ALL) return mountAll(sec);
  const id = sec.dataset.toy, r = sec.dataset.round, alts = sec.querySelector('.alts');
  const src = await source(r);
  if (!src) return;
  const frame = document.createElement('iframe');
  frame.title = `${nameOf(id)}: Shaded object and Isometric block`;
  frame.className = 'wait';
  frame.setAttribute('scrolling', 'no');
  frame.srcdoc = src.replace(/<head>/i, `<head><base href="${base}">${EMB_FIX}`).replace(/<\/head>/i, `<style>${FRAME_CSS}</style></head>`);
  alts.append(frame);
  // The cards are ready before the fonts and emblems finish; do not wait for those.
  await new Promise(r => {
    const t0 = performance.now();
    const poll = setInterval(() => {
      if (!frame.contentDocument?.querySelector('.dir svg') && performance.now() - t0 < 8000) return;
      clearInterval(poll);
      r();
    }, 60);
  });
  const doc = frame.contentDocument;
  doc.body.classList.add('fitted');
  let own = null;
  for (const s of doc.querySelectorAll('section')) {
    const first = s.querySelector('.dir');
    const toy = s.id?.replace(/^row-/, '') || (first?.id || first?.dataset.key || '').split('-')[0];
    // The first round of a toy is the one that follows the letters.
    if (toy === id && !own && !s.dataset.round) own = s; else s.remove();
  }
  if (!own) { frame.remove(); return; }
  const holder = own.querySelector('.row, .dirs') || own, kept = {};
  for (const card of own.querySelectorAll('.dir')) {
    const l = card.querySelector('b')?.textContent.trim().toLowerCase(), col = COLS.findIndex(c => c[0] === l);
    if (col < 0 || stateOf(id, l, r) === 'cut' || !card.querySelector('.t128, .s128')) { card.remove(); continue; }
    card.dataset.col = String(col);
    card.dataset.key = keyOf(id, l, r);
    kept[l] = true;
  }
  // A missing letter keeps its slot, with the reason.
  COLS.forEach(([l], col) => {
    if (kept[l]) return;
    const s = stateOf(id, l, r) === 'cut' ? 'cut' : 'none';
    holder.insertAdjacentHTML('beforeend', `<article class="dir slot" data-col="${col}" data-key="${keyOf(id, l, r)}">${wordOf(id, s, r)}</article>`);
  });
  docs.push(doc);
  doc.addEventListener('click', onClick);
  doc.addEventListener('keydown', onKey);
  layout();
  show(view);
  paint();
  for (const s of alts.querySelectorAll('.slot')) s.remove();
  frame.classList.remove('wait');
}
// The galleries a toy section can come from: its own id, or the name it had then.
const ALIAS = { vent: 'deepvent' };
// All rounds: every card with a 128 tile, except the Current of its day, lifted into one grid.
// Old galleries hold their cards in sections, in a bare row, or (Observatory 2) in labelled rows.
const cardsOf = (doc, id, r) => {
  const toyOf = s => { const first = s.querySelector('.dir'); const t = s.id?.replace(/^row-/, '') || (first?.id || first?.dataset.key || '').split('-')[0]; return ALIAS[t] || t; };
  const secs = [...doc.querySelectorAll('section')].filter(s => s.querySelector('.dir') && toyOf(s) === id);
  if (secs.length) return secs.flatMap(s => [...s.querySelectorAll('.dir')]);
  // A gallery named for the toy may keep its cards outside any section.
  if (String(r).replace(/-\d+$/, '') !== id && ALIAS[String(r).replace(/-\d+$/, '')] !== id) return [];
  const dirs = [...doc.querySelectorAll('.dir')];
  if (dirs.length) return dirs;
  return [...doc.querySelectorAll('#sheet .r')];
};
const fitAll = () => {
  if (!ALL) return;
  for (const f of document.querySelectorAll('.alts iframe:not(.wait)')) {
    const g = f.contentDocument?.getElementById('every');
    if (g) f.style.height = `${g.scrollHeight}px`;
  }
};
async function mountAll(sec) {
  const id = sec.dataset.toy, r = sec.dataset.round, alts = sec.querySelector('.alts');
  const src = await source(r);
  if (!src) { alts.querySelector('.slot').textContent = `${r} · missing`; return; }
  const frame = document.createElement('iframe');
  frame.title = `${nameOf(id)}: round ${r}`;
  frame.className = 'wait';
  frame.setAttribute('scrolling', 'no');
  frame.srcdoc = src.replace(/<head>/i, `<head><base href="${base}">${EMB_FIX}`).replace(/<\/head>/i, `<style>${ALL_CSS}</style></head>`);
  alts.append(frame);
  await new Promise(res => {
    const t0 = performance.now();
    const poll = setInterval(() => {
      if (!frame.contentDocument?.querySelector('.t128 svg, .s128 svg') && performance.now() - t0 < 8000) return;
      clearInterval(poll);
      // Galleries that build in steps get a moment to finish.
      setTimeout(res, 250);
    }, 60);
  });
  const doc = frame.contentDocument;
  const grid = doc.createElement('div');
  grid.id = 'every';
  for (const card of cardsOf(doc, id, r)) {
    const tile = card.querySelector('.t128, .s128');
    const l = (card.querySelector('b')?.textContent || card.querySelector('.lab, i, span')?.textContent || '').trim();
    if (!tile || !l || /^current$/i.test(l)) continue;
    const name = [...card.querySelectorAll('header span, header i, .lab span')].map(n => n.textContent).join(' ').replace(/^[\s·]+/, '').trim();
    const key = keyOf(id, l.toLowerCase(), r);
    const cell = doc.createElement('div');
    cell.className = `pick2${stateOf(id, l.toLowerCase(), r) === 'cut' ? ' cut' : ''}`;
    cell.dataset.key = key;
    cell.tabIndex = 0;
    if (name) titles.set(key, name);
    // Moving the tile keeps its listeners, so its hover still runs.
    cell.append(tile);
    const emb = card.querySelector('.emb, .embs');
    if (emb) cell.append(emb);
    cell.insertAdjacentHTML('beforeend', `<p><b>${l}</b>${name ? ` · ${name}` : ''}${cell.classList.contains('cut') ? ' · cut' : ''}</p>`);
    grid.append(cell);
  }
  if (!grid.children.length) { frame.remove(); alts.querySelector('.slot').textContent = `${r} · no cards`; return; }
  // Paint servers outside the cards go into the grid in a zero-size box.
  // A hidden gradient paints nothing, so old cards that share defs went blank.
  const PAINT = 'defs, symbol, linearGradient, radialGradient, pattern, filter, clipPath, mask, marker';
  const box = doc.createElement('div');
  box.style.cssText = 'position: absolute; width: 0; height: 0; overflow: hidden;';
  for (const p of doc.querySelectorAll(PAINT)) {
    if (grid.contains(p) || box.contains(p) || p.parentElement?.closest(PAINT)) continue;
    const s = doc.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.append(p);
    box.append(s);
  }
  grid.append(box);
  doc.body.append(grid);
  doc.body.classList.add('every');
  docs.push(doc);
  doc.addEventListener('click', onClick);
  doc.addEventListener('keydown', onKey);
  layout();
  show(view);
  paint();
  for (const s of alts.querySelectorAll('.slot')) s.remove();
  frame.classList.remove('wait');
  fitAll();
  place();
}
// Two galleries load at a time; the local server drops large bursts.
const queue = [];
let busy = 0;
const pump = async () => {
  if (busy >= 2) return;
  busy++;
  while (queue.length) await mount(queue.shift()).catch(() => {});
  busy--;
};
const near = new IntersectionObserver(es => {
  for (const e of es) {
    if (!e.isIntersecting) continue;
    near.unobserve(e.target);
    queue.push(e.target);
  }
  pump();
  pump();
}, { rootMargin: '600px 0px' });
for (const sec of document.querySelectorAll('.row')) {
  const id = sec.dataset.toy, r = sec.dataset.round;
  if (r && (ALL || COLS.some(([l]) => stateOf(id, l, r) === 'have'))) near.observe(sec);
}
// A live menu tile takes over from its still once its snapshot shows the tile.
const wirePast = f => {
  const key = f.closest('[data-key]').dataset.key, t0 = performance.now();
  const poll = setInterval(() => {
    const d = f.contentDocument, ready = d?.documentElement.dataset.ready;
    if (!ready && performance.now() - t0 < 12000) return;
    clearInterval(poll);
    if (ready !== '1') { f.remove(); return; }
    // A click marks the tile; it does not open the toy.
    d.addEventListener('click', e => { e.preventDefault(); e.stopImmediatePropagation(); toggle(key); }, true);
    f.parentElement.classList.add('live');
    f.dataset.ready = '1';
  }, 100);
};
for (const f of document.querySelectorAll('.past iframe')) f.addEventListener('load', () => wirePast(f), { once: true });
goLive();
layout();
paint();
addEventListener('resize', layout);
// A change of view changes the row heights; the tiles follow.
new ResizeObserver(place).observe($('list'));
</script>
