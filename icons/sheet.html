<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icons</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* Icon sheet: one row per toy; Current, Shaded object, Isometric block. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --faint: oklch(0.42 0.02 275);
  --line: oklch(0.24 0.014 275);
  --panel: oklch(0.195 0.014 275);
  --mark: oklch(0.85 0.14 85);
  --focus: oklch(0.84 0.13 205);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --tile: 128px;
  --gap: 14px;
  --gutter: 32px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--fg); font: 500 14px/1.35 var(--sans); padding-inline: max(16px, env(safe-area-inset-left, 0px)); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 800px; margin: 0 auto; padding-block: 56px 96px; }
h1 { margin: 0; font-size: 36px; font-weight: 750; letter-spacing: -0.03em; }
.sum { margin: 6px 0 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.sum b { color: var(--fg); font-weight: 650; }
/* The bar and the column heads stick, so both stay in reach. */
.head { position: sticky; top: 0; z-index: 2; margin: 28px -16px 0; padding: 12px 16px 0; background: oklch(0.16 0.012 275 / 0.92); backdrop-filter: blur(10px); }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
.seg button, .chip { font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; background: none; border: 0; border-radius: 999px; -webkit-tap-highlight-color: transparent; transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease; }
.seg button { padding: 5px 13px; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { color: var(--bg); background: var(--fg); }
.marks { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.marks b { color: var(--mark); font-weight: 650; }
.chip { padding: 5px 12px; border: 1px solid var(--line); }
.chip:hover { color: var(--fg); border-color: var(--muted); }
.chip[hidden] { display: none; }
.cols, .row { display: grid; grid-template-columns: minmax(0, 1fr) var(--tile) calc(var(--tile) * 2 + var(--gap)); column-gap: var(--gutter); align-items: center; }
.cols { padding: 14px 0 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.cols .two { display: grid; grid-template-columns: var(--tile) var(--tile); gap: var(--gap); }
.cols { align-items: end; }
.cols .two { align-items: end; }
.cols em { display: block; font-style: normal; color: var(--mark); }
h3 { margin: 40px 0 0; padding-bottom: 10px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
h3 span { color: var(--faint); }
.row { padding: 12px 0; border-top: 1px solid var(--line); }
.row h2 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
.cell { position: relative; display: grid; gap: 6px; width: var(--tile); border-radius: 14px; cursor: pointer; }
.tile, .logo, .slot { width: var(--tile); aspect-ratio: 1; border-radius: 14px; }
/* The Current column sits on its own panel. */
.tile { background: var(--panel); }
/* The live menu lies over the Current column, so each icon keeps its hover. */
#rows { position: relative; }
#live { position: absolute; left: -10000px; top: 0; width: 1280px; height: 900px; border: 0; visibility: hidden; }
#live.on { left: 0; width: var(--tile); height: 100%; z-index: 1; background: transparent; visibility: visible; }
.trans #live.on { visibility: hidden; }
/* The intro logo: the emblem as a luminance mask, white on dark glass. */
.logo { display: none; place-items: center; background: oklch(0.12 0.01 275); }
.logo i { display: block; width: 70%; aspect-ratio: 1; background: #fff; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; -webkit-mask: var(--emblem) center / contain no-repeat; }
.trans .cell .tile { display: none; }
.trans .cell .logo, .both .cell .logo { display: grid; }
.alts { position: relative; display: grid; grid-template-columns: var(--tile) var(--tile); gap: var(--gap); align-self: start; }
.alts iframe { grid-column: 1 / -1; display: block; width: 100%; height: var(--tile); border: 0; background: var(--bg); }
.both .alts iframe { height: calc(var(--tile) * 2 + 6px); }
.alts iframe.wait { position: absolute; visibility: hidden; }
/* An empty slot says why it is empty. */
.slot { display: grid; place-items: center; border: 1px dashed oklch(0.3 0.016 275); color: var(--faint); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
.slot.load { border-style: solid; border-color: var(--line); }
.marked > .tile, .marked > .logo, .slot.marked { outline: 2px solid var(--mark); outline-offset: -2px; }
.note { margin: 28px 0 0; color: var(--faint); font-size: 12px; }
@media (max-width: 640px) {
  :root { --gap: 8px; --gutter: 8px; }
  .wrap { padding-block: 32px 72px; }
  .cols, .row { grid-template-columns: var(--tile) calc(var(--tile) * 2 + var(--gap)); row-gap: 8px; }
  .cols > :first-child { display: none; }
  .row h2 { grid-column: 1 / -1; }
}
@media (pointer: coarse) { .seg button { padding: 8px 14px; } .chip { padding: 8px 14px; } }
@media (prefers-reduced-motion: reduce) { .seg button, .chip { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Icons</h1>
  <p class="sum" id="sum">Loading the menu.</p>
  <div class="head">
    <div class="bar">
      <div class="seg" role="group" aria-label="Show">
        <button id="v-icon" type="button" aria-pressed="true">Icon</button>
        <button id="v-trans" type="button" aria-pressed="false">Intro logo</button>
        <button id="v-both" type="button" aria-pressed="false">Both</button>
      </div>
      <div class="marks"><span id="count"></span><button class="chip" id="copy" type="button" hidden>Copy marks</button><button class="chip" id="clear" type="button" hidden>Clear</button></div>
    </div>
    <div class="cols"><span>Toy</span><span>Current</span><span class="two"><span>Shaded object</span><span>Isometric block<em>The alt style</em></span></span></div>
  </div>
  <div id="rows"><div id="list"></div></div>
  <p class="note">Click a tile or an empty slot to mark it. Copy marks gives the list as JSON.</p>
</div>
<script type="module">
// The gallery that holds each toy's two alt styles.
// In every gallery, A is the Shaded object and D is the Isometric block.
const GALLERY = {
  chladni: 1, walker: 1, fire: 1, rain: 2, tvtree: 2, balloons: 2, morpher: 3, pop: 3, neon: 4, glass: 4,
  fidget: 5, pendulum: 5, ferro: 6, pool: 6, kaleido: 7, soap: 7, prism: 8, domino: 8, magnet: 9, putty: 9,
  pins: 10, scope: 10, galaxy: 11, bubbles: 12, trails: 13, oilslick: 'oilslick-1', foil: 15, fireworks: 17, sonar: 18,
  windmap: 19, window: 20, vortex: 24, launch: 31, dijkstra: 'dijkstra-1', spark: 'spark-16', washline: 'washline-1', cauldron: 'cauldron-1',
  meshball: 'meshball-1', washer: 'washer-2', ladder: 'ladder-1', windtunnel: 'windtunnel-1', schlieren: 'schlieren-1',
  lichtenberg: 'lichtenberg-2', steelwool: 'steelwool-1', lanterns: 'lanterns-1', tornado: 'tornado-3', drone: 'drone-1',
  terrarium: 'terrarium-1', wires: 'wires-1', subway: 'subway-1', bowl: 'bowl-1', marble: 'marble-1', plasma: 'plasma-1', snow: 'snow-1', postcard: 'postcard-2', rupert: 'rupert-2',
  windfarm: 'windfarm-1', harmono: 'harmono-1', carwash: 'carwash-2', rainstick: 'rainstick-1',
  calmjar: 'calmjar-1',
  deepvent: 'vent-1',
  spillway: 'spillway-1',
  aquarium: 'aquarium-1',
  chemgarden: 'chemgarden-1',
  moire: 'moire-1',
  waterwheel: 'waterwheel-1',
  volcano: 'volcano-1',
  spectrogram: 'spectrogram-1',
  bz: 'bz-1',
  jethover: 'jethover-1',
  peapod: 'peapod-1',
  calving: 'calving-1',
  doubleslit: 'doubleslit-1',
  aurora: 'aurora-1',
  hookloop: 'hookloop-1',
  geoboard: 'geoboard-1',
  epicycles: 'epicycles-1',
  piwalk: 'piwalk-1',
  contour: 'contour-1',
  sorting: 'sorting-1',
  jellyfish: 'jellyfish-1',
  wheat: 'wheat-1',
  supercon: 'supercon-1',
  tide: 'tide-1',
  eclipse: 'eclipse-1',
  cloudbottle: 'cloudbottle-1',
  wreckingball: 'wreckingball-1',
};
// A gallery that lacks one of the two letters.
const LACKS = { launch: ['a'], wires: ['d'] };
const COLS = [['a', 'Shaded object'], ['d', 'Isometric block']];
const KEY = 'stimming.icons.marks';

// Inside a gallery frame only one toy's A and D show, as two tiles.
const FRAME_CSS = `
html, body { background: transparent !important; }
body { margin: 0 !important; padding: 0 !important; overflow: hidden; }
.wrap, #out, main { max-width: none !important; margin: 0 !important; padding: 0 !important; gap: 0 !important; display: block !important; }
h1, h2, .lede, .dir > header, .dir > .tag, .idea, .pick, .size, .dir > .big { display: none !important; }
.emb, .embs { display: none !important; }
body.trans .icons, body.trans .flash, body.both .flash { display: none !important; }
body.trans .emb, body.trans .embs, body.both .emb, body.both .embs { display: block !important; }
body.both .emb, body.both .embs { margin-top: 6px !important; }
.glass { width: var(--tile) !important; height: var(--tile) !important; border-radius: 14px; background: oklch(0.12 0.01 275) !important; }
.glass::before, .glass::after { display: none !important; }
.glass i, .glass .em { width: 70% !important; height: auto !important; aspect-ratio: 1; }
section { display: grid !important; grid-template-columns: var(--tile) var(--tile) !important; gap: var(--gap) !important; align-items: start; margin: 0 !important; padding: 0 !important; border: 0 !important; }
section > .row, section > .dirs { display: contents !important; }
.dir { grid-row: 1; position: relative; display: block !important; padding: 0 !important; border: 0 !important; border-radius: 14px; cursor: pointer; }
.dir[data-col="0"] { grid-column: 1; } .dir[data-col="1"] { grid-column: 2; }
.icons { display: block !important; }
.t128, .t128 svg, .s128 { width: var(--tile) !important; height: var(--tile) !important; outline: none !important; }
.t64, .icons > div:has(.s64) { position: absolute !important; visibility: hidden !important; pointer-events: none; }
.dir.slot { display: grid !important; place-items: center; align-content: center !important; width: var(--tile); aspect-ratio: 1; border: 1px dashed oklch(0.3 0.016 275) !important;
  color: oklch(0.42 0.02 275); font: 500 10px/1.35 Gabarito, system-ui, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; }
.dir.marked .t128, .dir.marked .s128, .dir.marked .glass, .dir.slot.marked { outline: 2px solid oklch(0.85 0.14 85) !important; outline-offset: -2px; border-radius: 14px; }
`;

const $ = id => document.getElementById(id);
const marks = (() => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch { return new Set(); } })();
const docs = [];
let view = 'icon';

const names = await fetch('../toys.json').then(r => r.json()).catch(() => ({}));
// Tom's cut directions stay off the sheet; the slot says "cut".
const archived = await fetch('archive/cut.json').then(r => r.json()).catch(() => ({ cut: {} }));
const gone = new Set(Object.entries(archived.cut || {}).flatMap(([id, ls]) => ls.map(l => `${id}-${l.toLowerCase()}`)));

// The menu gives the toy list and the Current icons.
// It loads off screen at full width first, because its script fits each icon.
const menuFrame = Object.assign(document.createElement('iframe'), { src: '../index.html?lab', title: 'Current menu icons', id: 'live' });
$('rows').append(menuFrame);
await new Promise(r => { menuFrame.addEventListener('load', r, { once: true }); setTimeout(r, 6000); });
await new Promise(r => setTimeout(r, 900));
const menu = menuFrame.contentDocument;
// The order is toys.json: the main shelf by number, then the Lab by name.
// The menu says which toys it shows and which sit in the Lab.
const links = new Map([...(menu?.querySelectorAll('a.toy[id]') || [])].map(a => [a.id, !!a.closest('.lab')]));
const listed = Object.keys(names).filter(id => names[id]?.name);
const toys = links.size
  ? [...listed.filter(id => links.has(id)), ...[...links.keys()].filter(id => !listed.includes(id))].map(id => ({ id, lab: links.get(id) }))
  : listed.map(id => ({ id, lab: names[id].number == null }));
const nameOf = id => names[id]?.name ?? menu?.querySelector(`a.toy#${id}`)?.textContent.trim() ?? id;
// have: the gallery holds it. cut: Tom cut it. none: nobody drew it.
const stateOf = (id, l) => (GALLERY[id] == null || LACKS[id]?.includes(l) ? 'none' : gone.has(`${id}-${l}`) ? 'cut' : 'have');
const WORD = { have: '', cut: 'Cut', none: 'To draw' };

// Rows: the name, the Current icon, then the two alt slots.
const slot = (id, l, s) => `<div class="slot${s === 'have' ? ' load' : ''}" data-key="${id}-${l}" tabindex="0" role="button" aria-label="${nameOf(id)}, ${l === 'a' ? 'Shaded object' : 'Isometric block'}">${WORD[s]}</div>`;
const row = ({ id }) => {
  const emb = names[id]?.emblem;
  return `<section class="row" id="row-${id}" data-toy="${id}">
    <h2>${nameOf(id)}</h2>
    <div class="cell" data-key="${id}-current" tabindex="0" role="button" aria-label="${nameOf(id)}, Current">
      <div class="tile"></div>
      <div class="logo">${emb ? `<i style="--emblem: url(../${emb})"></i>` : ''}</div>
    </div>
    <div class="alts">${COLS.map(([l]) => slot(id, l, stateOf(id, l))).join('')}</div>
  </section>`;
};
const group = (title, list) => (list.length ? `<h3>${title} <span>· ${list.length}</span></h3>${list.map(row).join('')}` : '');
$('list').innerHTML = group('Main shelf', toys.filter(t => !t.lab)) + group('Lab', toys.filter(t => t.lab));

// The menu frame turns into the Current column: only its tiles stay, one on each row.
// A tile keeps its own listeners, styles and gradients, so its hover is the menu's own.
const tiles = new Map();
const NAKED = 'display: block !important; position: static !important; transform: none !important; filter: none !important; opacity: 1 !important; margin: 0 !important; padding: 0 !important; border: 0 !important; animation: none !important; transition: none !important; contain: none !important;';
function goLive() {
  if (!links.size) { menuFrame.remove(); return; }
  const keep = new Set(), off = n => n.style.setProperty('display', 'none', 'important');
  for (const a of menu.querySelectorAll('a.toy[id]')) {
    if (tiles.has(a.id) || !document.getElementById(`row-${a.id}`)) { off(a); continue; }
    tiles.set(a.id, a);
    for (let n = a.parentElement; n && n !== menu.documentElement; n = n.parentElement) keep.add(n);
  }
  // Everything that is not a tile, or on the way to one, goes.
  for (const n of keep) {
    for (const c of n.children) if (!keep.has(c) && !tiles.has(c.id) && !c.matches('svg.defs, script, style, link')) off(c);
    n.style.cssText += `; ${NAKED}`;
  }
  for (const a of tiles.values()) {
    for (const c of a.children) if (!c.matches('.obj')) off(c);
    a.style.cssText += '; position: absolute !important; left: 0 !important; display: grid !important; place-items: center !important; gap: 0 !important; margin: 0 !important; padding: 0 !important; opacity: 1 !important; filter: none !important; transform: none !important; transition: none !important;';
  }
  const css = menu.createElement('style');
  css.textContent = `
    html, body { background: transparent !important; overflow: hidden !important; margin: 0 !important; padding: 0 !important; min-height: 0 !important; }
    a.toy { width: var(--tile) !important; height: var(--tile) !important; border-radius: 14px !important; }
    a.toy .obj { width: 100% !important; height: 100% !important; max-width: none !important; }
    a.toy .obj svg { width: 90% !important; height: 90% !important; }
    a.toy .obj .series, a.toy .obj::after { display: none !important; }
    a.toy:focus-visible { outline: 2px solid oklch(0.84 0.13 205) !important; outline-offset: -2px !important; }`;
  menu.head.append(css);
  // A click marks the tile; it does not open the toy.
  menu.addEventListener('click', e => {
    const a = e.target.closest?.('a.toy');
    if (!a) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    toggle(`${a.id}-current`);
  }, true);
  menu.addEventListener('keydown', onKey);
  menuFrame.classList.add('on');
}
// Each tile sits on its row's Current cell.
const place = () => {
  if (!tiles.size) return;
  menuFrame.style.left = `${document.querySelector('.cell').offsetLeft}px`;
  for (const [id, a] of tiles) a.style.setProperty('top', `${document.querySelector(`#row-${id} .cell`).offsetTop}px`, 'important');
};
const count = l => toys.filter(t => stateOf(t.id, l) === 'have').length;
$('sum').innerHTML = `<b>${toys.length}</b> toys · <b>${count('a')}</b> shaded · <b>${count('d')}</b> isometric`;

// The tile size fits three columns; the name moves above them on phones.
const layout = () => {
  const w = $('list').clientWidth, narrow = matchMedia('(max-width: 640px)').matches;
  const tile = Math.floor(Math.min(128, narrow ? (w - 8 - 8) / 3 : (w - 160 - 64 - 14) / 3));
  for (const el of [document.documentElement, menu?.documentElement, ...docs.map(d => d.documentElement)]) {
    el?.style.setProperty('--tile', `${tile}px`);
    el?.style.setProperty('--gap', narrow ? '8px' : '14px');
  }
  place();
};

// Marks: a click toggles one; the list goes out as JSON.
const output = () => {
  const o = {};
  for (const { id } of toys) {
    const ls = ['current', 'a', 'd'].filter(l => marks.has(`${id}-${l}`)).map(l => ({ current: 'Current', a: 'Shaded object', d: 'Isometric block' })[l]);
    if (ls.length) o[id] = ls;
  }
  return JSON.stringify({ marked: o }, null, 2);
};
const paint = () => {
  for (const d of [document, ...docs]) for (const c of d.querySelectorAll('[data-key]')) c.classList.toggle('marked', marks.has(c.dataset.key));
  $('count').innerHTML = marks.size ? `<b>${marks.size}</b> marked` : '';
  $('copy').hidden = $('clear').hidden = !marks.size;
};
const toggle = key => {
  marks.has(key) ? marks.delete(key) : marks.add(key);
  try { localStorage.setItem(KEY, JSON.stringify([...marks])); } catch {}
  paint();
};
const onClick = e => { const c = e.target.closest('[data-key]'); if (c) toggle(c.dataset.key); };
const onKey = e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const c = e.target.closest?.('[data-key]');
  if (c && (e.key === 'Enter' || e.key === ' ')) { toggle(c.dataset.key); e.preventDefault(); }
  else if (e.key.toLowerCase() === 't') show(VIEWS[(VIEWS.indexOf(view) + 1) % VIEWS.length]);
};
document.addEventListener('click', onClick);
document.addEventListener('keydown', onKey);
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(output()); $('copy').textContent = 'Copied'; } catch { $('copy').textContent = 'Copy failed'; }
  setTimeout(() => { $('copy').textContent = 'Copy marks'; }, 1400);
});
$('clear').addEventListener('click', () => { marks.clear(); try { localStorage.removeItem(KEY); } catch {} paint(); });

// Icon, Intro logo (the luminance emblem) or Both, stacked in each cell.
const VIEWS = ['icon', 'trans', 'both'];
const show = v => {
  view = v;
  for (const d of [document, ...docs]) { d.body.classList.toggle('trans', v === 'trans'); d.body.classList.toggle('both', v === 'both'); }
  for (const n of VIEWS) $(`v-${n}`).setAttribute('aria-pressed', String(n === v));
  place();
};
for (const n of VIEWS) $(`v-${n}`).addEventListener('click', () => show(n));

// A gallery mounts when its row comes near the view, one at a time.
const base = new URL('./', location.href).href;
const sources = new Map();
const source = n => sources.get(n) ?? sources.set(n, fetch(`spike-${n}.html`).then(r => (r.ok ? r.text() : '')).catch(() => '')).get(n);
async function mount(sec) {
  const id = sec.dataset.toy, alts = sec.querySelector('.alts');
  const src = await source(GALLERY[id]);
  if (!src) return;
  const frame = document.createElement('iframe');
  frame.title = `${nameOf(id)}: Shaded object and Isometric block`;
  frame.className = 'wait';
  frame.setAttribute('scrolling', 'no');
  frame.srcdoc = src.replace(/<head>/i, `<head><base href="${base}">`).replace(/<\/head>/i, `<style>${FRAME_CSS}</style></head>`);
  alts.append(frame);
  // The cards are ready before the fonts and emblems finish; do not wait for those.
  await new Promise(r => {
    const t0 = performance.now();
    const poll = setInterval(() => {
      if (!frame.contentDocument?.querySelector('.dir svg') && performance.now() - t0 < 8000) return;
      clearInterval(poll);
      r();
    }, 60);
  });
  const doc = frame.contentDocument;
  let own = null;
  for (const s of doc.querySelectorAll('section')) {
    const first = s.querySelector('.dir');
    const toy = s.id?.replace(/^row-/, '') || (first?.id || first?.dataset.key || '').split('-')[0];
    // The first round of a toy is the one that follows the letters.
    if (toy === id && !own && !s.dataset.round) own = s; else s.remove();
  }
  if (!own) { frame.remove(); return; }
  const holder = own.querySelector('.row, .dirs') || own, kept = {};
  for (const card of own.querySelectorAll('.dir')) {
    const l = card.querySelector('b')?.textContent.trim().toLowerCase(), col = COLS.findIndex(c => c[0] === l);
    if (col < 0 || gone.has(`${id}-${l}`) || !card.querySelector('.t128, .s128')) { card.remove(); continue; }
    card.dataset.col = String(col);
    card.dataset.key = `${id}-${l}`;
    kept[l] = true;
  }
  // A missing letter keeps its slot, with the reason.
  COLS.forEach(([l], col) => {
    if (kept[l]) return;
    const s = stateOf(id, l) === 'cut' ? 'cut' : 'none';
    holder.insertAdjacentHTML('beforeend', `<article class="dir slot" data-col="${col}" data-key="${id}-${l}">${WORD[s]}</article>`);
  });
  docs.push(doc);
  doc.addEventListener('click', onClick);
  doc.addEventListener('keydown', onKey);
  layout();
  show(view);
  paint();
  for (const s of alts.querySelectorAll('.slot')) s.remove();
  frame.classList.remove('wait');
}
// Two galleries load at a time; the local server drops large bursts.
const queue = [];
let busy = 0;
const pump = async () => {
  if (busy >= 2) return;
  busy++;
  while (queue.length) await mount(queue.shift()).catch(() => {});
  busy--;
};
const near = new IntersectionObserver(es => {
  for (const e of es) {
    if (!e.isIntersecting) continue;
    near.unobserve(e.target);
    queue.push(e.target);
  }
  pump();
  pump();
}, { rootMargin: '600px 0px' });
for (const sec of document.querySelectorAll('.row')) {
  const id = sec.dataset.toy;
  if (COLS.some(([l]) => stateOf(id, l) === 'have')) near.observe(sec);
}
goLive();
layout();
paint();
addEventListener('resize', layout);
// A change of view changes the row heights; the tiles follow.
new ResizeObserver(place).observe($('list'));
</script>
</body>
