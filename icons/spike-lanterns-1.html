<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Lantern lake 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Lantern lake 1</h1>
<p class="lede">Lantern lake, round 1. A: one paper sky lantern over its broken reflection; the pointer is the wind. D: the lake is the block, the lantern floats over it and pools its light on the water.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The toy's tokens: lit rice paper, the flame, the dusk lake.
  const PAPER = [[0, 'oklch(0.66 0.16 44)'], [0.42, 'oklch(0.9 0.12 74)'], [0.58, 'oklch(0.92 0.11 78)'], [1, 'oklch(0.6 0.16 40)']];
  const INNER = [[0, 'oklch(0.99 0.07 95)', 0.75], [1, 'oklch(0.95 0.1 80)', 0]];
  const HALO = 'oklch(0.82 0.15 62)', MOUTH = 'oklch(0.5 0.13 38)', FLAME = 'oklch(0.99 0.06 96)';
  const GLINT = 'oklch(0.86 0.13 70)', SEAM = 'oklch(0.45 0.14 38)';

  // One sky lantern: a paper shade wide at the top, its mouth at the foot.
  // cx and top place it; w is the top width, h the height.
  const lantern = (cx, top, w, h) => {
    const s = w / 2, b = s * 0.72, y1 = top + h;
    return {
      // A domed crown on round shoulders, so it reads as a paper bag of hot air.
      shade: `M${f(cx - b)} ${f(y1)}L${f(cx - s)} ${f(top + h * 0.24)}C${f(cx - s * 0.98)} ${f(top - h * 0.06)} ${f(cx + s * 0.98)} ${f(top - h * 0.06)} ${f(cx + s)} ${f(top + h * 0.24)}L${f(cx + b)} ${f(y1)}Q${f(cx)} ${f(y1 + 6)} ${f(cx - b)} ${f(y1)}Z`,
      // Two soft panel seams run from the crown down to the mouth.
      seams: [-1, 1].map(k => poly([[cx + k * s * 0.34 - 2.2, top + h * 0.1], [cx + k * s * 0.34 + 2.2, top + h * 0.1], [cx + k * b * 0.4 + 1.8, y1 + 1.5], [cx + k * b * 0.4 - 1.8, y1 + 1.5]])).join(''),
      mouth: [cx, y1 + 0.5, b * 0.94, h * 0.08],
    };
  };
  // A lantern's markup: halo, shade, inner light, mouth, flame.
  const lanternMarkup = (u, L) => {
    const [mx, my, mrx, mry] = L.mouth;
    return `<ellipse class="halo" cx="${mx}" cy="${f(my - 18)}" rx="${f(mrx * 2.4)}" ry="${f(mrx * 2.4)}" fill="url(#${u}halo)" opacity="0.55"/>
      <path d="${L.shade}" fill="url(#${u}paper)"/>
      <path d="${L.seams}" fill="${SEAM}" opacity="0.22"/>
      <path d="${L.shade}" fill="url(#${u}inner)"/>
      <path d="${L.shade}" fill="url(#${u}lit)"/>
      <path d="${L.shade}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="${mx}" cy="${my}" rx="${f(mrx)}" ry="${f(mry)}" fill="${MOUTH}"/>
      <ellipse class="flame" cx="${mx}" cy="${f(my - 0.6)}" rx="${f(mrx * 0.32)}" ry="${f(mry * 0.7)}" fill="${FLAME}"/>`;
  };
  // The reflection: four bold dashes that break on the ripples.
  const REFL = [[18, 3.4, 0.8], [13, 3, 0.6], [9, 2.6, 0.42], [5, 2.2, 0.26]];
  const reflMarkup = (cx, y0, k = 1) => REFL.map(([w, h, o], i) => `<rect x="${f(cx - w * k / 2)}" y="${f(y0 + i * 6 * k)}" width="${f(w * k)}" height="${f(h * k)}" rx="${f(h * k / 2)}" fill="${GLINT}" opacity="${o}"/>`).join('');

  // The lantern's motion, shared by A and D.
  // The pointer is the wind: the lantern leans and drifts away from it.
  // Enter lifts it and lights the flame up; leave lets it settle.
  const drift = draw => {
    const st = { tilt: 0, dx: 0, lift: 0, fire: 0, t: 0, tiltTo: 0, dxTo: 0, liftTo: 0, fireTo: 0, live: false };
    const step = time => {
      st.t = time;
      const sway = st.live ? Math.sin(time * 1.7) * 1.6 : 0;
      st.tilt += (st.tiltTo + sway - st.tilt) * 0.12;
      st.dx += (st.dxTo - st.dx) * 0.08;
      st.lift += (st.liftTo - st.lift) * 0.06;
      st.fire += (st.fireTo - st.fire) * 0.15;
      draw(st);
      // The clock stops once the lantern rests.
      if (!st.live && Math.abs(st.tilt) + Math.abs(st.dx) + st.lift + st.fire < 0.05) { Object.assign(st, { tilt: 0, dx: 0, lift: 0, fire: 0 }); draw(st); loop.stop(); }
    };
    const loop = clock(step);
    draw(st);
    return {
      enter(p) {
        st.live = true; st.liftTo = 1; st.fireTo = 1; loop.start();
        if (p) this.move(p);
      },
      move(p) {
        if (!p) return;
        const wind = clamp((64 - p[0]) / 34, -1, 1);
        st.tiltTo = wind * 8; st.dxTo = wind * 6;
      },
      leave() { st.live = false; st.tiltTo = 0; st.dxTo = 0; st.liftTo = 0; st.fireTo = 0; loop.start(); },
    };
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover loop.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg, u) {
      svg.innerHTML = `<defs><clipPath id="${u}clip"><rect x="16" y="16" width="92" height="92" rx="4"/></clipPath><linearGradient id="${u}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.3 0.08 300)"/><stop offset="1" stop-color="oklch(0.55 0.13 35)"/></linearGradient><linearGradient id="${u}lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.42 0.11 35)"/><stop offset="1" stop-color="oklch(0.2 0.05 300)"/></linearGradient><radialGradient id="${u}glow"><stop offset="0" stop-color="oklch(0.9 0.12 70)" stop-opacity="0.7"/><stop offset="1" stop-color="oklch(0.8 0.15 55)" stop-opacity="0"/></radialGradient></defs>
        <g clip-path="url(#${u}clip)">
          <rect x="16" y="16" width="92" height="56" fill="url(#${u}sky)"/>
          <path d="M16 72V60L20 54L23 60L27 52L31 60L35 55L39 60L44 50L48 60L53 56L57 60L62 51L66 60L71 54L75 60L80 49L84 60L89 55L93 60L98 52L102 60L108 56V72Z" fill="oklch(0.17 0.03 300)"/>
          <rect x="16" y="72" width="92" height="36" fill="url(#${u}lake)"/>
          <g class="refl" opacity="0.75"><rect x="59" y="74" width="6" height="26" rx="3" fill="oklch(0.82 0.14 62)" opacity="0.55"/><rect x="60.5" y="80" width="3" height="4" fill="oklch(0.92 0.1 75)"/><rect x="60.5" y="88" width="3" height="3" fill="oklch(0.92 0.1 75)"/></g>
          <g class="lamp"><circle cx="62" cy="58" r="16" fill="url(#${u}glow)"/><path d="M55 48H69L67 66H57Z" fill="oklch(0.86 0.15 65)"/><path d="M55 48H69L68.6 52H55.4Z" fill="oklch(0.66 0.15 45)"/><ellipse cx="62" cy="62" rx="3" ry="2.2" fill="oklch(0.98 0.06 95)"/></g>
        </g>`;
      const lamp = svg.querySelector('.lamp'), refl = svg.querySelector('.refl');
      let tl = null;
      return {
        enter() {
          tl?.kill();
          tl = gsap.timeline({ repeat: -1, repeatDelay: 0.4 })
            .fromTo(lamp, { y: 0, rotation: 0 }, { y: -30, duration: 2.6, ease: 'sine.in' })
            .to(lamp, { rotation: 5, duration: 0.65, ease: 'sine.inOut', yoyo: true, repeat: 3, transformOrigin: '50% 0%' }, 0)
            .fromTo(refl, { opacity: 0.75 }, { opacity: 0, duration: 2.6, ease: 'sine.in' }, 0)
            .to(lamp, { opacity: 0, duration: 0.4 })
            .set(lamp, { y: 0, rotation: 0, opacity: 1 })
            .set(refl, { opacity: 0.75 });
        },
        move() {},
        leave() {
          tl?.kill(); tl = null;
          gsap.to(lamp, { y: 0, rotation: 0, opacity: 1, duration: 0.5, overwrite: true });
          gsap.to(refl, { opacity: 0.75, duration: 0.4, overwrite: true });
        },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // One big sky lantern, free on the ground, over its broken reflection.
  const A_L = lantern(64, 22, 60, 64);
  const A_REFL_Y = 100;
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [31, 11, 66, 110],
    idea: 'One paper sky lantern, lit from inside: wide at the top, the mouth and the flame at its foot, a warm halo. Under it, its reflection breaks on the ripples. The pointer is the wind: the lantern leans and drifts away from it and the reflection follows. Hover lifts it, the flame flares and the reflection thins.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 1.2)}
          ${lg(`${u}paper`, PAPER, 'x1="0" y1="0" x2="1" y2="0"')}
          ${rg(`${u}inner`, INNER, 'cx="0.5" cy="1" r="0.75"')}
          ${rg(`${u}halo`, [[0, HALO, 0.75], [1, HALO, 0]])}</defs>
        <g class="refl" filter="url(#${u}b)">${reflMarkup(64, A_REFL_Y)}</g>
        <g class="lamp">${lanternMarkup(u, A_L)}</g>`;
      const lamp = svg.querySelector('.lamp'), refl = svg.querySelector('.refl');
      const flame = svg.querySelector('.flame'), halo = svg.querySelector('.halo');
      const [mx, my, mrx, mry] = A_L.mouth;
      return drift(st => {
        const up = st.lift * 6;
        lamp.setAttribute('transform', `translate(${f(st.dx)} ${f(-up)}) rotate(${f(st.tilt)} 64 54)`);
        // The reflection sits on the water; it only slides and thins.
        refl.setAttribute('transform', `translate(${f(st.dx * 1.3)} 0)`);
        refl.setAttribute('opacity', f(1 - st.lift * 0.45));
        const flick = st.fire * (0.18 * Math.sin(st.t * 23) + 0.12 * Math.sin(st.t * 37));
        flame.setAttribute('rx', f(mrx * (0.32 + 0.12 * st.fire + 0.05 * flick)));
        flame.setAttribute('ry', f(mry * (0.7 + 0.25 * st.fire + flick)));
        halo.setAttribute('opacity', f(0.55 + 0.35 * st.fire + 0.08 * flick));
      });
    },
    emblem: `${EMB_HEAD}<path d="${A_L.shade}" fill="#fff"/><ellipse cx="${A_L.mouth[0]}" cy="${A_L.mouth[1]}" rx="${f(A_L.mouth[2])}" ry="${f(A_L.mouth[3])}" fill="#000"/>${REFL.map(([w, h], i) => `<rect x="${f(64 - w / 2)}" y="${f(A_REFL_Y + i * 6)}" width="${w}" height="${h}" rx="${h / 2}" fill="#fff"/>`).join('')}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The lake is the block: dusk water on top, deep water on the faces.
  // The lantern floats over it and pools its light on the water.
  const CY = 86, HALF = 24, T = 15;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const [N, E, S, W] = D_TOP;
  const down = p => [p[0], p[1] + T];
  const D_L = lantern(64, 22, 38, 40);
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [22, 12, 84, 112],
    idea: 'The lake is the block: dusk water on the top, from ember near the shore to violet, deep water on the left and right faces, a rim on the top edges. A lantern floats over it and pools warm light on the water, with a reflection streak. The pointer is the wind: the lantern leans and drifts, and its pool and streak slide after it. Hover lifts it; the pool spreads and dims.',
    art(svg, u) {
      const top = poly(D_TOP);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}s`, 1.1)}
          ${lg(`${u}paper`, PAPER, 'x1="0" y1="0" x2="1" y2="0"')}
          ${rg(`${u}inner`, INNER, 'cx="0.5" cy="1" r="0.75"')}
          ${rg(`${u}halo`, [[0, HALO, 0.75], [1, HALO, 0]])}
          ${rg(`${u}pool`, [[0, HALO, 0.85], [1, HALO, 0]])}
          ${lg(`${u}water`, [[0, 'oklch(0.56 0.14 38)'], [0.55, 'oklch(0.42 0.11 20)'], [1, 'oklch(0.3 0.08 300)']], 'x1="0.3" y1="0" x2="0.5" y2="1"')}
          <clipPath id="${u}tc"><path d="${top}"/></clipPath></defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 290)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="oklch(0.3 0.07 300)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="oklch(0.2 0.05 300)"/>
        <path d="${top}" fill="url(#${u}water)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <g clip-path="url(#${u}tc)">
          <ellipse class="pool" cx="64" cy="${CY}" rx="22" ry="12" fill="url(#${u}pool)" opacity="0.7"/>
          <g class="refl" filter="url(#${u}s)">${reflMarkup(64, CY - 6, 0.85)}</g>
        </g>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g class="lamp">${lanternMarkup(u, D_L)}</g>`;
      const lamp = svg.querySelector('.lamp'), refl = svg.querySelector('.refl'), pool = svg.querySelector('.pool');
      const flame = svg.querySelector('.flame'), halo = svg.querySelector('.halo');
      const [mx, my, mrx, mry] = D_L.mouth;
      return drift(st => {
        const up = st.lift * 5;
        lamp.setAttribute('transform', `translate(${f(st.dx)} ${f(-up)}) rotate(${f(st.tilt)} 64 42)`);
        refl.setAttribute('transform', `translate(${f(st.dx * 1.2)} 0)`);
        refl.setAttribute('opacity', f(1 - st.lift * 0.4));
        pool.setAttribute('cx', f(64 + st.dx * 1.2));
        pool.setAttribute('rx', f(22 + st.lift * 6)); pool.setAttribute('ry', f(12 + st.lift * 3));
        pool.setAttribute('opacity', f(0.7 + 0.2 * st.fire - 0.3 * st.lift));
        const flick = st.fire * (0.18 * Math.sin(st.t * 23) + 0.12 * Math.sin(st.t * 37));
        flame.setAttribute('rx', f(mrx * (0.32 + 0.12 * st.fire + 0.05 * flick)));
        flame.setAttribute('ry', f(mry * (0.7 + 0.25 * st.fire + flick)));
        halo.setAttribute('opacity', f(0.55 + 0.35 * st.fire + 0.08 * flick));
      });
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/><path d="${D_L.shade}" fill="#fff"/><ellipse cx="${D_L.mouth[0]}" cy="${D_L.mouth[1]}" rx="${f(D_L.mouth[2])}" ry="${f(D_L.mouth[3])}" fill="#000"/></svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Lantern lake';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-lanterns';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `lanterns-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
