<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Electrolysis 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Electrolysis 1</h1>
<p class="lede">Electrolysis, round 1. The toy is not built; this is an icon only. A: a glass cell of indicator, two rods; hover switches the current on. D: the cell is the block.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The toy's tokens: green indicator water, graphite rods, red and violet clouds.
  const GLASS = [[0, 'oklch(0.92 0.02 200)', 0.45], [0.28, 'oklch(0.75 0.02 200)', 0.08], [0.78, 'oklch(0.75 0.02 200)', 0.08], [1, 'oklch(0.92 0.02 200)', 0.4]];
  const WATER = [[0, 'oklch(0.72 0.12 150)'], [1, 'oklch(0.48 0.1 160)']];
  const ROD = [[0, 'oklch(0.5 0.01 250)'], [0.5, 'oklch(0.32 0.01 250)'], [1, 'oklch(0.2 0.01 250)']];
  const ACID = 'oklch(0.66 0.21 30)', BASE = 'oklch(0.52 0.2 300)';
  const PLUS = 'oklch(0.62 0.21 28)', MINUS = 'oklch(0.24 0.01 250)', BUBBLE = 'oklch(0.97 0.02 180)';
  const BAR = [[0, 'oklch(0.36 0.02 250)'], [1, 'oklch(0.22 0.015 250)']];

  // The cell, shared by A and D.
  // Hover switches the current on: gas streams off both rods, twice as much
  // at the minus rod, and the indicator blooms red at plus, violet at minus.
  // The pointer near a rod drives it harder. Leave, and the clouds fade back.
  const REST = 0.45;
  const cell = (draw, rods) => {
    const st = { on: 0, onTo: 0, c: REST, t: 0, near: [0.5, 0.5], live: false };
    const step = time => {
      st.t = time;
      st.on += (st.onTo - st.on) * 0.12;
      st.c += ((st.live ? 1 : REST) - st.c) * (st.live ? 0.012 : 0.03);
      draw(st);
      if (!st.live && st.on < 0.01 && Math.abs(st.c - REST) < 0.005) { st.on = 0; st.c = REST; draw(st); loop.stop(); }
    };
    const loop = clock(step);
    draw(st);
    return {
      enter(p) { st.live = true; st.onTo = 1; loop.start(); if (p) this.move(p); },
      move(p) {
        if (!p) return;
        const d = rods.map(x => Math.abs(p[0] - x));
        st.near = d.map(v => clamp(1.4 - v / 30, 0.4, 1.4));
      },
      leave() { st.live = false; st.onTo = 0; st.near = [0.5, 0.5]; loop.start(); },
    };
  };
  // Bubbles rise from a rod: each takes a turn, in a column that wavers.
  const bubbles = (els, x, y0, y1, rate, st, phase) => els.forEach((b, i) => {
    const ph = ((st.t * rate + i / els.length + phase) % 1 + 1) % 1;
    b.setAttribute('cx', f(x + 3.2 * Math.sin(ph * 9 + i)));
    b.setAttribute('cy', f(lerp(y0, y1, ph)));
    b.setAttribute('opacity', f(st.on * Math.min(1, ph * 8) * (1 - ph * 0.4)));
  });
  // A cloud: three soft blobs round a point, grown by the charge.
  const cloudMarkup = (cls, col) => `<g class="${cls}" fill="${col}">${[[-5, 2, 1], [5, -3, 0.85], [0, -9, 0.7]].map(([dx, dy, r]) => `<circle data-dx="${dx}" data-dy="${dy}" data-r="${r}"/>`).join('')}</g>`;
  const placeCloud = (g, x, y, size, op) => [...g.children].forEach(c => {
    c.setAttribute('cx', f(x + +c.dataset.dx * size / 14)); c.setAttribute('cy', f(y + +c.dataset.dy * size / 14));
    c.setAttribute('r', f(size * +c.dataset.r)); c.setAttribute('opacity', f(op));
  });

  const DIRS = [];

  /* ================= Current ================= */

  // Electrolysis is not built; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NOT BUILT</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // A glass cell of green indicator; a bar across the top holds two rods.
  const A_CELL = 'M24 48H104V100Q104 110 94 110H34Q24 110 24 100Z';
  const A_BAR = 'M18 38Q18 34 22 34H106Q110 34 110 38V44Q110 48 106 48H22Q18 48 18 44Z';
  const RX = [46, 82], SURF = 54, TIP = 98;
  const A_ROD = x => `M${x - 4} 30V${TIP - 3}Q${x - 4} ${TIP + 1} ${x} ${TIP + 1}Q${x + 4} ${TIP + 1} ${x + 4} ${TIP - 3}V30Z`;
  const A_CAP = x => `M${x - 6} 24Q${x - 6} 20 ${x - 2} 20H${x + 2}Q${x + 6} 20 ${x + 6} 24V33H${x - 6}Z`;
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [17, 18, 94, 94],
    idea: 'A glass cell of green indicator water. A dark bar across the top holds two graphite rods, a red cap on plus, a black cap on minus. At rest a red cloud hangs at plus and a violet one at minus. Hover switches on the current: gas streams up both rods, twice as much at minus, and the clouds bloom and spread. The pointer near a rod drives it harder. Leave, and the gas stops and the clouds fade back.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}c`, 4.5)}
          ${lg(`${u}glass`, GLASS, 'x1="0" y1="0" x2="1" y2="0"')}${lg(`${u}water`, WATER)}
          ${lg(`${u}rod`, ROD, 'x1="0" y1="0" x2="1" y2="0"')}${lg(`${u}bar`, BAR)}
          <clipPath id="${u}in"><path d="${A_CELL}"/></clipPath></defs>
        <ellipse cx="64" cy="112" rx="44" ry="3.6" fill="oklch(0.05 0.01 250)" opacity="0.6" filter="url(#${u}b)"/>
        <g clip-path="url(#${u}in)">
          <rect x="24" y="${SURF}" width="80" height="60" fill="url(#${u}water)"/>
          <g filter="url(#${u}c)">${cloudMarkup('acid', ACID)}${cloudMarkup('base', BASE)}</g>
          ${RX.map(x => body(A_ROD(x), u, 'rod')).join('')}
          <g>${Array.from({ length: 12 }, () => `<circle class="bb" r="2.4" fill="${BUBBLE}" opacity="0"/>`).join('')}</g>
          <rect x="24" y="${SURF - 1}" width="80" height="2.4" fill="#fff" opacity="0.45"/>
        </g>
        <path d="${A_CELL}" fill="url(#${u}glass)"/>
        <path d="${A_CELL}" fill="url(#${u}lit)"/>
        <path d="${A_CELL}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
        ${body(A_BAR, u, 'bar')}
        <path d="${A_CAP(RX[0])}" fill="${PLUS}"/><path d="${A_CAP(RX[0])}" fill="url(#${u}lit)"/>
        <path d="${A_CAP(RX[1])}" fill="${MINUS}"/><path d="${A_CAP(RX[1])}" fill="url(#${u}lit)"/>
        <path d="M${RX[0] - 2.6} 26.4H${RX[0] + 2.6}M${RX[0]} 23.8V29M${RX[1] - 2.6} 26.4H${RX[1] + 2.6}" stroke="#fff" stroke-width="2" stroke-linecap="round"/>`;
      const acid = svg.querySelector('.acid'), base = svg.querySelector('.base'), bb = [...svg.querySelectorAll('.bb')];
      return cell(st => {
        placeCloud(acid, RX[0], 86 - 10 * st.c, 10 + 12 * st.c * (0.7 + 0.3 * st.near[0]), 0.55 + 0.35 * st.c);
        placeCloud(base, RX[1], 86 - 10 * st.c, 10 + 12 * st.c * (0.7 + 0.3 * st.near[1]), 0.55 + 0.35 * st.c);
        bubbles(bb.slice(0, 4), RX[0], TIP - 6, SURF + 2, 0.55 * st.near[0], st, 0);
        bubbles(bb.slice(4), RX[1], TIP - 6, SURF + 2, 0.7 * st.near[1], st, 0.3);
      }, RX);
    },
    emblem: `${EMB_HEAD}<path d="${A_CELL}" fill="#fff" opacity="0.45"/><path d="${A_BAR}${A_CAP(RX[0])}${A_CAP(RX[1])}" fill="#fff"/><path d="${A_ROD(RX[0])}${A_ROD(RX[1])}" fill="#fff"/><circle cx="${RX[0]}" cy="84" r="13" fill="#fff" opacity="0.7"/><circle cx="${RX[1]}" cy="84" r="13" fill="#000" opacity="0.5"/></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The cell is the block: a glass cube of green water, two rods through its top.
  const CY = 40, HALF = 24, T = 42;
  const iso = (gx, gy, h = 0) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5 + T - h];
  const corners = h => [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y, h));
  const [Nt, Et, St, Wt] = corners(T), [Nb, Eb, Sb, Wb] = corners(0);
  const W_H = T - 6;
  const RODS = [[-12, 4], [6, -14]].map(([gx, gy]) => ({ top: iso(gx, gy, T + 12), tip: iso(gx, gy, 8) }));
  const rodD = r => { const x = r.top[0]; return `M${f(x - 3.4)} ${f(r.top[1])}V${f(r.tip[1] - 2)}Q${f(x)} ${f(r.tip[1] + 2)} ${f(x + 3.4)} ${f(r.tip[1] - 2)}V${f(r.top[1])}Z`; };
  const capD = (r, w = 5.5) => { const x = r.top[0], y = r.top[1]; return `M${f(x - w)} ${f(y + 2)}V${f(y - 5)}A${w} ${f(w * 0.5)} 0 0 1 ${f(x + w)} ${f(y - 5)}V${f(y + 2)}A${w} ${f(w * 0.5)} 0 0 1 ${f(x - w)} ${f(y + 2)}Z`; };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [20, 12, 88, 100],
    idea: 'The cell is the block: a glass cube of green indicator water, a rim on its top edges. Two graphite rods stand through the top, a red cap on plus and a black cap on minus. Hover switches the current on: gas streams up both rods and the red and violet clouds bloom inside the cube. The pointer near a rod drives it harder.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}c`, 4)}
          ${lg(`${u}glass`, GLASS, 'x1="0" y1="0" x2="1" y2="0"')}${lg(`${u}water`, WATER)}${lg(`${u}rod`, ROD, 'x1="0" y1="0" x2="1" y2="0"')}
          <clipPath id="${u}in"><path d="${poly([corners(W_H)[0], corners(W_H)[1], Eb, Sb, Wb, corners(W_H)[3]])}"/></clipPath></defs>
        <path d="${poly([Eb, Sb, Wb, [Wb[0], Wb[1] + 4], [Sb[0], Sb[1] + 4], [Eb[0], Eb[1] + 4]])}" fill="oklch(0.05 0.01 250)" opacity="0.5" filter="url(#${u}b)"/>
        <path d="${poly([Nt, Et, Eb, Sb, Wb, Wt])}" fill="oklch(0.2 0.015 250)" opacity="0.5"/>
        <g clip-path="url(#${u}in)">
          <path d="${poly([corners(W_H)[0], corners(W_H)[1], Eb, Sb, Wb, corners(W_H)[3]])}" fill="url(#${u}water)"/>
          <g filter="url(#${u}c)">${cloudMarkup('acid', ACID)}${cloudMarkup('base', BASE)}</g>
        </g>
        ${RODS.map(r => body(rodD(r), u, 'rod')).join('')}
        <g clip-path="url(#${u}in)">${Array.from({ length: 12 }, () => `<circle class="bb" r="2" fill="${BUBBLE}" opacity="0"/>`).join('')}</g>
        <path d="${poly(corners(W_H))}" fill="oklch(0.86 0.08 150)" opacity="0.35"/>
        <path d="${poly([Wt, St, Sb, Wb])}" fill="url(#${u}glass)"/>
        <path d="${poly([St, Et, Eb, Sb])}" fill="url(#${u}glass)"/>
        <path d="${poly([St, Et, Eb, Sb])}" fill="#000" opacity="0.12"/>
        <path d="${poly([Nt, Et, St, Wt])}" fill="url(#${u}lit)"/>
        <path d="M${f(Wt[0])} ${f(Wt[1])}L${f(Nt[0])} ${f(Nt[1])}L${f(Et[0])} ${f(Et[1])}" stroke="#fff" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(Wt[0])} ${f(Wt[1])}L${f(St[0])} ${f(St[1])}L${f(Et[0])} ${f(Et[1])}M${f(St[0])} ${f(St[1])}V${f(Sb[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="${capD(RODS[0])}" fill="${PLUS}"/><path d="${capD(RODS[0])}" fill="url(#${u}lit)"/>
        <path d="${capD(RODS[1])}" fill="${MINUS}"/><path d="${capD(RODS[1])}" fill="url(#${u}lit)"/>`;
      const acid = svg.querySelector('.acid'), base = svg.querySelector('.base'), bb = [...svg.querySelectorAll('.bb')];
      const surfY = r => iso(0, 0, W_H)[1] + (r.top[1] - iso(0, 0, T + 12)[1]);
      return cell(st => {
        RODS.forEach((r, k) => placeCloud(k ? base : acid, r.tip[0], r.tip[1] - 12 - 8 * st.c, 8 + 10 * st.c * (0.7 + 0.3 * st.near[k]), 0.55 + 0.35 * st.c));
        bubbles(bb.slice(0, 4), RODS[0].tip[0], RODS[0].tip[1] - 4, surfY(RODS[0]) + 2, 0.55 * st.near[0], st, 0);
        bubbles(bb.slice(4), RODS[1].tip[0], RODS[1].tip[1] - 4, surfY(RODS[1]) + 2, 0.7 * st.near[1], st, 0.3);
      }, RODS.map(r => r.top[0]));
    },
    emblem: `${EMB_HEAD}<path d="${poly([Wt, St, Sb, Wb])}" fill="#5a5a5a"/><path d="${poly([St, Et, Eb, Sb])}" fill="#3a3a3a"/><path d="${poly([Nt, Et, St, Wt])}" fill="#8a8a8a"/><path d="${rodD(RODS[0])}${rodD(RODS[1])}${capD(RODS[0])}${capD(RODS[1])}" fill="#fff"/></svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Electrolysis';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-electrolysis';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `electrolysis-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
