<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Night vision 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Night vision 1</h1>
<p class="lede">Night vision, round 1. No pick yet. A: dual-tube goggles on their helmet arm, a small 3D model; the tubes aim at the pointer, glow green and catch the field strobe. D: the goggles standing on their hard case.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The menu tile's ids take the tile prefix, so three copies can live.
  const ids = (m, u) => m.replace(/id="([^"]+)"/g, `id="${u}$1"`).replace(/url\(#([^)]+)\)/g, `url(#${u}$1)`).replace(/href="#([^"]+)"/g, `href="#${u}$1"`);

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today: two green circles on a dark square, a strobe in the field.
  const CUR = `<defs><clipPath id="nvg-clip"><circle cx="47" cy="62" r="25"/><circle cx="77" cy="62" r="25"/></clipPath></defs>
    <rect x="16" y="16" width="92" height="92" fill="oklch(0.1 0.01 150)"/>
    <g clip-path="url(#nvg-clip)">
      <rect x="16" y="30" width="92" height="64" fill="oklch(0.55 0.16 138)"/>
      <path d="M16 70L24 58L30 64L38 48L46 62L54 54L60 60L68 44L76 58L84 52L92 62L100 50L108 60V94H16Z" fill="oklch(0.33 0.11 140)"/>
      <rect x="16" y="74" width="92" height="20" fill="oklch(0.45 0.14 138)"/>
      <circle id="nvg-strobe" cx="62" cy="72" r="2.6" fill="oklch(0.97 0.05 120)" opacity="0.2"/>
    </g>`;
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    box: 'bbox',
    art(svg, u) {
      svg.innerHTML = ids(CUR, u);
      const s = svg.querySelector(`#${u}nvg-strobe`);
      let tl = null;
      return {
        enter() { tl = gsap.timeline({ repeat: -1, repeatDelay: 0.85 }).fromTo(s, { opacity: 1, scale: 1.8, svgOrigin: '62 72' }, { opacity: 0.2, scale: 1, svgOrigin: '62 72', duration: 0.15, ease: 'power2.out' }); },
        move() {},
        leave() { tl?.kill(); gsap.to(s, { opacity: 0.2, scale: 1, svgOrigin: '62 72', duration: 0.3, overwrite: true }); },
      };
    },
  });

  /* ================= The goggles ================= */

  // The goggles are a small 3D model: each part is a flat face pushed toward the viewer.
  // The aim v is the screen step from the back of a tube to its front.
  const AIM_L = 30, REST = [-6, 9.5], NSEG = 72;
  // The toy's tokens: graphite housing, black rubber, coated glass, phosphor green.
  const GREEN = 'oklch(0.8 0.2 140)';
  const gogDefs = u => `${light(u)}${blur(`${u}b`, 3)}${blur(`${u}g`, 7)}${blur(`${u}g2`, 3.5)}
    ${lg(`${u}side`, [[0, 'oklch(0.24 0.01 165)'], [1, 'oklch(0.09 0.008 165)']])}
    ${lg(`${u}face`, [[0, 'oklch(0.34 0.012 165)'], [0.6, 'oklch(0.2 0.011 165)'], [1, 'oklch(0.13 0.01 165)']], 'x1="0.2" y1="0" x2="0.7" y2="1"')}
    ${lg(`${u}rub`, [[0, 'oklch(0.22 0.006 165)'], [1, 'oklch(0.08 0.005 165)']])}
    ${lg(`${u}rface`, [[0, 'oklch(0.3 0.008 165)'], [1, 'oklch(0.11 0.008 165)']], 'x1="0.2" y1="0" x2="0.7" y2="1"')}
    ${rg(`${u}glass`, [[0, 'oklch(0.34 0.1 285)'], [0.55, 'oklch(0.17 0.07 280)'], [1, 'oklch(0.07 0.02 275)']], 'cx="0.42" cy="0.38" r="0.62"')}
    ${rg(`${u}halo`, [[0, 'oklch(0.72 0.2 140)', 0.9], [0.5, 'oklch(0.6 0.18 140)', 0.35], [1, 'oklch(0.5 0.16 140)', 0]])}`;

  // The squash foreshortens a face along the aim.
  const squash = v => {
    const l = Math.hypot(v[0], v[1]), a = Math.atan2(v[1], v[0]);
    return { c: Math.cos(a), s: Math.sin(a), k: Math.sqrt(Math.max(0.25, 1 - (l / AIM_L) ** 2)) };
  };
  const sq = (q, x, y) => { const s = (x * q.c + y * q.s) * q.k, w = -x * q.s + y * q.c; return [s * q.c - w * q.s, s * q.s + w * q.c]; };
  const ringPts = r => Array.from({ length: NSEG }, (_, i) => { const t = (i / NSEG) * Math.PI * 2; return [r * Math.cos(t), r * Math.sin(t)]; });
  const rrectPts = (w, h, r) => {
    const pts = [], cs = [[w / 2 - r, h / 2 - r], [-w / 2 + r, h / 2 - r], [-w / 2 + r, -h / 2 + r], [w / 2 - r, -h / 2 + r]];
    cs.forEach(([cx, cy], i) => { for (let j = 0; j <= 8; j++) { const t = ((i + j / 8) * Math.PI) / 2; pts.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]); } });
    return pts;
  };
  // A shape placed at depth d: its centre moves by d times the aim.
  const place = (pts, c, q, v, d) => pts.map(([x, y]) => { const p = sq(q, x, y); return [c[0] + v[0] * d + p[0], c[1] + v[1] * d + p[1]]; });
  const hull = P => {
    const p = [...P].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const q of p) { while (lo.length >= 2 && cr(lo.at(-2), lo.at(-1), q) <= 0) lo.pop(); lo.push(q); }
    for (const q of p.reverse()) { while (up.length >= 2 && cr(up.at(-2), up.at(-1), q) <= 0) up.pop(); up.push(q); }
    return lo.slice(0, -1).concat(up.slice(0, -1));
  };
  // A prism: the side is the hull of the back and front faces.
  const side = (pts, c, q, v, d0, d1) => poly(hull(place(pts, c, q, v, d0).concat(place(pts, c, q, v, d1))));
  const face = (pts, c, q, v, d) => poly(place(pts, c, q, v, d));

  // The parts in the model frame: two tubes, the bridge, the arm and the hinge.
  const TUBES = [[40, 64], [88, 64]];
  const BAR = ringPts(18.5), RING = ringPts(22.5), CELL = ringPts(17), GLASS = ringPts(16);
  const BRIDGE = { pts: rrectPts(50, 32, 10), c: [64, 52] };
  const ARM = { pts: rrectPts(24, 20, 6), c: [64, 31] };
  const KNOB = { pts: ringPts(5.6), c: [64, 31] };
  const SHOE = { pts: rrectPts(34, 11, 4), c: [64, 38] };
  const HEAD = { pts: rrectPts(38, 10, 4), c: [64, 19] };
  const EYE = ringPts(16.5);
  const IR = { pts: ringPts(4.6), c: [64, 54] };
  // Knurl ribs on the focus ring, every 30 degrees.
  const RIBS = Array.from({ length: 12 }, (_, i) => (i / 12) * Math.PI * 2 + 0.26);

  const gogMarkup = u => {
    const P = (cls, fill, extra = '') => `<path class="${cls}" fill="${fill}"${extra}/>`;
    const B = (cls, fill) => `${P(cls, `url(#${u}${fill})`)}${P(cls, `url(#${u}lit)`)}${P(cls, 'none', ` stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"`)}`;
    // A side in shade takes the rim but no glint.
    const S = (cls, fill) => `${P(cls, `url(#${u}${fill})`)}${P(cls, 'none', ` stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"`)}`;
    const tube = i => `<g class="tube${i}">
        ${B(`t${i}bar`, 'side')}
        ${S(`t${i}rs`, 'rub')}
        <clipPath id="${u}rc${i}"><path class="t${i}rs"/></clipPath>
        <path class="t${i}ribs" clip-path="url(#${u}rc${i})" fill="none" stroke="oklch(0.06 0.005 165)" stroke-width="3" opacity="0.9"/>
        ${B(`t${i}rf`, 'rface')}
        ${P(`t${i}cell`, 'oklch(0.06 0.006 270)')}
        <clipPath id="${u}cl${i}"><path class="t${i}cell"/></clipPath>
        <g clip-path="url(#${u}cl${i})">
          ${P(`t${i}gl`, `url(#${u}glass)`)}
          <path class="t${i}coat" fill="none" stroke="${GREEN}" stroke-width="3.4" stroke-linecap="round"/>
          <path class="t${i}coat2" fill="none" stroke="oklch(0.7 0.14 300)" stroke-width="2.6" stroke-linecap="round" opacity="0.7"/>
          <ellipse class="t${i}glint" rx="5.4" ry="3.4" fill="#fff" opacity="0.5"/>
          <circle class="t${i}strobe" r="2" fill="oklch(0.98 0.06 130)" opacity="0"/>
        </g>
      </g>`;
    return `<g class="spill" filter="url(#${u}g)">${TUBES.map((_, i) => `<circle class="sp${i}" r="19" fill="oklch(0.74 0.2 140)"/>`).join('')}</g>
      <ellipse class="halo" cx="64" cy="56" rx="62" ry="50" fill="url(#${u}halo)" opacity="0.2"/>
      ${TUBES.map((_, i) => S(`eye${i}`, 'rub')).join('')}
      ${S('head', 'side')}${B('headf', 'face')}
      ${S('arm', 'side')}${B('armf', 'face')}${S('knob', 'rub')}${B('knobf', 'rface')}
      ${S('brs', 'side')}${B('brf', 'face')}
      ${S('shoe', 'side')}${B('shoef', 'face')}
      ${P('irs', 'oklch(0.14 0.01 165)')}${P('irf', 'oklch(0.12 0.03 20)')}<circle class="irglow" r="3" fill="oklch(0.62 0.2 25)" opacity="0" filter="url(#${u}g2)"/>
      <g class="tubes">${tube(0)}${tube(1)}</g>`;
  };

  // The live model: v is the aim, k the power of the tubes (0 to 1).
  const gogModel = svg => {
    const $ = c => [...svg.querySelectorAll('.' + c)];
    const set = (c, d) => $(c).forEach(e => e.setAttribute('d', d));
    const tubesG = svg.querySelector('.tubes'), t0 = svg.querySelector('.tube0'), t1 = svg.querySelector('.tube1');
    const halo = svg.querySelector('.halo'), irg = svg.querySelector('.irglow');
    const sps = $('sp0').concat($('sp1')), pools = $('pool');
    const draw = (v, k, time = 0) => {
      const q = squash(v);
      TUBES.forEach((c, i) => set(`eye${i}`, side(EYE, c, q, v, -0.75, 0)));
      set('head', side(HEAD.pts, HEAD.c, q, v, -0.95, -0.55)); set('headf', face(HEAD.pts, HEAD.c, q, v, -0.55));
      set('arm', side(ARM.pts, ARM.c, q, v, -0.6, -0.2)); set('armf', face(ARM.pts, ARM.c, q, v, -0.2));
      set('knob', side(KNOB.pts, KNOB.c, q, v, -0.2, 0.05)); set('knobf', face(KNOB.pts, KNOB.c, q, v, 0.05));
      set('brs', side(BRIDGE.pts, BRIDGE.c, q, v, 0, 0.5)); set('brf', face(BRIDGE.pts, BRIDGE.c, q, v, 0.5));
      set('shoe', side(SHOE.pts, SHOE.c, q, v, 0.2, 0.58)); set('shoef', face(SHOE.pts, SHOE.c, q, v, 0.58));
      set('irs', side(IR.pts, IR.c, q, v, 0.5, 0.66)); set('irf', face(IR.pts, IR.c, q, v, 0.66));
      const ir = place([[0, 0]], IR.c, q, v, 0.66)[0];
      irg.setAttribute('cx', f(ir[0])); irg.setAttribute('cy', f(ir[1])); irg.setAttribute('opacity', f(0.9 * k));
      // The near tube draws last.
      if (v[0] < 0) tubesG.append(t1); else tubesG.append(t0);
      TUBES.forEach((c, i) => {
        set(`t${i}bar`, side(BAR, c, q, v, 0, 0.7));
        set(`t${i}rs`, side(RING, c, q, v, 0.62, 1));
        const rf = place(RING, c, q, v, 1);
        set(`t${i}rf`, poly(rf) + poly(place(CELL, c, q, v, 1).reverse()));
        set(`t${i}cell`, poly(place(CELL, c, q, v, 1)));
        set(`t${i}gl`, poly(place(GLASS, c, q, v, 0.86)));
        // Ribs show on the side of the ring that faces away from the aim.
        const al = Math.hypot(v[0], v[1]);
        const ribs = al < 1.5 ? '' : RIBS.map(t => {
          const n = [Math.cos(t), Math.sin(t)], w = sq(q, n[0], n[1]);
          if (w[0] * v[0] + w[1] * v[1] > -0.2 * al) return '';
          const a = place([[n[0] * 20, n[1] * 20]], c, q, v, 1)[0], b = place([[n[0] * 26, n[1] * 26]], c, q, v, 0.62)[0];
          return `M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}`;
        }).join('');
        set(`t${i}ribs`, ribs);
        // The coating arcs sit on the lower right and upper left of the glass.
        const arc = (r, a0, a1) => { const pts = []; for (let j = 0; j <= 12; j++) { const t = a0 + ((a1 - a0) * j) / 12; pts.push([r * Math.cos(t), r * Math.sin(t)]); } return 'M' + place(pts, c, q, v, 0.86).map(p => `${f(p[0])} ${f(p[1])}`).join('L'); };
        set(`t${i}coat`, arc(12.2, 0.05, 1.45));
        set(`t${i}coat2`, arc(12.2, 3.5, 4.1));
        const gc = place([[-5.5, -6]], c, q, v, 0.86)[0];
        const gl = svg.querySelector(`.t${i}glint`);
        gl.setAttribute('cx', f(gc[0] - v[0] * 0.12)); gl.setAttribute('cy', f(gc[1] - v[1] * 0.12));
        gl.setAttribute('transform', `rotate(-30 ${f(gc[0])} ${f(gc[1])})`);
        const sc = place([[4, 3]], c, q, v, 0.86)[0], st = svg.querySelector(`.t${i}strobe`);
        st.setAttribute('cx', f(sc[0])); st.setAttribute('cy', f(sc[1]));
        const blink = k > 0.6 && (time % 1) < 0.14;
        st.setAttribute('opacity', blink ? '1' : '0'); st.setAttribute('r', blink ? '3' : '2');
        $(`t${i}coat`).forEach(e => e.setAttribute('opacity', f(0.75 + 0.25 * k)));
      });
      // The eyepieces glow behind the tubes; the phosphor breathes with the tube noise.
      const br = 0.88 + 0.12 * Math.sin(time * 13) * Math.sin(time * 5.3);
      sps.forEach((s, j) => { const c = TUBES[j % 2], p = [c[0] - v[0] * 0.45, c[1] - v[1] * 0.45 - 4]; s.setAttribute('cx', f(p[0])); s.setAttribute('cy', f(p[1])); s.setAttribute('opacity', f((0.4 + 0.5 * k) * br)); });
      halo.setAttribute('opacity', f((0.34 + 0.32 * k) * br));
      pools.forEach(e => e.setAttribute('opacity', f((0.3 + 0.6 * k) * br)));
    };
    return draw;
  };

  // The shared motion: the tubes wake and aim at the pointer; leave lets them settle and dim.
  const gogRun = (svg, centre, gain = 0.24) => {
    const draw = gogModel(svg);
    const st = { live: false, k: 0, v: [...REST], tv: [...REST], last: 0 };
    draw(st.v, 0);
    const loop = clock(time => {
      const dt = Math.min(0.05, time - (st.last || time));
      st.last = time;
      st.k = st.live ? Math.min(1, st.k + dt * 2.2) : Math.max(0, st.k - dt * 1.4);
      const tv = st.live ? st.tv : REST, e = Math.min(1, dt * 6);
      st.v = [st.v[0] + (tv[0] - st.v[0]) * e, st.v[1] + (tv[1] - st.v[1]) * e];
      draw(st.v, st.k, time);
      if (!st.live && st.k <= 0 && Math.hypot(st.v[0] - REST[0], st.v[1] - REST[1]) < 0.05) { st.last = 0; st.v = [...REST]; draw(st.v, 0); loop.stop(); }
    });
    const aim = p => {
      if (!p) { st.tv = [...REST]; return; }
      let x = (p[0] - centre[0]) * gain, y = (p[1] - centre[1]) * gain;
      const l = Math.hypot(x, y), m = 13;
      if (l > m) { x *= m / l; y *= m / l; }
      st.tv = [x, y];
    };
    return { enter(p) { aim(p); st.live = true; loop.start(); }, move(p) { aim(p); }, leave() { st.live = false; loop.start(); } };
  };

  // The emblem is the resting model in greys: faces white, sides grey, the glass dark.
  const coatArc = (c, q, v, r, a0, a1) => { const pts = []; for (let j = 0; j <= 12; j++) { const t = a0 + ((a1 - a0) * j) / 12; pts.push([r * Math.cos(t), r * Math.sin(t)]); } return 'M' + place(pts, c, q, v, 0.86).map(p => `${f(p[0])} ${f(p[1])}`).join('L'); };
  const gogEmblem = () => {
    const v = REST, q = squash(v), W = (d, c) => `<path d="${d}" fill="${c}"/>`;
    const SD = '#a8a8a8', FC = '#fff';
    return TUBES.map(c => W(side(EYE, c, q, v, -0.75, 0), '#7a7a7a')).join('')
      + W(side(HEAD.pts, HEAD.c, q, v, -0.95, -0.55), SD) + W(face(HEAD.pts, HEAD.c, q, v, -0.55), FC)
      + W(side(ARM.pts, ARM.c, q, v, -0.6, -0.2), SD) + W(face(ARM.pts, ARM.c, q, v, -0.2), FC)
      + W(side(KNOB.pts, KNOB.c, q, v, -0.2, 0.05), '#6a6a6a') + W(face(KNOB.pts, KNOB.c, q, v, 0.05), '#cfcfcf')
      + W(side(BRIDGE.pts, BRIDGE.c, q, v, 0, 0.5), SD) + W(face(BRIDGE.pts, BRIDGE.c, q, v, 0.5), FC)
      + W(side(SHOE.pts, SHOE.c, q, v, 0.2, 0.58), SD) + W(face(SHOE.pts, SHOE.c, q, v, 0.58), FC)
      + TUBES.map(c => W(side(BAR, c, q, v, 0, 0.7), SD) + W(side(RING, c, q, v, 0.62, 1), '#8c8c8c') + W(face(RING, c, q, v, 1), FC)
        + W(face(CELL, c, q, v, 1), '#000') + W(face(GLASS, c, q, v, 0.86), '#3a3a3a')
        + `<path d="${coatArc(c, q, v, 12.2, 0.05, 1.45)}" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>`).join('');
  };

  /* ================= A: Shaded object ================= */

  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [12, 8, 96, 88],
    idea: 'Dual-tube night-vision goggles on their helmet arm, from the front and a little above, drawn as a small 3D model: a matte black bridge and mount, two short tubes with knurled focus rings, deep violet objective glass with a phosphor-green coating arc and a soft glint, the rubber eyecups behind, a green glow from the eyepieces. The pointer wakes the tubes: the goggles turn to aim at it, the green glow swells and breathes with the tube noise, the infrared lamp between the tubes glows, and the field strobe flashes in both lenses once a second. Leave, and the goggles settle and dim.',
    art(svg, u) {
      svg.innerHTML = `<defs>${gogDefs(u)}</defs>
        <ellipse cx="62" cy="104" rx="44" ry="4" fill="oklch(0.05 0.01 260)" opacity="0.55" filter="url(#${u}b)"/>
        ${gogMarkup(u)}`;
      return gogRun(svg, [60, 58]);
    },
    emblem: `${EMB_HEAD}<g transform="translate(5 9)">${gogEmblem()}</g></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The hard case is the block: black foam on top, olive drab faces, a lid seam and latches.
  // The goggles stand on the foam.
  const CY = 74, H = 25, T = 17;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const [N, E, S, W] = [[-H, -H], [H, -H], [H, H], [-H, H]].map(([x, y]) => iso(x, y));
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  const GS = 0.8, GX = 64 - 61 * GS, GY = CY + 3 - 96 * GS;
  // A latch on a face: a plate from a along the edge to b, at fraction t.
  const latch = (a, b, t, y0, y1, w = 4.5) => { const x = lerp(a[0], b[0], t), y = lerp(a[1], b[1], t), dy = (b[1] - a[1]) / (b[0] - a[0]); return poly([[x - w, y + y0 - w * dy], [x + w, y + y0 + w * dy], [x + w, y + y1 + w * dy], [x - w, y + y1 - w * dy]]); };
  // The foam cut-out: the top inset by a margin.
  const CUT = [[-H + 6, -H + 6], [H - 6, -H + 6], [H - 6, H - 6], [-H + 6, H - 6]].map(([x, y]) => iso(x, y));
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [20, 8, 90, 112],
    idea: 'The hard case of the goggles is the block at 30 degrees: black foam on top with its cut-out, olive drab faces with a lid seam and three latches, a rim on the top edges. The live goggles stand in the foam, the green glow round them. The pointer wakes the tubes and they aim at it, as in A.',
    art(svg, u) {
      svg.innerHTML = `<defs>${gogDefs(u)}
          ${lg(`${u}foam`, [[0, 'oklch(0.3 0.008 165)'], [1, 'oklch(0.18 0.008 165)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.47 0.06 118)'], [1, 'oklch(0.36 0.05 118)']])}
          ${lg(`${u}R`, [[0, 'oklch(0.32 0.045 118)'], [1, 'oklch(0.24 0.04 118)']])}
          ${rg(`${u}pool`, [[0, 'oklch(0.78 0.2 140)', 0.75], [1, 'oklch(0.7 0.2 140)', 0]])}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 260)" opacity="0.55" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <path d="${poly([down(W, 0.3), down(S, 0.3), down(S, 0.44), down(W, 0.44)])}" fill="oklch(0.27 0.04 118)"/>
        <path d="${poly([down(S, 0.3), down(E, 0.3), down(E, 0.44), down(S, 0.44)])}" fill="oklch(0.17 0.03 118)"/>
        ${[[W, S, 0.3], [W, S, 0.7], [S, E, 0.5]].map(([a, b, t], i) => `<path d="${latch(a, b, t, 2, 13)}" fill="${i < 2 ? 'oklch(0.7 0.008 250)' : 'oklch(0.48 0.008 250)'}"/><path d="${latch(a, b, t, 8, 11, 3)}" fill="${i < 2 ? 'oklch(0.36 0.01 250)' : 'oklch(0.24 0.01 250)'}"/>`).join('')}
        <path d="${poly([N, E, S, W])}" fill="url(#${u}foam)"/>
        <path d="${poly(CUT)}" fill="oklch(0.11 0.008 165)"/>
        <path d="${poly([N, E, S, W])}" fill="url(#${u}lit)"/>
        <ellipse class="pool" cx="${f(78)}" cy="${f(CY - 6)}" rx="34" ry="17" fill="url(#${u}pool)" opacity="0.3"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.32" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <ellipse cx="${f(60)}" cy="${f(CY + 4)}" rx="36" ry="10" fill="oklch(0.03 0.01 260)" opacity="0.65" filter="url(#${u}b)"/>
        <g transform="translate(${f(GX)} ${f(GY)}) scale(${GS})">${gogMarkup(u)}</g>`;
      return gogRun(svg, [GX + 60 * GS, GY + 58 * GS], 0.24 / GS);
    },
    emblem: `${EMB_HEAD}<g transform="translate(-2 2)"><path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/><path d="${poly(CUT)}" fill="#606060"/><g transform="translate(${f(GX)} ${f(GY)}) scale(${GS})">${gogEmblem()}</g></g></svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = "Night vision";
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-nvg';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `nvg-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      // A menu tile with no data-box fits its drawn bounds, as the menu does.
      const bb = D.box === "bbox" && svg.getBBox();
      fitIcon(svg, bb ? [bb.x, bb.y, bb.width, bb.height] : D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
