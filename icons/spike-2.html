<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 2</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.4; }
.defs { position: absolute; width: 0; height: 0; }
/* Labels only: no explanation copy. */
.idea, .lede, .pick { display: none !important; }
</style>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- Rain on glass. -->
    <linearGradient id="r-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.38 0.07 290)"/>
      <stop offset="1" style="stop-color: oklch(0.2 0.05 255)"/>
    </linearGradient>
    <radialGradient id="r-bk1"><stop offset="0" style="stop-color: oklch(0.82 0.13 70)" stop-opacity="0.85"/><stop offset="1" style="stop-color: oklch(0.82 0.13 70)" stop-opacity="0"/></radialGradient>
    <radialGradient id="r-bk2"><stop offset="0" style="stop-color: oklch(0.68 0.18 12)" stop-opacity="0.8"/><stop offset="1" style="stop-color: oklch(0.68 0.18 12)" stop-opacity="0"/></radialGradient>
    <radialGradient id="r-bk3"><stop offset="0" style="stop-color: oklch(0.8 0.11 190)" stop-opacity="0.75"/><stop offset="1" style="stop-color: oklch(0.8 0.11 190)" stop-opacity="0"/></radialGradient>
    <radialGradient id="r-bk4"><stop offset="0" style="stop-color: oklch(0.66 0.15 265)" stop-opacity="0.8"/><stop offset="1" style="stop-color: oklch(0.66 0.15 265)" stop-opacity="0"/></radialGradient>
    <radialGradient id="r-drop" cx="0.5" cy="0.74" r="0.62">
      <stop offset="0" style="stop-color: oklch(0.92 0.09 75)"/>
      <stop offset="0.45" style="stop-color: oklch(0.45 0.07 300)"/>
      <stop offset="1" style="stop-color: oklch(0.15 0.03 270)"/>
    </radialGradient>
    <linearGradient id="r-slab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.68 0.1 240)"/>
      <stop offset="1" style="stop-color: oklch(0.42 0.12 280)"/>
    </linearGradient>
    <!-- TV tree. -->
    <linearGradient id="tv-bark" gradientUnits="userSpaceOnUse" x1="0" y1="124" x2="0" y2="10">
      <stop offset="0" style="stop-color: oklch(0.4 0.15 322)"/>
      <stop offset="1" style="stop-color: oklch(0.72 0.19 348)"/>
    </linearGradient>
    <linearGradient id="tv-case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.84 0.15 66)"/>
      <stop offset="1" style="stop-color: oklch(0.58 0.18 34)"/>
    </linearGradient>
    <linearGradient id="tv-glare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tv-scan" patternUnits="userSpaceOnUse" width="4" height="2.4">
      <rect width="4" height="0.9" fill="#000" fill-opacity="0.2"/>
    </pattern>
    <!-- Balloon letters. -->
    <linearGradient id="b-gold" gradientUnits="userSpaceOnUse" x1="10" y1="12" x2="106" y2="96">
      <stop offset="0" style="stop-color: oklch(0.95 0.09 95)"/>
      <stop offset="0.42" style="stop-color: oklch(0.82 0.14 80)"/>
      <stop offset="0.7" style="stop-color: oklch(0.68 0.14 58)"/>
      <stop offset="1" style="stop-color: oklch(0.86 0.12 85)"/>
    </linearGradient>
    <linearGradient id="b-edge" gradientUnits="userSpaceOnUse" x1="10" y1="12" x2="106" y2="96">
      <stop offset="0" style="stop-color: oklch(0.66 0.11 68)"/>
      <stop offset="1" style="stop-color: oklch(0.48 0.1 48)"/>
    </linearGradient>
    <linearGradient id="b-rose" gradientUnits="userSpaceOnUse" x1="10" y1="12" x2="106" y2="100">
      <stop offset="0" style="stop-color: oklch(0.8 0.15 355)"/>
      <stop offset="1" style="stop-color: oklch(0.58 0.22 335)"/>
    </linearGradient>
    <linearGradient id="b-holo" gradientUnits="userSpaceOnUse" x1="10" y1="14" x2="106" y2="96">
      <stop offset="0" style="stop-color: oklch(0.88 0.09 330)"/>
      <stop offset="0.5" style="stop-color: oklch(0.8 0.11 290)"/>
      <stop offset="1" style="stop-color: oklch(0.86 0.09 200)"/>
    </linearGradient>
  </defs>
</svg>

<h1>Icon spike 2</h1>
<p class="lede">Rain on glass, TV tree, Balloon letters. Five directions each. Hover or tab to the tiles.</p>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2;
  const BG = 'oklch(0.16 0.012 275)';
  const f = n => +n.toFixed(2);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).join('\n')}\n</svg>\n`;
  // A teardrop: point on top, round base; s is the base radius.
  const tear = (cx, cy, s) => `M${f(cx)} ${f(cy - 1.6 * s)}C${f(cx + 0.32 * s)} ${f(cy - 1.05 * s)} ${f(cx + s)} ${f(cy - 0.5 * s)} ${f(cx + s)} ${f(cy + 0.3 * s)}A${f(s)} ${f(s)} 0 0 1 ${f(cx - s)} ${f(cy + 0.3 * s)}C${f(cx - s)} ${f(cy - 0.5 * s)} ${f(cx - 0.32 * s)} ${f(cy - 1.05 * s)} ${f(cx)} ${f(cy - 1.6 * s)}Z`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const inset = (pts, k) => {
    const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length, cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
    return pts.map(([x, y]) => [cx + (x - cx) * k, cy + (y - cy) * k]);
  };
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };

  const DIRS = [];

  /* ================= Rain on glass ================= */

  // A: a shaded pane; a touched drop lets go and runs to the sill.
  {
    const drops = [[30, 28, 5.5], [54, 20, 3.6], [82, 38, 7.5], [104, 56, 4.2], [42, 62, 8.5], [68, 66, 3.8], [98, 84, 6.5], [24, 90, 4.4], [58, 100, 6], [88, 108, 3.6]];
    const specks = [[40, 40], [62, 44], [90, 22], [110, 70], [18, 60], [74, 88], [36, 110], [106, 98], [52, 80], [82, 56], [20, 30], [68, 114], [112, 30], [30, 72]];
    const trail = 'M68 9C67 24 69 40 68 62';
    const dropMark = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#r-drop)"/><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="oklch(0.95 0.02 250 / 0.5)" stroke-width="0.8"/><ellipse cx="${f(x - r * 0.35)}" cy="${f(y - r * 0.42)}" rx="${f(r * 0.3)}" ry="${f(r * 0.2)}" fill="#fff" fill-opacity="0.85"/>`;
    DIRS.push({
      toy: 'rain', l: 'A', name: 'Pane', idea: 'Shaded pane over blurred street lights. A drop you touch lets go and runs down.',
      art(svg, u) {
        svg.innerHTML = `
          <clipPath id="${u}c"><rect x="9" y="9" width="110" height="110" rx="9"/></clipPath>
          <rect x="9" y="9" width="110" height="110" rx="9" fill="url(#r-night)"/>
          <g clip-path="url(#${u}c)">
            <circle cx="34" cy="44" r="28" fill="url(#r-bk1)"/>
            <circle cx="98" cy="28" r="22" fill="url(#r-bk3)"/>
            <circle cx="86" cy="94" r="32" fill="url(#r-bk2)"/>
            <circle cx="24" cy="102" r="22" fill="url(#r-bk4)"/>
            <path d="${trail}" fill="none" stroke="oklch(0.9 0.03 250 / 0.24)" stroke-width="2.4" stroke-linecap="round"/>
            <g class="trails"></g>
            <g fill="oklch(0.9 0.03 250 / 0.55)">${specks.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.1"/>`).join('')}</g>
            <g class="drops"></g>
          </g>
          <rect x="9" y="9" width="110" height="110" rx="9" fill="none" stroke="url(#rim)" stroke-width="1.5"/>`;
        const tG = svg.querySelector('.trails'), dG = svg.querySelector('.drops');
        const D = drops.map(([x, y, r]) => { const g = el('g', {}, dG); g.innerHTML = dropMark(x, y, r); return { x, y, r, g, busy: false }; });
        const run = d => {
          if (d.busy) return;
          d.busy = true;
          const tr = el('path', { fill: 'none', stroke: 'oklch(0.9 0.03 250 / 0.32)', 'stroke-width': f(d.r * 0.75), 'stroke-linecap': 'round' }, tG);
          const st = { y: d.y };
          // The drop wanders a little as it runs, and its trail follows.
          const wob = y => 1.1 * Math.sin(y * 0.35 + d.x);
          const draw = () => {
            let s = `M${d.x} ${d.y}`;
            for (let y = d.y + 4; y < st.y; y += 4) s += `L${f(d.x + wob(y))} ${f(y)}`;
            tr.setAttribute('d', s + `L${f(d.x + wob(st.y))} ${f(st.y)}`);
            gsap.set(d.g, { x: wob(st.y), y: st.y - d.y });
          };
          gsap.timeline()
            .to(st, { y: 124 + d.r, duration: 0.35 + (124 - d.y) / 110, ease: 'power2.in', onUpdate: draw })
            .to(tr, { opacity: 0, duration: 1.3, ease: 'power1.in' })
            .set(d.g, { x: 0, y: 0, scale: 0, transformOrigin: '50% 50%' })
            .to(d.g, { scale: 1, duration: 0.7, ease: 'back.out(2)' })
            .add(() => { tr.remove(); d.busy = false; });
        };
        const near = p => D.filter(d => d.r >= 3 && Math.hypot(p[0] - d.x, p[1] - d.y) < d.r + 7);
        return { enter: p => (p ? near(p).forEach(run) : run(D[4])), move: p => p && near(p).forEach(run), leave() {} };
      },
      emblem: emb(`
        <rect x="9" y="9" width="110" height="110" rx="9" fill="#fff"/>
        <path d="${trail}" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round"/>
        ${drops.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${f(r * 1.2)}" fill="#000"/>` + (r >= 5 ? `<circle cx="${f(x - r * 0.38)}" cy="${f(y - r * 0.4)}" r="${f(r * 0.3)}" fill="#fff"/>` : '')).join('\n')}
      `),
    });
  }

  // B: a steel slab with runnels cut in; drag a drop down with the pointer.
  {
    const cols = [[22, 9, 70, 5], [36, 30, 58, 4], [50, 14, 94, 6], [64, 44, 76, 4.5], [78, 20, 50, 4], [92, 9, 86, 5.5], [106, 36, 100, 5]];
    const beads = [[36, 96, 2.6], [64, 24, 2.2], [78, 84, 3], [50, 112, 2], [106, 20, 2.4], [22, 100, 2.8], [92, 108, 2.2], [64, 104, 2]];
    DIRS.push({
      toy: 'rain', l: 'B', name: 'Runnels', idea: 'Stencil slab with runnels cut through. Drag along a runnel and its drop follows.',
      art(svg) {
        svg.innerHTML = `
          <rect x="9" y="9" width="110" height="110" rx="7" fill="url(#r-slab)"/>
          <rect x="9" y="9" width="110" height="110" rx="7" fill="url(#lit)"/>
          <rect x="9" y="9" width="110" height="110" rx="7" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
          <g style="fill: ${BG}">${beads.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>
          <g class="cuts"></g>`;
        const g = svg.querySelector('.cuts');
        const C = cols.map(([x, s, e, r]) => {
          const line = el('line', { x1: x, y1: s, x2: x, y2: e, 'stroke-width': 3.2, 'stroke-linecap': 'round', style: `stroke: ${BG}` }, g);
          const head = el('circle', { cx: x, cy: e + r - 1, r, style: `fill: ${BG}` }, g);
          return { x, e, r, line, head, cur: e, tgt: e };
        });
        const draw = c => { c.line.setAttribute('y2', f(c.cur)); c.head.setAttribute('cy', f(c.cur + c.r - 1)); };
        // A runnel under the pointer stretches to it; the others ease home.
        const aim = p => C.forEach(c => {
          const hit = p && Math.abs(p[0] - c.x) < 7 && p[1] > c.e;
          const to = hit ? Math.min(p[1], 116 - c.r) : c.e;
          if (Math.abs(to - c.tgt) < 0.5) return;
          c.tgt = to;
          gsap.to(c, { cur: to, duration: hit ? 0.3 : 1.1, ease: hit ? 'power2.out' : 'power2.inOut', overwrite: true, onUpdate: () => draw(c) });
        });
        return { enter: p => aim(p || [64, 112]), move: p => p && aim(p), leave: () => aim(null) };
      },
      emblem: emb(`
        <rect x="9" y="9" width="110" height="110" rx="7" fill="#fff"/>
        ${cols.map(([x, s, e, r]) => `<line x1="${x}" y1="${s}" x2="${x}" y2="${e}" stroke="#000" stroke-width="3.4" stroke-linecap="round"/><circle cx="${x}" cy="${e + r - 1}" r="${r}" fill="#000"/>`).join('\n')}
        ${beads.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${f(r + 0.4)}" fill="#000"/>`).join('\n')}
      `),
    });
  }

  // C: one drop drawn as nested lines; its inner light leans to the pointer.
  {
    const S = [33, 26.5, 20, 13.5, 7];
    const hue = k => `oklch(${f(0.9 - k * 0.035)} ${f(0.04 + k * 0.03)} ${(240 + k * 45) % 360})`;
    const rings = o => S.map((s, k) => tear(64 + (o.x * k) / 4, 70 + (o.y * k) / 4, s));
    const REST = { x: 0, y: 7 };
    DIRS.push({
      toy: 'rain', l: 'C', name: 'Lens', idea: 'One drop as nested single-weight lines. Its inner light leans toward the pointer.',
      art(svg) {
        svg.innerHTML = `
          <rect x="9" y="9" width="110" height="110" rx="12" fill="none" stroke="oklch(0.62 0.03 255)" stroke-width="2.2"/>
          <g fill="none" stroke-width="2.2" stroke-linejoin="round">${S.map((_, k) => `<path style="stroke: ${hue(k)}"/>`).join('')}</g>
          <circle class="spec" r="2.6" fill="oklch(0.95 0.02 250)"/>`;
        const P = [...svg.querySelectorAll('path')], spec = svg.querySelector('.spec');
        const o = { ...REST };
        const draw = () => {
          rings(o).forEach((d, k) => P[k].setAttribute('d', d));
          spec.setAttribute('cx', f(51 - o.x * 0.45));
          spec.setAttribute('cy', f(56 - (o.y - REST.y) * 0.45));
        };
        draw();
        const aim = p => p && gsap.to(o, { x: clamp((p[0] - 64) * 0.2, -10, 10), y: REST.y + clamp((p[1] - 70) * 0.16, -9, 6), duration: 0.4, ease: 'power3.out', overwrite: true, onUpdate: draw });
        return {
          enter: p => aim(p || [96, 40]), move: aim,
          leave: () => gsap.to(o, { ...REST, duration: 1.1, ease: 'elastic.out(1, 0.4)', overwrite: true, onUpdate: draw }),
        };
      },
      emblem: emb(`
        <rect x="9" y="9" width="110" height="110" rx="12" fill="none" stroke="#fff" stroke-width="3.6"/>
        ${rings(REST).map(d => `<path d="${d}" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"/>`).join('\n')}
        <circle cx="51" cy="56" r="3.2" fill="#fff"/>
      `),
    });
  }

  // D: an isometric glass block; drops run down both side faces.
  {
    const H = 27 * Math.sqrt(3), m = 27 / H;
    const T = [64, 10], UR = [64 + H, 37], LR = [64 + H, 91], B = [64, 118], LL = [64 - H, 91], UL = [64 - H, 37], C = [64, 64];
    const TOP = [T, UR, C, UL], LEFT = [UL, C, B, LL], RIGHT = [C, UR, LR, B];
    const topL = x => 37 + (x - (64 - H)) * m, topR = x => 64 - (x - 64) * m;
    // Each drop: face, column, phase, laps per loop, radius.
    const DROPS = [['l', 28, 0.55, 1, 4.2], ['l', 41, 0.25, 2, 3.2], ['l', 53, 0.8, 1, 4.6], ['r', 76, 0.35, 1, 4.2], ['r', 91, 0.7, 2, 3.4], ['r', 104, 0.3, 1, 3.8]];
    const pos = (d, t) => {
      const [face, x, ph, sp] = d, top = face === 'l' ? topL(x) : topR(x);
      return [x, top - 6 + (((t * sp + ph) % 1) + 1) % 1 * 66];
    };
    const mtx = (face, x, y) => `matrix(0.866 ${face === 'l' ? 0.5 : -0.5} 0 1 ${f(x)} ${f(y)})`;
    const BEADS = [['l', 34, 78, 1.6], ['l', 47, 64, 1.3], ['r', 84, 82, 1.5], ['r', 98, 60, 1.3], ['l', 22, 60, 1.2], ['r', 108, 82, 1.2]];
    const TOPB = [[64, 26, 2], [52, 38, 1.4], [78, 36, 1.6]];
    DIRS.push({
      toy: 'rain', l: 'D', name: 'Glass block', idea: 'Isometric glass brick. Drops run down both faces in a seamless loop.',
      art(svg, u) {
        svg.innerHTML = `
          <clipPath id="${u}l"><path d="${poly(LEFT)}"/></clipPath>
          <clipPath id="${u}r"><path d="${poly(RIGHT)}"/></clipPath>

        return hoverLoop(
          () => gsap.timeline()
            .to(st, { s: 1, duration: 0.6, ease: 'back.out(1.6)', onUpdate: draw }, 0)
            .fromTo(st, { t: 0 }, { t: 1, duration: 3, ease: 'none', repeat: -1, onUpdate: draw }, 0),
          () => gsap.to(st, { s: 0, duration: 0.9, ease: 'elastic.out(1, 0.45)', onUpdate: draw }));
      },
      emblem: emb(`
        ${PILLS.map(([x, y, w, h]) => `<path d="${str([x + w / 2, y + h])}" fill="none" stroke="#fff" stroke-width="2.4"/>`).join('\n')}
        ${PILLS.map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(w, h) / 2}" fill="#fff"/><rect x="${x + 4}" y="${y + 5}" width="3.5" height="${Math.max(4, h * 0.3)}" rx="1.75" fill="#000"/>`).join('\n')}
        ${bow('#fff')}
      `),
    });
  }

  /* ================= Gallery ================= */

  const NAMES = { rain: 'Rain on glass', tvtree: 'TV tree', balloons: 'Balloon letters' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = svg => {
    const b = svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header><b>${D.l}</b><span>${D.name}</span></header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        <div class="emb"><div class="flash"><i style="--emblem: url(spike/emblems/${file}.svg)"></i></div><div class="glass"><i style="--emblem: url(spike/emblems/${file}.svg)"></i></div></div>
        <p class="idea">${D.idea}</p>`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg);
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
