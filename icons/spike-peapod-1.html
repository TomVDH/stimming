<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Pea pod 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Pea pod 1</h1>
<p class="lede">Pea pod, round 1. No pick yet; A goes on the menu until Tom picks. A: a fresh pod on a slant, its seam open on a row of peas. D: a block of dark oiled wood with the pod lying open on its top.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  const DIRS = [];


  // The toy's tokens: a fresh green pod, a pale wet lining, bright peas, dark oiled wood.
  const POD = [[0, 'oklch(0.8 0.17 130)'], [1, 'oklch(0.5 0.15 140)']];
  const FRONT = [[0, 'oklch(0.74 0.17 132)'], [1, 'oklch(0.44 0.13 142)']];
  const LINING = [[0, 'oklch(0.93 0.08 115)'], [1, 'oklch(0.8 0.11 122)']];
  const PEA = [[0, 'oklch(0.93 0.15 122)'], [0.55, 'oklch(0.76 0.19 132)'], [1, 'oklch(0.52 0.16 140)']];
  const CALYX = [[0, 'oklch(0.62 0.14 140)'], [1, 'oklch(0.4 0.11 146)']];
  const DEEP = 'oklch(0.4 0.1 135)';

  // The shared motion: a squeeze, the front valve drops open, the peas pop in a wave.
  // st.open runs 0 (rest, a narrow gape) to 1 (wide open). st.t drives the wave.
  const REST = 0.2;
  const run = draw => {
    const st = { open: REST, to: REST, t: 0, live: false, last: 0, amp: 0 };
    const step = time => {
      const dt = Math.min(0.1, time - (st.last || time));
      st.last = time;
      st.open += (st.to - st.open) * 0.14;
      st.amp += ((st.live ? 1 : 0) - st.amp) * 0.1;
      st.t += dt;
      draw(st);
      if (!st.live && st.amp < 0.01 && Math.abs(st.open - REST) < 0.005) {
        Object.assign(st, { open: REST, amp: 0, t: 0, last: 0 });
        draw(st);
        loop.stop();
      }
    };
    const loop = clock(step);
    draw(st);
    return {
      enter(p) { st.live = true; st.to = 1; loop.start(); if (p) this.move(p); },
      // The pointer nearer the tip opens the pod a little wider.
      move(p) { if (p) st.to = 0.8 + 0.2 * clamp((p[0] - 20) / 90); },
      leave() { st.live = false; st.to = REST; loop.start(); },
    };
  };
  // Each pea hops in turn: a wave that runs from the stem to the tip.
  const hop = (st, i, n) => {
    if (!st.amp) return 0;
    const ph = (st.t * 1.4 - i / n) % 1;
    return st.amp * Math.max(0, Math.sin(Math.max(0, ph) * Math.PI * 2.2)) * (ph < 0.45 ? 1 : 0);
  };

  /* ================= Current ================= */

  // Pea pod is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // The pod lies on a slant, stem low left, tip high right, its seam open on top.
  // Drawn flat along x, then turned as one group.
  const A_ROT = 'translate(64 66) rotate(-18)';
  const A_PEAS = [[-31, 6.4], [-17, 7.6], [-2, 8.2], [13, 8.2], [27, 7.6], [39, 6.4]];
  // The seam line y at x: the pod arches a little.
  const archY = x => -2 - 5 * (1 - (x / 50) ** 2);
  const A_BACK = 'M-50 2C-38 -25 30 -30 52 -6C40 23 -30 28 -50 2Z';
  const A_LINE = 'M-44 0C-30 -19 26 -23 46 -6C30 1 -28 4 -44 0Z';
  // The front valve: its lip drops as the pod opens.
  const aFront = k => {
    const lip = 2 + 9 * k;
    return `M-50 2C-34 ${f(lip)} 32 ${f(lip - 4)} 52 -6C40 23 -30 28 -50 2Z`;
  };
  const A_CALYX = 'M-46 1L-30 -9L-38 1L-28 7L-40 5L-34 14L-46 5Z';
  const A_STALK = 'M-46 0C-54 -2 -60 -8 -61 -17L-57 -18C-56 -11 -51 -6 -45 -4Z';
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [6, 24, 116, 78],
    idea: 'A fresh pea pod lies on a slant, stem and calyx low left, tip high right. Its seam gapes on top: a pale wet lining, a row of six bright peas, the front valve curving under them. The pointer squeezes it: the front valve drops wide open and the peas hop in a wave from stem to tip. It closes to its gape when the pointer leaves.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}
          ${lg(`${u}pod`, POD)}${lg(`${u}front`, FRONT)}${lg(`${u}lin`, LINING)}${lg(`${u}cal`, CALYX)}
          ${rg(`${u}pea`, PEA, 'cx="0.36" cy="0.3" r="0.72"')}</defs>
        <ellipse cx="64" cy="89" rx="40" ry="4" fill="oklch(0.05 0.01 240)" opacity="0.6" filter="url(#${u}b)"/>
        <g transform="${A_ROT}">
          ${body(A_STALK, u, 'cal')}
          ${body(A_BACK, u, 'pod')}
          <path d="${A_LINE}" fill="url(#${u}lin)"/>
          <g class="peas">${A_PEAS.map(([x, r]) => `<g transform="translate(${x} ${f(archY(x) + 3)})"><g class="p"><circle r="${r}" fill="url(#${u}pea)"/><circle r="${r}" fill="url(#${u}lit)"/></g></g>`).join('')}</g>
          <path class="front" fill="url(#${u}front)"/><path class="frontLit" fill="url(#${u}lit)"/><path class="frontRim" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
          ${body(A_CALYX, u, 'cal')}
        </g>`;
      const front = [svg.querySelector('.front'), svg.querySelector('.frontLit'), svg.querySelector('.frontRim')];
      const peas = [...svg.querySelectorAll('.p')];
      return run(st => {
        const d = aFront(st.open);
        front.forEach(p => p.setAttribute('d', d));
        peas.forEach((p, i) => p.setAttribute('transform', `translate(0 ${f(-7 * hop(st, i, peas.length) - 2 * st.open)})`));
      });
    },
    // The emblem: a white pod, its open seam dark, the peas white in it.
    emblem: `${EMB_HEAD}<g transform="${A_ROT}"><path d="${A_STALK}" fill="#fff"/><path d="${A_BACK}" fill="#fff"/><path d="${A_LINE}" fill="#000"/>${A_PEAS.map(([x, r]) => `<circle cx="${x}" cy="${f(archY(x) + 3 - 2 * REST)}" r="${f(r - 0.6)}" fill="#fff"/>`).join('')}<path d="${aFront(REST)}" fill="#fff" stroke="#000" stroke-width="2.4"/><path d="${aFront(REST)}" fill="#fff"/><path d="${A_CALYX}" fill="#fff"/></g></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A block of dark oiled wood; the pod lies open on its top, peas in a row.
  const CY = 44, HX = 40, HY = 17, T = 16;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // The pod is drawn flat from above, then laid on the top face.
  const D_M = `matrix(0.866 0.5 -0.866 0.5 ${f(iso(0, 0)[0])} ${f(iso(0, 0)[1])})`;
  const D_OUT = 'M-36 0C-22 -13 20 -14 38 0C20 14 -22 13 -36 0Z';
  const dLine = k => { const w = 3 + 4 * k; return `M-31 0C-18 ${f(-w)} 18 ${f(-w)} 33 0C18 ${f(w)} -18 ${f(w)} -31 0Z`; };
  const D_CALYX = 'M-36 0L-24 -6L-29 0L-24 6Z';
  const D_PEAS = [-22, -12, -1.5, 9, 19.5];
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [12, 20, 104, 84],
    idea: 'A block of dark oiled wood, light on top, as in the toy. The pod lies open on its top along the long side: green valves, a pale lining and a row of peas in the gap, the calyx at the stem end. The pointer squeezes: the valves part wider and the peas hop in a wave. It closes to a gape when the pointer leaves.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}
          ${lg(`${u}top`, [[0, 'oklch(0.56 0.06 60)'], [1, 'oklch(0.44 0.055 52)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}woodL`, [[0, 'oklch(0.4 0.05 52)'], [1, 'oklch(0.3 0.04 45)']])}
          ${lg(`${u}woodR`, [[0, 'oklch(0.3 0.04 48)'], [1, 'oklch(0.22 0.03 42)']])}
          ${lg(`${u}pod`, POD)}${lg(`${u}lin`, LINING)}${lg(`${u}cal`, CALYX)}
          ${rg(`${u}pea`, PEA, 'cx="0.36" cy="0.3" r="0.72"')}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}woodL)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}woodR)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g transform="${D_M}">
          <path d="${D_OUT}" fill="oklch(0.05 0.01 240)" opacity="0.45" filter="url(#${u}b)" transform="translate(3 -3)"/>
          ${body(D_OUT, u, 'pod')}
          <path class="lin" fill="url(#${u}lin)"/>
          <path d="${D_CALYX}" fill="url(#${u}cal)"/>
        </g>
        <g class="peas">${D_PEAS.map(x => { const p = iso(x, 0); return `<g transform="translate(${f(p[0])} ${f(p[1] - 3)})"><g class="p"><circle r="5.2" fill="url(#${u}pea)"/><circle r="5.2" fill="url(#${u}lit)"/></g></g>`; }).join('')}</g>`;
      const lin = svg.querySelector('.lin'), peas = [...svg.querySelectorAll('.p')];
      return run(st => {
        lin.setAttribute('d', dLine(st.open));
        peas.forEach((p, i) => p.setAttribute('transform', `translate(0 ${f(-6 * hop(st, i, peas.length))})`));
      });
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/><g transform="${D_M}"><path d="${D_OUT}" fill="#fff"/><path d="${dLine(REST)}" fill="#000"/></g>${D_PEAS.map(x => { const p = iso(x, 0); return `<circle cx="${f(p[0])}" cy="${f(p[1] - 3)}" r="4.4" fill="#fff"/>`; }).join('')}</svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Pea pod';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-peapod';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `peapod-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
