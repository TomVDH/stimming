<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Marbling 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Marbling 1</h1>
<p class="lede">Marbling, round 1: the tray gets an object. A: the glossy enamel tray with its bath of combed ink and the comb over it. D: the tray as the block.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };



  // The toy's tokens: its four inks on a cream size bath.
  const NAVY = 'oklch(0.38 0.13 266)', RED = 'oklch(0.56 0.18 26)', OCHRE = 'oklch(0.8 0.145 78)', TEAL = 'oklch(0.55 0.1 198)';
  const CREAM = 'oklch(0.95 0.03 88)';
  // The bands from far to near; cream gaps part the inks.
  const BANDS = [OCHRE, NAVY, CREAM, RED, TEAL, CREAM, NAVY, OCHRE];
  // The tray is navy enamel; the comb is walnut and steel.
  const ENAMEL = [[0, 'oklch(0.56 0.12 252)'], [0.55, 'oklch(0.4 0.12 262)'], [1, 'oklch(0.3 0.1 266)']];
  const WALL = [[0, 'oklch(0.36 0.11 262)'], [1, 'oklch(0.22 0.08 268)']];
  const BATH = [[0, 'oklch(0.97 0.025 92)'], [1, 'oklch(0.88 0.045 80)']];
  const WOOD = [[0, 'oklch(0.62 0.11 48)'], [0.6, 'oklch(0.44 0.1 38)'], [1, 'oklch(0.32 0.08 34)']];
  const STEEL = [[0, 'oklch(0.8 0.015 250)'], [0.45, 'oklch(0.55 0.025 255)'], [1, 'oklch(0.34 0.03 260)']];
  const { sin, exp, PI } = Math;

  // The ink is a live model in tray units.
  // Each band boundary is a curve v(u); each tine pulls it.
  // At rest, the combed ink lies in front of the comb.
  // Boundaries in front of the comb stretch into tongues toward the tines.
  // The pull fades with distance from the comb.
  // Boundaries behind the comb get a small push.
  const SIG = 3.8;
  const pull = (u, tines, sx) => tines.reduce((s, t) => s + exp(-(((u - t - sx) / SIG) ** 2)), 0);
  const edge = (v0, i, u, c, drag, tines, sx, cfg) => {
    const base = v0 + cfg.wave * sin(u * 0.11 + i * 1.7);
    const g = Math.min(1, pull(u, tines, sx));
    if (base > c) return base - (base - c) * 0.9 * drag * g * exp(-(base - c) / cfg.fade);
    return base - 3 * drag * g * exp(-(c - base) / 6);
  };
  // The rest boundaries: one row of v per sampled u.
  const restRows = cfg => {
    const n = BANDS.length, [u0, u1, v0, v1] = cfg.bath, step = (v1 - v0) / n;
    const us = [];
    // Each boundary samples u in steps of 2 units.
    for (let u = u0 - 2; u <= u1 + 2.01; u += 2) us.push(u);
    const rows = [];
    for (let i = 1; i < n; i++) rows.push(us.map(u => edge(v0 + i * step, i, u, cfg.rest, 0.85, cfg.tines, 0, cfg)));
    return { us, rows };
  };
  // Each band fills from its far boundary to past the near edge.
  // Later bands paint over earlier ones, so crossed curves stay clean.
  const inkPaths = (cfg, us, rows) => {
    const [u0, u1, v0, v1] = cfg.bath, n = BANDS.length;
    const near = [cfg.p(u1 + 6, v1 + 6), cfg.p(u0 - 6, v1 + 6)];
    return BANDS.map((_, i) => {
      const a = i === 0 ? [cfg.p(u0 - 6, v0 - 6), cfg.p(u1 + 6, v0 - 6)] : us.map((u, k) => cfg.p(u, rows[i - 1][k]));
      return 'M' + [...a, ...near].map(q => `${f(q[0])} ${f(q[1])}`).join('L') + 'Z';
    }).slice(0, n);
  };
  // The model: each moving tine carries the ink at its tip.
  // Ink that a tine carries stretches into a tongue behind it.
  // When the pointer leaves, the ink settles back to the rest pattern.
  const marbling = (svg, cfg) => {
    const bandEls = [...svg.querySelectorAll('.band')];
    const spineEls = svg.querySelectorAll('.spine'), tineEls = svg.querySelectorAll('.tines'), topEl = svg.querySelector('.spine-top'), shadow = svg.querySelector('.cshadow');
    const { us, rows: rest } = restRows(cfg);
    const rows = rest.map(r => r.slice());
    const st = { c: cfg.rest, cTo: cfg.rest, sx: 0, sxTo: 0, t: 0, live: false, sway: 0, swayTo: 0 };
    const draw = () => {
      inkPaths(cfg, us, rows).forEach((d, i) => bandEls[i].setAttribute('d', d));
      const cm = cfg.comb(st.c, st.sx + st.sway * 1.6 * sin(st.t * 5));
      spineEls.forEach(e => e.setAttribute('d', cm.spine));
      tineEls.forEach(e => e.setAttribute('d', cm.tines));
      if (topEl) topEl.setAttribute('d', cm.top);
      shadow.setAttribute('d', cm.shadow);
    };
    const loop = clock(time => {
      st.t = time;
      const c0 = st.c;
      st.c += (st.cTo - st.c) * 0.14;
      st.sx += (st.sxTo - st.sx) * 0.12;
      st.sway += (st.swayTo - st.sway) * 0.06;
      const dc = st.c - c0, sx = st.sx + st.sway * 1.6 * sin(st.t * 5);
      let off = 0;
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i], r0 = rest[i];
        for (let k = 0; k < us.length; k++) {
          // A tine carries ink near its tip along with the comb.
          if (dc) { const w = exp(-(((r[k] - c0) / 3.2) ** 2)); r[k] += dc * 0.94 * Math.min(1, pull(us[k], cfg.tines, sx)) * w; }
          // Calm ink drifts back to the rest pattern.
          if (!st.live) r[k] += (r0[k] - r[k]) * 0.07;
          off += Math.abs(r0[k] - r[k]);
        }
      }
      draw();
      // The clock stops once the comb and the ink rest.
      if (!st.live && Math.abs(st.c - cfg.rest) + Math.abs(st.sx) + st.sway + off * 0.01 < 0.03) {
        Object.assign(st, { c: cfg.rest, sx: 0, sway: 0 }); rest.forEach((r0, i) => rows[i].splice(0, r0.length, ...r0)); draw(); loop.stop();
      }
    });
    draw();
    return {
      enter(p) { st.live = true; st.swayTo = 1; loop.start(); if (p) this.move(p); },
      // The pointer holds the comb: depth drags it, x shifts the tines.
      move(p) {
        if (!p) return;
        const [c, s] = cfg.hold(p);
        st.cTo = clamp(c, cfg.range[0], cfg.range[1]);
        st.sxTo = clamp(s, -5, 5);
      },
      leave() { st.live = false; st.cTo = cfg.rest; st.sxTo = 0; st.swayTo = 0; loop.start(); },
    };
  };
  // A tine: a bar with a round tip.
  const tine = (x, top, tip, w) => `M${f(x - w)} ${f(top)}L${f(x + w)} ${f(top)}L${f(x + w)} ${f(tip - w)}Q${f(x + w)} ${f(tip)} ${f(x)} ${f(tip)}Q${f(x - w)} ${f(tip)} ${f(x - w)} ${f(tip - w)}Z`;
  const rrect = (x, y, w, h, r) => `M${f(x + r)} ${f(y)}H${f(x + w - r)}Q${f(x + w)} ${f(y)} ${f(x + w)} ${f(y + r)}V${f(y + h - r)}Q${f(x + w)} ${f(y + h)} ${f(x + w - r)} ${f(y + h)}H${f(x + r)}Q${f(x)} ${f(y + h)} ${f(x)} ${f(y + h - r)}V${f(y + r)}Q${f(x)} ${f(y)} ${f(x + r)} ${f(y)}Z`;
  const inkDefs = u => `${light(u)}${blur(`${u}s`, 2.4)}${blur(`${u}cs`, 1.8)}
    ${lg(`${u}enamel`, ENAMEL, 'x1="0.2" y1="0" x2="0.6" y2="1"')}
    ${lg(`${u}wall`, WALL)}
    ${lg(`${u}bath`, BATH, 'x1="0" y1="0" x2="1" y2="1"')}
    ${lg(`${u}wood`, WOOD)}
    ${lg(`${u}steel`, STEEL, 'x1="0" y1="0" x2="1" y2="0"')}
    ${lg(`${u}gloss`, [[0, '#fff', 0.5], [0.4, '#fff', 0.08], [1, '#fff', 0]], 'x1="0" y1="0" x2="0.5" y2="1"')}`;
  const bandMarkup = () => BANDS.map(c => `<path class="band" fill="${c}"/>`).join('');
  // The comb's layers: shadow on the bath, tines, then the board.
  const combMarkup = (u, top = false) => `
      <path class="cshadow" fill="oklch(0.15 0.05 266)" opacity="0.35" filter="url(#${u}cs)"/>
      <path class="tines" fill="url(#${u}steel)"/><path class="tines" fill="url(#${u}lit)"/>
      <path class="tines" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
      <path class="spine" fill="url(#${u}wood)"/><path class="spine" fill="url(#${u}lit)"/>
      ${top ? `<path class="spine-top" fill="oklch(0.68 0.1 52)"/>` : ''}
      <path class="spine" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover loop.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg, u) {
      svg.innerHTML = `<defs><linearGradient id="${u}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: oklch(0.97 0.02 90)"/><stop offset="1" style="stop-color: oklch(0.88 0.04 80)"/></linearGradient></defs>
        <rect x="16" y="16" width="96" height="96" rx="14" fill="url(#${u}g)"/>
        <g class="swirl" fill="none" stroke-width="5" stroke-linecap="round">
          <path d="M28 46C46 30 60 62 78 46S100 40 98 56" stroke="oklch(0.5 0.15 262)"/>
          <path d="M28 66C46 50 60 82 78 66S100 60 98 76" stroke="oklch(0.6 0.18 28)"/>
          <path d="M28 86C46 70 60 102 78 86S100 80 98 96" stroke="oklch(0.78 0.15 80)"/>
        </g>`;
      const swirl = [...svg.querySelector('.swirl').children];
      let tl = null;
      return {
        // The comb drags each ink line in turn.
        enter() { tl?.kill(); tl = gsap.timeline({ repeat: -1, yoyo: true }).to(swirl, { x: 6, skewX: -8, duration: 0.9, ease: 'sine.inOut', stagger: 0.15 }); },
        move() {},
        leave() { tl?.kill(); tl = null; gsap.to(swirl, { x: 0, skewX: 0, duration: 0.3, overwrite: true }); },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // The tray seen from the front and above, in a light perspective.
  // The bath is sunk in it; the comb hangs over the bath.
  // Model units: u across from the middle, v from far to near.
  const PA = (u, v) => { const s = 0.8 + 0.2 * (v + 9) / 67; return [64 + u * s, 36 + v * 0.74]; };
  // A rounded rectangle in model units, traced and projected.
  const pRect = (u0, v0, u1, v1, r, P = PA, dy = 0) => {
    const pts = [], arc = (cu, cv, a0) => { for (let i = 0; i <= 6; i++) { const a = a0 + (i / 6) * (PI / 2); pts.push([cu + r * Math.cos(a), cv + r * Math.sin(a)]); } };
    arc(u1 - r, v0 + r, -PI / 2); arc(u1 - r, v1 - r, 0); arc(u0 + r, v1 - r, PI / 2); arc(u0 + r, v0 + r, PI);
    return poly(pts.map(([u, v]) => { const q = P(u, v); return [q[0], q[1] + dy]; }));
  };
  const A_TINES = [-36, -18, 0, 18, 36], LIFT = 12, BOARD = 12;
  const A = {
    bath: [-47, 47, 0, 49], wave: 1.8, fade: 70, rest: 10, range: [2, 34], tines: A_TINES,
    p: PA,
    hold: p => [(p[1] + LIFT + BOARD / 2 - 36) / 0.74, (p[0] - 64) * 0.12],
    comb(c, sx) {
      const L = PA(-51 + sx, c), R = PA(51 + sx, c), Lb = PA(-51 + sx, c - 4), Rb = PA(51 + sx, c - 4);
      const up = (q, k) => [q[0], q[1] - k];
      // The board: a front face and a lit top strip.
      return {
        spine: poly([up(L, LIFT), up(R, LIFT), up(R, LIFT + BOARD), up(L, LIFT + BOARD)]),
        top: poly([up(L, LIFT + BOARD), up(R, LIFT + BOARD), up(Rb, LIFT + BOARD), up(Lb, LIFT + BOARD)]),
        tines: A_TINES.map(t => { const q = PA(t + sx, c); return tine(q[0], q[1] - LIFT - 1, q[1], 3); }).join(''),
        shadow: poly([PA(-46 + sx, c + 1), PA(46 + sx, c + 1), PA(46 + sx, c + 6), PA(-46 + sx, c + 6)]) + A_TINES.map(t => { const q = PA(t + sx + 2, c + 3); return tine(q[0], q[1] - 6, q[1] + 1, 2.8); }).join(''),
      };
    },
  };
  // The tray's slab: the wall below, then the top face.
  const trayTop = pRect(-55, -9, 55, 58, 12);
  const trayWall = pRect(-55, -9, 55, 58, 12, PA, 12);
  // The bath's pit, then its surface a little lower and nearer.
  const pitPath = pRect(-47, -1, 47, 49, 6);
  const bathPath = pRect(-47, 4, 47, 49, 6);
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [9, 9, 110, 92],
    idea: 'The marbling tray as one glossy slab of navy enamel in a light perspective, deep enough to show its front wall. The cream size bath is sunk in it below its far inner wall. Bands of the toy\'s four inks float on the bath. A walnut comb board on steel tines stands in the bath, and the ink in front of each tine is combed into a tongue. The pointer holds the comb: up and down drags it through the bath, and each tine carries the ink at its tip, so new tongues trail behind it; side to side shifts the tines, and the comb shivers while it is held. When the pointer leaves, the ink settles back.',
    art(svg, u) {
      svg.innerHTML = `<defs>${inkDefs(u)}<clipPath id="${u}bc"><path d="${bathPath}"/></clipPath></defs>
        <ellipse cx="64" cy="94" rx="58" ry="8" fill="oklch(0.05 0.01 290)" opacity="0.55" filter="url(#${u}s)"/>
        <path d="${trayWall}" fill="url(#${u}wall)"/>
        ${body(trayTop, u, 'enamel')}
        <path d="${pitPath}" fill="oklch(0.24 0.09 266)"/>
        <path d="${bathPath}" fill="url(#${u}bath)"/>
        <g clip-path="url(#${u}bc)">
          ${bandMarkup()}
          <path d="${bathPath}" fill="url(#${u}gloss)"/>
          ${combMarkup(u, true).split('\n').filter(s => s.includes('cshadow')).join('')}
        </g>
        ${combMarkup(u, true).split('\n').filter(s => !s.includes('cshadow')).join('')}`;
      return marbling(svg, A);
    },
  });

  /* ================= D: Isometric block ================= */

  // The tray is the block; the bath is sunk in its top.
  const CY = 70, HALF = 31, T = 15, IN = 25, H = 15;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const D_BATH = [[-IN, -IN], [IN, -IN], [IN, IN], [-IN, IN]].map(([x, y]) => iso(x, y));
  const [N, E, S, W] = D_TOP;
  const down = (p, k = T) => [p[0], p[1] + k];
  const D_TINES = [-17, -8.5, 0, 8.5, 17];
  // Bath u runs along gx and v along gy.
  const D = {
    bath: [-IN, IN, -IN, IN], wave: 1.4, fade: 50, rest: -14, range: [-22, 12], tines: D_TINES,
    p: (u, v) => iso(u, v),
    // The pointer sits on the spine, H above the bath.
    hold: p => { const y = p[1] + H + 4, a = (p[0] - 64) / 0.866, b = 2 * (y - CY); return [(b - a) / 2, ((a + b) / 2) * 0.15]; },
    comb(c, sx) {
      const up = (q, k) => [q[0], q[1] - k];
      const a = iso(-IN - 3 + sx, c), b = iso(IN + 3 + sx, c);
      const a2 = iso(-IN - 3 + sx, c - 3.5), b2 = iso(IN + 3 + sx, c - 3.5);
      return {
        spine: poly([up(a, H), up(b, H), up(b, H + 9), up(a, H + 9)]),
        top: poly([up(a, H + 9), up(b, H + 9), up(b2, H + 9), up(a2, H + 9)]),
        tines: D_TINES.map(t => { const q = iso(t + sx, c); return tine(q[0], q[1] - H - 1, q[1], 2.6); }).join(''),
        shadow: D_TINES.map(t => { const q = iso(t + sx + 1.5, c + 1.5); return tine(q[0], q[1] - 5, q[1] + 1, 2.4); }).join('') + poly([iso(-IN + sx, c - 1), iso(IN + sx, c - 1), iso(IN + sx, c + 3), iso(-IN + sx, c + 3)]),
      };
    },
  };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [10, 18, 108, 102],
    idea: 'The tray is the block: navy enamel faces, a lit rim on the top edges, the cream bath sunk in the top with its far inner walls in shade. The inks float in bands; the walnut comb stands across the bath on its steel tines and the ink in front of each tine is combed into a tongue. The pointer drags the comb along the tray; each tine carries the ink at its tip into a new tongue. When the pointer leaves, the ink settles back.',
    art(svg, u) {
      // The bath's far inner walls show the tray's depth.
      const lip = 3.5;
      svg.innerHTML = `<defs>${inkDefs(u)}<clipPath id="${u}bc"><path d="${poly(D_BATH)}"/></clipPath></defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 290)" opacity="0.55" filter="url(#${u}s)" transform="translate(0 4)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="oklch(0.38 0.11 262)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="oklch(0.24 0.08 266)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}lit)" opacity="0.5"/>
        <path d="M${f(W[0] + 4)} ${f(W[1] + T - 3)}L${f(S[0] - 2)} ${f(S[1] + T - 4)}" stroke="#fff" stroke-opacity="0.16" stroke-width="2.5" stroke-linecap="round"/>
        ${body(poly(D_TOP), u, 'enamel')}
        <path d="${poly(D_BATH)}" fill="url(#${u}bath)"/>
        <g clip-path="url(#${u}bc)">
          ${bandMarkup()}
          <path d="${poly([D_BATH[3], D_BATH[0], D_BATH[1], [D_BATH[1][0], D_BATH[1][1] + lip], [D_BATH[0][0], D_BATH[0][1] + lip], [D_BATH[3][0], D_BATH[3][1] + lip]])}" fill="oklch(0.22 0.08 266)" opacity="0.5"/>
          <path d="${poly(D_BATH)}" fill="url(#${u}gloss)"/>
          ${combMarkup(u, true).split('\n').filter(s => s.includes('cshadow')).join('')}
        </g>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-linejoin="round"/>
        ${combMarkup(u, true).split('\n').filter(s => !s.includes('cshadow')).join('')}`;
      return marbling(svg, D);
    },
  });

  /* ================= Emblems ================= */

  // Emblem tones: warm inks white, navy and cream black.
  // The comb is cut free in black.
  const TONE = { [OCHRE]: '#fff', [NAVY]: '#000', [CREAM]: '#000', [RED]: '#fff', [TEAL]: '#fff' };
  const embInk = (cfg, clip) => `<clipPath id="ec"><path d="${clip}"/></clipPath><g clip-path="url(#ec)">${(({ us, rows }) => inkPaths(cfg, us, rows))(restRows(cfg)).map((d, i) => `<path d="${d}" fill="${TONE[BANDS[i]]}"/>`).join('')}</g>`;
  const embComb = (cm, k) => `<g stroke="#000" stroke-width="${k}" stroke-linejoin="round" paint-order="stroke" fill="#fff"><path d="${cm.tines}"/><path d="${cm.spine}"/>${cm.top ? `<path d="${cm.top}"/>` : ''}</g>`;
  // The emblem fills the icon's own frame, so it matches the tile.
  const embHead = box => { const side = Math.max(box[2], box[3]) * 128 / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2; return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${f(cx - side / 2)} ${f(cy - side / 2)} ${f(side)} ${f(side)}" width="128" height="128">`; };
  DIRS[1].emblem = `${embHead(DIRS[1].box)}<path d="${trayWall}" fill="#a0a0a0"/><path d="${trayTop}" fill="#fff"/><path d="${pitPath}" fill="#000"/>${embInk(A, pRect(-45, 6, 45, 47, 5))}${embComb(A.comb(A.rest, 0), 3)}</svg>`;
  DIRS[2].emblem = `${embHead(DIRS[2].box)}<path d="${poly([W, S, down(S), down(W)])}" fill="#b4b4b4"/><path d="${poly([S, E, down(E), down(S)])}" fill="#7a7a7a"/><path d="${poly(D_TOP)}" fill="#fff"/><path d="${poly(D_BATH)}" fill="#000"/>${embInk(D, poly([iso(-IN + 2, -IN + 2), iso(IN - 2, -IN + 2), iso(IN - 2, IN - 2), iso(-IN + 2, IN - 2)]))}${embComb(D.comb(D.rest, 0), 2.6)}</svg>`;

  /* ================= Gallery ================= */
  const NAME = 'Marbling';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-marble';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `marble-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
