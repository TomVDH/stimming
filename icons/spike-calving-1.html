<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Calving 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Calving 1</h1>
<p class="lede">Calving, round 1. The toy is not built; this is an icon only. A: a glacier face of five slabs over the fjord; the pointer calves them. D: the glacier is the block in a plate of water.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The toy's tokens: blue-white ice, deep fjord water, white spray.
  const ICE = [[0, 'oklch(0.97 0.02 215)'], [0.45, 'oklch(0.84 0.07 220)'], [1, 'oklch(0.58 0.11 238)']];
  const FRESH = [[0, 'oklch(0.86 0.1 212)'], [1, 'oklch(0.46 0.13 242)']], GROOVE = 'oklch(0.45 0.1 245)';
  const SEA = [[0, 'oklch(0.36 0.06 245)'], [1, 'oklch(0.2 0.04 255)']];
  const SPRAY = 'oklch(0.97 0.015 220)', CRACK = 'oklch(0.3 0.08 250)';

  // One calving: the slab leans out, drops and sinks; spray goes up;
  // a wave rolls out from its foot; then the slab grows back.
  // slab is the group that falls; fall gives its lean, drop and out vectors.
  const calve = (slab, crack, puffs, wave, fall, waveTo) => {
    const tl = gsap.timeline();
    tl.set(crack, { opacity: 1 })
      .fromTo(crack, { attr: { 'stroke-dashoffset': 40 } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.3, ease: 'power1.in' })
      .to(slab, { rotation: fall.lean, svgOrigin: fall.origin, duration: 0.45, ease: 'power2.in' })
      .to(slab, { x: fall.out[0], y: fall.drop, opacity: 0, duration: 0.6, ease: 'power2.in' }, '>-0.1')
      .set(crack, { opacity: 0 }, '<')
      .add(() => {
        puffs.forEach((p, k) => gsap.fromTo(p, { attr: { cy: fall.foot[1] }, scale: 0.3, opacity: 1, svgOrigin: `${fall.foot[0]} ${fall.foot[1]}` }, { attr: { cy: fall.foot[1] - 16 - k * 5 }, scale: 1, opacity: 0, duration: 1 + k * 0.15, ease: 'power2.out' }));
        gsap.fromTo(wave, { attr: { rx: 4, ry: 1.4 }, opacity: 0.9 }, { attr: { rx: waveTo[0], ry: waveTo[1] }, opacity: 0, duration: 2.2, ease: 'power1.out' });
      }, '<0.25')
      // The slab grows back in place, so the next one can fall.
      .set(slab, { rotation: 0, x: 0, y: 0, svgOrigin: fall.origin }, '+=1')
      .to(slab, { opacity: 1, duration: 0.6 });
    return tl;
  };
  // The pointer picks the slab under it; a slab falls once, then rests.
  const glacier = (n, slabAt, fire) => {
    const busy = Array(n).fill(null);
    let live = false, last = -1;
    const go = i => {
      if (i < 0 || busy.some(Boolean)) return;
      busy[i] = fire(i).eventCallback('onComplete', () => { busy[i] = null; });
    };
    return {
      enter(p) { live = true; last = p ? slabAt(p) : Math.floor(n / 2); go(last); },
      move(p) { if (!p || !live) return; const i = slabAt(p); if (i !== last) { last = i; go(i); } },
      leave() { live = false; last = -1; },
    };
  };

  const DIRS = [];

  /* ================= Current ================= */

  // Calving is not built; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NOT BUILT</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // The glacier face from the fjord: five tall slabs over dark water.
  const XS = [18, 34, 52, 71, 90, 110];
  // Each slab's top: left corner, a serac peak, right corner.
  const TOPS = [[44, 30, 38], [36, 20, 30], [28, 16, 26], [24, 28, 22], [30, 24, 42]];
  const WL = 94;
  const topPts = (i, dy = 0) => { const m = lerp(XS[i], XS[i + 1], i % 2 ? 0.4 : 0.6); return [[XS[i], TOPS[i][0] + dy], [m, TOPS[i][1] + dy], [XS[i + 1], TOPS[i][2] + dy]]; };
  const A_SLAB = i => poly([...topPts(i), [XS[i + 1], WL + 2], [XS[i], WL + 2]]);
  const A_SNOW = i => poly([...topPts(i), ...topPts(i, 6).reverse()]);
  const A_GROOVE = i => [0.3, 0.72].map((k, j) => { const x = lerp(XS[i], XS[i + 1], k), y0 = lerp(TOPS[i][0], TOPS[i][2], k) + 12 + j * 8; return poly([[x - 1.6, y0], [x + 1.6, y0 + 2], [x + 2.4, WL - 8 - j * 10], [x - 0.8, WL - 6 - j * 10]]); }).join('');
  const A_SEA_C = [64, 99], A_SEA_R = [56, 13];
  const A_FRESH = poly([[XS[0] + 3, 44], [XS[2], 30], [XS[3], 34], [XS[5] - 3, 40], [XS[5] - 3, WL], [XS[0] + 3, WL]]);
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [8, 14, 112, 100],
    idea: 'A glacier face over a strip of dark fjord water: five tall slabs of blue-white ice with jagged seracs on top and a dark groove down each. The pointer picks a slab: a crack runs through it, it leans out, drops and sinks; spray goes up at its foot and a wave rolls out across the water. Then it grows back. Sweep across and they calve one after another.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}s`, 0.8)}
          ${lg(`${u}ice`, ICE)}${lg(`${u}sea`, SEA)}${lg(`${u}fresh`, FRESH)}
          <clipPath id="${u}above"><rect x="0" y="0" width="128" height="${WL + 1}"/></clipPath>
          <clipPath id="${u}sc"><ellipse cx="${A_SEA_C[0]}" cy="${A_SEA_C[1]}" rx="${A_SEA_R[0]}" ry="${A_SEA_R[1]}"/></clipPath></defs>
        <ellipse cx="64" cy="113" rx="52" ry="3.6" fill="oklch(0.05 0.01 250)" opacity="0.6" filter="url(#${u}b)"/>
        <ellipse cx="${A_SEA_C[0]}" cy="${A_SEA_C[1]}" rx="${A_SEA_R[0]}" ry="${A_SEA_R[1]}" fill="url(#${u}sea)"/>
        <path d="${A_FRESH}" fill="url(#${u}fresh)"/>
        <g clip-path="url(#${u}above)">${[0, 1, 2, 3, 4].map(i => `<g class="slab">${body(A_SLAB(i), u, 'ice')}<path d="${A_GROOVE(i)}" fill="${GROOVE}" opacity="0.32"/><path d="${A_SNOW(i)}" fill="oklch(0.99 0.008 215)"/></g>`).join('')}</g>
        ${[0, 1, 2, 3, 4].map(i => { const x = (XS[i] + XS[i + 1]) / 2; return `<path class="crack" d="M${f(x - 2)} ${f(TOPS[i][1] + 8)}L${f(x + 3)} ${f(WL * 0.55)}L${f(x - 2)} ${f(WL * 0.72)}L${f(x + 2)} ${WL}" fill="none" stroke="${CRACK}" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="40" opacity="0"/>`; }).join('')}
        <g clip-path="url(#${u}sc)"><ellipse class="wave" cx="64" cy="${WL + 5}" rx="4" ry="1.4" fill="none" stroke="${SPRAY}" stroke-width="2.6" opacity="0"/></g>
        <path d="M${XS[0]} ${WL + 1}H${XS[5]}" stroke="${SPRAY}" stroke-opacity="0.4" stroke-width="2.4" stroke-linecap="round"/>
        <g filter="url(#${u}s)">${[0, 1, 2, 3].map(k => `<circle class="puff" cx="64" cy="${WL}" r="${5 + k * 1.5}" fill="${SPRAY}" opacity="0"/>`).join('')}</g>`;
      const slabs = [...svg.querySelectorAll('.slab')], cracks = [...svg.querySelectorAll('.crack')];
      const puffs = [...svg.querySelectorAll('.puff')], wave = svg.querySelector('.wave');
      return glacier(5, p => clamp(XS.findIndex(x => x > p[0]) - 1, 0, 4), i => {
        const x = (XS[i] + XS[i + 1]) / 2, side = i < 2 ? -1 : i > 2 ? 1 : (i % 2 ? 1 : -1);
        puffs.forEach((p, k) => p.setAttribute('cx', f(x + (k - 1.5) * 6)));
        wave.setAttribute('cx', f(x));
        return calve(slabs[i], cracks[i], puffs, wave, { lean: side * 9, origin: `${side < 0 ? XS[i] : XS[i + 1]} ${WL}`, out: [side * 4, 0], drop: 50, foot: [x, WL + 2] }, [50, 11]);
      });
    },
    emblem: `${EMB_HEAD}<ellipse cx="${A_SEA_C[0]}" cy="${A_SEA_C[1]}" rx="${A_SEA_R[0]}" ry="${A_SEA_R[1]}" fill="#fff" opacity="0.4"/>${[0, 1, 2, 3, 4].map(i => `<path d="${A_SLAB(i)}" fill="#fff"/><path d="${A_GROOVE(i)}" fill="#000" opacity="0.5"/>`).join('')}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The glacier is the block: snow on top, the calving face on the left.
  // It stands in a plate of dark water; slabs of the face fall into it.
  const CY = 72, HALF = 22, H = 34, NSL = 4, TH = 5;
  const iso = (gx, gy, h = 0) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5 - h];
  const SEA_H = HALF + 16;
  const SEA_D = poly([iso(-SEA_H, -SEA_H + 12), iso(SEA_H, -SEA_H + 12), iso(SEA_H, SEA_H), iso(-SEA_H, SEA_H)]);
  const gxAt = k => -HALF + (2 * HALF * k) / NSL;
  // The fresh ice behind the slabs, then each slab: its face and its snow lip.
  const D_FRESH = poly([iso(-HALF, HALF - TH, H), iso(HALF, HALF - TH, H), iso(HALF, HALF - TH, 0), iso(-HALF, HALF - TH, 0)]);
  const D_SLAB = k => poly([iso(gxAt(k), HALF, H - (k % 2 ? 3 : 0)), iso(gxAt(k + 1), HALF, H - (k % 2 ? 0 : 3)), iso(gxAt(k + 1), HALF, 0), iso(gxAt(k), HALF, 0)]);
  const D_LIP = k => poly([iso(gxAt(k), HALF - TH, H), iso(gxAt(k + 1), HALF - TH, H), iso(gxAt(k + 1), HALF, H - (k % 2 ? 0 : 3)), iso(gxAt(k), HALF, H - (k % 2 ? 3 : 0))]);
  const D_TOP = poly([iso(-HALF, -HALF, H), iso(HALF, -HALF, H), iso(HALF, HALF - TH, H), iso(-HALF, HALF - TH, H)]);
  // Everything above the waterline of the face: a sinking slab goes under.
  const ABOVE = (() => { const a = iso(-HALF, HALF), b = iso(HALF, HALF), d = [0.866 * 100, 0.5 * 100]; const p1 = [a[0] - d[0], a[1] - d[1]], p2 = [b[0] + d[0], b[1] + d[1]]; return poly([p1, p2, [p2[0], -100], [p1[0], -100]]); })();
  const D_RIGHT = poly([iso(HALF, HALF - TH, H), iso(HALF, -HALF, H), iso(HALF, -HALF, 0), iso(HALF, HALF - TH, 0)]);
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [14, 14, 100, 100],
    idea: 'The glacier is the block: snow on the top, dark old ice on the right face, the calving face on the left in four slabs, standing in a plate of dark fjord water. The pointer picks a slab on the face: a crack runs, the slab leans out, slides down and sinks, spray goes up, and a ring of wave rolls out across the water. Fresh blue ice shows where it stood; then the slab grows back.',
    art(svg, u) {
      const out = [-0.866 * 9, 0.5 * 9];
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}s`, 0.8)}
          ${lg(`${u}ice`, ICE)}${lg(`${u}fresh`, FRESH)}${lg(`${u}sea`, SEA, 'x1="0" y1="0" x2="0.4" y2="1"')}
          <clipPath id="${u}sc"><path d="${SEA_D}"/></clipPath>
          <clipPath id="${u}above"><path d="${ABOVE}"/></clipPath></defs>
        <path d="${SEA_D}" fill="url(#${u}sea)"/>
        <path d="${SEA_D}" fill="url(#${u}lit)" opacity="0.5"/>
        <g clip-path="url(#${u}sc)"><ellipse class="wave" cx="64" cy="${CY + HALF}" rx="4" ry="2" fill="none" stroke="${SPRAY}" stroke-width="2.4" opacity="0"/></g>
        <path d="${D_RIGHT}" fill="oklch(0.5 0.09 240)"/>
        ${[0.3, 0.62].map(k => { const a = iso(HALF, lerp(HALF - TH, -HALF, k), H - 6), b = iso(HALF, lerp(HALF - TH, -HALF, k + 0.04), 6); return `<path d="${poly([[a[0] - 1.4, a[1]], [a[0] + 1.4, a[1] - 1], [b[0] + 1.4, b[1] - 1], [b[0] - 1.4, b[1]]])}" fill="${GROOVE}" opacity="0.45"/>`; }).join('')}
        <path d="${D_FRESH}" fill="url(#${u}fresh)"/>
        <path d="${D_TOP}" fill="oklch(0.97 0.015 220)"/>
        <path d="${D_TOP}" fill="url(#${u}lit)"/>
        <g clip-path="url(#${u}above)">${Array.from({ length: NSL }, (_, k) => `<g class="slab">${body(D_SLAB(k), u, 'ice')}<path d="${D_LIP(k)}" fill="oklch(0.98 0.012 215)"/></g>`).join('')}</g>
        ${Array.from({ length: NSL }, (_, k) => { const a = iso((gxAt(k) + gxAt(k + 1)) / 2, HALF, H - 4), b = iso((gxAt(k) + gxAt(k + 1)) / 2 + 2, HALF, H * 0.5), c = iso((gxAt(k) + gxAt(k + 1)) / 2 - 1, HALF, 0); return `<path class="crack" d="M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}L${f(c[0])} ${f(c[1])}" fill="none" stroke="${CRACK}" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="40" opacity="0"/>`; }).join('')}
        <path d="M${f(iso(HALF, -HALF, H)[0])} ${f(iso(HALF, -HALF, H)[1])}L${f(iso(-HALF, -HALF, H)[0])} ${f(iso(-HALF, -HALF, H)[1])}L${f(iso(-HALF, HALF, H)[0])} ${f(iso(-HALF, HALF, H)[1])}" stroke="#fff" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g filter="url(#${u}s)">${[0, 1, 2, 3].map(k => `<circle class="puff" cx="64" cy="${CY + HALF}" r="${4 + k * 1.3}" fill="${SPRAY}" opacity="0"/>`).join('')}</g>`;
      const slabs = [...svg.querySelectorAll('.slab')], cracks = [...svg.querySelectorAll('.crack')];
      const puffs = [...svg.querySelectorAll('.puff')], wave = svg.querySelector('.wave');
      // The pointer's place along the face, from W to S.
      const W0 = iso(-HALF, HALF), S0 = iso(HALF, HALF);
      return glacier(NSL, p => clamp(Math.floor(((p[0] - W0[0]) / (S0[0] - W0[0])) * NSL), 0, NSL - 1), k => {
        const foot = iso((gxAt(k) + gxAt(k + 1)) / 2, HALF + 4, 0);
        puffs.forEach((p, j) => p.setAttribute('cx', f(foot[0] + (j - 1.5) * 5)));
        wave.setAttribute('cx', f(foot[0])); wave.setAttribute('cy', f(foot[1]));
        const pivot = iso(gxAt(k), HALF, 0);
        return calve(slabs[k], cracks[k], puffs, wave, { lean: -10, origin: `${f(pivot[0])} ${f(pivot[1])}`, out, drop: 40, foot }, [40, 23]);
      });
    },
    emblem: `${EMB_HEAD}<path d="${SEA_D}" fill="#fff" opacity="0.35"/><path d="${D_RIGHT}" fill="#3a3a3a"/><path d="${D_TOP}" fill="#8a8a8a"/>${Array.from({ length: NSL }, (_, k) => `<path d="${D_SLAB(k)}" fill="#fff"/>`).join('')}</svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Calving';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-calving';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `calving-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
