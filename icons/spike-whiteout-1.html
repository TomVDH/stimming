<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Whiteout 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Whiteout 1</h1>
<p class="lede">Whiteout, round 1. No pick yet; A goes on the menu until Tom picks. A: the orange hut in the storm, its door lamp pouring a warm cone onto the snow, snow streaking through it. D: the snow field is the block; the hut and its cone stand on it.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  const DIRS = [];

  // The toy's tokens: an orange hut, white rime and snow, a warm lamp, the blue storm.
  const WALLC = [[0, 'oklch(0.64 0.17 42)'], [1, 'oklch(0.48 0.16 32)']];
  const RIMEC = [[0, 'oklch(0.6 0.16 40)'], [0.38, 'oklch(0.64 0.12 45)'], [0.62, 'oklch(0.88 0.025 250)'], [1, 'oklch(0.74 0.04 252)']];
  const ROOFC = [[0, 'oklch(0.98 0.006 250)'], [1, 'oklch(0.82 0.03 252)']];
  const SNOWC = [[0, 'oklch(0.86 0.03 252)'], [0.75, 'oklch(0.62 0.05 255)'], [1, 'oklch(0.45 0.06 258)', 0]];
  const CONEC = [[0, 'oklch(0.97 0.06 85)', 0.95], [0.55, 'oklch(0.86 0.11 72)', 0.5], [1, 'oklch(0.8 0.12 65)', 0.12]];
  const POOLC = [[0, 'oklch(0.97 0.05 85)'], [0.6, 'oklch(0.88 0.09 75)', 0.75], [1, 'oklch(0.8 0.1 70)', 0]];
  const GLOWC = [[0, 'oklch(0.99 0.03 90)'], [0.25, 'oklch(0.92 0.1 80)', 0.8], [1, 'oklch(0.8 0.12 65)', 0]];
  const BLUE = [[0, 'oklch(0.62 0.05 252)'], [1, 'oklch(0.45 0.06 256)']];
  const BLUED = [[0, 'oklch(0.42 0.06 256)'], [1, 'oklch(0.3 0.05 260)']];

  // The hut in metres: half width, half depth, eaves, ridge, the roof's overhang.
  const HW = 1.7, HD = 1.2, EAVE = 2.25, RIDGE = 2.8, OV = 0.18;
  // Every point of the hut, the lamp, its cone and its pool, through one projection.
  const hutGeo = P => {
    const g = {};
    g.front = [P(-HW, 0, HD), P(HW, 0, HD), P(HW, EAVE, HD), P(-HW, EAVE, HD)];
    g.side = [P(HW, 0, HD), P(HW, 0, -HD), P(HW, EAVE, -HD), P(HW, RIDGE, 0), P(HW, EAVE, HD)];
    g.roofF = [P(-HW - OV, RIDGE, 0), P(HW + OV, RIDGE, 0), P(HW + OV, EAVE - 0.08, HD + OV), P(-HW - OV, EAVE - 0.08, HD + OV)];
    g.roofB = [P(-HW - OV, RIDGE, 0), P(HW + OV, RIDGE, 0), P(HW + OV, EAVE - 0.08, -HD - OV), P(-HW - OV, EAVE - 0.08, -HD - OV)];
    g.door = [P(-1.18, 0.05, HD), P(-0.3, 0.05, HD), P(-0.3, 1.78, HD), P(-1.18, 1.78, HD)];
    g.win = [P(0.5, 1.0, HD), P(1.12, 1.0, HD), P(1.12, 1.55, HD), P(0.5, 1.55, HD)];
    g.winX = [P(0.81, 1.0, HD), P(0.81, 1.55, HD)];
    g.winY = [P(0.5, 1.275, HD), P(1.12, 1.275, HD)];
    g.lamp = P(-0.74, 2.02, HD + 0.16);
    // The pool of light on the snow, out from the door and to the left.
    const pc = [-1.0, 0, HD + 1.9];
    const ring = [];
    for (let i = 0; i < 24; i++) {
      const a = i / 24 * Math.PI * 2;
      ring.push(P(pc[0] + Math.cos(a) * 1.55, 0, pc[2] + Math.sin(a) * 1.15));
    }
    g.pool = ring;
    // The cone: from the lamp hood to the pool's far sides.
    const L = g.lamp;
    const lx = ring.reduce((m, p) => (p[0] < m[0] ? p : m)), rx = ring.reduce((m, p) => (p[0] > m[0] ? p : m));
    const low = ring.reduce((m, p) => (p[1] > m[1] ? p : m));
    g.cone = [[L[0] - 2.4, L[1] + 0.6], [L[0] + 2.4, L[1] + 0.6], [rx[0] - 6, rx[1]], low, [lx[0] + 2, lx[1]]];
    g.ground = P(0.2, 0, 0.9);
    // Streaks cross the cone with the wind: right to left, a little down.
    g.streaks = [[0.3, 0.22, 0.9], [0.62, 0.42, 1.1], [0.2, 0.58, 0.8], [0.7, 0.74, 1], [0.42, 0.88, 0.8]].map(([s, t, k]) => {
      const yy = L[1] + (low[1] - L[1]) * t;
      const x0 = L[0] + (lx[0] - L[0]) * t, x1 = L[0] + (rx[0] - L[0]) * t;
      const len = 12 * k;
      return { x: x0 + (x1 - x0) * s + len * 0.5, y: yy - len * 0.09, len };
    });
    return g;
  };
  const defs = u => `${light(u)}${blur(`${u}b`, 2.2)}${blur(`${u}s`, 1)}${blur(`${u}h`, 9)}
          ${lg(`${u}wall`, WALLC)}${lg(`${u}rime`, RIMEC, 'x1="0" y1="0" x2="0.4" y2="1"')}${lg(`${u}roof`, ROOFC, 'x1="0.2" y1="0" x2="0.5" y2="1"')}
          ${rg(`${u}snow`, SNOWC, 'cx="0.45" cy="0.4" r="0.6"')}${lg(`${u}cone`, CONEC)}${rg(`${u}pool`, POOLC)}${rg(`${u}glow`, GLOWC)}`;
  // The hut in the menu's language. Classes: hut, lit (the lamp's light), streak.
  const hutArt = (u, G, S) => {
    const d = pts => poly(pts);
    const lineP = (a, b, w, c) => `<path d="M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
    return `<g class="hut">
        ${body(d(G.roofB), u, 'roof')}
        ${body(d(G.side), u, 'rime')}
        ${body(d(G.front), u, 'wall')}
        <path d="${d(G.door)}" fill="oklch(0.34 0.1 30)"/>
        <path d="${d(G.win)}" fill="oklch(0.84 0.12 72)"/>
        ${lineP(G.winX[0], G.winX[1], 1.6, 'oklch(0.3 0.06 35)')}${lineP(G.winY[0], G.winY[1], 1.6, 'oklch(0.3 0.06 35)')}
        ${body(d(G.roofF), u, 'roof')}
        <path d="M${f(G.roofF[3][0])} ${f(G.roofF[3][1])}L${f(G.roofF[2][0])} ${f(G.roofF[2][1])}" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
      </g>
      <g class="lit">
        <path d="${d(G.cone)}" fill="url(#${u}cone)" filter="url(#${u}s)"/>
        <circle cx="${f(G.lamp[0])}" cy="${f(G.lamp[1])}" r="${f(S * 0.9)}" fill="url(#${u}glow)"/>
        <circle cx="${f(G.lamp[0])}" cy="${f(G.lamp[1])}" r="${f(Math.max(2.2, S * 0.2))}" fill="#fff"/>
      </g>
      <g class="streaks">${G.streaks.map(s => `<path class="streak" d="M${f(s.x)} ${f(s.y)}l${f(-s.len)} ${f(s.len * 0.18)}" stroke="oklch(0.98 0.04 85)" stroke-width="2.4" stroke-linecap="round"/>`).join('')}</g>`;
  };
  // The ground: a snow mound in the storm's glow.
  const groundArt = (u, G, S) => `<ellipse class="haze" cx="${f(G.ground[0])}" cy="${f(G.ground[1] - S * 1.6)}" rx="${f(S * 3.6)}" ry="${f(S * 2.6)}" fill="oklch(0.55 0.06 255)" opacity="0.5" filter="url(#${u}h)"/>
        <ellipse cx="${f(G.ground[0] - S * 0.3)}" cy="${f(G.ground[1] + S * 0.2)}" rx="${f(S * 3.4)}" ry="${f(S * 1.05)}" fill="url(#${u}snow)"/>`;
  const poolArt = (u, G) => `<path class="pool" d="${poly(G.pool)}" fill="url(#${u}pool)" filter="url(#${u}b)"/>`;
  // The shared motion: the lamp catches with two flickers; a gust fades the hut and gives it back.
  const run = svg => {
    const hut = svg.querySelector('.hut'), lit = svg.querySelector('.lit'), pool = svg.querySelector('.pool'), haze = svg.querySelector('.haze');
    const streaks = svg.querySelectorAll('.streak');
    let tl = null, loop = null;
    return {
      enter() {
        if (tl) tl.kill();
        if (loop) loop.kill();
        tl = gsap.timeline();
        tl.to([lit, pool], { opacity: 0.1, duration: 0.05 })
          .to([lit, pool], { opacity: 0.8, duration: 0.04 })
          .to([lit, pool], { opacity: 0.2, duration: 0.05 })
          .to([lit, pool], { opacity: 1, duration: 0.18, ease: 'power2.out' })
          .to(hut, { opacity: 0.4, duration: 0.6, ease: 'sine.inOut' }, 0.15)
          .to(haze, { opacity: 0.85, duration: 0.6, ease: 'sine.inOut' }, '<')
          .to(hut, { opacity: 1, duration: 0.9, ease: 'sine.inOut' }, '>0.2')
          .to(haze, { opacity: 0.5, duration: 0.9, ease: 'sine.inOut' }, '<');
        loop = gsap.to(streaks, { keyframes: { x: [8, -10], opacity: [0, 1, 1, 0] }, duration: 0.45, ease: 'none', stagger: { each: 0.09, repeat: -1 } });
      },
      move() {},
      leave() {
        if (tl) tl.kill();
        if (loop) loop.kill();
        tl = loop = null;
        gsap.to([lit, pool, hut], { opacity: 1, duration: 0.4, ease: 'power2.out' });
        if (haze) gsap.to(haze, { opacity: 0.5, duration: 0.4 });
        gsap.to(streaks, { x: 0, opacity: 1, duration: 0.4, ease: 'power2.out' });
      },
    };
  };
  // The emblem: walls white, the roof light grey, door and window cut, the cone in mid grey.
  // It fills the box as other emblems do.
  const embHut = G => {
    // The hut sets the frame; the cone runs out past the left edge.
    const pts = [...G.roofB, ...G.side, ...G.front];
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const x1 = Math.max(...xs), y0 = Math.min(...ys), w = x1 - Math.min(...xs), h = Math.max(...ys) - y0;
    const k = Math.min(108 / w, 104 / h), tx = 124 - x1 * k, ty = 62 - (y0 + h / 2) * k;
    return `<g transform="matrix(${f(k)} 0 0 ${f(k)} ${f(tx)} ${f(ty)})"><path d="${poly(G.cone)}" fill="#a0a0a0"/><path d="${poly(G.roofB)}" fill="#d2d2d2"/><path d="${poly(G.side)}" fill="#fff"/><path d="${poly(G.front)}" fill="#fff"/><path d="${poly(G.roofF)}" fill="#d2d2d2"/><path d="${poly(G.door)}" fill="#6a6a6a"/><path d="${poly(G.win)}" fill="#6a6a6a"/><circle cx="${f(G.lamp[0])}" cy="${f(G.lamp[1])}" r="${f(4.5 / k)}" fill="#fff"/></g>`;
  };
  const bbox = pts => { const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); const x0 = Math.min(...xs), y0 = Math.min(...ys); return [x0, y0, Math.max(...xs) - x0, Math.max(...ys) - y0]; };

  /* ================= Current ================= */

  // Whiteout is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // A three-quarter view from a little above: the door face left, the rimed face right.
  const SA = 18.5;
  const PA = (x, y, z) => [72 + (x * 0.9 - z * 0.66) * SA, 84 + (x * 0.16 + z * 0.24) * SA - y * SA];
  const GA = hutGeo(PA);
  const boxA = bbox([...GA.front, ...GA.side, ...GA.roofB, ...GA.roofF, ...GA.pool, [GA.ground[0] - SA * 3.7, GA.ground[1] + SA * 1.25]]);
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: boxA,
    idea: 'The orange hut in the storm: a snow roof, the windward face white with rime, a warm window. The door lamp pours a warm cone onto a pool of light on the snow; streaks of snow cross the cone with the wind. The pointer brings a gust: the lamp catches with two flickers, the hut fades into the storm and comes back, the snow streams through the cone.',
    art(svg, u) {
      svg.innerHTML = `<defs>${defs(u)}</defs>
        ${groundArt(u, GA, SA)}${poolArt(u, GA)}${hutArt(u, GA, SA)}`;
      return run(svg);
    },
    emblem: `${EMB_HEAD}${embHut(GA)}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The snow field is the block at 30 degrees; the hut and its cone stand on the top.
  const CY = 76, BX = 36, BY = 36, T = 15, SD = 11;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-BX, -BY), E = iso(BX, -BY), S = iso(BX, BY), W = iso(-BX, BY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // Hut metres onto the top: x runs down right, z down left, y up.
  const PD = (x, y, z) => { const p = iso(x * SD + 6, z * SD - 10); return [p[0], p[1] - y * SD]; };
  const GD = hutGeo(PD);
  const boxD = bbox([N, E, down(S), down(W), down(E), ...GD.roofB]);
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: boxD,
    idea: 'The snow field as the block at 30 degrees: a white snow top, a blue-grey left face, a dark right face, a rim on the top edges. The hut stands at the back; its lamp pours the warm cone onto the top. The pointer brings the gust and the lamp catches, as A does.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${defs(u)}
          ${lg(`${u}top`, [[0, 'oklch(0.96 0.01 250)'], [1, 'oklch(0.8 0.03 252)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, BLUE)}${lg(`${u}R`, BLUED)}</defs>
        <ellipse class="haze" cx="64" cy="${CY - 18}" rx="40" ry="28" fill="oklch(0.55 0.06 255)" opacity="0.5" filter="url(#${u}h)"/>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        ${poolArt(u, GD)}${hutArt(u, GD, SD)}`;
      return run(svg);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/><path d="${poly(GD.cone)}" fill="#b4b4b4"/><path d="${poly(GD.roofB)}" fill="#d2d2d2"/><path d="${poly(GD.side)}" fill="#fff"/><path d="${poly(GD.front)}" fill="#fff"/><path d="${poly(GD.roofF)}" fill="#d2d2d2"/><path d="${poly(GD.door)}" fill="#6a6a6a"/><path d="${poly(GD.win)}" fill="#6a6a6a"/></svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Whiteout';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-whiteout';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `whiteout-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    // The menu's tile: A at 128, its ids under the toy's prefix.
    const A = DIRS.find(d => d.l === 'A');
    const svg = el('svg', { class: 'art', viewBox: '0 0 128 128', 'aria-hidden': 'true' }, document.body);
    A.art(svg, 'whiteout-');
    fitIcon(svg, A.box);
    window.EMBLEMS.menu = svg.outerHTML;
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
