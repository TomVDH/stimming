<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spikes</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* Spike index: every toy's emblem directions in one sheet, linked to its gallery. */
:root {
  --bg: oklch(0.16 0.012 275);
  --cell: oklch(0.12 0.01 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --focus: oklch(0.84 0.13 205);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--fg); font: 500 13px/1.35 var(--sans); padding-inline: max(16px, env(safe-area-inset-left, 0px)); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 40px 72px; display: grid; gap: 28px; }
h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
/* One row per toy: its name, then Current and A to E. */
.sheet { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 180px repeat(6, minmax(0, 1fr)); gap: 8px; align-items: center; }
.head { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; align-items: end; padding-bottom: 4px; }
.head b { display: block; color: var(--fg); font-size: 15px; font-weight: 800; letter-spacing: 0; text-transform: none; }
.name { display: grid; gap: 2px; padding-right: 8px; }
.name b { font-size: 15px; font-weight: 650; }
.name span { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.name:hover b { text-decoration: underline; text-underline-offset: 3px; }
.cell { display: grid; place-items: center; aspect-ratio: 1; background: var(--cell); border: 1px solid var(--line); border-radius: 10px; transition: border-color 0.2s ease; }
.cell:hover { border-color: var(--muted); }
.cell.none { border-style: dashed; background: none; }
/* White emblem on the dark cell, as the intro shows it. */
.cell i { width: 64%; aspect-ratio: 1; background: #fff; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.gap { height: 12px; }
@media (max-width: 720px) {
  .row { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .name { grid-column: 1 / -1; padding-top: 8px; }
  .head > :first-child { display: none; }
  .head { font-size: 0; }
  .head b { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { .cell { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Icon spikes</h1>
  <div class="sheet" id="sheet"></div>
</div>
<script type="module">
// Each gallery and the toys it holds, in gallery order.
const SPIKES = [
  [1, ['chladni', 'walker', 'fire']],
  [2, ['rain', 'tvtree', 'balloons']],
  [3, ['morpher', 'pop']],
  [4, ['neon', 'glass']],
  [5, ['fidget', 'pendulum']],
  [6, ['ferro', 'pool']],
  [7, ['kaleido', 'soap']],
  [8, ['prism', 'domino']],
  [9, ['magnet', 'putty']],
  [10, ['pins', 'scope']],
  [11, ['galaxy']],
];
const RUB = [['A', 'Shaded object'], ['B', 'Stencil cut-out'], ['C', 'Single-weight line'], ['D', 'Isometric block'], ['E', 'Abstract mark']];
// These toys have no shipped emblem yet.
const NO_CURRENT = new Set(['rain', 'tvtree', 'balloons']);

// toys.json gives the names; the id stands in if it fails.
const names = await fetch('../toys.json').then(r => r.json()).catch(() => ({}));
const sheet = document.getElementById('sheet');
const cell = (href, url, label) => url
  ? `<a class="cell" href="${href}" aria-label="${label}"><i style="--emblem: url(${url})"></i></a>`
  : `<span class="cell none" aria-label="${label}: none"></span>`;

let html = `<div class="row head"><span></span><span><b>Current</b></span>${RUB.map(([l, r]) => `<span><b>${l}</b>${r}</span>`).join('')}</div>`;
for (const [n, toys] of SPIKES) {
  const href = `spike-${n}.html`;
  for (const id of toys) {
    const name = names[id]?.name ?? id;
    html += `<div class="row">
      <a class="name" href="${href}"><b>${name}</b><span>Spike ${n}</span></a>
      ${cell(href, NO_CURRENT.has(id) ? null : `../shared/emblems/${id}.svg`, `${name}, current`)}
      ${RUB.map(([l]) => cell(href, `spike/emblems/${id}-${l.toLowerCase()}.svg`, `${name}, ${l}`)).join('')}
    </div>`;
  }
  html += '<div class="gap"></div>';
}
sheet.innerHTML = html;
</script>
</body>
</html>
