<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Pressure washer 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Pressure washer 1</h1>
<p class="lede">Pressure washer, round 1. A: the spray gun aims at the pointer and its jet scrubs a clean band in the moss. D: a brick paver block; the nozzle follows the pointer and cuts a clean trail.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const set = (e, a) => { for (const k in a) e.setAttribute(k, a[k]); };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');

  // The toy's palette: moss grime, clean brick, a green tip, white water.
  const MOSS = ['oklch(0.47 0.09 132)', 'oklch(0.3 0.055 128)'];
  const BRICK = ['oklch(0.74 0.13 54)', 'oklch(0.66 0.13 44)', 'oklch(0.69 0.12 62)'];
  const TIP = ['oklch(0.8 0.16 150)', 'oklch(0.52 0.15 152)'];
  const GUN = ['oklch(0.82 0.15 62)', 'oklch(0.6 0.16 42)'];
  const STEEL = [[0, 'oklch(0.92 0.01 250)'], [0.45, 'oklch(0.68 0.015 250)'], [1, 'oklch(0.4 0.015 250)']];
  const GRIP = 'oklch(0.36 0.03 250)';
  const WATER = 'oklch(0.97 0.02 220)';
  const deg = Math.PI / 180;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } }, once: tick };
  };
  // Spray drops fly up and out from an impact, then fade.
  const dropsTl = (drops, dx) => gsap.timeline({ repeat: -1 }).fromTo(drops,
    { x: 0, y: 0, opacity: 1 },
    { x: i => dx[i][0], y: i => dx[i][1], opacity: 0, duration: 0.4, stagger: 0.08, ease: 'power1.out' });

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg, u) {
      svg.innerHTML = `<defs>
          <pattern id="${u}brick" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="20" height="20" fill="oklch(0.8 0.04 84)"/>
            <rect x="0.45" y="0.45" width="9.1" height="4.1" fill="oklch(0.64 0.13 42)"/>
            <rect x="-4.55" y="15.45" width="9.1" height="4.1" fill="oklch(0.55 0.12 32)"/>
            <rect x="5.45" y="5.45" width="9.1" height="4.1" fill="oklch(0.55 0.12 32)"/>
            <rect x="0.45" y="5.45" width="4.1" height="9.1" fill="oklch(0.55 0.12 32)"/>
            <rect x="10.45" y="-4.55" width="4.1" height="9.1" fill="oklch(0.55 0.12 32)"/>
            <rect x="10.45" y="10.45" width="9.1" height="4.1" fill="oklch(0.71 0.12 58)"/>
            <rect x="5.45" y="10.45" width="4.1" height="9.1" fill="oklch(0.71 0.12 58)"/>
            <rect x="15.45" y="0.45" width="4.1" height="9.1" fill="oklch(0.71 0.12 58)"/>
            <rect x="15.45" y="15.45" width="9.1" height="4.1" fill="oklch(0.64 0.13 42)"/>
            <rect x="10.45" y="15.45" width="4.1" height="9.1" fill="oklch(0.64 0.13 42)"/>
          </pattern>
          <mask id="${u}dirt" maskUnits="userSpaceOnUse" x="0" y="0" width="80" height="80">
            <rect width="80" height="80" fill="#fff"/>
            <rect x="-1" y="55" width="82" height="18" fill="#000"/>
            <rect class="cut" x="-1" y="32" width="39" height="18" fill="#000"/>
          </mask>
          <linearGradient id="${u}jet" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="oklch(0.97 0.02 220)" stop-opacity="0.15"/>
            <stop offset="1" stop-color="oklch(0.97 0.02 220)" stop-opacity="0.85"/>
          </linearGradient>
          <filter id="${u}soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
        </defs>
        <ellipse cx="64" cy="104" rx="48" ry="8" fill="oklch(0.05 0.01 250)" opacity="0.55" filter="url(#${u}soft)"/>
        <path d="M14.4 66.8L64 95.6V101.6L14.4 72.8Z" fill="oklch(0.29 0.04 126)"/>
        <path d="M64 95.6L113.6 66.8V72.8L64 101.6Z" fill="oklch(0.23 0.035 126)"/>
        <g transform="matrix(0.62 0.36 -0.62 0.36 64 38)">
          <rect width="80" height="80" fill="url(#${u}brick)"/>
          <g mask="url(#${u}dirt)">
            <rect width="80" height="80" fill="oklch(0.33 0.045 128)"/>
            <g fill="oklch(0.45 0.1 132)">
              <ellipse cx="12" cy="20" rx="10" ry="6"/><ellipse cx="62" cy="12" rx="12" ry="7"/>
              <ellipse cx="72" cy="42" rx="8" ry="10"/><ellipse cx="24" cy="76" rx="10" ry="5"/>
            </g>
            <g fill="oklch(0.24 0.03 120)">
              <ellipse cx="40" cy="22" rx="14" ry="8"/><ellipse cx="8" cy="50" rx="8" ry="12"/><ellipse cx="58" cy="76" rx="11" ry="5"/>
            </g>
            <g fill="oklch(0.72 0.03 110)">
              <circle cx="30" cy="9" r="2.6"/><circle cx="68" cy="26" r="2"/><circle cx="17" cy="36" r="2.2"/>
            </g>
          </g>
          <rect class="hit" x="36.8" y="30.5" width="2.4" height="21" fill="oklch(0.98 0.02 220)" opacity="0"/>
        </g>
        <ellipse class="mist" cx="62" cy="62" rx="17" ry="8" fill="oklch(0.97 0.02 220)" opacity="0" filter="url(#${u}soft)"/>
        <polygon class="fan" points="62.14,40.44 68.34,62.84 55.94,70.04" fill="url(#${u}jet)" opacity="0"/>
        <g class="spray" transform="translate(62.14 66.44)" fill="oklch(0.98 0.02 220)" opacity="0">
          <circle r="1.5"/><circle r="1.2"/><circle r="1.6"/><circle r="1.1"/><circle r="1.3"/>
        </g>
        <g class="gun" transform="translate(62.14 40.44)">
          <path d="M0 0L26 -18" stroke="oklch(0.42 0.012 250)" stroke-width="3" stroke-linecap="round"/>
          <path d="M21 -14.6L31 -21.5" stroke="oklch(0.22 0.01 250)" stroke-width="6" stroke-linecap="round"/>
          <path d="M-0.5 0.4L3.5 -2.4" stroke="oklch(0.68 0.16 150)" stroke-width="4.5" stroke-linecap="round"/>
        </g>`;
      const q = s => svg.querySelector(s);
      const cut = q('.cut'), hit = q('.hit'), fan = q('.fan'), gun = q('.gun'), spray = q('.spray'), mist = q('.mist');
      const REST = 38, st = { u: REST, cut: REST, on: 0 };
      const scr = (uu, v) => [64 + 0.62 * (uu - v), 38 + 0.36 * (uu + v)];
      const draw = () => {
        const uu = st.u, [ax, ay] = scr(uu, 31), [bx, by] = scr(uu, 51), [mx, my] = scr(uu, 41);
        cut.setAttribute('width', (st.cut + 1).toFixed(2));
        hit.setAttribute('x', (uu - 1.2).toFixed(2));
        fan.setAttribute('points', `${mx.toFixed(2)},${(my - 26).toFixed(2)} ${ax.toFixed(2)},${ay.toFixed(2)} ${bx.toFixed(2)},${by.toFixed(2)}`);
        gun.setAttribute('transform', `translate(${mx.toFixed(2)} ${(my - 26).toFixed(2)})`);
        spray.setAttribute('transform', `translate(${mx.toFixed(2)} ${my.toFixed(2)})`);
        mist.setAttribute('cx', mx.toFixed(2));
        mist.setAttribute('cy', (my - 3).toFixed(2));
        hit.setAttribute('opacity', st.on.toFixed(2));
        fan.setAttribute('opacity', (0.9 * st.on).toFixed(2));
        spray.setAttribute('opacity', st.on.toFixed(2));
        mist.setAttribute('opacity', (0.22 * st.on).toFixed(2));
      };
      const follow = () => { st.cut = Math.max(st.cut, st.u); draw(); };
      let demo = null, drops = null;
      const aim = uu => gsap.to(st, { u: Math.max(0, Math.min(80, uu)), duration: 0.3, ease: 'power2.out', overwrite: 'auto', onUpdate: follow });
      const c = {
        enter(p) {
          gsap.to(st, { on: 1, duration: 0.12, overwrite: 'auto', onUpdate: draw });
          drops?.kill();
          drops = gsap.timeline({ repeat: -1 }).fromTo(spray.children,
            { x: 0, y: 0, opacity: 1 },
            { x: i => [-7, 8, -10, 5, 10][i], y: i => [-8, -5, -2, -10, -1][i], opacity: 0, duration: 0.36, stagger: 0.07, ease: 'power1.out' });
          if (p) { c.move(p); return; }
          demo?.kill();
          demo = gsap.to(st, { u: 79, duration: 1.7, ease: 'none', onUpdate: follow });
        },
        move(p) {
          if (!p) return;
          demo?.kill(); demo = null;
          aim(((p[0] - 38.58) * 0.62 + (p[1] - 52.76) * 0.36) / 0.514);
        },
        leave() {
          demo?.kill(); demo = null; drops?.kill(); drops = null;
          gsap.to(st, { on: 0, duration: 0.2, overwrite: 'auto', onUpdate: draw });
          gsap.to(st, { u: REST, cut: REST, duration: 1.2, delay: 0.2, ease: 'power2.inOut', onUpdate: draw });
        },
      };
      draw();
      return c;
    },
  });

  /* ================= A: Shaded object ================= */

  // The spray gun in its own frame: the lance runs along +x from the hand.
  // The housing and the pistol grip are one amber body.
  const A_BODY = 'M-28 -10L2 -8Q8 -7.5 8 -2.5V3Q8 7 3.5 7H-8.5L-13.5 29Q-14.5 33 -18.5 33H-25Q-29 33 -28.5 29L-25 9.5Q-31.5 8.5 -33 1V-4Q-33 -10 -28 -10Z';
  const A_PAD = 'M-11.5 10.5L-15.6 28.6Q-16 30 -17.5 30H-24Q-25.4 30 -25.2 28.6L-22.2 10.5Z';
  const A_TRIG = 'M-8 7Q-3.6 12 -5 19Q-5.6 21.4 -7.8 20.8Q-9.6 20.2 -9.2 18.4Q-8.4 12.4 -11.6 8Z';
  const A_LANCE = 'M8 -2.8H50V2.8H8Z';
  const A_COLLAR = 'M7 -4.6H15Q16.4 -4.6 16.4 -3.2V3.2Q16.4 4.6 15 4.6H7Z';
  const A_NOZ = 'M48 -5.2H59Q62 -5.2 62 -2.2V2.2Q62 5.2 59 5.2H48Z';
  // Pivot (the hand), ground line, rest angle and the angle range.
  const A_P = [46, 34], A_G = 96, A_REST = 52, A_MIN = 44, A_MAX = 62, A_TIPX = 62;
  // The point where the lance axis meets the ground.
  const aHit = th => [A_P[0] + (A_G - A_P[1]) / Math.tan(th * deg), A_G];
  const aNoz = th => [A_P[0] + Math.cos(th * deg) * A_TIPX, A_P[1] + Math.sin(th * deg) * A_TIPX];
  // The fan: narrow at the tip, wide on the ground.
  const aFan = (th, k = 1) => {
    const n = aNoz(th), h = aHit(th), w = (h[1] - n[1]) * 0.36 * k;
    return [[n[0] - 1.2, n[1]], [n[0] + 1.2, n[1]], [h[0] + w, h[1]], [h[0] - w, h[1]]];
  };
  const A_GX = 95, A_GRX = 21, A_GRY = 6.5;
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [4, 4, 114, 98],
    idea: 'The spray gun itself: an amber body, a steel lance and the green tip, over a patch of moss. Hover pulls the trigger. The lance aims at the pointer and the jet scrubs a clean brick band in the moss.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.2)}${blur(`${u}m`, 1.6)}
          ${lg(`${u}gun`, [[0, GUN[0]], [1, GUN[1]]], 'x1="0" y1="0" x2="0.5" y2="1"')}
          ${lg(`${u}steel`, STEEL)}
          ${lg(`${u}tip`, [[0, TIP[0]], [1, TIP[1]]])}
          ${lg(`${u}moss`, [[0, MOSS[0]], [1, MOSS[1]]])}
          ${lg(`${u}brick`, [[0, BRICK[0]], [1, BRICK[1]]])}
          ${lg(`${u}jet`, [[0, WATER, 0.2], [1, WATER, 0.9]])}
          <clipPath id="${u}gr"><ellipse cx="${A_GX}" cy="${A_G}" rx="${A_GRX}" ry="${A_GRY}"/></clipPath></defs>
        <ellipse cx="${A_GX - 26}" cy="${A_G + 3}" rx="44" ry="4" fill="oklch(0.05 0.01 260)" opacity="0.5" filter="url(#${u}b)"/>
        <ellipse cx="${A_GX}" cy="${A_G}" rx="${A_GRX}" ry="${A_GRY}" fill="url(#${u}moss)"/>
        <g clip-path="url(#${u}gr)"><ellipse class="clean" cy="${A_G + 0.6}" ry="${A_GRY - 1.6}" fill="url(#${u}brick)"/></g>
        <ellipse cx="${A_GX}" cy="${A_G}" rx="${A_GRX}" ry="${A_GRY}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
        <g class="water" opacity="0">
          <ellipse class="mist" ry="4.5" fill="${WATER}" opacity="0.5" filter="url(#${u}m)"/>
          <path class="fan" fill="url(#${u}jet)"/>
          <path class="core" fill="${WATER}" opacity="0.85"/>
          <g class="drops" fill="${WATER}"><circle r="2.2"/><circle r="1.8"/><circle r="2.2"/><circle r="1.8"/></g>
        </g>
        <g class="gun">
          <path d="${A_LANCE}" fill="url(#${u}steel)"/>
          <path d="${A_LANCE}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
          <path d="${A_NOZ}" fill="url(#${u}tip)"/>
          <path d="${A_NOZ}" fill="url(#${u}lit)" opacity="0.7"/>
          <path d="${A_NOZ}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
          <path class="trig" d="${A_TRIG}" fill="${GRIP}"/>
          <path d="${A_BODY}" fill="url(#${u}gun)"/>
          <path d="${A_PAD}" fill="${GRIP}"/>
          <path d="${A_BODY}" fill="url(#${u}lit)" opacity="0.8"/>
          <path d="${A_BODY}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
          <path d="${A_COLLAR}" fill="${GRIP}"/>
        </g>`;
      const q = s => svg.querySelector(s);
      const gun = q('.gun'), trig = q('.trig'), water = q('.water'), fan = q('.fan'), core = q('.core'), mist = q('.mist'), drops = q('.drops'), clean = q('.clean');
      // The clean band spans the furthest reach on each side.
      const REST_HIT = aHit(A_REST)[0];
      const st = { th: A_REST, on: 0, lo: REST_HIT - 6, hi: REST_HIT + 6, kick: 0 };
      const draw = time => {
        const th = st.th + st.kick * Math.sin(time * 40) * 0.6;
        gun.setAttribute('transform', `translate(${A_P[0]} ${A_P[1]}) rotate(${f(th)})`);
        trig.setAttribute('transform', `rotate(${f(-16 * st.on)} -9 7)`);
        water.setAttribute('opacity', f(st.on));
        const pts = aFan(th, 0.4 + 0.6 * st.on), h = aHit(th);
        fan.setAttribute('d', poly(pts));
        core.setAttribute('d', poly(aFan(th, 0.22)));
        set(mist, { cx: f(h[0]), cy: f(h[1] - 1), rx: f(9 + 5 * st.on) });
        drops.setAttribute('transform', `translate(${f(h[0])} ${f(h[1] - 1)})`);
        if (st.on > 0.5) { st.lo = Math.min(st.lo, h[0] - 6); st.hi = Math.max(st.hi, h[0] + 6); }
        set(clean, { cx: f((st.lo + st.hi) / 2), rx: f((st.hi - st.lo) / 2) });
      };
      const loop = clock(draw);
      draw(0);
      let demo = null, spray = null;
      const aim = th => gsap.to(st, { th: clamp(th, A_MIN, A_MAX), duration: 0.28, ease: 'power2.out', overwrite: 'auto' });
      const c = {
        enter(p) {
          loop.start();
          gsap.to(st, { on: 1, kick: 1, duration: 0.15, ease: 'power2.out' });
          spray?.kill();
          spray = dropsTl(drops.children, [[-9, -9], [8, -7], [-13, -3], [12, -4]]);
          demo?.kill(); demo = null;
          if (p) { c.move(p); return; }
          // With no pointer, the jet sweeps the moss by itself.
          demo = gsap.fromTo(st, { th: A_MAX }, { th: A_MIN, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: -1 });
        },
        // The lance aims at the pointer's spot on the ground.
        move(p) {
          if (!p) return;
          demo?.kill(); demo = null;
          aim(Math.atan2(A_G - A_P[1], Math.max(1, p[0] - A_P[0])) / deg);
        },
        leave() {
          demo?.kill(); demo = null; spray?.kill(); spray = null;
          // The jet stops; the moss creeps back over the band.
          gsap.to(st, { on: 0, kick: 0, duration: 0.2, overwrite: 'auto' });
          gsap.to(st, { th: A_REST, duration: 0.7, ease: 'power2.inOut' });
          gsap.to(st, { lo: REST_HIT - 6, hi: REST_HIT + 6, duration: 1.2, delay: 0.3, ease: 'power2.inOut', onComplete: () => { if (!st.on) loop.stop(); } });
        },
      };
      return c;
    },
    emblem: (() => {
      const h = aHit(A_REST);
      return `${EMB_HEAD}<ellipse cx="${A_GX}" cy="${A_G}" rx="${A_GRX}" ry="${A_GRY}" fill="#666"/><ellipse cx="${f(h[0])}" cy="${A_G}" rx="9" ry="${A_GRY - 1.6}" fill="#fff"/><path d="${poly(aFan(A_REST, 0.7))}" fill="#bbb"/><g transform="translate(${A_P[0]} ${A_P[1]}) rotate(${A_REST})" fill="#fff"><path d="${A_LANCE}"/><path d="${A_COLLAR}"/><path d="${A_NOZ}"/><path d="${A_BODY}"/><path d="${A_TRIG}"/></g></svg>`;
    })(),
  });

  /* ================= D: Isometric block ================= */

  // A brick paver block under moss; the face is 80 by 80 in 30 degree iso.
  const Y0 = 44, T = 15;
  const iso = (uu, vv) => [64 + 0.62 * (uu - vv), Y0 + 0.36 * (uu + vv)];
  const ISO_M = `matrix(0.62 0.36 -0.62 0.36 64 ${Y0})`;
  const D_C = [iso(0, 0), iso(80, 0), iso(80, 80), iso(0, 80)];
  const down = p => [p[0], p[1] + T];
  // Five courses of bricks in stretcher bond.
  const BRICKS = (() => {
    let s = '';
    for (let r = 0; r < 5; r++) {
      const off = r % 2 ? -13.3 : 0;
      for (let i = 0; i < 4; i++) {
        const x0 = Math.max(0, off + i * 26.67) + 0.9, x1 = Math.min(80, off + (i + 1) * 26.67) - 0.9;
        if (x1 - x0 < 2) continue;
        s += `<rect x="${f(x0)}" y="${f(r * 16 + 0.9)}" width="${f(x1 - x0)}" height="14.2" rx="1.2" fill="${BRICK[(r + i) % 3]}"/>`;
      }
    }
    return s;
  })();
  // The rest trail: one clean curve already cut in the moss.
  const D_REST = 'M12 62C24 40 40 70 56 46';
  const D_END = [56, 46];
  // The lance hangs over the impact and leans up to the right.
  const D_H = 16, D_L = [15, -15];
  const D_NOZ = (uu, vv) => { const [x, y] = iso(uu, vv); return [x, y - D_H]; };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [14, 38, 100, 80],
    idea: 'A brick paver block under moss, with one clean line already cut. Hover starts the jet; the nozzle follows the pointer over the face and scrubs a clean trail. Off the tile, the moss creeps back over the new trail.',
    art(svg, u) {
      const [c0, c1, c2, c3] = D_C;
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}m`, 1.4)}
          ${lg(`${u}moss`, [[0, MOSS[0]], [1, MOSS[1]]], 'x1="0" y1="0" x2="1" y2="1"')}
          ${lg(`${u}gun`, [[0, GUN[0]], [1, GUN[1]]], 'x1="0" y1="0" x2="0.5" y2="1"')}
          ${lg(`${u}steel`, STEEL, 'x1="0" y1="0" x2="1" y2="1"')}
          ${lg(`${u}tip`, [[0, TIP[0]], [1, TIP[1]]], 'x1="0" y1="0" x2="1" y2="1"')}
          ${lg(`${u}jet`, [[0, WATER, 0.2], [1, WATER, 0.9]])}
          <mask id="${u}dirt" maskUnits="userSpaceOnUse" x="-10" y="-10" width="100" height="100">
            <rect x="-10" y="-10" width="100" height="100" fill="#fff"/>
            <path d="${D_REST}" stroke="#000" stroke-width="10" stroke-linecap="round" fill="none"/>
            <path class="trail" stroke="#000" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </mask></defs>
        <path d="${poly([c3, c2, c1, down(c1), down(c2), down(c3)])}" fill="oklch(0.05 0.01 260)" opacity="0.45" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${poly([c3, c2, down(c2), down(c3)])}" fill="oklch(0.55 0.11 46)"/>
        <path d="${poly([c2, c1, down(c1), down(c2)])}" fill="oklch(0.38 0.09 40)"/>
        <path d="${poly([c3, c2, c1, [c1[0], c1[1] + 4], [c2[0], c2[1] + 4], [c3[0], c3[1] + 4]])}" fill="${MOSS[1]}"/>
        <g transform="${ISO_M}">
          <rect width="80" height="80" fill="oklch(0.5 0.05 70)"/>
          ${BRICKS}
          <g mask="url(#${u}dirt)">
            <rect width="80" height="80" fill="url(#${u}moss)"/>
            <g fill="oklch(0.55 0.1 134)"><ellipse cx="16" cy="16" rx="12" ry="8"/><ellipse cx="66" cy="22" rx="11" ry="9"/><ellipse cx="40" cy="74" rx="14" ry="6"/></g>
          </g>
        </g>
        <path d="${poly(D_C)}" fill="url(#${u}lit)" opacity="0.4"/>
        <path d="M${f(c3[0])} ${f(c3[1])}L${f(c2[0])} ${f(c2[1])}L${f(c1[0])} ${f(c1[1])}" stroke="#fff" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g class="water" opacity="0">
          <ellipse class="mist" rx="11" ry="5" fill="${WATER}" opacity="0.5" filter="url(#${u}m)"/>
          <path class="fan" fill="url(#${u}jet)"/>
          <g class="drops" fill="${WATER}"><circle r="2"/><circle r="1.7"/><circle r="2"/><circle r="1.7"/></g>
        </g>
        <g class="wand">
          <path class="lance" stroke="url(#${u}steel)" stroke-width="4.4" stroke-linecap="round" fill="none"/>
          <path class="body" fill="url(#${u}gun)"/>
          <path class="bodylit" fill="url(#${u}lit)" opacity="0.8"/>
          <path class="bodyrim" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
          <path class="noz" fill="url(#${u}tip)"/>
          <path class="nozrim" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
        </g>`;
      const q = s => svg.querySelector(s);
      const trail = q('.trail'), water = q('.water'), fan = q('.fan'), mist = q('.mist'), drops = q('.drops');
      const lance = q('.lance'), bodies = [q('.body'), q('.bodylit'), q('.bodyrim')], nozs = [q('.noz'), q('.nozrim')];
      const st = { u: D_END[0], v: D_END[1], on: 0, fade: 1 };
      let pts = [];
      // A box along the lance direction, centred at p, w long and h wide.
      const box = (p, w, h, r = 2) => {
        const L = Math.hypot(...D_L), ax = [D_L[0] / L, D_L[1] / L], nx = [-ax[1], ax[0]];
        const at = (a, b) => [p[0] + ax[0] * a + nx[0] * b, p[1] + ax[1] * a + nx[1] * b];
        const A = at(-w / 2, -h / 2), B = at(w / 2, -h / 2), C = at(w / 2, h / 2), D = at(-w / 2, h / 2);
        return `M${f(A[0])} ${f(A[1])}L${f(B[0])} ${f(B[1])}L${f(C[0])} ${f(C[1])}L${f(D[0])} ${f(D[1])}Z`;
      };
      const draw = () => {
        const [x, y] = iso(st.u, st.v), n = D_NOZ(st.u, st.v);
        const top = [n[0] + D_L[0], n[1] + D_L[1]];
        lance.setAttribute('d', `M${f(n[0])} ${f(n[1])}L${f(top[0])} ${f(top[1])}`);
        const L = Math.hypot(...D_L), k = 5 / L;
        const bd = box([top[0] + D_L[0] * k, top[1] + D_L[1] * k], 16, 9);
        bodies.forEach(e => e.setAttribute('d', bd));
        const nd = box([n[0] + D_L[0] * 0.08, n[1] + D_L[1] * 0.08], 7, 7.4);
        nozs.forEach(e => e.setAttribute('d', nd));
        const w = 3 + 5 * st.on;
        fan.setAttribute('d', poly([[n[0] - 1.4, n[1] + 2], [n[0] + 1.4, n[1] + 2], [x + w, y], [x - w, y]]));
        set(mist, { cx: f(x), cy: f(y) });
        drops.setAttribute('transform', `translate(${f(x)} ${f(y)})`);
        water.setAttribute('opacity', f(st.on));
        // The jet adds a trail point each 2 face units.
        if (st.on > 0.5) {
          const last = pts[pts.length - 1];
          if (!last || Math.hypot(st.u - last[0], st.v - last[1]) > 2) { pts.push([st.u, st.v]); if (pts.length > 120) pts.shift(); }
        }
        trail.setAttribute('d', pts.length ? 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + (pts.length === 1 ? 'l0.01 0' : '') : '');
        trail.setAttribute('stroke-opacity', f(st.fade));
      };
      draw();
      let demo = null, spray = null, home = null;
      const toFace = p => {
        const a = (p[0] - 64) / 0.62, b = (p[1] - Y0) / 0.36;
        return [clamp((a + b) / 2, 6, 74), clamp((b - a) / 2, 6, 74)];
      };
      const c = {
        enter(p) {
          home?.kill(); home = null;
          st.fade = 1;
          gsap.to(st, { on: 1, duration: 0.15, ease: 'power2.out', onUpdate: draw, overwrite: 'auto' });
          spray?.kill();
          spray = dropsTl(drops.children, [[-8, -8], [7, -6], [-11, -2], [10, -3]]);
          demo?.kill(); demo = null;
          if (p) { c.move(p); return; }
          // With no pointer, the jet writes a loop by itself.
          const o = { a: 0 };
          demo = gsap.to(o, { a: Math.PI * 2, duration: 2.4, ease: 'none', repeat: -1, onUpdate: () => { st.u = 40 + Math.cos(o.a) * 22; st.v = 40 + Math.sin(o.a * 2) * 14; draw(); } });
        },
        // The impact follows the pointer over the face.
        move(p) {
          if (!p) return;
          demo?.kill(); demo = null;
          const [uu, vv] = toFace(p);
          gsap.to(st, { u: uu, v: vv, duration: 0.2, ease: 'power2.out', onUpdate: draw, overwrite: 'auto' });
        },
        leave() {
          demo?.kill(); demo = null; spray?.kill(); spray = null;
          gsap.to(st, { on: 0, duration: 0.2, onUpdate: draw });
          // The moss creeps back; the nozzle returns to its rest spot.
          home = gsap.timeline()
            .to(st, { u: D_END[0], v: D_END[1], duration: 0.8, ease: 'power2.inOut', onUpdate: draw }, 0.15)
            .to(st, { fade: 0, duration: 1.4, ease: 'sine.inOut', onUpdate: draw }, 0.3)
            .add(() => { pts = []; st.fade = 1; draw(); });
        },
      };
      return c;
    },
    emblem: (() => {
      const [c0, c1, c2, c3] = D_C;
      const n = D_NOZ(...D_END), top = [n[0] + D_L[0], n[1] + D_L[1]];
      return `${EMB_HEAD}<path d="${poly([c3, c2, down(c2), down(c3)])}" fill="#5a5a5a"/><path d="${poly([c2, c1, down(c1), down(c2)])}" fill="#3a3a3a"/><path d="${poly(D_C)}" fill="#8a8a8a"/><path d="${D_REST}" transform="${ISO_M}" stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M${f(n[0])} ${f(n[1])}L${f(top[0])} ${f(top[1])}" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="${f(top[0] + 4)}" cy="${f(top[1] - 4)}" r="6" fill="#fff"/></svg>`;
    })(),
  });

  /* ================= Gallery ================= */
  const NAME = 'Pressure washer';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-washer';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `washer-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
