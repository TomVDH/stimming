<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Contour map 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Contour map 1</h1>
<p class="lede">Contour map, round 1. No pick yet; A goes on the menu until Tom picks. A: a relief model in layers, one slab for each contour, rising from a blue sea in the map's own tints, green to tan to a pale peak. D: the same layered hill on a block of sea and rock at 30 degrees.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  // Paths round to one decimal: 128 units need no finer.
  const f1 = n => +n.toFixed(1);
  const poly = pts => 'M' + pts.map(p => `${f1(p[0])} ${f1(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  const ok = ([L, C, H], dl = 0) => `oklch(${f(Math.max(0, L + dl))} ${C} ${H})`;
  const DIRS = [];
  // An emblem's drawing, framed so its long side fills 110 of 128.
  const fitG = (box, body) => {
    const k = 110 / Math.max(box[2], box[3]), cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    return `<g transform="translate(64 64) scale(${f(k)}) translate(${f(-cx)} ${f(-cy)})">${body}</g>`;
  };

  /* ---------- the layered hill ---------- */
  // Each layer is one contour: a closed blob in plan, raised by its height.
  // The blobs share their wobble, so the layers nest like real contours.
  const SEA = [0.6, 0.11, 236];
  const TINT = [[0.7, 0.14, 142], [0.77, 0.13, 120], [0.81, 0.12, 92], [0.73, 0.11, 62], [0.94, 0.03, 85]];
  // Plan radius, centre drift and wobble phase for each land layer.
  const LAYERS = [
    { r: 41, dx: 0, dy: 0, ph: 0 },
    { r: 32, dx: -2.5, dy: -1.5, ph: 0.25 },
    { r: 24, dx: -5, dy: -3.5, ph: 0.5 },
    { r: 16, dx: -6.5, dy: -5, ph: 0.8 },
    { r: 8.5, dx: -7.5, dy: -6, ph: 1.1 },
  ];
  // Plan points of one blob, counter-clockwise from the right.
  const blob = (r, ph, n = 44) => Array.from({ length: n }, (_, i) => {
    const a = (i / n) * Math.PI * 2;
    const k = 1 + 0.1 * Math.cos(2 * a - 0.6 + ph) + 0.07 * Math.cos(3 * a + 1.9 - ph) + 0.035 * Math.cos(5 * a + 0.4 + ph * 2);
    return [Math.cos(a) * r * k, Math.sin(a) * r * k];
  });
  // The wall under a top outline: its front arc, swept down by h.
  const wall = (P, h) => {
    let i0 = 0, i1 = 0;
    P.forEach((p, i) => { if (p[0] < P[i0][0]) i0 = i; if (p[0] > P[i1][0]) i1 = i; });
    const front = [];
    // The front runs from the right end through the near side to the left end.
    for (let i = i1; ; i = (i + 1) % P.length) { front.push(P[i]); if (i === i0) break; }
    return poly([...front, ...front.slice().reverse().map(p => [p[0], p[1] + h])]);
  };
  const line = pts => 'M' + pts.map(p => `${f1(p[0])} ${f1(p[1])}`).join('L') + 'Z';

  // The hill seen from the front and a little above.
  // cx, cy: the sea's centre; sq: the plan's squash; step: each layer's rise.
  const hill = ({ cx, cy, sq, step, k = 1, sea = true }) => {
    const out = { sea: null, layers: [] };
    if (sea) out.sea = blob(51 * k, -0.3).map(([x, y]) => [cx + x * 1.04, cy + y * sq]);
    LAYERS.forEach((L, i) => {
      const z = step * (i + 1);
      const P = blob(L.r * k, L.ph).map(([x, y]) => [cx + (x + L.dx * k), cy + (y + L.dy * k) * sq - z]);
      out.layers.push({ P, z, tint: TINT[i] });
    });
    return out;
  };
  const bounds = pts => {
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
  };

  // The hill as markup. Each layer: a wall, a top in its tint, the lit, a rim.
  const hillMarkup = (u, H, { step, wallK = 1 }) => {
    let s = '';
    if (H.sea) {
      const b = bounds(H.sea);
      s += `<path d="${wall(H.sea, 4)}" fill="${ok(SEA, -0.2)}"/>
        <path d="${line(H.sea)}" fill="url(#${u}sea)"/>
        <ellipse cx="${f((b[0] + b[2]) / 2 - 6)}" cy="${f((b[1] + b[3]) / 2 - 2)}" rx="${f((b[2] - b[0]) * 0.42)}" ry="${f((b[3] - b[1]) * 0.36)}" fill="url(#${u}lit)" opacity="0.5"/>`;
    }
    H.layers.forEach((L, i) => {
      s += `<g class="lay">
        <path d="${wall(L.P, step * wallK)}" fill="url(#${u}w${i})"/>
        <path d="${line(L.P)}" fill="url(#${u}t${i})"/>
        <path d="${line(L.P)}" fill="url(#${u}lit)" opacity="0.55"/>
        <path d="${line(L.P)}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/></g>`;
    });
    return s;
  };
  const hillDefs = u => [
    lg(`${u}sea`, [[0, ok(SEA, 0.08)], [1, ok(SEA, -0.06)]], 'x1="0.2" y1="0" x2="0.7" y2="1"'),
    ...TINT.map((t, i) => lg(`${u}t${i}`, [[0, ok(t, 0.06)], [1, ok(t, -0.06)]], 'x1="0.15" y1="0" x2="0.75" y2="1"')),
    ...TINT.map((t, i) => lg(`${u}w${i}`, [[0, ok(t, -0.22)], [1, ok(t, -0.32)]], 'x1="0" y1="0" x2="1" y2="0"')),
  ].join('');

  // The shared motion: play swells the hill; it rises taller and breathes.
  // Rest lets it settle back, then the clock stops.
  const swell = (g, base) => {
    const st = { live: false, k: 0, last: 0 };
    let on = false;
    const paint = time => {
      const s = 1 + 0.3 * st.k + 0.035 * st.k * Math.sin(time * 5.2);
      g.setAttribute('transform', `translate(0 ${f(base)}) scale(1 ${f(s)}) translate(0 ${f(-base)})`);
    };
    const tick = () => {
      const time = gsap.ticker.time, dt = Math.min(0.1, time - (st.last || time));
      st.last = time;
      st.k += ((st.live ? 1 : 0) - st.k) * (1 - Math.exp(-dt / 0.22));
      if (!st.live && st.k < 0.004) { st.k = 0; paint(time); st.last = 0; gsap.ticker.remove(tick); on = false; return; }
      paint(time);
    };
    const go = () => { if (!on) { on = true; gsap.ticker.add(tick); } };
    return { enter() { st.live = true; go(); }, move() {}, leave() { st.live = false; go(); } };
  };

  /* ================= Current ================= */

  // Contour map is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // A relief model in layers: one slab for each contour, on a blue sea.
  const AST = 7.5, AH = hill({ cx: 64, cy: 80, sq: 0.5, step: AST });
  const ABASE = 80 + 4;
  const AB = bounds([...AH.sea.map(p => [p[0], p[1] + 4]), ...AH.layers.flatMap(L => L.P)]);
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [AB[0] - 2, AB[1] - 2, AB[2] - AB[0] + 4, AB[3] - AB[1] + 4],
    idea: 'A relief model in layers, as a survey sheet builds a hill: one slab for each contour, stacked and stepping in toward a peak off the centre. The slabs take the map\'s tints, green on the low ground, then yellow-green, tan and brown, and a pale peak on top. They stand on a flat blue sea. The pointer swells the hill: it rises taller and breathes; when the pointer leaves, it settles back.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${hillDefs(u)}${blur(`${u}h`, 6)}</defs>
        <ellipse cx="64" cy="${ABASE}" rx="50" ry="16" fill="oklch(0.05 0.01 240)" opacity="0.45" filter="url(#${u}h)"/>
        <g class="hill">${hillMarkup(u, AH, { step: AST })}</g>`;
      // The sea stays flat; only the land layers swell.
      const g = svg.querySelector('.hill');
      const land = document.createElementNS(NS, 'g');
      g.querySelectorAll('.lay').forEach(n => land.append(n));
      g.append(land);
      return swell(land, 80);
    },
    // The emblem: white tops, grey walls, a dark grey sea.
    emblem: `${EMB_HEAD}${fitG([AB[0], AB[1], AB[2] - AB[0], AB[3] - AB[1]], `<path d="${wall(AH.sea, 4)}" fill="#3a3a3a"/><path d="${line(AH.sea)}" fill="#767676"/>${AH.layers.map(L => `<path d="${wall(L.P, AST)}" fill="#9a9a9a"/><path d="${line(L.P)}" fill="#fff"/>`).join('')}`)}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A block of sea and rock at 30 degrees; the layered hill rises from its top.
  const CY = 50, HX = 34, HY = 34, T = 16;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const Nn = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // The hill's plan, laid on the block's top by the iso matrix.
  const DK = 0.72, DST = 6.6;
  const isoHill = () => LAYERS.map((L, i) => {
    const z = DST * (i + 1);
    const P = blob(L.r * DK, L.ph).map(([x, y]) => { const [sx, sy] = iso(x + L.dx * DK, y + L.dy * DK); return [sx, sy - z]; });
    return { P, z, tint: TINT[i] };
  });
  const DH = { sea: null, layers: isoHill() };
  const DB = bounds([Nn, E, down(S), down(W), down(E), ...DH.layers.flatMap(L => L.P)]);
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [DB[0] - 1, DB[1] - 2, DB[2] - DB[0] + 2, DB[3] - DB[1] + 6],
    idea: 'A block at 30 degrees: the top is sea, light blue; the left face is earth, the right face darker rock, with a rim on the top edges. The layered hill rises from the middle of the top, the map\'s tints from green to a pale peak. The pointer swells the hill; it settles when the pointer leaves.',
    art(svg, u) {
      const top = poly([Nn, E, S, W]);
      svg.innerHTML = `<defs>${light(u)}${hillDefs(u)}${blur(`${u}b`, 2.6)}
          ${lg(`${u}top`, [[0, ok(SEA, 0.1)], [1, ok(SEA, -0.04)]], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.52 0.07 58)'], [1, 'oklch(0.4 0.06 52)']])}
          ${lg(`${u}R`, [[0, 'oklch(0.36 0.05 50)'], [1, 'oklch(0.27 0.04 46)']])}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <path d="${poly([W, S, down(S, 0.38), down(W, 0.38)])}" fill="oklch(0.62 0.08 75)" opacity="0.55"/>
        <path d="${poly([S, E, down(E, 0.38), down(S, 0.38)])}" fill="oklch(0.48 0.06 68)" opacity="0.55"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)" opacity="0.6"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(Nn[0])} ${f(Nn[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g class="hill">${hillMarkup(u, DH, { step: DST })}</g>`;
      return swell(svg.querySelector('.hill'), CY + 2);
    },
    emblem: `${EMB_HEAD}${fitG([DB[0], DB[1], DB[2] - DB[0], DB[3] - DB[1]], `<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([Nn, E, S, W])}" fill="#7a7a7a"/>${DH.layers.map(L => `<path d="${wall(L.P, DST)}" fill="#9a9a9a"/><path d="${line(L.P)}" fill="#fff"/>`).join('')}`)}</svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = 'Contour map';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-contour';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `contour-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
