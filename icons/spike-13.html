<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 13</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- The night sky: deep blue at the pole, near black at the edge. -->
    <radialGradient id="st-sky" cx="0.5" cy="0.36" r="0.72">
      <stop offset="0" style="stop-color: oklch(0.26 0.07 272)"/>
      <stop offset="1" style="stop-color: oklch(0.13 0.035 268)"/>
    </radialGradient>
    <!-- The town glow: warm light low on the horizon. -->
    <linearGradient id="st-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" style="stop-color: oklch(0.6 0.12 55)" stop-opacity="0"/>
      <stop offset="0.84" style="stop-color: oklch(0.62 0.12 55)" stop-opacity="0.6"/>
    </linearGradient>
    <!-- The stencil tile: twilight violet to night blue. -->
    <linearGradient id="st-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.52 0.15 285)"/>
      <stop offset="1" style="stop-color: oklch(0.34 0.12 262)"/>
    </linearGradient>
    <!-- The block top: the sky seen from above. -->
    <linearGradient id="st-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.3 0.08 275)"/>
      <stop offset="1" style="stop-color: oklch(0.17 0.05 265)"/>
    </linearGradient>
    <!-- The block face: horizon glow under the dark ridge. -->
    <linearGradient id="st-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.34 0.08 280)"/>
      <stop offset="1" style="stop-color: oklch(0.56 0.12 50)"/>
    </linearGradient>
  </defs>
</svg>

<h1>Icon spike 13</h1>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const D2R = Math.PI / 180;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };
  // The shutter: t opens from 0 to 1 and back while hovered.
  const shutter = (st, dur, draw) => hoverLoop(
    () => gsap.to(st, { t: 1, duration: dur, ease: 'sine.inOut', yoyo: true, repeat: -1, onUpdate: draw }),
    () => gsap.to(st, { t: 0, duration: 0.5, ease: 'power2.out', onUpdate: draw, overwrite: true }));

  // An arc around (cx, cy), clockwise from a0 to a1 in degrees.
  const arcD = (cx, cy, r, a0, a1) => {
    const s = Math.min(359, Math.max(0.5, a1 - a0)), b = a0 + s;
    const x0 = cx + r * Math.cos(a0 * D2R), y0 = cy + r * Math.sin(a0 * D2R);
    const x1 = cx + r * Math.cos(b * D2R), y1 = cy + r * Math.sin(b * D2R);
    return `M${f(x0)} ${f(y0)}A${f(r)} ${f(r)} 0 ${s > 180 ? 1 : 0} 1 ${f(x1)} ${f(y1)}`;
  };
  // Star colours: warm, white and blue, as the toy draws them.
  const COL = ['oklch(0.86 0.1 60)', 'oklch(0.95 0.02 95)', 'oklch(0.84 0.09 245)'];
  // One trail per ring: radius, start, sweep, colour and brightness.
  const TRAILS = [
    [6, 200, 70, 1, 1], [11, 30, 95, 2, 0.7], [16, 250, 80, 0, 0.9], [21, 120, 110, 1, 0.6],
    [27, 300, 85, 2, 1], [33, 170, 120, 0, 0.75], [39, 15, 90, 1, 0.9], [45, 215, 100, 2, 0.65],
    [51, 95, 115, 0, 0.85], [57, 330, 95, 1, 0.7],
  ];
  // Each trail grows by this many degrees while the shutter is open.
  const GROW = 70;

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  DIRS.push({
    toy: 'trails', l: 'Current', name: 'Menu icon', emblemUrl: '../shared/emblems/trails.svg',
    art(svg, id) {
      svg.innerHTML = `
        <defs><clipPath id="${id}c"><circle cx="64" cy="64" r="46"/></clipPath></defs>
        <g clip-path="url(#${id}c)">
          <rect x="18" y="18" width="92" height="92" fill="oklch(0.2 0.04 265)"/>
          <g class="arcs" fill="none" stroke-width="2" stroke-linecap="round">
            <path d="M58.4 43.9A6 6 0 0 1 68.6 42.1" stroke="oklch(0.94 0.02 95)"/>
            <path d="M72.4 53.1A11 11 0 0 1 53.2 44.1" stroke="oklch(0.84 0.07 245)"/>
            <path d="M58.5 31.0A16 16 0 0 1 80.0 46.0" stroke="oklch(0.86 0.08 60)"/>
            <path d="M64.0 68.0A22 22 0 0 1 49.9 29.1" stroke="oklch(0.94 0.02 95)"/>
            <path d="M78.0 21.8A28 28 0 0 1 78.0 70.2" stroke="oklch(0.84 0.07 245)"/>
            <path d="M33.7 63.5A35 35 0 0 1 52.0 13.1" stroke="oklch(0.86 0.08 60)"/>
            <path d="M105.4 53.3A42 42 0 0 1 31.8 73.0" stroke="oklch(0.94 0.02 95)"/>
            <path d="M17.0 28.9A50 50 0 0 1 96.1 7.7" stroke="oklch(0.84 0.07 245)"/>
          </g>
          <circle cx="64" cy="46" r="1.8" fill="oklch(0.97 0.01 95)"/>
          <path d="M18 92C34 88 44 91 58 88S88 86 110 90V110H18Z" fill="oklch(0.1 0.015 265)"/>
        </g>`;
      const arcs = svg.querySelector('.arcs');
      return hoverLoop(
        () => gsap.fromTo(arcs, { rotation: 0, svgOrigin: '64 46' }, { rotation: 360, svgOrigin: '64 46', duration: 9, ease: 'none', repeat: -1 }),
        () => gsap.to(arcs, { rotation: 0, svgOrigin: '64 46', duration: 0.4, overwrite: true }));
    },
  });

  /* ================= A · Shaded object ================= */

  // A round porthole on the night: lit glass, coloured trails, a warm horizon.
  {
    const P = [64, 50];
    const RIDGE = 'M10 90C24 85 36 88 48 84S74 85 86 81S108 84 118 86V120H10Z';
    DIRS.push({
      toy: 'trails', l: 'A', name: 'Shaded object',
      box: [12, 12, 104, 104],
      art(svg, id) {
        svg.innerHTML = `
          <defs><clipPath id="${id}c"><circle cx="64" cy="64" r="50"/></clipPath></defs>
          <circle cx="64" cy="64" r="50" fill="url(#st-sky)"/>
          <g clip-path="url(#${id}c)">
            <rect x="14" y="14" width="100" height="100" fill="url(#st-glow)"/>
            <g class="arcs" fill="none" stroke-linecap="round">
              ${TRAILS.map(([r, , , c, b]) => `<path stroke="${COL[c]}" stroke-width="${f(1.3 + b * 1.4)}" stroke-opacity="${f(0.45 + b * 0.55)}"/>`).join('')}
            </g>
            <line class="met" x1="88" y1="26" x2="100" y2="46" stroke="oklch(0.95 0.08 150)" stroke-width="2" stroke-linecap="round" opacity="0"/>
            <circle cx="${P[0]}" cy="${P[1]}" r="5" fill="#fff" fill-opacity="0.16"/>
            <circle cx="${P[0]}" cy="${P[1]}" r="2.3" fill="oklch(0.98 0.01 95)"/>
            <path d="${RIDGE}" fill="oklch(0.08 0.015 265)"/>
          </g>
          <circle cx="64" cy="64" r="50" fill="url(#lit)" opacity="0.55"/>
          <circle cx="64" cy="64" r="49.2" fill="none" stroke="url(#rim)" stroke-width="1.8"/>
          <circle cx="64" cy="64" r="50" fill="none" stroke="oklch(0.34 0.04 270)" stroke-width="1"/>`;
        const paths = [...svg.querySelectorAll('.arcs path')], met = svg.querySelector('.met');
        const st = { t: 0 };
        const draw = () => {
          paths.forEach((p, k) => { const [r, a0, s] = TRAILS[k]; p.setAttribute('d', arcD(P[0], P[1], r, a0, a0 + s + GROW * st.t)); });
          // A meteor flashes once near the top of each exposure.
          met.setAttribute('opacity', f(smooth(0.55, 0.7, st.t) * (1 - smooth(0.8, 0.95, st.t))));
        };
        draw();
        return shutter(st, 2.2, draw);
      },
      emblem: emb(`
        <clipPath id="s"><path d="M14 64A50 50 0 0 1 114 64V86C108 84 96 80 86 81S60 84 48 84S24 85 14 88Z"/></clipPath>
        <g clip-path="url(#s)" fill="none" stroke="#fff" stroke-linecap="round">
        ${TRAILS.slice(0, 8).map(([r, a0, s, , b]) => `<path d="${arcD(P[0], P[1], r, a0, a0 + s)}" stroke-width="${f(2.6 + b * 1.4)}"/>`).join('\n')}
        </g>
        <circle cx="${P[0]}" cy="${P[1]}" r="4" fill="#fff"/>
        <circle cx="64" cy="64" r="50" fill="none" stroke="#fff" stroke-width="4"/>
        <path d="M14 88C24 85 36 88 48 84S74 85 86 81S108 84 114 86" fill="none" stroke="#fff" stroke-width="3.6"/>
      `),
    });
  }

  /* ================= B · Stencil cut-out ================= */

  // A violet tile with the trails cut through it; bridges hold each slot.
  {
    const P = [64, 52];
    const RL = 'M18 88C30 84 40 87 52 83S76 84 88 80S104 83 110 84';
    const LIST = TRAILS.slice(0, 8);
    DIRS.push({
      toy: 'trails', l: 'B', name: 'Stencil cut-out',
      box: [14, 14, 100, 100],
      art(svg, id) {
        svg.innerHTML = `
          <defs><clipPath id="${id}c"><path d="M14 30A16 16 0 0 1 30 14H98A16 16 0 0 1 114 30V83C104 82 96 79 88 80S64 84 52 83S26 85 14 89Z"/></clipPath></defs>
          <rect x="14" y="14" width="100" height="100" rx="16" fill="url(#st-tile)"/>
          <rect x="14" y="14" width="100" height="100" rx="16" fill="url(#lit)"/>
          <path d="M14 92C26 88 40 90 52 86S76 87 88 83S106 86 114 87V98A16 16 0 0 1 98 114H30A16 16 0 0 1 14 98Z" fill="oklch(0.24 0.08 262)"/>
          <path d="${RL}" fill="none" style="stroke: var(--bg)" stroke-width="4" stroke-linecap="round"/>
          <g clip-path="url(#${id}c)" fill="none" style="stroke: var(--bg)" stroke-width="4" stroke-linecap="round">
            ${LIST.map(() => '<path/>').join('')}
          </g>
          <circle cx="${P[0]}" cy="${P[1]}" r="4.2" style="fill: var(--bg)"/>
          <rect x="14" y="14" width="100" height="100" rx="16" fill="none" stroke="url(#rim)" stroke-width="1.6"/>`;
        const paths = [...svg.querySelectorAll('g path')];
        const st = { t: 0 };
        const draw = () => paths.forEach((p, k) => {
          const [r, a0, s] = LIST[k], sw = s + GROW * st.t, L = r * sw * D2R;
          p.setAttribute('d', arcD(P[0], P[1], r + 1, a0, a0 + sw));
          // One bridge holds each slot near its middle.
          p.setAttribute('stroke-dasharray', L > 26 ? `${f(L * 0.48)} 5 ${f(L)}` : 'none');
        });
        draw();
        return shutter(st, 2.2, draw);
      },
      emblem: emb(`
        <mask id="m">
        <rect x="14" y="14" width="100" height="100" rx="16" fill="#fff"/>
        <g fill="none" stroke="#000" stroke-width="5" stroke-linecap="round">
        ${LIST.map(([r, a0, s]) => { const L = (r + 1) * s * D2R; return `<path d="${arcD(P[0], P[1], r + 1, a0, a0 + s)}"${L > 26 ? ` stroke-dasharray="${f(L * 0.48)} 6 ${f(L)}"` : ''}/>`; }).join('\n')}
        <path d="${RL}"/>
        </g>
        <circle cx="${P[0]}" cy="${P[1]}" r="5" fill="#000"/>
        </mask>
        <rect x="14" y="14" width="100" height="100" rx="16" fill="#fff" mask="url(#m)"/>
      `),
    });
  }

  /* ================= C · Single-weight line ================= */

  // One stroke weight: arcs round the pole and a long horizon line.
  {
    const P = [64, 56];
    const LIST = [[9, 210, 90], [17, 20, 110], [25, 240, 100], [33, 110, 120], [41, 300, 95], [49, 175, 105]];
    const INK = 'oklch(0.9 0.05 85)';
    DIRS.push({
      toy: 'trails', l: 'C', name: 'Single-weight line',
      box: [10, 6, 108, 104],
      art(svg, id) {
        svg.innerHTML = `
          <defs><clipPath id="${id}c"><rect x="0" y="0" width="128" height="94"/></clipPath></defs>
          <g clip-path="url(#${id}c)" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round">${LIST.map(() => '<path/>').join('')}</g>
          <circle cx="${P[0]}" cy="${P[1]}" r="3.4" fill="${INK}"/>
          <path d="M12 100H116" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;
        const paths = [...svg.querySelectorAll('g path')];
        const st = { t: 0 };
        const draw = () => paths.forEach((p, k) => { const [r, a0, s] = LIST[k]; p.setAttribute('d', arcD(P[0], P[1], r, a0, a0 + s + GROW * st.t)); });
        draw();
        return shutter(st, 2.2, draw);
      },
      emblem: emb(`
        <clipPath id="s"><rect x="0" y="0" width="128" height="94"/></clipPath>
        <g clip-path="url(#s)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
        ${LIST.map(([r, a0, s]) => `<path d="${arcD(P[0], P[1], r, a0, a0 + s)}"/>`).join('\n')}
        </g>
        <circle cx="${P[0]}" cy="${P[1]}" r="4.6" fill="#fff"/>
        <path d="M12 100H116" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      `),
    });
  }

  /* ================= D · Isometric block ================= */

  // A slab: the sky turns on its top face; the front shows the horizon.
  {
    const T = [64, 18], UR = [110, 44.6], C0 = [64, 71.2], UL = [18, 44.6];
    const LL = [18, 72.6], BB = [64, 99.2], LR = [110, 72.6];
    const CEN = [64, 44.6];
    // A circle of radius r on the top face draws as this ellipse.
    const ISO = `translate(${CEN[0]} ${CEN[1]}) scale(1.2247 0.7071)`;
    const LIST = [[5, 200, 80, 1], [9, 40, 100, 2], [13, 250, 90, 0], [17, 120, 110, 1], [21, 300, 95, 2], [25, 170, 120, 0], [29, 20, 100, 1], [33, 220, 110, 2]];
    // The ridge runs along the left face, which slopes down to the front.
    const onLeft = (u, v) => [UL[0] + (C0[0] - UL[0]) * u, UL[1] + (C0[1] - UL[1]) * u + v];
    const RIDGE = [onLeft(0, 12), onLeft(0.2, 9), onLeft(0.38, 12), onLeft(0.6, 7.5), onLeft(0.8, 10.5), onLeft(1, 8), BB, LL];
    DIRS.push({
      toy: 'trails', l: 'D', name: 'Isometric block',
      box: [14, 14, 100, 90],
      art(svg, id) {
        svg.innerHTML = `
          <defs><clipPath id="${id}c"><path d="${poly([T, UR, C0, UL])}"/></clipPath></defs>
          <path d="${poly([UL, C0, BB, LL])}" fill="url(#st-face)"/>
          <path d="${poly(RIDGE)}" fill="oklch(0.1 0.02 265)"/>
          <path d="${poly([C0, UR, LR, BB])}" fill="oklch(0.14 0.03 265)"/>
          <path d="${poly([T, UR, C0, UL])}" fill="url(#st-top)"/>
          <g clip-path="url(#${id}c)">
            <g transform="${ISO}"><g class="spin" fill="none" stroke-linecap="round">
              ${LIST.map(([, , , c]) => `<path stroke="${COL[c]}" stroke-width="2" vector-effect="non-scaling-stroke"/>`).join('')}
            </g></g>
          </g>
          <circle cx="${CEN[0]}" cy="${CEN[1]}" r="2" fill="oklch(0.98 0.01 95)"/>
          <path d="${poly([T, UR, C0, UL])}" fill="none" stroke="url(#rim)" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M${C0[0]} ${C0[1]}V${BB[1]}" stroke="oklch(0.9 0.04 60 / 0.35)" stroke-width="1.2"/>`;
        const paths = [...svg.querySelectorAll('.spin path')];
        const st = { t: 0 };
        const draw = () => paths.forEach((p, k) => { const [r, a0, s] = LIST[k]; p.setAttribute('d', arcD(0, 0, r, a0, a0 + s + GROW * st.t)); });
        draw();
        return shutter(st, 2.2, draw);
      },
      emblem: emb(`
        <path d="${poly([T, UR, LR, BB, LL, UL])}" fill="#fff"/>
        <path d="${poly([T, UR, C0, UL])}" fill="#000"/>
        <path d="${poly(RIDGE)}" fill="#000"/>
        <path d="M${C0[0]} ${C0[1]}V${BB[1]}" stroke="#000" stroke-width="3"/>
        <g transform="${ISO}" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
        ${LIST.map(([r, a0, s]) => `<path d="${arcD(0, 0, r, a0, a0 + s)}" vector-effect="non-scaling-stroke"/>`).join('\n')}
        </g>
        <circle cx="${CEN[0]}" cy="${CEN[1]}" r="3" fill="#fff"/>
      `),
    });
  }

  /* ================= E · Abstract mark ================= */

  // Three heavy arcs step out from the pole, each one starting late.
  {
    const P = [64, 64];
    const LIST = [[13, 150, 115, 1], [28, 235, 120, 2], [43, 320, 125, 0]];
    DIRS.push({
      toy: 'trails', l: 'E', name: 'Abstract mark',
      box: [16, 16, 96, 96],
      art(svg) {
        svg.innerHTML = `
          <g fill="none" stroke-width="10" stroke-linecap="round">
            ${LIST.map(([, , , c]) => `<path stroke="${COL[c]}"/>`).join('')}
          </g>
          <circle cx="${P[0]}" cy="${P[1]}" r="6" fill="oklch(0.98 0.01 95)"/>`;
        const paths = [...svg.querySelectorAll('g path')];
        const st = { t: 0 };
        // The outer arcs sweep faster, so the mark winds up while hovered.
        const draw = () => paths.forEach((p, k) => { const [r, a0, s] = LIST[k], d = 40 * st.t * (1 + k * 0.7); p.setAttribute('d', arcD(P[0], P[1], r, a0 + d * 0.4, a0 + s + d)); });
        draw();
        return shutter(st, 1.8, draw);
      },
      emblem: emb(`
        <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round">
        ${LIST.map(([r, a0, s]) => `<path d="${arcD(P[0], P[1], r, a0, a0 + s)}"/>`).join('\n')}
        </g>
        <circle cx="${P[0]}" cy="${P[1]}" r="6" fill="#fff"/>
      `),
    });
  }

  /* ================= Gallery ================= */

  const NAMES = { trails: 'Star trails' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || (D.emblem ? `spike/emblems/${file}.svg` : '');
      if (D.emblem) window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
