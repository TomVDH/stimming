<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Sorting sounds 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Sorting sounds 1</h1>
<p class="lede">Sorting sounds, round 1. No pick yet; A goes on the menu until Tom picks. A: six glossy glass rods in the dusk ramp of the toy on a glossy floor, one swap from sorted; the out-of-order pair glints. D: the same rods in a row on a dark glass slab.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  const DIRS = [];

  // The toy's tokens: rods in a dusk ramp, deep indigo low to warm gold high.
  const COUNT = 6;
  const hue = t => f((278 + 162 * t) % 360);
  const rodStops = v => {
    const t = v / (COUNT - 1), L = 0.5 + 0.36 * t;
    return [[0, `oklch(${f(Math.min(0.97, L + 0.1))} 0.13 ${hue(t)})`], [0.45, `oklch(${f(L)} 0.18 ${hue(t)})`], [1, `oklch(${f(L - 0.16)} 0.17 ${hue(t)})`]];
  };
  const rodGlow = v => `oklch(${f(0.6 + 0.25 * v / (COUNT - 1))} 0.17 ${hue(v / (COUNT - 1))})`;
  // A rod: a capsule with a round top and a flat foot on the floor.
  const capsule = (x, foot, w, h) => {
    const r = w / 2;
    return `M${f(x - r)} ${f(foot)}L${f(x - r)} ${f(foot - h + r)}A${f(r)} ${f(r)} 0 0 1 ${f(x + r)} ${f(foot - h + r)}L${f(x + r)} ${f(foot)}Z`;
  };
  // The rods' defs: one gradient each, and a fade for each reflection.
  const rodDefs = u => Array.from({ length: COUNT }, (_, v) => lg(`${u}c${v}`, rodStops(v), 'x1="0" y1="0" x2="0.35" y2="1"')
    + lg(`${u}m${v}`, [[0, rodGlow(v), 0.38], [1, rodGlow(v), 0]])).join('');
  // At rest the row is one swap from sorted: rods 2 and 3 trade slots.
  // Their tips glint white, as a compare does in the toy.
  const REST = [0, 1, 3, 2, 4, 5];
  const GLINT = 0.85;
  // Rod v is drawn in slot v; a transform puts it in its rest slot.
  // geo: slot to foot point, the rod width, the height of value v, the reflection depth.
  // step: one slot of travel as [dx, dy].
  const rowMarkup = (u, geo, step) => Array.from({ length: COUNT }, (_, v) => {
    const [x, foot] = geo.at(v), h = geo.h(v), w = geo.w;
    const refl = geo.refl ? `<rect x="${f(x - w / 2)}" y="${f(foot + 2)}" width="${f(w)}" height="${f(geo.refl * h)}" rx="1.5" fill="url(#${u}m${v})"/>` : '';
    const pool = `<ellipse cx="${f(x)}" cy="${f(foot)}" rx="${f(w * 1.2)}" ry="${f(w * 0.45)}" fill="${rodGlow(v)}" opacity="0.5" filter="url(#${u}g)"/>`;
    const d = capsule(x, foot, w, h);
    const k = REST[v] - v, glint = k ? GLINT : 0;
    return `<g class="rod" data-v="${v}" transform="translate(${f(k * step[0])} ${f(k * step[1])})">${pool}${refl}${body(d, u, `c${v}`)}<path class="hot" d="${d}" fill="#fff" opacity="0"/><circle class="hot" cx="${f(x)}" cy="${f(foot - h + w * 0.55)}" r="${f(w * 0.62)}" fill="#fff" opacity="${glint}" filter="url(#${u}g)"/><circle class="hot" cx="${f(x)}" cy="${f(foot - h + w * 0.55)}" r="${f(w * 0.36)}" fill="#fff" opacity="${glint}"/></g>`;
  }).join('');

  // The shared motion: play deals the rods, then they sort themselves.
  // Each swap flashes both rods white; a sorted row flashes left to right.
  // Rest glides the rods back to the rest pose.
  const run = (svg, step) => {
    const rods = [...svg.querySelectorAll('.rod')];
    const hots = rods.map(r => [...r.querySelectorAll('.hot')]);
    let tl = null, wait = null, live = false;
    const to = (v, s, dur) => gsap.to(rods[v], { x: (s - v) * step[0], y: (s - v) * step[1], duration: dur, ease: 'power2.inOut' });
    const flash = (v, k = 1) => gsap.fromTo(hots[v], { opacity: 0.95 * k }, { opacity: 0, duration: 0.42, ease: 'power2.out', immediateRender: false });
    // A new order that is never the sorted one.
    const deal = () => {
      let p;
      do { p = Array.from({ length: COUNT }, (_, i) => i).sort(() => Math.random() - 0.5); } while (p.every((s, i) => s === i));
      return p;
    };
    const cycle = () => {
      if (!live) return;
      tl = gsap.timeline({ onComplete: () => { wait = gsap.delayedCall(0.5, cycle); } });
      const p = deal();
      p.forEach((s, v) => tl.add(to(v, s, 0.42), v * 0.03));
      tl.addLabel('sort', '+=0.15');
      // Bubble sort on the dealt order; each swap is one beat.
      const order = [];
      p.forEach((s, v) => { order[s] = v; });
      let beat = 0;
      for (let end = COUNT - 1; end > 0; end--) {
        for (let i = 0; i < end; i++) {
          if (order[i] > order[i + 1]) {
            const a = order[i], b = order[i + 1];
            order[i] = b; order[i + 1] = a;
            const at = `sort+=${f(beat * 0.26)}`;
            tl.add(to(a, i + 1, 0.22), at).add(to(b, i, 0.22), at).add(flash(a), at).add(flash(b), at);
            beat++;
          }
        }
      }
      tl.addLabel('done', `sort+=${f(beat * 0.26 + 0.2)}`);
      for (let v = 0; v < COUNT; v++) tl.add(flash(v, 0.7), `done+=${f(v * 0.07)}`);
    };
    return {
      enter() { if (live) return; live = true; cycle(); },
      move() {},
      leave() {
        live = false;
        tl?.kill(); tl = null;
        wait?.kill(); wait = null;
        gsap.killTweensOf(rods);
        rods.forEach((_, v) => to(v, REST[v], 0.35));
        // The glint on the rest pair returns; the other lights go out.
        hots.forEach((h, v) => h.forEach((e, i) => gsap.to(e, { opacity: i && REST[v] !== v ? GLINT : 0, duration: 0.3 })));
      },
    };
  };

  /* ================= Current ================= */

  // Sorting sounds is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // Six glass rods stand face on, sorted shortest to tallest, on a glossy floor.
  const AP = 16.6, AW = 11.5, AFOOT = 96;
  const A_GEO = { at: v => [64 + (v - 2.5) * AP, AFOOT], w: AW, h: v => 24 + v * 13.6, refl: 0.3 };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [16, 12, 96, 104],
    idea: 'Six glossy glass rods stand face on in a row, rising from a short deep-indigo rod to a tall warm-gold one, through violet and rose: the dusk ramp of the toy. The row is one swap from sorted: the two middle rods stand out of order, and their tips glint white, as a compare does in the toy. Each rod glows on the floor at its foot and shows a soft reflection below. The pointer deals the rods into a new order; they sort themselves back one swap at a time, both rods of each swap flash white, and the sorted row flashes left to right. Leave and the rods glide back to the rest pose.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}g`, 2.6)}${blur(`${u}h`, 10)}${rodDefs(u)}</defs>
        <ellipse cx="64" cy="70" rx="44" ry="34" fill="oklch(0.55 0.15 330)" opacity="0.2" filter="url(#${u}h)"/>
        ${rowMarkup(u, A_GEO, [AP, 0])}`;
      return run(svg, [AP, 0]);
    },
    // The emblem: the six rods, centred in the box.
    emblem: `${EMB_HEAD}<g transform="translate(0 10)">${Array.from({ length: 6 }, (_, v) => { const [x, foot] = A_GEO.at(REST[v]), h = A_GEO.h(v); return `<path d="${capsule(x, foot, AW, h)}" fill="#fff"/>`; }).join('')}</g></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A dark glass slab at 30 degrees; the rods stand in a row on its top.
  const CY = 70, HX = 35, HY = 15, T = 13;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  const DP = 11.2, DW = 8;
  const D_GEO = { at: v => iso((v - 2.5) * DP, 0), w: DW, h: v => 16 + v * 8.6, refl: 0 };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [16, 18, 96, 96],
    idea: 'A slab of dark blue-black glass at 30 degrees: light top, mid left face, dark right face, a rim on the top edges. Six glass rods in the dusk ramp stand in a row along the slab, rising from a short indigo rod at the back to a tall gold rod at the front, one swap from sorted as on A, each with a pool of its light on the glass. The pointer deals and sorts them as on A; leave and they glide home.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 2.2)}${blur(`${u}h`, 7)}${rodDefs(u)}
          ${lg(`${u}top`, [[0, 'oklch(0.3 0.03 290)'], [1, 'oklch(0.17 0.025 285)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.26 0.03 290)'], [1, 'oklch(0.19 0.028 285)']])}
          ${lg(`${u}R`, [[0, 'oklch(0.17 0.022 285)'], [1, 'oklch(0.11 0.02 285)']])}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 280)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)" opacity="0.6"/>
        <ellipse cx="64" cy="${CY}" rx="30" ry="12" fill="oklch(0.6 0.15 340)" opacity="0.22" filter="url(#${u}h)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        ${rowMarkup(u, D_GEO, [DP * 0.866, DP * 0.5])}`;
      return run(svg, [DP * 0.866, DP * 0.5]);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#202020"/>${Array.from({ length: 6 }, (_, v) => { const [x, foot] = D_GEO.at(REST[v]); return `<path d="${capsule(x, foot, DW, D_GEO.h(v))}" fill="#fff"/>`; }).join('')}</svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Sorting sounds';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-sorting';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `sorting-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
