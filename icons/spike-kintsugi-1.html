<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Kintsugi 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Kintsugi 1</h1>
<p class="lede">Kintsugi, round 1. Current is the bowl Tom kept (2026-11-17). A: the bowl from above as the toy shows it, a web of gold from a patch in the well; it breaks into three shards and mends. D: the bowl on a low block of black lacquer.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The menu tile's ids take the tile prefix, so three copies can live.
  const ids = (m, u) => m.replace(/id="([^"]+)"/g, `id="${u}$1"`).replace(/url\(#([^)]+)\)/g, `url(#${u}$1)`).replace(/href="#([^"]+)"/g, `href="#${u}$1"`);

  const DIRS = [];

  // The toy's tokens: celadon glaze, a deeper well, warm gold, a clay foot.
  const OUTER = [[0, 'oklch(0.8 0.07 168)'], [1, 'oklch(0.46 0.06 186)']];
  const INNER = [[0, 'oklch(0.58 0.06 182)'], [0.55, 'oklch(0.76 0.07 170)'], [1, 'oklch(0.88 0.05 166)']];
  const GOLD = 'oklch(0.84 0.135 84)', GOLD_D = 'oklch(0.66 0.13 70)';

  /* ================= Current ================= */

  // The menu icon today: the bowl from the side, split along one gold seam.
  const CUR = `<defs>
      <linearGradient id="kintsugi-body" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="oklch(0.78 0.06 170)"/>
        <stop offset="1" stop-color="oklch(0.44 0.055 186)"/>
      </linearGradient>
      <linearGradient id="kintsugi-in" x1="0" y1="0" x2="1" y2="0.4">
        <stop offset="0" stop-color="oklch(0.5 0.06 182)"/>
        <stop offset="1" stop-color="oklch(0.86 0.05 166)"/>
      </linearGradient>
      <clipPath id="kintsugi-cl"><path d="M-10 -10H60V30.5L63.5 38L60.5 46L65 55L62 65.5L65.5 75L61 85L64.5 95L62.5 104L64 112V140H-10Z"/></clipPath>
      <clipPath id="kintsugi-cr"><path d="M140 -10H60V30.5L63.5 38L60.5 46L65 55L62 65.5L65.5 75L61 85L64.5 95L62.5 104L64 112V140H140Z"/></clipPath>
      <clipPath id="kintsugi-cb"><path d="M9 48C9 84 36 105 64 105C92 105 119 84 119 48Z"/></clipPath>
      <g id="kintsugi-bowl">
        <path d="M46 100H82L79 110H49Z" fill="oklch(0.62 0.05 62)"/>
        <path d="M9 48C9 84 36 105 64 105C92 105 119 84 119 48Z" fill="url(#kintsugi-body)"/>
        <path d="M9 48C9 84 36 105 64 105C92 105 119 84 119 48Z" fill="url(#lit)"/>
        <ellipse cx="64" cy="48" rx="55" ry="18" fill="oklch(0.8 0.05 168)"/>
        <ellipse cx="64" cy="49.5" rx="51" ry="15.5" fill="url(#kintsugi-in)"/>
        <ellipse cx="70" cy="55" rx="17" ry="5.2" fill="oklch(0.72 0.08 182)" opacity="0.7"/>
        <path d="M62.5 82L52 86.5L46 97M63 40L75 38.5L86 44" fill="none" stroke="oklch(0.83 0.135 83)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M80 50L89 47L94 52L85 56Z" fill="oklch(0.83 0.135 83)"/>
        <ellipse cx="64" cy="48" rx="55" ry="18" fill="none" stroke="url(#rim)" stroke-width="2"/>
      </g>
    </defs>
    <g id="kintsugi-l" clip-path="url(#kintsugi-cl)"><use href="#kintsugi-bowl"/></g>
    <g id="kintsugi-r" clip-path="url(#kintsugi-cr)"><use href="#kintsugi-bowl"/></g>
    <g clip-path="url(#kintsugi-cb)"><ellipse id="kintsugi-glint" cx="44" cy="76" rx="10" ry="5" fill="#fff" opacity="0.26"/></g>
    <path id="kintsugi-seam" d="M60 30.5L63.5 38L60.5 46L65 55L62 65.5L65.5 75L61 85L64.5 95L62.5 104L64 110" fill="none" stroke="oklch(0.83 0.135 83)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    box: 'bbox',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}</defs>${ids(CUR, u)}`;
      const L = svg.querySelector(`#${u}kintsugi-l`), R = svg.querySelector(`#${u}kintsugi-r`), seam = svg.querySelector(`#${u}kintsugi-seam`), glint = svg.querySelector(`#${u}kintsugi-glint`);
      const LEN = seam.getTotalLength(), PIV = '64 110';
      gsap.set(seam, { strokeDasharray: LEN, strokeDashoffset: 0 });
      let tl = null;
      return {
        enter() {
          tl?.kill();
          tl = gsap.timeline({ repeat: -1, repeatDelay: 0.7 })
            .to(seam, { opacity: 0, duration: 0.12 }, 0)
            .to(L, { rotation: -9, x: -2, svgOrigin: PIV, duration: 0.5, ease: 'power3.out' }, 0)
            .to(R, { rotation: 9, x: 2, svgOrigin: PIV, duration: 0.5, ease: 'power3.out' }, 0)
            .to([L, R], { rotation: 0, x: 0, svgOrigin: PIV, duration: 0.9, ease: 'power2.inOut' }, 0.8)
            .set(seam, { opacity: 1, strokeDashoffset: LEN }, 1.65)
            .to(seam, { strokeDashoffset: 0, duration: 1, ease: 'power1.inOut' }, 1.65);
        },
        move(p) { if (p) gsap.to(glint, { x: (p[0] - 44) * 0.6, duration: 0.35, overwrite: 'auto' }); },
        leave() {
          tl?.kill(); tl = null;
          gsap.to([L, R], { rotation: 0, x: 0, svgOrigin: PIV, duration: 0.4, ease: 'power2.out', overwrite: true });
          gsap.to(seam, { opacity: 1, strokeDashoffset: 0, duration: 0.4, overwrite: true });
          gsap.to(glint, { x: 0, duration: 0.6, ease: 'power2.out', overwrite: true });
        },
      };
    },
  });

  /* ================= The bowl ================= */

  // The bowl from above and in front: the rim, the glazed inside, the outside down to the foot.
  const RIM = 'M10 50A54 30 0 1 0 118 50A54 30 0 1 0 10 50Z';
  const INSIDE = 'M15 52A49 25 0 1 0 113 52A49 25 0 1 0 15 52Z';
  const OUTSIDE = 'M10 50C10 90 36 110 64 110C92 110 118 90 118 50A54 30 0 0 1 10 50Z';
  const FOOT = 'M48 104H80L77 114H51Z';
  const SIL = 'M10 50A54 30 0 0 1 118 50C118 90 92 110 64 110C36 110 10 90 10 50Z';
  // Three seams run out from a gold patch in the well; they part the bowl into three shards.
  const P = [58, 60];
  const SEAMS = [
    [P, [48, 59], [40, 55.5], [30, 54.5], [21, 51], [10, 49.5], [-30, 48]],
    [P, [65, 51], [70, 43.5], [75, 36], [81, 27], [84, 20.5], [96, -30]],
    [P, [64, 68], [73, 72.5], [78, 80], [82, 89], [79, 99], [77, 110], [76, 160]],
  ];
  // Short veins off the main seams: gold, still, never parting.
  const VEINS = 'M40 55.5L37 63L32 68M75 36L88 33M73 72.5L86 70L96 72M82 89L94 86';
  const PATCH = 'M52 58L56 55L61 55.6L64 59L62.4 64L57 66L53 63.4Z';
  const pts = a => a.map(p => p.map(f).join(' ')).join('L');
  // A shard: one seam out, round a far corner, the next seam back.
  const CORNERS = [[[-30, -30]], [[160, -30], [160, 160]], [[-30, 160]]];
  const SHARD = i => `M${pts(SEAMS[i])}L${pts(CORNERS[i])}L${pts([...SEAMS[(i + 1) % 3]].reverse())}Z`;
  // Each shard parts along its own outward line.
  const OUT = [[-0.55, -0.83], [0.98, 0.2], [-0.62, 0.78]];
  const seamD = SEAMS.map(s => 'M' + pts(s.slice(0, -1))).join('');
  const bowlDefs = u => `${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}s`, 1)}
    ${lg(`${u}outer`, OUTER, 'x1="0" y1="0" x2="1" y2="1"')}${lg(`${u}inner`, INNER, 'x1="0" y1="0.2" x2="0.9" y2="0.8"')}
    <clipPath id="${u}sil"><path d="${SIL}"/></clipPath><clipPath id="${u}in"><path d="${INSIDE}"/></clipPath>
    ${[0, 1, 2].map(i => `<clipPath id="${u}k${i}"><path d="${SHARD(i)}"/></clipPath>`).join('')}
    <g id="${u}bowl">
      ${body(OUTSIDE, u, 'outer')}
      <path d="${RIM}" fill="oklch(0.84 0.05 166)"/>
      <path d="${INSIDE}" fill="url(#${u}inner)"/>
      <g clip-path="url(#${u}in)"><path d="M20 58Q40 50 60 56T110 52M26 66Q48 60 70 66T106 62M40 72Q60 68 90 72" fill="none" stroke="oklch(0.6 0.05 180)" stroke-width="1" opacity="0.35"/></g>
      <path d="${VEINS}" fill="none" stroke="${GOLD}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#${u}sil)"/>
      <path d="${PATCH}" fill="${GOLD}"/><path d="${PATCH}" fill="url(#${u}lit)"/>
      <path d="${RIM}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
      <path d="M14 62Q22 88 46 100" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
    </g>`;
  // The bowl in three shards, the seams over them, the glint on the glaze.
  const bowl = u => `<path d="${FOOT}" fill="oklch(0.6 0.05 62)"/>
    ${[0, 1, 2].map(i => `<g class="shard" clip-path="url(#${u}k${i})"><g class="shardIn"><use href="#${u}bowl"/></g></g>`).join('')}
    <g clip-path="url(#${u}in)"><ellipse class="glint" cx="46" cy="58" rx="12" ry="5" fill="#fff" opacity="0.28" filter="url(#${u}s)"/></g>
    <g clip-path="url(#${u}sil)"><path class="seam" d="${seamD}" fill="none" stroke="${GOLD}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="seam2" d="${seamD}" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" transform="translate(-0.6 -0.6)"/></g>`;

  // The shared motion: the bowl breaks into its three shards, they part and close again,
  // then the gold runs back along the seams. The pointer moves the glint over the glaze.
  const run = (svg, toLocal = p => p) => {
    const shards = [...svg.querySelectorAll('.shard')].map(s => s.querySelector('.shardIn')), clips = [...svg.querySelectorAll('.shard')];
    const seams = [...svg.querySelectorAll('.seam, .seam2')], glint = svg.querySelector('.glint');
    seams.forEach(s => { s.setAttribute('pathLength', '1'); gsap.set(s, { strokeDasharray: 1, strokeDashoffset: 0 }); });
    let tl = null;
    // A shard and its clip move together, so the break follows the seam.
    const part = (k, d) => clips.map((c, i) => gsap.to(c, { x: OUT[i][0] * k, y: OUT[i][1] * k, rotation: (i - 1) * k * 0.9, svgOrigin: `${P[0]} ${P[1]}`, duration: d, ease: k ? 'power3.out' : 'power2.inOut' }));
    return {
      enter(p) {
        if (p) this.move(p);
        tl?.kill();
        tl = gsap.timeline({ repeat: -1, repeatDelay: 0.8 })
          .to(seams, { opacity: 0, duration: 0.1 }, 0)
          .add(part(6, 0.45), 0)
          .add(part(0, 0.9), 0.85)
          .set(seams, { opacity: 1, strokeDashoffset: 1 }, 1.75)
          .to(seams, { strokeDashoffset: 0, duration: 1.1, ease: 'power1.inOut' }, 1.75);
      },
      move(p) { if (p) { const q = toLocal(p); gsap.to(glint, { x: clamp(q[0] - 46, -24, 46), y: clamp(q[1] - 58, -6, 12), duration: 0.35, overwrite: 'auto' }); } },
      leave() {
        tl?.kill(); tl = null;
        part(0, 0.4);
        gsap.to(seams, { opacity: 1, strokeDashoffset: 0, duration: 0.4, overwrite: true });
        gsap.to(glint, { x: 0, y: 0, duration: 0.6, ease: 'power2.out', overwrite: true });
      },
    };
  };
  const bowlEmblem = `<path d="${FOOT}" fill="#fff"/><path d="${OUTSIDE}" fill="#fff"/><path d="${INSIDE}" fill="#5a5a5a"/><path d="${RIM}" fill="none" stroke="#fff" stroke-width="3"/><g clip-path="url(#es)"><path d="${seamD}${VEINS}" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><path d="${PATCH}" fill="#000"/>`;

  /* ================= A: Shaded object ================= */

  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [10, 18, 108, 96],
    idea: 'The bowl as the toy shows it, from above and in front: celadon glaze, a deeper green well, a crackle in the glaze, a clay foot. A web of gold runs from a gold patch in the well: three seams out over the rim and down the side, short veins off them. The pointer breaks it: the three shards part along the seams, close again, and the gold runs back along each seam. The pointer also moves the glint over the glaze.',
    art(svg, u) {
      svg.innerHTML = `<defs>${bowlDefs(u)}</defs>
        <ellipse cx="66" cy="114" rx="40" ry="4" fill="oklch(0.05 0.01 220)" opacity="0.6" filter="url(#${u}b)"/>
        ${bowl(u)}`;
      return run(svg);
    },
    emblem: `${EMB_HEAD}<defs><clipPath id="es"><path d="${SIL}"/></clipPath></defs>${bowlEmblem}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A low block of black lacquer, a tea table; the bowl sits on it.
  const CY = 88, HX = 32, HY = 32, T = 10;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = p => [p[0], p[1] + T];
  const BS = 0.66, BX = 64 - 64 * BS, BY = CY + 4 - 114 * BS;
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [8, 14, 112, 102],
    idea: 'A low block of black lacquer at 30 degrees, a tea table: a deep glossy top, a mid left face, a dark right face, a gold rim on the top edges. The mended bowl sits in the middle, its gold web catching the light. The pointer breaks it and mends it as in A.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${bowlDefs(u)}
          ${lg(`${u}top`, [[0, 'oklch(0.3 0.02 30)'], [1, 'oklch(0.16 0.015 30)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.22 0.02 30)'], [1, 'oklch(0.15 0.015 30)']])}
          ${lg(`${u}R`, [[0, 'oklch(0.13 0.01 30)'], [1, 'oklch(0.08 0.01 30)']])}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 30)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="${GOLD_D}" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="${GOLD_D}" stroke-opacity="0.6" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
        <ellipse cx="64" cy="${CY + 2}" rx="24" ry="7" fill="oklch(0.04 0.01 30)" opacity="0.6" filter="url(#${u}b)"/>
        <g transform="translate(${f(BX)} ${f(BY)}) scale(${BS})">${bowl(u)}</g>`;
      return run(svg, p => [(p[0] - BX) / BS, (p[1] - BY) / BS]);
    },
    emblem: `${EMB_HEAD}<defs><clipPath id="es"><path d="${SIL}"/></clipPath></defs><path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#7a7a7a"/><g transform="translate(${f(BX)} ${f(BY)}) scale(${BS})">${bowlEmblem}</g></svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = "Kintsugi";
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-kintsugi';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `kintsugi-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      // A menu tile with no data-box fits its drawn bounds, as the menu does.
      const bb = D.box === "bbox" && svg.getBBox();
      fitIcon(svg, bb ? [bb.x, bb.y, bb.width, bb.height] : D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
