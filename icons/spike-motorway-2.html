/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>

    };
  };

  /* ================= A: Shaded object ================= */

  // A twin-arm mast on the central reservation over a motorway that runs away from us.
  const ROAD = 'M6 116L54 70H74L122 116Z';
  const MAST = 'M61.6 112V30Q61.6 27 64 27Q66.4 27 66.4 30V112Z';
  const ARMS = 'M64 31Q48 22 30 22.6L30 25.4Q47 25 64 35.4Q81 25 98 25.4L98 22.6Q80 22 64 31Z';
  const HEADS = ['M20 21H38Q40 21 40 23.4Q40 26 37 26H21Q18 26 18 23.4Q18 21 20 21Z', 'M90 21H108Q110 21 110 23.4Q110 26 107 26H91Q88 26 88 23.4Q88 21 90 21Z'];
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [6, 16, 116, 102],
    idea: 'One of the toy\'s motorway masts at night: a steel post on the central reservation with two arms out over the lanes, a sodium lamp at each end, a cone of orange light under each and a pool of it on the asphalt. The motorway runs away from us between white edge lines, a dashed lane line on each side. The pointer kills the lamps; they strike again one by one, pink, then salmon, then sodium orange, as in the toy, and loop while it stays.',
    art(svg, u) {
      svg.innerHTML = `<defs>${roadDefs(u)}<clipPath id="${u}rd"><path d="${ROAD}"/></clipPath></defs>
        <path d="${ROAD}" fill="url(#${u}asph)"/>
        <g clip-path="url(#${u}rd)">
          ${lit(u, 0, 'pool', ['ellipse', 'cx="30" cy="100" rx="28" ry="10"'])}${lit(u, 1, 'pool', ['ellipse', 'cx="98" cy="100" rx="28" ry="10"'])}
        </g>
        ${lit(u, 0, 'cone', ['path', 'd="M22 26H38L46 106H4Z"'])}${lit(u, 1, 'cone', ['path', 'd="M90 26H106L124 106H82Z"'])}
        <path d="M8 114L54.6 71M120 114L73.4 71" stroke="oklch(0.92 0.01 90)" stroke-width="2.2" stroke-linecap="round"/>
        ${[[0.1, 0.22], [0.36, 0.5], [0.66, 0.84]].map(([a, b]) => [-1, 1].map(s => { const x = t => 64 + s * (4 + 22 * t), y = t => 70 + 46 * t; return `<path d="M${f(x(a) - 1.2 * (a + 0.3))} ${f(y(a))}L${f(x(b) - 1.2 * (b + 0.3))} ${f(y(b))}L${f(x(b) + 1.2 * (b + 0.3))} ${f(y(b))}L${f(x(a) + 1.2 * (a + 0.3))} ${f(y(a))}Z" fill="oklch(0.92 0.01 90)" opacity="0.85"/>`; }).join('')).join('')}
        <path d="M62 70H66L68 116H60Z" fill="oklch(0.5 0.01 260)"/>
        ${body(MAST, u, 'steel')}
        ${body(ARMS, u, 'steel')}
        ${HEADS.map((h, i) => `${body(h, u, 'steel')}${lit(u, i, 'bulb', ['path', `d="M${21 + i * 70} 25H${37 + i * 70}V27.6H${21 + i * 70}Z"`])}`).join('')}`;
      return run(svg, [0, 1]);
    },
    emblem: `${EMB_HEAD}<path d="${ROAD}" fill="#5a5a5a"/><path d="M22 26H38L42 112H6Z M90 26H106L122 112H86Z" fill="#9a9a9a" clip-path="none"/><path d="M8 114L54.6 71M120 114L73.4 71" stroke="#fff" stroke-width="2.2"/><path d="${MAST}" fill="#fff"/><path d="${ARMS}" fill="#fff"/>${HEADS.map(h => `<path d="${h}" fill="#fff"/>`).join('')}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A block of motorway: two carriageways on the top, masts on the middle line, a concrete side.
  const CY = 82, HX = 36, HY = 24, T = 12;
  const iso = (gx, gy, h = 0) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5 - h];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = p => [p[0], p[1] + T];
  const MASTS = [-20, 16], MH = 40, AR = 13;
  const isoLine = (gy, a, b) => `M${iso(a, gy).map(f).join(' ')}L${iso(b, gy).map(f).join(' ')}`;
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [10, 12, 108, 100],
    idea: 'A block of motorway at 30 degrees: the asphalt is the top with its edge lines and dashed lanes, a concrete left face, a dark right face, a rim on the top edges. Two twin-arm masts stand on the middle line, a sodium lamp over each lane and a pool of orange light under each. The pointer kills the lamps; they strike again one by one down the road, pink, salmon, sodium, and loop while it stays.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      let i = 0;
      const lamps = MASTS.map(gx => [-AR, AR].map(gy => {
        const p = iso(gx, gy), h = iso(gx, gy, MH);
        const k = i++;
        return { k, gx, gy, p, h };
      })).flat();
      svg.innerHTML = `<defs>${roadDefs(u)}
          ${lg(`${u}top`, [[0, 'oklch(0.32 0.015 262)'], [1, 'oklch(0.24 0.015 262)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.56 0.01 80)'], [1, 'oklch(0.44 0.01 80)']])}
          ${lg(`${u}R`, [[0, 'oklch(0.32 0.01 80)'], [1, 'oklch(0.24 0.01 80)']])}
          <clipPath id="${u}top"><path d="${top}"/></clipPath></defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 260)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <g clip-path="url(#${u}top)">
          ${lamps.map(l => lit(u, l.k, 'pool', ['ellipse', `cx="${f(l.p[0])}" cy="${f(l.p[1])}" rx="15" ry="8"`])).join('')}
        </g>
        <path d="${top}" fill="url(#${u}lit)" opacity="0.4"/>
        <path d="${isoLine(-HY + 3, -HX, HX)}${isoLine(HY - 3, -HX, HX)}" stroke="oklch(0.92 0.01 90)" stroke-width="1.8"/>
        ${[-HX + 2, -HX + 18, -HX + 34, -HX + 50, -HX + 66].map(a => `<path d="${isoLine(-AR, a, a + 8)}${isoLine(AR, a, a + 8)}" stroke="oklch(0.92 0.01 90)" stroke-width="1.8" opacity="0.85"/>`).join('')}
        <path d="${isoLine(0, -HX, HX)}" stroke="oklch(0.52 0.01 260)" stroke-width="3"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="url(#${u}rim)" stroke-width="2" fill="none" stroke-linejoin="round"/>
        ${MASTS.map(gx => { const b = iso(gx, 0), t = iso(gx, 0, MH + 3); return `<path d="M${f(b[0] - 1.8)} ${f(b[1])}V${f(t[1])}H${f(b[0] + 1.8)}V${f(b[1])}Z" fill="url(#${u}steel)"/><path d="M${iso(gx, -AR, MH).map(f).join(' ')}Q${f(t[0])} ${f(t[1] - 2)} ${iso(gx, AR, MH).map(f).join(' ')}" fill="none" stroke="oklch(0.66 0.01 260)" stroke-width="2.4"/>`; }).join('')}
        ${lamps.map(l => `${lit(u, l.k, 'cone', ['path', `d="M${f(l.h[0] - 4)} ${f(l.h[1] + 2)}H${f(l.h[0] + 4)}L${f(l.p[0] + 12)} ${f(l.p[1])}H${f(l.p[0] - 12)}Z"`])}<path d="M${f(l.h[0] - 5)} ${f(l.h[1] - 1.6)}H${f(l.h[0] + 5)}L${f(l.h[0] + 4)} ${f(l.h[1] + 1.6)}H${f(l.h[0] - 4)}Z" fill="url(#${u}steel)"/>${lit(u, l.k, 'bulb', ['ellipse', `cx="${f(l.h[0])}" cy="${f(l.h[1] + 2.2)}" rx="4" ry="1.4"`])}`).join('')}`;
      return run(svg, [0, 1, 2, 3]);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#9a9a9a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#5a5a5a"/><path d="${poly([N, E, S, W])}" fill="#3a3a3a"/>${MASTS.map(gx => [-AR, AR].map(gy => { const p = iso(gx, gy); return `<ellipse cx="${f(p[0])}" cy="${f(p[1])}" rx="13" ry="7" fill="#bdbdbd"/>`; }).join('')).join('')}${MASTS.map(gx => { const b = iso(gx, 0), t = iso(gx, 0, MH + 3); return `<path d="M${f(b[0] - 1.8)} ${f(b[1])}V${f(t[1])}H${f(b[0] + 1.8)}V${f(b[1])}Z" fill="#fff"/><path d="M${iso(gx, -AR, MH).map(f).join(' ')}Q${f(t[0])} ${f(t[1] - 2)} ${iso(gx, AR, MH).map(f).join(' ')}" fill="none" stroke="#fff" stroke-width="2.4"/>`; }).join('')}</svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = "Lit motorway";
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-motorway';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `motorway-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      // A menu tile with no data-box fits its drawn bounds, as the menu does.
      const bb = D.box === "bbox" && svg.getBBox();
      fitIcon(svg, bb ? [bb.x, bb.y, bb.width, bb.height] : D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
