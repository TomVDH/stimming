<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Steel wool 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Steel wool 1</h1>
<p class="lede">Steel wool, round 1. A: a pad of wool and a 9-volt battery; the battery follows the pointer and lights the wool where it touches. D: the same pad on a fire brick; the burn lights the brick.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DEG = Math.PI / 180;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');

  // A seeded random source; each shape is the same on every tile.
  const rng = seed => () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  // A closed smooth curve through points, as cubic segments.
  const smooth = pts => {
    const n = pts.length;
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d + 'Z';
  };
  // A lumpy round blob; the seed fixes its lumps.
  const blob = (cx, cy, rx, ry, seed, n = 12, wob = 0.08) => {
    const r = rng(seed);
    return smooth(Array.from({ length: n }, (_, i) => {
      const a = (i / n) * Math.PI * 2, k = 1 + (r() * 2 - 1) * wob;
      return [cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k];
    }));
  };

  // The toy's colours, from its own tokens.
  const C = {
    silverHi: 'oklch(0.9 0.008 240)', silver: 'oklch(0.7 0.01 250)', silverLo: 'oklch(0.44 0.016 262)',
    under: 'oklch(0.28 0.014 262)', crimpHi: 'oklch(0.95 0.01 240)', crimpLo: 'oklch(0.48 0.016 262)',
    blue: 'oklch(0.5 0.12 262)', purple: 'oklch(0.5 0.12 330)', straw: 'oklch(0.8 0.09 88)',
    red: 'oklch(0.56 0.21 32)', hot: 'oklch(0.9 0.13 80)', accent: 'oklch(0.79 0.17 62)', oxide: 'oklch(0.19 0.012 290)',
  };
  // Ember rings, outer to inner: blue, purple, straw, the front, then oxide.
  const RINGS = [[1.36, C.blue], [1.24, C.purple], [1.13, C.straw], [1.06, C.red], [0.9, C.oxide]];
  const ER = 22, ESEED = 41;

  // The pad: a lumpy top over a darker underside, crimp strokes, embers, light.
  // P sets the place, the size, the squash and the battery's rest.
  const padDefs = (u, P) => `${light(u)}${blur(`${u}b`, 2.4)}
    ${rg(`${u}pad`, [[0, C.silverHi], [0.55, C.silver], [1, C.silverLo]], 'cx="0.36" cy="0.3" r="0.85"')}
    ${rg(`${u}halo`, [[0, C.hot, 0.9], [0.5, C.accent, 0.45], [1, C.red, 0]])}
    ${lg(`${u}cell`, [[0, 'oklch(0.42 0.02 265)'], [0.55, 'oklch(0.3 0.02 265)'], [1, 'oklch(0.2 0.015 265)']], 'x1="0" y1="0" x2="1" y2="0"')}
    ${lg(`${u}band`, [[0, 'oklch(0.86 0.15 75)'], [0.55, C.accent], [1, 'oklch(0.6 0.18 48)']], 'x1="0" y1="0" x2="1" y2="0"')}
    ${lg(`${u}snap`, [[0, 'oklch(0.94 0.01 240)'], [1, 'oklch(0.6 0.012 255)']], 'x1="0" y1="0" x2="1" y2="1"')}
    ${lg(`${u}side`, [[0, C.silverLo], [1, C.under]])}
    <clipPath id="${u}clip"><path d="${padTop(P)}"/></clipPath>`;
  const padTop = P => blob(P.c[0], P.c[1], P.rx, P.ry, P.seed, 13, 0.07);
  const padUnder = P => blob(P.c[0], P.c[1] + P.depth, P.rx * 0.98, P.ry, P.seed, 13, 0.07);
  // A few bold crimped strands across the pad top.
  const crimps = P => {
    const r = rng(P.seed + 5), out = [];
    for (let i = 0; i < 5; i++) {
      const rf = 0.3 + r() * 0.5, a0 = r() * 360, span = 60 + r() * 60, ph = r() * 6;
      let d = '';
      for (let k = 0; k <= 16; k++) {
        const a = (a0 + (span * k) / 16) * DEG, w = 1 + Math.sin(k * 0.9 + ph) * 0.05;
        d += `${k ? 'L' : 'M'}${f(P.c[0] + Math.cos(a) * P.rx * rf * w)} ${f(P.c[1] + Math.sin(a) * P.ry * rf * w)}`;
      }
      out.push({ d, hi: i % 2 === 0 });
    }
    return out;
  };
  // The 9-volt cell: the snaps at the origin, the body runs up.
  const cellMarkup = u => `
    <path d="M-12 -6H12V-44Q12 -47 9 -47H-9Q-12 -47 -12 -44Z" fill="url(#${u}cell)"/>
    <path d="M-12 -36H12V-44Q12 -47 9 -47H-9Q-12 -47 -12 -44Z" fill="url(#${u}band)"/>
    <path d="M-12 -6H12V-44Q12 -47 9 -47H-9Q-12 -47 -12 -44Z" fill="url(#${u}lit)"/>
    <path d="M-12 -6H12V-44Q12 -47 9 -47H-9Q-12 -47 -12 -44Z" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
    <rect x="-10.5" y="-8" width="21" height="3" rx="1" fill="oklch(0.62 0.012 255)"/>
    <circle cx="-5.5" cy="-3.6" r="3.8" fill="url(#${u}snap)"/>
    <path d="${poly([0, 1, 2, 3, 4, 5].map(i => [5.5 + Math.cos((i * 60 + 30) * DEG) * 4.2, -3.6 + Math.sin((i * 60 + 30) * DEG) * 4.2]))}" fill="url(#${u}snap)"/>`;
  const padMarkup = (u, P) => `
    <path d="${padUnder(P)}" fill="url(#${u}side)"/>
    <path d="${padTop(P)}" fill="url(#${u}pad)"/>
    <g clip-path="url(#${u}clip)">
      <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${crimps(P).map(c => `<path d="${c.d}" stroke="${c.hi ? C.crimpHi : C.crimpLo}" opacity="${c.hi ? 0.7 : 0.55}"/>`).join('')}</g>
      <g class="embers"></g>
      <path d="${padTop(P)}" fill="url(#${u}lit)" opacity="0.55"/>
    </g>
    <path d="${padTop(P)}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
    <g class="halos"></g>
    <g class="sparks" opacity="0" stroke="oklch(0.95 0.1 90)" stroke-width="3" stroke-linecap="round">
      ${[150, 195, 240].map(a => `<g transform="rotate(${a})"><line x1="0" y1="0" x2="6" y2="0"/></g>`).join('')}
    </g>
    <g class="cell">${cellMarkup(u)}</g>`;

  // Live wool: the battery follows the pointer and lights the wool it touches.
  // Each new spot starts a new ember; three embers burn at most.
  const burn = (svg, P, hook = {}) => {
    const q = s => svg.querySelector(s);
    const emG = q('.embers'), haloG = q('.halos'), cell = q('.cell'), sparks = q('.sparks');
    const lines = [...sparks.querySelectorAll('line')];
    const embers = [0, 1, 2].map(() => {
      const g = el('g', {}, emG);
      // The glow layer sits on the front ring, under the oxide; it shows the heat.
      let glow;
      RINGS.forEach(([k, c], i) => {
        if (i === RINGS.length - 1) glow = el('path', { d: blob(0, 0, ER * 1.06, ER * 1.06, ESEED, 10, 0.12), fill: C.hot }, g);
        el('path', { d: blob(0, 0, ER * k, ER * k, ESEED, 10, 0.12), fill: c }, g);
      });
      const halo = el('circle', { r: ER * 1.7, fill: `url(#${svg.dataset.u}halo)` }, haloG);
      return { g, glow, halo, x: 0, y: 0, s: 0, heat: 0 };
    });
    const st = { bx: P.rest[0], by: P.rest[1] - P.lift, ang: P.ang, live: false, cur: 0, sp: [0, 0] };
    const paint = () => {
      embers.forEach(e => {
        e.g.setAttribute('transform', `translate(${f(e.x)} ${f(e.y)}) scale(${f(e.s)} ${f(e.s * P.sq)})`);
        e.glow.setAttribute('opacity', f(e.heat));
        e.halo.setAttribute('transform', `translate(${f(e.x)} ${f(e.y)}) scale(${f(e.s)} ${f(e.s * P.sq)})`);
        e.halo.setAttribute('opacity', f(e.heat * 0.85));
      });
      cell.setAttribute('transform', `translate(${f(st.bx)} ${f(st.by)}) rotate(${f(st.ang)}) scale(${P.k})`);
      const a = embers[st.cur];
      sparks.setAttribute('transform', `translate(${f(a.x)} ${f(a.y)})`);
      hook.paint?.(embers, st);
    };
    // The rest look: one small ember, dull, and the battery just above it.
    const rest = (dur = 0) => {
      embers.forEach((e, i) => {
        gsap.killTweensOf(e);
        const to = i === 0 ? { x: P.rest[0], y: P.rest[1], s: 0.34, heat: 0.18 } : { s: 0, heat: 0 };
        if (dur) gsap.to(e, { ...to, duration: dur, ease: 'power2.inOut', onUpdate: paint }); else Object.assign(e, to);
      });
      st.cur = 0;
    };
    rest(); paint();
    // A point on the pad near p, kept inside the top's edge.
    const onPad = p => {
      const dx = (p[0] - P.c[0]) / (P.rx * P.reach), dy = (p[1] - P.c[1]) / (P.ry * P.reach * 0.9), d = Math.hypot(dx, dy);
      const k = d > 1 ? 1 / d : 1;
      return [P.c[0] + dx * k * P.rx * P.reach, P.c[1] + dy * k * P.ry * P.reach * 0.9];
    };
    // A new ember starts at the spot; the others cool to a dull glow.
    const ignite = spot => {
      const prev = embers[st.cur];
      if (prev.s > 0.05 && Math.hypot(spot[0] - prev.x, (spot[1] - prev.y) / P.sq) < ER * prev.s * 0.9) return;
      embers.forEach(e => gsap.to(e, { heat: Math.min(e.heat, 0.3), duration: 0.6, overwrite: 'auto', onUpdate: paint }));
      st.cur = (st.cur + 1) % embers.length;
      const e = embers[st.cur];
      gsap.killTweensOf(e);
      Object.assign(e, { x: spot[0], y: spot[1], s: 0.05, heat: 1 });
      // The burn spreads while the battery stays.
      gsap.to(e, { s: P.max, duration: 2.6, ease: 'power1.out', onUpdate: paint });
      hook.light?.(e);
    };
    let spray = null;
    const touch = p => {
      const spot = onPad(p);
      gsap.to(st, { bx: spot[0], by: spot[1], ang: P.ang + (spot[0] - P.c[0]) * 0.25, duration: 0.22, ease: 'power2.out', overwrite: 'auto', onUpdate: paint, onComplete: () => { if (st.live) ignite(spot); } });
    };
    return {
      enter(p) {
        st.live = true;
        gsap.set(sparks, { opacity: 1 });
        spray?.kill();
        spray = gsap.timeline({ repeat: -1 });
        lines.forEach((l, i) => spray.fromTo(l, { x: ER * 0.6, opacity: 1 }, { x: ER * 1.5, opacity: 0, duration: 0.42, ease: 'power1.out' }, i * 0.15));
        hook.enter?.();
        // With no pointer, the battery touches the rest spot.
        touch(p || P.rest);
      },
      move(p) { if (p && st.live) touch(p); },
      leave() {
        st.live = false;
        spray?.kill(); spray = null;
        gsap.to(sparks, { opacity: 0, duration: 0.2, overwrite: true });
        gsap.to(st, { bx: P.rest[0], by: P.rest[1] - P.lift, ang: P.ang, duration: 0.6, ease: 'power2.inOut', overwrite: 'auto', onUpdate: paint });
        rest(0.9);
        hook.leave?.();
      },
    };
  };
  // The emblem: the pad and the battery in white, a cut round each, the ember dark.
  const woolEmblem = P => {
    const t = `translate(${P.rest[0]} ${P.rest[1] - P.lift}) rotate(${P.ang}) scale(${P.k})`;
    const cellD = 'M-12 0H12V-44Q12 -47 9 -47H-9Q-12 -47 -12 -44Z';
    return `<path d="${padUnder(P)}" fill="#fff"/><path d="${padTop(P)}" fill="#fff" stroke="#000" stroke-width="2.4"/>`
      + `<path d="${blob(0, 0, ER * 1.05, ER * 1.05, ESEED, 10, 0.12)}" fill="#000" transform="translate(${P.rest[0]} ${P.rest[1]}) scale(0.5 ${0.5 * P.sq})"/>`
      + `<g transform="${t}"><path d="${cellD}" fill="#fff" stroke="#000" stroke-width="5"/><path d="${cellD}" fill="#fff"/><path d="M-12 -36H12" stroke="#000" stroke-width="2.4"/></g>`;
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}</defs>
        <defs>
        <radialGradient id="${u}body" cx="0.36" cy="0.3" r="0.85"><stop offset="0" stop-color="oklch(0.86 0.008 250)"/><stop offset="0.55" stop-color="oklch(0.64 0.012 255)"/><stop offset="1" stop-color="oklch(0.4 0.016 262)"/></radialGradient>
        <radialGradient id="${u}glow"><stop offset="0" stop-color="oklch(0.86 0.16 72)" stop-opacity="0.95"/><stop offset="0.55" stop-color="oklch(0.7 0.2 45)" stop-opacity="0.5"/><stop offset="1" stop-color="oklch(0.6 0.2 35)" stop-opacity="0"/></radialGradient>

  });

  /* ================= Gallery ================= */
  const NAME = 'Steel wool';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-steelwool';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `steelwool-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
