<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Observatory 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Observatory 1</h1>
<p class="lede">Observatory, round 1. The toy is not built; this is an icon only. A: a white dome on a stone drum, the slit and the tube; the pointer is the star. D: the drum is the block, the dome sits on it.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The toy's tokens: a white dome, a stone drum, night in the slit, a steel tube.
  const DOME = [[0, 'oklch(0.96 0.01 95)'], [0.6, 'oklch(0.8 0.015 250)'], [1, 'oklch(0.56 0.025 260)']];
  const STONE = [[0, 'oklch(0.64 0.03 62)'], [1, 'oklch(0.42 0.03 50)']];
  const NIGHT = 'oklch(0.17 0.035 272)', DOOR = 'oklch(0.28 0.03 45)', DOOR_LIT = 'oklch(0.78 0.12 75)';
  const TUBE = 'oklch(0.84 0.02 250)', TUBE_HI = 'oklch(0.97 0.01 250)', LENS = 'oklch(0.3 0.05 260)';
  const STAR = 'oklch(0.96 0.09 95)';
  const RAD = Math.PI / 180;

  // A slit of even width w from the dome's foot up to its top.
  // proj maps a point on the dome and an east offset to the screen.
  const slitPath = (proj, phi, w) => {
    const L = [], R = [];
    for (let i = 0; i <= 12; i++) {
      const th = (i / 12) * 90 * RAD;
      L.push(proj(phi, th, -w)); R.push(proj(phi, th, w));
    }
    return poly([...L, ...R.reverse()]);
  };
  // The tube: a bar from the pivot along the aim, with a lens at the tip.
  const tubePath = (a, b, w) => {
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, nx = -dy / l * w / 2, ny = dx / l * w / 2;
    return poly([[a[0] + nx, a[1] + ny], [b[0] + nx, b[1] + ny], [b[0] - nx, b[1] - ny], [a[0] - nx, a[1] - ny]]);
  };
  // A bold four-point star.
  const starPath = (x, y, r) => `M${f(x)} ${f(y - r)}Q${f(x + r * 0.16)} ${f(y - r * 0.16)} ${f(x + r)} ${f(y)}Q${f(x + r * 0.16)} ${f(y + r * 0.16)} ${f(x)} ${f(y + r)}Q${f(x - r * 0.16)} ${f(y + r * 0.16)} ${f(x - r)} ${f(y)}Q${f(x - r * 0.16)} ${f(y - r * 0.16)} ${f(x)} ${f(y - r)}Z`;

  // The dome's state, shared by A and D.
  // The pointer is the star: the dome turns to it, the slit opens, the tube slews.
  const aim = (draw, rest, map) => {
    const st = { phi: rest.phi, th: rest.th, w: rest.w, sx: rest.sx, sy: rest.sy, to: { ...rest }, live: false };
    const step = () => {
      // The dome turns slowly; the tube and the shutter follow faster.
      st.phi += (st.to.phi - st.phi) * 0.05;
      st.th += (st.to.th - st.th) * 0.09;
      st.w += (st.to.w - st.w) * 0.1;
      st.sx += (st.to.sx - st.sx) * 0.25; st.sy += (st.to.sy - st.sy) * 0.25;
      draw(st);
      const off = Math.abs(st.phi - st.to.phi) + Math.abs(st.th - st.to.th) + Math.abs(st.w - st.to.w) + Math.abs(st.sx - st.to.sx) + Math.abs(st.sy - st.to.sy);
      if (!st.live && off < 0.02) { Object.assign(st, rest); draw(st); loop.stop(); }
    };
    const loop = clock(step);
    draw(st);
    return {
      enter(p) { st.live = true; st.to = { ...st.to, w: rest.wOpen }; loop.start(); if (p) this.move(p); },
      move(p) { if (!p) return; Object.assign(st.to, map(p)); },
      leave() { st.live = false; st.to = { ...rest }; loop.start(); },
    };
  };

  const DIRS = [];

  /* ================= Current ================= */

  // Observatory is not built; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NOT BUILT</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // The dome from the front on its stone drum.
  const R = 34, OX = 64, OY = 72;
  const A_DOME = `M${OX - R} ${OY}A${R} ${R} 0 0 1 ${OX + R} ${OY}Z`;
  const A_DRUM = `M${OX - R - 2} ${OY - 2}H${OX + R + 2}V${OY + 34}Q${OX + R + 2} ${OY + 38} ${OX + R - 2} ${OY + 38}H${OX - R + 2}Q${OX - R - 2} ${OY + 38} ${OX - R - 2} ${OY + 34}Z`;
  const A_DOOR = `M58 110V96Q58 90 64 90Q70 90 70 96V110Z`;
  // A point on the dome at azimuth phi and height th, shifted east by e.
  const aProj = (phi, th, e) => [OX + R * Math.cos(th) * Math.sin(phi) + e * Math.cos(phi), OY - R * Math.sin(th)];
  const A_REST = { phi: -28 * RAD, th: 52 * RAD, w: 4.2, wOpen: 6.2, sx: 98, sy: 22 };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [28, 14, 72, 98],
    idea: 'An old observatory from the front: a white dome on a stone drum with a warm lit door, a dark slit through the dome and the steel tube out of it. One bold star hangs in the sky. The pointer is the star you pick: the dome turns slowly to face it, the slit opens, and the tube slews up or down after it.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}g`, 2)}
          ${rg(`${u}dome`, DOME, 'cx="0.36" cy="0.3" r="0.85"')}
          ${lg(`${u}stone`, STONE, 'x1="0" y1="0" x2="1" y2="1"')}
          ${rg(`${u}glow`, [[0, STAR, 0.7], [1, STAR, 0]])}
          <mask id="${u}tm" maskUnits="userSpaceOnUse" x="-20" y="-20" width="168" height="168"><rect x="-20" y="-20" width="168" height="168" fill="#fff"/><path d="${A_DOME}" fill="#000"/><path class="slitm" fill="#fff"/></mask>
          <clipPath id="${u}dc"><path d="${A_DOME}"/></clipPath></defs>
        <ellipse cx="64" cy="111" rx="40" ry="4" fill="oklch(0.05 0.01 270)" opacity="0.6" filter="url(#${u}b)"/>
        ${body(A_DRUM, u, 'stone')}
        <path d="${A_DOOR}" fill="${DOOR}"/><path d="M60.5 108V97Q60.5 93 64 93Q67.5 93 67.5 97V108Z" fill="${DOOR_LIT}" opacity="0.85"/>
        ${body(A_DOME, u, 'dome')}
        <path class="slit" clip-path="url(#${u}dc)" fill="${NIGHT}"/>
        <g mask="url(#${u}tm)"><path class="tube" fill="${TUBE}"/><path class="tubehi" fill="none" stroke="${TUBE_HI}" stroke-width="2.4" stroke-linecap="round"/><circle class="lens" r="4.2" fill="${LENS}"/></g>
        <circle class="sg" r="10" fill="url(#${u}glow)"/><path class="star" fill="${STAR}"/>`;
      const slit = svg.querySelector('.slit'), slitm = svg.querySelector('.slitm');
      const tube = svg.querySelector('.tube'), hi = svg.querySelector('.tubehi'), lens = svg.querySelector('.lens');
      const star = svg.querySelector('.star'), sg = svg.querySelector('.sg');
      const piv = [OX, OY - 6];
      return aim(st => {
        const d = slitPath(aProj, st.phi, st.w);
        slit.setAttribute('d', d); slitm.setAttribute('d', d);
        const L = R * 1.42, c = Math.cos(st.th);
        const tip = [piv[0] + L * c * Math.sin(st.phi), piv[1] - L * Math.sin(st.th)];
        tube.setAttribute('d', tubePath(piv, tip, 9));
        const mid = [lerp(piv[0], tip[0], 0.45), lerp(piv[1], tip[1], 0.45)];
        hi.setAttribute('d', `M${f(mid[0] - 1.8)} ${f(mid[1])}L${f(tip[0] - 1.8)} ${f(tip[1])}`);
        lens.setAttribute('cx', f(tip[0])); lens.setAttribute('cy', f(tip[1]));
        star.setAttribute('d', starPath(st.sx, st.sy, 6.5));
        sg.setAttribute('cx', f(st.sx)); sg.setAttribute('cy', f(st.sy));
      }, A_REST, p => {
        const k = clamp((p[0] - 64) / 38, -1, 1);
        return { phi: k * 55 * RAD, th: clamp(lerp(82, 26, (p[1] - 16) / 58), 26, 82) * RAD, sx: clamp(p[0], 24, 104), sy: clamp(p[1], 12, 62) };
      });
    },
    emblem: (() => {
      const piv = [OX, OY - 6], c = Math.cos(A_REST.th), L = R * 1.42;
      const tip = [piv[0] + L * c * Math.sin(A_REST.phi), piv[1] - L * Math.sin(A_REST.th)];
      return `${EMB_HEAD}<path d="${A_DRUM}${A_DOME}" fill="#fff"/><path d="${A_DOOR}" fill="#000"/><path d="${slitPath(aProj, A_REST.phi, A_REST.w)}" fill="#000"/><path d="${tubePath(piv, tip, 9)}" fill="#fff"/><path d="${starPath(A_REST.sx, A_REST.sy, 6.5)}" fill="#fff"/></svg>`;
    })(),
  });

  /* ================= D: Isometric block ================= */

  // The drum is the block; the dome sits on its top.
  const CY = 80, HALF = 22, T = 20;
  const iso = (gx, gy, h = 0) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5 - h];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const [N, E, S, W] = D_TOP;
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  const DR = 21, DRX = DR * 1.2247, DRY = DR * 0.7071;
  // The dome's outline: a circle above, the front half of its foot below.
  const D_DOME = `M${f(64 - DRX)} ${CY}A${f(DRX)} ${f(DRX)} 0 0 1 ${f(64 + DRX)} ${CY}A${f(DRX)} ${f(DRY)} 0 0 1 ${f(64 - DRX)} ${CY}Z`;
  // A point on the dome: phi turns on the ground, th lifts, e shifts east.
  const dProj = (phi, th, e) => {
    const gx = DR * Math.cos(th) * Math.cos(phi) - e * Math.sin(phi), gy = DR * Math.cos(th) * Math.sin(phi) + e * Math.cos(phi);
    return iso(gx, gy, DR * Math.sin(th));
  };
  // A door in the left face, from u0 to u1 along it.
  const onLeft = (uu, v) => { const p = [lerp(W[0], S[0], uu), lerp(W[1], S[1], uu)]; return [p[0], p[1] + T * v]; };
  const D_DOOR = poly([onLeft(0.42, 0.3), onLeft(0.62, 0.3), onLeft(0.62, 1), onLeft(0.42, 1)]);
  const D_REST = { phi: 12 * RAD, th: 46 * RAD, w: 3.2, wOpen: 4.8, sx: 100, sy: 30 };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [22, 22, 84, 100],
    idea: 'The stone drum is the block: a warm lit door in its left face, a rim on the top edges. The white dome sits on the top with its dark slit and the steel tube out of it; one bold star in the sky. The pointer is the star: the dome turns round to face it, the slit opens and the tube slews after it.',
    art(svg, u) {
      const top = poly(D_TOP);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}
          ${rg(`${u}dome`, DOME, 'cx="0.36" cy="0.3" r="0.85"')}
          ${lg(`${u}top`, [[0, 'oklch(0.66 0.03 62)'], [1, 'oklch(0.54 0.03 58)']], 'x1="0" y1="0" x2="0.4" y2="1"')}
          ${rg(`${u}glow`, [[0, STAR, 0.7], [1, STAR, 0]])}
          <mask id="${u}tm" maskUnits="userSpaceOnUse" x="-20" y="-20" width="168" height="168"><rect x="-20" y="-20" width="168" height="168" fill="#fff"/><path d="${D_DOME}" fill="#000"/><path class="slitm" fill="#fff"/></mask>
          <clipPath id="${u}dc"><path d="${D_DOME}"/></clipPath></defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 270)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="oklch(0.5 0.03 55)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="oklch(0.36 0.028 50)"/>
        <path d="${D_DOOR}" fill="${DOOR_LIT}" opacity="0.9"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        ${body(D_DOME, u, 'dome')}
        <path class="slit" clip-path="url(#${u}dc)" fill="${NIGHT}"/>
        <path class="tube" fill="${TUBE}"/><path class="tube" fill="url(#${u}lit)"/><circle class="lens" r="3.4" fill="${LENS}"/>
        <circle class="sg" r="9" fill="url(#${u}glow)"/><path class="star" fill="${STAR}"/>`;
      const slit = svg.querySelector('.slit'), slitm = svg.querySelector('.slitm');
      const tubes = svg.querySelectorAll('.tube'), lens = svg.querySelector('.lens');
      const star = svg.querySelector('.star'), sg = svg.querySelector('.sg');
      return aim(st => {
        const d = slitPath(dProj, st.phi, st.w);
        slit.setAttribute('d', d); slitm.setAttribute('d', d);
        // The tube faces the viewer, so it leaves the slit and crosses the dome.
        const at = k => { const c = Math.cos(st.th); return iso(k * c * Math.cos(st.phi), k * c * Math.sin(st.phi), 3 + k * Math.sin(st.th)); };
        const tp = tubePath(at(DR * 0.9), at(DR * 1.95), 7.5);
        const tip = at(DR * 1.95);
        tubes.forEach(t => t.setAttribute('d', tp));
        lens.setAttribute('cx', f(tip[0])); lens.setAttribute('cy', f(tip[1]));
        star.setAttribute('d', starPath(st.sx, st.sy, 6));
        sg.setAttribute('cx', f(st.sx)); sg.setAttribute('cy', f(st.sy));
      }, D_REST, p => {
        // The slit faces right at rest; the pointer swings it from front to side.
        const k = clamp((p[0] - 64) / 38, -1, 1);
        return { phi: (25 - k * 35) * RAD, th: clamp(lerp(80, 28, (p[1] - 20) / 50), 28, 80) * RAD, sx: clamp(p[0], 24, 104), sy: clamp(p[1], 18, 56) };
      });
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/><path d="${D_DOME}" fill="#fff"/><path d="${slitPath(dProj, D_REST.phi, D_REST.w)}" fill="#000"/><path d="${starPath(D_REST.sx, D_REST.sy, 6)}" fill="#fff"/></svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Observatory';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-observatory';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `observatory-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
