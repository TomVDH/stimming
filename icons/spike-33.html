<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 33</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans); padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased; }
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; -webkit-mask: var(--emblem) center / contain no-repeat; -webkit-mask-source-type: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before { content: ""; position: absolute; inset: -20%; background: radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%), radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%), radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%); }
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike 33</h1>
<p class="lede">Ten seconds, round 5: the ascent plume. Reeds in front, a real column of exhaust climbing behind them, the spark at its head. One picture, three lights. Hover launches; pointer y sets the climb.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const set = (e, a) => { for (const k in a) e.setAttribute(k, a[k]); };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const polyD = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const rng = seed => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';

  /* ================= Shared kit ================= */

  const SHADOW = 'oklch(0.07 0.01 265)', HOT = 'oklch(0.99 0.03 95)';
  const lin = (defs, id, x1, y1, x2, y2, stops, user) => { const g = el('linearGradient', { id, x1, y1, x2, y2, ...(user ? { gradientUnits: 'userSpaceOnUse' } : {}) }, defs); stops.forEach(([o, c, a = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g)); return g; };
  const rad = (defs, id, cx, cy, r, stops, user) => { const g = el('radialGradient', { id, cx, cy, r, ...(user ? { gradientUnits: 'userSpaceOnUse' } : {}) }, defs); stops.forEach(([o, c, a = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g)); return g; };
  const glowF = (defs, id, sd = 1.6) => { const g = el('filter', { id, x: -0.8, y: -0.8, width: 2.6, height: 2.6 }, defs); el('feGaussianBlur', { stdDeviation: sd, result: 'b' }, g); const m = el('feMerge', {}, g); el('feMergeNode', { in: 'b' }, m); el('feMergeNode', { in: 'SourceGraphic' }, m); };
  const blurF = (defs, id, sd) => { const g = el('filter', { id, x: -0.3, y: -0.3, width: 1.6, height: 1.6 }, defs); el('feGaussianBlur', { stdDeviation: sd }, g); };
  const block = (svg, fill) => { el('rect', { x: 20, y: 20, width: 94, height: 94, fill: SHADOW }, svg); return el('rect', { x: 14, y: 14, width: 94, height: 94, fill }, svg); };
  const clipBlock = (defs, id) => { const c = el('clipPath', { id }, defs); el('rect', { x: 14, y: 14, width: 94, height: 94 }, c); return `url(#${id})`; };
  const ctl = ({ aim, rest, demo, enter = () => {}, leave = () => {} }) => { let tl = null; return { enter(p) { enter(); if (p) aim(p); else tl = demo(); }, move(p) { if (p && !tl) aim(p); }, leave() { tl?.kill(); tl = null; leave(); rest(); } }; };

  /* ================= The composition ================= */

  // Reeds: a near fringe of bold stalks and a far bed of finer ones, each with a plume head.
  const makeReeds = (seed, n, x0, x1, hMin, hMax, wk) => {
    const r = rng(seed), out = [];
    for (let i = 0; i < n; i++) {
      const x = x0 + (i / (n - 1)) * (x1 - x0) + (r() - 0.5) * 3, h = hMin + r() * (hMax - hMin) + (Math.abs(x - 64) > 30 ? 8 : 0), w = (1.1 + r() * 1.1) * wk, lean = (r() - 0.5) * 0.24, pl = (4.5 + r() * 4) * wk;
      out.push({ x, h, w, lean, pl });
    }
    return out;
  };
  const NEAR = makeReeds(23, 26, 15, 109, 16, 42, 1), FAR = makeReeds(61, 40, 14, 110, 8, 20, 0.7);
  const reedD = (rd, k = 1, base = 108) => {
    const top = [rd.x + rd.lean * rd.h * k, base - rd.h * k], w = rd.w * k, pl = rd.pl * k;
    const stalk = polyD([[rd.x - w, base], [rd.x + w, base], [top[0] + w * 0.4, top[1]], [top[0] - w * 0.4, top[1]]]);
    const plume = polyD([[top[0] - w * 0.9, top[1] + 1], [top[0] + w * 0.9, top[1] + 1], [top[0] + pl * 0.75 + rd.lean * 8, top[1] - pl * 1.1], [top[0] + pl * 0.3, top[1] - pl * 1.35], [top[0] - pl * 0.1, top[1] - pl * 0.5]]);
    return stalk + plume;
  };
  // The trail path, and the puffs along it: 52 puffs, wider as they rise, jittered off the line.
  const T0 = [48, 90], T1 = [52, 50], T2 = [92, 20];
  const at = t => [(1 - t) * (1 - t) * T0[0] + 2 * (1 - t) * t * T1[0] + t * t * T2[0], (1 - t) * (1 - t) * T0[1] + 2 * (1 - t) * t * T1[1] + t * t * T2[1]];
  const PUFFS = (() => {
    const r = rng(41), N = 52, out = [];
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1), p = at(t), q = at(Math.min(1, t + 0.01));
      const dx = q[0] - p[0], dy = q[1] - p[1], m = Math.hypot(dx, dy) || 1;
      const rad = 2 + 7.5 * Math.pow(t, 0.9), j = (r() - 0.5) * rad * 0.8;
      out.push({ x: p[0] - (dy / m) * j, y: p[1] + (dx / m) * j, r: rad * (0.75 + 0.5 * r()), t, s: r() });
    }
    return out;
  })();

  // One ascent picture. mood: 'dawn' (sunlit top), 'night' (flame-lit), 'day' (early sun, pale sky).
  const ascent = mood => (svg, id) => {
    const defs = el('defs', {}, svg);
    const SKY = {
      dawn: [[0, 'oklch(0.16 0.05 268)'], [0.5, 'oklch(0.3 0.09 300)'], [0.78, 'oklch(0.6 0.16 22)'], [0.95, 'oklch(0.86 0.15 70)']],
      night: [[0, 'oklch(0.1 0.03 268)'], [0.6, 'oklch(0.17 0.05 290)'], [0.88, 'oklch(0.32 0.1 345)'], [1, 'oklch(0.5 0.14 30)']],
      day: [[0, 'oklch(0.42 0.1 262)'], [0.55, 'oklch(0.62 0.09 275)'], [0.82, 'oklch(0.8 0.1 40)'], [0.96, 'oklch(0.94 0.1 85)']],
    }[mood];
    lin(defs, `${id}sky`, 0, 0, 0, 1, SKY);
    rad(defs, `${id}hz`, 64, 90, 46, [[0, 'oklch(0.9 0.14 72)', mood === 'night' ? 0.35 : 0.7], [1, 'oklch(0.9 0.14 72)', 0]], true);
    // Puff bodies: a cold body, a sunlit body, a flame-lit body; a rim toward the light.
    rad(defs, `${id}cold`, 0.5, 0.5, 0.5, [[0, mood === 'day' ? 'oklch(0.78 0.02 260)' : 'oklch(0.46 0.03 262)', 1], [0.7, mood === 'day' ? 'oklch(0.66 0.025 262)' : 'oklch(0.34 0.03 266)', 0.92], [1, 'oklch(0.3 0.03 270)', 0]]);
    rad(defs, `${id}sun`, 0.4, 0.38, 0.62, [[0, 'oklch(0.99 0.04 92)', 1], [0.5, 'oklch(0.9 0.13 72)', 1], [0.86, 'oklch(0.72 0.15 25)', 0.9], [1, 'oklch(0.6 0.14 15)', 0]]);
    rad(defs, `${id}fire`, 0.5, 0.6, 0.6, [[0, 'oklch(0.96 0.08 80)', 1], [0.45, 'oklch(0.78 0.18 45)', 0.95], [1, 'oklch(0.45 0.12 30)', 0]]);
    glowF(defs, `${id}g`, 2.2);
    blurF(defs, `${id}soft`, 0.7);
    blurF(defs, `${id}mist`, 2.4);
    block(svg, 'oklch(0.13 0.022 268)');
    const inner = el('g', { 'clip-path': clipBlock(defs, `${id}c`) }, svg);
    el('rect', { x: 14, y: 14, width: 94, height: 94, fill: `url(#${id}sky)` }, inner);
    el('rect', { x: 14, y: 14, width: 94, height: 94, fill: `url(#${id}hz)` }, inner);
    if (mood === 'night') { const r = rng(5); for (let i = 0; i < 26; i++) el('circle', { cx: f(16 + r() * 90), cy: f(16 + r() * 60), r: f(0.4 + r() * 0.5), fill: 'oklch(0.9 0.02 90)', opacity: f(0.4 + r() * 0.6) }, inner); }
    // Far shore and mist: a dark line, a soft pale band above the reeds.
    el('rect', { x: 14, y: 87.5, width: 94, height: 1.2, fill: 'oklch(0.18 0.04 300)' }, inner);
    el('rect', { x: 14, y: 82, width: 94, height: 8, fill: mood === 'night' ? 'oklch(0.5 0.08 330)' : 'oklch(0.95 0.05 80)', opacity: mood === 'night' ? 0.25 : 0.4, filter: `url(#${id}mist)` }, inner);
    // The plume, behind the reeds: three circles a puff.
    const plumeG = el('g', { filter: `url(#${id}soft)` }, inner);
    const cold = PUFFS.map(p => el('circle', { cx: f(p.x), cy: f(p.y), r: f(p.r), fill: `url(#${id}cold)` }, plumeG));
    const lit = PUFFS.map(p => el('circle', { cx: f(p.x), cy: f(p.y), r: f(p.r * 1.06), fill: `url(#${mood === 'night' ? id + 'fire' : id + 'sun'})` }, plumeG));
    const rim = PUFFS.map(p => el('circle', { cx: f(p.x - p.r * 0.3), cy: f(p.y - p.r * 0.3), r: f(p.r * 0.45), fill: mood === 'night' ? 'oklch(0.85 0.12 60)' : 'oklch(0.98 0.03 90)' }, plumeG));
    // Flame and spark at the head.
    const flame = el('path', { fill: 'oklch(0.9 0.16 60)', filter: `url(#${id}g)` }, inner);
    const halo = el('circle', { r: 9, fill: 'oklch(0.92 0.12 75)', opacity: 0.35, filter: `url(#${id}g)` }, inner);
    const spark = el('circle', { r: 2.2, fill: HOT, filter: `url(#${id}g)` }, inner);
    // The reeds: a far bed a shade lighter, then the near fringe in ink.
    el('rect', { x: 14, y: 88, width: 94, height: 20, fill: mood === 'day' ? 'oklch(0.2 0.04 290)' : 'oklch(0.1 0.02 285)' }, inner);
    el('path', { d: FAR.map(rd => reedD(rd, 1, 96)).join(''), fill: mood === 'day' ? 'oklch(0.24 0.045 290)' : 'oklch(0.15 0.03 290)' }, inner);
    el('path', { d: NEAR.map(rd => reedD(rd)).join(''), fill: mood === 'day' ? 'oklch(0.12 0.025 285)' : 'oklch(0.07 0.015 282)' }, inner);
    // Climb: puffs appear up to the head; the sunlit band or the flame lights what is near the top.
    const SHADE = 48;
    const st = { u: 0.66 };
    const draw = () => {
      const u = st.u, head = at(u);
      PUFFS.forEach((p, i) => {
        const born = sstep(p.t - 0.05, p.t, u), age = clamp((u - p.t) * 6, 0, 1);
        const grow = 0.55 + 0.45 * age;
        const w = mood === 'night' ? Math.exp(-Math.pow(Math.hypot(p.x - head[0], p.y - head[1]) / 16, 2)) : sstep(SHADE + 8, SHADE - 8, p.y);
        set(cold[i], { opacity: f(born * (1 - 0.6 * w)), r: f(p.r * grow) });
        set(lit[i], { opacity: f(born * w), r: f(p.r * 1.06 * grow) });
        set(rim[i], { opacity: f(born * (mood === 'night' ? w * 0.9 : 0.35 + 0.5 * w)), r: f(p.r * 0.45 * grow) });
      });
      const q = at(Math.max(0, u - 0.04)), dx = head[0] - q[0], dy = head[1] - q[1], m = Math.hypot(dx, dy) || 1, nx = -dy / m, ny = dx / m, L = 6 + 3 * u;
      set(flame, { d: polyD([[head[0] + nx * 1.4, head[1] + ny * 1.4], [head[0] - nx * 1.4, head[1] - ny * 1.4], [head[0] - dx / m * L, head[1] - dy / m * L]]) });
      set(halo, { cx: f(head[0]), cy: f(head[1]) });
      set(spark, { cx: f(head[0]), cy: f(head[1]), r: f(1.8 + 1.2 * u) });
    };
    draw();
    const to = (u, d = 0.3, ease = 'power2.out') => gsap.to(st, { u, duration: d, ease, overwrite: 'auto', onUpdate: draw });
    let loop = null;
    const fly = () => { loop = gsap.timeline({ onComplete: () => { loop = gsap.delayedCall(0.4, fly); } }).fromTo(st, { u: 0.02 }, { u: 1, duration: 1.8, ease: 'power2.in', onUpdate: draw }).to(st, { u: 1, duration: 0.6 }); };
    return ctl({
      aim: p => { if (loop) { loop.kill(); loop = null; } to(clamp((112 - p[1]) / 92, 0.04, 1)); },
      rest: () => { loop?.kill(); loop = null; to(0.66, 0.7, 'power3.out'); },
      demo: () => { if (!loop) fly(); return { kill() {} }; },
      enter: () => { if (!loop) fly(); },
    });
  };
  const emblem = () => {
    const puffs = PUFFS.map(p => `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${f(p.r * 1.1)}" fill="${p.y < 48 ? '#fff' : '#8a8a8a'}"/>`).join('');
    const h = at(1);
    return `${EMB_HEAD}\n  ${puffs}\n  <circle cx="${f(h[0])}" cy="${f(h[1])}" r="6" fill="#fff"/>\n  <rect x="0" y="94" width="128" height="34" fill="#fff"/>\n  <path d="${NEAR.map(rd => reedD(rd, 1.25, 98)).join('')}" fill="#fff"/>\n</svg>\n`;
  };

  const DIRS = [
    { l: 'A', name: 'Ascent, dawn', idea: 'The twilight shot. A dusk gradient to a gold horizon, mist over the far shore, the near reeds in ink. The exhaust column climbs from behind them, cold blue-grey low down and sunlit gold where it rises above the shadow line; a hot spark and a short flame at its head.', box: [10, 10, 110, 110], art: ascent('dawn'), emblem },
    { l: 'B', name: 'Ascent, night', idea: 'The same climb at night. Stars, a faint rose afterglow, the column lit only by its own flame: orange near the head, dark below. The spark is the brightest thing on the shelf.', box: [10, 10, 110, 110], art: ascent('night'), emblem },
    { l: 'C', name: 'Ascent, first sun', idea: 'A few minutes later. Pale blue sky, a cream horizon, the plume all in sunlight: white and gold on blue, the reeds a cooler violet. Bright and clean.', box: [10, 10, 110, 110], art: ascent('day'), emblem },
  ];

  /* ================= Gallery ================= */

  const NAME = 'Ten seconds';
  const fitIcon = (svg, box) => { const b = { x: box[0], y: box[1], width: box[2], height: box[3] }, side = Math.max(b.width, b.height), size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2; svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`); };
  const local = (svg, e) => { const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal; return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height]; };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-launch';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  window.CTL = {};
  for (const D of DIRS) {
    const file = `launch33-${D.l.toLowerCase()}`, url = `spike/emblems/${file}.svg`;
    window.EMBLEMS[file] = D.emblem();
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header><b>${D.l}</b><span>· ${D.name}</span></header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      <div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>
      <p class="idea">${D.idea}</p>`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tile => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      (window.CTL[D.l] ||= []).push({ c, svg });
      if (reduce) return;
      tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tile.addEventListener('pointermove', e => c.move(local(svg, e)));
      tile.addEventListener('pointerleave', () => c.leave());
      tile.addEventListener('focus', () => c.enter(null));
      tile.addEventListener('blur', () => c.leave());
    });
  }
  if (new URLSearchParams(location.search).has('dump')) { const pre = document.createElement('pre'); pre.id = 'dump'; pre.textContent = JSON.stringify(window.EMBLEMS); document.body.append(pre); }
})();
</script>
</body>
</html>
