<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Iodine clock 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Iodine clock 1</h1>
<p class="lede">Iodine clock, round 1. The toy is not built; this is an icon only. A: a lab beaker, ink halfway at rest; hover pours, waits and snaps to ink. D: a stirrer is the block, the beaker stands on it.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The toy's tokens: lab glass, a clear liquid, the ink it snaps to.
  const GLASS = [[0, 'oklch(0.92 0.02 220)', 0.5], [0.28, 'oklch(0.75 0.02 220)', 0.1], [0.78, 'oklch(0.75 0.02 220)', 0.1], [1, 'oklch(0.92 0.02 220)', 0.42]];
  const CLEAR = [[0, 'oklch(0.9 0.04 200)', 0.32], [1, 'oklch(0.75 0.05 210)', 0.42]];
  const INK = [[0, 'oklch(0.2 0.07 266)'], [1, 'oklch(0.08 0.025 272)']];
  const SHEEN = 'oklch(0.55 0.14 262)', STREAM = 'oklch(0.9 0.05 200)', MARK = 'oklch(0.97 0.01 220)';

  // The clock, shared by A and D: k is how far the ink has risen, 0 to 1.
  // Hover pours the second liquid in. The beaker waits, then snaps to ink.
  // The pointer is the slider: high waits long, low snaps soon.
  // At rest the ink stands halfway, a sharp front through the liquid.
  const REST = { k: 0.55, pour: 0, lvl: 0, glow: 0 };
  const clockwork = draw => {
    const st = { ...REST, wait: 1.2 };
    let tl = null;
    const cycle = () => gsap.timeline({ onUpdate: () => draw(st), onComplete: () => { tl = cycle(); } })
      .to(st, { k: 0, glow: 0, duration: 0.35, ease: 'power1.out' })
      .to(st, { pour: 1, duration: 0.15 })
      .to(st, { lvl: 1, duration: 0.7, ease: 'power1.inOut' }, '<')
      .to(st, { pour: 0, duration: 0.15 })
      // The wait: nothing moves, as in the real reaction.
      .to({}, { duration: st.wait })
      .to(st, { k: 1, glow: 1, duration: 0.18, ease: 'power3.in' })
      .to(st, { glow: 0, duration: 0.5 })
      .to(st, { lvl: 0, duration: 0.6, ease: 'power1.inOut' }, '+=0.7');
    draw(st);
    return {
      enter(p) { if (p) this.move(p); tl?.kill(); tl = cycle(); },
      move(p) { if (p) st.wait = clamp(lerp(2.4, 0.4, (p[1] - 24) / 80), 0.4, 2.4); },
      leave() { tl?.kill(); tl = gsap.to(st, { ...REST, duration: 0.6, ease: 'power2.inOut', onUpdate: () => draw(st) }); },
    };
  };
  // The ink's top edge: a soft wave, so the front reads as liquid.
  const front = (x0, x1, y, amp = 1.6) => `M${x0} ${f(y)}Q${f(lerp(x0, x1, 0.25))} ${f(y - amp)} ${f(lerp(x0, x1, 0.5))} ${f(y)}T${x1} ${f(y)}V130H${x0}Z`;

  const DIRS = [];

  /* ================= Current ================= */

  // Iodine clock is not built; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NOT BUILT</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // A lab beaker with a spout, three bold marks, the liquid two thirds up.
  const A_BEAKER = 'M34 30Q30 27 31 24H97V30Q97 31 96 32V102Q96 112 86 112H44Q34 112 34 102Z';
  const A_IN = 'M38 32H92V101Q92 108 85 108H45Q38 108 38 101Z';
  const BASE_LVL = 56, TOP_LVL = 46, BOT = 108;
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [24, 4, 80, 110],
    idea: 'A lab beaker with a spout and three bold marks. At rest the ink stands halfway: deep blue-black below a sharp front, the clear liquid above. Hover and a second clear liquid pours in; the beaker clears, waits with nothing moving, then snaps to ink all at once. The pointer is the slider: high waits long, low snaps soon. It runs again while you stay.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}g`, 4)}
          ${lg(`${u}glass`, GLASS, 'x1="0" y1="0" x2="1" y2="0"')}${lg(`${u}clear`, CLEAR)}${lg(`${u}ink`, INK)}
          <clipPath id="${u}in"><path d="${A_IN}"/></clipPath></defs>
        <ellipse cx="65" cy="113" rx="36" ry="3.6" fill="oklch(0.05 0.01 270)" opacity="0.6" filter="url(#${u}b)"/>
        <rect class="stream" x="60.5" y="4" width="7" height="50" rx="3.5" fill="${STREAM}" opacity="0"/>
        <g clip-path="url(#${u}in)">
          <rect class="liq" x="36" width="60" height="90" fill="url(#${u}clear)"/>
          <path class="ink" fill="url(#${u}ink)"/>
          <ellipse class="glow" cx="65" cy="80" rx="22" ry="18" fill="${SHEEN}" opacity="0" filter="url(#${u}g)"/>
          <rect class="surf" x="36" width="60" height="2.6" fill="${MARK}" opacity="0.55"/>
        </g>
        <path d="${A_BEAKER}" fill="url(#${u}glass)"/>
        <path d="${A_BEAKER}" fill="url(#${u}lit)"/>
        <path d="M40 40Q40 36 43 35V98Q40 96 40 92Z" fill="#fff" opacity="0.3"/>
        ${[50, 68, 86].map((y, i) => `<rect x="${i === 1 ? 78 : 82}" y="${y}" width="${i === 1 ? 12 : 8}" height="2.6" rx="1.3" fill="${MARK}" opacity="0.75"/>`).join('')}
        <path d="${A_BEAKER}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
      const liq = svg.querySelector('.liq'), ink = svg.querySelector('.ink'), surf = svg.querySelector('.surf');
      const stream = svg.querySelector('.stream'), glow = svg.querySelector('.glow');
      return clockwork(st => {
        const top = lerp(BASE_LVL, TOP_LVL, st.lvl);
        liq.setAttribute('y', f(top)); surf.setAttribute('y', f(top - 1));
        ink.setAttribute('d', front(36, 96, lerp(BOT + 2, top - 1, st.k), 1.6 * (1 - st.k)));
        stream.setAttribute('height', f(top - 4)); stream.setAttribute('opacity', f(st.pour * 0.85));
        glow.setAttribute('opacity', f(st.glow * 0.8));
      });
    },
    emblem: `${EMB_HEAD}<path d="${A_BEAKER}" fill="#fff" opacity="0.5"/><clipPath id="ei"><path d="${A_IN}"/></clipPath><path d="${front(38, 92, lerp(BOT, BASE_LVL, REST.k))}" fill="#fff" clip-path="url(#ei)"/><path d="${A_BEAKER}" fill="none" stroke="#fff" stroke-width="4"/></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A stirrer is the block: white top, grey faces, a dial on the left face.
  // The beaker stands on it, a glass cylinder; the stirrer spins its vortex.
  const CY = 92, HALF = 22, T = 13;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const [N, E, S, W] = D_TOP;
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  const onLeft = (uu, v) => { const p = [lerp(W[0], S[0], uu), lerp(W[1], S[1], uu)]; return [p[0], p[1] + T * v]; };
  // The beaker: a cylinder of radius CR, from its foot FY up HB.
  const CR = 15, RX = CR * 1.2247, RY = CR * 0.7071, FY = CY - 1, HB = 50;
  const cyl = (y0, y1) => `M${f(64 - RX)} ${f(y1)}V${f(y0)}A${f(RX)} ${f(RY)} 0 0 0 ${f(64 + RX)} ${f(y0)}V${f(y1)}A${f(RX)} ${f(RY)} 0 0 0 ${f(64 - RX)} ${f(y1)}Z`;
  const D_LVL = [FY - 26, FY - 34];
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [24, 14, 80, 98],
    idea: 'A lab stirrer is the block: a white top, grey faces, an amber dial on the left face. A glass beaker stands on it with the liquid half ink, half clear. Hover and the second liquid pours in, the stirrer spins a vortex, the beaker waits, then snaps to ink. The pointer is the slider: high waits long, low snaps soon.',
    art(svg, u) {
      const top = poly(D_TOP);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 3.4)}
          ${lg(`${u}glass`, GLASS, 'x1="0" y1="0" x2="1" y2="0"')}${lg(`${u}clear`, CLEAR)}${lg(`${u}ink`, INK)}
          ${lg(`${u}top`, [[0, 'oklch(0.97 0.005 250)'], [1, 'oklch(0.86 0.008 250)']], 'x1="0" y1="0" x2="0.4" y2="1"')}
          <clipPath id="${u}in"><path d="${cyl(FY, FY - HB + 4)}"/></clipPath></defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 270)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="oklch(0.66 0.01 250)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="oklch(0.46 0.01 250)"/>
        <path d="${poly([onLeft(0.38, 0.25), onLeft(0.62, 0.25), onLeft(0.62, 0.78), onLeft(0.38, 0.78)])}" fill="oklch(0.78 0.13 70)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.7" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <ellipse cx="64" cy="${FY + 1}" rx="${f(RX + 2)}" ry="${f(RY + 1.4)}" fill="oklch(0.2 0.01 250)" opacity="0.35"/>
        <path d="${cyl(FY, FY - HB)}" fill="oklch(0.18 0.015 250)"/>
        <rect class="stream" x="60.5" y="0" width="6" height="40" rx="3" fill="${STREAM}" opacity="0"/>
        <g clip-path="url(#${u}in)">
          <path class="liq" fill="url(#${u}clear)"/>
          <path class="ink" fill="url(#${u}ink)"/>
          <ellipse class="glow" cx="64" cy="${FY - 14}" rx="${f(RX)}" ry="14" fill="${SHEEN}" opacity="0" filter="url(#${u}g)"/>
          <ellipse class="surf" cx="64" rx="${f(RX)}" ry="${f(RY)}" fill="${MARK}" opacity="0.3"/>
          <ellipse class="vortex" cx="64" rx="5" ry="2.4" fill="oklch(0.2 0.03 260)" opacity="0"/>
        </g>
        <path d="${cyl(FY, FY - HB)}" fill="url(#${u}glass)"/>
        <path d="${cyl(FY, FY - HB)}" fill="url(#${u}lit)"/>
        <ellipse cx="64" cy="${FY - HB}" rx="${f(RX)}" ry="${f(RY)}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
        <path d="${cyl(FY, FY - HB)}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
        ${[FY - 12, FY - 24, FY - 36].map((y, i) => `<rect x="${f(64 + RX - 9)}" y="${y}" width="${i === 1 ? 7 : 5}" height="2.4" rx="1.2" fill="${MARK}" opacity="0.7"/>`).join('')}`;
      const liq = svg.querySelector('.liq'), ink = svg.querySelector('.ink'), surf = svg.querySelector('.surf');
      const stream = svg.querySelector('.stream'), glow = svg.querySelector('.glow'), vortex = svg.querySelector('.vortex');
      return clockwork(st => {
        const y = lerp(D_LVL[0], D_LVL[1], st.lvl);
        liq.setAttribute('d', cyl(FY, y)); surf.setAttribute('cy', f(y));
        const fy = lerp(FY + RY + 2, y, st.k);
        // The ink's front is a level ellipse rising through the cylinder.
        ink.setAttribute('d', `M${f(64 - RX - 2)} ${f(fy)}A${f(RX + 2)} ${f(RY)} 0 0 0 ${f(64 + RX + 2)} ${f(fy)}V${f(FY + RY + 4)}H${f(64 - RX - 2)}Z`);
        vortex.setAttribute('cy', f(y + 1)); vortex.setAttribute('opacity', f(st.lvl * 0.6));
        stream.setAttribute('height', f(y - 2)); stream.setAttribute('opacity', f(st.pour * 0.85));
        glow.setAttribute('opacity', f(st.glow * 0.8));
      });
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/><path d="${cyl(FY, FY - HB)}" fill="#fff" opacity="0.5"/><path d="${cyl(FY, FY - 14)}" fill="#fff"/></svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Iodine clock';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-iodine';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `iodine-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
