<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 18</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<h1>Icon spike 18</h1>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  // A pointer control from three plain functions; focus plays a demo.
  const ctl = (aim, rest, demo, start = () => {}) => {
    let tl = null;
    return {
      enter(p) { start(); if (p) aim(p); else tl = demo(); },
      move(p) { if (p && !tl) aim(p); },
      leave() { tl?.kill(); tl = null; rest(); },
    };
  };
  // A repeat that runs while the pointer stays.
  const every = (dt, fn) => {
    let dc = null;
    const go = () => { fn(); dc = gsap.delayedCall(dt, go); };
    return { start() { if (!dc) go(); }, stop() { dc?.kill(); dc = null; } };
  };

  /* ================= Sonogram kit ================= */

  // The night-red phosphor, from dim floor to hot line.
  const RED = 'oklch(0.62 0.22 27)', HOTR = 'oklch(0.88 0.12 45)', SHADOW = 'oklch(0.07 0.01 260)';
  const phos = i => `oklch(${f(0.1 + 0.8 * i)} ${f(0.04 + 0.18 * Math.min(1, i * 1.6))} ${f(24 + 22 * i * i)})`;
  // One sea: a ship line and its harmonic, a gliding whale, a school's hiss.
  const spec = (x, t, n, calm = 1) => {
    const line = (c, w, a) => a * Math.exp(-(((x - c) / w) ** 2));
    const wx = 0.62 + 0.1 * Math.sin(t * 0.9), song = Math.max(0, Math.sin(t * 1.7));
    return Math.min(1, 0.1 + 0.12 * calm * n()
      + line(0.18, 0.016, 0.95) + line(0.36, 0.016, 0.55)
      + line(wx, 0.018, 0.95 * song)
      + line(0.86, 0.06, 0.55 * (1 - calm + calm * n())));
  };
  // The ear passes its beam and muffles the rest.
  const beam = (x, ex) => 0.38 + 0.62 * Math.exp(-(((x - ex) / 0.11) ** 2));
  // A seeded noise, so every tile starts the same.
  const rng = (s = 7) => () => ((s = (s * 16807) % 2147483647) / 2147483647);
  // One waterfall row: each bin keeps the peak of four samples.
  const rowAt = (ns, ex, t, n, calm) => Array.from({ length: ns }, (_, k) => {
    let m = 0;
    for (let q = 0; q < 4; q++) { const x = (k + q / 4 + 0.125) / ns; m = Math.max(m, spec(x, t, n, calm) * beam(x, ex)); }
    return m;
  });
  // A sonogram: rows of data, newest on top, with a clock and an ear.
  const sono = (G, NS, ex0, dt = 0.11, calm = 1) => {
    const n = rng(), s = { t: 0, ex: ex0, rows: [] };
    for (let g = 0; g < G; g++) { s.t += dt; s.rows.unshift(rowAt(NS, ex0, s.t, n, calm)); }
    s.step = () => { s.t += dt; s.rows.unshift(rowAt(NS, s.ex, s.t, n, calm)); s.rows.length = G; };
    return s;
  };
  // A raster in SVG: one rect per row, one gradient stop per bin.
  const raster = (defs, parent, id, x, y, w, h, G, NS) => {
    const stops = [];
    for (let g = 0; g < G; g++) {
      const gr = el('linearGradient', { id: `${id}r${g}`, x1: 0, x2: 1, y1: 0, y2: 0 }, defs);
      stops.push(Array.from({ length: NS }, (_, k) => el('stop', { offset: f(k / (NS - 1)) }, gr)));
      el('rect', { x, y: f(y + (g * h) / G), width: w, height: f(h / G + 0.15), fill: `url(#${id}r${g})` }, parent);
    }
    return rows => rows.forEach((r, g) => r.forEach((v, k) => stops[g][k].setAttribute('stop-color', phos(v))));
  };
  // Two ear brackets round x, from y0 to y1.
  const brackets = (x, d, y0, y1, l = 3) => `M${f(x - d + l)} ${y0}H${f(x - d)}V${y1}H${f(x - d + l)}M${f(x + d - l)} ${y0}H${f(x + d)}V${y1}H${f(x + d - l)}`;

  const DIRS = [];

  /* ================= A · Shaded object ================= */

  // A porthole screen: the live waterfall behind round glass.
  // The pointer aims the ear; new rows hear only that bearing.
  {
    const C = [62, 62], R = 44, G = 30, NS = 34, REST = 0.72;
    const X0 = C[0] - R, X1 = C[0] + R, Y0 = C[1] - R;
    const sx = e => X0 + e * (X1 - X0);
    // The ear shows as two notches on the rim, above its bearing.
    const notch = e => { const x = sx(e), y = C[1] - Math.sqrt(Math.max(0, R * R - (x - C[0]) ** 2)); return brackets(x, 7, f(y - 3), f(y + 9), 3.5); };
    DIRS.push({
      toy: 'sonar', l: 'A', name: 'Shaded object', box: [12, 12, 106, 106],
      art(svg, id) {
        svg.innerHTML = `
          <defs>
            <clipPath id="${id}c"><circle cx="${C[0]}" cy="${C[1]}" r="${R}"/></clipPath>
            <radialGradient id="${id}gl" cx="0.35" cy="0.25" r="0.7"><stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/></radialGradient>
            <linearGradient id="${id}bz" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.36 0.03 25)"/><stop offset="1" stop-color="oklch(0.16 0.02 25)"/></linearGradient>
          </defs>
          <circle cx="${C[0] + 6}" cy="${C[1] + 6}" r="${R + 6}" fill="${SHADOW}"/>
          <circle cx="${C[0]}" cy="${C[1]}" r="${R + 6}" fill="url(#${id}bz)"/>
          <g clip-path="url(#${id}c)">
            <rect x="${X0}" y="${Y0}" width="${2 * R}" height="${2 * R}" fill="oklch(0.08 0.02 25)"/>
            <g class="ras"></g>
            <circle cx="${C[0]}" cy="${C[1]}" r="${R}" fill="url(#${id}gl)"/>
          </g>
          <circle cx="${C[0]}" cy="${C[1]}" r="${R}" fill="none" stroke="${RED}" stroke-width="2"/>
          <path class="ear" fill="none" stroke="${HOTR}" stroke-width="2.6" stroke-linecap="square"/>`;
        const defs = el('defs', {}, svg), ras = svg.querySelector('.ras'), ear = svg.querySelector('.ear');
        // The menu icon has no ear notch; the waterfall alone shows the bearing.
        if (this.noEar) ear.remove();
        const s = sono(G, NS, REST), paintRas = raster(defs, ras, id, X0, Y0, 2 * R, 2 * R, G, NS);
        const paintEar = () => ear.setAttribute('d', notch(s.ex));
        const paint = () => { paintRas(s.rows); paintEar(); };
        paint();
        const loop = every(0.07, () => { s.step(); paint(); });
        const aim = p => gsap.to(s, { ex: clamp((p[0] - X0) / (X1 - X0), 0.1, 0.9), duration: 0.25, ease: 'power2.out', onUpdate: paintEar, overwrite: 'auto' });
        return ctl(aim,
          () => { loop.stop(); gsap.to(s, { ex: REST, duration: 0.6, onUpdate: paintEar, overwrite: 'auto' }); },
          () => { const d = { t: 0 }; return gsap.to(d, { t: 1, duration: 4, repeat: -1, ease: 'none', onUpdate: () => aim([sx(0.5 + 0.38 * Math.sin(d.t * TAU)), 60]) }); },
          () => loop.start());
      },
      emblem: emb(`
        <clipPath id="p"><circle cx="64" cy="64" r="43"/></clipPath>
        <g clip-path="url(#p)" fill="none" stroke="#fff" stroke-linecap="round">
          <path d="M38 14V114" stroke-width="7"/>
          <path d="M54 14V114" stroke-width="4.5" stroke-dasharray="7 7"/>
          <path d="M74 14C74 40 88 50 88 66S72 92 72 114" stroke-width="10"/>
        </g>
        <circle cx="64" cy="64" r="51" fill="none" stroke="#fff" stroke-width="7"/>
      `),
    });
  }

  /* ================= Current ================= */

  // The menu icon is A without the ear notch.
  DIRS.unshift({ ...DIRS.find(d => d.l === 'A'), l: 'Current', name: 'Menu icon', emblem: undefined, emblemUrl: '../shared/emblems/sonar.svg', noEar: true });

  /* ================= B · Stencil cut-out ================= */

  // A plate with the sonogram cut through it: a ship line, its harmonic, a whale's glide.
  // The ear cut slides along the top; the trace below it burns brightest.
  {
    const PLATE = 'M14 14H114V98L98 114H14Z';
    const T = [
      { d: 'M36 38V100', x: 36, w: 7 },
      { d: 'M54 38V100', x: 54, w: 5, dash: '7 7' },
      { d: 'M84 38C84 56 96 62 96 74S80 90 80 100', x: 88, w: 10 },
    ];
    const LX0 = 26, LX1 = 102, REST = 88;
    const earCut = x => brackets(x, 9, 20, 30, 4);
    DIRS.push({
      toy: 'sonar', l: 'B', name: 'Stencil cut-out', box: [14, 14, 106, 106],
      art(svg, id) {
        svg.innerHTML = `
          <defs><mask id="${id}m" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
            <path d="${PLATE}" fill="#fff"/>
            <g fill="none" stroke="#000" stroke-linecap="round">
              ${T.map(t => `<path d="${t.d}" stroke-width="${t.w}"${t.dash ? ` stroke-dasharray="${t.dash}"` : ''}/>`).join('')}
              <path d="M${LX0} 25H${LX1}" stroke-width="3"/>
              <path class="ec" d="${earCut(REST)}" stroke-width="4" stroke-linecap="square"/>
            </g>
          </mask></defs>
          <path d="${PLATE}" transform="translate(6 6)" fill="${SHADOW}"/>
          <path d="${PLATE}" fill="oklch(0.1 0.03 25)"/>
          <g fill="none" stroke-linecap="round">
            ${T.map(t => `<path class="gl" d="${t.d}" stroke-width="${t.w + 4}"/>`).join('')}
            ${T.map(t => `<path class="pl" d="${t.d}" pathLength="100" stroke="${HOTR}" stroke-width="${t.w + 4}" stroke-dasharray="10 190" stroke-dashoffset="10" opacity="0"/>`).join('')}
            <path d="M${LX0} 25H${LX1}" stroke="oklch(0.5 0.2 27)" stroke-width="5"/>
            <path class="eg" d="${earCut(REST)}" stroke="${HOTR}" stroke-width="7" stroke-linecap="square"/>
          </g>
          <path d="${PLATE}" fill="oklch(0.23 0.03 25)" mask="url(#${id}m)"/>
          <path d="M14 14H114" stroke="oklch(0.36 0.035 25)" stroke-width="1.6" mask="url(#${id}m)"/>`;
        const gl = [...svg.querySelectorAll('.gl')], pl = [...svg.querySelectorAll('.pl')], ec = svg.querySelector('.ec'), eg = svg.querySelector('.eg');
        const st = { x: REST };
        const paint = () => {
          ec.setAttribute('d', earCut(st.x)); eg.setAttribute('d', earCut(st.x));
          T.forEach((t, i) => gl[i].setAttribute('stroke', phos(0.25 + 0.75 * Math.exp(-(((st.x - t.x) / 12) ** 2)))));
        };
        paint();
        // Echo pulses run down each trace, strongest under the ear.
        const run = () => T.forEach((t, i) => {
          const k = Math.exp(-(((st.x - t.x) / 12) ** 2));
          gsap.fromTo(pl[i], { strokeDashoffset: 10, opacity: 0.25 + 0.75 * k }, { strokeDashoffset: -100, duration: 0.9, ease: 'none', delay: i * 0.12 });
        });
        const loop = every(1, run);
        const aim = p => gsap.to(st, { x: clamp(p[0], LX0 + 10, LX1 - 10), duration: 0.25, ease: 'power2.out', onUpdate: paint, overwrite: 'auto' });
        return ctl(aim,
          () => { loop.stop(); gsap.to(st, { x: REST, duration: 0.6, ease: 'power2.inOut', onUpdate: paint, overwrite: 'auto' }); },
          () => { const d = { t: 0 }; return gsap.to(d, { t: 1, duration: 3.6, repeat: -1, ease: 'none', onUpdate: () => aim([64 + 34 * Math.sin(d.t * TAU), 60]) }); },
          () => loop.start());
      },
      emblem: emb(`
        <path d="${PLATE}" fill="#fff"/>
        <g fill="none" stroke="#000" stroke-linecap="round">
          ${T.map(t => `<path d="${t.d}" stroke-width="${t.w + 1}"${t.dash ? ` stroke-dasharray="${t.dash}"` : ''}/>`).join('\n')}
          <path d="M${LX0} 25H${LX1}" stroke-width="3.5"/>
          <path d="${earCut(REST)}" stroke-width="4.5" stroke-linecap="square"/>
        </g>
      `),
    });
  }

  /* ================= C · Single-weight line ================= */

  // Sing: the pointer is a pitch, and the sonogram writes it down.
  // Two ship lines hold still beside the song.
  {
    const N = 26, YT = 22, YB = 108, X0 = 22, X1 = 106;
    const yOf = k => YT + (k * (YB - YT)) / (N - 1);
    // The rest pose is a whale call: a rise, a fall, a hook.
    const CALL = Array.from({ length: N }, (_, k) => { const u = k / (N - 1); return 76 + 14 * Math.sin(u * 5.2) - 8 * u; });
    const smooth = P => {
      let d = `M${f(P[0][0])} ${f(P[0][1])}`;
      for (let i = 0; i < P.length - 1; i++) {
        const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
        d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
      }
      return d;
    };
    const song = xs => smooth(xs.map((x, k) => [x, yOf(k)]));
    const AXIS = `M${X0} 14H${X1}` + [0, 1, 2, 3, 4].map(i => `M${f(X0 + (i * (X1 - X0)) / 4)} 14V18`).join('');
    DIRS.push({
      toy: 'sonar', l: 'C', name: 'Single-weight line', box: [20, 12, 88, 98],
      art(svg) {
        svg.innerHTML = `<g fill="none" stroke="${RED}" stroke-width="3" stroke-linecap="round">
          <path d="${AXIS}"/>
          <path d="M32 ${YT}V${YB}"/>
          <path d="M48 ${YT}V${YB}" stroke-dasharray="5 6"/>
          <path class="sg" stroke="${HOTR}" d="${song(CALL)}"/></g>
          <circle class="hd" cx="${f(CALL[0])}" cy="${YT}" r="4.2" fill="${HOTR}"/>`;
        const sg = svg.querySelector('.sg'), hd = svg.querySelector('.hd');
        const xs = CALL.slice(), st = { x: CALL[0] };
        const paint = () => { sg.setAttribute('d', song(xs)); hd.setAttribute('cx', f(xs[0])); };
        // Each tick the song scrolls down and the head takes the pointer.
        const loop = every(0.06, () => { xs.unshift(st.x); xs.length = N; paint(); });
        const aim = p => gsap.to(st, { x: clamp(p[0], X0 + 4, X1 - 4), duration: 0.12, overwrite: 'auto' });
        return ctl(aim,
          () => { loop.stop(); const from = xs.slice(), m = { u: 0 }; gsap.to(m, { u: 1, duration: 0.9, ease: 'power2.inOut', onUpdate() { xs.forEach((_, k) => { xs[k] = from[k] + (CALL[k] - from[k]) * m.u; }); paint(); } }); st.x = CALL[0]; },
          () => { const d = { t: 0 }; return gsap.to(d, { t: 1, duration: 2.6, repeat: -1, ease: 'none', onUpdate: () => aim([66 + 30 * Math.sin(d.t * TAU) + 8 * Math.sin(d.t * TAU * 3), 60]) }); },
          () => loop.start());
      },
      emblem: emb(`
        <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
          <path d="${AXIS}"/>
          <path d="M32 ${YT}V${YB}"/>
          <path d="M48 ${YT}V${YB}" stroke-width="5" stroke-dasharray="7 8"/>
          <path d="${song(CALL)}" stroke-width="10"/>
        </g>
        <circle cx="${f(CALL[0])}" cy="${YT}" r="9" fill="#fff"/>
      `),
    });
  }

  /* ================= D · Isometric block ================= */

  // A 3D waterfall: each row is a ridge on the slab, newest at the back.
  // The ridges roll forward; the ear lifts the bearing it hears.
  {
    const O = [64, 70], S = 30, H = 12, c30 = 0.866, G = 7, NS = 24, LIFT = 24, REST = 0.62;
    const P = (i, j) => [O[0] + (i - j) * c30 * S, O[1] + (i + j) * 0.5 * S];
    const TOP = [P(-1, -1), P(1, -1), P(1, 1), P(-1, 1)];
    const L = [P(-1, 1), P(1, 1), [P(1, 1)[0], P(1, 1)[1] + H], [P(-1, 1)[0], P(-1, 1)[1] + H]];
    const R = [P(1, 1), P(1, -1), [P(1, -1)[0], P(1, -1)[1] + H], [P(1, 1)[0], P(1, 1)[1] + H]];
    const SIL = [P(-1, -1), P(1, -1), R[2], R[3], L[3], P(-1, 1)];
    // Frequency runs along i; time runs along j.
    const jOf = g => -0.9 + (1.8 * g) / (G - 1);
    const ridge = (r, g) => {
      const j = jOf(g), pts = r.map((v, k) => { const [x, y] = P(-0.92 + (1.84 * (k + 0.5)) / NS, j); return [x, y - v * LIFT]; });
      const [a] = [P(-0.92, j)], b = P(0.92, j);
      return `M${f(a[0])} ${f(a[1])}` + pts.map(([x, y]) => `L${f(x)} ${f(y)}`).join('') + `L${f(b[0])} ${f(b[1])}Z`;
    };
    DIRS.push({
      toy: 'sonar', l: 'D', name: 'Isometric block', box: [12, 22, 104, 98],
      art(svg) {
        svg.innerHTML = `
          <path d="${poly(SIL)}" transform="translate(6 6)" fill="${SHADOW}"/>
          <path d="${poly(TOP)}" fill="oklch(0.15 0.035 25)"/>
          <path d="${poly(L)}" fill="oklch(0.27 0.06 25)"/>
          <path d="${poly(R)}" fill="oklch(0.17 0.04 25)"/>
          <g class="rd"></g>`;
        const rd = svg.querySelector('.rd');
        // The back ridge draws first, so the front ones hide it.
        const paths = Array.from({ length: G }, () => el('path', { fill: 'oklch(0.13 0.03 25)', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, rd));
        const s = sono(G, NS, REST, 0.24, 0.1);
        const paint = () => s.rows.forEach((r, g) => {
          paths[g].setAttribute('d', ridge(r, g));
          paths[g].setAttribute('stroke', phos(0.35 + 0.65 * (g / (G - 1)) ** 0.7 * Math.max(...r)));
        });
        paint();
        const loop = every(0.12, () => { s.step(); paint(); });
        // The pointer's place along the front edge picks the bearing.
        const aim = p => gsap.to(s, { ex: clamp((p[0] - 16) / 96, 0.05, 0.95), duration: 0.25, ease: 'power2.out', overwrite: 'auto' });
        return ctl(aim,
          () => { loop.stop(); gsap.to(s, { ex: REST, duration: 0.5, overwrite: 'auto' }); },
          () => { const d = { t: 0 }; return gsap.to(d, { t: 1, duration: 4, repeat: -1, ease: 'none', onUpdate: () => aim([64 + 40 * Math.sin(d.t * TAU), 60]) }); },
          () => loop.start());
      },
      emblem: (() => {
        const s = sono(G, NS, REST, 0.24, 0);
        return emb(`
          <path d="${poly(SIL)}" fill="#fff"/>
          <path d="${poly(TOP)}" fill="none" stroke="#000" stroke-width="2"/>
          <path d="M${f(P(1, 1)[0])} ${f(P(1, 1)[1])}V${f(P(1, 1)[1] + H)}" stroke="#000" stroke-width="2"/>
          ${[0, 3, 6].map(g => `<path d="${ridge(s.rows[g], g)}" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round"/>`).join('\n')}
        `);
      })(),
    });
  }

  /* ================= E · Abstract mark ================= */

  // A chunky sonogram: five rows of four pills.
  // The pointer's column hears; the rows fall while it stays.
  {
    const C = 4, G = 5, PW = 19, PH = 12, GX = 5, GY = 6, X0 = 20, Y0 = 24, REST = 0.62;
    const pill = (c, g) => [X0 + c * (PW + GX), Y0 + g * (PH + GY)];
    DIRS.push({
      toy: 'sonar', l: 'E', name: 'Abstract mark', box: [X0, Y0, C * (PW + GX) - GX, G * (PH + GY) - GY],
      art(svg) {
        svg.innerHTML = Array.from({ length: G * C }, (_, i) => { const [x, y] = pill(i % C, (i / C) | 0); return `<rect class="p" x="${x}" y="${y}" width="${PW}" height="${PH}" rx="${PH / 2}"/>`; }).join('');
        const pills = [...svg.querySelectorAll('.p')], s = sono(G, C, REST, 0.3);
        const paint = () => s.rows.forEach((r, g) => r.forEach((v, c) => pills[g * C + c].setAttribute('fill', phos(Math.min(1, v * 1.15)))));
        paint();
        const loop = every(0.16, () => { s.step(); paint(); });
        const aim = p => { s.ex = clamp((p[0] - X0) / (C * (PW + GX) - GX), 0.05, 0.95); };
        return ctl(aim,
          () => { loop.stop(); s.ex = REST; },
          () => { const d = { t: 0 }; return gsap.to(d, { t: 1, duration: 3, repeat: -1, ease: 'none', onUpdate: () => aim([64 + 40 * Math.sin(d.t * TAU), 60]) }); },
          () => loop.start());
      },
      emblem: (() => {
        const s = sono(G, C, REST, 0.3);
        const lum = v => (v > 0.55 ? '#fff' : v > 0.3 ? '#8c8c8c' : '#3a3a3a');
        // The mark is scaled up to fill the emblem square.
        return emb(`
          <g transform="translate(64 64) scale(1.25) translate(-64 -64)">
            ${s.rows.map((r, g) => r.map((v, c) => { const [x, y] = pill(c, g); return `<rect x="${x}" y="${y}" width="${PW}" height="${PH}" rx="${PH / 2}" fill="${lum(v)}"/>`; }).join('')).join('\n')}
          </g>
        `);
      })(),
    });
  }

  /* ================= Gallery ================= */

  const NAMES = { sonar: 'Sonar' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || (D.emblem ? `spike/emblems/${file}.svg` : '');
      if (D.emblem) window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const c = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => c.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => c.leave());
        tile.addEventListener('focus', () => c.enter(null));
        tile.addEventListener('blur', () => c.leave());
      });
    }
  }
})();
</script>
</body>
</html>
