<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Googly eyes 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Googly eyes 1</h1>
<p class="lede">Googly eyes, round 1. No pick yet. A: three domed googly eyes as the toy draws them, one with a yellow rim, one with a teal lid; the pupils roll to the pointer and bounce off the rims. D: the same eyes lying on a block of the toy's plum-to-teal board.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The menu tile's ids take the tile prefix, so three copies can live.
  const ids = (m, u) => m.replace(/id="([^"]+)"/g, `id="${u}$1"`).replace(/url\(#([^)]+)\)/g, `url(#${u}$1)`).replace(/href="#([^"]+)"/g, `href="#${u}$1"`);

  const DIRS = [];

  // The toy's tokens: warm white plastic, a near-black pupil, coloured rims and lids.
  const WHITE = [[0, 'oklch(0.99 0.004 80)'], [0.7, 'oklch(0.95 0.008 330)'], [1, 'oklch(0.8 0.02 300)']];
  const PUPIL = [[0, 'oklch(0.3 0.01 270)'], [1, 'oklch(0.08 0.01 270)']];
  const RIM = { yellow: [[0, 'oklch(0.92 0.16 98)'], [1, 'oklch(0.66 0.15 80)']], teal: [[0, 'oklch(0.85 0.12 195)'], [1, 'oklch(0.55 0.1 200)']] };
  const circ = (cx, cy, r) => `M${f(cx - r)} ${f(cy)}A${f(r)} ${f(r)} 0 1 0 ${f(cx + r)} ${f(cy)}A${f(r)} ${f(r)} 0 1 0 ${f(cx - r)} ${f(cy)}Z`;

  /* ================= Current ================= */

  // The menu icon today: three flat eyes whose pupils rattle.
  const CUR = `<g id="eye-set">
      <circle cx="44" cy="58" r="20" fill="oklch(0.97 0.005 260)"/>
      <circle class="pupil" cx="48" cy="62" r="10" fill="oklch(0.16 0.01 260)"/>
      <circle cx="86" cy="52" r="16" fill="oklch(0.97 0.005 260)"/>
      <circle class="pupil" cx="89" cy="56" r="8" fill="oklch(0.16 0.01 260)"/>
      <circle cx="70" cy="92" r="12" fill="oklch(0.97 0.005 260)"/>
      <circle class="pupil" cx="72" cy="95" r="6" fill="oklch(0.16 0.01 260)"/>
    </g>`;
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    box: 'bbox',
    art(svg, u) {
      svg.innerHTML = ids(CUR, u);
      const pupils = [...svg.querySelectorAll('.pupil')], reach = [8, 6, 4];
      let tl = null;
      return {
        enter() {
          tl = gsap.timeline({ repeat: -1, repeatRefresh: true })
            .to(pupils, { x: i => gsap.utils.random(-reach[i], reach[i]), y: i => gsap.utils.random(-reach[i], reach[i]), duration: 0.35, ease: 'back.out(3)', stagger: 0.06 });
        },
        move() {},
        leave() { tl?.kill(); gsap.to(pupils, { x: 0, y: 0, duration: 0.3, ease: 'back.out(2)', overwrite: true }); },
      };
    },
  });

  /* ================= The eyes ================= */

  // Eyes in their plane: centre, radius, rim colour, lid colour.
  // The pupil slides free inside the white, as in the toy.
  const EYES = [
    { c: [96, 48], R: 22 },
    { c: [52, 66], R: 34, rim: 'yellow' },
    { c: [93, 95], R: 17, lid: 'teal' },
  ];
  const eyeDefs = u => `${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}s`, 1.1)}
    ${rg(`${u}white`, WHITE, 'cx="0.42" cy="0.38" r="0.62"')}${rg(`${u}pupil`, PUPIL, 'cx="0.36" cy="0.3" r="0.7"')}
    ${lg(`${u}yellow`, RIM.yellow, 'x1="0" y1="0" x2="0.6" y2="1"')}${lg(`${u}teal`, RIM.teal)}
    ${lg(`${u}base`, [[0, 'oklch(0.9 0.01 300)'], [1, 'oklch(0.62 0.03 300)']])}`;
  // One eye: base or coloured rim, the white, the pupil, the dome's light.
  // flat: true leaves out the screen-space glints (D adds them itself).
  const eye = (u, e, i, flat = false) => {
    const [cx, cy] = e.c, W = e.rim ? e.R - 6 : e.R - 1.6, r = W * 0.52;
    const lid = e.lid ? `<g class="lid" data-i="${i}"><path d="M${f(cx - e.R)} ${f(cy)}A${e.R} ${e.R} 0 0 1 ${f(cx + e.R)} ${f(cy)}Q${cx} ${f(cy + e.R * 0.14)} ${f(cx - e.R)} ${f(cy)}Z" fill="url(#${u}${e.lid})"/><path d="M${f(cx - e.R)} ${f(cy)}A${e.R} ${e.R} 0 0 1 ${f(cx + e.R)} ${f(cy)}Q${cx} ${f(cy + e.R * 0.14)} ${f(cx - e.R)} ${f(cy)}Z" fill="url(#${u}lit)"/><path d="M${f(cx - e.R + 2)} ${f(cy + 0.6)}Q${cx} ${f(cy + e.R * 0.16)} ${f(cx + e.R - 2)} ${f(cy + 0.6)}" fill="none" stroke="oklch(0.95 0.06 190)" stroke-width="2" stroke-linecap="round" opacity="0.8"/></g>` : '';
    return `<g class="eye" data-i="${i}">
      <path d="${circ(cx, cy, e.R)}" fill="url(#${u}${e.rim || 'base'})"/>
      <path d="${circ(cx, cy, W)}" fill="url(#${u}white)"/>
      <g class="pupil"><path d="${circ(cx, cy, r)}" fill="url(#${u}pupil)"/><circle cx="${f(cx - r * 0.32)}" cy="${f(cy - r * 0.38)}" r="${f(r * 0.16)}" fill="#fff" opacity="0.9"/></g>
      <path d="${circ(cx, cy, e.R)}" fill="url(#${u}lit)"/>
      ${flat ? '' : `<ellipse cx="${f(cx - e.R * 0.36)}" cy="${f(cy - e.R * 0.44)}" rx="${f(e.R * 0.34)}" ry="${f(e.R * 0.17)}" transform="rotate(-30 ${f(cx - e.R * 0.36)} ${f(cy - e.R * 0.44)})" fill="#fff" opacity="0.7"/>`}
      ${lid}
      <path d="${circ(cx, cy, e.R - 1)}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
    </g>`;
  };
  const reachOf = e => (e.rim ? e.R - 6 : e.R - 1.6) * 0.48 - 1;

  // The shared motion: each pupil rolls to the side nearest the pointer and bounces off the rim.
  // Enter shakes the set; the lidded eye blinks. Leave drops each pupil back to the bottom.
  // toPlane maps a viewBox point to the eyes' plane; offset maps a plane offset to a transform.
  const run = (svg, toPlane = p => p, offset = (x, y) => `translate(${f(x)} ${f(y)})`) => {
    const pupils = [...svg.querySelectorAll('.pupil')], lids = [...svg.querySelectorAll('.lid')];
    const st = { live: false, p: null, last: 0, s: EYES.map(() => ({ x: 0, y: 0, vx: 0, vy: 0 })) };
    const rest = e => [reachOf(e) * 0.15, reachOf(e) * 0.85];
    st.s.forEach((s, i) => { [s.x, s.y] = rest(EYES[i]); pupils[i].setAttribute('transform', offset(s.x, s.y)); });
    const step = time => {
      const dt = Math.min(0.05, time - (st.last || time));
      st.last = time;
      let moving = false;
      EYES.forEach((e, i) => {
        const s = st.s[i], R = reachOf(e);
        let [tx, ty] = rest(e);
        if (st.p) { const dx = st.p[0] - e.c[0], dy = st.p[1] - e.c[1], d = Math.hypot(dx, dy) || 1; tx = (dx / d) * R; ty = (dy / d) * R; }
        s.vx += ((tx - s.x) * 70 - s.vx * 7) * dt;
        s.vy += ((ty - s.y) * 70 - s.vy * 7) * dt;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        // The rim bounces the pupil back in.
        const d = Math.hypot(s.x, s.y);
        if (d > R) { const nx = s.x / d, ny = s.y / d, dot = s.vx * nx + s.vy * ny; s.x = nx * R; s.y = ny * R; if (dot > 0) { s.vx -= 1.6 * dot * nx; s.vy -= 1.6 * dot * ny; } }
        pupils[i].setAttribute('transform', offset(s.x, s.y));
        if (Math.abs(s.vx) + Math.abs(s.vy) > 0.4 || Math.hypot(tx - s.x, ty - s.y) > 0.2) moving = true;
      });
      if (!st.live && !moving) { st.last = 0; loop.stop(); }
    };
    const loop = clock(step);
    // A shake throws each pupil off at random.
    const shake = () => st.s.forEach(s => { const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 60; s.vx += Math.cos(a) * v; s.vy += Math.sin(a) * v; });
    const blink = () => lids.forEach(l => gsap.fromTo(l, { scaleY: 1 }, { scaleY: 1.9, svgOrigin: `${EYES[l.dataset.i].c[0]} ${EYES[l.dataset.i].c[1] - EYES[l.dataset.i].R}`, duration: 0.12, yoyo: true, repeat: 1, ease: 'power2.in' }));
    return {
      enter(p) { st.live = true; st.p = p && toPlane(p); shake(); blink(); loop.start(); },
      move(p) { st.p = p && toPlane(p); },
      leave() { st.live = false; st.p = null; loop.start(); },
    };
  };
  const eyeEmblem = e => {
    const [cx, cy] = e.c, W = e.rim ? e.R - 6 : e.R - 1.6, r = W * 0.52, R = reachOf(e);
    return `<circle cx="${cx}" cy="${cy}" r="${e.R}" fill="${e.rim ? '#9a9a9a' : '#fff'}"/><circle cx="${cx}" cy="${cy}" r="${f(e.rim ? W : e.R - 3)}" fill="#fff"/>`
      + `<circle cx="${f(cx + R * 0.15)}" cy="${f(cy + R * 0.85)}" r="${f(r)}" fill="#000"/>`
      + (e.lid ? `<path d="M${f(cx - e.R)} ${f(cy)}A${e.R} ${e.R} 0 0 1 ${f(cx + e.R)} ${f(cy)}Z" fill="#8a8a8a"/>` : '');
  };

  /* ================= A: Shaded object ================= */

  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [17, 25, 102, 88],
    idea: 'Three googly eyes as the toy draws them: domed plastic, a warm white, a loose black pupil with a glint, a gloss streak on each dome. The big one has a yellow rim, the small one a teal lid. The pupils sit at the bottom. The pointer pulls each pupil to its nearest side; they roll and bounce off the rims. Enter shakes the set and the teal lid blinks.',
    art(svg, u) {
      svg.innerHTML = `<defs>${eyeDefs(u)}</defs>
        ${EYES.map(e => `<ellipse cx="${e.c[0] + 2}" cy="${e.c[1] + e.R * 0.9}" rx="${f(e.R * 0.85)}" ry="${f(e.R * 0.22)}" fill="oklch(0.05 0.01 300)" opacity="0.55" filter="url(#${u}b)"/>`).join('')}
        ${EYES.map((e, i) => eye(u, e, i)).join('')}`;
      return run(svg);
    },
    emblem: `${EMB_HEAD}${EYES.map(e => `<circle cx="${e.c[0]}" cy="${e.c[1]}" r="${e.R + 2.5}" fill="#000"/>${eyeEmblem(e)}`).join('')}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A block of the toy's board, plum to teal; the eyes lie on its top.
  const CY = 68, HX = 31, HY = 31, T = 13;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // The plane: the A layout moved to the block's middle, then laid flat.
  const PX = -68, PY = -68, K = 0.6;
  const M = `matrix(${0.866 * K} ${0.5 * K} ${-0.866 * K} ${0.5 * K} ${f(64 + (PX - PY) * 0.866 * K - 64 + 64)} ${f(CY + (PX + PY) * 0.5 * K)})`;
  const fromPlane = (x, y) => iso((x + PX) * K, (y + PY) * K);
  const toPlane = p => { const a = (p[0] - 64) / 0.866, b = (p[1] - CY) / 0.5; return [(a + b) / 2 / K - PX, (b - a) / 2 / K - PY]; };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [10, 35, 108, 82],
    idea: 'A block of the toy\'s board at 30 degrees: a plum top that fades to teal, a mid left face, a dark right face, a rim on the top edges. The three eyes lie on the top as domes, each on a thin white edge, a gloss glint on each. The pointer pulls the pupils across the top toward it; enter shakes them and the teal lid blinks.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${eyeDefs(u)}
          ${lg(`${u}top`, [[0, 'oklch(0.42 0.13 340)'], [1, 'oklch(0.38 0.07 220)']], 'x1="0" y1="0" x2="1" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.32 0.1 340)'], [1, 'oklch(0.24 0.08 335)']])}
          ${lg(`${u}R`, [[0, 'oklch(0.24 0.05 230)'], [1, 'oklch(0.16 0.04 235)']])}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 300)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="url(#${u}rim)" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        ${EYES.map((e, i) => `<g transform="translate(0 2.6)"><path d="${circ(e.c[0], e.c[1], e.R)}" transform="${M}" fill="oklch(0.62 0.03 300)"/></g>
          <g transform="${M}">${eye(u, e, i, true)}</g>
          ${(([gx, gy]) => `<ellipse cx="${f(gx)}" cy="${f(gy)}" rx="${f(e.R * 0.3)}" ry="${f(e.R * 0.12)}" fill="#fff" opacity="0.75"/>`)(fromPlane(e.c[0] - e.R * 0.3, e.c[1] - e.R * 0.45))}`).join('')}`;
      return run(svg, toPlane);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#6e6e6e"/><g transform="${M}">${EYES.map(e => eyeEmblem(e)).join('')}</g></svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = "Googly eyes";
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-eyes';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `eyes-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      // A menu tile with no data-box fits its drawn bounds, as the menu does.
      const bb = D.box === "bbox" && svg.getBBox();
      fitIcon(svg, bb ? [bb.x, bb.y, bb.width, bb.height] : D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
