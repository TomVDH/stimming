<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Plasma globe 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --accent: linear-gradient(100deg, oklch(0.76 0.22 335), oklch(0.74 0.17 275));
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: white on black, the toy's accent, the flash box and the dark glass. */
.emb { display: flex; flex-wrap: wrap; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.ink { background: #000; color: #fff; }
.acc { background: #000; }
.acc i { background: var(--accent); }
.bar { background: #000; color: #fff; }
.bar i { width: 28px; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Plasma globe 1</h1>
<p class="lede">Plasma globe, round 1: a violet glass ball on a black turned base, live filaments from a white-hot core. A: free on the ground. D: the base is a lacquer block.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const stops = s => s.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('');
  const lg = (id, s, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops(s)}</linearGradient>`;
  const rg = (id, s, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops(s)}</radialGradient>`;
  // A radial gradient in the art's own units.
  const rgU = (id, s, cx, cy, r) => rg(id, s, `gradientUnits="userSpaceOnUse" cx="${cx}" cy="${cy}" r="${r}"`);
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill) => `<path d="${d}" fill="url(#${u}${fill})"/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };
  const spline = (pts, move = true) => {
    let d = move ? `M${f(pts[0][0])} ${f(pts[0][1])}` : `L${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d;
  };
  const { sin, cos, atan2, hypot, PI } = Math;
  // A fixed hash: the same filaments on every load.
  const hash = i => { const x = sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  // A tapered ribbon along a point list, from width w0 to w1.
  const ribbon = (pts, w0, w1) => {
    const n = pts.length, L = [], R = [];
    for (let j = 0; j < n; j++) {
      const a = pts[Math.max(0, j - 1)], b = pts[Math.min(n - 1, j + 1)];
      const tx = b[0] - a[0], ty = b[1] - a[1], l = hypot(tx, ty) || 1;
      const w = lerp(w0, w1, j / (n - 1)) / 2, nx = -ty / l * w, ny = tx / l * w;
      L.push([pts[j][0] + nx, pts[j][1] + ny]); R.push([pts[j][0] - nx, pts[j][1] - ny]);
    }
    // The tip is round: a curve past the last point.
    const e = pts[n - 1], p = pts[n - 2], el2 = hypot(e[0] - p[0], e[1] - p[1]) || 1;
    const tip = [e[0] + (e[0] - p[0]) / el2 * w1, e[1] + (e[1] - p[1]) / el2 * w1];
    // Straight joins make the rope jagged, as lightning is.
    const line = (P, move) => (move ? 'M' : 'L') + P.map(q => `${f(q[0])} ${f(q[1])}`).join('L');
    return line(L, true) + `Q${f(tip[0])} ${f(tip[1])} ${f(R[n - 1][0])} ${f(R[n - 1][1])}` + line(R.reverse(), false) + 'Z';
  };

  // The toy's tokens: violet glass, pink filaments with blue tips, black lacquer.
  const GLASS = [[0, 'oklch(0.52 0.2 315)'], [0.42, 'oklch(0.33 0.16 304)'], [0.84, 'oklch(0.19 0.09 292)'], [0.95, 'oklch(0.3 0.14 298)'], [1, 'oklch(0.44 0.17 302)']];
  const FIL = [[0, 'oklch(0.99 0.03 320)'], [0.32, 'oklch(0.9 0.12 325)'], [0.7, 'oklch(0.78 0.18 310)'], [1, 'oklch(0.74 0.16 275)']];
  const FIL_GLOW = 'oklch(0.7 0.24 318)', TIP = 'oklch(0.8 0.15 280)', TOUCH = 'oklch(0.95 0.08 300)';
  const CORE = [[0, '#fff'], [0.55, 'oklch(0.96 0.06 320)'], [1, 'oklch(0.82 0.15 320)']];
  const HALO = [[0, 'oklch(0.85 0.2 320)', 0.9], [0.4, 'oklch(0.65 0.24 315)', 0.45], [1, 'oklch(0.5 0.22 305)', 0]];
  const AURA = [[0, 'oklch(0.55 0.22 310)', 0.42], [0.6, 'oklch(0.45 0.2 300)', 0.14], [1, 'oklch(0.4 0.18 295)', 0]];
  // Black lacquer: two specular bands from the room, a violet bounce on the right.
  const LACQUER = [[0, 'oklch(0.1 0.015 295)'], [0.14, 'oklch(0.24 0.04 300)'], [0.24, 'oklch(0.66 0.05 305)'], [0.32, 'oklch(0.2 0.03 298)'], [0.7, 'oklch(0.09 0.015 290)'], [0.88, 'oklch(0.3 0.09 305)'], [1, 'oklch(0.1 0.02 295)']];
  const STEM = [[0, 'oklch(0.7 0.16 315)'], [1, 'oklch(0.24 0.08 300)']];
  // Filament rest angles in degrees; the stem keeps the bottom clear.
  const ANG = [-160, -121, -86, -52, -16, 24, 148];
  const EMB_ANG = [-140, -62, 18, 160];
  const R_IN = 7, R_OUT = 37.5, STEPS = 9, FORK = 5;
  const nz = (j, s, ph) => 0.55 * sin(j * 2.3 + s + ph * 1.3) + 0.45 * sin(j * 5.7 + 2 * s - ph * 2.1);
  // One filament as a point list: the main rope and a fork.
  const filament = (a, s, m, ph) => {
    const main = [], fork = [];
    for (let j = 0; j <= STEPS; j++) {
      const t = j / STEPS, r = lerp(R_IN, R_OUT, t), env = sin(PI * t) ** 0.7;
      const o = 2.6 * env * lerp(nz(j, s, 0), nz(j, s, ph), m);
      main.push([cos(a) * r - sin(a) * o, sin(a) * r + cos(a) * o]);
    }
    const side = hash(s * 9) > 0.5 ? 1 : -1, b = a + side * 0.42;
    fork.push(main[FORK]);
    for (let k = 1; k <= 3; k++) {
      const t = k / 3, r = lerp(lerp(R_IN, R_OUT, FORK / STEPS), R_OUT - 0.5, t), ang = lerp(a, b, t ** 0.7);
      const o = 2.2 * sin(PI * t) * lerp(nz(k + 11, s, 0), nz(k + 11, s, ph), m);
      fork.push([cos(ang) * r - sin(ang) * o, sin(ang) * r + cos(ang) * o]);
    }
    return { main, fork };
  };
  // The glass's reflection: a bold crescent at the top left.
  const CRESCENT = 'M-32.9 12A35 35 0 0 1 12-32.9A44 44 0 0 0-32.9 12Z';
  // The base in the art's units: a collar, then a flared foot.
  const COLLAR_TOP = 35, COLLAR_BOT = 43, COLLAR_RX = 23, COLLAR_RY = 5;
  const COLLAR_FRONT = `M${-COLLAR_RX} ${COLLAR_TOP}A${COLLAR_RX} ${COLLAR_RY} 0 0 0 ${COLLAR_RX} ${COLLAR_TOP}L${COLLAR_RX} ${COLLAR_BOT}A${COLLAR_RX} ${COLLAR_RY} 0 0 1 ${-COLLAR_RX} ${COLLAR_BOT}Z`;
  // As in the toy: a short neck, a round shoulder, near-straight sides.
  const FOOT = 'M-20.5 42C-21 46-29.5 46-29.5 52L-30.5 60A30.5 6 0 0 0 30.5 60L29.5 52C29.5 46 21 46 20.5 42Z';

  // The globe's markup in its own units: the centre is 0 0, the glass radius is 40.
  // g: cx, cy, s (scale), wk (filament width factor), foot (draw the foot).
  const globeMarkup = (u, g) => `
    <g transform="translate(${g.cx} ${g.cy}) scale(${g.s})">
      ${g.foot ? body(FOOT, u, 'lacq') : ''}
      <ellipse cx="0" cy="${COLLAR_TOP}" rx="${COLLAR_RX}" ry="${COLLAR_RY}" fill="url(#${u}cup)"/>
      <circle r="40" fill="url(#${u}glass)"/>
      <rect x="-2.2" y="2" width="4.4" height="36" rx="2" fill="url(#${u}stem)"/>
      <g class="glow" filter="url(#${u}gb)" fill="${FIL_GLOW}" stroke="${FIL_GLOW}" stroke-width="2.4" stroke-linejoin="round"></g>
      <g class="tips" fill="${TIP}" filter="url(#${u}tb)"></g>
      <g class="fil" fill="url(#${u}fil)"></g>
      <circle r="14" fill="url(#${u}halo)" class="halo"/>
      <circle r="6.6" fill="url(#${u}core)"/>
      <circle r="40" fill="url(#${u}lit)"/>
      <path d="${CRESCENT}" fill="url(#${u}cres)"/>
      <circle r="39" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
      ${body(COLLAR_FRONT, u, 'lacq')}
      <path d="M${-COLLAR_RX} ${COLLAR_TOP}A${COLLAR_RX} ${COLLAR_RY} 0 0 0 ${COLLAR_RX} ${COLLAR_TOP}" fill="none" stroke="oklch(0.78 0.16 315)" stroke-opacity="0.75" stroke-width="2"/>
    </g>`;
  const globeDefs = u => `${light(u)}${blur(`${u}gb`, 1.8)}${blur(`${u}tb`, 1.6)}${blur(`${u}ab`, 3)}
    ${rgU(`${u}glass`, GLASS, -6, -8, 50)}
    ${rgU(`${u}fil`, FIL, 0, 0, 40)}
    ${rg(`${u}core`, CORE, 'cx="0.38" cy="0.34" r="0.7"')}
    ${rg(`${u}halo`, HALO)}
    ${rg(`${u}aura`, AURA)}
    ${rg(`${u}cup`, [[0, 'oklch(0.72 0.2 315)'], [1, 'oklch(0.3 0.12 300)']], 'cx="0.5" cy="0.3" r="0.7"')}
    ${lg(`${u}lacq`, LACQUER, 'x1="0" y1="0" x2="1" y2="0"')}
    ${lg(`${u}stem`, STEM)}
    ${lg(`${u}cres`, [[0, '#fff', 0.05], [0.45, '#fff', 0.34], [1, '#fff', 0.04]], 'x1="0" y1="1" x2="1" y2="0"')}`;

  // The live globe: filaments wander; the pointer pulls one to the glass.
  const globe = (svg, g) => {
    const $q = s => svg.querySelector(s);
    const glowG = $q('.glow'), filG = $q('.fil'), tipG = $q('.tips'), halo = $q('.halo');
    const fils = ANG.map((deg, i) => ({
      rest: (deg * PI) / 180, a: (deg * PI) / 180, s: hash(i + 3) * 6, w: 1, wTo: 1,
      glow: el('path', {}, glowG), glowF: el('path', {}, glowG), body: el('path', {}, filG), fork: el('path', {}, filG),
      tip: el('circle', { r: 2.6 }, tipG),
    }));
    const st = { ph: 0, m: 0, mTo: 0, live: false, p: null, near: -1, t: 0, fl: 1 };
    const draw = () => {
      for (const F of fils) {
        const { main, fork } = filament(F.a, F.s, st.m, st.ph + F.s);
        const w = F.w * g.wk;
        const dm = ribbon(main, 4.4 * w, 1.9 * w), df = ribbon(fork, 2.8 * w, 1.6 * w);
        F.body.setAttribute('d', dm); F.fork.setAttribute('d', df);
        F.glow.setAttribute('d', dm); F.glowF.setAttribute('d', df);
        const e = main[STEPS];
        F.tip.setAttribute('cx', f(e[0])); F.tip.setAttribute('cy', f(e[1]));
        F.tip.setAttribute('r', f(2.6 + 4.4 * (F.w - 1)));
        F.tip.setAttribute('fill', F.w > 1.2 ? TOUCH : TIP);
      }
      glowG.setAttribute('opacity', f(0.75 * st.fl));
      halo.setAttribute('r', f(14 + 3 * st.m * st.fl));
    };
    const loop = clock(time => {
      const dt = Math.min(0.1, time - (st.t || time));
      st.t = time;
      st.m += (st.mTo - st.m) * 0.08;
      st.ph += dt * 2.4 * st.m;
      // The pointer's angle pulls the nearest filament; its neighbours lean after it.
      let pa = 0, touch = 0;
      if (st.live && st.p) {
        pa = atan2(st.p[1], st.p[0]);
        touch = clamp((hypot(st.p[0], st.p[1]) - 6) / 26);
      }
      const diff = F => { let d = pa - F.rest; while (d > PI) d -= 2 * PI; while (d < -PI) d += 2 * PI; return d; };
      let near = -1, best = 9;
      if (touch > 0) fils.forEach((F, i) => { const d = Math.abs(diff(F)); if (d < best) { best = d; near = i; } });
      fils.forEach((F, i) => {
        const d = diff(F);
        const to = i === near ? F.rest + d * touch : F.rest + d * touch * 0.28 * clamp(1 - Math.abs(d) / 1.2);
        F.a += (to - F.a) * 0.16;
        F.wTo = i === near ? 1 + 0.9 * touch : 1;
        F.w += (F.wTo - F.w) * 0.14;
      });
      // The glow flickers while the globe is live.
      st.fl = 1 + 0.18 * st.m * sin(time * 23) * sin(time * 7.3);
      draw();
      // The clock stops once the globe rests.
      const still = fils.every(F => Math.abs(F.a - F.rest) < 0.002 && Math.abs(F.w - 1) < 0.002);
      if (!st.live && st.m < 0.01 && still) {
        st.m = 0; st.fl = 1; fils.forEach(F => { F.a = F.rest; F.w = 1; }); draw(); loop.stop();
      }
    });
    draw();
    const toLocal = p => p && [(p[0] - g.cx) / g.s, (p[1] - g.cy) / g.s];
    return {
      enter(p) { st.live = true; st.mTo = 1; st.p = toLocal(p); loop.start(); },
      move(p) { if (p) st.p = toLocal(p); },
      leave() { st.live = false; st.mTo = 0; st.p = null; loop.start(); },
    };
  };

  // The emblem's globe: a white ball and base, the filaments and a core ring cut out.
  const emblemGlobe = (g, extra = '') => {
    // Four bold ropes read at 28 px; the forks drop out.
    const fil = EMB_ANG.map((deg, i) => ribbon(filament((deg * PI) / 180, hash(i + 3) * 6, 0, 0).main.slice(1), 9, 6.5)).join('');
    return `<g transform="translate(${g.cx} ${g.cy}) scale(${g.s})">
      ${g.foot ? `<path d="${FOOT}" fill="#fff"/>` : ''}
      <circle r="40" fill="#fff"/>
      ${extra}
      <path d="${fil}" fill="#000"/>
      <circle r="13" fill="#000"/><circle r="7.4" fill="#fff"/>
      <path d="${COLLAR_FRONT}" fill="#fff"/>
      <path d="M${-COLLAR_RX - 2} ${COLLAR_TOP}A${COLLAR_RX + 2} ${COLLAR_RY + 1} 0 0 0 ${COLLAR_RX + 2} ${COLLAR_TOP}" fill="none" stroke="#000" stroke-width="3.4"/>
      ${g.foot ? `<path d="M${-COLLAR_RX} ${COLLAR_BOT}A${COLLAR_RX} ${COLLAR_RY} 0 0 0 ${COLLAR_RX} ${COLLAR_BOT}" fill="none" stroke="#000" stroke-width="3.4"/>` : ''}
    </g>`;
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover loop.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}<radialGradient id="${u}g" cx="0.5" cy="0.5" r="0.55"><stop offset="0" style="stop-color: oklch(0.46 0.17 305)"/><stop offset="1" style="stop-color: oklch(0.18 0.06 285)"/></radialGradient></defs>
        <circle cx="64" cy="64" r="46" fill="url(#${u}g)"/>
        <g class="arcs" fill="none" stroke="oklch(0.86 0.14 330)" stroke-width="2.5" stroke-linecap="round">
          <path d="M64 64C58 50 70 40 62 22"/>
          <path d="M64 64C78 60 86 70 104 66"/>
          <path d="M64 64C60 78 48 84 40 100"/>
          <path d="M64 64C52 62 40 50 26 52"/>
        </g>
        <circle cx="64" cy="64" r="8" fill="oklch(0.94 0.08 320)"/>
        <circle cx="64" cy="64" r="46" fill="url(#${u}lit)"/>
        <circle cx="64" cy="64" r="45" fill="none" stroke="url(#${u}rim)" stroke-width="1.5"/>`;
      const arcs = svg.querySelector('.arcs'), arcPaths = [...arcs.children];
      let tl = null;
      return {
        enter() {
          tl?.kill();
          // Filaments turn about the core and flicker.
          tl = gsap.timeline({ repeat: -1 })
            .to(arcs, { rotation: 360, svgOrigin: '64 64', duration: 4, ease: 'none' })
            .to(arcPaths, { opacity: 0.3, duration: 0.1, yoyo: true, repeat: 39, stagger: { each: 0.07, from: 'random' } }, 0);
        },
        move() {},
        leave() {
          tl?.kill(); tl = null;
          gsap.to(arcs, { rotation: 0, svgOrigin: '64 64', duration: 0.4, overwrite: true });
          gsap.to(arcPaths, { opacity: 1, duration: 0.2, overwrite: true });
        },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // The globe free on the ground, on its black turned base.
  const A = { cx: 64, cy: 49, s: 1, wk: 1, foot: true };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    idea: 'The plasma globe as a live model. Violet glass on a black lacquer base with two specular bands; the collar glows violet from the ball. Seven filaments run from the white-hot core to the glass, each with a fork, pink at the root and blue at the tip, over a soft glow. Live, they wander and the glow flickers; the pointer pulls the nearest filament to it, thicker, with a bright spot on the glass, and its neighbours lean after it.',
    art(svg, u) {
      svg.innerHTML = `<defs>${globeDefs(u)}</defs>
        <ellipse cx="64" cy="${A.cy + 66}" rx="34" ry="5" fill="oklch(0.05 0.01 290)" opacity="0.55" filter="url(#${u}ab)"/>
        <circle cx="64" cy="${A.cy}" r="50" fill="url(#${u}aura)"/>
        <g class="fit">${globeMarkup(u, A)}</g>`;
      return globe(svg, A);
    },
    emblem: emblemGlobe(A),
  });

  /* ================= D: Isometric block ================= */

  // The base is the block: black lacquer, the globe's violet light pooled on its top.
  const CY = 84, HALF = 25, T = 15;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const [N, E, S, W] = D_TOP;
  const down = p => [p[0], p[1] + T];
  const D = { cx: 64, cy: 48, s: 0.78, wk: 1.18, foot: false };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    idea: 'The base is the block: black lacquer, its top lit violet where the globe pools its light, a rim on the top edges. The live globe sits in its collar on top. The pointer pulls a filament to the glass, as in A.',
    art(svg, u) {
      svg.innerHTML = `<defs>${globeDefs(u)}${blur(`${u}s`, 2.6)}
          ${lg(`${u}top`, [[0, 'oklch(0.36 0.07 300)'], [1, 'oklch(0.16 0.04 292)']], 'x1="0.3" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}left`, [[0, 'oklch(0.26 0.04 298)'], [0.3, 'oklch(0.44 0.06 305)'], [0.42, 'oklch(0.22 0.035 298)'], [1, 'oklch(0.17 0.03 295)']], 'x1="0" y1="0" x2="1" y2="0"')}
          ${lg(`${u}right`, [[0, 'oklch(0.13 0.02 295)'], [0.75, 'oklch(0.09 0.015 290)'], [1, 'oklch(0.2 0.06 305)']], 'x1="0" y1="0" x2="1" y2="0"')}
          ${rg(`${u}pool`, [[0, 'oklch(0.7 0.2 315)', 0.75], [0.5, 'oklch(0.5 0.2 305)', 0.3], [1, 'oklch(0.4 0.15 300)', 0]])}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 290)" opacity="0.5" filter="url(#${u}s)" transform="translate(0 4)"/>
        <circle cx="64" cy="${D.cy}" r="${40 * D.s + 9}" fill="url(#${u}aura)"/>
        <g class="fit">
          <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}left)"/>
          <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}right)"/>
          <path d="${poly(D_TOP)}" fill="url(#${u}top)"/>
          <ellipse cx="64" cy="${CY}" rx="40" ry="20" fill="url(#${u}pool)"/>
          <path d="${poly(D_TOP)}" fill="url(#${u}lit)"/>
          <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.22" stroke-width="2" fill="none" stroke-linejoin="round"/>
          <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="oklch(0.85 0.1 315)" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-linejoin="round"/>
          ${globeMarkup(u, D)}
        </g>`;
      return globe(svg, D);
    },
    emblem: `<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/>${emblemGlobe(D)}`,
  });

  /* ================= Gallery ================= */
  const ID = 'plasma', NAME = 'Plasma globe';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitBox = svg => { const g = svg.querySelector('.fit'); if (!g) return null; const b = g.getBBox(); return [b.x, b.y, b.width, b.height]; };
  const viewOf = box => {
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    return `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`;
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = `row-${ID}`;
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const Dd of DIRS) {
    const file = `${ID}-${Dd.l.toLowerCase()}`;
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${Dd.l === 'Current' ? `<b>${Dd.l}</b>` : `<b>${Dd.l}</b><span>· ${Dd.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${Dd.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${Dd.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${Dd.l}, 64"></div></div>
      ${Dd.idea ? `<p class="idea">${Dd.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    let view = null;
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = Dd.art(svg, `u${++uid}`);
      // The frame is measured once, on the drawing at rest.
      const box = view ? null : fitBox(svg);
      if (box) view = viewOf(box);
      if (view) svg.setAttribute('viewBox', view);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
    if (!Dd.emblem) continue;
    // The emblem takes the icon's frame; it rides in the page as a data URI.
    const svgText = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${view}" width="128" height="128">${Dd.emblem}</svg>`;
    window.EMBLEMS[file] = svgText;
    const url = `'data:image/svg+xml,${encodeURIComponent(svgText)}'`;
    const emb = document.createElement('div');
    emb.className = 'emb';
    emb.innerHTML = ['ink', 'acc', 'bar', 'flash', 'glass'].map(k => `<div class="${k}"><i style="--emblem: url(${url})"></i></div>`).join('');
    card.querySelector('.icons').after(emb);
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
