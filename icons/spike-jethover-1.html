<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Jet hover 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Jet hover 1</h1>
<p class="lede">Jet hover, round 1. No pick yet; A goes on the menu until Tom picks. A: a dark jet side on, hovering on two lit plumes over a hot pool. D: the pad is the block; the jet hovers over it, its plumes on the pad.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };




  // The toy's tokens: a dark slate jet, a lit plume, a hot pool at blue hour.
  const HULL = [[0, 'oklch(0.56 0.025 250)'], [1, 'oklch(0.32 0.025 255)']];
  const HULL_D = [[0, 'oklch(0.4 0.025 255)'], [1, 'oklch(0.24 0.02 260)']];
  const GLASS = [[0, 'oklch(0.42 0.06 230)'], [1, 'oklch(0.16 0.03 250)']];
  const PLUME = [[0, 'oklch(0.98 0.06 90)'], [0.18, 'oklch(0.85 0.16 65)'], [0.5, 'oklch(0.66 0.2 20)', 0.9], [0.8, 'oklch(0.55 0.2 300)', 0.65], [1, 'oklch(0.5 0.18 290)', 0]];
  const POOL = [[0, 'oklch(0.95 0.09 80)'], [0.3, 'oklch(0.78 0.16 55)', 0.85], [1, 'oklch(0.5 0.16 35)', 0]];
  const DIA = 'oklch(0.99 0.05 85)', MOUTH = 'oklch(0.93 0.12 75)', DUCT = 'oklch(0.22 0.015 260)';
  const PUFF = 'oklch(0.8 0.07 60)';

  // The state both icons share: a throttle that opens on hover, a drift toward the pointer.
  // At rest the jet holds still on a low plume.
  const REST = 0.3;
  const run = draw => {
    const st = { k: REST, to: REST, dx: 0, tx: 0, t: 0, live: false };
    const step = time => {
      st.t = time;
      // The engine spools up fast and runs down slower.
      st.k += (st.to - st.k) * (st.to > st.k ? 0.12 : 0.06);
      st.dx += (st.tx - st.dx) * 0.08;
      draw(st);
      if (!st.live && Math.abs(st.k - REST) < 0.005 && Math.abs(st.dx) < 0.05) {
        Object.assign(st, { k: REST, dx: 0, t: 0 });
        draw(st);
        loop.stop();
      }
    };
    const loop = clock(step);
    draw(st);
    return {
      enter(p) { st.live = true; st.to = 1; loop.start(); if (p) this.move(p); },
      // The jet drifts a little toward the pointer.
      move(p) { if (p) st.tx = clamp((p[0] - 64) / 64, -1, 1); },
      leave() { st.live = false; st.to = REST; st.tx = 0; loop.start(); },
    };
  };
  // A flicker that runs only while the clock runs.
  const flick = (st, i) => (st.t ? 1 + 0.06 * Math.sin(st.t * 31 + i * 2.3) * Math.sin(st.t * 17 + i) : 1);

  const DIRS = [];

  /* ================= Current ================= */

  // Jet hover is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // The jet side on, nose to the right, two nozzles bent straight down.
  const A_FUSE = 'M118 50Q106 43 92 42L56 41Q34 40 18 42L12 44L12 54Q38 59 68 58Q98 57 118 50Z';
  const A_CANOPY = 'M99 44Q93 33 81 34.5Q71 36 65 42Z';
  const A_FIN = 'M15 43L31 43L24 18L16 18Z', A_FIN2 = 'M27 43L40 43L33 22L26 22Z';
  const A_WING = 'M86 55L34 55L20 64L48 64Z';
  const A_INTAKE = 'M84 47L93 47L91 54L84 54Z';
  const A_NOZ = [42, 55], A_MOUTH = 64;
  const A_GROUND = 112;
  // One plume from a mouth: it widens down to the ground and grows with the throttle.
  const aPlume = (x, k) => {
    const b = A_GROUND - 3 + 2 * k, w0 = 3.6, w1 = 5 + 3.5 * k;
    return `M${f(x - w0)} ${A_MOUTH}L${f(x + w0)} ${A_MOUTH}L${f(x + w1)} ${f(b)}L${f(x - w1)} ${f(b)}Z`;
  };
  // Shock diamonds down the jet, each dimmer than the one above.
  const aDia = (x, k, i) => {
    const S = 7.5 + 2.5 * k, y = A_MOUTH + S * (i + 0.75), h = 2.6 - i * 0.3, w = (2.3 - i * 0.35) * (0.8 + 0.3 * k);
    return poly([[x, y - h], [x + w, y], [x, y + h], [x - w, y]]);
  };
  const aJet = u => `${body(A_FIN2, u, 'hulld')}${body(A_WING, u, 'hulld')}
      ${A_NOZ.map(x => `<path d="M${x - 4.6} 54H${x + 4.6}V${A_MOUTH}H${x - 4.6}Z" fill="${DUCT}"/>`).join('')}
      ${body(A_FUSE, u, 'hull')}${body(A_FIN, u, 'hull')}
      <path d="${A_INTAKE}" fill="${DUCT}"/>
      ${body(A_CANOPY, u, 'glass')}`;
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [10, 16, 110, 100],
    idea: 'A dark slate jet side on, nose to the right, hovering at blue hour on two plumes from nozzles bent straight down. Each plume runs from a white-hot mouth through orange to violet, with shock diamonds down its core, onto a hot pool on the ground where spray puffs out. At rest the jet holds on a low plume. The pointer opens the throttle: the plumes lengthen and whiten, the diamonds stand out, the pool spreads, the spray throws out wider, and the jet lifts and drifts toward the pointer. Leave and it settles.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}g`, 1.2)}
          ${lg(`${u}hull`, HULL)}${lg(`${u}hulld`, HULL_D)}${lg(`${u}glass`, GLASS)}${lg(`${u}plume`, PLUME)}
          ${rg(`${u}pool`, POOL)}</defs>
        <ellipse class="pool" cx="48" cy="${A_GROUND - 1}" rx="30" ry="6" fill="url(#${u}pool)"/>
        <g class="puffs">${[-1, -1, 1, 1].map(() => `<circle r="5" fill="${PUFF}" opacity="0.4" filter="url(#${u}b)"/>`).join('')}</g>
        <g class="jet">
          <g class="plumes">${A_NOZ.map(() => `<path fill="url(#${u}plume)"/>`).join('')}</g>
          <g class="dias" filter="url(#${u}g)">${A_NOZ.map(() => [0, 1, 2].map(() => `<path fill="${DIA}"/>`).join('')).join('')}</g>
          ${aJet(u)}
          ${A_NOZ.map(x => `<ellipse cx="${x}" cy="${A_MOUTH}" rx="4.4" ry="1.8" fill="${MOUTH}"/>`).join('')}
        </g>`;
      const jet = svg.querySelector('.jet'), plumes = [...svg.querySelectorAll('.plumes path')], dias = [...svg.querySelectorAll('.dias path')];
      const pool = svg.querySelector('.pool'), puffs = [...svg.querySelectorAll('.puffs circle')];
      return run(st => {
        const k = st.k;
        // The jet lifts with the throttle; the plumes stay on the ground.
        const lift = -4 * (k - REST), dx = st.dx * 5;
        jet.setAttribute('transform', `translate(${f(dx)} ${f(lift)}) rotate(${f(st.dx * 2.5)} 64 50)`);
        A_NOZ.forEach((x, i) => {
          plumes[i].setAttribute('d', aPlume(x, k * flick(st, i)));
          for (let j = 0; j < 3; j++) {
            dias[i * 3 + j].setAttribute('d', aDia(x, k, j));
            dias[i * 3 + j].setAttribute('opacity', f(clamp((k - 0.1) * 1.4) * (1 - j * 0.25)));
          }
        });
        pool.setAttribute('cx', f(48 + dx));
        pool.setAttribute('rx', f(24 + 16 * k));
        pool.setAttribute('opacity', f(0.65 + 0.35 * k));
        // Spray puffs roll out from the pool on both sides.
        puffs.forEach((c, i) => {
          const side = i < 2 ? -1 : 1, ph = st.t ? (st.t * 0.9 + i * 0.37) % 1 : 0.5 + (i % 2) * 0.3;
          c.setAttribute('cx', f(48 + dx + side * (16 + (10 + 14 * k) * ph)));
          c.setAttribute('cy', f(A_GROUND - 3 - 5 * ph));
          c.setAttribute('r', f(3 + 5 * ph * (0.6 + 0.6 * k)));
          c.setAttribute('opacity', f((0.25 + 0.4 * k) * (1 - ph * 0.7)));
        });
      });
    },
    // The emblem: the jet, its two plumes and the pool, as one bold silhouette.
    emblem: `${EMB_HEAD}<path d="${A_FIN2}${A_WING}${A_FUSE}${A_FIN}${A_CANOPY}" fill="#fff"/>${A_NOZ.map(x => `<path d="M${x - 4.6} 54H${x + 4.6}V${A_MOUTH - 1}H${x - 4.6}Z" fill="#fff"/><path d="${aPlume(x, 0.62)}" transform="translate(0 2)" fill="#fff"/>`).join('')}<ellipse cx="48" cy="${A_GROUND - 1}" rx="30" ry="5" fill="#9a9a9a"/></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The pad is the block: concrete on top, a hot pool where the plumes land.
  const CY = 70, HX = 21, HY = 21, T = 16, H = 36;
  const iso = (gx, gy, z = 0) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5 - z];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // The planform, nose along +gx, in pad units; it hovers H over the pad.
  const PLAN = [[30, 0], [18, 3.5], [6, 5], [-12, 20], [-17, 20], [-16, 6], [-20, 5], [-26, 12], [-29, 12], [-28, 4], [-28, -4], [-29, -12], [-26, -12], [-20, -5], [-16, -6], [-17, -20], [-12, -20], [6, -5], [18, -3.5]];
  const D_NOZ = [[-11, 3.2], [-11, -3.2]];
  const dPlan = (dx, z) => poly(PLAN.map(([x, y]) => iso(x + dx, y - dx, z)));
  const dCanopy = (dx, z) => poly([[22, 0], [17, 2.4], [10, 2.6], [7, 0], [10, -2.6], [17, -2.4]].map(([x, y]) => iso(x + dx, y - dx, z + 2)));
  // A fin stands up from the planform, its top swept back.
  const dFin = (gy, dx, z) => poly([iso(-15 + dx, gy - dx, z), iso(-26 + dx, gy - dx, z), iso(-29 + dx, gy - dx, z + 9), iso(-23 + dx, gy - dx, z + 9)]);
  const dPlume = (n, dx, z, k) => {
    const top = iso(n[0] + dx, n[1] - dx, z), bot = iso(n[0] + dx * 0.4, n[1] - dx * 0.4, 0), w0 = 3, w1 = 4.5 + 2.5 * k;
    return `M${f(top[0] - w0)} ${f(top[1])}L${f(top[0] + w0)} ${f(top[1])}L${f(bot[0] + w1)} ${f(bot[1])}L${f(bot[0] - w1)} ${f(bot[1])}Z`;
  };
  const dDia = (n, dx, z, k, i) => {
    const top = iso(n[0] + dx, n[1] - dx, z), S2 = 6 + 2 * k, y = top[1] + S2 * (i + 0.8), h = 2.2 - i * 0.3, w = 1.9 - i * 0.3;
    return poly([[top[0], y - h], [top[0] + w, y], [top[0], y + h], [top[0] - w, y]]);
  };
  // The pool on the pad top: an ellipse squashed into the plane.
  const dPool = (dx, k) => { const c = iso(-11 + dx * 0.4, -dx * 0.4); return { cx: c[0], cy: c[1], rx: 12 + 8 * k, ry: (12 + 8 * k) * 0.55 }; };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [22, 4, 86, 104],
    idea: 'The pad is the block: damp concrete on top with a hot pool, dark faces, a rim on the top edges. The jet hovers over it as a dark slate planform with two fins and a canopy, its two plumes straight down onto the pool, diamonds in their cores. The pointer opens the throttle: the jet lifts, the plumes whiten and the pool spreads; it drifts toward the pointer and settles when it leaves.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 1.1)}
          ${lg(`${u}pad`, [[0, 'oklch(0.52 0.012 250)'], [1, 'oklch(0.4 0.014 255)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}sideL`, [[0, 'oklch(0.36 0.012 255)'], [1, 'oklch(0.27 0.012 260)']])}
          ${lg(`${u}sideR`, [[0, 'oklch(0.28 0.012 255)'], [1, 'oklch(0.2 0.012 260)']])}
          ${lg(`${u}hull`, HULL, 'x1="0" y1="0" x2="1" y2="1"')}${lg(`${u}hulld`, HULL_D)}${lg(`${u}glass`, GLASS)}${lg(`${u}plume`, PLUME)}
          ${rg(`${u}pool`, POOL)}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}sideL)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}sideR)"/>
        <path d="${top}" fill="url(#${u}pad)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <ellipse class="pool" fill="url(#${u}pool)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g class="plumes">${D_NOZ.map(() => `<path fill="url(#${u}plume)"/>`).join('')}</g>
        <g class="dias" filter="url(#${u}g)">${D_NOZ.map(() => [0, 1, 2].map(() => `<path fill="${DIA}"/>`).join('')).join('')}</g>
        <g class="jet"><path class="fin1"/><path class="plan"/><path class="fin2"/><path class="can"/></g>`;
      const pool = svg.querySelector('.pool'), plumes = [...svg.querySelectorAll('.plumes path')], dias = [...svg.querySelectorAll('.dias path')];
      const jet = svg.querySelector('.jet');
      return run(st => {
        const k = st.k, z = H + 5 * (k - REST), dx = st.dx * 3;
        const p = dPool(dx, k);
        pool.setAttribute('cx', f(p.cx)); pool.setAttribute('cy', f(p.cy));
        pool.setAttribute('rx', f(p.rx)); pool.setAttribute('ry', f(p.ry));
        pool.setAttribute('opacity', f(0.7 + 0.3 * k));
        D_NOZ.forEach((n, i) => {
          plumes[i].setAttribute('d', dPlume(n, dx, z, k * flick(st, i)));
          for (let j = 0; j < 3; j++) {
            dias[i * 3 + j].setAttribute('d', dDia(n, dx, z, k, j));
            dias[i * 3 + j].setAttribute('opacity', f(clamp((k - 0.1) * 1.4) * (1 - j * 0.25)));
          }
        });
        jet.innerHTML = `${body(dFin(4, dx, z), u, 'hulld')}${body(dPlan(dx, z), u, 'hull')}${body(dFin(-4, dx, z), u, 'hulld')}${body(dCanopy(dx, z), u, 'glass')}`;
      });
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/>${D_NOZ.map(n => `<path d="${dPlume(n, 0, H, 0.6)}" fill="#fff"/>`).join('')}<path d="${dFin(4, 0, H)}${dPlan(0, H)}${dFin(-4, 0, H)}" fill="#fff"/></svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = 'Jet hover';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-jethover';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `jethover-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
