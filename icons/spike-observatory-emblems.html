<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Emblem spike: Observatory</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu and intro tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --logo: 136px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 clamp(24px, 4vw, 40px); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.wrap { max-width: 100%; overflow-x: auto; }
#sheet { display: grid; grid-template-columns: 130px repeat(2, 200px) repeat(2, 72px); gap: 12px 16px; align-items: center; width: fit-content; padding: 16px 20px; background: var(--bg); }
.hd { color: var(--muted); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; text-align: center; }
.lab b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
.lab span { color: var(--muted); font-size: 12px; }
.rule { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 6px 0; }
.cell { display: grid; place-items: center; }
/* The emblem is a one-colour luminance mask, as in the intro. */
.cell i { display: block; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
/* Intro size: the logo on the dark, then in the flash box. */
.dark { width: 200px; height: 200px; background: var(--intro-bg); color: #fff; outline: 1px solid var(--line); }
.dark i, .flash i { width: var(--logo); }
.flash { width: 200px; height: 200px; }
.flash > div { display: grid; place-items: center; padding: calc(var(--logo) * 0.16); background: #fff; color: var(--intro-bg); }
/* Small size: 36 on the dark, and the bar's 40 px monogram. */
.sdark { width: 72px; height: 72px; background: var(--intro-bg); color: #fff; outline: 1px solid var(--line); }
.sdark i { width: 36px; }
.mono { width: 72px; height: 72px; }
.mono > div { display: grid; place-items: center; width: 40px; height: 40px; background: #fff; color: var(--intro-bg); }
.mono i { width: 90%; }
</style>
</head>
<body>
<h1>Emblem spike: Observatory</h1>
<div class="wrap">
  <div id="sheet">
    <span></span><span class="hd">Intro, dark</span><span class="hd">Intro, flash</span><span class="hd">36, dark</span><span class="hd">40, mono</span>
  </div>
</div>
<script>
(() => {
  // Three candidates first, then three shipped emblems for scale and weight.
  const ROWS = [
    ['a', 'Dome and beam', 'spike/emblems/observatory2-a.svg'],
    ['b', 'Objective glass', 'spike/emblems/observatory2-b.svg'],
    ['c', 'Three-quarter', 'spike/emblems/observatory2-c.svg'],
    null,
    ['Prism', 'Shared', '../shared/emblems/prism.svg'],
    ['Heat putty', 'Shared', '../shared/emblems/putty.svg'],
    ['Fire', 'Shared', '../shared/emblems/fire.svg'],
  ];
  const sheet = document.getElementById('sheet');
  for (const r of ROWS) {
    if (!r) { sheet.insertAdjacentHTML('beforeend', '<div class="rule"></div>'); continue; }
    const [l, name, src] = r, em = `style="--emblem: url(${src})"`;
    sheet.insertAdjacentHTML('beforeend', `<div class="lab"><b>${l}</b><span>${name}</span></div>
      <div class="cell dark"><i ${em}></i></div>
      <div class="cell flash"><div><i ${em}></i></div></div>
      <div class="cell sdark"><i ${em}></i></div>
      <div class="cell mono"><div><i ${em}></i></div></div>`);
  }
})();
</script>
</body>
</html>
