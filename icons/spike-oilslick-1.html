<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Oil slick 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Oil slick 1</h1>
<p class="lede">Oil slick, round 1. A: a puddle under a film of oil; the dark middle follows the pointer and a quick move swirls the bands. D: the same puddle on a slab of street asphalt.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const TAU = Math.PI * 2;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } }, once: tick };
  };
  // A closed Catmull-Rom curve through the points.
  const smoothD = P => {
    const n = P.length;
    let d = `M${f(P[0][0])} ${f(P[0][1])}`;
    for (let i = 0; i < n; i++) {
      const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d + 'Z';
  };

  // The film's bands, outside in, after the toy's accent: magenta, cyan, lime.
  // The middle reads dark, as a bare film does on the toy.
  const BANDS = [
    { r: 1, c: 'oklch(0.62 0.21 325)' },
    { r: 0.8, c: 'oklch(0.56 0.18 275)' },
    { r: 0.62, c: 'oklch(0.8 0.13 205)' },
    { r: 0.45, c: 'oklch(0.88 0.17 115)' },
    { r: 0.3, c: 'oklch(0.8 0.15 65)' },
    { r: 0.16, c: 'oklch(0.22 0.04 285)' },
  ];
  // A wobbly loop on the ground; ph turns the wobble, which reads as a swirl.
  const groundRing = (cx, cy, r, wob, ph, n = 40) => Array.from({ length: n }, (_, i) => {
    const a = (i / n) * TAU, k = 1 + wob * Math.sin(3 * a + ph) + wob * 0.6 * Math.sin(2 * a - ph * 0.7);
    return [cx + r * k * Math.cos(a), cy + r * k * Math.sin(a)];
  });
  // The puddle's edge on the ground: a few soft lobes, fixed.
  const puddleRing = (cx, cy, R, n = 48) => Array.from({ length: n }, (_, i) => {
    const a = (i / n) * TAU, k = 1 + 0.05 * Math.sin(2 * a + 0.6) + 0.05 * Math.sin(3 * a + 2.1) + 0.03 * Math.sin(5 * a + 1);
    return [cx + R * k * Math.cos(a), cy + R * k * Math.sin(a)];
  });
  // The film: the core follows the pointer; inner bands follow it more.
  // spin turns each band's wobble; inner bands turn faster.
  const filmPaths = (proj, base, core, R, spin) => BANDS.map((b, k) => {
    const t = lerp(0.12, 1, k / (BANDS.length - 1));
    const cx = lerp(base[0], core[0], t), cy = lerp(base[1], core[1], t);
    return smoothD(groundRing(cx, cy, R * b.r, 0.07, spin * (1 + k * 0.35) + k * 0.9).map(proj));
  });
  // One film state per tile: core, spin and their springs.
  // A pointer moves the core; a fast move spins the bands.
  const filmRig = (paths, proj, unproj, base, R, reach) => {
    const st = { x: base[0], y: base[1], spin: 0, kick: 0, last: null, live: false };
    const draw = time => {
      st.spin += st.kick + (st.live ? 0.02 : 0);
      st.kick *= 0.88;
      const d = filmPaths(proj, base, [st.x, st.y], R, st.spin + (st.live ? Math.sin(time * 1.3) * 0.15 : 0));
      paths.forEach((p, i) => p.setAttribute('d', d[i]));
      if (!st.live && Math.abs(st.kick) < 0.002) loop.stop();
    };
    const loop = clock(draw);
    draw(0);
    // The core stays inside the puddle.
    const aim = p => {
      const g = unproj(p), dx = g[0] - base[0], dy = g[1] - base[1], m = Math.hypot(dx, dy), s = m > reach ? reach / m : 1;
      gsap.to(st, { x: base[0] + dx * s, y: base[1] + dy * s, duration: 0.35, ease: 'power2.out', overwrite: 'auto' });
    };
    let demo = null;
    return {
      enter(p) {
        st.live = true; loop.start();
        // With no pointer, the core rolls round the puddle in a loop.
        if (!p) {
          const r = reach * 0.8;
          demo = gsap.timeline({ repeat: -1 })
            .to(st, { x: base[0] + r, y: base[1] - r * 0.6, duration: 0.8, ease: 'sine.inOut' })
            .to(st, { x: base[0] - r, y: base[1] + r * 0.5, duration: 1, ease: 'sine.inOut' })
            .to(st, { x: base[0], y: base[1], duration: 0.7, ease: 'sine.inOut' });
          return;
        }
        st.last = p; aim(p);
      },
      move(p) {
        if (!p || demo) return;
        // A fast move spins the film in the move's direction.
        if (st.last) st.kick = clamp(st.kick + ((p[0] - st.last[0]) - (p[1] - st.last[1])) * 0.012, -0.25, 0.25);
        st.last = p; aim(p);
      },
      leave() {
        demo?.kill(); demo = null; st.last = null;
        gsap.to(st, { x: base[0], y: base[1], duration: 0.7, ease: 'power2.inOut', overwrite: 'auto', onComplete: () => { st.live = false; } });
      },
    };
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  const CUR_DASH = ['30 4 66 0', '58 3 39 0', '22 3 40 4 31 0', '70 4 26 0', '44 3 53 0'];
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    box: [14, 14, 100, 100],
    art(svg, u) {
      const ridges = Array.from({ length: 10 }, (_, k) => `<path class="oil-r" pathLength="100" stroke-dasharray="${CUR_DASH[k % 5]}"/>`).join('');
      svg.innerHTML = `<defs>${light(u)}
          <clipPath id="${u}tip"><ellipse cx="64" cy="64" rx="34" ry="42"/></clipPath>
          ${lg(`${u}film`, [[0, 'oklch(0.8 0.14 85)'], [0.36, 'oklch(0.6 0.2 340)'], [0.68, 'oklch(0.62 0.16 250)'], [1, 'oklch(0.76 0.12 175)']], 'x1="0" y1="0" x2="1" y2="1"')}</defs>
        <rect x="20" y="20" width="100" height="100" rx="16" fill="oklch(0.08 0.01 260)"/>
        <rect x="14" y="14" width="100" height="100" rx="16" fill="url(#${u}film)"/>
        <rect x="14" y="14" width="100" height="100" rx="16" fill="url(#${u}lit)"/>
        <g clip-path="url(#${u}tip)" fill="none" style="stroke: var(--bg)" stroke-width="2.6" stroke-linecap="round">${ridges}</g>`;
      const ridgeEls = [...svg.querySelectorAll('.oil-r')];
      // A loop as points round a wobbly ellipse.
      const ring = (cx, cy, rx, ry, wob, ph, n = 36) => Array.from({ length: n }, (_, i) => {
        const a = (i / n) * TAU, k = 1 + wob * Math.sin(3 * a + ph) + wob * 0.5 * Math.sin(5 * a + 2 * ph);
        return [cx + rx * k * Math.cos(a), cy + ry * k * Math.sin(a)];
      });
      // Inner ridges sit on the core; outer ridges stay on the tip.
      const BASE = [64, 62], st = { x: 64, y: 62 };
      const draw = () => ridgeEls.forEach((e, k) => {
        const t = k / (ridgeEls.length - 1), r = 3.4 + k * 3.7;
        const cx = st.x + (BASE[0] - st.x) * t, cy = st.y + (BASE[1] - st.y) * t;
        e.setAttribute('d', smoothD(ring(cx, cy, r * 0.88, r * 1.1, 0.03, k * 0.9, 40)));
      });
      draw();
      const to = (x, y, d = 0.35) => gsap.to(st, { x, y, duration: d, ease: 'power2.out', onUpdate: draw, overwrite: 'auto' });
      // The core stays inside the fingertip.
      const aim = p => {
        const dx = p[0] - BASE[0], dy = p[1] - BASE[1], m = Math.hypot(dx, dy), s = m > 16 ? 16 / m : 1;
        to(BASE[0] + dx * s, BASE[1] + dy * s);
      };
      let demo = null;
      return {
        enter(p) {
          if (p) { aim(p); return; }
          demo = gsap.timeline({ repeat: -1, onUpdate: draw })
            .to(st, { x: 76, y: 52, duration: 0.7, ease: 'sine.inOut' })
            .to(st, { x: 52, y: 74, duration: 0.9, ease: 'sine.inOut' })
            .to(st, { x: 64, y: 62, duration: 0.6, ease: 'sine.inOut' });
        },
        move(p) { if (p && !demo) aim(p); },
        leave() { demo?.kill(); demo = null; to(BASE[0], BASE[1], 0.6); },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // A puddle seen from above at a slant: the ground squashes to 0.58 in y.
  const A_SQ = 0.58, A_R = 50, A_BASE = [0, 0];
  const aProj = ([gx, gy]) => [64 + gx, 66 + gy * A_SQ];
  const aUnproj = ([x, y]) => [x - 64, (y - 66) / A_SQ];
  const A_EDGE = smoothD(puddleRing(0, 0, A_R).map(aProj));
  const A_FILM = A_R * 0.97;
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [8, 34, 112, 64],
    idea: 'A puddle of dark water under a film of oil: bold bands in the toy\'s magenta, cyan and lime round a dark middle. The middle follows the pointer; a quick move swirls the bands.',
    art(svg, u) {
      const bands = BANDS.map((b, i) => `<path class="band" fill="${b.c}"${i === BANDS.length - 1 ? '' : ' fill-opacity="0.92"'}/>`).join('');
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 3)}
          ${lg(`${u}water`, [[0, 'oklch(0.34 0.04 265)'], [1, 'oklch(0.16 0.03 270)']], 'x1="0" y1="0" x2="0.3" y2="1"')}
          <clipPath id="${u}clip"><path d="${A_EDGE}"/></clipPath></defs>
        <path d="${A_EDGE}" fill="oklch(0.08 0.01 265)" opacity="0.6" filter="url(#${u}b)" transform="translate(0 3) scale(1.04)" transform-origin="64 66"/>
        <path d="${A_EDGE}" fill="url(#${u}water)"/>
        <g clip-path="url(#${u}clip)">${bands}</g>
        <path d="${A_EDGE}" fill="url(#${u}lit)"/>
        <path d="${A_EDGE}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>`;
      const paths = [...svg.querySelectorAll('.band')];
      return filmRig(paths, aProj, aUnproj, A_BASE, A_FILM, 16);
    },
    emblem: (() => {
      // Bands alternate white and grey, so the rings read in the mask.
      const d = filmPaths(aProj, A_BASE, A_BASE, A_FILM, 0);
      const tone = ['#7a7a7a', '#fff', '#7a7a7a', '#fff', '#7a7a7a', '#3a3a3a'];
      return `${EMB_HEAD}<defs><clipPath id="e"><path d="${A_EDGE}"/></clipPath></defs><path d="${A_EDGE}" fill="#fff"/><g clip-path="url(#e)">${d.map((p, i) => `<path d="${p}" fill="${tone[i]}"/>`).join('')}</g></svg>`;
    })(),
  });

  /* ================= D: Isometric block ================= */

  // A slab of street asphalt in 30 degree view, with the puddle on its top.
  const IC = 0.58, IS = IC * Math.tan(Math.PI / 6);
  const iso = ([gx, gy], h = 0) => [64 + (gx - gy) * IC, 64 + (gx + gy - 128) * IS - h];
  const unIso = ([x, y]) => { const a = (x - 64) / IC, b = (y - 64) / IS + 128; return [(a + b) / 2, (b - a) / 2]; };
  const G0 = 18, G1 = 110, T = 15;
  const D_CORNERS = [[G0, G0], [G1, G0], [G1, G1], [G0, G1]].map(g => iso(g));
  const down = p => [p[0], p[1] + T];
  const D_BASE = [66, 70], D_R = 33;
  const D_EDGE = smoothD(puddleRing(...D_BASE, D_R).map(g => iso(g)));
  const D_FILM = D_R * 0.97;
  // A painted lane line runs along the back of the slab.
  const D_LINE = poly([[G0 + 6, 27], [G1 - 6, 27], [G1 - 6, 34], [G0 + 6, 34]].map(g => iso(g)));
  const D_BOX = (() => {
    const xs = D_CORNERS.map(p => p[0]), ys = [...D_CORNERS.map(p => p[1]), ...D_CORNERS.map(p => down(p)[1])];
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)];
  })();
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: D_BOX,
    idea: 'A slab of wet street asphalt with a lane line and the oil puddle on top. The film\'s dark middle follows the pointer across the slab; a quick move swirls the bands.',
    art(svg, u) {
      const [c0, c1, c2, c3] = D_CORNERS;
      const bands = BANDS.map((b, i) => `<path class="band" fill="${b.c}"${i === BANDS.length - 1 ? '' : ' fill-opacity="0.92"'}/>`).join('');
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}
          ${lg(`${u}top`, [[0, 'oklch(0.52 0.012 260)'], [1, 'oklch(0.4 0.012 260)']], 'x1="0" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}water`, [[0, 'oklch(0.34 0.04 265)'], [1, 'oklch(0.16 0.03 270)']], 'x1="0" y1="0" x2="0.3" y2="1"')}
          <clipPath id="${u}clip"><path d="${D_EDGE}"/></clipPath></defs>
        <path d="${poly([c1, c2, c3, down(c3), down(c2), down(c1)])}" fill="oklch(0.05 0.01 260)" opacity="0.45" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${poly([c3, c2, down(c2), down(c3)])}" fill="oklch(0.33 0.012 260)"/>
        <path d="${poly([c2, c1, down(c1), down(c2)])}" fill="oklch(0.22 0.012 260)"/>
        <path d="${poly([c0, c1, c2, c3])}" fill="url(#${u}top)"/>
        <path d="${D_LINE}" fill="oklch(0.88 0.08 90)" opacity="0.85"/>
        <path d="${poly([c0, c1, c2, c3])}" fill="url(#${u}lit)" opacity="0.5"/>
        <path d="M${f(c3[0])} ${f(c3[1])}L${f(c0[0])} ${f(c0[1])}L${f(c1[0])} ${f(c1[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
        <path d="M${f(c3[0])} ${f(c3[1])}L${f(c2[0])} ${f(c2[1])}L${f(c1[0])} ${f(c1[1])}" stroke="#fff" stroke-opacity="0.55" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
        <path d="${D_EDGE}" fill="oklch(0.2 0.012 260)" opacity="0.4" filter="url(#${u}b)" transform="scale(1.1)" transform-origin="${f(iso(D_BASE)[0])} ${f(iso(D_BASE)[1])}"/>
        <path d="${D_EDGE}" fill="url(#${u}water)"/>
        <g clip-path="url(#${u}clip)">${bands}</g>
        <path d="${D_EDGE}" fill="url(#${u}lit)"/>
        <path d="${D_EDGE}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>`;
      const paths = [...svg.querySelectorAll('.band')];
      return filmRig(paths, g => iso(g), unIso, D_BASE, D_FILM, 12);
    },
    emblem: (() => {
      const [c0, c1, c2, c3] = D_CORNERS;
      const d = filmPaths(g => iso(g), D_BASE, D_BASE, D_FILM, 0);
      const tone = ['#fff', '#9a9a9a', '#fff', '#9a9a9a', '#fff', '#3a3a3a'];
      return `${EMB_HEAD}<path d="${poly([c3, c2, down(c2), down(c3)])}" fill="#5a5a5a"/><path d="${poly([c2, c1, down(c1), down(c2)])}" fill="#3a3a3a"/><path d="${poly([c0, c1, c2, c3])}" fill="#8a8a8a"/><path d="${D_EDGE}" fill="#1a1a1a"/><defs><clipPath id="e"><path d="${D_EDGE}"/></clipPath></defs><g clip-path="url(#e)">${d.map((p, i) => `<path d="${p}" fill="${tone[i]}"/>`).join('')}</g></svg>`;
    })(),
  });

  /* ================= Gallery ================= */
  const NAME = 'Oil slick';

  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-oilslick';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `oilslick-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
