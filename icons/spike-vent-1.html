<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Deep vent 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Deep vent 1</h1>
<p class="lede">Deep vent, round 1. The toy is not built; this is an icon only. A: a black smoker chimney and its plume; the pointer is the lure light. D: the seabed is the block, the chimney rises from it.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The toy's tokens: black basalt, rust minerals, the hot mouth, the blue lure.
  const ROCK = [[0, 'oklch(0.4 0.035 50)'], [1, 'oklch(0.18 0.02 40)']];
  const RUST = 'oklch(0.55 0.13 45)', HOT = 'oklch(0.82 0.17 60)', HOT2 = 'oklch(0.66 0.2 38)';
  const SMOKE = [[0, 'oklch(0.56 0.012 250)'], [1, 'oklch(0.3 0.012 250)']];
  const LURE = 'oklch(0.86 0.13 205)', LURE_CORE = 'oklch(0.98 0.04 200)';
  const SNOW = 'oklch(0.85 0.02 220)';

  // The plume: puffs rise from the mouth, swell, drift and fade.
  // At rest they hold still; hover sets them rolling.
  const plume = (puffs, mouth, H, sway) => (t, roll) => puffs.forEach((c, i) => {
    const ph = ((roll ? t * 0.32 : 0) + i / puffs.length) % 1;
    const x = mouth[0] + sway * Math.sin(ph * 2.4 + 0.6) * ph * 1.6;
    c.setAttribute('cx', f(x));
    c.setAttribute('cy', f(mouth[1] - H * ph));
    c.setAttribute('r', f(5 + 11 * ph));
    c.setAttribute('opacity', f(Math.min(1, ph * 6) * (1 - Math.pow(ph, 2.2))));
  });
  // Marine snow: a few soft flakes sink through the light.
  const snow = (flakes, box) => (t, on) => flakes.forEach((c, i) => {
    const ph = (t * 0.12 + i * 0.19) % 1;
    c.setAttribute('cx', f(box[0] + ((i * 37) % box[2]) + 3 * Math.sin(t * 1.3 + i)));
    c.setAttribute('cy', f(box[1] + box[3] * ph));
    c.setAttribute('opacity', f(on * 0.8 * Math.sin(Math.PI * ph)));
  });

  // The lure and its light, shared by A and D.
  // The pointer is the lure: the light follows it and lights the rock it faces.
  // Hover sets the plume rolling and the snow falling.
  const lure = (draw, rest, bounds) => {
    const st = { x: rest[0], y: rest[1], tx: rest[0], ty: rest[1], t: 0, on: 0, onTo: 0, live: false };
    const step = time => {
      st.t = time;
      st.x += (st.tx - st.x) * 0.12; st.y += (st.ty - st.y) * 0.12;
      st.on += (st.onTo - st.on) * 0.08;
      draw(st);
      if (!st.live && Math.abs(st.x - st.tx) + Math.abs(st.y - st.ty) + st.on < 0.05) {
        Object.assign(st, { x: rest[0], y: rest[1], on: 0, t: 0 }); draw(st); loop.stop();
      }
    };
    const loop = clock(step);
    draw(st);
    return {
      enter(p) { st.live = true; st.onTo = 1; loop.start(); if (p) this.move(p); },
      move(p) { if (!p) return; st.tx = clamp(p[0], bounds[0], bounds[1]); st.ty = clamp(p[1], bounds[2], bounds[3]); },
      leave() { st.live = false; st.tx = rest[0]; st.ty = rest[1]; st.onTo = 0; loop.start(); },
    };
  };
  const lureMarkup = u => `<g class="lure"><circle class="lh" r="20" fill="url(#${u}halo)"/><circle class="lc" r="4.6" fill="${LURE}"/><circle class="lk" r="2.2" fill="${LURE_CORE}"/></g>`;
  const placeLure = (svg, st) => {
    svg.querySelectorAll('.lure circle').forEach(c => { c.setAttribute('cx', f(st.x)); c.setAttribute('cy', f(st.y)); });
    svg.querySelectorAll('.glow').forEach(g => { g.setAttribute('cx', f(st.x)); g.setAttribute('cy', f(st.y)); });
  };

  const DIRS = [];

  /* ================= Current ================= */

  // Deep vent is not built; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NOT BUILT</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // A black smoker: a craggy chimney with two flanges, on a mound.
  const A_CHIM = 'M34 112Q38 102 45 99L44 92L49 88L47 82L52 79L43 77Q40 73 47 72L54 71L53 64L56 60L55 55L58 52L57 47Q60 44 64 45Q69 44 71 47L70 52L73 55L72 60L81 62Q85 65 78 67L74 67L76 75L79 80L77 86L82 90L80 96L86 99Q91 103 94 112Z';
  const A_RUST = ['M45 96Q62 100 81 95L81.5 99Q62 104 45.5 100Z', 'M53 68Q63 71 73 67.5L73.4 71Q63 74.5 53.4 72Z'];
  const A_MOUTH = [64, 45.5];
  // The same chimney, smaller, for the block.
  const tx = (d, k, ky, oy) => d.replace(/(-?[\d.]+) (-?[\d.]+)/g, (m, x, y) => `${f(64 + (x - 64) * k)} ${f(oy + (y - 112) * ky)}`);
  const A_REST = [33, 42];
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [22, 8, 84, 106],
    idea: 'A black smoker: a craggy basalt chimney with two flanges and rust mineral bands, the mouth glowing hot, a dark plume rising. A blue lure light hangs beside it. The pointer is the lure: the light follows it and lights the face of the chimney it meets. Hover sets the plume rolling and a few flakes of marine snow sink through the light.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}h`, 1.6)}${blur(`${u}p`, 0.8)}
          ${lg(`${u}rock`, ROCK, 'x1="0" y1="0" x2="0.6" y2="1"')}
          ${rg(`${u}smoke`, SMOKE, 'cx="0.38" cy="0.3" r="0.75"')}
          ${rg(`${u}halo`, [[0, LURE, 0.7], [1, LURE, 0]])}
          ${rg(`${u}heat`, [[0, HOT, 0.9], [1, HOT2, 0]])}
          <radialGradient id="${u}lamp" gradientUnits="userSpaceOnUse" r="38"><stop offset="0" style="stop-color: ${LURE}; stop-opacity: 0.42"/><stop offset="1" style="stop-color: ${LURE}; stop-opacity: 0"/></radialGradient>
          <clipPath id="${u}cc"><path d="${A_CHIM}"/></clipPath></defs>
        <ellipse cx="64" cy="113" rx="40" ry="4" fill="oklch(0.05 0.01 240)" opacity="0.7" filter="url(#${u}b)"/>
        <g class="plume" filter="url(#${u}p)">${[0, 1, 2, 3, 4, 5].map(() => `<circle class="pf" fill="url(#${u}smoke)"/>`).join('')}</g>
        <ellipse cx="${A_MOUTH[0]}" cy="${A_MOUTH[1] - 2}" rx="13" ry="9" fill="url(#${u}heat)" filter="url(#${u}h)"/>
        ${body(A_CHIM, u, 'rock')}
        <path d="${A_RUST.join('')}" fill="${RUST}" opacity="0.85"/>
        <g clip-path="url(#${u}cc)"><circle class="glow" r="38" fill="url(#${u}lamp)"/></g>
        <ellipse cx="${A_MOUTH[0]}" cy="${A_MOUTH[1]}" rx="6" ry="2.2" fill="${HOT}"/>
        <g class="snow">${[0, 1, 2, 3, 4].map(() => `<circle class="sn" r="1.7" fill="${SNOW}" opacity="0"/>`).join('')}</g>
        ${lureMarkup(u)}`;
      const drawPlume = plume([...svg.querySelectorAll('.pf')], A_MOUTH, 40, 5);
      const drawSnow = snow([...svg.querySelectorAll('.sn')], [26, 14, 76, 92]);
      return lure(st => {
        placeLure(svg, st);
        drawPlume(st.t, st.on > 0.01);
        drawSnow(st.t, st.on);
      }, A_REST, [24, 104, 14, 108]);
    },
    emblem: `${EMB_HEAD}<path d="${A_CHIM}" fill="#fff"/>${[[64, 34, 8], [61, 22, 10], [66, 12, 11]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="0.55"/>`).join('')}<circle cx="${A_REST[0]}" cy="${A_REST[1]}" r="5" fill="#fff"/></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The seabed is the block: dark basalt with a rust seam in each face.
  // The chimney rises from the top; the lure lights the top and the stack.
  const CY = 86, HALF = 23, T = 16;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const [N, E, S, W] = D_TOP;
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  const seam = (a, b) => poly([down(a, 0.45), down(b, 0.45), down(b, 0.62), down(a, 0.62)]);
  const D_CHIM = tx(A_CHIM, 0.5, 0.66, 92);
  const D_RUST = A_RUST.map(d => tx(d, 0.5, 0.66, 92));
  const D_MOUTH = [64, 92 + (45.5 - 112) * 0.66];
  const D_REST = [37, 46];
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [22, 12, 84, 104],
    idea: 'The seabed is the block: dark basalt, a rust mineral seam through the left and right faces, a rim on the top edges. The chimney rises from the top with its hot mouth and dark plume. The pointer is the lure: its light follows it and pools on the seabed and the stack. Hover sets the plume rolling and snow falling.',
    art(svg, u) {
      const top = poly(D_TOP);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}h`, 1.6)}${blur(`${u}p`, 0.8)}
          ${lg(`${u}rock`, ROCK, 'x1="0" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}top`, [[0, 'oklch(0.34 0.025 50)'], [1, 'oklch(0.24 0.02 45)']], 'x1="0" y1="0" x2="0.4" y2="1"')}
          ${rg(`${u}smoke`, SMOKE, 'cx="0.38" cy="0.3" r="0.75"')}
          ${rg(`${u}halo`, [[0, LURE, 0.7], [1, LURE, 0]])}
          ${rg(`${u}heat`, [[0, HOT, 0.9], [1, HOT2, 0]])}
          <radialGradient id="${u}lamp" gradientUnits="userSpaceOnUse" r="44"><stop offset="0" style="stop-color: ${LURE}; stop-opacity: 0.38"/><stop offset="1" style="stop-color: ${LURE}; stop-opacity: 0"/></radialGradient>
          <clipPath id="${u}lc"><path d="${top}"/><path d="${D_CHIM}"/></clipPath></defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.6" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="oklch(0.27 0.022 45)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="oklch(0.17 0.015 40)"/>
        <path d="${seam(W, S)}" fill="${RUST}" opacity="0.8"/><path d="${seam(S, E)}" fill="${RUST}" opacity="0.55"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g class="plume" filter="url(#${u}p)">${[0, 1, 2, 3, 4, 5].map(() => `<circle class="pf" fill="url(#${u}smoke)"/>`).join('')}</g>
        <ellipse cx="${D_MOUTH[0]}" cy="${D_MOUTH[1] - 2}" rx="11" ry="8" fill="url(#${u}heat)" filter="url(#${u}h)"/>
        ${body(D_CHIM, u, 'rock')}
        <path d="${D_RUST.join('')}" fill="${RUST}" opacity="0.85"/>
        <g clip-path="url(#${u}lc)"><circle class="glow" r="44" fill="url(#${u}lamp)"/></g>
        <ellipse cx="${D_MOUTH[0]}" cy="${D_MOUTH[1]}" rx="5" ry="1.9" fill="${HOT}"/>
        <g class="snow">${[0, 1, 2, 3, 4].map(() => `<circle class="sn" r="1.6" fill="${SNOW}" opacity="0"/>`).join('')}</g>
        ${lureMarkup(u)}`;
      const drawPlume = plume([...svg.querySelectorAll('.pf')], D_MOUTH, 34, 4);
      const drawSnow = snow([...svg.querySelectorAll('.sn')], [28, 16, 72, 80]);
      return lure(st => {
        placeLure(svg, st);
        drawPlume(st.t, st.on > 0.01);
        drawSnow(st.t, st.on);
      }, D_REST, [24, 104, 14, 100]);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/><path d="${D_CHIM}" fill="#fff"/>${[[64, 42, 7], [62, 31, 9], [66, 21, 10]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="0.55"/>`).join('')}<circle cx="${D_REST[0]}" cy="${D_REST[1]}" r="4.6" fill="#fff"/></svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Deep vent';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-vent';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `vent-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
