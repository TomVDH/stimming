<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 14</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- The stencil tile: the film bands, gold to teal. -->
    <linearGradient id="os-film" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.8 0.14 85)"/>
      <stop offset="0.36" style="stop-color: oklch(0.6 0.2 340)"/>
      <stop offset="0.68" style="stop-color: oklch(0.62 0.16 250)"/>
      <stop offset="1" style="stop-color: oklch(0.76 0.12 175)"/>
    </linearGradient>
    <!-- The line ink: the same bands across the drawing. -->
    <linearGradient id="os-line" gradientUnits="userSpaceOnUse" x1="16" y1="20" x2="112" y2="108">
      <stop offset="0" style="stop-color: oklch(0.86 0.12 85)"/>
      <stop offset="0.36" style="stop-color: oklch(0.7 0.18 340)"/>
      <stop offset="0.68" style="stop-color: oklch(0.7 0.14 250)"/>
      <stop offset="1" style="stop-color: oklch(0.8 0.12 175)"/>
    </linearGradient>
  </defs>
</svg>

<h1>Icon spike 14</h1>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };
  // Film colours, thin to thick, as the toy draws them.
  const FILM = {
    silver: 'oklch(0.9 0.02 95)', gold: 'oklch(0.8 0.14 85)', magenta: 'oklch(0.6 0.2 340)',
    blue: 'oklch(0.62 0.16 250)', teal: 'oklch(0.76 0.12 175)',
  };
  const PUDDLE = 'oklch(0.13 0.012 250)';
  // A closed wobbly loop through n points, smoothed into cubic curves.
  const loopD = (cx, cy, rx, ry, wob, ph, n = 10) => {
    const P = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, k = 1 + wob * Math.sin(3 * a + ph) + wob * 0.5 * Math.sin(5 * a + ph * 2);
      P.push([cx + rx * k * Math.cos(a), cy + ry * k * Math.sin(a)]);
    }
    let d = `M${f(P[0][0])} ${f(P[0][1])}`;
    for (let i = 0; i < n; i++) {
      const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += `C${f(c1[0])} ${f(c1[1])} ${f(c2[0])} ${f(c2[1])} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d + 'Z';
  };
  // A drop: a round belly at (cx, cy) with its tip straight above.
  const dropD = (cx, cy, r) => `M${f(cx)} ${f(cy - 1.9 * r)}C${f(cx + 0.55 * r)} ${f(cy - 1.2 * r)} ${f(cx + r)} ${f(cy - 0.6 * r)} ${f(cx + r)} ${f(cy)}`
    + `A${f(r)} ${f(r)} 0 0 1 ${f(cx - r)} ${f(cy)}C${f(cx - r)} ${f(cy - 0.6 * r)} ${f(cx - 0.55 * r)} ${f(cy - 1.2 * r)} ${f(cx)} ${f(cy - 1.9 * r)}Z`;
  // Ring k turns (N - k) times per loop, so the inner bands swirl fastest.
  const swirl = (els, origin, dur) => hoverLoop(
    () => {
      const tl = gsap.timeline({ repeat: -1 });
      els.forEach((e, k) => tl.fromTo(e, { rotation: 0 }, { rotation: (k % 2 ? -360 : 360) * (els.length - k), svgOrigin: origin, duration: dur, ease: 'none' }, 0));
      return tl;
    },
    () => gsap.to(els, { rotation: '0_short', svgOrigin: origin, duration: 0.5, ease: 'power2.out', overwrite: true }));

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover: four rings on a dark block.
  {
    const RINGS = [[36, 26, 'gold'], [28, 19, 'magenta'], [20, 13, 'blue'], [12, 7, 'teal']];
    DIRS.push({
      toy: 'oilslick', l: 'Current', name: 'Menu icon',
      box: [16, 16, 98, 98],
      art(svg) {
        svg.innerHTML = `
          <rect x="22" y="22" width="92" height="92" fill="oklch(0.07 0.01 260)"/>
          <rect x="16" y="16" width="92" height="92" fill="oklch(0.15 0.012 250)"/>
          <g transform="rotate(-18 62 62)" fill="none" stroke-width="5">
            ${RINGS.map(([rx, ry, c]) => `<ellipse class="r" cx="62" cy="62" rx="${rx}" ry="${ry}" stroke="${FILM[c]}"/>`).join('')}
          </g>
          <circle cx="62" cy="62" r="4" fill="oklch(0.07 0.01 260)"/>`;
        const rings = [...svg.querySelectorAll('.r')];
        return hoverLoop(
          () => {
            const tl = gsap.timeline({ repeat: -1 });
            rings.forEach((r, i) => tl.fromTo(r, { rotation: 0 }, { rotation: -180 * (4 - i), svgOrigin: '62 62', duration: 6, ease: 'none' }, 0));
            return tl;
          },
          () => gsap.to(rings, { rotation: '0_short', svgOrigin: '62 62', duration: 0.4, overwrite: true }));
      },
    });
  }

  /* ================= A · Shaded object ================= */

  // A glossy puddle on a hard shadow; eccentric bands swirl round a dark hole.
  {
    const O = [60, 62];
    const EDGE = loopD(64, 64, 47, 43, 0.07, 0.6, 12);
    const BANDS = [[41, 'silver'], [35, 'gold'], [29, 'magenta'], [23, 'blue'], [17, 'teal'], [11, 'gold'], [6, 'magenta']];
    const band = ([r, c], k) => loopD(O[0] + k * 0.9, O[1] - k * 0.7, r, r * 0.86, 0.06, k * 1.3, 10);
    DIRS.push({
      toy: 'oilslick', l: 'A', name: 'Shaded object',
      box: [17, 21, 100, 96],
      art(svg, id) {
        svg.innerHTML = `
          <defs><clipPath id="${id}c"><path d="${EDGE}"/></clipPath></defs>
          <path d="${EDGE}" transform="translate(6 7)" fill="oklch(0.07 0.01 260)"/>
          <path d="${EDGE}" fill="${PUDDLE}"/>
          <g clip-path="url(#${id}c)">
            <g fill="none" stroke-width="4">
              ${BANDS.map((b, k) => `<path class="b" d="${band(b, k)}" stroke="${FILM[b[1]]}" stroke-opacity="${f(0.45 + k * 0.07)}"/>`).join('')}
            </g>
            <circle cx="${O[0] + 6}" cy="${O[1] - 5}" r="4" fill="oklch(0.07 0.01 260)"/>
          </g>
          <path d="${EDGE}" fill="url(#lit)" opacity="0.3"/>
          <path d="${EDGE}" fill="none" stroke="url(#rim)" stroke-width="1.4"/>`;
        return swirl([...svg.querySelectorAll('.b')], `${O[0]} ${O[1]}`, 14);
      },
      // The emblem: a solid puddle with its bands cut as dark rings.
      emblem: emb(`
        <mask id="m">
        <path d="${EDGE}" fill="#fff"/>
        <g fill="none" stroke="#000" stroke-width="3.2">
        ${BANDS.filter((_, k) => k % 2 === 0).map((b, i) => `<path d="${band(b, i * 2)}"/>`).join('\n')}
        </g>
        <circle cx="${O[0] + 6}" cy="${O[1] - 5}" r="5" fill="#000"/>
        </mask>
        <path d="${EDGE}" fill="#fff" mask="url(#m)"/>
      `),
    });
  }

  /* ================= B · Stencil cut-out ================= */

  // A film-coloured tile; the bands are cut through it, each slot held by a bridge.
  {
    const SLOTS = [[12, 0.5], [22, 1.7], [32, 2.9], [42, 4.1]].map(([r, ph], k) => loopD(64 + k, 64 - k * 0.6, r, r * 0.84, 0.07, ph, 10));
    DIRS.push({
      toy: 'oilslick', l: 'B', name: 'Stencil cut-out',
      box: [14, 14, 100, 100],
      art(svg, id) {
        svg.innerHTML = `
          <defs><clipPath id="${id}c"><rect x="14" y="14" width="100" height="100" rx="16"/></clipPath></defs>
          <rect x="14" y="14" width="100" height="100" rx="16" fill="url(#os-film)"/>
          <rect x="14" y="14" width="100" height="100" rx="16" fill="url(#lit)"/>
          <g clip-path="url(#${id}c)" fill="none" style="stroke: var(--bg)" stroke-width="4.5" stroke-linecap="round">
            ${SLOTS.map(d => `<path d="${d}" pathLength="100" stroke-dasharray="46 5 49 0"/>`).join('')}
          </g>
          <circle cx="64" cy="64" r="4.5" style="fill: var(--bg)"/>
          <rect x="14" y="14" width="100" height="100" rx="16" fill="none" stroke="url(#rim)" stroke-width="1.6"/>`;
        const paths = [...svg.querySelectorAll('g path')];
        // The bridges crawl round their slots, inner ones faster.
        return hoverLoop(
          () => {
            const tl = gsap.timeline({ repeat: -1 });
            paths.forEach((p, k) => tl.fromTo(p, { attr: { 'stroke-dashoffset': 0 } }, { attr: { 'stroke-dashoffset': (k % 2 ? 100 : -100) * (4 - k) }, duration: 8, ease: 'none' }, 0));
            return tl;
          },
          () => gsap.to(paths, { attr: { 'stroke-dashoffset': 0 }, duration: 0.5, ease: 'power2.out', overwrite: true }));
      },
      emblem: emb(`
        <mask id="m">
        <rect x="14" y="14" width="100" height="100" rx="16" fill="#fff"/>
        <g fill="none" stroke="#000" stroke-width="5.5" stroke-linecap="round">
        ${SLOTS.map(d => `<path d="${d}" pathLength="100" stroke-dasharray="46 6 48 0"/>`).join('\n')}
        </g>
        <circle cx="64" cy="64" r="5.5" fill="#000"/>
        </mask>
        <rect x="14" y="14" width="100" height="100" rx="16" fill="#fff" mask="url(#m)"/>
      `),
    });
  }

  /* ================= C · Single-weight line ================= */

  // One stroke weight in a film gradient: the puddle edge and three loose bands.
  {
    const EDGE = loopD(64, 64, 48, 42, 0.08, 0.2, 12);
    const IN = [[34, 1.1], [22, 2.6], [11, 4.0]].map(([r, ph], k) => loopD(60 + k * 2, 62 - k, r, r * 0.8, 0.12, ph, 9));
    DIRS.push({
      toy: 'oilslick', l: 'C', name: 'Single-weight line',
      box: [14, 18, 100, 92],
      art(svg) {
        svg.innerHTML = `
          <g fill="none" stroke="url(#os-line)" stroke-width="3.5" stroke-linejoin="round">
            <path d="${EDGE}"/>
            ${IN.map(d => `<path class="b" d="${d}"/>`).join('')}
          </g>`;
        return swirl([...svg.querySelectorAll('.b')], '62 62', 10);
      },
      emblem: emb(`
        <g fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round">
        <path d="${EDGE}"/>
        ${IN.map(d => `<path d="${d}"/>`).join('\n')}
        </g>
      `),
    });
  }

  /* ================= D · Isometric block ================= */

  // An asphalt slab; its top face is the puddle, the film turning on it.
  {
    const T = [64, 18], UR = [110, 44.6], C0 = [64, 71.2], UL = [18, 44.6];
    const LL = [18, 62.6], BB = [64, 89.2], LR = [110, 62.6];
    const CEN = [64, 44.6];
    // A circle of radius r on the top face draws as this ellipse.
    const ISO = `translate(${CEN[0]} ${CEN[1]}) scale(1.2247 0.7071)`;
    const POOL = loopD(0, 0, 31, 31, 0.08, 0.7, 12);
    const RINGS = [[26, 'gold'], [21, 'magenta'], [16, 'blue'], [11, 'teal'], [6, 'silver']].map(([r, c], k) => [loopD(k * 0.8, -k * 0.6, r, r, 0.07, k * 1.4, 10), c]);
    DIRS.push({
      toy: 'oilslick', l: 'D', name: 'Isometric block',
      box: [14, 14, 100, 80],
      art(svg) {
        svg.innerHTML = `
          <path d="${poly([UL, C0, BB, LL])}" fill="oklch(0.27 0.01 250)"/>
          <path d="${poly([C0, UR, LR, BB])}" fill="oklch(0.18 0.01 250)"/>
          <path d="${poly([T, UR, C0, UL])}" fill="oklch(0.33 0.008 250)"/>
          <g transform="${ISO}">
            <path d="${POOL}" fill="${PUDDLE}"/>
            <g fill="none" stroke-width="3.4" vector-effect="non-scaling-stroke">
              ${RINGS.map(([d, c]) => `<path class="b" d="${d}" stroke="${FILM[c]}" vector-effect="non-scaling-stroke"/>`).join('')}
            </g>
          </g>
          <path d="${poly([T, UR, C0, UL])}" fill="none" stroke="url(#rim)" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M${C0[0]} ${C0[1]}V${BB[1]}" stroke="oklch(0.9 0.02 250 / 0.25)" stroke-width="1.2"/>`;
        return swirl([...svg.querySelectorAll('.b')], '0 0', 12);
      },
      emblem: emb(`
        <path d="${poly([T, UR, LR, BB, LL, UL])}" fill="#fff"/>
        <path d="M${C0[0]} ${C0[1]}V${BB[1]}" stroke="#000" stroke-width="3"/>
        <g transform="${ISO}">
        <path d="${POOL}" fill="#000"/>
        <g fill="none" stroke="#fff" stroke-width="2.8">
        ${RINGS.filter((_, k) => k % 2 === 0).map(([d]) => `<path d="${d}" vector-effect="non-scaling-stroke"/>`).join('\n')}
        </g>
        </g>
      `),
    });
  }

  /* ================= E · Abstract mark ================= */

  // Three heavy drops nest like film bands; on hover they ripple outward.
  {
    const C = [64, 80];
    const LIST = [[33, 'gold'], [21, 'magenta'], [9, 'blue']];
    DIRS.push({
      toy: 'oilslick', l: 'E', name: 'Abstract mark',
      box: [26, 12, 76, 106],
      art(svg) {
        svg.innerHTML = `
          <g fill="none" stroke-width="9" stroke-linejoin="round">
            ${LIST.map(([r, c]) => `<path class="b" d="${dropD(C[0], C[1], r)}" stroke="${FILM[c]}"/>`).join('')}
          </g>`;
        const drops = [...svg.querySelectorAll('.b')];
        // Each ring swells in turn from the belly, outer ring last.
        return hoverLoop(
          () => gsap.timeline({ repeat: -1 })
            .fromTo([...drops].reverse(), { scale: 1 }, { scale: 1.09, svgOrigin: `${C[0]} ${C[1]}`, duration: 0.45, ease: 'sine.inOut', yoyo: true, repeat: 1, stagger: 0.16 }),
          () => gsap.to(drops, { scale: 1, svgOrigin: `${C[0]} ${C[1]}`, duration: 0.4, overwrite: true }));
      },
      emblem: emb(`
        <g fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round">
        ${LIST.map(([r]) => `<path d="${dropD(C[0], C[1], r)}"/>`).join('\n')}
        </g>
      `),
    });
  }

  /* ================= Gallery ================= */

  const NAMES = { oilslick: 'Oil slick' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || (D.emblem ? `spike/emblems/${file}.svg` : '');
      if (D.emblem) window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
