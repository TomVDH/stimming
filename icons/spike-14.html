<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Icon spike 14</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- The stencil tile: the film bands, gold to teal. -->
    <linearGradient id="os-film" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.8 0.14 85)"/>
      <stop offset="0.36" style="stop-color: oklch(0.6 0.2 340)"/>
      <stop offset="0.68" style="stop-color: oklch(0.62 0.16 250)"/>
      <stop offset="1" style="stop-color: oklch(0.76 0.12 175)"/>
    </linearGradient>
    <!-- The line ink: the same bands across the drawing. -->
    <linearGradient id="os-line" gradientUnits="userSpaceOnUse" x1="16" y1="20" x2="112" y2="108">
      <stop offset="0" style="stop-color: oklch(0.86 0.12 85)"/>
      <stop offset="0.36" style="stop-color: oklch(0.7 0.18 340)"/>
      <stop offset="0.68" style="stop-color: oklch(0.7 0.14 250)"/>
      <stop offset="1" style="stop-color: oklch(0.8 0.12 175)"/>
    </linearGradient>
  </defs>
</svg>

<h1>Icon spike 14</h1>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };
  const TAU = Math.PI * 2;
  // The film order, outer edge to centre: thin silver, then the first bands.
  const ORDER = [
    'oklch(0.36 0.04 255)', 'oklch(0.76 0.03 95)', 'oklch(0.84 0.14 88)', 'oklch(0.6 0.21 345)',
    'oklch(0.58 0.16 260)', 'oklch(0.76 0.12 185)', 'oklch(0.86 0.15 105)', 'oklch(0.7 0.17 355)',
  ];
  const PUDDLE = 'oklch(0.13 0.012 250)', HOLE = 'oklch(0.08 0.01 260)';
  // A loop as points: n samples round a wobbly ellipse.
  const ring = (cx, cy, rx, ry, wob, ph, n = 36) => Array.from({ length: n }, (_, i) => {
    const a = (i / n) * TAU, k = 1 + wob * Math.sin(3 * a + ph) + wob * 0.5 * Math.sin(5 * a + 2 * ph);
    return [cx + rx * k * Math.cos(a), cy + ry * k * Math.sin(a)];
  });
  // A closed Catmull-Rom curve through the points.
  const smoothD = P => {
    const n = P.length;
    let d = `M${f(P[0][0])} ${f(P[0][1])}`;
    for (let i = 0; i < n; i++) {
      const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d + 'Z';
  };
  // A drop: a round belly at (cx, cy) with its tip straight above.
  const dropD = (cx, cy, r) => `M${f(cx)} ${f(cy - 1.9 * r)}C${f(cx + 0.55 * r)} ${f(cy - 1.2 * r)} ${f(cx + r)} ${f(cy - 0.6 * r)} ${f(cx + r)} ${f(cy)}`
    + `A${f(r)} ${f(r)} 0 0 1 ${f(cx - r)} ${f(cy)}C${f(cx - r)} ${f(cy - 0.6 * r)} ${f(cx - 0.55 * r)} ${f(cy - 1.2 * r)} ${f(cx)} ${f(cy - 1.9 * r)}Z`;
  // The drop outline as points, so the pointer can smear it too.
  const dropPts = (cx, cy, r, n = 56) => {
    const p = el('path', { d: dropD(cx, cy, r) }, document.querySelector('svg.defs')), L = p.getTotalLength();
    const pts = Array.from({ length: n }, (_, i) => { const q = p.getPointAtLength((i / n) * L); return [q.x, q.y]; });
    p.remove();
    return pts;
  };
  // Nested film loops round one centre, each a little off the last.
  const bands = (cx, cy, r0, r1, n, sq = 0.86, drift = [-0.5, -0.4]) => Array.from({ length: n }, (_, k) => {
    const r = r0 + ((r1 - r0) * k) / (n - 1);
    return ring(cx + drift[0] * k, cy + drift[1] * k, r, r * sq, 0.06 + 0.05 * (k % 3), k * 1.7);
  });

  // The film: loops of points the pointer smears, pushes and lets go.
  function film(loops) {
    const rest = loops.map(L => L.map(p => [...p]));
    const pts = loops.map(L => L.map(p => [...p]));
    const F = { pts, hole: 0, at: [0, 0] };
    // A drag carries nearby film along the pointer's path.
    // The film then relaxes a little along each band, so bands curl, not kink.
    F.drag = (q, v, R = 12) => {
      for (const L of pts) {
        const n = L.length, hit = new Float32Array(n);
        L.forEach((p, i) => {
          const dx = p[0] - q[0], dy = p[1] - q[1], w = Math.exp(-(dx * dx + dy * dy) / (R * R));
          p[0] += v[0] * w * 0.6; p[1] += v[1] * w * 0.6; hit[i] = w;
        });
        const old = L.map(p => [...p]);
        L.forEach((p, i) => {
          const k = Math.min(0.45, hit[i] * 0.9), a = old[(i - 1 + n) % n], c = old[(i + 1) % n];
          p[0] += k * ((a[0] + c[0]) / 2 - p[0]); p[1] += k * ((a[1] + c[1]) / 2 - p[1]);
        });
      }
    };
    // A hold pushes film out from the pointer and opens a dark hole.
    F.push = (q, amt, R = 15) => {
      const a = amt * (1 - F.hole / 9);
      if (a <= 0.01) return;
      for (const L of pts) for (const p of L) {
        const dx = p[0] - q[0], dy = p[1] - q[1], r = Math.hypot(dx, dy) + 1e-3, w = Math.exp(-(r * r) / (R * R));
        p[0] += (dx / r) * a * w; p[1] += (dy / r) * a * w;
      }
      F.hole = Math.min(9, F.hole + a * 0.6); F.at = q;
    };
    // Letting go eases every point back to rest.
    F.relax = (dur, draw) => {
      const from = pts.map(L => L.map(p => [...p])), h0 = F.hole, st = { t: 0 };
      return gsap.to(st, {
        t: 1, duration: dur, ease: 'power2.inOut',
        onUpdate() {
          const t = st.t;
          pts.forEach((L, i) => L.forEach((p, j) => { p[0] = from[i][j][0] + (rest[i][j][0] - from[i][j][0]) * t; p[1] = from[i][j][1] + (rest[i][j][1] - from[i][j][1]) * t; }));
          F.hole = h0 * (1 - t); draw();
        },
      });
    };
    return F;
  }
  // The pointer as a finger: a move smears, a still pointer holds, leaving lets go.
  // With no pointer, as on focus, one demo stroke swirls and holds.
  function finger(F, draw, map = p => p, home = [64, 64]) {
    let last = null, lastT = 0, back = null, demo = null;
    const tick = () => { if (last && performance.now() - lastT > 220) { F.push(last, 0.9); draw(); } };
    const move = q => {
      if (last) {
        const v = [q[0] - last[0], q[1] - last[1]], m = Math.hypot(v[0], v[1]);
        if (m > 0.01) F.drag(q, m > 8 ? [(v[0] * 8) / m, (v[1] * 8) / m] : v);
      }
      last = q; lastT = performance.now(); draw();
    };
    const play = () => {
      const st = { a: 0 }, [hx, hy] = home;
      return gsap.timeline()
        .to(st, { a: 1, duration: 1.6, ease: 'sine.inOut', onUpdate: () => move([hx - 20 + 34 * st.a, hy + 16 * Math.sin(st.a * TAU)]) })
        .call(() => { lastT = performance.now(); }, null, '+=0')
        .to({}, { duration: 0.9 });
    };
    return {
      enter(p) {
        back?.kill(); back = null;
        gsap.ticker.add(tick);
        if (p) { last = map(p); lastT = performance.now(); } else demo = play();
      },
      move(p) { if (p && !demo) move(map(p)); },
      leave() {
        demo?.kill(); demo = null;
        gsap.ticker.remove(tick);
        last = null; back = F.relax(1.1, draw);
      },
    };
  }

  const DIRS = [];

  /* ================= Film colour ================= */

  // Real thin-film colour: oil on water, sampled over the visible band.
  // The table maps film thickness, drawn as grey, to the colour it reflects.
  const filmTable = (n = 48, dMax = 700) => {
    const g = (l, m, a, b) => { const t = (l - m) / (l < m ? a : b); return Math.exp(-0.5 * t * t); };
    const LAM = Array.from({ length: 16 }, (_, i) => 400 + i * 20), W = [], sum = [0, 0, 0];
    for (const l of LAM) {
      const X = 1.056 * g(l, 599.8, 37.9, 31) + 0.362 * g(l, 442, 16, 26.7) - 0.065 * g(l, 501.1, 20.4, 26.2);
      const Y = 0.821 * g(l, 568.8, 46.9, 40.5) + 0.286 * g(l, 530.9, 16.3, 31.1);
      const Z = 1.217 * g(l, 437, 11.8, 36) + 0.681 * g(l, 459, 26, 13.8);
      const w = [3.2406 * X - 1.5372 * Y - 0.4986 * Z, -0.9689 * X + 1.8758 * Y + 0.0415 * Z, 0.0557 * X - 0.204 * Y + 1.057 * Z];
      W.push(w); w.forEach((v, c) => (sum[c] += v));
    }
    const out = [[], [], []];
    for (let i = 0; i < n; i++) {
      const d = (dMax * i) / (n - 1), rgb = [0, 0, 0];
      LAM.forEach((l, j) => { const I = 0.5 - 0.5 * Math.cos((4 * Math.PI * 1.47 * d) / l); W[j].forEach((v, c) => (rgb[c] += (I * v) / sum[c])); });
      const lum = 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
      rgb.forEach((v, c) => { const s = Math.max(0, lum + (v - lum) * 1.2) * 0.85; out[c].push(f(Math.min(1, Math.pow(s, 1 / 2.2)))); });
    }
    return out;
  };

  /* ================= Current ================= */

  // The menu icon: a wet asphalt block on a hard shadow, with a puddle in it.
  // The slick is a thickness field the pointer smears; a filter turns it into
  // true interference colour, so every smear shows real film bands.
  {
    const EDGE = smoothD(ring(64, 63, 40, 35, 0.09, 0.6, 14));
    const REST = bands(67, 65, 31, 5, 8, 0.86, [-0.4, -0.3]);
    // Thickness per band, outer edge to centre; a dip makes the marbling.
    const LEVEL = [0.07, 0.24, 0.4, 0.33, 0.54, 0.7, 0.6, 0.86];
    const TABLE = typeof document === 'undefined' ? [[], [], []] : filmTable();
    DIRS.push({
      toy: 'oilslick', l: 'Current', name: 'Menu icon', emblemUrl: '../shared/emblems/oilslick.svg',
      box: [16, 16, 98, 98],
      art(svg, id) {
        svg.innerHTML = `
          <defs>
            <clipPath id="${id}c"><path d="${EDGE}"/></clipPath>
            <filter id="${id}f" x="0" y="0" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
              <feGaussianBlur stdDeviation="1.8"/>
              <feComponentTransfer>
                <feFuncR type="table" tableValues="${TABLE[0].join(' ')}"/>
                <feFuncG type="table" tableValues="${TABLE[1].join(' ')}"/>
                <feFuncB type="table" tableValues="${TABLE[2].join(' ')}"/>
              </feComponentTransfer>
            </filter>
            <radialGradient id="${id}sky" cx="0.72" cy="0.22" r="0.85">
              <stop offset="0" stop-color="oklch(0.42 0.03 240)"/><stop offset="1" stop-color="oklch(0.1 0.012 255)"/>
            </radialGradient>
            <radialGradient id="${id}dim" cx="0.72" cy="0.22" r="0.9">
              <stop offset="0.35" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/>
            </radialGradient>
            <pattern id="${id}grit" width="7" height="7" patternUnits="userSpaceOnUse">
              <circle cx="1.5" cy="2" r="0.7" fill="#fff" opacity="0.07"/><circle cx="5" cy="5.5" r="0.5" fill="#000" opacity="0.3"/>
            </pattern>
          </defs>
          <rect x="22" y="22" width="92" height="92" fill="${HOLE}"/>
          <rect x="16" y="16" width="92" height="92" fill="oklch(0.26 0.008 250)"/>
          <rect x="16" y="16" width="92" height="92" fill="url(#${id}grit)"/>
          <rect x="16" y="16" width="92" height="92" fill="url(#lit)" opacity="0.3"/>
          <path d="${EDGE}" fill="url(#${id}sky)"/>
          <g clip-path="url(#${id}c)">
            <g filter="url(#${id}f)" style="mix-blend-mode: screen" opacity="0.9">
              <rect x="0" y="0" width="128" height="128" fill="#000"/>
              ${LEVEL.map(v => `<path class="b" fill="rgb(${Math.round(v * 255)} ${Math.round(v * 255)} ${Math.round(v * 255)})"/>`).join('')}
              <circle class="h" r="0" fill="#000"/>
            </g>
            <path d="${EDGE}" fill="url(#${id}dim)"/>
            <ellipse class="k" cx="88" cy="34" rx="9" ry="4" transform="rotate(-30 88 34)" fill="#fff" opacity="0.5"/>
          </g>
          <path d="${EDGE}" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
          <path d="${EDGE}" fill="none" stroke="oklch(0.08 0.01 260 / 0.6)" stroke-width="0.8"/>`;
        const F = film(REST), paths = [...svg.querySelectorAll('.b')], h = svg.querySelector('.h'), k = svg.querySelector('.k');
        const draw = () => {
          paths.forEach((p, i) => p.setAttribute('d', smoothD(F.pts[i])));
          h.setAttribute('cx', f(F.at[0])); h.setAttribute('cy', f(F.at[1])); h.setAttribute('r', f(F.hole * 0.9));
        };
        draw();
        const base = finger(F, draw);
        // The sky's glint slides against the pointer, as a reflection does.
        const glint = p => gsap.to(k, { x: p ? (64 - p[0]) * 0.25 : 0, y: p ? (64 - p[1]) * 0.25 : 0, duration: 0.5, ease: 'power2.out', overwrite: 'auto' });
        return { enter(p) { base.enter(p); glint(p); }, move(p) { base.move(p); glint(p); }, leave() { base.leave(); glint(null); } };
      },
    });
  }

  // Film colour by thickness, 0 to 1, as CSS; a thick sample keeps more orders.
  const FT = typeof document === 'undefined' ? [[0], [0], [0]] : filmTable(96, 900);
  const filmCss = t => {
    const i = Math.max(0, Math.min(FT[0].length - 1, Math.round(t * (FT[0].length - 1))));
    return `rgb(${Math.round(FT[0][i] * 255)} ${Math.round(FT[1][i] * 255)} ${Math.round(FT[2][i] * 255)})`;
  };
  // An open Catmull-Rom curve through the points.
  const openD = P => {
    let d = `M${f(P[0][0])} ${f(P[0][1])}`;
    for (let i = 0; i < P.length - 1; i++) {
      const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d;
  };
  // A pointer control from three plain functions; focus plays a demo.
  const ctl = (aim, rest, demo) => {
    let tl = null;
    return {
      enter(p) { if (p) aim(p); else tl = demo(); },
      move(p) { if (p && !tl) aim(p); },
      leave() { tl?.kill(); tl = null; rest(); },
    };
  };

  /* ================= A · Shaded object ================= */

  // A glossy swatch of oil that tilts to face the pointer.
  // Film colour shifts with view angle, so the bands sweep as it tilts.
  {
    const S = 33, HT = 7, DV = 260, O = [64, 60];
    const REST = { ax: 18, ay: -22 };
    // Rotate a slab corner about x, then y, and project it.
    const proj = (x, y, z, ax, ay) => {
      const a = (ax * Math.PI) / 180, b = (ay * Math.PI) / 180;
      const y1 = y * Math.cos(a) - z * Math.sin(a), z1 = y * Math.sin(a) + z * Math.cos(a);
      const x2 = x * Math.cos(b) + z1 * Math.sin(b), z2 = -x * Math.sin(b) + z1 * Math.cos(b);
      const k = DV / (DV - z2);
      return [O[0] + x2 * k, O[1] + y1 * k, z2];
    };
    const geo = (ax, ay) => {
      const c = [[-S, -S], [S, -S], [S, S], [-S, S]];
      const top = c.map(([x, y]) => proj(x, y, HT / 2, ax, ay)), bot = c.map(([x, y]) => proj(x, y, -HT / 2, ax, ay));
      // A side shows when it faces the viewer: its outward x or y leans toward us.
      const sides = [];
      const a = (ax * Math.PI) / 180, b = (ay * Math.PI) / 180;
      if (Math.sin(b) < 0) sides.push([1, 2]);
      if (Math.sin(b) > 0) sides.push([3, 0]);
      if (Math.sin(a) > 0) sides.push([2, 3]);
      if (Math.sin(a) < 0) sides.push([0, 1]);
      return { top, bot, sides: sides.map(([i, j]) => [top[i], top[j], bot[j], bot[i]]) };
    };
    // The sheen is one soft band of film colour; its ends fade to clear.
    const STOPS = Array.from({ length: 9 }, (_, i) => filmCss(0.24 + (i / 8) * 0.3));
    const swatch = (svg, id, st) => {
      const g = geo(st.ax, st.ay), T = g.top;
      svg.querySelector('.sh').setAttribute('d', poly(T.map(p => [p[0] + 6 + st.ay * 0.12, p[1] + 8 - st.ax * 0.12])));
      svg.querySelectorAll('.sd').forEach((e, i) => e.setAttribute('d', g.sides[i] ? poly(g.sides[i]) : 'M0 0'));
      svg.querySelector('.tp').setAttribute('d', poly(T));
      svg.querySelector('.sn').setAttribute('d', poly(T));
      svg.querySelector('.rm').setAttribute('d', poly(T));
      // The band phase follows the tilt; steeper views shift the colour.
      const ph = (st.ax - st.ay) / 50 - 0.3, gr = svg.querySelector('linearGradient');
      const dx = T[2][0] - T[0][0], dy = T[2][1] - T[0][1];
      gr.setAttribute('x1', f(T[0][0] + dx * ph)); gr.setAttribute('y1', f(T[0][1] + dy * ph));
      gr.setAttribute('x2', f(T[0][0] + dx * (ph + 0.9))); gr.setAttribute('y2', f(T[0][1] + dy * (ph + 0.9)));
      svg.querySelector('.sn').setAttribute('opacity', f(0.55 + 0.35 * Math.min(1, Math.hypot(st.ax, st.ay) / 30)));
    };
    DIRS.push({
      toy: 'oilslick', l: 'A', name: 'Shaded object',
      box: [22, 20, 88, 92],
      art(svg, id) {
        svg.innerHTML = `
          <defs><linearGradient id="${id}g" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="${STOPS[0]}" stop-opacity="0"/>
            ${STOPS.map((c, i) => `<stop offset="${f(0.2 + (i / 8) * 0.6)}" stop-color="${c}"/>`).join('')}
            <stop offset="1" stop-color="${STOPS[8]}" stop-opacity="0"/>
          </linearGradient></defs>
          <path class="sh" fill="${HOLE}"/>
          <path class="sd" fill="oklch(0.2 0.01 260)"/><path class="sd" fill="oklch(0.14 0.01 260)"/>
          <path class="tp" fill="oklch(0.1 0.01 260)"/>
          <path class="sn" fill="url(#${id}g)"/>
          <path class="rm" fill="url(#lit)" stroke="url(#rim)" stroke-width="1.4" stroke-linejoin="round"/>`;
        const st = { ...REST }, draw = () => swatch(svg, id, st);
        draw();
        const to = (ax, ay, d = 0.45) => gsap.to(st, { ax, ay, duration: d, ease: 'power2.out', onUpdate: draw, overwrite: 'auto' });
        return ctl(
          p => to(((p[1] - 64) / 64) * -32, ((p[0] - 64) / 64) * 32),
          () => to(REST.ax, REST.ay, 0.6),
          () => gsap.timeline({ repeat: -1, onUpdate: draw }).to(st, { ax: -24, ay: 26, duration: 0.9, ease: 'sine.inOut' }).to(st, { ax: 26, ay: -20, duration: 0.9, ease: 'sine.inOut' }));
      },
      emblem: (() => {
        const g = geo(REST.ax, REST.ay), T = g.top;
        return emb(`
          ${g.sides.map(s => `<path d="${poly(s)}" fill="#888"/>`).join('\n')}
          <path d="${poly(T)}" fill="#fff"/>
          <path d="M${f(T[0][0] + (T[1][0] - T[0][0]) * 0.55)} ${f(T[0][1] + (T[1][1] - T[0][1]) * 0.55)}L${f(T[3][0] + (T[2][0] - T[3][0]) * 0.25)} ${f(T[3][1] + (T[2][1] - T[3][1]) * 0.25)}" stroke="#000" stroke-width="5"/>
          <path d="M${f(T[0][0] + (T[1][0] - T[0][0]) * 0.85)} ${f(T[0][1] + (T[1][1] - T[0][1]) * 0.85)}L${f(T[3][0] + (T[2][0] - T[3][0]) * 0.55)} ${f(T[3][1] + (T[2][1] - T[3][1]) * 0.55)}" stroke="#000" stroke-width="3"/>
        `);
      })(),
    });
  }

  /* ================= B · Stencil cut-out ================= */

  // A fingerprint pressed into oil: its ridges are cut through a film tile.
  // The core of the whorl follows the pointer, as a pressing finger would.
  {
    const BASE = [64, 62], N = 10;
    const ridges = core => Array.from({ length: N }, (_, k) => {
      const t = k / (N - 1), r = 3.4 + k * 3.7;
      const cx = core[0] + (BASE[0] - core[0]) * t, cy = core[1] + (BASE[1] - core[1]) * t;
      return smoothD(ring(cx, cy, r * 0.88, r * 1.1, 0.03, k * 0.9, 40));
    });
    const DASH = k => ['30 4 66 0', '58 3 39 0', '22 3 40 4 31 0', '70 4 26 0', '44 3 53 0'][k % 5];
    DIRS.push({
      toy: 'oilslick', l: 'B', name: 'Stencil cut-out',
      box: [14, 14, 100, 100],
      art(svg, id) {
        svg.innerHTML = `
          <defs><clipPath id="${id}c"><ellipse cx="64" cy="64" rx="34" ry="42"/></clipPath></defs>
          <rect x="20" y="20" width="100" height="100" rx="16" fill="${HOLE}"/>
          <rect x="14" y="14" width="100" height="100" rx="16" fill="url(#os-film)"/>
          <rect x="14" y="14" width="100" height="100" rx="16" fill="url(#lit)"/>
          <g clip-path="url(#${id}c)" fill="none" style="stroke: var(--bg)" stroke-width="2.6" stroke-linecap="round">
            ${Array.from({ length: N }, (_, k) => `<path class="r" pathLength="100" stroke-dasharray="${DASH(k)}"/>`).join('')}
          </g>`;
        const paths = [...svg.querySelectorAll('.r')], st = { x: BASE[0], y: BASE[1] };
        const draw = () => ridges([st.x, st.y]).forEach((d, k) => paths[k].setAttribute('d', d));
        draw();
        const to = (x, y, d = 0.35) => gsap.to(st, { x, y, duration: d, ease: 'power2.out', onUpdate: draw, overwrite: 'auto' });
        // The core stays inside the fingertip.
        const aim = p => { const dx = p[0] - BASE[0], dy = p[1] - BASE[1], m = Math.hypot(dx, dy), s = m > 16 ? 16 / m : 1; to(BASE[0] + dx * s, BASE[1] + dy * s); };
        return ctl(aim, () => to(BASE[0], BASE[1], 0.6),
          () => gsap.timeline({ repeat: -1, onUpdate: draw }).to(st, { x: 76, y: 52, duration: 0.7, ease: 'sine.inOut' }).to(st, { x: 52, y: 74, duration: 0.9, ease: 'sine.inOut' }).to(st, { x: 64, y: 62, duration: 0.6, ease: 'sine.inOut' }));
      },
      emblem: emb(`
        <clipPath id="c"><ellipse cx="64" cy="64" rx="34" ry="42"/></clipPath>
        <mask id="m">
        <rect x="14" y="14" width="100" height="100" rx="16" fill="#fff"/>
        <g clip-path="url(#c)" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round">
        ${ridges(BASE).map((d, k) => `<path d="${d}" pathLength="100" stroke-dasharray="${DASH(k)}"/>`).join('\n')}
        </g>
        </mask>
        <rect x="14" y="14" width="100" height="100" rx="16" fill="#fff" mask="url(#m)"/>
      `),
    });
  }

  /* ================= C · Single-weight line ================= */

  // Seven sheen lines lie on still water; the pointer parts them like a wake.
  {
    const N = 7, M = 34;
    const lines = (q, t, amp) => Array.from({ length: N }, (_, k) => {
      const y0 = 28 + k * 12;
      return Array.from({ length: M }, (_, i) => {
        const x = 14 + (i / (M - 1)) * 100;
        let y = y0 + 2.2 * Math.sin(x * 0.09 + k * 0.8 + t);
        if (q) {
          const d2 = (x - q[0]) ** 2 + (y0 - q[1]) ** 2;
          y += amp * Math.exp(-d2 / 260) * (y0 >= q[1] ? 1 : -1);
        }
        return [x, y];
      });
    });
    const COLS = Array.from({ length: N }, (_, k) => filmCss(0.2 + k * 0.075));
    DIRS.push({
      toy: 'oilslick', l: 'C', name: 'Single-weight line',
      box: [12, 18, 104, 90],
      art(svg) {
        svg.innerHTML = `<g fill="none" stroke-width="3.5" stroke-linecap="round">${COLS.map(c => `<path class="l" stroke="${c}"/>`).join('')}</g>`;
        const paths = [...svg.querySelectorAll('.l')], st = { t: 0, amp: 0, x: 64, y: 64 };
        const draw = () => lines([st.x, st.y], st.t, st.amp).forEach((P, k) => paths[k].setAttribute('d', openD(P)));
        draw();
        let run = null;
        // The water keeps moving while the pointer is over it.
        const go = () => { run ||= gsap.to(st, { t: '+=6.2832', duration: 3, ease: 'none', repeat: -1, onUpdate: draw }); };
        return ctl(
          p => { go(); gsap.to(st, { x: p[0], y: p[1], amp: 9, duration: 0.25, ease: 'power2.out', overwrite: 'auto' }); },
          () => { run?.kill(); run = null; gsap.to(st, { amp: 0, t: 0, duration: 0.7, ease: 'power2.inOut', onUpdate: draw, overwrite: 'auto' }); },
          () => { go(); return gsap.timeline({ repeat: -1 }).fromTo(st, { x: 10, y: 60, amp: 9 }, { x: 118, y: 66, duration: 2.2, ease: 'sine.inOut' }); });
      },
      emblem: emb(`
        <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
        ${lines(null, 0, 0).map(P => `<path d="${openD(P)}"/>`).join('\n')}
        </g>
      `),
    });
  }

  /* ================= D · Isometric block ================= */

  // A block of water with a layer of oil on top. The pointer pulls the layer
  // thicker or thinner, and its colour runs through the film's orders.
  {
    const T = [64, 44], UR = [104, 67], C0 = [64, 90], UL = [24, 67], H = 18, MAXH = 16;
    const up = (p, h) => [p[0], p[1] - h];
    const REST_H = 3.2;
    const layer = (svg, id, h) => {
      const t = [T, UR, C0, UL].map(p => up(p, h));
      svg.querySelector('.ol').setAttribute('d', poly([UL, C0, ...[C0, UL].map(p => up(p, h)).reverse()]));
      svg.querySelector('.or').setAttribute('d', poly([C0, UR, up(UR, h), up(C0, h)]));
      svg.querySelector('.ot').setAttribute('d', poly(t));
      const c = h / MAXH, g = svg.querySelectorAll('linearGradient stop');
      g[0].setAttribute('stop-color', filmCss(Math.max(0, c - 0.05))); g[1].setAttribute('stop-color', filmCss(c)); g[2].setAttribute('stop-color', filmCss(Math.min(1, c + 0.05)));
      svg.querySelector('.ol').setAttribute('fill', filmCss(c)); svg.querySelector('.or').setAttribute('fill', filmCss(c));
    };
    DIRS.push({
      toy: 'oilslick', l: 'D', name: 'Isometric block',
      box: [24, 26, 80, 82],
      art(svg, id) {
        svg.innerHTML = `
          <defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0"/><stop offset="0.5"/><stop offset="1"/></linearGradient></defs>
          <path d="${poly([UL, C0, [C0[0], C0[1] + H], [UL[0], UL[1] + H]])}" fill="oklch(0.3 0.06 245)"/>
          <path d="${poly([C0, UR, [UR[0], UR[1] + H], [C0[0], C0[1] + H]])}" fill="oklch(0.2 0.05 245)"/>
          <path d="${poly([T, UR, C0, UL])}" fill="oklch(0.16 0.03 245)"/>
          <path class="ol"/><path class="or"/>
          <path d="M0 0" class="ds" fill="#000" opacity="0.35"/>
          <path class="ot" fill="url(#${id}g)"/>
          <path class="ot2" fill="url(#lit)" opacity="0.5"/>`;
        const st = { h: REST_H };
        const draw = () => {
          layer(svg, id, st.h);
          svg.querySelector('.ds').setAttribute('d', poly([C0, UR, up(UR, st.h), up(C0, st.h)]));
          svg.querySelector('.ot2').setAttribute('d', svg.querySelector('.ot').getAttribute('d'));
        };
        draw();
        const to = (h, d = 0.35) => gsap.to(st, { h, duration: d, ease: 'power2.out', onUpdate: draw, overwrite: 'auto' });
        return ctl(
          p => to(Math.max(0.4, Math.min(MAXH, ((96 - p[1]) / 72) * MAXH))),
          () => to(REST_H, 0.6),
          () => gsap.timeline({ repeat: -1, onUpdate: draw }).to(st, { h: MAXH, duration: 1.4, ease: 'sine.inOut' }).to(st, { h: 0.4, duration: 1.4, ease: 'sine.inOut' }));
      },
      emblem: emb(`
        <path d="${poly([UL, C0, [C0[0], C0[1] + H], [UL[0], UL[1] + H]])}" fill="#fff"/>
        <path d="${poly([C0, UR, [UR[0], UR[1] + H], [C0[0], C0[1] + H]])}" fill="#aaa"/>
        <path d="${poly([T, UR, C0, UL].map(p => up(p, 6)))}" fill="#fff"/>
        <path d="${poly([UL, C0, up(C0, 6), up(UL, 6)])}" fill="#000"/>
        <path d="${poly([C0, UR, up(UR, 6), up(C0, 6)])}" fill="#000"/>
      `),
    });
  }

  /* ================= E · Abstract mark ================= */

  // A black splat of oil with a film-lit rim; its droplets flee the pointer,
  // and the rim's sheen turns to face it.
  {
    const BLOB = smoothD(ring(62, 64, 30, 27, 0.15, 1.2, 16));
    const DROPS = [[18, 40, 4.6], [70, 44, 3.2], [128, 41, 5], [196, 45, 2.6], [250, 42, 4], [310, 46, 3]].map(([a, d, r]) => [62 + d * Math.cos((a * Math.PI) / 180), 64 + d * Math.sin((a * Math.PI) / 180), r]);
    DIRS.push({
      toy: 'oilslick', l: 'E', name: 'Abstract mark',
      box: [14, 14, 100, 100],
      art(svg, id) {
        const STOPS = Array.from({ length: 8 }, (_, i) => filmCss(0.25 + i * 0.07));
        svg.innerHTML = `
          <defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="0">${STOPS.map((c, i) => `<stop offset="${f(i / 7)}" stop-color="${c}"/>`).join('')}</linearGradient></defs>
          <path d="${BLOB}" transform="translate(5 6)" fill="${HOLE}"/>
          <path d="${BLOB}" fill="oklch(0.1 0.01 260)"/>
          ${DROPS.map(([x, y, r]) => `<circle class="d" cx="${f(x)}" cy="${f(y)}" r="${r}" fill="oklch(0.1 0.01 260)" stroke="url(#${id}g)" stroke-width="1.4"/>`).join('')}
          <path d="${BLOB}" fill="none" stroke="url(#${id}g)" stroke-width="3.2"/>
          <ellipse cx="50" cy="50" rx="7" ry="3.4" transform="rotate(-35 50 50)" fill="#fff" opacity="0.4"/>`;
        const g = svg.querySelector('linearGradient'), drops = [...svg.querySelectorAll('.d')], st = { a: -40 };
        const paint = () => g.setAttribute('gradientTransform', `rotate(${f(st.a)} 0.5 0.5)`);
        paint();
        const aim = p => {
          gsap.to(st, { a: (Math.atan2(p[1] - 64, p[0] - 62) * 180) / Math.PI, duration: 0.5, ease: 'power2.out', onUpdate: paint, overwrite: 'auto' });
          drops.forEach((e, i) => {
            const [x, y] = DROPS[i], dx = x - p[0], dy = y - p[1], m = Math.hypot(dx, dy) + 1e-3, w = 9 * Math.exp(-(m * m) / 500);
            gsap.to(e, { x: (dx / m) * w, y: (dy / m) * w, duration: 0.3, ease: 'power2.out', overwrite: 'auto' });
          });
        };
        return ctl(aim,
          () => { gsap.to(st, { a: -40, duration: 0.6, onUpdate: paint, overwrite: 'auto' }); gsap.to(drops, { x: 0, y: 0, duration: 0.6, ease: 'elastic.out(1, 0.5)', overwrite: 'auto' }); },
          () => { const s = { a: 0 }; return gsap.to(s, { a: 1, duration: 2.4, repeat: -1, ease: 'none', onUpdate: () => aim([62 + 40 * Math.cos(s.a * 6.2832), 64 + 40 * Math.sin(s.a * 6.2832)]) }); });
      },
      emblem: emb(`
        <path d="${BLOB}" fill="#fff"/>
        ${DROPS.map(([x, y, r]) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="#fff"/>`).join('\n')}
      `),
    });
  }

  /* ================= Gallery ================= */

  const NAMES = { oilslick: 'Oil slick' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || (D.emblem ? `spike/emblems/${file}.svg` : '');
      if (D.emblem) window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
