<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Water wheel 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Water wheel 1</h1>
<p class="lede">Water wheel, round 1. No pick yet; A goes on the menu until Tom picks. A: an overshot wheel of dark wood, fed by a flume, the buckets on its far side full of water. D: the mill pond is the block; the wheel turns against its right face.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };


  // The toy's tokens: dark oiled wood, backlit water, a warm low sun.
  const WOOD = [[0, 'oklch(0.56 0.085 58)'], [1, 'oklch(0.36 0.06 45)']];
  const BOARD = [[0, 'oklch(0.66 0.08 65)'], [1, 'oklch(0.46 0.07 52)']];
  const WATER = [[0, 'oklch(0.97 0.03 200)'], [1, 'oklch(0.8 0.08 215)']];
  const POND = [[0, 'oklch(0.62 0.1 215)'], [1, 'oklch(0.38 0.08 235)']];
  const BACK = 'oklch(0.24 0.04 40)', AXLE = 'oklch(0.2 0.02 40)', FILL = 'oklch(0.9 0.06 205)';
  const TAU = Math.PI * 2;

  // One wheel, drawn flat round (0, 0): band R0 to R1, buckets, arms and hub.
  // Angles run clockwise from the top; y points down.
  const NB = 12, NA = 6, R1 = 38, R0 = 26, LEAN = 0.45 * (TAU / NB);
  const at = (a, r) => [r * Math.sin(a), -r * Math.cos(a)];
  const ring = (r0, r1) => `M${r1} 0A${r1} ${r1} 0 1 0 ${-r1} 0A${r1} ${r1} 0 1 0 ${r1} 0ZM${r0} 0A${r0} ${r0} 0 1 1 ${-r0} 0A${r0} ${r0} 0 1 1 ${r0} 0Z`;
  // A bucket board runs from the sole out to the rim, leaning back.
  const board = a => poly([at(a - 0.05, R0 + 1), at(a + 0.05, R0 + 1), at(a + 0.04 - LEAN, R1 - 1), at(a - 0.04 - LEAN, R1 - 1)]);
  const arm = a => poly([at(a - 0.2, 6), at(a + 0.2, 6), at(a + 0.085, R0 + 1), at(a - 0.085, R0 + 1)]);
  const wheelMarkup = u => `<path d="${ring(R0 - 1, R1)}" fill="${BACK}" fill-rule="evenodd"/>
    <g class="fills"></g>
    <g class="turn">
      <path d="${Array.from({ length: NB }, (_, k) => board((k * TAU) / NB)).join('')}" fill="url(#${u}wood)"/>
      ${body(ring(R1 - 4, R1), u, 'wood', ' fill-rule="evenodd"')}
      ${body(ring(R0 - 1, R0 + 2), u, 'wood', ' fill-rule="evenodd"')}
      ${body(Array.from({ length: NA }, (_, k) => arm((k * TAU) / NA + 0.26)).join(''), u, 'wood')}
      ${body('M8 0A8 8 0 1 1 -8 0A8 8 0 1 1 8 0Z', u, 'wood')}
      <circle r="3" fill="${AXLE}"/>
    </g>`;
  // Water in the buckets on the loaded side: from just past the top to past horizontal.
  // The water line stays level as the wheel turns.
  const fillsOf = (ang, k = 1) => {
    let d = '';
    for (let b = 0; b < NB; b++) {
      const a0 = (((b * TAU) / NB + ang) % TAU + TAU) % TAU, a1 = a0 + TAU / NB;
      if (a0 < 0.05 || a0 > 2.4) continue;
      // Full near the top, emptier as the bucket tips past horizontal.
      const full = k * clamp(1 - (a0 - 1.1) / 1.3);
      if (full < 0.08) continue;
      const pts = [at(a0, R0 + 1), at(a1, R0 + 1), at(a1 - LEAN, R1 - 2), at(a0 - LEAN, R1 - 2)];
      const ys = pts.map(p => p[1]), low = Math.max(...ys), top = Math.min(...ys);
      const level = low - (low - top) * (0.35 + 0.55 * full);
      d += clipBelow(pts, level);
    }
    return d;
  };
  // The part of a polygon under a level line (y down: under is larger y).
  const clipBelow = (pts, level) => {
    const outp = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length], ia = a[1] >= level, ib = b[1] >= level;
      if (ia) outp.push(a);
      if (ia !== ib) { const t = (level - a[1]) / (b[1] - a[1]); outp.push([lerp(a[0], b[0], t), level]); }
    }
    return outp.length > 2 ? poly(outp) : '';
  };

  // The state both icons share: a flow that rises on hover, and a wheel that answers it.
  // At rest the wheel stands still with a trickle and full buckets.
  const REST = 0.4;
  const run = draw => {
    const st = { flow: REST, to: REST, ang: 0, w: 0, t: 0, live: false, last: 0 };
    const step = time => {
      const dt = Math.min(0.1, time - (st.last || time));
      st.last = time; st.t = time;
      st.flow += (st.to - st.flow) * 0.08;
      // The wheel speeds up under flow and runs down slowly without it.
      const goal = st.live ? 0.6 + 2.4 * st.flow : 0;
      st.w += (goal - st.w) * (st.live ? 0.03 : 0.05);
      st.ang += st.w * dt;
      draw(st);
      if (!st.live && st.w < 0.01 && Math.abs(st.flow - REST) < 0.01) {
        Object.assign(st, { w: 0, flow: REST, last: 0, t: 0 });
        draw(st);
        loop.stop();
      }
    };
    const loop = clock(step);
    draw(st);
    return {
      enter(p) { st.live = true; st.to = 1; loop.start(); if (p) this.move(p); },
      // The pointer nearer the flume pours harder.
      move(p) { if (p) st.to = 0.7 + 0.3 * clamp(1 - (p[1] - 20) / 90); },
      leave() { st.live = false; st.to = REST; loop.start(); },
    };
  };
  // Drops fall from the bucket mouths at the bottom right while the wheel turns.
  const dropsDraw = (drops, st, x0, y0, fall) => drops.forEach((c, i) => {
    const ph = (st.t * 1.6 + i / drops.length) % 1, on = st.t ? clamp(st.w / 1.5) : 0;
    c.setAttribute('cx', f(x0 + i * 2.2 + ph * 2));
    c.setAttribute('cy', f(y0 + fall * ph * ph));
    c.setAttribute('opacity', f(on * (1 - ph * 0.6)));
  });

  const DIRS = [];

  /* ================= Current ================= */

  // Water wheel is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // The wheel faces us; a flume comes in from the left over its top.
  const A_C = [68, 70];
  const A_FLUME = 'M6 20H64V27H6Z';
  // The jet leaves the lip, arcs over the top and drops into the first buckets.
  const aJet = k => {
    const w = 2 + 3.4 * k;
    return `M6 ${f(20 - w)}H63Q${f(71 + 3 * k)} ${f(20 - w)} ${f(78 + 2 * k)} 34L${f(73 + k)} 35Q69 20 62 20H6Z`;
  };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [6, 12, 102, 104],
    idea: 'An overshot wheel of dark oiled wood faces us, a low evening sun glowing through its arms: a deep rim of buckets, six arms and a hub on its axle. A flume comes in from the left over its top. The jet arcs off the lip into the buckets just past the top; the buckets on the far side hold water with a level line. At rest a trickle runs and the wheel stands. The pointer pours harder: the jet thickens, the wheel takes up speed and drops fall from the low buckets. It runs down when the pointer leaves.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}
          ${lg(`${u}wood`, WOOD)}${lg(`${u}board`, BOARD)}${lg(`${u}wat`, WATER)}
          ${rg(`${u}sun`, [[0, 'oklch(0.97 0.06 85)'], [0.35, 'oklch(0.85 0.15 65)', 0.85], [1, 'oklch(0.6 0.16 45)', 0]])}</defs>
        <ellipse cx="${A_C[0]}" cy="114" rx="34" ry="3.5" fill="oklch(0.05 0.01 240)" opacity="0.6" filter="url(#${u}b)"/>
        <circle class="sun" cx="${A_C[0] - 9}" cy="${A_C[1] - 8}" r="30" fill="url(#${u}sun)"/>
        <g class="wh" transform="translate(${A_C[0]} ${A_C[1]})">${wheelMarkup(u)}</g>
        ${body(A_FLUME, u, 'board')}

        <path class="jet" fill="url(#${u}wat)"/>
        <g class="drops">${[0, 1, 2].map(() => `<circle r="2.4" fill="${FILL}" opacity="0"/>`).join('')}</g>`;
      const turn = svg.querySelector('.turn'), fills = svg.querySelector('.fills'), jet = svg.querySelector('.jet');
      const drops = [...svg.querySelectorAll('.drops circle')], sun = svg.querySelector('.sun');
      fills.innerHTML = `<path fill="${FILL}"/>`;
      const fp = fills.firstChild;
      return run(st => {
        turn.setAttribute('transform', `rotate(${f((st.ang * 180) / Math.PI)})`);
        fp.setAttribute('d', fillsOf(st.ang, 0.6 + 0.4 * st.flow));
        jet.setAttribute('d', aJet(st.flow));
        // The low sun behind the arms brightens as the wheel turns.
        sun.setAttribute('opacity', f(0.75 + 0.25 * clamp(st.w / 2)));
        dropsDraw(drops, st, A_C[0] + 26, A_C[1] + 28, 16);
      });
    },
    // The emblem is a bold silhouette: a solid disc, the arm windows and bucket mouths cut out.
    emblem: `${EMB_HEAD}<g transform="translate(${A_C[0]} ${A_C[1]})"><circle r="${R1}" fill="#fff"/><path d="${Array.from({ length: NA }, (_, k) => { const a = (k * TAU) / NA + 0.26, b = a + TAU / NA; return poly([at(a + 0.3, 11), at(a + 0.16, R0 - 3), at(b - 0.16, R0 - 3), at(b - 0.3, 11)]); }).join('')}${Array.from({ length: NB }, (_, k) => { const a = (k * TAU) / NB; return poly([at(a + 0.1, R0 + 3), at(a + TAU / NB - 0.12, R0 + 3), at(a + TAU / NB - 0.12 - LEAN, R1 - 3), at(a + 0.1 - LEAN, R1 - 3)]); }).join('')}" fill="#000"/><circle r="3.4" fill="#000"/></g><path d="${A_FLUME}" fill="#fff"/><path d="${aJet(1)}" fill="#fff"/></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The mill pond is the block: water on top, stone faces.
  // The wheel turns against the right face, in that face's plane.
  const CY = 46, HX = 14, HY = 27, T = 42;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // The wheel's centre: the middle of the right face, near its top, a little proud of it.
  const D_SC = 0.58;
  const dC = [lerp(S[0], E[0], 0.5) + 2.6, lerp(S[1], E[1], 0.5) + 26];
  // A point of the flat wheel, on the screen.
  const toS = p => [dC[0] + D_SC * 0.866 * p[0], dC[1] + D_SC * (p[1] - 0.5 * p[0])];
  const D_M = `matrix(${f(0.866 * D_SC)} ${f(-0.5 * D_SC)} 0 ${f(D_SC)} ${f(dC[0])} ${f(dC[1])})`;
  // The notch in the pond's front edge, over the wheel's top, and the sheet that falls from it.
  const lip = lerp(S[0], E[0], 0.42), lipY = lerp(S[1], E[1], 0.42);
  const dJet = k => {
    const w = 2.4 + 2.6 * k, to = toS(at(0.3, R1 - 2));
    return poly([[lip - w, lipY + w * 0.58], [lip + w, lipY - w * 0.58], [to[0] + w * 0.8, to[1] - w * 0.4], [to[0] - w * 0.6, to[1] + w * 0.3]]);
  };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [24, 18, 84, 100],
    idea: 'The mill pond is the block: blue water on top, dark stone on the faces. The wheel turns against the right face, drawn in its plane. A sheet falls from a notch in the pond edge onto the wheel just past its top; the buckets on the far side hold water. The pointer pours harder and the wheel takes up speed; it runs down when the pointer leaves.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}
          ${lg(`${u}pond`, POND, 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}wood`, WOOD)}${lg(`${u}wat`, WATER)}
          ${lg(`${u}stoneL`, [[0, 'oklch(0.5 0.03 55)'], [1, 'oklch(0.36 0.03 45)']])}
          ${lg(`${u}stoneR`, [[0, 'oklch(0.4 0.03 50)'], [1, 'oklch(0.27 0.025 40)']])}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}stoneL)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}stoneR)"/>
        <path d="${top}" fill="url(#${u}pond)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g class="wh" transform="${D_M}">${wheelMarkup(u)}</g>
        <path class="jet" fill="url(#${u}wat)"/>
        <g class="drops">${[0, 1, 2].map(() => `<circle r="2" fill="${FILL}" opacity="0"/>`).join('')}</g>`;
      const turn = svg.querySelector('.turn'), fills = svg.querySelector('.fills'), jet = svg.querySelector('.jet');
      const drops = [...svg.querySelectorAll('.drops circle')];
      fills.innerHTML = `<path fill="${FILL}"/>`;
      const fp = fills.firstChild;
      return run(st => {
        turn.setAttribute('transform', `rotate(${f((st.ang * 180) / Math.PI)})`);
        fp.setAttribute('d', fillsOf(st.ang, 0.6 + 0.4 * st.flow));
        jet.setAttribute('d', dJet(st.flow));
        dropsDraw(drops, st, dC[0] + 9, dC[1] + 2, 22);
      });
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#3a3a3a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#5a5a5a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/><g transform="${D_M}"><path d="${ring(R0 - 1, R1)}" fill="#fff" fill-rule="evenodd"/><path d="${Array.from({ length: NA }, (_, k) => arm((k * TAU) / NA + 0.26)).join('')}M8 0A8 8 0 1 1 -8 0A8 8 0 1 1 8 0Z" fill="#fff"/></g><path d="${dJet(REST)}" fill="#fff"/></svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = 'Water wheel';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-waterwheel';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `waterwheel-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
