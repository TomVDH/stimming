<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 21</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<h1>Icon spike 21</h1>
<p class="lede">Wind map: five refinements of direction A, one per new feature. Move the pointer over a tile.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  // A pointer control from three plain functions; focus plays a demo.
  const ctl = (aim, rest, demo, start = () => {}) => {
    let tl = null;
    return {
      enter(p) { start(); if (p) aim(p); else tl = demo(); },
      move(p) { if (p && !tl) aim(p); },
      leave() { tl?.kill(); tl = null; rest(); },
    };
  };
  // A repeat that runs while the pointer stays.
  const every = (dt, fn) => {
    let dc = null;
    const go = () => { fn(); dc = gsap.delayedCall(dt, go); };
    return { start() { if (!dc) go(); }, stop() { dc?.kill(); dc = null; } };
  };

  /* ================= Wind kit ================= */

  // Tile geometry: the face and its hard shadow, as the menu draws them.
  const T0 = 16, T1 = 108, SHADOW = 'oklch(0.07 0.01 260)';
  const tileBack = (svg, fill) => {
    el('rect', { x: 22, y: 22, width: 92, height: 92, fill: SHADOW }, svg);
    return el('rect', { x: T0, y: T0, width: 92, height: 92, fill }, svg);
  };
  // A storm is { x, y, g }; the field is a westerly plus one storm.
  const RC = 9;
  const vel = (x, y, s, out) => {
    const dx = x - s.x, dy = y - s.y, r2 = dx * dx + dy * dy + 0.01, r = Math.sqrt(r2);
    const vt = (s.g / r) * (1 - Math.exp(-r2 / (RC * RC)));
    // Air converges into the eye, which turns the arms into spirals.
    const inflow = 0.3 * Math.abs(vt) * (1 - clamp((r - RC) / (2 * RC), 0, 1));
    // A light westerly, so the storm's own spin reads at rest.
    out[0] = 0.35 - (dy * vt) / r - (dx * inflow) / r;
    out[1] = (dx * vt) / r - (dy * inflow) / r;
    return out;
  };
  // One streamline from (x, y) until it leaves the box or reaches the eye.
  const tmp = [0, 0];
  const trace = (x, y, s, box = [T0, T0, T1, T1], n = 90, h = 1.6) => {
    const pts = [[x, y]];
    for (let i = 0; i < n; i++) {
      vel(x, y, s, tmp);
      const k = h / Math.max(0.2, Math.hypot(tmp[0], tmp[1]));
      const mx = x + tmp[0] * k / 2, my = y + tmp[1] * k / 2;
      vel(mx, my, s, tmp);
      const k2 = h / Math.max(0.2, Math.hypot(tmp[0], tmp[1]));
      x += tmp[0] * k2; y += tmp[1] * k2;
      if (x < box[0] || y < box[1] || x > box[2] || y > box[3]) break;
      pts.push([x, y]);
      if (Math.hypot(x - s.x, y - s.y) < 3.5) break;
    }
    return pts;
  };
  const line = pts => (pts.length > 1 ? 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') : '');
  // A storm that eases toward the pointer and spins up while it is near.
  const REST = { x: 66, y: 60, g: 12 };
  const stormCtl = (s, draw, { spinUp = false } = {}) => {
    let last = null, sweep = 0;
    const loop = every(1 / 30, () => {
      // Circling the pointer winds the storm up; it relaxes on its own.
      s.g = clamp(s.g * 0.985 + (spinUp ? sweep : 0), 3, 26);
      sweep = 0;
      draw();
    });
    const aim = p => {
      if (spinUp && last) {
        const ax = last[0] - s.x, ay = last[1] - s.y, bx = p[0] - s.x, by = p[1] - s.y;
        sweep += Math.abs(Math.atan2(ax * by - ay * bx, ax * bx + ay * by)) * 0.9;
      }
      last = p;
      gsap.to(s, { x: clamp(p[0], 24, 100), y: clamp(p[1], 24, 100), g: spinUp ? s.g : 16, duration: 0.45, ease: 'power2.out', overwrite: 'auto', onUpdate: draw });
    };
    const rest = () => { last = null; loop.stop(); gsap.to(s, { ...REST, duration: 0.8, ease: 'power2.inOut', overwrite: 'auto', onUpdate: draw }); };
    const demo = () => {
      loop.start();
      const d = { a: 0 };
      return gsap.to(d, { a: TAU, duration: 3, repeat: -1, ease: 'none', onUpdate: () => aim([64 + 22 * Math.cos(d.a), 62 + 18 * Math.sin(d.a)]) });
    };
    return ctl(aim, rest, demo, () => loop.start());
  };
  const SEEDS = n => Array.from({ length: n }, (_, i) => T0 + 4 + (i + 0.5) * (84 / n));
  // Spiral arms start on a ring and wind into the eye.
  const arms = (s, n = 4, R = 30, box) => Array.from({ length: n }, (_, k) => {
    const a = (k / n) * TAU + 0.4;
    return trace(s.x + R * Math.cos(a), s.y + R * Math.sin(a), s, box, 160, 1.3);
  });
  const ARMS = 4;

  // Shared for every variant: the slate tile, its clip, the grid and the eye.
  const chartTile = (svg, id, grid = true) => {
    const defs = el('defs', {}, svg);
    const g = el('linearGradient', { id: `${id}sh`, x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
    el('stop', { offset: 0, 'stop-color': 'oklch(0.32 0.03 245)' }, g);
    el('stop', { offset: 1, 'stop-color': 'oklch(0.2 0.025 255)' }, g);
    const cp = el('clipPath', { id: `${id}c` }, defs);
    el('rect', { x: T0, y: T0, width: 92, height: 92 }, cp);
    tileBack(svg, `url(#${id}sh)`);
    if (grid) el('path', { d: 'M16 46H108M16 78H108M46 16V108M78 16V108', stroke: 'oklch(0.36 0.03 245)', 'stroke-width': 0.8 }, svg);
    return { defs, clip: `url(#${id}c)` };
  };
  // Speed of the field at a point, for the Heat ramp.
  const speed = (x, y, s) => { vel(x, y, s, tmp); return Math.hypot(tmp[0], tmp[1]); };
  const heat = u => (u < 0.5 ? `oklch(${f(0.5 + 0.5 * u)} ${f(0.08 + 0.12 * u)} ${f(250 - 200 * u)})` : `oklch(${f(0.75 + 0.2 * (u - 0.5))} ${f(0.14 + 0.06 * (u - 0.5))} ${f(150 - 160 * (u - 0.5))})`);
  // A line split into short runs, so each run takes its own colour.
  const runs = (pts, n = 6) => { const out = []; for (let i = 0; i < pts.length - 1; i += n) out.push(pts.slice(i, Math.min(pts.length, i + n + 1))); return out.filter(r => r.length > 1); };
  const traceP = (x, y, s, box, n, h) => trace(x, y, s, box, n, h);
  const silkLines = (svg, clip, s, opts = {}) => {
    const lines = el('g', { 'clip-path': clip, fill: 'none', stroke: opts.ink || 'oklch(0.95 0.01 250)', 'stroke-linecap': 'round' }, svg);
    const ys = SEEDS(opts.n || 9), flow = ys.map((y, i) => el('path', { 'stroke-width': 1, opacity: i % 2 ? 0.45 : 0.7 }, lines));
    const ap = Array.from({ length: ARMS }, () => el('path', { 'stroke-width': 1.8 }, lines));
    return { ys, flow, ap, draw(map = p => p) { ys.forEach((y, i) => flow[i].setAttribute('d', line(trace(T0, y, s).map(map)))); arms(s).forEach((pts, k) => ap[k].setAttribute('d', line(pts.map(map)))); } };
  };

  const DIRS = [
    {
      toy: 'windmap', l: 'A', name: 'Silk, lit',
      // The picked chart, with a glowing eye that breathes with the storm.
      art(svg, id) {
        const { defs, clip } = chartTile(svg, id);
        const rg = el('radialGradient', { id: `${id}gl` }, defs);
        el('stop', { offset: 0, 'stop-color': 'oklch(0.95 0.04 80)', 'stop-opacity': 0.55 }, rg);
        el('stop', { offset: 1, 'stop-color': 'oklch(0.95 0.04 80)', 'stop-opacity': 0 }, rg);
        const glow = el('circle', { r: 16, fill: `url(#${id}gl)` }, svg);
        const s = { ...REST }, L = silkLines(svg, clip, s);
        const eye = el('circle', { r: 3.4, fill: 'oklch(0.14 0.02 255)' }, svg);
        const draw = () => { L.draw(); [glow, eye].forEach(c => { c.setAttribute('cx', f(s.x)); c.setAttribute('cy', f(s.y)); }); glow.setAttribute('r', f(10 + s.g * 0.6)); };
        draw();
        return stormCtl(s, draw);
      },
      emblemUrl: 'spike/emblems/windmap-a.svg',
    },
    {
      toy: 'windmap', l: 'B', name: 'Dye',
      // Each line keeps the hue of the latitude it starts at; the storm mixes them.
      art(svg, id) {
        const { clip } = chartTile(svg, id);
        const g = el('g', { 'clip-path': clip, fill: 'none', 'stroke-linecap': 'round' }, svg);
        const ys = SEEDS(11), hue = y => 20 + 300 * (y - T0) / 92;
        const flow = ys.map(y => el('path', { 'stroke-width': 1.5, stroke: `oklch(0.78 0.13 ${f(hue(y))})` }, g));
        const ring = Array.from({ length: ARMS }, (_, k) => el('path', { 'stroke-width': 2, stroke: `oklch(0.82 0.13 ${f(40 + k * 80)})` }, g));
        const eye = el('circle', { r: 3.4, fill: 'oklch(0.14 0.02 255)' }, svg);
        const s = { ...REST };
        const draw = () => { ys.forEach((y, i) => flow[i].setAttribute('d', line(trace(T0, y, s)))); arms(s).forEach((pts, k) => ring[k].setAttribute('d', line(pts))); eye.setAttribute('cx', f(s.x)); eye.setAttribute('cy', f(s.y)); };
        draw();
        return stormCtl(s, draw);
      },
      emblemUrl: 'spike/emblems/windmap-a.svg',
    },
    {
      toy: 'windmap', l: 'C', name: 'Heat',
      // Lines run slow blue to fast amber; the storm's arms burn hottest.
      art(svg, id) {
        const { clip } = chartTile(svg, id, false);
        const g = el('g', { 'clip-path': clip, fill: 'none', 'stroke-linecap': 'round', 'stroke-width': 1.6 }, svg);
        const eye = el('circle', { r: 3.4, fill: 'oklch(0.14 0.02 255)' }, svg);
        const s = { ...REST };
        const draw = () => {
          g.replaceChildren();
          const all = SEEDS(9).map(y => trace(T0, y, s)).concat(arms(s));
          for (const pts of all) for (const r of runs(pts)) {
            const m = r[Math.floor(r.length / 2)], u = clamp((speed(m[0], m[1], s) - 0.3) / 1.4, 0, 1);
            el('path', { d: line(r), stroke: heat(u) }, g);
          }
          eye.setAttribute('cx', f(s.x)); eye.setAttribute('cy', f(s.y));
        };
        draw();
        return stormCtl(s, draw);
      },
      emblemUrl: 'spike/emblems/windmap-a.svg',
    },
    {
      toy: 'windmap', l: 'D', name: 'Globe',
      // The chart wraps onto a lit globe; the storm rides its curve.
      art(svg, id) {
        const C = [62, 62], Rg = 40;
        el('circle', { cx: C[0] + 6, cy: C[1] + 6, r: Rg, fill: SHADOW }, svg);
        // The pole axis runs behind the sphere; its stubs show past each pole.
        el('path', { d: `M${C[0]} ${C[1] - Rg - 10}V${C[1] + Rg + 10}`, stroke: 'oklch(0.85 0.03 240)', 'stroke-width': 1.6, 'stroke-linecap': 'round' }, svg);
        const defs = el('defs', {}, svg);
        const sh = el('radialGradient', { id: `${id}sp`, cx: 0.38, cy: 0.32, r: 0.75 }, defs);
        el('stop', { offset: 0, 'stop-color': 'oklch(0.34 0.035 240)' }, sh);
        el('stop', { offset: 1, 'stop-color': 'oklch(0.16 0.025 258)' }, sh);
        const cp = el('clipPath', { id: `${id}k` }, defs);
        el('circle', { cx: C[0], cy: C[1], r: Rg }, cp);
        el('circle', { cx: C[0], cy: C[1], r: Rg, fill: `url(#${id}sp)` }, svg);
        // Tile space bends onto the sphere: the edge folds toward the limb.
        const map = ([x, y]) => { const u = (x - 62) / 46, v = (y - 62) / 46, r = Math.hypot(u, v), k = r > 0 ? Math.sin(Math.min(r, 1) * Math.PI / 2) / r : 1; return [C[0] + u * k * Rg, C[1] + v * k * Rg]; };
        const unmap = ([px, py]) => { const u = (px - C[0]) / Rg, v = (py - C[1]) / Rg, r = Math.hypot(u, v), k = r > 0 ? (Math.asin(Math.min(r, 1)) * 2 / Math.PI) / r : 1; return [62 + u * k * 46, 62 + v * k * 46]; };
        const grat = el('g', { 'clip-path': `url(#${id}k)`, fill: 'none', stroke: 'oklch(0.4 0.03 240)', 'stroke-width': 0.7 }, svg);
        [-0.5, 0, 0.5].forEach(t => { el('ellipse', { cx: C[0], cy: C[1], rx: f(Rg * Math.cos(t * 1.2)), ry: Rg }, grat); el('path', { d: `M${C[0] - Rg} ${f(C[1] + t * Rg)}H${C[0] + Rg}` }, grat); });
        const s = { ...REST };
        const L = silkLines(svg, `url(#${id}k)`, s);
        const eye = el('circle', { r: 3, fill: 'oklch(0.14 0.02 255)' }, svg);
        el('circle', { cx: C[0], cy: C[1], r: Rg - 0.6, fill: 'none', stroke: 'oklch(0.78 0.08 235)', 'stroke-width': 1.4, opacity: 0.75 }, svg);
        el('path', { d: `M${C[0]} ${C[1] - Rg}V${C[1] + Rg}`, stroke: 'oklch(0.85 0.03 240)', 'stroke-width': 0.8, 'stroke-dasharray': '2.5 2.5', opacity: 0.45 }, svg);
        el('circle', { cx: C[0], cy: C[1] - Rg, r: 1.8, fill: 'oklch(0.9 0.03 240)' }, svg);
        const draw = () => { L.draw(map); const e = map([s.x, s.y]); eye.setAttribute('cx', f(e[0])); eye.setAttribute('cy', f(e[1])); };
        draw();
        const c = stormCtl(s, draw);
        return { enter: p => c.enter(p && unmap(p)), move: p => c.move(p && unmap(p)), leave: c.leave };
      },
      emblemUrl: 'spike/emblems/windmap-21d.svg',
      emblem: emb(`
        <path d="M64 4V124" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <circle cx="64" cy="64" r="44" fill="#000" stroke="#fff" stroke-width="7"/>
        <path d="M44 64C44 48 60 40 72 46S86 66 72 72S56 66 62 58" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        <path d="M18 50Q64 40 110 50M18 80Q64 90 110 80" fill="none" stroke="#8c8c8c" stroke-width="5" stroke-linecap="round"/>
      `),
    },
    {
      toy: 'windmap', l: 'E', name: 'Weather chart',
      // Silk, a warm and a cold front off the low, and its L.
      art(svg, id) {
        const { clip } = chartTile(svg, id);
        const s = { ...REST }, L = silkLines(svg, clip, s, { ink: 'oklch(0.85 0.01 250)' });
        const fr = el('g', { 'clip-path': clip }, svg);
        const mark = el('text', { 'font-family': '"Iosevka Term Slab", ui-monospace, monospace', 'font-weight': 700, 'font-size': 11, fill: 'oklch(0.97 0.01 80)', 'text-anchor': 'middle', 'dominant-baseline': 'central' }, svg);
        mark.textContent = 'L';
        // A front curls out from the eye; symbols sit on its leading side.
        const front = (bearing, warm) => {
          const pts = [];
          for (let i = 0; i <= 14; i++) { const r = 8 + i * 2.6, a = bearing + i * 0.09; pts.push([s.x + r * Math.cos(a), s.y + r * Math.sin(a)]); }
          const ink = warm ? 'oklch(0.66 0.15 28)' : 'oklch(0.66 0.12 250)';
          el('path', { d: line(pts), fill: 'none', stroke: ink, 'stroke-width': 1.6 }, fr);
          for (let i = 2; i < pts.length - 1; i += 3) {
            const [ax, ay] = pts[i], [bx, by] = pts[i + 1], d = Math.hypot(bx - ax, by - ay), tx = (bx - ax) / d, ty = (by - ay) / d, nx = ty, ny = -tx;
            if (warm) el('path', { d: `M${f(ax - tx * 2.6)} ${f(ay - ty * 2.6)}A2.6 2.6 0 0 1 ${f(ax + tx * 2.6)} ${f(ay + ty * 2.6)}Z`, fill: ink }, fr);
            else el('path', { d: `M${f(ax - tx * 2.6)} ${f(ay - ty * 2.6)}L${f(ax + nx * 3.4)} ${f(ay + ny * 3.4)}L${f(ax + tx * 2.6)} ${f(ay + ty * 2.6)}Z`, fill: ink }, fr);
          }
        };
        const draw = () => {
          L.draw(); fr.replaceChildren();
          const turn = (s.g - 12) * 0.08;
          front(0.6 + turn, true); front(2.7 + turn, false);
          mark.setAttribute('x', f(s.x)); mark.setAttribute('y', f(s.y));
        };
        draw();
        return stormCtl(s, draw);
      },
      emblemUrl: 'spike/emblems/windmap-21e.svg',
      emblem: emb(`
        <rect x="8" y="8" width="112" height="112" fill="none" stroke="#fff" stroke-width="6"/>
        <path d="M70 58Q86 48 104 50" fill="none" stroke="#fff" stroke-width="5"/>
        <path d="M80 52A5 5 0 0 1 90 50ZM92 49A5 5 0 0 1 102 49Z" fill="#fff"/>
        <path d="M56 72Q44 90 30 100" fill="none" stroke="#8c8c8c" stroke-width="5"/>
        <path d="M47 82L40 80L45 89ZM39 92L32 90L36 99Z" fill="#8c8c8c"/>
        <text x="62" y="66" font-family="monospace" font-weight="700" font-size="34" fill="#fff" text-anchor="middle" dominant-baseline="central">L</text>
      `),
    },
  ];

  /* ================= Gallery ================= */

  const NAMES = { windmap: 'Wind map' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || (D.emblem ? `spike/emblems/${file}.svg` : '');
      if (D.emblem) window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const c = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => c.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => c.leave());
        tile.addEventListener('focus', () => c.enter(null));
        tile.addEventListener('blur', () => c.leave());
      });
    }
  }
})();
</script>
</body>
</html>
