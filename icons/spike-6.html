<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 6</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- Cones take light from the left. -->
    <linearGradient id="f-cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color: oklch(0.5 0.03 240)"/>
      <stop offset="0.38" style="stop-color: oklch(0.22 0.015 265)"/>
      <stop offset="0.72" style="stop-color: oklch(0.1 0.01 265)"/>
      <stop offset="1" style="stop-color: oklch(0.3 0.06 210)"/>
    </linearGradient>
  </defs>
</svg>

<h1>Icon spike 6</h1>
<p class="lede">Ferrofluid, Caustic pool. Current, then A to E.</p>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2, PI = Math.PI;
  const BG = 'oklch(0.16 0.012 275)';
  const f = n => +(+n).toFixed(2);
  const P2 = p => `${f(p[0])} ${f(p[1])}`;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).join('\n')}\n</svg>\n`;
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };
  // A loop phase settles on the nearest whole turn.
  const settle = (st, key, onUpdate, d = 0.5) => gsap.to(st, { [key]: Math.round(st[key]), duration: d, ease: 'power2.out', overwrite: true, onUpdate });
  // Isometric projection: u runs down right, v down left, z up.
  const iso = (R, Yc) => (u, v, z = 0) => [64 + (u - v) * 0.866 * R, Yc + (u + v) * 0.5 * R - z];
  const poly = pts => 'M' + pts.map(P2).join('L') + 'Z';
  // A teardrop: point on top, round base; s is the base radius.
  const tear = (cx, cy, s) => `M${f(cx)} ${f(cy - 1.6 * s)}C${f(cx + 0.32 * s)} ${f(cy - 1.05 * s)} ${f(cx + s)} ${f(cy - 0.5 * s)} ${f(cx + s)} ${f(cy + 0.3 * s)}A${f(s)} ${f(s)} 0 0 1 ${f(cx - s)} ${f(cy + 0.3 * s)}C${f(cx - s)} ${f(cy - 0.5 * s)} ${f(cx - 0.32 * s)} ${f(cy - 1.05 * s)} ${f(cx)} ${f(cy - 1.6 * s)}Z`;

  const DIRS = [];

  /* ================= Ferrofluid ================= */

  // Current: the menu icon, copied from the root page.
  {
    const crownD = reach => {
      const n = 14, inner = 30, d = [];
      for (let k = 0; k < n; k++) {
        const a = (k * TAU) / n - PI / 2, tip = inner + (k % 2 ? 15 : 22) * reach;
        const a0 = a - PI / n, a1 = a + PI / n;
        const p = (r, t) => `${(64 + r * Math.cos(t)).toFixed(1)} ${(64 + r * Math.sin(t)).toFixed(1)}`;
        d.push(`${k ? 'L' : 'M'}${p(inner, a0)}Q${p(inner + 4, a - 0.05)} ${p(tip, a)}Q${p(inner + 4, a + 0.05)} ${p(inner, a1)}`);
      }
      return d.join('') + 'Z';
    };
    DIRS.push({
      toy: 'ferro', l: 'Current', current: true,
      art(svg, u) {
        svg.innerHTML = `
          <linearGradient id="${u}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.42 0.02 270)"/><stop offset="0.45" stop-color="oklch(0.2 0.012 270)"/><stop offset="0.7" stop-color="oklch(0.34 0.02 265)"/><stop offset="1" stop-color="oklch(0.12 0.01 270)"/></linearGradient>
          <path class="crown" fill="url(#${u}g)"/>
          <circle cx="64" cy="64" r="21" fill="none" stroke="oklch(0.6 0.02 265)" stroke-width="2"/>
          <circle cx="64" cy="64" r="8" fill="oklch(0.6 0.02 265)"/>`;
        const crown = svg.querySelector('.crown'), st = { reach: 1 };
        const draw = () => crown.setAttribute('d', crownD(st.reach));
        draw();
        return hoverLoop(
          () => gsap.timeline({ repeat: -1, yoyo: true }).to(st, { reach: 0.55, duration: 0.7, ease: 'sine.inOut', onUpdate: draw }),
          () => gsap.to(st, { reach: 1, duration: 0.4, ease: 'back.out(2)', onUpdate: draw }));
      },
    });
  }

  // A: the dish in side view; the spikes gather under the pointer.
  {
    const FX = Array.from({ length: 9 }, (_, i) => 30 + 8.5 * i);
    const BX = Array.from({ length: 8 }, (_, i) => 34.25 + 8.5 * i);
    const W = 7.2, REST = { mx: 64, H: 46, sig: 20 };
    // One row of cones over a low mound; the puddle edge tapers to zero.
    const row = (st, xs, base, gain) => {
      const m = x => 4 + st.H * 0.12 * Math.exp(-(((x - st.mx) / 26) ** 2));
      const hs = xs.map(xi => gain * st.H * Math.exp(-(((xi - st.mx) / st.sig) ** 2)));
      const top = x => {
        const e = smooth(clamp((38 - Math.abs(x - 64)) / 9, 0, 1));
        let t = m(x);
        xs.forEach((xi, i) => { const q = Math.abs(x - xi) / W; if (q < 1) t = Math.max(t, m(x) + hs[i] * (1 - q) ** 2); });
        return base - e * t;
      };
      let d = `M26 ${base}`;
      for (let x = 26; x <= 102; x += 0.5) d += `L${f(x)} ${f(top(x))}`;
      d += `L102 ${base}A38 7 0 0 1 26 ${base}Z`;
      let lit = '', cyan = '';
      xs.forEach((xi, i) => {
        if (hs[i] < 4) return;
        lit += `M${f(xi - 0.4)} ${f(top(xi) + 1.5)}L${f(xi - 3.6)} ${f(top(xi - 3.6))}`;
        cyan += `M${f(xi + 0.6)} ${f(top(xi) + 3)}L${f(xi + 3.2)} ${f(top(xi + 3.2))}`;
      });
      return { d, lit, cyan };
    };
    const lip = 'M9 96L9 101A55 15 0 0 0 119 101L119 96A55 15 0 0 1 9 96Z';
    DIRS.push({
      toy: 'ferro', l: 'A', name: 'Shaded object',
      art(svg, u) {
        svg.innerHTML = `
          <linearGradient id="${u}f" gradientUnits="userSpaceOnUse" x1="0" y1="34" x2="0" y2="100"><stop offset="0" style="stop-color: oklch(0.42 0.025 250)"/><stop offset="0.45" style="stop-color: oklch(0.17 0.012 265)"/><stop offset="1" style="stop-color: oklch(0.07 0.01 265)"/></linearGradient>
          <linearGradient id="${u}d" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color: oklch(0.34 0.02 260)"/><stop offset="0.5" style="stop-color: oklch(0.22 0.015 265)"/><stop offset="1" style="stop-color: oklch(0.15 0.012 265)"/></linearGradient>
          <path d="${lip}" fill="url(#${u}d)"/>
          <ellipse cx="64" cy="96" rx="55" ry="15" fill="oklch(0.24 0.015 265)"/>
          <ellipse cx="64" cy="96" rx="55" ry="15" fill="url(#lit)" opacity="0.5"/>
          <ellipse cx="64" cy="95" rx="49" ry="11" fill="oklch(0.08 0.01 265)"/>
          <ellipse cx="64" cy="96" rx="55" ry="15" fill="none" stroke="oklch(0.74 0.11 205)" stroke-width="1.8"/>
          <path class="back" fill="oklch(0.2 0.014 262)"/>
          <path class="front" fill="url(#${u}f)"/>
          <path class="lit" fill="none" stroke="oklch(0.94 0.03 220)" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
          <path class="cyan" fill="none" stroke="oklch(0.74 0.12 205)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>`;
        const [back, front, lit, cyan] = ['.back', '.front', '.lit', '.cyan'].map(s => svg.querySelector(s));
        const st = { ...REST };
        const draw = () => {
          back.setAttribute('d', row(st, BX, 91, 0.8).d);
          const r = row(st, FX, 95, 1);
          front.setAttribute('d', r.d); lit.setAttribute('d', r.lit); cyan.setAttribute('d', r.cyan);
        };
        draw();
        const go = (p, d) => gsap.to(st, { mx: p ? clamp(p[0], 40, 88) : 64, H: 60, sig: 16, duration: d, ease: 'power3.out', overwrite: true, onUpdate: draw });
        return {
          enter: p => go(p, 0.5), move: p => p && go(p, 0.35),
          leave: () => gsap.to(st, { ...REST, duration: 0.8, ease: 'elastic.out(1, 0.5)', overwrite: true, onUpdate: draw }),
        };
      },
      emblem: (() => {
        const st = { ...REST };
        const b = row(st, BX, 91, 0.8), r = row(st, FX, 95, 1);
        return emb(`
          <path d="${lip}" fill="#fff"/>
          <ellipse cx="64" cy="96" rx="55" ry="15" fill="#fff"/>
          <path d="M9 96A55 15 0 0 0 119 96" fill="none" stroke="#000" stroke-width="2.4"/>
          <ellipse cx="64" cy="95" rx="48" ry="10.5" fill="#000"/>
          <path d="${b.d}" fill="#fff"/>
          <path d="${r.d}" fill="#fff" stroke="#000" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="${r.lit}" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>`);
      })(),
    });
  }

  // B: a steel slab with a hex lattice cut through; cells sharpen into spikes.
  {
    const SP = 15, HY = SP * Math.sqrt(3) / 2, cells = [];
    for (let j = -3; j <= 3; j++) for (let i = -4; i <= 4; i++) {
      const x = 64 + (i + (j & 1 ? 0.5 : 0)) * SP, y = 64 + j * HY;
      if (Math.abs(x - 64) <= 46) cells.push([x, y]);
    }
    const REST = { x: 64, y: 64, a: 0.8 };
    // Twelve vertices: a hexagon at s 0, a six-point star at s 1.
    const cell = ([cx, cy], s) => {
      const ro = lerp(5, 7.6, s), ri = lerp(5 * 0.866, 1.7, s);
      let d = '';
      for (let k = 0; k < 12; k++) {
        const a = (k * PI) / 6 + PI / 6, r = k % 2 ? ri : ro;
        d += (k ? 'L' : 'M') + P2([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
      }
      return d + 'Z';
    };
    const cellsD = st => cells.map(c => cell(c, st.a * Math.exp(-((c[0] - st.x) ** 2 + (c[1] - st.y) ** 2) / 520))).join('');
    DIRS.push({
      toy: 'ferro', l: 'B', name: 'Stencil cut-out',
      art(svg, u) {
        svg.innerHTML = `
          <linearGradient id="${u}s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: oklch(0.84 0.07 205)"/><stop offset="1" style="stop-color: oklch(0.5 0.09 250)"/></linearGradient>
          <rect x="9" y="9" width="110" height="110" rx="8" fill="url(#${u}s)"/>
          <rect x="9" y="9" width="110" height="110" rx="8" fill="url(#lit)" opacity="0.5"/>
          <rect x="9" y="9" width="110" height="110" rx="8" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
          <path class="cut" fill="${BG}"/>`;
        const cut = svg.querySelector('.cut'), st = { ...REST };
        const draw = () => cut.setAttribute('d', cellsD(st));
        draw();
        const go = (p, d) => gsap.to(st, { x: p ? p[0] : 64, y: p ? p[1] : 64, a: 1, duration: d, ease: 'power3.out', overwrite: true, onUpdate: draw });
        return { enter: p => go(p, 0.4), move: p => p && go(p, 0.3), leave: () => gsap.to(st, { ...REST, duration: 0.7, ease: 'power2.inOut', overwrite: true, onUpdate: draw }) };
      },
      emblem: emb(`
        <rect x="9" y="9" width="110" height="110" rx="8" fill="#fff"/>
        <path d="${cellsD({ ...REST, a: 1 })}" fill="#000"/>`),
    });
  }

  // C: a bar magnet and its field, drawn as filings that flow pole to pole.
  {
    const MX0 = 45, MX1 = 83, MY0 = 58, MY1 = 70;
    const inside = (x, y) => x > MX0 - 1.5 && x < MX1 + 1.5 && y > MY0 - 1.5 && y < MY1 + 1.5;
    // Dipole lines: r = k sin^2 theta, split where they enter the magnet.
    const field = ks => {
      let d = '';
      for (const k of ks) for (const sgn of [-1, 1]) {
        let pen = false;
        for (let i = 1; i < 240; i++) {
          const th = (i / 240) * PI, r = k * Math.sin(th) ** 2;
          const x = 64 + r * Math.cos(th), y = 64 + sgn * r * Math.sin(th);
          if (inside(x, y)) { pen = false; continue; }
          d += (pen ? 'L' : 'M') + P2([x, y]);
          pen = true;
        }
      }
      return d + `M${MX1 + 1.5} 64H119M9 64H${MX0 - 1.5}`;
    };
    const KS = [34, 48, 66, 90, 124, 170];
    const line = 'fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"';
    DIRS.push({
      toy: 'ferro', l: 'C', name: 'Single-weight line',
      art(svg, u) {
        svg.innerHTML = `
          <clipPath id="${u}c"><rect x="10" y="10" width="108" height="108" rx="9"/></clipPath>
          <rect x="9" y="9" width="110" height="110" rx="10" ${line} stroke="oklch(0.42 0.03 265)"/>
          <path class="fl" d="${field(KS)}" clip-path="url(#${u}c)" ${line} stroke="oklch(0.84 0.03 250)" stroke-dasharray="2.2 3.4"/>
          <rect x="${MX0}" y="${MY0}" width="${MX1 - MX0}" height="${MY1 - MY0}" rx="2" ${line} stroke="oklch(0.78 0.12 205)"/>
          <path d="M64 ${MY0}V${MY1}M${MX1 - 6} ${MY0 + 3}V${MY1 - 3}" ${line} stroke="oklch(0.78 0.12 205)"/>`;
        const fl = svg.querySelector('.fl'), st = { t: 0 };
        const draw = () => fl.setAttribute('stroke-dashoffset', f(-st.t * 5.6));
        return hoverLoop(
          () => gsap.timeline({ repeat: -1, onUpdate: draw }).fromTo(st, { t: 0 }, { t: 1, duration: 0.6, ease: 'none' }),
          () => settle(st, 't', draw, 0.3));
      },
      emblem: emb(`
        <clipPath id="c"><rect x="12" y="12" width="104" height="104" rx="9"/></clipPath>
        <rect x="9" y="9" width="110" height="110" rx="11" fill="none" stroke="#fff" stroke-width="4.6"/>
        <path d="${field([36, 60, 100, 160])}" clip-path="url(#c)" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" stroke-dasharray="0.1 7.6"/>
        <rect x="${MX0}" y="${MY0 - 1}" width="${MX1 - MX0}" height="${MY1 - MY0 + 2}" rx="2.5" fill="none" stroke="#fff" stroke-width="4.4"/>
        <path d="M64 ${MY0}V${MY1}" stroke="#fff" stroke-width="4.4"/>`),
    });
  }

  // D: a magnet block in isometric view, a crown of cones on its top.
  {
    const R = 30, Yc = 58, T = 16, P = iso(R, Yc);
    const cones = [];
    for (let a = -2; a <= 2; a++) for (let b = -2; b <= 2; b++) {
      if (Math.abs(a + b) > 2) continue;
      const u = (a + b / 2) * 0.3, v = b * 0.866 * 0.3;
      cones.push({ u, v, dist: Math.hypot(u, v) / 0.6 });
    }
    cones.sort((p, q) => (p.u + p.v) - (q.u + q.v));
    const RB = 0.14, rx = RB * R * 1.2247, ry = RB * R * 0.7071;
    const coneD = (c, h) => {
      const [x, y] = P(c.u, c.v);
      return `M${f(x - rx)} ${f(y)}L${f(x)} ${f(y - h)}L${f(x + rx)} ${f(y)}A${f(rx)} ${f(ry)} 0 0 1 ${f(x - rx)} ${f(y)}Z`;
    };
    const coneLit = (c, h) => { const [x, y] = P(c.u, c.v); return `M${f(x - 0.5)} ${f(y - h + 2)}L${f(x - rx * 0.55)} ${f(y - 0.5)}`; };
    const h0 = c => 32 * (1 - 0.45 * c.dist);
    const faces = {
      left: poly([P(-1, 1), P(1, 1), P(1, 1, -T), P(-1, 1, -T)]),
      right: poly([P(1, -1), P(1, 1), P(1, 1, -T), P(1, -1, -T)]),
      top: poly([P(-1, -1), P(1, -1), P(1, 1), P(-1, 1)]),
      band: `M${P2(P(-1, 1, -7))}L${P2(P(1, 1, -7))}L${P2(P(1, -1, -7))}`,
      edge: `M${P2(P(-1, 1))}L${P2(P(1, 1))}L${P2(P(1, -1))}M${P2(P(1, 1))}L${P2(P(1, 1, -T))}`,
    };
    const PR = 0.82, prx = PR * R * 1.2247, pry = PR * R * 0.7071;
    DIRS.push({
      toy: 'ferro', l: 'D', name: 'Isometric block',
      art(svg, u) {
        svg.innerHTML = `
          <linearGradient id="${u}t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: oklch(0.46 0.02 255)"/><stop offset="1" style="stop-color: oklch(0.3 0.02 265)"/></linearGradient>
          <path d="${faces.left}" fill="oklch(0.3 0.02 262)"/>
          <path d="${faces.right}" fill="oklch(0.2 0.018 266)"/>
          <path d="${faces.band}" fill="none" stroke="oklch(0.74 0.11 205)" stroke-width="2"/>
          <path d="${faces.top}" fill="url(#${u}t)"/>
          <path d="${faces.edge}" fill="none" stroke="oklch(0.6 0.02 255)" stroke-width="0.8" stroke-linejoin="round"/>

  // E: a mound on a magnet bar; its fan of spikes leans to the pointer.

      const rnd = () => ((q = (q * 1664525 + 1013904223) >>> 0) / 4294967296);
      for (let j = 0; j < 5; j++) for (let i = 0; i < 5; i++) SEEDS.push([-4 + i * 34 + (rnd() - 0.5) * 22, -4 + j * 34 + (rnd() - 0.5) * 22, 3 + rnd() * 4, rnd() * TAU, rnd() < 0.5 ? 1 : -1]);

    // Each cell is the box cut by the half-planes of its neighbours.
    const cellOf = (pts, i) => {
      let poly = [[-60, -60], [188, -60], [188, 188], [-60, 188]];
      const [px, py] = pts[i];
      for (let j = 0; j < pts.length && poly.length; j++) {
        if (j === i) continue;
        const nx = pts[j][0] - px, ny = pts[j][1] - py, c = nx * (px + pts[j][0]) / 2 + ny * (py + pts[j][1]) / 2;
        const out = [];
        for (let k = 0; k < poly.length; k++) {
          const a = poly[k], b = poly[(k + 1) % poly.length];
          const da = nx * a[0] + ny * a[1] - c, db = nx * b[0] + ny * b[1] - c;
          if (da <= 0) out.push(a);
          if ((da <= 0) !== (db <= 0)) { const t = da / (da - db); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }

  // B: a tile slab with its grout cut through; a drop under the pointer warps it.
  {

      return pts;

  // E: a drop over a band of water; on hover it falls, splashes and jumps back.
  {
    const BASE = 80, S = 14;
    const REST = { dy: 36, op: 1, C: 0, rc: 6, J: 0, dp: 0, D: 0 };
    const top = (x, st) => BASE - st.C * Math.exp(-(((x - 64 - st.rc) / 3.6) ** 2)) - st.C * Math.exp(-(((x - 64 + st.rc) / 3.6) ** 2))
      - st.J * Math.exp(-(((x - 64) / 4.6) ** 2)) + st.D * Math.exp(-(((x - 64) / 13) ** 2));
    const band = st => {
      let d = '';
      for (let x = 10; x <= 118; x += 1) d += (x > 10 ? 'L' : 'M') + P2([x, top(x, st)]);
      return d + 'L118 108Q118 116 110 116L18 116Q10 116 10 108Z';
    };
    const cuts = 'M24 96H58M70 105H104';
    DIRS.push({
      toy: 'pool', l: 'E', name: 'Abstract mark',
      art(svg, u) {
        svg.innerHTML = `
          <linearGradient id="${u}w" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="116"><stop offset="0" style="stop-color: oklch(0.86 0.1 195)"/><stop offset="1" style="stop-color: oklch(0.5 0.14 245)"/></linearGradient>
          <path class="bd" fill="url(#${u}w)"/>
          <path d="${cuts}" fill="none" stroke="${BG}" stroke-width="3.4" stroke-linecap="round"/>
          <path class="dr" fill="oklch(0.88 0.09 198)"/>
          <circle class="s1" r="2.6" fill="oklch(0.88 0.09 198)"/><circle class="s2" r="2.6" fill="oklch(0.88 0.09 198)"/>`;
        const [bd, dr, s1, s2] = ['.bd', '.dr', '.s1', '.s2'].map(s => svg.querySelector(s));
        const st = { ...REST };
        const draw = () => {
          bd.setAttribute('d', band(st));
          dr.setAttribute('d', tear(64, st.dy, S)); dr.setAttribute('opacity', f(st.op));
          const on = st.dp > 0 && st.dp < 1 ? 1 : 0, y = BASE - 6 - 16 * Math.sin(PI * st.dp);
          [[s1, -1], [s2, 1]].forEach(([c, k]) => { c.setAttribute('cx', f(64 + k * (16 + 14 * st.dp))); c.setAttribute('cy', f(y)); c.setAttribute('opacity', on); });
        };
        draw();
        return hoverLoop(
          () => gsap.timeline({ repeat: -1, onUpdate: draw })
            .to(st, { dy: BASE + 6, duration: 0.42, ease: 'power2.in' }, 0)
            .set(st, { op: 0 }, 0.42)
            .to(st, { C: 13, rc: 15, D: 5, duration: 0.22, ease: 'power2.out' }, 0.42)
            .fromTo(st, { dp: 0 }, { dp: 1, duration: 0.5, ease: 'none' }, 0.42)
            .to(st, { C: 0, D: 0, duration: 0.3, ease: 'power2.in' }, 0.64)
            .to(st, { J: 28, duration: 0.3, ease: 'power2.out' }, 0.7)
            .set(st, { op: 1, dy: BASE - 28 - 1.3 * S + 3 }, 1)
            .to(st, { dy: REST.dy, duration: 0.6, ease: 'power2.out' }, 1)
            .to(st, { J: 0, rc: REST.rc, duration: 0.45, ease: 'power2.in' }, 1)
            .set(st, { dp: 0 }, 1.6)
            .to({}, { duration: 0.6 }, 1.6),
          () => gsap.to(st, { ...REST, duration: 0.4, ease: 'power2.out', overwrite: true, onUpdate: draw }));
      },
      emblem: emb(`
        <path d="${band(REST)}" fill="#fff"/>
        <path d="${cuts}" fill="none" stroke="#000" stroke-width="4.4" stroke-linecap="round"/>
        <path d="${tear(64, REST.dy, S)}" fill="#fff"/>`),
    });
  }

  /* ================= Gallery ================= */

  const NAMES = { ferro: 'Ferrofluid', pool: 'Caustic pool' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = svg => {
    const b = svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      // The current card shows the live intro emblem.
      const src = D.current ? `../shared/emblems/${toy}.svg` : `spike/emblems/${file}.svg`;
      if (!D.current) window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.current ? '<b>Current</b>' : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        <div class="emb"><div class="flash"><i style="--emblem: url(${src})"></i></div><div class="glass"><i style="--emblem: url(${src})"></i></div></div>`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
