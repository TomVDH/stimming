<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 12</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- The current menu icon. -->
    <linearGradient id="g-film" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.8 0.15 340)"/>
      <stop offset="0.5" style="stop-color: oklch(0.9 0.13 90)"/>
      <stop offset="1" style="stop-color: oklch(0.84 0.11 200)"/>
    </linearGradient>
    <!-- The wand: the toy's pink plastic. -->
    <linearGradient id="bw-plastic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.88 0.09 355)"/>
      <stop offset="1" style="stop-color: oklch(0.64 0.17 350)"/>
    </linearGradient>
    <!-- Film colours: thin-film magenta, gold, cyan and violet. -->
    <linearGradient id="bw-irid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.78 0.17 330)"/>
      <stop offset="0.35" style="stop-color: oklch(0.92 0.13 88)"/>
      <stop offset="0.65" style="stop-color: oklch(0.84 0.12 195)"/>
      <stop offset="1" style="stop-color: oklch(0.7 0.17 290)"/>
    </linearGradient>
    <linearGradient id="bw-irid2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.84 0.12 195)"/>
      <stop offset="0.5" style="stop-color: oklch(0.78 0.17 330)"/>
      <stop offset="1" style="stop-color: oklch(0.92 0.13 88)"/>
    </linearGradient>
    <!-- A bubble's body: clear in the middle, coloured film at the edge. -->
    <radialGradient id="bw-body" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color: oklch(0.8 0.08 280)" stop-opacity="0"/>
      <stop offset="0.76" style="stop-color: oklch(0.8 0.08 280)" stop-opacity="0.03"/>
      <stop offset="0.92" style="stop-color: oklch(0.78 0.16 320)" stop-opacity="0.3"/>
      <stop offset="1" style="stop-color: oklch(0.92 0.1 200)" stop-opacity="0.7"/>
    </radialGradient>
    <!-- The stencil tile. -->
    <linearGradient id="bw-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.84 0.12 350)"/>
      <stop offset="1" style="stop-color: oklch(0.7 0.15 300)"/>
    </linearGradient>
    <!-- The tray's bubble mix: dark film colours. -->
    <linearGradient id="bw-mix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.6 0.15 310)"/>
      <stop offset="0.5" style="stop-color: oklch(0.56 0.12 260)"/>
      <stop offset="1" style="stop-color: oklch(0.66 0.11 195)"/>
    </linearGradient>
  </defs>
</svg>

<h1>Icon spike 12</h1>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2;
  const BG = 'oklch(0.16 0.012 275)';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };
  // A loop of t from 0 to 1 that eases back to the nearer end.
  const tLoop = (st, dur, draw) => hoverLoop(
    () => gsap.timeline({ repeat: -1 }).fromTo(st, { t: 0 }, { t: 1, duration: dur, ease: 'none', onUpdate: draw }),
    () => gsap.to(st, { t: st.t < 0.5 ? 0 : 1, duration: 0.6, ease: 'power2.out', onUpdate: draw, onComplete() { st.t = 0; draw(); } }));

  // One bubble at unit radius: film body, coloured rim and the toy's window glint.
  const BUBBLE = `
    <circle r="1" fill="url(#bw-body)"/>
    <circle r="0.955" fill="none" stroke="url(#bw-irid)" stroke-width="0.1"/>
    <path d="M-0.66 0.42A0.78 0.78 0 0 0 0.44 0.64" fill="none" stroke="url(#bw-irid2)" stroke-width="0.07" stroke-linecap="round" opacity="0.8"/>
    <path d="M0.5 -0.6A0.78 0.78 0 0 1 0.76 -0.1" fill="none" stroke="url(#bw-irid2)" stroke-width="0.05" stroke-linecap="round" opacity="0.6"/>
    <circle r="1" fill="url(#lit)" opacity="0.35"/>
    <g fill="#fff" transform="rotate(-22)">
      <rect x="-0.5" y="-0.78" width="0.17" height="0.3" rx="0.04" fill-opacity="0.92"/>
      <rect x="-0.29" y="-0.78" width="0.17" height="0.3" rx="0.04" fill-opacity="0.92"/>
      <rect x="0.34" y="0.5" width="0.11" height="0.19" rx="0.03" fill-opacity="0.45"/>
    </g>`;
  // The window glint for emblems: two panes, white.
  const GLINT = (x, y, r) => `<g transform="translate(${f(x)} ${f(y)}) scale(${f(r)}) rotate(-22)"><rect x="-0.52" y="-0.8" width="0.2" height="0.33" rx="0.05" fill="#fff"/><rect x="-0.28" y="-0.8" width="0.2" height="0.33" rx="0.05" fill="#fff"/></g>`;
  // Slots on a blowing chain: x, y, radius, opacity.
  // Bubble k sits at slot k + t, so the loop closes on itself.
  const onChain = (S, s) => {
    const i = Math.min(Math.floor(s), S.length - 2), u = smooth(0, 1, s - i), a = S[i], b = S[i + 1];
    return [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u), lerp(a[3], b[3], u)];
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  DIRS.push({
    toy: 'bubbles', l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `
        <g fill="none" stroke="oklch(0.78 0.12 330)" stroke-width="4" stroke-linecap="round">
          <circle cx="38" cy="86" r="14"/>
          <line x1="28" y1="96" x2="14" y2="114"/>
        </g>
        <g fill="oklch(0.92 0.04 300 / 0.12)" stroke="url(#g-film)" stroke-width="2">
          <circle class="b" cx="66" cy="66" r="14"/>
          <circle class="b" cx="90" cy="44" r="10"/>
          <circle class="b" cx="70" cy="30" r="7"/>
          <circle class="b" cx="100" cy="74" r="6"/>
        </g>`;
      const set = [...svg.querySelectorAll('.b')];
      // Bubbles rise and fade, then drift back.
      return hoverLoop(
        () => gsap.timeline({ repeat: -1 }).fromTo(set, { y: 0, opacity: 1 }, { y: -14, opacity: 0.2, duration: 1.4, ease: 'sine.inOut', stagger: 0.18, yoyo: true, repeat: 1 }),
        () => gsap.to(set, { y: 0, opacity: 1, duration: 0.3, overwrite: true }));
    },
  });

  /* ================= A · Shaded object ================= */

  // A: a glossy wand blows a chain of film bubbles; hover keeps it blowing.
  {
    const RING = [38, 88, 15];
    // The chain rises, then drifts right; one stray bubble breaks the line.
    const S = [[38, 88, 0, 1], [60, 70, 10, 1], [64, 38, 22, 1], [100, 22, 12, 1], [120, 6, 5, 0]];
    const STRAY = [100, 62, 7];
    const N = S.length - 1;
    DIRS.push({
      toy: 'bubbles', l: 'A', name: 'Shaded object',
      box: [8, 8, 112, 112],
      art(svg) {
        const [x, y, r] = RING;
        svg.innerHTML = `
          <line x1="27.4" y1="98.6" x2="14" y2="114" stroke="url(#bw-plastic)" stroke-width="6.5" stroke-linecap="round"/>
          <line x1="27.4" y1="98.6" x2="14" y2="114" stroke="#fff" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round" transform="translate(-1.6 -1.4)"/>
          <circle cx="${x}" cy="${y}" r="${r - 2.4}" fill="url(#bw-body)" opacity="0.85"/>
          <circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="url(#bw-plastic)" stroke-width="6"/>
          <circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="url(#lit)" stroke-width="6"/>
          <path d="M${f(x - r * 0.87)} ${f(y - r * 0.5)}A${r} ${r} 0 0 1 ${f(x + r * 0.17)} ${f(y - r * 0.98)}" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="1.6" stroke-linecap="round"/>
          <g class="s">${BUBBLE}</g>
          ${Array.from({ length: N }, () => `<g class="b">${BUBBLE}</g>`).join('')}`;
        const B = [...svg.querySelectorAll('.b')], SG = svg.querySelector('.s');
        const st = { t: 0 };
        const draw = () => {
          B.forEach((g, k) => {
            const [bx, by, br, bo] = onChain(S, k + st.t);
            // A moving bubble wobbles; it is round at every slot.
            const w = 0.05 * Math.sin(TAU * 2 * (k + st.t));
            g.setAttribute('transform', `translate(${f(bx)} ${f(by)}) scale(${f(Math.max(0.001, br * (1 + w)))} ${f(Math.max(0.001, br * (1 - w)))})`);
            g.setAttribute('opacity', f(bo));
          });
          // The stray bubble bobs once per loop.
          SG.setAttribute('transform', `translate(${STRAY[0]} ${f(STRAY[1] - 3 * Math.sin(TAU * st.t))}) scale(${STRAY[2]})`);
        };
        draw();
        return tLoop(st, 1.6, draw);
      },
      emblem: emb(`
        <circle cx="38" cy="88" r="15" fill="none" stroke="#fff" stroke-width="6"/>
        <line x1="27.4" y1="98.6" x2="14" y2="114" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
        ${[...S.slice(1, 4), STRAY].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${f(r - 1.2)}" fill="none" stroke="#fff" stroke-width="${r > 20 ? 3.4 : 2.8}"/>`).join('\n')}
        ${S.slice(1, 4).map(([x, y, r]) => GLINT(x, y, r)).join('\n')}
      `),
    });
  }

  /* ================= B · Stencil cut-out ================= */

  // B: wand and bubbles cut from a flat tile; hover floats the cuts up and out.
  {
    // Bubbles leave the ring's rim, rise, then drift right and out of the tile.
    const S = [[52, 74, 0, 1], [62, 64, 9, 1], [64, 36, 15, 1], [94, 26, 9, 1], [106, -4, 6, 1]];
    const STRAY = [94, 64, 7];
    const N = S.length - 1;
    const CUT = 3.6;
    // A short arc inside a bubble, high on the left: the cut glint.
    const glint = r => { const g = r * 0.62, a = (200 * Math.PI) / 180, b = (250 * Math.PI) / 180; return `M${f(g * Math.cos(a))} ${f(g * Math.sin(a))}A${f(g)} ${f(g)} 0 0 1 ${f(g * Math.cos(b))} ${f(g * Math.sin(b))}`; };
    DIRS.push({
      toy: 'bubbles', l: 'B', name: 'Stencil cut-out',
      box: [14, 14, 100, 100],
      art(svg, u) {
        svg.innerHTML = `
          <clipPath id="${u}t"><rect x="14" y="14" width="100" height="100" rx="14"/></clipPath>
          <rect x="14" y="14" width="100" height="100" rx="14" fill="url(#bw-tile)"/>
          <rect x="14" y="14" width="100" height="100" rx="14" fill="url(#lit)"/>
          <g clip-path="url(#${u}t)" fill="none" style="stroke: ${BG}" stroke-linecap="round">
            <circle cx="42" cy="84" r="13" stroke-width="4.6"/>
            <line x1="32.8" y1="93.2" x2="20" y2="108" stroke-width="4.6"/>
            <g class="b s"><circle class="o" stroke-width="${CUT}"/><path class="g" stroke-width="2.6"/></g>
            ${Array.from({ length: N }, () => `<g class="b"><circle class="o" stroke-width="${CUT}"/><path class="g" stroke-width="2.6"/></g>`).join('')}
          </g>`;
        const [SG, ...B] = svg.querySelectorAll('.b');
        const st = { t: 0 };
        const cut = (g, x, y, r) => {
          g.setAttribute('transform', `translate(${f(x)} ${f(y)})`);
          g.querySelector('.o').setAttribute('r', f(Math.max(0, r)));
          g.querySelector('.g').setAttribute('d', r > 4 ? glint(r) : '');
        };
        const draw = () => {
          B.forEach((g, k) => { const [x, y, r] = onChain(S, k + st.t); cut(g, x, y, r); });
          cut(SG, STRAY[0], STRAY[1] - 3 * Math.sin(TAU * st.t), STRAY[2]);
        };
        draw();
        return tLoop(st, 1.8, draw);
      },
      emblem: emb(`
        <rect x="14" y="14" width="100" height="100" rx="14" fill="#fff"/>
        <g fill="none" stroke="#000" stroke-linecap="round">
          <circle cx="42" cy="84" r="13" stroke-width="5"/>
          <line x1="32.8" y1="93.2" x2="20" y2="108" stroke-width="5"/>
          ${[...S.slice(1, 4), STRAY].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" stroke-width="4"/><path d="${glint(r)}" transform="translate(${x} ${y})" stroke-width="3"/>`).join('\n')}
        </g>
      `),
    });
  }

  /* ================= C · Single-weight line ================= */

  // C: the film domes, necks, pinches and lets go, in one line weight.
  {
    const R = 15, CX = 38, CY = 92, ANG = (-52 * Math.PI) / 180;
    const A = [Math.cos(ANG), Math.sin(ANG)], V = [-A[1], A[0]];
    const at = (u, v) => [CX + A[0] * u + V[0] * v, CY + A[1] * u + V[1] * v];
    const H1 = 1.6 * R, RB = (R * R + H1 * H1) / (2 * H1);
    // Rest shows the pinch: a full body on a narrow neck.
    const P0 = 0.7, LINE = 'oklch(0.86 0.1 330)';
    // The film outline on the ring at phase p, in screen points.
    const film = p => {
      let n = 0, w = R, rb, c;
      if (p < 0.42) {
        const h = R * lerp(0.28, 1.6, smooth(0, 0.42, p));
        rb = (R * R + h * h) / (2 * h); c = h - rb;
      } else if (p < 0.8) {
        const q = smooth(0.42, 0.8, p);
        w = R * lerp(1, 0.1, q); n = R * lerp(0, 0.75, q); rb = RB; c = n + Math.sqrt(rb * rb - w * w);
      } else {
        // Released: the film snaps back to a shallow dome.
        const h = R * lerp(0.6, 0.28, smooth(0.8, 1, p));
        rb = (R * R + h * h) / (2 * h); c = h - rb;
      }
      const pts = [];
      // The neck runs from the ring rim to the body.
      if (n > 0.01) {
        for (let i = 0; i <= 8; i++) { const k = i / 8, e = k * k * (3 - 2 * k); pts.push(at(n * k, lerp(R, w, e))); }
      } else pts.push(at(0, R));
      const a0 = Math.atan2(w, n - c);
      for (let i = 0; i <= 36; i++) {
        const a = a0 - (2 * a0 * i) / 36;
        pts.push(at(c + rb * Math.cos(a), rb * Math.sin(a)));
      }
      if (n > 0.01) { const back = []; for (let i = 8; i >= 0; i--) { const k = i / 8, e = k * k * (3 - 2 * k); back.push(at(n * k, -lerp(R, w, e))); } pts.push(...back); }
      return 'M' + pts.map(q => `${f(q[0])} ${f(q[1])}`).join('L');
    };
    // A released bubble drifts up and away along q from 0 to 2.2.
    // It passes MID at q = 1 and END at q = 2, then fades.
    const CREL = 0.75 * R + Math.sqrt(RB * RB - (0.1 * R) ** 2), START = at(CREL, 0), MID = [80, 40], END = [110, 10];
    const free = q => {
      const [a, b, u] = q < 1 ? [START, MID, q] : [MID, END, Math.min(1, q - 1)];
      return [lerp(a[0], b[0], u) - 3 * Math.sin(Math.PI * q), lerp(a[1], b[1], u), RB * (1 - 0.2 * q), 1 - smooth(1.9, 2.2, q)];
    };
    const ring = `<ellipse cx="${CX}" cy="${CY}" rx="${R}" ry="${f(R * 0.4)}" transform="rotate(${f((Math.atan2(V[1], V[0]) * 180) / Math.PI)} ${CX} ${CY})"/>`;
    const H0 = at(-1, R), H2 = at(-8, R + 24);
    const handle = `<line x1="${f(H0[0])}" y1="${f(H0[1])}" x2="${f(H2[0])}" y2="${f(H2[1])}"/>`;
    DIRS.push({
      toy: 'bubbles', l: 'C', name: 'Single-weight line',
      box: [12, 6, 106, 106],
      art(svg) {
        svg.innerHTML = `
          <g fill="none" stroke="${LINE}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            ${ring}${handle}
            <path class="fm"/>
            <circle class="fr"/><circle class="fr"/><circle class="fr"/>
          </g>`;
        const fm = svg.querySelector('.fm'), FR = [...svg.querySelectorAll('.fr')];
        const st = { t: 0 };
        const draw = () => {
          const p = (P0 + st.t) % 1;
          fm.setAttribute('d', film(p));
          // The current bubble frees at 0.8; the last two drift on.
          [p >= 0.8 ? p - 0.8 : -1, p + 0.2, p + 1.2].forEach((q, i) => {
            const c = FR[i];
            if (q < 0) { c.setAttribute('r', 0); return; }
            const [x, y, r, o] = free(q);
            c.setAttribute('cx', f(x)); c.setAttribute('cy', f(y)); c.setAttribute('r', f(r)); c.setAttribute('opacity', f(o));
          });
        };
        draw();
        return tLoop(st, 2.6, draw);
      },
      emblem: emb(`
        <g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
          ${ring}${handle}
          <path d="${film(P0)}"/>
          ${[P0 + 0.2, P0 + 1.2].map(q => { const [x, y, r] = free(q); return `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}"/>`; }).join('\n')}
        </g>
      `),
    });
  }

  /* ================= D · Isometric block ================= */

  // D: a tray of bubble mix; the wand stands in it and blows on hover.
  {
    const HW = 27 * Math.sqrt(3), HH = 27, DEPTH = 14, MID = [64, 82];
    const T = [64, MID[1] - HH], UR = [64 + HW, MID[1]], C0 = [64, MID[1] + HH], UL = [64 - HW, MID[1]];
    const LR = [UR[0], UR[1] + DEPTH], BB = [64, C0[1] + DEPTH], LL = [UL[0], UL[1] + DEPTH];
    // The mix sits a little below the rim, inset on every side.
    const inset = (p, k, dy) => [MID[0] + (p[0] - MID[0]) * k, MID[1] + (p[1] - MID[1]) * k + dy];
    const WELL = [T, UR, C0, UL].map(p => inset(p, 0.84, 0)), MIX = [T, UR, C0, UL].map(p => inset(p, 0.8, 3));
    // A vertical circle in the left-face plane, drawn through a skew.
    const RING = [54, 44, 16], VERT = (x, y) => `matrix(0.866 0.5 0 1 ${x} ${y})`, FLAT = (x, y) => `matrix(0.866 0.5 -0.866 0.5 ${x} ${y})`;
    const STICK = [[54, 60], [54, 87]];
    const S = [[54, 44, 0, 1], [76, 30, 10, 1], [96, 12, 7, 1], [108, -2, 4, 0]];
    const N = S.length - 1;
    DIRS.push({
      toy: 'bubbles', l: 'D', name: 'Isometric block',
      box: [14, 4, 100, 116],
      art(svg) {
        const [rx, ry, rr] = RING;
        svg.innerHTML = `
          <path d="${poly([UL, C0, BB, LL])}" fill="oklch(0.66 0.15 350)"/>
          <path d="${poly([C0, UR, LR, BB])}" fill="oklch(0.5 0.14 345)"/>
          <path d="${poly([T, UR, C0, UL])}" fill="oklch(0.86 0.09 355)"/>
          <path d="${poly(WELL)}" fill="oklch(0.42 0.1 320)"/>
          <path d="${poly(MIX)}" fill="url(#bw-mix)"/>
          <path d="${poly(MIX)}" fill="url(#lit)"/>
          <g fill="none" stroke="oklch(0.92 0.06 200 / 0.8)" stroke-width="1"><circle class="rp" vector-effect="non-scaling-stroke" transform="${FLAT(STICK[1][0], STICK[1][1])}"/><circle class="rp" vector-effect="non-scaling-stroke" transform="${FLAT(STICK[1][0], STICK[1][1])}"/></g>
          <line x1="${STICK[0][0]}" y1="${STICK[0][1]}" x2="${STICK[1][0]}" y2="${STICK[1][1]}" stroke="oklch(0.74 0.15 352)" stroke-width="4.5" stroke-linecap="round"/>
          <circle r="${rr - 2}" fill="url(#bw-body)" transform="${VERT(rx, ry)}"/>
          <circle r="${rr}" fill="none" stroke="oklch(0.74 0.15 352)" stroke-width="4.5" vector-effect="non-scaling-stroke" transform="${VERT(rx, ry)}"/>
          <circle r="${rr}" fill="none" stroke="url(#rim)" stroke-width="1.6" vector-effect="non-scaling-stroke" transform="${VERT(rx - 0.8, ry - 1)}"/>
          <path d="M${f(T[0])} ${f(T[1])}L${f(UR[0])} ${f(UR[1])}L${f(C0[0])} ${f(C0[1])}L${f(UL[0])} ${f(UL[1])}Z" fill="none" stroke="url(#rim)" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M${f(C0[0])} ${f(C0[1])}V${f(BB[1])}" stroke="oklch(0.95 0.03 350 / 0.35)" stroke-width="1.2"/>
          ${Array.from({ length: N }, () => `<g class="b">${BUBBLE}</g>`).join('')}`;
        const B = [...svg.querySelectorAll('.b')], RP = [...svg.querySelectorAll('.rp')];
        const st = { t: 0 };
        const draw = () => {
          B.forEach((g, k) => {
            const [x, y, r, o] = onChain(S, k + st.t);
            g.setAttribute('transform', `translate(${f(x)} ${f(y)}) scale(${f(Math.max(0.001, r))})`);
            g.setAttribute('opacity', f(o));
          });
          // Two rings spread from the stick, half a loop apart.
          RP.forEach((c, i) => {
            const s = (st.t * 2 + i * 0.5) % 1;
            c.setAttribute('r', f(3 + 13 * s));
            c.setAttribute('opacity', f(st.t ? (1 - s) * 0.9 : 0));
          });
        };
        draw();
        return tLoop(st, 1.8, draw);
      },
      emblem: emb(`
        <path d="${poly([T, UR, LR, BB, LL, UL])}" fill="#fff"/>
        <path d="M${f(C0[0])} ${f(C0[1])}V${f(BB[1])}" stroke="#000" stroke-width="3"/>
        <path d="${poly(WELL)}" fill="#000"/>
        <line x1="${STICK[0][0]}" y1="${STICK[0][1]}" x2="${STICK[1][0]}" y2="${STICK[1][1]}" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <circle r="${RING[2]}" fill="none" stroke="#fff" stroke-width="5" vector-effect="non-scaling-stroke" transform="${VERT(RING[0], RING[1])}"/>
        ${S.slice(1, 3).map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${f(r - 1)}" fill="none" stroke="#fff" stroke-width="2.6"/>${GLINT(x, y, r)}`).join('\n')}
      `),
    });
  }

  /* ================= Gallery ================= */

  const NAMES = { bubbles: 'Bubble wand' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || (D.emblem ? `spike/emblems/${file}.svg` : '');
      if (D.emblem) window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
