<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Tornado alley 2</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Tornado alley 2</h1>
<p class="lede">Tornado alley, round 2: the twister as a live model, the way Wind map draws its globe. A: free on the ground. D: on a block of wheat field with the road across it.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };


  // The toy's tokens: the storm's slate and eerie green, ripe wheat, warm dust.
  const CLOUD = [[0, 'oklch(0.66 0.03 248)'], [0.45, 'oklch(0.44 0.04 236)'], [1, 'oklch(0.3 0.05 192)']];
  const BODY = [[0, 'oklch(0.36 0.035 210)'], [0.4, 'oklch(0.62 0.035 214)'], [1, 'oklch(0.28 0.04 245)']];
  const STRAND = 'oklch(0.93 0.02 225)', STRAND_BACK = 'oklch(0.7 0.03 225)', BANDS = 'oklch(0.86 0.03 220)';
  const DUST = [[0, 'oklch(0.76 0.08 72)', 0.95], [0.55, 'oklch(0.66 0.08 64)', 0.55], [1, 'oklch(0.6 0.08 60)', 0]];
  const GRIT = ['oklch(0.62 0.08 68)', 'oklch(0.44 0.06 52)', 'oklch(0.74 0.09 80)'];
  const { sin, cos, PI } = Math;
  // A fixed hash: the same strands and grit on every load.
  const hash = i => { const x = sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  // The wall cloud: a heavy shelf that boils up on the left; the wall hangs in the middle.
  const CLOUD_PTS = [[-56, 4], [-54, -4], [-44, -10], [-37, -19], [-25, -24], [-13, -20], [-6, -13], [6, -16], [20, -13], [34, -9], [48, -5], [58, 2], [50, 7], [24, 9], [10, 14], [-10, 14], [-24, 9], [-44, 8]];
  const spline = (pts, move = true) => {
    let d = move ? `M${f(pts[0][0])} ${f(pts[0][1])}` : `L${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d;
  };
  const cloud = (cx, cy, k) => spline([...CLOUD_PTS, CLOUD_PTS[0]].map(([x, y]) => [cx + x * k, cy + y * k])) + 'Z';

  // The twister as a live model, the way Wind map draws its globe.
  // A core curve runs from the cloud to the foot; the funnel flares around it.
  // Strands wind around the core as helices and spin faster down the rope.
  // The view looks a little down: depth z shifts a point by z * TILT.
  const TILT = 0.24, STEPS = 26;
  // g: top [x, y], ground y, radii r0 (top) and r1 (foot), cloud, strand and grit counts, a scale k.
  const twister = (svg, u, g) => {
    const $q = s => svg.querySelector(s);
    const backG = $q('.back'), frontG = $q('.front'), dashG = $q('.dash'), gritB = $q('.grit-b'), gritF = $q('.grit-f');
    const bodyEls = svg.querySelectorAll('.body'), bandEls = [...svg.querySelectorAll('.band')], haze = $q('.haze');
    const mk = (parent, a) => el('path', a, parent);
    const strands = Array.from({ length: g.n }, (_, i) => ({
      a0: (i / g.n) * 2 * PI + hash(i) * 0.4, w: 0.6 + hash(i + 50) * 0.7, o: 0.22 + hash(i + 90) * 0.4, turns: 1.6 + hash(i + 7) * 0.9,
      back: mk(backG, { stroke: STRAND_BACK, 'stroke-width': 0.7 * g.k, opacity: 0.35 }),
      front: mk(frontG, { stroke: STRAND, 'stroke-width': f((0.55 + 0.5 * hash(i + 50)) * g.k) }),
      dash: mk(dashG, { stroke: '#fff', 'stroke-width': f(1.1 * g.k), 'stroke-dasharray': `${f(3 * g.k)} ${f(11 * g.k)}` }),
    }));
    const grit = Array.from({ length: g.m }, (_, i) => ({
      rho: (6 + hash(i + 200) * 16) * g.k, h: hash(i + 300) ** 1.6 * 14 * g.k, a0: hash(i + 400) * 2 * PI,
      s: (1.3 + hash(i + 500) * 1.4) * g.k, c: GRIT[i % 3],
      el: null,
    }));
    grit.forEach(p => { p.el = el('rect', { width: f(p.s * 1.6), height: f(p.s), rx: f(p.s * 0.3), fill: p.c }, gritF); });
    const st = { x: g.rest, xTo: g.rest, touch: 1, touchTo: 1, spin: 0, spinTo: 0, phase: 0, flow: 0, wob: 0, wobTo: 0, t: 0, live: false };
    // The core and the radius at t from the cloud (0) to the foot (1).
    const shape = () => {
      const fy = g.ground - (1 - st.touch) * 20 * g.k;
      const bow = -(st.x - g.top[0]) * 0.4 + st.wob * sin(st.t * 1.3) * 4 * g.k;
      return {
        fy,
        core: t => { const s = t * t * (3 - 2 * t); return [g.top[0] + (st.x - g.top[0]) * s + bow * sin(PI * t), g.top[1] + (fy - g.top[1]) * t]; },
        rad: t => g.r1 + (g.r0 - g.r1) * Math.pow(1 - t, 2.4),
      };
    };
    const draw = () => {
      const S = shape();
      // The body: the funnel's outline around the core.
      const L = [], R = [];
      for (let i = 0; i <= 12; i++) { const t = i / 12, c = S.core(t), r = S.rad(t); L.push([c[0] - r, c[1]]); R.push([c[0] + r, c[1]]); }
      const b = L[12], c = R[12];
      const d = spline(L) + `Q${f((b[0] + c[0]) / 2)} ${f(b[1] + 2 * g.k)} ${f(c[0])} ${f(c[1])}` + spline(R.reverse(), false) + 'Z';
      bodyEls.forEach(e => e.setAttribute('d', d));
      // Each strand splits into a near part and a far part.
      for (const s of strands) {
        let dF = '', dB = '', penF = false, penB = false;
        for (let i = 0; i <= STEPS; i++) {
          const t = i / STEPS, cc = S.core(t), r = S.rad(t) * (0.92 + 0.08 * s.w);
          const a = s.a0 + st.phase * (1 + 2.2 * t) + 2 * PI * s.turns * t;
          const z = r * sin(a), x = cc[0] + r * cos(a), y = cc[1] + z * TILT;
          const pt = `${f(x)} ${f(y)}`;
          if (z >= 0) { dF += (penF ? 'L' : 'M') + pt; penF = true; penB = false; } else { dB += (penB ? 'L' : 'M') + pt; penB = true; penF = false; }
        }
        s.front.setAttribute('d', dF); s.dash.setAttribute('d', dF); s.back.setAttribute('d', dB);
        s.front.setAttribute('opacity', f(s.o * (0.55 + 0.45 * st.touch)));
        // Dashes run up the strands: the air rises in the funnel.
        s.dash.setAttribute('stroke-dashoffset', f(st.flow * g.k + s.a0 * 6));
        s.dash.setAttribute('opacity', f(0.75 * st.spin * s.o));
      }
      // Grit orbits the foot; the far half sits behind the funnel.
      const foot = S.core(1);
      for (const p of grit) {
        const a = p.a0 + st.phase * (2.6 - p.rho / (22 * g.k)) ;
        const z = p.rho * sin(a), x = foot[0] + p.rho * cos(a), y = S.fy - p.h * (0.6 + 0.4 * st.spin) + z * TILT;
        const parent = z >= 0 ? gritF : gritB;
        if (p.el.parentNode !== parent) parent.appendChild(p.el);
        p.el.setAttribute('x', f(x - p.s * 0.8)); p.el.setAttribute('y', f(y - p.s * 0.5));
        p.el.setAttribute('transform', `rotate(${f((a * 180) / PI * 2)} ${f(x)} ${f(y)})`);
        p.el.setAttribute('opacity', f(st.touch * (0.55 + 0.45 * hash(p.a0))));
      }
      haze.setAttribute('cx', f(foot[0])); haze.setAttribute('cy', f(S.fy - 3 * g.k));
      haze.setAttribute('rx', f((20 + 9 * st.spin) * g.k)); haze.setAttribute('ry', f((9 + 5 * st.spin) * g.k));
      haze.setAttribute('opacity', f(st.touch * (0.6 + 0.4 * st.spin)));
      // The cloud's bands turn about the funnel's top.
      bandEls.forEach((e, i) => e.setAttribute('stroke-dashoffset', f(-st.phase * (14 - i * 3) * g.k)));
    };
    const loop = clock(time => {
      const dt = Math.min(0.1, time - (st.t || time));
      st.t = time;
      st.x += (st.xTo - st.x) * 0.08;
      st.touch += (st.touchTo - st.touch) * 0.08;
      st.spin += (st.spinTo - st.spin) * 0.05;
      st.wob += (st.wobTo - st.wob) * 0.05;
      st.phase += dt * 2.6 * st.spin;
      st.flow += dt * 26 * st.spin;
      draw();
      // The clock stops once the twister rests.
      if (!st.live && Math.abs(st.x - g.rest) + Math.abs(1 - st.touch) + st.spin + st.wob < 0.02) {
        Object.assign(st, { x: g.rest, touch: 1, spin: 0, wob: 0 }); draw(); loop.stop();
      }
    });
    draw();
    return {
      enter(p) {
        st.live = true; st.spinTo = 1; st.wobTo = 1; loop.start();
        if (p) this.move(p);
      },
      // x drags the foot; a pointer high in the tile lifts the rope off the ground.
      move(p) {
        if (!p) return;
        st.xTo = clamp(p[0], g.range[0], g.range[1]);
        st.touchTo = clamp((p[1] - g.lift[0]) / (g.lift[1] - g.lift[0]), 0, 1);
      },
      leave() { st.live = false; st.xTo = g.rest; st.touchTo = 1; st.spinTo = 0; st.wobTo = 0; loop.start(); },
    };
  };
  // The twister's layers, far to near; the cloud covers the funnel's top.
  const twisterMarkup = (u, g) => {
    const cl = cloud(g.top[0], g.cloudY, g.ck);
    const bands = [0, 1, 2, 3].map(i => { const rx = (16 + i * 11) * g.ck; return `<ellipse class="band" cx="${g.top[0]}" cy="${f(g.cloudY + 6 * g.ck)}" rx="${f(rx)}" ry="${f(rx * TILT)}" fill="none" stroke="${BANDS}" stroke-width="${f(1.6 * g.ck)}" stroke-linecap="round" stroke-dasharray="${f(10 + i * 4)} ${f(8 + i * 3)}" opacity="${f(0.34 - i * 0.05)}"/>`; }).join('');
    return `
      <ellipse class="haze" fill="url(#${u}dust)" filter="url(#${u}hb)"/>
      <g class="grit-b"></g>
      <g class="back" fill="none" stroke-linecap="round"></g>
      <path class="body" fill="url(#${u}body)" opacity="0.82"/>
      <path class="body" fill="url(#${u}lit)"/>
      <g class="front" fill="none" stroke-linecap="round"></g>
      <g class="dash" fill="none" stroke-linecap="round"></g>
      <path class="body" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
      <g class="grit-f"></g>
      <path d="${cl}" fill="url(#${u}cloud)"/>
      <g clip-path="url(#${u}cc)">${bands}</g>
      <path d="${cl}" fill="url(#${u}lit)"/>
      <path d="${cl}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
      <clipPath id="${u}cc"><path d="${cl}"/></clipPath>`;
  };
  const twisterDefs = u => `${light(u)}${blur(`${u}hb`, 2.2)}
    ${lg(`${u}cloud`, CLOUD)}
    ${lg(`${u}body`, BODY, 'x1="0" y1="0" x2="1" y2="0"')}
    ${rg(`${u}dust`, DUST)}`;
  // The emblem's funnel: the body at rest.
  const restFunnel = g => {
    const L = [], R = [];
    for (let i = 0; i <= 12; i++) {
      const t = i / 12, s = t * t * (3 - 2 * t), bow = -(g.rest - g.top[0]) * 0.4;
      const cx = g.top[0] + (g.rest - g.top[0]) * s + bow * sin(PI * t), cy = g.top[1] + (g.ground - g.top[1]) * t, r = g.r1 + (g.r0 - g.r1) * Math.pow(1 - t, 2.4);
      L.push([cx - r, cy]); R.push([cx + r, cy]);
    }
    return spline(L) + `L${f(R[12][0])} ${f(R[12][1])}` + spline(R.reverse(), false) + 'Z';
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover loop.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg, u) {
      svg.innerHTML = `<defs><clipPath id="${u}clip"><rect x="16" y="16" width="92" height="92" rx="4"/></clipPath><linearGradient id="${u}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.42 0.09 255)"/><stop offset="1" stop-color="oklch(0.62 0.06 270)"/></linearGradient></defs>
        <g clip-path="url(#${u}clip)">
          <rect x="16" y="16" width="92" height="92" fill="url(#${u}sky)"/>
          <path d="M22 46Q26 34 44 34Q56 26 70 30Q90 28 106 36L108 46Q90 50 72 48L66 60H54L50 48Q34 50 22 46Z" fill="oklch(0.93 0.03 85)"/>
          <path d="M18 62Q22 56 40 57H92Q106 58 108 64V68Q80 72 64 71Q36 72 18 68Z" fill="oklch(0.86 0.06 85)"/>
          <path d="M18 68Q40 74 64 73Q88 74 108 68V76Q84 79 64 78Q40 79 18 76Z" fill="oklch(0.3 0.03 250)"/>
          <path class="funnel" d="M37 76H49L45 92H41Z" fill="oklch(0.62 0.02 260)"/>
          <ellipse class="dust" cx="43" cy="92" rx="5" ry="1.8" fill="oklch(0.6 0.05 60)" opacity="0.8"/>
          <rect x="16" y="91" width="92" height="17" fill="oklch(0.72 0.13 78)"/>
          <path d="M60 108L64 91L68 108Z" fill="oklch(0.22 0.01 250)"/>
          <path d="M84 108V84M80 86H88M95 108V88" fill="none" stroke="oklch(0.55 0.09 55)" stroke-width="1.6"/>
        </g>`;
      const funnelEl = svg.querySelector('.funnel'), dust = svg.querySelector('.dust');
      gsap.set(funnelEl, { transformOrigin: '50% 0%', scaleY: 0.35 });
      gsap.set(dust, { transformOrigin: '50% 50%', scale: 0 });
      let tl = null;
      return {
        enter() {
          tl?.kill();
          tl = gsap.timeline({ repeat: -1, repeatDelay: 0.6 })
            .to(funnelEl, { scaleY: 1, duration: 1.1, ease: 'power2.in' })
            .to(dust, { scale: 1, duration: 0.4, ease: 'power2.out' }, '-=0.2')
            .to(funnelEl, { skewX: 8, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: 3 })
            .to([funnelEl, dust], { opacity: 0, duration: 0.5 })
            .set(funnelEl, { scaleY: 0.35, skewX: 0, opacity: 1 })
            .set(dust, { scale: 0, opacity: 0.8 });
        },
        move() {},
        leave() {
          tl?.kill(); tl = null;
          gsap.to(funnelEl, { scaleY: 0.35, skewX: 0, opacity: 1, duration: 0.5, overwrite: true });
          gsap.to(dust, { scale: 0, opacity: 0.8, duration: 0.4, overwrite: true });
        },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // One big twister, free on the ground: the wall cloud, the funnel, the grit at its foot.
  const A = { top: [64, 38], ground: 106, r0: 25, r1: 3.2, cloudY: 30, ck: 1, n: 22, m: 18, k: 1, rest: 70, range: [34, 94], lift: [26, 70] };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [6, 6, 116, 104],
    idea: 'The twister as a live model, the way Wind map draws its globe. A slate wall cloud with an eerie green belly; under it the funnel flares and narrows to a rope. Strands wind round the core as helices and spin faster down the rope; dashes run up them as the air rises. The cloud bands turn; grit and wheat chaff orbit the foot, the far half behind the funnel. The pointer drags the foot and the rope bends after it; high in the tile it lifts the rope off the ground and the grit drops away.',
    art(svg, u) {
      svg.innerHTML = `<defs>${twisterDefs(u)}</defs>${twisterMarkup(u, A)}`;
      return twister(svg, u, A);
    },
    emblem: `${EMB_HEAD}<path d="${restFunnel(A)}" fill="#fff"/><ellipse cx="${A.rest}" cy="${A.ground - 3}" rx="20" ry="8" fill="#9a9a9a"/><path d="${cloud(A.top[0], A.cloudY, A.ck)}" fill="#fff"/></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The field is the block: ripe wheat on top, a road across it, soil on the faces.
  // The twister walks across it.
  const CY = 88, HALF = 26, T = 14;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const [N, E, S, W] = D_TOP;
  const down = p => [p[0], p[1] + T];
  const D_ROAD = poly([iso(-HALF, -4), iso(HALF, -4), iso(HALF, 4), iso(-HALF, 4)]);
  const D = { top: [64, 31], ground: 94, r0: 18, r1: 2.6, cloudY: 25, ck: 0.72, n: 18, m: 14, k: 0.74, rest: 70, range: [50, 82], lift: [24, 66] };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [17, 10, 94, 120],
    idea: 'The field is the block: ripe wheat on the top with the road across it, soil on the faces, a rim on the top edges. The live twister stands on it, its wall cloud above, grit orbiting its foot on the field. The pointer drags the foot across the field; high in the tile it lifts the rope.',
    art(svg, u) {
      svg.innerHTML = `<defs>${twisterDefs(u)}${blur(`${u}s`, 2.6)}
          ${lg(`${u}wheat`, [[0, 'oklch(0.84 0.12 88)'], [1, 'oklch(0.66 0.13 72)']], 'x1="0.3" y1="0" x2="0.6" y2="1"')}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 290)" opacity="0.5" filter="url(#${u}s)" transform="translate(0 4)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="oklch(0.46 0.07 58)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="oklch(0.32 0.05 50)"/>
        <path d="${poly(D_TOP)}" fill="url(#${u}wheat)"/>
        <path d="${D_ROAD}" fill="oklch(0.3 0.012 250)"/>
        <path d="${poly(D_TOP)}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        ${twisterMarkup(u, D)}`;
      return twister(svg, u, D);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/><path d="${D_ROAD}" fill="#444"/><path d="${restFunnel(D)}" fill="#fff"/><path d="${cloud(D.top[0], D.cloudY, D.ck)}" fill="#fff"/></svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = 'Tornado alley';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-tornado';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `tornado-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
