<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 28</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; -webkit-mask: var(--emblem) center / contain no-repeat; -webkit-mask-source-type: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike 28</h1>
<p class="lede">Ten seconds (was Marsh launch), round 1: no rocket drawn. A streak, a rim of light, a ring of sound. Each shows at 256, 128 and 64. Move the pointer over a tile.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const set = (e, a) => { for (const k in a) e.setAttribute(k, a[k]); };
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const polyD = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';

  /* ================= Shared kit ================= */

  const SHADOW = 'oklch(0.07 0.01 265)';
  const GOLD = 'oklch(0.9 0.15 85)', HOT = 'oklch(0.98 0.04 95)', EMBER = 'oklch(0.7 0.16 45)', ROSE = 'oklch(0.55 0.12 350)';
  const lin = (defs, id, x1, y1, x2, y2, stops, user) => {
    const g = el('linearGradient', { id, x1, y1, x2, y2, ...(user ? { gradientUnits: 'userSpaceOnUse' } : {}) }, defs);
    stops.forEach(([o, c, a = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g));
    return g;
  };
  const glowF = (defs, id, sd = 1.6) => {
    const g = el('filter', { id, x: -0.5, y: -0.5, width: 2, height: 2 }, defs);
    el('feGaussianBlur', { stdDeviation: sd, result: 'b' }, g);
    const m = el('feMerge', {}, g);
    el('feMergeNode', { in: 'b' }, m);
    el('feMergeNode', { in: 'SourceGraphic' }, m);
  };
  // The dusk face: deep blue above, a rose band low.
  const duskDefs = (defs, id) => lin(defs, `${id}bg`, 0, 0, 0, 1, [[0, 'oklch(0.17 0.05 272)'], [0.62, 'oklch(0.27 0.07 305)'], [1, 'oklch(0.4 0.1 340)']]);
  // A square block with a hard offset shadow.
  const block = (svg, fill) => {
    el('rect', { x: 20, y: 20, width: 94, height: 94, fill: SHADOW }, svg);
    return el('rect', { x: 14, y: 14, width: 94, height: 94, fill }, svg);
  };
  const clipBlock = (defs, id) => { const c = el('clipPath', { id }, defs); el('rect', { x: 14, y: 14, width: 94, height: 94 }, c); return `url(#${id})`; };
  // A flat-top hex block with a hard offset shadow.
  const HEX = (cx, cy, r) => Array.from({ length: 6 }, (_, i) => { const a = (i / 6) * TAU; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
  const hexBlock = (svg, fill) => {
    el('path', { d: polyD(HEX(67, 67, 48)), fill: SHADOW }, svg);
    return el('path', { d: polyD(HEX(61, 61, 48)), fill }, svg);
  };
  const clipHex = (defs, id) => { const c = el('clipPath', { id }, defs); el('path', { d: polyD(HEX(61, 61, 48)) }, c); return `url(#${id})`; };
  // A control: aim from the pointer, a demo on focus, a rest on leave.
  const ctl = ({ aim, rest, demo, enter = () => {}, leave = () => {} }) => {
    let tl = null;
    return {
      enter(p) { enter(); if (p) aim(p); else tl = demo(); },
      move(p) { if (p && !tl) aim(p); },
      leave() { tl?.kill(); tl = null; leave(); rest(); },
    };
  };
  // A tweened scalar with a draw callback.
  const knob = (v, draw) => {
    const st = { v };
    draw(st.v);
    return {
      st,
      to(v, d = 0.35, ease = 'power2.out') { gsap.to(st, { v, duration: d, ease, overwrite: 'auto', onUpdate: () => draw(st.v) }); },
      sweep(a, b, d = 1.8) { return gsap.fromTo(st, { v: a }, { v: b, duration: d, ease: 'sine.inOut', yoyo: true, repeat: -1, onUpdate: () => draw(st.v) }); },
    };
  };

  /* ================= Current: the menu tile today ================= */

  const CURRENT_ART = (svg, id) => {
    const defs = el('defs', {}, svg);
    lin(defs, `${id}sky`, 0, 16, 0, 80, [[0, 'oklch(0.2 0.06 270)'], [0.7, 'oklch(0.32 0.08 320)'], [1, 'oklch(0.66 0.14 50)']], true);
    lin(defs, `${id}glow`, 0, 80, 0, 30, [[0, 'oklch(0.5 0.03 270)'], [0.55, 'oklch(0.58 0.04 270)'], [0.8, 'oklch(0.88 0.14 80)']], true);
    const c = el('clipPath', { id: `${id}c` }, defs); el('rect', { x: 16, y: 16, width: 92, height: 92 }, c);
    el('rect', { x: 22, y: 22, width: 92, height: 92, fill: 'oklch(0.07 0.01 260)' }, svg);
    el('rect', { x: 16, y: 16, width: 92, height: 92, fill: `url(#${id}sky)` }, svg);
    const g = el('g', { 'clip-path': `url(#${id}c)` }, svg);
    const plume = el('path', { d: 'M58 80C58 66 59 52 66 34', stroke: `url(#${id}glow)`, 'stroke-width': 3.2, 'stroke-linecap': 'round', fill: 'none' }, g);
    const rocket = el('circle', { cx: 61, cy: 57, r: 2.4, fill: 'oklch(0.97 0.05 90)' }, g);
    el('rect', { x: 16, y: 78, width: 92, height: 3, fill: 'oklch(0.11 0.02 280)' }, g);
    el('rect', { x: 16, y: 81, width: 92, height: 27, fill: 'oklch(0.2 0.05 310)' }, g);
    el('rect', { x: 16, y: 81, width: 92, height: 2, fill: 'oklch(0.55 0.12 45)', opacity: 0.7 }, g);
    const reeds = el('g', { stroke: 'oklch(0.08 0.01 280)', 'stroke-width': 1.6, 'stroke-linecap': 'square', fill: 'oklch(0.08 0.01 280)' }, g);
    el('path', { d: 'M20 108L18 86M25 108L27 82M30 108L29 90M34 108L37 94M90 108L88 92M95 108L98 80M100 108L102 86M105 108L103 90' }, reeds);
    el('path', { d: 'M16 108V98L24 96L32 99L40 104L48 108ZM84 108L90 101L98 97L108 96V108Z', stroke: 'none' }, reeds);
    const st = { p: 0.55 };
    let len = plume.getTotalLength() || 60;
    plume.style.strokeDasharray = len;
    const draw = () => {
      const pt = plume.getPointAtLength(st.p * len);
      set(rocket, { cx: f(pt.x), cy: f(pt.y) });
      plume.style.strokeDashoffset = f(len * (1 - st.p));
    };
    draw();
    let flight = null;
    const fly = () => { st.p = 0; draw(); flight = gsap.to(st, { p: 1, duration: 1.6, ease: 'power2.in', onUpdate: draw, onComplete: () => { flight = gsap.delayedCall(0.3, fly); } }); };
    return ctl({
      aim() {},
      enter() { if (!flight) fly(); },
      rest() { flight?.kill(); flight = null; gsap.fromTo(st, { p: 0 }, { p: 0.55, duration: 0.5, ease: 'power1.out', overwrite: true, onUpdate: draw }); },
      demo: () => ({ kill() {} }),
    });
  };

  /* ================= Round 1: no rocket drawn ================= */

  const DIRS = [
    {
      l: 'Current', name: 'Sky box',
      box: [10, 10, 110, 110],
      art: CURRENT_ART,
    },
    {
      l: 'A', name: 'Slant',
      idea: 'A dark block. One hard gold streak leaves the lower left corner on a slant, a hot square speck at its head. Pointer x pulls the head along; on focus it draws itself again and again.',
      box: [10, 10, 110, 110],
      art(svg, id) {
        const defs = el('defs', {}, svg);
        duskDefs(defs, id);
        lin(defs, `${id}st`, 0, 1, 1, 0, [[0, EMBER, 0.15], [0.45, EMBER, 0.75], [1, GOLD, 1]]);
        glowF(defs, `${id}g`, 1.8);
        block(svg, `url(#${id}bg)`);
        const inner = el('g', { 'clip-path': clipBlock(defs, `${id}c`) }, svg);
        const streak = el('path', { fill: `url(#${id}st)` }, inner);
        const head = el('rect', { width: 7, height: 7, fill: HOT, filter: `url(#${id}g)` }, inner);
        // The streak: a wedge from the corner to the head, wide at the tail, a point at the head.
        const T = [16, 112], E = [106, 22];
        const k = knob(0.55, u => {
          const hx = lerp(T[0], E[0], u), hy = lerp(T[1], E[1], u);
          const dx = hx - T[0], dy = hy - T[1], m = Math.hypot(dx, dy) || 1, nx = -dy / m, ny = dx / m;
          const w = 5.5;
          streak.setAttribute('d', polyD([[T[0] - nx * w, T[1] - ny * w], [T[0] + nx * w, T[1] + ny * w], [hx + nx * 1.2, hy + ny * 1.2], [hx - nx * 1.2, hy - ny * 1.2]]));
          set(head, { x: f(hx - 3.5), y: f(hy - 3.5), opacity: f(0.3 + 0.7 * u) });
        });
        return ctl({
          aim: p => k.to(clamp((p[0] - 20) / 86, 0.08, 1)),
          rest: () => k.to(0.55, 0.8, 'power3.out'),
          demo: () => gsap.fromTo(k.st, { v: 0.05 }, { v: 1, duration: 1.5, ease: 'power2.in', repeat: -1, repeatDelay: 0.4, onUpdate: () => k.to(k.st.v, 0) }),
        });
      },
      emblem() {
        return `${EMB_HEAD}
  <path d="M8 124L20 112L104 22L112 30L24 120Z" fill="#8c8c8c"/>
  <rect x="100" y="16" width="16" height="16" fill="#fff"/>
</svg>
`;
      },
    },
    {
      l: 'B', name: 'Rim',
      idea: 'A hex block. A thin dawn hairline sits on the lower third; one dot climbs above it. The higher the dot, the brighter the line: light reaches the sky first. Pointer y lifts the dot.',
      box: [6, 6, 116, 116],
      art(svg, id) {
        const defs = el('defs', {}, svg);
        duskDefs(defs, id);
        lin(defs, `${id}rim`, 0, 1, 0, 0, [[0, EMBER, 0.9], [1, EMBER, 0]], false);
        glowF(defs, `${id}g`, 1.4);
        hexBlock(svg, `url(#${id}bg)`);
        const inner = el('g', { 'clip-path': clipHex(defs, `${id}c`) }, svg);
        const haze = el('rect', { x: 10, y: 60, width: 104, height: 26, fill: `url(#${id}rim)`, opacity: 0.3 }, inner);
        const line = el('rect', { x: 10, y: 85, width: 104, height: 1.4, fill: EMBER, opacity: 0.45 }, inner);
        el('rect', { x: 10, y: 86.4, width: 104, height: 30, fill: 'oklch(0.12 0.02 290)' }, inner);
        const dot = el('rect', { x: 60.5, width: 5, height: 5, fill: HOT, filter: `url(#${id}g)` }, inner);
        const k = knob(0.35, u => {
          set(dot, { y: f(82 - 58 * u), opacity: f(0.5 + 0.5 * u) });
          set(line, { opacity: f(0.35 + 0.65 * u), height: f(1.2 + 1.6 * u), y: f(85 - 0.8 * u), fill: u > 0.6 ? GOLD : EMBER });
          set(haze, { opacity: f(0.12 + 0.5 * u) });
        });
        return ctl({
          aim: p => k.to(clamp((96 - p[1]) / 72, 0, 1)),
          rest: () => k.to(0.35, 0.8, 'power3.out'),
          demo: () => k.sweep(0.05, 1, 2),
        });
      },
      emblem() {
        return `${EMB_HEAD}
  <path d="M64 6L114 35V93L64 122L14 93V35Z" fill="none" stroke="#8c8c8c" stroke-width="8"/>
  <rect x="26" y="84" width="76" height="6" fill="#fff"/>
  <rect x="58" y="40" width="12" height="12" fill="#fff"/>
</svg>
`;
      },
    },
    {
      l: 'C', name: 'Ring',
      idea: 'A block with a dawn line and three brut reeds. A ring grows from a point on the horizon and the reeds lean away as it passes: the sound, ten seconds after the light. Hover fires rings.',
      box: [10, 10, 110, 110],
      art(svg, id) {
        const defs = el('defs', {}, svg);
        duskDefs(defs, id);
        glowF(defs, `${id}g`, 1.2);
        block(svg, `url(#${id}bg)`);
        const inner = el('g', { 'clip-path': clipBlock(defs, `${id}c`) }, svg);
        el('rect', { x: 14, y: 84, width: 94, height: 1.6, fill: EMBER, opacity: 0.8 }, inner);
        el('rect', { x: 14, y: 85.6, width: 94, height: 24, fill: 'oklch(0.13 0.02 290)' }, inner);
        const origin = [64, 84];
        const rings = [0, 1, 2].map(() => el('circle', { cx: origin[0], cy: origin[1], fill: 'none', stroke: GOLD, filter: `url(#${id}g)` }, inner));
        // Three reeds: hard bars from the ground, each with a blunt head.
        const RX = [30, 50, 92];
        const reeds = RX.map(x => {
          const g = el('g', {}, inner);
          el('rect', { x: x - 1.4, y: 60, width: 2.8, height: 50, fill: 'oklch(0.08 0.01 280)' }, g);
          // The plume: a slanted wedge that leans downwind, wider at its base.
          el('path', { d: polyD([[x - 2.2, 62], [x + 2.2, 62], [x + 9, 48], [x + 4, 44]]), fill: 'oklch(0.08 0.01 280)' }, g);
          return { g, x };
        });
        const st = [{ p: 2 }, { p: 2 }, { p: 2 }];
        const draw = () => {
          let lean = RX.map(() => 0);
          st.forEach((s, i) => {
            const p = s.p, on = p <= 1, r = 6 + 70 * p;
            set(rings[i], { r: f(r), 'stroke-width': f(3.2 - 2.4 * p), opacity: on ? f(p < 0.12 ? p / 0.12 : 1 - Math.max(0, p - 0.55) / 0.45) : 0 });
            if (!on) return;
            // A reed leans away from the ring as its edge passes the reed's foot.
            RX.forEach((x, j) => { const d = Math.hypot(x - origin[0], 108 - origin[1]) - r; lean[j] += Math.sign(x - origin[0]) * 14 * Math.exp(-(d * d) / 90) * (1 - p * 0.5); });
          });
          reeds.forEach((rd, j) => rd.g.setAttribute('transform', `translate(${f(rd.x)} 110) skewX(${f(lean[j])}) translate(${f(-rd.x)} -110)`));
        };
        draw();
        let gun = null, n = 0;
        const fire = () => { const s = st[n++ % 3]; gsap.fromTo(s, { p: 0 }, { p: 1, duration: 1.6, ease: 'power1.out', onUpdate: draw }); };
        const start = () => { if (gun) return; fire(); gun = gsap.delayedCall(0.7, function again() { fire(); gun = gsap.delayedCall(0.7, again); }); };
        return ctl({
          aim() {},
          rest() { gun?.kill(); gun = null; st.forEach(s => gsap.killTweensOf(s)); st.forEach(s => { s.p = 2; }); gsap.fromTo(st[0], { p: 0 }, { p: 0.45, duration: 0.8, ease: 'power2.out', onUpdate: draw }); },
          demo: () => { start(); return { kill() {} }; },
          enter: start,
        });
      },
      emblem() {
        return `${EMB_HEAD}
  <path d="M14 92H114" stroke="#fff" stroke-width="6"/>
  <circle cx="64" cy="92" r="24" fill="none" stroke="#8c8c8c" stroke-width="6"/>
  <circle cx="64" cy="92" r="46" fill="none" stroke="#8c8c8c" stroke-width="4"/>
  <rect x="26" y="56" width="8" height="40" fill="#fff" transform="skewX(-8) translate(8 0)"/>
  <rect x="44" y="62" width="8" height="34" fill="#fff" transform="skewX(-5) translate(6 0)"/>
  <rect x="90" y="54" width="8" height="42" fill="#fff" transform="skewX(9) translate(-14 0)"/>
</svg>
`;
      },
    },
  ];

  /* ================= Gallery ================= */

  const NAME = 'Ten seconds';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box === 'auto' ? svg.getBBox() : box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : { x: 14, y: 14, width: 100, height: 100 }, side = Math.max(b.width, b.height);
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-launch';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  window.CTL = {};
  for (const D of DIRS) {
    const file = `launch28-${D.l.toLowerCase()}`;
    const url = D.l === 'Current' ? '' : `spike/emblems/${file}.svg`;
    if (D.emblem) window.EMBLEMS[file] = D.emblem();
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = D.l === 'Current' ? 'launch-current' : file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tile => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      (window.CTL[D.l] ||= []).push({ c, svg });
      if (reduce) return;
      tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tile.addEventListener('pointermove', e => c.move(local(svg, e)));
      tile.addEventListener('pointerleave', () => c.leave());
      tile.addEventListener('focus', () => c.enter(null));
      tile.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
