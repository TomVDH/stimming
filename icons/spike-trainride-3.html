<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Train Ride 3</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Train Ride 3</h1>
<p class="lede">Train Ride, round 3. Current is A of spike trainride-1, Tom's pick: the cabin window. This round shows the train, with the lake in its windows. A: a red regional railcar from the side under its wire. D: the railcar as the block, its long side the left face.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The menu tile's ids take the tile prefix, so three copies can live.
  const ids = (m, u) => m.replace(/id="([^"]+)"/g, `id="${u}$1"`).replace(/url\(#([^)]+)\)/g, `url(#${u}$1)`).replace(/href="#([^"]+)"/g, `href="#${u}$1"`);

  const DIRS = [];

  // The toy's tokens: a red railcar with a white band, dark glass, the lake and the far shore by day.
  const RED = [[0, 'oklch(0.6 0.2 27)'], [1, 'oklch(0.42 0.17 25)']];
  const GLASS = [[0, 'oklch(0.32 0.02 250)'], [1, 'oklch(0.16 0.02 255)']];
  const SKY = [[0, 'oklch(0.74 0.09 240)'], [1, 'oklch(0.92 0.03 230)']];
  const SHORE = 'oklch(0.62 0.08 145)', LAKE = 'oklch(0.6 0.09 232)', NEAR = 'oklch(0.66 0.14 135)';
  const DARK = 'oklch(0.2 0.01 260)';
  const rr = (x, y, w, h, r) => `M${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}H${x + r}Q${x} ${y + h} ${x} ${y + h - r}V${y + r}Q${x} ${y} ${x + r} ${y}Z`;

  /* ================= Current ================= */

  // The menu icon today: A of spike trainride-1, Tom's pick; a mast sweeps past.
  const CUR = `<defs><clipPath id="trainride-c"><rect x="18" y="26" width="92" height="70" rx="12"/></clipPath></defs>
  <rect x="6" y="6" width="116" height="116" rx="14" fill="oklch(0.9 0.02 85)"/>
  <rect x="13" y="21" width="102" height="80" rx="16" fill="oklch(0.78 0.025 80)"/>
  <g clip-path="url(#trainride-c)"><g>
  <defs><linearGradient id="trainride-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.72 0.09 240)"/><stop offset="1" stop-color="oklch(0.93 0.03 230)"/></linearGradient>
  <linearGradient id="trainride-lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.72 0.07 230)"/><stop offset="1" stop-color="oklch(0.5 0.1 240)"/></linearGradient></defs>
  <rect x="0" y="0" width="128" height="128" fill="url(#trainride-sky)"/>
  <g><ellipse cx="44" cy="40" rx="14" ry="5" fill="oklch(0.98 0.01 240)"/><ellipse cx="52" cy="37" rx="9" ry="6" fill="oklch(0.98 0.01 240)"/><ellipse cx="88" cy="46" rx="11" ry="3.5" fill="oklch(0.98 0.01 240)" opacity="0.85"/></g>
  <path d="M0 64 Q20 56 40 60 T80 57 T128 59 V72 H0Z" fill="oklch(0.62 0.07 150)"/>
  <g fill="oklch(0.97 0.005 90)"><rect x="58" y="62" width="3" height="2.4"/><rect x="63" y="61.5" width="2.6" height="2.8"/><rect x="92" y="62" width="3" height="2.2"/></g>
  <g fill="oklch(0.45 0.1 40)"><rect x="58" y="61.2" width="3" height="1"/><rect x="63" y="60.8" width="2.6" height="1"/><rect x="92" y="61.2" width="3" height="1"/></g>
  <rect x="0" y="66" width="128" height="20" fill="url(#trainride-lake)"/>
  <g id="trainride-glint" stroke="oklch(0.98 0.01 240)" stroke-width="1.2" stroke-linecap="round" opacity="0.8"><path d="M30 72h10M70 76h14M100 71h8M50 80h9"/></g>
  <path d="M0 84 Q40 81 70 83 T128 82 V128 H0Z" fill="oklch(0.7 0.15 135)"/>
  <path d="M0 92 Q50 88 128 91 V128 H0Z" fill="oklch(0.58 0.14 140)"/></g>
  <g id="trainride-mast"><rect x="96" y="26" width="5" height="70" fill="oklch(0.22 0.01 260)"/><rect x="88" y="44" width="14" height="2.4" fill="oklch(0.22 0.01 260)"/></g>
  <rect x="18" y="44" width="92" height="2.2" fill="oklch(0.22 0.01 260)" opacity="0.9"/><rect x="18" y="43.4" width="92" height="0.7" fill="oklch(0.98 0.01 240)" opacity="0.7"/>
  </g>
  <rect x="18" y="26" width="92" height="70" rx="12" fill="none" stroke="oklch(0.22 0.01 260)" stroke-opacity="0.25" stroke-width="1.5"/>`;
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    box: 'bbox',
    art(svg, u) {
      svg.innerHTML = ids(CUR, u);
      const mast = svg.querySelector(`#${u}trainride-mast`), glint = svg.querySelector(`#${u}trainride-glint`);
      let tl = null;
      return {
        enter() {
          tl = gsap.timeline({ repeat: -1 })
            .fromTo(mast, { x: 30 }, { x: -110, duration: 0.6, ease: 'none' })
            .fromTo(glint, { x: 0 }, { x: -24, duration: 0.6, ease: 'none' }, 0);
        },
        move() {},
        leave() { tl?.kill(); gsap.to([mast, glint], { x: 0, duration: 0.3, overwrite: true }); },
      };
    },
  });

  /* ================= The view ================= */

  // The view through the windows: sky, far shore with a village, the lake, the near meadow.
  // It repeats every 64 units, so a scroll can wrap. y0: the shore line.
  const view = (u, y0, x0, x1) => {
    const tile = k => `<path d="M${k} ${y0}Q${k + 10} ${y0 - 5} ${k + 22} ${y0 - 2}T${k + 44} ${y0 - 3}T${k + 64} ${y0}V${y0 + 4}H${k}Z" fill="${SHORE}"/>
      <path d="M${k + 14} ${y0 - 2.6}h3v2.4h-3ZM${k + 19} ${y0 - 3}h2.6v2.8h-2.6ZM${k + 46} ${y0 - 2.4}h3v2.2h-3Z" fill="oklch(0.97 0.005 90)"/>
      <path d="M${k + 8} ${y0 + 7}h8M${k + 38} ${y0 + 9}h10" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>`;
    return `<rect x="${x0}" y="${y0 - 30}" width="${x1 - x0}" height="30" fill="url(#${u}sky)"/>
      <rect x="${x0}" y="${y0 + 2}" width="${x1 - x0}" height="14" fill="${LAKE}"/>
      <g class="scroll">${[-64, 0, 64, 128, 192].map(k => tile(x0 + k)).join('')}</g>
      <rect x="${x0}" y="${y0 + 14}" width="${x1 - x0}" height="12" fill="${NEAR}"/>
      <g class="mast"><path d="M${x0 + 40} ${y0 - 30}h4v60h-4Z" fill="${DARK}"/></g>`;
  };
  const trainDefs = u => `${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}sp`, 1.4)}
    ${lg(`${u}red`, RED)}${lg(`${u}glass`, GLASS)}${lg(`${u}sky`, SKY)}
    ${lg(`${u}steel`, [[0, 'oklch(0.45 0.01 260)'], [1, 'oklch(0.22 0.01 260)']])}`;

  // The shared motion: the pointer sets the train going. The view scrolls past in the windows,
  // a mast sweeps by, the car bobs, the pantograph sparks on the wire. Right of the middle runs faster.
  const run = (svg, opt) => {
    const scrolls = [...svg.querySelectorAll('.scroll')], masts = [...svg.querySelectorAll('.mast')], car = svg.querySelector('.car'), spark = svg.querySelector('.spark');
    const st = { live: false, v: 0, tv: 0, x: 0, m: 0, last: 0 };
    const step = time => {
      const dt = Math.min(0.05, time - (st.last || time));
      st.last = time;
      st.v += ((st.live ? st.tv : 0) - st.v) * Math.min(1, dt * 2.5);
      st.x = (st.x + st.v * dt) % 64;
      st.m = (st.m + st.v * dt * 1.8) % 160;
      scrolls.forEach(s => s.setAttribute('transform', `translate(${f(-st.x)} 0)`));
      masts.forEach(m => m.setAttribute('transform', `translate(${f(60 - st.m)} 0)`));
      const k = st.v / 60;
      car.setAttribute('transform', `translate(0 ${f(Math.sin(time * 11) * 0.5 * k)})`);
      spark.setAttribute('opacity', f(k > 0.3 && Math.sin(time * 23) > 0.85 ? 1 : 0));
      if (!st.live && st.v < 0.2) { st.v = 0; spark.setAttribute('opacity', '0'); car.removeAttribute('transform'); st.last = 0; loop.stop(); }
    };
    const loop = clock(step);
    const aim = p => { st.tv = p ? 30 + 70 * clamp((p[0] - opt.x0) / opt.w) : 60; };
    return {
      enter(p) { st.live = true; aim(p); loop.start(); },
      move(p) { if (p) aim(p); },
      leave() { st.live = false; loop.start(); },
    };
  };

  /* ================= A: Shaded object ================= */

  // A red regional railcar from the side, nose to the right, under its wire.
  const BODY = 'M11 40H94Q110 40 117 56L121 79Q122 92 111 92H11Q6 92 6 87V45Q6 40 11 40Z';
  const WINS = [[13, 48, 22, 18], [40, 48, 22, 18], [67, 48, 22, 18]];
  const WIN_D = WINS.map(w => rr(...w, 4)).join('');
  const NOSE = 'M96 47H105Q112 48 115 60L116.4 66H96Z';
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [2, 8, 124, 102],
    idea: 'The train itself, with the lake in its windows: a red regional railcar from the side, nose to the right, a white band along it, dark glass with the toy\'s view inside (sky, the far shore and its village, the lake, the meadow), two bogies on the rail, the pantograph up to the wire. The pointer sets it going: the view scrolls past in the windows, a mast sweeps by, the car bobs and the pantograph sparks. Right of the middle runs faster.',
    art(svg, u) {
      svg.innerHTML = `<defs>${trainDefs(u)}<clipPath id="${u}w"><path d="${WIN_D}${NOSE}"/></clipPath></defs>
        <path d="M4 10H124" stroke="oklch(0.6 0.01 260)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M2 106H126" stroke="oklch(0.62 0.01 260)" stroke-width="3.6" stroke-linecap="round"/>
        <ellipse cx="64" cy="109" rx="58" ry="3" fill="oklch(0.05 0.01 260)" opacity="0.5" filter="url(#${u}b)"/>
        <g class="car">
          <path d="M36 39L44 25L36 11H54" fill="none" stroke="${DARK}" stroke-width="3" stroke-linejoin="round"/>
          <path d="M30 36H50V40H30Z" fill="${DARK}"/>
          <circle class="spark" cx="50" cy="10" r="3.6" fill="oklch(0.95 0.08 290)" opacity="0" filter="url(#${u}sp)"/>
          ${[[14, 36], [82, 104]].map(([a, b]) => `<path d="${rr(a, 90, b - a, 8, 3)}" fill="${DARK}"/>${[a + 6, b - 6].map(x => `<circle cx="${x}" cy="100" r="5.4" fill="url(#${u}steel)"/><circle cx="${x}" cy="100" r="1.8" fill="oklch(0.7 0.01 260)"/>`).join('')}`).join('')}
          ${body(BODY, u, 'red')}
          <path d="M6 74H121.5V79H6Z" fill="oklch(0.97 0.005 90)"/>
          <path d="${WIN_D}${NOSE}" fill="url(#${u}glass)"/>
          <g clip-path="url(#${u}w)">${view(u, 60, 0, 128)}</g>
          <path d="${WIN_D}${NOSE}" fill="url(#${u}lit)" opacity="0.8"/>
          <path d="${WIN_D}${NOSE}" fill="none" stroke="${DARK}" stroke-width="2"/>
          <circle cx="116.6" cy="86" r="2.4" fill="oklch(0.97 0.05 95)"/>
        </g>`;
      return run(svg, { x0: 10, w: 108 });
    },
    emblem: `${EMB_HEAD}<path d="M4 10H124" stroke="#fff" stroke-width="2.4"/><path d="M36 39L44 25L36 11H54" fill="none" stroke="#fff" stroke-width="3"/><path d="M30 36H50V40H30Z" fill="#fff"/><path d="${BODY}" fill="#fff"/><path d="M6 74H121.5V79H6Z" fill="#8a8a8a"/><path d="${WIN_D}${NOSE}" fill="#000"/>${[[14, 36], [82, 104]].map(([a, b]) => [a + 6, b - 6].map(x => `<circle cx="${x}" cy="100" r="5.4" fill="#fff"/>`).join('')).join('')}<path d="M2 106H126" stroke="#9a9a9a" stroke-width="3.6"/></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The railcar is the block: its long side is the left face, its cab the right face, its roof the top.
  const CY = 80, L = 40, B = 12, H = 28;
  const iso = (gx, gy, h = 0) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5 - h];
  const LF = `matrix(0.866 0.5 0 1 ${f(iso(-L, B, H)[0])} ${f(iso(-L, B, H)[1])})`;
  const RF = `matrix(0.866 -0.5 0 1 ${f(iso(L, B, H)[0])} ${f(iso(L, B, H)[1])})`;
  const LFACE = poly([iso(-L, B, H), iso(L, B, H), iso(L, B), iso(-L, B)]);
  const RFACE = poly([iso(L, B, H), iso(L, -B, H), iso(L, -B), iso(L, B)]);
  const ROOF = poly([iso(-L, -B, H), iso(L, -B, H), iso(L, B, H), iso(-L, B, H)]);
  const D_WINS = [[6, 6, 18, 11], [28, 6, 18, 11], [50, 6, 18, 11]].map(w => rr(...w, 3)).join('');
  const D_CAB = rr(3, 4, 18, 11, 3);
  const PB = iso(-16, 0, H), PW = iso(-16, 0, H + 18);
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [16, 8, 96, 106],
    idea: 'The railcar is the block at 30 degrees: its red roof is the light top, its long side the left face with the windows, the white band and the lake view inside, its cab the dark right face with the windscreen and two headlights; a rim on the roof edges. The pantograph rises to the wire above. The pointer sets it going as in A: the view scrolls in the windows and the pantograph sparks.',
    art(svg, u) {
      svg.innerHTML = `<defs>${trainDefs(u)}
          ${lg(`${u}roof`, [[0, 'oklch(0.86 0.01 260)'], [1, 'oklch(0.66 0.01 260)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}cab`, [[0, 'oklch(0.44 0.17 25)'], [1, 'oklch(0.32 0.13 25)']])}
          <clipPath id="${u}w"><path d="${D_WINS}"/></clipPath></defs>
        <path d="M${iso(-L - 8, 0, H + 18).map(f).join(' ')}L${iso(L + 8, 0, H + 18).map(f).join(' ')}" stroke="oklch(0.6 0.01 260)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="${poly([iso(-L, B), iso(L, B), iso(L, -B), [iso(L, -B)[0], iso(L, -B)[1] + 8], [iso(L, B)[0], iso(L, B)[1] + 8], [iso(-L, B)[0], iso(-L, B)[1] + 8]])}" fill="oklch(0.05 0.01 260)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 3)"/>
        <g class="car">
          <path d="${LFACE}" fill="url(#${u}red)"/>
          <path d="${LFACE}" fill="url(#${u}lit)" opacity="0.6"/>
          <path d="${RFACE}" fill="url(#${u}cab)"/>
          <g transform="${LF}">
            <path d="M0 19H80V22H0Z" fill="oklch(0.97 0.005 90)"/>
            <path d="${D_WINS}" fill="url(#${u}glass)"/>
            <g clip-path="url(#${u}w)">${view(u, 12, 0, 80)}</g>
            <path d="${D_WINS}" fill="url(#${u}lit)" opacity="0.7"/>
            <path d="${D_WINS}" fill="none" stroke="${DARK}" stroke-width="1.6"/>
            <path d="M8 25H22V30H8ZM58 25H72V30H58Z" fill="${DARK}"/>
          </g>
          <g transform="${RF}">
            <path d="M0 19H24V22H0Z" fill="oklch(0.86 0.005 90)"/>
            <path d="${D_CAB}" fill="url(#${u}glass)"/><path d="${D_CAB}" fill="url(#${u}lit)" opacity="0.6"/>
            <circle cx="4" cy="25" r="1.8" fill="oklch(0.97 0.05 95)"/><circle cx="20" cy="25" r="1.8" fill="oklch(0.97 0.05 95)"/>
          </g>
          <path d="${ROOF}" fill="url(#${u}roof)"/>
          <path d="${ROOF}" fill="url(#${u}lit)"/>
          <path d="M${iso(-L, B, H).map(f).join(' ')}L${iso(-L, -B, H).map(f).join(' ')}L${iso(L, -B, H).map(f).join(' ')}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
          <path d="M${iso(-L, B, H).map(f).join(' ')}L${iso(L, B, H).map(f).join(' ')}L${iso(L, -B, H).map(f).join(' ')}" fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0.45" stroke-linejoin="round"/>
          <path d="M${f(PB[0] - 5)} ${f(PB[1] + 2)}L${f(PB[0] + 4)} ${f(PB[1] - 9)}L${f(PW[0] - 3)} ${f(PW[1])}H${f(PW[0] + 7)}" fill="none" stroke="${DARK}" stroke-width="2.6" stroke-linejoin="round"/>
          <circle class="spark" cx="${f(PW[0] + 3)}" cy="${f(PW[1])}" r="3.2" fill="oklch(0.95 0.08 290)" opacity="0" filter="url(#${u}sp)"/>
        </g>`;
      return run(svg, { x0: 20, w: 90 });
    },
    emblem: `${EMB_HEAD}<path d="M${iso(-L - 8, 0, H + 18).map(f).join(' ')}L${iso(L + 8, 0, H + 18).map(f).join(' ')}" stroke="#fff" stroke-width="2.4"/><path d="${LFACE}" fill="#fff"/><path d="${RFACE}" fill="#8a8a8a"/><path d="${ROOF}" fill="#c4c4c4"/><g transform="${LF}"><path d="${D_WINS}" fill="#000"/><path d="M0 19H80V22H0Z" fill="#7a7a7a"/></g><g transform="${RF}"><path d="${D_CAB}" fill="#000"/></g><path d="M${f(PB[0] - 5)} ${f(PB[1] + 2)}L${f(PB[0] + 4)} ${f(PB[1] - 9)}L${f(PW[0] - 3)} ${f(PW[1])}H${f(PW[0] + 7)}" fill="none" stroke="#fff" stroke-width="2.6"/></svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = "Train Ride";
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-trainride';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `trainride-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      // A menu tile with no data-box fits its drawn bounds, as the menu does.
      const bb = D.box === "bbox" && svg.getBBox();
      fitIcon(svg, bb ? [bb.x, bb.y, bb.width, bb.height] : D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
