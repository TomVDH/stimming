<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 10</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.4; }
.defs { position: absolute; width: 0; height: 0; }
/* Labels only: no explanation copy. */
.idea, .lede, .pick { display: none !important; }
</style>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- The current Pin art icon uses these two. -->
    <radialGradient id="g-pin" cx="0.36" cy="0.3" r="0.72">
      <stop offset="0" style="stop-color: oklch(0.98 0.02 215)"/>
      <stop offset="0.45" style="stop-color: oklch(0.84 0.09 225)"/>
      <stop offset="1" style="stop-color: oklch(0.6 0.13 245)"/>
    </radialGradient>
    <linearGradient id="g-pinframe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Pin art: the orange frame and a chrome head. -->
    <linearGradient id="p-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.74 0.17 55)"/>
      <stop offset="1" style="stop-color: oklch(0.54 0.18 37)"/>
    </linearGradient>
    <radialGradient id="p-chrome" cx="0.36" cy="0.32" r="0.7">
      <stop offset="0" style="stop-color: oklch(0.98 0.004 250)"/>
      <stop offset="0.5" style="stop-color: oklch(0.74 0.01 250)"/>
      <stop offset="1" style="stop-color: oklch(0.36 0.012 260)"/>
    </radialGradient>
    <linearGradient id="p-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.9 0.015 245)"/>
      <stop offset="1" style="stop-color: oklch(0.64 0.03 260)"/>
    </linearGradient>
    <!-- Oscilloscope: the case, the knob and the phosphor plate. -->
    <linearGradient id="s-case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.42 0.02 160)"/>
      <stop offset="1" style="stop-color: oklch(0.23 0.015 160)"/>
    </linearGradient>
    <radialGradient id="s-knob" cx="0.36" cy="0.3" r="0.75">
      <stop offset="0" style="stop-color: oklch(0.88 0.01 160)"/>
      <stop offset="1" style="stop-color: oklch(0.42 0.015 160)"/>
    </radialGradient>
    <radialGradient id="s-tube" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color: oklch(0.26 0.05 152)"/>
      <stop offset="1" style="stop-color: oklch(0.15 0.025 158)"/>
    </radialGradient>
    <linearGradient id="s-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.9 0.17 140)"/>
      <stop offset="1" style="stop-color: oklch(0.64 0.16 155)"/>
    </linearGradient>
  </defs>
</svg>

<h1>Icon spike 10</h1>
<p class="lede">Pin art, Oscilloscope.</p>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2, PI = Math.PI;
  const f = n => +(+n).toFixed(2);
  const pt = p => `${f(p[0])} ${f(p[1])}`;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(pt).join('L') + 'Z';
  const line = pts => 'M' + pts.map(pt).join('L');
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };

  const DIRS = [];

  /* ================= Pin art ================= */

  // A hand print as a depth field: palm plus five finger capsules, 0 to 1.
  const capsule = (x, y, [ax, ay, bx, by, r]) => {
    const px = x - ax, py = y - ay, dx = bx - ax, dy = by - ay;
    const t = clamp((px * dx + py * dy) / (dx * dx + dy * dy), 0, 1);
    return Math.hypot(px - dx * t, py - dy * t) - r;
  };
  const FINGERS = [[0.33, 0.66, 0.16, 0.47, 0.06], [0.41, 0.52, 0.35, 0.17, 0.058], [0.51, 0.5, 0.52, 0.1, 0.062], [0.6, 0.52, 0.67, 0.16, 0.058], [0.67, 0.58, 0.8, 0.33, 0.052]];
  const handH = (u, v) => {
    let d = (Math.hypot((u - 0.52) / 0.19, (v - 0.69) / 0.17) - 1) * 0.17;
    for (const c of FINGERS) d = Math.min(d, capsule(u, v, c));
    return smooth(clamp((0.03 - d) / 0.07, 0, 1));
  };

  // Current: the menu icon, copied as it is.
  DIRS.push({
    toy: 'pins', l: 'Current', name: 'menu icon', emblemUrl: '../shared/emblems/pins.svg',
    art(svg) {
      svg.innerHTML = `<rect x="9" y="9" width="110" height="110" rx="7" fill="none" stroke="url(#g-pinframe)" stroke-width="1.5"/><g fill="url(#g-pin)"></g>`;
      const g = svg.querySelector('g'), heads = [];
      for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
        const x = 18 + c * 11.5, y = 18 + r * 11.5;
        const k = Math.exp(-((x - 54) ** 2 + (y - 58) ** 2) / (2 * 22 * 22));
        const r0 = 1.4 + 4.3 * k, o0 = 0.35 + 0.65 * Math.min(1, (r0 - 1.4) / 3);
        heads.push({ n: el('circle', { cx: x, cy: y, r: r0.toFixed(1), 'fill-opacity': o0.toFixed(2) }, g), x, y, r0, o0 });
      }
      const press = p => heads.forEach(h => {
        const k = Math.exp(-((p[0] - h.x) ** 2 + (p[1] - h.y) ** 2) / (2 * 13 * 13));
        const r = 1.4 + 4.3 * k;
        if (r <= +h.n.getAttribute('r') + 0.2) return;
        gsap.timeline({ overwrite: true })
          .to(h.n, { attr: { r, 'fill-opacity': 1 }, duration: 0.12, ease: 'power2.out' })
          .to(h.n, { attr: { r: h.r0, 'fill-opacity': h.o0 }, duration: 1.2, ease: 'power2.inOut' }, '+=0.35');
      });
      return { enter: p => press(p || [64, 64]), move: p => p && press(p), leave() {} };
    },
  });

  // A: the orange board with a chrome hand print; hover shakes it flat, then the hand presses back.
  {
    const G = 15, X0 = 23, SP = 6;
    const ticks = () => {
      let d = '';
      for (let k = 0; k <= 8; k++) {
        const p = 24 + k * 10, n = k % 2 ? 2.6 : 4.4;
        d += `M${p} 10.6v${n}M${p} 117.4v-${n}M10.6 ${p}h${n}M117.4 ${p}h-${n}`;
      }
      return d;
    };
    const cells = [];
    for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
      const x = X0 + i * SP, y = X0 + j * SP, h = handH((x - 19) / 90, (y - 19) / 90);
      cells.push({ x, y, h, lag: clamp(Math.hypot(x - 66, y - 78) / 62, 0, 1) });
    }
    DIRS.push({
      toy: 'pins', l: 'A', name: 'Shaded object',
      art(svg) {
        svg.innerHTML = `
          <g class="board">
            <rect x="9" y="9" width="110" height="110" rx="8" fill="url(#p-frame)"/>
            <rect x="9" y="9" width="110" height="110" rx="8" fill="url(#lit)" opacity="0.7"/>
            <path d="${ticks()}" stroke="oklch(0.32 0.09 40)" stroke-width="1.3"/>
            <rect x="19" y="19" width="90" height="90" rx="2" fill="oklch(0.14 0.01 270)"/>
            <g class="pins" fill="url(#p-chrome)"></g>
          </g>`;
        const board = svg.querySelector('.board'), g = svg.querySelector('.pins');
        const P = cells.map(c => ({ ...c, n: el('circle', { cx: c.x, cy: c.y }, g) }));
        const st = { a: 1 };
        const draw = () => P.forEach(p => {
          // Pins nearest the palm move first.
          const h = p.h * clamp((st.a - p.lag * 0.4) / 0.6, 0, 1);
          p.n.setAttribute('r', f(1.15 + 1.6 * h));
          p.n.setAttribute('fill-opacity', f(0.5 + 0.5 * h));
        });
        draw();
        return hoverLoop(
          () => gsap.timeline({ repeat: -1, repeatDelay: 0.6 })
            .to(board, { keyframes: { x: [0, -2.4, 2.2, -1.8, 1.3, -0.7, 0], rotation: [0, -1.4, 1.2, -0.8, 0.5, -0.2, 0] }, svgOrigin: '64 64', duration: 0.6, ease: 'none' }, 0)
            .to(st, { a: 0, duration: 0.5, ease: 'power2.in', onUpdate: draw }, 0.05)
            .to(st, { a: 1, duration: 0.95, ease: 'power3.out', onUpdate: draw }, '+=0.35'),
          () => {
            gsap.to(board, { x: 0, rotation: 0, svgOrigin: '64 64', duration: 0.25, overwrite: true });
            gsap.to(st, { a: 1, duration: 0.7, ease: 'power2.out', overwrite: true, onUpdate: draw });
          });
      },
      emblem: emb(`
        <path d="M9 17A8 8 0 0 1 17 9H111A8 8 0 0 1 119 17V111A8 8 0 0 1 111 119H17A8 8 0 0 1 9 111ZM19 19V109H109V19Z" fill="#fff" fill-rule="evenodd"/>
        <path d="${ticks()}" stroke="#000" stroke-width="2"/>
        ${cells.filter(c => c.h > 0.02).map(c => `<circle cx="${c.x}" cy="${c.y}" r="${f(1.2 + 1.7 * c.h)}" fill="#fff"/>`).join('\n')}
      `),
    });
  }

  // B: the plate in section, one solid steel shape; a fingertip under the pointer pushes pins through.
  {
    const N = 9, xs = Array.from({ length: N }, (_, i) => 14 + (i * 100) / (N - 1));
    const PY = 76, PH = 16;
    const rise = (x, cx, D) => D * Math.exp(-((x - cx) ** 2) / (2 * 14 * 14));
    // Each pin is a shaft with a round head; the plate holes are cut beside it.
    const shape = (cx, D, w = 4.6, r = 5.4) => xs.map(x => {
      const d = rise(x, cx, D), hy = 66 - d;
      return `M${f(x - w / 2)} ${f(hy)}H${f(x + w / 2)}V${f(116 - d)}H${f(x - w / 2)}Z` + `M${f(x - r)} ${f(hy)}A${r} ${r} 0 1 0 ${f(x + r)} ${f(hy)}A${r} ${r} 0 1 0 ${f(x - r)} ${f(hy)}Z`;
    }).join('');
    const holes = (w = 1.8, s = 2.3) => xs.map(x => `M${f(x - s - w)} ${PY}h${w}v${PH}h-${w}ZM${f(x + s)} ${PY}h${w}v${PH}h-${w}Z`).join('');
    DIRS.push({
      toy: 'pins', l: 'B', name: 'Stencil cut-out',
      art(svg) {
        svg.innerHTML = `
          <path class="pins" fill="url(#p-steel)"/>
          <rect x="6" y="${PY}" width="116" height="${PH}" rx="2.5" fill="url(#p-steel)"/>
          <path d="${holes()}" style="fill: var(--bg)"/>`;
        const pins = svg.querySelector('.pins');
        const st = { x: 48, D: 30 };
        const draw = () => pins.setAttribute('d', shape(st.x, st.D));
        draw();
        const go = p => gsap.to(st, { x: clamp(p[0], 14, 114), D: 38, duration: 0.35, ease: 'power3.out', overwrite: true, onUpdate: draw });
        return {
          enter: p => go(p || [84, 0]), move: p => p && go(p),
          leave: () => gsap.to(st, { x: 48, D: 30, duration: 1.1, ease: 'elastic.out(1, 0.5)', overwrite: true, onUpdate: draw }),
        };
      },
      emblem: emb(`
        <path d="${shape(48, 30)}" fill="#fff"/>
        <rect x="6" y="${PY}" width="116" height="${PH}" rx="2.5" fill="#fff"/>
        <path d="${holes(2.2, 2.3)}" fill="#000"/>
      `),
    });
  }

  // C: every pin row as one raking line; hover flips relief to recess and back.
  {
    const ROWS = 12, S = 44;
    const rowPts = (k, a) => Array.from({ length: S + 1 }, (_, i) => {
      const x = 12 + (i * 104) / S;
      return [x, 26 + k * 8 - 15 * a * handH((x - 12) / 104, k / (ROWS - 1))];
    });
    DIRS.push({
      toy: 'pins', l: 'C', name: 'Single-weight line',
      art(svg) {
        const R = Array.from({ length: ROWS }, () => [
          el('path', { style: 'fill: var(--bg)' }, svg),
          el('path', { fill: 'none', stroke: 'oklch(0.82 0.13 58)', 'stroke-width': 1.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg),
        ]);
        const st = { a: 1 };
        const draw = () => R.forEach(([fill, ln], k) => {
          const p = rowPts(k, st.a), d = line(p);
          // The fill hides the rows behind; it shows no colour of its own.
          fill.setAttribute('d', `${d}L116 ${26 + k * 8 + 9}L12 ${26 + k * 8 + 9}Z`);
          ln.setAttribute('d', d);
        });
        draw();
        return hoverLoop(
          () => gsap.timeline({ repeat: -1, onUpdate: draw })
            .to(st, { a: -1, duration: 1.1, ease: 'sine.inOut' }, 0.15)
            .to(st, { a: 1, duration: 1.1, ease: 'sine.inOut' }, '+=0.5')
            .to({}, { duration: 0.35 }),
          () => gsap.to(st, { a: 1, duration: 0.5, ease: 'power2.out', overwrite: true, onUpdate: draw }));
      },
      emblem: emb(Array.from({ length: ROWS }, (_, k) => {
        const d = line(rowPts(k, 1));
        return `<path d="${d}L116 ${26 + k * 8 + 9}L12 ${26 + k * 8 + 9}Z" fill="#000"/><path d="${d}" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>`;
      }).join('\n')),
    });
  }

  // D: an isometric block of square pins; the pointer pushes columns up from behind.
  {
    const N = 7, CW = 9, Y0 = 34, T = 10, GAP = 0.08;
    const P = (x, y, z) => [64 + (x - y) * CW * 0.866, Y0 + (x + y) * CW * 0.5 - z];
    const height = (i, j, cx, cy, Z) => 1.5 + Z * Math.exp(-((i + 0.5 - cx) ** 2 + (j + 0.5 - cy) ** 2) / (2 * 1.25 * 1.25));
    const order = [];
    for (let s = 0; s <= 2 * (N - 1); s++) for (let i = 0; i < N; i++) { const j = s - i; if (j >= 0 && j < N) order.push([i, j]); }
    const faces = (i, j, z) => {
      const a = i + GAP, b = i + 1 - GAP, c = j + GAP, d = j + 1 - GAP;
      return {
        top: poly([P(a, c, z), P(b, c, z), P(b, d, z), P(a, d, z)]),
        left: poly([P(a, d, z), P(b, d, z), P(b, d, 0), P(a, d, 0)]),
        right: poly([P(b, c, z), P(b, d, z), P(b, d, 0), P(b, c, 0)]),
      };
    };
    const slab = {
      top: poly([P(0, 0, 0), P(N, 0, 0), P(N, N, 0), P(0, N, 0)]),
      left: poly([P(0, N, 0), P(N, N, 0), P(N, N, -T), P(0, N, -T)]),
      right: poly([P(N, 0, 0), P(N, N, 0), P(N, N, -T), P(N, 0, -T)]),
    };
    const REST = [2.6, 3.4, 17];
    DIRS.push({
      toy: 'pins', l: 'D', name: 'Isometric block',
      art(svg) {
        svg.innerHTML = `
          <path d="${slab.left}" style="fill: oklch(0.66 0.17 50)"/>
          <path d="${slab.right}" style="fill: oklch(0.5 0.16 38)"/>
          <path d="${slab.top}" style="fill: oklch(0.17 0.012 270)"/>
          <g class="cols"></g>`;
        const g = svg.querySelector('.cols');
        const C = order.map(([i, j]) => ({ i, j,
          left: el('path', {}, g), right: el('path', {}, g), top: el('path', {}, g) }));
        const st = { x: REST[0], y: REST[1], Z: REST[2] };
        const draw = () => C.forEach(c => {
          const z = height(c.i, c.j, st.x, st.y, st.Z), F = faces(c.i, c.j, z), k = clamp(z / 24, 0, 1);
          c.top.setAttribute('d', F.top); c.left.setAttribute('d', F.left); c.right.setAttribute('d', F.right);
          // Raised tops catch the light.
          c.top.style.fill = `oklch(${f(0.62 + 0.33 * k)} 0.015 250)`;
          c.left.style.fill = `oklch(${f(0.5 + 0.12 * k)} 0.015 255)`;
          c.right.style.fill = `oklch(${f(0.34 + 0.08 * k)} 0.015 260)`;
        });
        draw();
        const go = p => {
          const a = (p[0] - 64) / (CW * 0.866), b = (p[1] - Y0) / (CW * 0.5);
          gsap.to(st, { x: clamp((a + b) / 2, 0, N), y: clamp((b - a) / 2, 0, N), Z: 22, duration: 0.35, ease: 'power3.out', overwrite: true, onUpdate: draw });
        };
        return {
          enter: p => go(p || [80, 70]), move: p => p && go(p),
          leave: () => gsap.to(st, { x: REST[0], y: REST[1], Z: REST[2], duration: 1, ease: 'power3.inOut', overwrite: true, onUpdate: draw }),
        };
      },
      emblem: emb(`
        <path d="${slab.left}${slab.right}" fill="#fff"/>
        <path d="${slab.top}" fill="#000"/>
        <path d="${P(0, N, 0)}" fill="none"/>

      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg);
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
