<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Spark wheel 7</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Spark wheel 7</h1>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RAD = Math.PI / 180, TAU = Math.PI * 2;
  const BG = 'oklch(0.16 0.012 275)';
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';

  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => `<linearGradient id="${u}rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.62"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="${u}lit" cx="0.32" cy="0.26" r="0.7"><stop offset="0" stop-color="#fff" stop-opacity="0.38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`;
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c]) => `<stop offset="${o}" style="stop-color: ${c}"/>`).join('')}</linearGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;

  // The toy's sparks: white at the head, gold, amber, then ember red.
  const WHITE = 'oklch(0.99 0.03 95)', GOLD = 'oklch(0.94 0.11 92)', AMBER = 'oklch(0.86 0.15 75)', EMBER = 'oklch(0.72 0.19 45)';
  const SPARKS = [WHITE, GOLD, AMBER, EMBER];
  // A spark that forks: a four-point star.
  const STAR = 'M0 -1L0.2 -0.2L1 0L0.2 0.2L0 1L-0.2 0.2L-1 0L-0.2 -0.2Z';
  const star = (x, y, r, fill) => `<path d="${STAR}" transform="translate(${x} ${y}) scale(${r})" fill="${fill}" stroke="none"/>`;
  // A frozen streak: amber body, white head.
  const streaks = L => L.map(([x1, y1, x2, y2, w]) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${AMBER}" stroke-width="${w}"/><line x1="${f(lerp(x1, x2, 0.55))}" y1="${f(lerp(y1, y2, 0.55))}" x2="${x2}" y2="${y2}" stroke="${WHITE}" stroke-width="${w}"/>`).join('');
  // Five holes on a circle, turned by a.
  const holesAt = (a, r) => [0, 1, 2, 3, 4].map(i => { const t = -a + (i * 72 - 90) * RAD; return [f(r * Math.cos(t)), f(r * Math.sin(t))]; });
  const HEX = r => [0, 1, 2, 3, 4, 5].map(i => `${f(r * Math.cos(i * 60 * RAD))},${f(r * Math.sin(i * 60 * RAD))}`).join(' ');
  // The rim's glow: deep red, orange, white.
  const HEAT = [[0.5, 0.2, 28], [0.74, 0.19, 52], [0.98, 0.07, 95]];
  const heatCol = h => {
    const t = clamp(h) * 2, i = t < 1 ? 0 : 1, k = t - i, A = HEAT[i], B = HEAT[i + 1];
    return `oklch(${f(lerp(A[0], B[0], k))} ${f(lerp(A[1], B[1], k))} ${f(lerp(A[2], B[2], k))})`;
  };

  // Sparks: a pool of streak lines, each on its own flight.
  // O: at, a (degrees), v, g, floor (a number or a function of x), life, w, tail, cols.
  const jet = (parent, n, O) => {
    const ps = Array.from({ length: n }, () => ({ el: el('line', { opacity: 0 }, parent), age: 1, life: 0 }));
    let next = 0;
    return {
      emit(o = {}) {
        const p = ps[next];
        next = (next + 1) % n;
        const sp = rnd(O.v[0], O.v[1]) * (o.speed ?? 1), a = (rnd(O.a[0], O.a[1]) + (o.turn ?? 0)) * RAD;
        Object.assign(p, { x: O.at[0], y: O.at[1], vx: sp * Math.cos(a), vy: sp * Math.sin(a), age: 0, life: rnd(O.life[0], O.life[1]) * (o.life ?? 1) });
        if (O.cols) p.el.setAttribute('stroke', O.cols[(Math.random() * O.cols.length) | 0]);
        p.el.setAttribute('stroke-width', f(rnd(O.w[0], O.w[1]) * (O.even ? 1 : o.size ?? 1)));
      },
      step(dt) {
        let live = 0;
        for (const p of ps) {
          if (p.age >= p.life) continue;
          p.age += dt;
          if (p.age >= p.life) { p.el.setAttribute('opacity', 0); continue; }
          live++;
          p.vy += O.g * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          // A spark skips on the floor.
          const fl = typeof O.floor === 'function' ? O.floor(p.x) : O.floor;
          if (fl != null && p.y > fl && p.vy > 0) { p.y = fl; p.vy *= -0.35; p.vx *= 0.7; }
          const ty = p.y - p.vy * O.tail, e = p.el;
          e.setAttribute('x1', f(p.x));
          e.setAttribute('y1', f(p.y));
          e.setAttribute('x2', f(p.x - p.vx * O.tail));
          e.setAttribute('y2', f(fl != null ? Math.min(fl, ty) : ty));
          e.setAttribute('opacity', f(1 - (p.age / p.life) ** 2));
        }
        return live;
      },
    };
  };

  // The gesture: pointer travel flicks the wheel.
  // Spin throws sparks and heats the rim; a full heat flares.
  const GRIND = 16;
  const drive = (T, J, still) => {
    const st = { w: 0, a: 0, hot: 0, on: false, demo: false, last: null, owe: 0, run: false };
    const stop = () => {
      st.run = false;
      gsap.ticker.remove(tick);
      gsap.to(still, { opacity: 1, duration: 0.5, overwrite: true });
    };
    function tick() {
      const dt = Math.min(0.05, gsap.ticker.deltaRatio(60) / 60);
      // A hover holds a slow turn; keyboard focus holds a full grind.
      const hold = st.demo ? GRIND : st.on ? 5 : 0;
      st.w = Math.max(hold, st.w - (1.2 * st.w + 2) * dt);
      st.a += st.w * dt;
      const j = clamp(st.w / GRIND);
      st.hot = clamp(st.hot + (j > 0.45 ? 0.4 * j : -0.3) * dt);
      st.owe += j * 40 * (1 + 0.6 * st.hot) * dt;
      while (st.owe >= 1) { st.owe--; J.emit({ speed: 0.55 + 0.6 * j }); }
      if (st.hot >= 1) {
        for (let i = 0; i < 16; i++) J.emit({ speed: 1.5, turn: rnd(-45, 25), life: 1.5, size: 1.5 });
        st.hot = 0.35;
        T.flash();
      }
      const live = J.step(dt);
      T.set(st.a, st.hot, j);
      if (!st.on && st.w === 0 && !live && st.hot === 0) stop();
    }
    T.set(0, 0, 0);
    return {
      enter(p) {
        Object.assign(st, { on: true, last: p, demo: !p, w: Math.max(st.w, 11) });
        if (st.run) return;
        st.run = true;
        gsap.ticker.add(tick);
        gsap.to(still, { opacity: 0, duration: 0.2, overwrite: true });
      },
      move(p) {
        if (!p) return;
        if (st.last) st.w = Math.min(26, st.w + Math.hypot(p[0] - st.last[0], p[1] - st.last[1]) * 0.22);
        st.last = p;
        st.demo = false;
      },
      leave() { st.on = false; st.demo = false; st.last = null; },
    };
  };
  const pulse = (node, at) => gsap.fromTo(node, { opacity: 0.9, scale: 0.8, svgOrigin: at }, { opacity: 0, scale: 1.4, svgOrigin: at, duration: 0.5, ease: 'power2.out' });

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `
        <rect x="44" y="72" width="9" height="24" fill="oklch(0.42 0.008 70)"/>
        <circle cx="48" cy="48" r="25" fill="oklch(0.5 0.01 250)"/>
        <circle class="kn" cx="48" cy="48" r="22.5" fill="none" stroke="oklch(0.86 0.01 250)" stroke-width="5" stroke-dasharray="2.6 2.3"/>
        <circle cx="48" cy="48" r="15" fill="oklch(0.36 0.01 250)"/>
        <circle cx="48" cy="48" r="4" fill="oklch(0.12 0.01 250)"/>
        <g class="fly" stroke-linecap="round" stroke-width="2.4" opacity="0">
          <line x1="54" y1="73" x2="66" y2="74" stroke="oklch(0.95 0.08 90)"/>
          <line x1="54" y1="73" x2="64" y2="78" stroke="oklch(0.85 0.15 70)"/>
          <line x1="54" y1="73" x2="67" y2="70" stroke="oklch(0.95 0.08 90)"/>
          <line x1="54" y1="73" x2="63" y2="81" stroke="oklch(0.75 0.17 50)"/>
          <line x1="54" y1="73" x2="65" y2="76" stroke="oklch(0.85 0.15 70)"/>
        </g>
        <g fill="oklch(0.72 0.17 45)"><circle cx="82" cy="106" r="1.8"/><circle cx="96" cy="103" r="1.4"/><circle cx="104" cy="108" r="1.6"/></g>`;
      const knurl = svg.querySelector('.kn'), fly = svg.querySelector('.fly'), lines = [...fly.children];
      let tl = null;
      return {
        enter() {
          if (tl) return;
          gsap.set(fly, { opacity: 1 });
          tl = gsap.timeline({ repeat: -1, repeatDelay: 0.15 });
          tl.fromTo(knurl, { rotation: 0, svgOrigin: '48 48' }, { rotation: 140, svgOrigin: '48 48', duration: 0.7, ease: 'power2.out' }, 0);
          lines.forEach((e, i) => tl.fromTo(e, { x: 0, y: 0, opacity: 1, scale: 0.4, svgOrigin: '54 73' }, { x: 30 + i * 6, y: 14 + i * 5, opacity: 0, scale: 1.2, svgOrigin: '54 73', duration: 0.55, ease: 'power1.in' }, i * 0.05));
        },
        move() {},
        leave() {
          tl?.kill();
          tl = null;
          gsap.to(fly, { opacity: 0, duration: 0.25, overwrite: true });
          gsap.to(knurl, { rotation: 0, svgOrigin: '48 48', duration: 0.4, overwrite: true });
        },
      };
    },
  });

  // The menu's language: one object and one accent. Here: the wheel and its spark.
  const CREAM = [[0, 'oklch(0.97 0.03 95)'], [1, 'oklch(0.78 0.06 82)']], STEELY = [[0, 'oklch(0.9 0.01 250)'], [1, 'oklch(0.5 0.022 256)']], BRASSY = [[0, 'oklch(0.93 0.12 92)'], [1, 'oklch(0.64 0.15 60)']];
  // The spark: three flat rays from the point where the rim strikes.
  const RAYS = ['oklch(0.98 0.05 98)', 'oklch(0.88 0.15 82)', 'oklch(0.72 0.19 48)'];
  const rays = (a0, a1, len, fill) => RAYS.map((c, i) => {
    const a = lerp(a0, a1, i / 2) * RAD, h = ((a1 - a0) / 2) * 0.36 * RAD, L = len[i];
    return `<path class="ray" d="M0 0L${f(L * Math.cos(a - h))} ${f(L * Math.sin(a - h))}L${f(L * Math.cos(a + h))} ${f(L * Math.sin(a + h))}Z" fill="${fill || c}"/>`;
  }).join('');
  // The spark is drawn as rays, so the engine gets an empty spark pool.
  const NO_JET = { emit() {}, step: () => 0 };
  const flick = (els, a, j) => els.forEach((e, i) => e.setAttribute('transform', `scale(${f((0.9 + 0.45 * j) * (1 + 0.1 * j * Math.sin(a * 3 + i * 1.7)))})`));

  /* ================= A · Shaded object ================= */

  // A: the roller as a solid thing: a knurled steel tread, a dished enamel face,
  // a brass hub dome, and one glowing spark where the rim strikes.
  {
    const FX = 70, FY = 58, RX = 26, RY = 40, BX = 44, O = [58, 97];
    const TREAD = `M${FX} ${FY - RY}H${BX}A${RX} ${RY} 0 0 0 ${BX} ${FY + RY}H${FX}Z`;
    const at = (deg, rx, ry) => `${f(FX + rx * Math.cos(deg * RAD))} ${f(FY + ry * Math.sin(deg * RAD))}`;
    // Each needle: its angle, its length, its half width.
    const NEEDLES = [[-31, 34, 2.4], [-14, 52, 3.6], [3, 45, 3.1], [20, 30, 2.3]];
    const stop = (o, c, op) => `<stop offset="${o}" style="stop-color: ${c}"${op != null ? ` stop-opacity="${op}"` : ''}/>`;
    DIRS.push({
      l: 'A', name: 'Shaded object',
      box: [16, 14, 100, 94],
      art(svg, u) {
        svg.innerHTML = `
          <defs>${light(u)}
            <linearGradient id="${u}m" gradientUnits="userSpaceOnUse" x1="0" y1="${FY - RY}" x2="0" y2="${FY + RY}">${stop(0, 'oklch(0.34 0.02 262)')}${stop(0.1, 'oklch(0.86 0.012 255)')}${stop(0.19, 'oklch(0.99 0.004 250)')}${stop(0.3, 'oklch(0.72 0.016 255)')}${stop(0.56, 'oklch(0.36 0.022 262)')}${stop(0.8, 'oklch(0.62 0.07 70)')}${stop(0.93, 'oklch(0.86 0.12 80)')}${stop(1, 'oklch(0.4 0.06 60)')}</linearGradient>
            <linearGradient id="${u}o" gradientUnits="userSpaceOnUse" x1="${BX - RX}" y1="0" x2="${FX}" y2="0">${stop(0, '#000', 0.55)}${stop(0.55, '#000', 0)}</linearGradient>
            <radialGradient id="${u}f" cx="0.34" cy="0.24" r="0.95">${stop(0, 'oklch(0.99 0.02 98)')}${stop(0.55, 'oklch(0.9 0.045 90)')}${stop(1, 'oklch(0.68 0.07 75)')}</radialGradient>
            <linearGradient id="${u}d" x1="0.15" y1="0.1" x2="0.85" y2="0.9">${stop(0, 'oklch(0.74 0.06 78)')}${stop(1, 'oklch(0.95 0.035 95)')}</linearGradient>
            <radialGradient id="${u}b" cx="0.36" cy="0.28" r="0.85">${stop(0, 'oklch(0.98 0.07 100)')}${stop(0.4, 'oklch(0.82 0.14 86)')}${stop(1, 'oklch(0.5 0.13 60)')}</radialGradient>
            <linearGradient id="${u}n" x1="0" y1="0" x2="1" y2="0">${stop(0, 'oklch(0.99 0.03 98)')}${stop(0.35, 'oklch(0.9 0.15 85)', 0.95)}${stop(1, 'oklch(0.7 0.2 45)', 0)}</linearGradient>
            <linearGradient id="${u}p" x1="0" y1="0" x2="1" y2="0">${stop(0, 'oklch(0.72 0.2 45)', 0)}${stop(0.7, 'oklch(0.9 0.15 85)', 0.95)}${stop(1, 'oklch(0.99 0.03 98)')}</linearGradient>
            <radialGradient id="${u}c">${stop(0, '#fff')}${stop(0.35, 'oklch(0.93 0.13 88)', 0.85)}${stop(1, 'oklch(0.8 0.17 65)', 0)}</radialGradient>
            <pattern id="${u}k" patternUnits="userSpaceOnUse" width="5" height="5"><path d="M-1 -1L6 6M6 -1L-1 6" stroke="#000" stroke-width="0.9" opacity="0.5"/><path d="M-1 0.7L6 7.7M6 0.7L-1 7.7" stroke="#fff" stroke-width="0.45" opacity="0.4"/></pattern>
            <clipPath id="${u}w"><path d="${TREAD}"/><ellipse cx="${FX}" cy="${FY}" rx="${RX}" ry="${RY}"/></clipPath>
            ${blur(`${u}g`, 7)}${blur(`${u}s`, 1.2)}
          </defs>
          <ellipse class="pool" cx="86" cy="101" rx="34" ry="4.5" fill="${AMBER}" filter="url(#${u}g)" opacity="0.35"/>
          <circle class="halo" cx="${O[0] + 8}" cy="${O[1] - 3}" r="24" fill="${AMBER}" filter="url(#${u}g)" opacity="0.4"/>
          <circle class="fl" cx="${FX - 8}" cy="${FY}" r="56" fill="${WHITE}" filter="url(#${u}g)" opacity="0"/>
          <path d="${TREAD}" fill="url(#${u}m)"/>
          <path class="hot" d="${TREAD}" opacity="0"/>
          <path d="${TREAD}" fill="url(#${u}k)"/>
          <path d="${TREAD}" fill="url(#${u}o)"/>
          <ellipse cx="${FX}" cy="${FY}" rx="${RX}" ry="${RY}" fill="url(#${u}f)"/>
          <ellipse cx="${FX}" cy="${FY}" rx="${RX}" ry="${RY}" fill="url(#${u}lit)"/>
          <ellipse cx="${FX}" cy="${FY}" rx="18" ry="28" fill="url(#${u}d)"/>
          <path d="M${at(135, 18, 28)}A18 28 0 0 1 ${at(315, 18, 28)}" fill="none" stroke="oklch(0.42 0.06 70)" stroke-opacity="0.55" stroke-width="1.3"/>
          <path d="M${at(315, 18, 28)}A18 28 0 0 1 ${at(135, 18, 28)}" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="1.1"/>
          <g clip-path="url(#${u}w)"><circle class="spill" cx="${O[0] + 2}" cy="${O[1] + 4}" r="34" fill="url(#${u}c)" opacity="0.5"/></g>
          <ellipse cx="${FX}" cy="${FY}" rx="${RX}" ry="${RY}" fill="none" stroke="url(#${u}rim)" stroke-width="1.6"/>
          <path d="M${FX} ${FY - RY}A${RX} ${RY} 0 0 0 ${FX} ${FY + RY}" fill="none" stroke="oklch(0.99 0.004 250)" stroke-opacity="0.85" stroke-width="1.7"/>
          <ellipse cx="${FX + 1.2}" cy="${FY + 2}" rx="6.4" ry="9.4" fill="#000" opacity="0.28" filter="url(#${u}s)"/>
          <ellipse cx="${FX}" cy="${FY}" rx="5.4" ry="8.2" fill="url(#${u}b)"/>
          <ellipse class="shine" cx="${FX - 1.5}" cy="${FY - 3}" rx="1.3" ry="2" fill="#fff" opacity="0.9"/>
          <g class="rest" transform="translate(${O[0]} ${O[1]})">${NEEDLES.map(([a, len, w]) => `<path class="ray" d="M0 ${-w}L${len} 0L0 ${w}Z" fill="url(#${u}n)" transform="rotate(${a})"/>`).join('')}</g>
          <circle class="core" cx="${O[0]}" cy="${O[1]}" r="9" fill="url(#${u}c)"/>
          <g class="live"></g>`;
        const q = s => svg.querySelector(s);
        const kn = q('pattern'), hotP = q('.hot'), halo = q('.halo'), pool = q('.pool'), spill = q('.spill'), core = q('.core'), fl = q('.fl');
        const rest = q('.rest'), gloss = q(`#${u}f`), shine = q('.shine'), live = q('.live');
        // Live sparks: gradient needles that fly, fall and skip on the floor.
        const ps = Array.from({ length: 44 }, () => ({ el: el('path', { d: 'M0 -1.7L-24 0L0 1.7Z', fill: `url(#${u}p)`, opacity: 0 }, live), age: 1, life: 0 }));
        let next = 0;
        const spit = k => {
          const p = ps[next], t = rnd(-38, 8) * RAD, sp = rnd(85, 175) * k;
          next = (next + 1) % ps.length;
          Object.assign(p, { x: O[0], y: O[1], vx: sp * Math.cos(t), vy: sp * Math.sin(t), age: 0, life: rnd(0.35, 0.7), s: rnd(0.7, 1.3) * Math.min(1.4, k) });
        };
        const st = { ang: 0, w: 0, hot: 0, glow: 0, owe: 0, on: false, demo: 0, last: null, gx: 0.34, gy: 0.24, tx: 0.34, ty: 0.24, run: false };
        const ease = (dt, tau) => 1 - Math.exp(-dt / tau);
        const paint = () => {
          kn.setAttribute('patternTransform', `translate(0 ${f(st.ang % 5)})`);
          hotP.setAttribute('fill', heatCol(st.hot));
          hotP.setAttribute('opacity', f(0.85 * clamp(st.hot * 1.5)));
          core.setAttribute('r', f(9 + 5 * st.glow + 3 * st.hot));
          halo.setAttribute('opacity', f(clamp(0.4 + 0.4 * st.glow + 0.3 * st.hot)));
          pool.setAttribute('opacity', f(clamp(0.35 + 0.4 * st.glow)));
          spill.setAttribute('opacity', f(clamp(0.5 + 0.4 * st.glow + 0.2 * st.hot)));
          // The gloss on the enamel and the shine on the hub lean toward the pointer.
          gloss.setAttribute('cx', f(st.gx));
          gloss.setAttribute('cy', f(st.gy));
          shine.setAttribute('transform', `translate(${f((st.gx - 0.34) * 6)} ${f((st.gy - 0.24) * 8)})`);
        };
        function tick() {
          const dt = Math.min(0.05, gsap.ticker.deltaRatio(60) / 60);
          // Keyboard focus strokes the wheel by itself.
          if (st.demo) { st.demo += dt; st.w = Math.max(st.w, 70 + 60 * Math.sin(st.demo * 5)); }
          st.ang += st.w * dt;
          const j = clamp(st.w / 110);
          st.w = Math.max(0, st.w - (2.6 * st.w + 6) * dt);
          st.hot = clamp(st.hot + (j > 0.5 ? 0.45 * j : -0.3) * dt);
          st.owe += j * 46 * (1 + 0.6 * st.hot) * dt;
          while (st.owe >= 1) { st.owe--; spit(0.6 + 0.6 * j); }
          // A full heat sheds in one burst.
          if (st.hot >= 1) { for (let i = 0; i < 14; i++) spit(1.5); st.hot = 0.35; pulse(fl, `${FX - 8} ${FY}`); }
          st.glow += (j - st.glow) * ease(dt, 0.08);
          st.gx += (st.tx - st.gx) * ease(dt, 0.12);
          st.gy += (st.ty - st.gy) * ease(dt, 0.12);
          let alive = 0;
          for (const p of ps) {
            if (p.age >= p.life) continue;
            p.age += dt;
            if (p.age >= p.life) { p.el.setAttribute('opacity', 0); continue; }
            alive++;
            p.vy += 170 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            if (p.y > 101 && p.vy > 0) { p.y = 101; p.vy *= -0.35; p.vx *= 0.7; }
            p.el.setAttribute('transform', `translate(${f(p.x)} ${f(p.y)}) rotate(${f(Math.atan2(p.vy, p.vx) / RAD)}) scale(${f(p.s)})`);
            p.el.setAttribute('opacity', f(1 - (p.age / p.life) ** 2));
          }
          const settled = Math.abs(st.tx - st.gx) < 0.003 && Math.abs(st.ty - st.gy) < 0.003;
          if (!st.on && st.w === 0 && !alive && st.hot === 0 && st.glow < 0.01 && settled) {
            Object.assign(st, { run: false, glow: 0, gx: st.tx, gy: st.ty });
            gsap.ticker.remove(tick);
            gsap.to(rest, { opacity: 1, duration: 0.5, overwrite: true });
          }
          paint();
        }
        paint();
        return {
          enter(p) {
            Object.assign(st, { on: true, last: p, demo: p ? 0 : 0.001 });
            if (p) this.move(p);
            if (st.run) return;
            st.run = true;
            gsap.ticker.add(tick);
            gsap.to(rest, { opacity: 0, duration: 0.2, overwrite: true });
          },
          move(p) {
            if (!p) return;
            st.demo = 0;
            st.tx = clamp(0.34 + (p[0] - FX) / 150, 0.12, 0.62);
            st.ty = clamp(0.24 + (p[1] - FY) / 190, 0.06, 0.52);
            // A downward stroke turns the wheel with the pointer, one for one.
            // The ratchet holds on the way up.
            const dy = st.last ? p[1] - st.last[1] : 0;
            if (dy > 0) { st.ang += dy; st.w = Math.min(160, Math.max(st.w, dy * 30)); }
            st.last = p;
          },
          leave() { Object.assign(st, { on: false, demo: 0, last: null, tx: 0.34, ty: 0.24 }); },
        };
      },
      emblem: `${EMB_HEAD}<path d="${TREAD}" fill="#8a8a8a"/><path d="M${BX + 4} ${FY - RY + 9}H${FX - 6}" stroke="#fff" stroke-width="5" stroke-linecap="round"/><ellipse cx="${FX}" cy="${FY}" rx="${RX}" ry="${RY}" fill="#fff"/><ellipse cx="${FX}" cy="${FY}" rx="18" ry="28" fill="none" stroke="#000" stroke-width="2.4"/><ellipse cx="${FX}" cy="${FY}" rx="5" ry="7.6" fill="#000"/><g transform="translate(${O[0]} ${O[1]})" fill="#fff">${NEEDLES.map(([a, len, w]) => `<path d="M0 ${f(-w * 1.5)}L${len} 0L0 ${f(w * 1.5)}Z" transform="rotate(${a})"/>`).join('')}<circle r="6"/></g></svg>`,
    });
  }

  /* ================= D · Isometric block ================= */

  // D: the wheel stands on a turquoise block; one spark flies along it.
  {
    const HW = 25 * Math.sqrt(3), HH = 25, DEP = 13, M = [64, 86];
    const T = [64, M[1] - HH], UR = [64 + HW, M[1]], C0 = [64, M[1] + HH], UL = [64 - HW, M[1]];
    const LR = [UR[0], UR[1] + DEP], BB = [64, C0[1] + DEP], LL = [UL[0], UL[1] + DEP];
    const TOP = poly([T, UR, C0, UL]);
    // The wheel stands in the plane of the left face.
    const C = [58, 49], R = 26, TH = 4.5, IY = [-0.866, 0.5];
    const CF = [C[0] + IY[0] * TH, C[1] + IY[1] * TH], CB = [C[0] - IY[0] * TH, C[1] - IY[1] * TH];
    const VERT = p => `matrix(0.866 0.5 0 1 ${f(p[0])} ${f(p[1])})`;
    const O = [C[0] + 4, C[1] + R], LEN = [40, 48, 38];
    const sweep = Array.from({ length: 6 }, (_, k) => `<circle r="${R}" transform="${VERT([lerp(CB[0], CF[0], k / 5), lerp(CB[1], CF[1], k / 5)])}"/>`).join('');
    DIRS.push({
      l: 'D', name: 'Isometric block',
      box: [18, 14, 96, 112],
      art(svg, u) {
        svg.innerHTML = `
          <defs>${light(u)}${lg(`${u}f`, CREAM, 'x1="0" y1="0" x2="1" y2="1"')}${lg(`${u}b`, BRASSY, 'x1="0" y1="0" x2="1" y2="0"')}${blur(`${u}g`, 7)}</defs>
          <circle class="fl" cx="${C[0]}" cy="${C[1]}" r="46" fill="${WHITE}" filter="url(#${u}g)" opacity="0"/>
          <path d="${poly([UL, C0, BB, LL])}" fill="oklch(0.52 0.1 198)"/>
          <path d="${poly([C0, UR, LR, BB])}" fill="oklch(0.38 0.08 203)"/>
          <path d="${TOP}" fill="oklch(0.7 0.105 192)"/>
          <path d="${TOP}" fill="url(#${u}lit)"/>
          <circle class="halo" cx="${O[0] + 14}" cy="${O[1] + 6}" r="22" fill="${AMBER}" filter="url(#${u}g)" opacity="0.4"/>
          <path d="${TOP}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
          <g class="rays" transform="translate(${O[0]} ${O[1]})">${rays(2, 44, LEN)}</g>
          <g fill="oklch(0.7 0.015 252)">${sweep}</g>
          <g class="hot" opacity="0">${sweep}</g>
          <g transform="${VERT(CF)}">
            <circle r="${R}" fill="url(#${u}f)"/>
            <circle r="${R}" fill="url(#${u}lit)"/>
            <circle r="${R}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
            <g class="spin"><circle cx="0" cy="-15" r="3.2" fill="oklch(0.6 0.1 70)"/></g>
            <circle r="5.6" fill="url(#${u}b)"/>
            <circle r="5.6" fill="url(#${u}lit)"/>
          </g>
          <g class="still"></g>`;
        const q = s => svg.querySelector(s), ray = [...svg.querySelectorAll('.ray')];
        const spin = q('.spin'), hotG = q('.hot'), halo = q('.halo'), fl = q('.fl');
        return drive({
          set(a, hot, j) {
            // One small mark on the face shows the spin.
            spin.setAttribute('transform', `rotate(${f((-a / RAD) % 360)})`);
            hotG.setAttribute('fill', heatCol(hot));
            hotG.setAttribute('opacity', f(0.9 * clamp(hot * 1.5)));
            flick(ray, a, j);
            halo.setAttribute('opacity', f(clamp(0.4 + 0.3 * j + 0.3 * hot)));
          },
          flash() { pulse(fl, `${C[0]} ${C[1]}`); },
        }, NO_JET, q('.still'));
      },
      emblem: `${EMB_HEAD}<path d="${poly([T, UR, LR, BB, LL, UL])}" fill="#fff"/><path d="M${f(C0[0])} ${f(C0[1])}V${f(BB[1])}M${f(UL[0])} ${f(UL[1])}L${f(C0[0])} ${f(C0[1])}L${f(UR[0])} ${f(UR[1])}" fill="none" stroke="#000" stroke-width="2.8"/><g transform="translate(${O[0]} ${O[1]})">${rays(2, 44, LEN, '#000')}</g><circle r="${R}" transform="${VERT(CB)}" fill="#fff" stroke="#000" stroke-width="2.8"/><g transform="${VERT(CF)}"><circle r="${R}" fill="#fff" stroke="#000" stroke-width="2.8"/><circle r="4.4" fill="#000"/></g></svg>`,
    });
  }

  /* ================= Gallery ================= */
  const NAME = 'Spark wheel';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-spark';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `spark-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
})();
</script>
</body>
</html>
