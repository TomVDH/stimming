<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: BZ reaction 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: BZ reaction 1</h1>
<p class="lede">BZ reaction, round 1. The toy is not built; this is an icon only. A: a petri dish lit from below, a spiral pair and a target; the pointer seeds new targets. D: the lightbox is the block, the dish lies on it.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The toy's tokens: orange dye, blue fronts, clear dish glass, a lightbox glow.
  const DYE = [[0, 'oklch(0.8 0.15 64)'], [0.7, 'oklch(0.68 0.17 48)'], [1, 'oklch(0.56 0.17 38)']];
  const FRONT = 'oklch(0.5 0.16 258)', FRONT_HI = 'oklch(0.66 0.13 240)';
  const RIM = 'oklch(0.9 0.02 220)', WALL = 'oklch(0.75 0.03 220)';
  const LIGHT = 'oklch(0.97 0.03 90)';
  // The dish in its own plane: liquid radius, the spiral and the first target.
  const RL = 46, SP = [15, -9], TG = [-20, 15], GAP = 12, MAXR = 64;

  // An Archimedean spiral arm, wound th0 to th1, from r0 outward.
  const spiral = (c, r0, b, th0, th1, phase) => {
    let d = '';
    for (let i = 0; i <= 40; i++) {
      const th = th0 + (th1 - th0) * (i / 40), r = r0 + b * th;
      d += `${i ? 'L' : 'M'}${f(c[0] + r * Math.cos(th + phase))} ${f(c[1] + r * Math.sin(th + phase))}`;
    }
    return d;
  };
  const SPIRAL = ph => spiral(SP, 2, 3.9, 0.3, 4.4 * Math.PI, ph) + spiral(SP, 2, 3.9, 0.3, 4.4 * Math.PI, ph + Math.PI);

  // The dish's contents, drawn flat in its plane; the caller tilts the plane.
  const dishMarkup = u => `<defs>${rg(`${u}dye`, DYE, 'cx="0.45" cy="0.4" r="0.6"')}<clipPath id="${u}lq"><circle r="${RL}"/></clipPath></defs>
      <circle r="${RL + 4}" fill="${WALL}" opacity="0.5"/>
      <circle r="${RL}" fill="url(#${u}dye)"/>
      <g clip-path="url(#${u}lq)" fill="none" stroke-linecap="round">
        <path class="spiral" stroke="${FRONT}" stroke-width="4.6"/>
        <g class="rings"></g>
      </g>
      <circle r="${RL + 2}" fill="none" stroke="${RIM}" stroke-width="3.4" opacity="0.85"/>`;

  // The cell a source owns: every point nearer to it than to any other.
  // Fronts from two sources meet and die on the line between their cells.
  const cell = (srcs, i) => {
    let pts = [[-70, -70], [70, -70], [70, 70], [-70, 70]];
    const a = srcs[i];
    srcs.forEach((b, j) => {
      if (j === i) return;
      const n = [b[0] - a[0], b[1] - a[1]], m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      const side = q => (q[0] - m[0]) * n[0] + (q[1] - m[1]) * n[1];
      const out = [];
      pts.forEach((q, k) => {
        const r = pts[(k + 1) % pts.length], sq = side(q), sr = side(r);
        if (sq <= 0) out.push(q);
        if ((sq <= 0) !== (sr <= 0)) { const t = sq / (sq - sr); out.push([q[0] + (r[0] - q[0]) * t, q[1] + (r[1] - q[1]) * t]); }
      });
      pts = out;
    });
    return pts.length ? poly(pts) : 'M0 0Z';
  };

  // The reaction, shared by A and D.
  // Target rings pulse out of each seed; the spiral pair turns.
  // The pointer seeds a new target where it rests; old seeds die out.
  const react = (svg, toPlane, u) => {
    const rings = svg.querySelector('.rings'), sp = svg.querySelector('.spiral'), defs = svg.querySelector('defs');
    const seeds = [{ c: TG, born: -2.2 }];
    const st = { t: 0, ph: 0, live: false, prev: null };
    // One clip and one ring group per slot: slot 0 is the spiral.
    const SLOTS = 5;
    const clips = Array.from({ length: SLOTS }, (_, k) => el('path', {}, el('clipPath', { id: `${u}v${k}` }, defs)));
    sp.setAttribute('clip-path', `url(#${u}v0)`);
    const groups = Array.from({ length: SLOTS - 1 }, (_, k) => el('g', { 'clip-path': `url(#${u}v${k + 1})` }, rings));
    const ringEls = groups.map(g => Array.from({ length: 6 }, () => el('circle', { fill: 'none', stroke: FRONT, 'stroke-width': 4.6 }, g)));
    const recut = () => {
      const srcs = [SP, ...seeds.map(s => s.c)];
      srcs.forEach((_, k) => clips[k].setAttribute('d', cell(srcs, k)));
    };
    const draw = () => {
      sp.setAttribute('d', SPIRAL(st.ph));
      groups.forEach((g, gi) => {
        const s = seeds[gi];
        ringEls[gi].forEach((c, k) => {
          const r = s ? (st.t - s.born) * 11 - k * GAP : 0;
          if (!s || r <= 1 || r > MAXR) { c.style.display = 'none'; return; }
          c.style.display = '';
          c.setAttribute('cx', f(s.c[0])); c.setAttribute('cy', f(s.c[1])); c.setAttribute('r', f(r));
          c.setAttribute('opacity', f(Math.min(1, r / 6)));
        });
      });
    };
    const loop = clock(time => {
      // Time only runs while the pointer is over the dish.
      if (st.prev != null) st.t += Math.min(0.1, time - st.prev);
      st.prev = time;
      st.ph -= 0.03;
      // A seed whose rings have all left the dish dies; the first one pulses again.
      let cut = false;
      for (let i = seeds.length - 1; i >= 0; i--) if (st.t - seeds[i].born > (MAXR + 5 * GAP) / 11) { if (i === 0) seeds[0].born = st.t; else { seeds.splice(i, 1); cut = true; } }
      if (cut) recut();
      draw();
      if (!st.live) loop.stop();
    });
    recut(); draw();
    return {
      enter(p) { st.live = true; st.prev = null; loop.start(); if (p) this.move(p); },
      move(p) {
        if (!p) return;
        const q = toPlane(p);
        if (Math.hypot(q[0], q[1]) > RL - 6) return;
        // A seed lands only away from the others and the spiral.
        if ([SP, ...seeds.map(s => s.c)].every(c => Math.hypot(c[0] - q[0], c[1] - q[1]) > 22)) {
          seeds.push({ c: q, born: st.t });
          if (seeds.length > SLOTS - 1) seeds.splice(1, 1);
          recut();
        }
      },
      leave() { st.live = false; },
    };
  };

  const DIRS = [];

  /* ================= Current ================= */

  // BZ reaction is not built; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NOT BUILT</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // The dish from a little above, on a soft glow of light under it.
  const AX = 64, AY = 62, SY = 0.74, WALL_H = 8;
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [12, 24, 104, 82],
    idea: 'A glass petri dish from a little above, lit from below: orange dye with blue fronts, a spiral pair turning on one side and a target of rings on the other. Hover and the reaction runs: the rings pulse out and the spiral winds. The pointer seeds a new target where it rests, and its rings pulse out to meet the others.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 6)}${lg(`${u}wall`, [[0, 'oklch(0.86 0.03 220)', 0.7], [1, 'oklch(0.5 0.03 230)', 0.7]])}</defs>
        <ellipse cx="${AX}" cy="${AY + WALL_H + 4}" rx="58" ry="${f(58 * SY)}" fill="${LIGHT}" opacity="0.28" filter="url(#${u}b)"/>
        <path d="M${AX - RL - 4} ${AY}V${AY + WALL_H}A${RL + 4} ${f((RL + 4) * SY)} 0 0 0 ${AX + RL + 4} ${AY + WALL_H}V${AY}Z" fill="url(#${u}wall)"/>
        <g transform="translate(${AX} ${AY}) scale(1 ${SY})">${dishMarkup(u)}</g>
        <ellipse cx="${AX}" cy="${AY}" rx="${RL + 4}" ry="${f((RL + 4) * SY)}" fill="url(#${u}lit)"/>
        <path d="M${AX - 34} ${AY - 22}Q${AX - 14} ${AY - 34} ${AX + 10} ${AY - 34}" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>`;
      return react(svg, p => [p[0] - AX, (p[1] - AY) / SY], u);
    },
    emblem: `${EMB_HEAD}<path d="M${AX - RL - 4} ${AY}V${AY + WALL_H}A${RL + 4} ${f((RL + 4) * SY)} 0 0 0 ${AX + RL + 4} ${AY + WALL_H}V${AY}Z" fill="#fff"/><g transform="translate(${AX} ${AY}) scale(1 ${SY})"><circle r="${RL + 4}" fill="#fff"/><path d="${SPIRAL(0)}" fill="none" stroke="#000" stroke-width="4.6" stroke-linecap="round"/>${[8, 20, 32].map(r => `<circle cx="${TG[0]}" cy="${TG[1]}" r="${r}" fill="none" stroke="#000" stroke-width="4.6"/>`).join('')}</g></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The lightbox is the block; the dish lies on its glowing top.
  const CY = 76, HALF = 30, T = 18;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const [N, E, S, W] = D_TOP;
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // The ground plane: the dish is drawn flat, then laid on the top.
  const K = 0.56, PLANE = `matrix(${f(0.866 * K)} ${f(0.5 * K)} ${f(-0.866 * K)} ${f(0.5 * K)} 64 ${CY - 3})`;
  const D_WALL = 4;
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [12, 40, 104, 72],
    idea: 'The lightbox is the block: a glowing white top, pale faces, a rim on the top edges. The dish lies flat on the light with its orange dye, the spiral pair and a target of rings. Hover and the reaction runs; the pointer seeds new targets on the dish.',
    art(svg, u) {
      const top = poly(D_TOP);
      const rx = (RL + 4) * K * 1.2247, ry = (RL + 4) * K * 0.7071;
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 5)}
          ${rg(`${u}top`, [[0, 'oklch(0.99 0.02 95)'], [1, 'oklch(0.86 0.03 90)']], 'cx="0.5" cy="0.45" r="0.7"')}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="oklch(0.68 0.012 250)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="oklch(0.48 0.012 250)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <ellipse cx="64" cy="${CY}" rx="${f(rx + 6)}" ry="${f(ry + 4)}" fill="${LIGHT}" opacity="0.8" filter="url(#${u}g)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.7" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(64 - rx)} ${CY - 3}V${CY - 3 + D_WALL}A${f(rx)} ${f(ry)} 0 0 0 ${f(64 + rx)} ${CY - 3 + D_WALL}V${CY - 3}Z" fill="oklch(0.78 0.03 220)" opacity="0.8"/>
        <g transform="${PLANE}">${dishMarkup(u)}</g>`;
      // The pointer back onto the dish's plane.
      return react(svg, p => {
        const x = (p[0] - 64) / (0.866 * K), y = (p[1] - (CY - 3)) / (0.5 * K);
        return [(x + y) / 2, (y - x) / 2];
      }, u);
    },
    emblem: (() => {
      const rx = (RL + 4) * K * 1.2247;
      return `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/><g transform="${PLANE}"><circle r="${RL + 4}" fill="#fff"/><path d="${SPIRAL(0)}" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>${[8, 20, 32].map(r => `<circle cx="${TG[0]}" cy="${TG[1]}" r="${r}" fill="none" stroke="#000" stroke-width="5"/>`).join('')}</g></svg>`;
    })(),
  });


  /* ================= Gallery ================= */
  const NAME = 'BZ reaction';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-bz';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `bz-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
