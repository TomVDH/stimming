<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Rose window 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Rose window 1</h1>
<p class="lede">Rose window, round 1. No pick yet; A goes on the menu until Tom picks. A: a Gothic rose of deep blue and ruby glass in a pale stone ring, its coloured light pooled on the floor below. D: the rose stands on a limestone block, its light on the block's top.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The menu tile's ids take the tile prefix, so three copies can live.
  const ids = (m, u) => m.replace(/id="([^"]+)"/g, `id="${u}$1"`).replace(/url\(#([^)]+)\)/g, `url(#${u}$1)`).replace(/href="#([^"]+)"/g, `href="#${u}$1"`);

  const DIRS = [];

  // The toy's tokens: pale limestone, deep blue and ruby glass, gold accents.
  const STONE = [[0, 'oklch(0.88 0.022 82)'], [1, 'oklch(0.6 0.03 70)']];
  const TRACERY = [[0, 'oklch(0.34 0.02 262)'], [1, 'oklch(0.2 0.018 268)']];
  const BLUE = [[0, 'oklch(0.68 0.16 252)'], [1, 'oklch(0.38 0.19 266)']];
  const RUBY = [[0, 'oklch(0.66 0.22 27)'], [1, 'oklch(0.42 0.18 22)']];
  const GOLD = [[0, 'oklch(0.9 0.14 88)'], [1, 'oklch(0.7 0.15 66)']];
  const HALO = [[0, 'oklch(0.6 0.17 285)', 0.75], [1, 'oklch(0.5 0.17 285)', 0]];

  // The rose: twelve lancets round a quatrefoil, roundels between their heads.
  // cx, cy: the centre; k: the scale. Each part is a closed path or a point.
  const rose = (cx, cy, k) => {
    const at = (u, v, a) => [cx + (u * Math.sin(a) + v * Math.cos(a)) * k, cy + (-u * Math.cos(a) + v * Math.sin(a)) * k];
    const P = p => `${f(p[0])} ${f(p[1])}`;
    const petals = [], meds = [], rounds = [];
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6;
      const r0 = 14.5, r1 = 28.5, w0 = 2.3, w1 = 6.2, ap = 38;
      petals.push(`M${P(at(r0, -w0, a))}L${P(at(r1, -w1, a))}Q${P(at(r1 + 5, -w1 * 0.95, a))} ${P(at(ap, 0, a))}Q${P(at(r1 + 5, w1 * 0.95, a))} ${P(at(r1, w1, a))}L${P(at(r0, w0, a))}Z`);
      meds.push(at(25, 0, a));
      rounds.push(at(36.2, 0, a + Math.PI / 12));
    }
    const ring = [];
    for (let i = 0; i < 24; i++) ring.push(at(41.6, 0, i * Math.PI / 12 + Math.PI / 24));
    const quat = [0, 1, 2, 3].map(i => at(3.4, 0, i * Math.PI / 2 + Math.PI / 4));
    return { petals, meds, rounds, ring, quat, k, cx, cy };
  };
  const circ = (p, r, fill, extra = '') => `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${f(r)}" fill="${fill}"${extra}/>`;
  const disc = (cx, cy, r) => `M${f(cx - r)} ${f(cy)}a${f(r)} ${f(r)} 0 1 0 ${f(2 * r)} 0a${f(r)} ${f(r)} 0 1 0 ${f(-2 * r)} 0Z`;

  // The window in the menu's language: a stone ring, tracery, glass, a sun glint.
  const roseArt = (u, R) => {
    const { petals, meds, rounds, ring, quat, k, cx, cy } = R;
    const glass = [...petals, ...rounds.map(p => disc(p[0], p[1], 3.1 * k)), disc(cx, cy, 9.6 * k)].join('');
    return `
        <circle class="halo" cx="${f(cx)}" cy="${f(cy)}" r="${f(47 * k)}" fill="url(#${u}halo)" opacity="0.45" filter="url(#${u}b)"/>
        ${body(disc(cx, cy, 44 * k), u, 'stone')}
        <path d="${disc(cx, cy, 39.6 * k)}" fill="url(#${u}trac)"/>
        ${ring.map((p, i) => circ(p, 1.55 * k, i % 2 ? `url(#${u}ruby)` : `url(#${u}blue)`)).join('')}
        <clipPath id="${u}gl"><path d="${glass}"/></clipPath>
        <g clip-path="url(#${u}gl)">
          <rect x="${f(cx - 40 * k)}" y="${f(cy - 40 * k)}" width="${f(80 * k)}" height="${f(80 * k)}" fill="url(#${u}blue)"/>
          ${rounds.map(p => circ(p, 3.1 * k, `url(#${u}ruby)`) + circ(p, 1.2 * k, `url(#${u}gold)`)).join('')}
          ${meds.map((p, i) => circ(p, 4.2 * k, i % 3 === 1 ? `url(#${u}gold)` : `url(#${u}ruby)`)).join('')}
          ${circ([cx, cy], 9.6 * k, `url(#${u}ruby)`)}
          ${quat.map(p => circ(p, 2.7 * k, `url(#${u}gold)`)).join('')}
          ${circ([cx, cy], 1.9 * k, `url(#${u}blue)`)}
          <circle class="sun" data-k="${k}" cx="${f(cx - 30 * k)}" cy="${f(cy - 14 * k)}" r="${f(34 * k)}" fill="url(#${u}sun)" opacity="0.5"/>
        </g>
        <path d="${disc(cx, cy, 44 * k)}" fill="url(#${u}lit)"/>
        <path d="${disc(cx, cy, 44 * k)}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>`;
  };
  const defs = u => `${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}p`, 2.2)}
          ${lg(`${u}stone`, STONE, 'x1="0.1" y1="0" x2="0.7" y2="1"')}${lg(`${u}trac`, TRACERY, 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}blue`, BLUE, 'x1="0.2" y1="0" x2="0.7" y2="1"')}${lg(`${u}ruby`, RUBY, 'x1="0.2" y1="0" x2="0.7" y2="1"')}${lg(`${u}gold`, GOLD)}
          ${rg(`${u}halo`, HALO)}${rg(`${u}sun`, [[0, '#fff', 0.85], [0.45, '#fff', 0.25], [1, '#fff', 0]])}`;
  // The light on the floor: blue, ruby and gold pools, soft at the edge.
  const pool = u => `
          <ellipse cx="0" cy="0" rx="30" ry="6.2" fill="oklch(0.55 0.18 268)" opacity="0.75" filter="url(#${u}p)"/>
          <ellipse cx="-9" cy="0.4" rx="9" ry="3" fill="oklch(0.62 0.22 27)" opacity="0.85" filter="url(#${u}p)"/>
          <ellipse cx="10" cy="-0.4" rx="8" ry="2.6" fill="oklch(0.62 0.22 27)" opacity="0.8" filter="url(#${u}p)"/>
          <ellipse cx="0" cy="0" rx="4.4" ry="1.8" fill="oklch(0.9 0.14 85)" opacity="0.9" filter="url(#${u}p)"/>
          <ellipse cx="-22" cy="0.6" rx="4" ry="1.6" fill="oklch(0.85 0.14 85)" opacity="0.6" filter="url(#${u}p)"/>`;

  // The shared motion: the sun crosses behind the glass, left to right.
  // The panes it strikes glow; the halo swells; the pool slides the other way and stretches.
  const run = (svg, shaft = null) => {
    const sun = svg.querySelector('.sun'), halo = svg.querySelector('.halo'), pl = svg.querySelector('.pool');
    const k = +sun.dataset.k || 1, cx0 = +sun.getAttribute('cx'), sh = svg.querySelector('.shaft');
    const st = { s: 0 };
    const draw = () => {
      const s = st.s;
      sun.setAttribute('cx', f(cx0 + 60 * k * s));
      sun.setAttribute('opacity', f(0.5 + 0.35 * Math.sin(Math.PI * s)));
      halo.setAttribute('opacity', f(0.45 + 0.4 * Math.sin(Math.PI * Math.min(1, s * 1.4))));
      pl.setAttribute('transform', `${pl.dataset.base} translate(${f(14 - 28 * s)} 0) scale(${f(1 + 0.25 * s)} 1)`);
      if (sh && shaft) sh.setAttribute('d', shaft(s));
    };
    let tl = null;
    return {
      enter() {
        if (tl) tl.kill();
        tl = gsap.timeline({ repeat: -1, yoyo: true });
        tl.to(st, { s: 1, duration: 3.2, ease: 'sine.inOut', onUpdate: draw });
      },
      move() {},
      leave() {
        if (tl) tl.kill();
        tl = null;
        gsap.to(st, { s: 0, duration: 1.1, ease: 'power2.inOut', onUpdate: draw });
      },
    };
  };

  /* ================= Current ================= */

  // Rose window is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  const RA = rose(64, 55, 1);
  // The shaft: from the lower glass down to the pool; it follows the pool.
  const shaftA = s => { const x = 64 + 14 - 28 * s, w = 30 * (1 + 0.25 * s); return `M46 76L82 76L${f(x + w * 0.8)} 110L${f(x - w * 0.8)} 110Z`; };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [18, 9, 92, 109],
    idea: 'A Gothic rose: twelve lancets of deep blue glass with ruby medallions round a ruby and gold quatrefoil, ruby roundels between the heads, a ring of small lights, all in a pale limestone ring. Its light pools on the floor below in blue, ruby and gold. The pointer moves the sun behind the glass: the panes it strikes glow, the halo swells, and the pool slides the other way and stretches, as in the toy.',
    art(svg, u) {
      svg.innerHTML = `<defs>${defs(u)}${lg(`${u}shaft`, [[0, 'oklch(0.7 0.12 280)', 0.32], [1, 'oklch(0.6 0.15 280)', 0.04]])}</defs>
        <path class="shaft" d="${shaftA(0)}" fill="url(#${u}shaft)" filter="url(#${u}p)"/>
        <g class="pool" data-base="translate(64 110)" transform="translate(64 110) translate(14 0)">${pool(u)}</g>
        ${roseArt(u, RA)}`;
      return run(svg, shaftA);
    },
    emblem: (() => {
      const { petals, rounds, ring } = RA;
      return `${EMB_HEAD}<ellipse cx="64" cy="110" rx="30" ry="6" fill="#9a9a9a"/><circle cx="64" cy="55" r="44" fill="#fff"/>`
        + `<path d="${petals.join('')}" fill="#000"/>${rounds.map(p => circ(p, 3.3, '#000')).join('')}${ring.map(p => circ(p, 1.7, '#000')).join('')}`
        + `<circle cx="64" cy="55" r="9.8" fill="#000"/><circle cx="64" cy="55" r="4.6" fill="#fff"/></svg>`;
    })(),
  });

  /* ================= D: Isometric block ================= */

  // A limestone block at 30 degrees; the rose stands on it, its light pooled on the top.
  const CY = 94, HX = 25, HY = 25, T = 11;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  const KD = 0.6, RD = rose(64, CY - 4 - 44 * KD, KD);
  const PLANE = `matrix(0.866 0.5 -0.866 0.5 64 ${CY})`;
  const DTOP = RD.cy - 44 * KD - 2;
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [W[0] - 1, DTOP, E[0] - W[0] + 2, S[1] + T - DTOP],
    idea: 'A limestone block at 30 degrees: a pale top, a mid left face, a dark right face, a rim on the top edges. The rose stands on the block, and its light pools on the top face in blue, ruby and gold. The pointer moves the sun behind the glass, as A does; the pool slides across the top.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${defs(u)}
          ${lg(`${u}top`, [[0, 'oklch(0.86 0.02 82)'], [1, 'oklch(0.66 0.028 72)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.56 0.026 72)'], [1, 'oklch(0.46 0.024 68)']])}
          ${lg(`${u}R`, [[0, 'oklch(0.38 0.02 68)'], [1, 'oklch(0.3 0.018 64)']])}
          <clipPath id="${u}tc"><path d="${top}"/></clipPath></defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <g clip-path="url(#${u}tc)"><g transform="${PLANE}"><g class="pool" data-base="translate(9 9) rotate(-45) scale(0.62)" transform="translate(9 9) rotate(-45) scale(0.62) translate(14 0)">${pool(u)}</g></g></g>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <ellipse cx="64" cy="${CY - 3}" rx="16" ry="4" fill="oklch(0.2 0.01 250)" opacity="0.45" filter="url(#${u}b)"/>
        ${roseArt(u, RD)}`;
      return run(svg);
    },
    emblem: (() => {
      const { petals, rounds, cx, cy } = RD;
      return `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#d0d0d0"/>`
        + `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(44 * KD)}" fill="#fff"/><path d="${petals.join('')}" fill="#000"/>${rounds.map(p => circ(p, 3.3 * KD, '#000')).join('')}`
        + `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(9.8 * KD)}" fill="#000"/><circle cx="${f(cx)}" cy="${f(cy)}" r="${f(4.6 * KD)}" fill="#fff"/></svg>`;
    })(),
  });

  /* ================= Gallery ================= */
  const NAME = "Rose window";
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-rosewindow';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `rosewindow-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      // A menu tile with no data-box fits its drawn bounds, as the menu does.
      const bb = D.box === "bbox" && svg.getBBox();
      fitIcon(svg, bb ? [bb.x, bb.y, bb.width, bb.height] : D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
