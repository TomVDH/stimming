<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Car wash 2</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Car wash 2</h1>
<p class="lede">Car wash, round 2: the wash itself at night, its tunnel mouth blazing under a swept canopy, a finned sedan riding in between the brushes, neon red and sodium amber on the stucco. A: free on the lot. D: on a block of desert lot.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // An emblem frames its icon the same way: long side 110 of 128.
  const embHead = b => { const s = (Math.max(b[2], b[3]) * 128) / 110, cx = b[0] + b[2] / 2, cy = b[1] + b[3] / 2; return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${f(cx - s / 2)} ${f(cy - s / 2)} ${f(s)} ${f(s)}" width="128" height="128">`; };

  // The toy's tokens, from carwash/index.html (PLACE_GL and the shot).
  // Stucco, the sea-green dado, the soffit, sign red, the neon, the lamps.
  // The front is lit from the mouth and the lamp; its corners fall dark.
  const STUCCO = [[0, 'oklch(0.74 0.08 76)'], [0.45, 'oklch(0.5 0.055 58)'], [1, 'oklch(0.3 0.035 30)']];
  const SIDE = [[0, 'oklch(0.36 0.04 285)'], [1, 'oklch(0.22 0.03 275)']];
  const ROOF = [[0, 'oklch(0.44 0.04 270)'], [1, 'oklch(0.3 0.03 275)']];
  const DADO = 'oklch(0.5 0.06 175)', DADO_S = 'oklch(0.28 0.04 200)';
  const SOFFIT = [[0, 'oklch(0.92 0.1 82)'], [0.5, 'oklch(0.76 0.08 90)'], [1, 'oklch(0.52 0.05 190)']];
  const FASCIA = [[0, 'oklch(0.86 0.04 85)'], [1, 'oklch(0.62 0.05 70)']];
  const NEONR = 'oklch(0.62 0.25 28)', NEONB = 'oklch(0.68 0.15 248)';
  const WARM = 'oklch(0.8 0.13 65)', BULB = 'oklch(0.97 0.08 88)';
  const MOUTH = [[0, 'oklch(0.98 0.05 92)'], [0.35, 'oklch(0.88 0.12 80)'], [0.75, 'oklch(0.62 0.11 62)'], [1, 'oklch(0.42 0.07 50)']];
  const PIPE = 'oklch(0.34 0.02 235)', EXIT = 'oklch(0.24 0.04 240)';
  const CLOTH = [[0, 'oklch(0.3 0.08 255)'], [0.35, 'oklch(0.58 0.12 245)'], [1, 'oklch(0.26 0.07 255)']];
  const BAND = 'oklch(0.82 0.07 235)';
  const FOAM = [[0, 'oklch(0.99 0.02 90)'], [1, 'oklch(0.8 0.05 75)']];
  const GLASSB = [[0, 'oklch(0.92 0.1 85)'], [1, 'oklch(0.7 0.13 62)']];
  const { sin, PI } = Math;
  // A smooth closed curve through points, as Catmull-Rom.
  const spline = pts => {
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d;
  };

  // The building in metres, after the toy.
  // The door and the canopy grow for the icon.
  // x runs across the front, y up, z back into the tunnel.
  const W = 2.65, H = 4.6, L = 3.2, DW = 1.95, DH = 3.5, PW = 1.7, PH = 0.65;
  // Reference: Slauson Googie car wash, Wikimedia Commons (swept roof line).
  // The canopy sweeps up and out from the wall.
  // Two pipe posts hold its front edge.
  const CW = 2.9, CT = 0.28, FH = 0.5;

  // The car's back in metres: fins, a low deck, the cabin.
  const CAR_PTS = [[-1.12, 0.3], [-1.1, 0.95], [-1.0, 1.12], [-0.86, 0.94], [-0.6, 0.9], [-0.5, 1.42], [0, 1.47], [0.5, 1.42], [0.6, 0.9], [0.86, 0.94], [1.0, 1.12], [1.1, 0.95], [1.12, 0.3], [0, 0.26], [-1.12, 0.3]];
  // Where the tunnel vanishes, and where the car stands, on screen.
  const tunnelVp = v => v.proj(0.6, 1.35, 0);
  const carAt = v => { const vp = tunnelVp(v); return { cb: toward(vp, v.proj(0, 0, 0), 0.8), ck: v.k * 0.92 }; };
  // A side brush's corners on screen: a roller just inside the jamb.
  const brushQuad = (v, side) => {
    const x0 = side < 0 ? -DW + 0.04 : DW - 0.64, x1 = x0 + 0.6, vp = tunnelVp(v);
    return [[x0, 0.2, 0], [x1, 0.2, 0], [x1, DH - 0.45, 0], [x0, DH - 0.45, 0]].map(p => toward(vp, v.proj(...p), 0.94));
  };
  // A view: proj(x, y, z) gives a screen point.
  // cz is the canopy's reach; c0 and c1 are its heights.
  // A sees the place low, from across the road.
  // D sees it at 30 degrees.
  const viewA = { k: 10.5, cz: 2.4, c0: 3.95, c1: 5.25, proj: (x, y, z) => [60 + 10.5 * (x + 0.4 * z), 100 - 10.5 * (y + 0.24 * z)] };
  const ISO = 9.2, ZF = 0.1;
  const isoP = (x, y, z) => { const gx = x, gy = ZF - z; return [64 + (gx - gy) * 0.866 * ISO, 70 + (gx + gy) * 0.5 * ISO - y * ISO]; };
  const viewD = { k: ISO, cz: 1.4, c0: 4.0, c1: 4.4, proj: isoP };

  // A path through projected points.
  const pp = (v, pts) => poly(pts.map(p => v.proj(...p)));
  // A point pulled toward vp by the factor s.
  const toward = (vp, p, s) => [vp[0] + (p[0] - vp[0]) * s, vp[1] + (p[1] - vp[1]) * s];
  // Screen area sign: positive when the polygon faces the viewer.
  const facing = (v, pts) => { const q = pts.map(p => v.proj(...p)); let a = 0; q.forEach((p, i) => { const n = q[(i + 1) % q.length]; a += p[0] * n[1] - n[0] * p[1]; }); return a; };

  // The canopy's corners: the soffit under, the slab's top over.
  const canopyPts = v => {
    const under = [[-CW, v.c0, 0], [CW, v.c0, 0], [CW, v.c1, -v.cz], [-CW, v.c1, -v.cz]];
    const top = under.map(([x, y, z]) => [x, y + (z === 0 ? CT : FH), z]);
    return { under, top };
  };
  // Every point that bounds the drawing, for the 110 fit.
  const boundsOf = (v, extra = []) => {
    const { under, top } = canopyPts(v);
    const pts = [[-W, 0, 0], [W, 0, 0], [W, 0, L], [W, H, L], [-W, H, L], [-W, H, 0], [-PW, H + PH, 0], [PW, H + PH, 0.4], [-CW + 0.3, 0, -v.cz + 0.3], [CW - 0.3, 0, -v.cz + 0.3], ...under, ...top, ...extra].map(p => v.proj(...p));
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)];
  };

  const washDefs = (u, v) => `${light(u)}${blur(`${u}b2`, 2)}${blur(`${u}b4`, 4)}${blur(`${u}b7`, 7)}
    ${rg(`${u}front`, STUCCO, 'cx="0.55" cy="0.95" r="0.85"')}
    ${lg(`${u}side`, SIDE, 'x1="0" y1="0" x2="1" y2="0.4"')}
    ${lg(`${u}roof`, ROOF, 'x1="0" y1="1" x2="1" y2="0"')}
    ${lg(`${u}soffit`, SOFFIT, 'x1="0.6" y1="1" x2="0.2" y2="0"')}
    ${lg(`${u}fascia`, FASCIA)}
    ${lg(`${u}glassb`, GLASSB)}
    ${rg(`${u}mouth`, MOUTH, 'cx="0.55" cy="0.42" r="0.75"')}
    ${lg(`${u}cloth`, CLOTH, 'x1="0" y1="0" x2="1" y2="0"')}
    ${rg(`${u}foam`, FOAM, 'cx="0.35" cy="0.3" r="0.8"')}
    ${lg(`${u}neon`, [[0, NEONR, 0.38], [0.28, NEONR, 0]], 'x1="0" y1="0" x2="1" y2="0"')}
    ${rg(`${u}pool`, [[0, WARM, 0.75], [0.5, WARM, 0.3], [1, WARM, 0]])}
    ${rg(`${u}spill`, [[0, 'oklch(0.95 0.08 85)', 0.9], [1, 'oklch(0.85 0.12 75)', 0]])}
    ${rg(`${u}red`, [[0, NEONR, 0.5], [1, NEONR, 0]])}
    ${rg(`${u}bulb`, [[0, '#fff', 1], [0.35, BULB, 0.9], [1, WARM, 0]])}
    ${lg(`${u}floor`, [[0, 'oklch(0.3 0.03 250)'], [1, 'oklch(0.7 0.1 75)']])}
    ${lg(`${u}wallL`, [[0, 'oklch(0.86 0.08 82)'], [1, 'oklch(0.66 0.08 70)']], 'x1="0" y1="0" x2="1" y2="0"')}
    ${lg(`${u}wallR`, [[0, 'oklch(0.66 0.08 70)'], [1, 'oklch(0.8 0.08 80)']], 'x1="0" y1="0" x2="1" y2="0"')}
    ${rg(`${u}fog`, [[0, 'oklch(0.86 0.1 80)', 0.55], [1, 'oklch(0.86 0.1 80)', 0.1]])}
    ${lg(`${u}paint`, [[0, 'oklch(0.46 0.07 200)'], [0.5, 'oklch(0.3 0.055 210)'], [1, 'oklch(0.2 0.04 230)']])}
    ${lg(`${u}rglass`, [[0, 'oklch(0.9 0.09 82)'], [1, 'oklch(0.55 0.08 60)']])}
    ${lg(`${u}back`, [[0, 'oklch(0.97 0.07 88)', 0.95], [0.45, 'oklch(0.9 0.1 80)', 0.2], [1, 'oklch(0.9 0.1 80)', 0]])}
    ${lg(`${u}chrome`, [[0, 'oklch(0.97 0.02 90)'], [0.5, 'oklch(0.62 0.03 80)'], [1, 'oklch(0.85 0.04 85)']])}
    <pattern id="${u}bands" patternUnits="userSpaceOnUse" width="200" height="${f(0.7 * v.k)}"><rect width="200" height="${f(0.3 * v.k)}" fill="${BAND}" opacity="0.7"/></pattern>`;

  // The place as layers, far to near.
  const washMarkup = (u, v) => {
    const P = v.proj;
    // The mouth and the tunnel inside it, with a fake vanishing point.
    const mouth = [[-DW, 0, 0], [DW, 0, 0], [DW, DH, 0], [-DW, DH, 0]].map(p => P(...p));
    const vp = tunnelVp(v);
    const at = s => mouth.map(p => toward(vp, p, s));
    const arch = s => { const q = at(s); return `M${f(q[0][0])} ${f(q[0][1])}L${f(q[3][0])} ${f(q[3][1])}L${f(q[2][0])} ${f(q[2][1])}L${f(q[1][0])} ${f(q[1][1])}`; };
    const quad = s => poly(at(s));
    // The tunnel's four inner faces, from the door to the far exit.
    const FAR = 0.26, m = at(1), q = at(FAR);
    const face = (i, j) => poly([m[i], m[j], q[j], q[i]]);
    // The dado on each wall: the lowest quarter, in sea green.
    const lo = (a, b) => [a[0] + (b[0] - a[0]) * 0.25, a[1] + (b[1] - a[1]) * 0.25];
    const low = (i, j) => poly([m[i], lo(m[i], m[j]), lo(q[i], q[j]), q[i]]);
    const ARCH = [0.8, 0.58, 0.42, 0.32];
    const arches = ARCH.map((s, i) => `<path d="${arch(s)}" fill="none" stroke="${PIPE}" stroke-width="${f(3.4 * s * v.k / 10)}" stroke-linejoin="round" opacity="${f(0.9 - i * 0.18)}"/>`).join('');
    // A tube lamp at each arch's crown; the second one stutters.
    const tubes = ARCH.map(s => { const a = toward(vp, P(-0.9, DH - 0.25, 0), s), b = toward(vp, P(0.9, DH - 0.25, 0), s); return `<path class="tube" d="M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}" stroke="${BULB}" stroke-width="${f(3 * s * v.k / 10 + 0.5)}" stroke-linecap="round"/>`; }).join('');
    // The side brushes scrub the car's flanks: tall cloth rollers.
    const brush = side => {
      const q = brushQuad(v, side);
      const d = `M${f(q[0][0])} ${f(q[0][1])}Q${f((q[0][0] + q[1][0]) / 2)} ${f(q[0][1] + 2)} ${f(q[1][0])} ${f(q[1][1])}L${f(q[2][0])} ${f(q[2][1])}Q${f((q[2][0] + q[3][0]) / 2)} ${f(q[2][1] - 2)} ${f(q[3][0])} ${f(q[3][1])}Z`;
      return `<path d="${d}" fill="url(#${u}cloth)"/><path class="bandf" d="${d}" fill="url(#${u}bands)"/><path d="${d}" fill="url(#${u}lit)"/>`;
    };
    // The car from behind, as the chain takes it in.
    const { cb, ck } = carAt(v);
    const cxy = ([x, y]) => [cb[0] + x * ck, cb[1] - y * ck];
    const cs = pts => spline(pts.map(cxy)) + 'Z';
    // Tail fins rise at the back corners.
    const CAR = cs(CAR_PTS);
    const glassR = cs([[-0.5, 0.95], [-0.42, 1.36], [0, 1.4], [0.42, 1.36], [0.5, 0.95], [0, 0.93], [-0.5, 0.95]]);
    const bumper = poly([[-1.16, 0.26], [1.16, 0.26], [1.14, 0.44], [-1.14, 0.44]].map(cxy));
    const tl = sd => cxy([sd * 0.9, 0.74]);
    const tails = [-1, 1].map(sd => `<ellipse class="tail" cx="${f(tl(sd)[0])}" cy="${f(tl(sd)[1])}" rx="${f(0.13 * ck)}" ry="${f(0.22 * ck)}" fill="${NEONR}"/>`).join('');
    const tailGlow = [-1, 1].map(sd => `<circle cx="${f(tl(sd)[0])}" cy="${f(tl(sd)[1])}" r="${f(0.42 * ck)}" fill="${NEONR}" filter="url(#${u}b4)"/>`).join('');
    // White suds heap on the roof, as in the toy.
    const SUDS = [[-0.28, 1.47, 0.2], [0.08, 1.53, 0.23], [0.38, 1.44, 0.17]];
    const suds = SUDS.map(([x, y, r]) => { const c = cxy([x, y]); return `<circle cx="${f(c[0])}" cy="${f(c[1])}" r="${f(r * ck)}"/>`; }).join('');
    const mouthD = poly(mouth);
    // The front face, minus nothing: the mouth paints over it.
    const front = pp(v, [[-W, 0, 0], [W, 0, 0], [W, H, 0], [-W, H, 0]]);
    const dado = pp(v, [[-W, 0, 0], [-DW, 0, 0], [-DW, 0.85, 0], [-W, 0.85, 0]]) + pp(v, [[DW, 0, 0], [W, 0, 0], [W, 0.85, 0], [DW, 0.85, 0]]);
    const side = pp(v, [[W, 0, 0], [W, 0, L], [W, H, L], [W, H, 0]]);
    const sideDado = pp(v, [[W, 0, 0], [W, 0, L], [W, 0.85, L], [W, 0.85, 0]]);
    const roof = pp(v, [[-W, H, 0], [W, H, 0], [W, H, L], [-W, H, L]]);
    // The stepped parapet over the door.
    const parF = pp(v, [[-PW, H, 0], [PW, H, 0], [PW, H + PH, 0], [-PW, H + PH, 0]]);
    const parT = pp(v, [[-PW, H + PH, 0], [PW, H + PH, 0], [PW, H + PH, 0.4], [-PW, H + PH, 0.4]]);
    const parS = pp(v, [[PW, H, 0], [PW, H, 0.4], [PW, H + PH, 0.4], [PW, H + PH, 0]]);
    // Glass blocks along the side let the tunnel's light out.
    const gb = [[0.5, 1.9], [2.3, 3.8]].map(([a, b]) => pp(v, [[W, 2.35, a], [W, 2.35, b], [W, 3.15, b], [W, 3.15, a]])).join('');
    // The canopy: soffit or slab top, whichever faces us, then the fascia.
    const { under, top } = canopyPts(v);
    const showUnder = facing(v, under) < 0;
    const slab = showUnder ? `${body(pp(v, under), u, 'soffit')}` : `${body(pp(v, [...top].reverse()), u, 'fascia')}<path d="${pp(v, under)}" fill="url(#${u}soffit)" opacity="0"/>`;
    const edge = pp(v, [[CW, v.c0, 0], [CW, v.c1, -v.cz], [CW, v.c1 + FH, -v.cz], [CW, v.c0 + CT, 0]]);
    const fascia = pp(v, [[-CW, v.c1, -v.cz], [CW, v.c1, -v.cz], [CW, v.c1 + FH, -v.cz], [-CW, v.c1 + FH, -v.cz]]);
    // The chrome lip on the fascia: one bold bright band.
    const lip = pp(v, [[-CW, v.c1 + 0.08, -v.cz], [CW, v.c1 + 0.08, -v.cz], [CW, v.c1 + 0.2, -v.cz], [-CW, v.c1 + 0.2, -v.cz]]);
    // Two caged bulbs under the slab.
    const bulbs = [-1.25, 1.25].map(x => { const zb = -1.3, yb = v.c0 + (v.c1 - v.c0) * (-zb / v.cz) - 0.12; const b = P(x, yb, zb); return `<circle class="bulb" cx="${f(b[0])}" cy="${f(b[1])}" r="${f(0.55 * v.k)}" fill="url(#${u}bulb)"/>`; }).join('');
    // Pipe posts at the slab's front corners.
    const posts = [-CW + 0.3, CW - 0.3].map(x => { const a = P(x, 0, -v.cz + 0.3), b = P(x, v.c1, -v.cz + 0.3); return `<path d="M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}" stroke="oklch(0.3 0.015 260)" stroke-width="${f(0.32 * v.k)}" stroke-linecap="round"/><path d="M${f(a[0] - 0.06 * v.k)} ${f(a[1])}L${f(b[0] - 0.06 * v.k)} ${f(b[1])}" stroke="oklch(0.62 0.04 70)" stroke-width="${f(0.1 * v.k)}" stroke-linecap="round" opacity="0.8"/>`; }).join('');
    // The mouth's light pools on the lot.
    // The far pylon's neon tints the left side red.
    const pool = P(0.2, 0, -1.6), red = P(-W - 0.4, 2.4, 0.4);
    return `
      <ellipse cx="${f(red[0])}" cy="${f(red[1])}" rx="${f(1.4 * v.k)}" ry="${f(2.6 * v.k)}" fill="${NEONR}" opacity="0.3" filter="url(#${u}b7)"/>
      <ellipse class="pool" cx="${f(pool[0])}" cy="${f(pool[1])}" rx="${f(4.6 * v.k)}" ry="${f(1.5 * v.k)}" fill="url(#${u}pool)" filter="url(#${u}b4)"/>
      ${body(roof, u, 'roof')}
      <path d="${side}" fill="url(#${u}side)"/><path d="${sideDado}" fill="${DADO_S}"/>
      <g class="gb">${`<path d="${gb}" fill="url(#${u}glassb)"/>`}<path d="${gb}" fill="${WARM}" filter="url(#${u}b2)" opacity="0.6"/></g>
      <path d="${side}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
      <path d="${front}" fill="url(#${u}front)"/><path d="${dado}" fill="${DADO}"/>
      <path d="${front}" fill="url(#${u}neon)"/><path d="${front}" fill="url(#${u}lit)"/>
      <path d="${front}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
      ${body(parS, u, 'side')}${body(parT, u, 'roof')}${body(parF, u, 'front')}
      <clipPath id="${u}mc"><path d="${mouthD}"/></clipPath>
      <g clip-path="url(#${u}mc)">
        <path class="mbase" d="${mouthD}" fill="url(#${u}mouth)"/>
        <path d="${face(3, 2)}" fill="oklch(0.3 0.03 240)" opacity="0.7"/>
        <path d="${face(0, 1)}" fill="url(#${u}floor)"/>
        <path d="${face(0, 3)}" fill="url(#${u}wallL)"/><path d="${face(1, 2)}" fill="url(#${u}wallR)"/>
        <path d="${low(0, 3)}" fill="${DADO}" opacity="0.75"/><path d="${low(1, 2)}" fill="${DADO}" opacity="0.6"/>
        <path d="${quad(FAR)}" fill="${EXIT}"/>
        <path d="${quad(FAR)}" fill="url(#${u}fog)"/>
        ${arches}<g class="tubes">${tubes}</g>
        <ellipse class="mist" cx="${f(vp[0])}" cy="${f(vp[1])}" rx="${f(1.6 * v.k)}" ry="${f(1.2 * v.k)}" fill="url(#${u}spill)" filter="url(#${u}b4)" opacity="0.35"/>
        <ellipse cx="${f(cb[0])}" cy="${f(cb[1])}" rx="${f(1.3 * ck)}" ry="${f(0.18 * ck)}" fill="oklch(0.08 0.02 260)" opacity="0.6" filter="url(#${u}b2)"/>
        <g class="car">
          <g class="tailglow" opacity="0.55">${tailGlow}</g>
          <path d="${CAR}" fill="url(#${u}paint)"/>
          <path d="${glassR}" fill="url(#${u}rglass)"/>
          <path d="${CAR}" fill="none" stroke="url(#${u}back)" stroke-width="2" stroke-linejoin="round"/>
          <path d="${bumper}" fill="url(#${u}chrome)"/>
          ${tails}
          <g class="suds" fill="url(#${u}foam)">${suds}</g>
        </g>
        ${brush(-1)}${brush(1)}
        <path class="dark" d="${mouthD}" fill="oklch(0.08 0.02 260)" opacity="0"/>
      </g>
      <path class="spill" d="${mouthD}" fill="none" stroke="oklch(0.92 0.1 82)" stroke-width="${f(0.5 * v.k)}" filter="url(#${u}b4)" opacity="0.55"/>
      ${slab}
      ${body(edge, u, 'fascia')}
      ${body(fascia, u, 'fascia')}
      <path d="${lip}" fill="oklch(0.94 0.03 90)" opacity="0.85"/>
      ${bulbs}
      ${posts}`;
  };

  // The live place: brushes spin, the tubes stutter, mist breathes out.
  const wash = (svg, u, v) => {
    const $q = s => svg.querySelector(s);
    const bandEls = svg.querySelectorAll('.bandf'), pat = $q(`#${u}bands`), tubes = [...svg.querySelectorAll('.tube')];
    const mist = $q('.mist'), dark = $q('.dark'), pool = $q('.pool'), spill = $q('.spill'), gb = $q('.gb'), car = $q('.car'), suds = $q('.suds'), tailGlow = $q('.tailglow');
    const bulbs = [...svg.querySelectorAll('.bulb')];
    const mc = toward(v.proj(0.35, 1.55, 9), v.proj(0, DH / 2, 0), 0.6);
    const st = { brake: 0, spin: 0, spinTo: 0, near: 0, nearTo: 0, off: 0, t: 0, live: false, out: 0, next: 0, flick: 1 };
    const draw = () => {
      // The bands roll down the rollers: the brushes turn.
      pat.setAttribute('patternTransform', `translate(0 ${f(st.off)}) skewY(-28)`);
      bandEls.forEach(e => e.setAttribute('opacity', f(0.35 + 0.65 * st.spin)));
      const glow = 1 - 0.92 * st.out;
      tubes[1].setAttribute('opacity', f(st.flick * glow));
      tubes[0].setAttribute('opacity', f(glow)); tubes[2].setAttribute('opacity', f(glow * 0.8));
      mist.setAttribute('opacity', f((0.3 + 0.5 * st.spin * (0.6 + 0.4 * st.near) + 0.08 * sin(st.t * 2.1) * st.spin) * glow));
      mist.setAttribute('transform', `translate(0 ${f(-2 * st.spin * sin(st.t * 1.3))})`);
      // The chain tugs, so the car rocks and the suds bob.
      car.setAttribute('transform', `translate(0 ${f(0.5 * st.spin * sin(st.t * 2.4))})`);
      suds.setAttribute('transform', `translate(0 ${f(-0.6 * st.spin * (1 + sin(st.t * 3.1)))})`);
      tailGlow.setAttribute('opacity', f((0.45 + 0.45 * st.brake) * glow + 0.1));
      dark.setAttribute('opacity', f(0.85 * st.out));
      pool.setAttribute('opacity', f(glow * (0.85 + 0.15 * st.spin)));
      spill.setAttribute('opacity', f(0.55 * glow * (0.8 + 0.3 * st.near)));
      gb.setAttribute('opacity', f(0.15 + 0.85 * glow));
      bulbs.forEach((b, i) => b.setAttribute('opacity', f(0.9 + 0.1 * sin(st.t * 9 + i * 2) * st.spin)));
    };
    const loop = clock(time => {
      const dt = Math.min(0.1, time - (st.t || time));
      st.t = time;
      st.spin += (st.spinTo - st.spin) * 0.06;
      st.near += (st.nearTo - st.near) * 0.1;
      st.off += dt * v.k * (1.2 + 3.2 * st.near) * st.spin;
      // The middle tube stutters now and then, as the old tubes do.
      if (st.live && time > st.next) { st.next = time + 0.9 + Math.random() * 2.2; gsap.timeline().set(st, { flick: 0.2 }).set(st, { flick: 1 }, 0.07).set(st, { flick: 0.35 }, 0.45).set(st, { flick: 1 }, 0.52); }
      draw();
      // The clock stops once the brushes rest.
      if (!st.live && st.spin < 0.01 && st.out < 0.01) { Object.assign(st, { spin: 0, out: 0, flick: 1 }); draw(); loop.stop(); }
    });
    // Sometimes the tunnel goes dark, then comes back with two flashes.
    const lightsOut = () => gsap.timeline({ delay: 1.4 })
      .to(st, { out: 1, duration: 0.12 }).to(st, { out: 0, duration: 0.05 }, '+=0.9')
      .to(st, { out: 0.8, duration: 0.05 }, '+=0.08').to(st, { out: 0, duration: 0.05 }, '+=0.4');
    draw();
    return {
      enter(p) {
        st.live = true; st.spinTo = 1; st.next = st.t + 0.4; loop.start();
        // The driver taps the brake once as the chain takes the wheel.
        gsap.timeline().to(st, { brake: 1, duration: 0.1 }).to(st, { brake: 0, duration: 0.6 }, 0.5);
        if (Math.random() < 0.2) lightsOut();
        if (p) this.move(p); else st.nearTo = 0.6;
      },
      // A pointer near the mouth spins the brushes faster.
      move(p) {
        if (!p) return;
        st.nearTo = clamp(1 - Math.hypot(p[0] - mc[0], p[1] - mc[1]) / (5 * v.k));
      },
      leave() { st.live = false; st.spinTo = 0; st.nearTo = 0; loop.start(); },
    };
  };

  // The emblem: the solid place; the mouth and slab soffit in grey.
  const emblemOf = (v, extra = '') => {
    const { under, top } = canopyPts(v);
    const mouth = pp(v, [[-DW, 0, 0], [DW, 0, 0], [DW, DH, 0], [-DW, DH, 0]]);
    const { cb, ck } = carAt(v);
    const car = spline(CAR_PTS.map(([x, y]) => [cb[0] + x * ck, cb[1] - y * ck])) + 'Z';
    const all = [pp(v, [[-W, 0, 0], [W, 0, 0], [W, H, 0], [-W, H, 0]]), pp(v, [[W, 0, 0], [W, 0, L], [W, H, L], [W, H, 0]]), pp(v, [[-W, H, 0], [W, H, 0], [W, H, L], [-W, H, L]]),
      pp(v, [[-PW, H, 0], [PW, H, 0], [PW, H + PH, 0], [-PW, H + PH, 0]]), pp(v, [[-PW, H + PH, 0], [PW, H + PH, 0], [PW, H + PH, 0.4], [-PW, H + PH, 0.4]]), pp(v, [[PW, H, 0], [PW, H, 0.4], [PW, H + PH, 0.4], [PW, H + PH, 0]])].join('');
    const slab = pp(v, under) + pp(v, top) + pp(v, [[-CW, v.c1, -v.cz], [CW, v.c1, -v.cz], [CW, v.c1 + FH, -v.cz], [-CW, v.c1 + FH, -v.cz]]) + pp(v, [[CW, v.c0, 0], [CW, v.c1, -v.cz], [CW, v.c1 + FH, -v.cz], [CW, v.c0 + CT, 0]]);
    const posts = [-CW + 0.3, CW - 0.3].map(x => { const a = v.proj(x, 0, -v.cz + 0.3), b = v.proj(x, v.c1, -v.cz + 0.3); return `<path d="M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}" stroke="#fff" stroke-width="${f(0.4 * v.k)}" stroke-linecap="round"/>`; }).join('');
    return `${extra}<path d="${all}" fill="#fff"/><path d="${mouth}" fill="#8a8a8a"/><path d="${car}" fill="#fff"/><path d="${poly(brushQuad(v, -1)) + poly(brushQuad(v, 1))}" fill="#d0d0d0"/><path d="${slab}" fill="#fff"/>${posts}`;
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<path d="M4 104H124" stroke="oklch(0.42 0.02 80)" stroke-width="1.5"/>
        <path d="M66 104V84H122V104Z" fill="oklch(0.6 0.03 85)"/>
        <path d="M84 104V90H104V104Z" fill="oklch(0.84 0.05 200)" opacity="0.8"/>
        <path d="M60 80L110 83V86L60 83Z" fill="oklch(0.62 0.05 195)"/>
        <path d="M64 83V104M106 85V104" stroke="oklch(0.45 0.01 80)" stroke-width="1.2"/>
        <g fill="oklch(0.86 0.06 80)"><rect x="70" y="87" width="5" height="3"/><rect x="77" y="87" width="5" height="3"/><rect x="108" y="87" width="5" height="3"/></g>
        <path d="M118 104V58M118 59H112" stroke="oklch(0.38 0.03 60)" stroke-width="1.6" fill="none"/>
        <ellipse class="lamp" cx="111" cy="60" rx="3.4" ry="1.5" fill="oklch(0.82 0.15 62)"/>
        <path d="M27 104V16M33 104V16" stroke="oklch(0.5 0.01 80)" stroke-width="1.8"/>
        <path d="M18 14L42 11V35L18 38Z" fill="oklch(0.82 0.04 85)" stroke="oklch(0.5 0.15 28)" stroke-width="1.4"/>
        <path d="M23 21L36 19.5M23 28L37 26.5" stroke="oklch(0.5 0.15 28)" stroke-width="3" stroke-linecap="round"/>
        <path d="M15 43H45V38L57 46L45 54V49H15Z" fill="oklch(0.74 0.12 85)"/>
        <g class="bulbs" fill="oklch(0.9 0.14 75)">
          <circle cx="17" cy="45" r="1.5"/><circle cx="25" cy="45" r="1.5"/><circle cx="33" cy="45" r="1.5"/><circle cx="41" cy="45" r="1.5"/><circle cx="47" cy="41.5" r="1.5"/><circle cx="54" cy="46" r="1.5"/><circle cx="47" cy="50.5" r="1.5"/><circle cx="41" cy="47.5" r="1.5"/><circle cx="29" cy="47.5" r="1.5"/><circle cx="19" cy="47.5" r="1.5"/>
        </g>
        <rect x="17" y="58" width="26" height="15" rx="1.5" fill="oklch(0.14 0.01 270)"/>
        <path class="open" d="M21 62.5H39" stroke="oklch(0.64 0.25 28)" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M21 68.5H27M32 68.5H39" stroke="oklch(0.68 0.15 248)" stroke-width="2.2" stroke-linecap="round"/>`;
      const bulbs = [...svg.querySelector('.bulbs').children], open = svg.querySelector('.open'), lamp = svg.querySelector('.lamp');
      const LIVE0 = [1, 0, 1, 1, 0, 1, 0, 1, 0, 0], DIM = 0.22;
      let chase = null;
      const rest = () => bulbs.forEach((b, i) => gsap.to(b, { opacity: LIVE0[i] ? 0.85 : DIM, duration: 0.5, overwrite: 'auto' }));
      rest();
      const c = {
        enter(p) {
          chase?.kill();
          chase = gsap.timeline({ repeat: -1 });
          bulbs.forEach((b, i) => { if (LIVE0[i]) chase.to(b, { opacity: 1, duration: 0.12, yoyo: true, repeat: 1, ease: 'power1.inOut' }, i * 0.14); });
          gsap.timeline().to(open, { opacity: 0.25, duration: 0.05 }).to(open, { opacity: 1, duration: 0.05 }, 0.12)
            .to(open, { opacity: 0.3, duration: 0.05 }, 0.5).to(open, { opacity: 1, duration: 0.05 }, 0.62);
          gsap.to(lamp, { opacity: 1, duration: 0.4 });
          if (p) c.move(p);
        },
        move(p) {
          if (!p) return;
          bulbs.forEach(b => {
            const d = Math.hypot(p[0] - +b.getAttribute('cx'), p[1] - +b.getAttribute('cy'));
            gsap.to(b, { scale: 1 + 0.6 * Math.max(0, 1 - d / 26), transformOrigin: '50% 50%', duration: 0.25, overwrite: 'auto' });

        },
        leave() {

          gsap.to(bulbs, { scale: 1, duration: 0.5, overwrite: 'auto' });

          gsap.to(open, { opacity: 1, duration: 0.3 });
        },
      };
      return c;
    },
  });

  /* ================= A: Shaded object ================= */

  // The wash itself, seen low from across the road at night.
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: boundsOf(viewA),
    idea: 'The wash itself, from across the road at night: the low stucco block with its stepped parapet and swept canopy on pipe posts, the tunnel mouth blazing warm under it. Inside, pipe arches with tube lamps recede to the dark exit, and a finned sedan rides in on the chain, red tail lamps lit, suds heaped on its roof, blue cloth brushes at its flanks. The far pylon tints the left edge neon red; the glass blocks glow down the side. Enter: the driver taps the brake, the brushes spin up, the car rocks, mist breathes out, a tube stutters; now and then the tunnel goes dark and returns with two flashes. The pointer near the mouth spins the brushes faster.',

  /* ================= D: Isometric block ================= */

  // The lot is the block: desert top, asphalt apron, earth faces.
  // The block hugs the place and the canopy's reach.
  const XH = 3.5, T = 1.3, ZB0 = -viewD.cz - 0.5, ZB1 = L + 0.6;
  const blk = [[-XH, 0, ZB1], [XH, 0, ZB1], [XH, 0, ZB0], [-XH, 0, ZB0]];
  const D_EXTRA = [[-XH, -T, ZB0], [XH, -T, ZB0], [XH, -T, ZB1], ...blk];
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: boundsOf(viewD, D_EXTRA),
    idea: 'The lot is the block: dusty desert on the top with an asphalt apron to the door, earth on the faces, a rim on the top edges. The wash stands on it at 30 degrees, its mouth glowing onto the apron. Same pointer reaction as A.',
    art(svg, u) {
      const v = viewD, P = v.proj;

        <path d="${top}" fill="url(#${u}lit)"/>

        <path d="M${f(e[0][0])} ${f(e[0][1])}L${f(e[1][0])} ${f(e[1][1])}L${f(e[2][0])} ${f(e[2][1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        ${washMarkup(u, v)}`;
      return wash(svg, u, v);
    },
    emblem: `${embHead(boundsOf(viewD, D_EXTRA))}<path d="${pp(viewD, [[-XH, 0, ZB0], [XH, 0, ZB0], [XH, -T, ZB0], [-XH, -T, ZB0]])}" fill="#5a5a5a"/><path d="${pp(viewD, [[XH, 0, ZB0], [XH, 0, ZB1], [XH, -T, ZB1], [XH, -T, ZB0]])}" fill="#3a3a3a"/><path d="${pp(viewD, blk)}" fill="#8a8a8a"/><path d="${pp(viewD, [[-DW - 0.1, 0, 0], [DW + 0.1, 0, 0], [DW + 0.4, 0, ZB0], [-DW - 0.4, 0, ZB0]])}" fill="#444"/>${emblemOf(viewD)}</svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Car wash';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-carwash';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `carwash-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
