<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 7</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 6px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- Kaleidoscope. -->
    <linearGradient id="k-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.34 0.06 295)"/>
      <stop offset="1" style="stop-color: oklch(0.17 0.03 280)"/>
    </linearGradient>
    <radialGradient id="k-glass" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color: oklch(0.99 0.015 90)"/>
      <stop offset="0.66" style="stop-color: oklch(0.94 0.04 82)"/>
      <stop offset="1" style="stop-color: oklch(0.66 0.11 55)"/>
    </radialGradient>
    <radialGradient id="k-vig" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.78" style="stop-color: oklch(0.1 0.02 280)" stop-opacity="0"/>
      <stop offset="1" style="stop-color: oklch(0.1 0.02 280)" stop-opacity="0.92"/>
    </radialGradient>
    <linearGradient id="k-slab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.78 0.2 352)"/>
      <stop offset="1" style="stop-color: oklch(0.54 0.25 305)"/>
    </linearGradient>
    <!-- Soap cutting. -->
    <linearGradient id="s-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.92 0.08 50)"/>
      <stop offset="1" style="stop-color: oklch(0.84 0.11 42)"/>
    </linearGradient>
    <linearGradient id="s-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.8 0.13 38)"/>
      <stop offset="1" style="stop-color: oklch(0.65 0.16 28)"/>
    </linearGradient>
    <linearGradient id="s-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.7 0.15 32)"/>
      <stop offset="1" style="stop-color: oklch(0.56 0.17 24)"/>
    </linearGradient>
    <linearGradient id="s-cut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.93 0.07 55)"/>
      <stop offset="1" style="stop-color: oklch(0.78 0.12 40)"/>
    </linearGradient>
    <linearGradient id="s-mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.86 0.15 158)"/>
      <stop offset="1" style="stop-color: oklch(0.64 0.17 166)"/>
    </linearGradient>
    <linearGradient id="s-coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.86 0.11 48)"/>
      <stop offset="1" style="stop-color: oklch(0.68 0.17 28)"/>
    </linearGradient>
  </defs>
</svg>

<h1>Icon spike 7</h1>
<p class="lede">Kaleidoscope, Soap cutting. Hover or tab to the tiles.</p>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const RAD = Math.PI / 180;
  const BG = 'oklch(0.16 0.012 275)';
  const f = n => +n.toFixed(2);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const inset = (pts, k) => {
    const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length, cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
    return pts.map(([x, y]) => [cx + (x - cx) * k, cy + (y - cy) * k]);
  };
  // A point at radius r and angle a degrees around the centre.
  const P = (r, a, cx = 64, cy = 64) => [cx + r * Math.cos(a * RAD), cy + r * Math.sin(a * RAD)];
  const hex = (cx, cy, r, rot = 0) => poly(Array.from({ length: 6 }, (_, k) => P(r, rot + 60 * k, cx, cy)));
  const ring = (cx, cy, r) => `M${f(cx - r)} ${f(cy)}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };
  const RUB = { A: 'Shaded object', B: 'Stencil cut-out', C: 'Single-weight line', D: 'Isometric block', E: 'Abstract mark' };

  const DIRS = [];

  /* ================= Kaleidoscope ================= */

  // Current: the menu icon, copied with its hover loop.
  DIRS.push({
    toy: 'kaleido', l: 'Current', emblemUrl: '../shared/emblems/kaleido.svg',
    art(svg, u) {
      svg.innerHTML = `<defs><radialGradient id="${u}-lit" cx="0.32" cy="0.26" r="0.7"><stop offset="0" stop-color="#fff" stop-opacity="0.38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><linearGradient id="${u}-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.62"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="${u}-c0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.8 0.23 0)"/><stop offset="1" stop-color="oklch(0.58 0.28 330)"/></linearGradient><linearGradient id="${u}-c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.76 0.2 295)"/><stop offset="1" stop-color="oklch(0.5 0.27 278)"/></linearGradient><linearGradient id="${u}-c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.95 0.18 100)"/><stop offset="1" stop-color="oklch(0.78 0.21 58)"/></linearGradient></defs>
<g id="${u}-all"><g class="petal"><path d="M64.0 51.0L52.4 33.1L64.0 10.0L75.6 33.1Z" fill="none" stroke="oklch(0.16 0.012 275)" stroke-width="5" stroke-linejoin="round"/><path d="M64.0 51.0L52.4 33.1L64.0 10.0L75.6 33.1Z" fill="url(#${u}-c0)"/><path d="M64.0 51.0L52.4 33.1L64.0 10.0L75.6 33.1Z" fill="url(#${u}-lit)"/><path d="M64.0 51.0L52.4 33.1L64.0 10.0L75.6 33.1Z" fill="none" stroke="url(#${u}-rim)" stroke-width="1.5" stroke-linejoin="round"/></g><g class="petal"><path d="M75.3 57.5L84.9 38.5L110.8 37.0L96.6 58.6Z" fill="none" stroke="oklch(0.16 0.012 275)" stroke-width="5" stroke-linejoin="round"/><path d="M75.3 57.5L84.9 38.5L110.8 37.0L96.6 58.6Z" fill="url(#${u}-c1)"/><path d="M75.3 57.5L84.9 38.5L110.8 37.0L96.6 58.6Z" fill="url(#${u}-lit)"/><path d="M75.3 57.5L84.9 38.5L110.8 37.0L96.6 58.6Z" fill="none" stroke="url(#${u}-rim)" stroke-width="1.5" stroke-linejoin="round"/></g><g class="petal"><path d="M75.3 70.5L96.6 69.4L110.8 91.0L84.9 89.5Z" fill="none" stroke="oklch(0.16 0.012 275)" stroke-width="5" stroke-linejoin="round"/><path d="M75.3 70.5L96.6 69.4L110.8 91.0L84.9 89.5Z" fill="url(#${u}-c2)"/><path d="M75.3 70.5L96.6 69.4L110.8 91.0L84.9 89.5Z" fill="url(#${u}-lit)"/><path d="M75.3 70.5L96.6 69.4L110.8 91.0L84.9 89.5Z" fill="none" stroke="url(#${u}-rim)" stroke-width="1.5" stroke-linejoin="round"/></g><g class="petal"><path d="M64.0 77.0L75.6 94.9L64.0 118.0L52.4 94.9Z" fill="none" stroke="oklch(0.16 0.012 275)" stroke-width="5" stroke-linejoin="round"/><path d="M64.0 77.0L75.6 94.9L64.0 118.0L52.4 94.9Z" fill="url(#${u}-c0)"/><path d="M64.0 77.0L75.6 94.9L64.0 118.0L52.4 94.9Z" fill="url(#${u}-lit)"/><path d="M64.0 77.0L75.6 94.9L64.0 118.0L52.4 94.9Z" fill="none" stroke="url(#${u}-rim)" stroke-width="1.5" stroke-linejoin="round"/></g><g class="petal"><path d="M52.7 70.5L43.1 89.5L17.2 91.0L31.4 69.4Z" fill="none" stroke="oklch(0.16 0.012 275)" stroke-width="5" stroke-linejoin="round"/><path d="M52.7 70.5L43.1 89.5L17.2 91.0L31.4 69.4Z" fill="url(#${u}-c1)"/><path d="M52.7 70.5L43.1 89.5L17.2 91.0L31.4 69.4Z" fill="url(#${u}-lit)"/><path d="M52.7 70.5L43.1 89.5L17.2 91.0L31.4 69.4Z" fill="none" stroke="url(#${u}-rim)" stroke-width="1.5" stroke-linejoin="round"/></g><g class="petal"><path d="M52.7 57.5L31.4 58.6L17.2 37.0L43.1 38.5Z" fill="none" stroke="oklch(0.16 0.012 275)" stroke-width="5" stroke-linejoin="round"/><path d="M52.7 57.5L31.4 58.6L17.2 37.0L43.1 38.5Z" fill="url(#${u}-c2)"/><path d="M52.7 57.5L31.4 58.6L17.2 37.0L43.1 38.5Z" fill="url(#${u}-lit)"/><path d="M52.7 57.5L31.4 58.6L17.2 37.0L43.1 38.5Z" fill="none" stroke="url(#${u}-rim)" stroke-width="1.5" stroke-linejoin="round"/></g><path d="M88.0 22.4L81.6 25.9L82.0 32.8L88.2 29.7Z" fill="oklch(0.98 0.06 95)"/><path d="M112.0 64.0L105.8 60.2L100.0 64.0L105.8 67.8Z" fill="oklch(0.98 0.06 95)"/><path d="M88.0 105.6L88.2 98.3L82.0 95.2L81.6 102.1Z" fill="oklch(0.98 0.06 95)"/><path d="M40.0 105.6L46.4 102.1L46.0 95.2L39.8 98.3Z" fill="oklch(0.98 0.06 95)"/><path d="M16.0 64.0L22.2 67.8L28.0 64.0L22.2 60.2Z" fill="oklch(0.98 0.06 95)"/><path d="M40.0 22.4L39.8 29.7L46.0 32.8L46.4 25.9Z" fill="oklch(0.98 0.06 95)"/><path d="M64.0 56.0L70.9 60.0L70.9 68.0L64.0 72.0L57.1 68.0L57.1 60.0Z" fill="oklch(0.96 0.04 95)" stroke="oklch(0.16 0.012 275)" stroke-width="3" stroke-linejoin="round"/></g>`;
      const all = svg.getElementById(`${u}-all`), petals = svg.querySelectorAll('.petal');
      return hoverLoop(
        () => gsap.timeline()
          .to(all, { rotation: '+=360', svgOrigin: '64 64', duration: 12, ease: 'none', repeat: -1 }, 0)
          .to(petals, { scale: 0.84, svgOrigin: '64 64', duration: 1, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0),
        () => {
          gsap.to(all, { rotation: Math.round(gsap.getProperty(all, 'rotation') / 360) * 360, svgOrigin: '64 64', duration: 0.4, ease: 'power2.out' });
          gsap.to(petals, { scale: 1, svgOrigin: '64 64', duration: 0.3 });
        });
    },
  });

  // The glass chips: kind, radius, angle, size, turn, colour index.
  const KCOL = [
    ['oklch(0.76 0.17 55)', 'oklch(0.58 0.19 38)'],
    ['oklch(0.76 0.12 190)', 'oklch(0.54 0.11 205)'],
    ['oklch(0.56 0.2 265)', 'oklch(0.4 0.18 268)'],
    ['oklch(0.65 0.25 348)', 'oklch(0.47 0.22 340)'],
    ['oklch(0.89 0.19 124)', 'oklch(0.66 0.18 132)'],
    ['oklch(0.2 0.012 275)', 'oklch(0.42 0.02 275)'],
  ];
  const leaf = (cx, cy, len, wid, rot) => {
    const [ux, uy] = [Math.cos(rot * RAD), Math.sin(rot * RAD)];
    const a = [cx - ux * len / 2, cy - uy * len / 2], b = [cx + ux * len / 2, cy + uy * len / 2];
    return `M${f(a[0])} ${f(a[1])}Q${f(cx - uy * wid)} ${f(cy + ux * wid)} ${f(b[0])} ${f(b[1])}Q${f(cx + uy * wid)} ${f(cy - ux * wid)} ${f(a[0])} ${f(a[1])}Z`;
  };
  const chipPath = ([kind, r, a, s, rot]) => {
    const [x, y] = P(r, a);
    if (kind === 'nut') return hex(x, y, s, rot) + ring(x, y, s * 0.42);
    if (kind === 'hex') return hex(x, y, s, rot);
    if (kind === 'leaf') return leaf(x, y, s * 2.4, s * 0.7, a + rot);
    if (kind === 'kite') return poly([P(s * 1.3, a + rot, x, y), P(s * 0.55, a + rot + 90, x, y), P(s * 0.9, a + rot + 180, x, y), P(s * 0.55, a + rot - 90, x, y)]);
    return ring(x, y, s);
  };

  // A: the eyepiece; the pointer stirs the glass in the mirror wedge.
  {
    const R = 48;
    const CHIPS = [
      ['nut', 30, 30, 8.5, 0, 5], ['disc', 14, 10, 7.5, 0, 0], ['hex', 39, 2, 7, 30, 1], ['disc', 25, 59, 5.5, 0, 3],
      ['leaf', 20, 38, 5.5, 0, 4], ['hex', 40, 48, 6, 0, 2], ['kite', 6, 30, 4, 0, 1],
    ];
    const wedge = `M64 64L${P(70, -1).map(f).join(' ')}A70 70 0 0 1 ${P(70, 61).map(f).join(' ')}Z`;
    const mirror = (src, half) => `
      <g id="${half}"><use href="#${src}"/><use href="#${src}" transform="matrix(1 0 0 -1 0 128)"/></g>
      <use href="#${half}" transform="rotate(120 64 64)"/><use href="#${half}" transform="rotate(240 64 64)"/>`;
    DIRS.push({
      toy: 'kaleido', l: 'A',
      art(svg, u) {
        svg.innerHTML = `
          <clipPath id="${u}w"><path d="${wedge}"/></clipPath>
          <clipPath id="${u}a"><circle cx="64" cy="64" r="${R}"/></clipPath>
          <rect x="9" y="9" width="110" height="110" rx="16" fill="url(#k-plate)"/>
          <rect x="9" y="9" width="110" height="110" rx="16" fill="url(#lit)"/>
          <rect x="9" y="9" width="110" height="110" rx="16" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
          <circle cx="64" cy="64" r="${R + 3}" fill="oklch(0.1 0.015 280)"/>
          <circle cx="64" cy="64" r="${R}" fill="url(#k-glass)"/>
          <g clip-path="url(#${u}a)">
            <g id="${u}s" clip-path="url(#${u}w)">${CHIPS.map(c => `<g class="chip"><path d="${chipPath(c)}" fill-rule="evenodd" style="fill: ${KCOL[c[5]][0]}; stroke: ${KCOL[c[5]][1]}" stroke-width="1.2" stroke-linejoin="round"/><path d="${chipPath(c)}" fill-rule="evenodd" fill="url(#lit)"/></g>`).join('')}</g>
            ${mirror(`${u}s`, `${u}h`)}
          </g>
          <circle cx="64" cy="64" r="${R}" fill="url(#k-vig)"/>
          <circle cx="64" cy="64" r="${R + 3}" fill="none" stroke="url(#rim)" stroke-width="1.2" transform="rotate(180 64 64)"/>`;
        const C = [...svg.querySelectorAll('.chip')].map((g, i) => ({ g, home: P(CHIPS[i][1], CHIPS[i][2]) }));
        // Fold the pointer into the source wedge, as the mirrors do.
        const fold = ([x, y]) => {
          let a = Math.atan2(y - 64, x - 64) / RAD;
          a = Math.abs((((a + 60) % 120) + 120) % 120 - 60);
          return P(Math.hypot(x - 64, y - 64), a);
        };
        const stir = p => {
          const q = fold(p);
          C.forEach(c => {
            const dx = c.home[0] - q[0], dy = c.home[1] - q[1], d = Math.hypot(dx, dy) || 1, k = Math.max(0, 22 - d) * 0.75;
            gsap.to(c.g, { x: (dx / d) * k, y: (dy / d) * k, rotation: k * 3, svgOrigin: c.home.join(' '), duration: k ? 0.35 : 0.9, ease: k ? 'power2.out' : 'power2.inOut', overwrite: true });
          });
        };
        return {
          enter: p => stir(p || [86, 70]), move: p => p && stir(p),
          leave: () => C.forEach(c => gsap.to(c.g, { x: 0, y: 0, rotation: 0, svgOrigin: c.home.join(' '), duration: 1.1, ease: 'elastic.out(1, 0.5)', overwrite: true, onComplete: () => gsap.set(c.g, { clearProps: 'transform' }) })),
        };
      },
      emblem: emb(`
        <defs>
          <clipPath id="w"><path d="${wedge}"/></clipPath>
          <g id="s" clip-path="url(#w)">${CHIPS.map(c => `<path d="${chipPath(c)}" fill-rule="evenodd" fill="#fff"/>`).join('')}</g>
        </defs>
        <rect x="9" y="9" width="110" height="110" rx="16" fill="#fff"/>
        <circle cx="64" cy="64" r="${R + 1}" fill="#000"/>
        <g clip-path="url(#a)">${mirror('s', 'h')}</g>
        <clipPath id="a"><circle cx="64" cy="64" r="${R - 2}"/></clipPath>
      `),
    });
  }

  // B: a slab with the rosette cut through; two rings ratchet apart.
  {
    const kite = (a, rO, rM, rI, w) => poly([P(rO, a), P(rM, a + w), P(rI, a), P(rM, a - w)]);
    const OUT = Array.from({ length: 12 }, (_, k) => kite(-90 + 30 * k, 51, 41, 31, 6.5)).join('');

  // C: three mirrors in one line weight; a flag repeats in every cell.
  {
    const s = 28, h = (s * Math.sqrt(3)) / 2;
    const V = (i, j) => [64 + i * s + (j * s) / 2, 64 - j * h];
    // Each lattice corner has one of three classes; mirrors keep the class.
    const cls = (i, j) => (((i - j) % 3) + 3) % 3;
    const CELLS = [];
    for (let j = -4; j <= 4; j++) for (let i = -7; i <= 7; i++) {
      for (const [tri, up] of [[[[i, j], [i + 1, j], [i, j + 1]], true], [[[i + 1, j], [i, j + 1], [i + 1, j + 1]], false]]) {
        const T = [];
        tri.forEach(([a, b]) => (T[cls(a, b)] = V(a, b)));
        const cx = (T[0][0] + T[1][0] + T[2][0]) / 3, cy = (T[0][1] + T[1][1] + T[2][1]) / 3;
        if (cx > 0 && cx < 128 && cy > 0 && cy < 128) CELLS.push({ T, up });
      }
    }
    const F = CELLS.find(c => c.up && c.T[0][0] === 64 && c.T[0][1] === 64).T;
    const bary = (T, [x, y]) => {
      const [a, b, c] = T, d = (b[1] - c[1]) * (a[0] - c[0]) + (c[0] - b[0]) * (a[1] - c[1]);
      const l0 = ((b[1] - c[1]) * (x - c[0]) + (c[0] - b[0]) * (y - c[1])) / d, l1 = ((c[1] - a[1]) * (x - c[0]) + (a[0] - c[0]) * (y - c[1])) / d;
      return [l0, l1, 1 - l0 - l1];
    };
    const at = (T, w) => [w[0] * T[0][0] + w[1] * T[1][0] + w[2] * T[2][0], w[0] * T[0][1] + w[1] * T[1][1] + w[2] * T[2][1]];
    const FLAG = [[-3.6, -1.2], [-0.8, 3], [3.8, -3.4]];
    const flags = w => {
      const c = at(F, w), pts = FLAG.map(([dx, dy]) => bary(F, [c[0] + dx, c[1] + dy]));
      return CELLS.map(({ T, up }) => ({ up, d: 'M' + pts.map(b => at(T, b).map(f).join(' ')).join('L') }));
    };
    const LAT = CELLS.map(({ T }) => poly(T)).join('');
    const REST = [0.56, 0.27, 0.17];
    const LINE = 'oklch(0.5 0.05 285)';
    DIRS.push({
      toy: 'kaleido', l: 'C',
      art(svg, u) {

          <clipPath id="${u}c"><rect x="10" y="10" width="108" height="108" rx="12"/></clipPath>

            <path d="${LAT}" stroke="${LINE}"/>
            ${CELLS.map(c => `<path class="fl" style="stroke: ${c.up ? 'oklch(0.86 0.15 78)' : 'oklch(0.72 0.21 350)'}"/>`).join('')}
          </g>
          <rect x="10" y="10" width="108" height="108" rx="12" fill="none" stroke="oklch(0.66 0.05 285)" stroke-width="2"/>`;
        const Pth = [...svg.querySelectorAll('.fl')];

        draw();
        // The pointer cell gives the flag its place in every cell.
        const aim = p => {
          if (!p) return;
          const cell = CELLS.find(({ T }) => bary(T, p).every(v => v > -0.02));

        };

          enter: p => (p ? aim(p) : gsap.to(st, { a: 0.22, b: 0.56, c: 0.22, duration: 0.5, overwrite: true, onUpdate: draw })), move: aim,

  // D: an isometric mirror cube; one rosette turns on all three faces.
  {

          <defs><g id="${u}p">${rosette({ glass: 'oklch(0.95 0.035 85)', disc: k => DC[k % 3], tri: 'oklch(0.56 0.2 265)' }, 'oklch(0.2 0.012 275)')}</g></defs>

          <path d="${poly(OUTL)}" fill="none" stroke="url(#rim)" stroke-width="1.5" stroke-linejoin="round"/>`;

        const st = { a: 0 };
        const draw = () => rot.setAttribute('transform', `rotate(${f(st.a)} ${Q} ${Q})`);
        const aim = p => p && gsap.to(st, { a: clamp((p[0] - 64) * 1.4, -75, 75), duration: 0.45, ease: 'power3.out', overwrite: true, onUpdate: draw });
        return { enter: p => aim(p || [94, 64]), move: aim, leave: () => gsap.to(st, { a: 0, duration: 1.2, ease: 'elastic.out(1, 0.4)', overwrite: true, onUpdate: draw }) };
      },
      emblem: emb(`
        <defs><g id="p">${rosette({ glass: '#000', disc: () => '#fff', tri: '#fff' }, '#fff')}</g></defs>

        <g transform="${M.right}"><use href="#p"/></g>
        <path d="M${TOP[2].map(f).join(' ')}L${TOP[1].map(f).join(' ')}M${TOP[2].map(f).join(' ')}L${TOP[3].map(f).join(' ')}M${TOP[2].map(f).join(' ')}L${RIGHT[3].map(f).join(' ')}" fill="none" stroke="#000" stroke-width="3"/>

  }

            <rect x="19" y="29" width="90" height="70" rx="15" stroke="oklch(0.68 0.12 35)"/>
            <path class="stamp" d="${STAMP}" stroke="oklch(0.68 0.12 35)"/>
            ${CUTS.map(([x1, y1, x2, y2]) => `<line class="cut" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="oklch(0.96 0.02 90)" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="1" stroke-linecap="butt"/>`).join('')}
          </g>`;
        const cuts = [...svg.querySelectorAll('.cut')], stamp = svg.querySelector('.stamp');
        const tl = gsap.timeline({ paused: true })
          .to(stamp, { opacity: 0, duration: 0.25 }, 0)
          .to(cuts, { strokeDashoffset: 0, duration: 0.22, ease: 'power1.in', stagger: 0.17 }, 0.05);
        return { enter() { tl.timeScale(1).play(); }, move() {}, leave() { tl.timeScale(2.2).reverse(); } };
      },
      emblem: emb(`
        <g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round">
          <rect x="12" y="22" width="104" height="84" rx="22"/>
          <rect x="19" y="29" width="90" height="70" rx="15"/>
          ${CUTS.map(([x1, y1, x2, y2]) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`).join('')}
        </g>
      `),
    });
  }

  // D: an isometric block of layered soap, diced; hover explodes the dice.
  {
    const S = 24;
    const P3 = (x, y, z) => [64 + (x - y) * 0.866 * S, 64 + (x + y) * 0.5 * S - z * S];
    const CUBES = [];
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) for (let k = 0; k < 2; k++) CUBES.push([i, j, k]);
    CUBES.sort((a, b) => a[0] + a[1] + a[2] - (b[0] + b[1] + b[2]));
    const faces = ([i, j, k], e) => {
      const x = i + (i - 0.5) * e, y = j + (j - 0.5) * e, z = k + (k - 0.5) * e;
      return {
        top: [P3(x, y, z + 1), P3(x + 1, y, z + 1), P3(x + 1, y + 1, z + 1), P3(x, y + 1, z + 1)],
        left: [P3(x, y + 1, z + 1), P3(x + 1, y + 1, z + 1), P3(x + 1, y + 1, z), P3(x, y + 1, z)],
        right: [P3(x + 1, y + 1, z + 1), P3(x + 1, y, z + 1), P3(x + 1, y, z), P3(x + 1, y + 1, z)],
        // The cream layer: a band across the upper side faces.
        bl: [P3(x, y + 1, z + 1), P3(x + 1, y + 1, z + 1), P3(x + 1, y + 1, z + 0.62), P3(x, y + 1, z + 0.62)],
        br: [P3(x + 1, y + 1, z + 1), P3(x + 1, y, z + 1), P3(x + 1, y, z + 0.62), P3(x + 1, y + 1, z + 0.62)],
      };
    };
    const SIDE = { 1: ['oklch(0.7 0.19 14)', 'oklch(0.56 0.19 12)'], 0: ['oklch(0.54 0.21 302)', 'oklch(0.42 0.19 300)'] };
    const CREAM = ['oklch(0.95 0.03 95)', 'oklch(0.87 0.04 85)', 'oklch(0.76 0.05 75)'];
    const SEAM = 'oklch(0.22 0.04 300 / 0.55)';
    DIRS.push({
      toy: 'soap', l: 'D',
      art(svg) {
        svg.innerHTML = CUBES.map(([, , k]) => `<g class="cb" stroke="${SEAM}" stroke-width="0.9" stroke-linejoin="round">
            <path style="fill: ${CREAM[0]}"/><path style="fill: ${SIDE[k][0]}"/><path style="fill: ${SIDE[k][1]}"/>
            ${k ? `<path style="fill: ${CREAM[1]}" stroke="none"/><path style="fill: ${CREAM[2]}" stroke="none"/>` : ''}
            <path fill="url(#lit)" stroke="none"/></g>`).join('');
        const G = [...svg.querySelectorAll('.cb')].map(g => [...g.querySelectorAll('path')]);
        const st = { e: 0 };
        const draw = () => CUBES.forEach((c, n) => {
          const F = faces(c, st.e), p = G[n];
          p[0].setAttribute('d', poly(F.top)); p[1].setAttribute('d', poly(F.left)); p[2].setAttribute('d', poly(F.right));
          if (c[2]) { p[3].setAttribute('d', poly(F.bl)); p[4].setAttribute('d', poly(F.br)); }
          p[p.length - 1].setAttribute('d', poly(F.top));
        });
        draw();
        return {
          enter: () => gsap.to(st, { e: 0.3, duration: 0.6, ease: 'back.out(1.8)', overwrite: true, onUpdate: draw }), move() {},
          leave: () => gsap.to(st, { e: 0, duration: 0.5, ease: 'power2.inOut', overwrite: true, onUpdate: draw }),
        };
      },
      emblem: emb(`
        ${CUBES.map(c => { const F = faces(c, 0.16); return [F.top, F.left, F.right].map(q => `<path d="${poly(q)}" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>`).join(''); }).join('\n')}
      `),
    });
  }

  // E: a bold soap cube with one corner sliced; the slice slides away.
  {
    const A = [52, 12], B = [116, 66], L = Math.hypot(B[0] - A[0], B[1] - A[1]);
    const DIR = [(B[0] - A[0]) / L, (B[1] - A[1]) / L], N = [DIR[1], -DIR[0]];
    const ext = t => [A[0] + DIR[0] * t, A[1] + DIR[1] * t];
    const [E0, E1] = [ext(-40), ext(L + 40)];
    const MAIN = `M-20 -20L${E0.map(f).join(' ')}L${E1.map(f).join(' ')}L150 150H-20Z`;
    const PIECE = `M${E0.map(f).join(' ')}L150 -20L150 ${f(E1[1])}L${E1.map(f).join(' ')}Z`;
    const KERF = `M${ext(-6).map(f).join(' ')}L${ext(L + 6).map(f).join(' ')}`;
    const TICKS = 'M12 47.7H22M12 82.3H22M47.7 116V106M82.3 116V106';
    const SQ = '<rect x="12" y="12" width="104" height="104" rx="20"/>';
    DIRS.push({
      toy: 'soap', l: 'E',
      art(svg, u) {
        svg.innerHTML = `
          <clipPath id="${u}m"><path d="${MAIN}"/></clipPath>
          <clipPath id="${u}p"><path d="${PIECE}"/></clipPath>
          <g clip-path="url(#${u}m)" fill="url(#s-coral)">${SQ}</g>
          <g class="pc"><g clip-path="url(#${u}p)" fill="oklch(0.88 0.1 50)">${SQ}</g></g>
          <path d="${KERF}" fill="none" style="stroke: ${BG}" stroke-width="3.2" stroke-linecap="square"/>
          <path d="${TICKS}" fill="none" style="stroke: ${BG}" stroke-width="3.2"/>`;
        const pc = svg.querySelector('.pc');
        const st = { d: 0 };
        // The slice glides along the cut and lifts off it a little.
        const draw = () => pc.setAttribute('transform', `translate(${f(DIR[0] * st.d + N[0] * Math.min(st.d, 2))} ${f(DIR[1] * st.d + N[1] * Math.min(st.d, 2))})`);
        const aim = p => p && gsap.to(st, { d: clamp(7 + ((p[0] - 64) * DIR[0] + (p[1] - 64) * DIR[1]) * 0.18, 2, 16), duration: 0.4, ease: 'power3.out', overwrite: true, onUpdate: draw });
        return { enter: p => aim(p || [96, 96]), move: aim, leave: () => gsap.to(st, { d: 0, duration: 1, ease: 'elastic.out(1, 0.45)', overwrite: true, onUpdate: draw }) };
      },
      emblem: emb(`
        <rect x="12" y="12" width="104" height="104" rx="20" fill="#fff"/>
        <path d="${KERF}" fill="none" stroke="#000" stroke-width="3.8" stroke-linecap="square"/>
        <path d="${TICKS}" fill="none" stroke="#000" stroke-width="3.8"/>
      `),
    });
  }

  /* ================= Gallery ================= */

  const NAMES = { kaleido: 'Kaleidoscope', soap: 'Soap cutting' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = svg => {
    const b = svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      if (D.emblem) window.EMBLEMS[file] = D.emblem;
      const url = D.emblemUrl || `spike/emblems/${file}.svg`;
      const label = RUB[D.l] ? `<b>${D.l}</b><span>· ${RUB[D.l]}</span>` : `<b>${D.l}</b>`;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${label}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        <div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg);
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
