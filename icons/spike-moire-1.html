<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Moire veils 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Moire veils 1</h1>
<p class="lede">Moire veils, round 1. A: two sheer veils on a rod, backlit; slide the front veil with the pointer and the bands race. D: the veils are stretched over a lightbox block.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  const TAU = Math.PI * 2;
  // The toy's tokens: an amber backlit veil, a pale front veil, a bronze rod.
  const ROD = [[0, 'oklch(0.7 0.07 70)'], [1, 'oklch(0.34 0.05 50)']];
  const BACK = [[0, 'oklch(0.46 0.12 28)'], [0.42, 'oklch(0.76 0.14 60)'], [1, 'oklch(0.52 0.14 42)']];
  const FRONT = [[0, 'oklch(0.95 0.03 82)', 0.5], [1, 'oklch(0.86 0.05 70)', 0.42]];
  const SUN = [[0, 'oklch(0.995 0.04 92)', 1], [0.16, 'oklch(0.96 0.1 85)', 0.85], [0.5, 'oklch(0.86 0.14 72)', 0.35], [1, 'oklch(0.8 0.15 65)', 0]];
  // The bands brighten toward the sun.
  const BANDG = [[0, 'oklch(0.995 0.05 92)', 1], [0.5, 'oklch(0.93 0.1 82)', 0.85], [1, 'oklch(0.82 0.13 68)', 0.6]];
  const BAND = 'oklch(0.97 0.08 86)', WASH = 'oklch(0.3 0.08 32)';
  // The pleat period and the band spacing, in icon units.
  const PL = 16, SP = 11;
  // A pleated hem from x1 back to x0 at height y.
  const hemPts = (x0, x1, y, ph) => {
    const pts = [];
    for (let x = x1; x >= x0 - 0.01; x -= 2) pts.push([x, y + 2.4 * Math.sin((x - ph) * TAU / PL)]);
    return pts;
  };
  const panelD = (x0, x1, yt, yb, ph) => poly([[x0, yt], [x1, yt], ...hemPts(x0, x1, yb, ph)]);
  // The moire: level lines of one phase, bent by the pleats and pulled at px.
  const bandsD = (x0, x1, y0, y1, ph, px, pull) => {
    let d = '';
    const fr = ((ph % 1) + 1) % 1;
    for (let n = -2; n < (y1 - y0) / SP + 2; n++) {
      const top = [], bot = [];
      for (let x = x0; x <= x1 + 0.01; x += 3) {
        const yc = y0 + (n + fr) * SP + (x - 64) * 0.1 + 1.6 * Math.sin(x * TAU / PL + 1) + 4 * Math.exp(-((x - 80) ** 2) / 260) - pull * Math.exp(-((x - px) ** 2) / 160);
        const w = SP * (0.2 + 0.1 * Math.sin(x * 0.09 + n * 1.3));
        top.push([x, yc - w]);
        bot.push([x, yc + w]);
      }
      d += poly(top.concat(bot.reverse()));
    }
    return d;
  };
  // The hand: the front veil slides after the pointer; the bands race far faster.
  const slider = (draw, rest = 0, range = 18) => {
    const st = { s: rest, v: 0, to: rest, ph: 0.35, pull: 0, px: 64, live: false };
    const loop = clock(() => {
      st.to = st.live ? st.to : rest;
      st.v = st.v * 0.78 + (st.to - st.s) * 0.07;
      st.s += st.v;
      st.ph += st.v * 0.5 + (st.live ? 0.006 : 0);
      st.pull += ((st.live ? 3 + Math.min(7, Math.abs(st.v) * 6) : 0) - st.pull) * 0.12;
      draw(st);
      if (!st.live && Math.abs(st.v) < 0.005 && Math.abs(st.s - rest) < 0.03 && st.pull < 0.03) { st.s = rest; st.v = 0; st.pull = 0; draw(st); loop.stop(); }
    });
    draw(st);
    return {
      enter(p) { st.live = true; if (p) { st.px = p[0]; st.to = clamp((p[0] - 64) * 0.6, -range, range); } loop.start(); },
      move(p) { if (!p) return; st.px = p[0]; st.to = clamp((p[0] - 64) * 0.6, -range, range); },
      leave() { st.live = false; loop.start(); },
    };
  };

  const DIRS = [];

  /* ================= Current ================= */

  // Moire veils is not on the menu yet; it has no menu icon.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NOT ON MENU</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // Two sheer veils on a bronze rod, lit from behind by a low sun.
  // The front veil overlaps the rear one; the overlap carries the bands.
  const A_TOP = 27, A_BOT = 108, A_R0 = 22, A_R1 = 106, A_F1 = 106, A_F0 = 54;
  const A_ROD = 'M16 21.5Q16 19 18.5 19H109.5Q112 19 112 21.5V24.5Q112 27 109.5 27H18.5Q16 27 16 24.5Z';
  const rearD = panelD(A_R0, A_R1, A_TOP, A_BOT, 3);
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [14, 17, 100, 96],
    idea: 'Two sheer veils hang on a bronze rod, lit from behind by a low sun. The pale front veil overlaps the amber rear veil, and the overlap carries broad bands of light. The pointer slides the front veil: the bands race up and down far faster than the cloth, and bulge round the pointer. Leave, and the veil swings back and the bands settle.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 5)}${blur(`${u}s`, 1.1)}
          ${lg(`${u}back`, BACK)}${lg(`${u}front`, FRONT)}${lg(`${u}rod`, ROD)}
          ${rg(`${u}sun`, SUN)}<radialGradient id="${u}bg" gradientUnits="userSpaceOnUse" cx="80" cy="54" r="58">${BANDG.map(([o, c, op]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>
          <linearGradient id="${u}pl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${PL}" y2="0" spreadMethod="repeat"><stop offset="0" style="stop-color: #000; stop-opacity: 0.34"/><stop offset="0.45" style="stop-color: #fff; stop-opacity: 0.2"/><stop offset="0.6" style="stop-color: #fff; stop-opacity: 0.12"/><stop offset="1" style="stop-color: #000; stop-opacity: 0.34"/></linearGradient>
          <linearGradient id="${u}plf" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${PL}" y2="0" spreadMethod="repeat"><stop offset="0" style="stop-color: #000; stop-opacity: 0.16"/><stop offset="0.5" style="stop-color: #fff; stop-opacity: 0.2"/><stop offset="1" style="stop-color: #000; stop-opacity: 0.16"/></linearGradient>
          <clipPath id="${u}rear"><path d="${rearD}"/></clipPath><clipPath id="${u}fr"><path class="frc"/></clipPath></defs>
        <ellipse cx="62" cy="66" rx="44" ry="40" fill="oklch(0.7 0.15 55)" opacity="0.32" filter="url(#${u}b)"/>
        <path d="${rearD}" fill="url(#${u}back)"/>
        <path d="${rearD}" fill="url(#${u}pl)"/>
        <g clip-path="url(#${u}rear)"><circle cx="80" cy="54" r="34" fill="url(#${u}sun)"/></g>
        <path d="${rearD}" fill="url(#${u}lit)"/>
        <path d="${rearD}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
        <path class="fv" fill="url(#${u}front)"/>
        <path class="fp" fill="url(#${u}plf)"/>
        <g clip-path="url(#${u}rear)"><g clip-path="url(#${u}fr)">
          <rect x="${A_R0}" y="${A_TOP}" width="${A_R1 - A_R0}" height="${A_BOT - A_TOP + 4}" fill="${WASH}" opacity="0.42"/>
          <path class="bd" fill="url(#${u}bg)" filter="url(#${u}s)"/>
        </g></g>
        <g clip-path="url(#${u}rear)"><circle cx="80" cy="54" r="7" fill="oklch(0.99 0.04 92)" opacity="0.9" filter="url(#${u}s)"/></g>
        <path class="fl" fill="url(#${u}lit)"/>
        <path class="fr" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
        ${body(A_ROD, u, 'rod')}
        <circle cx="18" cy="23" r="4.2" fill="url(#${u}rod)"/><circle cx="110" cy="23" r="4.2" fill="url(#${u}rod)"/>`;
      const q = s => svg.querySelectorAll(s);
      const fronts = [...q('.fv'), ...q('.fp'), ...q('.fl'), ...q('.fr'), ...q('.frc')];
      const bd = svg.querySelector('.bd'), fp = svg.querySelector('.fp');
      return slider(st => {
        const x0 = A_F0 + st.s, d = panelD(x0, A_F1, A_TOP, A_BOT + 1, 3 + st.s);
        fronts.forEach(e => e.setAttribute('d', d));
        fp.setAttribute('transform', `translate(${f(st.s)} 0)`);
        fp.setAttribute('d', panelD(x0 - st.s, A_F1 - st.s, A_TOP, A_BOT + 1, 3));
        bd.setAttribute('d', bandsD(A_R0, A_R1, A_TOP, A_BOT, st.ph, st.px, st.pull));
      });
    },
    emblem: `${EMB_HEAD}<path d="${A_ROD}" fill="#fff"/><path d="${rearD}" fill="#fff"/><path d="${panelD(A_F0, A_F1, A_TOP, A_BOT + 1, 3)}" fill="#fff"/><clipPath id="ec"><path d="${panelD(A_F0, A_R1, A_TOP, A_BOT, 3)}"/></clipPath><g clip-path="url(#ec)"><rect x="${A_F0}" y="${A_TOP}" width="${A_R1 - A_F0}" height="${A_BOT - A_TOP + 4}" fill="#000" opacity="0.6"/><path d="${bandsD(A_F0, A_R1, A_TOP, A_BOT, 0.35, 64, 0)}" fill="#fff"/></g></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The block is a lightbox: amber light inside, two veils stretched over its faces.
  // The front veil slides along the faces; the bands race where the veils overlap.
  const CY = 40, HALF = 26, T = 46;
  const iso = (gx, gy, h = 0) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5 + T - h];
  const top4 = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]];
  const at = h => top4.map(([x, y]) => iso(x, y, h));
  const [Nt, Et, St, Wt] = at(T), [Nb, Eb, Sb, Wb] = at(0);
  const CW = [-HALF, HALF], CS = [HALF, HALF], CE = [HALF, -HALF];
  // A point on a side face: u runs along the bottom edge from a to b, h is height.
  const onFace = (a, b, uu, h) => iso(lerp(a[0], b[0], uu), lerp(a[1], b[1], uu), h);
  const faceD = (a, b, u0, u1, h0 = 0, h1 = T) => poly([onFace(a, b, u0, h1), onFace(a, b, u1, h1), onFace(a, b, u1, h0), onFace(a, b, u0, h0)]);
  // The bands on a face between u0 and u1: level lines of height, bent and pulled.
  const faceBands = (a, b, u0, u1, ph, pu, pull) => {
    let d = '';
    const sp = T / 4.2, fr = ((ph % 1) + 1) % 1;
    for (let n = -1; n < 6; n++) {
      const top = [], bot = [];
      for (let k = 0; k <= 10; k++) {
        const uu = lerp(u0, u1, k / 10);
        const hc = (n + fr) * sp + 3 * Math.sin(uu * 9 + 1) + pull * Math.exp(-((uu - pu) ** 2) / 0.03);
        top.push(onFace(a, b, uu, clamp(hc + sp * 0.26, 0, T)));
        bot.push(onFace(a, b, uu, clamp(hc - sp * 0.26, 0, T)));
      }
      d += poly(top.concat(bot.reverse()));
    }
    return d;
  };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [18, 14, 92, 99],
    idea: 'The block is a lightbox glowing amber from inside, a rim on its top edges. Two sheer veils are stretched over its side faces; the front veil covers part of each face, and where the veils overlap, broad bands of light lie across the face. The pointer slides the front veil along: the bands race and bulge round the pointer, then settle when it leaves.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 6)}${blur(`${u}s`, 0.7)}
          ${lg(`${u}back`, BACK)}${lg(`${u}top`, [[0, 'oklch(0.9 0.09 82)'], [1, 'oklch(0.74 0.13 62)']], 'x1="0" y1="0" x2="1" y2="1"')}
          <radialGradient id="${u}dsun" gradientUnits="userSpaceOnUse" cx="${f(onFace(CW, CS, 0.6, T * 0.62)[0])}" cy="${f(onFace(CW, CS, 0.6, T * 0.62)[1])}" r="26"><stop offset="0" style="stop-color: oklch(0.99 0.05 92); stop-opacity: 0.95"/><stop offset="0.3" style="stop-color: oklch(0.92 0.12 80); stop-opacity: 0.5"/><stop offset="1" style="stop-color: oklch(0.85 0.14 70); stop-opacity: 0"/></radialGradient><clipPath id="${u}fw"><path class="cw"/></clipPath><clipPath id="${u}fe"><path class="ce"/></clipPath></defs>
        <ellipse cx="64" cy="88" rx="46" ry="26" fill="oklch(0.7 0.15 55)" opacity="0.28" filter="url(#${u}g)"/>
        <path d="${poly([Eb, Sb, Wb, [Wb[0], Wb[1] + 4], [Sb[0], Sb[1] + 4], [Eb[0], Eb[1] + 4]])}" fill="oklch(0.05 0.01 40)" opacity="0.5" filter="url(#${u}b)"/>
        <path d="${faceD(CW, CS, 0, 1)}" fill="url(#${u}back)"/>
        <path d="${faceD(CS, CE, 0, 1)}" fill="url(#${u}back)"/>
        <path d="${faceD(CS, CE, 0, 1)}" fill="#000" opacity="0.3"/>
        <path d="${faceD(CW, CS, 0, 1)}" fill="url(#${u}dsun)"/>
        <path class="vw" fill="oklch(0.95 0.03 82)" opacity="0.32"/>
        <path class="ve" fill="oklch(0.95 0.03 82)" opacity="0.22"/>
        <g clip-path="url(#${u}fw)"><path class="bw" fill="oklch(0.97 0.08 86)" opacity="0.8" filter="url(#${u}s)"/></g>
        <g clip-path="url(#${u}fe)"><path class="be" fill="oklch(0.92 0.09 80)" opacity="0.55" filter="url(#${u}s)"/></g>
        <path d="${poly([Nt, Et, St, Wt])}" fill="url(#${u}top)"/>
        <path d="${poly([Nt, Et, St, Wt])}" fill="url(#${u}lit)"/>
        <path d="${poly([Wt, St, Sb, Wb])}" fill="url(#${u}lit)" opacity="0.45"/>
        <path d="M${f(Wt[0])} ${f(Wt[1])}L${f(Nt[0])} ${f(Nt[1])}L${f(Et[0])} ${f(Et[1])}" stroke="#fff" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(Wt[0])} ${f(Wt[1])}L${f(St[0])} ${f(St[1])}L${f(Et[0])} ${f(Et[1])}M${f(St[0])} ${f(St[1])}V${f(Sb[1])}" stroke="#fff" stroke-opacity="0.62" stroke-width="2" fill="none" stroke-linejoin="round"/>`;
      const g = s => svg.querySelector(s);
      return slider(st => {
        // The front veil's edge runs along the west face, then round onto the east.
        const e = clamp(0.38 + st.s / 40, 0.05, 0.95);
        const w = faceD(CW, CS, e, 1), ea = faceD(CS, CE, 0, clamp(1 - e * 0.6, 0.2, 1));
        g('.vw').setAttribute('d', w); g('.cw').setAttribute('d', w);
        g('.ve').setAttribute('d', ea); g('.ce').setAttribute('d', ea);
        const pu = clamp((st.px - 30) / 60, 0, 1);
        g('.bw').setAttribute('d', faceBands(CW, CS, 0, 1, st.ph, pu, st.pull));
        g('.be').setAttribute('d', faceBands(CS, CE, 0, 1, st.ph + 0.5, pu, st.pull * 0.6));
      }, 0, 14);
    },
    emblem: `${EMB_HEAD}<path d="${faceD(CW, CS, 0, 1)}" fill="#6a6a6a"/><path d="${faceD(CS, CE, 0, 1)}" fill="#3e3e3e"/><path d="${poly([Nt, Et, St, Wt])}" fill="#fff"/><clipPath id="ed"><path d="${faceD(CW, CS, 0.38, 1)}"/></clipPath><path clip-path="url(#ed)" d="${faceBands(CW, CS, 0, 1, 0.35, 0.5, 0)}" fill="#fff"/></svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Moire veils';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-moire';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `moire-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
