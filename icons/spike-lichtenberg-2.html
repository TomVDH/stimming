<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }

<body>
<h1>Icon spike: Lichtenberg burn 2</h1>
<p class="lede">Lichtenberg burn, round 2, in the icon standard. A: the painted panel stands free; on hover a violet spark crawls out and reaches for the pointer first. D: a plywood block; the burn starts where the pointer lands.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } }, once: tick };
  };

  // The toy's colours: teal paint, birch, charcoal, orange embers, a violet spark.
  const PAINT = ['oklch(0.62 0.085 196)', 'oklch(0.46 0.075 210)'];
  const BIRCH = { top: 'oklch(0.8 0.05 80)', mid: 'oklch(0.62 0.06 70)', dark: 'oklch(0.42 0.05 60)' };
  // Each layer of the groove: a stroke colour and its width from the core width.
  const LAYERS = [
    { k: 'blister', c: 'oklch(0.78 0.05 185)', w: w => w + 4.4, o: 0.3 },
    { k: 'scorch', c: 'oklch(0.4 0.07 52)', w: w => w + 2.2 },
    { k: 'smoulder', c: 'oklch(0.72 0.19 50)', w: w => w + 2.6, glow: 1 },
    { k: 'char', c: 'oklch(0.15 0.02 40)', w: w => w },
    { k: 'ember', c: 'oklch(0.75 0.18 52)', w: w => w + 1.6, glow: 1 },
    { k: 'spark', c: 'oklch(0.64 0.27 305)', w: w => w + 4, glow: 2 },
    { k: 'core', c: 'oklch(0.97 0.04 320)', w: w => w * 0.45 + 0.6 },
  ];
  const MINW = 1.9;

  // A seeded random source, so a seed draws the same tree every time.
  const seeded = seed => { let s = seed; return () => ((s = (s * 16807) % 2147483647) / 2147483647); };

  // A Lichtenberg tree in board units, 0 to 100 on each side.
  // Few thick arms fork twice; each segment knows its distance from the root.
  const growTree = (seed, root, arms = 5) => {
    const rnd = seeded(seed), segs = [];
    const grow = (p, ang, w, depth, d, arm, steps) => {
      for (let i = 0; i < steps; i++) {
        ang += (rnd() - 0.5) * 0.8;
        const L = (depth === 0 ? 8.6 : depth === 1 ? 6.4 : 5) * (0.8 + rnd() * 0.4);
        const q = [p[0] + Math.cos(ang) * L, p[1] + Math.sin(ang) * L];
        segs.push({ a: p, b: q, w, d0: d, d1: d + L, arm });
        d += L; p = q; w = Math.max(MINW, w * 0.86);
        if (depth < 2 && i < steps - 1 && rnd() < (depth ? 0.5 : 0.75)) {
          const side = rnd() < 0.5 ? -1 : 1;
          grow(p, ang + side * (0.55 + rnd() * 0.4), Math.max(MINW, w * 0.72), depth + 1, d, arm, depth ? 2 : 3);
          ang -= side * 0.22;
        }
      }
    };
    const a0 = rnd() * TAU;
    for (let k = 0; k < arms; k++) {
      const ang = a0 + (k / arms) * TAU + (rnd() - 0.5) * 0.5;
      grow(root, ang, 5.2, 0, 0, ang, 4);
    }
    return segs;
  };

  // The burn: layered grooves bucketed by width, so each bucket is one path.
  // map turns board units into tile units; sc gives the local stroke scale.
  const burnKit = (g, u, map, sc) => {
    const groups = LAYERS.map(L => el('g', {
      fill: 'none', stroke: L.c, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      ...(L.o ? { opacity: L.o } : {}), ...(L.glow ? { filter: `url(#${u}g${L.glow})` } : {}),
    }, g));
    const buckets = LAYERS.map(() => new Map());
    const root = el('circle', { r: 3.4, fill: 'oklch(0.15 0.02 40)' }, g);
    const rootHot = el('circle', { r: 4.5, fill: 'oklch(0.9 0.12 320)', filter: `url(#${u}g2)`, opacity: 0 }, g);
    let segs = [], rootPt = [0, 0];
    const kit = {
      groups,
      get segs() { return segs; },
      get root() { return rootPt; },
      // A new tree: tile points, a fixed width key per layer, all burnt.
      set(tree, rootBoard) {
        segs = tree.map(s => {
          const A = map(s.a), B = map(s.b), w = s.w * sc(s.a);
          return { ...s, A, B, keys: LAYERS.map(L => Math.round(L.w(w) * 2) / 2), burn: 1, k: 1 };
        });
        rootPt = map(rootBoard);
        root.setAttribute('cx', f(rootPt[0])); root.setAttribute('cy', f(rootPt[1]));
        rootHot.setAttribute('cx', f(rootPt[0])); rootHot.setAttribute('cy', f(rootPt[1]));
      },
      // Draw one frame: F is the front, H the hot band, V the spark band.
      draw({ F, H = 16, V = 9, heat = 1, smoulder = 0, fresh = false }) {
        const acc = LAYERS.map(() => new Map());
        const add = (li, key, d) => acc[li].set(key, (acc[li].get(key) || '') + d);
        const seg = (s, t0, t1) => {
          const p = [lerp(s.A[0], s.B[0], t0), lerp(s.A[1], s.B[1], t0)], q = [lerp(s.A[0], s.B[0], t1), lerp(s.A[1], s.B[1], t1)];
          return `M${f(p[0])} ${f(p[1])}L${f(q[0])} ${f(q[1])}`;
        };
        for (const s of segs) {
          const e0 = s.d0 * s.k, e1 = s.d1 * s.k, span = e1 - e0;
          // The char only grows; a later bias never takes it back.
          if (fresh) s.burn = 0;
          s.burn = Math.max(s.burn, clamp((F - e0) / span));
          if (s.burn > 0) for (const li of [0, 1, 3]) add(li, s.keys[li], seg(s, 0, s.burn));
          // Hot bands ride behind the front.
          const band = (li, lo, hi) => {
            const t0 = clamp((lo - e0) / span), t1 = clamp((hi - e0) / span);
            if (t1 > t0) add(li, s.keys[li], seg(s, t0, t1));
          };
          // Embers glow round the cold groove; the hot band rides on top.
          if (smoulder > 0 && s.burn > 0) add(2, s.keys[2], seg(s, 0, s.burn));
          band(4, F - H, F);
          band(5, F - V, F);
          band(6, F - V * 0.7, F);
        }
        LAYERS.forEach((L, li) => {
          for (const [key, p] of buckets[li]) if (!acc[li].has(key)) p.setAttribute('d', '');
          for (const [key, d] of acc[li]) {
            let p = buckets[li].get(key);
            if (!p) { p = el('path', { 'stroke-width': key }, groups[li]); buckets[li].set(key, p); }
            p.setAttribute('d', d);
          }
        });
        groups[2].setAttribute('opacity', f(smoulder));
        for (const li of [4, 5, 6]) groups[li].setAttribute('opacity', f(heat));
        rootHot.setAttribute('opacity', f(heat * clamp(1 - F / 60)));
      },
      // The front's end: the longest biased reach.
      end() { return segs.reduce((m, s) => Math.max(m, s.d1 * s.k), 0); },
    };
    return kit;
  };

  // Short spark streaks fly off a point and fade.
  const sparks = (g) => {
    const lines = Array.from({ length: 4 }, () => el('line', { stroke: 'oklch(0.97 0.04 320)', 'stroke-width': 1.7, 'stroke-linecap': 'round', opacity: 0 }, g));
    return (x, y, dir) => lines.forEach(l => {
      const a = dir + (Math.random() - 0.5) * 1.5, v = 9 + Math.random() * 10, s = { t: 0 };
      gsap.to(s, { t: 1, duration: 0.3 + Math.random() * 0.25, ease: 'power2.out', onUpdate() {
        const d = v * s.t, x1 = x + Math.cos(a) * d, y1 = y + Math.sin(a) * d, tl = 3.4 * (1 - s.t);
        gsap.set(l, { attr: { x1: x1 - Math.cos(a) * tl, y1: y1 - Math.sin(a) * tl, x2: x1, y2: y1 }, opacity: 1 - s.t });
      } });
    });
  };

  // The tip nearest a tile point, for sparks at the end of a crawl.
  const nearTip = (segs, p) => segs.reduce((m, s) => {
    const d = Math.hypot(s.B[0] - p[0], s.B[1] - p[1]);
    return d < m.d ? { d, s } : m;
  }, { d: Infinity, s: null }).s;

  // One burn cycle: fresh board, crawl, arc flash, smoulder, then sand.
  // Hooks give each direction its own root and bias.
  const burner = (kit, flash, spit, hooks) => {
    const st = { F: 0, heat: 0, smoulder: 0, fresh: false, live: false, ax: 0, ay: 0, tx: 0, ty: 0, alpha: 1 };
    const draw = () => {
      // The bias eases toward its target, so arms never jump.
      st.ax += (st.tx - st.ax) * 0.18; st.ay += (st.ty - st.ay) * 0.18;
      for (const s of kit.segs) s.k = 1 - 0.34 * (Math.cos(s.arm) * st.ax + Math.sin(s.arm) * st.ay);
      kit.draw(st);
      st.fresh = false;
      kit.groups.forEach(g2 => g2.parentNode.setAttribute('opacity', f(st.alpha)));
    };
    const loop = clock(draw);
    let tl = null;
    const cycle = () => {
      hooks.before?.();
      st.fresh = true; st.F = 0; st.heat = 1; st.smoulder = 0; st.alpha = 1;
      const end = kit.end() + 18;
      tl = gsap.timeline({ onComplete: cycle })
        .to(st, { F: end, duration: 1.7, ease: 'power1.in' })
        .call(() => {
          gsap.fromTo(flash, { attr: { opacity: 0.4 } }, { attr: { opacity: 0 }, duration: 0.5, ease: 'power2.out' });
          const s = nearTip(kit.segs, hooks.aim?.() || kit.root);
          if (s) spit(s.B[0], s.B[1], Math.atan2(s.B[1] - s.A[1], s.B[0] - s.A[0]));
        }, null, 1.55)
        .to(st, { heat: 0, duration: 0.5 }, 1.7)
        .fromTo(st, { smoulder: 0.9 }, { smoulder: 0.25, duration: 1.3, ease: 'power2.out' }, 1.7)
        .to(st, { alpha: 0, smoulder: 0, duration: 0.3, ease: 'power1.in' }, 3.2);
    };
    return {
      st, draw,
      start() { st.live = true; loop.start(); tl?.kill(); cycle(); },
      stop() {
        st.live = false; tl?.kill(); tl = null; st.tx = 0; st.ty = 0;
        gsap.to(st, { F: kit.end() + 40, heat: 0, smoulder: 0, alpha: 1, duration: 0.5, ease: 'power2.out', overwrite: true,
          onComplete: () => gsap.delayedCall(0.4, () => { if (!st.live) { draw(); loop.stop(); } }) });
      },
    };
  };

  const DIRS = [];

  /* ================= Current ================= */

27 305)" stroke-linecap="round" stroke-linejoin="round" filter="url(#lb-bm)" opacity="0.85"><use href="#lb-t0" stroke-width="2.45"/><use href="#lb-t1" stroke-width="2.7"/><use href="#lb-t2" stroke-width="2.95"/><use href="#lb-t3" stroke-width="3.2"/><use href="#lb-t4" stroke-width="3.45"/><use href="#lb-t5" stroke-width="3.7"/><use href="#lb-t6" stroke-width="3.95"/><use href="#lb-t7" stroke-width="4.2"/><use href="#lb-t8" stroke-width="4.45"/><use href="#lb-t9" stroke-width="4.7"/></g><g fill="none" stroke="oklch(0.97 0.04 320)" stroke-linecap="round" stroke-linejoin="round"><use href="#lb-t0" stroke-width="0.5"/><use href="#lb-t1" stroke-width="0.5"/><use href="#lb-t2" stroke-width="0.5"/><use href="#lb-t3" stroke-width="0.55"/><use href="#lb-t4" stroke-width="0.69"/><use href="#lb-t5" stroke-width="0.83"/><use href="#lb-t6" stroke-width="0.96"/><use href="#lb-t7" stroke-width="1.1"/><use href="#lb-t8" stroke-width="1.24"/><use href="#lb-t9" stroke-width="1.38"/></g></g><g id="lichtenberg-glints" filter="url(#lb-bs)"><circle cx="63.4" cy="67.1" r="0.9" fill="oklch(0.72 0.19 50)" opacity="0.8"/><circle cx="66.2" cy="65.9" r="0.9" fill="oklch(0.72 0.19 50)" opacity="0.8"/><circle cx="65.3" cy="75.5" r="0.9" fill="oklch(0.72 0.19 50)" opacity="0.8"/><circle cx="59.5" cy="62.7" r="0.9" fill="oklch(0.72 0.19 50)" opacity="0.8"/><circle cx="70.6" cy="63.3" r="0.9" fill="oklch(0.72 0.19 50)" opacity="0.8"/><circle cx="68.1" cy="60.4" r="0.9" fill="oklch(0.72 0.19 50)" opacity="0.8"/><circle cx="69.9" cy="61.4" r="0.9" fill="oklch(0.72 0.19 50)" opacity="0.8"/><circle cx="45.5" cy="78.3" r="0.9" fill="oklch(0.72 0.19 50)" opacity="0.8"/><circle cx="59.7" cy="79.8" r="0.9" fill="oklch(0.72 0.19 50)" opacity="0.8"/></g><g id="lichtenberg-fly" stroke="oklch(0.97 0.04 320)" stroke-width="0.7" stroke-linecap="round"><line opacity="0"/><line opacity="0"/><line opacity="0"/><line opacity="0"/><line opacity="0"/><line opacity="0"/></g><rect x="14" y="14" width="100" height="100" fill="url(#lb-vig)"/><rect x="14" y="14" width="100" height="100" filter="url(#lb-grain)"/></g></g>`;
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg, u) {
      svg.innerHTML = CURRENT.replace(/lb-/g, `${u}lb-`).replace('id="lichtenberg-glints"', 'class="glints"').replace('id="lichtenberg-fly"', 'class="fly"');
      const q = id => svg.querySelector(`#${u}${id} circle`);
      const mc = q('lb-mc'), rings = ['lb-mv', 'lb-mp', 'lb-mo'].map(q);
      const glints = [...svg.querySelector('.glints').children], fly = [...svg.querySelector('.fly').children];
      const R = 52.49, END = R + 60, ROOT = [64.1, 66.2];
      const ring = (c, r, w) => { c.setAttribute('r', Math.max(0, r - w / 2).toFixed(2)); c.setAttribute('stroke-width', Math.min(w, r * 2 + 0.01).toFixed(2)); };
      const st = { r: END };
      const draw = () => {
        mc.setAttribute('r', Math.max(0, st.r - 4).toFixed(2));
        ring(rings[0], st.r, 9); ring(rings[1], st.r - 9, 10); ring(rings[2], st.r - 22, 18);
        gsap.set(glints, { opacity: Math.min(1, Math.max(0, (st.r - R - 20) / 30)) * 0.8 });
      };
      // Sparks fly off a random point near the front as short streaks.
      const spit = () => {
        const a0 = Math.random() * 6.28, d0 = Math.min(st.r, R) * (0.6 + Math.random() * 0.4);
        const x = ROOT[0] + Math.cos(a0) * d0, y = ROOT[1] + Math.sin(a0) * d0;
        fly.forEach(l => {
          const a = a0 + (Math.random() - 0.5) * 1.6, v = 8 + Math.random() * 14, s = { t: 0 };
          gsap.to(s, { t: 1, duration: 0.25 + Math.random() * 0.3, ease: 'power2.out', onUpdate() {
            const d = v * s.t, x1 = x + Math.cos(a) * d, y1 = y + Math.sin(a) * d, tl = 2.2 * (1 - s.t);
            gsap.set(l, { attr: { x1: x1 - Math.cos(a) * tl, y1: y1 - Math.sin(a) * tl, x2: x1, y2: y1 }, opacity: 1 - s.t });
          } });
        });
      };
      draw();
      let tl = null;
      return {
        enter() {
          if (tl) return;
          st.r = 0; draw();
          tl = gsap.timeline({ repeat: -1, repeatDelay: 1.2 })
            .fromTo(st, { r: 0 }, { r: END, duration: 2.6, ease: 'power1.in', onUpdate: draw, immediateRender: false })
            .call(spit, null, 0.5).call(spit, null, 1.1).call(spit, null, 1.7);
        },
        move() {},
        leave() { tl?.kill(); tl = null; gsap.to(st, { r: END, duration: 0.5, onUpdate: draw, overwrite: true }); },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // The painted panel stands on its foot, turned a little to the right.
  // Its left edge comes near, so the birch edge shows on the left.
  const A_FACE = [[24, 14], [104, 22], [104, 102], [24, 112]];
  const A_SIDE = [[16, 18], [24, 14], [24, 112], [16, 107]];
  const A_ROOT = [48, 50], A_SEED = 23;
  // Board units map onto the face by bilinear blend of its corners.
  const aMap = ([bu, bv]) => {
    const s = bu / 100, t = bv / 100, [p0, p1, p2, p3] = A_FACE;
    const top = [lerp(p0[0], p1[0], s), lerp(p0[1], p1[1], s)], bot = [lerp(p3[0], p2[0], s), lerp(p3[1], p2[1], s)];
    return [lerp(top[0], bot[0], t), lerp(top[1], bot[1], t)];
  };
  // The far side is smaller, so its grooves are thinner.
  const aScale = ([bu]) => lerp(0.92, 0.8, clamp(bu / 100));
  const A_TREE = growTree(A_SEED, A_ROOT);
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [14, 12, 92, 106],
    idea: 'The toy\'s painted panel, standing free and turned a little: teal satin paint, a birch edge, one bold burn with a charcoal groove in a scorched halo. On hover the board is fresh and a violet spark crawls out; the arms toward the pointer burn first, the board flashes as it lands and sparks spit off the nearest tip. Then it cools to embers.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}g1`, 1)}${blur(`${u}g2`, 1.8)}
          ${lg(`${u}paint`, [[0, PAINT[0]], [1, PAINT[1]]], 'x1="0" y1="0" x2="0.7" y2="1"')}
          ${lg(`${u}side`, [[0, BIRCH.mid], [1, BIRCH.dark]], 'x1="0" y1="0" x2="0" y2="1"')}
          <clipPath id="${u}face"><path d="${poly(A_FACE)}"/></clipPath></defs>
        <ellipse cx="62" cy="113" rx="46" ry="3.6" fill="oklch(0.05 0.01 260)" opacity="0.55" filter="url(#${u}b)"/>
        <path d="${poly(A_SIDE)}" fill="url(#${u}side)"/>
        <path d="M${A_SIDE[0][0] + 1} ${A_SIDE[0][1] + 1.6}L${A_SIDE[1][0] - 0.6} ${A_SIDE[1][1] + 0.8}" stroke="${BIRCH.top}" stroke-width="2" stroke-linecap="round"/>
        <path d="${poly(A_FACE)}" fill="url(#${u}paint)"/>
        <g clip-path="url(#${u}face)"><g class="burn"></g><path class="flash" d="${poly(A_FACE)}" fill="oklch(0.7 0.2 305)" opacity="0"/><g class="fly"></g></g>
        <path d="${poly(A_FACE)}" fill="url(#${u}lit)" opacity="0.7"/>
        <path d="${poly(A_FACE)}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
      const kit = burnKit(svg.querySelector('.burn'), u, aMap, aScale);
      kit.set(A_TREE, A_ROOT);
      const spit = sparks(svg.querySelector('.fly'));
      let ptr = null;
      const b = burner(kit, svg.querySelector('.flash'), spit, { aim: () => ptr });
      b.st.F = 999; b.draw();
      // The bias points from the root toward the pointer.
      const aimAt = p => {
        ptr = p;
        const dx = p[0] - kit.root[0], dy = p[1] - kit.root[1], m = Math.hypot(dx, dy) || 1;
        b.st.tx = dx / m; b.st.ty = dy / m;
      };
      return {
        enter(p) { if (p) aimAt(p); b.start(); },
        move(p) { if (p) aimAt(p); },
        leave() { ptr = null; b.stop(); },
      };
    },
    emblem: (() => {
      const tree = A_TREE.map(s => {
        const A = aMap(s.a), B = aMap(s.b);
        return `<path d="M${f(A[0])} ${f(A[1])}L${f(B[0])} ${f(B[1])}" stroke-width="${f(s.w * aScale(s.a) + 2.2)}"/>`;
      }).join('');
      const r = aMap(A_ROOT);
      return `${EMB_HEAD}<path d="${poly(A_SIDE)}" fill="#8a8a8a"/><path d="${poly(A_FACE)}" fill="#fff"/><g stroke="#000" stroke-linecap="round" fill="none">${tree}</g><circle cx="${f(r[0])}" cy="${f(r[1])}" r="4.4" fill="#000"/></svg>`;
    })(),
  });

  /* ================= D: Isometric block ================= */

  // A plywood block in 30 degree isometric view; the paint is on top.
  const S = 92, T = 20, CS = 0.6, SN = CS * Math.tan(Math.PI / 6);
  const Y0 = 64 - (2 * S * SN + T) / 2;
  const iso = (gx, gy, h = 0) => [64 + (gx - gy) * CS, Y0 + (gx + gy) * SN - h];
  const D_C = [[0, 0], [S, 0], [S, S], [0, S]].map(([x, y]) => iso(x, y));
  const down = (p, d = T) => [p[0], p[1] + d];
  // Board units 0 to 100 sit on the top face.
  const dMap = ([bu, bv]) => iso((bu / 100) * S, (bv / 100) * S);
  const dScale = () => 0.82;
  // A tile point back to board units on the top face.
  const dUnmap = ([x, y]) => {
    const a = (x - 64) / CS, b2 = (y - Y0) / SN;
    return [clamp(((a + b2) / 2 / S) * 100, 22, 78), clamp(((b2 - a) / 2 / S) * 100, 22, 78)];
  };
  const D_ROOT = [50, 50], D_SEED = 41;
  const D_TREE = growTree(D_SEED, D_ROOT);
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [8, Y0 - 1, 112, 2 * S * SN + T + 6],
    idea: 'The board as a block: teal paint on top, three birch plies on the sides. The burn starts where the pointer lands: a new tree crawls out from that spot in violet, the block flashes and sparks fly, and each new pass starts from the pointer again.',
    art(svg, u) {
      const [c0, c1, c2, c3] = D_C;
      // A side face in three plies: a light, a dark and a light band.
      const plies = (pa, pb, tones) => tones.map((c, i) => `<path d="${poly([down(pa, 2 + i * (T - 2) / 3), down(pb, 2 + i * (T - 2) / 3), down(pb, 2 + (i + 1) * (T - 2) / 3), down(pa, 2 + (i + 1) * (T - 2) / 3)])}" fill="${c}"/>`).join('');
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g1`, 1)}${blur(`${u}g2`, 1.8)}
          ${lg(`${u}paint`, [[0, PAINT[0]], [1, PAINT[1]]], 'x1="0.2" y1="0" x2="0.8" y2="1"')}
          <clipPath id="${u}top"><path d="${poly(D_C)}"/></clipPath></defs>
        <path d="${poly([c1, c2, c3, down(c3), down(c2), down(c1)])}" fill="oklch(0.05 0.01 260)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${poly([c3, c2, down(c2), down(c3)])}" fill="${PAINT[1]}"/>
        ${plies(c3, c2, [BIRCH.top, BIRCH.mid, 'oklch(0.74 0.05 78)'])}
        <path d="${poly([c2, c1, down(c1), down(c2)])}" fill="oklch(0.36 0.06 212)"/>
        ${plies(c2, c1, [BIRCH.dark, 'oklch(0.36 0.045 58)', 'oklch(0.46 0.05 62)'])}
        <path d="${poly(D_C)}" fill="url(#${u}paint)"/>
        <g clip-path="url(#${u}top)"><g class="burn"></g><path class="flash" d="${poly(D_C)}" fill="oklch(0.7 0.2 305)" opacity="0"/><g class="fly"></g></g>
        <path d="${poly(D_C)}" fill="url(#${u}lit)" opacity="0.6"/>
        <path d="${poly(D_C)}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
        <path d="M${f(c3[0])} ${f(c3[1])}L${f(c2[0])} ${f(c2[1])}L${f(c1[0])} ${f(c1[1])}" stroke="#fff" stroke-opacity="0.55" stroke-width="1.4" stroke-linejoin="round" fill="none"/>`;
      const kit = burnKit(svg.querySelector('.burn'), u, dMap, dScale);
      kit.set(D_TREE, D_ROOT);
      const spit = sparks(svg.querySelector('.fly'));
      let ptr = null, seed = D_SEED;
      // Each pass grows a new tree from the pointer's spot.
      const regrow = () => {
        seed = (seed * 48271) % 2147483647;
        const at = ptr ? dUnmap(ptr) : [lerp(25, 75, Math.random()), lerp(25, 75, Math.random())];
        kit.set(growTree(seed, at), at);
      };
      const b = burner(kit, svg.querySelector('.flash'), spit, { before: regrow, aim: () => ptr });
      b.st.F = 999; b.draw();
      return {
        enter(p) { ptr = p; b.start(); },
        move(p) { if (p) ptr = p; },
        leave() { ptr = null; b.stop(); },
      };
    },
    emblem: (() => {
      const [c0, c1, c2, c3] = D_C;
      const tree = D_TREE.map(s => {
        const A = dMap(s.a), B = dMap(s.b);
        return `<path d="M${f(A[0])} ${f(A[1])}L${f(B[0])} ${f(B[1])}" stroke-width="${f(s.w * dScale() + 2.2)}"/>`;
      }).join('');
      const r = dMap(D_ROOT);
      return `${EMB_HEAD}<path d="${poly([c3, c2, down(c2), down(c3)])}" fill="#8a8a8a"/><path d="${poly([c2, c1, down(c1), down(c2)])}" fill="#5a5a5a"/><path d="${poly(D_C)}" fill="#fff"/><clipPath id="t"><path d="${poly(D_C)}"/></clipPath><g clip-path="url(#t)" stroke="#000" stroke-linecap="round" fill="none">${tree}<circle cx="${f(r[0])}" cy="${f(r[1])}" r="3.6" fill="#000" stroke="none"/></g></svg>`;
    })(),
  });

  /* ================= Gallery ================= */
  const NAME = 'Lichtenberg burn';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-lichtenberg';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `lichtenberg2-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
