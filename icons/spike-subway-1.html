<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Subway 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; align-items: center; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.emb > .mono { width: 28px; height: 28px; background: var(--bg); color: var(--fg); }
.emb > .mono i { width: 28px; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Subway 1</h1>
<p class="lede">Subway, round 1: a stainless metro car with the line's orange band, lit warm inside, with sodium tunnel lamps that pass along it. A: free on the ground. D: the car is the block.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const lerp2 = (p, q, t) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t)];
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The toy's tokens: stainless steel, the line's orange, warm cabin light.
  const STEEL = [[0, 'oklch(0.93 0.008 250)'], [0.5, 'oklch(0.76 0.014 250)'], [1, 'oklch(0.56 0.02 255)']];
  const STEEL_SIDE = [[0, 'oklch(0.6 0.016 250)'], [1, 'oklch(0.38 0.02 258)']];
  const STEEL_ROOF = [[0, 'oklch(0.86 0.01 250)'], [1, 'oklch(0.66 0.014 252)']];
  const GLASS = [[0, 'oklch(0.36 0.04 250)'], [1, 'oklch(0.13 0.02 265)']];
  const CABIN = [[0, 'oklch(0.94 0.09 85)'], [1, 'oklch(0.74 0.14 62)']];
  const BAND = [[0, 'oklch(0.8 0.17 42)'], [1, 'oklch(0.62 0.18 34)']];
  const SKIRT = 'oklch(0.22 0.012 260)', HEAD = 'oklch(0.98 0.05 92)';
  // The sodium lamps in the tunnel: a warm amber.
  const LAMP = 'oklch(0.86 0.16 72)';
  const { sin } = Math;

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover loop.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg, u) {
      svg.innerHTML = `<defs><clipPath id="${u}clip"><path d="M16 64L108 48V108H16Z"/></clipPath></defs>
        <g transform="rotate(-8 62 62)">
          <rect x="16" y="16" width="92" height="92" fill="oklch(0.2 0.02 60)"/>
          <rect x="24" y="26" width="34" height="20" rx="5" fill="oklch(0.1 0.01 260)"/>
          <rect x="66" y="26" width="34" height="20" rx="5" fill="oklch(0.1 0.01 260)"/>
          <rect x="16" y="52" width="92" height="10" fill="oklch(0.25 0.06 265)"/>
          <g clip-path="url(#${u}clip)">
            <rect x="16" y="62" width="92" height="46" fill="oklch(0.16 0.01 60)"/>
            <path class="pool" d="M30 62H52L40 108H10Z" fill="oklch(0.78 0.13 70)" opacity="0.85"/>
          </g>
          <path d="M62 16V108" stroke="oklch(0.78 0.15 80)" stroke-width="3"/>
        </g>`;
      const pool = svg.querySelector('.pool');
      let tl = null;
      return {
        enter() {
          tl?.kill();
          tl = gsap.timeline({ repeat: -1, repeatDelay: 0.2 }).fromTo(pool, { x: 0 }, { x: 110, duration: 0.7, ease: 'none' });
        },
        move() {},
        leave() { tl?.kill(); tl = null; gsap.to(pool, { x: 0, duration: 0.4, overwrite: true }); },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // The car seen three-quarter from the front: front face, roof, left side.
  const FRONT = 'M26 30Q28 16 50 15Q72 16 76 30L80 96Q80 102 74 102H26Q20 102 20 96Z';
  const ROOF = 'M50 15L86 25Q108 27 112 40L76 30Q72 16 50 15Z';
  const SIDE = 'M76 30L112 40L113 92L80 98Z';
  // A point on the side: s runs front to back, v runs top to bottom.
  const sideP = (s, v) => lerp2(lerp2([76, 30], [112, 40], s), lerp2([80, 98], [113, 92], s), v);
  const sideQuad = (s0, s1, v0, v1) => poly([sideP(s0, v0), sideP(s1, v0), sideP(s1, v1), sideP(s0, v1)]);
  const WS = 'M30 34Q31 27 38 27H62Q69 27 70 34L71 56H29Z';
  const F_BAND = 'M23.1 62H77.9L78.4 70H22.4Z';
  const F_SKIRT = 'M20.8 88H79.5L80 96Q80 102 74 102H26Q20 102 20 96Z';
  const S_WIN = [sideQuad(0.1, 0.42, 0.16, 0.4), sideQuad(0.55, 0.87, 0.16, 0.4)];
  const S_BAND = sideQuad(0, 1, 0.47, 0.59), S_SKIRT = sideQuad(0, 1, 0.86, 1);
  const LIGHTS = [[25, 76], [63, 76]];
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [18, 15, 95, 91],
    idea: 'A stainless metro car seen three-quarter from the front: a big dark windscreen, the line\'s orange band round the body, two warm headlamps, and cabin windows lit warm along the side. The pointer leans the car into a bend toward it; on enter the headlamps flare, the car rocks on its springs and sodium tunnel lamps sweep along its side one after another. Leave lets the last lamp pass and the car settle.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}h`, 2.4)}${blur(`${u}g`, 3)}
          ${lg(`${u}steel`, STEEL, 'x1="0" y1="0" x2="1" y2="1"')}
          ${lg(`${u}side`, STEEL_SIDE)}
          ${lg(`${u}roof`, STEEL_ROOF, 'x1="0" y1="0" x2="1" y2="0"')}
          ${lg(`${u}glass`, GLASS)}
          ${lg(`${u}cabin`, CABIN)}
          ${lg(`${u}band`, BAND, 'x1="0" y1="0" x2="1" y2="0"')}
          ${rg(`${u}head`, [[0, HEAD, 0.9], [0.5, 'oklch(0.9 0.1 85)', 0.35], [1, HEAD, 0]])}
          ${lg(`${u}lamp`, [[0, LAMP, 0], [0.5, LAMP, 0.75], [1, LAMP, 0]], 'x1="0" y1="0" x2="1" y2="0"')}
          <clipPath id="${u}sc"><path d="${SIDE}"/></clipPath>
          <clipPath id="${u}wc"><path d="${WS}"/></clipPath></defs>
        <ellipse cx="66" cy="104" rx="48" ry="5" fill="oklch(0.05 0.01 270)" opacity="0.55" filter="url(#${u}h)"/>
        <g class="car">
          <path d="${SIDE}" fill="url(#${u}side)"/>
          ${S_WIN.map(d => `<path d="${d}" fill="url(#${u}cabin)"/>`).join('')}
          <path d="${S_BAND}" fill="url(#${u}band)"/>
          <path d="${S_SKIRT}" fill="${SKIRT}"/>
          <g clip-path="url(#${u}sc)"><path class="lamp" d="M-14 0H14L18 128H-10Z" fill="url(#${u}lamp)" opacity="0"/></g>
          <path d="${SIDE}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
          ${body(ROOF, u, 'roof')}
          ${body(FRONT, u, 'steel')}
          <path d="${WS}" fill="url(#${u}glass)"/>
          <g clip-path="url(#${u}wc)">
            <ellipse cx="50" cy="56" rx="22" ry="9" fill="url(#${u}cabin)" opacity="0.4" filter="url(#${u}g)"/>
            <path class="glint" d="M34 56L46 27H56L44 56Z" fill="#fff" opacity="0.16"/>
          </g>
          <path d="${F_BAND}" fill="url(#${u}band)"/>
          <path d="${F_SKIRT}" fill="${SKIRT}"/>
          <rect x="44" y="98" width="12" height="8" rx="2" fill="${SKIRT}"/>
          ${LIGHTS.map(([x, y]) => `<ellipse class="glow" cx="${x + 6}" cy="${y + 3.5}" rx="13" ry="10" fill="url(#${u}head)" opacity="0.4"/><rect x="${x}" y="${y}" width="12" height="7" rx="3.5" fill="${HEAD}"/>`).join('')}
          <path d="${FRONT}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
        </g>`;
      const car = svg.querySelector('.car'), lamp = svg.querySelector('.lamp'), glint = svg.querySelector('.glint');
      const glows = svg.querySelectorAll('.glow');
      // lean: degrees; on: headlamp level; p: the lamp's place along the side.
      const st = { lean: 0, leanTo: 0, on: 0.4, onTo: 0.4, p: 2, t: 0, live: false, rock: 0, rockTo: 0 };
      const draw = () => {
        const rock = st.rock * sin(st.t * 7) * 0.9;
        car.setAttribute('transform', `rotate(${f(st.lean + rock)} 66 104)`);
        glows.forEach(g => g.setAttribute('opacity', f(st.on)));
        // The lamp pool slides from the front to the back of the car.
        const [x, y] = sideP(clamp(st.p, -0.4, 1.4), 0);
        lamp.setAttribute('transform', `translate(${f(x)} ${f(y - 20)}) skewX(-4)`);
        lamp.setAttribute('opacity', st.p < 1.4 ? 1 : 0);
        glint.setAttribute('opacity', f(0.16 + 0.2 * clamp(1 - Math.abs(st.p + 0.15) * 3)));
      };
      const loop = clock(time => {
        const dt = Math.min(0.1, time - (st.t || time));
        st.t = time;
        st.lean += (st.leanTo - st.lean) * 0.1;
        st.on += (st.onTo - st.on) * 0.15;
        st.rock += (st.rockTo - st.rock) * 0.08;
        // A new lamp comes in at the front while the car runs.
        if (st.p < 1.4) st.p += dt * 1.7;
        else if (st.live) st.p = -0.4;
        draw();
        if (!st.live && st.p >= 1.4 && Math.abs(st.lean) + Math.abs(st.on - 0.4) + st.rock < 0.02) {
          Object.assign(st, { lean: 0, on: 0.4, rock: 0 }); draw(); loop.stop();
        }
      });
      draw();
      return {
        enter(p) { st.live = true; st.onTo = 1; st.rockTo = 1; if (st.p >= 1.4) st.p = -0.4; loop.start(); this.move(p); },
        // The car leans into a bend toward the pointer.
        move(p) { if (p) st.leanTo = clamp((p[0] - 64) / 44, -1, 1) * 5; },
        leave() { st.live = false; st.leanTo = 0; st.onTo = 0.4; st.rockTo = 0; loop.start(); },
      };
    },
    emblem: `${EMB_HEAD}<path d="${SIDE}" fill="#8a8a8a"/>${S_WIN.map(d => `<path d="${d}" fill="#fff"/>`).join('')}<path d="${S_SKIRT}" fill="#444"/><path d="${ROOF}" fill="#c8c8c8"/><path d="${FRONT}" fill="#fff"/><path d="${WS}" fill="#3a3a3a"/><path d="${F_BAND}" fill="#8a8a8a"/><path d="${F_SKIRT}" fill="#444"/><rect x="44" y="98" width="12" height="8" rx="2" fill="#444"/>${LIGHTS.map(([x, y]) => `<rect x="${x}" y="${y}" width="12" height="7" rx="3.5" fill="#fff"/>`).join('')}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The car is the block: roof on top, long side left, front end right.
  // gx runs along the car, gy across it; h drops down a face.
  const CY = 50, L = 34, W2 = 12, T = 26;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-L, -W2), E = iso(L, -W2), S = iso(L, W2), W = iso(-L, W2);
  const down = (p, h = T) => [p[0], p[1] + h];
  const leftQ = (g0, g1, h0, h1) => poly([down(iso(g0, W2), h0), down(iso(g1, W2), h0), down(iso(g1, W2), h1), down(iso(g0, W2), h1)]);
  const rightQ = (g0, g1, h0, h1) => poly([down(iso(L, g0), h0), down(iso(L, g1), h0), down(iso(L, g1), h1), down(iso(L, g0), h1)]);
  const D_LEFT = poly([W, S, down(S), down(W)]), D_RIGHT = poly([S, E, down(E), down(S)]), D_TOP = poly([N, E, S, W]);
  const D_WIN = [[-30, -19], [-13, -2], [4, 15], [21, 30]].map(([a, b]) => leftQ(a, b, 4.5, 12.5));
  const D_BAND = [leftQ(-L, L, 15, 18.5), rightQ(W2, -W2, 15, 18.5)];
  const D_SKIRT = [leftQ(-L, L, 22, T), rightQ(W2, -W2, 22, T)];
  const D_WS = rightQ(8.5, -8.5, 3.5, 12.5);
  const D_HEAD = [rightQ(10, 5.5, 19.5, 21.8), rightQ(-5.5, -10, 19.5, 21.8)];
  // A roof unit: a low box on the roof, 4 high.
  const up = (p, h = 4) => [p[0], p[1] - h];
  const RN = iso(-16, -6), RE = iso(16, -6), RS = iso(16, 6), RW = iso(-16, 6);
  const R_TOP = poly([up(RN), up(RE), up(RS), up(RW)]), R_LEFT = poly([up(RW), up(RS), RS, RW]), R_RIGHT = poly([up(RS), up(RE), RE, RS]);
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [24, 27, 80, 73],
    idea: 'The car is the block: a stainless roof on top with the light on it, the long side on the left face with four warm windows and the orange band, the front end on the dark right face with the windscreen and two headlamps. On enter the headlamps flare and sodium tunnel lamps sweep along the side from front to back; the car rocks and leans toward the pointer.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}s`, 2.6)}
          ${lg(`${u}roof`, STEEL_ROOF, 'x1="0" y1="0" x2="1" y2="1"')}
          ${lg(`${u}side`, [[0, 'oklch(0.74 0.014 250)'], [1, 'oklch(0.58 0.018 254)']])}
          ${lg(`${u}front`, [[0, 'oklch(0.5 0.018 254)'], [1, 'oklch(0.38 0.02 258)']])}
          ${lg(`${u}glass`, GLASS)}
          ${lg(`${u}cabin`, CABIN)}
          ${lg(`${u}band`, BAND, 'x1="0" y1="0" x2="1" y2="0"')}
          ${rg(`${u}head`, [[0, HEAD, 0.9], [0.5, 'oklch(0.9 0.1 85)', 0.35], [1, HEAD, 0]])}
          ${lg(`${u}lamp`, [[0, LAMP, 0], [0.5, LAMP, 0.75], [1, LAMP, 0]], 'x1="0" y1="0" x2="1" y2="0"')}
          <clipPath id="${u}lc"><path d="${D_LEFT}"/></clipPath></defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 290)" opacity="0.5" filter="url(#${u}s)" transform="translate(0 4)"/>
        <g class="car">
          <path d="${D_LEFT}" fill="url(#${u}side)"/>
          ${D_WIN.map(d => `<path d="${d}" fill="url(#${u}cabin)"/>`).join('')}
          <path d="${D_BAND[0]}" fill="url(#${u}band)"/>
          <path d="${D_SKIRT[0]}" fill="${SKIRT}"/>
          <g clip-path="url(#${u}lc)"><path class="lamp" d="M-9 -12H9L9 60H-9Z" fill="url(#${u}lamp)" opacity="0"/></g>
          <path d="${D_RIGHT}" fill="url(#${u}front)"/>
          <path d="${D_WS}" fill="url(#${u}glass)"/>
          <path d="${D_BAND[1]}" fill="url(#${u}band)"/>
          <path d="${D_SKIRT[1]}" fill="${SKIRT}"/>
          ${D_HEAD.map((d, i) => { const c = down(iso(L, i ? -7.75 : 7.75), 20.6); return `<ellipse class="glow" cx="${f(c[0])}" cy="${f(c[1])}" rx="8" ry="6" fill="url(#${u}head)" opacity="0.4"/><path d="${d}" fill="${HEAD}" stroke="${HEAD}" stroke-width="1" stroke-linejoin="round"/>`; }).join('')}
          <path d="${D_TOP}" fill="url(#${u}roof)"/>
          <path d="${D_TOP}" fill="url(#${u}lit)"/>
          <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
          <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
          <path d="${R_LEFT}" fill="oklch(0.62 0.014 252)"/>
          <path d="${R_RIGHT}" fill="oklch(0.48 0.016 256)"/>
          <path d="${R_TOP}" fill="url(#${u}roof)"/>
          <path d="${R_TOP}" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5" stroke-linejoin="round"/>
        </g>`;
      const car = svg.querySelector('.car'), lamp = svg.querySelector('.lamp'), glows = svg.querySelectorAll('.glow');
      const base = down(S, T);
      // g: the lamp's place along the car, from the front (L) to the back (-L).
      const st = { lean: 0, leanTo: 0, on: 0.4, onTo: 0.4, g: -99, t: 0, live: false, rock: 0, rockTo: 0 };
      const OUT = -L - 14;
      const draw = () => {
        const rock = st.rock * sin(st.t * 7) * 0.8;
        car.setAttribute('transform', `rotate(${f(st.lean + rock)} ${f(base[0])} ${f(base[1])})`);
        glows.forEach(g => g.setAttribute('opacity', f(st.on)));
        // The pool runs along the left face, so it skews with it.
        const p = iso(st.g, W2);
        lamp.setAttribute('transform', `translate(${f(p[0])} ${f(p[1])}) skewY(30)`);
        lamp.setAttribute('opacity', st.g > OUT ? 1 : 0);
      };
      const loop = clock(time => {
        const dt = Math.min(0.1, time - (st.t || time));
        st.t = time;
        st.lean += (st.leanTo - st.lean) * 0.1;
        st.on += (st.onTo - st.on) * 0.15;
        st.rock += (st.rockTo - st.rock) * 0.08;
        // A new lamp comes in at the front while the car runs.
        if (st.g > OUT) st.g -= dt * 110;
        else if (st.live) st.g = L + 14;
        draw();
        if (!st.live && st.g <= OUT && Math.abs(st.lean) + Math.abs(st.on - 0.4) + st.rock < 0.02) {
          Object.assign(st, { lean: 0, on: 0.4, rock: 0 }); draw(); loop.stop();
        }
      });
      draw();
      return {
        enter(p) { st.live = true; st.onTo = 1; st.rockTo = 1; if (st.g <= OUT) st.g = L + 14; loop.start(); this.move(p); },
        // The car leans toward the pointer.
        move(p) { if (p) st.leanTo = clamp((p[0] - 64) / 40, -1, 1) * 4; },
        leave() { st.live = false; st.leanTo = 0; st.onTo = 0.4; st.rockTo = 0; loop.start(); },
      };
    },
    emblem: `${EMB_HEAD}<path d="${D_LEFT}" fill="#8a8a8a"/>${D_WIN.map(d => `<path d="${d}" fill="#fff"/>`).join('')}<path d="${D_SKIRT[0]}" fill="#444"/><path d="${D_RIGHT}" fill="#5a5a5a"/><path d="${D_WS}" fill="#2a2a2a"/><path d="${D_SKIRT[1]}" fill="#333"/>${D_HEAD.map(d => `<path d="${d}" fill="#fff" stroke="#fff" stroke-width="1"/>`).join('')}<path d="${D_TOP}" fill="#fff"/><path d="${R_LEFT}" fill="#bdbdbd"/><path d="${R_RIGHT}" fill="#9a9a9a"/></svg>`,
  });

  /* ================= Gallery ================= */
  const ID = 'subway', NAME = 'Subway';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = `row-${ID}`;
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `${ID}-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div><div class="mono"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      // A press is a strike, where the icon has one.
      if (c.down) tileEl.addEventListener('pointerdown', e => c.down(local(svg, e)));
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
