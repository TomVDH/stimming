<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Wind farm 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Wind farm 1</h1>
<p class="lede">Wind farm, round 1: one turbine from the toy in its cold blue night fog, dark against the fog, red lamps blooming. A: free on the ground. D: on a slab of night sea.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };


  // The toy's tokens: a cold, murky night; dark paint against blue fog.
  // The red aviation lamps bloom wide; the fog lights the edges.
  const FOG = 'oklch(0.56 0.08 252)', RED = 'oklch(0.62 0.24 25)';
  // The tower is a cylinder: fog-lit left, dark right.
  const TOWER = [[0, 'oklch(0.5 0.035 250)'], [0.25, 'oklch(0.68 0.035 246)'], [0.6, 'oklch(0.38 0.035 254)'], [0.88, 'oklch(0.24 0.03 260)'], [1, 'oklch(0.42 0.06 245)']];
  const BLADE = [[0, 'oklch(0.74 0.035 246)'], [0.5, 'oklch(0.52 0.035 250)'], [1, 'oklch(0.3 0.035 258)']];
  const NAC = [[0, 'oklch(0.68 0.035 246)'], [0.5, 'oklch(0.46 0.035 252)'], [1, 'oklch(0.26 0.035 258)']];
  const HUB = [[0, 'oklch(0.76 0.04 246)'], [0.6, 'oklch(0.5 0.035 252)'], [1, 'oklch(0.3 0.035 258)']];
  // The tower foot is a muted yellow, as in the toy.
  const YEL = [[0, 'oklch(0.56 0.08 95)'], [0.28, 'oklch(0.68 0.09 96)'], [0.7, 'oklch(0.48 0.08 90)'], [1, 'oklch(0.32 0.06 85)']];
  const SEA = [[0, 'oklch(0.4 0.05 245)'], [0.6, 'oklch(0.27 0.045 250)', 0.9], [1, 'oklch(0.2 0.03 255)', 0]];
  const { sin, cos, PI } = Math;
  const spline = (pts, close = true) => {
    const P = close ? [pts[pts.length - 1], ...pts, pts[0], pts[1]] : [pts[0], ...pts, pts[pts.length - 1]];
    let d = `M${f(P[1][0])} ${f(P[1][1])}`;
    for (let i = 1; i < P.length - 2; i++) {
      const p0 = P[i - 1], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2];
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d + (close ? 'Z' : '');
  };

  // The model works in units; the base is the origin.
  // The hub sits 64 units up; a blade is 40 units long.
  const HUB_Y = -64, R = 46, RS = R / 40, NAC_L = 26, CHORD = 1.1;
  // The blades carry dark red tips past 86 % of the radius.
  const TIP = 0.86 * R;
  // A blade outline: r runs out, c runs across the chord.
  // The outline is drawn for 40 units; RS stretches it to R.
  const BLADE_PTS = [[5, -3.4], [12, -4.4], [24, -3.8], [34, -2.8], [39, -1.8], [40.6, 0], [39, 2], [32, 3.4], [21, 5.4], [12, 7.6], [6, 4.6]].map(([r, c]) => [r * RS, c]);
  // One blade at angle a; the rotor plane narrows by cos(yaw).
  const bladePath = (g, a, yaw, chord = CHORD) => {
    const [hx, hy] = g.hub, cy = cos(yaw);
    return spline(BLADE_PTS.map(([r, c]) => {
      const u = (r * sin(a) + c * chord * cos(a)) * g.k, v = (-r * cos(a) + c * chord * sin(a)) * g.k;
      return [hx + u * cy, hy + v];
    }));
  };
  // The tower tapers from the platform to the nacelle.
  const towerPath = g => {
    const [bx, by] = g.base, k = g.k;
    return poly([[bx - 3.8 * k, by + (HUB_Y + 2) * k], [bx + 3.8 * k, by + (HUB_Y + 2) * k], [bx + 6.2 * k, by - 15 * k], [bx - 6.2 * k, by - 15 * k]]);
  };
  // The transition piece: a yellow drum with a platform lip.
  const drumPath = g => { const [bx, by] = g.base, k = g.k; return `M${f(bx - 8 * k)} ${f(by - 13 * k)}H${f(bx + 8 * k)}V${f(by)}Q${f(bx)} ${f(by + 3 * k)} ${f(bx - 8 * k)} ${f(by)}Z`; };
  const lipPath = g => { const [bx, by] = g.base, k = g.k; return `M${f(bx - 13 * k)} ${f(by - 17 * k)}H${f(bx + 13 * k)}L${f(bx + 11 * k)} ${f(by - 12.5 * k)}H${f(bx - 11 * k)}Z`; };

  // The turbine's layers, far to near.
  const turbineMarkup = (u, g) => {
    const [bx, by] = g.base, k = g.k, hy = by + HUB_Y * k;
    return `
      <ellipse cx="${bx}" cy="${f(hy + 10 * k)}" rx="${f(54 * k)}" ry="${f(56 * k)}" fill="url(#${u}fog)"/>
      ${g.sea ? `<ellipse cx="${bx}" cy="${f(by)}" rx="${f(30 * k)}" ry="${f(7 * k)}" fill="url(#${u}sea)"/>` : ''}
      <ellipse class="foam" cx="${bx}" cy="${f(by + 0.5 * k)}" rx="${f(14 * k)}" ry="${f(3.6 * k)}" fill="url(#${u}foam)"/>
      ${body(drumPath(g), u, 'yel')}
      ${body(lipPath(g), u, 'yel')}
      <path d="${lipPath(g)}" fill="oklch(0.4 0.09 70)" opacity="0.35" transform="translate(0 ${f(1.6 * k)})"/>
      ${body(towerPath(g), u, 'tower')}
      <ellipse cx="${bx}" cy="${f(by - 34 * k)}" rx="${f(12 * k)}" ry="${f(9 * k)}" fill="url(#${u}red)" opacity="0.7" filter="url(#${u}hb)"/>
      <rect x="${f(bx - 5 * k)}" y="${f(by - 35.5 * k)}" width="${f(10 * k)}" height="${f(3 * k)}" fill="${RED}" opacity="0.75" clip-path="url(#${u}tc)"/>
      <clipPath id="${u}tc"><path d="${towerPath(g)}"/></clipPath>
      <g class="nac">${body('M0 0', u, 'nac')}</g>
      <ellipse class="lamp-glow" r="1" fill="url(#${u}red)" filter="url(#${u}hb)"/>
      <circle class="lamp" r="${f(3.2 * k)}" fill="${RED}"/>
      <ellipse class="disc" cx="${bx}" cy="${f(hy)}" rx="${f(R * k)}" ry="${f(R * k)}" fill="url(#${u}disc)" opacity="0"/>
      <mask id="${u}tipm" maskUnits="userSpaceOnUse" x="-50" y="-50" width="228" height="228"><rect x="-50" y="-50" width="228" height="228" fill="#fff"/><ellipse class="tipcut" cx="${bx}" cy="${f(hy)}" ry="${f(TIP * k)}" fill="#000"/></mask>
      <g class="b-fill">${('<path fill="url(#' + u + 'blade)"/>').repeat(3)}</g>
      <g class="b-tip" mask="url(#${u}tipm)">${('<path fill="url(#' + u + 'tip)"/>').repeat(3)}</g>
      <g class="b-lit">${('<path fill="url(#' + u + 'lit)"/>').repeat(3)}</g>
      <g class="b-rim">${('<path fill="none" stroke="url(#' + u + 'rim)" stroke-width="2" stroke-linejoin="round"/>').repeat(3)}</g>
      <circle class="hub" cx="${bx}" cy="${f(hy)}" r="${f(7 * k)}" fill="url(#${u}hub)"/>
      <circle cx="${bx}" cy="${f(hy)}" r="${f(7 * k)}" fill="url(#${u}lit)"/>
      <circle cx="${bx}" cy="${f(hy)}" r="${f(7 * k)}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>`;
  };
  const turbineDefs = u => `${light(u)}${blur(`${u}hb`, 2.4)}
    ${lg(`${u}tower`, TOWER, 'x1="0" y1="0" x2="1" y2="0"')}
    ${lg(`${u}blade`, BLADE, 'x1="0" y1="0" x2="1" y2="1"')}
    ${lg(`${u}nac`, NAC)}
    ${lg(`${u}tip`, [[0, 'oklch(0.56 0.16 25)'], [1, 'oklch(0.38 0.12 25)']], 'x1="0" y1="0" x2="1" y2="1"')}
    ${rg(`${u}hub`, HUB, 'cx="0.36" cy="0.32" r="0.72"')}
    ${lg(`${u}yel`, YEL, 'x1="0" y1="0" x2="1" y2="0"')}
    ${rg(`${u}sea`, SEA)}
    ${rg(`${u}foam`, [[0, 'oklch(0.78 0.04 240)', 0.8], [1, 'oklch(0.7 0.05 245)', 0]])}
    ${rg(`${u}red`, [[0, RED, 0.95], [0.35, RED, 0.45], [1, RED, 0]])}
    ${rg(`${u}disc`, [[0, '#fff', 0], [0.75, '#fff', 0.05], [0.95, '#fff', 0.2], [1, '#fff', 0]])}
    ${rg(`${u}fog`, [[0, FOG, 0.62], [0.5, FOG, 0.3], [1, FOG, 0]])}`;

  // The turbine as a live model: the rotor turns, the nacelle yaws.
  // g: base [x, y], scale k, rest yaw and rest angle.
  const turbine = (svg, u, g) => {
    const $q = s => svg.querySelector(s);
    const k = g.k, hub = g.hub;
    const nacEls = $q('.nac').querySelectorAll('path'), tipcut = $q('.tipcut');
    const blades = [0, 1, 2].map(i => ['.b-fill', '.b-tip', '.b-lit', '.b-rim'].map(c => $q(c).children[i]));
    const lamp = $q('.lamp'), glow = $q('.lamp-glow'), disc = $q('.disc'), foam = $q('.foam');
    const st = { ang: g.ang, w: 0, wTo: 0, gust: 0, yaw: g.yaw, yawTo: g.yaw, t: 0, t0: 0, live: false, last: null, lampOn: 1 };
    const draw = () => {
      const [hx, hy] = hub, sy = sin(st.yaw);
      // The nacelle runs back from the hub along the turned axis.
      const back = hx + NAC_L * k * sy, l = Math.min(hx, back) - 6 * k, r = Math.max(hx, back) + 6 * k;
      const nd = `M${f(l + 2.5 * k)} ${f(hy - 6.5 * k)}H${f(r - 2.5 * k)}Q${f(r)} ${f(hy - 6.5 * k)} ${f(r)} ${f(hy - 4 * k)}V${f(hy + 3.5 * k)}Q${f(r)} ${f(hy + 6 * k)} ${f(r - 2.5 * k)} ${f(hy + 6 * k)}H${f(l + 2.5 * k)}Q${f(l)} ${f(hy + 6 * k)} ${f(l)} ${f(hy + 3.5 * k)}V${f(hy - 4 * k)}Q${f(l)} ${f(hy - 6.5 * k)} ${f(l + 2.5 * k)} ${f(hy - 6.5 * k)}Z`;
      nacEls.forEach(e => e.setAttribute('d', nd));
      // The red light sits on the nacelle's back end.
      const lx = hx + (NAC_L - 4) * k * sy;
      lamp.setAttribute('cx', f(lx)); lamp.setAttribute('cy', f(hy - 7.6 * k));
      glow.setAttribute('cx', f(lx)); glow.setAttribute('cy', f(hy - 7.6 * k));
      glow.setAttribute('rx', f(24 * k)); glow.setAttribute('ry', f(20 * k));
      lamp.setAttribute('opacity', f(0.35 + 0.65 * st.lampOn)); glow.setAttribute('opacity', f(st.lampOn));
      blades.forEach((els, i) => { const d = bladePath(g, st.ang + (i * 2 * PI) / 3, st.yaw); els.forEach(e => e.setAttribute('d', d)); });
      // A fast rotor leaves a faint disc.
      tipcut.setAttribute('rx', f(TIP * k * cos(st.yaw)));
      disc.setAttribute('rx', f(R * k * cos(st.yaw))); disc.setAttribute('opacity', f(Math.min(1, st.w / 2.2)));
      foam.setAttribute('transform', `translate(0 ${f(sin(st.t * 2.2) * 0.6 * k * Math.min(1, st.w))})`);
    };
    const loop = clock(time => {
      const dt = Math.min(0.1, time - (st.t || time));
      st.t = time;
      st.gust *= Math.exp(-dt * 1.4);
      st.w += (st.wTo + st.gust - st.w) * Math.min(1, dt * 1.6);
      st.yaw += (st.yawTo - st.yaw) * Math.min(1, dt * 2.4);
      st.ang += st.w * dt;
      // The aviation light blinks once a second while the tile is live.
      st.lampOn = st.live ? ((time - st.t0) % 1 < 0.5 ? 1 : 0) : 1;
      draw();
      if (!st.live && st.w < 0.02 && Math.abs(st.yaw - st.yawTo) < 0.004) { st.w = 0; st.gust = 0; draw(); loop.stop(); }
    });
    draw();
    return {
      enter(p) { st.live = true; st.wTo = 2.6; st.t0 = st.t; st.last = null; loop.start(); if (p) this.move(p); },
      // The rotor faces the pointer; a fast pointer is a gust.
      move(p) {
        if (!p) return;
        st.yawTo = clamp((hub[0] - p[0]) / (34 * k), -1, 1) * 0.95;
        if (st.last) st.gust = Math.min(9, st.gust + Math.hypot(p[0] - st.last[0], p[1] - st.last[1]) * 0.09 / k);
        st.last = p;
      },
      leave() { st.live = false; st.wTo = 0; st.yawTo = g.yaw; loop.start(); },
    };
  };
  // The emblem: the turbine at rest, with wide blades.
  const turbineEmblem = g => {
    const [bx, by] = g.base, [hx, hy] = g.hub, k = g.k, back = hx + NAC_L * k * sin(g.yaw);
    return `<path d="${towerPath(g)}" fill="#fff"/><path d="${drumPath(g)}" fill="#fff"/><path d="${lipPath(g)}" fill="#fff"/>`
      + `<rect x="${f(bx - 9 * k)}" y="${f(by - 12.5 * k)}" width="${f(18 * k)}" height="${f(3.4 * k)}" fill="#000"/>`
      + `<rect x="${f(Math.min(hx, back) - 6 * k)}" y="${f(hy - 6.5 * k)}" width="${f(Math.abs(back - hx) + 12 * k)}" height="${f(12.5 * k)}" rx="${f(5 * k)}" fill="#fff"/>`
      + [0, 1, 2].map(i => `<path d="${bladePath(g, g.ang + (i * 2 * PI) / 3, g.yaw, 1.6)}" fill="#fff"/>`).join('')
      + `<circle cx="${f(hx)}" cy="${f(hy)}" r="${f(11 * k)}" fill="none" stroke="#000" stroke-width="${f(4.5 * k)}"/>`
      + `<circle cx="${f(hx)}" cy="${f(hy)}" r="${f(7.5 * k)}" fill="#fff"/>`;
  };
  const tg = (base, k, yaw = 0.62, ang = 0.32) => ({ base, k, yaw, ang, hub: [base[0], base[1] + HUB_Y * k] });

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover loop.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="16" y="16" width="92" height="92" fill="oklch(0.3 0.05 255)"/>
        <rect x="16" y="70" width="92" height="22" fill="oklch(0.38 0.04 250)"/>
        <rect x="16" y="92" width="92" height="16" fill="oklch(0.2 0.04 255)"/>
        <path d="M92 92V66M80 92V60M70 92V56" stroke="oklch(0.5 0.03 250)" stroke-width="1.6"/>
        <path d="M48 96V44" stroke="oklch(0.12 0.02 260)" stroke-width="3.2"/>
        <g class="rotor" stroke="oklch(0.12 0.02 260)" stroke-width="2.6" stroke-linecap="square">
          <path d="M48 44V18M48 44L70.5 57M48 44L25.5 57"/>
        </g>
        <circle class="light" cx="48" cy="40" r="2.4" fill="oklch(0.62 0.23 25)"/>`;
      const rotor = svg.querySelector('.rotor'), lightEl = svg.querySelector('.light');
      let tl = null;
      return {
        enter() {
          tl?.kill();
          tl = gsap.timeline({ repeat: -1, repeatDelay: 0 })
            .fromTo(rotor, { rotation: 0, svgOrigin: '48 44' }, { rotation: 120, svgOrigin: '48 44', duration: 1.2, ease: 'none' })
            .fromTo(lightEl, { opacity: 1 }, { opacity: 0.15, duration: 0.6, ease: 'steps(1)' }, 0);
        },
        move() {},
        leave() {
          tl?.kill(); tl = null;
          gsap.to(rotor, { rotation: 0, svgOrigin: '48 44', duration: 0.4, overwrite: true });
          gsap.to(lightEl, { opacity: 1, duration: 0.3, overwrite: true });
        },
      };
    },
  });

  /* ================= A: Shaded object ================= */

  // One big turbine, free on the ground, in fog light.
  const A = { ...tg([64, 110], 1), sea: true };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [17, -1, 94, 117],
    idea: 'One turbine from the toy as a live model: dark paint against the toy\'s cold blue night fog, its edges lit by the fog. The toy\'s proportions: a big rotor on a tapered tower, a box nacelle, dark red blade tips, a muted yellow foot with its platform lip, and the steady red tower lamps halfway up. The nacelle runs back from the hub with the red aviation lamp on its roof, blooming wide as in the toy. On enter the rotor spins up and the light blinks once a second; the rotor yaws to face the pointer; a fast pointer is a gust that spins it harder, and a faint disc shows the blur. On leave it coasts to a stop and turns back.',
    art(svg, u) {
      svg.innerHTML = `<defs>${turbineDefs(u)}</defs>${turbineMarkup(u, A)}`;
      return turbine(svg, u, A);
    },
    emblem: `${EMB_HEAD}<ellipse cx="64" cy="110" rx="26" ry="6" fill="#9a9a9a"/>${turbineEmblem(A)}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The block is a slab of sea; the faces show water and sand.
  const CY = 90, HALF = 24, T = 14;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const [N, E, S, W] = D_TOP;
  const down = (p, t = T) => [p[0], p[1] + t];
  // Bold wave bands run across the water top.
  const D_WAVES = [-13, 13].map(y => poly([iso(-HALF, y - 2.5), iso(HALF, y - 2.5), iso(HALF, y + 2.5), iso(-HALF, y + 2.5)]));
  const D = tg(iso(0, 0), 0.74);
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [19, 7, 90, 121],
    idea: 'The block is a slab of the toy\'s dark night sea: a fog-lit water top with two wave bands, deep water over a sand bed on the faces, a rim on the top edges. The live turbine stands in the middle on its muted yellow foot, in a pool of fog light. The rotor spins up on enter, yaws to the pointer, takes gusts from a fast pointer, and the red light blinks.',
    art(svg, u) {
      svg.innerHTML = `<defs>${turbineDefs(u)}${blur(`${u}s`, 2.6)}
          ${lg(`${u}water`, [[0, 'oklch(0.52 0.05 240)'], [1, 'oklch(0.36 0.05 250)']], 'x1="0.3" y1="0" x2="0.6" y2="1"')}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 290)" opacity="0.5" filter="url(#${u}s)" transform="translate(0 4)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="oklch(0.32 0.045 248)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="oklch(0.22 0.04 252)"/>
        <path d="${poly([down(W, T - 5), down(S, T - 5), down(S), down(W)])}" fill="oklch(0.5 0.06 75)"/>
        <path d="${poly([down(S, T - 5), down(E, T - 5), down(E), down(S)])}" fill="oklch(0.36 0.05 65)"/>
        <path d="${poly(D_TOP)}" fill="url(#${u}water)"/>
        ${D_WAVES.map(d => `<path d="${d}" fill="oklch(0.66 0.04 235)" opacity="0.5"/>`).join('')}
        <path d="${poly(D_TOP)}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        ${turbineMarkup(u, D)}`;
      return turbine(svg, u, D);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/>${D_WAVES.map(d => `<path d="${d}" fill="#5a5a5a"/>`).join('')}${turbineEmblem(D)}</svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = 'Wind farm';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-windfarm';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `windfarm-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
