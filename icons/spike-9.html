<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 9</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 clamp(28px, 4vw, 44px); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- Magnet balls: a light and shade layer over flat halves. -->
    <radialGradient id="m-shade" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.32" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="m-cu" cx="0.36" cy="0.3" r="0.75">
      <stop offset="0" style="stop-color: oklch(0.9 0.08 60)"/>
      <stop offset="0.42" style="stop-color: oklch(0.66 0.15 48)"/>
      <stop offset="1" style="stop-color: oklch(0.38 0.1 38)"/>
    </radialGradient>
    <radialGradient id="m-bl" cx="0.36" cy="0.3" r="0.75">
      <stop offset="0" style="stop-color: oklch(0.86 0.07 240)"/>
      <stop offset="0.42" style="stop-color: oklch(0.55 0.16 255)"/>
      <stop offset="1" style="stop-color: oklch(0.3 0.1 262)"/>
    </radialGradient>
    <!-- Heat putty: cool violet body and the warm print. -->
    <linearGradient id="p-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.6 0.17 305)"/>
      <stop offset="1" style="stop-color: oklch(0.36 0.14 293)"/>
    </linearGradient>
    <linearGradient id="p-slab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.56 0.17 305)"/>
      <stop offset="1" style="stop-color: oklch(0.38 0.15 295)"/>
    </linearGradient>
    <radialGradient id="p-warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color: oklch(0.92 0.08 65)"/>
      <stop offset="0.45" style="stop-color: oklch(0.74 0.19 355)"/>
      <stop offset="1" style="stop-color: oklch(0.62 0.21 330)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p-hand" gradientUnits="userSpaceOnUse" cx="70" cy="84" r="66">
      <stop offset="0" style="stop-color: oklch(0.92 0.08 65)"/>
      <stop offset="0.4" style="stop-color: oklch(0.76 0.18 355)"/>
      <stop offset="1" style="stop-color: oklch(0.6 0.21 328)"/>
    </radialGradient>
  </defs>
</svg>

<h1>Icon spike 9</h1>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2, PI = Math.PI;
  const BG = 'oklch(0.16 0.012 275)';
  const f = n => +(+n).toFixed(2);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const deg = r => (r * 180) / PI;
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };
  // Marching squares trace the level line of fn over a box.
  const contour = (fn, x0, y0, x1, y1, nx, ny, lvl) => {
    const W = nx + 1, val = new Float32Array(W * (ny + 1));
    const X = i => x0 + ((x1 - x0) * i) / nx, Y = j => y0 + ((y1 - y0) * j) / ny;
    for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) val[j * W + i] = fn(X(i), Y(j)) - lvl;
    let d = '';
    const P = (i, j) => `${f(X(i))} ${f(Y(j))}`;
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const a = val[j * W + i], b = val[j * W + i + 1], c = val[(j + 1) * W + i + 1], e = val[(j + 1) * W + i];
      const ps = [];
      if ((a > 0) !== (b > 0)) ps.push([i + a / (a - b), j]);
      if ((b > 0) !== (c > 0)) ps.push([i + 1, j + b / (b - c)]);
      if ((c > 0) !== (e > 0)) ps.push([i + 1 - c / (c - e), j + 1]);
      if ((e > 0) !== (a > 0)) ps.push([i, j + 1 - e / (e - a)]);
      for (let k = 0; k + 1 < ps.length; k += 2) d += 'M' + P(ps[k][0], ps[k][1]) + 'L' + P(ps[k + 1][0], ps[k + 1][1]);
    }
    return d;
  };

  // Magnet colours: the toy's copper and blue poles.
  const CU = 'oklch(0.68 0.15 50)', BL = 'oklch(0.56 0.16 255)', CREAM = 'oklch(0.93 0.03 80)';
  // Putty heat runs violet, magenta, pink, then cream.
  const HEAT = [[0.5, 0.16, 300], [0.62, 0.21, 330], [0.75, 0.19, 356], [0.91, 0.08, 425]];
  const warm = t => {
    const x = clamp(t, 0, 1) * (HEAT.length - 1), k = Math.min(HEAT.length - 2, Math.floor(x)), s = x - k;
    const [a, b] = [HEAT[k], HEAT[k + 1]];
    return `oklch(${f(lerp(a[0], b[0], s))} ${f(lerp(a[1], b[1], s))} ${f(lerp(a[2], b[2], s) % 360)})`;
  };
  const LABEL = { A: 'Shaded object', B: 'Stencil cut-out', C: 'Single-weight line', D: 'Isometric block', E: 'Abstract mark' };

  const DIRS = [];

  /* ================= Magnet balls ================= */

  // Current: the menu icon, copied with its hover.
  DIRS.push({
    toy: 'magnet', l: 'Current', file: '../shared/emblems/magnet.svg',
    art(svg, u) {
      svg.innerHTML = `<radialGradient id="${u}mb" cx="0.34" cy="0.3" r="0.75"><stop offset="0" stop-color="oklch(0.86 0.13 30)"/><stop offset="0.4" stop-color="oklch(0.64 0.22 27)"/><stop offset="1" stop-color="oklch(0.38 0.15 22)"/></radialGradient><g></g>`;
      const ring = svg.querySelector('g');
      const MAG = [[0, 0]];
      for (let r = 1; r <= 2; r++) for (let side = 0; side < 6; side++) for (let k = 0; k < r; k++) {
        const a = (side * TAU) / 6, b = ((side + 2) * TAU) / 6;
        MAG.push([r * Math.cos(a) + k * Math.cos(b), r * Math.sin(a) + k * Math.sin(b)]);
      }
      const balls = MAG.map(([p, q]) => {
        const x = 64 + p * 21, y = 64 + q * 21, g = el('g', {}, ring);
        el('circle', { cx: x, cy: y, r: 11.5, style: 'fill: var(--bg)' }, g);
        el('circle', { cx: x, cy: y, r: 9.4, fill: `url(#${u}mb)` }, g);
        el('circle', { cx: x - 3.2, cy: y - 3.6, r: 2.2, fill: 'oklch(0.98 0.03 40 / 0.9)' }, g);
        return { g, p, q };
      });
      const G = balls.map(b => b.g);
      return hoverLoop(
        () => gsap.timeline({ repeat: -1, repeatDelay: 0.25 })
          .to(G, { x: i => balls[i].p * 7, y: i => balls[i].q * 7, duration: 0.35, ease: 'power2.out' })
          .to(G, { x: 0, y: 0, duration: 0.55, ease: 'elastic.out(1.1, 0.35)', stagger: { each: 0.015, from: 'edges' } }),
        () => gsap.to(G, { x: 0, y: 0, duration: 0.3, overwrite: true }));
    },
  });

  // A: a chain of two-tone balls; the pointer leads its free end.
  {
    const R = 8, L = 2 * R;
    // Rest pose: a loose coil, outer end pinned, inner end free.
    const raw = Array.from({ length: 1601 }, (_, k) => { const t = k / 1600, a = -PI * 0.75 + t * TAU * 1.3, rr = 47 - t * 31; return [64 + rr * Math.cos(a), 64 + rr * Math.sin(a)]; });
    const REST = [raw[0]];
    for (const p of raw) { const q = REST[REST.length - 1]; if (Math.hypot(p[0] - q[0], p[1] - q[1]) >= L) REST.push(p); }
    const N = REST.length;
    // A ball's copper pole faces the next ball in the chain.
    const axis = (P, i) => { const a = P[i < N - 1 ? i : i - 1], b = P[i < N - 1 ? i + 1 : i]; return Math.atan2(b[1] - a[1], b[0] - a[0]); };
    DIRS.push({
      toy: 'magnet', l: 'A',
      art(svg) {
        const balls = REST.map(() => {
          const g = el('g', {}, svg);
          el('circle', { r: R + 1.1, fill: BG }, g);
          const spin = el('g', {}, g);
          el('circle', { r: R, fill: BL }, spin);
          el('path', { d: `M0 ${-R}A${R} ${R} 0 0 1 0 ${R}Z`, fill: CU }, spin);
          el('line', { x1: 0, y1: -R, x2: 0, y2: R, stroke: BG, 'stroke-width': 1.1 }, spin);
          el('circle', { r: R, fill: 'url(#m-shade)' }, g);
          el('circle', { cx: f(-R * 0.36), cy: f(-R * 0.42), r: f(R * 0.2), fill: '#fff', 'fill-opacity': 0.85 }, g);
          return { g, spin };
        });
        const P = REST.map(p => [p[0], p[1]]);
        const draw = () => balls.forEach((b, i) => {
          b.g.setAttribute('transform', `translate(${f(P[i][0])} ${f(P[i][1])})`);
          b.spin.setAttribute('transform', `rotate(${f(deg(axis(P, i)))})`);
        });
        draw();
        // Two passes of FABRIK keep every link one ball long.
        const place = (a, b) => { const dx = a[0] - b[0], dy = a[1] - b[1], d = Math.hypot(dx, dy) || 1e-6; a[0] = b[0] + (dx * L) / d; a[1] = b[1] + (dy * L) / d; };
        const T = [0, 0];
        let on = false, settle = null;
        const tick = () => {
          const H = P[N - 1];
          H[0] += (T[0] - H[0]) * 0.32; H[1] += (T[1] - H[1]) * 0.32;
          for (let i = N - 2; i >= 0; i--) place(P[i], P[i + 1]);
          P[0][0] = REST[0][0]; P[0][1] = REST[0][1];
          for (let i = 1; i < N; i++) place(P[i], P[i - 1]);
          draw();
        };
        const aim = p => { T[0] = clamp(p[0], 12, 116); T[1] = clamp(p[1], 12, 116); };
        return {
          enter(p) { settle?.kill(); aim(p || [112, 112]); if (!on) { on = true; gsap.ticker.add(tick); } },
          move(p) { if (p) aim(p); },
          leave() {
            on = false; gsap.ticker.remove(tick);
            const from = P.map(p => p.slice()), st = { t: 0 };
            settle = gsap.to(st, { t: 1, duration: 1.1, ease: 'elastic.out(1, 0.5)', onUpdate() {
              P.forEach((p, i) => { p[0] = lerp(from[i][0], REST[i][0], st.t); p[1] = lerp(from[i][1], REST[i][1], st.t); });
              draw();
            } });
          },
        };
      },
      emblem: emb(REST.map((p, i) => {
        const a = deg(axis(REST, i)), r = R + 1;
        return `<g transform="translate(${f(p[0])} ${f(p[1])}) rotate(${f(a)})"><circle r="${f(r + 1.6)}" fill="#000"/><circle r="${f(r)}" fill="#fff"/><path d="M0 ${f(-r)}V${f(r)}" stroke="#000" stroke-width="2.2"/></g>`;
      }).join('\n')),
    });
  }

  // B: a two-tone plate with the dipole field cut through; it turns to the pointer.
  {
    const LOOPS = [14, 24, 37, 56, 84];
    // A field line r = k sin²θ, drawn above and below the axis.
    const loopD = k => {
      const up = [], dn = [];
      for (let s = 0; s <= 72; s++) {
        const th = (s / 72) * PI, r = k * Math.sin(th) ** 2;
        up.push(`${f(64 + r * Math.cos(th))} ${f(64 - r * Math.sin(th))}`);
        dn.push(`${f(64 + r * Math.cos(th))} ${f(64 + r * Math.sin(th))}`);
      }
      return 'M' + up.join('L') + 'M' + dn.join('L');
    };
    const FIELD = LOOPS.map(loopD).join('');
    DIRS.push({
      toy: 'magnet', l: 'B',
      art(svg, u) {
        svg.innerHTML = `
          <clipPath id="${u}c"><rect x="9" y="9" width="110" height="110" rx="8"/></clipPath>
          <g clip-path="url(#${u}c)">
            <g class="rot">
              <rect x="-60" y="-60" width="124" height="248" fill="${BL}"/>
              <rect x="64" y="-60" width="124" height="248" fill="${CU}"/>
              <path d="${FIELD}" fill="none" stroke="${BG}" stroke-width="2.8" stroke-linecap="round"/>
              <circle cx="64" cy="64" r="12" fill="${BG}"/>
              <circle cx="64" cy="64" r="8" fill="${CREAM}"/>
              <path d="M64 55V73" stroke="${BG}" stroke-width="2"/>
            </g>
            <rect x="9" y="9" width="110" height="110" fill="url(#lit)" opacity="0.45"/>
          </g>`;
        const G = svg.querySelector('.rot');
        gsap.set(G, { svgOrigin: '64 64', rotation: 0 });
        const turn = (a, o) => gsap.to(G, { rotation: `${f(a)}_short`, svgOrigin: '64 64', overwrite: true, ...o });
        const aim = p => { if (p && Math.hypot(p[0] - 64, p[1] - 64) > 6) turn(deg(Math.atan2(p[1] - 64, p[0] - 64)), { duration: 0.5, ease: 'power3.out' }); };
        return { enter: p => (p ? aim(p) : turn(-50, { duration: 0.6, ease: 'power3.out' })), move: aim, leave: () => turn(0, { duration: 1.1, ease: 'elastic.out(1, 0.5)' }) };
      },
      emblem: emb(`
        <rect x="9" y="9" width="110" height="110" rx="8" fill="#fff"/>
        <path d="${FIELD}" fill="none" stroke="#000" stroke-width="4.4" stroke-linecap="round"/>
        <circle cx="64" cy="64" r="14" fill="#000"/>
        <circle cx="64" cy="64" r="8.5" fill="#fff"/>
        <path d="M64 54V74" stroke="#000" stroke-width="2.8"/>
      `),
    });
  }

  // C: a ring of twelve balls in one line; hover sends a flip wave around it.
  {
    const N = 12, r = 9, RR = r / Math.sin(PI / N);
    const POS = Array.from({ length: N }, (_, i) => { const a = (i * TAU) / N - PI / 2; return [64 + RR * Math.cos(a), 64 + RR * Math.sin(a), deg(a) + 90]; });
    DIRS.push({
      toy: 'magnet', l: 'C',
      art(svg) {
        const line = { fill: 'none', 'stroke-width': 1.6, 'stroke-linecap': 'round' };
        const G = POS.map(() => {
          const g = el('g', {}, svg);
          el('path', { d: `M0 ${-r}A${r} ${r} 0 0 1 0 ${r}`, stroke: CU, ...line }, g);
          el('path', { d: `M0 ${r}A${r} ${r} 0 0 1 0 ${-r}`, stroke: BL, ...line }, g);
          el('path', { d: `M0 ${f(-r + 2.6)}V${f(r - 2.6)}`, stroke: CREAM, ...line }, g);
          return g;
        });
        const st = POS.map(() => ({ a: 0 }));
        const draw = () => G.forEach((g, i) => g.setAttribute('transform', `translate(${f(POS[i][0])} ${f(POS[i][1])}) rotate(${f(POS[i][2] + st[i].a)})`));
        draw();
        return hoverLoop(
          () => {
            const tl = gsap.timeline({ repeat: -1, onUpdate: draw });
            st.forEach((s, i) => tl.fromTo(s, { a: 0 }, { a: 360, duration: 0.7, ease: 'power2.inOut' }, i * 0.07));
            return tl.to({}, { duration: 0.4 });
          },
          () => gsap.to(st, { a: i => (st[i].a % 360 > 180 ? 360 : 0), duration: 0.4, ease: 'power2.out', overwrite: true, onUpdate: draw, onComplete() { st.forEach(s => (s.a = 0)); draw(); } }));
      },
      emblem: emb(POS.map(([x, y, a]) => `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(a)})"><circle r="${r}" fill="none" stroke="#fff" stroke-width="4.2"/><path d="M0 ${-r}V${r}" stroke="#fff" stroke-width="3.4"/></g>`).join('\n')),
    });
  }

  // D: a cube of balls with three faces; hover lifts the balls in a wave from the front corner.
  {
    const E = 60, O = [64, 4];
    const U = [E * 0.866, E * 0.5], V = [-E * 0.866, E * 0.5], H = [0, E];
    const add = (...ps) => ps.reduce((a, b) => [a[0] + b[0], a[1] + b[1]], [0, 0]);
    const neg = p => [-p[0], -p[1]];
    // Each face maps a 100 by 100 square onto the cube.
    const FACES = [
      { o: O, s: U, t: V, n: [0, -1], fill: 'url(#m-bl)', shade: 0 },
      { o: add(O, V), s: U, t: H, n: [-0.866, 0.5], fill: 'url(#m-cu)', shade: 0.18 },
      { o: add(O, U, V), s: neg(V), t: H, n: [0.866, 0.5], fill: 'url(#m-cu)', shade: 0.42 },
    ];
    const mtx = F => `matrix(${f(F.s[0] / 100)} ${f(F.s[1] / 100)} ${f(F.t[0] / 100)} ${f(F.t[1] / 100)} ${f(F.o[0])} ${f(F.o[1])})`;
    const quad = F => poly([F.o, add(F.o, F.s), add(F.o, F.s, F.t), add(F.o, F.t)]);
    const CELLS = [];
    FACES.forEach((F, fi) => { for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++) CELLS.push({ fi, x: 16.67 + i * 33.33, y: 16.67 + j * 33.33 }); });
    // The wave starts at the front corner, nearest the viewer.
    const FRONT = add(O, U, V);

            </g>
          </g>
          <path d="${EDGES}" fill="none" stroke="${BG}" stroke-width="1.6" stroke-linejoin="round"/>`;
        const all = s => [...svg.querySelectorAll(s)];
        const mk = all('.mk'), drips = all('.drip'), B = BANDS.map((_, b) => all(`.b${b}`));
        const heat = () => {
          BANDS.forEach(([, w], b) => gsap.set(B[b], { attr: { 'stroke-width': w }, opacity: 1 }));
          drips.forEach((d, i) => gsap.set(d, { attr: { height: DRIP[i] + 7 } }));
        };
        return hoverLoop(
          () => gsap.timeline({ repeat: -1, repeatDelay: 0.3 })
            .to(B[2], { attr: { 'stroke-width': 0 }, duration: 0.4, ease: 'power1.in' })
            .to(B[1], { attr: { 'stroke-width': 0 }, duration: 0.6, ease: 'power1.in' }, 0.2)
            .to(B[0], { opacity: 0.35, duration: 0.9, ease: 'power1.in' }, 0.3)
            .to(drips, { attr: { height: 0 }, duration: 0.8, ease: 'power1.in' }, 0.2)
            .set(mk, { attr: { 'stroke-dashoffset': 1 } }, '+=0.25')
            .call(() => { heat(); gsap.set(drips, { attr: { height: 0 } }); })
            .to(mk, { attr: { 'stroke-dashoffset': 0 }, duration: 0.55, ease: 'power2.in', stagger: 0.12 })
            .to(drips, { attr: { height: i => DRIP[i] + 7 }, duration: 0.5, ease: 'power2.out', stagger: 0.12 }, '-=0.3'),
          () => { gsap.killTweensOf([...mk, ...drips, ...B.flat()]); heat(); gsap.set(mk, { attr: { 'stroke-dashoffset': 0 } }); });
      },
      emblem: emb(`
        <clipPath id="t"><rect x="0" y="0" width="100" height="100"/></clipPath>
        <path d="${poly([T0, T1, dn(T1), dn(T2), dn(T3), T3])}" fill="#fff"/>
        <path d="${EDGES}" fill="none" stroke="#000" stroke-width="2.6" stroke-linejoin="round"/>
        <g transform="${TOP}" clip-path="url(#t)">${GU.map(g => `<path d="${groove(g)}" fill="none" stroke="#000" stroke-width="14" stroke-linecap="round"/>`).join('')}</g>
        <g transform="${LEFT}">${GU.map((g, i) => `<rect x="${g - 6.5}" y="-7" width="13" height="${DRIP[i] + 7}" rx="6.5" fill="#000"/>`).join('')}</g>
      `),
    });
  }

  // E: a fingerprint whorl; ridges near the pointer warm, then cool slowly.
  {
    const CX = 64, CY = 66, NR = 7, K = 1.15;
    const GAPS = [70, 205, 330, 120];
    const ridge = k => {
      const rx = 7 + 7.2 * k, ry = rx * K, pts = [];
      let a0, a1;
      if (k < 4) { a0 = GAPS[k] + 22; a1 = GAPS[k] + 360 - 22; } else { a0 = 150; a1 = 390; }
      const n = Math.ceil((a1 - a0) / 6);
      for (let s = 0; s <= n; s++) { const a = ((a0 + ((a1 - a0) * s) / n) * PI) / 180; pts.push(`${f(CX + rx * Math.cos(a))} ${f(CY + ry * Math.sin(a))}`); }
      return 'M' + pts.join('L');
    };
    const RIDGES = Array.from({ length: NR }, (_, k) => ridge(k));
    const BASE = RIDGES.map((_, k) => clamp(0.8 * (1 - k / 4), 0, 1));
    DIRS.push({
      toy: 'putty', l: 'E',
      art(svg) {
        const P = RIDGES.map(d => el('path', { d, fill: 'none', 'stroke-width': 4.2, 'stroke-linecap': 'round' }, svg));
        const w = BASE.map(b => ({ v: b }));
        const draw = () => P.forEach((p, k) => p.setAttribute('stroke', warm(w[k].v)));
        draw();
        const heat = p => {
          const rho = Math.hypot(p[0] - CX, (p[1] - CY) / K), kp = (rho - 7) / 7.2;
          w.forEach((s, k) => gsap.to(s, { v: Math.max(BASE[k], 1 - Math.abs(k - kp) / 1.7), duration: 0.3, ease: 'power2.out', overwrite: true, onUpdate: draw }));
        };
        return {
          enter: p => heat(p || [CX + 25, CY]),
          move: p => p && heat(p),
          leave: () => w.forEach((s, k) => gsap.to(s, { v: BASE[k], duration: 1.6, ease: 'power1.out', overwrite: true, onUpdate: draw })),
        };
      },
      emblem: emb(`<path d="${RIDGES.join('')}" fill="none" stroke="#fff" stroke-width="5.4" stroke-linecap="round"/>`),
    });
  }

  /* ================= Gallery ================= */

  const NAMES = { magnet: 'Magnet balls', putty: 'Heat putty' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = svg => {
    const b = svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const cur = D.l === 'Current';
      const file = `${toy}-${D.l.toLowerCase()}`;
      const src = cur ? D.file : `spike/emblems/${file}.svg`;
      if (!cur) window.EMBLEMS[file] = D.emblem;
      const label = cur ? 'Current' : `${D.l} · ${LABEL[D.l]}`;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${cur ? '<b>Current</b>' : `<b>${D.l}</b><span>· ${LABEL[D.l]}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${label}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${label}, 64"></div></div>
        <div class="emb"><div class="flash"><i style="--emblem: url(${src})"></i></div><div class="glass"><i style="--emblem: url(${src})"></i></div></div>`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg);
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
