/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);

  --line: oklch(0.26 0.014 275);

  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>

        const ringish = r => { const d = Math.hypot(r.m[0] - BXL[0], r.m[1] - BXL[1]); return d > 14 && d < 40; };
        const gj = el('g', {}, T.g);
        const jams = roads.filter(r => r.c === 0).map(r => el('path', { d: pathD(r.a), fill: 'none', stroke: ok(JAM, 1.15), 'stroke-width': 1.5, 'stroke-dasharray': '0.9 1.6', 'stroke-linecap': 'round', opacity: 0, 'data-ring': ringish(r) ? 1 : 0 }, gj));
        T.grain();
        roads.forEach(r => paint(r, SOD, r.c ? 0.7 : 1));
        const st = { k: 0, crawl: 0 };
        const draw = () => jams.forEach(j => {
          const ring = j.dataset.ring === '1', k = clamp(st.k * (ring ? 1.4 : 0.8) - (ring ? 0 : 0.3), 0, 1);
          set(j, { opacity: f(k), 'stroke-dashoffset': f(-st.crawl * (ring ? 0.6 : 1)) });
        });
        let tl, crawl;
        return {
          enter() { tl?.kill(); crawl?.kill(); crawl = gsap.to(st, { crawl: 400, duration: 120, ease: 'none', onUpdate: draw }); tl = gsap.to(st, { k: 1, duration: 2.2, ease: 'sine.inOut', onUpdate: draw }); },
          move() {}, leave() { tl?.kill(); tl = gsap.to(st, { k: 0, duration: 0.8, onUpdate: draw, onComplete: () => crawl?.kill() }); },
        };
      },
      emblem: () => `${EMB_HEAD}${GEO.bxl.filter(([c]) => c === 0).map(([c, a]) => `<path d="${pathD(a)}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 2.6" stroke-linecap="round"/>`).join('')}</svg>\n`,
    },
    {
      l: 'C', name: 'Mechelen blackout',
      idea: 'Mechelen close: the E19 sweeping past the R6 and R12, where the toy starts. On hover a fault drops the grid in a ragged front, it sits dark a beat with only the cars left, then relights.',
      art(svg, id) {
        const T = tile(svg, id), roads = roadLayers(T.g, T.glow, GEO.mech, { core: 1.3, halo: 3.6, lampGap: 3.6 });
        // Cars: tail lights only, a few specks on the motorway that keep going in the dark.
        const gcar = el('g', {}, T.g), mot = roads.filter(r => r.c === 0 && r.a.length > 6);
        const cars = Array.from({ length: 14 }, (_, i) => ({ r: mot[i % mot.length], u: (i * 0.37) % 1, e: el('circle', { r: 0.7, fill: ok(JAM, 1.2) }, gcar) }));
        T.grain();
        const at = (a, u) => { const n = a.length / 2 - 1, x = u * n, i = Math.min(n - 1, Math.floor(x)), t = x - i; return [a[i * 2] + (a[i * 2 + 2] - a[i * 2]) * t, a[i * 2 + 1] + (a[i * 2 + 3] - a[i * 2 + 1]) * t]; };
        const st = { cut: -1, back: -1, run: 0 };
        const draw = () => {
          roads.forEach(r => {
            const front = (r.m[0] - 14) / 100 + 0.12 * Math.sin(r.m[1] * 0.3);
            let lv = 1, col = SOD;
            if (st.cut >= 0 && st.cut > front) lv = st.cut - front < 0.06 ? (Math.sin((st.cut - front) * 300) > 0 ? 1 : 0.2) : 0;
            if (st.back >= 0) { const t = st.back - (1 - (r.m[0] - 14) / 100) * 0.6; if (t > 0) { const w = clamp(t / 0.9, 0, 1); lv = 0.25 + 0.75 * w * w; col = warm(w); } }
            paint(r, col, r.c ? lv * 0.7 : lv);
          });
          cars.forEach(c => { const p = at(c.r.a, (c.u + st.run) % 1); set(c.e, { cx: f(p[0]), cy: f(p[1]) }); });
        };
        draw();
        let tl, run;
        return {
          enter() {
            tl?.kill(); run?.kill();
            run = gsap.to(st, { run: 30, duration: 300, ease: 'none', onUpdate: draw });
            st.cut = 0; st.back = -1;
            tl = gsap.timeline({ onUpdate: draw }).to(st, { cut: 1.3, duration: 1.1, ease: 'none' }).set(st, { back: 0 }, '+=0.7').to(st, { back: 1.6, duration: 1.8, ease: 'none' });
          },
          move() {}, leave() { tl?.kill(); st.cut = -1; st.back = -1; draw(); },
        };
      },
      emblem: () => `${EMB_HEAD}${GEO.mech.filter(([c]) => c < 2 || c === 4).map(([c, a]) => `<path d="${pathD(a)}" fill="none" stroke="#fff" stroke-width="${c === 0 ? 3.4 : 1.6}" stroke-linecap="round" stroke-linejoin="round" opacity="${c === 0 ? 1 : 0.6}"/>`).join('')}</svg>\n`,
    },
    {
      l: 'D', name: 'Lamps only',
      idea: 'Brussels as the toy shows it from orbit: no lines, only lamp specks strung along the roads, haloed. On hover the camera drops: specks spread into ribbons and the ring swells.',
      art(svg, id) {
        const T = tile(svg, id), roads = roadLayers(T.g, T.glow, GEO.bxl, { core: 0, halo: 2.2, lampGap: 2.2 }); T.grain();
        const zg = el('g', {}, T.g); zg.append(...[...T.g.childNodes].filter(n => n !== zg && n.tagName !== 'rect'));
        const st = { k: 0 };
        const draw = () => {
          roads.forEach(r => { paint(r, SOD, r.c ? 0.55 : 1); set(r.k, { 'stroke-width': f(st.k * 1.1 * (r.c ? 0.6 : 1)) }); });
          const s = 1 + 0.55 * st.k;
          zg.setAttribute('transform', `translate(${f(BXL[0])} ${f(BXL[1])}) scale(${f(s)}) translate(${f(-BXL[0])} ${f(-BXL[1])})`);
        };
        draw();
        let tl;
        return { enter() { tl?.kill(); tl = gsap.to(st, { k: 1, duration: 1.4, ease: 'power2.inOut', onUpdate: draw }); }, move() {}, leave() { tl?.kill(); tl = gsap.to(st, { k: 0, duration: 0.9, ease: 'power2.inOut', onUpdate: draw }); } };
      },
      emblem: () => `${EMB_HEAD}${GEO.bxl.filter(([c]) => c === 0).map(([c, a]) => `<path d="${pathD(a)}" fill="none" stroke="#fff" stroke-width="2.6" stroke-dasharray="0.1 3.2" stroke-linecap="round"/>`).join('')}</svg>\n`,
    },
  ];
  /* ================= Gallery ================= */

  const NAME = 'Lit motorway';
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : { x: 14, y: 14, width: 100, height: 100 }, side = Math.max(b.width, b.height);
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-motorway';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `motorway1-${D.l.toLowerCase()}`;
    const url = `spike/emblems/${file}.svg`;
    window.EMBLEMS[file] = D.emblem();
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header><b>${D.l}</b><span>· ${D.name}</span></header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      <div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>
      <p class="idea">${D.idea}</p>`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
