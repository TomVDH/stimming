<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Spillway 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Spillway 1</h1>
<p class="lede">Spillway, round 1. The toy is not built; this is an icon only. A: the dam wall from downstream, three gates, white sheets into foam. D: the gorge is the block, the reservoir on top and the dam on its right face.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The toy's tokens: pale concrete, white water, deep reservoir, gorge rock.
  const CONCRETE = [[0, 'oklch(0.86 0.01 85)'], [1, 'oklch(0.56 0.012 80)']];
  const WATER = [[0, 'oklch(0.98 0.015 220)'], [1, 'oklch(0.86 0.05 225)']];
  const LAKE = [[0, 'oklch(0.5 0.09 232)'], [1, 'oklch(0.3 0.07 245)']];
  const GATE = 'oklch(0.22 0.02 240)', CREST = 'oklch(0.9 0.008 85)', FOAM = 'oklch(0.97 0.012 220)';
  const STREAK = 'oklch(1 0 0)';

  // The gates' state, shared by A and D.
  // The pointer over a gate opens it wide; its neighbours open a little.
  // Hover lifts mist off the plunge pool. At rest the gates run half open.
  const REST = 0.42;
  const flow = (draw, gateAt) => {
    const st = { g: [REST, REST, REST], to: [REST, REST, REST], t: 0, mist: 0, mistTo: 0, live: false };
    const step = time => {
      st.t = time;
      for (let i = 0; i < 3; i++) st.g[i] += (st.to[i] - st.g[i]) * 0.09;
      st.mist += (st.mistTo - st.mist) * 0.06;
      draw(st);
      // The clock stops once the gates and the mist rest.
      const off = st.g.reduce((a, g, i) => a + Math.abs(g - st.to[i]), 0) + st.mist;
      if (!st.live && off < 0.01) { st.g = [REST, REST, REST]; st.mist = 0; st.t = 0; draw(st); loop.stop(); }
    };
    const loop = clock(step);
    draw(st);
    return {
      enter(p) {
        st.live = true; st.mistTo = 1; st.to = [0.7, 0.7, 0.7]; loop.start();
        if (p) this.move(p);
      },
      move(p) {
        if (!p) return;
        const k = gateAt(p);
        st.to = [0, 1, 2].map(i => 0.4 + 0.6 * Math.exp(-((i - k) ** 2) / 0.4));
      },
      leave() { st.live = false; st.to = [REST, REST, REST]; st.mistTo = 0; loop.start(); },
    };
  };
  // A falling sheet's streaks scroll down while the clock runs.
  const streakDash = (path, t, open) => {
    path.setAttribute('stroke-dashoffset', f(-t * 55));
    path.setAttribute('opacity', f(0.2 + 0.4 * open));
  };
  // Mist: three soft puffs that rise off the pool and fade, in turn.
  const mistDraw = (puffs, st, base, rise) => puffs.forEach((m, i) => {
    const ph = (st.t * 0.45 + i / 3) % 1;
    m.setAttribute('cy', f(base - rise * ph));
    m.setAttribute('opacity', f(st.mist * 0.55 * Math.sin(Math.PI * ph)));
  });

  // A foam puff: three balls that overlap, so the puffs merge into one cloud.
  const puff = (x, y, u, extra = '') => `<g class="fo" ${extra} data-x="${f(x)}" data-y="${f(y)}" fill="url(#${u}foam)"><circle cx="-0.62" cy="0.22" r="0.78"/><circle cx="0.6" cy="0.28" r="0.72"/><circle cx="0" cy="-0.28" r="1"/></g>`;
  const sizePuff = (c, r) => c.setAttribute('transform', `translate(${c.dataset.x} ${c.dataset.y}) scale(${f(r)})`);

  const DIRS = [];

  /* ================= Current ================= */

  // Spillway is not built; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NOT BUILT</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // The dam wall from downstream: a curved crest, the wall narrowing into the gorge.
  const crestY = x => { const s = (x - 16) / 96; return 28 + 32 * s * (1 - s); };
  const A_WALL = 'M16 28Q64 44 112 28L97 104Q64 110 31 104Z';
  const A_ROAD = 'M16 28Q64 44 112 28L111.4 34Q64 50 16.6 34Z';
  const A_GX = [40, 64, 88];
  const A_NOTCH = A_GX.map(x => poly([[x - 6.5, crestY(x - 6.5) - 1], [x + 6.5, crestY(x + 6.5) - 1], [x + 6.5, crestY(x + 6.5) + 9], [x - 6.5, crestY(x - 6.5) + 9]]));
  // A sheet from a gate to the foot, drawn in toward the narrow base.
  const A_BASE = 104;
  const aFoot = x => 64 + (x - 64) * 0.62;
  const aSheet = (x, open) => {
    const y0 = crestY(x) + 8, hw = 2 + 4.6 * open, bx = aFoot(x);
    return `M${f(x - hw)} ${f(y0)}L${f(x + hw)} ${f(y0)}L${f(bx + hw * 1.45)} ${A_BASE}L${f(bx - hw * 1.45)} ${A_BASE}Z`;
  };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [15, 22, 98, 94],
    idea: 'The dam wall from downstream: a pale concrete face that curves at the crest and narrows into the gorge. Three gates in the crest let white sheets of water run down the face into a pile of foam. At rest the gates run half open. The pointer over a gate opens it wide; the sheet thickens and races, and the foam swells. Hover lifts mist off the plunge pool.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}m`, 4)}
          ${lg(`${u}con`, CONCRETE)}${lg(`${u}wat`, WATER)}
          ${lg(`${u}arch`, [[0, 'oklch(0.2 0.01 80)', 0.4], [0.3, 'oklch(0.2 0.01 80)', 0], [0.7, 'oklch(0.2 0.01 80)', 0], [1, 'oklch(0.2 0.01 80)', 0.45]], 'x1="0" y1="0" x2="1" y2="0"')}
          ${rg(`${u}foam`, [[0, FOAM], [1, 'oklch(0.84 0.03 225)']], 'cx="0.4" cy="0.3" r="0.8"')}</defs>
        <ellipse cx="64" cy="113" rx="40" ry="4" fill="oklch(0.05 0.01 240)" opacity="0.6" filter="url(#${u}b)"/>
        ${body(A_WALL, u, 'con')}
        <path d="${A_WALL}" fill="url(#${u}arch)"/>
        <path d="${A_ROAD}" fill="${CREST}"/>
        <path d="${A_NOTCH.join('')}" fill="${GATE}"/>
        <g class="sheets">${A_GX.map(() => `<path class="sh" fill="url(#${u}wat)"/><path class="st" fill="none" stroke="${STREAK}" stroke-linecap="round" stroke-dasharray="6 9"/>`).join('')}</g>
        <ellipse cx="64" cy="${A_BASE + 2}" rx="30" ry="6" fill="${FOAM}" opacity="0.5" filter="url(#${u}b)"/>
        <g class="foam">${[38, 47, 56, 64, 72, 81, 90].map((x, j) => puff(x, A_BASE + (j % 2 ? -1.5 : 1.5), u)).join('')}</g>
        <g filter="url(#${u}m)">${[48, 64, 80].map(x => `<ellipse class="mi" cx="${x}" cy="100" rx="13" ry="7" fill="${FOAM}" opacity="0"/>`).join('')}</g>`;
      const sh = [...svg.querySelectorAll('.sh')], stp = [...svg.querySelectorAll('.st')];
      const fo = [...svg.querySelectorAll('.fo')], mi = [...svg.querySelectorAll('.mi')];
      stp.forEach((p, i) => { const x = A_GX[i]; p.setAttribute('d', `M${x} ${f(crestY(x) + 10)}L${f(aFoot(x))} ${A_BASE - 2}`); });
      return flow(st => {
        A_GX.forEach((x, i) => {
          sh[i].setAttribute('d', aSheet(x, st.g[i]));
          stp[i].setAttribute('stroke-width', f(1.6 + 3 * st.g[i]));
          streakDash(stp[i], st.t, st.g[i]);
        });
        // Each foam puff swells with the gate nearest it.
        fo.forEach((c, j) => {
          const x = +c.dataset.x, k = clamp((x - 38) / 26, 0, 2);
          const g = lerp(st.g[Math.floor(k)], st.g[Math.min(2, Math.ceil(k))], k % 1);
          sizePuff(c, 3.4 + 4.6 * g + 0.5 * Math.sin(st.t * 9 + j * 2.1) * (st.t ? 1 : 0));
        });
        mistDraw(mi, st, 102, 32);
      }, p => (p[0] - 40) / 24);
    },
    emblem: `${EMB_HEAD}<path d="${A_WALL}" fill="#fff"/><path d="${A_NOTCH.join('')}" fill="#000"/>${A_GX.map(x => `<path d="${aSheet(x, REST)}" fill="#000" opacity="0.35"/>`).join('')}${[38, 47, 56, 64, 72, 81, 90].map(x => `<circle cx="${x}" cy="${A_BASE + 1}" r="5.2" fill="#fff"/>`).join('')}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The gorge is the block: the reservoir on top, rock on the left face.
  // The right face is the dam, three gates at its crest, water down its face.
  const CY = 66, HX = 18, HY = 30, T = 32;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // A point on the dam face: u runs from S to E, v runs down it.
  const onR = (u, v) => [lerp(S[0], E[0], u), lerp(S[1], E[1], u) + T * v];
  // Out from the dam face, toward the viewer.
  const outward = (p, d) => [p[0] + 0.866 * d, p[1] + 0.5 * d];
  const D_GU = [0.2, 0.5, 0.8];
  const gyOf = q => HY - 2 * HY * q;
  const D_NOTCH = D_GU.map(q => poly([iso(HX - 4, gyOf(q) - 4.6), iso(HX, gyOf(q) - 4.6), iso(HX, gyOf(q) + 4.6), iso(HX - 4, gyOf(q) + 4.6)]));
  const D_CREST = poly([iso(HX - 3.5, -HY), E, S, iso(HX - 3.5, HY)]);
  const dSheet = (u, open) => {
    const hw = 0.035 + 0.055 * open, w2 = hw * 1.3;
    return poly([onR(u - hw, 0), onR(u + hw, 0), onR(u + w2, 1), onR(u - w2, 1)]);
  };
  const D_FOAM_U = [0.08, 0.2, 0.32, 0.44, 0.56, 0.68, 0.8, 0.92];
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [21, 38, 86, 88],
    idea: 'The gorge is the block: the reservoir on the top, deep blue; gorge rock on the left face; the dam on the right face, a pale concrete wall with a crest road and three gates. White sheets run down the dam face into foam at its foot. The pointer over a gate opens it wide and the foam there swells. Hover lifts mist off the pool in front.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}m`, 3.6)}
          ${lg(`${u}lake`, LAKE, 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}con`, CONCRETE)}${lg(`${u}wat`, WATER)}
          ${lg(`${u}rock`, [[0, 'oklch(0.5 0.035 55)'], [1, 'oklch(0.33 0.03 45)']])}
          ${rg(`${u}foam`, [[0, FOAM], [1, 'oklch(0.84 0.03 225)']], 'cx="0.4" cy="0.3" r="0.8"')}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}rock)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}con)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}lit)" opacity="0.6"/>
        <path d="${top}" fill="url(#${u}lake)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="${D_CREST}" fill="${CREST}"/>
        <path d="${D_NOTCH.join('')}" fill="${GATE}"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g class="sheets">${D_GU.map(() => `<path class="sh" fill="url(#${u}wat)"/><path class="st" fill="none" stroke="${STREAK}" stroke-linecap="round" stroke-dasharray="5 8"/>`).join('')}</g>
        <g class="foam">${D_FOAM_U.map((q, j) => { const p = outward(onR(q, 1), j % 2 ? 1.5 : 4); return puff(p[0], p[1], u, `data-u="${q}"`); }).join('')}</g>
        <g filter="url(#${u}m)">${[0.25, 0.5, 0.75].map(q => { const p = outward(onR(q, 1), 7); return `<ellipse class="mi" cx="${f(p[0])}" cy="${f(p[1])}" rx="11" ry="6" fill="${FOAM}" opacity="0"/>`; }).join('')}</g>`;
      const sh = [...svg.querySelectorAll('.sh')], stp = [...svg.querySelectorAll('.st')];
      const fo = [...svg.querySelectorAll('.fo')], mi = [...svg.querySelectorAll('.mi')];
      stp.forEach((p, i) => { const a = onR(D_GU[i], 0.08), b = onR(D_GU[i], 0.96); p.setAttribute('d', `M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}`); });
      const baseY = outward(onR(0.5, 1), 7)[1];
      return flow(st => {
        D_GU.forEach((q, i) => {
          sh[i].setAttribute('d', dSheet(q, st.g[i]));
          stp[i].setAttribute('stroke-width', f(1.4 + 2.4 * st.g[i]));
          streakDash(stp[i], st.t, st.g[i]);
        });
        fo.forEach((c, j) => {
          const k = clamp((+c.dataset.u - 0.2) / 0.3, 0, 2);
          const g = lerp(st.g[Math.floor(k)], st.g[Math.min(2, Math.ceil(k))], k % 1);
          sizePuff(c, 2.6 + 3.6 * g + 0.4 * Math.sin(st.t * 9 + j * 2.1) * (st.t ? 1 : 0));
        });
        mistDraw(mi, st, baseY, 26);
      }, p => (clamp((p[0] - S[0]) / (E[0] - S[0]), 0, 1) - 0.2) / 0.3);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#3a3a3a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#5a5a5a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/><path d="${D_NOTCH.join('')}" fill="#000"/>${D_GU.map(q => `<path d="${dSheet(q, REST)}" fill="#fff"/>`).join('')}</svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Spillway';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-spillway';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `spillway-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
