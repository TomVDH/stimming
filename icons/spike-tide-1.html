<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Glowing tide 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Glowing tide 1</h1>
<p class="lede">Glowing tide, round 1. No pick yet; A goes on the menu until Tom picks. A: a wave of dark night water curls over, its lip glowing plankton blue. D: a slab of beach, sea at the back and wet sand in front, the surf line glowing between.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  const DIRS = [];


  // The toy's tokens: night water, wet sand, the blue of the plankton.
  const WATER = [[0, 'oklch(0.44 0.09 238)'], [0.55, 'oklch(0.3 0.08 248)'], [1, 'oklch(0.2 0.06 258)']];
  const GLOW = 'oklch(0.8 0.15 225)', HOT = 'oklch(0.96 0.05 215)';
  const SPARK = [[0, '#fff', 1], [0.35, 'oklch(0.85 0.13 222)', 0.9], [1, 'oklch(0.7 0.17 235)', 0]];

  // The shared motion: play peels a bright pulse along the lip, again and again.
  // Sparks pop in the foam and fade; rest lets the lip settle back.
  const run = (svg, sparkAt) => {
    const peel = svg.querySelector('.peel'), lip = svg.querySelector('.lip'), sparks = [...svg.querySelectorAll('.sp')];
    const st = { live: false, k: 0, t: 0, last: 0, next: 0, n: 0 };
    const paint = () => {
      // The pulse runs from the crest to the tip once each 1.6 s.
      const ph = (st.t % 1.6) / 1.6;
      peel.setAttribute('stroke-dashoffset', f(100 - ph * 130));
      peel.setAttribute('opacity', f(st.k));
      lip.setAttribute('opacity', f(0.75 + 0.25 * st.k));
    };
    const pop = () => {
      const c = sparks[st.n++ % sparks.length], [x, y] = sparkAt();
      c.setAttribute('cx', f(x)); c.setAttribute('cy', f(y));
      gsap.fromTo(c, { attr: { r: 1 }, opacity: 1 }, { attr: { r: 4.2 }, opacity: 0, duration: 0.7, ease: 'power2.out' });
    };
    const step = time => {
      const dt = Math.min(0.1, time - (st.last || time));
      st.last = time;
      st.t += dt;
      st.k = st.live ? Math.min(1, st.k + dt * 4) : Math.max(0, st.k - dt * 2.5);
      if (st.live && (st.next -= dt) <= 0) { st.next = 0.08 + Math.random() * 0.14; pop(); }
      paint();
      if (!st.live && st.k <= 0) { st.last = 0; loop.stop(); }
    };
    const loop = clock(step);
    paint();
    return {
      enter() { st.live = true; st.t = 0; loop.start(); },
      move() {},
      leave() { st.live = false; loop.start(); },
    };
  };
  const sparkLayer = u => `<g>${[0, 1, 2, 3, 4, 5, 6].map(() => `<circle class="sp" cx="64" cy="96" r="1" fill="url(#${u}sp)" opacity="0"/>`).join('')}</g>`;

  /* ================= Current ================= */

  // Glowing tide is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // A wave curls over to the left; its lip glows blue.
  // The outline runs up the face, under the lip to the tip, over the crest and down the back.
  const A_WAVE = 'M8 98C20 97 32 92 40 82C46 74 50 66 56 60C58.5 57 60.5 54 60 50.5C59.5 46 54 43 48 44C42.5 45 38.5 50 39 56C39.5 60.5 35 62.5 31 59C26 55 26 46 31 38C38 27 52 20 68 20C90 20 106 34 114 54C118 66 119 84 119 98Z';
  const A_LIP = 'M33 59.5C27 55 26.5 46 31 38.5C38 27.5 52 20.5 68 20.5C86 20.5 99 29 107 41';
  // Foam: a glowing mound along the foot, highest under the barrel.
  const A_FOAMP = 'M8 98Q12 93 17 95Q22 90 27 93Q32 87 37 90Q41 83 46 86Q49 78 54 80Q58 76 57.5 83C57 90 53.5 95 50 98Z';
  const A_FOAM = [[16, 95], [28, 92], [40, 87], [50, 81], [34, 96]];
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [8, 18, 111, 88],
    idea: 'A wave of dark night water curls over to the left; the hollow of the barrel shows under its lip. The lip glows a bright plankton blue with a white-hot core, and blue foam glows at its foot. The pointer peels a bright pulse along the lip from the crest to the tip, again and again, and sparks pop in the foam. They settle when the pointer leaves.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 3.2)}${blur(`${u}c`, 1.6)}
          ${lg(`${u}water`, WATER, 'x1="0.3" y1="0" x2="0.5" y2="1"')}${rg(`${u}sp`, SPARK)}</defs>
        <ellipse cx="64" cy="103" rx="54" ry="4" fill="oklch(0.05 0.01 240)" opacity="0.6" filter="url(#${u}b)"/>
        <ellipse cx="48" cy="66" rx="11" ry="14" fill="${GLOW}" opacity="0.4" filter="url(#${u}g)"/>
        ${body(A_WAVE, u, 'water')}
        <clipPath id="${u}cl"><path d="${A_WAVE}"/></clipPath>
        <path d="${A_LIP}" fill="none" stroke="oklch(0.62 0.1 225)" stroke-width="16" opacity="0.3" clip-path="url(#${u}cl)" transform="translate(4 7)"/>
        <path d="${A_FOAMP}" fill="${GLOW}" opacity="0.5" filter="url(#${u}g)"/>
        <path d="${A_FOAMP}" fill="${GLOW}" opacity="0.7" filter="url(#${u}c)"/>
        ${A_FOAM.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.2" fill="${HOT}" opacity="0.8" filter="url(#${u}c)"/>`).join('')}
        <path d="${A_LIP}" fill="none" stroke="${GLOW}" stroke-width="9" stroke-linecap="round" opacity="0.55" filter="url(#${u}g)"/>
        <path class="lip" d="${A_LIP}" fill="none" stroke="${GLOW}" stroke-width="4.6" stroke-linecap="round"/>
        <path d="${A_LIP}" fill="none" stroke="${HOT}" stroke-width="1.8" stroke-linecap="round"/>
        <path class="peel" d="${A_LIP}" pathLength="100" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="22 200" stroke-dashoffset="100" opacity="0" filter="url(#${u}c)"/>
        ${sparkLayer(u)}`;
      return run(svg, () => { const [x, y] = A_FOAM[Math.floor(Math.random() * A_FOAM.length)]; return [x + (Math.random() - 0.5) * 14, y + (Math.random() - 0.5) * 6]; });
    },
    // The emblem: the wave in white, its barrel open.
    emblem: `${EMB_HEAD}<path d="${A_WAVE}" fill="#fff"/></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A slab of beach at 30 degrees: sea at the back, wet sand in front.
  // The surf line glows where the two meet.
  const CY = 42, HX = 36, HY = 28, T = 16;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // The shoreline runs along gx with a soft wobble; a breaker lies behind it.
  const shore = (gx, off = 0) => 2 + off + 3 * Math.sin(gx * 0.12 + off);
  const line = off => Array.from({ length: 13 }, (_, i) => { const gx = -HX + (2 * HX * i) / 12; return iso(gx, shore(gx, off)); });
  const open = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L');
  const SHORE_PTS = line(0), BREAK_PTS = line(-14);
  const SEA = [...SHORE_PTS.slice().reverse(), N, E];
  const D_SPARKS = () => { const gx = (Math.random() * 2 - 1) * (HX - 8), gy = 8 + Math.random() * (HY - 12); return iso(gx, gy); };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [10, 10, 108, 81],
    idea: 'A slab of beach at 30 degrees: light top, mid left face, dark right face, a rim on the top edges. The back half of its top is dark sea, the front half wet sand; the right face shows the water over the sand. The surf line glows blue where they meet, and a second breaker glows further out. The pointer peels a bright pulse along the surf line, and blue sparks pop on the wet sand.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      // The right face shows the sea over the sand behind the shore.
      const eS = iso(HX, shore(HX));
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 3)}${blur(`${u}c`, 1.4)}
          ${lg(`${u}sand`, [[0, 'oklch(0.5 0.04 70)'], [1, 'oklch(0.38 0.035 65)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}sea`, [[0, 'oklch(0.3 0.08 245)'], [1, 'oklch(0.2 0.065 252)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.36 0.035 65)'], [1, 'oklch(0.27 0.03 62)']])}
          ${lg(`${u}R`, [[0, 'oklch(0.25 0.03 62)'], [1, 'oklch(0.18 0.025 60)']])}
          ${lg(`${u}RS`, [[0, 'oklch(0.24 0.06 250)'], [1, 'oklch(0.17 0.05 255)']])}${rg(`${u}sp`, SPARK)}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, eS, down(eS), down(S)])}" fill="url(#${u}R)"/>
        <path d="${poly([eS, E, down(E, 0.55), down(eS, 0.55)])}" fill="url(#${u}RS)"/>
        <path d="${poly([down(eS, 0.55), down(E, 0.55), down(E), down(eS)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}sand)"/>
        <path d="${poly(SEA)}" fill="url(#${u}sea)"/>
        <path d="${open(BREAK_PTS)}" fill="none" stroke="${GLOW}" stroke-width="5" stroke-linecap="round" opacity="0.4" filter="url(#${u}g)"/>
        <path d="${open(BREAK_PTS)}" fill="none" stroke="${GLOW}" stroke-width="2.4" stroke-linecap="round" opacity="0.75"/>
        <path d="${open(SHORE_PTS)}" fill="none" stroke="${GLOW}" stroke-width="8" stroke-linecap="round" opacity="0.55" filter="url(#${u}g)"/>
        <path class="lip" d="${open(SHORE_PTS)}" fill="none" stroke="${GLOW}" stroke-width="4" stroke-linecap="round"/>
        <path d="${open(SHORE_PTS)}" fill="none" stroke="${HOT}" stroke-width="1.6" stroke-linecap="round"/>
        <path class="peel" d="${open(SHORE_PTS.slice().reverse())}" pathLength="100" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" stroke-dasharray="22 200" stroke-dashoffset="100" opacity="0" filter="url(#${u}c)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        ${sparkLayer(u)}`;
      return run(svg, D_SPARKS);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/><path d="${poly(SEA)}" fill="#000"/><path d="${open(SHORE_PTS)}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="${open(BREAK_PTS)}" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Glowing tide';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-tide';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `tide-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
