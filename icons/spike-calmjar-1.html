<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Calm jar 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Calm jar 1</h1>
<p class="lede">Calm jar, round 1. The toy is not built; this is an icon only. A: a squat jar, glitter in three layers; stir it with the pointer. D: the jar is a glass cube.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  // The toy's tokens: clear glass, a tin lid, three kinds of glitter.
  const GLASS = [[0, 'oklch(0.9 0.03 250)', 0.42], [0.3, 'oklch(0.7 0.03 260)', 0.1], [0.75, 'oklch(0.7 0.03 260)', 0.1], [1, 'oklch(0.9 0.03 250)', 0.36]];
  const LIQUID = 'oklch(0.42 0.12 300)';
  const TIN = [[0, 'oklch(0.9 0.01 250)'], [1, 'oklch(0.55 0.015 250)']];
  // The layers, big flakes at the foot: silver, holo, gold dust.
  const BANDS = [['oklch(0.84 0.01 250)', 0.0, 0.12], ['oklch(0.72 0.16 330)', 0.12, 0.23], ['oklch(0.86 0.12 85)', 0.23, 0.31]];
  const KIND = [{ size: 7, sides: 6, w: 0.07, settle: 0.06 }, { size: 5.8, sides: 6, w: 0.18, settle: 0.035 }, { size: 4.2, sides: 4, w: 0.27, settle: 0.016 }];
  const NF = 18;
  const flakeD = sides => poly(Array.from({ length: sides }, (_, k) => { const a = (k / sides) * Math.PI * 2 + Math.PI / sides; return [Math.cos(a), Math.sin(a)]; }));
  // A flake's colour: it flashes as its face turns to the light.
  const flakeColour = (kind, i, spin) => {
    const flash = Math.pow(Math.max(0, Math.cos(spin)), 10);
    if (kind === 0) return `oklch(${f(0.82 + 0.17 * flash)} 0.01 250)`;
    if (kind === 1) return `oklch(${f(0.76 + 0.2 * flash)} 0.18 ${f((i * 47 + spin * 70) % 360)})`;
    return `oklch(${f(0.82 + 0.15 * flash)} 0.12 85)`;
  };

  // The glitter, shared by A and D.
  // Each flake has a home in its layer and an orbit in the swirl.
  // The pointer's speed stirs the jar; big flakes settle first, dust last.
  const swirl = (draw) => {
    const F = Array.from({ length: NF }, (_, i) => {
      const kind = i % 3, k = Math.floor(i / 3);
      return {
        kind, i,
        home: [-0.8 + (k / 5) * 1.6 + (kind - 1) * 0.08, ((i * 0.37) % 1) * 1.6 - 0.8, KIND[kind].w],
        rho: 0.3 + ((i * 0.53) % 1) * 0.55, th: i * 2.4, hw: 0.28 + ((i * 0.61) % 1) * 0.62,
        spin: i * 1.1, lift: 0,
        rest: kind === 2 ? 0.5 + 0.45 * ((i * 0.29) % 1) : kind === 1 && (i * 0.43) % 1 > 0.5 ? 0.55 : 0,
      };
    });
    F.forEach(fl => { fl.lift = fl.rest; });
    const st = { E: 0, live: false, last: null, t: 0 };
    const pos = fl => {
      const o = [fl.rho * Math.cos(fl.th), fl.rho * Math.sin(fl.th), fl.hw + 0.04 * Math.sin(st.t * 2 + fl.i)];
      return [0, 1, 2].map(j => lerp(fl.home[j], o[j], fl.lift));
    };
    const step = time => {
      st.t = time;
      st.E *= st.live ? 0.985 : 0.95;
      let busy = st.E;
      F.forEach(fl => {
        const target = Math.max(fl.rest, clamp(st.E * 1.6, 0, 1));
        // A flake rises at once; it falls back at its own speed.
        fl.lift += (target - fl.lift) * (target > fl.lift ? 0.12 : KIND[fl.kind].settle);
        fl.th += (0.012 + 0.07 * st.E) * fl.lift;
        fl.spin += (0.05 + 0.25 * st.E) * fl.lift;
        busy += Math.abs(fl.lift - fl.rest);
      });
      draw(F, pos);
      if (!st.live && busy < 0.01) { F.forEach(fl => { fl.lift = fl.rest; }); st.E = 0; draw(F, pos); loop.stop(); }
    };
    const loop = clock(step);
    draw(F, pos);
    return {
      enter(p) { st.live = true; st.last = p; st.E = Math.max(st.E, 0.45); loop.start(); },
      move(p) {
        if (!p) return;
        if (st.last) st.E = Math.min(1, st.E + Math.hypot(p[0] - st.last[0], p[1] - st.last[1]) * 0.012);
        st.last = p;
      },
      leave() { st.live = false; st.last = null; loop.start(); },
    };
  };
  // Draw the flakes at their screen points; depth sets their size.
  const placeFlakes = (els, F, pos, toScreen) => F.forEach((fl, j) => {
    const [x, y, k] = toScreen(pos(fl));
    const kd = KIND[fl.kind], sx = Math.max(0.22, Math.abs(Math.cos(fl.spin)));
    els[j].setAttribute('transform', `translate(${f(x)} ${f(y)}) rotate(${f((fl.spin * 40 + fl.i * 33) % 360)}) scale(${f(kd.size * k * sx)} ${f(kd.size * k)})`);
    els[j].setAttribute('fill', flakeColour(fl.kind, fl.i, fl.spin));
    els[j].setAttribute('opacity', f(0.5 + 0.5 * Math.min(1, fl.lift * 3)));
  });
  const flakesMarkup = () => Array.from({ length: NF }, (_, i) => `<path class="fl" d="${flakeD(KIND[i % 3].sides)}"/>`).join('');

  const DIRS = [];

  /* ================= Current ================= */

  // Calm jar is not built; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NOT BUILT</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // A squat jar with a tin screw lid, glitter in layers at the foot.
  const A_JAR = 'M30 56Q30 46 42 45V40H86V45Q98 46 98 56V100Q98 112 86 112H42Q30 112 30 100Z';
  const A_LID = 'M40 40V31Q40 27 44 27H84Q88 27 88 31V40Z';
  const BOT = 108, H = 56, HW = 30;
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [29, 26, 70, 87],
    idea: 'A squat glass jar with a tin screw lid, full of clear violet liquid. Glitter lies at the foot in three layers: big silver hexes, holo flakes, gold dust. Stir it with the pointer: the faster you move, the higher the glitter lifts and swirls round, each flake tumbling and flashing as it turns to the light. Leave, and it settles slowly, the big flakes first and the dust last, back into its layers.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}
          ${lg(`${u}glass`, GLASS, 'x1="0" y1="0" x2="1" y2="0"')}${lg(`${u}tin`, TIN)}
          <clipPath id="${u}in"><path d="${A_JAR}"/></clipPath></defs>
        <ellipse cx="64" cy="113" rx="40" ry="4" fill="oklch(0.05 0.01 280)" opacity="0.6" filter="url(#${u}b)"/>
        <g clip-path="url(#${u}in)">
          <rect x="28" y="42" width="72" height="72" fill="${LIQUID}" opacity="0.6"/>
          ${BANDS.map(([c, a, b], j) => `<path d="M28 ${f(BOT - H * b)}Q46 ${f(BOT - H * b - 1.6)} 64 ${f(BOT - H * b)}T100 ${f(BOT - H * b)}V${f(BOT - H * a + (j ? 0 : 6))}H28Z" fill="${c}"/>`).join('')}
          <g class="flakes">${flakesMarkup()}</g>
        </g>
        <path d="${A_JAR}" fill="url(#${u}glass)"/>
        <path d="${A_JAR}" fill="url(#${u}lit)"/>
        <path d="M35 62Q35 54 40 52V96Q35 94 35 88Z" fill="#fff" opacity="0.26"/>
        <path d="${A_JAR}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
        ${body(A_LID, u, 'tin')}
        <path d="M40 33H88V35.4H40Z" fill="oklch(0.5 0.015 250)" opacity="0.5"/>`;
      const els = [...svg.querySelectorAll('.fl')];
      return swirl((F, pos) => placeFlakes(els, F, pos, ([x, d, w]) => [64 + x * HW, BOT - w * H, 0.85 + 0.25 * (d + 1) / 2]));
    },
    emblem: `${EMB_HEAD}<path d="${A_JAR}${A_LID}" fill="#fff"/>${BANDS.map(([c, a, b], j) => `<rect x="34" y="${f(BOT - H * b)}" width="60" height="${f(H * (b - a) - 1)}" fill="#000" opacity="${0.35 + j * 0.2}"/>`).join('')}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The jar is the block: a glass cube, its layers showing through the faces.
  const CY = 40, HALF = 24, T = 48;
  const iso = (gx, gy, h = 0) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5 + T - h];
  const top = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]];
  const at = h => top.map(([x, y]) => iso(x, y, h));
  const [Nt, Et, St, Wt] = at(T), [Nb, Eb, Sb, Wb] = at(0);
  const face = (a, b, h0, h1) => poly([iso(...a, h1), iso(...b, h1), iso(...b, h0), iso(...a, h0)]);
  const CW = [-HALF, HALF], CS = [HALF, HALF], CE = [HALF, -HALF];
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [21, 14, 86, 98],
    idea: 'The jar is the block: a cube of glass full of violet liquid, a rim on its top edges. The three glitter layers show through its faces at the foot and lie as a bed inside. Stir with the pointer and the glitter lifts and circles inside the cube, flashing as it tumbles; leave, and it settles back in layers, big flakes first.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}
          ${lg(`${u}glass`, GLASS, 'x1="0" y1="0" x2="1" y2="0"')}</defs>
        <path d="${poly([Eb, Sb, Wb, [Wb[0], Wb[1] + 4], [Sb[0], Sb[1] + 4], [Eb[0], Eb[1] + 4]])}" fill="oklch(0.05 0.01 280)" opacity="0.5" filter="url(#${u}b)"/>
        <path d="${poly([Nt, Et, Eb, Sb, Wb, Wt])}" fill="${LIQUID}" opacity="0.55"/>
        <path d="${poly(at(BANDS[2][2] * T))}" fill="${BANDS[2][0]}"/>
        <g class="flakes">${flakesMarkup()}</g>
        ${BANDS.map(([c, a, b]) => `<path d="${face(CW, CS, a * T, b * T)}" fill="${c}"/><path d="${face(CS, CE, a * T, b * T)}" fill="${c}"/><path d="${face(CS, CE, a * T, b * T)}" fill="#000" opacity="0.22"/>`).join('')}
        <path d="${poly([Wt, St, Sb, Wb])}" fill="url(#${u}glass)"/>
        <path d="${poly([St, Et, Eb, Sb])}" fill="url(#${u}glass)"/>
        <path d="${poly([Nt, Et, St, Wt])}" fill="oklch(0.85 0.04 280)" opacity="0.22"/>
        <path d="${poly([Nt, Et, St, Wt])}" fill="url(#${u}lit)"/>
        <path d="${poly([Wt, St, Sb, Wb])}" fill="url(#${u}lit)" opacity="0.5"/>
        <path d="M${f(Wt[0])} ${f(Wt[1])}L${f(Nt[0])} ${f(Nt[1])}L${f(Et[0])} ${f(Et[1])}" stroke="#fff" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(Wt[0])} ${f(Wt[1])}L${f(St[0])} ${f(St[1])}L${f(Et[0])} ${f(Et[1])}M${f(St[0])} ${f(St[1])}V${f(Sb[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>`;
      const els = [...svg.querySelectorAll('.fl')];
      const R = HALF * 0.8;
      return swirl((F, pos) => placeFlakes(els, F, pos, ([x, d, w]) => { const p = iso(x * R, d * R, w * T * 0.92); return [p[0], p[1], 0.8 + 0.2 * (x + d + 2) / 4]; }));
    },
    emblem: `${EMB_HEAD}<path d="${poly([Wt, St, Sb, Wb])}" fill="#5a5a5a"/><path d="${poly([St, Et, Eb, Sb])}" fill="#3a3a3a"/><path d="${poly([Nt, Et, St, Wt])}" fill="#8a8a8a"/>${BANDS.map(([c, a, b], j) => `<path d="${face(CW, CS, a * T, b * T)}${face(CS, CE, a * T, b * T)}" fill="#fff" opacity="${0.9 - j * 0.25}"/>`).join('')}</svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Calm jar';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-calmjar';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `calmjar-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
