<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Interchange trails 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Interchange trails 1</h1>
<p class="lede">Interchange trails, round 1. No pick yet; A goes on the menu until Tom picks. A: a cloverleaf at night with light trails on its lanes and loops. D: the cloverleaf on a block of night field.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  const { sin, cos, hypot, atan2, acos } = Math;

  const DIRS = [];

  // The toy's tokens: grey night decks, warm white and red trails, amber lamps.
  const AMBER = 'oklch(0.8 0.13 70)';
  const DECK = [[0, 'oklch(0.54 0.022 255)'], [0.55, 'oklch(0.4 0.026 260)'], [1, 'oklch(0.27 0.03 266)']];
  // Higher decks are lighter.
  const DECK2 = [[0, 'oklch(0.62 0.02 255)'], [0.55, 'oklch(0.47 0.024 260)'], [1, 'oklch(0.33 0.03 266)']];
  const SIDE = 'oklch(0.2 0.025 268)';
  // Inbound lamps draw warm white; outbound lamps draw red.
  const TRAIL = { w: ['oklch(0.97 0.04 88)', 'oklch(0.86 0.1 78)'], r: ['oklch(0.7 0.21 27)', 'oklch(0.6 0.23 25)'] };

  /* ================= The cloverleaf ================= */

  // Local units: the crossing at 0 0, the roads reach 55 each way.
  // x runs east, y runs south. Traffic keeps right.
  const R = 55, E0 = 6, LR = 19, LEAD = 10, C0 = E0 + LR;
  // A loop meets both roads on its lane, tangent to each.
  // The NE loop: up the northbound lane, 270 degrees clockwise, onto westbound.
  const NE = (() => {
    const pts = [[E0, -C0 + LEAD]];
    for (let i = 0; i <= 36; i++) { const a = Math.PI * (1 + 1.5 * i / 36); pts.push([C0 + LR * cos(a), -C0 + LR * sin(a)]); }
    pts.push([C0 - LEAD, -E0]);
    return pts;
  })();
  // A quarter turn clockwise takes the NE loop to SE, SW and NW.
  const turn = ([x, y], k) => { for (let i = 0; i < k; i++) [x, y] = [-y, x]; return [x, y]; };
  const loop = k => 'M' + NE.map(p => turn(p, k)).map(p => `${f(p[0])} ${f(p[1])}`).join('L');
  const LOOPS = [0, 1, 2, 3].map(loop).join('');
  const LOOP_LEN = 2 * LEAD + 1.5 * Math.PI * LR;
  const ROAD_H = `M${-R} 0H${R}`, ROAD_V = `M0 ${-R}V${R}`;
  // The bridge: a short span carries the north-south road over the crossing.
  const SPAN = 15, BRIDGE = `M0 ${-SPAN}V${SPAN}`;
  // Widths: the motorway, a loop, a trail on each, a scale w per icon.
  const widths = w => ({ road: 18 * w, ramp: 8 * w, bridge: 21 * w, lane: 4.5 * w, tr: 3.8 * w, trl: 3.6 * w });
  // Trails, each drawn in its travel direction: path, colour, deck, dash, phase.
  // Inbound lanes draw white, outbound lanes draw red.
  const lanes = w => {
    const l = f(widths(w).lane), m = [70, 5, 24, 6];
    return [
      [`M${R} ${-l}H2`, 'w', 0, m, 3], [`M-2 ${-l}H${-R}`, 'r', 0, m, 17],
      [`M${-R} ${l}H-2`, 'w', 0, m, 11], [`M2 ${l}H${R}`, 'r', 0, m, 29],
      [`M${-l} ${-R}V-2`, 'w', 1, m, 21], [`M${-l} 2V${R}`, 'r', 1, m, 7],
      [`M${l} ${R}V2`, 'w', 1, m, 14], [`M${l} -2V${-R}`, 'r', 1, m, 25],
    ];
  };
  // One streak a loop; its dash period is the loop's length.
  // White and red take turns round the cross.
  const loopTrails = () => [0, 1, 2, 3].map(k => [loop(k), k % 2 ? 'r' : 'w', 0, [44, f(LOOP_LEN - 44)], f(30 + k * 21)]);
  // The jam knot sits where the NE loop merges, on the inbound lane.
  const knotAt = w => [C0 - 6, -widths(w).lane];

  // One trail: a soft glow under a bright core. Speed in units a second.
  const trail = (u, [d, c, , m, ph], width, speed) => {
    const p = f(m.reduce((a, b) => a + b, 0));
    const da = m.join(' '), data = `data-p="${p}" data-ph="${ph}" data-s="${speed}"`;
    return `<path class="trail" d="${d}" stroke="${TRAIL[c][1]}" stroke-width="${f(width * 2.4)}" stroke-dasharray="${da}" stroke-dashoffset="${ph}" opacity="0.45" filter="url(#${u}g)" ${data}/>
        <path class="trail" d="${d}" stroke="${TRAIL[c][0]}" stroke-width="${f(width)}" stroke-dasharray="${da}" stroke-dashoffset="${ph}" ${data}/>`;
  };
  // A deck in the menu's language: a rim under, one gradient, then lit.
  // The parts take one gradient, so the deck reads as one body.
  const deck = (u, parts, fill, ext) => `
        ${ext ? `<g transform="translate(0 ${ext})" stroke="${SIDE}" fill="none" stroke-linejoin="round">${parts.map(([d, wd]) => `<path d="${d}" stroke-width="${f(wd)}"/>`).join('')}</g>` : ''}
        <g fill="none" stroke="url(#${u}drim)" stroke-linejoin="round">${parts.map(([d, wd]) => `<path d="${d}" stroke-width="${f(wd + 3)}"/>`).join('')}</g>
        <g fill="none" stroke="url(#${u}${fill})" stroke-linejoin="round">${parts.map(([d, wd]) => `<path d="${d}" stroke-width="${f(wd)}"/>`).join('')}</g>
        <g fill="none" stroke="url(#${u}dlit)" stroke-linejoin="round">${parts.map(([d, wd]) => `<path d="${d}" stroke-width="${f(wd)}"/>`).join('')}</g>`;
  // The low deck: both roads and the four loops, with the low trails.
  const lowArt = (u, w, ext) => {
    const W = widths(w);
    return `<g class="low">${deck(u, [[ROAD_H, W.road], [ROAD_V, W.road], [LOOPS, W.ramp]], 'deck', ext)}
        <g fill="none" stroke-linecap="round">${lanes(w).filter(t => !t[2]).map(t => trail(u, t, W.tr, 30)).join('')}${loopTrails().map(t => trail(u, t, W.trl, 18)).join('')}</g></g>`;
  };
  // The high deck: the bridge, then the north-south trails over all.
  const highArt = (u, w, ext) => {
    const W = widths(w);
    return `<g class="high">${deck(u, [[BRIDGE, W.bridge]], 'deck2', ext)}
        <g fill="none" stroke-linecap="round">${lanes(w).filter(t => t[2]).map(t => trail(u, t, W.tr, 30)).join('')}</g></g>`;
  };
  // The bridge throws a soft shadow to the south-east.
  const bridgeShadow = (u, w, dx, dy) => `<path d="${BRIDGE}" stroke="oklch(0.06 0.02 270)" stroke-width="${f(widths(w).bridge)}" opacity="0.7" filter="url(#${u}sh)" transform="translate(${dx} ${dy})"/>`;
  // The knot: a hot core in an amber bloom.
  const knotArt = (u, w) => {
    const [x, y] = knotAt(w);
    return `<g class="knot" data-o="${f(x)} ${f(y)}"><circle class="bloom" cx="${f(x)}" cy="${f(y)}" r="${f(13 * w)}" fill="url(#${u}knot)" opacity="0.8"/><circle cx="${f(x)}" cy="${f(y)}" r="${f(3.6 * w)}" fill="oklch(0.99 0.03 90)"/></g>`;
  };
  const defs = u => `${light(u)}${blur(`${u}g`, 1.8)}${blur(`${u}sh`, 2.4)}${blur(`${u}h`, 8)}${blur(`${u}b`, 2.6)}
          ${lg(`${u}deck`, DECK, 'gradientUnits="userSpaceOnUse" x1="-48" y1="-55" x2="38" y2="55"')}
          ${lg(`${u}deck2`, DECK2, 'gradientUnits="userSpaceOnUse" x1="-30" y1="-55" x2="30" y2="55"')}
          ${lg(`${u}drim`, [[0, '#fff', 0.7], [0.5, '#fff', 0]], 'gradientUnits="userSpaceOnUse" x1="-55" y1="-55" x2="55" y2="55"')}
          ${rg(`${u}dlit`, [[0, '#fff', 0.34], [1, '#fff', 0]], 'gradientUnits="userSpaceOnUse" cx="-20" cy="-26" r="68"')}
          ${rg(`${u}knot`, [[0, '#fff', 1], [0.22, 'oklch(0.93 0.09 82)', 0.9], [0.55, AMBER, 0.4], [1, AMBER, 0]])}
          ${rg(`${u}halo`, [[0, AMBER, 0.3], [0.6, AMBER, 0.1], [1, AMBER, 0]])}`;

  // The shared motion: the trails run along their lanes, the knot throbs.
  // The pointer near the knot jams the flow; far away it runs free.
  const run = (svg, opt = {}) => {
    const trails = svg.querySelectorAll('.trail'), knot = svg.querySelector('.knot'), bloom = svg.querySelector('.bloom'), lean = svg.querySelector('.lean');
    const ko = knot.dataset.o, kp = opt.knot;
    let tl = null, pulse = null;
    const flow = () => {
      const t = gsap.timeline();
      trails.forEach(e => {
        const p = +e.dataset.p, ph = +e.dataset.ph;
        t.fromTo(e, { attr: { 'stroke-dashoffset': ph + p } }, { attr: { 'stroke-dashoffset': ph }, duration: p / +e.dataset.s, ease: 'none', repeat: -1 }, 0);
      });
      return t;
    };
    return {
      enter(p) {
        if (!tl) tl = flow();
        tl.play();
        gsap.to(tl, { timeScale: 1, duration: 0.5, overwrite: true });
        pulse?.kill();
        pulse = gsap.timeline({ repeat: -1 })
          .to(knot, { scale: 1.35, svgOrigin: ko, duration: 0.35, ease: 'power2.out' })
          .to(bloom, { opacity: 1, duration: 0.35 }, 0)
          .to(knot, { scale: 1, svgOrigin: ko, duration: 0.9, ease: 'sine.inOut' })
          .to(bloom, { opacity: 0.8, duration: 0.9 }, 0.35);
        if (p) this.move(p);
      },
      move(p) {
        if (!p) return;
        // Near the knot the cars crawl, so the trails slow.
        const k = clamp(hypot(p[0] - kp[0], p[1] - kp[1]) / 60);
        if (tl) gsap.to(tl, { timeScale: 0.2 + 1.1 * k, duration: 0.4, overwrite: true });
        if (lean) gsap.to(lean, { rotation: (p[0] - 64) * 0.05, svgOrigin: '64 64', duration: 0.5, overwrite: 'auto' });
      },
      leave() {
        if (tl) gsap.to(tl, { timeScale: 0, duration: 0.6, ease: 'power2.out', overwrite: true, onComplete: () => tl.pause() });
        pulse?.kill();
        pulse = null;
        gsap.to(knot, { scale: 1, svgOrigin: ko, duration: 0.4 });
        gsap.to(bloom, { opacity: 0.8, duration: 0.4 });
        if (lean) gsap.to(lean, { rotation: 0, svgOrigin: '64 64', duration: 0.5 });
      },
    };
  };

  // Emblem parts: decks in white, lanes in grey, the knot in white.
  // A black gap under the bridge splits the two decks.
  const embLanes = (w, hi) => lanes(w).filter(t => !!t[2] === hi).map(t => `<path d="${t[0]}" stroke="#8a8a8a" stroke-width="${f(widths(w).tr)}" stroke-linecap="round" fill="none"/>`).join('');
  const embLow = w => { const W = widths(w); return `<g stroke="#fff" fill="none" stroke-linejoin="round"><path d="${ROAD_H}" stroke-width="${f(W.road)}"/><path d="${ROAD_V}" stroke-width="${f(W.road)}"/><path d="${LOOPS}" stroke-width="${f(W.ramp)}"/></g>${embLanes(w, false)}`; };
  const embBridge = (w, gap = true) => { const W = widths(w); return `${gap ? `<path d="M0 ${-SPAN - 1}V${SPAN + 1}" stroke="#000" stroke-width="${f(W.bridge + 4)}" fill="none"/>` : ''}<path d="${BRIDGE}" stroke="#fff" stroke-width="${f(W.bridge)}" fill="none"/>`; };
  const embHigh = w => `${embBridge(w)}${embLanes(w, true)}`;
  const embKnot = w => { const [x, y] = knotAt(w); return `<circle cx="${f(x)}" cy="${f(y)}" r="${f(4.6 * w)}" fill="#fff"/>`; };

  /* ================= Current ================= */

  // Interchange trails is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [8, 8, 112, 112],
    idea: 'A cloverleaf at night from above, as one bold object: two motorways cross, and four round loops each leave one road and meet the other, tangent to both. A short, lighter bridge carries the north-south road over the crossing and throws a soft shadow to the south-east. Light trails ride every lane: inbound lamps warm white, outbound red, so each road turns colour at the crossing; the loops take white and red in turn. A jam burns as a hot amber knot where the north-east loop merges, in a soft amber glow of lamps. The pointer runs the trails along their lanes; near the knot they crawl, far from it they run free; the knot throbs and the cross leans toward the pointer.',
    art(svg, u) {
      svg.innerHTML = `<defs>${defs(u)}</defs>
        <circle cx="64" cy="64" r="52" fill="url(#${u}halo)" filter="url(#${u}h)"/>
        <g class="lean"><g transform="translate(64 64)">
          ${lowArt(u, 1, 3)}
          ${bridgeShadow(u, 1, 4, 3)}
          ${highArt(u, 1, 3)}
          ${knotArt(u, 1)}
        </g></g>`;
      return run(svg, { knot: [64 + knotAt(1)[0], 64 + knotAt(1)[1]] });
    },
    emblem: `${EMB_HEAD}<g transform="translate(64 64)">${embLow(1)}${embHigh(1)}${embKnot(1)}</g></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A block of night field is the base; the cloverleaf lies on its top.
  // The bridge shows faces LIFT deep, so it stands proud of the roads.
  const CY = 60, H = 31, T = 13, LIFT = 4, WD = 1.35, K = H / R;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const isoL = (x, y) => iso(x * K, y * K);
  const ISO = `translate(64 ${CY}) matrix(0.866 0.5 -0.866 0.5 0 0) scale(${f(K)})`;
  const N = iso(-H, -H), Ea = iso(H, -H), S = iso(H, H), Wd = iso(-H, H);
  const down = (p, k = T) => [p[0], p[1] + k];
  // The bridge's faces: the long side faces south-east, one end faces south-west.
  const hw = widths(WD).bridge / 2;
  const B_SIDE = poly([isoL(hw, -SPAN), isoL(hw, SPAN), down(isoL(hw, SPAN), LIFT), down(isoL(hw, -SPAN), LIFT)]);
  const B_END = poly([isoL(-hw, SPAN), isoL(hw, SPAN), down(isoL(hw, SPAN), LIFT), down(isoL(-hw, SPAN), LIFT)]);
  const kD = isoL(...knotAt(WD));
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [9, N[1] - 2, 110, S[1] + T - N[1] + 2],
    idea: 'A block of dark night field at 30 degrees: a light top, a mid left face, a dark right face, a rim on the top edges, a soft amber lamp glow on the top. The cloverleaf lies on the top with its trails; the bridge over the crossing stands proud, its side and end faces shown, its shadow on the road below. The pointer runs the trails and jams them near the knot, as A does.',
    art(svg, u) {
      const top = poly([N, Ea, S, Wd]);
      svg.innerHTML = `<defs>${defs(u)}
          ${lg(`${u}top`, [[0, 'oklch(0.36 0.03 245)'], [1, 'oklch(0.27 0.03 250)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.3 0.03 252)'], [1, 'oklch(0.24 0.028 256)']])}${lg(`${u}R`, [[0, 'oklch(0.21 0.025 260)'], [1, 'oklch(0.16 0.02 262)']])}</defs>
        <path d="${poly([Ea, S, Wd, down(Wd), down(S), down(Ea)])}" fill="oklch(0.05 0.01 270)" opacity="0.55" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([Wd, S, down(S), down(Wd)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, Ea, down(Ea), down(S)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <g transform="${ISO}"><circle cx="0" cy="0" r="50" fill="url(#${u}halo)" opacity="0.9"/></g>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(Wd[0])} ${f(Wd[1])}L${f(N[0])} ${f(N[1])}L${f(Ea[0])} ${f(Ea[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(Wd[0])} ${f(Wd[1])}L${f(S[0])} ${f(S[1])}L${f(Ea[0])} ${f(Ea[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g transform="${ISO}">
          ${lowArt(u, WD, 0)}
          ${bridgeShadow(u, WD, 9, 0)}
        </g>
        <path d="${B_SIDE}" fill="${SIDE}"/>
        <path d="${B_END}" fill="oklch(0.3 0.028 262)"/>
        <g transform="${ISO}">${highArt(u, WD, 0)}</g>
        <g transform="${ISO}">${knotArt(u, WD)}</g>`;
      return run(svg, { knot: kD });
    },
    emblem: `${EMB_HEAD}<path d="${poly([Wd, S, down(S), down(Wd)])}" fill="#5a5a5a"/><path d="${poly([S, Ea, down(Ea), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, Ea, S, Wd])}" fill="#6a6a6a"/><g transform="${ISO}">${embLow(WD)}</g><path d="${B_SIDE}" fill="#3a3a3a"/><path d="${B_END}" fill="#5a5a5a"/><g transform="${ISO}">${embBridge(WD, false)}${embLanes(WD, true)}</g><g transform="${ISO}">${embKnot(WD)}</g></svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = 'Interchange trails';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-interchange';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `interchange-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    const A = DIRS.find(d => d.l === 'A');
    const m = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' });
    A.art(m, 'interchange-');
    fitIcon(m, A.box);
    m.setAttribute('class', 'art');
    pre.textContent = JSON.stringify({ ...window.EMBLEMS, menu: m.outerHTML });
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
