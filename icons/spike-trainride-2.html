<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Train Ride 2</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans); padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased; }
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; max-width: 70ch; }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.icons { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); cursor: pointer; }
.tile svg { display: block; overflow: visible; }
.t256, .t256 svg { width: 256px; height: 256px; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Train Ride 2</h1>
<p class="lede">Round 2: Tom picked B (the red train by the lake) and likes A. B1 is B tidied; B2 to B5 vary it: evening, a viaduct, a close crop that reads at 64 px, and B seen through the window. A stays for comparison. No marks or logos; no offset slab. Hover a tile to play it.</p>
<div class="row" id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Shared paints, from a daytime frame of the toy.
  const C = {
    sky0: 'oklch(0.72 0.09 240)', sky1: 'oklch(0.93 0.03 230)', cloud: 'oklch(0.98 0.01 240)',
    far: 'oklch(0.62 0.07 150)', farD: 'oklch(0.52 0.07 155)', peak: 'oklch(0.78 0.03 250)', snow: 'oklch(0.98 0.005 250)',
    lake: 'oklch(0.5 0.1 240)', lakeL: 'oklch(0.72 0.07 230)', grass: 'oklch(0.7 0.15 135)', grassD: 'oklch(0.58 0.14 140)',
    wall: 'oklch(0.9 0.02 85)', wallD: 'oklch(0.78 0.025 80)', bar: 'oklch(0.22 0.01 260)',
    red: 'oklch(0.56 0.2 27)', redD: 'oklch(0.44 0.17 27)', white: 'oklch(0.97 0.005 90)', glass: 'oklch(0.24 0.03 250)', grey: 'oklch(0.55 0.01 260)',
    roof: 'oklch(0.45 0.1 40)',
  };
  // The view through the window: sky, cloud, far shore with a village, lake and near meadow.
  const view = (id) => `
    <defs><linearGradient id="${id}-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.sky0}"/><stop offset="1" stop-color="${C.sky1}"/></linearGradient>
    <linearGradient id="${id}-lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.lakeL}"/><stop offset="1" stop-color="${C.lake}"/></linearGradient></defs>
    <rect x="0" y="0" width="128" height="128" fill="url(#${id}-sky)"/>
    <g class="cloud"><ellipse cx="44" cy="40" rx="14" ry="5" fill="${C.cloud}"/><ellipse cx="52" cy="37" rx="9" ry="6" fill="${C.cloud}"/><ellipse cx="88" cy="46" rx="11" ry="3.5" fill="${C.cloud}" opacity="0.85"/></g>
    <path d="M0 64 Q20 56 40 60 T80 57 T128 59 V72 H0Z" fill="${C.far}"/>
    <g fill="${C.white}"><rect x="58" y="62" width="3" height="2.4"/><rect x="63" y="61.5" width="2.6" height="2.8"/><rect x="92" y="62" width="3" height="2.2"/></g>
    <g fill="${C.roof}"><rect x="58" y="61.2" width="3" height="1"/><rect x="63" y="60.8" width="2.6" height="1"/><rect x="92" y="61.2" width="3" height="1"/></g>
    <rect x="0" y="66" width="128" height="20" fill="url(#${id}-lake)"/>
    <g class="glint" stroke="${C.cloud}" stroke-width="1.2" stroke-linecap="round" opacity="0.8"><path d="M30 72h10M70 76h14M100 71h8M50 80h9"/></g>
    <path d="M0 84 Q40 81 70 83 T128 82 V128 H0Z" fill="${C.grass}"/>
    <path d="M0 92 Q50 88 128 91 V128 H0Z" fill="${C.grassD}"/>`;
  // A red train side: one long car with a window band, a white line, doors and a grey roof.
  const trainSide = (x, y, w) => `
    <g class="train">
      <path d="M${x} ${y + 3} q0 -3 4 -3 H${x + w - 6} q6 0 8 7 v9 H${x}Z" fill="${C.red}"/>
      <rect x="${x}" y="${y - 2}" width="${w - 4}" height="2.6" rx="1" fill="${C.grey}"/>
      <rect x="${x + 4}" y="${y + 3}" width="${w - 12}" height="4.4" rx="1.2" fill="${C.glass}"/>
      ${Array.from({ length: Math.floor((w - 14) / 8) }, (_, i) => `<rect x="${x + 9 + i * 8}" y="${y + 3}" width="1.4" height="4.4" fill="${C.red}"/>`).join('')}
      <rect x="${x}" y="${y + 10.4}" width="${w - 2}" height="1.1" fill="${C.white}"/>
      <rect x="${x + w * 0.33}" y="${y + 2.4}" width="3.4" height="9" rx="0.6" fill="${C.redD}"/>
      <rect x="${x + w * 0.66}" y="${y + 2.4}" width="3.4" height="9" rx="0.6" fill="${C.redD}"/>
      <rect x="${x}" y="${y + 13}" width="${w + 2}" height="3" fill="${C.bar}"/>
    </g>`;
  // Round 2: B refined, then variations on it; A kept as the window option.
  const peaks = (fill, snow) => `<path d="M-4 66 L28 34 L44 50 L66 24 L92 52 L104 42 L132 66Z" fill="${fill}"/>
          <path d="M28 34 L36 42 L31 44 L26 40Z M66 24 L76 35 L70 37 L66 33 L61 36 L58 32Z M104 42 L110 48 L104 49Z" fill="${snow}"/>`;
  const sq = (id, body) => `<svg viewBox="0 0 128 128"><defs><clipPath id="${id}-c"><rect x="6" y="6" width="116" height="116" rx="16"/></clipPath>${body.defs || ''}</defs><g clip-path="url(#${id}-c)">${body.g}</g></svg>`;
  const skyG = (id, a, b) => `<linearGradient id="${id}-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
  const glide = s => gsap.timeline({ repeat: -1 }).fromTo(s.querySelector('.ride'), { x: -120 }, { x: 130, duration: 1.6, ease: 'none' });
  const embTrain = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><path d="M4 70 L32 40 L46 54 L66 30 L90 56 L102 46 L124 70Z" fill="white"/><path d="M14 80 q0 -4 5 -4 H104 q8 0 10 9 v8 H14Z" fill="white"/><rect x="20" y="81" width="80" height="5" rx="1.5" fill="black"/><rect x="12" y="96" width="106" height="3" fill="white"/></svg>`;
  const DIRS = [
    {
      key: 'B1', name: 'By the lake, refined', idea: 'B tidied: the train mirrors in the lake, a second car, a soft shore line. It glides through on hover.',
      svg: id => sq(id, { defs: skyG(id, C.sky0, C.sky1), g: `
        <rect width="128" height="128" fill="url(#${id}-sky)"/>
        <ellipse cx="36" cy="30" rx="13" ry="4.5" fill="${C.cloud}"/><ellipse cx="44" cy="27" rx="8" ry="5" fill="${C.cloud}"/>
        ${peaks(C.peak, C.snow)}
        <path d="M-4 66 Q30 58 64 62 T132 60 V74 H-4Z" fill="${C.far}"/>
        <rect x="0" y="72" width="128" height="22" fill="${C.lake}"/>
        <path d="M14 77h12M54 80h16M98 76h10" stroke="${C.lakeL}" stroke-width="1.4" stroke-linecap="round"/>
        <g class="ride"><g opacity="0.35" transform="translate(0 182) scale(1 -1)">${trainSide(10, 82, 108)}</g>${trainSide(10, 78, 108)}</g>
        <rect x="0" y="94" width="128" height="2.4" fill="${C.wallD}"/>
        <path d="M0 96 Q60 93 128 95 V128 H0Z" fill="${C.grass}"/>
        <path d="M0 106 Q60 102 128 105 V128 H0Z" fill="${C.grassD}"/>` }),
      play: glide, emblem: embTrain,
    },
    {
      key: 'B2', name: 'Evening', idea: 'B at the new evening hour: a golden sky, alpenglow on the peaks, the train\'s windows lit. Ties to the five hours.',
      svg: id => sq(id, { defs: skyG(id, 'oklch(0.55 0.1 285)', 'oklch(0.86 0.1 60)'), g: `
        <rect width="128" height="128" fill="url(#${id}-sky)"/>
        <circle cx="96" cy="58" r="9" fill="oklch(0.95 0.08 80)" opacity="0.9"/>
        ${peaks('oklch(0.6 0.08 20)', 'oklch(0.9 0.08 40)')}
        <path d="M-4 66 Q30 58 64 62 T132 60 V76 H-4Z" fill="oklch(0.42 0.06 160)"/>
        <rect x="0" y="72" width="128" height="16" fill="oklch(0.45 0.08 280)"/>
        <path d="M86 76h20M90 80h12M94 84h6" stroke="oklch(0.92 0.09 70)" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M0 88 Q60 84 128 87 V128 H0Z" fill="oklch(0.45 0.1 140)"/>
        <rect x="0" y="99" width="128" height="3" fill="oklch(0.55 0.04 60)"/>
        <g class="ride">${trainSide(18, 86, 92).replace(new RegExp(C.glass.replace(/[()]/g, '\\$&'), 'g'), 'oklch(0.86 0.12 75)')}</g>
        <path d="M0 105 Q60 101 128 104 V128 H0Z" fill="oklch(0.38 0.09 145)"/>` }),
      play: glide, emblem: embTrain,
    },
    {
      key: 'B3', name: 'On the viaduct', idea: 'The train crosses a stone arch viaduct over a green valley, peaks behind. Very Swiss, no lake.',
      svg: id => sq(id, { defs: skyG(id, C.sky0, C.sky1), g: `
        <rect width="128" height="128" fill="url(#${id}-sky)"/>
        <ellipse cx="90" cy="28" rx="12" ry="4" fill="${C.cloud}"/>
        ${peaks(C.peak, C.snow)}
        <path d="M-4 70 Q30 60 64 66 T132 62 V128 H-4Z" fill="${C.far}"/>
        <path d="M-4 96 Q40 84 64 98 T132 94 V128 H-4Z" fill="${C.grassD}"/>
        <path fill-rule="evenodd" fill="oklch(0.74 0.02 70)" d="M-2 80 H130 V128 H-2Z ${[14, 42, 70, 98, 126].map(x => `M${x - 10} 128 V100 A10 10 0 0 1 ${x + 10} 100 V128Z`).join(' ')}"/>
        <rect x="-2" y="80" width="132" height="3" fill="oklch(0.62 0.02 70)"/>
        <g class="ride">${trainSide(16, 64, 96)}</g>` }),
      play: glide, emblem: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><path d="M4 66 L32 36 L46 50 L66 26 L90 52 L102 42 L124 66Z" fill="white"/><path d="M14 68 q0 -4 5 -4 H104 q8 0 10 9 v8 H14Z" fill="white"/><rect x="20" y="69" width="80" height="5" rx="1.5" fill="black"/>${[16, 44, 72, 100].map(x => `<path d="M${x - 12} 86 H${x + 12} V118 H${x + 7} V100 Q${x} 92 ${x - 7} 100 V118 H${x - 12}Z" fill="white"/>`).join('')}<rect x="4" y="84" width="120" height="4" fill="white"/></svg>`,
    },
    {
      key: 'B4', name: 'Close crop', idea: 'Tighter: the train fills the width so it reads at 64 px; one peak and the lake behind.',
      svg: id => sq(id, { defs: skyG(id, C.sky0, C.sky1), g: `
        <rect width="128" height="128" fill="url(#${id}-sky)"/>
        <path d="M20 62 L58 20 L96 62Z" fill="${C.peak}"/><path d="M58 20 L70 34 L62 36 L58 31 L52 37 L46 34Z" fill="${C.snow}"/>
        <path d="M-4 60 Q40 52 128 58 V70 H-4Z" fill="${C.far}"/>
        <rect x="0" y="66" width="128" height="14" fill="${C.lake}"/>
        <g class="ride" transform="translate(0 -44) scale(1 1.55) translate(0 0)"><g transform="translate(-6 0)">${trainSide(4, 76, 132)}</g></g>
        <path d="M0 103 Q60 100 128 102 V128 H0Z" fill="${C.grassD}"/>` }),
      play: s => gsap.timeline({ repeat: -1 }).fromTo(s.querySelector('.ride g'), { x: -40 }, { x: 30, duration: 1.2, ease: 'none' }),
      emblem: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><path d="M20 62 L58 20 L96 62Z" fill="white"/><path d="M4 76 q0 -6 7 -6 H112 q10 0 13 11 v18 H4Z" fill="white"/><rect x="10" y="78" width="100" height="9" rx="2" fill="black"/><rect x="4" y="104" width="122" height="5" fill="white"/></svg>`,
    },
    {
      key: 'B5', name: 'B through the window', idea: 'A and B together: the cabin window, and through it the peaks, the lake and a red train on the far shore.',
      svg: id => `<svg viewBox="0 0 128 128"><defs><clipPath id="${id}-c"><rect x="18" y="26" width="92" height="70" rx="12"/></clipPath>${skyG(id, C.sky0, C.sky1)}</defs>
        <rect x="6" y="6" width="116" height="116" rx="14" fill="${C.wall}"/>
        <rect x="13" y="21" width="102" height="80" rx="16" fill="${C.wallD}"/>
        <g clip-path="url(#${id}-c)">
          <rect x="18" y="26" width="92" height="70" fill="url(#${id}-sky)"/>
          <g transform="translate(18 18) scale(0.72)">${peaks(C.peak, C.snow)}</g>
          <path d="M18 66 Q50 60 80 63 T110 62 V72 H18Z" fill="${C.far}"/>
          <g class="ride"><g transform="translate(14 41) scale(0.5)">${trainSide(18, 40, 96)}</g></g>
          <rect x="18" y="70" width="92" height="14" fill="${C.lake}"/>
          <path d="M30 75h10M70 79h14" stroke="${C.lakeL}" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M18 84 Q60 81 110 83 V96 H18Z" fill="${C.grass}"/>
          <rect x="18" y="44" width="92" height="2.2" fill="${C.bar}" opacity="0.9"/>
        </g>
        <rect x="18" y="26" width="92" height="70" rx="12" fill="none" stroke="${C.bar}" stroke-opacity="0.25" stroke-width="1.5"/></svg>`,
      play: s => gsap.timeline({ repeat: -1 }).fromTo(s.querySelector('.ride'), { x: -70 }, { x: 80, duration: 2.4, ease: 'none' }),
      emblem: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect x="12" y="20" width="104" height="82" rx="18" fill="white"/><rect x="20" y="28" width="88" height="66" rx="11" fill="black"/><path d="M20 66 L44 42 L56 52 L72 36 L92 56 L108 50 V66Z" fill="white"/><path d="M36 72 q0 -3 4 -3 H82 q5 0 6 5 v5 H36Z" fill="white"/><rect x="20" y="44" width="88" height="3" fill="white"/></svg>`,
    },
    {
      key: 'A', name: 'Window by day (round 1)', idea: 'Kept from round 1 for comparison.',
      svg: id => `<svg viewBox="0 0 128 128"><defs><clipPath id="${id}-c"><rect x="18" y="26" width="92" height="70" rx="12"/></clipPath></defs>
        <rect x="6" y="6" width="116" height="116" rx="14" fill="${C.wall}"/>
        <rect x="13" y="21" width="102" height="80" rx="16" fill="${C.wallD}"/>
        <g clip-path="url(#${id}-c)"><g class="scene">${view(id)}</g>
          <g class="mast"><rect x="96" y="26" width="5" height="70" fill="${C.bar}"/><rect x="88" y="44" width="14" height="2.4" fill="${C.bar}"/></g>
          <rect x="18" y="44" width="92" height="2.2" fill="${C.bar}" opacity="0.9"/>
        </g>
        <rect x="18" y="26" width="92" height="70" rx="12" fill="none" stroke="${C.bar}" stroke-opacity="0.25" stroke-width="1.5"/></svg>`,
      play: (s) => gsap.timeline({ repeat: -1 }).fromTo(s.querySelector('.mast'), { x: 30 }, { x: -110, duration: 0.6, ease: 'none' }).fromTo(s.querySelectorAll('.glint'), { x: 0 }, { x: -24, duration: 0.6, ease: 'none' }, 0),
      emblem: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect x="12" y="20" width="104" height="82" rx="18" fill="white"/><rect x="20" y="28" width="88" height="66" rx="11" fill="black"/><path d="M20 62 Q44 54 64 58 T108 56 V94 H20Z" fill="white"/><rect x="20" y="66" width="88" height="5" fill="black"/><rect x="20" y="44" width="88" height="3" fill="white"/><rect x="88" y="28" width="6" height="66" fill="white"/></svg>`,
    },
  ];
  const out = document.getElementById('out');
  for (const d of DIRS) {
    const card = document.createElement('div');
    card.className = 'dir';
    card.innerHTML = `<header><b>${d.key}</b><span>${d.name}</span></header><div class="icons">${[256, 128, 64].map(n => `<div class="tile t${n}" tabindex="0">${d.svg(`${d.key}${n}`)}</div>`).join('')}</div>
      <div class="emb"><div class="flash"><i style="--emblem:url('data:image/svg+xml,${encodeURIComponent(d.emblem)}')"></i></div><div class="glass"><i style="--emblem:url('data:image/svg+xml,${encodeURIComponent(d.emblem)}')"></i></div></div><p class="idea">${d.idea}</p>`;
    out.appendChild(card);
    for (const t of card.querySelectorAll('.tile')) {
      const s = t.querySelector('svg');
      d.rest?.(s);
      let tl = null;
      const on = () => { if (reduce || tl) return; tl = d.play(s); };
      const off = () => { if (!tl) return; tl.kill(); tl = null; gsap.set(s.querySelectorAll('.mast,.glint,.ride,.ride > g,.flare'), { clearProps: 'transform,opacity' }); d.rest?.(s); };
      t.addEventListener('pointerenter', on); t.addEventListener('pointerleave', off);
      t.addEventListener('focus', on); t.addEventListener('blur', off);
    }
  }
})();
</script>
</body>
</html>
