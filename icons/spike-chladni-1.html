<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Chladni plate 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Chladni plate 1</h1>
<p class="lede">Chladni plate, a new round: a dark steel plate in the toy's lamp light, gold sand heaped on the nodal lines. A: on a short shaft over its driver. D: set into a walnut cabinet with a tuning dial.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };


  const { sin, cos, PI } = Math;
  const smooth = t => t * t * (3 - 2 * t);
  // Seeded noise keeps every load the same.
  const rng = seed => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

  // The toy's tokens: dark steel, a warm and a cool lamp streak, gold sand.
  const STEEL = [[0, 'oklch(0.24 0.05 272)'], [0.55, 'oklch(0.3 0.06 282)'], [1, 'oklch(0.4 0.08 296)']];
  const WARM = 'oklch(0.78 0.07 55)', COOL = 'oklch(0.7 0.12 215)';
  const SAND = [[0, 'oklch(0.92 0.12 88)'], [1, 'oklch(0.8 0.15 74)']];
  const SAND_SHADE = 'oklch(0.36 0.08 48)', GRAIN = 'oklch(0.9 0.13 84)';
  const EDGE = [[0, 'oklch(0.82 0.03 255)'], [0.45, 'oklch(0.6 0.04 262)'], [1, 'oklch(0.34 0.04 272)']];

  // A free square plate: sand gathers on the zeros of this mode sum.
  const mode = (n, m, s = 1) => (u, v) => cos(n * PI * u) * cos(m * PI * v) + s * cos(m * PI * u) * cos(n * PI * v);
  // Five figures, low tones on the left; the third is the rest figure.
  const FIGS = [mode(0, 2), mode(1, 3, -1), mode(2, 4), mode(2, 5), mode(3, 5)];
  const REST = 2, N = 36;
  // Each figure is sampled once on a grid; a blend mixes the grids.
  const GRIDS = FIGS.map(F => { const g = new Float32Array((N + 1) * (N + 1)); for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) g[j * (N + 1) + i] = F(i / N, j / N); return g; });

  // Marching squares: the zero lines of a grid, as segments in plate space.
  const contour = g => {
    const W = N + 1, segs = [];
    const at = (i, j) => g[j * W + i];
    const cut = (a, b) => a / (a - b);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const a = at(i, j), b = at(i + 1, j), c = at(i + 1, j + 1), d = at(i, j + 1);
      const k = (a > 0) | ((b > 0) << 1) | ((c > 0) << 2) | ((d > 0) << 3);
      if (k === 0 || k === 15) continue;
      const E = [
        () => [(i + cut(a, b)) / N, j / N],
        () => [(i + 1) / N, (j + cut(b, c)) / N],
        () => [(i + 1 - cut(c, d)) / N, (j + 1) / N],
        () => [i / N, (j + 1 - cut(d, a)) / N],
      ];
      const ctr = a + b + c + d > 0;
      const T = { 1: [[3, 0]], 2: [[0, 1]], 3: [[3, 1]], 4: [[1, 2]], 5: ctr ? [[0, 1], [2, 3]] : [[3, 0], [1, 2]], 6: [[0, 2]], 7: [[3, 2]], 8: [[2, 3]], 9: [[0, 2]], 10: ctr ? [[3, 0], [1, 2]] : [[0, 1], [2, 3]], 11: [[1, 2]], 12: [[1, 3]], 13: [[0, 1]], 14: [[3, 0]] }[k];
      for (const [p, q] of T) segs.push([E[p](), E[q]()]);
    }
    return segs;
  };
  // Segments chain into polylines, so a band draws as one smooth stroke.
  const chain = segs => {
    const key = p => `${Math.round(p[0] * 4000)},${Math.round(p[1] * 4000)}`;
    const ends = new Map(), used = new Uint8Array(segs.length), out = [];
    segs.forEach((s, i) => s.forEach((p, e) => { const k = key(p); (ends.get(k) || ends.set(k, []).get(k)).push([i, e]); }));
    const next = (p, from) => (ends.get(key(p)) || []).find(([i]) => i !== from && !used[i]);
    segs.forEach((s, i) => {
      if (used[i]) return;
      used[i] = 1;
      const line = [s[0], s[1]];
      for (const dir of [1, 0]) {
        let tip = dir ? line[line.length - 1] : line[0], from = i, n;
        while ((n = next(tip, from))) {
          used[n[0]] = 1; from = n[0];
          tip = segs[n[0]][1 - n[1]];
          dir ? line.push(tip) : line.unshift(tip);
        }
      }
      out.push(line);
    });
    return out;
  };
  const blendGrid = w => {
    const g = new Float32Array((N + 1) * (N + 1));
    w.forEach((k, m) => { if (k > 1e-3) { const G = GRIDS[m]; for (let i = 0; i < g.length; i++) g[i] += k * G[i]; } });
    return g;
  };
  // A polyline through projected points, rounded by midpoint curves.
  const curve = (pts, P) => {
    const q = pts.map(([u, v]) => P(u, v));
    if (q.length < 3) return `M${f(q[0][0])} ${f(q[0][1])}L${f(q[q.length - 1][0])} ${f(q[q.length - 1][1])}`;
    let d = `M${f(q[0][0])} ${f(q[0][1])}`;
    for (let i = 1; i < q.length - 1; i++) d += `Q${f(q[i][0])} ${f(q[i][1])} ${f((q[i][0] + q[i + 1][0]) / 2)} ${f((q[i][1] + q[i + 1][1]) / 2)}`;
    return d + `L${f(q[q.length - 1][0])} ${f(q[q.length - 1][1])}`;
  };

  // The live plate: the pointer tunes it, and the sand flows to the next figure.
  // g: P (plate to screen), sand elements, the buzzing group, grains, a dial hook.
  const plate = (svg, g) => {
    const $q = s => svg.querySelector(s);
    const sandEls = [...svg.querySelectorAll('.sand')], buzz = $q('.buzz'), grainsG = $q('.grains');
    const r = rng(7);
    const grains = Array.from({ length: 10 }, (_, i) => ({ el: el('rect', { width: 3.4 * g.k, height: 3 * g.k, rx: 1.4 * g.k, fill: GRAIN }, grainsG), ph: i / 10, at: [0.5, 0.5], last: 1 }));
    const st = { w: FIGS.map((_, i) => +(i === REST)), to: REST, live: false, act: 0, amp: 0, t: 0 };
    let lines = chain(contour(GRIDS[REST]));
    const draw = () => {
      const d = lines.filter(l => l.length > 1).map(l => curve(l, g.P)).join('');
      sandEls.forEach(e => e.setAttribute('d', d));
      if (g.dial) g.dial(st.w.reduce((s, k, i) => s + k * i, 0) / (FIGS.length - 1), st.amp);
    };
    const hop = time => {
      const pool = lines.filter(l => l.length > 2);
      for (const p of grains) {
        const ph = (time * 2.2 + p.ph) % 1;
        // Each hop starts on a new spot of the moving lines.
        if (ph < p.last && pool.length) { const l = pool[Math.floor(r() * pool.length)]; const a = l[Math.floor(r() * l.length)]; p.at = [a[0] + (r() - 0.5) * 0.08, a[1] + (r() - 0.5) * 0.08]; }
        p.last = ph;
        const [x, y] = g.P(p.at[0], p.at[1]), h = sin(PI * ph) * 6 * g.k;
        p.el.setAttribute('x', f(x - 1.7 * g.k)); p.el.setAttribute('y', f(y - h - 1.5 * g.k));
        p.el.setAttribute('opacity', f(Math.min(1, st.act * 3) * sin(PI * ph)));
      }
    };
    const loop = clock(time => {
      const dt = Math.min(0.1, time - (st.t || time));
      st.t = time;
      let moved = 0;
      st.w = st.w.map((k, i) => { const n = k + ((i === st.to ? 1 : 0) - k) * Math.min(1, dt * 3.2); moved += Math.abs(n - k); return n; });
      st.act += (Math.min(1, moved / Math.max(dt, 1e-3) * 0.35) - st.act) * 0.25;
      st.amp += ((st.live ? 1 : 0) - st.amp) * 0.12;
      if (moved > 1e-4) lines = chain(contour(blendGrid(st.w)));
      // The plate buzzes while the tone sounds.
      buzz.setAttribute('transform', `translate(0 ${f((Math.round(time * 30) % 2 ? 0.35 : -0.35) * st.amp * g.k)})`);
      hop(time);
      draw();
      if (!st.live && moved < 1e-4 && st.act < 0.01 && st.amp < 0.01) {
        st.w = FIGS.map((_, i) => +(i === st.to)); st.act = 0; st.amp = 0;
        lines = chain(contour(GRIDS[st.to])); buzz.removeAttribute('transform');
        grains.forEach(p => p.el.setAttribute('opacity', 0)); draw(); loop.stop();
      }
    });
    grains.forEach(p => p.el.setAttribute('opacity', 0));
    draw();
    return {
      enter(p) { st.live = true; loop.start(); if (p) this.move(p); else st.to = 3; },
      // The pointer's x picks the tone: low on the left, high on the right.
      move(p) { if (p) st.to = Math.max(0, Math.min(FIGS.length - 1, Math.floor(((p[0] - g.x0) / (g.x1 - g.x0)) * FIGS.length))); },
      leave() { st.live = false; st.to = REST; loop.start(); },
    };
  };
  // The sand as a heap: a dark foot under the gold ridge.
  const sandMarkup = (u, w) => `<path class="sand" fill="none" stroke="${SAND_SHADE}" stroke-width="${f(w + 1.4)}" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 ${f(w * 0.32)})" opacity="0.85"/>
      <path class="sand" fill="none" stroke="url(#${u}sand)" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

  const DIRS = [];

  /* ================= Current ================= */

  // The menu icon today, copied with its hover.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}<linearGradient id="${u}steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="oklch(0.27 0.05 275)"/><stop offset="0.28" stop-color="oklch(0.44 0.07 50)"/><stop offset="0.42" stop-color="oklch(0.28 0.05 278)"/><stop offset="0.7" stop-color="oklch(0.3 0.05 270)"/><stop offset="0.8" stop-color="oklch(0.46 0.09 215)"/><stop offset="1" stop-color="oklch(0.26 0.05 275)"/></linearGradient></defs>
        <rect x="9" y="9" width="110" height="110" rx="5" fill="url(#${u}steel)"/>
        <rect x="9" y="9" width="110" height="110" rx="5" fill="url(#${u}lit)" opacity="0.6"/>
        <rect x="9" y="9" width="110" height="110" rx="5" fill="none" stroke="url(#${u}rim)" stroke-width="1.5"/>
        <circle cx="64" cy="64" r="3.2" fill="oklch(0.22 0.03 270)" stroke="oklch(0.55 0.03 270)" stroke-width="1"/>
        <path class="csand" fill="oklch(0.84 0.15 78)"/>`;
      const clamp2 = (v, a, b) => Math.max(a, Math.min(b, v));
      const mix = (a, b, t) => a + (b - a) * t;
      const MODES = [mode(1, 3), mode(2, 4), mode(3, 5), mode(4, 6), mode(3, 7)];
      const CREST = 1, GRAINS = 640, sets = [];
      const grainsOf = mi => sets[mi] || (sets[mi] = (() => {
        const F = MODES[mi], r = rng(17 + mi * 101), out = [];
        let guard = 0;
        while (out.length < GRAINS && guard++ < 400000) {
          const x = r(), y = r(), e = 1e-3;
          const gx = (F(x + e, y) - F(x - e, y)) / (2 * e), gy = (F(x, y + e) - F(x, y - e)) / (2 * e);
          if (Math.abs(F(x, y)) / (Math.hypot(gx, gy) + 1e-6) < 0.011 * (0.4 + r())) out.push([12 + x * 104, 12 + y * 104]);
        }
        return out.sort((p, q) => Math.atan2(p[1] - 64, p[0] - 64) - Math.atan2(q[1] - 64, q[0] - 64));
      })());
      const sand = svg.querySelector('.csand');
      const cur = grainsOf(CREST).map(p => p.slice());
      const draw = () => { let d = ''; for (const [x, y] of cur) d += `M${x.toFixed(1)} ${y.toFixed(1)}h1.5v1.5h-1.5z`; sand.setAttribute('d', d); };
      draw();
      const lag = cur.map((_, k) => ((k * 7919) % 97) / 97 * 0.3);
      const prox = { t: 0 };
      let idx = CREST, from = null, to = null;
      const migrate = k => {
        if (k === idx) return;
        idx = k; from = cur.map(p => p.slice()); to = grainsOf(k); prox.t = 0;
        gsap.to(prox, { t: 1, duration: 0.95, ease: 'none', overwrite: true, onUpdate() {
          for (let i = 0; i < cur.length; i++) {
            const s = smooth(clamp2((prox.t - lag[i]) / 0.7, 0, 1));
            cur[i][0] = mix(from[i][0], to[i][0], s); cur[i][1] = mix(from[i][1], to[i][1], s);
          }
          draw();
        } });
      };
      const pick = p => migrate(clamp2(Math.floor(((p[0] - 9) / 110) * MODES.length), 0, MODES.length - 1));
      return { enter: p => (p ? pick(p) : migrate(3)), move: p => p && pick(p), leave: () => migrate(CREST) };
    },
  });

  /* ================= A: Shaded object ================= */

  // The plate on a short shaft over its driver, seen from above and in front.
  // Camera: elevation EL, distance CAM; plate side is 1, the post hangs below.
  const EL = 0.62, CAM = 3.6, AS = 96, ACX = 64, ACY = 50;
  const proj = (x, y, z) => {
    const d = CAM - (y * sin(EL) + z * cos(EL)), k = (AS * CAM) / d;
    return [ACX + x * k, ACY - (y * cos(EL) - z * sin(EL)) * k];
  };
  const PA = (u, v) => proj(u * 1.0 - 0.5, 0, v - 0.5);
  const THK = 0.05, POST = 0.52, FOOT = 0.21, FOOT_H = 0.22, BAND = 0.05;
  const ring = (y, r, n = 40) => Array.from({ length: n }, (_, i) => proj(r * cos((i / n) * 2 * PI), y, r * sin((i / n) * 2 * PI)));
  // A cylinder's outline: its top ring and the near half of its bottom ring.
  const cyl = (y0, y1, r) => {
    const top = ring(y0, r), bot = ring(y1, r);
    const L = top.reduce((a, p) => (p[0] < a[0] ? p : a)), R = top.reduce((a, p) => (p[0] > a[0] ? p : a));
    const nearBot = bot.filter((p, i) => sin((i / 40) * 2 * PI) >= 0).sort((p, q) => q[0] - p[0]);
    const farTop = top.filter((p, i) => sin((i / 40) * 2 * PI) <= 0).sort((p, q) => p[0] - q[0]);
    return poly([[L[0], L[1]], ...farTop, [R[0], R[1]], [R[0], R[1] + (bot[0][1] - top[0][1])], ...nearBot, [L[0], L[1] + (bot[0][1] - top[0][1])]]);
  };
  const A_TOP = [PA(0, 0), PA(1, 0), PA(1, 1), PA(0, 1)];
  const A_FRONT = [PA(0, 1), PA(1, 1), proj(0.5, -THK, 0.5), proj(-0.5, -THK, 0.5)];
  const streak = (u0, u1, P) => poly([P(u0, 0), P(u1, 0), P(u1, 1), P(u0, 1)]);
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: 'bbox',
    idea: 'The plate as the toy shows it, now a whole object: dark steel in the warm and cool lamp streaks, on a short shaft over its driver, a squat black can with a brass band, seen from above and in front. Gold sand lies heaped on the nodal lines as bold ridges with a dark foot. The pointer tunes the plate: its x picks one of five tones, low on the left. The plate buzzes, grains hop off the ridges, and the sand flows from figure to figure as the tone sweeps. On leave it flows back to the rest figure.',
    art(svg, u) {
      const foot = cyl(-POST, -POST - FOOT_H, FOOT), footTop = poly(ring(-POST, FOOT)), post = cyl(-THK, -POST, 0.05), band = cyl(-POST, -POST - BAND, FOOT);
      const bolt = proj(0, 0, 0);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}hb`, 3)}
          ${lg(`${u}steel`, STEEL)}
          ${lg(`${u}sand`, SAND)}
          ${lg(`${u}edge`, EDGE, 'x1="0" y1="0" x2="1" y2="0"')}
          ${lg(`${u}warm`, [[0, WARM, 0], [0.5, WARM, 0.68], [1, WARM, 0]], 'x1="0" y1="0" x2="1" y2="0"')}
          ${lg(`${u}cool`, [[0, COOL, 0], [0.5, COOL, 0.72], [1, COOL, 0]], 'x1="0" y1="0" x2="1" y2="0"')}
          ${lg(`${u}iron`, [[0, 'oklch(0.42 0.03 275)'], [0.5, 'oklch(0.26 0.03 278)'], [1, 'oklch(0.18 0.03 280)']], 'x1="0" y1="0" x2="1" y2="0"')}
          ${lg(`${u}brass`, [[0, 'oklch(0.86 0.11 88)'], [0.4, 'oklch(0.74 0.13 78)'], [1, 'oklch(0.45 0.1 65)']], 'x1="0" y1="0" x2="1" y2="0"')}
          ${lg(`${u}chrome`, [[0, 'oklch(0.5 0.02 270)'], [0.35, 'oklch(0.85 0.02 260)'], [1, 'oklch(0.3 0.02 275)']], 'x1="0" y1="0" x2="1" y2="0"')}
          <clipPath id="${u}pc"><path d="${poly(A_TOP)}"/></clipPath></defs>
        <ellipse class="halo" cx="${ACX}" cy="${f(ring(-POST - FOOT_H, FOOT)[10][1] + 1)}" rx="${f(FOOT * AS * 1.25)}" ry="7" fill="oklch(0.05 0.01 290)" opacity="0.6" filter="url(#${u}hb)"/>
        ${body(foot, u, 'iron')}
        <path d="${band}" fill="url(#${u}brass)"/>
        <path d="${footTop}" fill="oklch(0.2 0.03 278)"/>
        <ellipse cx="${ACX}" cy="${f(proj(0, -POST, 0)[1])}" rx="${f(FOOT * AS * 0.55)}" ry="${f(FOOT * AS * 0.55 * 0.5)}" fill="oklch(0.3 0.03 276)"/>
        <path d="${footTop}" fill="url(#${u}lit)"/>
        <g class="buzz">
          ${body(post, u, 'chrome')}
          <path d="${poly(A_FRONT)}" fill="url(#${u}edge)"/>
          <path d="${poly(A_TOP)}" fill="url(#${u}steel)"/>
          <g clip-path="url(#${u}pc)">
            <path d="${streak(0.14, 0.42, PA)}" fill="url(#${u}warm)"/>
            <path d="${streak(0.68, 0.9, PA)}" fill="url(#${u}cool)"/>
            <ellipse cx="${f(bolt[0])}" cy="${f(bolt[1])}" rx="4" ry="${f(4 * sin(EL) * 1.05)}" fill="oklch(0.18 0.03 272)"/>
            <ellipse cx="${f(bolt[0])}" cy="${f(bolt[1] - 0.6)}" rx="2.2" ry="${f(2.2 * sin(EL))}" fill="oklch(0.62 0.03 265)"/>
            ${sandMarkup(u, 4.2)}
          </g>
          <path d="${poly(A_TOP)}" fill="url(#${u}lit)"/>
          <path d="${poly(A_TOP)}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>
          <g class="grains"></g>
        </g>`;
      return plate(svg, { P: PA, k: 1, x0: A_TOP[3][0], x1: A_TOP[2][0] });
    },
    emblem: () => {
      const lines = chain(contour(GRIDS[REST])).map(l => curve(l, PA)).join('');
      return `${EMB_HEAD}<path d="${cyl(-POST, -POST - FOOT_H, FOOT)}" fill="#8a8a8a"/><path d="${cyl(-THK, -POST, 0.05)}" fill="#8a8a8a"/><path d="${cyl(-POST, -POST - BAND, FOOT)}" fill="#c8c8c8"/><path d="${poly(A_FRONT)}" fill="#9a9a9a"/><path d="${poly(A_TOP)}" fill="#5c5c5c"/><path d="${lines}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    },
  });

  /* ================= D: Isometric block ================= */

  // A walnut cabinet is the block; the plate is set into its top.
  // A brass dial on the left face tunes it.
  const CY = 58, HALF = 31.75, T = 34, PLK = 0.84, PLH = 2.6;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const D_TOP = [[-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]].map(([x, y]) => iso(x, y));
  const [N_, E_, S_, W_] = D_TOP;
  const down = (p, h = T) => [p[0], p[1] + h];
  const PD = (u, v) => { const p = iso((u - 0.5) * 2 * HALF * PLK, (v - 0.5) * 2 * HALF * PLK); return [p[0], p[1] - PLH]; };
  const D_PL = [PD(0, 0), PD(1, 0), PD(1, 1), PD(0, 1)];
  const D_PLW = [PD(0, 1), PD(1, 1), [PD(1, 1)[0], PD(1, 1)[1] + PLH], [PD(0, 1)[0], PD(0, 1)[1] + PLH]];
  const D_PLE = [PD(1, 0), PD(1, 1), [PD(1, 1)[0], PD(1, 1)[1] + PLH], [PD(1, 0)[0], PD(1, 0)[1] + PLH]];
  // The left face is the plane gy = HALF; a circle there is an ellipse.
  const LF = (gx, z) => { const p = iso(gx, HALF); return [p[0], p[1] + z]; };
  const DIAL = LF(0, T * 0.5), DIAL_R = 11.5;
  // The face normal points out to the left and down on screen.
  const NRM = [-0.866 * 0.5, 0.5 * 0.5];
  const RF = (gy, z) => { const p = iso(HALF, gy); return [p[0], p[1] + z]; };
  const LAMP = RF(HALF * 0.45, T * 0.5);
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: 'bbox',
    idea: 'A walnut cabinet is the block, at 30 degrees: light top, mid left face, dark right face, rim on the top edges. The plate is set into its top, dark steel with the lamp streaks and the gold sand ridges. A brass tuning dial sits on the left face and an amber pilot lamp on the right. The pointer turns the dial: its x picks the tone, the lamp glows, the plate buzzes, grains hop and the sand flows to the next figure.',
    art(svg, u) {
      const m = `matrix(0.866 0.5 0 1 0 0)`;
      const ell = (c, r, off = 0) => `transform="translate(${f(c[0] + NRM[0] * off)} ${f(c[1] + NRM[1] * off)}) ${m}" r="${r}"`;
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}s`, 2.6)}${blur(`${u}g`, 2)}
          ${lg(`${u}steel`, STEEL, 'x1="0.2" y1="0" x2="0.8" y2="1"')}
          ${lg(`${u}sand`, SAND)}
          ${lg(`${u}warm`, [[0, WARM, 0], [0.5, WARM, 0.5], [1, WARM, 0]], 'x1="0" y1="0" x2="1" y2="1"')}
          ${lg(`${u}cool`, [[0, COOL, 0], [0.5, COOL, 0.55], [1, COOL, 0]], 'x1="0" y1="0" x2="1" y2="1"')}
          ${lg(`${u}wood`, [[0, 'oklch(0.62 0.09 55)'], [1, 'oklch(0.48 0.08 48)']], 'x1="0.2" y1="0" x2="0.8" y2="1"')}
          ${lg(`${u}brass`, [[0, 'oklch(0.9 0.11 90)'], [0.6, 'oklch(0.72 0.13 78)'], [1, 'oklch(0.55 0.11 70)']], 'x1="0" y1="0" x2="1" y2="1"')}
          <clipPath id="${u}pc"><path d="${poly(D_PL)}"/></clipPath></defs>
        <path class="halo" d="${poly([E_, S_, W_, down(W_), down(S_), down(E_)])}" fill="oklch(0.05 0.01 290)" opacity="0.5" filter="url(#${u}s)" transform="translate(0 4)"/>
        <path d="${poly([W_, S_, down(S_), down(W_)])}" fill="oklch(0.44 0.08 50)"/>
        <path d="${poly([S_, E_, down(E_), down(S_)])}" fill="oklch(0.3 0.06 45)"/>
        <path d="${poly([W_, S_, down(S_), down(W_)])}" fill="url(#${u}lit)" opacity="0.4"/>
        <ellipse class="lampglow" cx="${f(LAMP[0])}" cy="${f(LAMP[1])}" rx="9" ry="9" fill="oklch(0.8 0.17 70)" opacity="0" filter="url(#${u}g)"/>
        <circle class="lamp" transform="translate(${f(LAMP[0])} ${f(LAMP[1])}) matrix(0.866 -0.5 0 1 0 0)" r="4.2" fill="oklch(0.62 0.13 62)"/><circle transform="translate(${f(LAMP[0] - 0.8)} ${f(LAMP[1] - 1)}) matrix(0.866 -0.5 0 1 0 0)" r="1.6" fill="#fff" opacity="0.45"/>
        <circle ${ell(DIAL, DIAL_R)} fill="oklch(0.42 0.09 70)"/>
        <circle ${ell(DIAL, DIAL_R, 2)} fill="oklch(0.5 0.1 72)"/>
        <circle ${ell(DIAL, DIAL_R, 4)} fill="url(#${u}brass)"/>
        <circle ${ell(DIAL, DIAL_R, 4)} fill="url(#${u}lit)"/>
        <circle ${ell(DIAL, DIAL_R, 4)} fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
        <g transform="translate(${f(DIAL[0] + NRM[0] * 4)} ${f(DIAL[1] + NRM[1] * 4)}) ${m}"><g class="notch"><rect x="-${DIAL_R - 1.5}" y="-3.2" width="${2 * DIAL_R - 3}" height="6.4" rx="3.2" fill="oklch(0.48 0.1 66)"/></g></g>
        <g transform="translate(${f(DIAL[0] + NRM[0] * 7.5)} ${f(DIAL[1] + NRM[1] * 7.5)}) ${m}"><g class="notch"><rect x="-${DIAL_R - 1.5}" y="-3.2" width="${2 * DIAL_R - 3}" height="6.4" rx="3.2" fill="oklch(0.86 0.11 88)"/></g></g>
        <path d="${poly(D_TOP)}" fill="url(#${u}wood)"/>
        <path d="${poly(D_TOP)}" fill="url(#${u}lit)"/>
        <g class="buzz">
          <path d="${poly(D_PLW)}" fill="oklch(0.62 0.04 260)"/>
          <path d="${poly(D_PLE)}" fill="oklch(0.42 0.04 268)"/>
          <path d="${poly(D_PL)}" fill="url(#${u}steel)"/>
          <g clip-path="url(#${u}pc)">
            <path d="${streak(0.12, 0.4, PD)}" fill="url(#${u}warm)"/>
            <path d="${streak(0.66, 0.88, PD)}" fill="url(#${u}cool)"/>
            ${sandMarkup(u, 3.6)}
          </g>
          <path d="${poly(D_PL)}" fill="url(#${u}lit)" opacity="0.6"/>
          <g class="grains"></g>
        </g>
        <path d="M${f(W_[0])} ${f(W_[1])}L${f(N_[0])} ${f(N_[1])}L${f(E_[0])} ${f(E_[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W_[0])} ${f(W_[1])}L${f(S_[0])} ${f(S_[1])}L${f(E_[0])} ${f(E_[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>`;
      const notch = [...svg.querySelectorAll('.notch')], lamp = svg.querySelector('.lamp'), glow = svg.querySelector('.lampglow');
      // The dial sweeps 240 degrees across the five tones.
      const dial = (t, amp) => {
        notch.forEach(e => e.setAttribute('transform', `rotate(${f(-150 + t * 240)})`));
        lamp.setAttribute('fill', `oklch(${f(0.55 + 0.35 * amp)} ${f(0.12 + 0.05 * amp)} ${f(60 + 18 * amp)})`);
        glow.setAttribute('opacity', f(0.8 * amp));
      };
      return plate(svg, { P: PD, k: 0.8, x0: W_[0], x1: E_[0], dial });
    },
    emblem: () => {
      const lines = chain(contour(GRIDS[REST])).map(l => curve(l, PD)).join('');
      return `${EMB_HEAD}<path d="${poly([W_, S_, down(S_), down(W_)])}" fill="#5a5a5a"/><path d="${poly([S_, E_, down(E_), down(S_)])}" fill="#3a3a3a"/><path d="${poly(D_TOP)}" fill="#8a8a8a"/><path d="${poly(D_PL)}" fill="#444"/><circle transform="translate(${f(DIAL[0] + NRM[0] * 4)} ${f(DIAL[1] + NRM[1] * 4)}) matrix(0.866 0.5 0 1 0 0)" r="${DIAL_R}" fill="#c8c8c8"/><path d="${lines}" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    },
  });

  /* ================= Gallery ================= */
  const NAME = 'Chladni plate';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-chladni';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `chladni-${D.l.toLowerCase()}`;
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    let bb = null;
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      // The fit measures the drawing without its soft halo.
      if (D.box === 'bbox') {
        const skip = [...svg.querySelectorAll('.halo, .grains, .lampglow')];
        skip.forEach(e => e.setAttribute('display', 'none'));
        const r = svg.getBBox();
        skip.forEach(e => e.removeAttribute('display'));
        bb = [r.x, r.y, r.width, r.height];
      }
      fitIcon(svg, bb || D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
    if (!D.emblem) continue;
    // The emblem takes the icon's fitted frame; it also rides in the page.
    let emb = D.emblem();
    if (bb) {
      const side = (Math.max(bb[2], bb[3]) * 128) / 110, cx = bb[0] + bb[2] / 2, cy = bb[1] + bb[3] / 2;
      emb = emb.replace('viewBox="0 0 128 128"', `viewBox="${f(cx - side / 2)} ${f(cy - side / 2)} ${f(side)} ${f(side)}"`);
    }
    window.EMBLEMS[file] = emb;
    const url = `'data:image/svg+xml,${encodeURIComponent(emb)}'`;
    const embEl = document.createElement('div');
    embEl.className = 'emb';
    embEl.innerHTML = `<div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div>`;
    card.querySelector('.icons').after(embEl);
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
