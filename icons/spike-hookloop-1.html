<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Hook and loop 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Hook and loop 1</h1>
<p class="lede">Hook and loop, round 1. No pick yet; A goes on the menu until Tom picks. A: a red hook strap peeling up off a pale loop tape, loops pulled taut at the peel line. D: a block of loop pile with the red strap on its top, its end curled up.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  const DIRS = [];

  // The toy's tokens: a red nylon hook strap, its darker hook side, a pale loop pile.
  const HOOK = [[0, 'oklch(0.68 0.21 31)'], [1, 'oklch(0.5 0.2 27)']];
  const UNDER = [[0, 'oklch(0.44 0.17 25)'], [1, 'oklch(0.3 0.12 22)']];
  const PILE = [[0, 'oklch(0.96 0.018 80)'], [1, 'oklch(0.8 0.03 70)']];
  const PILE_L = [[0, 'oklch(0.78 0.03 72)'], [1, 'oklch(0.62 0.03 66)']];
  const PILE_R = [[0, 'oklch(0.6 0.03 66)'], [1, 'oklch(0.46 0.03 60)']];
  const LOOP = 'oklch(0.97 0.015 85)';

  // The shared motion: the pointer peels the strap; leave presses it back to rest.
  // st.k runs 0 (rest, a short lift) to 1 (peeled far). st.t drives the loop shiver.
  const run = draw => {
    const st = { k: 0, to: 0, t: 0, live: false, last: 0, amp: 0 };
    const step = time => {
      const dt = Math.min(0.1, time - (st.last || time));
      st.last = time;
      st.k += (st.to - st.k) * 0.16;
      st.amp += ((st.live ? 1 : 0) - st.amp) * 0.12;
      st.t += dt;
      draw(st);
      if (!st.live && st.amp < 0.01 && Math.abs(st.k) < 0.004) {
        Object.assign(st, { k: 0, amp: 0, t: 0, last: 0 });
        draw(st);
        loop.stop();
      }
    };
    const loop = clock(step);
    draw(st);
    return {
      enter(p) { st.live = true; st.to = 0.75; loop.start(); if (p) this.move(p); },
      // The pointer further left peels the strap further.
      move(p) { if (p) st.to = 0.55 + 0.45 * clamp((100 - p[0]) / 70); },
      leave() { st.live = false; st.to = 0; loop.start(); },
    };
  };

  // The flap's centre line: from the peel point it bends up on a radius, then runs straight.
  // x0 is the peel point; len the flap length; ang the bend; R the radius. y grows down.
  const flapLine = (x0, y0, len, ang, R, n = 18) => {
    const pts = [];
    const arc = Math.min(len, R * ang);
    for (let i = 0; i <= n; i++) {
      const s = (i / n) * len;
      if (s <= arc) { const a = s / R; pts.push([x0 + R * Math.sin(a), y0 - R * (1 - Math.cos(a)), a]); }
      else { const a = arc / R, r = s - arc; pts.push([x0 + R * Math.sin(a) + r * Math.cos(a), y0 - R * (1 - Math.cos(a)) - r * Math.sin(a), a]); }
    }
    return pts;
  };
  // A band of half width h about a line; side -1 or 1 picks the outer or inner edge.
  const band = (pts, h0, h1) => {
    const L = [], Rr = [];
    pts.forEach(([x, y, a]) => { const nx = -Math.sin(a), ny = -Math.cos(a); L.push([x + nx * h0, y + ny * h0]); Rr.push([x + nx * h1, y + ny * h1]); });
    return poly([...L, ...Rr.reverse()]);
  };

  /* ================= Current ================= */

  // Hook and loop is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // A short, wide strap in three-quarter view: pale loop tape below, red hook tape on top.
  // Its near end curls up and back and shows the dark hook side; white loops stand in the gap.
  // P maps strap space (s along, w across, h up) to the icon.
  const AX = [0.86, -0.34], AB = [0.44, 0.5];
  const P = (s, w, h = 0) => [62 + AX[0] * s + AB[0] * w, 70 + AX[1] * s + AB[1] * w - h];
  const AL = 46, AW = 17, LT = 8, HT = 4;
  const aPeel = k => ({ x0: 12 - 22 * k, ang: 1.5 + 0.65 * k });
  const aShape = k => {
    const { x0, ang } = aPeel(k);
    const pts = flapLine(x0, 0, AL + 6 - x0, ang, 15, 20).map(([x, y]) => [x, -y]);
    const edge = w => pts.map(([s2, up]) => P(s2, w, HT + up));
    const far = edge(-AW), near = edge(AW);
    return {
      x0, pts,
      // The flap: its dark hook side, then its cut near edge in red.
      flap: poly([...far, ...near.slice().reverse()]),
      edge: poly([...near, ...pts.map(([s2, up]) => P(s2, AW, HT + up + 3.2)).reverse()]),
      top: poly([P(-AL, -AW, HT), P(x0, -AW, HT), P(x0, AW, HT), P(-AL, AW, HT)]),
      side: poly([P(-AL, AW, HT), P(x0, AW, HT), P(x0, AW, 0), P(-AL, AW, 0)]),
    };
  };
  // The loop tape: its top, its near side, its end. The near top edge is a row of pile bumps.
  const A_LTOP = poly([P(-AL, -AW), P(AL, -AW), P(AL, AW), P(-AL, AW)]);
  const A_LSIDE = (() => {
    let d = `M${P(-AL, AW).map(f).join(' ')}`;
    for (let s2 = -AL; s2 < AL; s2 += 7) { const m = P(s2 + 3.5, AW + 2.2), e = P(s2 + 7, AW); d += `Q${f(m[0])} ${f(m[1])} ${f(e[0])} ${f(e[1])}`; }
    return d + `L${P(AL, AW, -LT).map(f).join(' ')}L${P(-AL, AW, -LT).map(f).join(' ')}Z`;
  })();
  const A_LEND = poly([P(AL, -AW), P(AL, AW), P(AL, AW, -LT), P(AL, -AW, -LT)]);
  // Stretched loops: white wedges from the pile up to the flap's underside.
  const aTeeth = (sh, k) => {
    const { x0 } = aPeel(k);
    return [-11, -3, 5, 13].map((w, i) => {
      const s2 = x0 + 4 + (i % 2) * 2.5, up = 2.2 + (i % 2) * 2 + sh * Math.sin(i * 2.3);
      const b0 = P(s2 + 2.4, w - 2.2), b1 = P(s2 + 2.4, w + 2.2), t = P(s2 + 0.6, w, up + HT);
      return `M${f(b0[0])} ${f(b0[1])}L${f(t[0] - 0.7)} ${f(t[1])}L${f(t[0] + 0.7)} ${f(t[1])}L${f(b1[0])} ${f(b1[1])}Z`;
    });
  };
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [10, 8, 108, 96],
    idea: 'A short, wide strap in three-quarter view: a pale loop tape with a soft pile edge, the red hook tape on top. Its near end curls up and back and shows the dark hook side; white loops stand pulled taut in the gap. The pointer peels it further: the peel line runs back and the loops shiver. It lies back down when the pointer leaves.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}
          ${lg(`${u}hook`, HOOK, 'x1="0.2" y1="0" x2="0.6" y2="1"')}${lg(`${u}under`, UNDER)}
          ${lg(`${u}pile`, PILE, 'x1="0.2" y1="0" x2="0.6" y2="1"')}${lg(`${u}pl`, PILE_L)}${lg(`${u}pr`, PILE_R)}</defs>
        <path d="${poly([P(-AL, AW, -LT), P(AL, AW, -LT), P(AL, -AW, -LT), P(-AL + 6, -AW, -LT)])}" fill="oklch(0.05 0.01 240)" opacity="0.55" filter="url(#${u}b)" transform="translate(2 6)"/>
        <path d="${A_LEND}" fill="url(#${u}pr)"/>
        <path d="${A_LSIDE}" fill="url(#${u}pl)"/>
        ${body(A_LTOP, u, 'pile')}
        <path class="side" fill="oklch(0.42 0.17 26)"/>
        <path class="top" fill="url(#${u}hook)"/><path class="topLit" fill="url(#${u}lit)"/>
        <path class="flap" fill="url(#${u}under)"/>
        <g class="teeth" fill="${LOOP}"></g>
        <path class="edge" fill="url(#${u}hook)"/>
        <path class="rim" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
      const q = c => svg.querySelector(c);
      return run(st => {
        const s2 = aShape(st.k);
        q('.side').setAttribute('d', s2.side);
        q('.top').setAttribute('d', s2.top); q('.topLit').setAttribute('d', s2.top);
        q('.flap').setAttribute('d', s2.flap);
        q('.edge').setAttribute('d', s2.edge);
        q('.rim').setAttribute('d', `${s2.top} ${s2.flap}`);
        q('.teeth').innerHTML = aTeeth(st.amp * 1.2 * Math.sin(st.t * 40), st.k).map(d => `<path d="${d}"/>`).join('');
      });
    },
    // The emblem: grey loop tape, a white strap and curl outlined dark, white loops in the gap.
    emblem: (() => {
      const s2 = aShape(0);
      return `${EMB_HEAD}<path d="${A_LEND}" fill="#3a3a3a"/><path d="${A_LSIDE}" fill="#5a5a5a"/><path d="${A_LTOP}" fill="#8a8a8a"/><path d="${s2.side}" fill="#fff"/><path d="${s2.top}" fill="#fff"/><path d="${s2.flap}" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/><path d="${s2.flap}" fill="#fff"/>${aTeeth(0, 0).map(d => `<path d="${d}" fill="#fff" stroke="#000" stroke-width="1.6"/>`).join('')}<path d="${s2.edge}" fill="#fff"/></svg>`;
    })(),
  });

  /* ================= D: Isometric block ================= */

  // A block of loop pile; the red strap lies on its top and its end curls up.
  const CY = 52, HX = 44, HY = 15, T = 13;
  const iso = (gx, gy, up = 0) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5 - up];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  const SW = 11, ST = 3.5;
  // The strap's path along gx: flat to the peel point, then a bend up and back.
  const dLine = k => {
    const x0 = 14 - 28 * k, ang = 1.2 + 0.7 * k, R = 9, len = HX + 6 - x0;
    return flapLine(x0, 0, len, ang, R, 16).map(([x, y]) => [x, -y]);
  };
  const dFlap = pts => {
    const a = pts.map(([gx, up]) => iso(gx, -SW, up + ST)), b = pts.map(([gx, up]) => iso(gx, SW, up + ST));
    return poly([...a, ...b.reverse()]);
  };
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [12, 4, 104, 96],
    idea: 'A block of pale loop pile, light on top, as in the toy. The red hook strap lies along its top; its near end curls up and back and shows its dark hook side, with white loops pulled up in the gap. The pointer peels it further; it lies back when the pointer leaves.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}
          ${lg(`${u}top`, PILE, 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}l`, PILE_L)}${lg(`${u}r`, PILE_R)}
          ${lg(`${u}hook`, HOOK, 'x1="0.2" y1="0" x2="0.6" y2="1"')}${lg(`${u}under`, UNDER)}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}l)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}r)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path class="side" fill="oklch(0.42 0.17 26)"/>
        <path class="flat" fill="url(#${u}hook)"/><path class="flatLit" fill="url(#${u}lit)"/>
        <g class="teeth" fill="${LOOP}"></g>
        <path class="flap" fill="url(#${u}under)"/>
        <path class="rim" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
      const q = c => svg.querySelector(c);
      return run(st => {
        const pts = dLine(st.k), x0 = pts[0][0];
        const flat = poly([iso(-HX + 2, -SW, ST), iso(x0, -SW, ST), iso(x0, SW, ST), iso(-HX + 2, SW, ST)]);
        q('.side').setAttribute('d', poly([iso(-HX + 2, SW, ST), iso(x0, SW, ST), iso(x0, SW, 0), iso(-HX + 2, SW, 0)]));
        q('.flat').setAttribute('d', flat); q('.flatLit').setAttribute('d', flat);
        const fl = dFlap(pts);
        q('.flap').setAttribute('d', fl);
        q('.rim').setAttribute('d', `${flat} ${fl}`);
        const sh = st.amp * 0.8 * Math.sin(st.t * 40);
        q('.teeth').innerHTML = [-7, 0, 7].map((gy, i) => {
          const p = pts[3 + (i % 2)], b = iso(p[0] - 1 + sh, gy), t = iso(p[0], gy, p[1] + ST * 0.5);
          return `<path d="M${f(b[0] - 1.8)} ${f(b[1])}L${f(t[0] - 0.6)} ${f(t[1])}L${f(t[0] + 0.6)} ${f(t[1])}L${f(b[0] + 1.8)} ${f(b[1])}Z"/>`;
        }).join('');
      });
    },
    emblem: (() => {
      const pts = dLine(0), x0 = pts[0][0];
      const flat = poly([iso(-HX + 2, -SW, ST), iso(x0, -SW, ST), iso(x0, SW, ST), iso(-HX + 2, SW, ST)]);
      return `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#8a8a8a"/><path d="${flat}" fill="#fff"/><path d="${dFlap(pts)}" fill="#fff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/><path d="${dFlap(pts)}" fill="#fff"/></svg>`;
    })(),
  });


  /* ================= Gallery ================= */
  const NAME = 'Hook and loop';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-hookloop';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `hookloop-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
