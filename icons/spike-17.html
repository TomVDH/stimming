<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 17</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<h1>Icon spike 17</h1>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  // A pointer control from three plain functions; focus plays a demo.
  const ctl = (aim, rest, demo, start = () => {}) => {
    let tl = null;
    return {
      enter(p) { start(); if (p) aim(p); else tl = demo(); },
      move(p) { if (p && !tl) aim(p); },
      leave() { tl?.kill(); tl = null; rest(); },
    };
  };
  // A repeat that runs while the pointer stays.
  const every = (dt, fn) => {
    let dc = null;
    const go = () => { fn(); dc = gsap.delayedCall(dt, go); };
    return { start() { if (!dc) go(); }, stop() { dc?.kill(); dc = null; } };
  };

  /* ================= Bursts ================= */

  const HUES = ['oklch(0.86 0.16 82)', 'oklch(0.72 0.22 350)', 'oklch(0.82 0.13 205)', 'oklch(0.84 0.19 140)', 'oklch(0.72 0.2 32)'];
  let hue = 0;
  const nextHue = () => HUES[hue++ % HUES.length];
  const HOT = 'oklch(0.98 0.04 90)';
  // A burst: rays open from the centre, sag, fade, then go.
  const burst = (parent, cx, cy, { n = 12, R = 18, col = nextHue(), w = 2.2, dur = 1 } = {}) => {
    const g = el('g', { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, parent);
    const rot = Math.random() * TAU;
    const rays = Array.from({ length: n }, () => [el('line', {}, g), el('circle', { r: f(w * 0.7), fill: HOT, stroke: 'none' }, g)]);
    const flash = el('circle', { cx, cy, r: 0, fill: HOT, stroke: 'none' }, g);
    const st = { t: 0 };
    const draw = () => {
      const t = st.t, r = R * (1 - (1 - t) ** 3), tail = R * 0.5 * (1 - 0.5 * t), sag = 6 * t * t;
      rays.forEach(([L, d], i) => {
        const a = rot + (i / n) * TAU, c = Math.cos(a), s = Math.sin(a), r0 = Math.max(0, r - tail);
        L.setAttribute('x1', f(cx + c * r0)); L.setAttribute('y1', f(cy + s * r0 + sag * 0.4));
        L.setAttribute('x2', f(cx + c * r)); L.setAttribute('y2', f(cy + s * r + sag));
        d.setAttribute('cx', f(cx + c * r)); d.setAttribute('cy', f(cy + s * r + sag));
      });
      flash.setAttribute('r', f(R * 0.3 * Math.max(0, 1 - t * 4)));
      g.setAttribute('opacity', f(t < 0.55 ? 1 : Math.max(0, 1 - (t - 0.55) / 0.45)));
    };
    draw();
    return gsap.to(st, { t: 1, duration: dur, ease: 'none', onUpdate: draw, onComplete: () => g.remove() });
  };
  // A shell: a comet climbs to the target, then bursts there.
  const shell = (parent, x0, y0, x1, y1, opts = {}) => {
    const L = el('line', { stroke: 'oklch(0.88 0.1 70)', 'stroke-width': 1.8, 'stroke-linecap': 'round' }, parent);
    const st = { t: 0 };
    return gsap.timeline()
      .to(st, {
        t: 1, duration: opts.rise ?? 0.42, ease: 'power2.out',
        onUpdate() {
          const x = x0 + (x1 - x0) * st.t, y = y0 + (y1 - y0) * st.t, k = 0.25 * (1 - st.t * 0.5);
          L.setAttribute('x1', f(x - (x1 - x0) * k)); L.setAttribute('y1', f(y - (y1 - y0) * k));
          L.setAttribute('x2', f(x)); L.setAttribute('y2', f(y));
        },
      })
      .call(() => { L.remove(); burst(parent, x1, y1, opts); });
  };
  // A still burst for the rest pose: rays and tip dots.
  const still = (cx, cy, r0, r1, n, rot = -Math.PI / 2) => Array.from({ length: n }, (_, i) => {
    const a = rot + (i / n) * TAU, c = Math.cos(a), s = Math.sin(a);
    return [cx + c * r0, cy + s * r0, cx + c * r1, cy + s * r1, cx + c * (r1 + 3.6), cy + s * (r1 + 3.6)];
  });
  const stillSvg = (R, col, w, dot) => `<g stroke="${col}" stroke-width="${w}" stroke-linecap="round">${R.map(r => `<line x1="${f(r[0])}" y1="${f(r[1])}" x2="${f(r[2])}" y2="${f(r[3])}"/>`).join('')}</g>`
    + (dot ? `<g fill="${dot}">${R.map(r => `<circle cx="${f(r[4])}" cy="${f(r[5])}" r="${f(w * 0.6)}"/>`).join('')}</g>` : '');

  const DIRS = [];

  /* ================= Current ================= */

  DIRS.push({
    toy: 'fireworks', l: 'Current', name: 'Menu icon', box: [16, 16, 98, 98], emblemUrl: '../shared/emblems/fireworks.svg',
    art(svg) {
      svg.innerHTML = `
        <rect x="22" y="22" width="92" height="92" fill="oklch(0.07 0.01 260)"/>
        <rect x="16" y="16" width="92" height="92" fill="oklch(0.2 0.04 270)"/>
        <rect x="16" y="88" width="92" height="20" fill="oklch(0.13 0.03 260)"/>
        <path d="M16 88L40 80L62 86L84 78L108 84V88Z" fill="oklch(0.1 0.02 260)"/>
        <g class="bu" stroke="oklch(0.84 0.16 80)" stroke-width="3" stroke-linecap="square">
          <path d="M62 30V40M62 64V74M40 52H50M74 52H84M46.4 36.4L53.5 43.5M70.5 60.5L77.6 67.6M46.4 67.6L53.5 60.5M70.5 43.5L77.6 36.4"/>
        </g>
        <circle class="co" cx="62" cy="52" r="3.4" fill="oklch(0.95 0.06 90)"/>
        <rect class="cm" x="88" y="70" width="2.6" height="10" fill="oklch(0.78 0.18 30)"/>`;
      const b = svg.querySelector('.bu'), c = svg.querySelector('.co'), m = svg.querySelector('.cm');
      let tl = null;
      const play = () => gsap.timeline({ repeat: -1, repeatDelay: 0.2 })
        .fromTo(b, { scale: 0.3, opacity: 1, svgOrigin: '62 52' }, { scale: 1.25, opacity: 0, svgOrigin: '62 52', duration: 0.9, ease: 'power2.out' })
        .fromTo(c, { opacity: 1 }, { opacity: 0.2, duration: 0.5 }, 0)
        .fromTo(m, { y: 0, opacity: 1 }, { y: -40, opacity: 0, duration: 0.9, ease: 'power1.out' }, 0);
      return {
        enter() { if (!tl) tl = play(); }, move() {},
        leave() {
          tl?.kill(); tl = null;
          gsap.to(b, { scale: 1, opacity: 1, svgOrigin: '62 52', duration: 0.3 });
          gsap.to([c, m], { opacity: 1, y: 0, duration: 0.3 });
        },
      };
    },
  });

  /* ================= A · Shaded object ================= */

  // A night bay in a window; shells burst where the pointer is.
  // The water strip mirrors the sky, squashed.
  {
    const HZ = 84;
    const REST = still(60, 44, 6, 15, 10);
    DIRS.push({
      toy: 'fireworks', l: 'A', name: 'Shaded object', box: [16, 16, 98, 98],
      art(svg, id) {
        svg.innerHTML = `
          <defs>
            <clipPath id="${id}k"><rect x="16" y="16" width="92" height="${HZ - 16}"/></clipPath>
            <clipPath id="${id}w"><rect x="16" y="${HZ}" width="92" height="${108 - HZ}"/></clipPath>
            <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="oklch(0.15 0.04 275)"/><stop offset="1" stop-color="oklch(0.27 0.07 300)"/>
            </linearGradient>
          </defs>
          <rect x="22" y="22" width="92" height="92" fill="oklch(0.07 0.01 260)"/>
          <rect x="16" y="16" width="92" height="92" fill="url(#${id}g)"/>
          <g clip-path="url(#${id}k)"><g id="${id}s">
            <g class="rest">${stillSvg(REST, 'oklch(0.86 0.16 82)', 2.6, HOT)}<circle cx="60" cy="44" r="3" fill="${HOT}"/></g>
          </g></g>
          <rect x="16" y="${HZ}" width="92" height="${108 - HZ}" fill="oklch(0.11 0.03 262)"/>
          <g clip-path="url(#${id}w)" opacity="0.42"><use href="#${id}s" transform="matrix(1 0 0 -0.55 0 ${f(HZ * 1.55)})"/></g>
          <path d="M16 ${HZ}L28 79L42 82L56 76L70 81L86 75L108 80V${HZ}Z" fill="oklch(0.09 0.02 262)"/>
          <g fill="oklch(0.82 0.14 70)"><circle cx="34" cy="${HZ - 1.4}" r="1"/><circle cx="62" cy="${HZ - 1.4}" r="1"/><circle cx="90" cy="${HZ - 1.4}" r="1"/></g>
          <path d="M26 93H36M54 98H68M84 92H96M40 103H48" stroke="oklch(0.28 0.04 262)" stroke-width="1.4"/>`;
        const sky = svg.querySelector(`#${id}s`), rest = svg.querySelector('.rest');
        let tx = 60, ty = 44;
        const fire = () => {
          const x = tx + (Math.random() - 0.5) * 8, y = ty + (Math.random() - 0.5) * 6;
          shell(sky, x + (Math.random() - 0.5) * 6, HZ, x, y, { R: 11 + Math.random() * 6 });
        };
        const loop = every(0.5, fire);
        const aim = p => { tx = clamp(p[0], 26, 98); ty = clamp(p[1], 26, HZ - 18); };
        return ctl(aim,
          () => { loop.stop(); gsap.to(rest, { opacity: 1, duration: 0.5, delay: 0.7 }); },
          () => gsap.timeline({ repeat: -1 }).call(() => { tx = 30 + Math.random() * 64; ty = 28 + Math.random() * 30; }).to({}, { duration: 0.5 }),
          () => { gsap.to(rest, { opacity: 0, duration: 0.2, overwrite: true }); loop.start(); });
      },
      emblem: emb(`
        ${stillSvg(still(64, 44, 9, 28, 10), '#fff', 6, '#fff').replace(/r="3.6"/g, 'r="4"')}
        <circle cx="64" cy="44" r="6" fill="#fff"/>
        <path d="M8 88H120" stroke="#fff" stroke-width="6"/>
        <path d="M50 102H78M57 114H71" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      `),
    });
  }

  /* ================= B · Stencil cut-out ================= */

  // A plate with the burst cut out; the light behind follows the pointer.
  {
    const CX = 63, CY = 62;
    const wedge = (a, r0, r1, w0, w1) => {
      const c = Math.cos(a), s = Math.sin(a), nx = -s, ny = c;
      return poly([[CX + c * r0 + nx * w0, CY + s * r0 + ny * w0], [CX + c * r1 + nx * w1, CY + s * r1 + ny * w1], [CX + c * r1 - nx * w1, CY + s * r1 - ny * w1], [CX + c * r0 - nx * w0, CY + s * r0 - ny * w0]]);
    };
    const circ = (x, y, r) => `M${f(x - r)} ${f(y)}a${r} ${r} 0 1 0 ${f(2 * r)} 0a${r} ${r} 0 1 0 ${f(-2 * r)} 0Z`;
    const HOLES = Array.from({ length: 12 }, (_, i) => {
      const a = -Math.PI / 2 + (i / 12) * TAU, long = i % 2 === 0, r1 = long ? 35 : 26;
      return wedge(a, 11, r1, 0.9, long ? 3.4 : 2.4) + circ(CX + Math.cos(a) * (r1 + 6.5), CY + Math.sin(a) * (r1 + 6.5), long ? 2.8 : 2.1);
    }).join('') + circ(CX, CY, 6);
    const PLATE = 'M14 12H112V94L94 112H14Z';
    const REST = { x: 46, y: 40, r: 64, a: 0 };
    DIRS.push({
      toy: 'fireworks', l: 'B', name: 'Stencil cut-out', box: [14, 12, 104, 106],
      art(svg, id) {
        svg.innerHTML = `
          <defs><radialGradient id="${id}g" gradientUnits="userSpaceOnUse" cx="${REST.x}" cy="${REST.y}" r="${REST.r}">
            <stop offset="0" stop-color="oklch(0.98 0.05 95)"/><stop offset="0.25" stop-color="oklch(0.88 0.16 82)"/>
            <stop offset="0.55" stop-color="oklch(0.7 0.21 35)"/><stop offset="0.85" stop-color="oklch(0.55 0.22 350)"/>
            <stop offset="1" stop-color="oklch(0.42 0.17 300)"/>
          </radialGradient></defs>
          <path d="${PLATE}" transform="translate(6 6)" fill="oklch(0.07 0.01 260)"/>
          <path d="${PLATE}" fill="oklch(0.22 0.03 275)"/>
          <path d="M14 12H112" stroke="oklch(0.34 0.03 275)" stroke-width="1.6"/>
          <g class="b"><path d="${HOLES}" fill="url(#${id}g)"/></g>`;
        const g = svg.querySelector('radialGradient'), b = svg.querySelector('.b'), st = { ...REST };
        const paint = () => {
          g.setAttribute('cx', f(st.x)); g.setAttribute('cy', f(st.y)); g.setAttribute('r', f(st.r));
          b.setAttribute('transform', `rotate(${f(st.a)} ${CX} ${CY})`);
        };
        const aim = p => {
          const d = Math.hypot(p[0] - CX, p[1] - CY);
          gsap.to(st, { x: p[0], y: p[1], r: 36 + d * 0.7, a: (p[0] - CX) * 0.18, duration: 0.35, ease: 'power2.out', onUpdate: paint, overwrite: 'auto' });
        };
        return ctl(aim,
          () => gsap.to(st, { ...REST, duration: 0.7, ease: 'power2.inOut', onUpdate: paint, overwrite: 'auto' }),
          () => { const s = { a: 0 }; return gsap.to(s, { a: 1, duration: 2.4, repeat: -1, ease: 'none', onUpdate: () => aim([CX + 30 * Math.cos(s.a * TAU), CY + 30 * Math.sin(s.a * TAU)]) }); });
      },
      emblem: emb(`
        <path d="${PLATE}" fill="#fff"/>
        <path d="${HOLES}" fill="#000"/>
      `),
    });
  }

  /* ================= C · Single-weight line ================= */

  // A willow: one trail opens into drooping arcs; the pointer blows them.
  {
    const C0 = [64, 40], N = 9, T = 1.15;
    const arcs = (wind, g = 40) => Array.from({ length: N }, (_, k) => {
      const a = -Math.PI / 2 + (k - (N - 1) / 2) * ((Math.PI * 0.95) / (N - 1)), vx = 34 * Math.cos(a), vy = 44 * Math.sin(a);
      const P = Array.from({ length: 12 }, (_, i) => {
        const t = (T * i) / 11;
        return [C0[0] + vx * t + wind * 18 * t * t, C0[1] + vy * t + g * t * t];
      });
      let d = `M${f(P[0][0])} ${f(P[0][1])}`;
      for (let i = 0; i < P.length - 1; i++) {
        const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
        d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
      }
      return d;
    });
    const TRAIL = 'M64 116V104M64 98V60M64 54V46';
    DIRS.push({
      toy: 'fireworks', l: 'C', name: 'Single-weight line', box: [24, 22, 80, 96],
      art(svg) {
        svg.innerHTML = `<g fill="none" stroke="oklch(0.86 0.15 82)" stroke-width="3" stroke-linecap="round">
          <path d="${TRAIL}"/>${arcs(0).map(d => `<path class="a" pathLength="1" stroke-dasharray="1 1" d="${d}"/>`).join('')}</g>`;
        const A = [...svg.querySelectorAll('.a')], st = { w: 0, g: 40 };
        const paint = () => arcs(st.w, st.g).forEach((d, i) => A[i].setAttribute('d', d));
        const aim = p => gsap.to(st, { w: clamp((64 - p[0]) / 40, -1.2, 1.2), g: 34 + clamp(p[1] / 128, 0, 1) * 16, duration: 0.4, ease: 'power2.out', onUpdate: paint, overwrite: 'auto' });
        return ctl(aim,
          () => gsap.to(st, { w: 0, g: 40, duration: 1.1, ease: 'elastic.out(1, 0.4)', onUpdate: paint, overwrite: 'auto' }),
          () => { const s = { a: 0 }; return gsap.to(s, { a: 1, duration: 2.2, repeat: -1, ease: 'none', onUpdate: () => aim([64 + 44 * Math.sin(s.a * TAU), 64]) }); },
          () => gsap.fromTo(A, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.55, ease: 'power2.out', stagger: 0.02 }));
      },
      emblem: emb(`
        <g fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round">
          <path d="${TRAIL}"/>
          ${arcs(0).map(d => `<path d="${d}"/>`).join('\n')}
        </g>
      `),
    });
  }

  /* ================= D · Isometric block ================= */

  // A rack of mortar tubes; the tube under the pointer fires to it.
  {
    const O = [64, 80], S = 26, H = 16, c30 = 0.866;
    const P = (i, j, k = 1) => [O[0] + (i - j) * c30 * S * k, O[1] + (i + j) * 0.5 * S * k];
    const TOP = [P(-1, -1), P(1, -1), P(1, 1), P(-1, 1)];
    const L = [P(-1, 1), P(1, 1), [P(1, 1)[0], P(1, 1)[1] + H], [P(-1, 1)[0], P(-1, 1)[1] + H]];
    const R = [P(1, 1), P(1, -1), [P(1, -1)[0], P(1, -1)[1] + H], [P(1, 1)[0], P(1, 1)[1] + H]];
    const SIL = [P(-1, -1), P(1, -1), R[2], R[3], L[3], P(-1, 1)];
    const TUBES = [];
    for (let s = -2; s <= 2; s++) for (let i = -1; i <= 1; i++) { const j = s - i; if (j >= -1 && j <= 1) TUBES.push(P(i, j, 0.62)); }
    const REST = still(64, 28, 4, 12, 10);
    DIRS.push({
      toy: 'fireworks', l: 'D', name: 'Isometric block', box: [16, 10, 100, 118],
      art(svg) {
        svg.innerHTML = `
          <path d="${poly(SIL)}" transform="translate(6 6)" fill="oklch(0.07 0.01 260)"/>
          <path d="${poly(TOP)}" fill="oklch(0.36 0.05 275)"/>
          <path d="${poly(L)}" fill="oklch(0.25 0.04 275)"/>
          <path d="${poly(R)}" fill="oklch(0.17 0.035 275)"/>
          ${TUBES.map(([x, y]) => `<ellipse class="tb" cx="${f(x)}" cy="${f(y)}" rx="6.2" ry="3.6" fill="oklch(0.08 0.01 260)" stroke="oklch(0.48 0.05 275)" stroke-width="1.4"/>`).join('')}
          <g class="rest">${stillSvg(REST, 'oklch(0.86 0.16 82)', 2.4, HOT)}<path d="M64 36V44M64 49V53" stroke="oklch(0.86 0.1 70)" stroke-width="1.8" stroke-linecap="round"/></g>
          <g class="fx"></g>`;
        const tubes = [...svg.querySelectorAll('.tb')], fx = svg.querySelector('.fx'), rest = svg.querySelector('.rest');
        let cur = 4, ty = 30;
        const light = k => tubes.forEach((t, i) => t.setAttribute('stroke', i === k ? 'oklch(0.86 0.16 82)' : 'oklch(0.48 0.05 275)'));
        const fire = () => { const [x, y] = TUBES[cur]; shell(fx, x, y, x + (Math.random() - 0.5) * 6, ty, { R: 9 + Math.random() * 5, n: 10, rise: 0.36 }); };
        const loop = every(0.42, fire);
        const aim = p => {
          // The nearest tube across wins; the front one breaks a tie.
          let k = 0, best = 1e9;
          TUBES.forEach(([x, y], i) => { const s = Math.abs(x - p[0]) * 10 - y * 0.01; if (s < best) { best = s; k = i; } });
          cur = k; ty = clamp(p[1], 16, 44); light(cur);
        };
        return ctl(aim,
          () => { loop.stop(); light(-1); gsap.to(rest, { opacity: 1, duration: 0.5, delay: 0.6 }); },
          () => gsap.timeline({ repeat: -1 }).call(() => aim([36 + Math.random() * 56, 18 + Math.random() * 24])).to({}, { duration: 0.42 }),
          () => { gsap.to(rest, { opacity: 0, duration: 0.2, overwrite: true }); loop.start(); });
      },
      emblem: emb(`
        <path d="${poly(SIL)}" fill="#fff"/>
        <path d="${poly(TOP)}" fill="none" stroke="#000" stroke-width="2"/>
        <path d="M${f(P(1, 1)[0])} ${f(P(1, 1)[1])}V${f(P(1, 1)[1] + H)}" stroke="#000" stroke-width="2"/>
        ${TUBES.map(([x, y]) => `<ellipse cx="${f(x)}" cy="${f(y)}" rx="6.2" ry="3.6" fill="#000"/>`).join('\n')}
        ${stillSvg(still(64, 26, 5, 15, 10), '#fff', 4, '#fff')}
      `),
    });
  }

  /* ================= E · Abstract mark ================= */

  // A peony ring; the burst's origin follows the pointer, so every tail points to it.
  {
    const C = [64, 64], R = 34, N = 16;
    const COL = i => `oklch(0.8 0.17 ${(30 + i * 22) % 360})`;
    const geo = (o, p) => Array.from({ length: N }, (_, i) => {
      const a = -Math.PI / 2 + (i / N) * TAU;
      let x = C[0] + R * Math.cos(a), y = C[1] + R * Math.sin(a);
      const dx = x - o[0], dy = y - o[1], m = Math.hypot(dx, dy) || 1, ux = dx / m, uy = dy / m;
      if (p) { const q = Math.hypot(x - p[0], y - p[1]), w = 7 * Math.exp(-(q * q) / 300); x += ux * w; y += uy * w; }
      const L = 0.42 * m;
      return [x, y, x - ux * L, y - uy * L];
    });
    DIRS.push({
      toy: 'fireworks', l: 'E', name: 'Abstract mark', box: [24, 24, 80, 80],
      art(svg) {
        svg.innerHTML = Array.from({ length: N }, (_, i) => `<line class="t" stroke="${COL(i)}" stroke-width="3" stroke-linecap="round" opacity="0.7"/><circle class="d" r="3.6" fill="${COL(i)}"/>`).join('')
          + `<circle class="o" r="4" fill="${HOT}"/>`;
        const T = [...svg.querySelectorAll('.t')], D = [...svg.querySelectorAll('.d')], O = svg.querySelector('.o');
        const st = { x: C[0], y: C[1], px: 0, py: 0, on: 0 };
        const paint = () => {
          geo([st.x, st.y], st.on ? [st.px, st.py] : null).forEach(([x, y, x0, y0], i) => {
            T[i].setAttribute('x1', f(x0)); T[i].setAttribute('y1', f(y0)); T[i].setAttribute('x2', f(x)); T[i].setAttribute('y2', f(y));
            D[i].setAttribute('cx', f(x)); D[i].setAttribute('cy', f(y));
          });
          O.setAttribute('cx', f(st.x)); O.setAttribute('cy', f(st.y));
        };
        paint();
        const aim = p => {
          const dx = p[0] - C[0], dy = p[1] - C[1], m = Math.hypot(dx, dy), k = m > 22 ? 22 / m : 1;
          st.on = 1;
          gsap.to(st, { x: C[0] + dx * k, y: C[1] + dy * k, px: p[0], py: p[1], duration: 0.3, ease: 'power2.out', onUpdate: paint, overwrite: 'auto' });
        };
        return ctl(aim,
          () => gsap.to(st, { x: C[0], y: C[1], duration: 0.8, ease: 'elastic.out(1, 0.5)', onUpdate: paint, onComplete() { st.on = 0; paint(); }, overwrite: 'auto' }),
          () => { const s = { a: 0 }; return gsap.to(s, { a: 1, duration: 2.4, repeat: -1, ease: 'none', onUpdate: () => aim([64 + 30 * Math.cos(s.a * TAU), 64 + 30 * Math.sin(s.a * TAU)]) }); });
      },
      emblem: emb(`
        ${geo(C, null).map(([x, y, x0, y0]) => `<path d="M${f(x0)} ${f(y0)}L${f(x)} ${f(y)}" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="${f(x)}" cy="${f(y)}" r="5" fill="#fff"/>`).join('\n')}
        <circle cx="64" cy="64" r="6" fill="#fff"/>
      `),
    });
  }

  /* ================= Gallery ================= */

  const NAMES = { fireworks: 'Fireworks' };
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    const b = box ? { x: box[0], y: box[1], width: box[2], height: box[3] } : svg.getBBox(), side = Math.max(b.width, b.height);
    if (!side || b.x < -2 || b.y < -2 || b.x + b.width > 130 || b.y + b.height > 130) return;
    const size = (side * 128) / 110, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  let uid = 0;
  window.EMBLEMS = {};
  for (const toy of Object.keys(NAMES)) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${NAMES[toy]}</h2><div class="row"></div>`;
    out.append(sec);
    for (const D of DIRS.filter(d => d.toy === toy)) {
      const file = `${toy}-${D.l.toLowerCase()}`;
      const url = D.emblemUrl || (D.emblem ? `spike/emblems/${file}.svg` : '');
      if (D.emblem) window.EMBLEMS[file] = D.emblem;
      const card = document.createElement('article');
      card.className = 'dir';
      card.id = file;
      card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const c = D.art(svg, `u${++uid}`);
        fitIcon(svg, D.box);
        if (reduce) return;
        tile.addEventListener('pointerenter', e => c.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => c.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => c.leave());
        tile.addEventListener('focus', () => c.enter(null));
        tile.addEventListener('blur', () => c.leave());
      });
    }
  }
})();
</script>
</body>
