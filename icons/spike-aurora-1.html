<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Fjord aurora 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Fjord aurora 1</h1>
<p class="lede">Fjord aurora, round 1. No pick yet; A goes on the menu until Tom picks. A: a snowy spire over a dark pool, a green curtain of aurora sweeping up behind it. D: a block of dark fjord water with the spire on its back half and the curtain behind.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  const DIRS = [];

  // The toy's tokens: navy rock, blue-white snow, aurora green with a pink hem.
  const ROCK = [[0, 'oklch(0.36 0.05 255)'], [1, 'oklch(0.17 0.035 262)']];
  const SNOW = 'oklch(0.95 0.025 220)';
  const POOL = [[0, 'oklch(0.3 0.06 250)'], [1, 'oklch(0.13 0.035 262)']];
  const GREEN = 'oklch(0.85 0.2 158)', PINK = 'oklch(0.72 0.19 350)';
  // A ray: bright green at its foot, a red-violet top that fades out.
  const RAY = [[0, 'oklch(0.9 0.19 155)', 0.95], [0.45, 'oklch(0.78 0.2 158)', 0.55], [0.85, 'oklch(0.55 0.17 15)', 0.18], [1, 'oklch(0.5 0.15 10)', 0]];

  // One curtain: ray strips standing on a folded lower edge.
  // edge(x) gives the lower edge; h(i) gives each ray's height.
  const curtain = (u, x0, x1, n, edge, h) => {
    const w = (x1 - x0) / n, rays = [];
    // The strips overlap, so they read as rays in one sheet.
    for (let i = 0; i < n; i++) {
      const a = x0 + (i - 0.3) * w, b = Math.min(x1, a + w * 1.6);
      rays.push({ a, b, ya: edge(a), yb: edge(b), h: h(i) });
    }
    return rays;
  };
  const rayPath = (r, k = 1) => poly([[r.a, r.ya], [r.b, r.yb], [r.b, r.yb - r.h * k], [r.a, r.ya - r.h * k]]);
  // The emblem's curtain: one band from the lower edge up to the ray tops.
  const band = (rays, edge) => poly([...rays.map(r => [r.a, edge(r.a)]), ...rays.slice().reverse().map(r => [r.a, edge(r.a) - r.h])]);
  const edgePath = (x0, x1, edge) => { let d = ''; for (let x = x0; x <= x1 + 0.01; x += 4) d += `${d ? 'L' : 'M'}${f(x)} ${f(edge(x))}`; return d; };

  // The shared motion: the pointer brings a substorm.
  // The rays brighten and ripple along the arc, and the hem turns pink.
  const run = (rays, model, hems, glows) => {
    const st = { live: false, k: 0, last: 0 };
    const paint = time => {
      rays.forEach((p, i) => {
        const r = model[i], w = Math.sin(time * 4.2 - i * 0.75) * 0.5 + 0.5;
        const k = 1 + st.k * (0.22 * w + 0.12);
        p.setAttribute('d', rayPath(r, k));
        p.setAttribute('opacity', f(0.5 + st.k * (0.2 + 0.2 * w)));
      });
      hems.forEach(h => h.setAttribute('opacity', f(st.k * 0.85)));
      glows.forEach(g => g.setAttribute('opacity', f(0.45 + st.k * 0.4)));
    };
    const step = time => {
      const dt = Math.min(0.1, time - (st.last || time));
      st.last = time;
      st.k = st.live ? Math.min(1, st.k + dt * 2.2) : Math.max(0, st.k - dt * 1.4);
      paint(time);
      if (!st.live && st.k <= 0 && st.last > 0) { st.last = 0; loop.stop(); }
    };
    const loop = clock(step);
    return {
      enter() { st.live = true; loop.start(); },
      move() {},
      leave() { st.live = false; loop.start(); },
    };
  };

  /* ================= Current ================= */

  // Fjord aurora is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // A snowy spire stands over a dark pool; a curtain sweeps up behind it.
  const A_EDGE = x => 60 - (x - 8) * 0.28 + 7 * Math.sin(x * 0.06 + 0.3);
  const A_RAYS = curtain('a', 8, 120, 26, A_EDGE, i => 25 + 8 * Math.sin(i * 0.5) + 4 * Math.sin(i * 1.9));
  const A_PEAK = 'M16 90L30 70L38 64L46 52L56 26L64 44L70 40L78 50L86 47L112 90Z';
  // The snow: a cap on the spire and a field on the shoulder.
  const A_SNOW = 'M49 45L56 26L63 42L60 40L57 46L54 41L51 47ZM74 46L78 50L86 47L92 56L88 54L84 57L80 53L76 55Z';
  // The lit flank: the aurora lights the west face of the spire.
  const A_FLANK = 'M38 64L46 52L56 26L52 50L46 62L40 70Z';
  const A_POOL = { cx: 64, cy: 96, rx: 54, ry: 12 };
  // The reflection: the peak flipped at the shore and pressed flat.
  const flipY = (d, y0, k) => d.replace(/([ML])(-?\d+(?:\.\d+)?) (-?\d+(?:\.\d+)?)/g, (m, c, x, y) => `${c}${x} ${f(y0 + (y0 - +y) * k)}`);
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [8, 10, 112, 100],
    idea: 'A snowy Lofoten spire stands over a dark round pool. Behind it a curtain of aurora sweeps up from the left: green rays on a folded lower edge, their tops fading to red. The pool doubles the peak and the green. The pointer brings a substorm: the rays brighten and ripple along the arc, and the lower edge turns pink. It settles when the pointer leaves.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 4)}${blur(`${u}c`, 1.4)}
          ${lg(`${u}rock`, ROCK)}${lg(`${u}pool`, POOL)}${lg(`${u}ray`, RAY, 'x1="0" y1="1" x2="0" y2="0"')}${lg(`${u}rayr`, RAY)}
          <clipPath id="${u}pc"><ellipse cx="${A_POOL.cx}" cy="${A_POOL.cy}" rx="${A_POOL.rx}" ry="${A_POOL.ry}"/></clipPath></defs>
        <ellipse cx="64" cy="108" rx="52" ry="4" fill="oklch(0.05 0.01 240)" opacity="0.6" filter="url(#${u}b)"/>
        <path class="glow" d="${edgePath(8, 120, A_EDGE)}" fill="none" stroke="${GREEN}" stroke-width="7" opacity="0.45" filter="url(#${u}g)"/>
        <g class="rays">${A_RAYS.map(r => `<path d="${rayPath(r)}" fill="url(#${u}ray)" opacity="0.5"/>`).join('')}</g>
        <path class="hem" d="${edgePath(8, 120, A_EDGE)}" fill="none" stroke="${PINK}" stroke-width="2.2" stroke-linecap="round" opacity="0" filter="url(#${u}c)"/>
        ${body(A_PEAK, u, 'rock')}
        <path d="${A_FLANK}" fill="${GREEN}" opacity="0.16"/>
        <path d="${A_SNOW}" fill="${SNOW}"/>
        ${body(`M${A_POOL.cx - A_POOL.rx} ${A_POOL.cy}A${A_POOL.rx} ${A_POOL.ry} 0 1 0 ${A_POOL.cx + A_POOL.rx} ${A_POOL.cy}A${A_POOL.rx} ${A_POOL.ry} 0 1 0 ${A_POOL.cx - A_POOL.rx} ${A_POOL.cy}Z`, u, 'pool')}
        <g clip-path="url(#${u}pc)">
          <g opacity="0.5">${A_RAYS.map(r => `<path d="${poly([[r.a, 92], [r.b, 92], [r.b, 92 + r.h * 0.4], [r.a, 92 + r.h * 0.4]])}" fill="url(#${u}rayr)"/>`).join('')}</g>
          <path d="${flipY(A_PEAK, 90, 0.32)}" fill="oklch(0.16 0.035 262)" opacity="0.9"/>
          <path d="${flipY(A_SNOW, 90, 0.32)}" fill="${SNOW}" opacity="0.35"/>
        </g>`;
      const rays = [...svg.querySelectorAll('.rays path')];
      return run(rays, A_RAYS, [...svg.querySelectorAll('.hem')], [...svg.querySelectorAll('.glow')]);
    },
    // The emblem: the spire white, the rays grey behind it, the pool dark grey.
    emblem: `${EMB_HEAD}<path d="${band(A_RAYS, A_EDGE)}" fill="#8c8c8c"/><path d="${A_PEAK}" fill="#fff"/><ellipse cx="${A_POOL.cx}" cy="${A_POOL.cy}" rx="${A_POOL.rx}" ry="${A_POOL.ry}" fill="#5a5a5a"/><path d="${flipY(A_PEAK, 90, 0.32)}" fill="#fff" opacity="0.9"/></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A block of dark water; a spire stands on its back half; a curtain hangs behind.
  const CY = 74, HX = 30, HY = 30, T = 14;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // The spire's foot runs across the top, from the west edge to the east edge.
  const D_PEAK = 'M26 72L36 60L44 54L56 22L62 40L68 36L76 46L84 44L102 72L64 80Z';
  const D_LIT = 'M36 60L44 54L56 22L60 60L64 80L26 72Z';
  const D_SNOW = 'M50 38L56 22L62 40L59 38L56 44L53 39ZM71 41L76 46L84 44L90 52L85 50L81 53L77 49Z';
  const D_EDGE = x => 46 - (x - 10) * 0.28 + 6 * Math.sin(x * 0.06 + 0.1);
  const D_RAYS = curtain('d', 10, 118, 24, D_EDGE, i => 24 + 7 * Math.sin(i * 0.5) + 4 * Math.sin(i * 1.9));
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [10, 8, 108, 102],
    idea: 'A block of dark fjord water at 30 degrees: a navy top that holds a green streak of reflected light, a mid left face, a dark right face, a rim on the top edges. A snowy spire stands on its back half, lit green on its west face; a curtain of aurora hangs behind. The pointer brings a substorm: the rays brighten and ripple, and the lower edge turns pink.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 4)}${blur(`${u}c`, 1.4)}
          ${lg(`${u}top`, [[0, 'oklch(0.34 0.06 250)'], [1, 'oklch(0.2 0.045 260)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.28 0.045 255)'], [1, 'oklch(0.2 0.035 260)']])}
          ${lg(`${u}R`, [[0, 'oklch(0.18 0.03 262)'], [1, 'oklch(0.12 0.025 264)']])}
          ${lg(`${u}rock`, ROCK)}${lg(`${u}ray`, RAY, 'x1="0" y1="1" x2="0" y2="0"')}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path class="glow" d="${edgePath(10, 118, D_EDGE)}" fill="none" stroke="${GREEN}" stroke-width="7" opacity="0.45" filter="url(#${u}g)"/>
        <g class="rays">${D_RAYS.map(r => `<path d="${rayPath(r)}" fill="url(#${u}ray)" opacity="0.5"/>`).join('')}</g>
        <path class="hem" d="${edgePath(10, 118, D_EDGE)}" fill="none" stroke="${PINK}" stroke-width="2.2" stroke-linecap="round" opacity="0" filter="url(#${u}c)"/>
        <path d="${poly([W, S, down(S), down(W)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, E, down(E), down(S)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${poly([iso(-6, 22), iso(22, -6), iso(26, -2), iso(-2, 26)])}" fill="${GREEN}" opacity="0.3" filter="url(#${u}c)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        ${body(D_PEAK, u, 'rock')}
        <path d="${D_LIT}" fill="${GREEN}" opacity="0.14"/>
        <path d="${D_SNOW}" fill="${SNOW}"/>`;
      const rays = [...svg.querySelectorAll('.rays path')];
      return run(rays, D_RAYS, [...svg.querySelectorAll('.hem')], [...svg.querySelectorAll('.glow')]);
    },
    emblem: `${EMB_HEAD}<path d="${band(D_RAYS, D_EDGE)}" fill="#8c8c8c"/><path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#2a2a2a"/><path d="${D_PEAK}" fill="#fff"/></svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Fjord aurora';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-aurora';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `aurora-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
