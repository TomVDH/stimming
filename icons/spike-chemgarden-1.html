<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Chemical garden 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Chemical garden 1</h1>
<p class="lede">Chemical garden, round 1, drawn with the toy built. A: the tank from the front, lit from behind, four towers in four salts. D: the tank is the block, the surface on top, the towers seen through the glass.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };
  // A smooth path through points.
  const spline = pts => {
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d;
  };

  // The toy's tokens: the four salts (light, wall, deep), the lamp, the liquid, the grit.
  const SALT = {
    copper: ['oklch(0.9 0.07 210)', 'oklch(0.7 0.13 228)', 'oklch(0.44 0.13 248)'],
    cobalt: ['oklch(0.82 0.1 330)', 'oklch(0.58 0.18 305)', 'oklch(0.36 0.14 295)'],
    nickel: ['oklch(0.94 0.08 135)', 'oklch(0.8 0.14 148)', 'oklch(0.52 0.12 155)'],
    iron: ['oklch(0.86 0.12 75)', 'oklch(0.62 0.15 50)', 'oklch(0.36 0.1 40)'],
  };
  const LAMP = [[0, 'oklch(0.72 0.035 88)'], [0.55, 'oklch(0.46 0.03 85)'], [1, 'oklch(0.24 0.02 250)']];
  const AIR = 'oklch(0.2 0.015 250)', LINE = 'oklch(0.96 0.02 90)', GRIT = [[0, 'oklch(0.56 0.012 85)'], [1, 'oklch(0.36 0.012 80)']];

  // A tower is a tube in three strokes: deep wall, wall, a pale core.
  // A tower grows by its dash; a bead swells at its tip and pops.
  const towerMarkup = (t, i, u) => {
    const [li, mid, deep] = SALT[t.salt];
    const parts = [t, ...(t.branches || [])];
    const tube = p => { const d = spline(p.pts); return `<path class="w" d="${d}" pathLength="100" stroke="${deep}" stroke-width="${p.w}" />`
      + `<path class="w" d="${d}" pathLength="100" stroke="${mid}" stroke-width="${f(p.w * 0.6)}" />`
      + `<path class="w" d="${d}" pathLength="100" stroke="${li}" stroke-width="${f(p.w * 0.22)}" transform="translate(${f(-p.w * 0.16)} 0)" opacity="0.85"/>`; };
    return `<g class="tw" data-i="${i}" fill="none" stroke-linecap="round">${parts.map((p, k) => `<g class="pt" data-k="${k}">${tube(p)}<circle class="bead" r="0" fill="${mid}"/><circle class="puff" r="0" fill="url(#${u}pf${i})" opacity="0"/></g>`).join('')}</g>`;
  };
  const gem = (x, y, s, salt) => { const [li, mid, deep] = SALT[salt]; return `<path d="${poly([[x - s, y], [x - s * 0.4, y - s * 0.9], [x + s * 0.6, y - s * 0.7], [x + s, y], [x + s * 0.2, y + s * 0.5]])}" fill="${deep}"/><path d="${poly([[x - s * 0.4, y - s * 0.9], [x + s * 0.6, y - s * 0.7], [x + s * 0.1, y - s * 0.1]])}" fill="${li}" opacity="0.8"/>`; };
  const puffGrads = (u, list) => list.map((t, i) => rg(`${u}pf${i}`, [[0, SALT[t.salt][0], 0.9], [1, SALT[t.salt][1], 0]])).join('');

  // The garden's motion, shared by A and D.
  // Enter: the towers sink back and grow again in pulses; each pulse swells
  // a bead at the tip, which pops in a puff of colour. The tower under the
  // pointer grows fastest. Leave: the towers finish and the beads go.
  const garden = (svg, list, xOf) => {
    const groups = [...svg.querySelectorAll('.tw')].map(g => [...g.querySelectorAll('.pt')].map(p => ({ w: [...p.querySelectorAll('.w')], bead: p.querySelector('.bead'), puff: p.querySelector('.puff'), path: p.querySelector('.w') })));
    const st = list.map((t, i) => ({ g: 1, ph: i * 0.37, pa: 9, focus: 0, lens: groups[i].map(p => p.path.getTotalLength()) }));
    let live = false, last = 0, at = null, sink = 0;
    const draw = () => list.forEach((t, i) => {
      const s = st[i], parts = [t, ...(t.branches || [])];
      groups[i].forEach((p, k) => {
        // A branch starts once the trunk passes its fork.
        const from = parts[k].from || 0;
        const g = k ? clamp((s.g - from) / (1 - from)) : s.g;
        const dash = `${f(g * 100)} 200`;
        p.w.forEach(w => w.setAttribute('stroke-dasharray', dash));
        const tip = p.path.getPointAtLength(s.lens[k] * Math.max(0.001, g));
        const ph = s.ph % 1, swell = live && g > 0.02 && g < 1 ? clamp(ph / 0.7) ** 2 : 0;
        const bw = parts[k].w;
        p.bead.setAttribute('cx', f(tip.x)); p.bead.setAttribute('cy', f(tip.y));
        p.bead.setAttribute('r', f(g > 0.02 ? bw * (0.45 + 0.55 * swell) : 0));
        p.puff.setAttribute('cx', f(tip.x)); p.puff.setAttribute('cy', f(tip.y - s.pa * 6));
        p.puff.setAttribute('r', f(bw * (0.6 + s.pa * 1.6)));
        p.puff.setAttribute('opacity', f(clamp(1 - s.pa) ** 1.5 * 0.55));
      });
    });
    const step = time => {
      const dt = last ? Math.min(0.1, time - last) : 1 / 30;
      last = time;
      let busy = false;
      list.forEach((t, i) => {
        const s = st[i];
        s.focus = lerp(s.focus, at == null ? 0 : Math.exp(-((xOf(t) - at) ** 2) / 180), 0.15);
        if (live && sink > 0) { s.g = lerp(s.g, 0.18, 0.3); }
        else if (live) {
          const rate = (1.1 + 1.4 * s.focus) * (0.8 + 0.2 * Math.sin(i * 3.1));
          const before = s.ph % 1;
          s.ph += dt * rate;
          const now = s.ph % 1;
          // The bead pops at 0.7 of each pulse; the tube then surges up.
          if (before < 0.7 && now >= 0.7 && s.g < 1) s.pa = 0;
          s.g = Math.min(1, s.g + dt * (now > 0.7 ? 0.42 : 0.035) * (1 + s.focus));
          busy = true;
        } else {
          s.g = lerp(s.g, 1, 0.12);
          if (s.g < 0.999) busy = true; else s.g = 1;
        }
        if (s.pa < 1) { s.pa += dt * 1.6; busy = true; }
      });
      sink = Math.max(0, sink - dt);
      draw();
      if (!live && !busy) { last = 0; loop.stop(); }
    };
    const loop = clock(step);
    draw();
    return {
      enter(p) { live = true; sink = 0.35; at = p ? p[0] : null; loop.start(); },
      move(p) { if (p) at = p[0]; },
      leave() { live = false; at = null; loop.start(); },
    };
  };

  const DIRS = [];

  /* ================= Current ================= */

  // The toy is new; it has no menu icon yet.
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    art(svg) {
      svg.innerHTML = `<rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="oklch(0.3 0.015 275)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="64" y="68" text-anchor="middle" fill="oklch(0.5 0.02 275)" font-size="10" font-family="Gabarito, sans-serif" letter-spacing="1">NO ICON</text>`;
      return { enter() {}, move() {}, leave() {} };
    },
  });

  /* ================= A: Shaded object ================= */

  // The tank from the front: liquid lit from behind, a band of air, the waterline, grit.
  const A_TANK = 'M22 22H106Q112 22 112 28V102Q112 108 106 108H22Q16 108 16 102V28Q16 22 22 22Z';
  const A_AIR = 'M22 22H106Q112 22 112 28V34H16V28Q16 22 22 22Z';
  const A_BED = 'M16 98H112V102Q112 108 106 108H22Q16 108 16 102Z';
  const A_TOWERS = [
    { salt: 'iron', w: 7, pts: [[30, 99], [29, 91], [32, 84], [29, 76]], branches: [{ from: 0.35, w: 4.6, pts: [[30, 92], [36, 86], [39, 80]] }, { from: 0.6, w: 3.8, pts: [[31, 86], [25, 81], [23, 74]] }] },
    { salt: 'copper', w: 5.6, pts: [[48, 99], [46, 88], [49, 76], [45, 64], [48, 52], [45, 42], [47, 37]] },
    { salt: 'cobalt', w: 4.6, pts: [[70, 99], [72, 89], [68, 79], [72, 69], [69, 58], [73, 48], [70, 38]], branches: [{ from: 0.4, w: 3.4, pts: [[71, 72], [78, 64], [80, 55], [86, 46]] }] },
    { salt: 'nickel', w: 3.8, pts: [[96, 99], [97, 87], [94, 75], [98, 62], [95, 50], [98, 38]] },
  ];
  const A_SEEDS = A_TOWERS.map(t => gem(t.pts[0][0], 100, 3.4, t.salt)).join('');
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [14, 20, 100, 90],
    idea: 'The tank from the front, as the toy shows it: liquid lit by a lamp behind, a band of air over the silver waterline, pale grit on the floor. Four towers grow from their seed crystals, one per salt: a rust iron bush, a tall blue copper tube, a violet cobalt tube with a branch, a thin green nickel wisp. Hover sinks them and grows them again in pulses: a bead swells at each tip and pops in a puff of its colour. The tower under the pointer grows fastest.',
    art(svg, u) {
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}g`, 6)}
          ${rg(`${u}lamp`, LAMP, 'cx="0.52" cy="0.42" r="0.62"')}${lg(`${u}bed`, GRIT)}${puffGrads(u, A_TOWERS)}
          ${lg(`${u}glass`, [[0, '#fff', 0.13], [0.35, '#fff', 0], [0.7, '#fff', 0], [1, '#fff', 0.07]], 'x1="0" y1="0" x2="1" y2="0"')}
          <clipPath id="${u}clip"><path d="${A_TANK}"/></clipPath></defs>
        <ellipse cx="64" cy="112" rx="46" ry="4" fill="oklch(0.05 0.01 250)" opacity="0.6" filter="url(#${u}b)"/>
        <ellipse cx="64" cy="62" rx="50" ry="42" fill="oklch(0.62 0.045 85)" opacity="0.42" filter="url(#${u}g)"/>
        ${body(A_TANK, u, 'lamp')}
        <g clip-path="url(#${u}clip)">
          <path d="${A_AIR}" fill="${AIR}" opacity="0.75"/>
          <rect x="16" y="33.2" width="96" height="2.4" fill="${LINE}" opacity="0.95"/>
          <rect x="16" y="35.6" width="96" height="4" fill="${LINE}" opacity="0.18"/>
          <path d="${A_BED}" fill="url(#${u}bed)"/>
          ${A_TOWERS.map((t, i) => towerMarkup(t, i, u)).join('')}
          ${A_SEEDS}
          <path d="M28 22L22 108H34L40 22Z" fill="#fff" opacity="0.06"/>
        </g>
        <path d="${A_TANK}" fill="url(#${u}glass)"/>
        <path d="${A_TANK}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
      return garden(svg, A_TOWERS, t => t.pts[0][0]);
    },
    emblem: `${EMB_HEAD}<path d="${A_TANK}" fill="#fff"/><path d="${A_AIR}" fill="#000" opacity="0.45"/><rect x="16" y="33" width="96" height="2.6" fill="#fff"/><path d="${A_BED}" fill="#000" opacity="0.3"/><g fill="none" stroke="#000" stroke-linecap="round">${A_TOWERS.flatMap(t => [t, ...(t.branches || [])]).map(p => `<path d="${spline(p.pts)}" stroke-width="${f(p.w * 1.05)}"/>`).join('')}</g></svg>`,
  });

  /* ================= D: Isometric block ================= */

  // The tank is the block: the water surface on top, liquid glass on the two faces.
  // The towers stand inside, seen through the glass; their tips meet the surface.
  const CY = 44, HX = 24, HY = 24, T = 50;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), E = iso(HX, -HY), S = iso(HX, HY), W = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  // A tower at floor point (gx, gy): its points rise straight up in iso.
  const riser = (gx, gy, h, wig) => {
    const [x, y] = down(iso(gx, gy));
    return wig.map((dx, i) => [x + dx, y - (h * T * i) / (wig.length - 1)]);
  };
  const D_TOWERS = [
    { salt: 'copper', w: 4.6, pts: riser(-18, 12, 0.92, [0, -2, 1.5, -1.5, 1, -0.5]) },
    { salt: 'cobalt', w: 3.8, pts: riser(-4, 2, 0.88, [0, 2, -1.5, 2, -1, 1.5]), branches: [{ from: 0.45, w: 2.8, pts: [] }] },
    { salt: 'nickel', w: 3.2, pts: riser(16, -14, 0.86, [0, 1, -1.5, 1.5, -1, 0.5]) },
    { salt: 'iron', w: 6, pts: riser(20, 6, 0.32, [0, -1, 1.5, -0.5]), branches: [{ from: 0.4, w: 4, pts: [] }] },
  ];
  // Branches leave the trunk at its fork and lean out.
  for (const t of D_TOWERS) for (const b of t.branches || []) {
    const n = t.pts.length - 1, k = Math.round(b.from * n), p = t.pts[k], s = t.salt === 'iron' ? -1 : 1;
    b.pts = [p, [p[0] + 4 * s, p[1] - 5], [p[0] + 7 * s, p[1] - 10], [p[0] + 10 * s, p[1] - 14]];
  }
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [20, 18, 88, 102],
    idea: 'The tank is the block: the water surface on top, pale and lit; liquid glass on the two faces, lit from behind and darker to the right; a line of grit at the foot. Four towers stand inside, seen through the glass, one per salt. Hover sinks them and grows them again in pulses, a bead swelling and popping at each tip. The tower under the pointer grows fastest.',
    art(svg, u) {
      const top = poly([N, E, S, W]);
      const left = poly([W, S, down(S), down(W)]), right = poly([S, E, down(E), down(S)]);
      const bedL = poly([down(W, 0.9), down(S, 0.9), down(S), down(W)]), bedR = poly([down(S, 0.9), down(E, 0.9), down(E), down(S)]);
      svg.innerHTML = `<defs>${light(u)}${blur(`${u}b`, 2.6)}${blur(`${u}g`, 5)}${puffGrads(u, D_TOWERS)}
          ${lg(`${u}lf`, [[0, 'oklch(0.62 0.035 88)'], [1, 'oklch(0.34 0.025 80)']], 'x1="0.2" y1="0" x2="0.5" y2="1"')}
          ${lg(`${u}rf`, [[0, 'oklch(0.42 0.03 85)'], [1, 'oklch(0.22 0.02 250)']], 'x1="0" y1="0" x2="0.4" y2="1"')}
          ${lg(`${u}top`, [[0, 'oklch(0.95 0.025 90)'], [1, 'oklch(0.78 0.03 88)']], 'x1="0.2" y1="0" x2="0.7" y2="1"')}
          ${lg(`${u}bed`, GRIT)}</defs>
        <path d="${poly([E, S, W, down(W), down(S), down(E)])}" fill="oklch(0.05 0.01 250)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 4)"/>
        <path d="${left}" fill="url(#${u}lf)"/>
        <path d="${right}" fill="url(#${u}rf)"/>
        <path d="${bedL}" fill="url(#${u}bed)"/><path d="${bedR}" fill="url(#${u}bed)" opacity="0.7"/>
        ${D_TOWERS.map((t, i) => towerMarkup(t, i, u)).join('')}
        <path d="${left}" fill="url(#${u}lit)" opacity="0.45"/>
        <path d="${right}" fill="#000" opacity="0.12"/>
        <path d="${top}" fill="url(#${u}top)" opacity="0.92"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        ${D_TOWERS.filter(t => t.salt !== 'iron').map(t => { const p = t.pts[t.pts.length - 1]; return `<ellipse cx="${f(p[0])}" cy="${f(p[1] - 0.5)}" rx="${f(t.w * 0.9)}" ry="${f(t.w * 0.45)}" fill="${SALT[t.salt][1]}" opacity="0.55"/>`; }).join('')}
        <path d="M${f(W[0])} ${f(W[1])}L${f(N[0])} ${f(N[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(W[0])} ${f(W[1])}L${f(S[0])} ${f(S[1])}L${f(E[0])} ${f(E[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(S[0])} ${f(S[1])}L${f(S[0])} ${f(S[1] + T)}" stroke="#fff" stroke-opacity="0.22" stroke-width="1.5"/>`;
      return garden(svg, D_TOWERS, t => t.pts[0][0]);
    },
    emblem: `${EMB_HEAD}<path d="${poly([W, S, down(S), down(W)])}" fill="#5a5a5a"/><path d="${poly([S, E, down(E), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, E, S, W])}" fill="#bdbdbd"/><g fill="none" stroke="#fff" stroke-linecap="round">${D_TOWERS.flatMap(t => [t, ...(t.branches || [])]).map(p => `<path d="${spline(p.pts)}" stroke-width="${f(p.w)}"/>`).join('')}</g></svg>`,
  });


  /* ================= Gallery ================= */
  const NAME = 'Chemical garden';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-chemgarden';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `chemgarden-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(window.EMBLEMS);
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
