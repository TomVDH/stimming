<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike 5</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; }
.dir header b { font-size: 15px; font-weight: 800; color: var(--fg); }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.defs { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- The menu's shared light: a rim and a soft top-left glint. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.32" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- The menu's own fills for the two current icons. -->
    <linearGradient id="g-knob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.89 0.13 88)"/>
      <stop offset="1" style="stop-color: oklch(0.64 0.17 48)"/>
    </linearGradient>
    <linearGradient id="g-cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.92 0.1 165)"/>
      <stop offset="1" style="stop-color: oklch(0.64 0.13 225)"/>
    </linearGradient>
    <linearGradient id="g-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.88 0.01 250)"/>
      <stop offset="1" style="stop-color: oklch(0.56 0.02 255)"/>
    </linearGradient>
    <!-- Fidget board. -->
    <linearGradient id="fb-cream-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.98 0.01 90)"/>
      <stop offset="1" style="stop-color: oklch(0.87 0.02 85)"/>
    </linearGradient>
    <linearGradient id="fb-cream-skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.84 0.02 85)"/>
      <stop offset="1" style="stop-color: oklch(0.58 0.025 75)"/>
    </linearGradient>
    <linearGradient id="fb-teal-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.88 0.11 165)"/>
      <stop offset="1" style="stop-color: oklch(0.72 0.13 168)"/>
    </linearGradient>
    <linearGradient id="fb-teal-skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.66 0.12 170)"/>
      <stop offset="1" style="stop-color: oklch(0.44 0.1 178)"/>
    </linearGradient>
    <linearGradient id="fb-dish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="fb-gold" gradientUnits="userSpaceOnUse" x1="9" y1="9" x2="119" y2="119">
      <stop offset="0" style="stop-color: oklch(0.9 0.13 88)"/>
      <stop offset="1" style="stop-color: oklch(0.72 0.16 62)"/>
    </linearGradient>
    <linearGradient id="fb-coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.8 0.14 40)"/>
      <stop offset="1" style="stop-color: oklch(0.58 0.19 28)"/>
    </linearGradient>
    <!-- Pendulum wave. -->
    <linearGradient id="pw-plate" gradientUnits="userSpaceOnUse" x1="9" y1="9" x2="119" y2="119">
      <stop offset="0" style="stop-color: oklch(0.72 0.18 32)"/>
      <stop offset="0.5" style="stop-color: oklch(0.82 0.15 80)"/>
      <stop offset="1" style="stop-color: oklch(0.7 0.13 180)"/>
    </linearGradient>
    <linearGradient id="pw-ring" gradientUnits="userSpaceOnUse" x1="9" y1="9" x2="119" y2="119">
      <stop offset="0" style="stop-color: oklch(0.5 0.03 275)"/>
      <stop offset="1" style="stop-color: oklch(0.34 0.02 275)"/>
    </linearGradient>
  </defs>
</svg>

<h1>Icon spike 5</h1>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2;
  const BG = 'oklch(0.16 0.012 275)';
  const f = n => +n.toFixed(2);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  const emb = body => `${EMB_HEAD}\n${body.trim().split('\n').map(l => '  ' + l.trim()).filter(l => l.trim()).join('\n')}\n</svg>\n`;
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  // Hover loops: play while hovered, then settle to rest.
  const hoverLoop = (play, rest) => {
    let tl = null;
    return { enter() { if (!tl) tl = play(); }, move() {}, leave() { tl?.kill(); tl = null; rest(); } };
  };
  // A shaded bob: the menu's rainbow sphere at hue h.
  const bobGrad = (svg, id, h) => {
    const defs = svg.querySelector('defs') || el('defs', {}, svg);
    const g = el('radialGradient', { id, cx: 0.35, cy: 0.3, r: 0.75 }, defs);
    [[0, 0.95, 0.06], [0.45, 0.74, 0.17], [1, 0.45, 0.13]].forEach(([o, l, c]) => el('stop', { offset: o, style: `stop-color: oklch(${l} ${c} ${h})` }, g));
    return `url(#${id})`;
  };
  const HUE = (k, n = 7) => 28 + (k * 288) / (n - 1);

  const DIRS = [];

  /* ================= Fidget board ================= */

  // Current: the menu dial turns to face the pointer in 15° detents.
  DIRS.push({
    toy: 'fidget', l: 'Current', name: '', current: true,
    art(svg) {
      svg.innerHTML = `
        <g class="ticks" stroke="oklch(0.78 0.11 72)" stroke-width="4"></g>
        <circle cx="64" cy="64" r="39" fill="url(#g-knob)"/>
        <circle cx="64" cy="64" r="39" fill="url(#lit)"/>
        <circle cx="64" cy="64" r="39" fill="none" stroke="url(#rim)" stroke-width="2"/>
        <circle cx="64" cy="64" r="29" fill="none" stroke="oklch(0.55 0.12 50 / 0.45)" stroke-width="2.5"/>
        <g class="knob"><rect x="60" y="28" width="8" height="24" rx="4" fill="oklch(0.36 0.08 45)"/></g>
        <rect x="80" y="80" width="40" height="40" rx="7" style="fill: var(--bg)"/>
        <rect x="85" y="85" width="30" height="30" rx="5" fill="url(#g-cell)"/>
        <rect x="85" y="85" width="30" height="30" rx="5" fill="url(#lit)"/>
        <rect x="85" y="85" width="30" height="30" rx="5" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
        <circle cx="100" cy="100" r="6" fill="oklch(0.42 0.1 225)"/>`;
      const ticks = svg.querySelector('.ticks'), knob = svg.querySelector('.knob');
      for (let k = 0; k < 24; k++) {
        const a = (k / 24) * TAU, r0 = k % 6 ? 51 : 47;
        if (a > 1.9 && a < 2.9) continue;
        el('line', { x1: 64 + r0 * Math.sin(a), y1: 64 - r0 * Math.cos(a), x2: 64 + 58 * Math.sin(a), y2: 64 - 58 * Math.cos(a) }, ticks);
      }
      let dial = 0;
      const aim = p => {
        if (!p) return;
        const want = Math.round((Math.atan2(p[0] - 64, 64 - p[1]) * 180) / Math.PI / 15) * 15;
        const step = ((((want - dial) % 360) + 540) % 360) - 180;
        if (!step) return;
        dial += step;
        gsap.to(knob, { rotation: dial, svgOrigin: '64 64', duration: 0.25, ease: 'back.out(3)', overwrite: true });
      };
      return { enter: aim, move: aim, leave() {} };
    },
    emblemUrl: '../shared/emblems/fidget.svg',
  });

  // A: four keycaps; the key under the pointer goes down.
  {
    const KEYS = [[10, 10], [68, 10], [10, 68], [68, 68]];
    DIRS.push({
      toy: 'fidget', l: 'A', name: 'Shaded object',
      art(svg) {
        const K = KEYS.map(([x, y], i) => {
          const teal = i === 1, g = el('g', {}, svg);
          el('rect', { x, y, width: 50, height: 50, rx: 10, fill: `url(#fb-${teal ? 'teal' : 'cream'}-skirt)` }, g);
          const top = el('g', {}, g);
          el('rect', { x: x + 6, y: y + 4, width: 38, height: 36, rx: 8, fill: `url(#fb-${teal ? 'teal' : 'cream'}-top)` }, top);
          el('rect', { x: x + 10, y: y + 8, width: 30, height: 28, rx: 6, fill: 'url(#fb-dish)' }, top);
          el('rect', { x: x + 6, y: y + 4, width: 38, height: 36, rx: 8, fill: 'none', stroke: 'url(#rim)', 'stroke-width': 1.2 }, top);
          const led = teal ? el('circle', { cx: x + 25, cy: y + 14, r: 3.2, style: 'fill: oklch(0.38 0.07 190)' }, top) : null;
          return { x, y, top, led, down: false };
        });
        const press = (k, on) => {
          if (k.down === on) return;
          k.down = on;
          gsap.to(k.top, { y: on ? 4.5 : 0, duration: on ? 0.07 : 0.4, ease: on ? 'power2.out' : 'back.out(3)', overwrite: true });
          if (k.led) gsap.to(k.led, { fill: on ? 'oklch(0.96 0.17 135)' : 'oklch(0.38 0.07 190)', duration: on ? 0.05 : 0.5, overwrite: true });
        };
        const at = p => K.forEach(k => press(k, !!p && p[0] > k.x - 4 && p[0] < k.x + 54 && p[1] > k.y - 4 && p[1] < k.y + 54));
        return { enter: p => (p ? at(p) : press(K[1], true)), move: at, leave: () => K.forEach(k => press(k, false)) };
      },
      emblem: emb(KEYS.map(([x, y], i) => `
        <rect x="${x}" y="${y}" width="50" height="50" rx="10" fill="#fff"/>
        <rect x="${x + 6}" y="${y + 4}" width="38" height="36" rx="8" fill="none" stroke="#000" stroke-width="3"/>
        ${i === 1 ? `<circle cx="${x + 25}" cy="${y + 15}" r="4.5" fill="#000"/>` : ''}`).join('\n')),
    });
  }

  // B: one amber plate; the guard cover lifts and the switch flips on.
  {
    // Hazard stripes cut the band at 45°.
    const stripes = Array.from({ length: 19 }, (_, i) => `M${-124 + i * 14} 128L${4 + i * 14} 0`).join('');
    const band = 'M19 9H109A10 10 0 0 1 119 19V109A10 10 0 0 1 109 119H19A10 10 0 0 1 9 109V19A10 10 0 0 1 19 9ZM34 27A7 7 0 0 0 27 34V94A7 7 0 0 0 34 101H94A7 7 0 0 0 101 94V34A7 7 0 0 0 94 27Z';
    DIRS.push({
      toy: 'fidget', l: 'B', name: 'Stencil cut-out',
      art(svg, u) {
        svg.innerHTML = `
          <clipPath id="${u}b"><path d="${band}" clip-rule="evenodd"/></clipPath>
          <path d="${band}" fill-rule="evenodd" style="fill: oklch(0.82 0.15 82)"/>
          <path d="${stripes}" clip-path="url(#${u}b)" style="stroke: ${BG}" stroke-width="5"/>
          <rect x="50" y="46" width="28" height="48" rx="6" style="fill: oklch(0.82 0.15 82)"/>
          <rect x="59" y="52" width="10" height="36" rx="5" style="fill: ${BG}"/>
          <circle class="lever" cx="64" cy="81" r="6.5" style="fill: oklch(0.82 0.15 82); stroke: ${BG}" stroke-width="2.5"/>
          <g class="cover">
            <rect class="lid" x="31" y="31" width="66" height="66" rx="6" style="fill: oklch(0.82 0.15 82); stroke: ${BG}" stroke-width="2.5"/>
            <path d="M31 41H97M53 88H75" style="stroke: ${BG}" stroke-width="3" stroke-linecap="round"/>
          </g>`;
        const cover = svg.querySelector('.cover'), lid = svg.querySelector('.lid'), lever = svg.querySelector('.lever');
        const st = { a: 0, s: 0 };
        // The lid turns on its top hinge; past 90° we see its dark back.
        const draw = () => {
          const c = Math.cos((st.a * Math.PI) / 180);
          cover.setAttribute('transform', `translate(0 31) scale(1 ${f(c)}) translate(0 -31)`);
          lid.style.fill = c < 0 ? 'oklch(0.6 0.12 60)' : 'oklch(0.82 0.15 82)';
          lever.setAttribute('cy', f(81 - st.s * 22));
        };
        draw();
        const tl = gsap.timeline({ paused: true, onUpdate: draw })
          .to(st, { a: 112, duration: 0.34, ease: 'power2.out' })
          .to(st, { s: 1, duration: 0.16, ease: 'back.out(3)' }, 0.26);
        return { enter: () => tl.timeScale(1).play(), move() {}, leave: () => tl.timeScale(1.6).reverse() };
      },
      emblem: emb(`
        <clipPath id="c"><path d="${band}" clip-rule="evenodd"/></clipPath>
        <path d="${band}" fill-rule="evenodd" fill="#fff"/>
        <path d="${stripes}" clip-path="url(#c)" stroke="#000" stroke-width="5.5"/>
        <rect x="31" y="31" width="66" height="66" rx="6" fill="#fff"/>
        <path d="M31 42H97M53 87H75" stroke="#000" stroke-width="4" stroke-linecap="round"/>`),
    });
  }

  // C: a fader bank in one line; the pointer sets the fader under it.
  {
    const XS = [38, 64, 90], REST = [74, 44, 64], Y0 = 24, Y1 = 104;
    const ticks = XS.map(x => Array.from({ length: 9 }, (_, i) => `M${x + 11} ${Y0 + i * 10}h${i % 4 ? 3 : 5}`).join('')).join('');
    const ink = 'oklch(0.86 0.09 82)';
    DIRS.push({
      toy: 'fidget', l: 'C', name: 'Single-weight line',
      art(svg) {
        const line = { fill: 'none', style: `stroke: ${ink}`, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
        el('rect', { x: 9, y: 9, width: 110, height: 110, rx: 12, ...line }, svg);
        el('path', { d: ticks, ...line }, svg);
        const F = XS.map((x, i) => ({ x, y: REST[i], track: el('path', line, svg), cap: el('path', line, svg) }));
        // The track breaks around the cap, so no fill hides it.
        const draw = () => F.forEach(q => {
          q.track.setAttribute('d', `M${q.x} ${Y0 - 6}V${f(q.y - 7)}M${q.x} ${f(q.y + 7)}V${Y1 + 6}`);
          q.cap.setAttribute('d', `M${q.x - 9} ${f(q.y - 5)}h18a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-18a2 2 0 0 1 -2 -2v-6a2 2 0 0 1 2 -2ZM${q.x - 6} ${f(q.y)}h12`);
        });
        draw();
        const go = (q, y, d = 0) => gsap.to(q, { y, duration: 0.22, delay: d, ease: 'back.out(2.2)', overwrite: true, onUpdate: draw });
        const at = p => {
          if (!p) return;
          const q = F.find(q => Math.abs(p[0] - q.x) < 13);
          if (!q) return;
          const y = clamp(Y0 + Math.round((p[1] - Y0) / 10) * 10, Y0, Y1);
          if (y !== q.ty) { q.ty = y; go(q, y); }
        };
        return { enter: p => (p ? at(p) : go(F[1], 84)), move: at, leave: () => F.forEach((q, i) => { q.ty = null; go(q, REST[i], i * 0.05); }) };
      },
      emblem: emb(`
        <rect x="10" y="10" width="108" height="108" rx="12" fill="none" stroke="#fff" stroke-width="5"/>
        ${XS.map((x, i) => `<path d="M${x} 20V${REST[i] - 9}M${x} ${REST[i] + 9}V108" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <rect x="${x - 11}" y="${REST[i] - 6}" width="22" height="12" rx="3" fill="none" stroke="#fff" stroke-width="5"/>`).join('\n')}`),
    });
  }

  // D: a fidget cube; button, dial and switch run in turn.
  {
    const S = 54, k = S / 100, c = 0.866;
    // Each face maps a 100-unit square onto the cube.
    const TOP = `matrix(${f(c * k)} ${f(0.5 * k)} ${f(-c * k)} ${f(0.5 * k)} 64 ${64 - S})`;
    const RIGHT = `matrix(${f(c * k)} ${f(-0.5 * k)} 0 ${f(k)} 64 64)`;
    const LEFT = `matrix(${f(c * k)} ${f(0.5 * k)} 0 ${f(k)} ${f(64 - c * S)} ${f(64 - 0.5 * S)})`;
    const faceShape = '<rect x="0" y="0" width="100" height="100" rx="7"/>';
    DIRS.push({
      toy: 'fidget', l: 'D', name: 'Isometric block',
      art(svg) {
        svg.innerHTML = `
          <g transform="${LEFT}" style="fill: oklch(0.4 0.035 265); stroke: ${BG}" stroke-width="3">${faceShape}</g>
          <g transform="${RIGHT}" style="fill: oklch(0.29 0.03 268); stroke: ${BG}" stroke-width="3">${faceShape}</g>
          <g transform="${TOP}" style="fill: oklch(0.54 0.04 262); stroke: ${BG}" stroke-width="3">${faceShape}</g>
          <g transform="${TOP}"><rect width="100" height="100" rx="7" fill="url(#lit)"/><circle cx="50" cy="50" r="31" style="fill: oklch(0.3 0.03 265)"/></g>
          <g class="btn"><g transform="${TOP}"><circle cx="50" cy="50" r="24" fill="url(#fb-coral)"/><circle cx="50" cy="50" r="24" fill="url(#lit)"/></g></g>
          <g transform="${LEFT}">
            <circle cx="50" cy="50" r="33" style="fill: oklch(0.93 0.02 88)"/>
            <circle cx="50" cy="50" r="33" fill="url(#lit)"/>
            <rect class="ridge" x="45" y="20" width="10" height="60" rx="5" style="fill: oklch(0.66 0.04 75)"/>
          </g>
          <g transform="${RIGHT}">
            <rect x="37" y="16" width="26" height="68" rx="13" style="fill: oklch(0.17 0.02 268)"/>
            <circle class="knob" cx="50" cy="69" r="11" style="fill: oklch(0.8 0.12 168)"/>
          </g>`;
        const btn = svg.querySelector('.btn'), ridge = svg.querySelector('.ridge'), knob = svg.querySelector('.knob');
        const st = { press: 0, dial: 0, tog: 0 };
        const draw = () => {
          btn.setAttribute('transform', `translate(0 ${f(st.press * 3.5)})`);
          ridge.setAttribute('transform', `rotate(${f(st.dial)} 50 50)`);
          knob.setAttribute('cy', f(69 - st.tog * 38));
        };
        draw();
        // The ridge is symmetric, so two half turns close the loop.
        return hoverLoop(
          () => gsap.timeline({ repeat: -1, onUpdate: draw })

      card.id = file;
      card.innerHTML = `<header><span>${label}</span></header>
        <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAMES[toy]} ${D.l}, 64"></div></div>
        <div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>`;
      sec.querySelector('.row').append(card);
      card.querySelectorAll('.tile').forEach(tile => {
        const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tile);
        const ctl = D.art(svg, `u${++uid}`);
        fitIcon(svg);
        tile.addEventListener('pointerenter', e => ctl.enter(local(svg, e)));
        tile.addEventListener('pointermove', e => ctl.move(local(svg, e)));
        tile.addEventListener('pointerleave', () => ctl.leave());
        tile.addEventListener('focus', () => ctl.enter(null));
        tile.addEventListener('blur', () => ctl.leave());
      });
    }
  }
})();
</script>
</body>
</html>
