<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Icon spike: Fruit slice 1</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* The page copies the menu tokens; it is dark only. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --line: oklch(0.26 0.014 275);
  --intro-bg: oklch(0.16 0.012 275);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  padding: clamp(28px, 5vw, 56px) max(16px, 3vw) 72px; -webkit-font-smoothing: antialiased;
}
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.lede { margin: 0 0 clamp(28px, 4vw, 44px); color: var(--muted); font-size: 13px; }
section { margin-bottom: clamp(36px, 5vw, 56px); }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.dir { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.dir header { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.dir header b { font-size: 15px; font-weight: 800; }
.dir header span { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
/* Icon tiles: 128 and 64 on the menu ground; a hairline marks the square. */
.icons { display: flex; align-items: end; gap: 12px; }
.tile { display: grid; place-items: center; outline: 1px dashed oklch(0.3 0.015 275); outline-offset: 0; cursor: pointer; touch-action: none; }
.tile:focus-visible { outline: 2px solid oklch(0.84 0.13 205); }
.tile svg { display: block; overflow: visible; }
.t128, .t128 svg { width: 128px; height: 128px; }
.t64, .t64 svg { width: 64px; height: 64px; }
.t256, .t256 svg { width: 256px; height: 256px; }
.big { margin-bottom: 4px; }
/* Emblems: the flash box and the dark glass, as the intro shows them. */
.emb { display: flex; gap: 12px; }
.emb > div { position: relative; display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; }
.emb i { position: relative; display: block; width: 76px; aspect-ratio: 1; background: currentColor; mask: var(--emblem) center / contain no-repeat; mask-mode: luminance; }
.flash { background: #fff; color: var(--intro-bg); }
.glass { color: #fff; background: oklch(0.3 0.06 300); }
.glass::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.75 0.15 60) 0 18%, transparent 19%),
    radial-gradient(circle at 75% 40%, oklch(0.7 0.17 340) 0 16%, transparent 17%),
    radial-gradient(circle at 50% 80%, oklch(0.72 0.12 200) 0 20%, transparent 21%);
}
.glass::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(14px) brightness(0.45); -webkit-backdrop-filter: blur(14px) brightness(0.45); background: oklch(0.1 0.01 275 / 0.2); }
.glass i { z-index: 1; }
.idea { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Icon spike: Fruit slice 1</h1>
<p class="lede">Fruit slice, round 1. The toy holds ten fruits now; the kiwi tile (round kiwi-1) shows one. A: one fruit split in two, its halves flip through the fruits on hover. D: the split fruit on a cutting board. A goes on the menu until Tom picks.</p>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(() => {
  const { gsap } = window;
  // Menu motion runs at 30 fps.
  gsap.ticker.fps(30);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => +n.toFixed(2);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const poly = pts => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join('L') + 'Z';
  const EMB_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">';
  // Linear and radial gradients as markup; the stops take OKLCH by style.
  const lg = (id, stops, a = 'x1="0" y1="0" x2="0" y2="1"') => `<linearGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</linearGradient>`;
  const rg = (id, stops, a = 'cx="0.5" cy="0.5" r="0.5"') => `<radialGradient id="${id}" ${a}>${stops.map(([o, c, op = 1]) => `<stop offset="${o}" style="stop-color: ${c}; stop-opacity: ${op}"/>`).join('')}</radialGradient>`;
  const blur = (id, s) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
  // The menu's shared light: a rim and a soft top-left glint.
  const light = u => lg(`${u}rim`, [[0, '#fff', 0.62], [0.5, '#fff', 0]], 'x1="0" y1="0" x2="1" y2="1"') + rg(`${u}lit`, [[0, '#fff', 0.38], [1, '#fff', 0]], 'cx="0.32" cy="0.26" r="0.7"');
  // A body in the menu's language: gradient, then lit, then a rim 2 wide.
  const body = (d, u, fill, extra = '') => `<path d="${d}" fill="url(#${u}${fill})"${extra}/><path d="${d}" fill="url(#${u}lit)"/><path d="${d}" fill="none" stroke="url(#${u}rim)" stroke-width="2" stroke-linejoin="round"/>`;
  // A small looping clock that runs only while a tile is live.
  const clock = fn => {
    let on = false;
    const tick = () => fn(gsap.ticker.time);
    return { start() { if (!on) { on = true; gsap.ticker.add(tick); } }, stop() { if (on) { on = false; gsap.ticker.remove(tick); } } };
  };

  const DIRS = [];

  // Round kiwi-1, for the Current card: brown fuzz, emerald flesh, a cream core.
  const SKINC = [[0, 'oklch(0.56 0.08 62)'], [0.55, 'oklch(0.42 0.07 55)'], [1, 'oklch(0.27 0.05 48)']];
  const SHELLC = [[0, 'oklch(0.5 0.08 60)'], [1, 'oklch(0.3 0.05 50)']];
  const FLESHC = [[0, 'oklch(0.86 0.2 128)'], [0.45, 'oklch(0.74 0.22 134)'], [0.85, 'oklch(0.62 0.2 138)'], [1, 'oklch(0.8 0.16 122)']];
  const COREC = [[0, 'oklch(0.97 0.05 100)'], [1, 'oklch(0.86 0.09 105)']];
  const JUICEC = [[0, 'oklch(0.93 0.17 125)'], [1, 'oklch(0.7 0.21 136)']];
  const GLOWC = [[0, 'oklch(0.8 0.2 130)', 0.55], [1, 'oklch(0.6 0.2 135)', 0]];

  // An ellipse path, turned by a degrees about its centre.
  const ell = (cx, cy, rx, ry, a = 0) => {
    const t = a * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
    const P = (x, y) => `${f(cx + x * c - y * s)} ${f(cy + x * s + y * c)}`;
    return `M${P(rx, 0)}A${f(rx)} ${f(ry)} ${f(a)} 1 1 ${P(-rx, 0)}A${f(rx)} ${f(ry)} ${f(a)} 1 1 ${P(rx, 0)}Z`;
  };
  // A point on a turned ellipse, at angle th and radius share k.
  const onE = (cx, cy, rx, ry, a, th, k) => {
    const t = a * Math.PI / 180, x = Math.cos(th) * rx * k, y = Math.sin(th) * ry * k;
    return [cx + x * Math.cos(t) - y * Math.sin(t), cy + x * Math.sin(t) + y * Math.cos(t)];
  };
  // Fuzz: short soft tufts round a body, lit on the top left.
  const fuzz = (cx, cy, rx, ry, a, n, len, from = 0, to = Math.PI * 2) => {
    let d = '';
    for (let i = 0; i < n; i++) {
      const th = from + (to - from) * (i + 0.5) / n;
      // Each tuft gets its own length, so the edge reads soft, not toothed.
      const k = 0.55 + 0.45 * Math.abs(Math.sin(i * 12.9898));
      const p = onE(cx, cy, rx, ry, a, th, 0.97), q = onE(cx, cy, rx, ry, a, th + 0.04, 1 + len * k / rx);
      d += `M${f(p[0])} ${f(p[1])}L${f(q[0])} ${f(q[1])}`;
    }
    return d;
  };
  // A seed: a bold drop, its point toward the core.
  const seed = (x, y, th, s) => {
    const c = Math.cos(th), sn = Math.sin(th);
    const P = (u, v) => `${f(x + u * c - v * sn)} ${f(y + u * sn + v * c)}`;
    return `M${P(-2.6 * s, 0)}Q${P(-0.6 * s, -1.9 * s)} ${P(2.4 * s, -1.4 * s)}Q${P(3.6 * s, 0)} ${P(2.4 * s, 1.4 * s)}Q${P(-0.6 * s, 1.9 * s)} ${P(-2.6 * s, 0)}Z`;
  };

  // The kiwi set: a whole fruit behind, a cut half in front.
  // s scales it about (ox, oy); the half's face sits low left.
  const kiwiGeo = (ox, oy, s, back = true) => {
    const X = x => ox + (x - 64) * s, Y = y => oy + (y - 64) * s;
    const W = { cx: X(78), cy: Y(48), rx: 36 * s, ry: 27 * s, a: -18 };
    const F = { cx: X(50), cy: Y(74), rx: 32 * s, ry: 29 * s, a: -12 };
    const H = { cx: F.cx + 6 * s, cy: F.cy + 5 * s, rx: F.rx * 1.02, ry: F.ry * 1.02, a: F.a };
    const seeds = [];
    for (let i = 0; i < 14; i++) {
      const th = (i / 14) * Math.PI * 2 + 0.2;
      const p = onE(F.cx, F.cy, F.rx, F.ry, F.a, th, 0.44 + (i % 2) * 0.05);
      seeds.push(seed(p[0], p[1], th + F.a * Math.PI / 180, s * 1.05));
    }
    const rays = [];
    for (let i = 0; i < 18; i++) {
      const th = (i / 18) * Math.PI * 2, w = 0.07;
      const a0 = onE(F.cx, F.cy, F.rx, F.ry, F.a, th - w * 0.4, 0.56), b0 = onE(F.cx, F.cy, F.rx, F.ry, F.a, th - w, 0.84);
      const b1 = onE(F.cx, F.cy, F.rx, F.ry, F.a, th + w, 0.84), a1 = onE(F.cx, F.cy, F.rx, F.ry, F.a, th + w * 0.4, 0.56);
      rays.push(`M${f(a0[0])} ${f(a0[1])}L${f(b0[0])} ${f(b0[1])}L${f(b1[0])} ${f(b1[1])}L${f(a1[0])} ${f(a1[1])}Z`);
    }
    const drops = [[-0.2, -1.15, 3.4], [0.35, -1.25, 2.6], [0.7, -0.95, 2.1], [-0.6, -0.9, 2.2], [0.05, -1.5, 1.8]].map(([dx, dy, r]) => ({ x: F.cx + dx * F.rx * 0.6, y: F.cy - F.ry * 0.2, dx: f(dx * 16 * s), dy: f(dy * 22 * s), r: f(r * s) }));
    return { W, F, H, seeds, rays, drops, s, back, o: `${f(F.cx)} ${f(F.cy + F.ry)}`, ow: `${f(W.cx)} ${f(W.cy + W.ry)}` };
  };
  const E = (k, g, m = 1) => ell(g[k].cx, g[k].cy, g[k].rx * m, g[k].ry * m, g[k].a);
  // A kiwi set in the menu's language. Classes: whole, half, drop.
  const kiwiArt = (u, G) => `
      <ellipse cx="${f(G.F.cx + 4 * G.s)}" cy="${f(G.F.cy)}" rx="${f(G.F.rx * 1.15)}" ry="${f(G.F.ry * 1.1)}" fill="url(#${u}glow)" filter="url(#${u}h)"/>
      ${G.back ? `<g class="whole" data-o="${G.ow}">
        <path d="${fuzz(G.W.cx, G.W.cy, G.W.rx, G.W.ry, G.W.a, 90, 3.2 * G.s, -2.7, 1.0)}" stroke="oklch(0.62 0.08 64)" stroke-width="${f(1.8 * G.s)}" stroke-linecap="round" opacity="0.75" filter="url(#${u}f)"/>
        ${body(E('W', G), u, 'skin')}
        <path d="${ell(G.W.cx + 22 * G.s, G.W.cy - 2 * G.s, 3 * G.s, 3.6 * G.s, G.W.a)}" fill="oklch(0.3 0.05 50)"/>
      </g>` : ''}
      <g class="half" data-o="${G.o}">
        <path d="${fuzz(G.H.cx, G.H.cy, G.H.rx, G.H.ry, G.H.a, 80, 3 * G.s, -0.5, 2.3)}" stroke="oklch(0.56 0.08 60)" stroke-width="${f(1.8 * G.s)}" stroke-linecap="round" opacity="0.75" filter="url(#${u}f)"/>
        <path d="${E('H', G)}" fill="url(#${u}shell)"/>
        <path d="${E('F', G)}" fill="oklch(0.36 0.06 52)"/>
        <path d="${E('F', G, 0.95)}" fill="oklch(0.84 0.15 120)"/>
        <path d="${E('F', G, 0.88)}" fill="url(#${u}flesh)"/>
        <path d="${G.rays.join('')}" fill="oklch(0.9 0.17 118)" opacity="0.75"/>
        <path d="${E('F', G, 0.56)}" fill="oklch(0.84 0.19 118)"/>
        <path d="${G.seeds.join('')}" fill="oklch(0.17 0.02 60)"/>
        <path d="${E('F', G, 0.3)}" fill="url(#${u}core)"/>
        <path d="${E('F', G, 0.95)}" fill="url(#${u}lit)"/>
        <path d="${E('F', G, 0.95)}" fill="none" stroke="url(#${u}rim)" stroke-width="2"/>
        <ellipse cx="${f(G.F.cx - 9 * G.s)}" cy="${f(G.F.cy - 12 * G.s)}" rx="${f(5 * G.s)}" ry="${f(2.6 * G.s)}" transform="rotate(-30 ${f(G.F.cx - 9 * G.s)} ${f(G.F.cy - 12 * G.s)})" fill="#fff" opacity="0.7"/>
      </g>
      <g class="drops">${G.drops.map(d => `<circle class="drop" cx="${f(d.x)}" cy="${f(d.y)}" r="${d.r}" data-dx="${d.dx}" data-dy="${d.dy}" fill="url(#${u}juice)" opacity="0"/>`).join('')}</g>`;
  // The shared motion: a squish and a boing; juice hops off the face.
  // The pointer leans the half; leave lets it settle.
  const run = svg => {
    const half = svg.querySelector('.half'), whole = svg.querySelector('.whole'), drops = svg.querySelectorAll('.drop');
    const o = half.dataset.o, ow = whole?.dataset.o;
    let tl = null;
    const boing = () => {
      const t = gsap.timeline();
      t.to(half, { scaleX: 1.1, scaleY: 0.86, svgOrigin: o, duration: 0.14, ease: 'power2.in' })
        .to(half, { scaleX: 0.94, scaleY: 1.08, svgOrigin: o, duration: 0.16, ease: 'power2.out' })
        .to(half, { scaleX: 1, scaleY: 1, svgOrigin: o, duration: 0.6, ease: 'elastic.out(1.1, 0.35)' })
        .fromTo(drops, { x: 0, y: 0, opacity: 1, scale: 0.6 }, { keyframes: { x: [(i, d) => +d.dataset.dx * 0.6, (i, d) => +d.dataset.dx], y: [(i, d) => +d.dataset.dy, (i, d) => +d.dataset.dy * 0.2 + 18], scale: [1.1, 0.8] }, opacity: 0, duration: 0.8, ease: 'power1.in', stagger: 0.03 }, 0.22);
      if (whole) t.fromTo(whole, { rotation: 0, svgOrigin: ow }, { keyframes: { rotation: [-3, 2, 0] }, svgOrigin: ow, duration: 0.7, ease: 'sine.inOut' }, 0.12);
      return t;
    };
    return {
      enter() {
        if (tl) tl.kill();
        tl = gsap.timeline({ repeat: -1, repeatDelay: 0.6 });
        tl.add(boing());
      },
      move(p) {
        if (!p) return;
        gsap.to(svg.querySelector('.half'), { rotation: (p[0] - 64) * 0.06, svgOrigin: o, duration: 0.4, overwrite: 'auto' });
      },
      leave() {
        if (tl) tl.kill();
        tl = null;
        gsap.to(half, { scaleX: 1, scaleY: 1, rotation: 0, svgOrigin: o, duration: 0.45, ease: 'power2.out' });
        if (whole) gsap.to(whole, { rotation: 0, svgOrigin: ow, duration: 0.4 });
        gsap.to(drops, { opacity: 0, duration: 0.2 });
      },
    };
  };
  const defs = u => `${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}s`, 1.2)}${blur(`${u}h`, 8)}${blur(`${u}f`, 0.55)}
          ${lg(`${u}skin`, SKINC, 'x1="0.2" y1="0" x2="0.6" y2="1"')}${lg(`${u}shell`, SHELLC, 'x1="0" y1="0" x2="0.8" y2="1"')}
          ${rg(`${u}flesh`, FLESHC)}${rg(`${u}core`, COREC, 'cx="0.4" cy="0.35" r="0.65"')}${rg(`${u}juice`, JUICEC, 'cx="0.35" cy="0.3" r="0.7"')}${rg(`${u}glow`, GLOWC)}`;
  // The emblem: the fruit in white; the face in grey with a white core, seeds cut out.
  const embKiwi = G => `${G.back ? `<path d="${E('W', G)}" fill="#fff"/>` : ''}<path d="${E('H', G)}" fill="#fff"/><path d="${E('F', G, 0.95)}" fill="#a8a8a8"/><path d="${G.rays.join('')}" fill="#d0d0d0"/><path d="${G.seeds.join('')}" fill="#000"/><path d="${E('F', G, 0.3)}" fill="#fff"/>`;

  /* ================= The split fruit ================= */

  // Each half is drawn in a unit frame: the cut face is a disc of radius 30.
  // A half's transform squeezes the disc to an oval and tilts it.
  const circ = (r, x = 0, y = 0) => `M${f(x + r)} ${f(y)}A${f(r)} ${f(r)} 0 1 1 ${f(x - r)} ${f(y)}A${f(r)} ${f(r)} 0 1 1 ${f(x + r)} ${f(y)}Z`;
  // A five-point star, its points at radius R and its valleys at r.
  const star = (R, r, x = 0, y = 0) => {
    const p = [];
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / 5, k = i % 2 ? r : R;
      p.push([x + Math.cos(a) * k, y + Math.sin(a) * k]);
    }
    return poly(p);
  };
  // A wedge between angles a0 and a1, from radius r0 to r1.
  const wedge = (a0, a1, r0, r1) => {
    const P = (a, r) => `${f(Math.cos(a) * r)} ${f(Math.sin(a) * r)}`;
    return `M${P(a0, r0)}L${P(a0, r1)}A${r1} ${r1} 0 0 1 ${P(a1, r1)}L${P(a1, r0)}A${r0} ${r0} 0 0 0 ${P(a0, r0)}Z`;
  };
  // Points on a sunflower spiral inside radius r: even, but not in rows.
  const spiral = (n, r0, r1, off = 0) => Array.from({ length: n }, (_, i) => {
    const k = (i + 0.5) / n, rr = Math.sqrt(lerp(r0 * r0, r1 * r1, k)), a = i * 2.39996 + off;
    return [Math.cos(a) * rr, Math.sin(a) * rr, a];
  });
  // A small drop, its point toward the middle.
  const dropAt = (x, y, a, s) => seed(x, y, a, s);
  const g2 = (u, id) => `url(#${u}${id})`;

  // The fruits, in the order the halves flip through them.
  // dome: the skin's colour stops; out: the outline; face(u): the cut, in the unit frame.
  const FRUITS = [
    {
      id: 'kiwi', juice: 'oklch(0.85 0.2 128)',
      dome: [[0, 'oklch(0.56 0.08 62)'], [1, 'oklch(0.3 0.05 50)']],
      grads: u => rg(`${u}kiF`, FLESHC) + rg(`${u}kiC`, COREC, 'cx="0.4" cy="0.35" r="0.65"'),
      face: u => {
        const rays = Array.from({ length: 16 }, (_, i) => wedge((i / 16) * 6.283 - 0.06, (i / 16) * 6.283 + 0.06, 17, 25)).join('');
        const sd = Array.from({ length: 13 }, (_, i) => { const a = (i / 13) * 6.283 + 0.2, r = 13 + (i % 2) * 1.5; return dropAt(Math.cos(a) * r, Math.sin(a) * r, a, 1.15); }).join('');
        return `<path d="${circ(30)}" fill="oklch(0.36 0.06 52)"/><path d="${circ(28.4)}" fill="oklch(0.84 0.15 120)"/><path d="${circ(26.6)}" fill="${g2(u, 'kiF')}"/>
          <path d="${rays}" fill="oklch(0.9 0.17 118)" opacity="0.7"/><path d="${sd}" fill="oklch(0.17 0.02 60)"/><path d="${circ(8)}" fill="${g2(u, 'kiC')}"/>`;
      },
    },
    {
      id: 'orange', juice: 'oklch(0.55 0.2 25)',
      dome: [[0, 'oklch(0.8 0.17 62)'], [1, 'oklch(0.55 0.17 45)']],
      grads: u => rg(`${u}orF`, [[0, 'oklch(0.36 0.15 18)'], [0.7, 'oklch(0.44 0.18 22)'], [1, 'oklch(0.52 0.19 28)']]),
      face: u => {
        const segs = Array.from({ length: 10 }, (_, i) => wedge((i / 10) * 6.283 + 0.05, ((i + 1) / 10) * 6.283 - 0.05, 3.2, 25.6)).join('');
        // Orange patches in a few segments, as the blood orange shows.
        const patch = [[1, 15, 4.5], [4, 18, 3.6], [6, 12, 3.8], [8, 19, 3]].map(([s, r, k]) => { const a = ((s + 0.5) / 10) * 6.283; return circ(k, Math.cos(a) * r, Math.sin(a) * r); }).join('');
        return `<path d="${circ(30)}" fill="oklch(0.72 0.17 55)"/><path d="${circ(27.4)}" fill="oklch(0.93 0.03 70)"/>
          <path d="${segs}" fill="${g2(u, 'orF')}"/><path d="${patch}" fill="oklch(0.62 0.19 38)" opacity="0.75"/><path d="${circ(2.6)}" fill="oklch(0.95 0.02 70)"/>`;
      },
    },
    {
      id: 'pomegranate', juice: 'oklch(0.5 0.21 22)',
      dome: [[0, 'oklch(0.6 0.19 30)'], [1, 'oklch(0.38 0.15 22)']],
      grads: u => rg(`${u}pmA`, [[0, 'oklch(0.72 0.2 22)'], [0.6, 'oklch(0.55 0.22 22)'], [1, 'oklch(0.4 0.17 20)']], 'cx="0.38" cy="0.32" r="0.7"'),
      face: u => {
        let cham = '', ar = '';
        for (let k = 0; k < 6; k++) {
          const a0 = (k / 6) * 6.283 + 0.14, a1 = ((k + 1) / 6) * 6.283 - 0.14;
          cham += wedge(a0, a1, 4.5, 25.5);
          for (const r of [9, 15, 21]) {
            const span = (a1 - a0) * r, n = Math.max(1, Math.floor(span / 6.6));
            for (let i = 0; i < n; i++) { const a = a0 + (a1 - a0) * (i + 0.5) / n; ar += circ(2.9, Math.cos(a) * r, Math.sin(a) * r); }
          }
        }
        return `<path d="${circ(30)}" fill="oklch(0.48 0.17 25)"/><path d="${circ(27.2)}" fill="oklch(0.9 0.04 85)"/>
          <path d="${cham}" fill="oklch(0.3 0.1 20)"/><path d="${ar}" fill="${g2(u, 'pmA')}"/>`;
      },
    },
    {
      id: 'dragon', juice: 'oklch(0.92 0.02 300)',
      dome: [[0, 'oklch(0.7 0.24 350)'], [1, 'oklch(0.48 0.22 350)']],
      grads: u => rg(`${u}drF`, [[0, 'oklch(0.97 0.01 300)'], [1, 'oklch(0.88 0.015 300)']]),
      face: u => {
        const sd = spiral(40, 3, 20.5, 0.4).map(([x, y]) => circ(0.95, x, y)).join('');
        return `<path d="${circ(30)}" fill="oklch(0.6 0.25 350)"/><path d="${circ(27)}" fill="oklch(0.74 0.2 350)"/><path d="${circ(24.4)}" fill="${g2(u, 'drF')}"/>
          <path d="${sd}" fill="oklch(0.16 0.01 300)"/>`;
      },
    },
    {
      id: 'passion', juice: 'oklch(0.8 0.17 80)',
      dome: [[0, 'oklch(0.5 0.12 330)'], [1, 'oklch(0.28 0.08 320)']],
      grads: u => rg(`${u}paS`, [[0, 'oklch(0.9 0.15 90)'], [1, 'oklch(0.72 0.17 70)']], 'cx="0.38" cy="0.32" r="0.7"'),
      face: u => {
        const pts = spiral(20, 2, 18.5, 1.1);
        const sacs = pts.map(([x, y]) => circ(3.6, x, y)).join(''), sd = pts.map(([x, y, a]) => circ(1.9, x + Math.cos(a) * 0.8, y + Math.sin(a) * 0.8)).join('');
        return `<path d="${circ(30)}" fill="oklch(0.36 0.1 330)"/><path d="${circ(27.2)}" fill="oklch(0.94 0.02 90)"/><path d="${circ(22.4)}" fill="oklch(0.68 0.16 70)"/>
          <path d="${sacs}" fill="${g2(u, 'paS')}"/><path d="${sd}" fill="oklch(0.18 0.02 60)"/>`;
      },
    },
    {
      id: 'peach', juice: 'oklch(0.86 0.13 75)',
      dome: [[0, 'oklch(0.78 0.15 55)'], [0.6, 'oklch(0.6 0.18 30)'], [1, 'oklch(0.45 0.16 22)']],
      grads: u => rg(`${u}peF`, [[0, 'oklch(0.5 0.19 22)'], [0.3, 'oklch(0.62 0.17 30)'], [0.55, 'oklch(0.86 0.1 80)'], [1, 'oklch(0.84 0.13 72)']]),
      face: u => {
        const fur = Array.from({ length: 7 }, (_, i) => `M${f(-4 + (i % 2) * 2)} ${f(-8 + i * 2.4)}h${f(5 + (i % 3))}`).join('');
        return `<path d="${circ(30)}" fill="oklch(0.6 0.17 32)"/><path d="${circ(28.2)}" fill="${g2(u, 'peF')}"/>
          <path d="${ell(0, 0, 7.8, 10.6)}" fill="oklch(0.36 0.08 35)"/><path d="${fur}" stroke="oklch(0.24 0.05 30)" stroke-width="1.6" stroke-linecap="round"/>`;
      },
    },
    {
      id: 'mangosteen', juice: 'oklch(0.93 0.02 330)',
      dome: [[0, 'oklch(0.35 0.08 340)'], [1, 'oklch(0.18 0.04 330)']],
      grads: u => rg(`${u}mgR`, [[0.6, 'oklch(0.44 0.15 12)'], [1, 'oklch(0.3 0.1 350)']]),
      face: u => {
        const lobes = Array.from({ length: 6 }, (_, i) => { const a = (i / 6) * 360 + 15; const t = a * Math.PI / 180; return ell(Math.cos(t) * 9, Math.sin(t) * 9, 9.4, 5.6, a); }).join('');
        return `<path d="${circ(30)}" fill="oklch(0.22 0.05 330)"/><path d="${circ(28.6)}" fill="${g2(u, 'mgR')}"/><path d="${circ(19.6)}" fill="oklch(0.14 0.03 340)"/>
          <path d="${lobes}" fill="oklch(0.96 0.01 90)"/><path d="${circ(1.8)}" fill="oklch(0.85 0.1 95)"/>`;
      },
    },
    {
      id: 'fig', juice: 'oklch(0.6 0.2 10)',
      dome: [[0, 'oklch(0.45 0.09 330)'], [0.7, 'oklch(0.3 0.06 320)'], [1, 'oklch(0.42 0.08 130)']],
      grads: u => rg(`${u}fgF`, [[0, 'oklch(0.36 0.15 5)'], [0.6, 'oklch(0.52 0.19 10)'], [1, 'oklch(0.66 0.17 12)']]),
      face: u => {
        const strands = Array.from({ length: 16 }, (_, i) => wedge((i / 16) * 6.283 - 0.07, (i / 16) * 6.283 + 0.07, 7, 23)).join('');
        const sd = spiral(26, 6, 21, 0.7).map(([x, y]) => circ(1.2, x, y)).join('');
        return `<path d="${circ(30)}" fill="oklch(0.32 0.07 330)"/><path d="${circ(28.4)}" fill="oklch(0.92 0.04 95)"/><path d="${circ(24)}" fill="${g2(u, 'fgF')}"/>
          <path d="${strands}" fill="oklch(0.72 0.15 12)" opacity="0.55"/><path d="${sd}" fill="oklch(0.85 0.12 85)"/><path d="${ell(0, 0, 6.5, 2.4, -35)}" fill="oklch(0.2 0.07 10)"/>`;
      },
    },
    {
      id: 'starfruit', juice: 'oklch(0.88 0.16 90)', out: () => star(31, 17),
      dome: [[0, 'oklch(0.86 0.15 90)'], [1, 'oklch(0.66 0.15 78)']],
      grads: u => rg(`${u}sfF`, [[0, 'oklch(0.92 0.12 95)'], [1, 'oklch(0.76 0.16 78)']]),
      face: u => {
        const veins = Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5; return `M0 0L${f(Math.cos(a) * 22)} ${f(Math.sin(a) * 22)}`; }).join('');
        const sd = [0, 2, 3].map(i => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5 + 0.3; return dropAt(Math.cos(a) * 7, Math.sin(a) * 7, a, 0.9); }).join('');
        return `<path d="${star(31, 17)}" fill="oklch(0.72 0.15 80)"/><path d="${star(29, 15.6)}" fill="${g2(u, 'sfF')}"/>
          <path d="${veins}" stroke="oklch(0.96 0.06 95)" stroke-width="2" stroke-linecap="round" opacity="0.8"/><path d="${star(6, 3)}" fill="oklch(0.97 0.05 95)"/><path d="${sd}" fill="oklch(0.42 0.08 60)"/>`;
      },
    },
  ];
  const outline = fr => (fr.out ? fr.out() : circ(30));

  // The pair: two halves, faces to the eye, opened like a book.
  // s scales the set about (ox, oy).
  const splitGeo = (ox, oy, s) => ({
    s,
    // The left half stands in front; the right one sits back, a little higher.
    L: { x: ox - 17 * s, y: oy + 4 * s, r: -9, k: 1 },
    R: { x: ox + 23 * s, y: oy - 5 * s, r: 13, k: 0.86 },
    // The halves rest on a point under their middle.
    base: oy + 33 * s,
    drops: [[-0.5, -1.2, 3.2], [0.4, -1.35, 2.6], [0.05, -1.6, 2.2], [-0.9, -0.9, 2], [0.85, -1, 2.3], [0.2, -1.1, 1.8]].map(([dx, dy, r]) => ({ x: ox + 3 * s, y: oy - 6 * s, dx: f(dx * 26 * s), dy: f(dy * 26 * s), r: f(r * s) })),
  });
  // Each fruit's skin dome and cut face sit once in defs; both halves use them.
  // Paths in the unit frame keep one decimal: the tile is small.
  const d1 = m => m.replace(/ d="([^"]*)"/g, (x, d) => ` d="${d.replace(/(\d+\.\d)\d+/g, '$1')}"`);
  const fruitDefs = u => d1(FRUITS.map((fr, i) => `
        <g id="${u}d${i}">${body(outline(fr), u, `${fr.id}dome`).replace(/stroke-width="2"/g, 'stroke-width="2" vector-effect="non-scaling-stroke"')}</g>
        <g id="${u}c${i}">${fr.face(u)}<path d="${outline(fr)}" fill="url(#${u}lit)"/><path d="${outline(fr)}" fill="none" stroke="url(#${u}rim)" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="${ell(-10, -15, 7, 3.4, -35)}" fill="#fff" opacity="0.55"/></g>`).join(''));
  // One half: every fruit stacked; the first shows.
  const halfArt = (u, H, side, s0, show = 0) => {
    const s = s0 * H.k, k = 0.72 * s;
    return `<g class="hf" data-o="${f(H.x)} ${f(H.y + 30 * s)}"><g transform="translate(${f(H.x)} ${f(H.y)}) rotate(${H.r}) scale(${f(k)} ${f(s)})">${FRUITS.map((fr, i) => `<g class="fr" data-j="${fr.juice}"${i === show ? '' : ' opacity="0"'}><use href="#${u}d${i}" x="${side * (fr.out ? 7 : 13)}"/><use href="#${u}c${i}"/></g>`).join('')}</g></g>`;
  };
  const splitArt = (u, G) => `
      <ellipse cx="${f((G.L.x + G.R.x) / 2)}" cy="${f(G.base)}" rx="${f(50 * G.s)}" ry="${f(6 * G.s)}" fill="oklch(0.05 0.01 240)" opacity="0.55" filter="url(#${u}b)"/>
      <g class="hr">${halfArt(u, G.R, 1, G.s)}</g>
      <g class="hl">${halfArt(u, G.L, -1, G.s)}</g>
      <g class="drops">${G.drops.map(d => `<circle class="drop" cx="${f(d.x)}" cy="${f(d.y)}" r="${d.r}" data-dx="${d.dx}" data-dy="${d.dy}" fill="${FRUITS[0].juice}" opacity="0"/>`).join('')}</g>`;
  const splitDefs = u => `${light(u)}${blur(`${u}b`, 2.4)}${blur(`${u}h`, 8)}
          ${FRUITS.map(fr => lg(`${u}${fr.id}dome`, fr.dome, 'x1="0.2" y1="0" x2="0.7" y2="1"') + fr.grads(u)).join('')}${fruitDefs(u)}`;

  // The motion, as the menu hook runs it: play and rest.
  // Each beat the halves hop apart, turn edge on, and land as the next fruit.
  // Juice in the new fruit's colour hops out of the gap.
  const splitRun = svg => {
    const halves = [svg.querySelector('.hl .hf'), svg.querySelector('.hr .hf')];
    const groups = halves.map(h => [...h.querySelectorAll('.fr')]);
    const drops = svg.querySelectorAll('.drop');
    let k = 0, tl = null;
    const show = n => groups.forEach(g => g.forEach((e, i) => e.setAttribute('opacity', i === n ? 1 : 0)));
    const beat = () => {
      const t = gsap.timeline();
      halves.forEach((h, i) => {
        const side = i ? 1 : -1, o = h.dataset.o;
        t.to(h, { x: side * 5, y: -7, rotation: side * 8, scaleY: 1.04, svgOrigin: o, duration: 0.2, ease: 'power2.out' }, 0)
          .to(h, { scaleX: 0.08, svgOrigin: o, duration: 0.14, ease: 'power2.in' }, 0.06)
          .to(h, { scaleX: 1, svgOrigin: o, duration: 0.2, ease: 'power2.out' }, 0.2)
          .to(h, { x: 0, y: 0, rotation: 0, scaleY: 1, svgOrigin: o, duration: 0.7, ease: 'elastic.out(1, 0.4)' }, 0.26);
      });
      t.call(() => { k = (k + 1) % groups[0].length; show(k); gsap.set(drops, { attr: { fill: groups[0][k].dataset.j } }); }, null, 0.2);
      t.fromTo(drops, { x: 0, y: 0, opacity: 1, scale: 0.6 }, { keyframes: { x: [(i, d) => +d.dataset.dx * 0.6, (i, d) => +d.dataset.dx], y: [(i, d) => +d.dataset.dy, (i, d) => +d.dataset.dy * 0.2 + 20], scale: [1.1, 0.8] }, opacity: 0, duration: 0.8, ease: 'power1.in', stagger: 0.03 }, 0.24);
      return t;
    };
    return {
      play() {
        if (tl) tl.kill();
        tl = gsap.timeline({ repeat: -1, repeatDelay: 0.75 }).add(beat());
        return tl;
      },
      rest() {
        if (tl) tl.kill();
        tl = null;
        halves.forEach(h => gsap.to(h, { x: 0, y: 0, rotation: 0, scaleX: 1, scaleY: 1, svgOrigin: h.dataset.o, duration: 0.45, ease: 'power2.out' }));
        gsap.to(drops, { opacity: 0, duration: 0.2 });
      },
      // The pointer leans both halves toward it.
      lean(p) {
        halves.forEach(h => gsap.to(h, { rotation: (p[0] - 64) * 0.05, svgOrigin: h.dataset.o, duration: 0.4, overwrite: 'auto' }));
      },
    };
  };
  const tileRun = svg => {
    const r = splitRun(svg);
    return { enter() { r.play(); }, move(p) { if (p) r.lean(p); }, leave() { r.rest(); } };
  };
  // The emblem: the kiwi pair in white; faces grey, seeds cut out, a white core.
  const embHalf = (H, side, s0) => {
    const s = s0 * H.k, k = 0.72 * s;
    const sd = Array.from({ length: 13 }, (_, i) => { const a = (i / 13) * 6.283 + 0.2, r = 13 + (i % 2) * 1.5; return dropAt(Math.cos(a) * r, Math.sin(a) * r, a, 1.15); }).join('');
    return `<g transform="translate(${f(H.x)} ${f(H.y)}) rotate(${H.r}) scale(${f(k)} ${f(s)})"><path d="${circ(30, side * 13)}" fill="#fff"/><path d="${circ(30)}" fill="#fff"/><path d="${circ(26.6)}" fill="#a8a8a8"/><path d="${sd}" fill="#000"/><path d="${circ(8)}" fill="#fff"/></g>`;
  };
  const embSplit = G => embHalf(G.R, 1, G.s) + embHalf(G.L, -1, G.s);

  /* ================= Current ================= */

  // The menu icon today: round kiwi-1, A, with its hover.
  const GK = kiwiGeo(64, 64, 1);
  DIRS.push({
    l: 'Current', name: 'Menu icon',
    box: [14, 18, 102, 92],
    art(svg, u) {
      svg.innerHTML = `<defs>${defs(u)}</defs>${kiwiArt(u, GK)}`;
      return run(svg);
    },
  });

  /* ================= A: Shaded object ================= */

  const GA = splitGeo(64, 62, 1);
  DIRS.push({
    l: 'A', name: 'Shaded object',
    box: [12, 30, 104, 70],
    idea: 'One fruit cut in two, the halves opened like a book, both faces to the eye; a soft shadow under them. At rest it is the kiwi. The pointer makes the halves hop apart, turn edge on and land as the next fruit: blood orange, pomegranate, dragon fruit, passion fruit, peach, mangosteen, fig, starfruit, then kiwi again. Juice in the new fruit\'s colour hops out of the gap; the halves lean toward the pointer.',
    art(svg, u) {
      svg.innerHTML = `<defs>${splitDefs(u)}</defs>${splitArt(u, GA)}`;
      return tileRun(svg);
    },
    emblem: `${EMB_HEAD}${embSplit(GA)}</svg>`,
  });

  /* ================= D: Isometric block ================= */

  // A cutting board is the block: a light end-grain top and two wooden faces.
  const CY = 86, HX = 34, HY = 30, T = 12;
  const iso = (gx, gy) => [64 + (gx - gy) * 0.866, CY + (gx + gy) * 0.5];
  const N = iso(-HX, -HY), Ea = iso(HX, -HY), S = iso(HX, HY), Wd = iso(-HX, HY);
  const down = (p, k = 1) => [p[0], p[1] + T * k];
  const GD = splitGeo(66, 62, 0.72);
  DIRS.push({
    l: 'D', name: 'Isometric block',
    box: [8, 34, 112, S[1] + T - 34],
    idea: 'A cutting board as the block at 30 degrees: a light wooden top, a mid left face, a dark right face, a rim on the top edges. The split fruit stands on it, a drop of juice on the board. The pointer flips the halves through the fruits, as A does.',
    art(svg, u) {
      const top = poly([N, Ea, S, Wd]);
      svg.innerHTML = `<defs>${splitDefs(u)}
          ${lg(`${u}top`, [[0, 'oklch(0.72 0.07 70)'], [1, 'oklch(0.6 0.07 62)']], 'x1="0.2" y1="0" x2="0.6" y2="1"')}
          ${lg(`${u}L`, [[0, 'oklch(0.5 0.07 58)'], [1, 'oklch(0.4 0.06 55)']])}${lg(`${u}R`, [[0, 'oklch(0.34 0.05 50)'], [1, 'oklch(0.26 0.04 46)']])}</defs>
        <path d="${poly([Ea, S, Wd, down(Wd), down(S), down(Ea)])}" fill="oklch(0.05 0.01 240)" opacity="0.5" filter="url(#${u}b)" transform="translate(0 5)"/>
        <path d="${poly([Wd, S, down(S), down(Wd)])}" fill="url(#${u}L)"/>
        <path d="${poly([S, Ea, down(Ea), down(S)])}" fill="url(#${u}R)"/>
        <path d="${top}" fill="url(#${u}top)"/>
        <path d="${top}" fill="url(#${u}lit)"/>
        <path d="M${f(Wd[0])} ${f(Wd[1])}L${f(N[0])} ${f(N[1])}L${f(Ea[0])} ${f(Ea[1])}" stroke="#fff" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M${f(Wd[0])} ${f(Wd[1])}L${f(S[0])} ${f(S[1])}L${f(Ea[0])} ${f(Ea[1])}" stroke="#fff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <ellipse cx="34" cy="${CY + 10}" rx="5" ry="2.4" fill="${FRUITS[0].juice}" opacity="0.9"/>
        ${splitArt(u, GD)}`;
      return tileRun(svg);
    },
    emblem: `${EMB_HEAD}<path d="${poly([Wd, S, down(S), down(Wd)])}" fill="#5a5a5a"/><path d="${poly([S, Ea, down(Ea), down(S)])}" fill="#3a3a3a"/><path d="${poly([N, Ea, S, Wd])}" fill="#8a8a8a"/>${embSplit(GD)}</svg>`,
  });

  /* ================= Gallery ================= */
  const NAME = 'Fruit slice';
  // Every icon is framed to its drawing, so its long side fills 110 of 128.
  const fitIcon = (svg, box) => {
    if (!box) return;
    const side = Math.max(box[2], box[3]), size = (side * 128) / 110, cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    svg.setAttribute('viewBox', `${f(cx - size / 2)} ${f(cy - size / 2)} ${f(size)} ${f(size)}`);
  };
  const local = (svg, e) => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return [v.x + ((e.clientX - r.left) / r.width) * v.width, v.y + ((e.clientY - r.top) / r.height) * v.height];
  };
  const out = document.getElementById('out');
  const sec = document.createElement('section');
  sec.id = 'row-fruit';
  sec.innerHTML = `<h2>${NAME}</h2><div class="row"></div>`;
  out.append(sec);
  let uid = 0;
  window.EMBLEMS = {};
  for (const D of DIRS) {
    const file = `fruit-${D.l.toLowerCase()}`;
    // The emblem rides in the page, so it also shows from a file.
    if (D.emblem) window.EMBLEMS[file] = D.emblem;
    const url = D.emblem ? `'data:image/svg+xml,${encodeURIComponent(D.emblem)}'` : '';
    const card = document.createElement('article');
    card.className = 'dir';
    card.id = file;
    card.innerHTML = `<header>${D.l === 'Current' ? `<b>${D.l}</b>` : `<b>${D.l}</b><span>· ${D.name}</span>`}</header>
      <div class="tile t256 big" tabindex="0" aria-label="${NAME} ${D.l}, 256"></div>
      <div class="icons"><div class="tile t128" tabindex="0" aria-label="${NAME} ${D.l}, 128"></div><div class="tile t64" tabindex="0" aria-label="${NAME} ${D.l}, 64"></div></div>
      ${url ? `<div class="emb"><div class="flash"><i style="--emblem: url(${url})"></i></div><div class="glass"><i style="--emblem: url(${url})"></i></div></div>` : ''}
      ${D.idea ? `<p class="idea">${D.idea}</p>` : ''}`;
    sec.querySelector('.row').append(card);
    card.querySelectorAll('.tile').forEach(tileEl => {
      const svg = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' }, tileEl);
      const c = D.art(svg, `u${++uid}`);
      fitIcon(svg, D.box);
      if (reduce) return;
      tileEl.addEventListener('pointerenter', e => c.enter(local(svg, e)));
      tileEl.addEventListener('pointermove', e => c.move(local(svg, e)));
      tileEl.addEventListener('pointerleave', () => c.leave());
      tileEl.addEventListener('focus', () => c.enter(null));
      tileEl.addEventListener('blur', () => c.leave());
    });
  }
  // A dump page lists the emblems for export.
  if (new URLSearchParams(location.search).has('dump')) {
    const pre = document.createElement('pre');
    pre.id = 'dump';
    const A = DIRS.find(d => d.l === 'A');
    const m = el('svg', { viewBox: '0 0 128 128', 'aria-hidden': 'true' });
    A.art(m, 'fruit-');
    fitIcon(m, A.box);
    m.setAttribute('class', 'art');
    pre.textContent = JSON.stringify({ ...window.EMBLEMS, menu: m.outerHTML });
    document.body.append(pre);
  }
})();
</script>
</body>
</html>
