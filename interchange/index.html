<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.09 0.008 260); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interchange trails</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./designs.js">
<link rel="modulepreload" href="./sim.js">
<link rel="modulepreload" href="./render.js">
<link rel="modulepreload" href="./basemap.js">
<link rel="modulepreload" href="./sound.js">
<link rel="modulepreload" href="../shared/glow.js">
<link rel="modulepreload" href="../shared/detail.js">
<link rel="modulepreload" href="../shared/gl.js">
<style>
/* Interchange trails: a motorway interchange at night, from straight above. */
:root { --stage: oklch(0.09 0.008 260); }
.stage--interchange { background: var(--stage); }
.stage--interchange canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--interchange canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--interchange canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Interchange trails</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--interchange" id="stage" tabindex="0" role="application" aria-label="A motorway interchange at night, seen from straight above as a long-exposure photograph. Two motorways cross; every car draws a line of light: warm white from its headlights, red from its tail lights. Where traffic flows the lines are long and thin. Where it slows the light piles up, and a jam burns as a bright red knot. The Design choice swaps the interchange: cloverleaf, turbine or stack. The old trails fade while the new ones draw in. The Traffic slider sets how many cars come in on each road: the cloverleaf knots first. Tap a car to brake it hard; hold it to keep it stopped. Press C to clear the exposure.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Interchange trails</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
