<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Window seat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..700&display=swap">
<style>
:root {
  --bg: oklch(0.1 0.01 260);
  --ink: oklch(0.93 0.01 260);
  --dim: oklch(0.72 0.015 260);
  --chip: oklch(0.2 0.015 260 / 0.62);
  --line: oklch(0.6 0.02 260 / 0.35);
  --on: oklch(0.95 0.01 260);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font: 14px/1.3 Gabarito, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; touch-action: none; cursor: pointer; }
#stage canvas { display: block; width: 100%; height: 100%; }
.bar {
  position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; pointer-events: none;
}
.bar > * { pointer-events: auto; }
.choices { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.chip { font: inherit; color: var(--dim); background: transparent; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--bg); background: var(--on); }
.chip:focus-visible { outline: 2px solid var(--on); outline-offset: 2px; }
.act { color: var(--ink); background: var(--chip); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 9px 14px; }
.how { margin: 0; color: var(--dim); font-size: 12.5px; text-shadow: 0 1px 6px #000; }
.how b { color: var(--ink); font-weight: 500; }
.touch { display: none; }
@media (hover: none), (pointer: coarse) { .fine { display: none; } .touch { display: inline; } }
.fail[hidden] { display: none; }
.fail { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); }
</style>
</head>
<body>
<div id="stage" role="application" aria-label="Window seat"></div>
<p class="fail" hidden>This scene needs WebGL 2.</p>
<div class="bar">
  <div class="choices" id="mode" role="group" aria-label="Light"><button class="chip" type="button" data-value="clear" aria-pressed="false">Clear</button><button class="chip" type="button" data-value="rain" aria-pressed="true">Rain</button><button class="chip" type="button" data-value="fogged" aria-pressed="false">Fogged</button></div>
  <button class="chip act" id="act" type="button">+ Breath</button>
  <p class="how"><b>Drag</b> look along · <b><span class="fine">Click</span><span class="touch">Tap</span></b> breathe on the glass</p>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

/* ---------- scene ---------- */
// Window seat: a night valley seen through one carriage window on a high viaduct.
// The outside renders to a target; one glass shader frames, fogs and wets it.
function build({ THREE }) {
let seed = 4242;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const range = (a, b) => a + (b - a) * rnd();

/* ---------- outside: the valley ---------- */
const out = new THREE.Scene();
const outCam = new THREE.PerspectiveCamera(50, 1, 0.5, 30000);
const outRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const NG = 16, NL = 6, TILE = 9000, LAMP_GAP = 28;

const NOISE = /* glsl */`
float hash1(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
vec2 hash2(vec2 p) { return vec2(hash1(p), hash1(p + 17.17)); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash1(i), hash1(i + vec2(1, 0)), u.x), mix(hash1(i + vec2(0, 1)), hash1(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }`;

// The river winds along the valley floor; the land rises on both sides.
const LAND = /* glsl */`
float riverZ(float x) { return -560.0 + 130.0 * sin(x / 760.0) + 60.0 * sin(x / 270.0 + 1.3); }
float land(vec2 xz) {
  float u = xz.y - riverZ(xz.x);
  float h = -128.0;
  // Near side: a steep slope up to just under the viaduct.
  h += 112.0 * smoothstep(30.0, 470.0, u);
  // Far side: terraces of hills, then a high ridge.
  float far = smoothstep(-40.0, -1100.0, u);
  h += (150.0 + 120.0 * fbm(xz * 0.0011)) * pow(far, 1.3);
  h += 420.0 * smoothstep(-1700.0, -3900.0, u) * (0.6 + 0.7 * fbm(vec2(xz.x * 0.0007, 3.0)));
  h += (fbm(xz * 0.006) - 0.5) * 40.0 * smoothstep(20.0, 160.0, abs(u));
  // The river bed is flat and a little below the banks.
  h = mix(h, -131.0, smoothstep(34.0, 16.0, abs(u)));
  return h;
}`;

const OUTU = {
  uTime: { value: 0 },
  uMoon: { value: new THREE.Vector3(0.3, 0.14, -0.94).normalize() },
  uGP: { value: Array.from({ length: NG }, () => new THREE.Vector4()) },
  uGC: { value: Array.from({ length: NG }, () => new THREE.Vector4()) },
  uLP: { value: Array.from({ length: NL }, () => new THREE.Vector4()) },
  uCamX: { value: 0 },
  uScale: { value: 1 },
  uSmear: { value: 0 },
  uRain: { value: 1 },
};

// Height haze, thicker low in the valley, warm near the towns.
const HAZE = /* glsl */`
uniform vec3 uMoon;
vec3 skyCol(vec3 d) {
  float up = max(d.y, 0.0);
  vec3 c = vec3(0.004, 0.006, 0.013) + vec3(0.02, 0.03, 0.05) * exp(-up * 9.0);
  float m = max(dot(d, uMoon), 0.0);
  c += vec3(0.25, 0.3, 0.38) * (pow(m, 200.0) * 0.4 + pow(m, 10.0) * 0.05);
  // A far town warms the sky low on the left.
  c += vec3(0.5, 0.22, 0.07) * 0.05 * exp(-up * 22.0) * pow(max(dot(normalize(d.xz), normalize(vec2(-0.7, -1.0))), 0.0), 6.0);
  return c;
}
float hazeAmt(vec3 P) {
  vec3 v = P - cameraPosition;
  float dist = length(v);
  float k = 1.0 / 90.0, h0 = cameraPosition.y + 140.0, h1 = max(P.y + 140.0, 0.0), dh = h1 - h0;
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);
  // A thin mist lies on the valley floor, under the town lights.
  float mist = smoothstep(-70.0, -125.0, P.y) * smoothstep(100.0, 500.0, dist) * 0.1;
  return clamp(1.0 - exp(-dist * 0.0004 * avg - dist * 0.00001) + mist, 0.0, 1.0);
}
uniform vec4 uGP[${NG}];
uniform vec4 uGC[${NG}];
// Haze takes the sky colour, warmed over each town.
vec3 hazeCol(vec3 d, vec3 P) {
  vec3 c = skyCol(normalize(vec3(d.x, max(d.y, 0.0) * 0.4 + 0.02, d.z))) * 0.7;
  for (int i = 0; i < ${NG}; i++) c += uGC[i].rgb * uGP[i].w * 0.7 * exp(-length(P.xz - uGP[i].xz) / 150.0);
  return c;
}`;

/* Sky dome with moonlit cloud. */
{
  const m = new THREE.Mesh(new THREE.SphereGeometry(20000, 48, 24), new THREE.ShaderMaterial({
    uniforms: OUTU, side: THREE.BackSide, depthWrite: false,
    vertexShader: /* glsl */`varying vec3 vP; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: /* glsl */`
    varying vec3 vP;
    uniform float uTime;
    ${NOISE}
    ${HAZE}
    void main() {
      vec3 d = normalize(vP - cameraPosition);
      vec3 c = skyCol(d);
      // The moon: a soft disc behind thin cloud.
      float m = dot(d, uMoon);
      c += vec3(0.9, 0.92, 1.0) * smoothstep(0.99982, 0.9999, m) * 1.1;
      if (d.y > 0.0) {
        vec2 p = d.xz / (d.y + 0.08) * 3.0 + vec2(uTime * 0.01, 0.0);
        float cl = smoothstep(0.42, 0.8, fbm(p * 0.6 + fbm(p * 1.3) * 0.8));
        float lit = pow(max(m, 0.0), 7.0);
        vec3 cc = vec3(0.01, 0.013, 0.022) + vec3(0.6, 0.64, 0.75) * lit * (0.5 + 0.8 * (1.0 - cl));
        c = mix(c, cc, cl * 0.92 * smoothstep(0.0, 0.08, d.y));
      }
      gl_FragColor = vec4(c, 1.0);
    }`,
  }));
  m.renderOrder = -1;
  m.frustumCulled = false;
  out.add(m);
}

/* Terrain: a grid that follows the camera in steps, so the land never swims. */
const terrain = new THREE.Mesh(new THREE.PlaneGeometry(12000, 7000, 360, 260).rotateX(-Math.PI / 2).translate(0, 0, -3300), new THREE.ShaderMaterial({
  uniforms: OUTU,
  vertexShader: /* glsl */`
  varying vec3 vP;
  ${NOISE}
  ${LAND}
  void main() {
    vec4 w = modelMatrix * vec4(position, 1.0);
    w.y = land(w.xz);
    vP = w.xyz;
    gl_Position = projectionMatrix * viewMatrix * w;
  }`,
  fragmentShader: /* glsl */`
  varying vec3 vP;
  uniform float uTime;
  ${NOISE}
  ${LAND}
  ${HAZE}
  void main() {
    float e = 2.0;
    vec3 N = normalize(vec3(land(vP.xz - vec2(e, 0.0)) - land(vP.xz + vec2(e, 0.0)), 2.0 * e, land(vP.xz - vec2(0.0, e)) - land(vP.xz + vec2(0.0, e))));
    vec3 V = normalize(cameraPosition - vP);
    float dist = length(cameraPosition - vP);
    float u = vP.z - riverZ(vP.x);
    // Forest darkens the slopes; fields stay a little paler.
    float forest = smoothstep(0.45, 0.6, fbm(vP.xz * 0.004));
    vec3 alb = mix(vec3(0.07, 0.075, 0.07), vec3(0.025, 0.035, 0.03), forest);
    vec3 c = alb * (vec3(0.3, 0.34, 0.42) * max(dot(N, uMoon), 0.0) * 0.7 + vec3(0.01, 0.013, 0.02));
    // Town glow pools: each bright source lights the ground round it.
    vec3 pool = vec3(0.0);
    for (int i = 0; i < ${NG}; i++) {
      vec3 L = uGP[i].xyz - vP;
      float d = length(L);
      pool += uGC[i].rgb * uGP[i].w * 500.0 / (d * d + 2500.0);
    }
    c += alb * pool;
    // Water: the river mirrors the moonlit sky and throws glint columns.
    float water = smoothstep(26.0, 18.0, abs(u));
    if (water > 0.0) {
      float r0 = vnoise(vec2(vP.x * 0.08, vP.z * 0.5 + uTime * 0.6));
      float r1 = vnoise(vec2(vP.x * 0.3, vP.z * 1.6 - uTime * 0.8));
      vec3 Nw = normalize(vec3((r0 - 0.5) * 0.08 + (r1 - 0.5) * 0.08, 1.0, (vnoise(vec2(vP.x * 0.08 + 3.0, vP.z * 0.5)) - 0.5) * 0.2 + (r1 - 0.5) * 0.3));
      vec3 R = reflect(-V, Nw);
      float F = 0.02 + 0.98 * pow(1.0 - max(dot(Nw, V), 0.0), 5.0);
      vec3 wc = skyCol(R) * F * 1.4 + vec3(0.5, 0.55, 0.65) * pow(max(dot(R, uMoon), 0.0), 60.0) * 0.5;
      vec3 right = normalize(cross(V, vec3(0.0, 1.0, 0.0)));
      vec3 R0 = reflect(-V, vec3(0.0, 1.0, 0.0));
      float dn = vnoise(vec2(vP.x * 0.05, vP.z * 0.6 + uTime * 0.5));
      float tilt = (dn - 0.5) * 0.4;
      for (int i = 0; i < ${NG}; i++) {
        vec3 L = uGP[i].xyz - vP;
        float dl = length(L);
        vec3 err = R0 - L / dl;
        float ex = dot(err, right), ey = err.y;
        float mm = exp(-pow((tilt - ey * 0.5) / 0.03, 2.0));
        float fall = ey > 0.0 ? exp(-ey / 0.25) : exp(-pow(ey / 0.02, 2.0));
        float sx = max(0.003, 3.0 / dl);
        wc += uGC[i].rgb * uGP[i].w * mm * fall * exp(-ex * ex / (sx * sx)) * 0.9;
      }
      // The moon lays its own broken column on the water.
      vec3 errM = R0 - uMoon;
      float mm = exp(-pow((tilt - errM.y * 0.5) / 0.03, 2.0)) * exp(-pow(dot(errM, right) / 0.02, 2.0));
      wc += vec3(0.7, 0.75, 0.85) * mm * 0.7;
      c = mix(c, wc, water);
    }
    float f = hazeAmt(vP);
    gl_FragColor = vec4(mix(c, hazeCol(-V, vP), f), 1.0);
  }`,
}));
terrain.frustumCulled = false;
out.add(terrain);

/* Town lights: a fixed tile of sources, wrapped round the camera on the GPU. */
const glints = [];
{
  const pos = [], col = [], size = [];
  const SOD = [1.0, 0.55, 0.2], WARM = [1.0, 0.75, 0.45], WHITE = [0.85, 0.92, 1.0];
  const riverZ = x => -560 + 130 * Math.sin(x / 760) + 60 * Math.sin(x / 270 + 1.3);
  // Villages cluster on the banks and the lower far slope.
  for (let v = 0; v < 15; v++) {
    const cx = (v + rnd() * 0.6) * TILE / 15, side = rnd() < 0.65 ? -1 : 1;
    const cz = riverZ(cx) + side * range(60, 260) - (side < 0 ? range(0, 500) : 0);
    const n = 30 + (rnd() * 60 | 0);
    for (let k = 0; k < n; k++) {
      const x = cx + range(-160, 160) * Math.sqrt(rnd()), z = cz + range(-90, 90) * Math.sqrt(rnd());
      const c = rnd() < 0.6 ? WARM : rnd() < 0.7 ? SOD : WHITE;
      pos.push(x, 3 + rnd() * 6, z); col.push(...c.map(q => q * range(1.6, 3.4))); size.push(range(30, 60));
    }
    glints.push({ x: cx, z: cz, col: WARM, k: range(0.7, 1.3) });
  }
  // A road climbs the far slope with lamps in a line.
  for (let x = 0; x < TILE; x += 42) {
    const z = riverZ(x) - 380 - 150 * Math.sin(x / 1300);
    pos.push(x, 4, z); col.push(...SOD.map(q => q * 2.0)); size.push(34);
  }
  // Lone farms scatter everywhere.
  for (let k = 0; k < 420; k++) {
    const x = rnd() * TILE, z = riverZ(x) - range(-300, 3400);
    pos.push(x, 4, z); col.push(...WARM.map(q => q * range(1.2, 3.2))); size.push(range(22, 40));
  }
  // A bridge over the river, lamps along both rails, every tile.
  for (const bx of [2300, 6900]) for (let k = -6; k <= 6; k++) {
    const z = riverZ(bx) + k * 8;
    pos.push(bx - 6, 8, z, bx + 6, 8, z); col.push(...WHITE.map(q => q * 2.4), ...WHITE.map(q => q * 2.4)); size.push(36, 36);
    if (k === 0) glints.push({ x: bx, z, col: WHITE, k: 1.6 });
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('size', new THREE.Float32BufferAttribute(size, 1));
  const p = new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: OUTU,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
    attribute vec3 color;
    attribute float size;
    uniform float uScale;
    uniform float uCamX;
    uniform float uTime;
    varying vec3 vC;
    varying vec3 vP;
    ${NOISE}
    ${LAND}
    void main() {
      vec3 w = position;
      w.x = uCamX + mod(w.x - uCamX + ${TILE / 2}.0, ${TILE}.0) - ${TILE / 2}.0;
      w.y += land(w.xz);
      vP = w; vC = color;
      // Distant lights shimmer a little in the valley air.
      vC *= 0.85 + 0.15 * sin(uTime * 3.0 + position.x * 0.37 + position.z * 0.11);
      vec4 mv = viewMatrix * vec4(w, 1.0);
      gl_PointSize = clamp(size * 7.0 * uScale / -mv.z, 2.5, 28.0);
      gl_Position = projectionMatrix * mv;
    }`,
    fragmentShader: /* glsl */`
    varying vec3 vC;
    varying vec3 vP;
    ${HAZE}
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float a = exp(-dot(c, c) * 22.0);
      // A cap keeps tight clusters from blowing the bloom into blocks.
      gl_FragColor = vec4(min(vC * a * (1.0 - hazeAmt(vP) * 0.6), vec3(4.0)), 1.0);
    }`,
  }));
  p.frustumCulled = false;
  p.renderOrder = 2;
  out.add(p);
}
glints.slice(0, NG).forEach((g, i) => OUTU.uGC.value[i].set(...g.col, 0));

/* The viaduct: a parapet below the window, posts and lamps that strobe past. */
const parapet = new THREE.Mesh(new THREE.BoxGeometry(400, 1.0, 0.4).translate(0, -1.75, -4.0), new THREE.ShaderMaterial({
  uniforms: OUTU,
  vertexShader: /* glsl */`varying vec3 vP; varying vec3 vN; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; vN = normal; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: /* glsl */`
  varying vec3 vP;
  varying vec3 vN;
  uniform vec4 uLP[${NL}];
  void main() {
    vec3 c = vec3(0.004, 0.005, 0.007);
    for (int i = 0; i < ${NL}; i++) {
      vec3 L = uLP[i].xyz - vP;
      float d = length(L);
      c += vec3(1.0, 0.7, 0.4) * uLP[i].w * 1.6 / (d * d + 1.0) * max(dot(normalize(vN), L / d) * 0.8 + 0.2, 0.0);
    }
    gl_FragColor = vec4(c * 0.35, 1.0);
  }`,
}));
out.add(parapet);
// Posts and lamps are quads; their shader smears them by the train speed.
// uSmear is the travel in metres during one frame's shutter.
const quadMat = (lamp) => new THREE.ShaderMaterial({
  uniforms: OUTU,
  transparent: true, depthWrite: false, blending: lamp ? THREE.AdditiveBlending : THREE.NormalBlending,
  vertexShader: /* glsl */`
  attribute float aX;
  uniform float uSmear;
  varying vec2 vL;
  void main() {
    vec3 p = position;
    // The local quad is 1 m wide; it stretches by the smear.
    float wdt = ${lamp ? '1.4' : '0.2'} + uSmear;
    p.x *= wdt;
    vL = vec2(p.x, p.y);
    vec4 w = modelMatrix * vec4(p + vec3(aX, 0.0, 0.0), 1.0);
    gl_Position = projectionMatrix * viewMatrix * w;
  }`,
  fragmentShader: lamp ? /* glsl */`
  uniform float uSmear;
  varying vec2 vL;
  void main() {
    float hw = uSmear * 0.5, r = 0.07;
    // A round lamp swept along x: a capsule of light.
    float dx = max(abs(vL.x) - hw, 0.0);
    float core = exp(-(dx * dx + vL.y * vL.y) / (r * r));
    float halo = exp(-(dx * dx + vL.y * vL.y) / 0.06) * 0.08;
    // The halo fades out before the quad edge.
    halo *= smoothstep(0.5, 0.3, abs(vL.y)) * smoothstep(0.7, 0.45, dx);
    float k = r / (r + uSmear * 0.6);
    gl_FragColor = vec4(vec3(1.0, 0.8, 0.55) * (core * 30.0 * k + halo * 4.0), 1.0);
  }` : /* glsl */`
  uniform float uSmear;
  varying vec2 vL;
  void main() {
    float w = 0.12, s = uSmear + 0.001;
    // A box post convolved with the motion box: a trapezoid of cover.
    float cov = clamp((w + s - abs(vL.x) * 2.0) / (2.0 * s), 0.0, 1.0) * min(1.0, w / s);
    gl_FragColor = vec4(vec3(0.003, 0.003, 0.004), cov * 0.95);
  }`,
});
const LAMPS = 9;
const lampX = new Float32Array(LAMPS);
function strip(geo, lamp) {
  const g = new THREE.InstancedBufferGeometry().copy(geo);
  g.instanceCount = LAMPS;
  g.setAttribute('aX', new THREE.InstancedBufferAttribute(lampX, 1).setUsage(THREE.DynamicDrawUsage));
  const m = new THREE.Mesh(g, quadMat(lamp));
  m.frustumCulled = false;
  m.renderOrder = lamp ? 4 : 3;
  out.add(m);
  return g;
}
const postG = strip(new THREE.PlaneGeometry(1, 3.0).translate(0, -1.0, -4.2), false);
const lampG = strip(new THREE.PlaneGeometry(1, 1.0).translate(0, 0.55, -4.1), true);

/* Rain in the air: thin streaks, lit only near the lamps. */
{
  const n = 2200, pos = new Float32Array(n * 3);

const scene = new THREE.Scene();

const NB = 6;
const W = {
  tOut: { value: outRT.texture },
  uRes: { value: new THREE.Vector2(1, 1) },
  uTime: { value: 0 },
  uLook: { value: 0 },
  uHalf: { value: new THREE.Vector2(0.6, 0.33) },
  uRad: { value: 0.08 },
  uRain: { value: 1 },
  uFog: { value: 0 },
  uWind: { value: 1.6 },
  uFlow: { value: 0 },

  fragmentShader: /* glsl */`
  uniform sampler2D tOut;
  uniform vec2 uRes;
  uniform float uTime, uLook, uRad, uRain, uFog, uWind, uFlow;
  uniform vec2 uHalf;

  varying vec2 vUv;
  ${NOISE}
  float sdRR(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
  // Still beads: one per cell; returns the lens normal and a cover mask.
  vec3 beads(vec2 p, float sc, float dens) {
    vec2 g = p * sc, i = floor(g), f = fract(g);
    if (hash1(i + 9.0) > dens) return vec3(0.0);
    vec2 o = 0.25 + 0.5 * hash2(i);
    float r = 0.07 + 0.2 * hash1(i + 3.0);
    vec2 dv = (f - o) / r;
    float dd = dot(dv, dv);

    return vec3(dv * r / sc, 1.0 - dd);
  }
  // Running drops: columns along the slant, heads with thin trails behind.
  vec4 runs(vec2 p) {
    vec2 m = normalize(vec2(-uWind, -1.0));
    vec2 ax = vec2(-m.y, m.x);
    float u = dot(p, ax), v = dot(p, m);
    float W = 0.05;
    float col = floor(u / W);
    float h = hash1(vec2(col, 3.0));
    if (h < 0.3) return vec4(0.0);
    float fu = (fract(u / W) - 0.5) * W + sin(v * 37.0 + h * 40.0) * 0.003 + (h - 0.65) * 0.02;

    float hr = 0.0045 + 0.004 * h;

    vec2 n = vec2(0.0);

    float tl = 0.22 + 0.2 * h;

    float e = 0.0015;

    vec3 warm = vec3(1.0, 0.62, 0.32);

    vec3 col;

    vec3 lampHit = vec3(0.0);
    float pxw = 1.5 / uRes.y;
    if (d < 0.0) {

      vec2 off = vec2(0.0);
      float cover = 0.0, clear = 0.0;
      if (uRain > 0.0) {

      for (int i = 0; i < ${NB}; i++) {

        float rr = 0.09 + 0.05 * min(age * 3.0, 1.0);
        float edge = vnoise((p - uBreath[i].xy) * 18.0) * 0.05;
        float spot = smoothstep(rr + edge, rr * 0.3, length((p - uBreath[i].xy) * vec2(1.0, 1.25)));

      vec2 uv = px + off / vec2(asp, 1.0);
      vec3 sharp = texture2D(tOut, uv).rgb;

      for (int i = 0; i < 14; i++) {

      // The glass reflects the lit carriage as a soft warm gradient.
      float rg = smoothstep(-0.7, 0.4, -p.y * 0.8 + p.x * 0.35) * 0.7 + 0.3 * smoothstep(0.1, 0.5, p.y);

      wall *= 0.55 + 0.45 * smoothstep(fw, fw + 0.06, d);

/* ---------- framing ---------- */
let look = 0, lookT = 0;
const asp = { v: 1.6 };
function frame(w, h, pr) {
  asp.v = w / h;
  outCam.aspect = w / h;
  outCam.fov = w >= h ? 48 : 66;
  outCam.updateProjectionMatrix();
  outRT.setSize(Math.max(1, Math.round(w * pr)), Math.max(1, Math.round(h * pr)));
  W.uRes.value.set(w * pr, h * pr);
  // One big window: wide in landscape, tall in portrait.
  if (w >= h) { W.uHalf.value.set(Math.min(asp.v * 0.5 - 0.1, 0.82), 0.34); W.uRad.value = 0.045; }
  else { W.uHalf.value.set(asp.v * 0.5 - 0.06, 0.4); W.uRad.value = 0.04; }
  OUTU.uScale.value = (h * pr) / (2 * Math.tan(THREE.MathUtils.degToRad(outCam.fov) / 2)) / 400;
}

/* ---------- motion ---------- */
let time = 0, flow = 0, camX = 1203.3, speed = 0;
const MODES = { clear: { rain: 0, fog: 0 }, rain: { rain: 1, fog: 0 }, fogged: { rain: 0.45, fog: 0.85 } };
let mode = MODES.rain, mk = 0;
let breaths = [], drag = false;
const proj = new THREE.Vector3();
function place() {
  outCam.position.set(camX, 0, 0);
  outCam.rotation.set(-0.14, look * 0.55, 0, 'YXZ');
  outCam.updateMatrixWorld();
  OUTU.uCamX.value = camX;
  terrain.position.x = Math.round(camX / 33.3333) * 33.3333;
  // Lamps sit every 28 m; the window sees the few round the camera.
  const base = Math.floor(camX / LAMP_GAP) * LAMP_GAP;
  for (let i = 0; i < LAMPS; i++) lampX[i] = base + (i - 4) * LAMP_GAP;
  postG.attributes.aX.needsUpdate = true;
  lampG.attributes.aX.needsUpdate = true;
  for (let i = 0; i < NL; i++) OUTU.uLP.value[i].set(lampX[i + 1] ?? 0, 0.55, -4.1, 1.0);
  // Glint sources wrap round the camera like the lights.
  glints.slice(0, NG).forEach((g, i) => {
    const x = camX + ((((g.x - camX + TILE / 2) % TILE) + TILE) % TILE) - TILE / 2;
    OUTU.uGP.value[i].set(x, -110, g.z, g.k);
  });
  // The three lamps nearest the window light the frame and the fog.
  const hits = [];
  for (let i = 0; i < LAMPS; i++) {
    proj.set(lampX[i], 0.55, -4.1).project(outCam);
    if (proj.z > 1) continue;
    const sx = proj.x * 0.5 * asp.v, sy = proj.y * 0.5;
    const k = Math.exp(-Math.max(0, Math.abs(sx) - W.uHalf.value.x) * 3) * (Math.abs(sx) < asp.v ? 1 : 0);
    hits.push([sx, sy, k]);
  }
  hits.sort((a, b) => b[2] - a[2]);
  for (let i = 0; i < 3; i++) W.uLamp.value[i].set(...(hits[i] || [0, 0, 0]));
  OUTU.uSmear.value = speed / 40;
}
function update(dt, pace) {
  // The train rolls at speed while awake and slows to a stop when idle.
  speed += (27 * pace - speed) * Math.min(1, dt * 1.5);
  if (pace === 0 && speed < 0.05) speed = 0;
  camX += speed * dt;
  time += dt;
  flow += dt * (0.25 + speed / 27);
  OUTU.uTime.value = time;
  W.uTime.value = time;
  W.uFlow.value = flow;
  W.uWind.value = 0.5 + 1.6 * speed / 27;
  mk = Math.min(1, mk + dt * 0.8);
  W.uRain.value += (mode.rain - W.uRain.value) * Math.min(1, dt * 2);
  W.uFog.value += (mode.fog - W.uFog.value) * Math.min(1, dt * 1.2);
  OUTU.uRain.value = W.uRain.value;
  if (!drag) look += (lookT - look) * Math.min(1, dt * 6);
  place();
}
function breathe(x, y) {
  const p = [(x - 0.5) * asp.v, 0.5 - y];
  breaths.push({ p, t: time });
  breaths = breaths.slice(-NB);
  breaths.forEach((b, i) => W.uBreath.value[i].set(b.p[0], b.p[1], b.t, 1.0));

place();
return {
  scene, camera, frame, update, orbs: [],
  before(r) {
    r.setRenderTarget(outRT);
    r.render(out, outCam);
    r.setRenderTarget(null);
  },
  tap: (x, y) => breathe(x, y),
  act: () => breathe(0.5 + (rnd() - 0.5) * 0.4, 0.45 + (rnd() - 0.5) * 0.3),
  drag(dx, dy, on) { drag = on; if (on) { lookT = Math.max(-0.7, Math.min(0.7, lookT - dx * 1.4)); look = lookT; } },
  lively: () => drag || Math.abs(look - lookT) > 0.002 || mk < 1 || breaths.some(b => time - b.t < 14),
  setMode(v, now) { mode = MODES[v] || MODES.rain; mk = now ? 1 : 0; if (now) { W.uRain.value = mode.rain; W.uFog.value = mode.fog; OUTU.uRain.value = mode.rain; } },
  post: { bloom: [0.7, 0.55, 0.8], tint: [0.0008, 0.0007, 0.0009], vig: 0.45, vigIn: 0.45, grain: 0.03 },

}

/* ---------- end scene ---------- */

const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  document.querySelector('.fail').hidden = false;
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
stage.append(renderer.domElement);

const S = build({ THREE, mergeGeometries, Reflector });

/* Post chain: render, half-resolution bloom, grade, output. */
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(S.scene, S.camera));
const [bS, bR, bT] = S.post.bloom;
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), bS, bR, bT);
// The bloom runs at half resolution.
const bloomSize = bloom.setSize.bind(bloom);
bloom.setSize = (w, h) => bloomSize(Math.max(1, w / 2), Math.max(1, h / 2));
composer.addPass(bloom);

// The grade adds lamp orbs, a tint, a vignette and fixed grain.
const ORB_N = 12;
const grade = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null },
    uRes: { value: new THREE.Vector2(1, 1) },
    uTint: { value: new THREE.Vector3(...S.post.tint) },
    uVig: { value: S.post.vig },
    uVigIn: { value: S.post.vigIn },
    uGrain: { value: S.post.grain },
    uOP: { value: Array.from({ length: ORB_N }, () => new THREE.Vector3()) },
    uOC: { value: Array.from({ length: ORB_N }, () => new THREE.Vector4()) },
    uN: { value: 0 },
  },
  vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform sampler2D tDiffuse;
  uniform vec2 uRes;
  uniform vec3 uTint;
  uniform float uVig, uVigIn, uGrain;
  uniform vec3 uOP[${ORB_N}];
  uniform vec4 uOC[${ORB_N}];
  uniform int uN;
  varying vec2 vUv;
  // Interleaved gradient noise: fine grain with no banding.
  float h(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
  void main() {
    vec3 c = texture2D(tDiffuse, vUv).rgb;
    float asp = uRes.x / uRes.y;
    for (int i = 0; i < ${ORB_N}; i++) {
      if (i >= uN) break;
      vec2 d = vUv - uOP[i].xy;
      float r = length(vec2(d.x * asp * 0.6, d.y));
      // A tight core and a wide skirt; z holds the orb size.
      c += uOC[i].rgb * uOC[i].w * (exp(-r * 40.0 / uOP[i].z) + 0.35 * exp(-r * 9.0 / uOP[i].z));
    }
    c += uTint;
    vec2 q = (vUv - 0.5) * vec2(asp, 1.0);
    c *= 1.0 - uVig * smoothstep(uVigIn, 1.1, length(q));
    float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
    c *= 1.0 + (h(vUv * uRes) - 0.5) * uGrain * (0.6 + 0.4 * smoothstep(0.0, 0.3, lum)) * 2.0;
    gl_FragColor = vec4(max(c, 0.0), 1.0);
  }`,
});
composer.addPass(grade);
composer.addPass(new OutputPass());

const tmpV = new THREE.Vector3();
function placeOrbs() {
  S.camera.updateMatrixWorld();
  let n = 0;
  for (const o of S.orbs) {
    if (n >= ORB_N) break;
    if (o.k <= 0) continue;
    tmpV.copy(o.pos).project(S.camera);
    if (tmpV.z > 1 || Math.abs(tmpV.x) > 1.3 || Math.abs(tmpV.y) > 1.3) continue;
    grade.uniforms.uOP.value[n].set(tmpV.x * 0.5 + 0.5, tmpV.y * 0.5 + 0.5, o.size);
    grade.uniforms.uOC.value[n].set(o.color[0], o.color[1], o.color[2], o.k);
    n++;
  }
  grade.uniforms.uN.value = n;
}

let size = { w: 1, h: 1, dpr: 1 };
function resize() {
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  // The pixel ratio keeps a budget of about 2.6 million pixels.
  const dpr = Math.max(1, Math.min(devicePixelRatio || 1, 2, Math.sqrt(2.6e6 / (w * h))));
  size = { w, h, dpr };
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
  grade.uniforms.uRes.value.set(w * dpr, h * dpr);
  S.frame(w, h, dpr);
  draw();
}
let ready = false;
function draw() {
  if (document.hidden) return;
  S.before?.(renderer);
  placeOrbs();
  composer.render();
  if (!ready) { ready = true; window.__ready = true; }
}

/* Frame loop: full rate in an event, 30 fps while drifting, then sleep. */
const reducedRM = matchMedia('(prefers-reduced-motion: reduce)');
// QA can shorten the sleep with ?sleep=<ms>.
const SLEEP = +new URLSearchParams(location.search).get('sleep') || 60000;
let raf = 0, lastT = 0, lastDraw = 0, lastInput = performance.now(), pace = reducedRM.matches ? 0 : 1;
function loop(now) {
  raf = 0;
  if (document.hidden) return;
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000);
  lastT = now;
  // Ambient motion eases out over 2 s once idle; reduced motion keeps it off.
  const awake = !reducedRM.matches && now - lastInput < SLEEP;
  pace = awake ? Math.min(1, pace + dt / 2) : Math.max(0, pace - dt / 2);
  const lively = S.lively();
  if (!lively && pace === 0) { S.update(0, 0); draw(); return; }
  if (lively || now - lastDraw >= 31) {
    // A drift frame covers the gap since the last draw, never more than 0.1 s.
    S.update(lively ? dt : Math.min(0.1, Math.max(dt, (now - lastDraw) / 1000)), pace);
    draw();
    lastDraw = now;
  }
  raf = requestAnimationFrame(loop);
}
function wake() {
  lastInput = performance.now();
  if (!raf && !document.hidden) { lastT = lastDraw = performance.now(); raf = requestAnimationFrame(loop); }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; lastT = 0; return; }
  draw(); wake();
});

/* Pointer: a press is a tap unless it moves 8 px or holds 260 ms. */
let press = null;
const norm = e => [e.clientX / size.w, e.clientY / size.h];
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  press = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, t: performance.now(), moved: false };
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press) return;
  if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) press.moved = true;
  if (press.moved && S.drag) { S.drag((e.clientX - press.lx) / size.w, (e.clientY - press.ly) / size.h, true); wake(); }
  press.lx = e.clientX; press.ly = e.clientY;
});
function endPress(e, ok) {
  if (press && ok && !press.moved && performance.now() - press.t < 260) S.tap(...norm(e));
  if (press?.moved && S.drag) S.drag(0, 0, false);
  press = null; wake();
}
stage.addEventListener('pointerup', e => endPress(e, true));
stage.addEventListener('pointercancel', e => endPress(e, false));
document.getElementById('act').addEventListener('click', () => { S.act(); wake(); });

// Chips: one pressed at a time; the scene eases to the new light.
const group = document.getElementById('mode');
const chips = [...group.querySelectorAll('.chip')];
function pick(v) {
  for (const c of chips) c.setAttribute('aria-pressed', String(c.dataset.value === v));
  S.setMode(v);
  wake();
}
for (const c of chips) c.addEventListener('click', () => pick(c.dataset.value));
addEventListener('keydown', e => {
  const i = { Digit1: 0, Digit2: 1, Digit3: 2 }[e.code];
  if (i !== undefined && chips[i]) pick(chips[i].dataset.value);
  if (e.code === 'Space' && !e.target.closest?.('button')) { e.preventDefault(); S.act(); }
  wake();
});
const first = new URLSearchParams(location.search).get('mode');
if (first && chips.some(c => c.dataset.value === first)) {
  for (const c of chips) c.setAttribute('aria-pressed', String(c.dataset.value === first));
  S.setMode(first, true);
}
addEventListener('resize', resize);

// Compile first, then draw the first composed frame.
(async () => {
  S.frame(innerWidth, innerHeight, 1);
  if (renderer.extensions.has('KHR_parallel_shader_compile')) await renderer.compileAsync(S.scene, S.camera);
  else renderer.compile(S.scene, S.camera);
  resize();
  wake();
})().catch(err => { console.error(err); document.querySelector('.fail').hidden = false; });
</script>
</body>
</html>
