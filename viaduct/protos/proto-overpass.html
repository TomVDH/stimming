<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overpass prototype</title>
<style>
:root { --bg: #0b0a10; --fg: #ece9f2; --muted: #9a94a8; --line: #2c2834; --chip: #1a1720; --on: #3a3044; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.3 system-ui, sans-serif; }
body { display: flex; flex-direction: column; }
#stage { position: relative; flex: 1; min-height: 0; touch-action: none; cursor: pointer; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); }
.choices { display: flex; gap: 2px; background: var(--chip); border-radius: 999px; padding: 2px; }
button { font: inherit; color: var(--fg); background: var(--chip); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.choices button[aria-pressed="true"] { background: var(--on); }
label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.how { margin-left: auto; color: var(--muted); font-size: 12px; }
@media (max-width: 600px) { .how { display: none; } }
</style></head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="bar">
  <div class="choices" id="wx" role="group" aria-label="Weather">
    <button data-v="dry" aria-pressed="false">Dry</button><button data-v="rain" aria-pressed="true">Rain</button><button data-v="mist" aria-pressed="false">Mist</button>
  </div>
  <label>Traffic <input type="range" id="traffic" min="0" max="1" step="0.01" value="0.4"></label>
  <button id="add">+ Train</button>
  <span class="how">Tap: train · Hold: brake · Drag: look</span>
</div>
<script>
// Overpass prototype: we stand under the deck; trains pass overhead as light.
const stage = document.getElementById('stage'), cv = document.getElementById('c'), g = cv.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, dpr = 1;
function fit() {
  dpr = Math.min(2, devicePixelRatio || 1); W = stage.clientWidth; H = stage.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); wake();
}
new ResizeObserver(fit).observe(stage);

// State.
let weather = 'rain', traffic = 0.4, look = 0, lookV = 0, held = false, dir = 1, nextAuto = 6;
const trains = [];
let lampFlicker = 1, flickT = 4, t = 0;
const drops = Array.from({ length: 500 }, () => ({ x: Math.random(), y: Math.random(), s: 0.7 + Math.random() * 0.6 }));

function sendTrain() {
  // A train: cars of windows, crossing from one side at speed v (px/s, scaled).
  trains.push({ x: dir > 0 ? -1.4 : 2.4, dir, v: 0.32 + Math.random() * 0.08, cars: 4 + (Math.random() * 3 | 0), cur: 1 });
  dir = -dir; wake();
}

// Geometry helpers in stage units.
const lipAt = x => H * (H > W ? 0.27 : 0.3) + (H * 0.07) * (x / W);
const groundY = () => H * (H > W ? 0.74 : 0.72);
const lampPos = () => [W * (H > W ? 0.8 : 0.82) + look * 0.6, H * 0.5];

function lin(y0, y1, stops, x0 = 0, x1 = 0) { const l = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => l.addColorStop(o, c)); return l; }
function glow(x, y, r, col, a, sy = 1) {
  if (r <= 0 || a <= 0) return;
  g.save(); g.translate(x, y); g.scale(1, sy);
  const l = g.createRadialGradient(0, 0, 0, 0, 0, r);
  l.addColorStop(0, col.replace('A', a)); l.addColorStop(0.3, col.replace('A', a * 0.35)); l.addColorStop(1, col.replace('A', 0));
  g.fillStyle = l; g.fillRect(-r, -r, r * 2, r * 2); g.restore();
}

// Window slats of every train, as screen x ranges with brightness.
function slats() {
  const out = [];
  for (const tr of trains) {
    const carW = W * 0.24, winW = carW / 7;
    for (let c = 0; c < tr.cars; c++) for (let k = 0; k < 6; k++) {
      const off = (c * carW + k * winW + winW * 0.3) * -tr.dir;
      const x = tr.x * W + off;
      if (x < -winW * 3 || x > W + winW * 3) continue;
      out.push({ x, w: winW * 0.45, a: 0.85 + 0.15 * Math.sin(t * 13 + c * 7 + k * 3), skew: 0.16 * tr.dir });
    }
  }
  return out;
}

function render() {
  const gy = groundY(), portrait = H > W;
  // Sodium skyglow beyond the overpass.
  g.fillStyle = lin(0, gy, [[0, '#09080f'], [0.5, '#22151c'], [0.85, '#5a3322'], [1, '#77432a']]); g.fillRect(0, 0, W, gy);
  // Far skyline: a low, flat band, darker than the sky.
  g.fillStyle = 'rgba(28,18,22,0.55)';
  for (let i = 0; i < 18; i++) { const bx = ((i * 97.3) % 1) * 0 + i * W / 14 - W * 0.1 + look * 0.15, bh = H * (0.03 + ((i * 37) % 9) / 120); g.fillRect(bx, gy - bh, W / 16, bh); }
  // Wet ground.
  const wet = weather === 'dry' ? 0.4 : 1;
  g.fillStyle = lin(gy, H, [[0, '#2a1a16'], [0.12, '#120d10'], [1, '#050407']]); g.fillRect(0, gy, W, H - gy);

  // Overpass underside, receding right; girder ribs say "deck overhead".
  const lipL = lipAt(0), lipR = lipAt(W);
  g.fillStyle = '#040306'; g.beginPath(); g.moveTo(0, 0); g.lineTo(W, 0); g.lineTo(W, lipR); g.lineTo(0, lipL); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(70,52,52,0.18)'; g.lineWidth = 1;
  for (let i = 0; i < 9; i++) { const x = ((i + 0.5) / 9) * W + look * 0.4; const y = lipAt(x); g.beginPath(); g.moveTo(x - W * 0.08, y - H * 0.12); g.lineTo(x, y - 18); g.stroke(); }
  // Fascia: the deck edge, a thick band catching sodium from below.
  g.fillStyle = lin(lipL - 16, lipL, [[0, '#120c0e'], [1, '#2e1c18']]);
  g.beginPath(); g.moveTo(0, lipL - 16); g.lineTo(W, lipR - 16); g.lineTo(W, lipR); g.lineTo(0, lipL); g.closePath(); g.fill();

  const S = slats();
  g.save(); g.globalCompositeOperation = 'lighter';
  // Train windows show along the parapet top; slats fall through the deck joint.
  for (const s of S) {
    const y = lipAt(s.x), drop = gy - y, sk = drop * s.skew;
    g.fillStyle = `rgba(160,228,255,${0.9 * s.a})`; g.fillRect(s.x, y - 20, s.w, 3);
    g.fillStyle = lin(y, gy, [[0, `rgba(140,215,255,${0.16 * s.a})`], [0.7, `rgba(140,215,255,${0.05 * s.a})`], [1, `rgba(140,215,255,${0.09 * s.a})`]]);
    g.beginPath(); g.moveTo(s.x, y); g.lineTo(s.x + s.w, y); g.lineTo(s.x + s.w * 1.6 + sk, gy); g.lineTo(s.x + sk, gy); g.closePath(); g.fill();
    g.fillStyle = `rgba(170,230,255,${0.45 * s.a})`; g.fillRect(s.x + sk, gy, s.w * 1.6, 2);
    g.fillStyle = lin(gy, gy + (H - gy) * 0.7, [[0, `rgba(140,215,255,${0.12 * wet * s.a})`], [1, 'rgba(140,215,255,0)']]);
    g.fillRect(s.x + sk + s.w * 0.2 + Math.sin(t * 3 + s.x) * 2, gy + 3, s.w * 1.2, (H - gy) * 0.7);
  }
  g.restore();

  // Piers with T caps; lamp side rim-lit; slats light them as they pass.
  const [lx, ly] = lampPos();
  const piers = portrait ? [[0.22, 40]] : [[0.2, 62], [0.6, 42]];
  for (const [px, pw] of piers) {
    const x = W * px + look, top = lipAt(x);
    g.fillStyle = '#08070b';
    g.fillRect(x, top + 10, pw, gy - top - 6);
    g.beginPath(); g.moveTo(x - pw * 0.9, top); g.lineTo(x + pw * 1.9, top); g.lineTo(x + pw, top + 28); g.lineTo(x, top + 28); g.closePath(); g.fill();
    const side = lx > x ? 1 : 0;
    g.fillStyle = lin(0, 0, [[0, 'rgba(255,140,60,0)'], [1, `rgba(255,140,60,${0.28 * lampFlicker})`]], x + pw * (side ? 0.55 : 0.45), x + pw * side);
    g.fillRect(x + (side ? pw * 0.55 : 0), top + 20, pw * 0.45, gy - top - 16);
    let hit = 0;
    for (const s of S) {
      const sy = lipAt(s.x), mid = s.x + s.w * 0.8 + (gy - sy) * s.skew * 0.5;
      const d = Math.abs(mid - (x + pw / 2)) / (pw * 0.6 + s.w);
      if (d < 1) hit = Math.max(hit, (1 - d) * s.a);
    }
    if (hit > 0) { g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = lin(top, gy, [[0, `rgba(150,220,255,${0.05 * hit})`], [1, `rgba(150,220,255,${0.16 * hit})`]]); g.fillRect(x, top + 28, pw, gy - top - 24); g.restore(); }
  }

  g.save(); g.globalCompositeOperation = 'lighter';
  // Sodium lamp: halo, pool, long wet streak. It flickers now and then.
  const lf = lampFlicker;
  glow(lx, ly, 10, 'rgba(255,215,150,A)', lf);
  glow(lx, ly, Math.min(W, H) * 0.22, 'rgba(255,130,40,A)', 0.22 * lf);
  glow(lx, gy + 14, W * 0.28, 'rgba(255,120,30,A)', 0.3 * lf, 0.2);
  g.fillStyle = lin(gy, H, [[0, `rgba(255,150,60,${0.35 * lf * wet})`], [1, 'rgba(255,150,60,0)']]); g.fillRect(lx - 3, gy, 6, H - gy);
  // Rain: faint, bright inside slats and the lamp halo.
  if (weather === 'rain') {
    g.lineWidth = 1;
    for (const d of drops) {
      const x = d.x * W, y = d.y * H;
      let a = 0.1;
      if (Math.hypot(x - lx, y - ly) < Math.min(W, H) * 0.2) a = 0.45;
      for (const s of S) { const sy = lipAt(s.x); if (y > sy && y < gy && Math.abs(x - (s.x + (y - sy) * s.skew)) < s.w * 1.2) { a = 0.55; break; } }
      g.strokeStyle = a > 0.3 && a < 0.5 ? `rgba(255,190,120,${a})` : `rgba(200,225,255,${a})`;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x - 3 * d.s, y + 16 * d.s); g.stroke();
    }
  }
  g.restore();
  // Mist: a warm veil that softens everything below the deck.
  if (weather === 'mist') { g.fillStyle = lin(lipL, H, [[0, 'rgba(120,80,70,0.05)'], [0.6, 'rgba(120,80,70,0.28)'], [1, 'rgba(60,40,40,0.2)']]); g.fillRect(0, lipL, W, H - lipL); }
  // Vignette.
  const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.8);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.45)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
}

function step(dt) {
  t += dt;
  for (const tr of trains) {
    const target = held ? 0.05 : tr.v;
    tr.cur += (target / tr.v - tr.cur) * Math.min(1, dt * (held ? 1.5 : 0.6));
    tr.x += tr.dir * tr.v * tr.cur * dt;
  }
  for (let i = trains.length - 1; i >= 0; i--) { const tr = trains[i]; if ((tr.dir > 0 && tr.x > 2.6) || (tr.dir < 0 && tr.x < -1.6)) trains.splice(i, 1); }
  if (traffic > 0.02 && !held) { nextAuto -= dt * traffic; if (nextAuto <= 0) { sendTrain(); nextAuto = 8 + Math.random() * 6; } }
  if (!reduced) {
    for (const d of drops) { d.y += dt * 1.6 * d.s; d.x -= dt * 0.25 * d.s; if (d.y > 1) { d.y -= 1; d.x = Math.random() * 1.1; } }
    flickT -= dt; if (flickT < 0) { lampFlicker = Math.random() < 0.5 ? 0.3 : 1; if (flickT < -0.15) { lampFlicker = 1; flickT = 5 + Math.random() * 9; } }
  }
  look += lookV * dt; lookV *= Math.pow(0.02, dt); look *= Math.pow(0.4, dt * (dragging ? 0 : 1));
}

/* Frame loop: lively at full rate, drifting at 30 fps, asleep after 60 s idle. */
let raf = 0, lastDraw = 0, lastT = 0, lastInput = performance.now();
const busy = () => trains.length > 0 || held || dragging || Math.abs(look) > 0.5;
function frame(now) {
  raf = 0;
  const lively = busy(), idle = now - lastInput;
  if (!lively && (reduced || idle > 60000)) { render(); return; }
  if (!lively && now - lastDraw < 31) { raf = requestAnimationFrame(frame); return; }
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
  try { step(dt); render(); } finally { lastDraw = now; if (!document.hidden) raf = requestAnimationFrame(frame); }
}
function wake() { if (!raf && !document.hidden && W) { lastT = performance.now(); raf = requestAnimationFrame(frame); } }
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else wake(); });

/* Pointer: drag after 8 px, hold after 260 ms, else a tap. */
let press = null, dragging = false, holdTimer = 0;
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId); lastInput = performance.now();
  press = { x: e.clientX, y: e.clientY, lx: e.clientX }; dragging = false;
  holdTimer = setTimeout(() => { held = true; wake(); }, 260); wake();
});
stage.addEventListener('pointermove', e => {
  if (!press) return; lastInput = performance.now();
  if (!dragging && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { dragging = true; clearTimeout(holdTimer); held = false; }
  if (dragging) { const dx = e.clientX - press.lx; press.lx = e.clientX; look = Math.max(-W * 0.15, Math.min(W * 0.15, look + dx * 0.5)); wake(); }
});
function end(tap) {
  clearTimeout(holdTimer);
  if (press && tap && !dragging && !held) sendTrain();
  press = null; dragging = false; held = false; lastInput = performance.now(); wake();
}
stage.addEventListener('pointerup', () => end(true));
stage.addEventListener('pointercancel', () => end(false));
stage.addEventListener('lostpointercapture', () => { if (press) end(false); });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); lastInput = performance.now(); sendTrain(); } });

document.getElementById('wx').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  for (const o of e.currentTarget.children) o.setAttribute('aria-pressed', o === b);
  weather = b.dataset.v; lastInput = performance.now(); wake();
});
document.getElementById('traffic').addEventListener('input', e => { traffic = +e.target.value; lastInput = performance.now(); wake(); });
document.getElementById('add').addEventListener('click', () => { lastInput = performance.now(); sendTrain(); });

// First frame: a train already crossing overhead.
trains.push({ x: 0.55, dir: 1, v: 0.34, cars: 5, cur: 1 }); dir = -1;
fit();
</script></body></html>
