<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Port causeway prototype</title>
<style>
:root { --bg: #0a0a0d; --fg: #ecebef; --muted: #9a97a3; --line: #2a2830; --chip: #18171c; --on: #39322c; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.3 system-ui, sans-serif; }
body { display: flex; flex-direction: column; }
#stage { position: relative; flex: 1; min-height: 0; touch-action: none; cursor: pointer; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); }
.choices { display: flex; gap: 2px; background: var(--chip); border-radius: 999px; padding: 2px; }
button { font: inherit; color: var(--fg); background: var(--chip); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.choices button[aria-pressed="true"] { background: var(--on); }
label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.how { margin-left: auto; color: var(--muted); font-size: 12px; }
@media (max-width: 600px) { .how { display: none; } }
</style></head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="bar">
  <div class="choices" id="wx" role="group" aria-label="Weather">
    <button data-v="clear" aria-pressed="false">Clear</button><button data-v="fog" aria-pressed="true">Fog</button><button data-v="rain" aria-pressed="false">Rain</button>
  </div>
  <label>Shift <input type="range" id="shift" min="0" max="1" step="0.01" value="0.6"></label>
  <button id="add">+ Convoy</button>
  <span class="how">Tap: convoy · Hold: searchlight · Drag: sweep</span>
</div>
<script>
// Port causeway prototype: a causeway strides over black sea into a lit complex.
const stage = document.getElementById('stage'), cv = document.getElementById('c'), g = cv.getContext('2d');
const back = document.createElement('canvas'), bg = back.getContext('2d');
const front = document.createElement('canvas'), fg = front.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, dpr = 1, hz = 0, f = 0, P = null, L = null;

// Causeway constants in world units.
const DB = 14, DT = 18, HW = 7, STEP = 26, SPANS = 22, END = SPANS * STEP;
const along = u => [-40 + u * 0.45, 30 + u];

// State.
let weather = 'fog', shift = 0.6, t = 0, held = false, dragging = false;
let beam = 0, beamV = 0, beamTarget = null, sweep = 0;
const convoys = [];
const drops = Array.from({ length: 420 }, () => ({ x: Math.random(), y: Math.random(), s: 0.7 + Math.random() * 0.6 }));

function lin(c, y0, y1, stops, x0 = 0, x1 = 0) { const l = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, s]) => l.addColorStop(o, s)); return l; }
function glow(c, x, y, r, col, a, sy = 1) {
  if (r <= 0 || a <= 0.002) return;
  c.save(); c.translate(x, y); c.scale(1, sy);
  const l = c.createRadialGradient(0, 0, 0, 0, 0, r);
  l.addColorStop(0, col.replace('A', a)); l.addColorStop(0.3, col.replace('A', a * 0.35)); l.addColorStop(1, col.replace('A', 0));
  c.fillStyle = l; c.fillRect(-r, -r, r * 2, r * 2); c.restore();
}
function poly(c, pts, fill) { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.fillStyle = fill; c.fill(); }
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
const rgb = a => `rgb(${a[0]},${a[1]},${a[2]})`;

// Pinhole camera over the sea.
function cam(ey, yaw) {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  return (x, y, z) => { const X = x * c - z * s, Z = x * s + z * c; return [W / 2 + f * X / Z, hz - f * (y - ey) / Z, Z]; };
}

/* Layout: seeded massing, flood points and warning lights; built on resize. */
function layout() {
  const portrait = H > W;
  hz = Math.round(H * (portrait ? 0.5 : 0.52)); f = portrait ? H * 0.45 : W * 0.7;
  P = cam(26, portrait ? 0.1 : 0.22);
  const [ex, ez] = along(END), end = P(ex, DT, ez);
  const cx = end[0] + W * (portrait ? 0.05 : 0.08), cw = W * (portrait ? 0.95 : 0.58);
  let seed = 23; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const k0 = portrait ? 1.15 : 1;
  const shapes = [], floods = [], warns = [];
  const layers = [0.55, 0.8, 1];
  layers.forEach((k, li) => {
    for (let i = 0; i < 6; i++) {
      const x = cx - cw / 2 + rnd() * cw, w = (16 + rnd() * 46) * k, h = (34 + rnd() * 120) * k * k0, kind = rnd();
      shapes.push({ li, x, w, h, kind });
      if (kind < 0.25) { warns.push([x + w * 0.12, hz - h * 1.6, rnd()]); if (li) floods.push({ x: x + w * 0.12, y: hz - h * 1.1 }); }
      else if (kind < 0.45) { /* a tank: no light */ }
      else if (kind < 0.6) { floods.push({ x: x + w * 1.2, y: hz - h * 0.97 }); warns.push([x + w * 0.06, hz - h - 2, rnd()]); }
      else { if (li) floods.push({ x: x + w / 2, y: hz - h * 0.7 }); if (h > 90) warns.push([x + w / 2, hz - h * 0.7 - 2, rnd()]); }
    }
  });
  // The wave starts at the causeway end and spreads outward.
  floods.forEach(fl => { fl.d = Math.abs(fl.x - end[0]) / cw; fl.on = 0.32; fl.target = 0.32; fl.delay = 0; fl.hold = 0; });
  floods.sort((a, b) => a.d - b.d);
  // The searchlight sits on the tallest mast.
  const mast = warns.slice().sort((a, b) => a[1] - b[1])[0];
  return { cx, cw, end, shapes, floods: floods.slice(0, 9), warns: warns.sort((a, b) => a[1] - b[1]).slice(0, 5), search: [mast[0], mast[1] + 8] };
}

/* Static layers: sky, massing and sea behind; the causeway in front. */
function paintStatic() {
  const night = shift;
  const skyTop = mix([22, 20, 30], [5, 6, 10], night), skyMid = mix([58, 42, 46], [20, 22, 30], night), skyLow = mix([120, 72, 48], [58, 42, 32], night);
  bg.setTransform(dpr, 0, 0, dpr, 0, 0); bg.clearRect(0, 0, W, H);
  bg.fillStyle = lin(bg, 0, hz, [[0, rgb(skyTop)], [0.6, rgb(skyMid)], [1, rgb(skyLow)]]); bg.fillRect(0, 0, W, hz);
  // Massing: three flat layers, back to front, each in thicker fog.
  const cols = [mix([52, 42, 44], [36, 30, 34], night), mix([30, 25, 28], [22, 18, 22], night), [12, 10, 13]];
  L.shapes.forEach(s => {
    bg.fillStyle = rgb(cols[s.li]);
    const { x, w, h } = s;
    if (s.kind < 0.25) bg.fillRect(x, hz - h * 1.6, w * 0.22, h * 1.6);
    else if (s.kind < 0.45) { bg.beginPath(); bg.ellipse(x + w / 2, hz - h * 0.32, w / 2, h * 0.32, 0, Math.PI, 0); bg.lineTo(x + w, hz); bg.lineTo(x, hz); bg.fill(); }
    else if (s.kind < 0.6) { bg.fillRect(x, hz - h, w * 0.12, h); bg.fillRect(x - w * 0.3, hz - h, w * 1.6, h * 0.05); }
    else bg.fillRect(x, hz - h * 0.7, w, h * 0.7);
  });
  // Sea: black with a cold sheen at the horizon.
  const sea = mix([30, 34, 40], [16, 20, 26], night);
  bg.fillStyle = lin(bg, hz, H, [[0, rgb(sea)], [0.1, '#0a0d12'], [1, '#030407']]); bg.fillRect(0, hz, W, H - hz);

  fg.setTransform(dpr, 0, 0, dpr, 0, 0); fg.clearRect(0, 0, W, H);
  for (let k = SPANS; k >= 0; k--) {
    const u = k * STEP, [px, pz] = along(u), [qx, qz] = along(u + STEP), w = 3;
    if (k < SPANS) poly(fg, [P(qx - HW, DB, qz), P(px - HW, DB, pz), P(px - HW, DT, pz), P(qx - HW, DT, qz)], '#0b0b0e');
    if (k < SPANS) poly(fg, [P(px - HW, DT, pz), P(qx - HW, DT, qz), P(qx + HW, DT, qz), P(px + HW, DT, pz)], '#17161a');
    poly(fg, [P(px - w, -2, pz), P(px + w, -2, pz), P(px + w, DB, pz), P(px - w, DB, pz)], '#08080b');
  }
}

function fit() {
  dpr = Math.min(2, devicePixelRatio || 1); W = stage.clientWidth; H = stage.clientHeight;
  if (!W || !H) return;
  cv.width = back.width = front.width = W * dpr; cv.height = back.height = front.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const keep = L ? L.floods.map(fl => [fl.on, fl.target, fl.delay, fl.hold]) : null;
  L = layout();
  if (keep) L.floods.forEach((fl, i) => { if (keep[i]) [fl.on, fl.target, fl.delay, fl.hold] = keep[i]; });
  paintStatic(); wake();
}
new ResizeObserver(fit).observe(stage);

function sendConvoy() { convoys.push({ u: 120, v: 58 + Math.random() * 10, arrived: false }); wake(); }

// The wave: each flood comes on after a delay set by its distance from the end.
function wakeFloods() {
  L.floods.forEach((fl, i) => { fl.delay = 0.12 + i * 0.22 + fl.d * 0.6; fl.target = 1; fl.hold = 14 + i * 0.4; });
}

function render() {
  const fog = weather === 'fog', rain = weather === 'rain';
  g.drawImage(back, 0, 0, W, H);
  const lit = L.floods.reduce((s, fl) => s + fl.on, 0) / L.floods.length;
  g.save(); g.globalCompositeOperation = 'lighter';
  // Amber dome over the complex, brighter as floods come on.
  glow(g, L.cx, hz - H * 0.04, L.cw * 0.75, 'rgba(255,150,60,A)', (0.12 + 0.22 * lit) * (fog ? 1.3 : 1), 0.5);
  // Floodlights: cones down to the yard, a pool, a long wet reflection.
  for (const fl of L.floods) {
    const a = fl.on; if (a < 0.01) continue;
    const len = hz - fl.y + 6, spread = fog ? 0.45 : 0.33;
    g.fillStyle = lin(g, fl.y, fl.y + len, [[0, `rgba(255,190,110,${(fog ? 0.38 : 0.26) * a})`], [1, 'rgba(255,190,110,0)']]);
    g.beginPath(); g.moveTo(fl.x, fl.y); g.lineTo(fl.x - len * spread, fl.y + len); g.lineTo(fl.x + len * spread, fl.y + len); g.closePath(); g.fill();
    glow(g, fl.x, fl.y, 5 + 4 * a, 'rgba(255,232,195,A)', a);
    if (fog) glow(g, fl.x, fl.y, 40, 'rgba(255,180,100,A)', 0.18 * a);
    glow(g, fl.x, hz - 2, len * spread, 'rgba(255,160,70,A)', 0.2 * a, 0.18);
    // Reflection: a broken amber column that stretches with brightness.
    const rl = (H - hz) * (0.12 + 0.7 * a) * (rain ? 0.7 : 1);
    for (let y = 0; y < rl; y += 3) {
      const wob = reduced ? 0 : Math.sin(y * 0.06 + t * 2.2 + fl.x) * (0.6 + y * 0.012);
      const k = 1 - y / rl;
      g.fillStyle = `rgba(255,150,60,${0.42 * a * k * (fog ? 0.8 : 1)})`;
      g.fillRect(fl.x - 1.5 - y * 0.02 + wob, hz + 2 + y, 3 + y * 0.04, 3);
    }
  }
  g.restore();
  g.drawImage(front, 0, 0, W, H);
  g.save(); g.globalCompositeOperation = 'lighter';
  // Parapet lights along the causeway and their glints on the water.
  for (let k = 1; k < SPANS; k++) {
    const [x, z] = along(k * STEP), p = P(x - HW, DT + 1, z), r = Math.max(2, f / z * 1.5);
    glow(g, p[0], p[1], r, 'rgba(255,200,130,A)', 0.8);
    const w = P(x - HW, -2, z); glow(g, p[0], w[1] + (w[1] - p[1]) * 0.6, r * 2, 'rgba(255,170,90,A)', 0.12, 2.5);
  }
  // Convoys: a lit band of cab and trailer lights; a red tail.
  for (const cvy of convoys) {
    const head = cvy.u, tail = Math.max(70, head - 90);
    for (let u = tail; u < head; u += 3.2) {
      const [x, z] = along(u), a = P(x - HW + 2, DT + 1.4, z), b = P(x - HW + 2, DT + 3, z), [x2, z2] = along(u + 2), c = P(x2 - HW + 2, DT + 3, z2), d = P(x2 - HW + 2, DT + 1.4, z2);
      poly(g, [a, b, c, d], 'rgba(255,205,150,0.7)');
    }
    const [hx, hzz] = along(head + 2), hp = P(hx - HW + 2, DT + 2, hzz);
    glow(g, hp[0], hp[1], Math.min(28, Math.max(6, f / hzz * 9)), 'rgba(255,248,230,A)', 0.9);
    const [tx, tz] = along(tail), tp = P(tx - HW + 2, DT + 2, tz);
    glow(g, tp[0], tp[1], Math.max(4, f / tz * 4), 'rgba(255,40,30,A)', 0.9);
  }
  // Red warning lights: a slow blink, out of step with each other.
  for (const [x, y, ph] of L.warns) {
    const b = reduced ? 0.8 : Math.pow(Math.max(0, Math.sin(t * 1.6 + ph * 6.28)), 3);
    glow(g, x, y - 3, 7, 'rgba(255,40,30,A)', 0.25 + 0.75 * b);
  }
  // Searchlight: one beam from the tallest mast; fog makes it solid.
  const [sx, sy] = L.search, ang = beam, len = Math.hypot(W, H);
  const dx = Math.sin(ang), dy = -Math.cos(ang), nx = -dy, ny = dx, wd = len * 0.06;
  const ex = sx + dx * len, ey = sy + dy * len;
  g.fillStyle = lin(g, sy, ey, [[0, `rgba(225,232,255,${fog ? 0.34 : 0.18})`], [0.6, `rgba(225,232,255,${fog ? 0.1 : 0.04})`], [1, 'rgba(225,232,255,0)']], sx, ex);
  g.beginPath(); g.moveTo(sx, sy); g.lineTo(ex + nx * wd, ey + ny * wd); g.lineTo(ex - nx * wd, ey - ny * wd); g.closePath(); g.fill();
  glow(g, sx, sy, 10, 'rgba(240,244,255,A)', 1);
  if (fog) glow(g, sx, sy, 60, 'rgba(200,215,255,A)', 0.2);
  // Rain: faint, bright inside the beam and near floods.
  if (rain) {
    g.lineWidth = 1;
    for (const d of drops) {
      const x = d.x * W, y = d.y * H, rx = x - sx, ry = y - sy, along_ = rx * dx + ry * dy, side = Math.abs(rx * nx + ry * ny);
      const inBeam = along_ > 0 && side < along_ * 0.06 + 2;
      g.strokeStyle = inBeam ? 'rgba(230,236,255,0.5)' : 'rgba(190,190,205,0.1)';
      g.beginPath(); g.moveTo(x, y); g.lineTo(x - 2 * d.s, y + 15 * d.s); g.stroke();
    }
  }
  g.restore();
  // Fog: a veil that lies thickest on the sea and around the complex.
  if (fog) {
    g.fillStyle = lin(g, hz - H * 0.25, H, [[0, 'rgba(70,62,62,0)'], [0.35, 'rgba(80,70,68,0.28)'], [0.6, 'rgba(40,38,42,0.25)'], [1, 'rgba(10,10,14,0.1)']]);
    g.fillRect(0, hz - H * 0.25, W, H);
  }
  // Vignette.
  const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.8);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.5)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
}

function step(dt) {
  t += dt;
  for (const cvy of convoys) {
    // The convoy slows as it reaches the gate.
    const k = Math.max(0.25, Math.min(1, (END + 60 - cvy.u) / 160));
    cvy.u += cvy.v * k * dt;
    if (!cvy.arrived && cvy.u > END - 40) { cvy.arrived = true; wakeFloods(); }
  }
  for (let i = convoys.length - 1; i >= 0; i--) if (convoys[i].u - 90 > END) convoys.splice(i, 1);
  for (const fl of L.floods) {
    if (fl.delay > 0) { fl.delay -= dt; continue; }
    if (fl.target > 0.5) { fl.hold -= dt; if (fl.hold <= 0) fl.target = 0.32; }
    // On fast with a small overshoot flicker; off slowly.
    const up = fl.target > fl.on;
    fl.on += (fl.target - fl.on) * Math.min(1, dt * (up ? 3.2 : 0.5));
    if (up && fl.target - fl.on > 0.3 && Math.random() < 0.08) fl.on *= 0.6;
  }
  // Searchlight: follow the pointer while held, else sway plus the drag sweep.
  const sway = reduced ? 0 : Math.sin(t * 0.18) * 0.45;
  const want = beamTarget != null ? beamTarget : sweep + sway;
  beam += (want - beam) * Math.min(1, dt * (beamTarget != null ? 4 : 1.2));
  beam = Math.max(-1.35, Math.min(1.35, beam));
  if (!dragging) sweep *= Math.pow(0.85, dt);
  if (!reduced && weather === 'rain') for (const d of drops) { d.y += dt * 1.6 * d.s; d.x -= dt * 0.15 * d.s; if (d.y > 1) { d.y -= 1; d.x = Math.random() * 1.1; } }
}

/* Frame loop: lively at full rate, drifting at 30 fps, asleep after 60 s idle. */
let raf = 0, lastDraw = 0, lastT = 0, lastInput = performance.now();
const easing = () => L.floods.some(fl => fl.delay > 0 || Math.abs(fl.target - fl.on) > 0.004 || fl.target > 0.5);
const busy = () => convoys.length > 0 || held || dragging || easing() || Math.abs(sweep) > 0.01;
function frame(now) {
  raf = 0;
  const lively = busy(), idle = now - lastInput;
  if (!lively && (reduced || idle > 60000)) { render(); return; }
  if (!lively && now - lastDraw < 31) { raf = requestAnimationFrame(frame); return; }
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
  try { step(dt); render(); } finally { lastDraw = now; if (!document.hidden) raf = requestAnimationFrame(frame); }
}
function wake() { if (!raf && !document.hidden && W) { lastT = performance.now(); raf = requestAnimationFrame(frame); } }
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else wake(); });

/* Pointer: drag after 8 px, hold after 260 ms, else a tap. */
let press = null, holdTimer = 0;
function aim(e) {
  const r = stage.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, [sx, sy] = L.search;
  beamTarget = Math.atan2(x - sx, sy - y);
}
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId); lastInput = performance.now();
  press = { x: e.clientX, y: e.clientY, lx: e.clientX, e }; dragging = false;
  holdTimer = setTimeout(() => { held = true; aim(press.e); wake(); }, 260); wake();
});
stage.addEventListener('pointermove', e => {
  if (!press) return; lastInput = performance.now(); press.e = e;
  if (held) { aim(e); wake(); return; }
  if (!dragging && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { dragging = true; clearTimeout(holdTimer); }
  if (dragging) { const dx = e.clientX - press.lx; press.lx = e.clientX; sweep = Math.max(-1.3, Math.min(1.3, sweep + dx * 0.004)); wake(); }
});
function end(tap) {
  clearTimeout(holdTimer);
  if (press && tap && !dragging && !held) sendConvoy();
  if (held) sweep = beam - (reduced ? 0 : Math.sin(t * 0.18) * 0.45);
  press = null; dragging = false; held = false; beamTarget = null; lastInput = performance.now(); wake();
}
stage.addEventListener('pointerup', () => end(true));
stage.addEventListener('pointercancel', () => end(false));
stage.addEventListener('lostpointercapture', () => { if (press) end(false); });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); sendConvoy(); }
  if (e.code === 'ArrowLeft') sweep -= 0.15; if (e.code === 'ArrowRight') sweep += 0.15;
  lastInput = performance.now(); wake();
});

document.getElementById('wx').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  for (const o of e.currentTarget.children) o.setAttribute('aria-pressed', o === b);
  weather = b.dataset.v; lastInput = performance.now(); wake();
});
document.getElementById('shift').addEventListener('input', e => { shift = +e.target.value; if (L) paintStatic(); lastInput = performance.now(); wake(); });
document.getElementById('add').addEventListener('click', () => { lastInput = performance.now(); sendConvoy(); });

// First frame: a convoy already halfway out, floods at their idle glow.
convoys.push({ u: 300, v: 60, arrived: false });
beam = -0.35;
fit();
</script></body></html>
