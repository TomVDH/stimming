<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soffit prototype</title>
<style>
:root { --bg: #08080c; --fg: #ebe9f0; --muted: #96919f; --line: #26232e; --chip: #16141c; --on: #332d3e; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.3 system-ui, sans-serif; }
body { display: flex; flex-direction: column; }
#stage { position: relative; flex: 1; min-height: 0; touch-action: none; cursor: pointer; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); }
.choices { display: flex; gap: 2px; background: var(--chip); border-radius: 999px; padding: 2px; }
button { font: inherit; color: var(--fg); background: var(--chip); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.choices button[aria-pressed="true"] { background: var(--on); }
label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.how { margin-left: auto; color: var(--muted); font-size: 12px; }
@media (max-width: 600px) { .how { display: none; } }
</style></head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="bar">
  <div class="choices" id="mode" role="group" aria-label="Mode">
    <button data-v="quiet" aria-pressed="false">Quiet</button><button data-v="rush" aria-pressed="true">Rush</button><button data-v="rain" aria-pressed="false">Rain</button>
  </div>
  <label>Traffic <input type="range" id="traffic" min="0" max="1" step="0.01" value="0.5"></label>
  <button id="add">+ Truck</button>
  <span class="how">Tap: truck · Hold: jam · Drag: look</span>
</div>
<script>
// Soffit prototype: we lie under the span; traffic shows as light through its joints.
const stage = document.getElementById('stage'), cv = document.getElementById('c'), g = cv.getContext('2d');
const deckC = document.createElement('canvas'), dg = deckC.getContext('2d');
const grainC = document.createElement('canvas'), overC = document.createElement('canvas');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, dpr = 1, M = 0;

// Seeded random: the static layers are the same on every resize.
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let q = Math.imul(s ^ s >>> 15, 1 | s); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }

// Geometry: deck x runs -1..1, z runs away from us; one vanishing point above the frame.
let vx = 0, vy = 0, A = 0, K = 0;
const Z0 = 0.62, ZF = 40, N_RIB = 7, RIB_W = 0.07, KD = 1.2;
const ribs = Array.from({ length: N_RIB }, (_, i) => -1 + (i + 0.5) * 2 / N_RIB - RIB_W / 2);
const joints = []; for (let z = 1; z < 9; z += 0.42) joints.push(z);
function geo() {
  const portrait = H > W;
  vy = -H * (portrait ? 0.12 : 0.22);
  K = (H * 1.0 - vy) * 0.8;
  A = W * (portrait ? 0.62 : 0.4);
}
const sx = (x, z, ox) => ox + x * A / z;
const sy = z => vy + K / z;

function fit() {
  dpr = Math.min(2, devicePixelRatio || 1); W = stage.clientWidth; H = stage.clientHeight; M = Math.round(W * 0.14);
  cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  geo(); drawDeck(); wake();
}
new ResizeObserver(fit).observe(stage);

function lin(c, x0, y0, x1, y1, stops) { const l = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, s]) => l.addColorStop(o, s)); return l; }
function glow(c, x, y, r, col, a, sy2 = 1, rot = 0) {
  if (r <= 0 || a <= 0.002) return;
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(1, sy2);
  const l = c.createRadialGradient(0, 0, 0, 0, 0, r);
  l.addColorStop(0, col.replace('A', a)); l.addColorStop(0.3, col.replace('A', a * 0.35)); l.addColorStop(1, col.replace('A', 0));
  c.fillStyle = l; c.fillRect(-r, -r, r * 2, r * 2); c.restore();
}
function quad(c, pts) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); }

// Static layer: sky strips, the deck, its ribs and joints, haze. Wider than the stage for look.
function drawDeck() {
  const c = dg, w = W + M * 2, ox = w / 2, R = rng(7);
  deckC.width = w * dpr; deckC.height = H * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Night sky: deep blue at the edges, a dull sodium bloom near the far end.
  c.fillStyle = lin(c, 0, 0, 0, H, [[0, '#2a2030'], [0.35, '#141a33'], [1, '#070914']]); c.fillRect(0, 0, w, H);
  glow(c, ox, -H * 0.05, H * 1.0, 'rgba(190,110,80,A)', 0.4, 0.55);
  // Low cloud, lit from below by the city.
  for (let i = 0; i < 26; i++) { const cx = R() * w, cy = R() * H * 0.8; glow(c, cx, cy, H * (0.08 + R() * 0.16), 'rgba(120,90,110,A)', 0.07 + R() * 0.06, 0.45); }
  for (let i = 0; i < 160; i++) { if (R() < 0.4) continue; c.fillStyle = `rgba(210,215,240,${0.15 + R() * 0.5})`; const s = R() < 0.1 ? 1.5 : 1; c.fillRect(R() * w, R() * H, s, s); }
  // Deck: a concrete plane, dark near us, hazed toward the far end.
  const yTop = 0, zTop = K / (yTop - vy);
  quad(c, [sx(-1, Z0, ox), sy(Z0), sx(1, Z0, ox), sy(Z0), sx(1, ZF, ox), sy(ZF), sx(-1, ZF, ox), sy(ZF)]);
  c.fillStyle = lin(c, 0, H, 0, 0, [[0, '#060608'], [0.5, '#0d0d12'], [1, '#262029']]); c.fill();
  // Ribs: an inner face (lit grey) and a bottom face (dark), both converge on the vanishing point.
  for (const x of ribs) {
    const xb = x * KD, xw = (x + RIB_W) * KD;
    const inner = x > 0 ? [x, xb] : [x + RIB_W, xw];
    quad(c, [sx(inner[0], Z0, ox), sy(Z0), sx(inner[1], Z0, ox), sy(Z0) * 1, sx(inner[1], ZF, ox), sy(ZF), sx(inner[0], ZF, ox), sy(ZF)]);
    c.fillStyle = lin(c, 0, H, 0, 0, [[0, '#09090c'], [0.5, '#111116'], [1, '#2a242d']]); c.fill();
    quad(c, [sx(xb, Z0, ox), sy(Z0), sx(xw, Z0, ox), sy(Z0), sx(xw, ZF, ox), sy(ZF), sx(xb, ZF, ox), sy(ZF)]);
    c.fillStyle = lin(c, 0, H, 0, 0, [[0, '#030304'], [0.5, '#08080b'], [1, '#1f1a22']]); c.fill();
    // A faint lip where the face meets the bottom.
    const e = x > 0 ? xb : xw; c.strokeStyle = 'rgba(120,110,130,0.12)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(sx(e, Z0, ox), sy(Z0)); c.lineTo(sx(e, ZF, ox), sy(ZF)); c.stroke();
  }
  // Joints: thin dark seams across the whole width.
  for (const z of joints) {
    const y = sy(z); if (y < -4) continue;
    c.fillStyle = 'rgba(0,0,0,0.75)'; c.fillRect(sx(-1, z, ox), y - Math.max(0.6, 3 / z) / 2, (sx(1, z, ox) - sx(-1, z, ox)), Math.max(0.6, 3 / z));
  }
  // Deck edges catch a little sky.
  c.strokeStyle = 'rgba(150,130,150,0.18)'; c.lineWidth = 1.2;
  for (const s of [-1, 1]) { c.beginPath(); c.moveTo(sx(s, Z0, ox), sy(Z0)); c.lineTo(sx(s, ZF, ox), sy(ZF)); c.stroke(); }
  // Haze thickens toward the far end.
  c.fillStyle = lin(c, 0, H * 0.75, 0, 0, [[0, 'rgba(70,52,62,0)'], [1, 'rgba(70,52,62,0.35)']]); c.fillRect(0, 0, w, H * 0.75);
  // Grain tile, used as a pattern over every frame.
  grainC.width = grainC.height = 160; const gc = grainC.getContext('2d'), id = gc.createImageData(160, 160), Rg = rng(3);
  for (let i = 0; i < id.data.length; i += 4) { const v = Rg() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 14; }
  gc.putImageData(id, 0, 0);
  // Vignette and grain, baked once into one overlay.
  overC.width = W * dpr; overC.height = H * dpr; const og = overC.getContext('2d'); og.setTransform(dpr, 0, 0, dpr, 0, 0);
  const v = og.createRadialGradient(W / 2, H * 0.4, Math.min(W, H) * 0.3, W / 2, H * 0.4, Math.max(W, H) * 0.85);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)'); og.fillStyle = v; og.fillRect(0, 0, W, H);
  og.fillStyle = og.createPattern(grainC, 'repeat'); og.fillRect(0, 0, W, H);
}

// State.
let mode = 'rush', traffic = 0.5, look = 0, lookV = 0, held = false, jam = 0, t = 0, spawnT = 0, dir = 1;
const cars = [], flare = new Float32Array(joints.length), drips = [];
const COLD = [170, 205, 255], WARM = [255, 150, 70], TRUCK = [255, 205, 150];
const lanes = [[-0.62, 1], [-0.22, 1], [0.22, -1], [0.62, -1]];

function addCar(z) {
  const [x, d] = lanes[(Math.random() * 4) | 0];
  cars.push({ x: x + (Math.random() - 0.5) * 0.06, z: z ?? (d > 0 ? Z0 - 0.3 : 10), d, v: 0.9 + Math.random() * 0.6, col: d > 0 ? COLD : WARM, w: 0.2, a: 0.75 + Math.random() * 0.3, user: false });
}
function sendTruck() {
  const d = dir; dir = -dir;
  cars.push({ x: d > 0 ? -0.42 : 0.42, z: d > 0 ? Z0 + 0.1 : 8, d, v: 0.55, col: TRUCK, w: 0.45, a: 1.5, truck: true, user: true });
  wake();
}

// Light a car leaks at depth z: a bright core under it, headlights ahead, a short tail.
function leak(c, z) {
  const ahead = (z - c.z) * c.d;
  const len = c.truck ? 0.9 : 0.3;
  if (ahead > 0) return c.a * (Math.exp(-ahead / (c.truck ? 0.6 : 0.22)) * 0.9);
  return c.a * Math.exp(-Math.pow(ahead / len, 2) * 2);
}

function render() {
  const ox = W / 2 + look, wet = mode === 'rain';
  // The view is flipped: the near deck sits at the top, as a ceiling does.
  g.setTransform(dpr, 0, 0, -dpr, 0, H * dpr);
  g.drawImage(deckC, 0, 0, deckC.width, deckC.height, -M + look, 0, W + M * 2, H);
  g.save(); g.globalCompositeOperation = 'lighter';
  // Joints: per car, a bar of light where it crosses, then rib faces lit on either side.
  for (let j = 0; j < joints.length; j++) {
    const z = joints[j], y = sy(z); if (y < -20) continue;
    const th = Math.max(0.8, 3.2 / z), fl = flare[j];
    if (fl > 0.01) {
      // A flare: the whole seam blooms.
      g.fillStyle = `rgba(255,215,170,${Math.min(1, fl)})`; g.fillRect(sx(-1, z, ox), y - th / 2, sx(1, z, ox) - sx(-1, z, ox), th);
      glow(g, ox, y, A / z * 1.1, 'rgba(255,170,110,A)', 0.25 * fl, 0.08);
    }
    for (const c of cars) {
      const I = leak(c, z); if (I < 0.02) continue;
      const [r, gg, b] = c.col, x0 = c.x - c.w, x1 = c.x + c.w;
      const X0 = sx(x0, z, ox), X1 = sx(x1, z, ox), Xc = sx(c.x, z, ox);
      g.fillStyle = lin(g, X0, 0, X1, 0, [[0, `rgba(${r},${gg},${b},0)`], [0.5, `rgba(${r},${gg},${b},${Math.min(1, I)})`], [1, `rgba(${r},${gg},${b},0)`]]);
      g.fillRect(X0, y - th / 2 - 0.5, X1 - X0, th + 1);
      // Soft spill on the soffit, stretched along the seam.
      glow(g, Xc, y, (X1 - X0) * (wet ? 1.0 : 0.8), `rgba(${r},${gg},${b},A)`, 0.3 * I, 0.22 * (wet ? 1.6 : 1));
      // Rib faces near the car rake the light away from the seam.
      for (const rx of ribs) {
        const xm = rx + RIB_W / 2, dx = Math.abs(xm - c.x), near = (z - c.z) * c.d; if (dx > c.w * 2.2 || near < -0.3 || near > (c.truck ? 1.2 : 0.5)) continue;
        const k = Math.min(1, I * (1 - dx / (c.w * 2.2)) * 0.9);
        const xf = rx > 0 ? [rx, rx * KD] : [rx + RIB_W, (rx + RIB_W) * KD], za = c.d > 0 ? z - 0.08 : z - 0.38, zb = c.d > 0 ? z + 0.38 : z + 0.08;
        quad(g, [sx(xf[0], za, ox), sy(za), sx(xf[1], za, ox), sy(za), sx(xf[1], zb, ox), sy(zb), sx(xf[0], zb, ox), sy(zb)]);
        g.fillStyle = lin(g, 0, sy(za), 0, sy(zb), c.d > 0 ? [[0, `rgba(${r},${gg},${b},0)`], [0.18, `rgba(${r},${gg},${b},${k})`], [1, `rgba(${r},${gg},${b},0)`]] : [[0, `rgba(${r},${gg},${b},0)`], [0.82, `rgba(${r},${gg},${b},${k})`], [1, `rgba(${r},${gg},${b},0)`]]); g.fill();
      }
    }
  }
  // A truck: one broad sweep that rolls along the soffit with it.
  for (const c of cars) if (c.truck && c.z > Z0 * 0.8) {
    const y = sy(c.z), r = A / c.z * 0.9;
    glow(g, sx(c.x, c.z, ox), y, r, 'rgba(255,190,130,A)', 0.22, 0.35);
    glow(g, sx(c.x, c.z, ox), y, r * 2.2, 'rgba(255,150,90,A)', 0.08, 0.3);
  }
  // Deck edges: outer-lane cars light the rim against the sky.
  for (const c of cars) {
    if (Math.abs(c.x) < 0.45) continue;
    const s = Math.sign(c.x), [r, gg, b] = c.col, y = sy(Math.max(Z0, c.z));
    glow(g, sx(s, Math.max(Z0, c.z), ox), y, A / Math.max(Z0, c.z) * 0.22, `rgba(${r},${gg},${b},A)`, 0.12 * c.a);
  }
  // Rain: drips fall from the seams toward us and catch the light.
  if (wet) {
    const pcx = W / 2, pcy = H * 0.55; g.lineCap = 'round';
    for (const d of drips) {
      let I = 0, col = COLD;
      for (const c of cars) { const v = leak(c, d.z) * Math.max(0, 1 - Math.abs(d.x - c.x) / (c.w * 1.6)); if (v > I) { I = v; col = c.col; } }
      I += flare[d.j] * 0.6;
      const s = 1 / (1 - 0.9 * d.p), px = sx(d.x, d.z, ox), py = sy(d.z);
      const X = pcx + (px - pcx) * s, Y = pcy + (py - pcy) * s, s2 = 1 / (1 - 0.9 * Math.max(0, d.p - 0.05));
      const X2 = pcx + (px - pcx) * s2, Y2 = pcy + (py - pcy) * s2;
      g.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${Math.min(0.95, 0.16 + I * 1.2)})`; g.lineWidth = 0.8 + d.p * 2.6;
      g.beginPath(); g.moveTo(X2, Y2); g.lineTo(X, Y); g.stroke();
    }
  }
  g.restore();
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Vignette and grain.
  g.drawImage(overC, 0, 0, W, H);
}

function step(dt) {
  t += dt;
  jam += ((held ? 1 : 0) - jam) * Math.min(1, dt * 1.5);
  for (const c of cars) {
    const prev = c.z;
    c.z += c.d * c.v * dt * (1 - 0.92 * jam) * (c.truck ? 1 : 1);
    if (c.truck) for (let j = 0; j < joints.length; j++) if ((prev - joints[j]) * (c.z - joints[j]) <= 0) flare[j] = Math.min(1.4, flare[j] + 1);
  }
  for (let i = cars.length - 1; i >= 0; i--) { const c = cars[i]; if ((c.d > 0 && c.z > 11) || (c.d < 0 && c.z < Z0 - 0.8)) cars.splice(i, 1); }
  for (let j = 0; j < flare.length; j++) flare[j] *= Math.pow(0.12, dt);
  if (!reduced && !held) {
    const rate = traffic * (mode === 'quiet' ? 0.35 : mode === 'rush' ? 2.2 : 1.1);
    spawnT -= dt * rate; if (spawnT <= 0) { addCar(); spawnT = 0.5 + Math.random(); }
  }
  // Drips: born on a seam, fall toward us, reborn.
  if (mode === 'rain' && !reduced) {
    while (drips.length < 140) { const j = (Math.random() * joints.length * 0.6) | 0; drips.push({ x: Math.random() * 2 - 1, z: joints[j], j, p: Math.random(), s: 0.5 + Math.random() * 0.5 }); }
    for (const d of drips) { d.p += dt * d.s * 0.9; if (d.p > 1) { d.p = 0; d.j = (Math.random() * joints.length * 0.6) | 0; d.z = joints[d.j]; d.x = Math.random() * 2 - 1; } }
  }
  look += lookV * dt; if (!dragging) look *= Math.pow(0.3, dt);
}

/* Frame loop: lively at full rate, drifting at 30 fps, asleep after 60 s idle. */
let raf = 0, lastDraw = 0, lastT = 0, lastInput = performance.now(), dragging = false;
const busy = () => cars.some(c => c.user) || held || jam > 0.02 || dragging || Math.abs(look) > 0.5 || flare.some(f => f > 0.02);
function frame(now) {
  raf = 0;
  const lively = busy(), idle = now - lastInput;
  if (!lively && (reduced || idle > 60000)) { render(); return; }
  if (!lively && now - lastDraw < 31) { raf = requestAnimationFrame(frame); return; }
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
  try { step(dt); render(); } finally { lastDraw = now; if (!document.hidden) raf = requestAnimationFrame(frame); }
}
function wake() { if (!raf && !document.hidden && W) { lastT = performance.now(); raf = requestAnimationFrame(frame); } }
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else wake(); });

/* Pointer: drag after 8 px, hold after 260 ms, else a tap. */
let press = null, holdTimer = 0;
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId); lastInput = performance.now();
  press = { x: e.clientX, y: e.clientY, lx: e.clientX }; dragging = false;
  holdTimer = setTimeout(() => { held = true; wake(); }, 260); wake();
});
stage.addEventListener('pointermove', e => {
  if (!press) return; lastInput = performance.now();
  if (!dragging && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { dragging = true; clearTimeout(holdTimer); held = false; }
  if (dragging) { const dx = e.clientX - press.lx; press.lx = e.clientX; look = Math.max(-M, Math.min(M, look + dx * 0.5)); wake(); }
});
function end(tap) {
  clearTimeout(holdTimer);
  if (press && tap && !dragging && !held) sendTruck();
  press = null; dragging = false; held = false; lastInput = performance.now(); wake();
}
stage.addEventListener('pointerup', () => end(true));
stage.addEventListener('pointercancel', () => end(false));
stage.addEventListener('lostpointercapture', () => { if (press) end(false); });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); lastInput = performance.now(); sendTruck(); } });

document.getElementById('mode').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  for (const o of e.currentTarget.children) o.setAttribute('aria-pressed', o === b);
  mode = b.dataset.v; if (mode !== 'rain') drips.length = 0; lastInput = performance.now(); wake();
});
document.getElementById('traffic').addEventListener('input', e => { traffic = +e.target.value; lastInput = performance.now(); wake(); });
document.getElementById('add').addEventListener('click', () => { lastInput = performance.now(); sendTruck(); });

// First frame: cars already spread over the span, both ways.
for (const [x, d, z] of [[-0.62, 1, 1.25], [-0.22, 1, 2.6], [0.22, -1, 1.7], [0.62, -1, 3.4], [-0.22, 1, 5.2], [0.62, -1, 1.05]]) {
  cars.push({ x, z, d, v: 0.9 + Math.random() * 0.5, col: d > 0 ? COLD : WARM, w: 0.2, a: 0.95, user: false });
}
fit();
</script></body></html>
