<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog spine prototype</title>
<style>
:root { --bg: #07080b; --fg: #e8eaee; --muted: #959aa6; --line: #1f232b; --chip: #14171d; --on: #2d333f; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.3 system-ui, sans-serif; }
body { display: flex; flex-direction: column; }
#stage { position: relative; flex: 1; min-height: 0; touch-action: none; cursor: pointer; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); }
.choices { display: flex; gap: 2px; background: var(--chip); border-radius: 999px; padding: 2px; }
button { font: inherit; color: var(--fg); background: var(--chip); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.choices button[aria-pressed="true"] { background: var(--on); }
label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.how { margin-left: auto; color: var(--muted); font-size: 12px; }
@media (max-width: 600px) { .how { display: none; } }
</style></head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="bar">
  <div class="choices" id="fog" role="group" aria-label="Fog">
    <button data-v="thin" aria-pressed="false">Thin</button><button data-v="fog" aria-pressed="true">Fog</button><button data-v="pea" aria-pressed="false">Pea-soup</button>
  </div>
  <label>Lamps <input type="range" id="lamps" min="0" max="1" step="0.01" value="0.7"></label>
  <button id="add">+ Train</button>
  <span class="how">Tap: train · Hold: thicken · Drag: pan · Space: train</span>
</div>
<script>
// Fog spine: a tall viaduct walks into fog; one lamp per pier; trains come out of it.
const stage = document.getElementById('stage'), cv = document.getElementById('c'), g = cv.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const mk = () => { const c = document.createElement('canvas'); return [c, c.getContext('2d')]; };
const [bgC, bg] = mk(), [wispC, wg] = mk(), [fxC, fx] = mk();
let W = 0, H = 0, dpr = 1, hz = 0, f = 0, xo = -7;
const DECK = 10, SOFF = 8.9, GROUND = -40, GAP = 14, NP = 54, Z0 = 10;

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function size(c, x, w, h) { c.width = Math.max(1, Math.round(w * dpr)); c.height = Math.max(1, Math.round(h * dpr)); x.setTransform(dpr, 0, 0, dpr, 0, 0); }
function lin(c, y0, y1, stops, x0 = 0, x1 = 0) { const l = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, s]) => l.addColorStop(o, s)); return l; }
function glow(c, x, y, r, col, a, sy = 1) {
  if (r <= 0 || a <= 0.001) return;
  c.save(); c.translate(x, y); c.scale(1, sy);
  const l = c.createRadialGradient(0, 0, 0, 0, 0, r);
  l.addColorStop(0, col.replace('A', a)); l.addColorStop(0.3, col.replace('A', a * 0.35)); l.addColorStop(1, col.replace('A', 0));
  c.fillStyle = l; c.fillRect(-r, -r, r * 2, r * 2); c.restore();
}

function fit() {
  dpr = Math.min(2, devicePixelRatio || 1); W = stage.clientWidth; H = stage.clientHeight;
  if (!W || !H) return;
  const portrait = H > W;
  hz = Math.round(H * (portrait ? 0.5 : 0.48)); f = portrait ? W * 1.5 : W * 0.75; xo = portrait ? -6.5 : -15;
  cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  size(bgC, bg, W, H); size(wispC, wg, W * 2, H); size(fxC, fx, W, H);
  bake(); wake();
}
new ResizeObserver(fit).observe(stage);

let fogKind = 'fog', lamps = 0.7, held = false, thick = 0, pan = 0, panV = 0, t = 0, drift = 0;
const trains = [], lit = new Float32Array(NP);
const FL = { thin: 240, fog: 120, pea: 58 };
const fl = () => FL[fogKind] * (1 - 0.6 * thick);
const att = z => Math.exp(-Math.max(0, z - 14) / fl());
const sx = (x, z) => W / 2 + f * (x - pan) / z, sy = (Y, z) => hz - f * Y / z;

// Static layers: night air, fog wisps, grain and vignette.
function bake() {
  bg.fillStyle = lin(bg, 0, H, [[0, '#040509'], [0.42, '#141922'], [0.5, '#1d2330'], [0.62, '#121620'], [1, '#06070a']]); bg.fillRect(0, 0, W, H);
  const r = rng(5); wg.clearRect(0, 0, W * 2, H);
  for (let i = 0; i < 70; i++) {
    const x = r() * W * 2, y = hz + (r() - 0.5) * H * 0.7, rw = (0.1 + r() * 0.3) * W;
    for (const o of [-W * 2, 0, W * 2]) glow(wg, x + o, y, rw, 'rgba(150,165,185,A)', 0.05 + r() * 0.05, 0.18 + r() * 0.15);
  }
  const [nc, n] = mk(); nc.width = nc.height = 192; const id = n.createImageData(192, 192);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 13; }
  n.putImageData(id, 0, 0);
  fx.clearRect(0, 0, W, H); fx.fillStyle = fx.createPattern(nc, 'repeat'); fx.fillRect(0, 0, W, H);
  const v = fx.createRadialGradient(W / 2, hz, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.8);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)'); fx.fillStyle = v; fx.fillRect(0, 0, W, H);
}

function sendTrain() { trains.push({ z: 700, v: 15 + Math.random() * 3, cars: 6 }); wake(); }

// One pier: tapered, dark, faded by fog, with its lamp and any train spill.
function pier(i, z) {
  const a = att(z), tw = 0.32, bw = 0.62, x = xo;
  const p = [[sx(x - tw, z), sy(SOFF, z)], [sx(x + tw, z), sy(SOFF, z)], [sx(x + bw, z), sy(GROUND, z)], [sx(x - bw, z), sy(GROUND, z)]];
  g.globalAlpha = Math.min(1, a * 1.1);
  g.fillStyle = '#05060a'; g.beginPath(); p.forEach((q, k) => g[k ? 'lineTo' : 'moveTo'](q[0], q[1])); g.fill();
  g.globalAlpha = 1;
  g.save(); g.globalCompositeOperation = 'lighter';
  const L = lit[i];
  if (L > 0.01) {
    g.fillStyle = lin(g, p[0][1], p[3][1], [[0, `rgba(215,228,255,${0.55 * L * a})`], [0.4, `rgba(215,228,255,${0.12 * L * a})`], [1, 'rgba(215,228,255,0)']]);
    g.beginPath(); p.forEach((q, k) => g[k ? 'lineTo' : 'moveTo'](q[0], q[1])); g.fill();
  }
  // Lamp on the pier's near face, just under the deck.
  const lx = sx(x + tw + 0.15, z), ly = sy(SOFF - 0.6, z), core = Math.max(1.4, f * 0.3 / z), la = lamps * Math.pow(a, 0.6);
  if (la > 0.01) {
    const scat = 12 + 120 / fl() * 8;
    glow(g, lx, ly, core * scat, 'rgba(255,160,80,A)', 0.4 * la);
    glow(g, lx, ly, core * 4, 'rgba(255,190,120,A)', 0.5 * la);
    glow(g, lx, ly, core * 1.6, 'rgba(255,225,180,A)', la);
    g.fillStyle = lin(g, ly, p[3][1], [[0, `rgba(255,160,80,${0.18 * la})`], [0.25, 'rgba(255,160,80,0)']]);
    g.beginPath(); p.forEach((q, k) => g[k ? 'lineTo' : 'moveTo'](q[0], q[1])); g.fill();
  }
  g.restore();
}
// Deck from z to z2, faded by fog.
function deck(z, z2) {
  if (z2 < 1) return;
  z = Math.max(z, 1);
  const a = att((z + z2) / 2), x0 = xo - 1.6, x1 = xo + 1.6;
  g.globalAlpha = Math.min(1, a * 1.1); g.fillStyle = '#04050a';
  g.beginPath();
  g.moveTo(sx(x1, z), sy(DECK, z)); g.lineTo(sx(x1, z2), sy(DECK, z2)); g.lineTo(sx(x1, z2), sy(SOFF, z2)); g.lineTo(sx(x1, z), sy(SOFF, z)); g.fill();
  g.beginPath();
  g.moveTo(sx(x0, z), sy(DECK, z)); g.lineTo(sx(x0, z2), sy(DECK, z2)); g.lineTo(sx(x1, z2), sy(DECK, z2)); g.lineTo(sx(x1, z), sy(DECK, z)); g.fill();
  g.globalAlpha = 1;
}
// Train: warm windows on the near side, headlight with a cone of lit fog.
function trainItems(tr, items) {
  const len = tr.cars * 9;
  for (let k = 0; k < tr.cars; k++) for (let w = 0; w < 5; w++) {
    const z = tr.z + 1 + k * 9 + w * 1.6; if (z < 1.5) continue;
    items.push([z, () => {
      const a = att(z), x = xo + 1.45;
      g.save(); g.globalCompositeOperation = 'lighter';
      g.fillStyle = `rgba(255,186,110,${0.7 * a})`;
      g.beginPath(); g.moveTo(sx(x, z), sy(DECK + 1.3, z)); g.lineTo(sx(x, z + 0.9), sy(DECK + 1.3, z + 0.9)); g.lineTo(sx(x, z + 0.9), sy(DECK + 1.8, z + 0.9)); g.lineTo(sx(x, z), sy(DECK + 1.8, z)); g.fill();
      g.restore();
    }]);
  }
  items.push([tr.z + len + 1, () => { if (tr.z + len < 1.5) return; const za = Math.max(1.5, tr.z), zb = tr.z + len, a = att(za);
    g.globalAlpha = Math.min(1, a); g.fillStyle = '#05060a';
    g.beginPath(); g.moveTo(sx(xo + 1.4, za), sy(DECK, za)); g.lineTo(sx(xo + 1.4, zb), sy(DECK, zb)); g.lineTo(sx(xo + 1.4, zb), sy(DECK + 2.6, zb)); g.lineTo(sx(xo + 1.4, za), sy(DECK + 2.6, za)); g.fill(); g.globalAlpha = 1; }]);
  items.push([tr.z - 0.01, () => { if (tr.z < 1.2) return; const dens = Math.min(1.6, 70 / fl()), a = att(tr.z), x = sx(xo, tr.z), y = sy(DECK + 1.3, tr.z), s = f / tr.z;
    g.save(); g.globalCompositeOperation = 'lighter';
    glow(g, x, y, Math.min(W, s * 9), 'rgba(190,205,255,A)', 0.35 * a * Math.min(1, dens + 0.3));
    glow(g, x, y, Math.max(3, s * 0.9), 'rgba(250,252,255,A)', Math.min(1, a * 1.4));
    g.restore(); }]);
}

// Headlight beam: a cone of lit fog toward the viewer, drawn as a soft wedge.
function beam(tr) {
  const LB = 120, dens = Math.min(1.6, 70 / fl()), N = 30, pts = [];
  for (let k = 0; k <= N; k++) {
    const d = Math.pow(k / N, 1.3) * LB, z = tr.z - d; if (z < 1.5) break;
    const Y = DECK + 1.3 - d * 0.03, r = f * (0.35 + d * 0.06) / z;
    pts.push([sx(xo, z), sy(Y, z), r, att(z) * (1 - d / LB), d]);
  }
  if (pts.length < 3 || tr.z < 1.5) return;
  const [ax, ay] = pts[0], nrm = [];
  for (let k = 0; k < pts.length; k++) {
    const a = pts[Math.max(0, k - 1)], b = pts[Math.min(pts.length - 1, k + 1)];
    let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const nl = Math.hypot(nx, ny) || 1; nrm.push([nx / nl, ny / nl]);
  }
  const last = pts[pts.length - 1], reach = Math.hypot(last[0] - ax, last[1] - ay) + last[2];
  g.save(); g.globalCompositeOperation = 'lighter';
  const rg = g.createRadialGradient(ax, ay, 0, ax, ay, reach);
  const a0 = 0.13 * dens * att(tr.z);
  rg.addColorStop(0, `rgba(205,218,255,${a0})`); rg.addColorStop(0.35, `rgba(205,218,255,${a0 * 0.45})`); rg.addColorStop(1, 'rgba(205,218,255,0)');
  g.fillStyle = rg;
  // Three nested wedges give the cone a soft edge.
  for (const w of [1, 0.65, 0.35]) {
    g.beginPath();
    pts.forEach((p, k) => g[k ? 'lineTo' : 'moveTo'](p[0] + nrm[k][0] * p[2] * w, p[1] + nrm[k][1] * p[2] * w));
    for (let k = pts.length - 1; k >= 0; k--) g.lineTo(pts[k][0] - nrm[k][0] * pts[k][2] * w, pts[k][1] - nrm[k][1] * pts[k][2] * w);
    g.fill();
  }
  // A brighter core inside the cone.
  for (let k = 2; k < pts.length; k += 5) { const p = pts[k]; glow(g, p[0], p[1], Math.min(Math.max(W, H) * 0.5, p[2] * 0.8), 'rgba(215,225,255,A)', 0.08 * dens * p[3]); }
  g.restore();
}

function render() {
  g.drawImage(bgC, 0, 0, W, H);
  const fk = 120 / fl(), vx = sx(xo, 1e5);
  g.save(); g.globalCompositeOperation = 'lighter';
  // The fog bank: a glow where many lamps fade together.
  glow(g, vx, hz, Math.max(W, H) * 0.55, 'rgba(255,170,110,A)', 0.12 * lamps * Math.min(1.5, fk), 0.55);
  glow(g, vx, hz, Math.max(W, H) * 0.8, 'rgba(120,140,170,A)', 0.1 + 0.08 * Math.min(2, fk), 0.45);
  const wx = -((drift % 1) * W * 2);
  g.globalAlpha = Math.min(1, 0.5 + fk * 0.4);
  g.drawImage(wispC, wx - pan * 4, 0, W * 2, H); g.drawImage(wispC, wx - pan * 4 + W * 2, 0, W * 2, H);
  g.globalAlpha = 1; g.restore();
  // Far to near: piers, deck spans, train parts and beam slices.
  const items = [];
  for (let i = 0; i < NP; i++) {
    const z = Z0 + i * GAP;
    items.push([z, () => pier(i, z)]);
    items.push([z + GAP / 2, () => deck(z, z + GAP)]);
  }
  for (const tr of trains) trainItems(tr, items);
  items.sort((a, b) => b[0] - a[0]);
  for (const [, fn] of items) fn();
  for (const tr of trains) beam(tr);
  // Close haze: thick fog veils even the near piers a little.
  g.fillStyle = `rgba(70,80,96,${0.05 + 0.09 * Math.min(2, fk) * 0.5})`; g.fillRect(0, 0, W, H);
  // Glare: a train close by floods the fog.
  for (const tr of trains) if (tr.z < 60 && tr.z > -10) glow(g, sx(xo, Math.max(tr.z, 2)), sy(DECK, Math.max(tr.z, 2)), Math.max(W, H), 'rgba(200,210,240,A)', 0.18 * (1 - Math.abs(tr.z - 8) / 60));
  g.drawImage(fxC, 0, 0, W, H);
}

function step(dt) {
  t += dt;
  thick += ((held ? 1 : 0) - thick) * Math.min(1, dt * (held ? 0.8 : 0.5));
  if (!reduced) drift += dt * 0.006;
  pan += panV * dt; panV *= Math.pow(0.02, dt);
  pan = Math.max(-4, Math.min(4, pan));
  for (let i = 0; i < NP; i++) lit[i] *= Math.pow(0.25, dt);
  for (const tr of trains) {
    tr.z -= tr.v * dt;
    for (let i = 0; i < NP; i++) { const z = Z0 + i * GAP, k = Math.exp(-Math.pow((z - tr.z - 4) / 9, 2)); if (k > lit[i]) lit[i] = k; }
  }
  for (let i = trains.length - 1; i >= 0; i--) if (trains[i].z < -70) trains.splice(i, 1);
}

/* Frame loop: lively at full rate, drifting at 30 fps, asleep after 60 s idle. */
let raf = 0, lastDraw = 0, lastT = 0, lastInput = performance.now(), dragging = false;
const busy = () => trains.length > 0 || held || dragging || thick > 0.01 || Math.abs(panV) > 0.01 || lit.some(v => v > 0.01);
function frame(now) {
  raf = 0;
  const lively = busy(), idle = now - lastInput;
  if (!lively && (reduced || idle > 60000)) { render(); return; }
  if (!lively && now - lastDraw < 31) { raf = requestAnimationFrame(frame); return; }
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
  try { step(dt); render(); } finally { lastDraw = now; if (!document.hidden) raf = requestAnimationFrame(frame); }
}
function wake() { if (!raf && !document.hidden && W) { lastT = performance.now(); raf = requestAnimationFrame(frame); } }
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else wake(); });

/* Pointer: drag after 8 px, hold after 260 ms, else a tap. */
let press = null, holdTimer = 0;
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId); lastInput = performance.now();
  press = { x: e.clientX, y: e.clientY, lx: e.clientX }; dragging = false;
  holdTimer = setTimeout(() => { held = true; wake(); }, 260); wake();
});
stage.addEventListener('pointermove', e => {
  if (!press) return; lastInput = performance.now();
  if (!dragging && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { dragging = true; clearTimeout(holdTimer); held = false; }
  if (dragging) { const dx = e.clientX - press.lx; press.lx = e.clientX; pan = Math.max(-4, Math.min(4, pan - dx * 0.01)); panV = 0; wake(); }
});
function end(tap) {
  clearTimeout(holdTimer);
  if (press && tap && !dragging && !held) sendTrain();
  press = null; dragging = false; held = false; lastInput = performance.now(); wake();
}
stage.addEventListener('pointerup', () => end(true));
stage.addEventListener('pointercancel', () => end(false));
stage.addEventListener('lostpointercapture', () => { if (press) end(false); });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); sendTrain(); }
  if (e.code === 'ArrowLeft') panV = -3; if (e.code === 'ArrowRight') panV = 3;
  lastInput = performance.now(); wake();
});

document.getElementById('fog').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  for (const o of e.currentTarget.children) o.setAttribute('aria-pressed', o === b);
  fogKind = b.dataset.v; lastInput = performance.now(); wake();
});
document.getElementById('lamps').addEventListener('input', e => { lamps = +e.target.value; lastInput = performance.now(); wake(); });
document.getElementById('add').addEventListener('click', () => { lastInput = performance.now(); sendTrain(); });

// First frame: a train already out of the fog, beam on.
trains.push({ z: 150, v: 15, cars: 6 });
for (let i = 0; i < NP; i++) { const z = Z0 + i * GAP; lit[i] = Math.exp(-Math.pow((z - 154) / 9, 2)); }
fit();
</script></body></html>
