<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glacier bore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..700&display=swap">
<style>
:root {
  --bg: oklch(0.1 0.01 260);
  --ink: oklch(0.93 0.01 260);
  --dim: oklch(0.72 0.015 260);
  --chip: oklch(0.2 0.015 260 / 0.62);
  --line: oklch(0.6 0.02 260 / 0.35);
  --on: oklch(0.95 0.01 260);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font: 14px/1.3 Gabarito, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; touch-action: none; cursor: pointer; }
#stage canvas { display: block; width: 100%; height: 100%; }
.bar {
  position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; pointer-events: none;
}
.bar > * { pointer-events: auto; }
.choices { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.chip { font: inherit; color: var(--dim); background: transparent; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--bg); background: var(--on); }
.chip:focus-visible { outline: 2px solid var(--on); outline-offset: 2px; }
.act { color: var(--ink); background: var(--chip); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 9px 14px; }
.how { margin: 0; color: var(--dim); font-size: 12.5px; text-shadow: 0 1px 6px #000; }
.how b { color: var(--ink); font-weight: 500; }
.touch { display: none; }
@media (hover: none), (pointer: coarse) { .fine { display: none; } .touch { display: inline; } }
.fail[hidden] { display: none; }
.fail { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); }
</style>
</head>
<body>
<div id="stage" role="application" aria-label="Glacier bore"></div>
<p class="fail" hidden>This scene needs WebGL 2.</p>
<div class="bar">
  <div class="choices" id="mode" role="group" aria-label="Light"><button class="chip" type="button" data-value="deep" aria-pressed="true">Deep blue</button><button class="chip" type="button" data-value="turquoise" aria-pressed="false">Turquoise</button><button class="chip" type="button" data-value="aurora" aria-pressed="false">Aurora</button></div>
  <button class="chip act" id="act" type="button">+ Train</button>
  <p class="how"><b><span class="fine">Click</span><span class="touch">Tap</span></b> send a train</p>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

/* ---------- scene ---------- */
// Glacier bore: a viaduct runs through a tunnel inside a glacier.
// The ice glows from within; a passing train floods it amber.
function build({ THREE, mergeGeometries, Reflector }) {
let seed = 777;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const range = (a, b) => a + (b - a) * rnd();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 6000);
const NL = 16, NT = 6, WATER = -24, DECK = 0;

// The bore: a gentle S-curve, about 1.6 km long.
const pts = [];
for (let i = -1; i <= 12; i++) { const z = 260 - i * 150; pts.push(new THREE.Vector3(70 * Math.sin(i * 0.55), 0, z)); }
const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
const LEN = curve.getLength();
const UP = new THREE.Vector3(0, 1, 0);
function frameAt(t) {
  const p = curve.getPointAt(t), T = curve.getTangentAt(t);
  const N = new THREE.Vector3().crossVectors(T, UP).normalize();
  return { p, T, N };
}

/* ---------- GLSL ---------- */
const NOISE = /* glsl */`
float hash1(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
vec2 hash2(vec2 p) { return vec2(hash1(p), hash1(p + 17.17)); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash1(i), hash1(i + vec2(1, 0)), u.x), mix(hash1(i + vec2(0, 1)), hash1(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
float h3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float n3(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1, 0, 0)), f.x), mix(h3(i + vec3(0, 1, 0)), h3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(h3(i + vec3(0, 0, 1)), h3(i + vec3(1, 0, 1)), f.x), mix(h3(i + vec3(0, 1, 1)), h3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}`;

// Light list: train lamps first, then the deck's cold markers.
const LIGHTS = /* glsl */`
uniform vec4 uLP[${NL}];
uniform vec4 uLC[${NL}];
uniform vec3 uAmb;
uniform vec3 uHaze;
uniform float uAur;
uniform float uTime;
// Ice absorbs red first: warm light turns cyan as it travels.
const vec3 SIG = vec3(0.04, 0.019, 0.009);
float att(float d, vec4 lp, vec4 lc) { return lp.w / (1.0 + pow(d / lc.w, 2.0)); }
// In-scatter of point lights along the view ray, solved in closed form.
vec3 inscatter(vec3 P) {
  vec3 ro = cameraPosition, rd = P - ro;
  float Lr = length(rd);
  rd /= Lr;
  vec3 s = vec3(0.0);
  for (int i = 0; i < ${NL}; i++) {
    if (uLP[i].w <= 0.0) continue;
    vec3 q = uLP[i].xyz - ro;
    float t0 = dot(q, rd);
    float h = max(length(q - rd * t0), 0.6);
    float a = (atan((Lr - t0) / h) - atan(-t0 / h)) / h;
    s += uLC[i].rgb * uLP[i].w * a * uLC[i].w * 0.0022 * exp(-h * 0.06);
  }
  return s;
}
// The aurora: slow green curtains seen through the thin roof.
vec3 aurora(vec3 P) {
  float b = fbm(vec2(P.x * 0.006 + uTime * 0.02, P.z * 0.002 - uTime * 0.01));
  float c = smoothstep(0.35, 0.75, sin(P.x * 0.012 + P.z * 0.004 + b * 6.0 + uTime * 0.15) * 0.5 + 0.5);
  vec3 col = mix(vec3(0.1, 1.0, 0.45), vec3(0.5, 0.25, 1.0), smoothstep(0.65, 0.9, b));
  return col * c * (0.4 + 0.8 * b);
}
vec3 haze(vec3 c, vec3 P) {
  float d = length(P - cameraPosition);
  float f = 1.0 - exp(-d * 0.0028);
  return mix(c, uHaze, f) + inscatter(P);
}`;

const U = {
  uLP: { value: Array.from({ length: NL }, () => new THREE.Vector4()) },
  uLC: { value: Array.from({ length: NL }, () => new THREE.Vector4()) },
  uAmb: { value: new THREE.Vector3() },
  uHaze: { value: new THREE.Vector3() },
  uAur: { value: 0 },
  uTime: { value: 0 },
  uScale: { value: 1 },
};

/* ---------- the bore: a lumpy ring swept along the curve ---------- */
{
  const SEG = 520, RING = 72, pos = [], inw = [], uvs = [], idx = [];
  const ph = Array.from({ length: 8 }, () => range(0, 6.28));
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG, { p, N } = frameAt(t), s = t * LEN;
    for (let j = 0; j <= RING; j++) {
      const a = j / RING * Math.PI * 2;
      // The bore swells and narrows; lumps break the circle.
      let r = 1 + 0.12 * Math.sin(s / 140 + ph[0]) + 0.06 * Math.sin(s / 47 + a * 2 + ph[1]) + 0.05 * Math.sin(a * 5 + s / 90 + ph[2]) + 0.03 * Math.sin(a * 9 - s / 31 + ph[3]);
      const rx = 38 * r, ry = 33 * r;
      const o = new THREE.Vector3().addScaledVector(N, Math.cos(a) * rx).addScaledVector(UP, Math.sin(a) * ry);
      const q = p.clone().add(o).add(new THREE.Vector3(0, 7, 0));
      pos.push(q.x, q.y, q.z);
      const n = o.clone().normalize().negate();
      inw.push(n.x, n.y, n.z);
      uvs.push(s, a * 50);
    }
  }
  for (let i = 0; i < SEG; i++) for (let j = 0; j < RING; j++) {
    const a = i * (RING + 1) + j, b = a + RING + 1;
    idx.push(a, b, a + 1, a + 1, b, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(inw, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.ShaderMaterial({
    uniforms: U, side: THREE.DoubleSide,
    vertexShader: /* glsl */`
    varying vec3 vP;
    varying vec3 vN;
    varying vec2 vUv;
    ${NOISE}
    void main() {
      vec3 p = position;
      // Big soft bulges in the wall, pushed along the normal.
      p += normal * (n3(p * 0.04) - 0.5) * 7.0;
      vP = p; vN = normal; vUv = uv;
      gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
    }`,
    fragmentShader: /* glsl */`
    varying vec3 vP;
    varying vec3 vN;
    varying vec2 vUv;
    ${NOISE}
    ${LIGHTS}
    // Scallops: melt dimples on a cell grid; returns depth.
    float scallop(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      // A smooth minimum keeps the cell walls rounded, like melt.
      float acc = 0.0;
      for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
        vec2 o = vec2(x, y), c = o + 0.5 + 0.45 * (hash2(i + o) - 0.5) * 2.0;
        vec2 r = (f - c) * vec2(1.0, 1.35);
        acc += exp(-9.0 * dot(r, r));
      }
      return -log(acc) / 9.0;
    }
    void main() {
      vec3 N0 = normalize(vN);
      vec3 V = normalize(cameraPosition - vP);
      if (dot(N0, V) < 0.0) N0 = -N0;
      // Tangent frame from the bore: along and around.
      vec3 T = normalize(cross(N0, vec3(0.0, 1.0, 0.0)) + vec3(1e-4));
      vec3 B = cross(T, N0);
      vec2 sp = vec2(dot(vP, T), dot(vP, B)) * 0.17;
      float e = 0.06;
      float s0 = scallop(sp), sx = scallop(sp + vec2(e, 0.0)), sy = scallop(sp + vec2(0.0, e));
      float dist = length(cameraPosition - vP);
      float near = 1.0 - smoothstep(30.0, 110.0, dist);
      vec3 N = normalize(N0 + (T * (sx - s0) + B * (sy - s0)) / e * 0.22 * (0.4 + 0.6 * near));
      // Rims between scallops are thin and catch the light.
      float rim = smoothstep(0.0, 0.2, s0);
      // Roof ice is thin; low walls are thick and dark.
      float roof = smoothstep(-0.1, -0.85, N0.y);
      float thin = clamp(roof * 0.8 + 0.35 * (fbm(vUv * 0.012) - 0.5), 0.0, 1.0);
      // Old snow layers lie in the ice as dark, wavy strata.
      float wob = fbm(vP.xz * 0.008 + vP.y * 0.004);
      float strata = 0.7 + 0.3 * smoothstep(-0.2, 0.9, sin(vP.y * 0.23 + wob * 9.0) * sin(vP.y * 0.071 + 1.3 + fbm(vP.zx * 0.004) * 6.0));
      // Base glow: night light filtered through metres of ice.
      vec3 c = uAmb * (0.4 + 1.6 * thin * thin) * strata * (0.7 + 0.6 * fbm(vP.xz * 0.015 + vP.y * 0.02));
      // Grazing views cross more ice and glow more; this shows the relief.
      float graze = pow(1.0 - max(dot(N, V), 0.0), 2.0);
      c *= (0.55 + 1.3 * graze) * (0.8 + 0.4 * rim);
      c += aurora(vP) * uAur * roof * (0.35 + 0.65 * thin) * 0.22;
      vec3 dirIn = refract(-V, N, 0.76);
      for (int i = 0; i < ${NL}; i++) {
        if (uLP[i].w <= 0.0) continue;
        vec3 L = uLP[i].xyz - vP;
        float d = length(L);
        L /= d;
        float a = att(d, uLP[i], uLC[i]);
        // The bend of the bore hides far lamps from the wall.
        vec3 lc = uLC[i].rgb * smoothstep(130.0, 70.0, d);
        // Surface: a frosted wrap and a wet, tight highlight.
        // Train lamps light the frosted face directly; markers barely do.
        float face = i < ${NT} ? 0.3 : 0.05;
        c += lc * a * (max(dot(N, L) * 0.6 + 0.4, 0.0) * face / (1.0 + d * d / 900.0) + pow(max(dot(N, normalize(L + V)), 0.0), 90.0) * 0.35 * (0.3 + 0.7 * near));
        // Subsurface: light soaks into the ice and shifts toward blue.
        float reach = uLC[i].w * 2.2;
        c += lc * uLP[i].w * exp(-d * SIG) * 0.32 * (0.95 + 0.1 * rim) * strata / (1.0 + d * d / (reach * reach));
        // Inside: two depths of bubbles and fracture sheets.
        if (i < ${NT}) {
          for (int k = 0; k < 2; k++) {
            float tk = k == 0 ? 1.4 : 4.5;
            vec3 Q = vP + dirIn * tk;
            // Fracture sheets: thin, sparse, mostly steep.
            float sheet = abs(n3(Q * vec3(0.07, 0.025, 0.07) + float(k) * 7.0) - 0.5);
            float crack = smoothstep(0.012, 0.0, sheet) * smoothstep(0.5, 0.75, n3(Q * 0.02 + 3.0));
            float bub = smoothstep(0.72, 0.9, n3(Q * 0.9));
            float dq = length(uLP[i].xyz - Q);
            c += lc * uLP[i].w * exp(-dq * SIG) * exp(-tk * vec3(0.18, 0.07, 0.04)) * (crack * 6.0 + bub * 0.35) * (1.0 / (1.0 + dq * dq * 0.002));
          }
        }
      }
      gl_FragColor = vec4(haze(c, vP), 1.0);
    }`,
  }));
  m.frustumCulled = false;
  scene.add(m);
}

/* ---------- the viaduct: a slim deck on tall piers ---------- */
const solid = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: /* glsl */`varying vec3 vP; varying vec3 vN; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: /* glsl */`
  varying vec3 vP;
  varying vec3 vN;
  ${NOISE}
  ${LIGHTS}
  void main() {
    vec3 N = normalize(vN), V = normalize(cameraPosition - vP);
    // The steel takes the blue of the ice round it, brightest from above.
    vec3 c = uAmb * 1.6 * (0.5 + 0.5 * N.y) + aurora(vP) * uAur * 0.05 * max(N.y, 0.0);
    c += uAmb * 1.6 * pow(1.0 - max(dot(N, V), 0.0), 3.0);
    for (int i = 0; i < ${NL}; i++) {
      if (uLP[i].w <= 0.0) continue;
      vec3 L = uLP[i].xyz - vP;
      float d = length(L);
      L /= d;
      float a = att(d, uLP[i], uLC[i]);
      c += uLC[i].rgb * a * (max(dot(N, L), 0.0) * 0.08 + pow(max(dot(N, normalize(L + V)), 0.0), 40.0) * 0.6);
    }
    c *= vec3(0.55, 0.5, 0.48);
    c = mix(vec3(dot(c, vec3(0.3, 0.5, 0.2))), c, 0.45);
    gl_FragColor = vec4(haze(c, vP), 1.0);
  }`,
});
const parts = [];
const lampPts = [];
{
  const STEP = 6;
  for (let s = 0; s < LEN; s += STEP) {
    const t0 = s / LEN, t1 = Math.min(1, (s + STEP) / LEN);
    const a = curve.getPointAt(t0), b = curve.getPointAt(t1);
    const mid = a.clone().add(b).multiplyScalar(0.5);
    const yaw = Math.atan2(b.x - a.x, b.z - a.z);
    const g = new THREE.BoxGeometry(5, 1.2, STEP + 0.2).rotateY(yaw).translate(mid.x, DECK - 0.7, mid.z);
    parts.push(g.toNonIndexed());
    for (const sd of [-1, 1]) {
      const n = frameAt(t0).N;
      const r = new THREE.BoxGeometry(0.2, 0.2, STEP + 0.05).rotateY(yaw).translate(mid.x + n.x * sd * 0.75, DECK + 0.1, mid.z + n.z * sd * 0.75);
      parts.push(r.toNonIndexed());
    }
  }
  // Tall slim piers, splayed at the foot.
  for (let s = 20; s < LEN; s += 48) {
    const p = curve.getPointAt(s / LEN);
    const g = new THREE.CylinderGeometry(0.9, 1.6, -WATER + 2, 12).translate(p.x, (WATER - 2) / 2 - 1.4, p.z);
    parts.push(g.toNonIndexed());
  }
  // Cold marker lamps on the parapet every 60 m, sides alternating.
  let k = 0;
  for (let s = 30; s < LEN; s += 60, k++) {
    const { p, N } = frameAt(s / LEN);
    lampPts.push(p.clone().addScaledVector(N, (k % 2 ? 1 : -1) * 3.6).add(new THREE.Vector3(0, 1.6, 0)));
  }
}
scene.add(new THREE.Mesh(mergeGeometries(parts), solid));

/* ---------- train ---------- */
const glowMat = new THREE.ShaderMaterial({
  uniforms: U, vertexColors: true,
  vertexShader: /* glsl */`varying vec3 vC; varying vec3 vP; void main() { vC = color; vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: /* glsl */`varying vec3 vC; varying vec3 vP; ${NOISE} ${LIGHTS} void main() { gl_FragColor = vec4(mix(vC, uHaze, 1.0 - exp(-length(vP - cameraPosition) * 0.0028)), 1.0); }`,
});
function paint(g, c) { const n = g.attributes.position.count, a = new Float32Array(n * 3); for (let i = 0; i < n; i++) a.set(c, i * 3); g.setAttribute('color', new THREE.BufferAttribute(a, 3)); return g; }
const flareMat = new THREE.ShaderMaterial({
  uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
  attribute vec3 color;
  attribute float size;
  uniform float uScale;
  varying vec3 vC;
  void main() { vC = color; vec4 mv = viewMatrix * modelMatrix * vec4(position, 1.0); gl_PointSize = clamp(size * uScale / -mv.z, 2.0, 60.0); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: /* glsl */`varying vec3 vC; void main() { vec2 c = gl_PointCoord - 0.5; gl_FragColor = vec4(vC * exp(-dot(c, c) * 22.0), 1.0); }`,
});
const CAR = 22, GAP = 1.2, NC = 4;
const train = (() => {
  const body = new THREE.BoxGeometry(3.0, 3.6, CAR).translate(0, 2.4, 0);
  const wins = [];
  for (const sd of [-1, 1]) for (let k = 0; k < 9; k++) wins.push(paint(new THREE.BoxGeometry(0.06, 1.0, 1.7).translate(sd * 1.52, 2.9, -CAR / 2 + 2 + k * 2.3), [3.2, 1.7, 0.7]).toNonIndexed());
  const winG = mergeGeometries(wins);
  const cars = [];
  for (let i = 0; i < NC; i++) {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(body, solid), new THREE.Mesh(winG, glowMat));
    scene.add(g);
    cars.push(g);
  }
  const lampG = new THREE.BufferGeometry();
  lampG.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(9), 3));
  lampG.setAttribute('color', new THREE.Float32BufferAttribute([5, 0.8, 0.3, 5, 0.8, 0.3, 14, 12, 9], 3));
  lampG.setAttribute('size', new THREE.Float32BufferAttribute([60, 60, 260], 1));
  const lamps = new THREE.Points(lampG, flareMat);
  lamps.frustumCulled = false; lamps.renderOrder = 3; scene.add(lamps);
  return { cars, lampG, lamps };
})();
const orbs = [{ pos: new THREE.Vector3(), color: [1, 0.85, 0.6], k: 0, size: 1.1 }];

/* Drips: meltwater falling from the roof; each sparkles when lit. */
{
  const n = 900, pos = new Float32Array(n * 3), ph = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const t = rnd(), { p, N } = frameAt(t);
    const o = range(-24, 24);
    pos.set([p.x + N.x * o, range(WATER, 36), p.z + N.z * o], i * 3);
    ph[i] = rnd();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('ph', new THREE.BufferAttribute(ph, 1));
  const m = new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
    attribute float ph;
    uniform float uScale;
    varying vec3 vC;
    varying float vS;
    ${NOISE}
    ${LIGHTS}
    void main() {
      vec3 p = position;
      // Each drop falls from the roof to the water, then starts again.
      float H = 36.0 - ${WATER}.0;
      p.y = 36.0 - mod((36.0 - p.y) + uTime * (14.0 + ph * 10.0), H);
      vec3 c = uAmb * 1.2;
      for (int i = 0; i < ${NL}; i++) {
        if (uLP[i].w <= 0.0) continue;
        vec3 L = uLP[i].xyz - p;
        c += uLC[i].rgb * uLP[i].w * 60.0 / (dot(L, L) + 30.0);
      }
      // Now and then a drop flashes as it turns.
      vC = c + vec3(0.5, 0.8, 1.0) * pow(fract(ph * 13.0 + uTime * 0.6), 24.0) * 0.6;
      vec4 mv = viewMatrix * vec4(p, 1.0);
      vS = 55.0 * uScale / -mv.z;
      gl_PointSize = clamp(vS, 1.5, 24.0);
      gl_Position = projectionMatrix * mv;
    }`,
    fragmentShader: /* glsl */`
    varying vec3 vC;
    varying float vS;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      // A short vertical streak with a bright head.
      float a = exp(-c.x * c.x * 160.0) * smoothstep(0.5, 0.0, abs(c.y)) * (0.4 + 0.6 * smoothstep(0.0, 0.4, c.y));
      gl_FragColor = vec4(vC * a * smoothstep(1.5, 4.0, vS), 1.0);
    }`,
  }));
  m.frustumCulled = false;
  m.renderOrder = 4;
  scene.add(m);
}
{
  const g = new THREE.BufferGeometry().setFromPoints(lampPts);
  g.setAttribute('color', new THREE.Float32BufferAttribute(lampPts.flatMap(() => [2.2, 3.2, 4.2]), 3));
  g.setAttribute('size', new THREE.Float32BufferAttribute(lampPts.map(() => 70), 1));
  const p = new THREE.Points(g, flareMat);
  p.frustumCulled = false; p.renderOrder = 3; scene.add(p);
}

/* Meltwater: a dark mirror under the deck, broken by slow ripples. */
const water = new Reflector(new THREE.PlaneGeometry(4000, 4000), {
  textureWidth: 512, textureHeight: 512, clipBias: 0.003,
  shader: {
    name: 'Melt',
    uniforms: { ...U, color: { value: new THREE.Color() }, tDiffuse: { value: null }, textureMatrix: { value: null } },
    vertexShader: /* glsl */`
    uniform mat4 textureMatrix;
    varying vec4 vR;
    varying vec3 vP;
    void main() { vR = textureMatrix * vec4(position, 1.0); vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    varying vec4 vR;
    varying vec3 vP;
    ${NOISE}
    ${LIGHTS}
    void main() {
      vec3 V = normalize(cameraPosition - vP);
      float n0 = vnoise(vP.xz * 0.15 + vec2(0.0, uTime * 0.3));
      vec2 sl = vec2(vnoise(vP.xz * 0.15 + vec2(0.3, uTime * 0.3)) - n0, vnoise(vP.xz * 0.15 + vec2(0.0, 0.3 + uTime * 0.3)) - n0) * 0.5;
      sl += vec2(vnoise(vP.xz * 0.6 + 4.0) - 0.5, vnoise(vP.xz * 0.6 + 9.0) - 0.5) * 0.04;
      vec2 uv = vR.xy / vR.w;
      vec3 refl = vec3(0.0);
      // A few taps stretch each light into a short vertical smear.
      for (int i = -3; i <= 3; i++) refl += texture2D(tDiffuse, clamp(uv + vec2(sl.x * 0.1, sl.y * 0.25 + float(i) * 0.006), 0.001, 0.999)).rgb;
      refl /= 7.0;
      float F = 0.04 + 0.96 * pow(1.0 - max(V.y, 0.0), 5.0);
      vec3 c = refl * (0.35 + 0.65 * F) * vec3(0.7, 0.95, 1.0) + vec3(0.0004, 0.002, 0.003);
      gl_FragColor = vec4(haze(c, vP), 1.0);
    }`,
  },
});
water.rotation.x = -Math.PI / 2;
water.position.y = WATER;
scene.add(water);

/* ---------- lights and moods ---------- */
const lights = [];
for (let i = 0; i < NT; i++) lights.push({ pos: new THREE.Vector3(0, -999, 0), power: 0, col: [1, 0.6, 0.25], range: 10 });
for (const p of lampPts.slice(0, NL - NT)) lights.push({ pos: p, power: 0.6, col: [0.6, 0.85, 1.0], range: 5 });
function upload() {
  lights.slice(0, NL).forEach((l, i) => {
    U.uLP.value[i].set(l.pos.x, l.pos.y, l.pos.z, l.power);
    U.uLC.value[i].set(l.col[0], l.col[1], l.col[2], l.range);
  });
}
const MOODS = {
  deep: { amb: [0.003, 0.018, 0.075], haze: [0.0015, 0.008, 0.028], aur: 0 },
  turquoise: { amb: [0.006, 0.06, 0.07], haze: [0.002, 0.02, 0.026], aur: 0 },
  aurora: { amb: [0.002, 0.011, 0.045], haze: [0.001, 0.008, 0.016], aur: 1 },
};
let target = MOODS.deep, blend = 1;
function applyMood(k) {
  U.uAmb.value.lerp(new THREE.Vector3(...target.amb), k);
  U.uHaze.value.lerp(new THREE.Vector3(...target.haze), k);
  U.uAur.value += (target.aur - U.uAur.value) * k;
}
applyMood(1);

/* Train run: s is the head's distance along the bore, from the far end. */
const run = { s: 0, on: false, user: false, v: 0 };
const tmp = new THREE.Vector3();
function placeTrain() {
  const { cars, lampG, lamps } = train;
  const vis = run.on && run.s > -CAR * NC && run.s < LEN + CAR * NC;
  for (const c of cars) c.visible = vis;
  lamps.visible = vis;
  // The train comes toward the camera: from t = 1 down to t = 0.
  const tAt = s => 1 - Math.max(0, Math.min(LEN, s)) / LEN;
  for (let i = 0; i < NC; i++) {
    const sc = run.s - i * (CAR + GAP) - CAR / 2, t = tAt(sc);
    const p = curve.getPointAt(t), T = curve.getTangentAt(t);
    cars[i].position.set(p.x, DECK, p.z);
    cars[i].rotation.y = Math.atan2(T.x, T.z);
    // Each car spills its warm window light into the ice.
    const l = lights[i + 1];
    l.pos.set(p.x, DECK + 3, p.z);
    l.power = vis ? 2.4 : 0; l.col = [1.0, 0.36, 0.07]; l.range = 13;
  }
  const h = curve.getPointAt(tAt(run.s + 0.5)), back = curve.getPointAt(tAt(run.s - NC * (CAR + GAP)));
  const hl = lights[0];
  hl.pos.set(h.x, DECK + 2.2, h.z); hl.power = vis ? 3.2 : 0; hl.col = [1.0, 0.6, 0.24]; hl.range = 16;
  const tail = lights[5];
  tail.pos.set(back.x, DECK + 1.5, back.z); tail.power = vis ? 1.0 : 0; tail.col = [1.0, 0.12, 0.05]; tail.range = 6;
  const pos = lampG.attributes.position;
  pos.setXYZ(0, back.x - 0.9, DECK + 1.2, back.z); pos.setXYZ(1, back.x + 0.9, DECK + 1.2, back.z); pos.setXYZ(2, h.x, DECK + 2.2, h.z);
  pos.needsUpdate = true;
  orbs[0].pos.copy(hl.pos); orbs[0].k = vis ? 0.3 : 0;
  upload();
}
run.s = LEN * 0.885; run.on = true; run.v = 6;
placeTrain();

/* ---------- framing ---------- */
function frame(w, h, pr) {
  camera.aspect = w / h;
  const c0 = frameAt(0.02), look = curve.getPointAt(0.24);
  if (w >= h) {
    camera.fov = 52;
    camera.position.copy(c0.p).addScaledVector(c0.N, 13).add(new THREE.Vector3(0, 12, 0));
    camera.lookAt(look.x, look.y + 1, look.z);
  } else {
    camera.fov = 74;
    camera.position.copy(c0.p).addScaledVector(c0.N, 6).add(new THREE.Vector3(0, 12, 0));
    camera.lookAt(look.x, look.y + 3, look.z);
  }
  camera.updateProjectionMatrix();
  water.getRenderTarget().setSize(Math.max(1, Math.round(w * pr / 2)), Math.max(1, Math.round(h * pr / 2)));
  U.uScale.value = (h * pr) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)) / 400;
}

/* ---------- motion ---------- */
let time = 0;
function update(dt, pace) {
  time += dt * pace;
  U.uTime.value = time;
  if (blend < 1) { blend = Math.min(1, blend + dt / 1.5); applyMood(Math.min(1, dt * 3)); if (blend >= 1) applyMood(1); }
  if (run.on) {
    const k = run.user ? 1 : pace;
    run.s += run.v * dt * k;
    if (run.s > LEN + NC * (CAR + GAP) + 20) { run.on = false; run.user = false; }
  }
  placeTrain();
}
function send() {
  run.s = -10; run.on = true; run.user = true; run.v = 32;
  placeTrain();
}
return {
  scene, camera, frame, update, orbs,
  tap: () => send(),
  act: () => send(),
  lively: () => blend < 1 || run.user,
  setMode(v, now) { target = MOODS[v] || MOODS.deep; blend = now ? 1 : 0; if (now) applyMood(1); },
  post: { bloom: [0.8, 0.55, 0.82], tint: [0.0004, 0.0009, 0.0014], vig: 0.55, vigIn: 0.38, grain: 0.03 },
};
}

/* ---------- end scene ---------- */

const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  document.querySelector('.fail').hidden = false;
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
stage.append(renderer.domElement);

const S = build({ THREE, mergeGeometries, Reflector });

/* Post chain: render, half-resolution bloom, grade, output. */
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(S.scene, S.camera));
const [bS, bR, bT] = S.post.bloom;
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), bS, bR, bT);
// The bloom runs at half resolution.
const bloomSize = bloom.setSize.bind(bloom);
bloom.setSize = (w, h) => bloomSize(Math.max(1, w / 2), Math.max(1, h / 2));
composer.addPass(bloom);

// The grade adds lamp orbs, a tint, a vignette and fixed grain.
const ORB_N = 12;
const grade = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null },
    uRes: { value: new THREE.Vector2(1, 1) },
    uTint: { value: new THREE.Vector3(...S.post.tint) },
    uVig: { value: S.post.vig },
    uVigIn: { value: S.post.vigIn },
    uGrain: { value: S.post.grain },
    uOP: { value: Array.from({ length: ORB_N }, () => new THREE.Vector3()) },
    uOC: { value: Array.from({ length: ORB_N }, () => new THREE.Vector4()) },
    uN: { value: 0 },
  },
  vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform sampler2D tDiffuse;
  uniform vec2 uRes;
  uniform vec3 uTint;
  uniform float uVig, uVigIn, uGrain;
  uniform vec3 uOP[${ORB_N}];
  uniform vec4 uOC[${ORB_N}];
  uniform int uN;
  varying vec2 vUv;
  // Interleaved gradient noise: fine grain with no banding.
  float h(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
  void main() {
    vec3 c = texture2D(tDiffuse, vUv).rgb;
    float asp = uRes.x / uRes.y;
    for (int i = 0; i < ${ORB_N}; i++) {
      if (i >= uN) break;
      vec2 d = vUv - uOP[i].xy;
      float r = length(vec2(d.x * asp * 0.6, d.y));
      // A tight core and a wide skirt; z holds the orb size.
      c += uOC[i].rgb * uOC[i].w * (exp(-r * 40.0 / uOP[i].z) + 0.35 * exp(-r * 9.0 / uOP[i].z));
    }
    c += uTint;
    vec2 q = (vUv - 0.5) * vec2(asp, 1.0);
    c *= 1.0 - uVig * smoothstep(uVigIn, 1.1, length(q));
    float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
    c *= 1.0 + (h(vUv * uRes) - 0.5) * uGrain * (0.6 + 0.4 * smoothstep(0.0, 0.3, lum)) * 2.0;
    gl_FragColor = vec4(max(c, 0.0), 1.0);
  }`,
});
composer.addPass(grade);
composer.addPass(new OutputPass());

const tmpV = new THREE.Vector3();
function placeOrbs() {
  S.camera.updateMatrixWorld();
  let n = 0;
  for (const o of S.orbs) {
    if (n >= ORB_N) break;
    if (o.k <= 0) continue;
    tmpV.copy(o.pos).project(S.camera);
    if (tmpV.z > 1 || Math.abs(tmpV.x) > 1.3 || Math.abs(tmpV.y) > 1.3) continue;
    grade.uniforms.uOP.value[n].set(tmpV.x * 0.5 + 0.5, tmpV.y * 0.5 + 0.5, o.size);
    grade.uniforms.uOC.value[n].set(o.color[0], o.color[1], o.color[2], o.k);
    n++;
  }
  grade.uniforms.uN.value = n;
}

let size = { w: 1, h: 1, dpr: 1 };
function resize() {
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  // The pixel ratio keeps a budget of about 2.6 million pixels.
  const dpr = Math.max(1, Math.min(devicePixelRatio || 1, 2, Math.sqrt(2.6e6 / (w * h))));
  size = { w, h, dpr };
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
  grade.uniforms.uRes.value.set(w * dpr, h * dpr);
  S.frame(w, h, dpr);
  draw();
}
let ready = false;
function draw() {
  if (document.hidden) return;
  S.before?.(renderer);
  placeOrbs();
  composer.render();
  if (!ready) { ready = true; window.__ready = true; }
}

/* Frame loop: full rate in an event, 30 fps while drifting, then sleep. */
const reducedRM = matchMedia('(prefers-reduced-motion: reduce)');
// QA can shorten the sleep with ?sleep=<ms>.
const SLEEP = +new URLSearchParams(location.search).get('sleep') || 60000;
let raf = 0, lastT = 0, lastDraw = 0, lastInput = performance.now(), pace = reducedRM.matches ? 0 : 1;
function loop(now) {
  raf = 0;
  if (document.hidden) return;
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000);
  lastT = now;
  // Ambient motion eases out over 2 s once idle; reduced motion keeps it off.
  const awake = !reducedRM.matches && now - lastInput < SLEEP;
  pace = awake ? Math.min(1, pace + dt / 2) : Math.max(0, pace - dt / 2);
  const lively = S.lively();
  if (!lively && pace === 0) { S.update(0, 0); draw(); return; }
  if (lively || now - lastDraw >= 31) {
    // A drift frame covers the gap since the last draw, never more than 0.1 s.
    S.update(lively ? dt : Math.min(0.1, Math.max(dt, (now - lastDraw) / 1000)), pace);
    draw();
    lastDraw = now;
  }
  raf = requestAnimationFrame(loop);
}
function wake() {
  lastInput = performance.now();
  if (!raf && !document.hidden) { lastT = lastDraw = performance.now(); raf = requestAnimationFrame(loop); }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; lastT = 0; return; }
  draw(); wake();
});

/* Pointer: a press is a tap unless it moves 8 px or holds 260 ms. */
let press = null;
const norm = e => [e.clientX / size.w, e.clientY / size.h];
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  press = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, t: performance.now(), moved: false };
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press) return;
  if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) press.moved = true;
  if (press.moved && S.drag) { S.drag((e.clientX - press.lx) / size.w, (e.clientY - press.ly) / size.h, true); wake(); }
  press.lx = e.clientX; press.ly = e.clientY;
});
function endPress(e, ok) {
  if (press && ok && !press.moved && performance.now() - press.t < 260) S.tap(...norm(e));
  if (press?.moved && S.drag) S.drag(0, 0, false);
  press = null; wake();
}
stage.addEventListener('pointerup', e => endPress(e, true));
stage.addEventListener('pointercancel', e => endPress(e, false));
document.getElementById('act').addEventListener('click', () => { S.act(); wake(); });

// Chips: one pressed at a time; the scene eases to the new light.
const group = document.getElementById('mode');
const chips = [...group.querySelectorAll('.chip')];
function pick(v) {
  for (const c of chips) c.setAttribute('aria-pressed', String(c.dataset.value === v));
  S.setMode(v);
  wake();
}
for (const c of chips) c.addEventListener('click', () => pick(c.dataset.value));
addEventListener('keydown', e => {
  const i = { Digit1: 0, Digit2: 1, Digit3: 2 }[e.code];
  if (i !== undefined && chips[i]) pick(chips[i].dataset.value);
  if (e.code === 'Space' && !e.target.closest?.('button')) { e.preventDefault(); S.act(); }
  wake();
});
const first = new URLSearchParams(location.search).get('mode');
if (first && chips.some(c => c.dataset.value === first)) {
  for (const c of chips) c.setAttribute('aria-pressed', String(c.dataset.value === first));
  S.setMode(first, true);
}
addEventListener('resize', resize);

// Compile first, then draw the first composed frame.
(async () => {
  S.frame(innerWidth, innerHeight, 1);
  if (renderer.extensions.has('KHR_parallel_shader_compile')) await renderer.compileAsync(S.scene, S.camera);
  else renderer.compile(S.scene, S.camera);
  resize();
  wake();
})().catch(err => { console.error(err); document.querySelector('.fail').hidden = false; });
</script>
</body>
</html>
