<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night viaduct</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Night viaduct: one toy, a viaduct per scene. */
:root { --stage: oklch(0.12 0.02 270); }
.stage--viaduct canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--viaduct canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--viaduct canvas { transition: none; } }
/* The ?tune panel: a tuning desk for every look knob. Hidden in normal use. */
.tune {
  position: fixed; top: 12px; right: 12px; bottom: 12px; z-index: 50; width: 310px;
  display: flex; flex-direction: column; gap: 8px; padding: 10px;
  background: oklch(0.17 0.012 275 / 0.92); border: 1px solid var(--line); border-radius: 12px;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  font: 12px/1.3 var(--sans); color: var(--fg);
}
.tune[hidden] { display: none; }
.tune .head { display: flex; gap: 6px; align-items: center; }
.tune .head b { flex: 1; font-size: 13px; }
.tune .head button { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; cursor: pointer; }
.tune .body { overflow: auto; flex: 1; padding-right: 2px; }
.tune details { border-top: 1px solid var(--line); padding: 6px 0; }
.tune summary { cursor: pointer; font-weight: 600; color: var(--muted); padding: 2px 0; }
.tune .row { display: grid; grid-template-columns: minmax(0, 1fr) 104px 56px; gap: 6px; align-items: center; padding: 3px 0; }
.tune .row.changed span { color: oklch(0.85 0.12 75); }
.tune input[type=range] { width: 100%; accent-color: oklch(0.8 0.12 75); }
.tune input[type=number] { width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }
.tune input[type=color] { width: 100%; height: 22px; border: 0; background: none; padding: 0; }
.tune .note { color: var(--muted); }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Night viaduct</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--viaduct" id="stage" tabindex="0" role="application" aria-label="A viaduct at night. Pick a scene below.">
      <p class="fail" hidden>Night viaduct needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" id="scene" role="group" aria-label="Scene">
        <button class="chip" type="button" data-value="pass" aria-pressed="true">Pass</button>
        <button class="chip" type="button" data-value="port" aria-pressed="false">Port</button>
      </div>
      <div class="actions" data-moves>
        <button class="chip" id="train" type="button" title="Send a train">+ Train</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div data-moves><dt><span class="fine">Click</span><span class="touch">Tap</span> water</dt><dd>ripple</dd></div>
        <div data-moves><dt><span class="fine">Click</span><span class="touch">Tap</span> sky</dt><dd>train</dd></div>
        <div data-moves><dt>Drag</dt><dd>searchlight</dd></div>
        <div class="fine" data-moves><dt><kbd>Space</kbd></dt><dd>train</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Night viaduct</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { initPage, choices, whenVisible, pixelRatio, quality, onQuality, qualitySetting } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

initPage({ id: 'viaduct' });
// Settings holds the site-wide Quality choice.
qualitySetting();
const stage = document.getElementById('stage');
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const SCENES = { pass: () => import('./pass.js'), port: () => import('./port.js') };
let markReady;
const sceneReady = new Promise(r => { markReady = r; });

// The intro holds until the page, the font and the first scene are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const canvas = renderer.domElement;
stage.prepend(canvas);

/* ---------- K2: bloom ---------- */
// Half-resolution bloom on a float target; only bright sources cross the threshold.
function makeBloom(strength, radius, threshold) {
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), strength, radius, threshold);
  const full = bloom.setSize.bind(bloom);
  bloom.setSize = (w, h) => full(Math.max(1, w / 2), Math.max(1, h / 2));
  return bloom;
}
/* ---------- end K2 ---------- */

/* ---------- K2: orbs ---------- */
// Soft glows round the brightest lamps, squashed sideways, so light bleeds into haze.
const ORB_N = 24;
function makeOrbs() {
  return new ShaderPass({
    uniforms: {
      tDiffuse: { value: null },
      uOP: { value: Array.from({ length: ORB_N }, () => new THREE.Vector3()) },
      uOC: { value: Array.from({ length: ORB_N }, () => new THREE.Vector4()) },
      uN: { value: 0 },
      uAsp: { value: 1 },
    },
    vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform vec3 uOP[${ORB_N}];
    uniform vec4 uOC[${ORB_N}];
    uniform int uN;
    uniform float uAsp;
    varying vec2 vUv;
    void main() {
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      for (int i = 0; i < ${ORB_N}; i++) {
        if (i >= uN) break;
        vec2 d = vUv - uOP[i].xy;
        float r = length(vec2(d.x * uAsp * 0.6, d.y));
        // A tight core and a wide skirt; z holds the orb size.
        c += uOC[i].rgb * uOC[i].w * (exp(-r * 40.0 / uOP[i].z) + 0.35 * exp(-r * 9.0 / uOP[i].z));
      }
      gl_FragColor = vec4(c, 1.0);
    }`,
  });
}
// Each frame, project the orbs to the screen; hidden ones get no glow.
const tmpV = new THREE.Vector3();
function placeOrbs(pass, s) {
  const list = s.orbs || [];
  // The camera matrices must be current before projecting.
  s.camera.updateMatrixWorld();
  let n = 0;
  for (const o of list) {
    if (n >= ORB_N) break;
    tmpV.copy(o.pos).project(s.camera);
    if (tmpV.z > 1 || Math.abs(tmpV.x) > 1.3 || Math.abs(tmpV.y) > 1.3) continue;
    pass.uniforms.uOP.value[n].set(tmpV.x * 0.5 + 0.5, tmpV.y * 0.5 + 0.5, o.size * look.orbSize);
    pass.uniforms.uOC.value[n].set(o.color[0], o.color[1], o.color[2], o.k * look.orbK);
    n++;
  }
  pass.uniforms.uN.value = n;
  pass.uniforms.uAsp.value = size.w / size.h;
}
/* ---------- end K2 ---------- */

/* ---------- K2: grade ---------- */
// Linear grade before tone mapping: haze lift, vignette, fixed grain.
function makeGrade({ tint, vig, vigIn, grain }) {
  // A hex tint uses the tune panel's scale: colour over 40.
  if (typeof tint === 'string') { const c = new THREE.Color(tint); tint = [c.r / 40, c.g / 40, c.b / 40]; }
  return new ShaderPass({
    uniforms: {
      tDiffuse: { value: null },
      uRes: { value: new THREE.Vector2(1, 1) },
      uTint: { value: new THREE.Vector3(...tint) },
      uVig: { value: vig },
      uVigIn: { value: vigIn },
      uGrain: { value: grain },
    },
    vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform vec2 uRes;
    uniform vec3 uTint;
    uniform float uVig, uVigIn, uGrain;
    varying vec2 vUv;
    float h(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec3 c = texture2D(tDiffuse, vUv).rgb + uTint;
      vec2 q = (vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
      c *= 1.0 - uVig * smoothstep(uVigIn, 1.1, length(q));
      float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c *= 1.0 + (h(vUv * uRes) - 0.5) * uGrain * (0.6 + 0.4 * smoothstep(0.0, 0.3, lum)) * 2.0;
      gl_FragColor = vec4(max(c, 0.0), 1.0);
    }`,
  });
}
/* ---------- end K2 ---------- */

// One scene lives at a time; a switch disposes the old one.
let rung = 0, bloomPass = null;
// Page-level look knobs: exposure and lamp orbs.
const look = { orbK: 1, orbSize: 1 };
let cur = null, composer = null, grade = null, orbPass = null, size = { w: 1, h: 1, dpr: 1 }, loading = 0;
// High with no slow-frame step takes four MSAA samples.
// Other cases take two; rung 3 takes none.
const samples = () => (rung >= 3 ? 0 : quality() === 'high' && rung === 0 ? 4 : 2);
const target = () => new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: samples() });
// Only a scene switch builds the chain; the old passes dispose.
function chain(s) {
  for (const p of composer?.passes || []) p.dispose?.();
  composer?.dispose();
  composer = new EffectComposer(renderer, target());
  composer.addPass(new RenderPass(s.scene, s.camera));
  orbPass = makeOrbs();
  composer.addPass(orbPass);
  bloomPass = makeBloom(...s.post.bloom);
  composer.addPass(bloomPass);
  grade = makeGrade(s.post);
  composer.addPass(grade);
  composer.addPass(new OutputPass());
}
// A new sample count swaps the targets.
// The passes and their tuned values stay.
function retarget() {
  if (composer && composer.renderTarget1.samples !== samples()) composer.reset(target());
}
function resize() {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  // The site-wide quality sets the pixel ratio; Standard keeps the budget.
  // From rung 1, High falls back to Standard and Standard to 1x.
  size = { w, h, dpr: pixelRatio(w, h, { maxDpr: 1.5, budget: 1.6e6, low: rung >= 1 }) };
  renderer.setPixelRatio(size.dpr);
  renderer.setSize(size.w, size.h, false);
  if (!cur) return;
  composer.setPixelRatio(size.dpr);
  composer.setSize(size.w, size.h);
  grade.uniforms.uRes.value.set(size.w * size.dpr, size.h * size.dpr);
  cur.frame(size.w, size.h, size.dpr);
  // Scenes with a matte painting re-bake their still layers here.
  cur.bake?.(renderer);
  draw();
}
let visible = true;
function draw() { if (cur && visible) { placeOrbs(orbPass, cur); composer.render(); } }

/* Frame loop: full rate in an event, 30 fps while drifting, then sleep. */
const reducedRM = matchMedia('(prefers-reduced-motion: reduce)');
// QA can shorten the sleep with ?sleep=<ms>.
const SLEEP = +new URLSearchParams(location.search).get('sleep') || 60000;
let raf = 0, lastT = 0, lastDraw = 0, lastInput = performance.now(), pace = reducedRM.matches ? 0 : 1;
function loop(now) {
  raf = 0;
  if (!cur?.update || !visible) return;
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000);
  lastT = now;
  // Ambient motion eases out over 2 s once idle, and stays off in reduced motion.
  const awake = !reducedRM.matches && now - lastInput < SLEEP;
  pace = awake ? Math.min(1, pace + dt / 2) : Math.max(0, pace - dt / 2);
  const lively = cur.lively();
  if (!lively && pace === 0) { draw(); return; }
  try {
    if (lively || now - lastDraw >= 31) {
      // A drift frame covers the gap since the last draw, never more than 0.1 s.
      cur.update(lively ? dt : Math.min(0.1, Math.max(dt, (now - lastDraw) / 1000)), pace);
      draw();
      watch(now, lively);
      lastDraw = now;
    }
  } finally {
    if (visible) raf = requestAnimationFrame(loop);
  }
}
/* Performance ladder: slow frames step quality down a rung, never back up. */
let watchFrom = 0, watchN = 0, watchSum = 0, prevDraw = 0;
function watch(now, lively) {
  const gap = now - prevDraw;
  prevDraw = now;
  if (gap > 200) { watchFrom = now; watchN = watchSum = 0; return; }
  if (!watchFrom) watchFrom = now;
  // Measure after 4 s of motion, over windows of 2 s.
  if (now - watchFrom < 4000) return;
  watchN++; watchSum += gap;
  if (watchN < 2 || now - watchFrom < 6000) return;
  const want = lively ? 1000 / 38 : 1000 / 22;
  if (watchSum / watchN > want && rung < 3) {
    rung++;
    cur.lower?.(rung);
    retarget();
    resize();
  }
  watchFrom = now - 4000; watchN = watchSum = 0;
}
function wake() {
  lastInput = performance.now();
  if (!raf && visible && cur?.update) { lastT = lastDraw = performance.now(); raf = requestAnimationFrame(loop); }
}
whenVisible(stage, v => {
  visible = v;
  if (!v) { cancelAnimationFrame(raf); raf = 0; lastT = 0; return; }
  draw(); wake();
});

/* Pointer: a press is a tap unless it moves 8 px or holds 260 ms. */
let press = null, holdTimer = 0;
const ndcOf = e => {
  const r = stage.getBoundingClientRect();
  return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
};
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  press = { x: e.clientX, y: e.clientY, steer: false, ndc: ndcOf(e) };
  // A hold aims the searchlight where the pointer rests.
  holdTimer = setTimeout(() => { if (press) { press.steer = true; cur?.steer?.(press.ndc); wake(); } }, 260);
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press) return;
  press.ndc = ndcOf(e);
  if (!press.steer && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { press.steer = true; clearTimeout(holdTimer); }
  if (press.steer) { cur?.steer?.(press.ndc); wake(); }
});
function endPress(tap) {
  clearTimeout(holdTimer);
  if (press && tap && !press.steer) cur?.tap?.(press.ndc);
  if (press?.steer) cur?.release?.();
  press = null; wake();
}
stage.addEventListener('pointerup', () => endPress(true));
stage.addEventListener('pointercancel', () => endPress(false));
stage.addEventListener('lostpointercapture', () => { if (press) endPress(false); });
document.getElementById('train').addEventListener('click', () => { cur?.tap?.(); wake(); });

async function show(id) {
  const ticket = ++loading;
  const { build } = await SCENES[id]();
  if (ticket !== loading) return;
  const next = build();
  // Async compile needs the parallel-compile extension; else compile at once.
  if (renderer.extensions.has('KHR_parallel_shader_compile')) await renderer.compileAsync(next.scene, next.camera);
  else renderer.compile(next.scene, next.camera);
  if (ticket !== loading) { next.dispose(); return; }
  cur?.dispose();
  cur = next;
  // Each scene brings its own exposure and lamp glow; else the base.
  renderer.toneMappingExposure = cur.post.expo ?? 1;
  look.orbK = cur.post.orbK ?? 1; look.orbSize = cur.post.orbSize ?? 1;
  chain(cur);
  // The new scene takes the current quality rung.
  cur.lower?.(rung);
  tuneScene(id);
  resize();
  store.set('stimming.viaduct.scene', id);
  stage.dataset.scene = id;
  canvas.classList.add('on');
  // Only scenes that move show the motion controls.
  for (const el of document.querySelectorAll('[data-moves]')) el.hidden = !cur.update;
  markReady();
  wake();
}

/* ---------- tune panel (?tune) ---------- */
// Lists every knob of the scene and the post chain. Changes save per scene.
const TUNING = new URLSearchParams(location.search).has('tune');
const postKnobs = () => {
  const g = grade.uniforms, col = { get: () => '#' + new THREE.Color(g.uTint.value.x * 40, g.uTint.value.y * 40, g.uTint.value.z * 40).getHexString(), set: h => { const c = new THREE.Color(h); g.uTint.value.set(c.r / 40, c.g / 40, c.b / 40); } };
  const k = (key, label, min, max, step, get, set) => ({ group: 'Post', key, label, min, max, step, get, set });
  return [
    k('expo', 'Exposure', 0.2, 3, 0.01, () => renderer.toneMappingExposure, v => { renderer.toneMappingExposure = v; }),
    k('bloom', 'Bloom strength', 0, 3, 0.01, () => bloomPass.strength, v => { bloomPass.strength = v; }),
    k('bloomR', 'Bloom radius', 0, 1.5, 0.01, () => bloomPass.radius, v => { bloomPass.radius = v; }),
    k('bloomT', 'Bloom threshold', 0, 3, 0.01, () => bloomPass.threshold, v => { bloomPass.threshold = v; }),
    k('orbK', 'Lamp glow', 0, 4, 0.01, () => look.orbK, v => { look.orbK = v; }),
    k('orbSize', 'Lamp glow size', 0.2, 4, 0.01, () => look.orbSize, v => { look.orbSize = v; }),
    k('vig', 'Vignette', 0, 1, 0.01, () => g.uVig.value, v => { g.uVig.value = v; }),
    k('vigIn', 'Vignette start', 0, 1, 0.01, () => g.uVigIn.value, v => { g.uVigIn.value = v; }),
    k('grain', 'Grain', 0, 0.2, 0.001, () => g.uGrain.value, v => { g.uGrain.value = v; }),
    { group: 'Post', key: 'tint', label: 'Black lift (tint)', type: 'color', ...col },
  ].map(t => ({ ...t, def: t.get() }));
};
let tunePanel = null, bakeTimer = 0;
function tuneScene(id) {
  const key = `stimming.viaduct.tune.${id}`;
  let saved = {};
  try { saved = JSON.parse(store.get(key) || '{}'); } catch {}
  const list = [...(cur.tune?.list || []), ...postKnobs()];
  const setOne = (t, v) => (cur.tune?.list.includes(t) ? cur.tune.set(t.key, v) : (t.set(v), false));
  // Saved values apply on every load, panel or not.
  for (const t of list) if (t.key in saved) setOne(t, saved[t.key]);
  if (!TUNING) return;
  tunePanel?.remove();
  const el = document.createElement('aside');
  el.className = 'tune';
  el.innerHTML = `<div class="head"><b>Tune · ${id}</b><a href="protos/" style="color:inherit">Prototypes</a><button data-a="copy">Copy JSON</button><button data-a="reset">Reset</button><button data-a="hide">Hide</button></div>
    <p class="note">Changes save in this browser. <kbd>T</kbd> shows or hides it. Knobs marked · re-bake the still layer; changed knobs turn amber.</p><div class="body"></div>`;
  const body = el.querySelector('.body');
  const groups = {};
  const save = () => { const o = {}; for (const t of list) { const v = t.get(); if (v !== t.def) o[t.key] = v; } store.set(key, JSON.stringify(o)); return o; };
  const rebake = () => { clearTimeout(bakeTimer); bakeTimer = setTimeout(() => { resize(); wake(); }, 150); };
  for (const t of list) {
    if (!groups[t.group]) { const d = document.createElement('details'); d.open = !Object.keys(groups).length; d.innerHTML = `<summary>${t.group}</summary>`; body.append(d); groups[t.group] = d; }
    const row = document.createElement('label');
    row.className = 'row';
    const name = document.createElement('span');
    name.textContent = t.label + (t.bake ? ' ·' : '');
    if (t.bake) name.title = 'Re-bakes the still layer';
    row.append(name);
    const mark = () => row.classList.toggle('changed', t.get() !== t.def);
    if (t.type === 'color') {
      const c = document.createElement('input'); c.type = 'color'; c.value = t.get();
      c.addEventListener('input', () => { if (setOne(t, c.value)) rebake(); else draw(); save(); mark(); wake(); });
      row.append(c, document.createElement('span'));
      t.sync = () => { c.value = t.get(); mark(); };
    } else {
      const r = document.createElement('input'); r.type = 'range'; r.min = t.min; r.max = t.max; r.step = t.step; r.value = t.get();
      const n = document.createElement('input'); n.type = 'number'; n.min = t.min; n.max = t.max; n.step = t.step; n.value = +(+t.get()).toFixed(5);
      const apply = v => { if (!Number.isFinite(v)) return; if (setOne(t, v)) rebake(); else draw(); save(); mark(); wake(); };
      r.addEventListener('input', () => { n.value = r.value; apply(+r.value); });
      n.addEventListener('change', () => { r.value = n.value; apply(+n.value); });
      row.append(r, n);
      t.sync = () => { r.value = t.get(); n.value = +(+t.get()).toFixed(5); mark(); };
    }
    body.querySelector('details:last-of-type').append(row);
    mark();
  }
  el.addEventListener('click', e => {
    const a = e.target.closest('button')?.dataset.a;
    if (a === 'copy') navigator.clipboard?.writeText(JSON.stringify(save(), null, 2));
    if (a === 'reset') { let b = false; for (const t of list) b = setOne(t, t.def) || b; for (const t of list) t.sync(); save(); if (b) rebake(); else draw(); wake(); }
    if (a === 'hide') el.hidden = true;
  });
  // The panel takes its own keys and pointer, away from the stage.
  el.addEventListener('keydown', e => e.stopPropagation());
  document.body.append(el);
  tunePanel = el;
}
addEventListener('keydown', e => { if (TUNING && e.code === 'KeyT' && !e.target.closest?.('input')) tunePanel && (tunePanel.hidden = !tunePanel.hidden); });
/* ---------- end tune panel ---------- */

const pick = choices(document.getElementById('scene'), id => show(id));
const first = new URLSearchParams(location.search).get('scene') || store.get('stimming.viaduct.scene');
const start = SCENES[first] ? first : 'port';
pick.set(start);
new ResizeObserver(resize).observe(stage);
// A new quality choice clears the slow-frame steps.
onQuality(() => { rung = 0; cur?.lower?.(0); retarget(); resize(); });
addEventListener('keydown', e => {
  if (e.target.closest?.('input, textarea')) return;
  const id = { Digit1: 'pass', Digit2: 'port' }[e.code];
  if (id && id !== pick.value) { pick.set(id, true); }
  if (e.code === 'Space' && cur?.tap && !e.target.closest?.('button')) { e.preventDefault(); cur.tap(); }
  wake();
});
show(start).catch(err => { console.error(err); stage.querySelector('.fail').hidden = false; markReady(); });
</script>
</body>
</html>
