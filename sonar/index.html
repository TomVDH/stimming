<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Sonar: a red low-light console, an active scope and a sonogram. */
:root { --stage: oklch(0.08 0.012 25); }
.stage--sonar { cursor: crosshair; }
.stage--sonar.held { cursor: grabbing; }
.stage--sonar canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.6s ease;
}
.stage--sonar canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--sonar canvas { transition: none; } }
/* The die is a solid face with its pips cut out. */
.chip svg.die { width: 16px; height: 16px; flex: none; fill: currentColor; stroke: none; }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.012 275 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Sonar</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--sonar" id="stage" tabindex="0" role="application" aria-label="A red sonar console. In Active mode, tap a bearing to ping it, or press Space to ping all round; drag around the centre to steer. In Sonogram mode the sea scrolls past as a waterfall; tap to knock the hull and drag to tune the cursor.">
      <p class="fail" hidden>Sonar needs WebGL2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" id="mode" role="group" aria-label="Display">
        <button class="chip" type="button" data-value="active" aria-pressed="true">Active</button>
        <button class="chip" type="button" data-value="sono" aria-pressed="false">Sonogram</button>
      </div>
      <label class="slider"><span id="sliderLab">Range</span><input type="range" id="slider" min="0" max="1" step="0.01" value="0.5" aria-label="Range"></label>
      <div class="actions">
        <button class="chip" id="ping" type="button">Ping</button>
        <button class="chip" id="shuffle" type="button" title="Shuffle: a new sea"><svg class="die" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M3.5 1.5h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2zM5.2 3.9a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm5.6 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM8 6.8a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM5.2 9.7a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm5.6 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>Shuffle</button>
      </div>
      <div class="edge">
        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings">
            <div class="group"><span>Afterglow</span><div class="choices" id="persist" role="group" aria-label="Afterglow">
              <button class="chip" type="button" data-value="short" aria-pressed="false">Short</button>
              <button class="chip" type="button" data-value="long" aria-pressed="true">Long</button>
            </div></div>
            <div class="group"><span>Scanlines</span><div class="choices" id="scan" role="group" aria-label="Scanlines">
              <button class="chip" type="button" data-value="off" aria-pressed="false">Off</button>
              <button class="chip" type="button" data-value="on" aria-pressed="true">On</button>
            </div></div>
            <div class="group"><span>Grid</span><div class="choices" id="grid" role="group" aria-label="Grid">
              <button class="chip" type="button" data-value="off" aria-pressed="false">Off</button>
              <button class="chip" type="button" data-value="on" aria-pressed="true">On</button>
            </div></div>
          </div>
        </div>
        <dl class="how" aria-label="How to play">
          <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>ping that bearing; knock on the sonogram</dd></div>
          <div><dt>Hold</dt><dd>charge a power ping</dd></div>
          <div><dt>Drag</dt><dd>steer; tune on the sonogram</dd></div>
          <div><dt><span class="fine">Double-click</span><span class="touch">Double-tap</span></dt><dd>track a contact</dd></div>
        </dl>
      </div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Sonar</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, audioKit, sound, choices, fitCanvas, whenVisible, reduced, onReducedChange, linFit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });
initPage({ id: 'sonar' });

const PI = Math.PI, TAU = PI * 2, D2R = PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const wrapA = a => ((a % TAU) + TAU) % TAU;
const angDiff = (a, b) => { const d = wrapA(a - b + PI) - PI; return Math.abs(d); };
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.sonar.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.sonar.${k}`, String(v)); } catch { /* storage is optional */ } };
const num = (k, d) => { const v = saved(k); return v == null || isNaN(+v) ? d : +v; };
const opts = {
  mode: saved('mode') === 'sono' ? 'sono' : 'active',
  range: num('range', 0.55),
  span: num('span', 0.33),
  persist: saved('persist') || 'long',
  scan: saved('scan') || 'on',
  grid: saved('grid') || 'on',
};
let reduce = reduced();
onReducedChange(v => { reduce = v; hudDirty = true; });

// The slider maps to metres in Active and to hertz in Sonogram.
const rangeM = () => 500 * Math.pow(8, opts.range);
const spanHz = () => 500 * Math.pow(8, opts.span);
// The red phosphor: a bright flash over a long, deep afterglow.
const PHOS = { flash: linFit(0.66, 0.24, 27), glow: linFit(0.56, 0.22, 26), hot: linFit(0.88, 0.1, 28), dark: linFit(0.13, 0.012, 30), tf: 0.08, gain: [1.2, 1.4, 0.5] };
const ts = () => (opts.persist === 'long' ? 3.4 : 1.2);
// Each echo feeds this share into the slow glow.
const SLOW = 1.8;
// Console tubes sit behind flat glass, so the bulge stays slight.
const WARP = 0.016;
const FRINGE = 0.006;
// The console refreshes at a fixed, modest rate.
const DISPLAY_HZ = 30;
const RING_T = 2.4;     // seconds for a ping to reach full range
const NBIN = 1024, FMAX = 4000, NROW = 384, ROW_HZ = 20;
const BIN_HZ = FMAX / NBIN;

/* ---------- WebGL2 ---------- */
const stage = document.getElementById('stage');
const barEl = document.querySelector('.bar');
const canvas = document.createElement('canvas');
canvas.setAttribute('aria-hidden', 'true');
stage.prepend(canvas);
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
const fail = () => { stage.querySelector('.fail').hidden = false; markReady(); throw new Error('no webgl2'); };
if (!gl) fail();
// Half floats keep the afterglow smooth; bytes are the fallback.
const FLOAT = !!gl.getExtension('EXT_color_buffer_float');

const QUAD_VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
const NOISE = `
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
float angDiff(float a, float b) { return abs(mod(a - b + 3.14159265, 6.2831853) - 3.14159265); }
`;

/* ---------- K1: accumulation and decay (from Star trails) ---------- */
// Two float targets ping-pong; the flash and the glow fade at their own rates.
const DECAY = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uSrc; uniform vec2 uDecay; uniform float uEps;
void main() { o = vec4(max(texture(uSrc, vUv).rg * uDecay - uEps, 0.0), 0.0, 1.0); }`;
/* ---------- end K1 ---------- */

// The ping front paints the ring it swept since the last frame.
// Echo strength comes from the seabed, the contacts and their shadows.
const MAXC = 12;
const EXCITE = `#version 300 es
precision highp float;
uniform vec2 uCenter, uOwn;
uniform float uRad, uR0, uR1, uBeam, uHalf, uRange, uSeed, uTime;
uniform vec2 uW;
uniform vec4 uC[${MAXC}]; uniform vec4 uK[${MAXC}]; uniform int uN;
out vec4 o;
${NOISE}
void main() {
  vec2 p = gl_FragCoord.xy - uCenter;
  float r = length(p);
  if (r < uR0 || r >= uR1 || r > uRad) { o = vec4(0.0); return; }
  float brg = atan(p.x, p.y);
  float beam = uHalf > 3.0 ? 1.0 : smoothstep(uHalf, uHalf * 0.55, angDiff(brg, uBeam));
  if (beam <= 0.0) { o = vec4(0.0); return; }
  float rn = r / uRad;
  vec2 w = uOwn + p / uRad * uRange;
  float rw = rn * uRange;
  // Rocks, sand waves and a soft bottom make the clutter.
  float base = fbm(w / 300.0 + uSeed);
  float rock = smoothstep(0.58, 0.78, base) * (0.35 + 0.9 * fbm(w / 55.0 + uSeed * 1.7));
  float wave = pow(0.5 + 0.5 * sin(dot(w, vec2(0.6, 0.8)) / 34.0 + fbm(w / 420.0 + uSeed) * 9.0), 10.0)
             * smoothstep(0.47, 0.6, base) * 0.22;
  float clutter = 0.05 + rock + wave;
  float shade = 1.0, tgt = 0.0;
  for (int i = 0; i < ${MAXC}; i++) {
    if (i >= uN) break;
    vec4 c = uC[i]; vec4 k = uK[i];
    // Solid contacts cast an acoustic shadow behind them.
    if (k.z < 0.5 || k.z > 2.5) {
      vec2 rel = c.xy - uOwn; float rc = length(rel);
      float hw = atan(c.z * 0.8, max(rc, 1.0));
      shade *= 1.0 - 0.88 * k.y / (k.y + 0.4) * smoothstep(hw, hw * 0.5, angDiff(brg, atan(rel.x, rel.y)))
                    * smoothstep(rc + c.w, rc + c.z * 1.2, rw);
    }
    vec2 dv = w - c.xy;
    float ca = cos(k.x), sa = sin(k.x);
    vec2 l = vec2(ca * dv.x + sa * dv.y, -sa * dv.x + ca * dv.y);
    vec2 q = l / c.zw;
    float d = dot(q, q);
    if (d > 2.5) continue;
    float v;
    if (k.z < 0.5) v = smoothstep(1.0, 0.7, d) * (0.6 + 0.8 * hash12(floor(l / 7.0) + k.w)) + smoothstep(0.3, 0.0, abs(abs(q.x) - 0.85)) * smoothstep(1.0, 0.6, d) * 0.8;
    else if (k.z < 1.5) v = smoothstep(1.4, 0.3, d) * step(0.83, hash12(floor((w + vec2(uTime * 2.0, uTime)) / 10.0) + k.w)) * 1.6;
    else if (k.z < 2.5) v = smoothstep(1.0, 0.35, d);
    else v = smoothstep(1.0, 0.15, d) * (0.45 + 0.8 * fbm(l / 60.0 + uTime * 0.15));
    tgt += v * k.y;
  }
  // Echoes scatter, so the clutter speckles like real returns.
  float speck = min(-log(max(hash12(gl_FragCoord.xy * 1.37 + uSeed * 91.0 + floor(uTime * 30.0)), 1e-3)), 3.5);
  float spread = 1.0 / (1.0 + rn * rn * 2.4);
  float ringDown = exp(-rn * 55.0) * 1.3;
  float e = (clutter * shade * speck * 0.3 + tgt * (0.75 + 0.35 * speck)) * spread + ringDown;
  o = vec4(e * beam * uW, 0.0, 1.0);
}`;
// The frame holds the raw light of the current display.
const FRAME = `#version 300 es
precision highp float;
uniform sampler2D uAcc, uFall;
uniform int uMode;
uniform vec2 uCenter; uniform vec4 uBox;
uniform float uRad, uFront, uBeam, uHalf, uDpr, uHead, uSpan, uRowsVis, uShow;
uniform vec2 uStrobe;
in vec2 vUv; out vec4 o;
${NOISE}
void main() {
  vec2 px = gl_FragCoord.xy;
  vec2 L = vec2(0.0);
  if (uMode == 0) {
    L = texture(uAcc, vUv).rg;
    vec2 p = px - uCenter; float r = length(p);
    if (uFront > 0.0) {
      float beam = uHalf > 3.0 ? 1.0 : smoothstep(uHalf, uHalf * 0.55, angDiff(atan(p.x, p.y), uBeam));
      float g = (r - uFront) / (1.4 * uDpr);
      L += vec2(0.55, 0.1) * exp(-g * g) * beam;
    }
    // A foreign ping shows as a bright strobe on its bearing.
    if (uStrobe.y > 0.0) {
      vec2 dir = vec2(sin(uStrobe.x), cos(uStrobe.x));
      float along = dot(p, dir), perp = abs(p.x * dir.y - p.y * dir.x) / (1.6 * uDpr);
      L += vec2(0.9, 0.3) * uStrobe.y * exp(-perp * perp) * step(0.0, along) * smoothstep(0.0, uRad, along);
    }
    L *= smoothstep(uRad + 1.5 * uDpr, uRad - 0.5 * uDpr, r);
  } else if (px.x >= uBox.x && px.x <= uBox.z && px.y >= uBox.y && px.y <= uBox.w) {
    vec2 uv = (px - uBox.xy) / (uBox.zw - uBox.xy);
    // Age one starts below the newest row, so the top never blends.
    float row = uHead - (1.0 - uv.y) * uRowsVis - 1.0;
    float b = texture(uFall, vec2(uv.x * uSpan / ${FMAX.toFixed(1)}, (row + 0.5) / ${NROW.toFixed(1)})).r;
    // A contrast curve sinks the sea floor and lifts the lines.
    float v = pow(b, 2.4) * 3.0;
    L = vec2(v, v * 0.22);
  }
  o = vec4(L * uShow, 0.0, 1.0);
}`;
// Four bilinear taps average a four by four block.
const DOWN = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uSrc; uniform vec2 uTexel;
void main() {
  vec2 s = texture(uSrc, vUv + uTexel * vec2(-1.0, -1.0)).rg + texture(uSrc, vUv + uTexel * vec2(1.0, -1.0)).rg
         + texture(uSrc, vUv + uTexel * vec2(-1.0, 1.0)).rg + texture(uSrc, vUv + uTexel * vec2(1.0, 1.0)).rg;
  o = vec4(s * 0.25, 0.0, 1.0);
}`;
const BLUR = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uSrc; uniform vec2 uDir;
void main() {
  vec2 s = texture(uSrc, vUv).rg * 0.227027;
  s += (texture(uSrc, vUv + uDir * 1.384615).rg + texture(uSrc, vUv - uDir * 1.384615).rg) * 0.316216;
  s += (texture(uSrc, vUv + uDir * 3.230769).rg + texture(uSrc, vUv - uDir * 3.230769).rg) * 0.070270;
  o = vec4(s, 0.0, 1.0);
}`;
// The tube, after the Oscilloscope: a monochrome red phosphor behind flat glass.
const SCREEN = `#version 300 es
precision highp float;
out vec4 o;
uniform sampler2D uAccum, uBloom, uHud, uGlass;
uniform vec2 uRes;
uniform float uDpr, uTime, uWarp, uFringe, uPower, uMask, uScan, uMotion;
uniform vec3 uFlash, uGlow, uGain, uTint, uHotCol, uDark;
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
// Barrel curvature: the face bulges, so the content squeezes to the edges.
vec2 warp(vec2 uv) {
  vec2 as = vec2(uRes.x / uRes.y, 1.0), c = (uv - 0.5) * as;
  return c * (1.0 + uWarp * dot(c, c)) / as + 0.5;
}
vec3 phosphor(vec2 uv) {
  vec2 e = texture(uAccum, uv).rg;
  float a = 1.0 - exp(-e.r * uGain.x), b = 1.0 - exp(-e.g * uGain.y);
  float hot = 1.0 - exp(-e.r * uGain.x * 0.08);
  return uFlash * a + uGlow * b + uHotCol * hot * hot * 0.9;
}
void main() {
  vec2 uv0 = gl_FragCoord.xy / uRes, uv = warp(uv0);
  // Power-on: a dot opens to a line, then the raster opens to full height.
  vec2 open = vec2(max(0.002, smoothstep(0.0, 0.3, uPower)), max(0.002, smoothstep(0.22, 0.78, uPower)));
  uv = (uv - 0.5) / open + 0.5;
  // Past the edge of the face the tube is black.
  vec2 edge = min(uv, 1.0 - uv) * uRes;
  float inside = clamp(min(edge.x, edge.y) / (2.0 * uDpr), 0.0, 1.0);

  // Each colour lands a little apart, more so away from centre.
  vec2 ca = (uv - 0.5) * uFringe + vec2(0.7 * uDpr / uRes.x, 0.0);
  vec3 beam = vec3(phosphor(uv + ca).r, phosphor(uv).g, phosphor(uv - ca).b);
  vec3 hud = vec3(texture(uHud, uv + ca * 1.4).r, texture(uHud, uv).r, texture(uHud, uv - ca * 1.4).r) * uTint;
  vec3 light = beam + hud;

  // A soft mask and beam-wide scanlines follow the raster.
  vec2 pw = uv * uRes;
  float m = floor(mod(pw.x / max(1.0, floor(uDpr + 0.5)), 3.0));
  vec3 grille = mix(vec3(1.0), vec3(m == 0.0, m == 1.0, m == 2.0) * 0.75 + 0.42, uMask);
  float lum = clamp(max(light.r, max(light.g, light.b)), 0.0, 1.0);
  float sy = fract(pw.y / (3.0 * uDpr)) - 0.5, sw = mix(0.2, 0.52, lum);
  light *= grille * mix(1.0, exp(-sy * sy / (sw * sw)) * 1.55, uScan);

  // Halation: the beam's bloom and a wide halo round the graticule.
  vec2 bl = texture(uBloom, uv).rg;
  vec3 halo = (uFlash * (1.0 - exp(-bl.r * uGain.x)) + uGlow * (1.0 - exp(-bl.g * uGain.y))) * uGain.z;
  halo += uTint * (textureLod(uHud, uv, 3.5).r * 0.3 + textureLod(uHud, uv, 5.5).r * 0.18);

  // Unlit phosphor is a dark warm grey with the mask just visible.
  vec3 col = uDark * mix(vec3(1.0), grille, 0.5);
  // A faint band rolls down the raster.
  float roll = exp(-pow((fract(uv0.y + uTime * 0.07) - 0.5) * 9.0, 2.0)) * 0.03 * uMotion;
  col += light * (1.0 + roll) + halo * (1.0 + roll);

  // Smudges on the glass spread the halo; dust blocks light and catches it.
  vec2 gl2 = texelFetch(uGlass, ivec2(gl_FragCoord.xy), 0).rg;
  float du = gl2.r, sm = gl2.g;
  float glowLum = max(halo.r, max(halo.g, halo.b));
  col += halo * sm * 1.1 + uDark * 0.5 * sm;
  col = col * (1.0 - 0.5 * du) + du * (0.008 + 0.7 * glowLum) * vec3(0.9, 0.82, 0.8);

  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(P.decay.u.uSrc, 0);
  gl.uniform2f(P.decay.u.uDecay, Math.exp(-dt / PHOS.tf), Math.exp(-dt / ts()));
  gl.uniform1f(P.decay.u.uEps, FLOAT ? 0.0006 * dt : 0.6 / 255);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ai = 1 - ai;
}
const cBuf = new Float32Array(MAXC * 4), kBuf = new Float32Array(MAXC * 4);
function excitePass(r0, r1) {
  const dst = acc[ai];
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, W, H);
  const u = P.excite.u;
  gl.useProgram(P.excite.p); gl.bindVertexArray(quadVao);
  gl.uniform2f(u.uCenter, scope.cx, scope.cy);
  gl.uniform2f(u.uOwn, sea.own[0], sea.own[1]);
  gl.uniform1f(u.uRad, scope.rad);
  gl.uniform1f(u.uR0, r0); gl.uniform1f(u.uR1, r1);
  gl.uniform1f(u.uBeam, ring.beam); gl.uniform1f(u.uHalf, ring.half);
  gl.uniform1f(u.uRange, rangeM());
  gl.uniform1f(u.uSeed, sea.seed);
  gl.uniform1f(u.uTime, clock);
  gl.uniform2f(u.uW, 1 + ring.power * 0.8, SLOW * (1 + ring.power * 0.8));
  const n = Math.min(MAXC, sea.contacts.length);
  cBuf.fill(0); kBuf.fill(0);
  sea.contacts.slice(0, n).forEach((c, i) => {
    cBuf.set([c.pos[0], c.pos[1], c.a, c.b], i * 4);
    kBuf.set([c.orient, c.str, c.kind, c.id], i * 4);
  });
  gl.uniform4fv(u['uC[0]'], cBuf); gl.uniform4fv(u['uK[0]'], kBuf);
  gl.uniform1i(u.uN, n);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.disable(gl.BLEND);
}
function quadPass(prog, dst, src, set) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, dst.w, dst.h);
  gl.useProgram(prog.p); gl.bindVertexArray(quadVao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(prog.u.uSrc, 0);
  set(prog.u);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
let rowFrac = 0;
function render() {
  if (hudDirty) drawHud();
  // The frame holds the light of the current display.
  gl.bindFramebuffer(gl.FRAMEBUFFER, frame.fb); gl.viewport(0, 0, W, H);
  const u = P.frame.u;
  gl.useProgram(P.frame.p); gl.bindVertexArray(quadVao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, acc[ai].tex);
  gl.uniform1i(u.uAcc, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fallTex);
  gl.uniform1i(u.uFall, 1);
  gl.uniform1i(u.uMode, opts.mode === 'active' ? 0 : 1);
  gl.uniform2f(u.uCenter, scope.cx, scope.cy);
  gl.uniform4f(u.uBox, box.x0, box.y0, box.x1, box.y1);
  gl.uniform1f(u.uRad, scope.rad);
  gl.uniform1f(u.uFront, ring.on ? ring.front : -1);
  gl.uniform1f(u.uShow, boot.phase === 'run' ? clamp((clock - boot.runAt) / 0.25) : 0);
  gl.uniform2f(u.uStrobe, strobe.b, strobe.a);
  gl.uniform1f(u.uBeam, ring.beam); gl.uniform1f(u.uHalf, ring.half);
  gl.uniform1f(u.uDpr, dpr);
  gl.uniform1f(u.uHead, head + (reduce ? 0 : rowFrac));
  gl.uniform1f(u.uSpan, spanHz());
  gl.uniform1f(u.uRowsVis, NROW - 2);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // Two blur rounds, the second wider, keep the glow round.
  quadPass(P.down, blm[0], frame, s => gl.uniform2f(s.uTexel, 1 / W, 1 / H));
  for (const k of [1, 2.4]) {
    quadPass(P.blur, blm[1], blm[0], s => gl.uniform2f(s.uDir, k / blm[0].w, 0));
    quadPass(P.blur, blm[0], blm[1], s => gl.uniform2f(s.uDir, 0, k / blm[0].h));
  }
  const s = P.screen.u;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(P.screen.p); gl.bindVertexArray(quadVao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, frame.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, blm[0].tex);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, hudTex);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, glass.tex);
  gl.uniform1i(s.uAccum, 0); gl.uniform1i(s.uBloom, 1); gl.uniform1i(s.uHud, 2); gl.uniform1i(s.uGlass, 3);
  gl.uniform2f(s.uRes, W, H);
  gl.uniform1f(s.uDpr, dpr); gl.uniform1f(s.uTime, clock % 1000);
  gl.uniform1f(s.uWarp, WARP); gl.uniform1f(s.uFringe, FRINGE);
  gl.uniform1f(s.uPower, power());
  gl.uniform1f(s.uMask, 0.35);
  gl.uniform1f(s.uScan, opts.scan === 'on' ? 1 : 0);
  gl.uniform1f(s.uMotion, reduce ? 0 : 1);
  gl.uniform3fv(s.uFlash, PHOS.flash); gl.uniform3fv(s.uGlow, PHOS.glow); gl.uniform3fv(s.uGain, PHOS.gain);
  gl.uniform3fv(s.uTint, TINT); gl.uniform3fv(s.uHotCol, PHOS.hot); gl.uniform3fv(s.uDark, PHOS.dark);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.activeTexture(gl.TEXTURE0);
}

/* ---------- loop ---------- */
let raf = 0, last = 0, visible = true, clock = 0, lastLight = -1e9, ready = false, lag = 0;
// The tube powers on when the intro clears; until then it stays dark.
let powerT0 = 1e9;
const power = () => (reduce ? 1 : clamp((clock - powerT0) / 0.9));
const idle = () => boot.phase === 'run' && opts.mode === 'active' && !ring.on && clock - lastLight > ts() * 6 && !hudFade && power() >= 1 && !later.length && strobe.a < 0.01 && !charge.on;
// The console draws at its own refresh rate, not the screen's.
function frameFn(now) {
  raf = 0;
  const dt = last ? Math.min(0.25, (now - last) / 1000) : 0;
  last = now;
  lag += dt;
  if (lag >= 1 / DISPLAY_HZ - 0.002) {
    step(Math.min(lag, 0.1));
    lag = 0;
    render();
  }
  if (visible && !idle()) raf = requestAnimationFrame(frameFn);
  else kit.rest(idle);
}
function wake() { if (visible && ready && !raf) { last = 0; raf = requestAnimationFrame(frameFn); } }

function step(dt) {
  clock += dt;
  stepSea(dt); stepSong(dt); stepProp(dt);
  steerVoices();
  for (let i = later.length - 1; i >= 0; i--) if (clock >= later[i].at) { const f = later[i].fn; later.splice(i, 1); f(); }
  strobe.a = Math.max(0, strobe.a - dt / 3);
  if (boot.phase === 'text') { hudDirty = true; if (clock - boot.t0 > bootLen()) endBoot(); }
  if (charge.on) hudDirty = true;
  // Track brackets and the cursor label follow at four frames a second.
  const tick4 = Math.floor(clock * 4) !== Math.floor((clock - dt) * 4);
  if (tick4 && ((tracks.length && opts.mode === 'active') || (cursorF >= 0 && opts.mode === 'sono'))) hudDirty = true;
  decayPass(dt);
  if (ring.on) {
    ring.t += dt;
    const p = clamp(ring.t / RING_T);
    // Reduced motion moves the front in eight steps.
    const pq = reduce ? Math.ceil(p * 8) / 8 : p;
    const front = pq * scope.rad;
    if (front > ring.front) { excitePass(ring.front, front); ring.front = front; lastLight = clock; }
    for (const e of pending) {
      if (e.done || ring.t < e.at) continue;
      e.done = true;
      if (e.c.str > 0.2) { e.c.seen = clock; say(`CONTACT   ${pad3(wrapA(e.b) / D2R)}   ${(e.d / 1000).toFixed(2)} KM   ${kindOf(e.c)}`); }
    }
    if (ring.t >= RING_T) { ring.on = false; ring.front = 0; }
  }
  if (opts.mode === 'sono') {
    rowClock += dt;
    let n = 0;
    while (rowClock >= 1 / ROW_HZ && n++ < 6) { rowClock -= 1 / ROW_HZ; makeRow(clock); }
    rowFrac = rowClock * ROW_HZ;
    // The classifier lines change with what the sea is doing.
    const sig = `${prop.amp > 0.15}|${song.bout}`;
    if (sig !== step.sig) { step.sig = sig; hudDirty = true; }
  }
  if (hudFade && Math.floor(clock * 10) !== Math.floor((clock - dt) * 10)) hudDirty = true;
}

/* ---------- modes ---------- */
const sliderEl = document.getElementById('slider'), sliderLab = document.getElementById('sliderLab');
const pingBtn = document.getElementById('ping');
function syncSlider() {
  const active = opts.mode === 'active';
  sliderLab.textContent = active ? 'Range' : 'Span';
  sliderEl.setAttribute('aria-label', active ? 'Range' : 'Frequency span');
  sliderEl.value = String(active ? opts.range : opts.span);
  pingBtn.textContent = active ? 'Ping' : 'Knock';
}
function applyMode(m) {
  opts.mode = m;
  syncSlider();
  hudDirty = true;
}
// A switch re-opens the raster from a line, as the tube resyncs.
function setMode(m) {
  save('mode', m);
  applyMode(m);
  if (ready && power() >= 1) powerT0 = clock - 0.9 * 0.22;
  render();
  wake();
}

/* ---------- size ---------- */
function resize() {
  const fit = fitCanvas(canvas, { budget: 2.2e6 });
  dpr = fit.dpr;
  if (fit.W !== W || fit.H !== H || !acc.length) {
    W = fit.W; H = fit.H;
    acc.forEach(drop); blm.forEach(drop); if (frame) drop(frame); if (glass) drop(glass);
    acc = [target(W, H), target(W, H)]; ai = 0;
    frame = target(W, H);
    glass = target(W, H);
    gl.bindFramebuffer(gl.FRAMEBUFFER, glass.fb); gl.viewport(0, 0, W, H);
    gl.useProgram(P.glass.p); gl.bindVertexArray(quadVao);
    gl.uniform1f(P.glass.u.uDpr, dpr);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    blm = [target(Math.max(1, W >> 1), Math.max(1, H >> 1)), target(Math.max(1, W >> 1), Math.max(1, H >> 1))];
  }
  measure();
  hudDirty = true;
  if (ready) { render(); wake(); }
}

/* ---------- input ---------- */
const pt = { down: false, drag: false, x: 0, y: 0, a: 0, timer: 0, charging: false };
let lastTap = { t: -1e9, x: 0, y: 0 };
// The pointer maps through the same slight bulge as the face.
function glXY(e) {
  const r = canvas.getBoundingClientRect(), as = r.width / r.height;
  const x = ((e.clientX - r.left) / r.width - 0.5) * as, y = 0.5 - (e.clientY - r.top) / r.height;
  const f = 1 + WARP * (x * x + y * y);
  return [(x * f / as + 0.5) * W, (y * f + 0.5) * H];
}
const angleAt = (x, y) => Math.atan2(x - scope.cx, y - scope.cy);
function tune(x) {
  cursorF = clamp((x - box.x0) / (box.x1 - box.x0)) * spanHz();
  hudDirty = true;
  wake();
}
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture?.(e.pointerId);
  const [x, y] = glXY(e);
  Object.assign(pt, { down: true, drag: false, x, y, a: angleAt(x, y), charging: false });
  clearTimeout(pt.timer);
  // Holding still for a moment starts the charge.
  pt.timer = setTimeout(() => {
    if (!pt.down || pt.drag || opts.mode !== 'active' || boot.phase !== 'run') return;
    pt.charging = true; charge.on = true; charge.t0 = clock;
    chargeSound(true);
    hudDirty = true;
    wake();
  }, 320);
});
stage.addEventListener('pointermove', e => {
  if (!pt.down) return;
  const [x, y] = glXY(e);
  if (pt.charging) return;
  if (!pt.drag && Math.hypot(x - pt.x, y - pt.y) > 7 * dpr) { pt.drag = true; stage.classList.add('held'); }
  if (!pt.drag) return;
  if (opts.mode === 'active') {
    // Dragging round the centre turns the boat like a wheel.
    const a = angleAt(x, y);
    sea.head = wrapA(sea.head + (wrapA(a - pt.a + PI) - PI));
    pt.a = a;
    hudDirty = true;
    wake();
  } else tune(x);
});
function release(e) {
  if (!pt.down) return;
  pt.down = false;
  clearTimeout(pt.timer);
  stage.classList.remove('held');
  if (pt.charging) {
    pt.charging = false;
    const lvl = chargeLevel();
    charge.on = false;
    chargeSound(false);
    ping(null, lvl);
    return;
  }
  if (pt.drag) return;
  if (boot.phase !== 'run') { endBoot(); return; }
  if (opts.mode === 'sono') { knock(); return; }
  const [x, y] = glXY(e);
  // A second tap on the same spot marks or drops a track.
  const nowMs = performance.now();
  if (nowMs - lastTap.t < 350 && Math.hypot(x - lastTap.x, y - lastTap.y) < 24 * dpr) {
    lastTap.t = -1e9;
    if (toggleTrack(x, y)) return;
  }
  lastTap = { t: nowMs, x, y };
  // A tap near the centre pings all round; elsewhere it pings that bearing.
  const r = Math.hypot(x - scope.cx, y - scope.cy);
  ping(r < scope.rad * 0.12 ? null : angleAt(x, y));
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', () => { pt.down = false; clearTimeout(pt.timer); if (pt.charging) { pt.charging = false; charge.on = false; chargeSound(false); } stage.classList.remove('held'); });
stage.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    if (opts.mode === 'active') ping(); else knock();
    return;
  }
  const d = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
  if (!d) return;
  e.preventDefault();
  if (opts.mode === 'active') { sea.head = wrapA(sea.head + d * 5 * D2R); hudDirty = true; wake(); }
  else { const f = cursorF < 0 ? spanHz() / 2 : cursorF; cursorF = clamp(f + d * spanHz() / 100, 0, spanHz()); hudDirty = true; wake(); }
});

/* ---------- bar ---------- */
function popover(boxEl, btn) {
  const set = on => { boxEl.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!boxEl.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!boxEl.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
choices(document.getElementById('mode'), v => setMode(v)).set(opts.mode);
choices(document.getElementById('persist'), v => { opts.persist = v; save('persist', v); wake(); }).set(opts.persist);
choices(document.getElementById('scan'), v => { opts.scan = v; save('scan', v); render(); wake(); }).set(opts.scan);
choices(document.getElementById('grid'), v => { opts.grid = v; save('grid', v); hudDirty = true; render(); wake(); }).set(opts.grid);
sliderEl.addEventListener('input', () => {
  if (opts.mode === 'active') { opts.range = +sliderEl.value; save('range', opts.range); clearAcc(); ring.on = false; }
  else { opts.span = +sliderEl.value; save('span', opts.span); if (cursorF > spanHz()) cursorF = -1; }
  hudDirty = true; render(); wake();
});
pingBtn.addEventListener('click', () => (opts.mode === 'active' ? ping() : knock()));
document.getElementById('shuffle').addEventListener('click', () => { shuffle(); clearAcc(); ring.on = false; render(); if (opts.mode === 'active') ping(); });
sound.onChange(on => { if (on) wake(); });

/* ---------- start ---------- */
shuffle();
syncSlider();
new ResizeObserver(() => resize()).observe(stage);
resize();
// Prime the waterfall so the sonogram opens full.
for (let i = 0; i < NROW; i++) { const tt = -NROW / ROW_HZ + i / ROW_HZ; stepSong(1 / ROW_HZ); stepProp(1 / ROW_HZ); makeRow(tt); }
render();
ready = true;
markReady();
requestAnimationFrame(() => canvas.classList.add('on'));
whenVisible(stage, v => { visible = v; if (v) wake(); else kit.rest(() => true); });
// The console boots once the intro has cleared, then pings once.
const introEl = document.querySelector('.intro');
if (!introEl) startBoot();
else new MutationObserver((_, mo) => { if (!document.querySelector('.intro')) { mo.disconnect(); startBoot(); } }).observe(document.body, { childList: true });
wake();
</script>
</body>
</html>
