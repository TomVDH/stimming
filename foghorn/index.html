<style>
/* Fog horn: a harbour mouth in thick fog and a bad sea. The horn calls a ship in out of the grey. */
:root { --stage: oklch(0.1 0.012 250); }
.stage--foghorn canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--foghorn canvas.on { opacity: 1; }
.stage--foghorn { cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .stage--foghorn canvas { transition: none; } }
</style>

<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Fog horn</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--foghorn" id="stage" tabindex="0" role="application" aria-label="A harbour mouth at night in thick fog and a heavy sea, seen through a wet window. Two lights flash on the breakwater. Click, or press H, to sound the fog horn. A ship answers and comes slowly out of the fog, lights first.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2.</p>
    </div>

  </section>
</div>
