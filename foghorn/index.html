{

<script type="module">
import { initPage, whenVisible, reduced, audioKit, stage as mark, pageReady } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import { environment } from '../shared/environment.js';
import { weather } from '../shared/weather.js';
import { skyAt } from '../shared/sky.js';
import { swellHeight } from '../shared/water.js';

const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);

playIntro({ ready: pageReady(9000) });
mark('build');

/* ---------- bar ---------- */
const HOURS = { dusk: 19.3, night: 23, dawn: 6.2 };
// The handlers bind once the scene exists.
const act = { time() {}, fog() {}, storm() {}, horn() {} };
const ui = initPage({ id: 'foghorn', bar: {
  choice: { label: 'Time', value: 'night', options: [
    { value: 'dusk', label: 'Dusk', key: '1' },
    { value: 'night', label: 'Night', key: '2' },
    { value: 'dawn', label: 'Dawn', key: '3' },
  ], onPick: v => act.time(v) },
  slider: { label: 'Fog', min: 0, max: 1, step: 0.01, value: 0.55, onInput: v => act.fog(v) },
  actions: [{ verb: 'horn', key: 'H', onPress: () => act.horn() }],
  settings: [
    { type: 'slider', id: 'storm', label: 'Storm', min: 0, max: 1, step: 0.01, value: 0.85, persist: true, onInput: v => act.storm(v) },
  ],
  quality: true,
  keys: [['click', 'sound the horn'], ['h', 'horn']],
} });

/* ---------- the scene ---------- */
// The eye stands 7 m over the water and looks out through the harbour mouth.
// The breakwater lies 600 m off; its two arms leave a 300 m gap.
const CAMH = 7, FOC = 1.5, HZ = 0.42;
// The scene is one function for shared/environment.js. Light does the work:
// the fog hides each shape, and its lamps show first.
const SCENE = `
uniform float uThick, uHorn, uSea;
// The ship rides the sea: heave in metres, pitch as a slope, roll in radians.
uniform vec3 uShipM;
uniform vec3 uFogGlow;
// The ship: its place on the water (x, z), then its heading.
uniform vec4 uShipA;
// Its lamps, 0 to 1; then 1 when its red side faces the eye.
uniform vec2 uShipK;
const float HZ = 0.42, FOC = 1.5, CAMH = 7.0, BW = 600.0, GAP = 150.0;
const vec3 CAM = vec3(0.0, CAMH, 0.0);
// The fog over the breakwater and over the ship, set once per pixel.
float gFogBW, gFogShip;
// The lens: a narrow frame takes a wider one, so both harbour lights stay in view.
float gFoc;

// The fog's own colour: the low sky that way, plus the harbour's glow at night.
vec3 fogCol(vec3 dir) { return skDusk(normalize(vec3(dir.x, 0.04, dir.z)), uSunD, uZen, uMid, uBand, uAnti) * 0.9 + uFogGlow; }
float fogAt(vec3 P) { return skHaze(CAM, P, uHazeD * uThick, 150.0); }
// The sky behind the fog.
vec3 skyFog(vec3 d) {
  // Thick fog hides the sky, so its stars and clouds are not worth their cost.
  float f = fogAt(CAM + d * 9000.0);
  if (f > 0.985) return fogCol(d);
  vec3 c = vec3(0.012, 0.015, 0.03);
  if (uSkyOn > 0.5) {
    c = skSky(d, uSunD, uZen, uMid, uBand, uAnti, uStars, uTime);
    vec4 cl = skCloudsN(d, uSunD, uTime, uCloud, uCloudLit, uCloudShade, 3);
    c = mix(c, cl.rgb, cl.a);
  }
  return mix(c, fogCol(d), f);
}
// One lamp at a world point: a small core, and a halo that the fog widens.
// k already holds the fog's dimming; f only sizes the halo.
vec3 lamp(vec2 uv, float asp, vec3 P, vec3 col, float k, float f) {
  vec2 at = vec2(0.5 + P.x / -P.z * gFoc / asp, HZ + (P.y - CAMH) / -P.z * gFoc);
  vec2 d = (uv - at) * vec2(asp, 1.0);
  float size = 0.06 + 0.45 * f;
  // Past this reach the halo adds nothing; most lamps stop here.
  if (abs(d.x) > size * 1.3 + 0.02 || abs(d.y) > size * 0.8 + 0.02) return vec3(0.0);
  float s = gFoc / -P.z;
  float core = exp(-dot(d, d) / (s * s * 2.0 + 3e-6));
  float halo = gwOrb(uv, at, asp, size) * (0.1 + 0.6 * f) * uOrbs;
  return col * k * (core * 6.0 + halo);
}
#define ON(u, v) (S0 + vec3(H.x * (u), (v) + uShipM.x + uShipM.y * (u), H.y * (u)))
// Every lamp in the scene. The water mirrors this, tap by tap.
vec3 lights(vec2 uv, float asp) {
  // The breakwater lights flash in turn; the horn holds them on.
  float pa = fract(uTime / 4.0), pb = fract(uTime / 4.0 + 0.5);
  float a = smoothstep(0.0, 0.03, pa) * smoothstep(0.28, 0.25, pa), b = smoothstep(0.0, 0.03, pb) * smoothstep(0.28, 0.25, pb);
  // Light reaches further through fog than a shape does.
  float far = pow(1.0 - gFogBW, 0.35);
  vec3 c = lamp(uv, asp, vec3(-GAP - 2.0, 12.5, -BW), vec3(0.1, 1.0, 0.45), max(a, uHorn) * (1.0 + uHorn) * far, gFogBW);
  c += lamp(uv, asp, vec3(GAP + 2.0, 12.5, -BW), vec3(1.0, 0.12, 0.08), max(b, uHorn) * (1.0 + uHorn) * far, gFogBW);
  if (uShipK.x > 0.0) {
    vec2 H = uShipA.zw;
    vec3 S0 = vec3(uShipA.x, 0.0, uShipA.y), white = vec3(1.0, 0.95, 0.85), warm = vec3(1.0, 0.72, 0.4);
    float f = gFogShip, k = uShipK.x * pow(1.0 - f, 0.35);
    // Her own lamp list: two mastheads, a side light, the stern, the bridge,
    // a flood on each crane, and the bow spot.
    vec3 flood = vec3(1.0, 0.85, 0.63);
    c += lamp(uv, asp, ON(-76.7, 29.6), white, k, f);
    c += lamp(uv, asp, ON(95.7, 14.5), white, k * 0.9, f);
    c += lamp(uv, asp, ON(-70.6, 18.7), uShipK.y > 0.5 ? vec3(1.0, 0.1, 0.06) : vec3(0.08, 1.0, 0.4), k * 0.8, f);
    c += lamp(uv, asp, ON(-100.3, 4.9), white, k * 0.3, f);
    c += lamp(uv, asp, ON(-69.4, 17.0), warm, k * 0.5, f);
    c += lamp(uv, asp, ON(-34.2, 22.3), flood, k * 0.28, f);
    c += lamp(uv, asp, ON(-2.5, 22.3), flood, k * 0.28, f);
    c += lamp(uv, asp, ON(29.3, 22.3), flood, k * 0.28, f);
    c += lamp(uv, asp, ON(60.9, 22.3), flood, k * 0.28, f);
    c += lamp(uv, asp, ON(99.2, 9.4), vec3(0.98, 0.85, 0.57), k * 0.35, f);
  }
  return c;
}
// The KS Vlootzak, from two baked pictures of the model: her port side and her bow.
// Each runs from 9.5 m under her waterline to 36.5 m over it, at 9.48 pixels a metre.
// q.x is metres toward the bow from midship; q.y is metres over her waterline.
// lod picks the mip by hand: the hit test breaks the automatic choice at her edges.
uniform sampler2D tSide, tEnd;
vec4 sidePic(vec2 q, float lod) {
  // The bow is at the left of the picture.
  vec4 c = textureLod(tSide, vec2((109.85 - q.x) / 216.0, (q.y + 9.5) / 46.0), lod);
  return vec4(c.rgb / max(c.a, 1e-3), c.a);
}
vec4 endPic(vec2 q, float lod) {
  vec4 c = textureLod(tEnd, vec2(q.x / 36.0 + 0.5, (q.y + 9.5) / 46.0), lod);
  return vec4(c.rgb / max(c.a, 1e-3), c.a);
}
// Her paint at night is near black. Her floods light the deck and the gear under them.
vec3 shipLit(vec3 paint, vec2 q) {
  float pool = exp(-dot(q - vec2(-69.9, 15.6), q - vec2(-69.9, 15.6)) / 110.0);
  for (int i = 0; i < 4; i++) {
    vec2 v = q - vec2(i == 0 ? -34.2 : i == 1 ? -2.5 : i == 2 ? 29.3 : 60.9, 22.3);
    pool += exp(-v.x * v.x / 170.0 - min(v.y, 0.0) * min(v.y, 0.0) / 230.0) * step(v.y, 2.0);
  }
  vec3 air = vec3(0.012) + uDay * 0.3 * (uZen + uMid + vec3(0.25));
  return paint * (air + vec3(1.0, 0.85, 0.63) * 0.3 * pool * uShipK.x);
}
// Where a ray from o meets the ship's upright plane.
bool shipHit(vec3 o, vec3 d, out vec2 q, inout float dist) {
  vec2 H = uShipA.zw;
  vec3 N = vec3(H.y, 0.0, -H.x);
  float dn = dot(d, N);
  if (abs(dn) < 1e-5) return false;
  float t = dot(vec3(uShipA.x, o.y, uShipA.y) - o, N) / dn;
  if (t <= 0.0) return false;
  dist = t;
  vec3 P = o + d * t;
  q = vec2(dot(P.xz - uShipA.xy, H), P.y);
  // She heaves and pitches; her hull goes 8 m under her own waterline.
  q.y -= uShipM.x + uShipM.y * q.x;
  return q.y >= -9.5 && q.y < 36.5 && q.x > -106.0 && q.x < 109.8;
}
// Where it meets the plane across her beam, a little forward of midship.
bool endHit(vec3 o, vec3 d, out vec2 q, inout float dist) {
  vec2 H = uShipA.zw, C = uShipA.xy + H * 30.0;
  float dn = dot(d.xz, H);
  if (abs(dn) < 1e-5) return false;
  float t = dot(C - o.xz, H) / dn;
  if (t <= 0.0) return false;
  vec3 P = o + d * t;
  q = vec2(dot(P.xz - C, vec2(-H.y, H.x)), P.y - uShipM.x - uShipM.y * 30.0);
  // Seen end on, she rolls.
  float cr = cos(uShipM.z), sr = sin(uShipM.z);
  q = vec2(cr * q.x + sr * q.y, cr * q.y - sr * q.x);
  if (q.y < -9.5 || q.y > 36.5 || abs(q.x) > 18.0) return false;
  dist = t;
  return true;
}
// The breakwater: two low arms, a short tower at the end of each.
bool wallHit(vec3 d) {
  if (d.z > -1e-4) return false;
  vec3 P = CAM + d * (BW / -d.z);
  float ax = abs(P.x);
  return P.y >= 0.0 && ((ax > GAP && P.y < 5.0) || (abs(ax - GAP - 2.0) < 2.0 && P.y < 12.0));
}
// The sea hits the quay under the window: a wall of spray climbs into view and falls back.
vec3 quaySpray(vec2 uv, float asp, vec3 c, vec3 d) {
  float beat = uTime / 9.0, n = floor(beat), ph = fract(beat) * 9.0;
  // Three waves in four break high enough to see.
  if (uSea <= 0.0 || grH(vec2(n, 2.0)) > 0.75 || ph > 4.2) return c;
  float x = (uv.x - 0.12 - 0.76 * grH(vec2(n, 9.0))) * asp / (0.2 + 0.22 * grH(vec2(n, 4.0)));
  // It goes up fast and sags slowly.
  float rise = ph < 1.1 ? sin(1.5708 * ph / 1.1) : 1.0 - 0.4 * (ph - 1.1) / 3.1;
  float top = (0.28 + 0.3 * grH(vec2(n, 6.0))) * rise * uSea * exp(-x * x);
  float nz = 0.5 * wtNoised(vec2(uv.x * asp * 6.0, uv.y * 5.0 - uTime * 1.4)).x + 0.5 * wtNoised(vec2(uv.x * asp * 17.0, uv.y * 14.0 - uTime * 2.6)).x;
  float dens = smoothstep(top, top * 0.2, uv.y + (nz - 0.5) * 0.14) * clamp(1.0 - (ph - 1.1) / 3.1, 0.0, 1.0) * (0.5 + 0.7 * nz);
  return mix(c, (fogCol(d) + vec3(0.035)) * 2.4, clamp(dens * uSea, 0.0, 0.9));
}
vec3 envScene(vec2 uv) {
  float asp = uRes.x / uRes.y;
  gFoc = FOC * min(1.0, asp / 1.2);
  vec3 d = normalize(vec3((uv.x - 0.5) * asp, uv.y - HZ, -gFoc));
  gFogBW = fogAt(vec3(GAP, 6.0, -BW));
  gFogShip = fogAt(vec3(uShipA.x, 12.0, uShipA.y));
  vec3 c;
  if (d.y >= 0.0) c = skyFog(d);
  else {
    // water.js: waves tilt the mirror; the fog swallows the far water.
    float dist = CAMH / -d.y;
    vec2 p = d.xz * dist;
    // A bad sea stands up: the ray meets the swell's own height, not a flat plane.
    // Two steps find it; near the horizon the plane is close enough.
    float lift = uSea * smoothstep(0.015, 0.1, -d.y), high = 0.0;
    if (lift > 0.0) {
      for (int i = 0; i < 2; i++) {
        high = wtSwell(p, uTime, 0.0, uSwell).z * lift;
        dist = (CAMH - high) / -d.y;
        p = d.xz * dist;
      }
    }
    float sig2, foot = wtFoot(dist, -d.y, uRes.y * gFoc);
    vec2 slope = wtWavesN(p, uTime, foot, uSwell, uChop, uSets, uOct, sig2);
    slope += wtRingsN(p, uTime, foot, uRings, 0.6, uRingN, sig2);
    vec3 n = wtNormal(slope);
    vec3 r = reflect(d, n);
    r.y = abs(r.y);
    float F = wtFresnel(d, n), rz = max(-r.z, 0.05);
    vec2 ur = vec2(0.5 + r.x / rz * gFoc / asp, HZ + r.y / rz * gFoc);
    // The sky mirrors once; each lamp smears into a tall streak.
    float len = 2.0 * sqrt(sig2) * gFoc, ws = 0.0;
    vec3 refl = vec3(0.0);
    for (int i = -3; i <= 3; i++) {
      if (abs(i) > uTapN) continue;
      float fi = float(i) / float(uTapN), w = exp(-fi * fi * 2.0);
      vec2 at = ur + vec2(0.0, fi * len);
      at.y = HZ + abs(at.y - HZ);
      refl += lights(at, asp) * w;
      ws += w;
    }
    refl = refl / ws + skyFog(r);
    // The hull stands in the mirror as a dark shape; the ripples blur its edge.
    if (uShipK.x > 0.0) {
      vec3 Pw = vec3(p.x, 0.0, p.y);
      vec2 qm = vec2(0.0);
      float dm = 1.0, shade = 0.0, soft = 1.0 + 40.0 * sqrt(sig2);
      if (shipHit(Pw, r, qm, dm)) shade = sidePic(qm, 3.0 + soft * 0.4).a;
      if (endHit(Pw, r, qm, dm)) shade = max(shade, endPic(qm, 3.0 + soft * 0.4).a);
      refl *= 1.0 - 0.85 * shade * (1.0 - gFogShip);
    }
    c = mix(mix(vec3(0.004, 0.008, 0.012), vec3(0.02, 0.07, 0.1), uDay), refl, F);
    // A bad sea: foam on the crests, as bright as the fog round it.
    if (uSea > 0.0) {
      float tall = (lift > 0.0 ? high / lift : wtSwell(p, uTime, 0.0, uSwell).z) / max(uSwell * 16.0, 0.05);
      // The troughs lie in shadow; the crests stand in the fog's light.
      c *= 1.0 + 0.3 * uSea * clamp(tall, -1.0, 1.0);
      // Foam only on the highest crests, torn into streaks along them.
      float crest = tall + (wtNoised(p * 0.3 + vec2(uTime * 0.25, 0.0)).x - 0.5) * 0.9;
      float torn = smoothstep(0.38, 0.8, wtNoised(p * vec2(0.5, 1.7) + vec2(uTime * 0.4, 0.0)).x);
      float foam = smoothstep(0.7, 1.25, crest) * torn * uSea * (1.0 - smoothstep(0.5, 2.5, foot));
      c = mix(c, (fogCol(d) + vec3(0.025)) * 2.0, foam * 0.7);
    }
    c = mix(c, fogCol(d), fogAt(vec3(p.x, 0.0, p.y)));
  }
  // The shapes on the water, far to near. Each is one dark tone under the fog.
  vec3 dark = mix(vec3(0.006, 0.007, 0.009), vec3(0.05, 0.06, 0.07), uDay);
  vec2 q = vec2(0.0);
  float dist = 1.0, cover = 0.0;
  bool behind = uShipA.y < -BW;
  vec3 hull = c;
  if (uShipK.x > 0.0) {
    // The side picture and the bow picture cross; the eye takes whichever shows more.
    if (shipHit(CAM, d, q, dist)) {
      vec3 P = CAM + d * dist;
      vec4 pic = sidePic(q, log2(max(dist / (gFoc * uRes.y) * 9.48, 1.0)));
      // The sea climbs and falls along her side.
      cover = pic.a * smoothstep(-0.4, 0.4, P.y - wtSwell(P.xz, uTime, 0.0, uSwell).z);
      hull = mix(shipLit(pic.rgb, q), fogCol(d), fogAt(P));
    }
    if (endHit(CAM, d, q, dist)) {
      vec3 P = CAM + d * dist;
      vec4 pic = endPic(q, log2(max(dist / (gFoc * uRes.y) * 9.48, 1.0)));
      float end = pic.a * smoothstep(-0.4, 0.4, P.y - wtSwell(P.xz, uTime, 0.0, uSwell).z);
      if (end > cover) {
        cover = end;
        hull = mix(pic.rgb * (vec3(0.012) + uDay * 0.3 * (uZen + uMid + vec3(0.25))), fogCol(d), fogAt(P));
      }
    }
  }
  if (behind) c = mix(c, hull, cover);
  if (wallHit(d)) c = mix(dark, fogCol(d), gFogBW);
  // The sea breaks over the breakwater: plumes of spray climb and fall back.
  if (uSea > 0.0 && d.z < -1e-4) {
    vec3 P = CAM + d * (BW / -d.z);
    if (abs(P.x) > GAP + 6.0 && P.y > 0.0 && P.y < 44.0) {
      float cell = floor(P.x / 46.0), beat = uTime / 9.0 + grH(vec2(cell, 5.0)) * 9.0, ph = fract(beat) / 0.32;
      if (ph < 1.0) {
        float top = (10.0 + 26.0 * grH(vec2(cell, floor(beat)))) * sin(3.1416 * sqrt(ph)), fx = (fract(P.x / 46.0) - 0.5) * 46.0;
        float puff = smoothstep(top, top * 0.3, P.y) * exp(-fx * fx / 110.0) * (1.0 - ph) * (0.5 + wtNoised(vec2(P.x * 0.22, P.y * 0.25 - uTime * 2.2)).x);
        c = mix(c, mix((fogCol(d) + vec3(0.04)) * 2.4, fogCol(d), gFogBW * 0.45), clamp(puff * uSea * 1.3, 0.0, 0.9));
      }
    }
  }
  if (!behind) c = mix(c, hull, cover);
  return quaySpray(uv, asp, c + lights(uv, asp), d);
}`;

/* ---------- state ---------- */
let fog = 0.55, storm = 0.85, visible = true, simT = 0, hornEnd = -1, hornK = 0, lastHorn = -10;
// The ship: its place along the path, in waypoints, and when it answers.
let ship = null;
const shipA = [0, -3000, -1, 0], shipK = [0, 0], shipM = [0, 0, 0];
// The fog's density gain: 1 is a clear night, 12 is pea soup.
const thick = () => 1 + 11 * fog * fog;

const canvas = document.createElement('canvas');
stage.prepend(canvas);
let env = null;
try {
  env = environment(canvas, {
    scene: SCENE,
    active: () => visible,
    onFrame: raw => step(Math.min(raw, 0.05)),
    // Two small pictures of the ship, baked from the model.
    textures: { tSide: 'vlootzak-side.webp', tEnd: 'vlootzak-end.webp' },
    uniforms: {
      uThick: thick,
      uHorn: () => hornK,
      // The harbour lights the fog a little at night.
      uFogGlow: () => { const k = 1 - skyAt(env.state.hour).day; return [0.03 * k, 0.034 * k, 0.042 * k]; },
      uShipA: () => shipA,
      uShipK: () => shipK,
      uShipM: () => shipM,
      uSea: () => storm,
    },
  });
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  ui.hideControls?.();
  mark('first-frame');
  throw err;
}
const S = env.state;
// An overcast harbour: calm water, heavy cloud, a strong bloom on every lamp.
Object.assign(S, { hour: HOURS.night, clouds: 0.95, stars: 0.3, haze: 1, bloom: 0.55, thr: 0.7, orbs: 1, vig: 0.55, grain: 0.05, expo: 1.1, defocus: 0, zoom: 1, flGain: 0, flSize: 0.6 });
S.lightColor = [0, 0, 0];
// No window frame shows, so the pane has no cold rim.
S.frame = false;
function apply() {
  // The storm drives the rain, the wind and the sea; fog also mists the glass.
  // The pane takes less than the full gale, so the view stays readable.
  // At full storm the swell stands about 5 m from trough to crest.
  const w = weather(storm);
  Object.assign(S, { wet: 0.45 + 0.45 * storm, wind: 2.5 + 5.5 * storm, rings: w.rings * 0.6, air: w.air, swell: 0.008 + 0.1 * storm, chop: 0.1 + 0.26 * storm, sets: 0.3 + 0.5 * storm, fog: 0.1 + 0.35 * fog, patch: 0.2 + 0.4 * fog });
  S.on.air = storm > 0.05;
  tuneSea();
  env.touch();
}

/* ---------- the ship ---------- */
// The KS Vlootzak comes in bow-on from the sea, through the mouth, then turns to port and crosses close in front.
// At 150 m her 204 m side is far wider than the view. The whole pass takes about five minutes.
const WAY = [[80, -1150], [45, -900], [30, -640], [85, -400], [50, -215], [-150, -156], [-340, -150]];
const LAST = WAY.length - 1;
// A smooth curve through the waypoints: k 0 is x, k 1 is z; d true gives the slope.
function way(t, k, d = false) {
  const i = Math.min(LAST - 1, Math.floor(t)), u = t - i;
  const p0 = WAY[Math.max(0, i - 1)][k], p1 = WAY[i][k], p2 = WAY[i + 1][k], p3 = WAY[Math.min(LAST, i + 2)][k];
  const a = -p0 + 3 * p1 - 3 * p2 + p3, b = 2 * p0 - 5 * p1 + 4 * p2 - p3, c = p2 - p0;
  return d ? 0.5 * (3 * a * u * u + 2 * b * u + c) : 0.5 * (a * u * u * u + b * u * u + c * u + 2 * p1);
}
function placeShip() {
  const x = way(ship.t, 0), z = way(ship.t, 1), dx = way(ship.t, 0, true), dz = way(ship.t, 1, true), l = Math.hypot(dx, dz);
  shipA[0] = x; shipA[1] = z; shipA[2] = dx / l; shipA[3] = dz / l;
  shipK[0] = 1;
  // Its port side shows red when that side faces the eye.
  shipK[1] = -x * shipA[3] + z * shipA[2] > 0 ? 1 : 0;
  // The aft masthead light is the key light: it flares, and it lights the drops.
  const mx = x - 76.7 * shipA[2], mz = z - 76.7 * shipA[3], asp = canvas.clientWidth / Math.max(1, canvas.clientHeight);
  // The same lens as the scene: wider on a narrow frame.
  const foc = FOC * Math.min(1, asp / 1.2);
  S.light[0] = 0.5 + mx / -mz * foc / asp;
  S.light[1] = HZ + (29.6 - CAMH) / -mz * foc;
  const seen = Math.exp(-0.35 * Math.hypot(mx, mz) * S.haze * 0.0008 * thick() * 0.95);
  S.lightColor = [1.0 * seen, 0.95 * seen, 0.85 * seen];
  // The flare's streak keeps a cool tint of its own, so its gain follows the light too.
  // It fades as the light leaves the frame.
  S.flGain = 0.28 * Math.min(1, seen * 3) * clamp(1 - (Math.abs(S.light[0] - 0.5) - 0.5) / 0.12);
  return l;
}
// The swell under her bow, her stern and her two sides, in metres.
function rideSea(dt) {
  const [x, z, hx, hz] = shipA, t = env.clock.time, a = S.swell;
  const at = (u, v) => swellHeight(x + hx * u - hz * v, z + hz * u + hx * v, t, a);
  const bow = at(85, 0), stern = at(-85, 0), mid = at(0, 0);
  // A 204 m hull rides over the short waves; she answers the long ones, and late.
  const k = 1 - Math.exp(-dt / 1.6);
  shipM[0] += ((bow + stern + mid) / 3 * 0.8 - shipM[0]) * k;
  shipM[1] += ((bow - stern) / 170 - shipM[1]) * k;
  shipM[2] += ((at(0, 16) - at(0, -16)) / 32 * 1.3 - shipM[2]) * k;
}
function dropShip() {
  ship = null;
  shipK[0] = 0;
  S.lightColor = [0, 0, 0];
  S.flGain = 0;
}
function step(dt) {
  simT += dt;
  hornK += ((simT < hornEnd ? 1 : 0) - hornK) * (1 - Math.exp(-dt / 0.15));
  if (!ship) return;
  if (!ship.answered && simT >= ship.answerAt) { ship.answered = true; shipHorn(clamp(shipA[0] / 400, -1, 1)); }
  // She creeps in at under five knots: about 2.4 m/s. Far off, the lens hides more speed.
  const speed = clamp(-shipA[1] / 80, 2.4, 8);
  ship.t += speed * dt / placeShip();
  rideSea(dt);
  // It is gone once its stern leaves the frame.
  if (ship.t >= LAST) dropShip();
}

/* ---------- sound ---------- */
const kit = audioKit({ keys: new Set(['h', 'H', ' ', 'Enter']), noiseSeconds: 2 });
let wash = null;
// The sea and the wind grow with the storm.
function tuneSea() {
  const ac = kit.ac;
  if (!wash || !ac) return;
  wash.g.gain.setTargetAtTime(0.06 + 0.1 * storm, ac.currentTime, 0.4);
  wash.wg.gain.setTargetAtTime(0.05 * storm, ac.currentTime, 0.4);
}
// The sea: low noise that swells and ebbs. The wind: a band of noise that gusts.
function startWash() {
  const ac = kit.live();
  if (!ac || wash || !kit.noise) return;
  const src = ac.createBufferSource(), lp = ac.createBiquadFilter(), g = ac.createGain(), lfo = ac.createOscillator(), depth = ac.createGain();
  src.buffer = kit.noise;
  src.loop = true;
  lp.type = 'lowpass';
  lp.frequency.value = 420;
  g.gain.value = 0;
  lfo.frequency.value = 0.13;
  depth.gain.value = 0.035;
  lfo.connect(depth).connect(g.gain);
  src.connect(lp).connect(g).connect(kit.out);
  // The wind: the same noise through a narrow band; a slow wobble moves its pitch.
  const bp = ac.createBiquadFilter(), wg = ac.createGain(), gust = ac.createOscillator(), sweep = ac.createGain();
  bp.type = 'bandpass';
  bp.frequency.value = 520;
  bp.Q.value = 1.6;
  wg.gain.value = 0;
  gust.frequency.value = 0.09;
  sweep.gain.value = 180;
  gust.connect(sweep).connect(bp.frequency);
  src.connect(bp).connect(wg).connect(kit.out);
  src.start();
  lfo.start();
  gust.start();
  wash = { src, lfo, gust, g, wg };
  tuneSea();
}
function stopWash() {
  if (!wash) return;
  try { wash.src.stop(); wash.lfo.stop(); wash.gust.stop(); } catch (err) { /* The context closed first. */ }
  wash = null;
}
// One horn blast: two reeds a little apart, a slow start, and a drop in pitch at the end.
// The echo comes back off the breakwater.
function blast(freqs, dur, { cut = 700, gain = 0.5, pan = 0, grunt = 0.76 } = {}) {
  const ac = kit.live();
  if (!ac) return;
  const t = ac.currentTime + 0.02, lp = ac.createBiquadFilter(), g = ac.createGain(), pn = ac.createStereoPanner();
  lp.type = 'lowpass';
  lp.frequency.value = cut;
  lp.Q.value = 0.8;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.18);
  g.gain.setValueAtTime(gain, t + dur - 0.35);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.25);
  pn.pan.value = pan;
  for (const f of freqs) for (const det of [-5, 6]) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f, t);
    o.frequency.setValueAtTime(f, t + dur - 0.3);
    o.frequency.exponentialRampToValueAtTime(f * grunt, t + dur + 0.05);
    o.detune.value = det;
    o.connect(lp);
    o.start(t);
    o.stop(t + dur + 0.4);
  }
  const echo = ac.createDelay(2), back = ac.createGain(), dull = ac.createBiquadFilter();
  echo.delayTime.value = 0.85;
  back.gain.value = 0.28;
  dull.type = 'lowpass';
  dull.frequency.value = 380;
  lp.connect(g).connect(pn).connect(kit.out);
  g.connect(echo).connect(dull).connect(back).connect(pn);
  back.connect(echo);
}
// The ship answers from the fog: lower, longer and dull.
function shipHorn(pan) { blast([62, 93], 3.4, { cut: 260, gain: 0.42, pan, grunt: 0.9 }); }

/* ---------- the horn ---------- */
function horn() {
  // One blast at a time.
  if (simT - lastHorn < 3 && !reduced()) return;
  lastHorn = simT;
  kit.wake();
  startWash();
  blast([174, 220], 2.3);
  hornEnd = simT + 2.4;
  if (reduced()) {
    // With motion off, the horn puts the ship in the mouth, or takes it away.
    if (ship) dropShip();
    else { ship = { t: 4.7, answered: true, answerAt: 0 }; placeShip(); shipHorn(0); }
    hornK = 0;
  } else if (!ship) {
    ship = { t: 0, answered: false, answerAt: simT + 4 };
    placeShip();
  } else if (ship.t < LAST - 1) {
    // A ship already under way answers again.
    ship.answered = false;
    ship.answerAt = simT + 3;
  }
  env.touch();
}
act.horn = horn;
act.time = v => { S.hour = HOURS[v]; env.touch(); };
act.fog = v => { fog = v; apply(); };
act.storm = v => { storm = v; apply(); };
storm = ui.setting('storm')?.value ?? storm;
apply();

canvas.addEventListener('pointerdown', e => { if (e.button === 0) horn(); });
stage.addEventListener('keydown', e => {
  if (e.target !== stage || (e.key !== ' ' && e.key !== 'Enter')) return;
  e.preventDefault();
  horn();
});

/* ---------- start ---------- */
// QA can start with the ship on its way: ?ship=4.5 puts it at that waypoint.
const qs = new URLSearchParams(location.search);
if (qs.has('ship')) { ship = { t: clamp(+qs.get('ship'), 0, LAST - 0.01), answered: true, answerAt: 0 }; placeShip(); }
env.draw();
canvas.classList.add('on');
mark('first-frame');
// A hidden tab stops the loop, the sea and the clock.
whenVisible(stage, v => {
  visible = v;
  if (v) { env.touch(); return; }
  stopWash();
  kit.rest(() => true);
});
</script>
</body>
