<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.008 250); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chromatography</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./sim.js">
<link rel="modulepreload" href="./paper.js">
<link rel="modulepreload" href="./render.js">
<link rel="modulepreload" href="./sound.js">
<link rel="modulepreload" href="../shared/detail.js">
<link rel="modulepreload" href="../shared/gl.js">
<style>
/* Chromatography: filter paper on slate; tap for ink and water. */
:root { --stage: oklch(0.16 0.008 250); }
.stage--chromatography { background: var(--stage); }
.stage--chromatography canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  touch-action: none;
}
.stage--chromatography canvas.cg-sheet { opacity: 0; transition: opacity 0.8s ease; }
.stage--chromatography canvas.cg-sheet.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--chromatography canvas.cg-sheet { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Chromatography</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--chromatography" id="stage" tabindex="0" role="application" aria-label="A round sheet of white filter paper on a dark slate bench, lit from the upper left, with two dried rings of separated ink on it. Tap the paper to put down a dot of marker ink and a drop of water on it. The water creeps out through the fibres as a grey, damp ring, and the ink parts into soft rings of violet, magenta, cyan and yellow, each at its own speed. The paper then dries to matt. Hold to keep the water coming. Each tap takes another ink. Press Space for a drop at a clear place, and N for a clean sheet. The Water slider sets how much water each drop gives.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Chromatography</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
