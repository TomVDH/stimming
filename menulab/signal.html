function fitTitle() {
  titleEl.style.removeProperty('--title-fit');
  const maxW = titleBoxEl.clientWidth;
  if (!maxW) return;
  if (mode === 'dial') {
    // Keep one consistent title size across toys (balanced 1-2 lines); only scale down if an unbroken word or 3rd line overflows.
    let basePx = parseFloat(d.defaultView.getComputedStyle(titleEl).fontSize) || 32;
    const maxH = basePx * 2.35;
    let guard = 0;
    while ((titleEl.scrollWidth > maxW + 1 || titleEl.scrollHeight > maxH) && basePx > 16 && guard++ < 14) {
      basePx = Math.max(16, basePx - 1.5);
      titleEl.style.setProperty('--title-fit', `${basePx}px`);
    }
    return;
  }
  const sw = titleEl.scrollWidth;
  if (sw > maxW) {
    const basePx = parseFloat(d.defaultView.getComputedStyle(titleEl).fontSize) || 40;
    const fitted = Math.max(15, Math.floor(basePx * (maxW / sw) * 0.98));
    titleEl.style.setProperty('--title-fit', `${fitted}px`);
  }
}

// Generous, fuzzy, softly masked CRT spotlight per layout.
function updateCRTSpot(snap = false) {
  if (!crt) return;
  const w = app.clientWidth || 1, h = app.clientHeight || 1;
  const minD = Math.min(w, h);
  let x = 0.5, y = 0.46, rad = minD * 0.58, ellip = 1.08, aimOn = 0;

  if (mode === 'dial') {
    const r = dialWrap.getBoundingClientRect();
    x = r.width ? (r.left + r.width / 2) / w : 0.5;
    y = r.width ? (r.top + r.height / 2) / h : 0.5;
    rad = (r.width || minD * 0.72) * 0.60;
    ellip = 1.0;
    aimOn = 1;
  } else if (mode === 'strip') {
    const r = trackWrap.getBoundingClientRect();
    x = 0.5; y = r.height ? (r.top + r.height * 0.56) / h : 0.44;
    rad = minD * 0.62; ellip = 1.28;
  } else if (mode === 'rail') {
    x = 0.56; y = 0.38; rad = minD * 0.64; ellip = 1.24;
  } else if (mode === 'console') {
    x = w < 860 ? 0.5 : 0.24; y = 0.5; rad = minD * 0.62; ellip = 0.98;
  } else if (mode === 'magnify') {
    const actCell = deckEl.querySelector('.sm-cell.is-act');
    const r = actCell?.getBoundingClientRect();
    x = r?.width ? (r.left + r.width / 2) / w : 0.5;
    y = 0.46; rad = minD * 0.56; ellip = 1.15;
  } else if (mode === 'orbit') {
    const r = deckEl.getBoundingClientRect();
    x = 0.5; y = r.height ? (r.top + r.height * 0.56) / h : 0.42;
    rad = minD * 0.58; ellip = 1.3;
  } else if (mode === 'folio') {
    const r = singleIconHost.getBoundingClientRect();
    x = r.width ? (r.left + r.width * 0.55) / w : 0.68;
    y = r.height ? (r.top + r.height * 0.65) / h : 0.46;
    rad = minD * 0.56; ellip = 1.08;
  } else if (mode === 'prism') {
    const actCell = deckEl.querySelector('.sm-cell.is-act');
    const r = actCell?.getBoundingClientRect();
    x = r?.width ? (r.left + r.width / 2) / w : 0.66;
    y = r?.height ? (r.top + r.height / 2) / h : 0.5;
    rad = minD * 0.48; ellip = 1.05;
  } else if (mode === 'reel') {
    x = 0.67; y = 0.48; rad = minD * 0.56; ellip = 1.14;
  } else if (mode === 'oblique') {
    x = 0.30; y = 0.46; rad = minD * 0.58; ellip = 1.08;
  } else if (mode === 'type') {
    const r = singleIconHost.getBoundingClientRect();
    x = r.width ? (r.left + r.width / 2) / w : 0.72;
    y = r.height ? (r.top + r.height / 2) / h : 0.46;
    rad = minD * 0.54;
  } else {
    x = 0.5; y = 0.44; rad = minD * 0.58; ellip = 1.14;
  }
  crt.setSpot(x, y, rad, { ellip, aimOn, snap });
}

/* ---------- Magnify spring wave ---------- */
const magState = Array.from({ length: SIZE }, () => ({ s: 1, y: 0, x: 0, ts: 1, ty: 0, tx: 0 }));
let magRaf = 0;

function setMagnifyTargets(clientX) {
  const cells = [...deckEl.querySelectorAll('.sm-cell')];
  if (!cells.length) return;
  if (clientX == null || still.matches) {
    magState.forEach(m => { m.ts = 1; m.ty = 0; m.tx = 0; });
  } else {
    const rects = cells.map(c => c.getBoundingClientRect());
    const sigma = Math.max(85, (rects[0]?.width || 72) * 1.9);
    cells.forEach((_, i) => {
      const cx = rects[i].left + rects[i].width / 2;
      const dx = cx - clientX;
      const g = Math.exp(-(dx * dx) / (2 * sigma * sigma));
      magState[i].ts = 1 + 0.68 * g;
      magState[i].ty = -26 * g;
      magState[i].tx = Math.sign(dx) * 16 * g * (1 - g);
    });
  }
  wakeMagnify();
}

function wakeMagnify() {
  if (magRaf || mode !== 'magnify') return;
  const tick = () => {
    magRaf = 0;
    if (mode !== 'magnify') return;
    const cells = deckEl.querySelectorAll('.sm-cell');
    let moving = false;
    cells.forEach((cell, i) => {
      const m = magState[i];
      if (!m) return;
      m.s += (m.ts - m.s) * 0.24;
      m.y += (m.ty - m.y) * 0.24;
      m.x += (m.tx - m.x) * 0.24;
      if (Math.abs(m.ts - m.s) + Math.abs(m.ty - m.y) + Math.abs(m.tx - m.x) > 0.015) moving = true;
      else { m.s = m.ts; m.y = m.ty; m.x = m.tx; }
      cell.style.setProperty('--ms', m.s.toFixed(4));
      cell.style.setProperty('--my', `${m.y.toFixed(1)}px`);
      cell.style.setProperty('--mx', `${m.x.toFixed(1)}px`);
      cell.style.setProperty('--mz', String(Math.round(m.s * 10)));
    });
    if (moving) magRaf = requestAnimationFrame(tick);
  };
  magRaf = requestAnimationFrame(tick);
}

/* ---------- Orbit 3D planetary ring ---------- */
const orbit = { angle: 0, dragging: false, startX: 0, startAng: 0, moved: false };

function renderOrbit() {
  if (mode !== 'orbit') return;
  const cells = deckEl.querySelectorAll('.sm-cell');
  const r = deckEl.getBoundingClientRect();
  const rx = Math.min((r.width || 720) * 0.44, 420);
  const ry = Math.min((r.height || 260) * 0.38, 146);
  const tilt = 0.16;
  cells.forEach((cell, i) => {
    const a = (i * 2 * Math.PI / SIZE) - orbit.angle;
    const x0 = Math.sin(a) * rx;
    const z = Math.cos(a);
    const y0 = z * ry * 0.84;
    const x = x0;
    const y = y0 + x0 * Math.sin(tilt) * 0.18;
    const depth = (z + 1) * 0.5;
    const sc = 0.40 + 0.84 * Math.pow(depth, 1.48);
    const op = 0.22 + 0.78 * Math.pow(depth, 1.35);
    const blur = depth < 0.42 ? (0.42 - depth) * 3.8 : 0;
    cell.style.setProperty('--ox', `${x.toFixed(1)}px`);
    cell.style.setProperty('--oy', `${y.toFixed(1)}px`);
    cell.style.setProperty('--os', sc.toFixed(3));
    cell.style.setProperty('--oo', op.toFixed(3));
    cell.style.setProperty('--ob', `${blur.toFixed(2)}px`);
    cell.style.setProperty('--oz', String(Math.round(depth * 100)));
  });
}

function spinOrbitTo(idx, snap = false) {
  if (mode !== 'orbit' || idx < 0) return;
  const target = idx * 2 * Math.PI / SIZE;
  const delta = Math.atan2(Math.sin(target - orbit.angle), Math.cos(target - orbit.angle));
  const dest = orbit.angle + delta;
  if (snap || !gsap || still.matches) {
    orbit.angle = dest;
    renderOrbit();
  } else {
    gsap.to(orbit, { angle: dest, duration: 0.58, ease: 'expo.out', overwrite: true, onUpdate: renderOrbit });
  }
}

/* ---------- Reel vertical curved drum ---------- */
function updateReel(actIdx) {
  if (mode !== 'reel') return;
  const r = deckEl.getBoundingClientRect();
  const stepY = Math.min(92, Math.max(66, (r.height || 520) * 0.165));
  deckEl.querySelectorAll('.sm-cell').forEach((cell, i) => {
    let diff = i - actIdx;
    if (diff > SIZE / 2) diff -= SIZE;
    if (diff < -SIZE / 2) diff += SIZE;
    const prev = prevDiffs.get(cell);
    const wrapped = prev !== undefined && Math.abs(diff - prev) > 3;
    prevDiffs.set(cell, diff);

    const abs = Math.abs(diff);
    if (wrapped) cell.classList.add('is-snap');
    cell.style.setProperty('--ry', `${(diff * stepY).toFixed(1)}px`);
    cell.style.setProperty('--rx', `${(abs * abs * -7).toFixed(1)}px`);
    cell.style.setProperty('--rs', abs === 0 ? '1.16' : abs === 1 ? '0.78' : abs === 2 ? '0.56' : '0.35');
    cell.style.setProperty('--ro', abs === 0 ? '1' : abs === 1 ? '0.7' : abs === 2 ? '0.34' : '0');
    cell.style.setProperty('--pe', abs <= 2 ? 'auto' : 'none');
    if (wrapped) { void cell.offsetWidth; cell.classList.remove('is-snap'); }
  });
}

function updateStrip(actIdx) {
  if (mode !== 'strip') return;
  deckEl.querySelectorAll('.sm-cell').forEach((cell, i) => {
    let diff = i - actIdx;
    if (diff > SIZE / 2) diff -= SIZE;
    if (diff < -SIZE / 2) diff += SIZE;
    const prev = prevDiffs.get(cell);
    const wrapped = prev !== undefined && Math.abs(diff - prev) > 3;
    prevDiffs.set(cell, diff);

    const abs = Math.abs(diff);
    if (wrapped) cell.classList.add('is-snap');
    cell.style.setProperty('--off', String(diff));
    cell.style.setProperty('--sc', abs === 0 ? '1' : abs === 1 ? '0.66' : abs === 2 ? '0.42' : '0.24');
    cell.style.setProperty('--op', abs === 0 ? '1' : abs === 1 ? '0.72' : abs === 2 ? '0.34' : '0');
    cell.style.setProperty('--pe', abs <= 2 ? 'auto' : 'none');
    if (wrapped) { void cell.offsetWidth; cell.classList.remove('is-snap'); }
  });
}

const CENTERED_MODES = new Set(['dial', 'strip', 'magnify', 'orbit', 'arc', 'drift']);

function placeContainers(m) {
  copyBlock.classList.toggle('is-center', CENTERED_MODES.has(m));
  if (m === 'dial') {
    dialMid.append(copyBlock);
    dialWrap.append(deckEl);
  } else if (m === 'strip') {
    copyHost.append(copyBlock);
    trackWrap.append(deckEl);
  } else if (m === 'reel') {
    copyHost.append(copyBlock);
    stageEl.prepend(deckEl);
  } else {
    copyHost.append(copyBlock);
    stageEl.append(deckEl);
  }
}

function mountSingleIcon(toy, animate = true) {
  const prev = singleIconHost.querySelector('a.toy');
  if (prev) {
    prev.dispatchEvent(new d.defaultView.FocusEvent('focusout', { bubbles: true }));
    prev.dispatchEvent(new d.defaultView.PointerEvent('pointerleave', { bubbles: false }));
    bin.append(prev);
  }
  singleIconHost.innerHTML = '';
  if (!toy) return;
  const cell = makeCell(toy, 0);
  singleIconHost.append(cell);
  const tile = liveTiles.get(toy.id);
  if (tile) tile.dispatchEvent(new d.defaultView.FocusEvent('focusin', { bubbles: true }));
  if (animate) flashCells([cell], 0);
}

function mountHand() {
  parkAllTiles();
  const cells = [];
  if (!SINGLE_ICON_MODES.has(mode)) {
    hand.forEach((t, i) => {
      const cell = makeCell(t, i);
      deckEl.append(cell);
      cells.push(cell);
    });
  }
  const listHTML = hand.map(t => `<button type="button" class="sm-ch" data-id="${t.id}">${emHTML(t)}<span>${t.name}</span></button>`).join('');
  listEl.innerHTML = listHTML;
  folioListEl.innerHTML = listHTML;
  marqueeEl.innerHTML = hand.map(t => `<button type="button" class="sm-mword" data-id="${t.id}">${t.name}</button>`).join('');

  if (cells.length) {
    if (mode === 'strip' || mode === 'reel') flashCells(stripVisibleCells(0), 48);
    else flashCells(cells, 52);
    pulseDialRing();
  }
}

function deal(pinId = null) {
  clearTimeout(dwellTimer);
  const next = [];
  if (pinId && byId[pinId]) next.push(byId[pinId]);
  while (next.length < SIZE) {
    if (!queue.length) {
      let seen = [];
      try { seen = JSON.parse(localStorage.getItem('stimming.signal.seen') || '[]'); } catch {}
      const seenSet = new Set(seen);
      queue = [
        ...shuffle(ALL.filter(t => !seenSet.has(t.id) && !next.includes(t))),
        ...shuffle(ALL.filter(t => seenSet.has(t.id) && !next.includes(t))),
      ];
    }
    const pick = queue.shift();
    if (pick && !next.includes(pick)) next.push(pick);
  }
  hand = next;
  try {
    const prev = JSON.parse(localStorage.getItem('stimming.signal.seen') || '[]');
    localStorage.setItem('stimming.signal.seen', JSON.stringify([...hand.map(t => t.id), ...prev].slice(0, SIZE * 3)));
  } catch {}
  mountHand();
  select(hand[0], { immediate: true, fromPointer: false });
}

function pointHand(idx, snap = false) {
  if (idx < 0) return;
  const deg = idx * 360 / SIZE;
  crt?.aim(deg, snap);
  if (!gsap) return;
  if (snap || still.matches) gsap.set(handNeedle, { rotation: deg });
  else gsap.to(handNeedle, { rotation: `${deg}_short`, duration: 0.65, ease: 'expo.out', overwrite: true });
}

function select(toy, { immediate = false, fromPointer = false } = {}) {
  if (!toy) return;
  const changed = !active || active.id !== toy.id;
  const prevId = active?.id;
  active = toy;

  const lchs = parseToyLCH(toy.accent);
  app.style.setProperty('--acc-ink', toy.ink || '#fff');
  app.style.setProperty('--c1', `oklch(${lchs[0][0]} ${lchs[0][1]} ${lchs[0][2]})`);
  app.style.setProperty('--c2', `oklch(${lchs[1][0]} ${lchs[1][1]} ${lchs[1][2]})`);
  topMesh?.setColours(lchs, immediate);

  const idx = hand.findIndex(t => t.id === toy.id);
  if (changed) {
    if (prevId && liveTiles.has(prevId) && !SINGLE_ICON_MODES.has(mode)) {
      liveTiles.get(prevId).dispatchEvent(new d.defaultView.FocusEvent('focusout', { bubbles: true }));
    }
    if (SINGLE_ICON_MODES.has(mode)) {
      mountSingleIcon(toy, !immediate);
    } else if (!fromPointer && liveTiles.has(toy.id)) {
      const tile = liveTiles.get(toy.id);
      if (tile.parentElement?.classList.contains('sm-live')) {
        tile.dispatchEvent(new d.defaultView.FocusEvent('focusin', { bubbles: true }));
      }
    }

    titleEl.textContent = toy.name;
    fitTitle();
    if (!immediate && !still.matches) {
      titleEl.classList.remove('is-unfurl');
      void titleEl.offsetWidth;
      titleEl.classList.add('is-unfurl');
    }
    mottoEl.textContent = toy.tag || '';

    const fl = flagsHTML(toy.access);
    accEl.innerHTML = (fl ? `<div class="sm-acc-flags">${fl}</div>` : '')
      + (toy.sound ? `<span class="acc-i acc-snd${immediate ? '' : ' is-flash'}">${glyph('sound')}<b>Best with sound</b></span>` : '');

    const th = techHTML(toy.tech);
    techEl.innerHTML = th;
    dialTechEl.innerHTML = th;
    app.querySelectorAll('[data-open]').forEach(a => { a.href = rootUrl(`${toy.id}/index.html`); });

    const stillUrl = rootUrl(`shared/stills/${toy.id}.webp`);
    const loopUrl = LOOPS.has(toy.id) ? rootUrl(`shared/loops/${toy.id}.mp4`) : null;
    crt?.show(stillUrl, loopUrl);
  }

  deckEl.classList.toggle('has-act', !!toy);
  deckEl.querySelectorAll('.sm-cell').forEach(c => c.classList.toggle('is-act', c.dataset.id === toy.id));
  if (idx >= 0) {
    pointHand(idx, immediate);
    updateStrip(idx);
    updateReel(idx);
    spinOrbitTo(idx, immediate);
  }
  listEl.querySelectorAll('.sm-ch').forEach(b => b.classList.toggle('is-act', b.dataset.id === toy.id));
  folioListEl.querySelectorAll('.sm-ch').forEach(b => b.classList.toggle('is-act', b.dataset.id === toy.id));
  marqueeEl.querySelectorAll('.sm-mword').forEach(b => b.classList.toggle('is-act', b.dataset.id === toy.id));
  sheetGrid.querySelectorAll('.sm-card').forEach(b => b.classList.toggle('is-act', b.dataset.id === toy.id));

  updateCRTSpot(immediate);
}

function clearSheetTiles() {
  sheetGrid.querySelectorAll('a.toy').forEach(a => {
    a.dispatchEvent(new d.defaultView.FocusEvent('focusout', { bubbles: true }));
    a.dispatchEvent(new d.defaultView.PointerEvent('pointerleave', { bubbles: false }));
    bin.append(a);
  });
  sheetGrid.innerHTML = '';
}

function restoreStageTiles() {
  clearSheetTiles();
  if (SINGLE_ICON_MODES.has(mode)) {
    const live = singleIconHost.querySelector('.sm-live');
    const tile = active && liveTiles.get(active.id);
    if (live && tile) live.append(tile);
  } else {
    deckEl.querySelectorAll('.sm-cell').forEach(cell => {
      const live = cell.querySelector('.sm-live');
      const tile = liveTiles.get(cell.dataset.id);
      if (live && tile) live.append(tile);
    });
  }
}

function toggleSheet(force) {
  const next = typeof force === 'boolean' ? force : !sheetOpen;
  if (next === sheetOpen) return;
  sheetOpen = next;
  app.toggleAttribute('data-sheet-open', sheetOpen);
  app.querySelectorAll('[data-sheet="all"]').forEach(b => b.setAttribute('aria-expanded', String(sheetOpen)));
  glassEl.toggleAttribute('data-on', sheetOpen);
  sheetEl.hidden = !sheetOpen;
  crt?.setDim(sheetOpen ? 0 : 1);
  if (sheetOpen) renderSheet();
  else restoreStageTiles();
}

const HEX_PREVIEW_KEYS = ['eastvan', 'goo', 'science', 'maths', 'dark'];
let hexStackHTML = '';
function getHexStackHTML() {
  if (hexStackHTML) return hexStackHTML;
  hexStackHTML = HEX_PREVIEW_KEYS
    .filter(k => seriesData[k]?.icon)
    .map(k => `<span class="sm-hex-chip">${shotIcon(k, seriesData[k].icon, { tilt: 'Dutch', frame: 'Hex ring', line: 'Series', c: seriesData[k].color })}</span>`)
    .join('');
  return hexStackHTML;
}

function makeSheetCard(t, tiles) {
  const card = d.createElement('div');
  card.className = `sm-card${active && active.id === t.id ? ' is-act' : ''}`;
  card.dataset.id = t.id;
  if (t.isLab) card.dataset.lab = '1';
  const ic = d.createElement('div');
  ic.className = 'sm-card-ic';
  const tile = tiles.get(t.id);
  if (tile) ic.append(tile);
  const label = d.createElement('span');
  label.className = 'sm-card-name';
  label.innerHTML = t.stage ? `${t.name}<span class="sm-card-stage">(${t.stage})</span>` : t.name;
  card.append(ic, label);
  return card;
}

function makeRubricHeader(name, iconHTML = '', color = '') {
  const hd = d.createElement('h2');
  hd.className = 'sm-rubric';
  if (color) hd.style.setProperty('--c', color);
  hd.innerHTML = `<span class="at">${iconHTML}<span></span></span>`;
  hd.querySelector('.at > span').textContent = name;
  return hd;
}

function renderSheet() {
  clearSheetTiles();
  sheetHd.innerHTML = `<button type="button" class="w" data-ser="all" aria-pressed="${seriesFilter === 'all'}">All ${ALL.length}</button>`
    + `<span class="sl">/</span>`
    + `<span class="sm-series-soon" aria-disabled="true"><span class="sm-hex-stack" aria-hidden="true">${getHexStackHTML()}</span><span>Series coming soon</span></span>`
    + `<span class="sl sm-div">|</span>`
    + `<button type="button" class="w" data-ser="lab" aria-pressed="${seriesFilter === 'lab'}">Lab${labUnlocked ? ` ${LAB.length}` : ''}</button>`;

  if (seriesFilter === 'lab' && !labUnlocked) {
    sheetGrid.classList.add('is-gate');
    sheetGrid.innerHTML = `
      <div class="sm-lab-gate" id="sm-lab-gate">
        <span class="sm-lab-eyebrow"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7.5" width="10" height="6.8" rx="1.2"/><path d="M5.2 7.5V5.2a2.8 2.8 0 0 1 5.6 0v2.3"/></svg>Lab access</span>
        <h2 class="sm-lab-title" data-t="Password required">Password required</h2>
        <form class="sm-lab-form" id="sm-lab-form" autocomplete="off">
          <input type="password" class="sm-lab-in" id="sm-lab-in" placeholder="Password" autocomplete="new-password" data-1p-ignore="true" data-lpignore="true" spellcheck="false" aria-label="Lab password">
          <button type="submit" class="w sm-lab-go">Enter</button>
        </form>
        <p class="sm-lab-err" id="sm-lab-err" aria-live="polite"></p>
      </div>
    `;
    const form = sheetGrid.querySelector('#sm-lab-form');
    const inp = sheetGrid.querySelector('#sm-lab-in');
    const err = sheetGrid.querySelector('#sm-lab-err');
    const gateBox = sheetGrid.querySelector('#sm-lab-gate');
    form.addEventListener('submit', e => {
      e.preventDefault();
      if (inp.value.trim().toLowerCase() === LAB_PASS) {
        labUnlocked = true;
        try { sessionStorage.setItem('stimming.lab.ok', '1'); } catch {}
        renderSheet();
      } else {
        err.textContent = 'Access denied // signal rejected';
        gateBox.classList.remove('is-err');
        void gateBox.offsetWidth;
        gateBox.classList.add('is-err');
        inp.select();
        inp.focus();
      }
    });
    requestAnimationFrame(() => inp.focus());
    return;
  }

  sheetGrid.classList.remove('is-gate');
  const frag = d.createDocumentFragment();
  if (seriesFilter === 'lab') {
    const slate = LAB.filter(t => t.slate);
    const bench = LAB.filter(t => t.bench && !t.slate);
    const body = LAB.filter(t => !t.slate && !t.bench);
    if (slate.length) {
      frag.append(makeRubricHeader('Slate'));
      slate.forEach(t => frag.append(makeSheetCard(t, labTiles)));
    }
    const grouped = new Map(Object.keys(seriesData).map(k => [k, []]));
    const rest = [];
    body.forEach(t => (grouped.get(t.series) || rest).push(t));
    for (const [k, items] of grouped) {
      if (!items.length) continue;
      const s = seriesData[k];
      const iconHTML = s.icon ? shotIcon(k, s.icon, { tilt: 'Dutch', frame: 'Hex ring', line: 'Series', c: s.color }) : '';
      frag.append(makeRubricHeader(s.name, iconHTML, s.color));
      items.forEach(t => frag.append(makeSheetCard(t, labTiles)));
    }
    if (rest.length) {
      frag.append(makeRubricHeader('Other'));
      rest.forEach(t => frag.append(makeSheetCard(t, labTiles)));
    }
    if (bench.length) {
      frag.append(makeRubricHeader('Bench'));
      bench.forEach(t => frag.append(makeSheetCard(t, labTiles)));
    }
  } else {
    ALL.forEach(t => frag.append(makeSheetCard(t, liveTiles)));
  }
  sheetGrid.append(frag);
}

function setMode(m) {
  if (!ALL_MODES.some(([k]) => k === m)) return;
  clearTimeout(dwellTimer);
  const wasSingle = SINGLE_ICON_MODES.has(mode);
  const nowSingle = SINGLE_ICON_MODES.has(m);
  mode = m;
  app.dataset.m = m;
  app.querySelectorAll('[data-m]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === m)));
  placeContainers(m);

  if (m !== 'magnify') setMagnifyTargets(null);
  prevDiffs.clear();

  const curIdx = Math.max(0, hand.findIndex(t => t.id === active?.id));
  if (nowSingle) {
    parkAllTiles();
    mountSingleIcon(active || hand[0], true);
  } else if (wasSingle) {
    mountHand();
    const cur = hand.includes(active) ? active : hand[0];
    active = null;
    select(cur, { immediate: true });
  } else {
    const cells = [...deckEl.querySelectorAll('.sm-cell')];
    if (m === 'strip') { updateStrip(curIdx); flashCells(stripVisibleCells(curIdx), 42); }
    else if (m === 'reel') { updateReel(curIdx); flashCells(stripVisibleCells(curIdx), 42); }
    else if (m === 'orbit') { spinOrbitTo(curIdx, true); flashCells(cells, 30); }
    else { flashCells(cells, 34); }
    pointHand(curIdx, true);
    pulseDialRing();
  }

  requestAnimationFrame(() => { fitTitle(); updateCRTSpot(true); });
  const u = new URL(location.href);
  u.searchParams.set('m', m);
  history.replaceState(null, '', u);
}

function step(dir) {
  const list = sheetOpen ? (seriesFilter === 'all' ? ALL : ALL.filter(t => t.series === seriesFilter)) : hand;
  if (!list.length) return;
  const idx = list.findIndex(t => active && t.id === active.id);
  select(list[(idx < 0 ? 0 : idx + dir + list.length) % list.length]);
}

/* ---------- Events ---------- */
deckEl.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch' || mode === 'strip' || mode === 'orbit' || mode === 'reel') return;
  const c = e.target.closest('.sm-cell');
  if (!c) return;
  clearTimeout(dwellTimer);
  dwellTimer = setTimeout(() => select(byId[c.dataset.id], { fromPointer: true }), mode === 'magnify' ? 18 : 45);
});
deckEl.addEventListener('pointermove', e => {
  if (mode === 'magnify' && e.pointerType !== 'touch') setMagnifyTargets(e.clientX);
});
deckEl.addEventListener('pointerleave', () => {
  clearTimeout(dwellTimer);
  if (mode === 'magnify') setMagnifyTargets(null);
});
deckEl.addEventListener('click', e => {
  if (orbit.moved) { e.preventDefault(); orbit.moved = false; return; }
  const c = e.target.closest('.sm-cell');
  if (!c) return;
  const toy = byId[c.dataset.id];
  if (!toy) return;
  clearTimeout(dwellTimer);
  if (!active || active.id !== toy.id) {
    e.preventDefault();
    select(toy, { fromPointer: true });
  }
});

deckEl.addEventListener('pointerdown', e => {
  if (mode !== 'orbit') return;
  orbit.dragging = true; orbit.moved = false; orbit.startX = e.clientX; orbit.startAng = orbit.angle;
  if (gsap) gsap.killTweensOf(orbit);
  deckEl.setPointerCapture(e.pointerId);
});
deckEl.addEventListener('pointermove', e => {
  if (!orbit.dragging || mode !== 'orbit') return;
  const dx = e.clientX - orbit.startX;
  if (Math.abs(dx) > 6) orbit.moved = true;
  orbit.angle = orbit.startAng - dx * 0.0065;
  renderOrbit();
});
const endOrbitDrag = () => {
  if (!orbit.dragging) return;
  orbit.dragging = false;
  if (!orbit.moved) return;
  const raw = Math.round(orbit.angle / (2 * Math.PI / SIZE));
  const idx = ((raw % SIZE) + SIZE) % SIZE;
  select(hand[idx]);
};
deckEl.addEventListener('pointerup', endOrbitDrag);
deckEl.addEventListener('pointercancel', endOrbitDrag);

trackWrap.addEventListener('click', e => {
  const s = e.target.closest('[data-step]');
  if (s) step(Number(s.dataset.step));
});

const bindWordList = (el, sel) => {
  el.addEventListener('pointerover', e => {
    if (e.pointerType === 'touch') return;
    const b = e.target.closest(sel);
    if (b) select(byId[b.dataset.id]);
  });
  el.addEventListener('click', e => {
    const b = e.target.closest(sel);
    if (!b) return;
    const toy = byId[b.dataset.id];
    if (!toy) return;
    if (active && active.id === toy.id && !matchMedia('(pointer: coarse)').matches) {
      window.top.location.href = rootUrl(`${toy.id}/index.html`);
    } else {
      select(toy);
    }
  });
};
bindWordList(listEl, '.sm-ch');
bindWordList(folioListEl, '.sm-ch');
bindWordList(marqueeEl, '.sm-mword');

sheetGrid.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch') return;
  const c = e.target.closest('.sm-card');
  if (c && !c.dataset.lab && byId[c.dataset.id]) select(byId[c.dataset.id], { fromPointer: true });
});
sheetGrid.addEventListener('click', e => {
  const c = e.target.closest('.sm-card');
  if (!c) return;
  if (e.target.closest('a.toy')) return;
  const toy = c.dataset.lab ? labById[c.dataset.id] : byId[c.dataset.id];
  if (toy) window.top.location.href = rootUrl(toy.href || `${toy.id}/index.html`);
});

sheetHd.addEventListener('click', e => {
  const s = e.target.closest('[data-ser]');
  if (s) { seriesFilter = s.dataset.ser; renderSheet(); }
});
sheetEl.querySelector('[data-close]').addEventListener('click', () => toggleSheet(false));
glassEl.addEventListener('click', () => toggleSheet(false));

app.addEventListener('click', e => {
  if (e.target.closest('[data-act="reroll"]')) { if (sheetOpen) toggleSheet(false); deal(); return; }
  if (e.target.closest('[data-sheet="all"]')) { toggleSheet(); }
});

new ResizeObserver(() => {
  if (mode === 'orbit') renderOrbit();
  if (mode === 'reel') updateReel(Math.max(0, hand.findIndex(t => t.id === active?.id)));
  fitTitle();
  updateCRTSpot(true);
  footMesh?.draw?.();
  topMesh?.draw?.();
}).observe(app);

let wheelAt = 0;
app.addEventListener('wheel', e => {
  if (sheetOpen || e.target.closest('.sm-list, .sm-marquee')) return;
  const now = performance.now();
  if (now - wheelAt < 160) return;
  if (Math.abs(e.deltaY) < 12 && Math.abs(e.deltaX) < 12) return;
  wheelAt = now;
  step((e.deltaY || e.deltaX) > 0 ? 1 : -1);
}, { passive: true });

const onKey = e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && e.target.closest('input, textarea, select')) {
    if (e.key === 'Escape') { e.target.blur(); toggleSheet(false); }
    return;
  }
  const k = e.key.toLowerCase();
  if (k === 'escape') { toggleSheet(false); return; }
  if (k === 'r') { if (sheetOpen) toggleSheet(false); deal(); return; }
  if (k === 'a') { toggleSheet(); return; }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); step(1); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); return; }
  if (e.key === 'Enter' && active && !e.target.closest('button, a')) { window.top.location.href = rootUrl(`${active.id}/index.html`); }
};
d.addEventListener('keydown', onKey);
window.addEventListener('keydown', onKey);

placeContainers(mode);
deal(urlParams.get('toy'));
// Re-roll + R keycap appears in the top-right after the same 5-second delay as Clock (immediate on narrow screens).
setTimeout(() => rerollWrap.setAttribute('data-on', ''), matchMedia('(max-width: 860px)').matches ? 0 : 5000);
requestAnimationFrame(() => { fitTitle(); updateCRTSpot(true); });
frame.classList.add('ready');
</script>
</body>
</html>
