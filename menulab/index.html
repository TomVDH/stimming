<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Menu probe</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
@font-face { font-family: "Iosevka Term Slab"; font-weight: 500; font-display: swap; src: url(../shared/fonts/IosevkaTermSlab-Medium.woff2) format("woff2"); }
:root { --bg: oklch(0.16 0.012 275); --fg: oklch(0.95 0.008 275); --muted: oklch(0.6 0.02 275); --mono: "Iosevka Term Slab", ui-monospace, monospace; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Gabarito", system-ui, sans-serif; }
/* The live menu runs in the frame and scrolls by itself, as the real page does. */
body { display: flex; flex-direction: column; }
iframe { display: block; width: 100%; border: 0; flex: 1; min-height: 0; }
.bar { flex: none; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; padding: 12px 16px; }
.bar span { font: 500 11px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.bar button { font: 600 13px/1 "Gabarito", system-ui, sans-serif; color: var(--muted); background: none; border: 1px solid oklch(0.32 0.02 275); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
.bar button[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
.bar button:focus-visible { outline: 2px solid oklch(0.84 0.13 205); outline-offset: 3px; }
</style>
<body>
<div class="bar" role="group" aria-label="Menu concept"><span>Menu</span>
  <button type="button" data-m="dozen">Dozen</button>
  <button type="button" data-m="clock">Clock</button>
  <button type="button" data-m="dial">Dial</button>
  <button type="button" data-m="drum">Drum</button>
</div>
<script type="module">
// A probe: other ways to do the main menu. Each one shows twelve toys and a
// Re-roll. The live menu runs in the frame, so every icon still plays.
// Tom's shortlist of four stays: Dozen, Clock, Dial, Drum.
const SIZE = 12;
const CSS = `
/* The probe hides the parts it does not test. */
.series-toggle { display: none !important; }
.probe-stage > .shelf > li[data-out] { display: none !important; }
/* A roll: the old dozen shrinks away, the new one comes in, one after the other. */
.probe-stage > .shelf > li { transition: opacity 0.3s ease, scale 0.45s cubic-bezier(0.3, 1.5, 0.5, 1), rotate 0.45s cubic-bezier(0.3, 1.5, 0.5, 1), translate 0.45s cubic-bezier(0.3, 1.5, 0.5, 1); transition-delay: calc(var(--i, 0) * 30ms); }
.probe-stage > .shelf.rolling > li { opacity: 0; scale: 0.7; transition-duration: 0.16s; transition-delay: 0s; }
/* The controls: Re-roll, and a way to the whole shelf. */
.probe-ui { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }
.probe-ui .who { display: none; }
.probe-ui :is(button, a) { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; border: 1px solid color-mix(in oklch, var(--fg) 28%, transparent); background: none; cursor: pointer; text-decoration: none; font-family: "Iosevka Term Slab", ui-monospace, monospace; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg); transition: border-color 0.2s, background 0.2s; }
.probe-ui a { border-color: transparent; color: var(--muted); }
.probe-ui :is(button, a):hover { border-color: var(--fg); color: var(--fg); }
.probe-ui button:active svg { rotate: 180deg; }
.probe-ui svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; transition: rotate 0.4s cubic-bezier(0.3, 1.5, 0.5, 1); }
.probe-ui svg circle { fill: currentColor; stroke: none; }
.probe-stage { position: relative; width: 100%; display: grid; justify-items: center; gap: clamp(28px, 5vw, 48px); }

/* Dozen: four by three, large. */
html[data-m="dozen"] .probe-stage > .shelf { grid-template-columns: repeat(4, clamp(96px, 19vw, 176px)); max-width: none; gap: clamp(22px, 3.4vw, 44px) clamp(14px, 3vw, 40px); }
html[data-m="dozen"] .probe-stage > .shelf > li { width: auto; }
/* Clock: twelve toys on a dial; the name of the toy in hand shows in the middle. */
html:is([data-m="clock"], [data-m="dial"]) .probe-stage > .shelf { display: block; position: relative; width: min(90vw, 660px); max-width: none; aspect-ratio: 1; margin: 0 auto; }
html:is([data-m="clock"], [data-m="dial"]) .probe-stage > .shelf > li { position: absolute; width: 19%; left: calc(50% + var(--x, 0) * 40.5% - 9.5%); top: calc(50% + var(--y, 0) * 40.5% - 9.5%); }
html:is([data-m="clock"], [data-m="dial"]) .toy .name { display: none; }
html:is([data-m="clock"], [data-m="dial"]) .probe-stage > .shelf > li:is(:hover, :focus-within) { scale: 1.18; z-index: 2; transition-delay: 0s; }
html:is([data-m="clock"], [data-m="dial"]) .probe-ui { position: absolute; left: 50%; top: 50%; translate: -50% -50%; flex-direction: column; width: 42%; pointer-events: none; }
html:is([data-m="clock"], [data-m="dial"]) .probe-ui > * { pointer-events: auto; }
html:is([data-m="clock"], [data-m="dial"]) .probe-ui .who { display: block; min-height: 2.1em; text-align: center; font: 800 clamp(18px, 4.4vw, 34px)/1.05 var(--sans); letter-spacing: -0.03em; color: var(--fg); pointer-events: none; }
/* The Drum frame: three columns in one box, with a hairline between reels. */
html[data-m="drum"] .probe-stage > .shelf { grid-template-columns: repeat(3, clamp(96px, 24vw, 196px)); width: fit-content; max-width: none; gap: clamp(8px, 1.6vw, 18px) clamp(24px, 5vw, 60px); padding: clamp(14px, 2.4vw, 24px) clamp(14px, 3vw, 32px); overflow: hidden; border-radius: 28px; border: 1px solid oklch(0.3 0.016 275); background: linear-gradient(90deg, transparent calc(33.33% - 0.5px), oklch(0.3 0.016 275) 0 calc(33.33% + 0.5px), transparent 0 calc(66.67% - 0.5px), oklch(0.3 0.016 275) 0 calc(66.67% + 0.5px), transparent 0), oklch(0.19 0.013 275); }
/* GSAP moves the Dial and the Drum, so the plain roll is off for them. */
html:is([data-m="dial"], [data-m="drum"]) .probe-stage > .shelf > li { transition: none; }
/* Dial: the Clock with a ring of minute marks. A hand points at the toy in hand. */
html[data-m="dial"] .probe-stage > .shelf::before { content: ""; position: absolute; inset: 21%; border-radius: 50%; border: 1px solid oklch(0.34 0.016 275); pointer-events: none; }
html[data-m="dial"] .probe-stage > .shelf::after { content: ""; position: absolute; inset: 23%; border-radius: 50%; pointer-events: none; background: repeating-conic-gradient(from -0.5deg, oklch(0.52 0.016 275) 0 1deg, transparent 0 6deg); -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 8px), #000 calc(100% - 7px)); mask: radial-gradient(closest-side, transparent calc(100% - 8px), #000 calc(100% - 7px)); }
.probe-hand { display: none; position: absolute; left: 50%; top: 50%; width: 2px; height: calc(min(90vw, 660px) * 0.262); border-radius: 2px; background: linear-gradient(to bottom, var(--fg) 0 22%, transparent 22%); pointer-events: none; }
html[data-m="dial"] .probe-hand { display: block; }
html[data-m="dial"] .probe-ui .who::before { content: attr(data-n); display: block; margin-bottom: 8px; font: 500 11px/1 "Iosevka Term Slab", ui-monospace, monospace; letter-spacing: 0.12em; color: var(--muted); }
html[data-m="dial"] .probe-stage > .shelf > li { transition: scale 0.45s cubic-bezier(0.3, 1.5, 0.5, 1); transition-delay: 0s; }
html[data-m="dial"] .probe-stage > .shelf > li[data-held] { scale: 1.18; z-index: 2; }
/* Drum: three reels of four with a true spin. Each reel turns and stops in its turn. */
html[data-m="drum"] .probe-stage > .shelf > li { width: auto; }
/* A reel at speed smears along its path; its names step back. */
html[data-m="drum"] .probe-stage > .shelf > li[data-spin] .obj { filter: url(#probe-vblur); }
html[data-m="drum"] .probe-stage > .shelf > li[data-spin] .name { opacity: 0.2; }
/* One button under each reel spins that reel alone. */
.probe-reels { display: none; }
html[data-m="drum"] .probe-reels { display: grid; box-sizing: border-box; grid-template-columns: repeat(3, clamp(96px, 24vw, 196px)); justify-items: center; width: fit-content; column-gap: clamp(24px, 5vw, 60px); padding: 0 calc(clamp(14px, 3vw, 32px) + 1px); margin-top: calc(14px - clamp(28px, 5vw, 48px)); }
.probe-reels button { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 8px 13px; border-radius: 999px; border: 1px solid oklch(0.32 0.016 275); background: none; cursor: pointer; font: 500 11px/1 "Iosevka Term Slab", ui-monospace, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); transition: color 0.2s, border-color 0.2s; }
.probe-reels button:is(:hover, :focus-visible) { color: var(--fg); border-color: var(--fg); }
.probe-reels svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: rotate 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
.probe-reels button:active svg { rotate: 200deg; }
@media (max-width: 620px) {
  html[data-m="drum"] .probe-reels { grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; column-gap: 20px; padding: 0 11px; }
  .probe-reels button { padding: 8px 9px; letter-spacing: 0.06em; }
  html[data-m="dial"] .probe-ui a { display: none; }
  html[data-m="drum"] .probe-stage > .shelf { box-sizing: border-box; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; gap: 8px 20px; padding: 12px 10px; }
  html[data-m="dozen"] .probe-stage > .shelf { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .probe-stage > .shelf > li, .probe-ui svg { transition: none; } .probe-stage .toy, .probe-stage .toy .obj, .probe-stage > .shelf > li::before { transition: none !important; } }`;

const frame = Object.assign(document.createElement('iframe'), { src: '../index.html', title: 'Menu' });
document.body.append(frame);
await new Promise(r => frame.addEventListener('load', r, { once: true }));
const d = frame.contentDocument;
// The menu may still sort its shelf; wait, then take the tiles back to one shelf.
for (let i = 0; i < 40 && d.documentElement.dataset.sections; i++) await new Promise(r => setTimeout(r, 50));
const shelf = d.querySelector('main > .shelf');
// Only the main shelf's toys: the Lab keeps its own.
shelf.append(...d.querySelectorAll('main > .sec > .shelf > li'));
shelf.hidden = false;
d.querySelectorAll('main > .sec').forEach(s => s.remove());
d.head.append(Object.assign(d.createElement('style'), { textContent: CSS }));

// The stage holds the shelf and the controls, so the Clock can put them in its middle.
// The probe's styles name the shelf by this stage.
const stage = Object.assign(d.createElement('div'), { className: 'probe-stage' });
shelf.before(stage);
const ui = Object.assign(d.createElement('div'), { className: 'probe-ui' });
ui.innerHTML = `<span class="who" aria-live="polite"></span><button type="button" title="Re-roll (R)"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.8" y="1.8" width="12.4" height="12.4" rx="3"/><circle cx="5.4" cy="5.4" r="1.1"/><circle cx="10.6" cy="10.6" r="1.1"/><circle cx="8" cy="8" r="1.1"/></svg>Re-roll</button><a href="../index.html" target="_top">All toys</a>`;
stage.append(shelf, ui);

// The pool is every toy, in a shuffled line. Each roll takes the next twelve,
// so no toy comes back before the rest had a turn.
const pool = [...shelf.children];
let line = [];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// The Dial: `held` is the toy the hand points at.
let held = null;
function deal() {
  const hand = [];
  while (hand.length < SIZE) {
    if (!line.length) line = shuffle(pool.filter(li => !hand.includes(li)));
    hand.push(line.shift());
  }
  pool.forEach(li => li.setAttribute('data-out', ''));
  hand.forEach((li, i) => dress(li, i));
  // The hand goes first: the Drum counts its reels from the top.
  shelf.prepend(...hand);
  held = null;
  name(null);
}
// The Clock and the Dial place each toy on its hour.
function dress(li, i) {
  li.removeAttribute('data-out');
  li.style.setProperty('--i', i);
  li.style.setProperty('--x', Math.sin(i * Math.PI / 6).toFixed(4));
  li.style.setProperty('--y', (-Math.cos(i * Math.PI / 6)).toFixed(4));
}
// The next toys from the line that are not on show now.
function draw(n, keep) {
  const got = [], back = [];
  while (got.length < n) {
    if (!line.length) line = shuffle(pool.filter(li => !got.includes(li) && !keep.includes(li) && !back.includes(li)));
    const li = line.shift();
    (keep.includes(li) ? back : got).push(li);
  }
  line.push(...back);
  return got;
}
function roll() {
  const m = d.documentElement.dataset.m;
  if (CRAFT.includes(m)) {
    if (calm()) { stop(); deal(); } else craftRoll(m);
    return;
  }
  shelf.classList.add('rolling');
  setTimeout(() => {
    deal();
    // A timer, not a frame: a hidden tab gets no frames and the dozen would stay away.
    setTimeout(() => shelf.classList.remove('rolling'), 40);
  }, 190);
}
ui.querySelector('button').addEventListener('click', roll);
d.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key.toLowerCase() === 'r') roll();
  if ('123'.includes(e.key)) spinReel(+e.key - 1);
});
// The Clock and the Dial show the name of the toy under the pointer or the focus.
const who = ui.querySelector('.who');
const still = matchMedia('(prefers-reduced-motion: reduce)');
function name(li) {
  const dial = d.documentElement.dataset.m === 'dial';
  // The Dial keeps its last toy on show; the Clock clears the name.
  if (dial) li = held = li || held || shelf.children[0];
  shelf.querySelectorAll('[data-held]').forEach(o => o.removeAttribute('data-held'));
  if (dial) {
    const i = dozen().indexOf(li);
    li.setAttribute('data-held', '');
    who.dataset.n = String(i + 1).padStart(2, '0') + ' / ' + SIZE;
    point(i);
  }
  const n = li?.querySelector('.name');
  const text = n ? [...n.childNodes].filter(c => c.nodeType === 3).map(c => c.textContent).join('').trim() : '';
  if (text === who.textContent) return;
  who.textContent = text;
  // The new name rises into its line.
  if (dial && !still.matches) who.animate([{ clipPath: 'inset(0 0 100% 0)', translate: '0 28%' }, { clipPath: 'inset(0 0 0 0)', translate: '0 0' }], { duration: 520, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' });
}
// The Dial and the Drum move with GSAP; it comes from the menu in the frame.
const gsap = d.defaultView.gsap;
const CRAFT = ['dial', 'drum'];
const dozen = () => [...shelf.children].slice(0, SIZE);
// A toy in a show skips the menu's own blur reveal.
const parts = () => { const lis = dozen(); lis.forEach(li => li.querySelector('.toy').classList.add('is-in')); return { lis, toys: lis.map(li => li.querySelector('.toy')), names: lis.map(li => li.querySelector('.name')), objs: lis.map(li => li.querySelector('.obj')) }; };
// No motion with reduced motion, without GSAP, or in a hidden tab.
const calm = () => !gsap || still.matches || d.visibilityState !== 'visible';
// The Dial's hand turns about the middle of the stage.
const needle = Object.assign(d.createElement('i'), { className: 'probe-hand' });
needle.setAttribute('aria-hidden', 'true');
stage.append(needle);
if (gsap) gsap.set(needle, { xPercent: -50, yPercent: -100, transformOrigin: '50% 100%' });
function point(i) {
  if (!gsap || i < 0) return;
  if (calm()) gsap.set(needle, { rotation: i * 30 });
  else gsap.to(needle, { rotation: i * 30 + '_short', duration: 0.7, ease: 'expo.out', overwrite: true });
}
// The Drum: four toys turn through five places, so one place is the gap.
const reels = p => [0, 1, 2].map(c => [0, 1, 2, 3].map(r => p.toys[r * 3 + c]));
const pitch = p => p.lis[3].offsetTop - p.lis[0].offsetTop;
const place = (tiles, t, h) => tiles.forEach((el, r) => gsap.set(el, { y: ((((r + t + 1) % 5) + 5) % 5 - 1 - r) * h }));
// One reel turns from place `from` to place `to`; it smears while it is fast.
function turnReel(tl, tiles, h, from, to, vars) {
  const o = { t: from, last: from };
  place(tiles, from, h);
  tl.to(o, { t: to, ...vars, onUpdate() {
    place(tiles, o.t, h);
    const quick = Math.abs(o.t - o.last) > 0.08;
    o.last = o.t;
    tiles.forEach(el => el.parentElement.toggleAttribute('data-spin', quick));
  } }, 0);
}
// A reel that lands knocks the frame.
const thud = () => gsap.fromTo(shelf, { y: 4 }, { y: 0, duration: 0.45, ease: 'elastic.out(1, 0.45)', overwrite: true, clearProps: 'transform' });
const INTRO = {
  dial(tl, p) {
    tl.fromTo(p.objs, { scale: 0.2, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.55, ease: 'back.out(1.7)', stagger: 0.04 }, 0)
      .fromTo(needle, { rotation: -360 }, { rotation: 0, duration: 1.1, ease: 'expo.inOut', overwrite: true }, 0);
  },
  drum(tl, p) {
    const h = pitch(p);
    reels(p).forEach((tiles, c) => {
      const duration = 1 + c * 0.32;
      turnReel(tl, tiles, h, -5 * (2 + c), 0, { duration, ease: 'back.out(0.8)' });
      tl.call(thud, null, duration * 0.62);
    });
  },
};
const OUTRO = {
  drum(tl, p) {
    const h = pitch(p);
    reels(p).forEach(tiles => turnReel(tl, tiles, h, 0, 5, { duration: 0.26, ease: 'power2.in' }));
  },
  plain(tl, p) { tl.to([...p.names, ...p.objs], { autoAlpha: 0, y: -12, duration: 0.16, ease: 'power2.in', stagger: 0.006 }, 0); },
};
let show = null;
// A finished show leaves no inline style behind.
function settle(p) {
  gsap.set([...p.toys, ...p.names, ...p.objs], { clearProps: 'transform,opacity,visibility,clipPath' });
  p.lis.forEach(li => li.removeAttribute('data-spin'));
}
function stop() {
  if (!gsap) return;
  if (show) { show.kill(); show = null; }
  settle(parts());
}
function enter(m) {
  const p = parts();
  show = gsap.timeline({ onComplete: () => settle(p) });
  INTRO[m](show, p);
}
function craftRoll(m) {
  stop();
  const old = parts();
  show = gsap.timeline();
  (OUTRO[m] || OUTRO.plain)(show, old);
  show.add(() => { settle(old); deal(); enter(m); });
}
// The Drum: one reel spins alone and takes four new toys.
function spinReel(c) {
  if (d.documentElement.dataset.m !== 'drum') return;
  stop();
  const p = parts(), mine = [0, 1, 2, 3].map(r => p.lis[r * 3 + c]);
  const swap = () => {
    draw(4, p.lis).forEach((li, r) => {
      dress(li, r * 3 + c);
      mine[r].before(li);
      mine[r].setAttribute('data-out', '');
      shelf.append(mine[r]);
    });
    held = null;
    name(null);
  };
  if (calm()) return swap();
  const h = pitch(p);
  show = gsap.timeline();
  turnReel(show, reels(p)[c], h, 0, 5, { duration: 0.26, ease: 'power2.in' });
  show.add(() => {
    settle(p);
    swap();
    const q = parts();
    show = gsap.timeline({ onComplete: () => settle(q) });
    turnReel(show, reels(q)[c], h, -10, 0, { duration: 1.1, ease: 'back.out(0.8)' });
    show.call(thud, null, 0.68);
  });
}
const reelRow = Object.assign(d.createElement('div'), { className: 'probe-reels' });
reelRow.innerHTML = [1, 2, 3].map(n => `<button type="button" data-reel="${n - 1}" title="Spin reel ${n} (key ${n})"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13.3 2.2v3.3H10"/></svg>Spin 0${n}</button>`).join('');
shelf.after(reelRow);
reelRow.addEventListener('click', e => { const b = e.target.closest('button'); if (b) spinReel(+b.dataset.reel); });
// The smear is a blur along the reel's path only.
d.body.insertAdjacentHTML('beforeend', '<svg width="0" height="0" aria-hidden="true" style="position:absolute"><filter id="probe-vblur" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="0 7"/></filter></svg>');
shelf.addEventListener('pointerover', e => name(e.target.closest('li')));
shelf.addEventListener('focusin', e => name(e.target.closest('li')));
shelf.addEventListener('pointerleave', () => name(null));
deal();

const KEY = 'stimming.menulab.concept', NAMES = ['dozen', 'clock', 'dial', 'drum'];
const pick = m => {
  stop();
  d.documentElement.dataset.m = m;
  name(null);
  if (CRAFT.includes(m) && !calm()) enter(m);
  document.querySelectorAll('.bar button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
  try { localStorage.setItem(KEY, m); } catch (e) {}
};
document.querySelectorAll('.bar button').forEach(b => b.addEventListener('click', () => pick(b.dataset.m)));
let saved = 'dozen';
try { saved = localStorage.getItem(KEY) || 'dozen'; } catch (e) {}
const asked = new URLSearchParams(location.search).get('m');
pick(NAMES.includes(asked) ? asked : NAMES.includes(saved) ? saved : 'dozen');
</script>
</body>
</html>
