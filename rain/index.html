<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rain on glass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: every module downloads in parallel. -->
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm">
<style>
/* Rain on glass: a dusk window in the Bar v2 shell. */
:root { --stage: oklch(0.25 0.045 290); }
/* On the dusk glass the fail line keeps a pale tone. */
.fail { color: oklch(0.74 0.02 285); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/rain.svg)"></span><span class="intro-name">Rain on glass</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--rain" id="pane" tabindex="0" role="application" aria-label="A rainy window at dusk. Drag to wipe the fog. Arrow keys wipe a stripe; Space steps through drizzle, rain and storm.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Rain on glass needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Rain on glass</h1><div class="vignette" hidden></div></section>
</div>

<script type="module" src="main.js"></script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
import { pageReady } from '../shared/stim.js';
// The intro holds until the page, its font and the first frame are in.
playIntro({ ready: pageReady() });
</script>
</body>
</html>
