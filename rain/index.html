<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rain on glass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Rain on glass: a dusk window under the shared header. */
:root { --stage: oklch(0.25 0.045 290); }
/* On the dusk glass the fail line keeps a pale tone. */
.fail { color: oklch(0.74 0.02 285); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Rain on glass</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--rain" id="pane" tabindex="0" role="application" aria-label="A rainy window at dusk. Drag to wipe the fog. Arrow keys wipe a stripe; Space makes the rain heavier or lighter.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Rain on glass needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="actions">
        <button class="chip" id="heavy" type="button" aria-keyshortcuts="Space">Heavier</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag</dt><dd>wipe the fog</dd></div>
        <div class="fine"><dt><kbd>Arrows</kbd></dt><dd>wipe a stripe</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>heavier or lighter</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Rain on glass</h1><div class="vignette" hidden></div></section>
</div>

<script type="module">
import { initPage, sound } from '../shared/stim.js';
initPage({ id: 'rain' });
const panel = document.getElementById('pane'), canvas = panel.querySelector('canvas');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; rainLevel(); });
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));
const nextFrame = () => new Promise(r => requestAnimationFrame(r));
// Seeded random keeps the street the same across resizes.
const rng = s => () => {
  s = (s + 0x6d2b79f5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const hash2 = (x, y) => {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(ix, iy), hash2(ix + 1, iy), sx), lerp(hash2(ix, iy + 1), hash2(ix + 1, iy + 1), sx), sy);
}

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
function lin(L, C, h) {
  const a = C * Math.cos(h * D2R), b = C * Math.sin(h * D2R);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
  ];
}
// Chroma shrinks until the colour fits sRGB.
function linear(L, C, h) {
  let c = lin(L, C, h);
  for (let i = 0; i < 24 && (Math.min(...c) < -1e-4 || Math.max(...c) > 1.0001); i++) c = lin(L, (C *= 0.9), h);
  return c.map(v => clamp(v));
}
const SKY = {
  uSkyTop: linear(0.27, 0.06, 272),
  uSkyMid: linear(0.38, 0.075, 298),
  uGlow: linear(0.54, 0.085, 42),
  uBldg: linear(0.2, 0.03, 285),
  uStreet: linear(0.15, 0.02, 280),
  uSheen: linear(0.34, 0.055, 330),
};
const HAZE = linear(0.5, 0.022, 285);
const LIT = {
  lamp: linear(0.84, 0.13, 72), warm: linear(0.86, 0.1, 85), cool: linear(0.88, 0.04, 235),
  head: linear(0.96, 0.035, 95), tail: linear(0.62, 0.2, 27), teal: linear(0.8, 0.12, 195),
  rose: linear(0.68, 0.19, 350), blue: linear(0.66, 0.15, 262), go: linear(0.84, 0.16, 158),
};

/* ---------- the street behind the glass ---------- */
// Units are panel heights; y runs down; the street starts at YS.
const BW = 0.085, NB = 40, YS = 0.62;
const roofs = new Float32Array(NB);
let lightData = new Float32Array(0), nLights = 0, sceneA = 0;
function buildScene(A) {
  sceneA = A;
  const R = rng(20261102);
  for (let i = 0; i < NB; i++) {
    const h = R();
    roofs[i] = 0.26 + 0.18 * h * h - (R() < 0.18 ? 0.07 : 0);
  }
  const L = [];
  // Twelve floats per light: place, size, phase, colour, rate, drift, flicker, stretch.
  const put = (x, y, rad, col, k, amp, v = 0, tall = 1) => {
    L.push(x, y, rad, R() * TAU, col[0] * k, col[1] * k, col[2] * k, 0.4 + R() * 1.1, v, amp, tall, 0);
  };
  // The wet street mirrors each light as a dim upright streak.
  const mirror = (x, y, rad, col, k, amp, v = 0) => put(x, YS + (YS - y) * 0.45 + 0.05, rad * 0.9, col, k * 0.16, amp * 1.6, v, 2.2);
  const nb = Math.min(NB, Math.ceil(A / BW));
  for (let n = Math.round(20 * A), i = 0; i < n; i++) {
    const b = Math.floor(R() * nb), x = (b + 0.15 + 0.7 * R()) * BW;
    const y = roofs[b] + 0.03 + R() * Math.max(0.02, YS - roofs[b] - 0.08);
    put(x, y, 0.009 + R() * 0.012, R() < 0.75 ? LIT.warm : LIT.cool, 0.05 + 0.32 * R() ** 2, 0.05);
  }
  // Far lights crowd the end of the street.
  for (let n = Math.round(12 * A), i = 0; i < n; i++) {
    put(R() * A, YS - 0.06 + R() * 0.05, 0.007 + R() * 0.008, R() < 0.6 ? LIT.lamp : LIT.cool, 0.3 + R() * 0.4, 0.12);
  }
  // Street lamps recede from the near left to the far right.
  for (let n = Math.round(3 + 2 * A), i = 0; i < n; i++) {
    const t = (i + 0.15 + 0.7 * R()) / n, x = A * (0.02 + 0.96 * t), y = 0.24 + 0.2 * t + (R() - 0.5) * 0.06;
    const rad = (0.058 - 0.022 * t) * (0.8 + 0.4 * R()), k = (1.15 - 0.55 * t) * (0.75 + 0.3 * R());
    put(x, y, rad, LIT.lamp, k, 0.04);
    mirror(x, y, rad, LIT.lamp, k, 0.04);
  }
  // Shopfronts glow at street level in cool and rose light.
  const signs = [LIT.teal, LIT.rose, LIT.blue, LIT.teal, LIT.warm, LIT.rose];
  for (let n = Math.round(1 + 2.6 * A), i = 0; i < n; i++) {
    const x = A * ((i + 0.2 + 0.6 * R()) / n), y = 0.47 + R() * 0.1, rad = 0.026 + R() * 0.026, k = 0.3 + R() * 0.35;
    put(x, y, rad, signs[i % signs.length], k, 0.09);
    mirror(x, y, rad, signs[i % signs.length], k, 0.09);
  }
  put(A * 0.63, 0.42, 0.026, LIT.go, 0.75, 0.03);
  mirror(A * 0.63, 0.42, 0.026, LIT.go, 0.75, 0.03);
  // Cars drift slowly: headlights one way, tail lights the other.
  for (let lane = 0; lane < 2; lane++) {
    const head = lane === 1, y0 = head ? 0.735 : 0.665;
    for (let n = Math.round(1.4 + 1.3 * A), i = 0; i < n; i++) {
      const x = (A + 0.5) * ((i + R() * 0.7) / n) - 0.25, y = y0 + (R() - 0.5) * 0.02;
      const rad = head ? 0.038 + R() * 0.012 : 0.03 + R() * 0.01, gap = 2.3 * rad;
      const v = (head ? -1 : 1) * (0.02 + R() * 0.025), k = head ? 1 : 0.7, col = head ? LIT.head : LIT.tail;
      for (const dx of [0, gap]) {
        put(x + dx, y, rad, col, k, 0.03, v);
        put(x + dx, y + 0.085, rad * 0.85, col, k * 0.18, 0.06, v, 2.4);
      }
    }
  }
  lightData = new Float32Array(L);
  nLights = L.length / 12;
  if (P) uploadLights();
}

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 12, LEAD = 0.004;
let ac = null, out = null, noise = null, askedAt = -1e9, voices = 0, dripNext = 0;
let amb = null, bedF = null, patG = null, sq = null, sqNext = 0;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.08 * voices);

function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (err) { return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;
    out = ac.createGain();
    out.gain.value = 0.55;
    out.connect(comp);
    comp.connect(ac.destination);
    // One second of white noise feeds every burst.
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    ambience();
    squeaker();
  }
  // Off screen, the rain stays silent until the window returns.
  if (!running) { ac.suspend()?.catch(() => {}); return; }
  if (ac.state !== 'running') { askedAt = performance.now(); ac.resume()?.catch(() => {}); }
}
// A context still waking queues sounds for a moment.
function live() {
  if (!sound.on || !ac || ac.state === 'closed') return null;
  return ac.state === 'running' || performance.now() - askedAt < 250 ? ac : null;
}
function track(src, ...tails) {
  voices++;
  src.onended = () => { voices--; tails.forEach(n => n.disconnect()); };
}
const GESTURE_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter']);
function unlock(e) {
  if (!sound.on || (e.type === 'keydown' && !GESTURE_KEYS.has(e.key))) return;
  // A touch counts as a gesture only once the finger lifts.
  if (!ac && e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
  audio();
}
// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// Scales a buffer channel to a target loudness.
function norm(d, rms) {
  let s = 0;
  for (let i = 0; i < d.length; i++) s += d[i] * d[i];
  const k = rms / Math.sqrt(s / d.length || 1);
  for (let i = 0; i < d.length; i++) d[i] *= k;
}
// The rain bed: pink noise, a high hiss and a sparse patter.
function ambience() {
  const sr = ac.sampleRate;
  const bed = ac.createBuffer(2, Math.round(sr * 5.3), sr);
  for (let c = 0; c < 2; c++) {
    const d = bed.getChannelData(c);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < d.length; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99765 * b0 + w * 0.099046;
      b1 = 0.963 * b1 + w * 0.2965164;
      b2 = 0.57 * b2 + w * 1.0526913;
      d[i] = b0 + b1 + b2 + w * 0.1848;
    }
    norm(d, 0.25);
  }
  // Patter: drops striking the glass, each a tiny damped ring.
  const pat = ac.createBuffer(2, Math.round(sr * 7.1), sr);
  const PL = pat.getChannelData(0), PR = pat.getChannelData(1);
  for (let n = Math.round(7.1 * 60), k = 0; k < n; k++) {
    const len = Math.round(sr * rand(0.003, 0.011)), at = Math.floor(Math.random() * (PL.length - len));
    const amp = 0.04 + 0.6 * Math.random() ** 3, pan = Math.random(), f = (TAU * rand(2000, 6500)) / sr, dec = 5 / len;
    for (let i = 0; i < len; i++) {
      const v = amp * Math.sin(f * i) * Math.exp(-i * dec) * (0.7 + 0.3 * (Math.random() * 2 - 1));
      PL[at + i] += v * (1 - pan);
      PR[at + i] += v * pan;
    }
  }
  amb = ac.createGain();
  amb.gain.value = 0;
  amb.connect(out);
  const loop = (buf, rate, off) => {
    const s = ac.createBufferSource();
    s.buffer = buf;
    s.loop = true;
    s.playbackRate.value = rate;
    s.start(0, off);
    return s;
  };
  const filter = (type, f, q) => {
    const b = ac.createBiquadFilter();
    b.type = type;
    b.frequency.value = f;
    b.Q.value = q;

  loop(bed, 1.37, 2.1).connect(filter('bandpass', 5600, 0.55)).connect(hissG).connect(amb);

    o.frequency.value = f;
    o.connect(gain(depth)).connect(param);
    o.start();
  };
  lfo(0.067, 0.1, bedG.gain);
  lfo(0.11, 320, lp.frequency);
  lfo(0.049, 0.14, patG.gain);

}
// Heavier rain is louder and brighter.
function rainLevel(fade) {
  if (!amb) return;
  const t = ac.currentTime, k = (heavy ? 1 : 0.62) * (reduce ? 0.8 : 1);
  amb.gain.setTargetAtTime(k, t, fade ? 0.9 : 0.4);
  bedF.setTargetAtTime(heavy ? 2300 : 1500, t, 0.5);
  patG.gain.setTargetAtTime(heavy ? 0.7 : 0.45, t, 0.5);

// A sawtooth through a narrow band: the glass's squeak.
function squeaker() {
  const o = ac.createOscillator(), v = ac.createOscillator(), vg = ac.createGain();

  v.frequency.value = 7;
  vg.gain.value = 14;
  v.connect(vg).connect(o.frequency);
  bp.type = 'bandpass';
  bp.frequency.value = 1800;
  bp.Q.value = 6;
  g.gain.value = 0;

  o.start();

}
// Glass squeaks in short chirps while the finger keeps moving.
function squeak(speed) {
  const a = live();
  if (!a || !sq) return;
  const t = a.currentTime + LEAD;
  if (t < sqNext || speed < 160) return;

  const dur = rand(0.07, 0.24), f = rand(620, 1000) * (1 + Math.min(speed, 2400) / 4000);
  const amp = 0.028 * Math.min(1, speed / 900);
  const fq = sq.o.frequency, gg = sq.g.gain;
  fq.cancelScheduledValues(t);
  fq.setValueAtTime(f, t);
  fq.linearRampToValueAtTime(f * jit(0.1) * 1.06, t + dur);
  sq.bp.frequency.setValueAtTime(f * 2.1, t);
  gg.cancelScheduledValues(t);
  gg.setValueAtTime(0, t);
  gg.linearRampToValueAtTime(amp, t + 0.02);
  gg.setValueAtTime(amp, t + dur);
  gg.linearRampToValueAtTime(0, t + dur + 0.04);

}
// A running drop ticks: a rising plink over a tiny click.
function drip(x, size) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < dripNext) return;

  const f = (1 - 0.35 * size) * jit(0.12), g = level() * (0.45 + 0.55 * size) * jit(0.15);
  let end = out, pan = null;
  if (a.createStereoPanner) {
    pan = a.createStereoPanner();
    pan.pan.value = clamp(x * 1.6 - 0.8, -0.8, 0.8);
    pan.connect(out);
    end = pan;
  }
  const o = a.createOscillator(), og = a.createGain();
  o.frequency.setValueAtTime(1100 * f, t);
  o.frequency.exponentialRampToValueAtTime(2100 * f, t + 0.03);
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(0.06 * g, t + 0.002);
  og.gain.setTargetAtTime(0, t + 0.002, 0.016);
  o.connect(og).connect(end);
  o.start(t);
  o.stop(t + 0.12);
  const src = a.createBufferSource(), hp = a.createBiquadFilter(), ng = a.createGain();
  src.buffer = noise;
  hp.type = 'highpass';
  hp.frequency.value = 2600;
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(0.08 * g, t + 0.0005);
  ng.gain.setTargetAtTime(0, t + 0.0005, 0.002);
  src.connect(hp).connect(ng).connect(end);
  src.start(t, Math.random() * 0.9, 0.02);
  track(o, og, ng, ...(pan ? [pan] : []));

/* ---------- the glass: drops in CSS pixels, fog on a coarse grid ---------- */
// A drop's radius is half its bitmap's size.
// Water fills the middle 0.43 of that radius.
const MAX_DROPS = 1200, REF = 1160 * 652, VIS = 0.43;
let W = 0, H = 0, S = 1, R_MIN = 10, R_MAX = 40, G = 46, area = 1, pr = 1;
let drops = [], born = [], heavy = false, rainAcc = 0, mistAcc = 0;
// Queued instances, six floats each, in device pixels.
const mistQ = [], eraseQ = [];
const rates = () => {
  const k = reduce ? 0.45 : 1;
  return heavy ? { rain: 44 * k, mist: 520 * k } : { rain: 16 * k, mist: 220 * k };
};
function makeDrop(o) {
  if (drops.length + born.length >= MAX_DROPS) return null;
  // Surface tension varies a little from drop to drop.
  return Object.assign({ x: 0, y: 0, r: R_MIN, sx: 0, sy: 0, m: 0, sl: 0, last: 0, tension: rand(0.7, 1.5), parent: null, dead: false, shrink: 0, ran: false }, o);
}
// Sprite quads cover the bitmap's middle, where the water is.
function stamp(q, x, y, r, sx = 0, sy = 0) {
  const h = 0.78 * r * (1 + sy) * pr;
  q.push(x * pr, y * pr, 0.52 * r * (1 + sx) * pr, 1, h, h);
}
const sprayR = () => 1.8 + 2.4 * Math.random() ** 2;
function burst(n) {
  for (let i = 0; i < n; i++) stamp(mistQ, Math.random() * W, Math.random() * H, sprayR());
}

// Collisions look up neighbours on a coarse grid.
let gcols = 0, grows = 0;
const grid = [];
const gx = x => clamp(Math.floor(x / G) + 1, 0, gcols - 1), gy = y => clamp(Math.floor(y / G) + 1, 0, grows - 1);
function buildGrid() {
  gcols = Math.ceil(W / G) + 3;
  grows = Math.ceil(H / G) + 3;
  const n = gcols * grows;
  while (grid.length < n) grid.push([]);
  for (let i = 0; i < n; i++) grid[i].length = 0;
  for (const d of drops) if (!d.dead) grid[gy(d.y) * gcols + gx(d.x)].push(d);
}
// The larger drop takes most of the other's water and a push.
function merge(a, b) {
  const moving = a.m > S || b.m > S;
  a.r = Math.min(R_MAX, Math.sqrt(a.r * a.r + 0.8 * b.r * b.r));
  a.m += 1.5 * S;
  a.sx = Math.max(a.sx, 0.25);
  a.sy = Math.max(a.sy, 0.15);
  b.dead = true;
  if (moving && a.r > R_MAX * 0.5 && Math.random() < 0.3) drip(a.x / W, (a.r - R_MIN) / (R_MAX - R_MIN));
}
function collide(d) {
  const cx = gx(d.x), cy = gy(d.y);
  for (let j = Math.max(0, cy - 1); j <= Math.min(grows - 1, cy + 1); j++) {
    for (let i = Math.max(0, cx - 1); i <= Math.min(gcols - 1, cx + 1); i++) {
      for (const o of grid[j * gcols + i]) {
        if (o === d || o.dead || o.parent === d || d.parent === o) continue;

  ['uSharp', 'uSoft', 'uWet', 'uMist', 'uFog'].forEach((n, i) => gl.uniform1i(P.comp.u[n], i));
  gl.uniform3fv(P.comp.u.uHaze, HAZE);
  gl.useProgram(P.drop.p);
  gl.uniform1i(P.drop.u.uDrop, 5);
  dropTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE5);
  gl.bindTexture(gl.TEXTURE_2D, dropTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, dropBitmap());
  gl.generateMipmap(gl.TEXTURE_2D);
  texParams(gl.LINEAR_MIPMAP_LINEAR);
  gl.activeTexture(gl.TEXTURE0);

  emptyVao = gl.createVertexArray();
  quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const corner = () => {
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  };
  bokehVao = gl.createVertexArray();
  gl.bindVertexArray(bokehVao);
  corner();
  lightBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, lightBuf);
  [[1, 4, 0], [2, 4, 16], [3, 3, 32]].forEach(([loc, n, off]) => {
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, n, gl.FLOAT, false, 48, off);
    gl.vertexAttribDivisor(loc, 1);
  });
  dropVao = gl.createVertexArray();
  gl.bindVertexArray(dropVao);
  corner();
  instBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  instCap = inst.length;
  gl.bufferData(gl.ARRAY_BUFFER, inst.byteLength, gl.DYNAMIC_DRAW);
  [[1, 4, 0], [2, 2, 16]].forEach(([loc, n, off]) => {
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, n, gl.FLOAT, false, 24, off);
    gl.vertexAttribDivisor(loc, 1);
  });
  gl.bindVertexArray(null);

  fogTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, fogTex);
  texParams(gl.LINEAR);
  if (FW) gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, FW, FH, 0, gl.RED, gl.UNSIGNED_BYTE, null);
  fogDirty = true;
  if (nLights) uploadLights();
}
function texParams(min) {
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, min);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, min === gl.NEAREST ? gl.NEAREST : gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}
function uploadLights() {
  gl.bindBuffer(gl.ARRAY_BUFFER, lightBuf);
  gl.bufferData(gl.ARRAY_BUFFER, lightData, gl.STATIC_DRAW);
  gl.useProgram(P.bg.p);
  gl.uniform1fv(P.bg.u.uRoof, roofs);
}
function target(w, h, fmt, filter, mips) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texStorage2D(gl.TEXTURE_2D, mips ? Math.floor(Math.log2(Math.max(w, h))) + 1 : 1, fmt, w, h);
  texParams(filter);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fb, w, h };
}
function freeTarget(t) {
  if (!t) return;
  gl.deleteTexture(t.tex);
  gl.deleteFramebuffer(t.fb);
}
// A fresh canvas gets fresh targets and a fresh mist.
function allocTargets() {
  [sharp, soft, mist, wet].forEach(freeTarget);
  const cw = canvas.width, ch = canvas.height, hdr = FLOAT ? gl.RGBA16F : gl.RGBA8;
  sharp = target(Math.ceil(cw / 2), Math.ceil(ch / 2), hdr, gl.LINEAR_MIPMAP_LINEAR, true);
  soft = target(Math.ceil(cw / 4), Math.ceil(ch / 4), hdr, gl.LINEAR);
  mist = target(cw, ch, gl.RGBA8, gl.NEAREST);
  wet = target(cw, ch, gl.RGBA8, gl.NEAREST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  mistQ.length = 0;
  burst(Math.round(6000 * area));
}
function fit() {
  const w = panel.clientWidth, h = panel.clientHeight;
  if (!w || !h) return;
  rect = null;
  const p = Math.min(devicePixelRatio || 1, lowDpr ? 1 : 1.5, Math.sqrt(1.4e6 / (w * h)));
  const cw = Math.round(w * p), ch = Math.round(h * p);
  if (w !== W || h !== H) layoutGlass(w, h);
  if (canvas.width === cw && canvas.height === ch) return;
  canvas.width = cw;
  canvas.height = ch;
  // Old queued stamps were in the old pixel scale.
  pr = cw / w;
  eraseQ.length = 0;
  if (!ready) return;
  allocTargets();
  // A resized canvas is blank until drawn, so draw now.
  if (running) render(performance.now());
}

/* ---------- drawing ---------- */
function backdrop(t, blur, time) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
  gl.viewport(0, 0, t.w, t.h);
  gl.disable(gl.BLEND);
  gl.useProgram(P.bg.p);
  gl.uniform2f(P.bg.u.uRes, t.w, t.h);
  gl.uniform1f(P.bg.u.uA, sceneA);
  gl.uniform1f(P.bg.u.uBlur, blur ? 0.09 : 0.026);
  gl.bindVertexArray(emptyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.BLEND);
  gl.blendEquation(gl.FUNC_ADD);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(P.bokeh.p);
  gl.uniform1f(P.bokeh.u.uA, sceneA);
  gl.uniform1f(P.bokeh.u.uT, time);
  gl.uniform1f(P.bokeh.u.uBlur, blur);
  gl.bindVertexArray(bokehVao);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nLights);
}
function dropAttribs(base) {
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 24, base * 24);
  gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 24, base * 24 + 16);
}
function drawRange(mode, base, n) {
  if (!n) return;
  gl.uniform1i(P.drop.u.uMode, mode);
  dropAttribs(base);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
}
let decayAcc = 0;
function render(now, dt = 0) {
  const cw = canvas.width, ch = canvas.height;
  const time = ((now / 1000) % 5000) * (reduce ? 0.5 : 1);
  backdrop(sharp, 0, time);
  gl.bindTexture(gl.TEXTURE_2D, sharp.tex);
  gl.generateMipmap(gl.TEXTURE_2D);
  backdrop(soft, 1, time);

  // One buffer holds mist, erasers, the decay sheet and drops.
  const nm = mistQ.length / 6, ne = eraseQ.length / 6;
  const need = (nm + ne + drops.length + 1) * 6;
  if (inst.length < need) inst = new Float32Array(Math.ceil(need * 1.5));
  inst.set(mistQ, 0);
  inst.set(eraseQ, nm * 6);
  let o = (nm + ne) * 6;
  decayAcc += dt;
  // Old mist slowly dries, so the glass never saturates.
  const decay = decayAcc >= 0.5;
  if (decay) {
    decayAcc = 0;
    inst.set([cw / 2, ch / 2, cw, 1, ch, ch], o);
    o += 6;
  }
  const db = o / 6;
  for (const d of drops) {
    if (d.dead) continue;
    // Spread widens a drop, and stretches it taller.
    const h = 0.78 * d.r * (1 + d.sy) * pr;
    inst[o++] = d.x * pr;
    inst[o++] = d.y * pr;
    inst[o++] = 0.52 * d.r * (1 + d.sx) * pr;
    inst[o++] = 1;
    inst[o++] = h;
    inst[o++] = h;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  if (inst.length > instCap) { instCap = inst.length; gl.bufferData(gl.ARRAY_BUFFER, inst.byteLength, gl.DYNAMIC_DRAW); }
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst, 0, o);
  const nd = o / 6 - db;
  mistQ.length = 0;
  eraseQ.length = 0;

  gl.useProgram(P.drop.p);
  gl.uniform2f(P.drop.u.uRes, cw, ch);
  gl.bindVertexArray(dropVao);
  gl.bindFramebuffer(gl.FRAMEBUFFER, mist.fb);
  gl.viewport(0, 0, cw, ch);
  // Spray lands over the mist; moving drops cut it away.
  gl.enable(gl.BLEND);
  gl.blendEquation(gl.FUNC_ADD);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  drawRange(0, 0, nm);
  gl.blendFunc(gl.ZERO, gl.ONE_MINUS_SRC_ALPHA);
  drawRange(1, nm, ne);
  if (decay) { gl.uniform1f(P.drop.u.uAmt, 0.016); drawRange(2, nm + ne, 1); }
  // Drops are stamped fresh each frame.
  gl.bindFramebuffer(gl.FRAMEBUFFER, wet.fb);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  drawRange(0, db, nd);
  gl.disable(gl.BLEND);

  gl.activeTexture(gl.TEXTURE4);
  gl.bindTexture(gl.TEXTURE_2D, fogTex);
  if (fogDirty) {
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, FW, FH, gl.RED, gl.UNSIGNED_BYTE, fogBytes);
    fogDirty = false;
  }
  [sharp, soft, wet, mist].forEach((t, i) => { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, t.tex); });
  gl.activeTexture(gl.TEXTURE0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, cw, ch);
  gl.useProgram(P.comp.p);
  gl.uniform2f(P.comp.u.uRes, cw, ch);
  gl.uniform1f(P.comp.u.uPull, 0.2 * cw);
  gl.uniform1f(P.comp.u.uPr, pr);
  gl.bindVertexArray(emptyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------- one loop, running while the window is in view ---------- */
let raf = 0, last = 0, running = false, onScreen = false, lowDpr = false, slow = 0, frames = 0;
function frame(now) {
  raf = 0;
  if (!running || !ready) return;
  const raw = Math.max(0, (now - last) / 1000), dt = Math.min(raw, 1 / 20);
  last = now;
  // Sustained slow frames drop the pixel ratio to 1.
  if (!lowDpr && ++frames > 30) {
    slow = raw > 0.024 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 40) { lowDpr = true; fit(); }
  }
  step(dt);
  stepSweeps(dt);
  fogStep(dt);
  render(now, dt);
  if (frames === 2) canvas.classList.add('on');
  raf = requestAnimationFrame(frame);
}
// Off screen or hidden, the rain pauses and goes quiet.
function sync() {
  const run = ready && onScreen && !document.hidden;
  if (run === running) return;
  running = run;
  if (run) {
    last = performance.now();
    raf = requestAnimationFrame(frame);
    if (sound.on && ac && ac.state !== 'running') audio();
  } else {
    cancelAnimationFrame(raf);
    raf = 0;
    if (ac && ac.state === 'running') ac.suspend()?.catch(() => {});
  }
}

/* ---------- input ---------- */
let rect = null;
addEventListener('scroll', () => { rect = null; }, { passive: true });
function local(e) {
  const r = rect || (rect = panel.getBoundingClientRect());
  return [e.clientX - r.left, e.clientY - r.top];
}
const strokes = new Map();
panel.addEventListener('pointerdown', e => {
  if (!ready || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const [x, y] = local(e);
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  const R = brush(e.pointerType);
  strokes.set(e.pointerId, { x, y, t: e.timeStamp, R, v: 0 });
  wipeAt(x, y, R);
});
panel.addEventListener('pointermove', e => {
  const s = strokes.get(e.pointerId);
  if (!s) return;
  const list = e.getCoalescedEvents?.() || [];
  for (const c of list.length ? list : [e]) {
    const [x, y] = local(c), gap = Math.hypot(x - s.x, y - s.y);
    if (gap < 0.5) continue;
    wipeSeg(s.x, s.y, x, y, s.R);
    s.v = lerp(s.v, (gap / Math.max(4, c.timeStamp - s.t)) * 1000, 0.35);
    s.x = x;
    s.y = y;
    s.t = c.timeStamp;
  }
  squeak(s.v);
});
const lift = e => strokes.delete(e.pointerId);
panel.addEventListener('pointerup', lift);
panel.addEventListener('pointercancel', lift);
panel.addEventListener('contextmenu', e => e.preventDefault());

const heavyB = document.getElementById('heavy');
function setHeavy(v) {
  heavy = v;
  heavyB.textContent = heavy ? 'Lighter' : 'Heavier';
  rainLevel();
}
heavyB.addEventListener('click', () => setHeavy(!heavy));
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    if (ready) sweep(e.key);
  } else if (e.key === ' ') {
    // Buttons and links keep Space for themselves.
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (!e.repeat) setHeavy(!heavy);
  }
});
sound.onChange(on => {
  if (on) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});

/* ---------- start: shaders link while the glass is seeded ---------- */
function failed() {
  ready = false;
  sync();
  canvas.hidden = true;
  panel.querySelector('.fail').hidden = false;
  heavyB.disabled = true;
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; sync(); });
canvas.addEventListener('webglcontextrestored', async () => {
  try {
    await initGL();
    allocTargets();
    ready = true;
    sync();
  } catch (err) { console.error(err); failed(); }
});
async function boot() {
  await idle();
  fit();
  if (!W) {
    layoutGlass(1160, 652);
    canvas.width = 1160;
    canvas.height = 652;
  }
  const gate = initGL();
  gate.catch(() => {});
  await idle();
  seedGlass();
  try { await gate; } catch (err) { console.error(err); failed(); return; }
  ready = true;
  allocTargets();
  new ResizeObserver(fit).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; sync(); }).observe(panel);
  document.addEventListener('visibilitychange', sync);
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
