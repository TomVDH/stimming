<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rain on glass</title>
<!-- share: tools/ogtags.mjs writes this block -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Stimming">
<meta property="og:title" content="Rain on glass">
<meta property="og:description" content="It's raining cats and dogs.">
<meta property="og:url" content="https://tomvdh.github.io/stimming/rain/">
<meta property="og:image" content="https://tomvdh.github.io/stimming/shared/cards/rain.jpg?v=a48718d3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Rain on glass: the Stimming share card">
<meta name="twitter:card" content="summary_large_image">
<!-- /share -->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: every module downloads in parallel. -->
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm">
<style>
/* Rain on glass: a dusk window in the shared shell. */
:root { --stage: oklch(0.25 0.045 290); }
/* On the dusk glass the fail line keeps a pale tone. */
.fail { color: oklch(0.74 0.02 285); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/rain.svg)"></span><span class="intro-name">Rain on glass</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--rain" id="pane" tabindex="0" role="application" aria-label="A rainy window at dusk. Fog covers the glass. Click to wipe a spot. Drag to wipe the fog. Press an arrow key to wipe a stripe. Press Space to select the next weather.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Rain on glass</h1><div class="vignette" hidden></div></section>
</div>

<script type="module" src="main.js"></script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
import { pageReady } from '../shared/stim.js';
// The intro holds until the page, its font and the first frame are in.
playIntro({ ready: pageReady() });
</script>
</body>
</html>
