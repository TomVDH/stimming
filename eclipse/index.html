<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.03 255); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desert eclipse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./render.js">
<link rel="modulepreload" href="./shaders.js">
<link rel="modulepreload" href="./disc.js">
<link rel="modulepreload" href="./sound.js">
<link rel="modulepreload" href="../shared/gl.js">
<style>
/* Desert eclipse: the moon over the sun, above a salt pan. */
:root { --stage: oklch(0.16 0.03 255); }
.stage--eclipse { background: var(--stage); cursor: grab; }
.stage--eclipse:active { cursor: grabbing; }
.stage--eclipse canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 1.2s ease; touch-action: none;
}
.stage--eclipse canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--eclipse canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Desert eclipse</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--eclipse" id="stage" tabindex="0" role="application" aria-label="A white salt pan under a deep blue sky, with low mesas on the horizon. The moon has taken a bite out of the sun. Drag to move the moon over the sun, or use the Moon slider; as it covers the sun the light thins and cools, the moon's shadow sweeps in from the horizon, and at totality the corona and the stars come out over an orange glow all round. Tap or press Space to glide into totality, or on out.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Desert eclipse</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
