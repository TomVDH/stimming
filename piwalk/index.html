<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.08 0.01 270); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pi walk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./digits.js">
<link rel="modulepreload" href="./render.js">
<link rel="modulepreload" href="./sound.js">
<link rel="modulepreload" href="../shared/glow.js">
<link rel="modulepreload" href="../shared/detail.js">
<link rel="modulepreload" href="../shared/gl.js">
<style>
/* Pi walk: the digits of pi walk a path of light. */
:root { --stage: oklch(0.08 0.01 270); }
.stage--piwalk { background: var(--stage); cursor: pointer; }
.stage--piwalk canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--piwalk canvas.on { opacity: 1; }
/* The readout: the last digits and the count, quiet, top right. */
.pw-read {
  position: absolute; top: 18px; right: 20px; z-index: 1; pointer-events: none;
  display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
  font: 500 13px/1 "Iosevka Term Slab", ui-monospace, monospace; letter-spacing: 0.08em;
  font-variant-numeric: tabular-nums; color: oklch(0.62 0.03 265 / 0.72);
  text-shadow: 0 1px 2px oklch(0.05 0.01 275 / 0.9);
}
.pw-digits { font-size: 15px; white-space: pre; }
.pw-digits i { font-style: normal; opacity: 0.5; }
.pw-digits b { font-weight: 700; color: oklch(0.97 0.01 90); }
.pw-count { font-size: 11px; opacity: 0.8; }
@media (max-width: 640px) { .pw-read { top: 14px; right: 14px; } .pw-digits { font-size: 13px; } }
@media (prefers-reduced-motion: reduce) { .stage--piwalk canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Pi walk</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--piwalk" id="stage" tabindex="0" role="application" aria-label="A dark stage where the digits of pi walk a path of light. Each digit, 0 to 9, takes one step in one of ten directions, like the hours on a dial. The walk starts in the centre and speeds up as it grows; the view zooms out, and the path branches like a coastline. The colour runs from deep indigo at the start to coral at the head. The last digits and the count show in the top right corner. Tap to pause or go on; hold to rush ahead. The Pace slider sets the speed. Press Space to pause and R to start again.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Pi walk</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
