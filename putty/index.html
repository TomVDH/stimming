<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heat putty</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Heat putty: a slab of thermochromic putty that warms under the pointer. */
:root { --stage: oklch(0.2 0.05 300); }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; cursor: pointer; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/putty.svg)"></span><span class="intro-name">Heat putty</span><span class="intro-sub">Stimming No. 18</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--putty" id="stage" tabindex="0" role="application" aria-label="A slab of heat-sensitive putty. Drag to warm it and leave colour trails that cool slowly; press and hold to dent it. The chips change the colours it shifts between.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Heat putty needs WebGL 2 with float textures, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" role="group" aria-label="Putty">
        <button class="chip" type="button" data-value="0" aria-pressed="true">Violet</button>
        <button class="chip" type="button" data-value="1" aria-pressed="false">Teal</button>
        <button class="chip" type="button" data-value="2" aria-pressed="false">Noir</button>
      </div>
      <div class="actions">
        <button class="chip" id="cool" type="button">Clear</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag</dt><dd>warm</dd></div>
        <div><dt>Hold</dt><dd>dent</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Heat putty</h1><div class="vignette" hidden></div></section>
</div>

<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
<script type="module">
import { initPage, audioKit, choices, whenVisible, reduced } from '../shared/stim.js';
initPage({ id: 'putty' });

const stage = document.getElementById('stage'), canvas = stage.querySelector('canvas');
const gl = canvas.getContext('webgl2', { antialias: false, premultipliedAlpha: false });
const fail = () => { stage.querySelector('.fail').hidden = false; throw new Error('no webgl2'); };
if (!gl || !gl.getExtension('EXT_color_buffer_float')) fail();
gl.getExtension('OES_texture_float_linear');

/* ---------- shaders ---------- */
const VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
// R is heat, G is dent depth. Heat spreads and cools; dents relax.
const SIM = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uState; uniform vec2 uTexel; uniform vec4 uSeg; uniform vec2 uBrush; uniform float uDent, uAspect;
void main() {
  vec2 s = texture(uState, vUv).rg;
  vec2 n = texture(uState, vUv + vec2(uTexel.x, 0)).rg + texture(uState, vUv - vec2(uTexel.x, 0)).rg
         + texture(uState, vUv + vec2(0, uTexel.y)).rg + texture(uState, vUv - vec2(0, uTexel.y)).rg;
  float heat = (s.r + 0.09 * (n.r - 4.0 * s.r)) * 0.996;
  float dent = (s.g + 0.08 * (n.g - 4.0 * s.g)) * 0.992;
  // The brush is a segment from the last pointer spot to this one.
  vec2 a = uSeg.xy * vec2(uAspect, 1.0), b = uSeg.zw * vec2(uAspect, 1.0), p = vUv * vec2(uAspect, 1.0);
  vec2 ab = b - a;
  float t = clamp(dot(p - a, ab) / max(dot(ab, ab), 1e-6), 0.0, 1.0);
  vec2 d = p - (a + ab * t);
  float k = exp(-dot(d, d) / (uBrush.x * uBrush.x));
  heat = min(1.4, heat + uBrush.y * k);
  dent = min(1.0, dent + uDent * k);
  o = vec4(heat, dent, 0.0, 1.0);
}`;
// Thermochromic colour from heat, lit as glossy putty from the dent's slope.
const VIEW = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uState; uniform vec2 uTexel; uniform vec3 uCold, uMid, uHot;
float D(vec2 p) { return texture(uState, p).g; }
void main() {
  float heat = texture(uState, vUv).r;
  // A soft grain gives the putty body.
  float grain = fract(sin(dot(floor(vUv / uTexel), vec2(12.9898, 78.233))) * 43758.5453) * 0.03;
  float t = smoothstep(0.05, 0.9, heat);
  vec3 base = t < 0.5 ? mix(uCold, uMid, t * 2.0) : mix(uMid, uHot, t * 2.0 - 1.0);
  float dx = D(vUv + vec2(uTexel.x, 0)) - D(vUv - vec2(uTexel.x, 0));
  float dy = D(vUv + vec2(0, uTexel.y)) - D(vUv - vec2(0, uTexel.y));
  vec3 n = normalize(vec3(dx * 9.0, dy * 9.0, 1.0));
  vec3 L = normalize(vec3(-0.45, 0.55, 0.7));
  float diff = 0.72 + 0.35 * dot(n, L);
  float spec = pow(max(dot(reflect(-L, n), vec3(0, 0, 1)), 0.0), 40.0) * 0.35;
  vec3 col = base * diff + spec + grain - D(vUv) * 0.12;
  o = vec4(pow(max(col, 0.0), vec3(1.0 / 2.2)), 1.0);
}`;
function program(fs) {
  const p = gl.createProgram();
  [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]].forEach(([t, src]) => {
    const sh = gl.createShader(t); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(sh)); fail(); }
    gl.attachShader(p, sh);
  });
  gl.bindAttribLocation(p, 0, 'aPos'); gl.linkProgram(p);
  const u = {};
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(p, i).name; u[n] = gl.getUniformLocation(p, n); }
  return { p, u };
}
const sim = program(SIM), view = program(VIEW);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

/* ---------- palettes ---------- */
// Cold, mid and hot colours, linear RGB, for each putty.
const PUTTY = [
  [[0.16, 0.06, 0.32], [0.82, 0.18, 0.55], [1.0, 0.72, 0.5]],
  [[0.02, 0.22, 0.26], [0.1, 0.62, 0.55], [0.98, 0.9, 0.25]],
  [[0.02, 0.02, 0.025], [0.32, 0.2, 0.06], [1.0, 0.76, 0.28]],
];
let putty = 0;

/* ---------- state ---------- */
let W = 2, Hh = 2, targets = [], flip = 0, aspect = 1;
function makeTarget() {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG16F, W, Hh, 0, gl.RG, gl.HALF_FLOAT, null);
  [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
  [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fb };
}
function fit() {
  const r = canvas.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.max(2, Math.round(r.width * dpr)); canvas.height = Math.max(2, Math.round(r.height * dpr));
  aspect = r.width / Math.max(1, r.height);
  const n = 360;
  W = aspect >= 1 ? n : Math.round(n * aspect); Hh = aspect >= 1 ? Math.round(n / aspect) : n;
  targets.forEach(t => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); });
  targets = [makeTarget(), makeTarget()];
  wake();
}
// seg runs from the last stamped spot to the newest; brush is radius and heat.
let seg = [0, 0, 0, 0], brush = [0.05, 0], dentAmt = 0;
function step() {
  const src = targets[flip], dst = targets[1 - flip];
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, W, Hh);
  gl.useProgram(sim.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(sim.u.uState, 0);
  gl.uniform2f(sim.u.uTexel, 1 / W, 1 / Hh);
  gl.uniform4f(sim.u.uSeg, ...seg);
  gl.uniform2f(sim.u.uBrush, brush[0], brush[1]);
  gl.uniform1f(sim.u.uDent, dentAmt);
  gl.uniform1f(sim.u.uAspect, aspect);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  flip = 1 - flip;
}
function render() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(view.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, targets[flip].tex);
  gl.uniform1i(view.u.uState, 0);
  gl.uniform2f(view.u.uTexel, 1 / W, 1 / Hh);
  const [c, m, h] = PUTTY[putty];
  gl.uniform3f(view.u.uCold, ...c); gl.uniform3f(view.u.uMid, ...m); gl.uniform3f(view.u.uHot, ...h);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- sound ---------- */
// A soft squish when the putty is pressed.
const kit = audioKit({ gain: 0.45 });
function squish() {
  const ac = kit.live(); if (!ac || !kit.noise) return;
  const src = ac.createBufferSource(); src.buffer = kit.noise;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500; f.Q.value = 6;
  const g = ac.createGain(), t = ac.currentTime;
  f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(1400, t + 0.15);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  src.connect(f); f.connect(g); g.connect(kit.out); src.start(t, Math.random() * 0.5, 0.3);
}

/* ---------- loop ---------- */
// The slab keeps cooling for fourteen seconds after the last touch, then sleeps.
let raf = 0, lastInput = 0, visible = true, held = null;
function frame(now) {
  // A still, pressed pointer sinks deeper and warms in place.
  if (held && brush[1] === 0) { seg = [held[0], held[1], held[0], held[1]]; brush = [0.034, 0.02]; dentAmt = 0.025; }
  step(); render();
  // The next stamp starts where this one ended.
  seg = [seg[2], seg[3], seg[2], seg[3]]; brush[1] = 0; dentAmt = 0;
  if (visible && (held || now - lastInput < 14000)) raf = requestAnimationFrame(frame);
  else { raf = 0; kit.rest(() => !raf); }
}
function wake() { lastInput = performance.now(); if (!raf) raf = requestAnimationFrame(frame); }
whenVisible(stage, v => { visible = v; if (v) wake(); });

/* ---------- input ---------- */
const at = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height]; };
let last = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  held = last = at(e); squish(); wake();
  seg = [...held, ...held];
  if (reduced()) { brush = [0.06, 0.6]; step(); render(); }
});
canvas.addEventListener('pointermove', e => {
  const p = at(e);
  // Even a hover warms the putty a little; a drag warms it more.
  const moved = last ? Math.hypot(p[0] - last[0], p[1] - last[1]) : 0;
  seg = [seg[2], seg[3], p[0], p[1]];
  if (!last) seg = [p[0], p[1], p[0], p[1]];
  brush = [held ? 0.032 : 0.026, Math.max(brush[1], held ? 0.035 + moved * 0.6 : 0.012)];
  if (held) held = p;
  last = p; wake();
});
const lift = () => { held = null; };
canvas.addEventListener('pointerup', lift);
canvas.addEventListener('pointercancel', lift);
canvas.addEventListener('pointerleave', () => { last = null; });

choices(document.querySelector('.choices'), v => { putty = +v; wake(); });
document.getElementById('cool').addEventListener('click', () => { targets.forEach(t => { gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb); gl.clear(gl.COLOR_BUFFER_BIT); }); wake(); });

new ResizeObserver(fit).observe(stage);
fit();
</script>
</body>
</html>
