<style>
/* Galaxy: a WebGPU star field on a black panel. */
:root { --stage: #000; }
.space canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.space canvas.on { opacity: 1; }
.space.grab canvas { cursor: grab; }
.space.held canvas { cursor: grabbing; }
@media (prefers-reduced-motion: reduce) { .space canvas { transition: none; } }
/* Add opens a tray of objects above the bar. */
.adder { position: relative; }
#addBtn svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; }
.add {
  position: absolute; left: 0; bottom: calc(100% + 10px); z-index: 20; display: flex; gap: 6px; padding: 8px;
  background: oklch(0.19 0.012 275 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
/* Settings opens a column of tweaks above the bar. */
.add.sets { flex-direction: column; align-items: stretch; gap: 8px; min-width: 15em; padding: 10px; }
.sets .slider { justify-content: space-between; }
.sets .chip { justify-content: space-between; }
#setBtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
.add .chip.icon svg .solid { fill: currentColor; stroke: none; }
/* Objects sit four to a row. */
#add { display: grid; grid-template-columns: repeat(4, auto); }
@media (prefers-reduced-motion: reduce) { .add { transition: none; } }
</style>

<script type="module">
import { initPage, sound, oklchLinear } from '../shared/stim.js';

RM.addEventListener?.('change', e => { reduce = e.matches; });
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);

/* ---------- sound: synthesised, started by the first gesture ---------- */
// Only the drone sounds: one voice per cluster.
let ac = null, out = null, askedAt = -1e9, restT = 0;
const mtof = m => 440 * 2 ** ((m - 69) / 12);

const saved = k => { try { return localStorage.getItem(`stimming.galaxy.${k}`); } catch (err) { return null; } };

// Sweeps move the drone's and the hole chord's lowpass; they start off.
let sweeps = saved('sweeps') === '1';

// The drone is one D chord, root first.
// Each cluster rank adds one voice, heaviest on the root.
const DRONE = [38, 45, 50, 54, 57, 61, 64, 69];
const AMP = [0.08, 0.055, 0.045, 0.038, 0.032, 0.024, 0.019, 0.016];
const layers = [];
// The star count writes these targets twice a second.
const mixAt = { level: new Float32Array(8) };
let droneLfo = null;

function audio() {

    const AC = window.AudioContext || window.webkitAudioContext;

    try { ac = new AC(); } catch (err) { return; }

    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;
    out = ac.createGain();
    out.gain.value = 0.55;
    out.connect(comp);
    comp.connect(ac.destination);

    const lfo = ac.createOscillator();
    droneLfo = ac.createGain();
    lfo.frequency.value = 0.06;
    droneLfo.gain.value = sweeps ? 70 : 0;
    lfo.connect(droneLfo);
    lfo.start();
    for (let k = 0; k < 8; k++) layers.push(makeLayer(k));

  if (ac.state !== 'running') { askedAt = performance.now(); ac.resume()?.then(() => mixLayers()).catch(() => {}); }
}
// One drone voice per cluster rank, silent until stars bind.
// Each voice is a detuned pair under a breathing lowpass.
function makeLayer(k) {
  const g = ac.createGain(), lp = ac.createBiquadFilter();
  g.gain.value = 0;
  lp.type = 'lowpass';
  lp.frequency.value = k ? 900 : 600;
  lp.Q.value = 0.4;
  droneLfo.connect(lp.frequency);
  lp.connect(g).connect(out);
  const f = mtof(DRONE[k]);
  for (const sgn of [-1, 1]) {
    const o = ac.createOscillator();
    o.type = k ? 'triangle' : 'sine';
    o.frequency.value = f;
    o.detune.value = sgn * (3 + 2 * k);
    o.connect(lp);
    o.start();
  }

}
// Layers glide toward the targets in mixAt.
function mixLayers(tau = 3) {
  if (!ac || ac.state !== 'running' || !layers.length) return;
  const t = ac.currentTime, on = sound.on && running;
  // Each voice is simply on or off, so the drone never sweeps.
  layers.forEach((L, k) => {

    L.g.gain.setTargetAtTime(AMP[k] * lit, t, tau);

// A context still waking queues sounds for a moment.
// A new hole sounds a four-part chord in the drone's own voice.
// The voices bloom in turn, hold, then sink back into the drone.
const HOLE_CHORD = [50, 57, 66, 73];
function holeChord() {

  if (sweeps) {
    lp.frequency.linearRampToValueAtTime(1400, t0 + 3);
    lp.frequency.setTargetAtTime(300, t0 + 5.5, 2);

  bus.gain.value = 1;
  lp.connect(bus).connect(out);

    const g = a.createGain(), t = t0 + k * 0.35, f = mtof(m);

    g.connect(lp);
    for (const sgn of [-1, 1]) {
      const o = a.createOscillator();
      o.type = k ? 'triangle' : 'sine';
      o.frequency.value = f;
      o.detune.value = sgn * (4 + 2 * k);
      o.connect(g);
      o.start(t);
      o.stop(t0 + 14);

function live() {

}
// While the panel is off screen, the context sleeps.
function rest() {

  mixLayers(0.08);
  restT = setTimeout(() => {

}
function wakeSound() {
  clearTimeout(restT);
  if (!sound.on || !ac) return;
  if (ac.state === 'running') return mixLayers();
  askedAt = performance.now();
  ac.resume()?.then(() => mixLayers()).catch(() => {});

/* ---------- capability check ---------- */
// Without WebGPU the panel shows one line and nothing runs.
async function hasWebGPU() {
  if (!navigator.gpu) return false;
  try {
    const { default: WebGPU } = await import('three/addons/capabilities/WebGPU.js');
    return WebGPU.isAvailable();
  } catch {

  document.getElementById('ctl').hidden = true;
  document.getElementById('kind').hidden = true;

/* ---------- constants ---------- */

// The rest wait for flings.

const MAXW = 8, CAP = 6, HOLE_WELLS = 6;

const DISK_N = SMALL ? 16384 : 32768, DISK_SPIN = 2.4, DISK_PX = 2.4, TRAIL = 7, TRAIL_DT = 0.08;
const JET_N = SMALL ? 4096 : 8192, JET_RATE = 0.45;
const BEAM_N = SMALL ? 1024 : 2048, BEAM_RATE = 0.6, SHELL_N = SMALL ? 3072 : 6144;
const EPS2 = 0.2, EPSW2 = 1, KILL2 = 70 * 70, DEAD = -1e9;

let renderer = null, camera = null;
let simT = 0, ring = SEED, fling = null, hold = null, lowDpr = false, pick = 'star', pace = PACE;

    mix, sqrt, cos, sin, log, exp, cross, inverseSqrt, varying, atomicAdd, atomicStore, pass, max, atan,
    fract, step, cameraPosition,
  } = TSL;

  // The stock after-image cuts trails at a hard threshold.
  // This one lets the old frame decay smoothly to black.
  class Exposure extends AfterImageNode {
    setup(builder) {

  renderer = new THREE.WebGPURenderer({ antialias: false });
  await renderer.init();

  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  const canvas = renderer.domElement;

  /* ---------- star buffers ---------- */
  // Position xyz, w is speed relative to the strongest well.
  const pos = instancedArray(N, 'vec4');
  // Velocity xyz, w is the birth time.
  // DEAD marks an empty slot.
  const vel = instancedArray(N, 'vec4');
  // Slot 0 counts tight stars, slots 1 to MAXW count per well.
  // The last slot totals every star a hole swallows.
  const NC = MAXW + 2, EATEN = MAXW + 1;
  const counter = instancedArray(NC, 'uint').toAtomic();

  const uDt = uniform(STEP);
  const uTime = uniform(0);
  const uClearT = uniform(-1);
  const uFrame = uniform(new THREE.Vector3());
  const uW = [], uWV = [], uWH = [];
  for (let k = 0; k < MAXW; k++) {
    uW.push(uniform(new THREE.Vector4(0, 0, 0, 0)));
    uWV.push(uniform(new THREE.Vector4()));
    // Horizon radius, zero for an ordinary well.
    uWH.push(uniform(0));
  }
  // Pulsars: xz position, then the beam direction as cos and sin.
  // uPulOn is zero for every slot that holds no pulsar.
  const uPul = [], uPulOn = [];
  for (let k = 0; k < MAXW; k++) {
    uPul.push(uniform(new THREE.Vector4()));
    uPulOn.push(uniform(0));
  }
  // Magnetars: xz position and swirl strength.
  const uMag = [];
  for (let k = 0; k < MAXW; k++) uMag.push(uniform(new THREE.Vector3()));
  // The wormhole: both mouths' xz, and whether it is open.
  const uWorm = uniform(new THREE.Vector4()), uWormOn = uniform(0);
  // The supernova shell: xz centre, radius, push strength.
  const uBlast = uniform(new THREE.Vector4()), uBlastAge = uniform(0), uBlastLen = uniform(BLAST_T);
  const uShellHot = uniform(new THREE.Color(...SHELLS.nova.hot)), uShellCool = uniform(new THREE.Color(...SHELLS.nova.cool));
  // Comet tails: xz position, then the tail direction.
  const uTail = [], uTailOn = [];
  for (let k = 0; k < MAXW; k++) {
    uTail.push(uniform(new THREE.Vector4()));
    uTailOn.push(uniform(0));
  }
  // Beam weight at p: a narrow cone along both beams.
  const beamAt = (k, p) => {
    const P = uPul[k];
    const dx = p.x.sub(P.x), dz = p.z.sub(P.y);
    const along = dx.mul(P.z).add(dz.mul(P.w)), perp = dx.mul(P.w).sub(dz.mul(P.z));
    const ra = along.abs();
    const wd = ra.mul(0.05).add(0.12);
    const w = exp(perp.div(wd).pow(2).negate()).mul(smoothstep(0.2, 0.8, ra)).mul(exp(ra.div(-BEAM_L))).mul(uPulOn[k]);
    return { w, along };
  };
  // The held cluster is a ring-buffer range that follows the pointer.
  const uHeldStart = uniform(0, 'uint');
  const uHeldCount = uniform(0, 'uint');
  const uSalt = uniform(1, 'uint');
  const uHoldPos = uniform(new THREE.Vector3());
  const uHoldVel = uniform(new THREE.Vector3());
  const uHoldT0 = uniform(0);
  const uHoldR = uniform(0.3);
  const uSettle = uniform(0.1);
  const uArms = uniform(0.035);

  const gauss = (a, b) => sqrt(log(a.max(1e-7)).mul(-2)).mul(cos(b.mul(TAU)));
  // Softened circular speed around a point mass.
  const vcirc = (m, r) => sqrt(m.mul(r).mul(r).div(r.mul(r).add(EPS2).pow(1.5)));

  /* ---------- seed: two discs with two trailing arms each ---------- */
  const gal = [0, 1].map(() => ({
    c: uniform(new THREE.Vector4()), v: uniform(new THREE.Vector3()),
    ex: uniform(new THREE.Vector3(1, 0, 0)), en: uniform(new THREE.Vector3(0, 1, 0)), ez: uniform(new THREE.Vector3(0, 0, 1)),
    arm: uniform(0),
  }));
  const seedPass = Fn(() => {
    const i = instanceIndex;
    const P = pos.element(i), V = vel.element(i);
    If(i.lessThan(uint(SEED)), () => {
      const H = k => hash(i.mul(uint(29)).add(uint(k * 7919 + 3)));
      // Odd slots belong to the second galaxy, so recycling thins both.
      const isB = i.bitAnd(uint(1)).equal(uint(1));
      const pick = key => select(isB, gal[1][key], gal[0][key]);
      const C = pick('c'), M = C.w;
      // Disc radii are exponential, the far tail folded inside.
      const rr = log(H(1).mul(H(2)).max(1e-7)).negate().mul(1.15);
      const r = select(rr.greaterThan(4.6), H(3).mul(4.6), rr).max(0.12).toVar();
      // Most disc stars crowd two log spirals.
      const inArm = H(4).lessThan(0.7);
      const arm = select(H(5).lessThan(0.5), float(0), float(Math.PI)).add(pick('arm'));
      const wind = log(r).mul(WIND);
      const th = select(inArm, arm.sub(wind).add(gauss(H(6), H(7)).mul(0.3)), H(8).mul(TAU)).toVar();
      const vc = vcirc(M, r).toVar();
      const lp = vec3(cos(th).mul(r), gauss(H(9), H(10)).mul(r.mul(0.03).add(0.03)), sin(th).mul(r));
      const lv = vec3(sin(th).negate(), 0, cos(th)).mul(vc)
        .add(vec3(gauss(H(11), H(12)), gauss(H(13), H(14)).mul(0.4), gauss(H(15), H(16))).mul(vc.mul(0.05)));
      // A bulge of stars on randomly tilted orbits.
      const bulge = H(17).lessThan(0.09);
      const br = H(18).pow(1.8).mul(0.95).add(0.06);
      const cz = H(19).mul(2).sub(1), ph = H(20).mul(TAU), sz = sqrt(float(1).sub(cz.mul(cz)));
      const bd = vec3(sz.mul(cos(ph)), cz.mul(0.55), sz.mul(sin(ph))).normalize().toVar();
      const bt = cross(vec3(H(21).sub(0.5), H(22).sub(0.5).add(0.35), H(23).sub(0.5)), bd).normalize();
      const L = select(bulge, bd.mul(br), lp).toVar();
      const LV = select(bulge, bt.mul(vcirc(M, br).mul(0.82)), lv).toVar();
      const EX = pick('ex'), EN = pick('en'), EZ = pick('ez');
      const wp = C.xyz.add(EX.mul(L.x)).add(EN.mul(L.y)).add(EZ.mul(L.z));
      const wv = pick('v').add(EX.mul(LV.x)).add(EN.mul(LV.y)).add(EZ.mul(LV.z));
      P.assign(vec4(wp, LV.length()));
      // Seeded stars are born lit, so the still pair shows at once.
      V.assign(vec4(wv, -0.5));
    }).Else(() => {
      P.assign(vec4(0, 0, 0, 0));
      V.assign(vec4(0, 0, 0, DEAD));
    });
  })().compute(N);

  /* ---------- update: wells pull, the held cluster follows ---------- */
  const updatePass = Fn(() => {
    const i = instanceIndex;
    const P = pos.element(i), V = vel.element(i);
    const born = V.w.toVar();
    const rel = i.add(uint(N)).sub(uHeldStart).mod(uint(N));
    // Held slots are reborn every step.
    // Cleared and empty slots are skipped.
    If(rel.lessThan(uHeldCount), () => {
      const s = i.add(uSalt);
      const H = k => hash(s.add(uint(k * N)));
      // A small spinning cluster: inner stars circle faster.
      const r = sqrt(log(float(1).sub(H(0).mul(0.93))).negate()).mul(uHoldR).mul(0.62).toVar();
      const a = H(1).mul(TAU).add(uTime.mul(float(2.4).div(r.add(0.25)))).toVar();
      const off = vec3(cos(a).mul(r), H(2).sub(0.5).mul(uHoldR).mul(0.14), sin(a).mul(r));
      const tan = vec3(sin(a).negate(), 0, cos(a));
      const spread = uHoldVel.length().mul(0.07).add(0.12);
      const g = vec3(gauss(H(3), H(4)), gauss(H(5), H(6)).mul(0.25), gauss(H(7), H(8))).mul(spread);
      const v = uHoldVel.add(tan.mul(r.mul(1.1))).add(g);
      const t = uHoldT0.add(max(rel.toFloat().sub(INIT), 0).div(RATE));
      P.assign(vec4(uHoldPos.add(off), uHoldVel.length().add(1.4)));
      V.assign(vec4(v, t));
    }).ElseIf(born.greaterThanEqual(uClearT), () => {
      const p = P.xyz.toVar(), v = V.xyz.toVar();
      const acc = uFrame.toVar();
      const best = float(0).toVar(), host = vec3(0).toVar(), hostP = vec3(0).toVar(), hostM = float(0).toVar();
      const hostPh = float(0).toVar(), hostH = float(0).toVar();
      for (let k = 0; k < MAXW; k++) {
        const d = uW[k].xyz.sub(p).toVar();
        const inv = inverseSqrt(d.dot(d).add(EPS2)).toVar();
        const f = uW[k].w.mul(inv).mul(inv).toVar();
        acc.addAssign(d.mul(f.mul(inv)));
        // Colour speed is measured against the strongest pull.
        If(f.greaterThan(best), () => {
          best.assign(f); host.assign(uWV[k].xyz); hostP.assign(uW[k].xyz); hostM.assign(uW[k].w);
          hostPh.assign(uWV[k].w); hostH.assign(uWH[k]);
        });
      }
      // Settling: near a well, orbits ease toward circles in the plane.
      const dp = p.sub(hostP).toVar();
      const r2 = dp.x.mul(dp.x).add(dp.z.mul(dp.z)).toVar();
      const vr = v.sub(host).toVar();
      const tng = vec3(dp.z.negate(), 0, dp.x).mul(inverseSqrt(r2.add(1e-4))).toVar();
      // Each star keeps its own sense of rotation.
      const sgn = select(vr.dot(tng).greaterThanEqual(0), float(1), float(-1));
      // Around a hole, orbits settle fast and drift inward.
      const reach = hostH.mul(HOLE_REACH);
      const near = select(hostH.greaterThan(0), exp(r2.negate().div(reach.mul(reach).add(1e-4))), float(0)).toVar();
      const inward = vec3(dp.x, 0, dp.z).mul(inverseSqrt(r2.add(1e-4))).mul(near.mul(-INFLOW));
      const goal = tng.mul(vcirc(hostM, sqrt(r2)).mul(sgn)).add(vec3(0, dp.y.mul(-0.6), 0)).add(inward);
      const ease = uSettle.mul(exp(r2.mul(-1 / 16))).mul(hostM.min(1)).add(near.mul(0.8));
      v.addAssign(goal.sub(vr).mul(ease.mul(uDt).min(1)));
      // A faint two-arm spiral potential turns with each well, so arms persist.
      const rr = sqrt(r2.add(1e-4)).toVar();
      const omega = sqrt(hostM.div(44));
      const psi = atan(dp.z, dp.x).sub(uTime.mul(omega)).mul(2).add(log(rr).mul(WIND * 2)).add(hostPh).toVar();
      const ip = inverseSqrt(r2.add(EPS2)).toVar();
      const phi0 = hostM.mul(ip), dphi = hostM.mul(rr).mul(ip).mul(ip).mul(ip);

      const fade = uArms.mul(exp(r2.mul(-1 / 50))).mul(r2.div(r2.add(1)));
      acc.addAssign(vec3(dp.x, 0, dp.z).div(rr).mul(fr).add(tng.mul(ft)).mul(fade));

      for (let k = 0; k < MAXW; k++) {

          const b = beamAt(k, p);

        });
      }
      // A magnetar's field drags stars round it.
      for (let k = 0; k < MAXW; k++) {
        If(uMag[k].z.greaterThan(0), () => {
          const mx = p.x.sub(uMag[k].x), mz = p.z.sub(uMag[k].y);
          const m2 = mx.mul(mx).add(mz.mul(mz));
          const sw = uMag[k].z.mul(exp(m2.div(-9))).div(sqrt(m2).add(0.4));
          acc.addAssign(vec3(mz.negate(), 0, mx).mul(sw.mul(inverseSqrt(m2.add(1e-4)))));
        });

      If(uBlast.w.greaterThan(0), () => {

        const br = sqrt(bx.mul(bx).add(bz.mul(bz)).add(1e-4));
        const shell = exp(br.sub(uBlast.z).div(0.6).pow(2).negate());
        acc.addAssign(vec3(bx, 0, bz).div(br).mul(shell.mul(uBlast.w)));
      });
      v.addAssign(acc.mul(uDt));
      p.addAssign(v.mul(uDt));
      // A star that falls into one mouth leaves the other, still moving.
      const qa = vec3(p.x.sub(uWorm.x), 0, p.z.sub(uWorm.y)), qb = vec3(p.x.sub(uWorm.z), 0, p.z.sub(uWorm.w));
      const open = uWormOn.greaterThan(0);
      const inA = open.and(qa.dot(qa).lessThan(WORM_R * WORM_R)).and(v.dot(qa).lessThan(0));
      const inB = open.and(qb.dot(qb).lessThan(WORM_R * WORM_R)).and(v.dot(qb).lessThan(0));
      p.assign(select(inA, vec3(uWorm.z, p.y, uWorm.w).sub(qa), select(inB, vec3(uWorm.x, p.y, uWorm.y).sub(qb), p)));

      const q = p.sub(hostP).toVar();
      const eaten = hostH.greaterThan(0).and(q.dot(q).lessThan(hostH.mul(hostH)));
      If(eaten, () => { atomicAdd(counter.element(uint(EATEN)), uint(1)); });
      P.assign(vec4(p, v.sub(host).length()));
      V.assign(vec4(v, select(p.dot(p).greaterThan(KILL2).or(eaten), float(DEAD), born)));

  })().compute(N);

  /* ---------- counting stars in tight orbits, one in eight ---------- */
  // The swallow total is never reset; the CPU reads its growth.
  const resetPass = Fn(() => { atomicStore(counter.element(instanceIndex), uint(0)); })().compute(MAXW + 1);
  const countPass = Fn(() => {
    const i = instanceIndex.mul(uint(8));
    const P = pos.element(i), V = vel.element(i);
    If(V.w.greaterThanEqual(uClearT), () => {
      const p = P.xyz.toVar();
      const bestR2 = float(1e9).toVar(), bestM = float(0).toVar(), bestK = uint(0).toVar();

        const r2 = d.dot(d).toVar();
        If(r2.lessThan(bestR2).and(uW[k].w.greaterThan(0)), () => {
          bestR2.assign(r2); bestM.assign(uW[k].w); bestK.assign(uint(k + 1));
        });
      }
      // Tight: bound, and within a few units of its well.
      // Heavier wells hold a wider reach.
      const e = P.w.mul(P.w).mul(0.5).sub(bestM.mul(inverseSqrt(bestR2.add(EPS2))));
      const reach = bestM.div(SEED_M).max(1).pow(0.67).mul(5.3);
      If(bestR2.lessThan(reach).and(e.lessThan(0)).and(bestK.greaterThan(uint(0))), () => {
        atomicAdd(counter.element(0), uint(1));
        atomicAdd(counter.element(bestK), uint(1));
      });
    });
  })().compute(N / 8);

  /* ---------- scene ---------- */
  const scene = new THREE.Scene();
  // Effects draw in their own pass, so only they streak.
  const fxScene = new THREE.Scene();
  fxScene.background = new THREE.Color(0x000000);
  scene.background = new THREE.Color(0x000000);
  camera = new THREE.PerspectiveCamera(FOV, 16 / 9, 0.1, 500);

  // Stars are instanced sprites a couple of pixels wide.
  const uStarGain = uniform(0.6);
  const uStarSize = uniform(2);
  // View-space size of one CSS pixel at unit depth.
  const uPx = uniform(0.001);
  const spriteMat = () => {
    const m = new THREE.SpriteNodeMaterial({ transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending });
    m.sizeAttenuation = false;
    return m;
  };
  // Every sprite fades as a soft round dot.
  const dotOf = col => Fn(() => {
    const d = uv().sub(0.5).length().mul(2);
    const a = float(1).sub(d).max(0);
    return vec4(col, a.mul(a));
  })();

  /* ---------- the hole bends light ---------- */
  // xyz is the hole centre, w the lens strength.
  const uHole = uniform(new THREE.Vector4(0, 0, 0, 0));
  const uHoleR = uniform(HOLE_R), uHoleVis = uniform(0), uHoleAA = uniform(0.1);
  const uFeed = uniform(0), uJet = uniform(0), uDiskGain = uniform(1);
  const uRingDir = uniform(new THREE.Vector2(1, 0));
  // The disk and jets lean toward a side view of the camera.
  const uDiskRot = uniform(new THREE.Matrix3());
  // A thin lens: light from behind the hole bends outward around it.
  // An image moves to the outer Einstein solution and brightens.
  function lensOf(P) {
    const C = uHole.xyz;
    const D = C.sub(cameraPosition);
    const dL = D.length();
    const rel = P.sub(cameraPosition);
    const s = rel.dot(D).div(dL).max(1e-3);
    const behind = s.sub(dL).max(0);
    // The point, carried along its sight line into the lens plane.
    const u = cameraPosition.add(rel.mul(dL.div(s))).sub(C);
    const ul = u.length().max(1e-5);
    const re2 = uHole.w.mul(behind).div(s);
    const root = sqrt(ul.mul(ul).add(re2.mul(4)));
    const ul2 = ul.add(root).mul(0.5);
    const p = cameraPosition.add(C.add(u.mul(ul2.div(ul))).sub(cameraPosition).mul(s.div(dL)));
    const mu = ul.mul(ul).add(re2.mul(2)).div(ul.mul(root).max(1e-6)).min(3);
    return { p, mu, behind, ul2 };
  }

  const starMat = spriteMat();
  const SP = pos.toAttribute(), SV = vel.toAttribute();
  const born = SV.w;
  const lum = hash(instanceIndex.add(uint(90001)));
  // New stars fade in.
  // Cleared stars fade out where they stand.
  const vis = select(born.greaterThanEqual(uClearT), smoothstep(born, born.add(0.3), uTime),
    select(born.greaterThan(-1e8), float(1).sub(uTime.sub(uClearT).div(0.45)).clamp(0, 1), float(0)));
  const starLens = lensOf(SP.xyz);
  starMat.positionNode = starLens.p;
  // One newborn star in eight pops: it flashes white and swells, then settles.
  const pops = step(0.875, hash(instanceIndex.add(uint(31337))));
  const birth = select(born.greaterThan(0), exp(uTime.sub(born).max(0).mul(-5)), float(0)).mul(vis).mul(pops);
  starMat.scaleNode = select(vis.greaterThan(0.002), uStarSize.mul(lum.pow(12).mul(1.3).add(1)).mul(birth.mul(2.5).add(1)).mul(uPx), float(0));
  // Slow stars glow amber, fast ones blue-white.
  const AMBER = vec3(1.0, 0.43, 0.11), ICE = vec3(0.56, 0.74, 1.0);
  const HOT = vec3(1.0, 0.86, 0.66), EMBER = vec3(0.75, 0.1, 0.04);
  const tint = mix(AMBER, ICE, smoothstep(2, 6, SP.w));
  // Fast core stars dim a little, so dense centres don't burn out.
  const calm = float(1.3).div(SP.w.mul(0.2).pow(2).add(1));
  // Stars near a hole dim, so the disk reads against the core.
  const nearHole = mix(float(1), smoothstep(uHoleR.mul(2.5), uHoleR.mul(10), SP.xyz.sub(uHole.xyz).length()).mul(0.85).add(0.15), uHoleVis);
  // A star caught in a pulsar beam flares blue-white.
  let flare = float(0);
  for (let k = 0; k < MAXW; k++) flare = flare.add(beamAt(k, SP.xyz).w);
  flare = flare.min(1);
  const starCol = varying(mix(mix(tint, ICE, flare.mul(0.7)), vec3(1), birth.mul(0.8)).mul(flare.mul(3).add(1)).mul(birth.mul(9).add(1))
    .mul(lum.pow(5).mul(2.2).add(0.42)).mul(calm).mul(vis).mul(uStarGain).mul(starLens.mu).mul(nearHole));
  starMat.colorNode = dotOf(starCol);
  const stars = new THREE.Sprite(starMat);
  stars.count = N;
  stars.frustumCulled = false;
  scene.add(stars);

  // Each object is a hot nucleus that blooms.
  // A star whitens at its centre and shows its colour at the rim.
  const wellDots = [];
  for (let k = 0; k < MAXW; k++) {
    const size = uniform(0), col = uniform(new THREE.Color(1, 0.86, 0.66)), gain = uniform(5);
    const m = spriteMat();
    m.scaleNode = size.mul(uPx);
    m.colorNode = Fn(() => {
      const d = uv().sub(0.5).length().mul(2);
      const c = mix(vec3(1), col, smoothstep(0, 0.45, d)).mul(gain);
      return vec4(c, exp(d.mul(d).mul(-6)).mul(float(1).sub(d).max(0)));
    })();
    const s = new THREE.Sprite(m);
    s.frustumCulled = false;
    s.renderOrder = 2;
    s.visible = false;
    scene.add(s);
    wellDots.push({ s, size, col, gain });
  }

  // Pulsar beams: particles stream out along two opposite rays.
  const beams = [];
  for (let k = 0; k < MAXW; k++) {
    const m = spriteMat();
    const P = uPul[k];
    const bh = n => hash(instanceIndex.add(uint(n * 4241 + k * 977 + 13)));
    const side = select(instanceIndex.bitAnd(uint(1)).equal(uint(1)), float(1), float(-1));
    const bt = fract(bh(1).add(uTime.mul(BEAM_RATE)));
    const br = bt.mul(BEAM_L).add(0.12);
    const jit = gauss(bh(2), bh(3)).mul(br.mul(0.03).add(0.02));
    const at = vec3(P.x, 0, P.y).add(vec3(P.z, 0, P.w).mul(br.mul(side))).add(vec3(P.w.negate(), 0, P.z).mul(jit));
    m.positionNode = lensOf(at).p;
    m.scaleNode = uPx.mul(2);
    m.colorNode = dotOf(varying(ICE.mul(1.5).mul(smoothstep(0, 0.04, bt)).mul(float(1).sub(bt).pow(1.5)).mul(uPulOn[k])));
    const s = new THREE.Sprite(m);
    s.count = BEAM_N;
    s.frustumCulled = false;
    s.visible = false;
    scene.add(s);
    beams.push(s);
  }

        // A supernova swells and shudders as its fuse burns down.
        const due = w.kind === 'nova' ? clamp(1 - (w.fuse - simT) / NOVA_FUSE) : 0;
        dot.size.value = (18 + 8 * Math.sqrt(w.m / SEED_M)) * grow * (1 + due * (0.3 + 0.12 * Math.sin(simT * 14)));
        dot.col.value.setRGB(...w.col);
        dot.gain.value = 4 + 4 * due;
      } else if (w.kind === 'giant') {
        // A red giant swells and throbs slowly before it sheds.
        const due = clamp(1 - (w.fuse - simT) / GIANT_FUSE);
        dot.size.value = (42 + 22 * due) * grow * (1 + 0.06 * due * Math.sin(simT * 3));
        dot.col.value.setRGB(...w.col);
        dot.gain.value = 3 + 2 * due;
      } else if (w.kind === 'dwarf') {
        dot.size.value = 7 * grow * (1 + 3 * w.flash);
        dot.col.value.setRGB(...w.col);
        dot.gain.value = 6 + 20 * w.flash;
      } else if (w.kind === 'nebula') {
        // The cloud thins as its stars are born.
        const used = fling?.nursery === w ? clamp((simT - fling.t0) / NURSE_T) : 0;
        dot.size.value = 130 * grow * (1 - 0.4 * used);
        dot.col.value.setRGB(...w.col);
        dot.gain.value = 1.4 * (1 - 0.7 * used);
      } else if (w.kind === 'comet') {
        dot.size.value = 7 * grow;
        dot.col.value.setRGB(...w.col);
        dot.gain.value = 5;
      } else if (w.kind === 'magnetar') {
        // A magnetar flares in sharp bursts as its crust quakes.
        const quake = Math.max(0, Math.sin(simT * 2.3 + w.ph) * Math.sin(simT * 0.7 + w.th)) ** 16;
        dot.size.value = 9 * grow * (1 + 1.5 * quake);
        dot.col.value.setRGB(...w.col);
        dot.gain.value = 4 + 24 * quake;
      } else if (w.kind === 'worm') {
        dot.size.value = 15 * grow * (1 + 0.08 * Math.sin(simT * 3 + w.ph));
        dot.col.value.setRGB(...w.col);
        dot.gain.value = 3;
      } else if (w.kind === 'white') {
        dot.size.value = 16 * grow;
        dot.col.value.setRGB(...w.col);
        dot.gain.value = 5;
      } else if (w.kind === 'pulsar') {
        // The core flashes as a beam sweeps past the camera.
        const face = Math.abs(Math.cos(w.th) * Math.sin(az) + Math.sin(w.th) * Math.cos(az));
        dot.size.value = 6 * grow * (1 + 4 * w.flash);
        dot.col.value.setRGB(0.56, 0.74, 1);
        dot.gain.value = 3 + 14 * face ** 24 + 40 * w.flash;
      } else {
        dot.size.value = (7 + 5 * Math.sqrt(w.m / SEED_M)) * grow;
        dot.col.value.setRGB(1, 0.86, 0.66);
        dot.gain.value = 5;
      }
    }
    renderPipeline.render();
    sample(now);
    if (++frames === 3) canvas.classList.add('on');
  }

  // The loop runs only while the panel is on screen.
  let onScreen = false;
  const sync = () => {
    const run = onScreen && !document.hidden;
    if (run === running) return;
    running = run;
    last = performance.now();
    renderer.setAnimationLoop(run ? animate : null);
    if (run) wakeSound(); else rest();
  };
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; sync(); }).observe(panel);
  document.addEventListener('visibilitychange', sync);
  ready = true;
}

// Unmuting wakes the context; its resume brings the layers back.
sound.onChange(on => {
  if (on) { audio(); mixLayers(); }
  else if (ac) ac.suspend()?.catch(() => {});
});

start().catch(err => console.error(err));
</script>
</body>
</html>
