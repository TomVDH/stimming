<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Galaxy: a WebGPU star field on a black panel. */
:root { --stage: #000; }
.space canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.space canvas.on { opacity: 1; }
.space.grab canvas { cursor: grab; }
.space.held canvas { cursor: grabbing; }
@media (prefers-reduced-motion: reduce) { .space canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/galaxy.svg)"></span><span class="intro-name">Galaxy</span><span class="intro-sub">Stimming No. 06</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--galaxy space" id="space" tabindex="0" role="application" aria-label="Galaxy simulation. Drag to fling stars, tap to add a gravity well, drag a well to move it. Wells that meet merge, and heavy merges collapse into a black hole. Space adds a well, C clears, R resets.">
      <p class="fail" hidden>Galaxy needs WebGPU, which this browser doesn't have.</p>
    </div>
    <div class="bar">
      <div class="actions" id="ctl">
        <button class="chip" id="clear" type="button" aria-keyshortcuts="C">Clear</button>
        <button class="chip" id="reset" type="button" aria-keyshortcuts="R">Reset</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag</dt><dd>fling stars</dd></div>
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>add a well</dd></div>
        <div><dt>Drag a well</dt><dd>move it</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>add a well</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Galaxy</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.min.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.min.js",
  "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.js": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.min.js"
} }
</script>
<script type="module">
import { initPage, sound } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
initPage({ id: 'galaxy' });

const panel = document.getElementById('space');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; });
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 20, LEAD = 0.004;
let ac = null, out = null, noise = null, askedAt = -1e9, voices = 0, restT = 0;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.08 * voices);
const mtof = m => 440 * 2 ** ((m - 69) / 12);

// The drone is one D chord, root first.
// Each cluster rank adds one voice, heaviest on the root.
const CHORDS = [[38, 45, 50, 54, 57, 61, 64, 69]];
const AMP = [0.08, 0.055, 0.045, 0.038, 0.032, 0.024, 0.019, 0.016];
const layers = [];
// The star count writes these targets twice a second.
const mixAt = { level: new Float32Array(8), pan: new Float32Array(8), feed: 0, jet: 0 };
let chordAt = 0, roar = null, hiss = null, droneLfo = null;

function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (err) { return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;
    out = ac.createGain();
    out.gain.value = 0.55;
    out.connect(comp);
    comp.connect(ac.destination);
    // One second of white noise feeds every whoosh.
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // One slow wave breathes every voice's lowpass.
    const lfo = ac.createOscillator();
    droneLfo = ac.createGain();
    lfo.frequency.value = 0.06;
    droneLfo.gain.value = 70;
    lfo.connect(droneLfo);
    lfo.start();
    for (let k = 0; k < 8; k++) layers.push(makeLayer(k));
    // The hole roars low while it feeds; its jets hiss high.
    roar = noiseBand(150, 0.8);
    hiss = noiseBand(2600, 2.5);
  }
  if (ac.state !== 'running') { askedAt = performance.now(); ac.resume()?.then(() => mixLayers()).catch(() => {}); }
}
function noiseBand(f, q) {
  const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = noise;
  src.loop = true;
  bp.type = 'bandpass';
  bp.frequency.value = f;
  bp.Q.value = q;
  g.gain.value = 0;
  src.connect(bp).connect(g).connect(out);
  src.start();
  return g;
}
// One drone voice per cluster rank, silent until stars bind.
// Each voice is a detuned pair under a breathing lowpass.
function makeLayer(k) {
  const g = ac.createGain(), lp = ac.createBiquadFilter();
  g.gain.value = 0;
  lp.type = 'lowpass';
  lp.frequency.value = 280;
  lp.Q.value = 0.4;
  droneLfo.connect(lp.frequency);
  let bus = out;
  const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
  if (pan) { pan.connect(out); bus = pan; }
  lp.connect(g).connect(bus);
  const f = mtof(CHORDS[chordAt][k]);
  for (const sgn of [-1, 1]) {
    const o = ac.createOscillator();
    o.type = k ? 'triangle' : 'sine';
    o.frequency.value = f;
    o.detune.value = sgn * (3 + 2 * k);
    o.connect(lp);
    o.start();
  }
  return { g, lp, pan, bus };
}
// Layers glide toward the targets in mixAt.
function mixLayers(tau = 1.1) {
  if (!ac || ac.state !== 'running' || !layers.length) return;
  const t = ac.currentTime, on = sound.on && running;
  layers.forEach((L, k) => {
    const lv = on ? mixAt.level[k] : 0;
    // A feeding hole swells the bass.
    const amp = AMP[k] * lv * (k ? 1 : 1 + 0.5 * mixAt.feed);
    L.g.gain.setTargetAtTime(amp, t, tau);
    L.lp.frequency.setTargetAtTime(240 + 900 * lv + (k ? 0 : 400 * mixAt.feed), t, 1.6);
    L.pan?.pan.setTargetAtTime(mixAt.pan[k], t, 0.6);
  });
  roar.gain.setTargetAtTime(on ? 0.07 * mixAt.feed : 0, t, tau * 0.7);
  hiss.gain.setTargetAtTime(on ? 0.05 * mixAt.jet : 0, t, tau * 0.7);
}
// A context still waking queues sounds for a moment.
function live() {
  if (!sound.on || !ac || ac.state === 'closed') return null;
  return ac.state === 'running' || performance.now() - askedAt < 250 ? ac : null;
}
function track(src, ...tails) {
  voices++;
  src.onended = () => { voices--; tails.forEach(n => n.disconnect()); };
}
// While the panel is off screen, the context sleeps.
function rest() {
  clearTimeout(restT);
  if (!ac || ac.state !== 'running') return;
  mixLayers(0.08);
  restT = setTimeout(() => {
    if (!running && ac.state === 'running') ac.suspend()?.catch(() => {});
  }, 400);
}
function wakeSound() {
  clearTimeout(restT);
  if (!sound.on || !ac) return;
  if (ac.state === 'running') return mixLayers();
  askedAt = performance.now();
  ac.resume()?.then(() => mixLayers()).catch(() => {});
}
const GESTURE_KEYS = new Set([' ', 'c', 'C', 'r', 'R', 'Enter']);
function unlock(e) {
  if (!sound.on || (e.type === 'keydown' && !GESTURE_KEYS.has(e.key))) return;
  // A touch counts as a gesture only once the finger lifts.
  if (!ac && e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
  audio();
}
// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// Flinging: a bandpassed breath of noise that rises, then falls away.
function whoosh(amt, pan) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD, g = level() * amt * jit(0.1), dur = 0.45 + 0.4 * amt;
  const src = a.createBufferSource(), bp = a.createBiquadFilter(), ng = a.createGain();
  src.buffer = noise;
  src.loop = true;
  bp.type = 'bandpass';
  bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(340 * jit(0.08), t);
  bp.frequency.exponentialRampToValueAtTime(800 + 1000 * amt, t + 0.16);
  bp.frequency.exponentialRampToValueAtTime(240, t + dur);
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(0.34 * g, t + 0.06);
  ng.gain.setTargetAtTime(0, t + 0.1, dur / 4);
  src.connect(bp).connect(ng);
  const tails = [ng, bp];
  if (a.createStereoPanner) {
    const p = a.createStereoPanner();
    p.pan.value = clamp(pan, -0.6, 0.6);
    ng.connect(p).connect(out);
    tails.push(p);
  } else ng.connect(out);
  src.start(t, Math.random() * 0.4);
  src.stop(t + dur + 0.4);
  track(src, ...tails);
}

/* ---------- capability check ---------- */
// Without WebGPU the panel shows one line and nothing runs.
async function hasWebGPU() {
  if (!navigator.gpu) return false;
  try {
    const { default: WebGPU } = await import('three/addons/capabilities/WebGPU.js');
    return WebGPU.isAvailable();
  } catch {
    return false;
  }
}
// The shared header's sound toggle hides too.
function noWebGPU() {
  panel.querySelector('.fail').hidden = false;
  document.getElementById('ctl').hidden = true;
  document.getElementById('snd').hidden = true;
}

/* ---------- constants ---------- */
// Phones and tablets simulate fewer stars.
const SMALL = matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 600;
const N = SMALL ? 196608 : 327680;
// Two thirds of the stars seed the pair.
// The rest wait for flings.
const SEED = Math.round((N * 2) / 3);
const MAXW = 8, CAP = 6, HOLE_WELLS = 6;
// Units: G is 1 and every mass is stored as GM.
// The panel spans about twenty length units.
const SEED_M = 26, TAP_M = 18, MAX_M = 240;
// A merger this heavy collapses into a black hole.
const BH_M = 48, HOLE_R = 0.2, LENS = 0.3, SHADOW_K = 1.3, DISK_TILT = (-43 * Math.PI) / 180;
// Near a hole, stars spiral in and feed it.
const HOLE_REACH = 6, INFLOW = 0.3, EAT = 160 / N;
const DISK_N = SMALL ? 16384 : 32768, DISK_SPIN = 2.4, DISK_PX = 2.4;
const JET_N = SMALL ? 4096 : 8192, JET_RATE = 0.45;
const EPS2 = 0.2, EPSW2 = 1, KILL2 = 70 * 70, DEAD = -1e9;
// Flings: an opening burst, then a steady stream while held.
const INIT = 2000, RATE = 12000, MAXF = Math.round(N / 14);
const STEP = 1 / 120;
// Arms wind as log spirals, about 19 degrees of pitch.
const WIND = 2.9;
const FOV = 36, EL = (57 * Math.PI) / 180;
const holeRadius = m => Math.min(0.55, HOLE_R * Math.sqrt(m / BH_M));

let running = false, ready = false;
let renderer = null, camera = null;
let simT = 0, ring = SEED, fling = null, hold = null, lowDpr = false;
const wells = [];

async function start() {
  if (!(await hasWebGPU())) return noWebGPU();

  const [THREE, TSL, { bloom }] = await Promise.all([
    import('three/webgpu'),
    import('three/tsl'),
    import('three/addons/tsl/display/BloomNode.js'),
  ]);
  const {
    Fn, If, uniform, instancedArray, instanceIndex, hash, vec3, vec4, float, uint, select, uv, smoothstep,
    mix, sqrt, cos, sin, log, exp, cross, inverseSqrt, varying, atomicAdd, atomicStore, pass, max, atan,
    fract, step, cameraPosition,
  } = TSL;

  renderer = new THREE.WebGPURenderer({ antialias: false });
  await renderer.init();
  // WebGPURenderer can fall back to WebGL 2; this toy does not.
  if (!renderer.backend.isWebGPUBackend) {
    renderer.dispose();
    return noWebGPU();
  }
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  const canvas = renderer.domElement;

  /* ---------- star buffers ---------- */
  // Position xyz, w is speed relative to the strongest well.
  const pos = instancedArray(N, 'vec4');
  // Velocity xyz, w is the birth time.
  // DEAD marks an empty slot.
  const vel = instancedArray(N, 'vec4');
  // Slot 0 counts tight stars, slots 1 to MAXW count per well.
  // The last slot totals every star a hole swallows.
  const NC = MAXW + 2, EATEN = MAXW + 1;
  const counter = instancedArray(NC, 'uint').toAtomic();

  const uDt = uniform(STEP);
  const uTime = uniform(0);
  const uClearT = uniform(-1);
  const uFrame = uniform(new THREE.Vector3());
  const uW = [], uWV = [], uWH = [];
  for (let k = 0; k < MAXW; k++) {
    uW.push(uniform(new THREE.Vector4(0, 0, 0, 0)));
    uWV.push(uniform(new THREE.Vector4()));
    // Horizon radius, zero for an ordinary well.
    uWH.push(uniform(0));
  }
  // The held cluster is a ring-buffer range that follows the pointer.
  const uHeldStart = uniform(0, 'uint');
  const uHeldCount = uniform(0, 'uint');
  const uSalt = uniform(1, 'uint');
  const uHoldPos = uniform(new THREE.Vector3());
  const uHoldVel = uniform(new THREE.Vector3());
  const uHoldT0 = uniform(0);
  const uHoldR = uniform(0.3);
  const uSettle = uniform(0.1);
  const uArms = uniform(0.035);

  const gauss = (a, b) => sqrt(log(a.max(1e-7)).mul(-2)).mul(cos(b.mul(TAU)));
  // Softened circular speed around a point mass.
  const vcirc = (m, r) => sqrt(m.mul(r).mul(r).div(r.mul(r).add(EPS2).pow(1.5)));

  /* ---------- seed: two discs with two trailing arms each ---------- */
  const gal = [0, 1].map(() => ({
    c: uniform(new THREE.Vector4()), v: uniform(new THREE.Vector3()),
    ex: uniform(new THREE.Vector3(1, 0, 0)), en: uniform(new THREE.Vector3(0, 1, 0)), ez: uniform(new THREE.Vector3(0, 0, 1)),
    arm: uniform(0),
  }));
  const seedPass = Fn(() => {
    const i = instanceIndex;
    const P = pos.element(i), V = vel.element(i);
    If(i.lessThan(uint(SEED)), () => {
      const H = k => hash(i.mul(uint(29)).add(uint(k * 7919 + 3)));
      // Odd slots belong to the second galaxy, so recycling thins both.
      const isB = i.bitAnd(uint(1)).equal(uint(1));
      const pick = key => select(isB, gal[1][key], gal[0][key]);
      const C = pick('c'), M = C.w;
      // Disc radii are exponential, the far tail folded inside.
      const rr = log(H(1).mul(H(2)).max(1e-7)).negate().mul(1.15);
      const r = select(rr.greaterThan(4.6), H(3).mul(4.6), rr).max(0.12).toVar();
      // Most disc stars crowd two log spirals.
      const inArm = H(4).lessThan(0.7);
      const arm = select(H(5).lessThan(0.5), float(0), float(Math.PI)).add(pick('arm'));
      const wind = log(r).mul(WIND);
      const th = select(inArm, arm.sub(wind).add(gauss(H(6), H(7)).mul(0.3)), H(8).mul(TAU)).toVar();
      const vc = vcirc(M, r).toVar();
      const lp = vec3(cos(th).mul(r), gauss(H(9), H(10)).mul(r.mul(0.03).add(0.03)), sin(th).mul(r));
      const lv = vec3(sin(th).negate(), 0, cos(th)).mul(vc)
        .add(vec3(gauss(H(11), H(12)), gauss(H(13), H(14)).mul(0.4), gauss(H(15), H(16))).mul(vc.mul(0.05)));
      // A bulge of stars on randomly tilted orbits.
      const bulge = H(17).lessThan(0.09);
      const br = H(18).pow(1.8).mul(0.95).add(0.06);
      const cz = H(19).mul(2).sub(1), ph = H(20).mul(TAU), sz = sqrt(float(1).sub(cz.mul(cz)));
      const bd = vec3(sz.mul(cos(ph)), cz.mul(0.55), sz.mul(sin(ph))).normalize().toVar();
      const bt = cross(vec3(H(21).sub(0.5), H(22).sub(0.5).add(0.35), H(23).sub(0.5)), bd).normalize();
      const L = select(bulge, bd.mul(br), lp).toVar();
      const LV = select(bulge, bt.mul(vcirc(M, br).mul(0.82)), lv).toVar();
      const EX = pick('ex'), EN = pick('en'), EZ = pick('ez');
      const wp = C.xyz.add(EX.mul(L.x)).add(EN.mul(L.y)).add(EZ.mul(L.z));
      const wv = pick('v').add(EX.mul(LV.x)).add(EN.mul(LV.y)).add(EZ.mul(LV.z));
      P.assign(vec4(wp, LV.length()));
      V.assign(vec4(wv, 0));
    }).Else(() => {
      P.assign(vec4(0, 0, 0, 0));
      V.assign(vec4(0, 0, 0, DEAD));
    });
  })().compute(N);

  /* ---------- update: wells pull, the held cluster follows ---------- */
  const updatePass = Fn(() => {
    const i = instanceIndex;
    const P = pos.element(i), V = vel.element(i);
    const born = V.w.toVar();
    const rel = i.add(uint(N)).sub(uHeldStart).mod(uint(N));
    // Held slots are reborn every step.
    // Cleared and empty slots are skipped.
    If(rel.lessThan(uHeldCount), () => {
      const s = i.add(uSalt);
      const H = k => hash(s.add(uint(k * N)));
      // A small spinning cluster: inner stars circle faster.
      const r = sqrt(log(float(1).sub(H(0).mul(0.93))).negate()).mul(uHoldR).mul(0.62).toVar();
      const a = H(1).mul(TAU).add(uTime.mul(float(2.4).div(r.add(0.25)))).toVar();
      const off = vec3(cos(a).mul(r), H(2).sub(0.5).mul(uHoldR).mul(0.14), sin(a).mul(r));
      const tan = vec3(sin(a).negate(), 0, cos(a));
      const spread = uHoldVel.length().mul(0.07).add(0.12);
      const g = vec3(gauss(H(3), H(4)), gauss(H(5), H(6)).mul(0.25), gauss(H(7), H(8))).mul(spread);
      const v = uHoldVel.add(tan.mul(r.mul(1.1))).add(g);
      const t = uHoldT0.add(max(rel.toFloat().sub(INIT), 0).div(RATE));
      P.assign(vec4(uHoldPos.add(off), uHoldVel.length().add(1.4)));
      V.assign(vec4(v, t));
    }).ElseIf(born.greaterThanEqual(uClearT), () => {
      const p = P.xyz.toVar(), v = V.xyz.toVar();
      const acc = uFrame.toVar();
      const best = float(0).toVar(), host = vec3(0).toVar(), hostP = vec3(0).toVar(), hostM = float(0).toVar();
      const hostPh = float(0).toVar(), hostH = float(0).toVar();
      for (let k = 0; k < MAXW; k++) {
        const d = uW[k].xyz.sub(p).toVar();
        const inv = inverseSqrt(d.dot(d).add(EPS2)).toVar();
        const f = uW[k].w.mul(inv).mul(inv).toVar();
        acc.addAssign(d.mul(f.mul(inv)));
        // Colour speed is measured against the strongest pull.
        If(f.greaterThan(best), () => {
          best.assign(f); host.assign(uWV[k].xyz); hostP.assign(uW[k].xyz); hostM.assign(uW[k].w);
          hostPh.assign(uWV[k].w); hostH.assign(uWH[k]);
        });
      }
      // Settling: near a well, orbits ease toward circles in the plane.
      const dp = p.sub(hostP).toVar();
      const r2 = dp.x.mul(dp.x).add(dp.z.mul(dp.z)).toVar();
      const vr = v.sub(host).toVar();
      const tng = vec3(dp.z.negate(), 0, dp.x).mul(inverseSqrt(r2.add(1e-4))).toVar();
      // Each star keeps its own sense of rotation.
      const sgn = select(vr.dot(tng).greaterThanEqual(0), float(1), float(-1));
      // Around a hole, orbits settle fast and drift inward.
      const reach = hostH.mul(HOLE_REACH);
      const near = select(hostH.greaterThan(0), exp(r2.negate().div(reach.mul(reach).add(1e-4))), float(0)).toVar();
      const inward = vec3(dp.x, 0, dp.z).mul(inverseSqrt(r2.add(1e-4))).mul(near.mul(-INFLOW));
      const goal = tng.mul(vcirc(hostM, sqrt(r2)).mul(sgn)).add(vec3(0, dp.y.mul(-0.6), 0)).add(inward);
      const ease = uSettle.mul(exp(r2.mul(-1 / 16))).mul(hostM.min(1)).add(near.mul(0.8));
      v.addAssign(goal.sub(vr).mul(ease.mul(uDt).min(1)));
      // A faint two-arm spiral potential turns with each well, so arms persist.
      const rr = sqrt(r2.add(1e-4)).toVar();
      const omega = sqrt(hostM.div(44));
      const psi = atan(dp.z, dp.x).sub(uTime.mul(omega)).mul(2).add(log(rr).mul(WIND * 2)).add(hostPh).toVar();
      const ip = inverseSqrt(r2.add(EPS2)).toVar();
      const phi0 = hostM.mul(ip), dphi = hostM.mul(rr).mul(ip).mul(ip).mul(ip);
      const fr = dphi.negate().mul(cos(psi)).sub(phi0.mul(WIND * 2).mul(sin(psi)).div(rr));
      const ft = phi0.mul(-2).mul(sin(psi)).div(rr);
      const fade = uArms.mul(exp(r2.mul(-1 / 50))).mul(r2.div(r2.add(1)));

  /* ---------- counting stars in tight orbits, one in eight ---------- */

    diskM.makeRotationAxis(tC.set(Math.cos(az), 0, -Math.sin(az)), DISK_TILT);
    uDiskRot.value.setFromMatrix4(diskM);
    // Horizon size in CSS pixels sets edge softness and disk brightness.
    const rpx = rS / (uPx.value * camera.position.distanceTo(tA.set(holeX, 0, holeZ)));
    uHoleAA.value = 1.5 / Math.max(1, rpx * SHADOW_K);
    uDiskGain.value = clamp((160 * rpx * rpx) / DISK_N, 0.08, 2.5);
    // The approaching side of the disk faces the camera's azimuth.
    tA.set(holeX, 0, holeZ).project(camera);
    tB.set(holeX + Math.cos(az) * rS, 0, holeZ - Math.sin(az) * rS).project(camera);
    const dx = (tB.x - tA.x) * camera.aspect, dy = tB.y - tA.y, l = Math.hypot(dx, dy) || 1;
    uRingDir.value.set(dx / l, dy / l);
  }

  /* ---------- seeding the pair ---------- */
  // The pair falls together on a bound orbit, discs prograde.
  function seed() {
    const turn = camera.aspect < 1 ? Math.PI / 2 + 0.3 : 0.3;
    const c = Math.cos(turn), s = Math.sin(turn);
    const rot = (x, z) => [x * c - z * s, x * s + z * c];
    const [ax, az] = rot(-4.5, 0), [bx, bz] = rot(4.5, 0);
    // Heavy wells answer slowly, so the pair keeps its path, slower.
    const sv = Math.sqrt(resp(SEED_M));
    const [vx, vz] = rot(0.5 * sv, -1 * sv);
    wells.length = 0;
    wells.push(makeWell(ax, az, vx, vz, SEED_M, SEED_M), makeWell(bx, bz, -vx, -vz, SEED_M, SEED_M));
    wells.forEach(w => { w.vis = 1; });
    const tilt = 0.7, spin = 1.1;
    gal[0].c.value.set(ax, 0, az, SEED_M);
    gal[0].v.value.set(vx, 0, vz);
    // Seeded arms start in the spiral potential's troughs.
    gal[0].arm.value = -wells[0].ph / 2;
    gal[1].c.value.set(bx, 0, bz, SEED_M);
    gal[1].v.value.set(-vx, 0, -vz);
    gal[1].arm.value = -wells[1].ph / 2;
    // The second disc leans out of the plane.
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(tilt, spin, 0));
    gal[1].ex.value.set(1, 0, 0).applyQuaternion(q);
    gal[1].en.value.set(0, 1, 0).applyQuaternion(q);
    gal[1].ez.value.set(0, 0, 1).applyQuaternion(q);
    simT = 0;
    ring = SEED;
    uClearT.value = -1;
    holeWell = null;
    holeVis = feed = feedGoal = jet = 0;
    renderer.compute(seedPass);
  }

  function letGoAll() {
    fling = null;
    uHeldCount.value = 0;
    if (hold) { if (hold.well) hold.well.held = false; hold = null; panel.classList.remove('held'); }
  }
  // Clear keeps the heaviest well.
  // An ordinary well returns to seed mass.
  // A hole keeps its mass.
  function clearAll() {
    if (!ready) return;
    uClearT.value = simT;
    ring = 0;
    letGoAll();
    let keep = null;
    for (const w of wells) if (w.mt > 0 && (!keep || w.mt > keep.mt)) keep = w;
    for (const w of wells) if (w !== keep) w.mt = 0;
    if (keep) {
      if (!keep.hole) keep.mt = SEED_M;
      keep.vx *= 0.3;
      keep.vz *= 0.3;
    } else wells.push(makeWell(0, 0, 0, 0, 0, SEED_M));
    whoosh(0.25, 0);
  }
  // Reset brings back the colliding pair.
  function resetAll() {
    if (!ready) return;
    letGoAll();
    seed();
    syncWells();
    whoosh(0.4, 0);
  }

  /* ---------- pointer: plane hits and flings ---------- */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hit = new THREE.Vector3(), tmp = new THREE.Vector3();
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  function toPlane(cx, cy) {
    const r = panel.getBoundingClientRect();
    ndc.set(((cx - r.left) / r.width) * 2 - 1, 1 - ((cy - r.top) / r.height) * 2);
    ray.setFromCamera(ndc, camera);
    if (!ray.ray.intersectPlane(plane, hit)) return null;
    const d = Math.hypot(hit.x, hit.z), k = d > 30 ? 30 / d : 1;
    return { x: hit.x * k, z: hit.z * k };
  }
  function pickWell(cx, cy, reach) {
    const r = panel.getBoundingClientRect();
    let best = null, bd = reach * reach;
    for (const w of wells) {
      if (w.mt <= 0) continue;
      tmp.set(w.x, 0, w.z).project(camera);
      const sx = r.left + ((tmp.x + 1) / 2) * r.width, sy = r.top + ((1 - tmp.y) / 2) * r.height;
      const d2 = (sx - cx) ** 2 + (sy - cy) ** 2;
      if (d2 < bd) { bd = d2; best = w; }
    }
    return best;
  }
  // Pointer speed eases into a throw that tops out near escape speed.
  function throwVel(trail, at, top) {
    const end = trail[trail.length - 1];
    if (!end || at - end[0] > 90) return [0, 0];
    const first = trail.find(s => end[0] - s[0] <= 100) || end, dt = (end[0] - first[0]) / 1000;
    if (dt < 0.008) return [0, 0];
    const vx = (end[1] - first[1]) / dt, vz = (end[2] - first[2]) / dt, s = Math.hypot(vx, vz);
    const k = s > 1e-6 ? (top * Math.tanh((s * 0.55) / top)) / s : 0;
    return [vx * k, vz * k];
  }
  function startFling() {
    if (fling) return;
    hold.kind = 'fling';
    fling = { start: ring, count: INIT, t0: simT, x: hold.x, z: hold.z, vx: 0, vz: 0, releasing: false };
    uSalt.value = (Math.random() * 1e6) | 0;
  }
  function letGo(e, ok) {
    if (!hold || e.pointerId !== hold.id) return;
    const h = hold;
    hold = null;
    panel.classList.remove('held');
    if (h.kind === 'pending') {
      if (ok) { const p = toPlane(e.clientX, e.clientY); if (p) addWell(p.x, p.z); }
    } else if (h.kind === 'fling' && fling) {
      const [vx, vz] = ok ? throwVel(h.trail, e.timeStamp, 7) : [0, 0];
      fling.vx = vx;
      fling.vz = vz;
      fling.releasing = true;
      const r = panel.getBoundingClientRect();
      whoosh(clamp(0.25 + Math.hypot(vx, vz) / 6, 0.25, 1) * Math.sqrt(fling.count / MAXF + 0.2), ((e.clientX - r.left) / r.width) * 2 - 1);
    } else if (h.kind === 'well' && h.well) {
      const w = h.well;
      w.held = false;
      // A grab that barely moved hands the old orbit back.
      if (!h.moved && h.kept) [w.vx, w.vz] = h.kept;
      else [w.vx, w.vz] = ok ? throwVel(h.trail, e.timeStamp, 6) : [0, 0];
    }
  }
  panel.addEventListener('pointerdown', e => {
    if (!ready || hold || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const p = toPlane(e.clientX, e.clientY);
    if (!p) return;
    const w = pickWell(e.clientX, e.clientY, e.pointerType === 'mouse' ? 24 : 38);
    try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
    hold = { id: e.pointerId, kind: w ? 'well' : 'pending', t0: performance.now(), cx: e.clientX, cy: e.clientY, sx: e.clientX, sy: e.clientY, x: p.x, z: p.z, trail: [[e.timeStamp, p.x, p.z]], well: w, moved: false, kept: null };
    if (w) {
      w.held = true;
      w.gx = w.x - p.x;
      w.gz = w.z - p.z;
      hold.kept = [w.vx, w.vz];
      panel.classList.add('held');
    }
  });
  panel.addEventListener('pointermove', e => {
    if (!ready) return;
    if (hold && e.pointerId === hold.id) {
      hold.cx = e.clientX;
      hold.cy = e.clientY;
      const p = toPlane(e.clientX, e.clientY);
      if (!p) return;
      hold.x = p.x;
      hold.z = p.z;
      hold.trail.push([e.timeStamp, p.x, p.z]);
      if (hold.trail.length > 12) hold.trail.shift();
      if (Math.hypot(e.clientX - hold.sx, e.clientY - hold.sy) > 7) {
        hold.moved = true;
        if (hold.kind === 'pending') startFling();
      }
      return;
    }
    if (e.pointerType === 'touch') return;
    panel.classList.toggle('grab', !!pickWell(e.clientX, e.clientY, 24));
  });
  panel.addEventListener('pointerup', e => letGo(e, true));
  panel.addEventListener('pointercancel', e => letGo(e, false));
  panel.addEventListener('lostpointercapture', e => letGo(e, true));
  panel.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') panel.classList.remove('grab'); });

  // Each frame re-reads the pointer, since the camera drifts.
  function updateHold(now) {
    if (hold && hold.kind === 'pending' && now - hold.t0 > 180) startFling();
    if (hold) {
      const p = toPlane(hold.cx, hold.cy);
      if (p) { hold.x = p.x; hold.z = p.z; }
    }
    if (hold && hold.kind === 'well' && hold.well) {
      const w = hold.well, [vx, vz] = throwVel(hold.trail, performance.now(), 6);
      w.x = hold.x + w.gx;
      w.z = hold.z + w.gz;
      w.vx += (vx - w.vx) * 0.3;
      w.vz += (vz - w.vz) * 0.3;
    }
    if (!fling) return;
    if (!fling.releasing) {
      fling.count = Math.min(MAXF, INIT + Math.floor((simT - fling.t0) * RATE));
      if (hold && hold.kind === 'fling') {
        fling.x = hold.x;
        fling.z = hold.z;
        const [vx, vz] = throwVel(hold.trail, performance.now(), 7);
        fling.vx += (vx - fling.vx) * 0.25;
        fling.vz += (vz - fling.vz) * 0.25;
      }
    }
    uHeldStart.value = fling.start;
    uHeldCount.value = fling.count;
    uHoldPos.value.set(fling.x, 0, fling.z);
    uHoldVel.value.set(fling.vx, 0, fling.vz);
    uHoldT0.value = fling.t0;
    uHoldR.value = 0.22 + 0.62 * Math.sqrt(fling.count / MAXF);
  }

  /* ---------- keys and controls ---------- */
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
    if (e.target.closest?.('input, textarea, select, button, a, [contenteditable]')) return;
    if (e.key === ' ') { e.preventDefault(); if (!e.repeat) dropCentre(); }
    else if (e.key === 'c' || e.key === 'C') { if (!e.repeat) clearAll(); }
    else if (e.key === 'r' || e.key === 'R') { if (!e.repeat) resetAll(); }
  });
  document.getElementById('clear').addEventListener('click', clearAll);
  document.getElementById('reset').addEventListener('click', resetAll);

  /* ---------- async warm-up ---------- */
  resize();
  // Shaders compile off the critical path, so loading never freezes.
  await renderer.compileComputeAsync([seedPass, updatePass, resetPass, countPass]);
  seed();
  syncWells();
  // The hole's sprites compile now, drawn at zero size.
  shadow.visible = disk.visible = jets.visible = true;
  await scenePass.compileAsync(renderer);
  shadow.visible = disk.visible = jets.visible = false;

  canvas.setAttribute('aria-hidden', 'true');
  panel.prepend(canvas);
  new ResizeObserver(resize).observe(panel);

  /* ---------- star counts drive the layers and the hole ---------- */
  let sampleAt = 0, sampling = false, eatenLast = -1, eatenAt = 0;
  // Twice a second, a sampled count binds stars to wells.
  function sample(now) {
    if (sampling || now - sampleAt < 500 || !(live() || holeWell)) return;
    sampleAt = now;
    sampling = true;
    const snap = wells.slice(0, MAXW);
    renderer.compute(resetPass);
    renderer.compute(countPass);
    renderer.getArrayBufferAsync(counter.value)
      .then(buf => {
        const c = new Uint32Array(buf);
        snap.forEach((w, k) => { w.bound = c[k + 1] * 8; });
        const eaten = c[EATEN], secs = (now - eatenAt) / 1000;
        if (eatenLast >= 0 && secs > 0) fed((eaten - eatenLast) >>> 0, secs);
        eatenLast = eaten;
        eatenAt = now;
        mixFromWells();
      })
      .catch(() => {})
      .finally(() => { sampling = false; });
  }
  // Swallowed stars set the feeding rate and add mass.
  function fed(n, secs) {
    feedGoal = holeWell ? 1 - Math.exp(-n / secs / (N * 0.004)) : 0;
    if (holeWell) holeWell.mt = Math.min(MAX_M, holeWell.mt + n * EAT);
  }
  // Layers follow wells by mass: the heaviest sounds the bass.
  function mixFromWells() {
    const ranked = wells.filter(w => w.mt > 0).sort((a, b) => b.m - a.m);
    for (let k = 0; k < 8; k++) {
      const w = ranked[k];
      if (!w) { mixAt.level[k] = 0; continue; }
      mixAt.level[k] = Math.sqrt(clamp(w.bound / (N * 0.22)));
      mixAt.pan[k] = clamp(tmp.set(w.x, 0, w.z).project(camera).x * 0.8, -0.8, 0.8);
    }
    // A hole always sounds its bass.
    if (holeWell && ranked[0] === holeWell) mixAt.level[0] = Math.max(mixAt.level[0], 0.45);
    mixAt.feed = feed;
    mixAt.jet = jet;
    mixLayers();
  }

  /* ---------- animation loop ---------- */
  let last = performance.now(), frames = 0, slow = 0;
  function animate() {
    const now = performance.now();
    const raw = Math.max(0, (now - last) / 1000), dt = Math.min(raw, 1 / 30);
    last = now;
    // Sustained slow frames drop the pixel ratio to 1.
    if (!lowDpr && frames > 30) {
      slow = raw > 0.024 ? slow + 1 : Math.max(0, slow - 1);
      if (slow > 40) { lowDpr = true; resize(); }
    }
    // Reduced motion halves the simulation speed.
    const simDt = dt * (reduce ? 0.5 : 1);
    const n = Math.max(1, Math.min(4, Math.ceil(simDt / STEP - 1e-6))), h = simDt / n;
    updateHold(now);
    for (let s = 0; s < n; s++) {
      for (let q = 0; q < 3; q++) stepWells(h / 3);
      syncWells();
      uDt.value = h;
      uTime.value = simT;
      renderer.compute(updatePass);
      simT += h;
    }
    // The ring moves past a released cluster's slots.
    if (fling && fling.releasing) {
      ring = (fling.start + fling.count) % N;
      fling = null;
      uHeldCount.value = 0;
    }
    uTime.value = simT;
    prune();
    if (!reduce) az += dt * 0.016;
    placeCamera(now / 1000);
    updateHole(dt);
    for (let k = 0; k < MAXW; k++) {
      const w = wells[k], dot = wellDots[k];
      if (!w) { dot.s.visible = false; continue; }
      // The hole shows its shadow instead of a nucleus.
      w.vis += ((w.mt > 0 && w !== holeWell ? 1 : 0) - w.vis) * (1 - Math.exp(-dt / 0.22));
      w.pulse *= Math.exp(-dt / 0.3);
      dot.s.visible = w.vis > 0.01;
      dot.s.position.set(w.x, 0, w.z);
      dot.size.value = (7 + 5 * Math.sqrt(w.m / SEED_M)) * w.vis * (1 + 0.5 * w.pulse + (w.held ? 0.25 : 0));
    }
    renderPipeline.render();
    sample(now);
    if (++frames === 3) canvas.classList.add('on');
  }

  // The loop runs only while the panel is on screen.
  let onScreen = false;
  const sync = () => {
    const run = onScreen && !document.hidden;
    if (run === running) return;
    running = run;
    last = performance.now();
    renderer.setAnimationLoop(run ? animate : null);
    if (run) wakeSound(); else rest();
  };
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; sync(); }).observe(panel);
  document.addEventListener('visibilitychange', sync);
  ready = true;
}

// Unmuting wakes the context; its resume brings the layers back.
sound.onChange(on => {
  if (on) { audio(); mixLayers(); }
  else if (ac) ac.suspend()?.catch(() => {});
});

start().catch(err => console.error(err));
</script>
</body>
</html>
