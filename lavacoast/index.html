<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.13 0.02 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lava coast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./render.js">
<link rel="modulepreload" href="./shaders.js">
<link rel="modulepreload" href="./land.js">
<link rel="modulepreload" href="./sim.js">
<link rel="modulepreload" href="./sound.js">
<link rel="modulepreload" href="../shared/gl.js">
<link rel="modulepreload" href="../shared/smoke.js">
<style>
/* Lava coast: a volcanic island coast at night. */
:root { --stage: oklch(0.13 0.02 265); }
.stage--lavacoast { background: var(--stage); cursor: pointer; }
.stage--lavacoast canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 1.2s ease; touch-action: none;
}
.stage--lavacoast canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--lavacoast canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Lava coast</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--lavacoast" id="stage" tabindex="0" role="application" aria-label="A volcanic island coast at night, seen from the sea. A lava tube spills a thin glowing stream into the surf under a small tower of steam. Tap to wake the vent on the flank: a lava fountain climbs, its flow runs down the black slope in glowing braids, crusts as it cools, and meets the sea in towers of steam lit orange from below. Hold to keep the fountain going. Press Space to erupt; the Flow slider sets the size.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Lava coast</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
