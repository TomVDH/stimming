<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}/* The how-to line is as quiet as the home link. */
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 28px; }
.how {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin: 0 0 0 auto;
  font-size: 13px; color: var(--muted);
}
.how div { display: flex; align-items: baseline; gap: 6px; }
.how dt { font-weight: 600; }
.how dd { margin: 0; }
.how kbd {
  font: inherit; font-size: 12px; line-height: 1; padding: 2px 6px 3px;
  border: 1px solid var(--line); border-radius: 5px;
}
/* Touch screens hide keys and hover; mice hide touch gestures. */
@media (hover: none) { .how .fine { display: none; } }
@media (hover: hover) { .how .touch { display: none; } }
@media (max-width: 640px) { .how { margin-left: 0; } }
</style>
<title>Morphset</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: header row, 5-column grid of square mark cells, 3-panel lab strip. */
:root {
  --bg: oklch(0.16 0.012 275);
  --surface: oklch(0.195 0.014 275);
  --line: oklch(0.29 0.016 275);
  --fg: oklch(0.94 0.008 275);
  --muted: oklch(0.64 0.02 275);
  --focus: oklch(0.84 0.13 205);
  --glow-a: 0.5;
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: oklch(0.975 0.004 275); --surface: oklch(0.995 0.002 275); --line: oklch(0.89 0.008 275);
    --fg: oklch(0.22 0.02 275); --muted: oklch(0.5 0.02 275); --focus: oklch(0.52 0.17 255);
    --glow-a: 0.3; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: oklch(0.975 0.004 275); --surface: oklch(0.995 0.002 275); --line: oklch(0.89 0.008 275);
  --fg: oklch(0.22 0.02 275); --muted: oklch(0.5 0.02 275); --focus: oklch(0.52 0.17 255);
  --glow-a: 0.3; color-scheme: light;
}
body {
  background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.defs { position: absolute; width: 0; height: 0; }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: clamp(20px, 3.4vw, 40px); }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.name { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.tools { display: flex; align-items: center; gap: 14px; }
.home { font-size: 14px; color: var(--muted); text-decoration: none; }
.home:hover { color: var(--fg); }
.fps { font: 400 12px/1 var(--num); color: var(--muted); font-variant-numeric: tabular-nums; white-space: pre; }
.play {
  inline-size: 34px; block-size: 34px; display: grid; place-items: center; padding: 0;
  border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--fg); cursor: pointer;
}
.play:hover { border-color: var(--muted); }
.play svg { width: 12px; height: 12px; }
.play .i-pause, .play[aria-pressed="true"] .i-play { display: none; }
.play[aria-pressed="true"] .i-pause { display: block; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
main { display: grid; gap: clamp(28px, 5vw, 56px); }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(4px, 1.6vw, 20px); }
@media (max-width: 760px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.mark {
  position: relative; aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; padding: 0;
  border: 0; border-radius: 24%; background: none; cursor: pointer; contain: layout paint;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.mark:focus-visible { outline-offset: -2px; }
.mark svg { position: relative; width: 72%; height: 72%; overflow: visible; }
.glow {
  position: absolute; inset: 6%; border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(closest-side, var(--g1), transparent); transition: opacity 0.5s ease;
}
.mark.on .glow { opacity: var(--glow-a); }
.lab { display: grid; gap: 28px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 20px; }
@media (max-width: 860px) { .pair { grid-template-columns: minmax(0, 1fr); } }
.cell { display: grid; gap: 12px; min-width: 0; align-content: start; }
.panel {
  position: relative; margin: 0; aspect-ratio: 4 / 3; max-width: 100%; overflow: hidden;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
}
.panel figcaption {
  position: absolute; top: 12px; left: 14px; z-index: 1; pointer-events: none;
  font-size: 13px; color: var(--muted);
}
.panel > svg, .panel > canvas { display: block; width: 100%; height: 100%; }
.panel canvas { touch-action: pan-y; }
#lab-morph { cursor: pointer; }
.panel.wide { aspect-ratio: 16 / 9; }
@media (max-width: 640px) { .panel.wide { aspect-ratio: 4 / 3; } }
#lab-sdf canvas { cursor: none; }
.hint {
  position: absolute; left: 14px; bottom: 12px; pointer-events: none;
  font-size: 13px; color: var(--muted);
}
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.shapes { display: flex; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; cursor: pointer;
  font: inherit; font-size: 13px; color: var(--muted);
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
}
.chip:hover { color: var(--fg); border-color: var(--muted); }
.chip[aria-pressed="true"], .chip[aria-current="true"] { color: var(--fg); border-color: var(--fg); }
.chip.icon { padding: 6px; }
.chip svg { width: 16px; height: 16px; fill: currentColor; display: block; }
.sep { width: 1px; height: 18px; background: var(--line); }
.slider { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.slider input { width: 92px; accent-color: var(--fg); }
.slider output { min-width: 5ch; font: 400 12px/1 var(--num); color: var(--fg); font-variant-numeric: tabular-nums; }
.thumbs { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 2px; width: 100%; }
@media (max-width: 860px) { .thumbs { grid-template-columns: repeat(5, minmax(0, 1fr)); max-width: 320px; } }
.thumb {
  aspect-ratio: 1; padding: 4px; cursor: pointer; color: var(--muted);
  background: none; border: 1px solid transparent; border-radius: 8px;
}
.thumb svg { display: block; width: 100%; height: 100%; fill: currentColor; }
.thumb:hover { color: var(--fg); }
.thumb[aria-current="true"] { color: var(--c); border-color: var(--line); }
</style>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

<div class="wrap">
  <header>
    <h1 class="name">Morphset</h1>
    <div class="tools">
      <a class="home" href="../index.html">Stimming</a>
      <span class="fps" id="fps">-- fps</span>
      <button class="play" id="play" type="button" aria-pressed="false" aria-label="Play all marks">
        <svg class="i-play" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/></svg>
        <svg class="i-pause" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.5H5v9H2.5zM7 1.5h2.5v9H7z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <main>
    <div class="grid" id="grid"></div>
    <div class="foot">
      <dl class="how" aria-label="How to play">
        <div class="fine"><dt>Hover</dt><dd>morph</dd></div>
        <div class="touch"><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>morph</dd></div>
      </dl>
    </div>
    <section class="lab" id="lab" aria-label="Lab">
      <div class="cell">
        <figure class="panel wide" id="lab-sdf">
          <figcaption>GLSL &middot; SDF</figcaption>
          <canvas aria-label="Signed-distance shapes. Click to drop blobs, drag to throw them."></canvas>
          <span class="hint">click to drop &middot; drag to throw</span>
        </figure>
        <div class="ctl">
          <div class="shapes" id="sdf-shapes" role="group" aria-label="Shape">
            <button class="chip icon" type="button" aria-label="Circle"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/></svg></button>
            <button class="chip icon" type="button" aria-label="Triangle"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l6.5 11.5h-13z"/></svg></button>
            <button class="chip icon" type="button" aria-label="Square"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/></svg></button>
            <button class="chip icon" type="button" aria-label="Hexagon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l5.6 3.25v6.5L8 14.5l-5.6-3.25v-6.5z"/></svg></button>
            <button class="chip icon" type="button" aria-label="Star"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2l2 4.3 4.7.5-3.5 3.2 1 4.6L8 11.5l-4.2 2.3 1-4.6L1.3 6l4.7-.5z"/></svg></button>
            <button class="chip icon" type="button" aria-label="Rose"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="3.7" r="2.4"/><circle cx="11.7" cy="5.85" r="2.4"/><circle cx="11.7" cy="10.15" r="2.4"/><circle cx="8" cy="12.3" r="2.4"/><circle cx="4.3" cy="10.15" r="2.4"/><circle cx="4.3" cy="5.85" r="2.4"/><circle cx="8" cy="8" r="3"/></svg></button>
          </div>
          <button class="chip" id="sdf-auto" type="button" aria-pressed="true">Auto</button>
          <span class="sep" aria-hidden="true"></span>
          <label class="slider"><span>Blend</span><input type="range" id="sdf-blend" min="0.02" max="0.3" step="0.01" value="0.14"><output></output></label>
          <label class="slider"><span>Pip</span><input type="range" id="sdf-pip" min="0.03" max="0.14" step="0.005" value="0.065"><output></output></label>
          <label class="slider"><span>Trail</span><input type="range" id="sdf-trail" min="0" max="8" step="1" value="6"><output></output></label>
          <button class="chip" id="sdf-clear" type="button">Clear</button>
        </div>
      </div>
      <div class="pair">
        <div class="cell">
          <figure class="panel" id="lab-morph" tabindex="0" role="button" aria-label="Morph to the next mark">
            <figcaption>GSAP &middot; MorphSVG</figcaption>
            <svg viewBox="-20 -20 168 168" aria-hidden="true"></svg>
          </figure>
          <div class="ctl">
            <div class="thumbs" id="morph-thumbs" role="group" aria-label="Morph target"></div>
            <button class="chip" id="morph-auto" type="button" aria-pressed="true">Auto</button>
            <button class="chip" id="morph-rot" type="button" aria-pressed="false">Rotational</button>
            <label class="slider"><span>Time</span><input type="range" id="morph-dur" min="0.3" max="2.5" step="0.1" value="1"><output></output></label>
          </div>
        </div>
        <div class="cell">
          <figure class="panel" id="lab-extrude">
            <figcaption>Three.js &middot; extrude</figcaption>
            <canvas aria-label="Nine extruded marks. Hover to morph, click to lock, drag to rotate."></canvas>
            <span class="hint">hover &middot; click to lock &middot; drag to rotate</span>
          </figure>
          <div class="ctl">
            <button class="chip" id="ex-all" type="button" aria-pressed="false">Morph all</button>
            <button class="chip" id="ex-spin" type="button" aria-pressed="false">Spin</button>
            <button class="chip" id="ex-reset" type="button">Reset</button>
            <label class="slider"><span>Depth</span><input type="range" id="ex-depth" min="0.04" max="0.45" step="0.01" value="0.17"><output></output></label>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

/* ---------- shared shapes ---------- */
const S = {
  tri: () => resample(roundPoly(ngon(3, 56, -PI / 2, 64, 72), 9)),
  hex: () => resample(roundPoly(ngon(6, 50), 8)),
  bud: () => {

  capsule: () => resample([...arc(94, 64, 22, -PI / 2, PI / 2, 40), ...arc(34, 64, 22, PI / 2, PI * 1.5, 40)]),

  circle: (r, cx = 64, cy = 64) => resample(arc(cx, cy, r, -PI / 2, PI * 1.5 - 0.001, 180)),
  pebble: a => 47 + 4 * Math.sin(2 * a + 0.6) + 3 * Math.cos(3 * a - 1.1) + 1.6 * Math.sin(5 * a + 2),
  square: () => roundPoly([[20, 20], [108, 20], [108, 108], [20, 108]], 12, 8),

/* ---------- the shared fill recipe: base gradient, light, rim ---------- */
function grad(m) {
  const id = m.id;
  const g = el('linearGradient', { id: id + 'g', gradientUnits: 'userSpaceOnUse', x1: 18, y1: 14, x2: 110, y2: 114 }, m.defs);
  const gs = [0, 0.55, 1].map(o => el('stop', { offset: o }, g));
  const l = el('radialGradient', { id: id + 'l', gradientUnits: 'userSpaceOnUse', cx: 42, cy: 34, r: 58 }, m.defs);
  const ls = [el('stop', { offset: 0, 'stop-opacity': 0.85 }, l), el('stop', { offset: 1, 'stop-opacity': 0 }, l)];
  return { g, gs, l, ls };
}
function skin(m, o = {}) {

  const clip = el('clipPath', { id: id + 'c' }, m.defs);
  el('use', { href: '#' + id + 's' }, clip);
  const grp = el('g', {}, o.parent || m.svg);
  el('use', { href: '#' + id + 's', fill: `url(#${id}g)` }, grp);
  el('use', { href: '#' + id + 's', fill: `url(#${id}l)` }, grp);
  el('use', { href: '#' + id + 's', fill: 'none', stroke: 'url(#rim)', 'stroke-width': 3, 'clip-path': `url(#${id}c)` }, grp);

}

  const lc = mix(pal.rest[3], pal.hover[3], t, pal.raw);

def({
  label: 'Bloom',
  pal: P(0, 22, { hover: [[0.86, 0.14, 355], [0.68, 0.22, 10], [0.5, 0.2, 28], [0.93, 0.15, 88]] }),
  dIn: 1.05, eIn: 'none', dOut: 0.75, eOut: 'power1.inOut',
  sil: () => dLine(S.bud()),
  build(m) {
    const sk = skin(m), a = S.bud(), b = S.rose(), delay = new Float32Array(N);

def({
  label: 'Stack',
  pal: { rest: [[0.87, 0.14, 82], [0.72, 0.19, 52], [0.58, 0.21, 28], [0.96, 0.05, 80]], hover: [[0.84, 0.15, 30], [0.66, 0.22, 8], [0.5, 0.2, 340], [0.96, 0.05, 40]] },
  dIn: 0.6, dOut: 0.6,
  sil: () => [-7, 0, 7, 13].map(y => dPts(S.tile(), 64, 64 + y)).join(''),
  build(m) {
    const G = grad(m), id = m.id;
    for (const [k, v] of [['x1', 64], ['y1', 8], ['x2', 64], ['y2', 120]]) set(G.g, k, v);
    const edge = el('linearGradient', { id: id + 'e', gradientUnits: 'userSpaceOnUse', x1: 64, y1: 8, x2: 64, y2: 120 }, m.defs);
    const es = [0, 1].map(o => el('stop', { offset: o }, edge));
    const layers = [2, 1, 0].map(k => {
      const g = el('g', {}, m.svg);
      return {
        k, x: 0, y: (k - 1) * 7, vx: 0, vy: 0,
        side: el('path', { fill: `url(#${id}e)` }, g),
        face: el('path', { fill: `url(#${id}g)` }, g),
        rim: el('path', { fill: 'none', stroke: 'url(#rim)', 'stroke-width': 1.5 }, g),

  },
  render(m, dt) {
    const st = m.st, c = clamp(m.s.p), pal = this.pal;

    const steps = dt > 0 ? Math.ceil(dt * 120) : 0, h = steps ? dt / steps : 0;
    let busy = false;
    for (const L of st.layers) {
      const ty = (L.k - 1) * (m.on ? 26 : 7), tx = -(L.k - 1) * tilt;
      if (reduce) { L.x = tx; L.y = ty; L.vx = L.vy = 0; }

      for (let s = 0; s < steps; s++) {

  },
  busy: m => m.st.busy,
});

def({

    const body = el('g', { 'clip-path': `url(#${id}c)` }, m.svg);
    const pupil = el('circle', { cx: 64, cy: 64, r: 34, fill: css([0.27, 0.1, 292]) }, body);

    const F = [['A', 'T1', 'G1'], ['T1', 'M', 'G1'], ['T1', 'T2', 'M'], ['T2', 'G2', 'M'], ['T2', 'B', 'G2'],
      ['A', 'G1', 'C'], ['G1', 'M', 'C'], ['M', 'G2', 'C'], ['G2', 'B', 'C']];
    const g = el('g', { 'stroke-linejoin': 'round', 'stroke-width': 0.8 }, m.svg);
    const clip = el('clipPath', { id: m.id + 'c' }, m.defs);
    return {
      R, H, F, P: {}, lx: -0.55, ly: -0.7,
      faces: F.map(() => el('path', {}, g)),
      silC: el('path', {}, clip),
      rim: el('path', { fill: 'none', stroke: 'url(#rim)', 'stroke-width': 3, 'clip-path': `url(#${m.id}c)` }, m.svg),
    };
  },
  render(m, dt) {
    const st = m.st, p = m.s.p, c = clamp(p), pal = this.pal;
    for (const k in st.R) st.P[k] = [lerp(st.R[k][0], st.H[k][0], p), lerp(st.R[k][1], st.H[k][1], p)];
    // Facets fly apart mid-transition and settle at the end.
    const ex = Math.sin(PI * c) * 7;
    const tx = m.on ? clamp((m.ptr.x - 64) / 64, -1, 1) : -0.55, ty = m.on ? clamp((m.ptr.y - 64) / 64, -1, 1) : -0.7;
    const k = reduce ? 1 : 1 - Math.exp(-dt * 8);
    st.lx += (tx - st.lx) * k; st.ly += (ty - st.ly) * k;
    const ll = Math.hypot(st.lx, st.ly, 0.9);
    const top = mixLch(pal.rest[0], pal.hover[0], c), bot = mixLch(pal.rest[2], pal.hover[2], c);
    st.F.forEach((f, i) => {
      const pts = f.map(n => st.P[n]);
      const gx = (pts[0][0] + pts[1][0] + pts[2][0]) / 3, gy = (pts[0][1] + pts[1][1] + pts[2][1]) / 3;
      let nx = gx - 64, ny = gy - 62;
      const nl = Math.hypot(nx, ny) || 1;
      nx /= nl; ny /= nl;
      set(st.faces[i], 'd', dPts(pts, nx * ex, ny * ex));
      // Lambert term against a light that follows the pointer.
      const shade = (nx * st.lx + ny * st.ly + 0.75 * 0.9) / (Math.hypot(1, 0.75) * ll);
      const col = mixLch(top, bot, clamp((gy - 10) / 108));
      col[0] = clamp(col[0] + (shade - 0.5) * (0.1 + 0.2 * c), 0.2, 0.98);
      const s = css(col);
      set(st.faces[i], 'fill', s); set(st.faces[i], 'stroke', s);
    });
    const d = dPts(['A', 'T1', 'T2', 'B', 'C'].map(n => st.P[n]));
    set(st.silC, 'd', d); set(st.rim, 'd', d);
  },
  busy: m => Math.abs(m.st.lx + 0.55) + Math.abs(m.st.ly + 0.7) > 0.01,
});

def({
  label: 'Fold',
  pal: { rest: [[0.86, 0.11, 182], [0.72, 0.14, 174], [0.56, 0.13, 192], [0.96, 0.04, 175]], hover: [[0.88, 0.13, 158], [0.74, 0.16, 160], [0.55, 0.14, 180], [0.97, 0.05, 150]] },
  dIn: 0.7, dOut: 0.6,
  sil: () => dPts(S.square()),
  build(m) {
    const id = m.id;
    const fg = el('linearGradient', { id: id + 'k', gradientUnits: 'userSpaceOnUse' }, m.defs);
    const fs = [0, 1].map(o => el('stop', { offset: o }, fg));
    const sk = skin(m);
    const shadow = el('path', { fill: '#000', opacity: 0.28, 'clip-path': `url(#${id}c)` }, m.svg);
    const flap = el('path', { fill: `url(#${id}k)` }, m.svg);
    const flapRim = el('path', { fill: 'none', stroke: 'url(#rim)', 'stroke-width': 1.5 }, m.svg);
    return { sk, fg, fs, shadow, flap, flapRim, base: densify(S.square(), 1.2), s: 0 };
  },
  render(m, dt) {
    const st = m.st, c = clamp(m.s.p), pal = this.pal;
    const C = [108, 20], ux = -Math.SQRT1_2, uy = Math.SQRT1_2;
    // Fold depth grows as the pointer nears the corner.
    const near = 1 - clamp(Math.hypot(m.ptr.x - C[0], m.ptr.y - C[1]) / 110);
    const target = c * (16 + 34 * near);
    st.s += (target - st.s) * (reduce ? 1 : 1 - Math.exp(-dt * 9));
    const s = st.s, f = q => (q[0] - C[0]) * ux + (q[1] - C[1]) * uy - s;
    const main = clipHalf(st.base, f, 1), cut = clipHalf(st.base, f, -1);
    set(st.sk.s, 'd', main.length > 2 ? dPts(main) : 'M0 0');
    if (cut.length > 2) {

      const d = dPts(fl);
      set(st.flap, 'd', d); set(st.flapRim, 'd', d); set(st.shadow, 'd', dPts(fl, -1.5, 3));
      set(st.fg, 'x1', r1(C[0] + s * ux)); set(st.fg, 'y1', r1(C[1] + s * uy));
      set(st.fg, 'x2', r1(C[0] + 2 * s * ux)); set(st.fg, 'y2', r1(C[1] + 2 * s * uy));
    } else {
      set(st.flap, 'd', 'M0 0'); set(st.flapRim, 'd', 'M0 0'); set(st.shadow, 'd', 'M0 0');

    set(st.fs[0], 'stop-color', css([f0[0] + 0.04, f0[1], f0[2] + 8]));
    set(st.fs[1], 'stop-color', css([f2[0] - 0.1, f2[1], f2[2] + 8]));
  },
  busy: m => m.st.s > 0.02,
});

def({

def({
  label: 'Wave',
  pal: { rest: [[0.88, 0.09, 205], [0.72, 0.14, 228], [0.56, 0.17, 250], [0.97, 0.04, 210]], hover: [[0.9, 0.1, 185], [0.74, 0.14, 212], [0.52, 0.18, 262], [0.97, 0.05, 190]] },
  dIn: 0.8, dOut: 0.7,
  sil: () => dLine(S.capsule()),
  build(m) {
    const sk = skin(m);
    for (const [k, v] of [['x1', 12], ['y1', 64], ['x2', 64], ['y2', 64], ['spreadMethod', 'reflect']]) set(sk.g, k, v);

def({
  label: 'Loop',
  pal: { rest: [[0.82, 0.12, 225], [0.66, 0.18, 245], [0.52, 0.2, 265], [0.95, 0.05, 230]], hover: [[0.82, 0.14, 300], [0.64, 0.22, 320], [0.55, 0.21, 350], [0.96, 0.05, 330]] },
  dIn: 0.85, dOut: 0.65,
  sil: () => dCircle(64, 64, 46.5) + dCircle(64, 64, 35.5, true),
  build(m) {
    const id = m.id, G = grad(m), a = new Float32Array(N * 2), b = new Float32Array(N * 2);
    // Circle and lemniscate share one parameter, so the top and bottom fold into the crossing.
    for (let i = 0; i < N; i++) {
      const t = (i / N) * TAU, s = Math.sin(t), q = 1 + s * s;
      a[2 * i] = 64 + 41 * Math.cos(t); a[2 * i + 1] = 64 + 41 * s;
      b[2 * i] = 64 + (54 * Math.cos(t)) / q; b[2 * i + 1] = 64 + (1.5 * 54 * s * Math.cos(t)) / q;
    }
    const base = el('path', { fill: 'none', stroke: `url(#${id}g)`, 'stroke-width': 11, 'stroke-linejoin': 'round' }, m.svg);
    const dash = { fill: 'none', 'stroke-linecap': 'round', pathLength: 100, 'stroke-dasharray': '14 86', opacity: 0 };
    const glow = el('path', { ...dash, 'stroke-width': 19 }, m.svg);

  render(m, dt) {

    set(st.base, 'd', d); set(st.glow, 'd', d); set(st.hi, 'd', d);

def({
  label: 'Grid',
  pal: { rest: [[0.84, 0.1, 250], [0.66, 0.17, 268], [0.5, 0.2, 285], [0.95, 0.05, 250]], hover: [[0.86, 0.12, 195], [0.68, 0.16, 232], [0.5, 0.2, 275], [0.96, 0.05, 200]] },
  dIn: 1, eIn: 'none', dOut: 0.85, eOut: 'none',
  sil: () => {
    let s = '';
    for (let y = -1; y <= 1; y++) for (let x = -1; x <= 1; x++) {
      const l = 52 + x * 32, t = 52 + y * 32;
      s += `M${l + 6} ${t}h12a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6h-12a6 6 0 0 1-6-6v-12a6 6 0 0 1 6-6Z`;
    }
    return s;
  },
  build(m) {
    const G = grad(m), id = m.id, cells = [];
    for (let gy = -1; gy <= 1; gy++) for (let gx = -1; gx <= 1; gx++) {
      const ctr = gx === 0 && gy === 0, a = Math.atan2(gy, gx) + PI / 8;
      // Squares repeat every 90°, so each cell turns at most 45°.
      let rot = (((a / D2R + 45) % 90) + 90) % 90;
      if (rot > 45) rot -= 90;
      const cid = id + 'q' + cells.length;
      const rect = el('rect', { id: cid }, m.defs);
      el('use', { href: '#' + cid, fill: `url(#${id}g)` }, m.svg);
      el('use', { href: '#' + cid, fill: 'none', stroke: 'url(#rim)', 'stroke-width': 1.5 }, m.svg);
      cells.push({
        rect, d: 0,
        r: [64 + gx * 32, 64 + gy * 32, 24, 6, 0],
        h: ctr ? [64, 64, 30, 15, 0] : [64 + 46 * Math.cos(a), 64 + 46 * Math.sin(a), 19, 4, rot],
      });
    }
    return { G, cells };
  },
  enter(m) { this.stagger(m, false); },
  leave(m) { this.stagger(m, true); },
  // Cells nearest the pointer move first, both on entry and on exit.
  stagger(m, out) {
    for (const cl of m.st.cells) {
      const d = clamp(Math.hypot(cl.r[0] - m.ptr.x, cl.r[1] - m.ptr.y) / 120);
      cl.d = out ? 1 - d : d;
    }
  },
  render(m) {
    const st = m.st, p = m.s.p;
    for (const cl of st.cells) {
      const t = E.inOut3(clamp((p - cl.d * 0.4) / 0.6));
      const cx = lerp(cl.r[0], cl.h[0], t), cy = lerp(cl.r[1], cl.h[1], t), s = lerp(cl.r[2], cl.h[2], t);
      set(cl.rect, 'x', r1(cx - s / 2)); set(cl.rect, 'y', r1(cy - s / 2));
      set(cl.rect, 'width', r1(s)); set(cl.rect, 'height', r1(s));
      set(cl.rect, 'rx', r1(lerp(cl.r[3], cl.h[3], t)));
      set(cl.rect, 'transform', `rotate(${r1(lerp(0, cl.h[4], t))} ${r1(cx)} ${r1(cy)})`);
    }
    set(st.G.g, 'gradientTransform', `rotate(${r1(E.inOut3(clamp(p)) * 90)} 64 64)`);
    paint(st.G, this.pal, E.inOut3(clamp(p)));
  },
});

def({
  label: 'Orbit',
  pal: P(288, -70),
  dIn: 0.9, dOut: 0.7,
  sil: () => dCircle(64, 64, 40) + dCircle(r1(64 + 54 * Math.cos(-PI / 4)), r1(64 + 54 * Math.sin(-PI / 4)), 9),
  build(m) {
    const id = m.id, sk = skin(m, { tag: 'circle' });
    set(sk.s, 'cx', 64); set(sk.s, 'cy', 64);
    const ring = el('circle', { cx: 64, cy: 64, r: 44, fill: 'none', stroke: `url(#${id}g)`, 'stroke-width': 7, pathLength: 100, 'stroke-linecap': 'round' }, m.svg);
    const moons = [0, 1, 2].map(() => el('circle', {}, m.svg));
    return { sk, ring, moons, spin: 0, prim: 0 };
  },
  // Spin ends on a multiple of 120°; the moon landing at 1:30 becomes the resting moon.
  leave(m) {
    const T3 = TAU / 3, q = Math.ceil(m.st.spin / T3 - 1e-6);
    m.st.prim = ((-q % 3) + 3) % 3;
    gsap.to(m.st, { spin: q * T3, duration: 0.7, ease: 'power3.inOut' });
  },
  render(m, dt) {
    const st = m.st, c = clamp(m.s.p), pal = this.pal, T3 = TAU / 3;
    if (m.on && !reduce) {
      // Moons speed up when the pointer is ahead of them and slow when it is behind.
      const ph = -PI / 4 + st.spin, pa = Math.atan2(m.ptr.y - 64, m.ptr.x - 64);
      st.spin += dt * c * Math.max(0.2, 1.1 + 1.3 * Math.sin(angDiff(pa, ph)));
    }
    const base = -PI / 4 + st.spin + st.prim * T3;
    set(st.sk.s, 'r', r1(lerp(40, 22, m.s.p)));
    set(st.ring, 'stroke-dasharray', `${(c * 100).toFixed(1)} 100`);
    set(st.ring, 'transform', `rotate(${r1(base / D2R)} 64 64)`);
    set(st.ring, 'opacity', c > 0.002 ? 1 : 0);
    const mc = mix(pal.rest[1], pal.hover[3], c), dist = lerp(54, 44, c);
    st.moons.forEach((mo, k) => {
      const j = (((k - st.prim) % 3) + 3) % 3, a = base + j * T3 * c;
      set(mo, 'cx', r1(64 + dist * Math.cos(a))); set(mo, 'cy', r1(64 + dist * Math.sin(a)));
      set(mo, 'r', r1(j === 0 ? lerp(9, 6.5, c) : 6.5 * c));
      set(mo, 'fill', mc);
    });
    set(st.sk.l, 'cx', r1(lerp(42, 64 + 24 * Math.cos(base), c)));
    set(st.sk.l, 'cy', r1(lerp(34, 64 + 24 * Math.sin(base), c)));
    paint(st.sk, pal, c);
  },
});

def({
  label: 'Twist',
  pal: P(312, -48),
  dIn: 0.95, eIn: 'back.out(1.6)', dOut: 0.6,

def({
  label: 'Magnet',
  pal: P(336, 40),
  dIn: 0.6, dOut: 0.8,
  sil: () => dLine(resample(polar(S.pebble))),
  build(m) {
    const n = 72, th = new Float32Array(n), r0 = new Float32Array(n);
    for (let i = 0; i < n; i++) { th[i] = (i / n) * TAU; r0[i] = S.pebble(th[i]); }
    return { sk: skin(m), n, th, r0, o: new Float32Array(n), v: new Float32Array(n), out: new Float32Array(n * 2), lx: 42, ly: 34, tx: 0, ty: 0, busy: false };
  },
  render(m, dt) {
    const st = m.st, c = clamp(m.s.p), n = st.n;
    const dx = m.ptr.x - 64, dy = m.ptr.y - 64, pd = Math.hypot(dx, dy), pa = Math.atan2(dy, dx) + PI / 2;
    const pull = c * (8 + 12 * clamp((pd - 18) / 40));
    const steps = dt > 0 ? Math.ceil(dt * 120) : 0, h = steps ? dt / steps : 0;
    let busy = false;
    // One spring per vertex; the surface bulges toward the pointer.
    for (let i = 0; i < n; i++) {
      const fo = Math.max(0, Math.cos(st.th[i] - pa)) ** 6;
      const tg = pull * fo - 2 * c + (reduce ? 0 : 1.2 * c * Math.sin(m.time * 3 + st.th[i] * 3));
      if (reduce) { st.o[i] = tg; st.v[i] = 0; }
      for (let s = 0; s < steps; s++) { st.v[i] += (170 * (tg - st.o[i]) - 12 * st.v[i]) * h; st.o[i] += st.v[i] * h; }
      if (Math.abs(st.v[i]) > 0.02 || Math.abs(st.o[i] - tg) > 0.02) busy = true;
    }
    st.busy = busy;
    const k = reduce ? 1 : 1 - Math.exp(-dt * 6), sh = c * Math.min(5, pd * 0.08);
    st.tx += ((pd ? (dx / pd) * sh : 0) - st.tx) * k;
    st.ty += ((pd ? (dy / pd) * sh : 0) - st.ty) * k;
    for (let i = 0; i < n; i++) {
      const r = st.r0[i] + st.o[i], a = st.th[i] - PI / 2;
      st.out[2 * i] = 64 + st.tx + r * Math.cos(a); st.out[2 * i + 1] = 64 + st.ty + r * Math.sin(a);
    }
    set(st.sk.s, 'd', dCurve(st.out));
    st.lx += ((m.on ? m.ptr.x : 42) - st.lx) * k; st.ly += ((m.on ? m.ptr.y : 34) - st.ly) * k;
    set(st.sk.l, 'cx', r1(st.lx)); set(st.sk.l, 'cy', r1(st.ly));
    paint(st.sk, this.pal, c);
  },
  busy: m => m.st.busy || Math.abs(m.st.tx) + Math.abs(m.st.ty) > 0.05 || Math.abs(m.st.lx - 42) + Math.abs(m.st.ly - 34) > 0.2,
});

/* ---------- mount, input, ticker ---------- */
const grid = document.getElementById('grid');
const active = new Set();
let lastType = 'mouse';

function local(m, e) {
  const r = m.rect || (m.rect = m.svg.getBoundingClientRect());
  return { x: ((e.clientX - r.left) / r.width) * 128, y: ((e.clientY - r.top) / r.height) * 128 };
}
function enter(m, e) {
  if (e && e.clientX != null) { m.rect = null; const q = local(m, e); m.entry = q; m.ptr = { ...q }; }
  if (m.on) return;
  m.on = true;
  m.btn.classList.add('on');
  gsap.killTweensOf(m.st);
  m.def.enter?.(m);
  gsap.to(m.s, { p: 1, duration: reduce ? 0.2 : m.def.dIn ?? 0.72, ease: reduce ? 'none' : m.def.eIn ?? 'expo.out', overwrite: true });
  active.add(m);
}
function leave(m) {
  if (!m.on) return;
  m.on = false;
  m.btn.classList.remove('on');
  m.def.leave?.(m);
  gsap.to(m.s, { p: 0, duration: reduce ? 0.2 : m.def.dOut ?? 0.56, ease: reduce ? 'none' : m.def.eOut ?? 'power3.inOut', overwrite: true });
  active.add(m);
}

const marks = MARKS.map((d, i) => {

const fpsEl = document.getElementById('fps');
const ft = [];
let uiAt = 0, slowFired = false;
function meter(time, dms) {
  ft.push(dms);
  if (ft.length > 300) ft.shift();
  if (time - uiAt < 0.25) return;
  uiAt = time;
  let sum = 0, n = 0, worst = 0;
  for (let i = ft.length - 1; i >= 0 && sum < 1000; i--) { sum += ft[i]; n++; }
  for (let i = ft.length - 1, s = 0; i >= 0 && s < 2000; i--) { s += ft[i]; worst = Math.max(worst, ft[i]); }
  const fps = Math.round((n * 1000) / (sum || 1)), low = Math.round(1000 / (worst || 1));
  fpsEl.textContent = `${String(fps).padStart(3)} fps  ${String(low).padStart(3)} low`;

const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));
// Budget caps drawing-buffer pixels, so big screens keep their frame rate.
function fitRenderer(renderer, panel, cap, onSize, budget = Infinity) {
  const apply = () => {
    const w = panel.clientWidth, h = panel.clientHeight;
    if (!w || !h) return;
    renderer.setPixelRatio(Math.min(devicePixelRatio, lowDpr ? 1 : cap, Math.sqrt(budget / (w * h))));

  }

/* ---------- lab: Three.js extrude ---------- */
async function labExtrude(THREE, RoomEnvironment) {
  const panel = document.getElementById('lab-extrude'), canvas = panel.querySelector('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.toneMapping = THREE.NeutralToneMapping;
  const scene = new THREE.Scene(), pm = new THREE.PMREMGenerator(renderer);
  await idle();
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  const camera = new THREE.PerspectiveCamera(30, 4 / 3, 0.1, 60);
  camera.position.set(0, 0, 11.6);
  const key = new THREE.DirectionalLight(0xffffff, 1.4);
  key.position.set(-3, 4, 5);
  scene.add(key);
  const group = new THREE.Group();
  scene.add(group);

  const cap = S.capsule(), pebble = resample(polar(S.pebble));
  const fold = q => (q[0] - 108) * -Math.SQRT1_2 + (q[1] - 20) * Math.SQRT1_2 - 34;
  const cfg = [
    ['Prism', S.tri(), S.hex(), -PI / 6],
    ['Bloom', S.bud(), S.rose(), -PI / 6],
    ['Twist', resample(roundPoly(S.starV(0, 25), 5, 5)), resample(roundPoly(S.starV(36 * D2R, 31), 5, 5)), -72 * D2R],
    ['Facet', resample([[64, 10], [108, 62], [64, 118], [20, 62]]), resample([[14, 44], [40, 18], [88, 18], [114, 44], [64, 112]]), 0],
    ['Fold', resample(S.square()), resample(clipHalf(densify(S.square(), 1.2), fold, 1)), 0],
    ['Eclipse', resample(arc(64, 92, 48, PI, TAU, 96)), S.circle(42, 64, 62), 0],
    ['Wave', cap, waveOutline(cap, new Float32Array(N * 2), 2.2, 12, 0.6, 1), 0],
    ['Ripple', S.drop(), S.circle(32), 0],
    ['Magnet', pebble, resample(polar(a => S.pebble(a) + 18 * Math.max(0, Math.cos(a - 0.8)) ** 6)), 0],
  ];
  const mat = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.12 });
  const tmpC = new THREE.Color(), tmpD = new THREE.Color();
  const n = N, F0 = 0, B0 = n + 1, SF = 2 * n + 2, SB = 3 * n + 2;
  let D = 0.17;
  const index = [];
  // Fan caps from the centre keep one index buffer valid for both outlines.
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    index.push(F0, F0 + 1 + i, F0 + 1 + j, B0, B0 + 1 + j, B0 + 1 + i);
    index.push(SF + i, SB + i, SF + j, SF + j, SB + i, SB + j);
  }
  const pieces = cfg.map(([label, A, B, rz], i) => {
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array((4 * n + 2) * 3), colA = new Float32Array((4 * n + 2) * 3);
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colA, 3));
    geo.setIndex(index);
    geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1.4);
    const mesh = new THREE.Mesh(geo, mat);
    const pc = {
      i, A, B, rz, geo, pos, colA, mesh, p: 0, tg: 0, lt: -1, locked: false,
      tmp: new Float32Array(n * 2), pal: palOf(label),
      x: ((i % 3) - 1) * 2.2, y: (1 - Math.floor(i / 3)) * 1.85,
    };
    mesh.userData.pc = pc;
    group.add(mesh);
    return pc;
  });
  function writeGeo(pc, t) {
    const o = lerpPts(pc.tmp, pc.A, pc.B, t), P0 = pc.pos;
    P0.fill(0, 0, 3);
    P0[2] = D;
    P0[B0 * 3] = 0; P0[B0 * 3 + 1] = 0; P0[B0 * 3 + 2] = -D;
    for (let i = 0; i < n; i++) {
      const x = (o[2 * i] - 64) / 64, y = -(o[2 * i + 1] - 64) / 64;
      for (const [v, z] of [[F0 + 1 + i, D], [B0 + 1 + i, -D], [SF + i, D], [SB + i, -D]]) { P0[v * 3] = x; P0[v * 3 + 1] = y; P0[v * 3 + 2] = z; }
    }
    pc.geo.attributes.position.needsUpdate = true;
    pc.geo.computeVertexNormals();
  }
  function writeCol(pc, t) {
    const c3 = [0, 1, 2].map(k => rgb(mixLch(pc.pal.rest[k], pc.pal.hover[k], t, pc.pal.raw)));
    const C = pc.colA, P0 = pc.pos;
    tmpC.setRGB(...c3[1], THREE.SRGBColorSpace);
    for (const v of [F0, B0]) { C[v * 3] = tmpC.r; C[v * 3 + 1] = tmpC.g; C[v * 3 + 2] = tmpC.b; }
    for (let i = 0; i < n; i++) {
      const ty = clamp((1 - P0[(F0 + 1 + i) * 3 + 1]) / 2);
      tmpD.setRGB(...c3[0], THREE.SRGBColorSpace).lerp(tmpC.setRGB(...c3[2], THREE.SRGBColorSpace), ty);
      for (const [v, mul] of [[F0 + 1 + i, 1], [B0 + 1 + i, 1], [SF + i, 0.72], [SB + i, 0.6]]) {
        C[v * 3] = tmpD.r * mul; C[v * 3 + 1] = tmpD.g * mul; C[v * 3 + 2] = tmpD.b * mul;
      }
    }
    pc.geo.attributes.color.needsUpdate = true;
  }

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(9, 9), meshes = pieces.map(p => p.mesh);
  let hovered = null, all = false, spin = false, down = null, dragX = 0, dragY = 0;
  const view = { rx: 0, ry: 0, wx: 0, wy: 0 };
  function retarget() {
    for (const pc of pieces) {
      const tg = all || pc.locked || pc === hovered ? 1 : 0;
      if (tg === pc.tg) continue;
      pc.tg = tg;
      gsap.to(pc, { p: tg, duration: reduce ? 0.2 : tg ? 0.8 : 0.6, ease: tg ? 'expo.out' : 'power3.inOut', overwrite: true });
    }
  }
  function pickAt(e) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -(((e.clientY - r.top) / r.height) * 2 - 1));
    ray.setFromCamera(ndc, camera);
    return ray.intersectObjects(meshes, false)[0]?.object.userData.pc ?? null;
  }
  canvas.addEventListener('pointerdown', e => {
    down = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: false };
    gsap.killTweensOf(view);
    try { canvas.setPointerCapture(e.pointerId); } catch {}
  });
  canvas.addEventListener('pointermove', e => {
    if (down) {
      if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) down.moved = true;
      if (down.moved) { dragX += e.clientX - down.lx; dragY += e.clientY - down.ly; }
      down.lx = e.clientX; down.ly = e.clientY;
      return;
    }
    if (e.pointerType !== 'touch') { hovered = pickAt(e); retarget(); }
  });
  canvas.addEventListener('pointerup', e => {
    // A click without a drag locks or unlocks the piece under it.
    if (down && !down.moved) { const pc = pickAt(e); if (pc) { pc.locked = !pc.locked; retarget(); } }
    down = null;
  });
  canvas.addEventListener('pointercancel', () => { down = null; });
  canvas.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch' && !down) { hovered = null; retarget(); } });
  const allT = toggle('ex-all', false, v => { all = v; retarget(); });
  const spinT = toggle('ex-spin', false, v => { spin = v; });
  document.getElementById('ex-reset').addEventListener('click', () => {
    allT.set((all = false));
    spinT.set((spin = false));
    pieces.forEach(pc => (pc.locked = false));
    retarget();
    view.wx = view.wy = 0;
    gsap.to(view, { rx: 0, ry: Math.round(view.ry / TAU) * TAU, duration: reduce ? 0.2 : 0.9, ease: 'power3.inOut' });
  });
  slider('ex-depth', v => v.toFixed(2), v => { D = v; pieces.forEach(pc => (pc.lt = -1)); });

  // Async compile keeps the 500 ms physical-material build off the main thread.
  await renderer.compileAsync(scene, camera);
  fitRenderer(renderer, panel, 1.75, (w, h) => { camera.aspect = w / h; camera.updateProjectionMatrix(); });
  whenVisible(panel, (time, dms) => {
    const dt = Math.min(dms / 1000, 0.05);
    const v = view;
    if (down?.moved) {
      v.ry += dragX * 0.005;
      v.rx = clamp(v.rx + dragY * 0.005, -1, 1);
      v.wy = dt ? clamp((dragX * 0.005) / dt, -4, 4) : 0;
      v.wx = dt ? clamp((dragY * 0.005) / dt, -4, 4) : 0;
      dragX = dragY = 0;
    } else {
      // Release keeps the drag velocity and lets it decay.
      v.ry += v.wy * dt;
      v.rx = clamp(v.rx + v.wx * dt, -1, 1);
      const k = Math.exp(-dt * 5);
      v.wx *= k; v.wy *= k;
      if (spin && !reduce) v.ry += dt * 0.35;
    }
    group.rotation.set(v.rx, v.ry, 0);
    for (const pc of pieces) {
      const t = pc.p;
      if (t !== pc.lt) { writeGeo(pc, t); writeCol(pc, clamp(t)); pc.lt = t; }
      const m = pc.mesh, k = reduce ? 0 : 1, on = hovered === pc ? t : 0;
      m.position.set(pc.x, pc.y + k * Math.sin(time * 0.8 + pc.i) * 0.05, 0.7 * t);
      m.rotation.set(-0.3 - ndc.y * 0.4 * on, k * Math.sin(time * 0.5 + pc.i * 1.3) * 0.22 + ndc.x * 0.5 * on, pc.rz * t);
      m.scale.setScalar(0.76 * (1 + 0.12 * t));
    }
    renderer.render(scene, camera);
  });
}

/* ---------- lab: GLSL signed-distance playground ---------- */
const FRAG = /* glsl */ `
precision highp float;
uniform vec2 uRes, uVel;
uniform float uTime, uMorph, uK;
uniform vec4 uPip;
uniform vec4 uBl[16];
uniform int uN;
uniform vec3 uA[6], uB[6];
float sdCircle(vec2 p, float r) { return length(p) - r; }
float sdTri(vec2 p, float r) {
  const float k = 1.7320508;
  p.x = abs(p.x) - r; p.y = p.y + r / k;
  if (p.x + k * p.y > 0.0) p = vec2(p.x - k * p.y, -k * p.x - p.y) / 2.0;
  p.x -= clamp(p.x, -2.0 * r, 0.0);
  return -length(p) * sign(p.y);
}
float sdBox(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
float sdHex(vec2 p, float r) {
  const vec3 k = vec3(-0.866025404, 0.5, 0.577350269);
  p = abs(p); p -= 2.0 * min(dot(k.xy, p), 0.0) * k.xy;
  p -= vec2(clamp(p.x, -k.z * r, k.z * r), r);
  return length(p) * sign(p.y);
}
float sdStar5(vec2 p, float r, float rf) {
  const vec2 k1 = vec2(0.809016994375, -0.587785252292);
  const vec2 k2 = vec2(-k1.x, k1.y);
  p.x = abs(p.x);
  p -= 2.0 * max(dot(k1, p), 0.0) * k1;
  p -= 2.0 * max(dot(k2, p), 0.0) * k2;
  p.x = abs(p.x); p.y -= r;
  vec2 ba = rf * vec2(-k1.y, k1.x) - vec2(0.0, 1.0);
  float h = clamp(dot(p, ba) / dot(ba, ba), 0.0, r);
  return length(p - ba * h) * sign(p.y * ba.x - p.x * ba.y);
}
float sdSeg(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0); return length(pa - ba * h); }
float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
// Six petal circles fused onto a centre disc: a true distance field, no seams.
float sdRose(vec2 p, float r) {
  float d = length(p) - r * 0.42;
  for (int k = 0; k < 6; k++) {
    float a = float(k) * 1.0471976;
    d = smin(d, length(p - r * 0.66 * vec2(sin(a), cos(a))) - r * 0.3, r * 0.22);
  }
  return d;
}
float shape(int i, vec2 p) {
  if (i == 0) return sdCircle(p, 0.3);
  if (i == 1) return sdTri(p + vec2(0.0, 0.045), 0.29) - 0.045;
  if (i == 2) return sdBox(p, vec2(0.27), 0.07);
  if (i == 3) return sdHex(p, 0.27) - 0.035;
  if (i == 4) return sdStar5(p + vec2(0.0, 0.02), 0.34, 0.5) - 0.022;
  return sdRose(p, 0.34);

vec3 toLin(vec3 lab) {
  vec3 l = mat3(1.0, 1.0, 1.0, 0.3963377774, -0.1055613458, -0.0894841775, 0.2158037573, -0.0638541728, -1.2914855480) * lab;
  l = l * l * l;
  return mat3(4.0767416621, -1.2684380046, -0.0041960863, -3.3077115913, 2.6097574011, -0.7034186147, 0.2309699292, -0.3413193965, 1.7076147010) * l;
}
// uA and uB arrive in OKLab, converted once on the CPU.
void main() {
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float m = mod(uMorph, 6.0);
  int i = int(floor(m));
  int j = i == 5 ? 0 : i + 1;
  float f = smoothstep(0.1, 0.9, fract(m));
  float tw = 0.5 * sin(f * 3.14159265);
  vec2 q = mat2(cos(tw), -sin(tw), sin(tw), cos(tw)) * p;
  float dS = mix(shape(i, q), shape(j, q), f);
  // The pip stretches toward its spring tail; blobs and trail fuse with it.
  float dB = mix(10.0, sdSeg(p, uPip.xy, uPip.xy - uVel) - uPip.z, uPip.w);
  for (int k = 0; k < 16; k++) {
    if (k >= uN) break;
    dB = smin(dB, length(p - uBl[k].xy) - uBl[k].z, uK * 0.7);
  }
  // h is the shape's share of each pixel; colour blends with the same weight.
  float h = clamp(0.5 + 0.5 * (dB - dS) / uK, 0.0, 1.0);
  float d = mix(dB, dS, h) - uK * h * (1.0 - h);
  // The edge stays within 1.5 px even where the field bends sharply.
  float aa = min(fwidth(d), 1.5 / uRes.y);
  float a = 1.0 - smoothstep(-aa, aa, d);
  vec2 dir = vec2(cos(uTime * 0.4), sin(uTime * 0.4));
  float t = clamp(dot(p, dir) * 1.3 + 0.5, 0.0, 1.0);
  int c2 = i < 3 ? i + 3 : i - 3;
  vec3 sLab = mix(mix(uA[i], uA[j], f), mix(uB[i], uB[j], f), t);
  vec3 bLab = mix(uA[c2], uB[c2], 1.0 - t);
  vec3 lab = mix(bLab, sLab, h);
  vec3 col = toLin(lab);
  col += 0.2 * exp(-length(p - vec2(-0.16, 0.2)) * 5.0);
  vec2 n = normalize(vec2(dFdx(d), dFdy(d)) + 1e-6);
  col += 0.5 * smoothstep(0.022, 0.0, -d) * max(0.0, dot(n, vec2(-0.7071, 0.7071)));
  float g = exp(-max(d, 0.0) * 16.0) * 0.32 * (1.0 - a);
  float alpha = a + g;
  vec3 outc = pow(clamp((col * a + toLin(lab) * g) / max(alpha, 1e-4), 0.0, 1.0), vec3(1.0 / 2.2));
  gl_FragColor = vec4(outc * alpha, alpha);
}`;

async function labSdf(THREE) {
  const panel = document.getElementById('lab-sdf'), canvas = panel.querySelector('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true });
  const order = ['Orbit', 'Prism', 'Fold', 'Grid', 'Twist', 'Bloom'];
  const vec = lch => {
    const [r, g, b] = rgb(lch).map(toLinear);
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return new THREE.Vector3(
      0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s,
    );
  };
  const bl = Array.from({ length: 16 }, () => new THREE.Vector4());
  const U = {
    uRes: { value: new THREE.Vector2(1, 1) }, uVel: { value: new THREE.Vector2() },
    uTime: { value: 0 }, uMorph: { value: 0 }, uK: { value: 0.14 },
    uPip: { value: new THREE.Vector4(0, 0, 0.065, 0) }, uBl: { value: bl }, uN: { value: 0 },
    uA: { value: order.map(l => vec(palOf(l).rest[0])) },
    uB: { value: order.map(l => vec(palOf(l).rest[2])) },
  };
  const mat = new THREE.ShaderMaterial({ uniforms: U, vertexShader: 'void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }', fragmentShader: FRAG });
  const scene = new THREE.Scene(), cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

  let auto = true, morph = 0, target = 0, pip = 0.065, trailLen = 6, shown = -1, down = null, rect = null;
  const ptr = { x: 0, y: 0, vx: 0, vy: 0, t: 0, on: false, w: 0 };
  const tail = { x: 0, y: 0, vx: 0, vy: 0 };
  const chain = Array.from({ length: 8 }, () => ({ x: 0, y: 0 }));
  const drops = [];
  // A scroll under a still cursor may skip pointerleave, so the pip hides until the next move.
  addEventListener('scroll', () => { rect = null; if (!down) ptr.on = false; }, { passive: true });
  // The head sits on the pointer; speed comes from event timestamps, not frames.
  function track(e) {
    const r = rect || (rect = canvas.getBoundingClientRect());
    const x = (e.clientX - r.left - r.width / 2) / r.height, y = (r.height / 2 - (e.clientY - r.top)) / r.height;
    const dt = (e.timeStamp - ptr.t) / 1000;
    if (!ptr.on) {
      // A fresh entry snaps the tail and trail to the pointer.
      tail.x = x; tail.y = y; tail.vx = tail.vy = 0;
      chain.forEach(c => { c.x = x; c.y = y; });
      ptr.vx = ptr.vy = 0;
    } else if (dt > 0 && dt < 0.1) {
      const k = 1 - Math.exp(-dt * 20);
      ptr.vx += ((x - ptr.x) / dt - ptr.vx) * k;
      ptr.vy += ((y - ptr.y) / dt - ptr.vy) * k;
    }
    ptr.x = x; ptr.y = y; ptr.t = e.timeStamp; ptr.on = true;
  }
  canvas.addEventListener('pointermove', track);
  canvas.addEventListener('pointerdown', e => {
    track(e);
    down = { x: ptr.x, y: ptr.y };
    try { canvas.setPointerCapture(e.pointerId); } catch {}
  });
  canvas.addEventListener('pointerup', e => {
    if (!down) return;
    // A drag throws the blob with the pointer's velocity; a click just drops it.
    const thrown = Math.hypot(ptr.x - down.x, ptr.y - down.y) > 0.02;
    drops.push({ x: ptr.x, y: ptr.y, vx: thrown ? ptr.vx : 0, vy: thrown ? ptr.vy : 0, r: pip * 1.15 });
    if (drops.length > 8) drops.shift();
    down = null;
    if (e.pointerType === 'touch') ptr.on = false;
  });
  canvas.addEventListener('pointercancel', () => { down = null; ptr.on = false; });
  canvas.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch' && !down) ptr.on = false; });

  const chips = [...document.querySelectorAll('#sdf-shapes .chip')];
  const autoT = toggle('sdf-auto', true, v => { auto = v; target = Math.round(morph); });
  chips.forEach((b, k) => b.addEventListener('click', () => { auto = false; autoT.set(false); target = k; }));
  slider('sdf-blend', v => v.toFixed(2), v => { U.uK.value = v; });
  slider('sdf-pip', v => v.toFixed(3), v => { pip = v; });
  slider('sdf-trail', v => String(v), v => { trailLen = v; });
  document.getElementById('sdf-clear').addEventListener('click', () => { drops.length = 0; });

  await renderer.compileAsync(scene, cam);
  fitRenderer(renderer, panel, 1.5, () => { rect = null; renderer.getDrawingBufferSize(U.uRes.value); }, 1.4e6);
  whenVisible(panel, (time, dms) => {
    const dt = Math.min(dms / 1000, 0.05);
    // A still pointer sends no events, so its speed decays here.
    if (performance.now() - ptr.t > 50) { const k = Math.exp(-dt * 20); ptr.vx *= k; ptr.vy *= k; }
    ptr.w += ((ptr.on ? 1 : 0) - ptr.w) * (1 - Math.exp(-dt * 12));
    // The tail follows the head on a critically damped spring.
    const steps = Math.max(1, Math.ceil(dt * 120)), h = dt / steps;
    for (let s = 0; s < steps; s++) {
      tail.vx += (260 * (ptr.x - tail.x) - 32 * tail.vx) * h;
      tail.vy += (260 * (ptr.y - tail.y) - 32 * tail.vy) * h;
      tail.x += tail.vx * h; tail.y += tail.vy * h;
    }
    let sx = reduce ? 0 : ptr.x - tail.x, sy = reduce ? 0 : ptr.y - tail.y;
    const sl = Math.hypot(sx, sy);
    if (sl > 0.16) { sx *= 0.16 / sl; sy *= 0.16 / sl; }
    U.uPip.value.set(ptr.x, ptr.y, pip * (1 - Math.min(sl, 0.16) * 2), ptr.w);
    U.uVel.value.set(sx, sy);
    // Each trail link eases toward the one ahead, like a rope.
    const kc = reduce ? 1 : 1 - Math.exp(-dt * 26);
    let ax = ptr.x, ay = ptr.y;
    for (const c of chain) { c.x += (ax - c.x) * kc; c.y += (ay - c.y) * kc; ax = c.x; ay = c.y; }
    // Dropped blobs orbit for a few seconds, then spiral in and dissolve.
    const hw = U.uRes.value.x / U.uRes.value.y / 2;
    for (const b of drops) {
      const ax = -2.4 * b.x - 1.0 * b.y - 0.9 * b.vx, ay = -2.4 * b.y + 1.0 * b.x - 0.9 * b.vy;
      b.vx += ax * dt; b.vy += ay * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      // Panel edges bounce blobs back.
      if (Math.abs(b.x) > hw - b.r) { b.x = Math.sign(b.x) * (hw - b.r); b.vx *= -0.6; }
      if (Math.abs(b.y) > 0.5 - b.r) { b.y = Math.sign(b.y) * (0.5 - b.r); b.vy *= -0.6; }
      if (Math.hypot(b.x, b.y) < 0.2) b.r -= dt * 0.025;
    }
    for (let k = drops.length - 1; k >= 0; k--) if (drops[k].r <= 0.004) drops.splice(k, 1);
    let cnt = 0;
    for (const b of drops) bl[cnt++].set(b.x, b.y, b.r, 0);
    for (let k = 0; k < trailLen && cnt < 16; k++) {
      bl[cnt++].set(chain[k].x, chain[k].y, pip * (1 - (k + 1) / (trailLen + 1)) * ptr.w, 0);
    }
    U.uN.value = cnt;

    if (auto && !reduce) morph += dt * 0.32;
    else {
      const near = target + 6 * Math.round((morph - target) / 6);
      morph += (near - morph) * (reduce ? 1 : 1 - Math.exp(-dt * 5));
    }
    const cur = ((Math.round(morph) % 6) + 6) % 6;
    if (cur !== shown) {
      chips[shown]?.removeAttribute('aria-current');
      chips[cur].setAttribute('aria-current', 'true');
      shown = cur;
    }
    U.uMorph.value = morph;
    U.uTime.value = time;
    renderer.render(scene, cam);
  });
}

let threeStarted = false;
// WebGL setup runs in idle slices, so scrolling to the lab never stalls.
async function startThree() {
  if (threeStarted) return;
  threeStarted = true;
  let THREE, Room;
  try {
    THREE = await import('three');
    ({ RoomEnvironment: Room } = await import('three/addons/environments/RoomEnvironment.js'));
  } catch (err) {
    failed(document.getElementById('lab-extrude'), 'Three.js');
    failed(document.getElementById('lab-sdf'), 'GLSL');
    return;
  }
  await idle();
  try { await labSdf(THREE); } catch (err) { console.error(err); failed(document.getElementById('lab-sdf'), 'GLSL'); }
  await idle();
  try { await labExtrude(THREE, Room); } catch (err) { console.error(err); failed(document.getElementById('lab-extrude'), 'Three.js'); }
}
new IntersectionObserver(([e], io) => { if (e.isIntersecting) { io.disconnect(); startThree(); } }, { rootMargin: '600px' })
  .observe(document.getElementById('lab'));
if (document.readyState === 'complete') idle().then(startThree);
else addEventListener('load', () => idle().then(startThree));
</script>
