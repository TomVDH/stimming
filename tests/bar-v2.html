<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bar v2 tests</title>
<link rel="stylesheet" href="../shared/stim.css">
<style>
#fx main { width: 900px; margin-bottom: 24px; }
#fx .stage { height: 300px; background: var(--stage); }
#out { font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<pre id="out"></pre>
<div id="fx"></div>
<script type="module">
import * as stim from '../shared/stim.js';
const { buildBar } = stim;

/* ---------- harness ---------- */
const out = document.getElementById('out'), fx = document.getElementById('fx');
const queue = [];
const t = (name, fn) => queue.push([name, fn]);
const ok = (cond, msg = 'expected true') => { if (!cond) throw new Error(msg); };
const eq = (a, b) => { if (a !== b) throw new Error(`${JSON.stringify(a)} !== ${JSON.stringify(b)}`); };
const frames = (n = 2) => new Promise(r => { const f = k => (k ? requestAnimationFrame(() => f(k - 1)) : r()); f(n); });
const wait = ms => new Promise(r => setTimeout(r, ms));
// Each fixture gets its own main and stage.
function fixture(spec = {}, opts = {}) {
  const main = document.createElement('main'), stage = document.createElement('div');
  stage.className = 'stage';
  main.append(stage);
  fx.append(main);
  const ui = buildBar(stage, spec, { id: 'bartest', ...opts });
  return { main, stage, ui, frame: stage.parentElement, layer: stage.parentElement.querySelector('.stim-ui') };
}
const shown = el => !!el && el.checkVisibility();
const click = el => el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
const key = (k, init = {}, target = document.body) => target.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...init }));
const tray = (cls = 's2-sheet') => [...document.querySelectorAll(`.${cls}`)];

/* ---------- Task 1: frame, layer, top corners ---------- */
t('frame wraps stage', () => {
  const { stage, frame } = fixture();
  ok(frame.classList.contains('stim-frame'), 'no stim-frame');
  ok(frame.querySelector(':scope > .stim-ui') && stage.nextElementSibling?.classList.contains('stim-ui'), 'layer not beside stage');
});
t('root gets stim2', () => { fixture(); ok(document.documentElement.classList.contains('stim2')); });
t('back block links home', () => {
  const { layer } = fixture();
  const a = layer.querySelector('.s2-back');
  eq(a?.tagName, 'A');
  ok(a.getAttribute('href').endsWith('index.html'), a.getAttribute('href'));
  eq(a.getAttribute('aria-label'), 'Back to Stimming');
});
t('fallback name', () => { const { layer } = fixture(); eq(layer.querySelector('.s2-name').firstChild.textContent, 'bartest'); });
t('applyToy tags', () => {
  const { layer, ui } = fixture();
  ui.applyToy({ name: 'Galaxy', sub: 'Stimming Lab', tier: 'beta' });
  ok(layer.querySelector('.s2-name').textContent.startsWith('Galaxy'));
  eq([...layer.querySelectorAll('.s2-tag')].map(e => e.textContent).join(','), 'LAB,BETA');
});
t('applyToy missing toy', () => {
  const { layer, ui } = fixture();
  ui.applyToy(undefined);
  eq(layer.querySelector('.s2-name').firstChild.textContent, 'bartest');
  eq(layer.querySelectorAll('.s2-tag').length, 0);
});
t('cluster order', () => {
  const { layer, ui } = fixture({ settings: [{ type: 'toggle', id: 'x', label: 'X', value: false }], keys: [['click', 'place']] });
  const names = () => [...layer.querySelector('.s2-tr').children].map(e => e.className.split(' ')[0]);
  eq(names().join(','), 'snd,s2-set,s2-info');
  ui.applyToy({ legacy: true });
  eq(names().join(','), 'ver,snd,s2-set,s2-info');
});
t('empty slot draws nothing', () => {
  const { layer } = fixture();
  ['.s2-bl', '.s2-br'].forEach(s => { const el = layer.querySelector(s); eq(el.children.length, 0); ok(!shown(el), `${s} shown`); });
});
t('hideControls', () => {
  const { layer, ui } = fixture({ settings: [{ type: 'toggle', id: 'x', label: 'X', value: false }], keys: [['click', 'place']], quality: true });
  ui.hideControls();
  const visible = [...layer.querySelectorAll('.s2-back, .s2-name, .snd, .s2-set, .s2-info, .s2-keys, .s2-bl, .s2-br')].filter(shown).map(e => e.className.split(' ')[0]);
  eq(visible.join(','), 's2-back,s2-name');
});

/* ---------- Task 2: choice ---------- */
const opts = n => Array.from({ length: n }, (_, i) => ({ value: `o${i}`, label: `Opt ${i}` }));
const spy = () => { const f = (...a) => { f.calls.push(a); }; f.calls = []; return f; };
t('auto segments', () => {
  const { layer } = fixture({ choice: { label: 'Palette', value: 'o1', options: opts(3), onPick: spy() } });
  const seg = layer.querySelector('.s2-tl .s2-seg');
  ok(seg, 'no segments');
  eq(seg.querySelectorAll('.s2-chip').length, 3);
  eq(seg.querySelectorAll('[aria-pressed="true"]').length, 1);
  eq(seg.querySelector('[aria-pressed="true"]').dataset.value, 'o1');
});
t('auto stepper', () => {
  const onPick = spy();
  const { layer, ui } = fixture({ choice: { label: 'Kind', value: 'o4', options: opts(6), onPick } });
  const step = layer.querySelector('.s2-tl .s2-step');
  ok(step, 'no stepper');
  eq(step.querySelector('.s2-step-now').textContent, 'Opt 4');
  click(step.querySelector('.s2-step-next'));
  eq(step.querySelector('.s2-step-now').textContent, 'Opt 5');
  click(step.querySelector('.s2-step-next'));
  eq(ui.choice.value, 'o0');
  eq(onPick.calls.length, 2);
});
t('arrow keys step', () => {
  const onPick = spy();
  const { layer } = fixture({ choice: { label: 'P', value: 'o0', options: opts(3), onPick } });
  const first = layer.querySelector('.s2-seg .s2-chip');
  first.focus();
  key('ArrowRight', {}, first);
  eq(onPick.calls.length, 1);
  eq(onPick.calls[0][0], 'o1');
  eq(document.activeElement.dataset.value, 'o1');
});
t('tray', () => {
  const onPick = spy();
  const icon = '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/></svg>';
  const { layer } = fixture({ choice: { label: 'Add', display: 'tray', value: 'star', onPick,
    options: [{ value: 'star', label: 'Star', icon }, { value: 'binary', label: 'Binary', icon }] } });
  const chip = layer.querySelector('.s2-tl .s2-tray');
  eq(chip.textContent.trim(), '+ Star');
  click(chip);
  const sheet = layer.querySelector('.s2-sheet');
  ok(shown(sheet), 'sheet not open');
  eq(chip.getAttribute('aria-expanded'), 'true');
  const b = sheet.querySelector('[aria-label="Binary"]');
  ok(b?.querySelector('svg'), 'no icon button');
  click(b);
  eq(chip.textContent.trim(), '+ Binary');
  ok(!shown(sheet), 'sheet still open');
  eq(onPick.calls.length, 1);
  eq(onPick.calls[0][0], 'binary');
});
t('set does not fire', () => {
  const onPick = spy();
  const { layer, ui } = fixture({ choice: { label: 'P', value: 'o0', options: opts(3), onPick } });
  ui.choice.set('o2');
  eq(ui.choice.value, 'o2');
  eq(layer.querySelector('.s2-seg [aria-pressed="true"]').dataset.value, 'o2');
  eq(onPick.calls.length, 0);
  ui.choice.set('o1', true);
  eq(onPick.calls.length, 1);
});
t('choice disabled', () => {
  const onPick = spy();
  const { layer, ui } = fixture({ choice: { label: 'P', value: 'o0', options: opts(3), onPick } });
  ui.choice.disabled = true;
  click(layer.querySelectorAll('.s2-seg .s2-chip')[2]);
  eq(ui.choice.value, 'o0');
  eq(onPick.calls.length, 0);
  eq(layer.querySelector('.s2-seg').getAttribute('aria-disabled'), 'true');
});
t('palette dot', () => {
  const { layer } = fixture({ choice: { label: 'P', value: 'a', options: [{ value: 'a', label: 'Ember', dot: 'rgb(255, 0, 0)' }, { value: 'b', label: 'Sea' }] } });
  eq(getComputedStyle(layer.querySelector('.s2-dot')).backgroundColor, 'rgb(255, 0, 0)');
});
t('option key', () => {
  const onPick = spy();
  const { ui } = fixture({ choice: { label: 'P', value: 'a', onPick, options: [{ value: 'a', label: 'A' }, { value: 'b', label: 'B', key: '7' }] } });
  key('7');
  eq(ui.choice.value, 'b');
  eq(onPick.calls.length, 1);
});

/* ---------- Task 3: actions, slider, keys ---------- */
const warns = fn => { const w = console.warn, got = []; console.warn = (...a) => got.push(a); try { fn(); } finally { console.warn = w; } return got; };
t('action labels', () => {
  const { layer } = fixture({ actions: [{ verb: 'add', noun: 'Star', onPress() {} }, { verb: 'shuffle', onPress() {} }, { verb: 'clear', onPress() {} }] });
  const chips = [...layer.querySelectorAll('.s2-bl .s2-chip')];
  eq(chips.map(c => c.querySelector('.s2-label').textContent).join(','), '+ Star,Shuffle,Clear');
  ok(chips[1].querySelector('svg'), 'no die icon');
});
t('own verb label', () => {
  const { layer } = fixture({ actions: [{ verb: 'flip', onPress() {} }, { verb: 'blow', label: 'Puff', onPress() {} }] });
  eq([...layer.querySelectorAll('.s2-bl .s2-label')].map(c => c.textContent).join(','), 'Flip,Puff');
});
t('action press', () => {
  const onPress = spy();
  const { layer, ui } = fixture({ actions: [{ verb: 'clear', onPress }] });
  const b = layer.querySelector('.s2-bl .s2-chip');
  click(b);
  eq(onPress.calls.length, 1);
  ui.action('clear').disabled = true;
  click(b);
  eq(onPress.calls.length, 1);
  eq(b.getAttribute('aria-disabled'), 'true');
});
t('action key', () => {
  const onPress = spy();
  const { layer } = fixture({ actions: [{ verb: 'drip', key: 'J', onPress }] });
  key('j');
  key('J');
  eq(onPress.calls.length, 2);
  eq(layer.querySelector('.s2-bl .s2-chip kbd')?.textContent, 'J');
});
t('keys ignore modifiers', () => {
  const onPress = spy();
  fixture({ actions: [{ verb: 'blow', key: 'K', onPress }] });
  key('k', { metaKey: true });
  key('k', { ctrlKey: true });
  key('k', { altKey: true });
  eq(onPress.calls.length, 0);
});
t('keys ignore fields', () => {
  const onPress = spy();
  const { layer } = fixture({ actions: [{ verb: 'ping', key: 'L', onPress }],
    choice: { label: 'Add', display: 'tray', value: 'a', options: [{ value: 'a', label: 'A' }, { value: 'b', label: 'B' }] } });
  const field = document.body.appendChild(document.createElement('input'));
  key('l', {}, field);
  field.remove();
  click(layer.querySelector('.s2-tray'));
  const inSheet = layer.querySelector('.s2-sheet .s2-chip');
  ok(shown(inSheet), 'tray sheet not open');
  key('l', {}, inSheet);
  key('Escape', {}, inSheet);
  eq(onPress.calls.length, 0);
  key('l');
  eq(onPress.calls.length, 1);
});
t('slider', () => {
  const onInput = spy();
  const { layer, ui } = fixture({ slider: { label: 'Gravity', min: 0.3, max: 1.2, step: 0.05, value: 0.3, onInput } });
  const sl = layer.querySelector('.s2-br .s2-slider');
  eq(sl.textContent.trim(), 'Gravity');
  const input = sl.querySelector('input[type="range"]');
  input.value = '0.6';
  input.dispatchEvent(new Event('input', { bubbles: true }));
  eq(onInput.calls.length, 1);
  eq(onInput.calls[0][0], 0.6);
  ui.slider.set(0.9);
  eq(input.value, '0.9');
  eq(ui.slider.value, 0.9);
  eq(onInput.calls.length, 1);
});
t('limits warn', () => {
  const got = warns(() => fixture({ actions: ['a', 'b', 'c', 'd'].map(v => ({ verb: v, onPress() {} })) }));
  eq(got.length, 1);
  const got2 = warns(() => fixture({ actions: [{ verb: 'clear', onPress() {} }, { verb: 'reset', onPress() {} }] }));
  eq(got2.length, 1);
});

/* ---------- run ---------- */
let pass = 0;
for (const [name, fn] of queue) {
  try { await fn(); pass++; out.textContent += `PASS ${name}\n`; }
  catch (err) { out.textContent += `FAIL ${name}: ${err.message}\n`; console.error(name, err); }
}
out.textContent += `DONE ${pass}/${queue.length}\n`;
try { Object.keys(localStorage).filter(k => k.startsWith('stimming.bartest.')).forEach(k => localStorage.removeItem(k)); } catch (err) { /* storage is optional */ }
</script>
</body>
</html>
