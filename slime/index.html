<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}/* The how-to line is as quiet as the home link. */
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 28px; }
.how {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin: 0 0 0 auto;
  font-size: 13px; color: var(--muted);
}
.how div { display: flex; align-items: baseline; gap: 6px; }
.how dt { font-weight: 600; }
.how dd { margin: 0; }
.how kbd {
  font: inherit; font-size: 12px; line-height: 1; padding: 2px 6px 3px;
  border: 1px solid var(--line); border-radius: 5px;
}
/* Touch screens hide keys and hover; mice hide touch gestures. */
@media (hover: none) { .how .fine { display: none; } }
@media (hover: hover) { .how .touch { display: none; } }
@media (max-width: 640px) { .how { margin-left: 0; } }
</style>
<title>Slime</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600&display=swap">
<style>
/* Layout: header row, the slime panel at full width, one control row. */
:root {
  --bg: oklch(0.16 0.012 275);
  --surface: oklch(0.195 0.014 275);
  --line: oklch(0.29 0.016 275);
  --fg: oklch(0.94 0.008 275);
  --muted: oklch(0.64 0.02 275);
  --focus: oklch(0.84 0.13 205);
  --pick: oklch(0.7 0.18 320 / 0.35);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
::selection { background: var(--pick); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: clamp(20px, 3.4vw, 40px); }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.home { font-size: 14px; color: var(--muted); text-decoration: none; border-radius: 4px; transition: color 0.2s ease; }
.home:hover { color: var(--fg); }
.tools { display: flex; align-items: center; gap: 8px; }
/* The sound toggle sits as quietly as the home link. */
.snd {
  display: grid; place-items: center; width: 28px; height: 28px; margin-block: -4px; padding: 0;
  color: var(--muted); background: none; border: 0; border-radius: 6px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: color 0.2s ease;
}
.snd:hover { color: var(--fg); }
.snd svg {
  width: 18px; height: 18px; fill: none; stroke: currentColor;
  stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
}
.snd[aria-pressed="true"] .off, .snd[aria-pressed="false"] .on { display: none; }
@media (pointer: coarse) { .snd { width: 40px; height: 40px; margin-block: -10px; } }
main { display: grid; gap: 14px; min-width: 0; }
/* 16:9 panel, 4:5 on phones, capped on short screens. */
.slime {
  position: relative; width: 100%; aspect-ratio: 16 / 9; min-height: 300px;
  max-height: max(300px, calc(100vh - 170px)); max-height: max(300px, calc(100svh - 170px));
  border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--surface);
  touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
}
@media (max-width: 640px) { .slime { aspect-ratio: 4 / 5; } }
.slime.edge { cursor: grab; }
.slime.body { cursor: pointer; }
.slime.drag { cursor: grabbing; }
.slime canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.slime canvas.on { opacity: 1; }
.fail {
  position: absolute; inset: 0; margin: 0; padding: 16px; display: grid; place-items: center; text-align: center;
  font-size: 15px; color: var(--muted);
}
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; cursor: pointer;
  font: inherit; font-size: 13px; color: var(--muted);
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.2s ease, border-color 0.2s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.chip:hover { color: var(--fg); border-color: var(--muted); }
.chip:active { transform: scale(0.94); transition-duration: 0.08s; }
@media (pointer: coarse) { .chip { padding: 10px 16px; } }
@media (prefers-reduced-motion: reduce) { .chip, .home, .snd, .slime canvas { transition: none; } }
</style>

<body>
<div class="wrap">
  <header>
    <h1>Slime</h1>
    <div class="tools">
      <button class="snd" id="snd" type="button" aria-label="Sound" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 8h2.6l3.9-3.2v10.4L5.6 12H3z"/>
          <path class="on" d="M12.8 8.1a3 3 0 0 1 0 3.8M15.1 6.1a6 6 0 0 1 0 7.8"/>
          <path class="off" d="M13.2 8l4 4M17.2 8l-4 4"/>
        </svg>
      </button>
      <a class="home" href="../index.html">Stimming</a>
    </div>
  </header>
  <main>
    <div class="slime" id="slime" tabindex="0" role="application" aria-label="Slime. Press to squish, drag from the edge to stretch. Arrow keys nudge it; Space squishes it.">
      <p class="fail" hidden>The slime needs WebGL 2.</p>
    </div>
    <div class="foot">
      <div class="ctl">
        <button class="chip" id="reset" type="button">Reset</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Press</dt><dd>squish</dd></div>
        <div><dt>Drag the edge</dt><dd>stretch</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>squish</dd></div>
        <div class="fine"><dt><kbd>Arrows</kbd></dt><dd>nudge</dd></div>
      </dl>
    </div>
  </main>
</div>

<script>
(() => {
'use strict';
const D2R = Math.PI / 180, SQ3 = Math.sqrt(3);
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;

const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; });

/* ---------- the putty: particles held together by springy bonds ---------- */
// Lengths are in panel units: the panel's shorter side is 1.
const N = 61, D = 0.05, KR = 2.4 * D, ISO = 0.6;
const GRAV = 10, FLOOR = 0.5 * D, WALL = 0.5 * D, DMIN = 0.74 * D;
// Bonds are stiff.
// The seam around a grabbed chunk gives first.
const BOND_C = 1.2e-4, FAR_C = 2, SEAM = 150, BREAK = 2.6 * D;
const STRAND_C = 5e-3, SNAP = 0.62, RETRACT = 0.35, ROPE = 8;
const TENSION = 30, CRAWL = 0.26, GRIP = 2, STICK = 14;
let Wd = 16 / 9, Hd = 1, simT = 0;

const P = Array.from({ length: N }, () => ({
  x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, ax: 0, ay: 0, crawl: 0, fall: 0,
  seed: 0, nb: 0, hx: 0, hy: 0, flowAt: 0, air: false, drip: false, land: 0, cool: 0, hold: 0,
}));
// Home is a round patch: a centre and four rings, innermost first.
// Each ring rests on a flat pair, never on one point.
const HEX = [[0, 0]];
for (let k = 1; k <= 4; k++) for (let j = 0; j < 6 * k; j++) {
  const a = ((j + 0.5 * (1 - (k & 1))) / (6 * k)) * 2 * Math.PI;
  // Rest shape already sags: wider, with a flatter underside.
  const y = k * D * Math.sin(a);
  HEX.push([1.12 * k * D * Math.cos(a), y * (y < 0 ? 0.78 : 0.95)]);
}
const LOW = Math.min(...HEX.map(p => p[1]));
const HEX_BONDS = [];
for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
  const l = Math.hypot(HEX[i][0] - HEX[j][0], HEX[i][1] - HEX[j][1]);
  // Second-ring bonds give shear stiffness, so the sagging blob never buckles.
  if (l < 2.1 * D) HEX_BONDS.push([i, j, l]);
}
const homeOf = k => [Wd / 2 + HEX[k][0], FLOOR - LOW + HEX[k][1]];
// Colour seeds swirl in soft bands through the putty.
HEX.forEach(([x, y], i) => { P[i].seed = Math.sin((x / D) * 0.62 + 1.4 * Math.sin((y / D) * 0.33 + 0.8)); });

const adj = new Uint8Array(N * N);
let bonds = [];
const nbrs = Array.from({ length: N }, () => []);
// Each bond remembers its natural length and returns to it.
// Only near bonds count toward a particle's six.
function link(i, j, L) {
  if (i === j || adj[i * N + j]) return;
  const far = L > 1.4 * D;
  adj[i * N + j] = adj[j * N + i] = 1;
  if (!far) { P[i].nb++; P[j].nb++; }
  bonds.push({ i, j, L, N: L, far, c: far ? FAR_C : 1, soft: 1 });
}
// Removing swaps the last bond in, so callers walk backwards.
function unlink(k) {
  const b = bonds[k];
  adj[b.i * N + b.j] = adj[b.j * N + b.i] = 0;
  if (!b.far) { P[b.i].nb--; P[b.j].nb--; }
  bonds[k] = bonds[bonds.length - 1];
  bonds.pop();
}
function clearBonds() { bonds = []; adj.fill(0); for (const p of P) p.nb = 0; }

// Pointers, dents, strands and recoiling strand ends.
const ptrs = new Map(), dents = [], stubs = [], events = [];
let strands = [], gather = null;
const owner = new Int16Array(N);
const emit = (type, a = 0, b = 0) => events.push([type, a, b]);

function place(lift) {
  clearBonds();
  P.forEach((p, k) => {
    const [x, y] = homeOf(k);
    p.x = p.px = x; p.y = p.py = y + lift; p.vx = p.vy = 0;
    p.air = lift > 0; p.drip = false;
  });
  for (const [i, j, l] of HEX_BONDS) link(i, j, l);
  group();
}

/* ---------- connected pieces ---------- */
const root = new Int16Array(N), compOf = new Int16Array(N), prevOf = new Int16Array(N);
let comps = [], main = null, prevSize = [];
function find(i) { while (root[i] !== i) i = root[i] = root[root[i]]; return i; }
function group() {
  for (let i = 0; i < N; i++) root[i] = i;
  for (const b of bonds) { const a = find(b.i), c = find(b.j); if (a !== c) root[a] = c; }
  const at = new Map();
  comps = [];
  for (let i = 0; i < N; i++) {
    const r = find(i);
    let c = at.get(r);
    if (!c) { c = { k: comps.length, ids: [], cx: 0, cy: 0, held: false, tied: false }; at.set(r, c); comps.push(c); }
    compOf[i] = c.k;
    c.ids.push(i); c.cx += P[i].x; c.cy += P[i].y;
  }
  main = comps[0];
  for (const c of comps) {
    c.cx /= c.ids.length; c.cy /= c.ids.length;
    if (c.ids.length > main.ids.length) main = c;
  }
  for (const g of ptrs.values()) if (g.mode === 'grab' && g.chunk.length) comps[compOf[g.chunk[0]]].held = true;
  for (const S of strands) comps[compOf[S.a]].tied = comps[compOf[S.b]].tied = true;
}
// A piece of three or more rejoining another makes a plop.
function merges() {
  for (const c of comps) {
    const seen = new Set(), sizes = [];
    for (const i of c.ids) {
      const o = prevOf[i];
      if (!seen.has(o)) { seen.add(o); sizes.push(prevSize[o] || 1); }
    }
    if (sizes.length < 2) continue;
    sizes.sort((x, y) => y - x);
    if (sizes[1] < 3) continue;
    emit('plop', sizes[1]);
    // After the plop, the joined piece slowly flows round again.
    for (const i of c.ids) P[i].flowAt = simT + 0.5;
  }
}
// Re-mesh a piece onto a round patch of the home lattice.
// Rest lengths start where they are and relax, so it flows.
const RINGS = [[0], ...[1, 2, 3, 4].map(k => Array.from({ length: 6 * k }, (_, j) => 3 * k * (k - 1) + 1 + j))];
const angle = k => Math.atan2(HEX[k][1], HEX[k][0]);
function remesh(c) {
  const n = c.ids.length;
  // Whitening maps a long piece onto a round one, keeping neighbours together.
  let xx = 0, yy = 0, xy = 0;
  for (const i of c.ids) { const dx = P[i].x - c.cx, dy = P[i].y - c.cy; xx += dx * dx; yy += dy * dy; xy += dx * dy; }
  const tr = (xx + yy) / 2, det = Math.sqrt(Math.max(0, ((xx - yy) / 2) ** 2 + xy * xy)), l1 = tr + det, l2 = Math.max(tr - det, 1e-12);
  const th = 0.5 * Math.atan2(2 * xy, xx - yy), co = Math.cos(th), si = Math.sin(th);
  const items = c.ids.map(i => {
    const dx = P[i].x - c.cx, dy = P[i].y - c.cy, u = (dx * co + dy * si) / Math.sqrt(l1), v = (-dx * si + dy * co) / Math.sqrt(l2);
    return { i, r: u * u + v * v, a: Math.atan2(u * si + v * co, u * co - v * si) };
  }).sort((p, q) => p.r - q.r);
  // Inner rings fill first.
  // The outer ring takes evenly spaced slots.
  const pairs = [];
  let at = 0;
  for (const ring of RINGS) {
    const m = Math.min(ring.length, n - at);
    if (m <= 0) break;
    const slots = Array.from({ length: m }, (_, j) => ring[Math.floor((j * ring.length) / m)]).sort((p, q) => angle(p) - angle(q));
    const group = items.slice(at, at + m).sort((p, q) => p.a - q.a);
    slots.forEach((k, j) => pairs.push([k, group[j].i]));
    at += m;
  }
  const map = new Map(pairs);
  const ids = new Set(c.ids);
  for (let k = bonds.length - 1; k >= 0; k--) if (ids.has(bonds[k].i)) unlink(k);
  for (const [i, j, l] of HEX_BONDS) {
    const a = map.get(i), b = map.get(j);
    if (a === undefined || b === undefined) continue;
    link(a, b, l);
    bonds[bonds.length - 1].L = Math.max(l, Math.hypot(P[a].x - P[b].x, P[a].y - P[b].y));
  }
}

/* ---------- one frame of physics ---------- */
function step(dt) {
  // A frame stamped before the wake-up moves nothing.
  if (!(dt > 0)) return;
  simT += dt;
  prepare(dt);
  const n = Math.max(4, Math.ceil(dt * 600)), h = dt / n;
  for (let s = 0; s < n; s++) sub(h);
  settle(dt);
}

function prepare(dt) {
  for (const p of P) { p.ax = 0; p.ay = 0; p.crawl = 0; p.hold = 0; }
  for (const l of nbrs) l.length = 0;
  for (const b of bonds) { b.soft = 1; if (!b.far) { nbrs[b.i].push(b.j); nbrs[b.j].push(b.i); } }
  // Held chunks shrink a little, like putty pinched between fingers.
  let id = 0;
  for (const g of ptrs.values()) {
    id++;
    if (g.mode !== 'grab') continue;
    g.shrink = Math.max(0.72, g.shrink - dt * 0.3);
    for (const i of g.chunk) P[i].hold = id;
    if (!g.strand) for (const b of bonds) if (P[b.i].hold !== P[b.j].hold && (P[b.i].hold === id || P[b.j].hold === id)) b.soft = SEAM;
  }
  for (const S of strands) {
    S.pa = [S.a, ...nbrs[S.a]];
    S.pb = [S.b, ...nbrs[S.b]];
  }
  // Dents spring toward their depth.
  // Holding turns a poke into a squish.
  for (let k = dents.length - 1; k >= 0; k--) {
    const d = dents[k];
    if (d.until && simT > d.until) release(d);
    const age = simT - d.t0;
    if (d.held && age > 0.14) d.sq = Math.min(1, d.sq + dt * 4);
    const tgt = d.held ? (age > 0.14 ? clamp(0.35 + (age - 0.14) * 1.5, 0, 1) : 0.35) : 0;
    const kk = reduce ? 140 : 260, c = 2 * (reduce ? 0.95 : 0.3) * Math.sqrt(kk);
    d.v += (kk * (tgt - d.p) - c * d.v) * dt;
    d.p += d.v * dt;
    if (!d.held && Math.abs(d.p) < 0.004 && Math.abs(d.v) < 0.03) dents.splice(k, 1);
  }
  if (gather) return;
  // Putty clings to the floor it rests on.
  for (const p of P) {
    const u = (p.y - FLOOR) / (0.6 * D);
    if (u < 1) p.ay -= STICK * (1 - u);
  }
  // Surface tension draws stray putty toward each piece's middle.
  for (const c of comps) {
    const n = c.ids.length;
    if (n < 3) continue;
    const rn = D * Math.sqrt((n * SQ3) / (2 * Math.PI)) * 1.08;
    let sx = 0, sy = 0;
    for (const i of c.ids) {
      const p = P[i], dx = c.cx - p.x, dy = c.cy - p.y, r = Math.hypot(dx, dy);
      if (r > rn) { const a = (TENSION * (r - rn)) / r; p.ax += dx * a; p.ay += dy * a; sx += dx * a; sy += dy * a; }
    }
    // The pull nets to zero, so a piece never propels itself.
    for (const i of c.ids) { P[i].ax -= sx / n; P[i].ay -= sy / n; }
  }
  // Putty does not roll: each piece's spin bleeds away.
  const spin = 1 - Math.exp(-(reduce ? 14 : 8) * dt);
  for (const c of comps) {
    if (c.ids.length < 6 || c.held) continue;
    let L = 0, I = 0, vx = 0, vy = 0;
    for (const i of c.ids) { vx += P[i].vx; vy += P[i].vy; }
    vx /= c.ids.length; vy /= c.ids.length;
    for (const i of c.ids) {
      const p = P[i], rx = p.x - c.cx, ry = p.y - c.cy;
      L += rx * (p.vy - vy) - ry * (p.vx - vx); I += rx * rx + ry * ry;
    }
    const w = (L / (I || 1)) * spin;
    for (const i of c.ids) { const p = P[i]; p.vx += w * (p.y - c.cy); p.vy -= w * (p.x - c.cx); }
  }
  // Loose pieces on the floor inch back toward the main blob.
  // A big loose piece draws the main blob toward it too.
  let other = null;
  for (const c of comps) if (c !== main && (!other || c.ids.length > other.ids.length)) other = c;
  for (const c of comps) {
    const towards = c === main ? other : main;
    if (!towards || c.held || c.tied || (c === main && towards.ids.length < 0.35 * main.ids.length)) continue;
    let land = 0;
    for (const i of c.ids) land = Math.max(land, P[i].land);
    if (land < 0.5) continue;
    const dir = Math.sign(towards.cx - c.cx) || 1, k = c === main ? towards.ids.length / c.ids.length : 1;
    const v = CRAWL * k * (reduce ? 0.6 : 1) * (0.5 + 0.5 * Math.sin(simT * 6.5 + c.ids[0]));
    for (const i of c.ids) P[i].crawl = dir * v;
  }
}

// Solving alternates direction each substep, so no side is favoured.
let flip = false;
const CX = new Float64Array(N), CY = new Float64Array(N);
function sub(h) {
  flip = !flip;
  const damp = Math.exp(-(reduce ? 3 : 1.5) * h), grav = gather ? 0 : GRAV;
  for (const p of P) {
    p.vx = p.vx * damp + p.ax * h;
    p.vy = p.vy * damp + (p.ay - grav) * h;
    p.px = p.x; p.py = p.y;
    p.x += (p.vx + p.crawl) * h; p.y += p.vy * h;
  }
  if (gather) {
    const s = 1 - Math.exp(-gather.k * h);
    for (const p of P) { p.x += (p.hx - p.x) * s; p.y += (p.hy - p.y) * s; }
  } else {
    // Each bond pulls toward its rest length (XPBD, one pass per substep).
    const at = BOND_C / (h * h), nb = bonds.length;
    for (let m = 0; m < nb; m++) {
      const b = bonds[flip ? m : nb - 1 - m], A = P[b.i], B = P[b.j];
      let dx = A.x - B.x, dy = A.y - B.y;
      const l = Math.hypot(dx, dy) || 1e-9, k = (b.L - l) / (2 + at * b.c * b.soft);
      dx /= l; dy /= l;
      A.x += dx * k; A.y += dy * k; B.x -= dx * k; B.y -= dy * k;
    }
    for (const S of strands) pull(S, h);
    for (const g of ptrs.values()) if (g.mode === 'grab') drive(g, h);
    for (const d of dents) if (d.p > 0.01) press(d);
    // No two particles overlap.
    // Pushes are summed first, so order never matters.
    CX.fill(0); CY.fill(0);
    for (let i = 0; i < N; i++) {
      const A = P[i];
      for (let j = i + 1; j < N; j++) {
        const B = P[j], dx = B.x - A.x, dy = B.y - A.y, r2 = dx * dx + dy * dy;
        if (r2 >= DMIN * DMIN || r2 < 1e-14) continue;
        const r = Math.sqrt(r2), m = (0.5 * (DMIN - r)) / r;
        CX[i] -= dx * m; CY[i] -= dy * m; CX[j] += dx * m; CY[j] += dy * m;
      }
    }

function wake() {
  still = 0;
  if (!raf && ready && onScreen && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(ms) {
  raf = 0;
  const dt = clamp((ms - last) / 1000, 0, 1 / 30);
  last = ms;
  // Reduced motion runs the putty a little slower.
  step(dt * (reduce ? 0.8 : 1));
  // Should the numbers ever break, the putty starts over rather than vanish.
  if (P.some(p => !Number.isFinite(p.x + p.y + p.vx + p.vy))) { for (const g of ptrs.values()) letGo(g); strands = []; stubs.length = 0; dents.length = 0; gather = null; place(0.05); }
  voice();
  creak(strain());
  draw();
  still = moving() ? 0 : still + 1;
  if (still < 20 && onScreen && !document.hidden) { raf = requestAnimationFrame(frame); return; }
  // At rest every particle stops dead, so nothing drifts.
  for (const p of P) { p.vx = 0; p.vy = 0; }
  creakStop();
  rest();
}
// Stretch speed drives the creak.
function strain() {
  let s = 0;
  for (const S of strands) if (S.holders.some(g => g.mode === 'grab')) s += Math.abs(S.speed);
  for (const g of ptrs.values()) if (g.mode === 'grab' && !g.strand && g.seam > 1.1) s += g.spd * clamp((g.seam - 1.1) / 0.6);
  return s;
}
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(panel);
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

/* ---------- input ---------- */
const world = e => {
  const r = panel.getBoundingClientRect();
  return { x: (e.clientX - r.left - panel.clientLeft) / UNIT, y: (H - (e.clientY - r.top - panel.clientTop)) / UNIT };
};
function cursor(kind) {
  panel.classList.toggle('edge', kind === 'edge');
  panel.classList.toggle('body', kind === 'body');
  panel.classList.toggle('drag', kind === 'drag');
}

panel.addEventListener('pointerdown', e => {
  if (!ready || gather || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const q = world(e), z = zone(q.x, q.y), g = { mode: 'none', x: q.x, y: q.y, sx: q.x, sy: q.y, t0: performance.now(), t: e.timeStamp, spd: 0, dent: null };
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  ptrs.set(e.pointerId, g);
  if (z.kind === 'body') {
    g.mode = 'press';
    g.dent = dentAt(q.x, q.y, true);
    squish(1);
  } else if (z.kind === 'edge') {
    grab(g, q.x, q.y, z.q.near);
    squish(0.6);
    cursor('drag');
  }
  wake();
});
panel.addEventListener('pointermove', e => {
  const q = world(e), g = ptrs.get(e.pointerId);
  if (!g) {
    if (e.pointerType === 'mouse' && ready && !gather) cursor(zone(q.x, q.y).kind);
    return;
  }
  // Hand speed comes from event timestamps, not frames.
  const dts = (e.timeStamp - g.t) / 1000;
  if (dts > 0) g.spd += (Math.hypot(q.x - g.x, q.y - g.y) / dts - g.spd) * Math.min(1, dts * 20);
  g.t = e.timeStamp;
  g.x = q.x; g.y = q.y;
  if (g.mode === 'press' && g.dent) {
    g.dent.x = q.x; g.dent.y = q.y;
    // Dragging a press out past the edge pulls a strand.
    if (probe(q.x, q.y).f < ISO * 0.9) {
      release(g.dent);
      g.dent = null;
      const z = zone(q.x, q.y);
      if (z.kind !== 'none') { grab(g, q.x, q.y, z.q.near); cursor('drag'); }
      else g.mode = 'none';
    }
  }
  wake();
});
function up(e) {
  const g = ptrs.get(e.pointerId);
  if (!g) return;
  ptrs.delete(e.pointerId);
  const q = world(e), quick = performance.now() - g.t0 < 260 && Math.hypot(q.x - g.sx, q.y - g.sy) < 0.6 * D;
  const wasGrab = g.mode === 'grab' && !g.strand;
  letGo(g);
  // A quick tap at the edge is a poke too.
  if (wasGrab && quick && e.type === 'pointerup') release(dentAt(g.sx, g.sy, true));
  if (!ptrs.size) cursor(e.pointerType === 'mouse' ? zone(q.x, q.y).kind : '');
  wake();
}
panel.addEventListener('pointerup', up);
panel.addEventListener('pointercancel', up);
panel.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !ptrs.has(e.pointerId)) cursor(''); });

// Arrow keys nudge the blob.
// Space squishes it from the top.
let keyDent = null, keyAt = 0;
panel.addEventListener('keydown', e => {
  if (!ready) return;
  if (e.key === ' ') {
    e.preventDefault();
    if (e.repeat || keyDent || gather || !main) return;
    keyDent = dentAt(main.cx, Math.max(...main.ids.map(i => P[i].y)) - 1.4 * D, false);
    squish(1);
    wake();
  } else if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    const now = performance.now();
    if (now - keyAt < 110) return;
    keyAt = now;
    if (e.key === 'ArrowLeft') nudge(-0.8, 0.9);
    else if (e.key === 'ArrowRight') nudge(0.8, 0.9);
    else if (e.key === 'ArrowUp') nudge(0, 1.6);
    else if (main && !gather) {
      const d = dentAt(main.cx, Math.max(...main.ids.map(i => P[i].y)) - 1.4 * D, false);
      d.until = simT + 0.22;
      squish(0.7);
    }
    wake();
  }
});
function keyUp() { if (keyDent) { release(keyDent); keyDent = null; wake(); } }
panel.addEventListener('keyup', e => { if (e.key === ' ') keyUp(); });
panel.addEventListener('blur', keyUp);

document.getElementById('reset').addEventListener('click', () => {
  keyDent = null;
  reset();
  squish(0.5);
  wake();
});
const sndB = document.getElementById('snd');
const showSound = () => sndB.setAttribute('aria-pressed', String(soundOn));
showSound();
sndB.addEventListener('click', () => {
  soundOn = !soundOn;
  showSound();
  try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (err) { /* storage is optional */ }
  if (soundOn) audio();
  else { creakStop(); if (ac) ac.suspend()?.catch(() => {}); }
});

/* ---------- boot ---------- */
layout();
// On arrival the putty drops onto the floor and settles.
place(reduce ? 0 : 0.14);
new ResizeObserver(() => { layout(); wake(); }).observe(panel);
async function boot() {
  await idle();
  try { await startGL(); } catch (err) { failed(err); }
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
})();
</script>
</body>
