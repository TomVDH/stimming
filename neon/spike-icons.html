<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Neon Hum · icon directions</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#17181a;color:#f2f0eb}*{box-sizing:border-box}body{margin:0;padding:clamp(24px,5vw,72px)}header{max-width:760px;margin-bottom:48px}h1{font-size:clamp(32px,5vw,58px);letter-spacing:-.04em;margin:0 0 12px}p{color:#aaa9a4;line-height:1.5;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}.card{background:#222326;padding:24px;border:1px solid #38393c}.card h2{font-size:19px;margin:0 0 8px}.stage{display:flex;align-items:center;justify-content:center;height:260px;background:#17181a;margin:24px 0 16px}.stage svg{width:200px;height:200px;overflow:visible}.pair{display:flex;gap:24px;align-items:center}.pair svg{width:82px;height:82px;flex:none}.pair span{font-size:13px;color:#aaa9a4}svg .tube{fill:none;stroke-linecap:round;stroke-linejoin:round}.glow{filter:url(#glow);opacity:.65}.core{stroke:#fff;stroke-width:1.4}.mono{stroke:#f2f0eb;stroke-width:4}.small{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#aaa9a4}.card p{font-size:14px;min-height:42px}@media(max-width:450px){body{padding:24px 16px}.stage{height:220px}}
</style>
</head>
<body>
<header><div class="small">Neon Hum · icon studies</div><h1>Pick a direction.</h1><p>Three takes on the toy’s starting sign. Each has a matching intro emblem. These are static studies, ready for your eye.</p></header>
<main class="grid" id="cards"></main>
<script>
const shapes={frame:'M55 101H17Q10 101 10 94V34Q10 27 17 27H111Q118 27 118 34V94Q118 101 111 101H73',o:'M24 52Q24 45 30 45H35Q41 45 41 52V76Q41 83 35 83H30Q24 83 24 76Z',p:'M49 83V45H59Q65 45 65 51V57Q65 63 59 63H50',e:'M87 45H73V83H87M73 63H85',n:'M95 83V45L109 83V45',bolt:'M73 10L37 67H59L50 118L93 56H70L85 10'};
const defs='<defs><filter id="glow" x="-80%" y="-100%" width="260%" height="300%"><feGaussianBlur stdDeviation="5"/></filter></defs>';
function paths(keys,colours,mono=false){return keys.map((key,i)=>`<path class="tube ${mono?'mono':''}" d="${shapes[key]}" ${mono?'':`stroke="${colours[i]}" stroke-width="4"`}/>`).join('')}
function sign(keys,colours,mono=false){const lines=paths(keys,colours,mono);return `<svg viewBox="0 0 128 128" aria-hidden="true">${defs}${mono?lines:`<g class="glow">${lines}</g>${lines}<g class="tube core">${keys.map(k=>`<path d="${shapes[k]}"/>`).join('')}</g>`}</svg>`}
const cards=[
{title:'A · The sign',desc:'The OPEN sign as it appears when the toy starts, with its blue tube frame.',keys:['frame','o','p','e','n'],colours:['#6d9cff','#ff70c1','#ffd171','#72ebf0','#ff796c']},
{title:'B · The letters',desc:'The four coloured tubes on their own, with no surrounding frame.',keys:['o','p','e','n'],colours:['#ff70c1','#ffd171','#72ebf0','#ff796c']},
{title:'C · The bolt',desc:'A single bent tube, a compact sign of electricity and neon light.',keys:['bolt'],colours:['#ff70c1']}
];
document.querySelector('#cards').innerHTML=cards.map(c=>`<article class="card"><h2>${c.title}</h2><p>${c.desc}</p><div class="stage">${sign(c.keys,c.colours)}</div><div class="pair">${sign(c.keys,c.colours,true)}<span>Matching intro emblem<br>Same tube paths in monochrome</span></div></article>`).join('');
</script>
</body>
</html>
