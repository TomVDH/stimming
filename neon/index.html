<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Hum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Neon Hum: the wall at full width under the shared header. */
:root { --stage: oklch(0.15 0.02 30); }
.stage { cursor: crosshair; }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
/* The gas rail is one slider of solid swatches, the height of a chip. */
.gas {
  display: inline-flex; align-items: center; padding: 6px 11px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 999px;
  touch-action: none; -webkit-tap-highlight-color: transparent; transition: border-color 0.2s ease;
}
.gas:hover { border-color: var(--muted); }
.stage + .bar:not(.bar--below) .gas {
  background-color: oklch(0.15 0.012 275 / 0.84);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.gas-rail { display: flex; align-items: center; gap: 3px; height: 16px; }
.gas-rail i {
  display: block; width: 8px; height: 8px; border-radius: 2px; background: var(--c);
  transition: height 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
/* The chosen gas stands full height; a hovered one half way. */
.gas-rail i.on { height: 16px; }
.gas-rail i.peek:not(.on) { height: 12px; }
/* Mix shows four hard stripes. */
.gas-rail i.prism { background: linear-gradient(90deg, oklch(0.7 0.22 25), oklch(0.88 0.18 100), oklch(0.82 0.2 150), oklch(0.7 0.16 230), oklch(0.6 0.24 300)); }
.gas-rail i.candy { background: repeating-linear-gradient(135deg, oklch(0.66 0.26 350) 0 2px, oklch(0.96 0.02 350) 2px 4px); }
.gas-rail i.mix { background: linear-gradient(90deg, oklch(0.66 0.22 30) 0 25%, oklch(0.86 0.18 100) 0 50%, oklch(0.8 0.2 150) 0 75%, oklch(0.6 0.2 266) 0); }
@media (pointer: coarse) {
  .gas { padding: 10px 16px; }
  .gas-rail i { width: 11px; }
}
@media (prefers-reduced-motion: reduce) { .stage canvas, .gas-rail i { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true" data-done>
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/neon.svg)"></span><span class="intro-name">Neon Hum</span><span class="intro-sub">Stimming No. 10</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--neon" id="stage" tabindex="0" role="application" aria-label="A wall at night. Drag to bend a neon tube; Shift and drag, or Snap, for straight runs with round corners; click a tube to switch it off or on; double-click a tube for the next gas; click the bare wall to knock on it and shake the tubes. Arrow keys draw, Shift with arrows moves the pen, Space ends a stroke or switches the nearest tube, Backspace undoes, C clears.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Neon Hum needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices">
        <div class="gas" id="gas" tabindex="0" role="slider" aria-label="Gas" aria-valuemin="1" aria-valuemax="13" aria-valuenow="7" aria-valuetext="Blue"><span class="gas-rail" aria-hidden="true"></span></div>
        <button class="chip" id="wall" type="button" aria-label="Wall: Brick">Brick</button>
      </div>
      <div class="actions">
        <button class="chip" id="snap" type="button" aria-pressed="false">Snap</button>
        <button class="chip" id="show" type="button" aria-pressed="false" aria-label="Show: off">Show</button>
        <button class="chip" id="clear" type="button" aria-keyshortcuts="C">Clear</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag</dt><dd>draw a tube</dd></div>
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span> a tube</dt><dd>switch</dd></div>
        <div><dt><span class="fine">Double-click</span><span class="touch">Double-tap</span> a tube</dt><dd>new gas</dd></div>
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span> the wall</dt><dd>knock</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Neon Hum</h1><div class="vignette" hidden></div></section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, sound, audioKit, linFit, css } from '../shared/stim.js';
import { createNoise2D } from 'simplex-noise';
initPage({ id: 'neon' });
const panel = document.getElementById('stage'), canvas = panel.querySelector('canvas');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; motionPref(); dipLater(); wake(); });
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));
const nextFrame = () => new Promise(r => requestAnimationFrame(r));
// The sign strikes as the intro starts to clear.
const curtain = new Promise(res => {
  const el = document.querySelector('.intro');
  if (!el) return res();
  let to = 0;
  const done = () => { mo.disconnect(); clearTimeout(to); setTimeout(res, 250); };
  const mo = new MutationObserver(() => { if (!el.isConnected || el.querySelector('.intro-tick')) done(); });
  mo.observe(document.body, { childList: true, subtree: true });
  to = setTimeout(done, 7000);
});

/* ---------- colour: culori through the shared helpers ---------- */
const scale = (c, k) => c.map(v => v * k);
// Each gas: name, OKLCH, a balance set by eye, and warm-up seconds.
// Pure neon burns red; the rest are argon and coated glass.
// Neon strikes at once; argon starts dim violet and warms up.
const GAS_SPEC = [
  ['Red', 0.63, 0.26, 30, 1.0, 0],
  ['Orange', 0.72, 0.22, 52, 0.85, 0],
  ['Gold', 0.82, 0.18, 82, 0.68, 1.4],
  ['Lemon', 0.9, 0.2, 108, 0.58, 1.5],
  ['Green', 0.84, 0.26, 148, 0.62, 1.8],
  ['Ice', 0.82, 0.15, 205, 0.72, 2.0],
  ['Blue', 0.52, 0.24, 266, 1.35, 2.4],
  ['Violet', 0.56, 0.26, 302, 1.15, 2.2],
  ['Pink', 0.64, 0.29, 350, 1.0, 0],
  ['White', 0.95, 0.035, 80, 0.55, 2.0],
  // Two trick tubes: Prism runs a rainbow, Candy twists stripes.
  ['Prism', 0.85, 0.05, 260, 0.75, 0, 1],
  ['Candy', 0.64, 0.29, 350, 1.0, 0, 2],
];
// Each gas is normalised to full strength, then balanced.
const GAS = GAS_SPEC.map(([, L, C, h, k]) => { const c = linFit(L, C, h), m = Math.max(...c); return c.map(v => (v / m) * k); });
const WARM = GAS_SPEC.map(g => g[5]), FX = GAS_SPEC.map(g => g[6] || 0);
// Cold argon glows a dim violet.
const COLD = (() => { const c = linFit(0.5, 0.22, 292), m = Math.max(...c); return c.map(v => (v / m) * 0.5); })();
const MIX = GAS.length;
// Mix hops between far hues, so neighbours contrast.
const MIX_ORDER = [0, 6, 3, 8, 5, 1, 7, 4, 9, 2];
// Each wall: name, shader kind, relief depth, metal, five colours.
// Give scales how hard a knock shakes the tubes.
const WALLS = [
  { name: 'Brick', kind: 0, depth: 0.14, metal: 0, c: [linFit(0.43, 0.1, 31), linFit(0.37, 0.07, 40), linFit(0.47, 0.1, 42), linFit(0.29, 0.03, 30), linFit(0.57, 0.012, 70)] },
  { name: 'Steel', kind: 1, depth: 0.17, metal: 1, give: 1.3, c: [linFit(0.74, 0.008, 240), linFit(0.47, 0.11, 48), linFit(0.32, 0.07, 36), linFit(0.6, 0.01, 240), [0, 0, 0]] },
  { name: 'Concrete', kind: 2, depth: 0.11, metal: 0, give: 0.7, c: [linFit(0.6, 0.008, 250), linFit(0.56, 0.016, 75), linFit(0.4, 0.012, 235), linFit(0.34, 0.01, 260), [0, 0, 0]] },
  { name: 'Tile', kind: 3, depth: 0.13, metal: 0, sheen: 3.5, c: [linFit(0.9, 0.018, 95), linFit(0.46, 0.1, 160), linFit(0.2, 0.01, 260), linFit(0.5, 0.012, 80), [0, 0, 0]] },
  { name: 'Sequins', kind: 4, depth: 0.5, metal: 1, give: 1.3, c: [linFit(0.66, 0.2, 350), linFit(0.82, 0.15, 85), linFit(0.72, 0.14, 195), linFit(0.16, 0.01, 300), [0, 0, 0]] },
  { name: 'Foam', kind: 5, depth: 0.3, metal: 0, give: 0.2, c: [linFit(0.3, 0.008, 270), linFit(0.5, 0.2, 300), linFit(0.1, 0.01, 280), [0, 0, 0], [0, 0, 0]] },
];
const AMB = scale(linFit(0.62, 0.07, 255), 0.26), KEY = scale(linFit(0.9, 0.03, 245), 0.7);
// The night light comes from the upper left; y points up.
const LAMB = (() => { const v = [-0.35, 0.6, 0.72], n = Math.hypot(...v); return v.map(x => x / n); })();
const LD = (() => { const n = Math.hypot(LAMB[0], LAMB[1]); return [LAMB[0] / n, LAMB[1] / n]; })();

/* ---------- sound: Tone.js voices on the shared audio kit ---------- */
const MAXHUM = 6, POOL = 6, LEAD = 0.004;
// Drawing, switching and clearing keys count as gestures.
const kit = audioKit({ keys: new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Backspace', 'c', 'C']) });
let Tone = null, V = null, building = null, poolAt = 0;
const hums = new Map();
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Tone loads on the first live gesture; the voices follow.
function voices() {
  if (!kit.live()) return null;
  if (!V && !building) {
    building = kit.tone().then(T => {
      building = null;
      if (!T || V) return;
      Tone = T;
      V = build();
      humSync();
    });
  }
  return V;
}
// A gesture starts Tone loading, so the first strike is heard.
['pointerup', 'keydown'].forEach(t => addEventListener(t, () => voices(), { capture: true, passive: true }));
// A small pool of panned voices: noise bursts, falling drops, sine rings.
function build() {
  const pool = Array.from({ length: POOL }, () => {
    const pan = new Tone.Panner(0).connect(kit.out);
    const f = new Tone.Filter({ type: 'bandpass', frequency: 3000, Q: 1 }).connect(pan);
    const n = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.0005, decay: 0.01, sustain: 0, release: 0.002 } }).connect(f);
    const drop = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 0.4, envelope: { attack: 0.002, decay: 0.1, sustain: 0, release: 0.02 } }).connect(pan);
    const ring = new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'sine' }, envelope: { attack: 0.002, decay: 0.2, sustain: 0, release: 0.05 } }).connect(pan);
    ring.maxPolyphony = 6;
    return { pan, f, n, drop, ring };
  });
  return { pool, humBus: new Tone.Gain(1).connect(kit.out) };
}
// The next pool voice, panned to its place on the wall.
function take(x) {
  const v = V.pool[poolAt++ % POOL];
  v.pan.pan.setValueAtTime(clamp(x, -1, 1) * 0.6, kit.ac.currentTime);
  return v;
}
// A noise burst through the voice's filter.
function burst(v, t, type, f, q, g, tau) {
  v.f.type = type;
  v.f.frequency.setValueAtTime(f, t);
  v.f.Q.setValueAtTime(q, t);
  v.n.envelope.decay = tau * 3;
  v.n.triggerAttackRelease(tau * 3, t, clamp(g));
}
// A sine that falls from f0 to f1 and dies away.
function drop(v, t, f0, f1, g, tau) {
  v.drop.octaves = Math.max(0.01, Math.log2(f0 / f1));
  v.drop.pitchDecay = tau * 3;
  v.drop.envelope.decay = tau * 5;
  v.drop.triggerAttackRelease(f1, tau * 5, t, clamp(g));
}
// A steady sine partial with its own decay.
function ring(v, t, f, g, tau) {
  v.ring.set({ envelope: { decay: tau * 4 } });
  v.ring.triggerAttackRelease(f, tau * 4, t, clamp(g));
}
// Ionising gas spits: a few tiny bright ticks.
function crackle(t, k) {
  if (!voices() || kit.ac.currentTime < t.crackAt) return;
  t.crackAt = kit.ac.currentTime + 0.025;
  const v = take(t.pan), t0 = kit.ac.currentTime + LEAD, g = k * jit(0.15);
  for (let n = 2 + ((Math.random() * 4) | 0), i = 0; i < n; i++) {
    burst(v, t0 + i * 0.01 + Math.random() * 0.008, 'bandpass', rand(2200, 6000), 0.8, 0.13 * g * jit(0.3), rand(0.0012, 0.004));
  }
}
// The transformer takes the load with a soft thump.
function thump(t) {
  if (!voices()) return;
  const v = take(t.pan), t0 = kit.ac.currentTime + LEAD, g = jit(0.08);
  drop(v, t0, 92 * jit(0.04), 70, 0.07 * g, 0.05);
  burst(v, t0, 'lowpass', 900, 0.7, 0.03 * g, 0.02);
}
// A switch snaps: a bright tick over a small body.
function click(x, k = 1) {
  if (!voices()) return;
  const v = take(x), t0 = kit.ac.currentTime + LEAD, g = k * jit(0.08);
  burst(v, t0, 'bandpass', 3300 * jit(0.05), 1.3, 0.2 * g, 0.0022);
  ring(v, t0, 1500 * jit(0.04), 0.04 * g, 0.004);
  drop(v, t0 + 0.004, 130 * jit(0.05), 90, 0.06 * g, 0.022);
}
// A knuckle on the wall: each wall answers in its own voice.
function thud(x) {
  if (!voices()) return;
  const v = take(x), t0 = kit.ac.currentTime + LEAD, g = jit(0.1), kind = WALLS[wallNow].kind;
  if (kind === 1) {
    // The steel sheet booms and rings on a few loose partials.
    drop(v, t0, 74 * jit(0.05), 58, 0.16 * g, 0.09);
    for (const [f, k, tau] of [[187, 0.05, 0.16], [433, 0.035, 0.11], [761, 0.022, 0.08], [1290, 0.014, 0.05]]) ring(v, t0 + 0.002, f * jit(0.03), k * g, tau);
    burst(v, t0, 'bandpass', 2400, 0.9, 0.05 * g, 0.012);
  } else if (kind === 3) {
    // Tile gives a bright, hard tock.
    drop(v, t0, 380 * jit(0.05), 300, 0.11 * g, 0.018);
    burst(v, t0, 'bandpass', 3200, 1.4, 0.07 * g, 0.006);
  } else if (kind === 4) {
    // Sequins rattle: a soft thump under a spray of tiny ticks.
    drop(v, t0, 110 * jit(0.05), 70, 0.08 * g, 0.03);
    for (let i = 0; i < 14; i++) burst(v, t0 + i * 0.016 + Math.random() * 0.01, 'highpass', rand(5500, 9000), 0.7, 0.05 * g * jit(0.4), 0.002);
  } else if (kind === 5) {
    // Foam swallows the blow almost whole.
    drop(v, t0, 78 * jit(0.05), 60, 0.05 * g, 0.03);
    burst(v, t0, 'lowpass', 380, 0.7, 0.03 * g, 0.012);
  } else if (kind === 2) {
    // Concrete swallows the blow: a dead, short knock.
    drop(v, t0, 120 * jit(0.05), 64, 0.14 * g, 0.022);
    burst(v, t0, 'lowpass', 1700, 0.8, 0.08 * g, 0.007);
  } else {
    // Brick gives a dull thump with a gritty edge.
    drop(v, t0, 104 * jit(0.05), 66, 0.15 * g, 0.04);
    burst(v, t0, 'bandpass', 900, 0.9, 0.08 * g, 0.014);
  }
}
// Rave beats land on a soft kick.
function kick() {
  if (!voices()) return;
  const v = take(0), t0 = kit.ac.currentTime + LEAD;
  drop(v, t0, 150, 46, 0.18, 0.05);
  burst(v, t0 + RBEAT / 2, 'highpass', 8000, 0.7, 0.03, 0.004);
}
// Thunder rolls in after the flash.
function thunder(delay) {
  if (!voices()) return;
  const v = take(rand(-0.7, 0.7)), t0 = kit.ac.currentTime + delay;
  burst(v, t0, 'lowpass', 170, 0.7, 0.5, 0.5);
  drop(v, t0 + 0.05, 64, 30, 0.3, 0.3);
}
// Each lit tube buzzes: a mains sawtooth through a low filter.
function humVoice(t) {
  const pan = new Tone.Panner(clamp(t.pan, -1, 1) * 0.6).connect(V.humBus);
  const g = new Tone.Gain(0).connect(pan);
  const lp = new Tone.Filter({ type: 'lowpass', frequency: 480 * jit(0.08), Q: 2.4 }).connect(g);
  const g2 = new Tone.Gain(0.22).connect(lp);
  const f = 120 * jit(0.012);
  const o = new Tone.Oscillator(f, 'sawtooth').connect(lp).start();
  const o2 = new Tone.Oscillator(f * 2 * jit(0.003), 'square').connect(g2).start();
  return { o, o2, g2, lp, g, pan, last: 0, hot: -1 };
}
function humStop(v) {
  const t = kit.ac.currentTime;
  v.g.gain.cancelScheduledValues(t);
  v.g.gain.setTargetAtTime(0, t, 0.02);
  v.o.stop(t + 0.25);
  v.o2.stop(t + 0.25);
  setTimeout(() => [v.o, v.o2, v.g2, v.lp, v.g, v.pan].forEach(n => n.dispose()), 500);
}
// Voices follow the most recent lit tubes; the sum is capped.
function humSync() {
  if (!V || !kit.ac) return;
  const lit = [];
  // A chase keeps its voices, so they do not churn each beat.
  for (let i = tubes.length - 1; i >= 0 && lit.length < MAXHUM; i--) if (tubes[i].lvl > 0.01 || tubes[i].seq || (chase && tubes[i].keep)) lit.push(tubes[i]);
  for (const [t, v] of hums) if (!lit.includes(t)) { humStop(v); hums.delete(t); }
  for (const t of lit) if (!hums.has(t)) hums.set(t, humVoice(t));
  const now = kit.ac.currentTime, n = hums.size;
  V.humBus.gain.setTargetAtTime(Math.min(1, 1.6 / Math.sqrt(Math.max(1, n))), now, 0.1);
  for (const [t, v] of hums) {
    const hot = t.seq ? 1 : 0;
    const g = 0.028 * Math.sqrt(clamp(t.len / 420, 0.4, 1.6)) * t.show * (hot ? 2.6 : 1);
    if (Math.abs(g - v.last) > 0.0008) { v.g.gain.setTargetAtTime(g, now, 0.006); v.last = g; }
    if (hot !== v.hot) { v.lp.frequency.setTargetAtTime(hot ? 2600 : 480, now, hot ? 0.01 : 0.15); v.hot = hot; }
  }
}
// Once every tube is dark and still, the context sleeps.
const rest = () => kit.rest(() => !raf && !draft && !tubes.some(t => t.lvl > 0));
function sfx(t, kind, v) {
  if (kind === 1) crackle(t, 0.4 + 0.6 * v);
  else if (kind === 2) { crackle(t, 1); thump(t); }
  else if (kind === 3) click(t.pan);
}

/* ---------- tubes: control points in stage units, centred ---------- */
// Two dozen tubes keep a sign legible and the glow passes cheap.
const MAXT = 24;
let W = 0, H = 0, S = 1, R = 7, ROW = 60, pr = 1, gasNow = 6, mixAt = 0, wallNow = 0, chase = null;
const tubes = [];
// The gas a new tube takes; Mix walks its own order.
const gasPick = () => (gasNow < MIX ? gasNow : MIX_ORDER[mixAt % MIX_ORDER.length]);
let draft = null, staticDirty = true, draftDirty = false;

// Centripetal Catmull-Rom through the control points, sampled densely.
function catmull(P, step) {
  const n = P.length, out = [];
  if (n < 2) return n ? [P[0][0], P[0][1]] : out;
  const ext = (a, b) => [2 * a[0] - b[0], 2 * a[1] - b[1]];
  const k = (a, b) => Math.max(1e-3, Math.sqrt(Math.hypot(b[0] - a[0], b[1] - a[1])));
  for (let i = 0; i < n - 1; i++) {
    const p0 = i ? P[i - 1] : ext(P[0], P[1]), p1 = P[i], p2 = P[i + 1], p3 = i + 2 < n ? P[i + 2] : ext(P[n - 1], P[n - 2]);
    const t1 = k(p0, p1), t2 = t1 + k(p1, p2), t3 = t2 + k(p2, p3);
    const m = Math.max(1, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / step));
    for (let j = 0; j < m; j++) {
      const t = t1 + (t2 - t1) * (j / m);
      for (let c = 0; c < 2; c++) {
        const a1 = ((t1 - t) * p0[c] + t * p1[c]) / t1;
        const a2 = ((t2 - t) * p1[c] + (t - t1) * p2[c]) / (t2 - t1);
        const a3 = ((t3 - t) * p2[c] + (t - t2) * p3[c]) / (t3 - t2);
        const b1 = ((t2 - t) * a1 + t * a2) / t2;
        const b2 = ((t3 - t) * a2 + (t - t1) * a3) / (t3 - t1);
        out.push(((t2 - t) * b1 + (t - t1) * b2) / (t2 - t1));
      }

${NOISE}
const mat2 TURN = mat2(0.8, -0.6, 0.6, 0.8);
float sdBox(vec2 q, vec2 b, float r) { vec2 d = abs(q) - b + r; return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - r; }
// One inside a soft edge at distance w, zero outside.
float band(float d, float w, float aa) { return 1.0 - smoothstep(w - aa, w + aa, d); }

/* Brick: staggered courses in a sunken mortar bed. */
const float BW = 3.15, MORT = 0.12;
void cell(vec2 p, out vec2 id, out vec2 q) {
  float row = floor(p.y);
  float x = p.x + mod(row, 2.0) * 0.5 * BW + (hash12(vec2(row, 3.7)) - 0.5) * 0.24;
  float col = floor(x / BW);
  id = vec2(col, row);
  q = vec2(x - (col + 0.5) * BW, p.y - row - 0.5);
}
// Brick faces stand near one; the mortar sinks near zero.
float brickH(vec2 p, out vec2 id, out float face) {
  vec2 q;
  cell(p, id, q);
  vec2 rn = hash22(id), rm = hash22(id + 17.3);
  vec2 hb = vec2(BW * 0.5, 0.5) - MORT * 0.5 - vec2(rn.x * 0.035, rn.y * 0.02);
  float d = sdBox(q - (rm - 0.5) * vec2(0.04, 0.025), hb, 0.04 + 0.07 * rn.y);
  // Chips and worn corners roughen the outline.
  d += (fbm(p * 4.3 + rn * 31.0) - 0.5) * 0.08;
  face = smoothstep(0.0, 0.1, -d);
  // A turned grid hides the noise lattice.
  vec2 r = TURN * p;
  float tilt = dot(q, (rm - 0.5) * vec2(0.03, 0.09));
  float surf = (fbm(r * 5.0 + rm * 23.0) - 0.5) * 0.1 + (vnoise(r * 16.0) - 0.5) * 0.035;
  float pit = smoothstep(0.78, 0.96, vnoise(r * 11.0 + rn * 7.0));
  float hb2 = 0.78 + 0.16 * rn.x + tilt + surf - 0.1 * pit;
  float hm = 0.1 + (vnoise(r * 26.0) - 0.5) * 0.07 + (vnoise(r * 8.0) - 0.5) * 0.06;
  return mix(hm, hb2, face);
}
void brickMat(vec2 p, out vec3 alb, out float gloss) {
  vec2 id;
  float face;
  brickH(p, id, face);
  float k = hash12(id + 11.3), k2 = hash12(id + 5.1);
  vec3 b = mix(uC0, uC1, smoothstep(0.15, 0.7, k));
  b = mix(b, uC2, step(0.86, k));
  b = mix(b, uC3, step(0.92, k2));
  b *= 0.6 + 0.65 * fbm(p * 2.6 + id * 1.7);
  // Fired clay shows darker flecks.
  b *= 1.0 - 0.35 * smoothstep(0.6, 0.85, vnoise(p * 23.0 + 4.0));
  alb = mix(uC4 * (0.72 + 0.5 * vnoise(p * 17.0)), b, face);
  // Grime gathers in broad patches and runs down in streaks.
  alb *= mix(0.55, 1.05, fbm(p * 0.21 + 3.0)) * (0.85 + 0.25 * vnoise(vec2(p.x * 1.7, p.y * 0.08)));
  gloss = face * smoothstep(0.5, 0.72, fbm(p * 0.33 + 41.0)) * 0.9 + 0.05;
}

/* Corrugated steel: sine ridges, lapped sheets, screws on the rails. */
const float CP = 0.44, SHW = 3.08, SHH = 4.6, PUR = 2.3;
vec2 sheetOf(vec2 p) { return vec2(floor((p.x - 0.5 * CP) / SHW), floor(p.y / SHH)); }
vec2 screwAt(vec2 p) { return vec2(floor(p.x / (2.0 * CP) + 0.5) * 2.0 * CP, (floor(p.y / PUR) + 0.5) * PUR); }
float steelH(vec2 p) {
  vec2 sh = sheetOf(p);
  float c = 0.5 - 0.5 * cos(6.2831853 * p.x / CP);
  // Alternate sheets lie on top, so each lap shows an edge.
  float h = 0.3 + 0.52 * c + 0.05 * mod(sh.x + sh.y, 2.0);
  // Old sheets wave and carry the odd dent.
  vec2 r = TURN * p;
  h += (fbm(r * 0.4 + sh * 7.3) - 0.5) * 0.18;
  h -= 0.22 * smoothstep(0.72, 0.95, vnoise(r * 0.9 + sh * 3.1));
  // A screw and its washer sit in every other trough.
  float d = length(p - screwAt(p));
  h += 0.1 * band(d, 0.085, 0.01) + 5.0 * sqrt(max(0.0, 0.0025 - d * d));
  return h;
}
void steelMat(vec2 p, float h, out vec3 alb, out float gloss) {
  vec2 sh = sheetOf(p);
  // Zinc spangle: flakes of slightly different sheen.
  vec2 g = p * 6.0, gi = floor(g), gf = fract(g);
  float best = 9.0, flake = 0.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 o = vec2(float(i), float(j)), r = o + hash22(gi + o) - gf;
    float d = dot(r, r);
    if (d < best) { best = d; flake = hash12(gi + o + 0.7); }
  }
  vec3 steel = mix(uC0, uC3, hash12(sh + 2.3)) * (0.84 + 0.26 * flake);
  // Rust runs down from some screws and rings others.
  vec2 sc = screwAt(p), dv = p - sc;
  float rs = hash12(sc * 1.7 + 0.3);
  float wob = (vnoise(vec2(p.y * 3.0, sc.x * 9.0)) - 0.5) * 0.08;
  float wd = 0.03 + 0.05 * min(max(-dv.y, 0.0), 1.6);
  float run = band(abs(dv.x + wob), wd, 0.02) * step(dv.y, 0.06) * exp(min(dv.y, 0.0) * mix(3.2, 0.6, rs)) * step(0.4, rs);
  float ring = band(length(dv), 0.11, 0.04) * step(0.25, rs);
  // Water sits on each lap; broad patches bloom here and there.
  float lap = band(mod(p.y, SHH), 0.22, 0.12) * smoothstep(0.4, 0.7, fbm(p * vec2(1.6, 5.0) + 9.0));
  float spot = smoothstep(0.6, 0.8, fbm(p * 0.42 + sh * 5.0 + 17.0));
  float rust = clamp(max(max(run, ring), max(lap, spot)) * (0.55 + 0.7 * fbm(p * 7.0)), 0.0, 1.0);
  alb = mix(steel, mix(uC1, uC2, fbm(p * 9.0 + 3.0)), rust);
  // Grime streaks down the troughs.
  alb *= mix(0.72, 1.0, smoothstep(0.3, 0.7, h)) * (0.82 + 0.3 * vnoise(vec2(p.x * 5.0, p.y * 0.18)));
  // Sheet edges and laps show as dark cuts.
  float ex = abs(fract((p.x - 0.5 * CP) / SHW + 0.5) - 0.5) * SHW;
  float ey = abs(fract(p.y / SHH + 0.5) - 0.5) * SHH;
  alb *= mix(0.3, 1.0, smoothstep(0.0, 0.03, min(ex, ey)));
  gloss = mix(0.5 + 0.4 * flake, 0.07, rust);
}

/* Board-formed concrete: plank prints, fins, tie holes and bugholes. */
const float BH = 1.15, TIE = 3.45, PW = 6.9;
vec2 tieAt(vec2 p) { return (floor(p / TIE) + 0.5) * TIE; }
float concH(vec2 p, out float hole) {
  float b = floor(p.y / BH), fy = fract(p.y / BH);
  // Formwork panels shift every third plank.
  float px = (p.x + floor(b / 3.0) * 2.3) / PW;
  float bs = hash12(vec2(b, floor(px)) + 4.1);
  // Each plank sat a little proud or shy and cupped.
  float h = 0.62 + (bs - 0.5) * 0.1 - 0.035 * sin(fy * 3.14159);
  // Wood grain prints into the face along each plank.
  vec2 w = vec2(p.x * 0.5 + bs * 40.0, p.y * 7.0);
  w.y += (fbm(vec2(p.x * 0.3, b) + bs * 9.0) - 0.5) * 2.4;
  h += (fbm(w) - 0.5) * 0.12 + (vnoise(vec2(p.x * 2.0, p.y * 26.0) + bs * 3.0) - 0.5) * 0.05;
  // Grout leaks through each joint into a thin fin.
  float dj = min(fy, 1.0 - fy) * BH;
  h += 0.09 * band(dj, 0.025, 0.012) * (0.4 + 0.8 * vnoise(vec2(p.x * 5.0, b * 3.0)));
  // Panel joints leave a narrow ridge.
  float dp = abs(fract(px + 0.5) - 0.5) * PW;
  h += 0.06 * band(dp, 0.02, 0.012);
  // Bugholes are small pits where air was trapped.
  vec2 bc = floor(p / 0.42), bf = fract(p / 0.42), bh = hash22(bc + 31.0);
  float bug = step(bh.x, 0.2) * band(length(bf - 0.2 - 0.6 * hash22(bc + 5.0)) * 0.42, 0.015 + 0.035 * bh.y, 0.008);
  h -= 0.3 * bug;
  // A form tie leaves a cone-shaped hole.
  float d = length(p - tieAt(p)), r = 0.11;
  hole = band(d, r, 0.012);
  return mix(h, 0.3 + 0.3 * d / r, hole);
}
void concMat(vec2 p, float h, float hole, out vec3 alb, out float gloss) {
  float b = floor(p.y / BH);
  vec3 c = mix(uC0, uC1, fbm(p * 0.6 + 5.0));
  // Each plank takes its own tone.
  c *= (0.9 + 0.18 * hash12(vec2(b, 8.0))) * (0.82 + 0.34 * fbm(p * 2.7 + 1.0));
  // Sand and fine stone speckle the face.
  c *= 0.88 + 0.24 * hash12(floor(p * 38.0));
  // Rain stains run down from each tie hole.
  vec2 tc = tieAt(p), dv = p - tc;
  float wob = (vnoise(vec2(p.y * 2.0, tc.x)) - 0.5) * 0.2;
  float st = band(abs(dv.x + wob), 0.08 + 0.09 * min(max(-dv.y, 0.0), 3.0), 0.06) * step(dv.y, 0.0) * exp(dv.y * 0.45);
  c = mix(c, uC2, st * 0.65);
  // Broad water marks drift down the wall.
  c *= mix(0.72, 1.06, fbm(vec2(p.x * 0.8, p.y * 0.1) + 2.0));
  alb = mix(c, uC3, hole * 0.6);
  gloss = 0.05 + 0.12 * smoothstep(0.55, 0.85, fbm(p * 0.37 + 3.0));
}

/* Glazed tile: running bond, a green band with a black liner, sunken grout. */
const float TW = 1.5, TH = 0.75;
float tileH(vec2 p, out vec2 id, out float face) {
  float row = floor(p.y / TH);
  float x = p.x + mod(row, 2.0) * 0.5 * TW, col = floor(x / TW);
  id = vec2(col, row);
  vec2 q = vec2(x - (col + 0.5) * TW, p.y - (row + 0.5) * TH);
  float d = sdBox(q, vec2(TW, TH) * 0.5 - 0.035, 0.05);
  face = smoothstep(0.0, 0.015, -d);
  // Bullnose edges round down into the grout.
  float dome = sqrt(clamp(-d / 0.09, 0.0, 1.0));
  // The glaze pools unevenly, so reflections wobble.
  vec2 r = TURN * p;
  float wave = (vnoise(r * 1.7 + id * 3.1) - 0.5) * 0.05 + (hash12(id) - 0.5) * 0.03;
  float grout = 0.12 + (vnoise(r * 30.0) - 0.5) * 0.04;
  return mix(grout, 0.7 + 0.15 * dome + wave, face);
}
void tileMat(vec2 p, out vec3 alb, out float gloss) {
  vec2 id;
  float face;
  tileH(p, id, face);
  vec3 g = uC0 * (0.92 + 0.12 * hash12(id + 2.0));
  if (id.y == -6.0 || id.y == -7.0) g = uC1 * (0.85 + 0.25 * hash12(id + 7.0));
  else if (id.y == -5.0) g = uC2;
  // Contour lines of noise read as crazing in the glaze.
  float craze = smoothstep(0.025, 0.0, abs(vnoise(p * 7.0 + id * 1.3) - 0.5)) * 0.3;
  g *= 1.0 - craze;
  vec3 grout = uC3 * (0.7 + 0.5 * vnoise(p * 21.0)) * mix(0.55, 1.0, fbm(p * 0.4 + 5.0));
  alb = mix(grout, g, face) * mix(0.75, 1.0, fbm(p * 0.25 + 11.0));
  gloss = face * (0.9 - craze) + 0.04;
}

/* Sequins: tilted discs hang in rows; a lower row lies over the row above. */
const float SQX = 0.36, SQY = 0.26, SQR = 0.24;
bool seqTop(vec2 p, out vec2 id, out vec2 q) {
  float r0 = floor(p.y / SQY);
  for (int j = -1; j <= 1; j++) {
    float row = r0 + float(j), off = mod(row, 2.0) * 0.5 * SQX, cx = floor((p.x - off) / SQX);
    for (int i = 1; i >= -1; i--) {
      vec2 c = vec2((cx + float(i) + 0.5) * SQX + off, (row + 0.5) * SQY), d = p - c;
      if (dot(d, d) < SQR * SQR) { id = vec2(cx + float(i), row); q = d; return true; }
    }
  }
  return false;
}
float seqH(vec2 p) {
  vec2 id, q;
  if (!seqTop(p, id, q)) return 0.05;
  float rr = length(q) / SQR;
  // A punched hole shows the backing cloth.
  if (rr < 0.14) return 0.2;
  // Each disc tilts its own way and cups a little.
  return 0.55 + dot(q, (hash22(id) - 0.5) * 1.3) + 0.08 * rr * rr;
}
void seqMat(vec2 p, out vec3 alb, out float gloss) {
  vec2 id, q;
  bool on = seqTop(p, id, q);
  vec2 tilt = hash22(id) - 0.5;
  // Holographic film shifts hue with each disc's tilt.
  float a = fract(atan(tilt.y, tilt.x) / 6.2831853 + 0.3 * hash12(id + 9.0)) * 3.0;
  vec3 c = a < 1.0 ? mix(uC0, uC1, a) : a < 2.0 ? mix(uC1, uC2, a - 1.0) : mix(uC2, uC0, a - 2.0);
  float disc = on && length(q) > 0.14 * SQR ? 1.0 : 0.0;
  alb = mix(uC3 * (0.7 + 0.6 * vnoise(p * 40.0)), c, disc);
  gloss = mix(0.04, 0.94, disc);
}

/* Acoustic foam: pyramid panels and wedge panels in two tones. */
const float FP = 2.0, FC = 0.5;
float foamH(vec2 p, out float tone, out float seam) {
  vec2 pi = floor(p / FP), pf = p / FP - pi;
  tone = mod(pi.x + pi.y, 2.0);
  seam = min(min(pf.x, 1.0 - pf.x), min(pf.y, 1.0 - pf.y)) * FP;
  vec2 q = fract(p / FC) - 0.5;
  // Wedge panels run their ridges up the wall.
  float h = tone > 0.5 ? 1.0 - 2.0 * abs(q.x) : 1.0 - 2.0 * max(abs(q.x), abs(q.y));
  // Peaks round off; open cells pock the faces.
  h = 0.15 + 0.78 * h * (1.0 - 0.25 * h * h) + (vnoise(TURN * p * 40.0) - 0.5) * 0.06;
  return h * smoothstep(0.0, 0.05, seam);
}
void foamMat(vec2 p, out vec3 alb, out float gloss) {
  float tone, seam;
  foamH(p, tone, seam);
  alb = mix(uC0, uC1, tone) * (0.75 + 0.35 * vnoise(p * 55.0));
  alb = mix(uC2, alb, smoothstep(0.0, 0.05, seam));
  gloss = 0.01;
}

float height(vec2 p) {
  float hole, t, s;
  vec2 id;
  float face;
  if (uKind == 1) return steelH(p);
  if (uKind == 2) return concH(p, hole);
  if (uKind == 3) return tileH(p, id, face);
  if (uKind == 4) return seqH(p);
  if (uKind == 5) return foamH(p, t, s);
  return brickH(p, id, face);
}
void main() {
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRow + vec2(0.37, 0.21);
  float e = 1.0 / uRow;
  float h = height(p), hx = height(p + vec2(e, 0.0)), hy = height(p + vec2(0.0, e));
  vec3 n = normalize(vec3(-(hx - h) / e * uDepth, -(hy - h) / e * uDepth, 1.0));
  // The night light skims the relief; raised edges shade the hollows.
  vec2 ld = normalize(uLamb.xy);
  float tanE = uLamb.z / length(uLamb.xy), occ = 0.0;
  for (int i = 1; i <= 4; i++) {
    float t = float(i * i) * 0.012;
    occ = max(occ, (height(p + ld * t) - h) * uDepth - t * tanE);
  }
  float vis = 1.0 - smoothstep(0.0, 0.03, occ) * 0.75;
  vec3 alb;
  float gloss, hole;
  if (uKind == 1) steelMat(p, h, alb, gloss);
  else if (uKind == 2) { concH(p, hole); concMat(p, h, hole, alb, gloss); }
  else if (uKind == 3) tileMat(p, alb, gloss);
  else if (uKind == 4) seqMat(p, alb, gloss);
  else if (uKind == 5) foamMat(p, alb, gloss);
  else brickMat(p, alb, gloss);
  float ao = mix(0.5, 1.0, smoothstep(0.05, 0.75, h));
  oA = vec4(alb, gloss);
  oB = vec4(n.xy * 0.5 + 0.5, clamp(h, 0.0, 1.0), vis * ao);
}`;
// Shared lighting: the wall under night light and neon, then the camera.
const LIGHT = `
uniform sampler2D uGA, uGB, uGlow, uHalo, uEm;
uniform vec2 uRes, uShOff;
uniform vec3 uAmb, uLamb, uKey;
uniform float uLift, uRefl, uMetal, uSheen, uWallK, uBloom, uHaloK, uExpo;
${NOISE}
vec3 wallAt(vec2 fc) {
  ivec2 top = ivec2(uRes) - 1, ip = clamp(ivec2(fc), ivec2(0), top);
  vec4 A = texelFetch(uGA, ip, 0), B = texelFetch(uGB, ip, 0);
  vec3 n = vec3(B.xy * 2.0 - 1.0, 0.0);
  n.z = sqrt(max(0.0, 1.0 - dot(n.xy, n.xy)));
  vec2 uv = (vec2(ip) + 0.5) / uRes;
  // Glossy parts of a metal wall are bare steel; rust stays matte.
  float metal = uMetal * smoothstep(0.25, 0.5, A.a), rough = 1.0 - A.a;
  // Glaze raises the sheen of a plain wall.
  vec3 dif = A.rgb * (1.0 - 0.9 * metal), F0 = mix(vec3(0.04 * uSheen), A.rgb, metal);
  // Night light falls from above; tubes and clips shade it.
  float sky = (0.55 + 0.6 * uv.y) * B.w * (1.0 - 0.7 * clamp(texture(uHalo, uv + uShOff).a * 1.4, 0.0, 1.0));
  float ndl = max(dot(n, uLamb), 0.0);
  vec3 col = uAmb * dif * sky * (0.25 + 0.95 * ndl);
  vec3 H = normalize(uLamb + vec3(0.0, 0.0, 1.0));
  float sp = pow(max(dot(n, H), 0.0), mix(90.0, 6.0, rough)) * mix(0.9, 0.08, rough);
  col += F0 * sky * (uAmb * (0.4 + 1.5 * ndl) + uKey * sp);
  // Neon light: glow sampled a little way along the slope.
  // It shows how much a face turns toward the tubes.
  // Each channel reads its own glow, so two colours light opposite slopes.
  vec3 g = texture(uGlow, uv).rgb;
  vec3 gb = texture(uGlow, uv + n.xy * uLift / uRes).rgb;
  vec3 neon = clamp(g + (gb - g) * 2.2, g * 0.12, g * 3.0);
  col += neon * uWallK * dif * mix(0.7, 1.0, B.w);
  // Gloss and bare steel mirror the tubes, bent by the relief.
  vec2 ro = n.xy * uRefl / uRes;
  vec3 sharp = mix(texture(uHalo, uv + ro).rgb, texture(uEm, uv + ro).rgb, A.a);
  vec3 refl = mix(texture(uGlow, uv + ro * 0.7).rgb, sharp, A.a * A.a);
  col += refl * uWallK * F0 * A.a * 1.4 * mix(0.75, 1.0, B.w);
  return col;
}
// Polished metal mirrors the neon around it.
vec3 metal(vec3 n, vec2 uv, float base) {
  vec3 R = reflect(vec3(0.0, 0.0, -1.0), n);
  vec3 env = texture(uGlow, uv + R.xy * 0.03).rgb * uWallK + texture(uHalo, uv + R.xy * 0.01).rgb * uWallK * 0.5;
  float sp = pow(max(dot(R, uLamb), 0.0), 40.0);
  return base * (env * 0.9 + uAmb * (0.3 + 0.7 * max(dot(n, uLamb), 0.0))) + uKey * sp * base * 1.5;
}
vec3 srgb(vec3 c) {
  c = clamp(c, 0.0, 1.0);
  return mix(12.92 * c, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}
// Bloom, vignette, a soft shoulder, then display colour.
vec3 finish(vec3 c, vec2 fc) {
  vec2 uv = fc / uRes, v = uv - 0.5;
  c += texture(uGlow, uv).rgb * uBloom + texture(uHalo, uv).rgb * uHaloK;
  c *= 1.0 - 0.8 * dot(v, v);
  c = 1.0 - exp(-c * uExpo);
  return srgb(c) + (hash12(fc + 3.1) - 0.5) / 255.0;
}`;
const FINAL_FS = `#version 300 es
precision highp float;
precision highp sampler2D;
${LIGHT}
out vec4 o;
void main() { o = vec4(finish(wallAt(gl_FragCoord.xy), gl_FragCoord.xy), 1.0); }`;
const TUBE_VS = `#version 300 es
layout(location = 0) in vec4 aA;
layout(location = 1) in vec4 aB;
layout(location = 2) in float aP;
uniform vec2 uView;
uniform vec2 uShake[${MAXT}];
out vec2 vSA;
out vec2 vT;
out float vP;
flat out int vId;
flat out float vLen;
void main() {
  vSA = aA.zw;
  vP = aP;
  vT = aB.xy;
  vId = int(aB.z + 0.5);
  vLen = aB.w;
  vec2 pos = aA.xy + uShake[vId];
  gl_Position = vec4(pos.x / uView.x * 2.0 - 1.0, 1.0 - pos.y / uView.y * 2.0, 0.0, 1.0);
}`;
// Mode 0 shades the tube; mode 1 writes only light and cover.
const TUBE_FS = `#version 300 es
precision highp float;
precision highp sampler2D;
${LIGHT}
uniform vec4 uGas[${MAXT}];
uniform float uR, uRpx, uMode, uEmK, uHue;
uniform float uFx[${MAXT}];
// OKLCH in, linear sRGB out, scaled to its brightest channel.
vec3 hueLin(float L, float C, float h) {
  float a = C * cos(h), b = C * sin(h);

  if (e.pointerType !== 'mouse' || !rail.contains(e.target)) { if (peek >= 0) { peek = -1; paintGas(); } return; }
  const i = swatchAt(e.clientX);
  if (i !== peek) { peek = i; paintGas(); }
});
const railUp = e => { if (railId === e.pointerId) railId = null; };
gasEl.addEventListener('pointerup', railUp);
gasEl.addEventListener('pointercancel', railUp);
gasEl.addEventListener('pointerleave', () => { if (peek >= 0) { peek = -1; paintGas(); } });
gasEl.addEventListener('keydown', e => {
  const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
  if (d) setGas(gasNow + d);
  else if (e.key === 'Home') setGas(0);
  else if (e.key === 'End') setGas(MIX);
  else return;
  // The pen ignores keys the rail has used.
  e.preventDefault();
});
paintGas();

function setWall(i) {
  wallNow = (i + WALLS.length) % WALLS.length;
  const w = WALLS[wallNow];
  wallBtn.textContent = w.name;
  wallBtn.setAttribute('aria-label', `Wall: ${w.name}`);
  if (!ready) return;
  bakeWall();
  // The swap dips the power for a blink.
  const now = performance.now() / 1000;
  let any = null;
  for (const t of tubes) {
    if (!t.on || t.seq) continue;
    t.seq = reduce ? [[now, 0.6, 0], [now + 0.05, 1, 0]] : [[now, 0.1, 0], [now + 0.05, 0.7, 0], [now + 0.08, 0.2, 0], [now + 0.13, 1, 0]];
    t.si = 0;
    any = t;
  }
  if (any) thump(any);
  wake();
}
setWall(0);
// Snap makes every drag run straight; touch has no Shift key.
const snapBtn = document.getElementById('snap');
let snapOn = false;
snapBtn.addEventListener('click', () => {
  snapOn = !snapOn;
  snapBtn.setAttribute('aria-pressed', String(snapOn));
});
wallBtn.addEventListener('click', () => setWall(wallNow + 1));
// On a phone the bar sits under the wall, so the whole wall draws.
const NARROW = matchMedia('(max-width: 560px)'), barEl = panel.nextElementSibling;
const barPlace = () => barEl.classList.toggle('bar--below', NARROW.matches);
NARROW.addEventListener?.('change', barPlace);
barPlace();
showBtn.addEventListener('click', () => setShow(show + 1));
clearBtn.addEventListener('click', clearAll);
// Reduced motion stops the show and rests its chip.
function motionPref() {
  showBtn.setAttribute('aria-disabled', String(reduce));
  if (reduce) setShow(0);
}
motionPref();
const ARROWS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const onButton = e.target.closest?.('button, a');
  if (ARROWS.has(e.key)) {
    e.preventDefault();
    if (!ready) return;
    pen.shift = e.shiftKey;
    // Shift lifts the pen; a keyboard stroke ends first.
    if (e.shiftKey && draft && draft.pid === 'kb') endDraft();
    pen.keys.add(e.key);
    pen.seen = performance.now() / 1000;
    wake();
  } else if (e.key === ' ') {
    if (onButton) return;
    e.preventDefault();
    if (e.repeat || !ready) return;
    pen.seen = performance.now() / 1000;
    // Space ends a keyboard stroke, or else switches the nearest tube.
    if (draft && draft.pid === 'kb') { endDraft(); return; }
    const t = pick(pen.x, pen.y, 1e6);
    if (t) toggle(t);
    else wake();
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    if (!e.repeat) undo();
  } else if (e.key === 'c' || e.key === 'C') {
    if (!e.repeat) clearAll();
  }
});
addEventListener('keyup', e => {
  pen.keys.delete(e.key);
  if (e.key === 'Shift') pen.shift = false;
});
addEventListener('blur', () => pen.keys.clear());

// The kit wakes and sleeps the context; the hum follows it on.
sound.onChange(on => { if (on) { voices(); humSync(); } });

/* ---------- start: shaders link while the wall is laid out ---------- */
function failed() {
  ready = false;
  sync();
  canvas.hidden = true;
  panel.querySelector('.fail').hidden = false;
  [snapBtn, wallBtn, showBtn, clearBtn].forEach(c => { c.disabled = true; });
  gasEl.setAttribute('aria-disabled', 'true');
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; sync(); });
canvas.addEventListener('webglcontextrestored', async () => {
  try {
    await initGL();
    allocTargets();
    ready = true;
    sync();
  } catch (err) { console.error(err); failed(); }
});
async function boot() {
  await idle();
  fit();
  if (!W) {
    layout(1160, 652);
    canvas.width = 1160;
    canvas.height = 652;
  }
  seedSign();
  reshape();
  try { await initGL(); } catch (err) { console.error(err); failed(); return; }
  allocTargets();
  ready = true;
  new ResizeObserver(fit).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; sync(); }).observe(panel);
  document.addEventListener('visibilitychange', sync);
  await curtain;
  // The seeded tubes strike one by one, left to right, frame last.
  const now = performance.now() / 1000;
  tubes.filter(t => t.seed && !t.on).forEach((t, i) => strike(t, now + (reduce ? 0 : i * 0.22), reduce));
  wake();
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
