<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon sign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Neon sign: the brick wall at full width under the shared header. */
:root { --stage: oklch(0.15 0.02 30); }
.stage { cursor: crosshair; }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
/* Each swatch shows its gas colour. */
.sw { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/neon.svg)"></span><span class="intro-name">Neon sign</span><span class="intro-sub">Stimming No. 10</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--neon" id="stage" tabindex="0" role="application" aria-label="A brick wall at night. Drag to bend a neon tube; click a tube to switch it off or on. Arrow keys draw, Shift with arrows moves the pen, Enter finishes, Space switches the nearest tube, Backspace undoes, C clears, 1 to 5 pick the gas.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Neon sign needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices">
        <button class="chip" type="button" data-gas="0" aria-pressed="false" aria-keyshortcuts="1"><span class="sw" style="--c: oklch(0.64 0.23 31)" aria-hidden="true"></span>Red</button>
        <button class="chip" type="button" data-gas="1" aria-pressed="true" aria-keyshortcuts="2"><span class="sw" style="--c: oklch(0.58 0.2 264)" aria-hidden="true"></span>Blue</button>
        <button class="chip" type="button" data-gas="2" aria-pressed="false" aria-keyshortcuts="3"><span class="sw" style="--c: oklch(0.68 0.25 352)" aria-hidden="true"></span>Pink</button>
        <button class="chip" type="button" data-gas="3" aria-pressed="false" aria-keyshortcuts="4"><span class="sw" style="--c: oklch(0.82 0.22 146)" aria-hidden="true"></span>Green</button>
        <button class="chip" type="button" data-gas="4" aria-pressed="false" aria-keyshortcuts="5"><span class="sw" style="--c: oklch(0.95 0.03 85)" aria-hidden="true"></span>White</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag</dt><dd>draw a tube</dd></div>
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span> a tube</dt><dd>switch</dd></div>
        <div class="fine"><dt><kbd>Backspace</kbd></dt><dd>undo</dd></div>
        <div class="fine"><dt><kbd>C</kbd></dt><dd>clear</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Neon sign</h1><div class="vignette" hidden></div></section>
</div>

<script type="module">
import { initPage, sound } from '../shared/stim.js';
initPage({ id: 'neon' });
const panel = document.getElementById('stage'), canvas = panel.querySelector('canvas');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; wake(); });
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);

const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
function lin(L, C, h) {

    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,

const scale = (c, k) => c.map(v => v * k);
// Each gas is normalised to full strength, then balanced by eye.
const GAS = [
  [0.63, 0.26, 30, 1.0],
  [0.52, 0.24, 266, 1.35],
  [0.64, 0.29, 350, 1.0],
  [0.84, 0.26, 148, 0.62],
  [0.95, 0.035, 80, 0.55],

  uB1: linear(0.43, 0.1, 31),
  uB2: linear(0.37, 0.07, 40),
  uB3: linear(0.47, 0.1, 42),
  uB4: linear(0.29, 0.03, 30),

// The night light comes from the upper left; y points up.
const LAMB = (() => { const v = [-0.35, 0.6, 0.72], n = Math.hypot(...v); return v.map(x => x / n); })();

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 16, MAXHUM = 6, LEAD = 0.004;
let ac = null, out = null, noise = null, humBus = null, askedAt = -1e9, voices = 0, restT = 0;

const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.

    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;

    out.gain.value = 0.55;

    comp.connect(ac.destination);

    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

// Once every tube is dark and still, the context sleeps.

// The transformer takes the load with a soft thump.

// A switch snaps: a bright tick over a small body.

    burst(a, dst, t0, 'bandpass', 3300 * jit(0.05), 1.3, 0.2 * g, 0.0022, 0.02, hold());
    tone(a, dst, t0, 1500 * jit(0.04), 780, 0.04 * g, 0.004, hold());

  wake();
}
function clearAll() {
  if (draft) cancelDraft();
  if (!tubes.length) return;
  if (tubes.some(t => t.lvl > 0)) click(0);
  tubes.length = 0;
  staticDirty = true;
  humSync();
  wake();
}
const chips = [...document.querySelectorAll('[data-gas]')];
function setGas(i) {
  gasNow = i;
  chips.forEach(c => c.setAttribute('aria-pressed', String(+c.dataset.gas === i)));
  if (draft) draft.gas = i;
  wake();
}
chips.forEach(c => c.addEventListener('click', () => setGas(+c.dataset.gas)));
const ARROWS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const onButton = e.target.closest?.('button, a');
  if (ARROWS.has(e.key)) {
    e.preventDefault();
    if (!ready) return;
    pen.shift = e.shiftKey;
    // Shift lifts the pen; a keyboard stroke ends first.
    if (e.shiftKey && draft && draft.pid === 'kb') endDraft();
    pen.keys.add(e.key);
    pen.seen = performance.now() / 1000;
    wake();
  } else if (e.key === 'Enter') {
    if (onButton) return;
    e.preventDefault();
    if (draft && draft.pid === 'kb') endDraft();
  } else if (e.key === ' ') {
    if (onButton) return;
    e.preventDefault();
    if (e.repeat || !ready) return;
    pen.seen = performance.now() / 1000;
    const t = pick(pen.x, pen.y, 1e6);
    if (t) toggle(t);
    else wake();
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    if (!e.repeat) undo();
  } else if (e.key === 'c' || e.key === 'C') {
    if (!e.repeat) clearAll();
  } else if (e.key >= '1' && e.key <= '5') {
    setGas(+e.key - 1);
  }
});
addEventListener('keyup', e => {
  pen.keys.delete(e.key);
  if (e.key === 'Shift') pen.shift = false;
});
addEventListener('blur', () => pen.keys.clear());

sound.onChange(on => {
  if (on) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});

/* ---------- start: shaders link while the wall is laid out ---------- */
function failed() {
  ready = false;
  sync();
  canvas.hidden = true;
  panel.querySelector('.fail').hidden = false;
  chips.forEach(c => { c.disabled = true; });
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; sync(); });
canvas.addEventListener('webglcontextrestored', async () => {
  try {
    await initGL();
    allocTargets();
    ready = true;
    sync();
  } catch (err) { console.error(err); failed(); }
});
async function boot() {
  await idle();
  fit();
  if (!W) {
    layout(1160, 652);
    canvas.width = 1160;
    canvas.height = 652;
  }
  tubes.push(makeTube(squiggle(), 2, true));
  reshape();
  try { await initGL(); } catch (err) { console.error(err); failed(); return; }
  allocTargets();
  ready = true;
  new ResizeObserver(fit).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; sync(); }).observe(panel);
  document.addEventListener('visibilitychange', sync);
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
