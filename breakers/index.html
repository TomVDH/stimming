<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.1 0.01 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breakers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm">
<style>
/* Breakers: a classic sea at dusk; each click sends a ring of white water out. */
:root { --stage: oklch(0.1 0.01 265); }
.stage--breakers { background: var(--stage); cursor: crosshair; }
.stage--breakers canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--breakers canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--breakers canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Breakers</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--breakers" id="stage" tabindex="0" role="application" aria-label="A sea at dusk. Click to send a ring of white water out from that point. Press X to clear the rings.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Breakers</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module">
import { initPage, whenVisible, fitCanvas, pageReady, stage as mark, reduced, onReducedChange } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import { TRI_VS, program, linked, tri, onContextLoss } from '../shared/gl.js';
import { WATER } from '../shared/water.js';
import { SKY, skyAt } from '../shared/sky.js';
mark('libs');

const stage = document.getElementById('stage');
const fail = stage.querySelector('.fail');

// Ring slots and the sea's tuning. Rings spread at 2.4 m/s and fade over 16 s.
const MAXR = 12, SPREAD = 2.4, LIFE = 16;
// Camera height above the sea (m), half field of view (tan) and the sun hour.
const CAM_H = 2.2, TAN = 0.62, HOUR = 17.5;
// Horizon offset in the view ray, so the sea fills the lower part of the frame.
const TILT = 0.14;
// Still-sea colours in linear RGB, deep and shallow.
const DEEP = [0.02, 0.09, 0.11], SHALLOW = [0.07, 0.26, 0.27], FOAM = [0.9, 0.93, 0.94];

const FS = /* glsl */`#version 300 es
precision highp float;
out vec4 outC;
#define MAXR ${MAXR}
uniform vec2 uRes;
uniform float uTime, uAmb, uSwell, uChop, uSets, uRingK, uTan, uH, uDay, uStars;
uniform vec3 uSun, uZen, uMid, uBand, uAnti, uDeep, uShallow, uFoam;
uniform int uN;
uniform vec4 uRing[MAXR];
${WATER}
${SKY}

// Height of every live ring at p; each ring is a damped wave train on a spreading front.
float ringH(vec2 p) {
  float h = 0.0;
  for (int i = 0; i < MAXR; i++) {
    if (i >= uN) break;
    vec4 r = uRing[i];
    float age = uTime - r.z;
    if (age < 0.0 || age > ${LIFE}.0) continue;
    float x = length(p - r.xy) - age * ${SPREAD.toFixed(1)};
    h += sin(x * 3.0) * exp(-x * x * 0.6) * exp(-age * 0.22) * r.w;
  }
  return h * uRingK;
}

// Slope of the ring field: the gradient of ringH by central differences.
vec2 ringGrad(vec2 p) {
  const float e = 0.2;
  return vec2(ringH(p + vec2(e, 0.0)) - ringH(p - vec2(e, 0.0)), ringH(p + vec2(0.0, e)) - ringH(p - vec2(0.0, e))) / (2.0 * e);
}

void main() {
  vec2 ndc = gl_FragCoord.xy / uRes * 2.0 - 1.0;
  float asp = uRes.x / uRes.y;
  vec3 d = normalize(vec3(ndc.x * asp * uTan, ndc.y * uTan - ${TILT.toFixed(2)}, 1.0));
  vec3 sky = skSky(d, uSun, uZen, uMid, uBand, uAnti, uStars, uTime);
  // Above the horizon there is only sky.
  if (d.y > -1e-3) { outC = vec4(sky, 1.0); return; }

  // The sea is the plane y = 0, seen from the camera at height uH.
  float t = uH / -d.y;
  vec2 p = d.xz * t;
  float focalPx = (uRes.y * 0.5) / uTan;
  float sig2;
  vec2 rg = ringGrad(p);
  vec2 slope = wtWaves(p, uAmb, wtFoot(t, -d.y, focalPx), uSwell, uChop, uSets, sig2) + rg;
  vec3 n = wtNormal(slope);
  vec3 r = reflect(d, n);
  r.y = abs(r.y);
  float F = wtFresnel(d, n);

  vec3 body = mix(uDeep, uShallow, 0.3 + 0.7 * (-d.y)) * (0.3 + 0.7 * uDay);
  vec3 rs = skSky(r, uSun, uZen, uMid, uBand, uAnti, uStars, uTime);
  vec3 col = mix(body, rs, F);
  col += vec3(1.0, 0.95, 0.85) * wtGlint(r, uSun, sig2, 0.03) * F * uDay;

  // White water: where a ring's slope is steep, the crest breaks into lace.
  float steep = length(rg);
  float lace = 0.5 + 0.5 * skH(p * 2.5 + uTime * 0.4);
  float foam = smoothstep(0.12, 0.45, steep) * lace;
  col = mix(col, uFoam * (0.35 + 0.65 * uDay), clamp(foam, 0.0, 1.0) * 0.9);

  // Haze: the far sea melts into the sky's horizon colour.
  col = mix(col, sky, 1.0 - exp(-t * 0.0015));
  outC = vec4(col, 1.0);
}`;

// Shared state: the GL program, its VAO and the rings.
let gl = null, set = null, vao = null, sky = skyAt(HOUR);
const rings = [];
let lastInput = 0, visible = true, raf = 0, clock = 0, ambFrozen = false, last = performance.now();

const ui = initPage({ id: 'breakers', bar: {
  slider: { label: 'Sea', min: 0, max: 1, step: 0.01, value: 0.6, onInput: () => wake() },
  actions: [{ verb: 'clear', key: 'X', onPress: () => { rings.length = 0; wake(); } }],
  reset: () => { rings.length = 0; wake(); },
  keys: [['click', 'send a ring of white water']],
  help: [['click', 'Send a ring of white water'], ['X', 'Clear the sea'], ['Sea', 'Swell and chop'] ],
} });

const introDone = playIntro({ ready: pageReady() });

// The sea's knobs, from the bar slider: swell and chop gains, and the ring strength.
const knobs = () => {
  const v = ui.slider?.value ?? 0.6;
  return { swell: 0.02 * v, chop: 0.27 * v, sets: 0.5, ringK: 0.6 * v };
};

const canvas = document.createElement('canvas');
stage.append(canvas);

async function setup() {
  gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) throw new Error('no webgl2');
  set = await linked(gl, { p: program(gl, TRI_VS, FS) });
  vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
}

// Pointer to sea point: the same view ray the shader builds.
function seaPoint(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const nx = ((clientX - r.left) / r.width) * 2 - 1;
  const ny = 1 - ((clientY - r.top) / r.height) * 2;
  const asp = r.width / r.height;
  const d = [nx * asp * TAN, ny * TAN - TILT, 1];
  const len = Math.hypot(...d);
  const y = d[1] / len;
  if (y > -1e-3) return null;
  const t = CAM_H / -y;
  return [d[0] / len * t, d[2] / len * t];
}

stage.addEventListener('pointerdown', e => {
  const pt = seaPoint(e.clientX, e.clientY);
  if (!pt) return;
  lastInput = performance.now();
  const slot = { x: pt[0], z: pt[1], t0: clock, amp: 1 };
  if (rings.length >= MAXR) rings.shift();
  rings.push(slot);
  wake();
});

// Ambient motion stops after 60 s with no input and no ring alive.
const asleep = () => performance.now() - lastInput > 60000 && rings.every(r => clock - r.t0 > LIFE);
const running = () => visible && (!asleep() || rings.length > 0);

function draw(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!ambFrozen) clock += dt;
  const { swell, chop, sets, ringK } = knobs();
  const { w, h, W, H } = fitCanvas(canvas);
  canvas.width = W; canvas.height = H;
  gl.viewport(0, 0, W, H);
  const P = set.p.u;
  gl.useProgram(set.p.p);
  gl.uniform2f(P.uRes, W, H);
  gl.uniform1f(P.uTime, clock);
  gl.uniform1f(P.uAmb, clock);
  gl.uniform1f(P.uSwell, swell);
  gl.uniform1f(P.uChop, chop);
  gl.uniform1f(P.uSets, sets);
  gl.uniform1f(P.uRingK, ringK);
  gl.uniform1f(P.uTan, TAN);
  gl.uniform1f(P.uH, CAM_H);
  gl.uniform1f(P.uDay, 1);
  gl.uniform1f(P.uStars, sky.stars);
  gl.uniform3fv(P.uSun, sky.sun);
  gl.uniform3fv(P.uZen, sky.zen);
  gl.uniform3fv(P.uMid, sky.mid);
  gl.uniform3fv(P.uBand, sky.band);
  gl.uniform3fv(P.uAnti, sky.anti);
  gl.uniform3fv(P.uDeep, DEEP);
  gl.uniform3fv(P.uShallow, SHALLOW);
  gl.uniform3fv(P.uFoam, FOAM);
  const flat = new Float32Array(MAXR * 4);
  rings.forEach((r, i) => flat.set([r.x, r.z, r.t0, r.amp], i * 4));
  gl.uniform1i(P.uN, rings.length);
  gl.uniform4fv(P.uRing, flat);
  tri(gl, null, vao);
}

function frame(now) {
  raf = 0;
  draw(now);
  if (running()) raf = requestAnimationFrame(frame);
}

function wake() {
  if (!raf && running() && gl) { last = performance.now(); raf = requestAnimationFrame(frame); }
}

whenVisible(stage, on => { visible = on; if (on) wake(); });
onReducedChange?.(on => { ambFrozen = on; wake(); });
if (reduced()) ambFrozen = true;

onContextLoss(canvas, {
  lost: () => { cancelAnimationFrame(raf); raf = 0; },
  restored: async () => { await setup(); wake(); },
  failed: () => fail.removeAttribute('hidden'),
});

mark('build');
try {
  await setup();
  lastInput = performance.now();
  draw(performance.now());
  canvas.classList.add('on');
  mark('first-frame');
  wake();
} catch (err) {
  console.error(err);
  fail.removeAttribute('hidden');
}
</script>
</body>
</html>
