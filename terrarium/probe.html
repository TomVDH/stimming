<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terrarium probe (three.js)</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<style>
/* Terrarium probe: the fill on three.js, for comparison with the toy. */
html, body { margin: 0; height: 100%; background: oklch(0.09 0.014 160); color: oklch(0.85 0.02 150); font: 12px/1.4 ui-monospace, monospace; }
canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
.panel { position: fixed; left: 12px; bottom: 12px; display: grid; gap: 6px; padding: 10px 12px; background: oklch(0.12 0.01 160 / 0.8); border: 1px solid oklch(0.3 0.02 160); border-radius: 6px; }
.panel label { display: grid; grid-template-columns: 70px 140px; align-items: center; gap: 8px; }
.stats { position: fixed; right: 12px; bottom: 12px; padding: 6px 10px; background: oklch(0.12 0.01 160 / 0.8); border-radius: 6px; white-space: pre; }
.back { position: fixed; left: 12px; top: 12px; color: inherit; }
</style>
</head>
<body>
<a class="back" href="./">Terrarium</a>
<div class="panel">
  <label>Wake <input id="wake" type="range" min="0" max="1" step="0.01" value="0"></label>
  <label>Grow <input id="grow" type="range" min="0" max="1" step="0.01" value="0.4"></label>
  <label>Mist <button id="mist" type="button">Mist (M)</button></label>
</div>
<div class="stats" id="stats"></div>
<script type="module" src="probe.js"></script>
</body>
</html>
