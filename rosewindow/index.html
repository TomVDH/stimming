<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 270); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rose window</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./render.js">
<link rel="modulepreload" href="./shaders.js">
<link rel="modulepreload" href="./sound.js">
<link rel="modulepreload" href="../shared/gl.js">
<link rel="modulepreload" href="../shared/daytime.js">
<style>
/* Rose window: sun through stained glass in a stone nave. */
:root { --stage: oklch(0.16 0.012 270); }
.stage--rosewindow { background: var(--stage); cursor: ew-resize; }
.stage--rosewindow canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 1.2s ease; touch-action: none;
}
.stage--rosewindow canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--rosewindow canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Rose window</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--rosewindow" id="stage" tabindex="0" role="application" aria-label="Inside a stone Gothic nave, a great rose window of stained glass in deep blues and reds glows high in the end wall. Sunlight through it throws coloured shafts through floating dust and lays soft coloured patches on the floor and the piers. Drag across the nave, or use the Sun slider or the arrow keys, to move the sun through the day: the shafts swing, and the patches crawl over the floor and up the stone, stretch long and warm toward evening, and fade. Tap to stir the dust. Press Space to run the day on to dusk.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Rose window</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
