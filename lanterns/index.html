<style>
/* Lantern lake: a still lake at dusk under paper lanterns. */
:root { --stage: oklch(0.11 0.02 265); }
.stage--lanterns canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--lanterns canvas.on { opacity: 1; }
.stage--lanterns { cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .stage--lanterns canvas { transition: none; } }
</style>

<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Lantern lake</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--lanterns" id="stage" tabindex="0" role="application" aria-label="A still lake at dusk. Low hills and pines stand dark on the far shore, with a few lit windows. A thin mist lies on the water, and the lake mirrors the sky.">
      <p class="fail" hidden>Lantern lake needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">

    <div class="vignette" hidden></div>
  </section>
</div>
