<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.06 0.008 70); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Chart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./sun.js">
<link rel="modulepreload" href="./render.js">
<link rel="modulepreload" href="./sound.js">
<link rel="modulepreload" href="./chart.js">
<link rel="modulepreload" href="./rail.js">
<link rel="modulepreload" href="../shared/gl.js">
<link rel="modulepreload" href="../shared/glow.js">
<style>
/* Star Chart: a star's edge at a vast scale, graded like film; loops, prominences, a flare on a tap. */
:root { --stage: oklch(0.06 0.008 70); }
.stage--starchart { background: var(--stage); cursor: default; }
.stage--starchart canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--starchart canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--starchart canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Star Chart</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--starchart" id="stage" tabindex="0" role="application" aria-label="The edge of a star as a vast dome; choose one of seventeen stars: every class on the main sequence, two brown dwarfs, and the stages of a star's life from a protostar to a pulsar. Loops of glowing plasma arc above the edge and drain back; giant prominences tower over them all round the star, with Mercury crossing our own sun. Tap an active region to flare it: bright ribbons flash, a rope of plasma lifts off, and a new arcade of loops forms and cools. Tap a prominence and it lifts off into space. Drag to turn the star; press L to step from the long lens to the wide view and the full star, then scroll or pinch to zoom out.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Star Chart</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
