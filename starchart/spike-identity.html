<!doctype html>
<html lang="en">
<head>

<body>
<main>
<header><a href="./">Star Chart</a><h1>Logo studies</h1></header>
<section class="logos" aria-label="Logo variations"></section>
<section class="bodies" aria-labelledby="body-heading">
<div class="tools"><h2 id="body-heading">Bodies</h2><div role="group" aria-label="Thumbnail style"><button type="button" data-mode="alpha" aria-pressed="true">Rendered</button><button type="button" data-mode="glyph" aria-pressed="false">Current 2D</button></div><button type="button" id="relative-size" aria-pressed="false">Relative size</button><button type="button" id="ground" aria-pressed="false">Lighter ground</button></div>
<p class="render-status" role="status">Rendering bodies…</p>
<p class="selection" aria-live="polite">The Sun</p>
<div class="ribbon" aria-label="Body thumbnails"></div>
</section>
</main>
