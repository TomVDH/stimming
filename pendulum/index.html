<style>
/* Pendulum wave: a row of strings under the corner controls. */
:root { --stage: oklch(0.205 0.012 272); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
.stage.grab canvas { cursor: grab; }
.stage.held canvas { cursor: grabbing; }
/* The Release chip shows the pattern it lifts next. */
.s2-chip .pat { width: 20px; height: 12px; margin-right: 6px; vertical-align: -2px; fill: currentColor; flex: none; }
/* The Iso chip carries a cube; its cuts take the chip's own backing. */
.s2-chip .cube { width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; fill: currentColor; stroke: none; flex: none; }
.s2-chip .cube .cut { fill: none; stroke: var(--glass); stroke-width: 1.4; }
.s2-chip[aria-pressed="true"] .cube .cut { stroke: var(--fg); }
/* The warp readout: a solid tag, top centre, while time runs fast. */
/* The script sets its top, so it never sits under a corner. */
.warp {
  position: absolute; top: 14px; left: 50%; z-index: 1; display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 9px 5px 8px; border-radius: 2px; background: var(--fg); color: var(--stage);
  font: 700 12px/1 var(--slab, ui-monospace, monospace); font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
  pointer-events: none; opacity: 0; transform: translate(-50%, -4px);
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.warp.on { opacity: 1; transform: translate(-50%, 0); }
.warp svg { width: 13px; height: 10px; fill: currentColor; }
@media (prefers-reduced-motion: reduce) { .stage canvas, .warp { transition: none; } }

<div class="wrap">

    <div class="stage stage--pendulum" id="stage" tabindex="0" role="application" aria-label="Pendulum wave. Drag a ball to swing it, or drag across the strings to lift a row. Hold the stage or Shift to rush time. Space releases the row, Escape stops it, V swaps the view.">
      <span class="warp" id="warp" aria-hidden="true"><svg viewBox="0 0 14 10"><path d="M0 0l7 5-7 5zM7 0l7 5-7 5z"/></svg>1×</span>

    </div>

<script type="module">
import { initPage, audioKit, whenVisible, reduced, onReducedChange, onQuality, pixelRatio, stage, idle } from '../shared/stim.js';
stage('libs');
// Storage is optional; private windows can refuse it.
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (err) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (err) { /* storage is optional */ } },
};
const COUNT_KEY = 'stimming.pendulum.count', VIEW_KEY = 'stimming.pendulum.view';
const COUNTS = ['12', '20', '32'];
const savedN = COUNTS.includes(store.get(COUNT_KEY)) ? +store.get(COUNT_KEY) : 20;
const CUBE = '<svg class="cube" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1l6 3.5v5L7 13 1 9.5v-5z"/><path class="cut" d="M7 7l6-3.5M7 7L1 3.5M7 7v6"/></svg>';
const coarse = matchMedia('(pointer: coarse)').matches;
const ui = initPage({ id: 'pendulum', bar: {
  choice: { label: 'Pendulums', value: String(savedN), options: COUNTS.map(v => ({ value: v, label: v })), onPick: v => setCount(+v) },
  actions: [
    { verb: 'release', label: '<svg class="pat" viewBox="0 0 20 12" aria-hidden="true"></svg>Release', key: 'Space', onPress: () => release() },
    { verb: 'stop', key: 'Escape', onPress: () => stop() },
    { verb: 'iso', label: `${CUBE}Iso`, key: 'V', onPress: () => setView(!isoOn) },
  ],
  quality: true,
  keys: [['drag a ball', 'swing it'], ['drag across', 'lift a row'], [coarse ? 'hold' : 'hold / shift', 'rush time']],
} });
const chipFor = key => document.querySelector(`.stim-ui .s2-chip[aria-keyshortcuts="${key}"]`);
const relBtn = chipFor('Space'), stopBtn = chipFor('Escape'), viewBtn = chipFor('V');
// The Stop chip prints the short key name.
stopBtn.querySelector('.s2-kbd').textContent = 'Esc';
viewBtn.setAttribute('aria-label', 'Isometric view');
ui.action('stop').disabled = true;
const panel = document.getElementById('stage');
let reduce = reduced();
onReducedChange(on => { reduce = on; });
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);

/* ---------- the machine: each count has its own tuned rig ---------- */
// Pendulum n swings K + n times per CYCLE seconds.
// GAP spaces the row; BALL is the bob radius in scene units.
// The longest string is 1 and swings in about 1.2 seconds.
const RIGS = {
  12: { K: 20, CYCLE: 24, GAP: 0.2, BALL: 0.068 },
  20: { K: 34, CYCLE: 40, GAP: 0.16, BALL: 0.058 },
  32: { K: 54, CYCLE: 64, GAP: 0.116, BALL: 0.046 },
};
const NMAX = 32;
// Gentle air drag; 0 keeps every later cycle exact too.
const DAMP = 0.012;
const H = 1 / 240;
const LEN = new Float64Array(NMAX), ZP = new Float64Array(NMAX), OM = new Float64Array(NMAX), OM2 = new Float64Array(NMAX);
const TH = new Float64Array(NMAX), VE = new Float64Array(NMAX), AIM = new Float64Array(NMAX), HOLD = new Uint8Array(NMAX);
let N = 0, rig = RIGS[20], vee = 0.05;
// Held balls ride springs: 1 is the hand, 2 the lift.
const HAND_K = 150, HAND_C = 2 * 0.85 * Math.sqrt(HAND_K), LIFT_K = 60, LIFT_C = 2 * Math.sqrt(LIFT_K);
const swing = () => (reduce ? 0.16 : 0.36);
const reach = () => (reduce ? 0.35 : 1.15);
let simT = 0, goAt = -1, stopAt = -1;

function agm(a, b) {
  for (let k = 0; k < 8; k++) [a, b] = [(a + b) / 2, Math.sqrt(a * b)];
  return a;
}
// Wide swings run slow by 1 / agm(1, cos(A / 2)).
// Drag shrinks the swing, so the first cycle averages that slowdown.
// The first realignment then lands at exactly one CYCLE.
function slowFor(A) {
  let pace = 0;
  for (let k = 0; k < 64; k++) pace += agm(1, Math.cos((A * Math.exp((-DAMP * rig.CYCLE * (k + 0.5)) / 128)) / 2)) / 64;
  return 1 / pace;
}
function tuneOne(n, A) {
  OM[n] = ((TAU * (rig.K + n)) / rig.CYCLE) * slowFor(Math.abs(A));
  OM2[n] = OM[n] * OM[n];
}

function acc(n, th, v, brake) {
  if (HOLD[n] === 1) return HAND_K * (AIM[n] - th) - HAND_C * v;
  if (HOLD[n] === 2) return LIFT_K * (AIM[n] - th) - LIFT_C * v;
  return -OM2[n] * Math.sin(th) - (DAMP + brake * OM[n]) * v;
}
// One RK4 step for every pendulum; bottom passes are logged.
// rt is the real time one step takes, so strikes keep their timing.
function step(h, at, hits, rt) {
  // Stop ramps the brake up to critical damping.
  const brake = stopAt < 0 ? 0 : 2 * clamp((simT - stopAt) / 0.35);
  for (let n = 0; n < N; n++) {
    const th = TH[n], v = VE[n];
    const a1 = acc(n, th, v, brake);
    const v2 = v + 0.5 * h * a1, a2 = acc(n, th + 0.5 * h * v, v2, brake);
    const v3 = v + 0.5 * h * a2, a3 = acc(n, th + 0.5 * h * v2, v3, brake);
    const v4 = v + h * a3, a4 = acc(n, th + h * v3, v4, brake);
    TH[n] = th + (h / 6) * (v + 2 * v2 + 2 * v3 + v4);
    VE[n] = v + (h / 6) * (a1 + 2 * a2 + 2 * a3 + a4);
    // Passing the bottom left to right strikes once per swing.
    if (!HOLD[n] && th < 0 && TH[n] >= 0 && VE[n] > 0) {
      const amp = 2 * Math.asin(Math.min(1, VE[n] / (2 * OM[n])));
      if (amp > 0.02) hits.push({ n, at: at + (rt * -th) / (TH[n] - th), amp });
    }
  }
  simT += h;
}
// A let-go never carries more energy than a swing to 75 degrees.
function cap(n) {
  const room = 2 * OM2[n] * (Math.cos(TH[n]) - Math.cos(1.3));
  const top = room > 0 ? Math.sqrt(room) : 0;
  VE[n] = clamp(VE[n], -top, top);
}
// Phase coherence: 1 when every swinging ball moves as one.
function coherence() {
  let sx = 0, sy = 0, k = 0;
  for (let n = 0; n < N; n++) {
    if (HOLD[n]) return NaN;
    const q = VE[n] / OM[n], a = Math.hypot(TH[n], q);
    if (a < 0.02) continue;
    sx += TH[n] / a;
    sy += q / a;
    k++;
  }
  return k >= N - 2 ? Math.hypot(sx, sy) / k : 0;
}

/* ---------- release patterns ---------- */
// Each pattern maps pendulum n of c to a lift from -1 to 1.
const PATS = [
  ['line', () => 1],
  ['ramp', (n, c) => 1 - (2 * n) / (c - 1)],
  ['zip', n => (n % 2 ? -1 : 1)],
  ['wave', (n, c) => Math.cos((TAU * n) / (c - 1))],
];
let pat = 0;
// The chip glyph draws the next pattern as seven solid bars.
function showPattern() {
  const [name, f] = PATS[pat];
  let bars = '';
  for (let i = 0; i < 7; i++) {
    const v = f(i, 7), h = Math.max(1, Math.abs(v) * 5);
    bars += `<rect x="${i * 3}" y="${(v >= 0 ? 6 - h : 6).toFixed(2)}" width="2" height="${h.toFixed(2)}"/>`;
  }
  relBtn.querySelector('.pat').innerHTML = bars;
  relBtn.setAttribute('aria-label', `Release, ${name} pattern`);
}
showPattern();

/* ---------- commands ---------- */
// Release: the row rises to the pattern, then lets go together.
function release() {
  if (!ready || phase) return;
  endDrag();
  stopAt = -1;
  const a = swing(), f = PATS[pat][1];
  for (let n = 0; n < N; n++) { HOLD[n] = 2; AIM[n] = a * f(n, N); }
  goAt = simT + (reduce ? 0.8 : 1.05);
  pat = (pat + 1) % PATS.length;
  showPattern();
  wake();
}
function letGo() {
  goAt = -1;
  for (let n = 0; n < N; n++) {
    TH[n] = AIM[n];
    VE[n] = 0;
    HOLD[n] = 0;
    tuneOne(n, AIM[n]);
  }
  // The first realignment is a full cycle away.
  armed = false;
  rPrev = 1;
}
// Stop: a brake eases every ball to rest.
function stop() {
  if (!ready) return;
  endDrag();
  goAt = -1;
  HOLD.fill(0);
  stopAt = simT;
  wake();
}

/* ---------- sound: tuned bars, a room and a drone ---------- */
const kit = audioKit({ gain: 0.6, keys: new Set([' ', 'Enter']), noiseSeconds: 1, sleepMs: 4000 });
// D major pentatonic from D3: long strings sit low.
const ROOT = 146.83, STEPS = [0, 2, 4, 7, 9];
const PITCH = new Float64Array(NMAX), PAN = new Float64Array(NMAX);
const MAXV = 40, LEAD = 0.006;
let rigA = null, voices = 0, tokens = 8, tokenAt = 0, humAt = 0;
const jit = x => 1 + (Math.random() * 2 - 1) * x;

// A stereo room: noise that darkens and dies over the tail.
function room(a, sec) {
  const len = Math.round(a.sampleRate * sec), pre = Math.round(a.sampleRate * 0.012);
  const buf = a.createBuffer(2, len, a.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    let lp = 0;
    for (let i = pre; i < len; i++) {
      const t = i / len;
      lp += (0.6 - 0.48 * t) * (Math.random() * 2 - 1 - lp);
      d[i] = lp * (1 - t) ** 3;
    }
  }
  return buf;
}
// The bus builds once: a dry path, a reverb send and the drone.
function bus() {
  if (rigA) return rigA;
  const a = kit.ac;
  const dry = a.createGain(), wet = a.createGain(), verb = a.createConvolver();
  dry.connect(kit.out);
  verb.buffer = room(a, 2.6);
  wet.gain.value = 0.3;
  wet.connect(verb).connect(kit.out);
  // The drone swells while the row moves as one.
  const pad = a.createGain(), lp = a.createBiquadFilter();
  pad.gain.value = 0;
  lp.type = 'lowpass';
  lp.frequency.value = 760;
  lp.Q.value = 0.4;
  lp.connect(pad);
  pad.connect(dry);
  pad.connect(wet);
  for (const [r, cents] of [[1, -6], [1, 6], [1.5, 0], [2, -3]]) {
    const o = a.createOscillator();
    o.type = 'triangle';
    o.frequency.value = ROOT * r;
    o.detune.value = cents;
    o.connect(lp);
    o.start();
  }
  rigA = { dry, wet, pad };
  return rigA;
}
function track(src, ...tails) {
  voices++;
  src.onended = () => { voices--; tails.forEach(t => t.disconnect()); };
}
// A tuned bar: a sine, its fourth partial and a mallet tick.
// Soft strikes swell in slowly and skip the tick, like a pluck.
function chime(n, amp, at = 0, soft = false) {
  const a = kit.live();
  if (!a || voices >= MAXV || !(amp > 0)) return;
  const R = bus();
  const t = a.currentTime + LEAD + Math.max(0, at), f = PITCH[n] * jit(0.002);
  // High notes sit quieter, so the row sounds even.
  const g = (0.07 * amp * (300 / f) ** 0.25) / Math.sqrt(N / 12) / (1 + 0.03 * voices);
  const tau = 0.32 * (300 / f) ** 0.4, att = soft ? 0.014 : 0.0015, end = t + att + tau * 4.6;
  const pan = a.createStereoPanner();
  pan.pan.value = PAN[n];
  pan.connect(R.dry);
  pan.connect(R.wet);
  const o = a.createOscillator(), og = a.createGain();
  o.frequency.value = f;
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(g, t + att);
  og.gain.setTargetAtTime(0, t + att, tau);
  o.connect(og).connect(pan);
  // The fourth partial gives the bar its woody ring.
  const o2 = a.createOscillator(), og2 = a.createGain();
  o2.frequency.value = f * 3.93;
  og2.gain.setValueAtTime(0, t);
  og2.gain.linearRampToValueAtTime(g * (soft ? 0.08 : 0.28) * Math.min(1, amp + 0.3), t + att);
  og2.gain.setTargetAtTime(0, t + att, tau * 0.16);
  o2.connect(og2).connect(pan);
  o.start(t);
  o2.start(t);
  o.stop(end);
  o2.stop(end);
  const tails = [og, og2, pan];
  if (!soft && kit.noise) {
    const src = a.createBufferSource(), bp = a.createBiquadFilter(), ng = a.createGain();
    src.buffer = kit.noise;
    bp.type = 'bandpass';
    bp.frequency.value = Math.min(6000, f * 5);
    bp.Q.value = 1.2;
    ng.gain.setValueAtTime(0, t);
    ng.gain.linearRampToValueAtTime(g * 0.35, t + 0.0006);
    ng.gain.setTargetAtTime(0, t + 0.0006, 0.003);
    src.connect(bp).connect(ng).connect(pan);
    src.start(t, Math.random() * 0.9, 0.03);
    tails.push(bp, ng);
  }
  track(o, ...tails);
}
// Bottom passes from one frame, replayed with their own timing.
function chimes(list) {
  const a = kit.live();
  if (!a || !list.length) return;
  // A bucket refills 22 strikes a second, so crowds thin out.
  tokens = Math.min(8, tokens + (a.currentTime - tokenAt) * 22);
  tokenAt = a.currentTime;
  list.sort((p, q) => p.at - q.at);
  for (let i = 0; i < list.length;) {
    let j = i + 1;
    while (j < list.length && list[j].at - list[i].at < 0.006) j++;
    // Near-simultaneous passes share one chord of up to four notes.
    const k = j - i, take = Math.min(4, k), g = 1 / Math.sqrt(take);
    for (let m = 0; m < take && tokens >= 1; m++, tokens--) {
      const c = list[i + Math.floor(((m + 0.5) * k) / take)];
      chime(c.n, clamp(c.amp / 0.36) ** 0.7 * g, c.at);
    }
    i = j;
  }
}
// A small bell rings when the whole row lines up again.
function bell() {
  const a = kit.live();
  if (!a) return;
  const R = bus();
  const t = a.currentTime + LEAD, f = ROOT * 4, end = t + 6;
  const tone = a.createGain();
  tone.gain.value = 0.05;
  tone.connect(R.dry);
  tone.connect(R.wet);
  // Partials: ratio, level, decay; a detuned twin makes it shimmer.
  const parts = [[1, 1, 1.5], [1.0028, 0.55, 1.8], [2, 0.32, 0.8], [3.01, 0.18, 0.45], [4.17, 0.09, 0.3], [5.43, 0.05, 0.2]];
  const tails = [tone];
  let first = null;
  for (const [r, lv, tau] of parts) {
    const o = a.createOscillator(), og = a.createGain();
    o.frequency.value = f * r;
    og.gain.setValueAtTime(0, t);
    og.gain.linearRampToValueAtTime(lv, t + 0.004);
    og.gain.setTargetAtTime(0, t + 0.004, tau);
    o.connect(og).connect(tone);
    o.start(t);
    o.stop(end);
    tails.push(og);
    first = first || o;
  }
  track(first, ...tails);
}
// The drone follows coherence r and the mean swing a.
function hum(r, a) {
  const ac = kit.ac;
  if (!rigA || !ac || ac.state !== 'running') return;
  const target = 0.03 * r ** 3 * clamp(a / 0.25);
  if (target === humAt || (target > 0 && Math.abs(target - humAt) < 0.001)) return;
  humAt = target;
  rigA.pad.gain.setTargetAtTime(target, ac.currentTime, 0.35);
}

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
function lin(L, C, h) {
  const a = C * Math.cos((h * Math.PI) / 180), b = C * Math.sin((h * Math.PI) / 180);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
  ];
}
// Chroma shrinks until the colour fits sRGB.
function linear([L, C, h]) {
  let c = lin(L, C, h);
  for (let i = 0; i < 24 && (Math.min(...c) < -1e-4 || Math.max(...c) > 1.0001); i++) c = lin(L, (C *= 0.92), h);
  return c.map(v => clamp(v));
}
// Series hues, red through magenta, on one smooth curve.
const HUES = [
  [0.64, 0.2, 26], [0.74, 0.17, 52], [0.85, 0.16, 90], [0.8, 0.17, 148],
  [0.78, 0.13, 202], [0.64, 0.16, 252], [0.6, 0.2, 292], [0.67, 0.21, 328],
];
const cr = (a, b, c, d, t) => b + 0.5 * t * (c - a + t * (2 * a - 5 * b + 4 * c - d + t * (3 * (b - c) + d - a)));
function rainbow(t) {
  const u = t * (HUES.length - 1), i = Math.min(HUES.length - 2, Math.floor(u)), f = u - i;
  const p = [HUES[Math.max(0, i - 1)], HUES[i], HUES[i + 1], HUES[Math.min(HUES.length - 1, i + 2)]];
  return [0, 1, 2].map(k => cr(p[0][k], p[1][k], p[2][k], p[3][k], f));
}

/* ---------- trails: stencil afterimages in each swing plane ---------- */
// Each bob drags a flat band along its arc.
// The band is cut into dashes that narrow and darken with age.
const HIST = 60, BANDS = 5, SPAN = 0.5, CUT = 0.3;
const TRAIL_VS = /* glsl */ `
uniform float uNow, uGrow, uW, uSpan;
attribute vec3 aP;
varying float vAge, vOff, vN;
// position holds angle, sample time and side; aP holds length, z and index.
void main() {
  vAge = (uNow - position.y) / uSpan;
  vN = aP.z;
  vOff = position.z * uW;
  float r = aP.x * uGrow + vOff;
  // Newer samples sit a hair nearer the camera, so folds never fight.
  float z = aP.y + 0.004 * (1.0 - clamp(vAge, 0.0, 1.0));
  vec3 p = vec3(r * sin(position.x), -r * cos(position.x), z);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`;
const TRAIL_FS = /* glsl */ `
uniform sampler2D uBands;
uniform float uW;
varying float vAge, vOff, vN;
const float B = ${BANDS.toFixed(1)}, CUT = ${CUT.toFixed(2)};
void main() {
  float b = vAge * B, k = floor(b), f = b - k;
  // Derivatives come before any discard.
  float ew = max(fwidth(vOff), 1e-5), eb = max(fwidth(b), 1e-5);

  warpTo(dt);
  const sd = dt * warp, steps = Math.ceil(sd / H - 1e-6), h = steps ? sd / steps : 0, rt = h / warp;
  hits.length = 0;
  let fresh = false;
  for (let k = 0; k < steps; k++) {
    step(h, k * rt, hits, rt);
    if (goAt >= 0 && simT >= goAt - 1e-9) letGo();
    // Trails sample every second step, 120 times a second.
    if (++sub >= 2) { sub = 0; push(); fresh = true; }
  }
  chimes(hits);
  // The bell rings at the peak of a return to full coherence.
  const r = coherence();
  if (Number.isNaN(r)) rPrev = 0;
  else {
    if (r < 0.4) armed = true;
    if (armed && rPrev > 0.97 && r < rPrev) { armed = false; bell(); }
    rPrev = r;
  }
  let busy = ptr >= 0 || goAt >= 0 || phase > 0, moving = false, sum = 0;
  for (let n = 0; n < N; n++) {
    if (HOLD[n]) { busy = true; continue; }
    // Swings under a pixel come to rest.
    const a = Math.hypot(TH[n], VE[n] / OM[n]);
    if (a < 0.0015) TH[n] = VE[n] = 0;
    else { moving = true; sum += a; }
  }
  if (!moving) stopAt = -1;
  if (busy || moving) quietAt = simT;
  hum(Number.isNaN(r) ? 0 : r, sum / N);
  showWarp(moving ? warp : 1);
  showStop((moving || goAt >= 0) && stopAt < 0);
  draw(fresh);
  // The loop runs on until the last dash has faded.
  if (busy || moving || simT - quietAt < SPAN) {
    if (onScreen) raf = requestAnimationFrame(frame);
  } else {
    warp = 1;
    showStop(false);
    hum(0, 0);
    kit.rest(() => !raf && ptr < 0);
  }
}

/* ---------- input ---------- */
let ptr = -1, solo = false, px0 = 0, py0 = 0;
const A2 = [0, 0], B2 = [0, 0], V3 = { x: 0, y: 0 };
function local(e) {
  const r = panel.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
function screen(v, o) {
  tmp.copy(v).project(camera);
  o[0] = (tmp.x + 1) * 0.5 * pw;
  o[1] = (1 - tmp.y) * 0.5 * ph;
  return o;
}
// A ball's radius on screen, in panel pixels.
function radiusPx(v) {
  if (camera === iso) return (rig.BALL * ph) / (iso.top - iso.bottom);
  return (rig.BALL / camera.position.distanceTo(v)) * (ph / 2 / Math.tan((camera.fov * Math.PI) / 360));
}
// The nearest ball under the pointer, or -1.
function pick(x, y) {
  let best = -1, bd = Infinity;
  const v = new THREE.Vector3();
  for (let n = 0; n < N; n++) {
    ballAt(n, v);
    const [sx, sy] = screen(v, A2), rp = radiusPx(v), d = camera.position.distanceTo(v);
    if (Math.hypot(sx - x, sy - y) < rp * 1.3 + 4 && d < bd) { bd = d; best = n; }
  }
  return best;
}
function grab(n) {
  HOLD[n] = 1;
  AIM[n] = TH[n];
}
const side = (ax, ay, bx, by, cx, cy) => (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
function segDist(x, y, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, t = clamp(((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy || 1));
  return Math.hypot(x - ax - t * dx, y - ay - t * dy);
}
// Sweeping catches every pendulum whose string the pointer crosses.
// Each caught string plucks its note, so a sweep strums the row.
function sweep(x0, y0, x1, y1) {
  const v = new THREE.Vector3();
  for (let n = 0; n < N; n++) {
    if (HOLD[n]) continue;
    const [ax, ay] = screen(v.set(0, 0, ZP[n]), A2);
    ballAt(n, v);
    const rp = radiusPx(v), [bx0, by0] = screen(v, B2), l = Math.hypot(bx0 - ax, by0 - ay) || 1;
    const bx = bx0 + ((bx0 - ax) / l) * rp, by = by0 + ((by0 - ay) / l) * rp;
    const crossed = side(x0, y0, x1, y1, ax, ay) * side(x0, y0, x1, y1, bx, by) <= 0
      && side(ax, ay, bx, by, x0, y0) * side(ax, ay, bx, by, x1, y1) <= 0;
    if (crossed || segDist(x1, y1, ax, ay, bx, by) < Math.max(4, rp * 0.6)) {
      grab(n);
      chime(n, 0.5, 0, true);
    }
  }
}
// Held balls aim at the pointer's ray where it meets their plane.
function aimAll(x, y) {
  ndc.set((x / pw) * 2 - 1, 1 - (y / ph) * 2);
  ray.setFromCamera(ndc, camera);
  const o = ray.ray.origin, d = ray.ray.direction, top = reach();
  for (let n = 0; n < N; n++) {
    if (HOLD[n] !== 1 || Math.abs(d.z) < 1e-6) continue;
    const t = (ZP[n] - o.z) / d.z;
    if (t <= 0) continue;
    V3.x = o.x + d.x * t;
    V3.y = o.y + d.y * t;
    if (solo) AIM[n] = clamp(Math.atan2(V3.x, -V3.y), -top, top);
    else {
      // A swept ball rises to the pointer's height, on its side.
      const a = Math.acos(clamp(-V3.y / LEN[n], -1, 1));
      const sg = Math.abs(V3.x) > 1e-4 ? Math.sign(V3.x) : Math.sign(TH[n]) || 1;
      AIM[n] = sg * Math.min(top, a);
    }
  }
}
function endDrag() {
  if (ptr < 0) return;
  ptr = -1;
  for (let n = 0; n < N; n++) if (HOLD[n] === 1) { HOLD[n] = 0; cap(n); }
  panel.classList.remove('held');
  wake();
}
panel.addEventListener('pointerdown', e => {
  if (!ready || phase || ptr >= 0 || (e.pointerType === 'mouse' && e.button !== 0)) return;
  // Grabbing cancels a lift or a stop in progress.
  if (goAt >= 0) { goAt = -1; HOLD.fill(0); }
  stopAt = -1;
  const [x, y] = local(e), i = pick(x, y);
  ptr = e.pointerId;
  pressAt = performance.now();
  solo = i >= 0;
  if (solo) { grab(i); chime(i, 0.3, 0, true); }
  else sweep(x, y, x, y);
  aimAll(x, y);
  px0 = x;
  py0 = y;
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  panel.classList.add('held');
  wake();
});
panel.addEventListener('pointermove', e => {
  if (!ready) return;
  const [x, y] = local(e);
  if (e.pointerId === ptr) {
    if (!solo) sweep(px0, py0, x, y);
    aimAll(x, y);
    px0 = x;
    py0 = y;
    wake();
    return;
  }
  if (e.pointerType === 'touch' || ptr >= 0 || phase) return;
  panel.classList.toggle('grab', pick(x, y) >= 0);
});
const letPtr = e => { if (e.pointerId === ptr) endDrag(); };
panel.addEventListener('pointerup', letPtr);
panel.addEventListener('pointercancel', letPtr);
panel.addEventListener('lostpointercapture', letPtr);
panel.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') panel.classList.remove('grab'); });
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'Shift') { shiftHeld = true; wake(); }
});
addEventListener('keyup', e => { if (e.key === 'Shift') shiftHeld = false; });
addEventListener('blur', () => { shiftHeld = false; });
// Stop is live while the row swings or lifts, and not yet braking.
let stopLive = false;
function showStop(on) {
  if (on === stopLive) return;
  stopLive = on;
  ui.action('stop').disabled = !on;
}
// The Iso chip swaps the swinging camera for a fixed iso view.
let isoOn = store.get(VIEW_KEY) === 'iso';
function setView(on) {
  isoOn = on;
  store.set(VIEW_KEY, on ? 'iso' : 'persp');
  viewBtn.setAttribute('aria-pressed', String(on));
  if (!persp) return;
  camera = on ? iso : persp;
  if (ready) draw(false);
}
viewBtn.setAttribute('aria-pressed', String(isoOn));
nextN = savedN;
whenVisible(panel, on => { onScreen = on; if (on) wake(); });

/* ---------- start: WebGL setup in idle slices ---------- */
function failed() {
  panel.querySelector('.fail').hidden = false;
}
// The row drops in once the intro card has gone.
function introGone() {
  return new Promise(r => {
    const el = document.querySelector('.intro');
    if (!el || !el.parentNode) return r();
    const mo = new MutationObserver(() => { if (!el.isConnected) { mo.disconnect(); r(); } });
    mo.observe(el.parentNode, { childList: true });
    setTimeout(() => { mo.disconnect(); r(); }, 6000);
  });
}
// A studio for reflections: three soft boxes in a dark dome.
// Each bead's clear coat catches one broad key and one rim strip.
function studio() {
  const env = new THREE.Scene(), parts = [];
  const add = (geo, color, side, x = 0, y = 0, z = 0) => {
    const mat = new THREE.MeshBasicMaterial({ color, side });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    if (x || y || z) mesh.lookAt(0, 0, 0);
    env.add(mesh);
    parts.push(geo, mat);
  };
  add(new THREE.SphereGeometry(30, 32, 16), new THREE.Color().setRGB(0.014, 0.013, 0.022), THREE.BackSide);
  // The key box sits up and left, behind the viewer.
  add(new THREE.PlaneGeometry(16, 10), new THREE.Color().setScalar(5), THREE.DoubleSide, -9, 14, 12);
  // A tall strip at the far end draws a rim down every bead.
  add(new THREE.PlaneGeometry(3, 22), new THREE.Color().setRGB(2.2, 2.3, 2.6), THREE.DoubleSide, 16, 2, -6);
  // A faint, cool floor bounce lifts the undersides.
  add(new THREE.PlaneGeometry(26, 8), new THREE.Color().setRGB(0.32, 0.36, 0.5), THREE.DoubleSide, 0, -16, 4);
  return { env, dispose: () => parts.forEach(p => p.dispose()) };
}
async function start() {
  try {
    THREE = await import('three');
  } catch (err) {
    console.error(err);
    return failed();
  }
  stage('build');
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (err) {
    console.error(err);
    return failed();
  }
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.NeutralToneMapping;
  const canvas = renderer.domElement;
  canvas.setAttribute('aria-hidden', 'true');
  scene = new THREE.Scene();
  persp = new THREE.PerspectiveCamera(30, 16 / 9, 0.05, 60);
  iso = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 40);
  camera = isoOn ? iso : persp;
  ray = new THREE.Raycaster();
  ndc = new THREE.Vector2();
  tmp = new THREE.Vector3();
  look = new THREE.Vector3();
  await idle();

  const pm = new THREE.PMREMGenerator(renderer);
  const room = studio();
  scene.environment = pm.fromScene(room.env, 0.04).texture;
  scene.environmentIntensity = 0.8;
  room.dispose();
  pm.dispose();
  // A warm key from upper left gives each bead one crisp highlight.
  const key = new THREE.DirectionalLight(0xffffff, 2.4);
  key.color.setRGB(...linear([0.97, 0.03, 75]));
  key.position.set(-2.5, 3, 3.5);
  // A cool rim from the far end cuts each bead's outline.
  const rim = new THREE.DirectionalLight(0xffffff, 1.6);
  rim.color.setRGB(...linear([0.8, 0.12, 255]));
  rim.position.set(2.5, 1.2, -4);
  scene.add(key, rim);

  bar = makeBeam();
  scene.add(bar);

  // Lacquered beads: a clear coat over the rainbow.
  const small = Math.min(innerWidth, innerHeight) < 700;
  balls = new THREE.InstancedMesh(
    bead(small ? 32 : 48),
    new THREE.MeshPhysicalMaterial({ color: 0xffffff, vertexColors: true, roughness: 0.24, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05 }),
    NMAX,
  );
  balls.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  balls.frustumCulled = false;
  M = balls.instanceMatrix.array;
  balls.setColorAt(0, new THREE.Color(1, 1, 1));
  scene.add(balls);

  strings = makeStrings();
  scene.add(strings);

  trails = makeTrails();
  scene.add(trails);

  build(nextN);
  panel.prepend(canvas);
  fitRenderer(2, (w, h) => {
    const su = strings.material.uniforms;
    renderer.getDrawingBufferSize(su.uRes.value);
    su.uPx.value = STRING_PX * renderer.getPixelRatio();
    fit(w, h);
    if (ready) draw(false);
  }, 2.2e6);
  if (pw === 1) fit(16, 9);
  // Corner rows that move or resize refit the row.
  if (layer) {
    const refit = () => { if (pw > 1) { fit(pw, ph); if (ready) draw(false); } };
    const ro = new ResizeObserver(refit);
    corners().forEach(el => ro.observe(el));
    const keys = layer.querySelector(':scope > .s2-keys');
    if (keys) ro.observe(keys);
    new MutationObserver(refit).observe(layer.parentElement, { attributes: true, attributeFilter: ['data-narrow', 'data-stack', 'data-tight'] });
  }
  await idle();
  // Async compile keeps the physical-material build off the main thread.
  await renderer.compileAsync(scene, camera);
  ready = true;
  draw(false);
  requestAnimationFrame(() => canvas.classList.add('on'));
  stage('first-frame');
  // A count picked during the intro builds that row first.
  if (nextN !== N) build(nextN);
  await introGone();
  if (!dropped) drop();
}
start().catch(err => { console.error(err); failed(); });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
import { pageReady } from '../shared/stim.js';
// The intro holds until the page, its font and the first frame are in.
playIntro({ ready: pageReady() });
</script>
