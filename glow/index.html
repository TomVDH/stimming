<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.15 0.01 160); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glow paper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Glow paper: one dark sheet, a UV torch, a green trace that fades. */
:root { --stage: oklch(0.09 0.008 160); }
.stage--glow { cursor: crosshair; }
.stage--glow canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--glow canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--glow canvas { transition: none; } }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.012 160 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Glow paper</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--glow" id="stage" tabindex="0" role="application" aria-label="A dark sheet of glow paper. Hold and drag the UV torch to write; the trace glows and fades.">
      <p class="fail" hidden>Glow paper needs WebGL2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" id="tint" role="group" aria-label="Glow">
        <button class="chip" type="button" data-value="green" aria-pressed="true"><span class="dot" style="background:oklch(0.86 0.2 150)"></span>Green</button>
        <button class="chip" type="button" data-value="aqua" aria-pressed="false"><span class="dot" style="background:oklch(0.85 0.13 188)"></span>Aqua</button>
        <button class="chip" type="button" data-value="blue" aria-pressed="false"><span class="dot" style="background:oklch(0.76 0.13 238)"></span>Blue</button>
      </div>
      <label class="slider"><span>Fade</span><input type="range" id="fade" min="0" max="1" step="0.01" value="0.5" aria-label="Fade: how long the glow lasts"></label>
      <div class="actions">
        <button class="chip" id="flash" type="button">Flash</button>
        <button class="chip" id="clear" type="button">Clear</button>
      </div>
      <div class="edge">
        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings">
            <div class="group"><span>Torch</span><div class="choices" id="size" role="group" aria-label="Torch size">
              <button class="chip" type="button" data-value="pen" aria-pressed="false">Pen</button>
              <button class="chip" type="button" data-value="torch" aria-pressed="true">Torch</button>
              <button class="chip" type="button" data-value="lamp" aria-pressed="false">Lamp</button>
            </div></div>
          </div>
        </div>
        <dl class="how" aria-label="How to play">
          <div><dt>Drag</dt><dd>write with the torch</dd></div>
          <div><dt>Hold</dt><dd>soak one spot</dd></div>
          <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>a dot</dd></div>
          <div class="fine"><dt><kbd>Space</kbd> + arrows</dt><dd>write</dd></div>
        </dl>
      </div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Glow paper</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, choices, fitCanvas, whenVisible, reduced, onReducedChange, linFit, quality, qualitySetting, onQuality } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
const introDone = playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });
initPage({ id: 'glow' });
// Settings holds the site-wide Quality choice.
qualitySetting(document.getElementById('sets'));

const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.glow.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.glow.${k}`, String(v)); } catch { /* storage is optional */ } };
const opts = {
  tint: saved('tint') || 'green',
  fade: saved('fade') != null ? +saved('fade') : 0.5,
  size: saved('size') || 'torch',
};
let reduce = reduced();
onReducedChange(v => { reduce = v; });
// Each phosphor glows in one hue; the torch makes it fluoresce paler.
const TINTS = {
  green: { glow: [0.86, 0.2, 150], fluo: [0.96, 0.11, 140] },
  aqua: { glow: [0.85, 0.13, 188], fluo: [0.96, 0.08, 180] },
  blue: { glow: [0.76, 0.13, 238], fluo: [0.93, 0.07, 225] },
};
const UV = linFit(0.42, 0.24, 298);
// Torch size sets the pool radius as a share of the short side.
const SIZES = { pen: 0.07, torch: 0.11, lamp: 0.17 };
// Afterglow has a fast flash and a slow tail, in seconds.
const tails = () => { const s = Math.pow(4, opts.fade - 0.5); return [2.5 * s, 25 * s]; };
// The visible glow mixes the two tails at fixed weights.
const MIX = [0.55, 0.45];

/* ---------- WebGL2 ---------- */
const stage = document.getElementById('stage');
const canvas = document.createElement('canvas');
canvas.setAttribute('aria-hidden', 'true');
stage.prepend(canvas);
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
const fail = () => { stage.querySelector('.fail').hidden = false; markReady(); throw new Error('no webgl2'); };
if (!gl) fail();
// Half floats keep faint glow smooth; bytes are the fallback.
const FLOAT = !!gl.getExtension('EXT_color_buffer_float');

const QUAD_VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
const NOISE = `
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
`;

/* ---------- K1: accumulation and decay ---------- */
// Copied from Star trails.
// Change: the charge blends by MAX, so a new pass recharges, never doubles.
// Change: red holds the fast tail, green the slow tail; each decays alone.
const DECAY = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec4 uK; uniform float uEps; in vec2 vUv; out vec4 o;
void main() { vec4 c = texture(uSrc, vUv) * uK; o = max(c - uEps, 0.0); }`;
// A segment draws as a soft capsule.
// Change: MAX blending needs round ends, not ramps that add up.
const SEG_VS = `#version 300 es
in vec2 aCorner; in vec4 aSeg; in vec4 aCol;
uniform vec2 uRes;
out vec2 vP; flat out vec4 vSeg; flat out vec4 vCol;
void main() {
  vec2 a = aSeg.xy, b = aSeg.zw; float w = aCol.a;
  vec2 d = b - a; float L = length(d);
  vec2 t = L > 1e-3 ? d / L : vec2(1, 0), n = vec2(-t.y, t.x);
  float r = w * 3.0 + 1.0;
  vec2 p = mix(a, b, aCorner.x * 0.5 + 0.5) + t * aCorner.x * r + n * aCorner.y * r;
  vP = p; vSeg = aSeg; vCol = aCol;
  gl_Position = vec4(p / uRes * 2.0 - 1.0, 0.0, 1.0);
}`;
const SEG_FS = `#version 300 es
precision highp float;
in vec2 vP; flat in vec4 vSeg; flat in vec4 vCol; out vec4 o;
void main() {
  vec2 a = vSeg.xy, b = vSeg.zw; float w = vCol.a;
  vec2 d = b - a; float L = length(d);
  float h = L < 0.05 ? 0.0 : clamp(dot(vP - a, d) / (L * L), 0.0, 1.0);
  float r = length(vP - a - d * h) / w;
  o = vec4(vCol.rgb * exp(-r * r), 1.0);
}`;
// A flat value fills the whole plate, for the flash.
const FILL_FS = `#version 300 es
precision highp float;
uniform vec4 uV; out vec4 o;
void main() { o = uV; }`;
// A plain copy carries the plate across a resize.
const COPY_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; in vec2 vUv; out vec4 o;
void main() { o = texture(uSrc, vUv); }`;

function program(vs, fs, attrs) {
  const p = gl.createProgram();
  [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(([type, src]) => {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(sh)); fail(); }
    gl.attachShader(p, sh);
  });
  attrs.forEach((name, i) => gl.bindAttribLocation(p, i, name));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); fail(); }
  const u = {};
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(p, i).name; u[n] = gl.getUniformLocation(p, n); }
  return { p, u };
}

const corners = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
const quadVao = gl.createVertexArray();
gl.bindVertexArray(quadVao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, corners, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// Segment data: a.xy, b.xy in pixels, then fast and slow charge and width.
const MAXSEG = 4096;
const inst = new Float32Array(MAXSEG * 8);
const segVao = gl.createVertexArray();
gl.bindVertexArray(segVao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, corners, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const instBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
gl.bufferData(gl.ARRAY_BUFFER, inst.byteLength, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(1);
gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 0);
gl.vertexAttribDivisor(1, 1);
gl.enableVertexAttribArray(2);
gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16);
gl.vertexAttribDivisor(2, 1);
gl.bindVertexArray(null);

function target(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (FLOAT) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
  [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fb, w, h };
}
const drop = t => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); };
let acc = [], ai = 0;
const clearAcc = () => acc.forEach(a => { gl.bindFramebuffer(gl.FRAMEBUFFER, a.fb); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); });

function decayPass(dt, speed) {
  const src = acc[ai], dst = acc[1 - ai];
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, dst.w, dst.h);
  gl.useProgram(P.decay.p); gl.bindVertexArray(quadVao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(P.decay.u.uSrc, 0);
  const [a, b] = tails();
  gl.uniform4f(P.decay.u.uK, Math.exp(-dt * speed / a), Math.exp(-dt * speed / b), 1, 1);
  gl.uniform1f(P.decay.u.uEps, FLOAT ? 0.0002 * dt : 0.6 / 255);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ai = 1 - ai;
}
const maxBlend = on => {
  if (on) { gl.enable(gl.BLEND); gl.blendEquation(gl.MAX); gl.blendFunc(gl.ONE, gl.ONE); }
  else { gl.blendEquation(gl.FUNC_ADD); gl.disable(gl.BLEND); }
};
function segPass(dst, count) {
  if (!count) return;
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, dst.w, dst.h);
  gl.useProgram(P.seg.p); gl.bindVertexArray(segVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst, 0, count * 8);
  gl.uniform2f(P.seg.u.uRes, dst.w, dst.h);
  maxBlend(true);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
  maxBlend(false);
}
/* ---------- end K1 ---------- */

/* ---------- the sheet ---------- */
// The sheet: paper fibre, glow from the charge, and the UV pool.
const SHEET_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uRes, uTorch, uMix; uniform float uR, uOn, uFlash;
uniform vec3 uGlow, uFluo, uUv;
in vec2 vUv; out vec4 o;
${NOISE}
void main() {
  vec2 px = vUv * uRes;
  float S = min(uRes.x, uRes.y);
  vec2 q = px / S;
  // Fibres run mostly along one axis, as in pressed paper.
  float fib = fbm(q * vec2(9.0, 38.0)) * 0.6 + fbm(q * 90.0) * 0.4;
  float grain = 0.82 + 0.36 * fib;
  vec3 paper = vec3(0.0045, 0.0055, 0.005) * grain;
  float ch = dot(texture(uSrc, vUv).rg, uMix);
  vec3 c = paper + uGlow * ch * grain * 1.4;
  // The torch pool: a hot core, a soft disc and a faint outer halo.
  float r = length(px - uTorch) / uR;
  float core = exp(-r * r * 3.0);
  float disc = smoothstep(1.0, 0.86, r) * (0.9 + 0.1 * sin(r * 19.0));
  float halo = exp(-r * r * 0.35);
  // The whole lit spot fluoresces; the edge and halo show violet.
  c += uFluo * (core * 0.45 + disc * 0.2) * uOn * grain;
  c += uGlow * disc * 0.45 * uOn * grain;
  c += uUv * (disc * 0.12 + halo * 0.35 + smoothstep(0.75, 1.0, r) * disc * 0.7) * uOn * grain;
  // The flash lights the bare sheet for an instant.
  c += vec3(0.55, 0.6, 0.5) * grain * uFlash;
  o = vec4(c, 1.0);
}`;
// The bright pass keeps only light above a soft threshold.
const BRIGHT_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; in vec2 vUv; out vec4 o;
void main() { vec3 c = texture(uSrc, vUv).rgb; float l = max(c.r, max(c.g, c.b)); o = vec4(c * smoothstep(0.12, 0.7, l), 1.0); }`;
// A nine-tap blur runs once per axis.
const BLUR_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uDir; in vec2 vUv; out vec4 o;
void main() {
  vec3 s = texture(uSrc, vUv).rgb * 0.227;
  s += (texture(uSrc, vUv + uDir * 1.385).rgb + texture(uSrc, vUv - uDir * 1.385).rgb) * 0.316;
  s += (texture(uSrc, vUv + uDir * 3.231).rgb + texture(uSrc, vUv - uDir * 3.231).rgb) * 0.070;
  o = vec4(s, 1.0);
}`;
// The final pass: halation, vignette, grain and output curve.
const OUT_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc, uBloom, uWide; uniform vec2 uRes;
in vec2 vUv; out vec4 o;
${NOISE}
void main() {
  vec3 c = texture(uSrc, vUv).rgb + texture(uBloom, vUv).rgb * 0.45 + texture(uWide, vUv).rgb * 0.2;
  vec2 q = vUv - 0.5;
  c *= 1.0 - dot(q * vec2(1.0, 1.3), q) * 0.8;
  c = 1.0 - exp(-c * 1.25);
  c += (hash12(vUv * uRes) - 0.5) * 0.006;
  o = vec4(pow(max(c, 0.0), vec3(1.0 / 2.2)), 1.0);
}`;
const P = {
  decay: program(QUAD_VS, DECAY, ['aPos']),
  seg: program(SEG_VS, SEG_FS, ['aCorner', 'aSeg', 'aCol']),
  fill: program(QUAD_VS, FILL_FS, ['aPos']),
  copy: program(QUAD_VS, COPY_FS, ['aPos']),
  sheet: program(QUAD_VS, SHEET_FS, ['aPos']),
  bright: program(QUAD_VS, BRIGHT_FS, ['aPos']),
  blur: program(QUAD_VS, BLUR_FS, ['aPos']),
  out: program(QUAD_VS, OUT_FS, ['aPos']),
};

/* ---------- state ---------- */
let W = 1, H = 1, frame = null, bl = [], wd = [];
let t = 0, ready = false, flash = 0, clearUntil = -1, lastCharge = -1e9;
// The torch shows its pool at first, then clicks off after the intro.
const torch = { x: 0, y: 0, r: 1, on: 1, preview: true, ms: 0 };
let press = null, keyOn = false, tapUntil = -1, held = 0;
const segs = [];
const writing = () => !!press || keyOn || t < tapUntil;

/* ---------- the first view ---------- */
// A looped hand runs left to right and ends under the torch.
function looped(x0, x1, yc, loops, rad, wave, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const s = i / n, ph = s * loops * TAU;
    const r = rad * (0.82 + 0.25 * Math.sin(s * 9.0 + 1.3));
    const bx = lerp(x0, x1, s), by = yc + wave * Math.sin(s * 4.2 + 0.6);
    pts.push([bx - r * 0.9 * Math.sin(ph), by + r * Math.cos(ph) - r * 0.4, s]);
  }
  return pts;
}
// One stroke: each point carries the age its glow has reached.
function stroke(pts, age0, span, width) {
  const [fa, sl] = tails();
  let n = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const age = age0 + (1 - b[2]) * span;
    inst.set([a[0], a[1], b[0], b[1], Math.exp(-age / fa), Math.exp(-age / sl), 0, width], n * 8);
    if (++n >= MAXSEG) { segPass(acc[ai], n); n = 0; }
  }
  segPass(acc[ai], n);
}
// The first view holds an old faint loop and a fresh line of loops.
function preExpose() {
  clearAcc();
  const S = Math.min(W, H), tall = W < H;
  const yc = H * (tall ? 0.58 : 0.55);
  const x0 = W * (tall ? 0.12 : 0.17), x1 = W * (tall ? 0.8 : 0.7);
  const width = S * 0.01;
  // The ghost: a slow figure eight from about a minute ago.
  const g = [];
  for (let i = 0; i <= 360; i++) {
    const s = i / 360, a = s * TAU;
    g.push([W * (tall ? 0.5 : 0.62) + S * 0.3 * Math.sin(a), H * (tall ? 0.8 : 0.78) + S * 0.08 * Math.sin(2 * a), s]);
  }
  stroke(g, 55, 8, width * 1.3);
  const hand = looped(x0, x1, yc, tall ? 5 : 7, S * (tall ? 0.085 : 0.075), S * 0.05, 900);
  stroke(hand, 0.15, 16, width);
  const end = hand[hand.length - 1];
  torch.x = end[0] + S * 0.01; torch.y = end[1];
  lastCharge = t;
}

/* ---------- charge ---------- */
// The torch charges the paper along its path and soaks the spot it holds.
function charge(dt) {
  const on = writing();
  if (!on) held = 0;
  if (!on && !segs.length) return;
  const w = torch.r * 0.09;
  // Each segment carries its own time, so slow frames do not fake speed.
  let L = 0, T = 0;
  for (const s of segs) { L += Math.hypot(s[2] - s[0], s[3] - s[1]); T += s[4]; }
  const speed = T > 0 ? L / T : 0;
  // Only a nearly still torch soaks the spot under it.
  const still = speed < torch.r * 0.4;
  if (on) held = still ? held + dt : held * Math.exp(-dt * 10);
  const core = 1 - Math.exp(-(held + dt) * 8);
  const soak = 0.9 * (1 - Math.exp(-held / 1.4));
  let n = 0;
  for (const s of segs) {
    // Slow strokes take a full charge; fast flicks stay faint.
    const v = Math.hypot(s[2] - s[0], s[3] - s[1]) / Math.max(s[4], 1e-3);
    const k = 1 - Math.exp(-60 * w / Math.max(v, 1e-3));
    inst.set([s[0], s[1], s[2], s[3], k, k, 0, w], n * 8);
    if (++n >= MAXSEG - 2) { segPass(acc[ai], n); n = 0; }
  }
  // Moves queued before a release still draw; the dots need the torch on.
  if (on && still) inst.set([torch.x, torch.y, torch.x, torch.y, core, core, 0, w * 1.4], n++ * 8);
  if (on && soak > 0.01) inst.set([torch.x, torch.y, torch.x, torch.y, soak, soak, 0, torch.r * 0.42], n++ * 8);
  segPass(acc[ai], n);
  segs.length = 0;
  lastCharge = t;
}
function fillPass(v) {
  const dst = acc[ai];
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, dst.w, dst.h);
  gl.useProgram(P.fill.p); gl.bindVertexArray(quadVao);
  gl.uniform4f(P.fill.u.uV, v, v, 0, 1);
  maxBlend(true);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  maxBlend(false);
}
// The glow left on the plate, judged from the last charge.
const glowLeft = () => { const [a, b] = tails(), s = t - lastCharge; return MIX[0] * Math.exp(-s / a) + MIX[1] * Math.exp(-s / b); };

/* ---------- render ---------- */
function quad(dst, prog) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst ? dst.fb : null);
  gl.viewport(0, 0, dst ? dst.w : W, dst ? dst.h : H);
  gl.useProgram(prog.p); gl.bindVertexArray(quadVao);
}
const bind = (unit, tex, loc) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(loc, unit); };
function blur(pair) {
  quad(pair[1], P.blur); bind(0, pair[0].tex, P.blur.u.uSrc); gl.uniform2f(P.blur.u.uDir, 1 / pair[0].w, 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  quad(pair[0], P.blur); bind(0, pair[1].tex, P.blur.u.uSrc); gl.uniform2f(P.blur.u.uDir, 0, 1 / pair[0].h); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function render() {
  const T = TINTS[opts.tint];
  quad(frame, P.sheet);
  const u = P.sheet.u;
  bind(0, acc[ai].tex, u.uSrc);
  gl.uniform2f(u.uRes, W, H);
  gl.uniform2f(u.uTorch, torch.x, torch.y);
  gl.uniform2f(u.uMix, MIX[0], MIX[1]);
  gl.uniform1f(u.uR, torch.r);
  gl.uniform1f(u.uOn, torch.on);
  gl.uniform1f(u.uFlash, flash);
  gl.uniform3fv(u.uGlow, linFit(...T.glow));
  gl.uniform3fv(u.uFluo, linFit(...T.fluo));
  gl.uniform3fv(u.uUv, UV);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // Two blur sizes give a tight halo and a wide bloom.
  quad(bl[0], P.bright); bind(0, frame.tex, P.bright.u.uSrc); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  blur(bl);
  quad(wd[0], P.bright); bind(0, bl[0].tex, P.bright.u.uSrc); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  blur(wd); blur(wd);
  quad(null, P.out);
  bind(0, frame.tex, P.out.u.uSrc); bind(1, bl[0].tex, P.out.u.uBloom); bind(2, wd[0].tex, P.out.u.uWide);
  gl.uniform2f(P.out.u.uRes, W, H);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- loop ---------- */
let raf = 0, last = 0, visible = true, lastInput = performance.now(), rate = 1;
// Lively frames run at full rate; drifting frames at 30 fps.
const lively = () => writing() || torch.preview || torch.on > 0 || flash > 0 || t < clearUntil;
function frameFn(now) {
  raf = 0;
  const live = lively();
  if (!live && last && now - last < 31) { raf = requestAnimationFrame(frameFn); return; }
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
  last = now;
  let more = false;
  try { more = step(dt, now); render(); }
  finally { if (visible && (live || more)) raf = requestAnimationFrame(frameFn); }
}
function wake() { if (visible && ready && !raf) { last = 0; raf = requestAnimationFrame(frameFn); } }
// Any input wakes the loop and resets the sleep clock.
function poke() { lastInput = performance.now(); rate = 1; wake(); }

function step(dt, now) {
  t += dt;
  // After a minute without input, the fade eases to a stop over 2 s.
  rate = clamp(1 - ((now - lastInput) / 1000 - 60) / 2);
  if (press && press.kind === 'press' && now - press.t0 > 260) press.kind = 'hold';
  const want = writing() || torch.preview ? 1 : 0;
  torch.on = reduce ? want : lerp(torch.on, want, 1 - Math.exp(-dt / (want ? 0.03 : 0.12)));
  if (!want && torch.on < 0.003) torch.on = 0;
  const clearing = t < clearUntil;
  decayPass(dt, clearing ? 14 : rate);
  if (clearUntil > 0 && !clearing) { clearUntil = -1; clearAcc(); lastCharge = -1e9; }
  charge(dt);
  flash = flash * Math.exp(-dt / 0.09);
  if (flash < 0.003) flash = 0;
  if (lively()) watchdog(dt);
  return rate > 0 && glowLeft() > 0.003;
}

/* ---------- performance ---------- */
// Slow frames step quality down one rung; it never steps back up.
let runT = 0, avg = 1 / 60, slowT = 0, rung = 0;
function watchdog(dt) {
  if (!dt || rung >= 2) return;
  runT += dt;
  avg = lerp(avg, dt, 0.1);
  if (runT < 4) return;
  slowT = avg > 1 / 38 ? slowT + dt : 0;
  if (slowT > 2) { rung++; slowT = 0; resize(true); }
}

/* ---------- size ---------- */
function fit() {
  if (!rung) return fitCanvas(canvas, { budget: 2.2e6 });
  // On High the first rung falls back to Standard, not to 1x.
  return quality() === 'high' ? fitCanvas(canvas, { budget: 2.2e6, quality: 'standard' }) : fitCanvas(canvas, { budget: 2.2e6, maxDpr: 1 });
}
function resize(force = false) {
  const f = fit();
  if (f.W === W && f.H === H && acc.length && !force) return;
  const old = acc, oi = ai, sx = f.W / W, sy = f.H / H;
  W = f.W; H = f.H;
  [...bl, ...wd].forEach(drop); if (frame) drop(frame);
  acc = [target(W, H), target(W, H)]; ai = 0;
  frame = target(W, H);
  const sh = rung >= 2 ? 3 : 2;
  const bw = Math.max(1, W >> sh), bh = Math.max(1, H >> sh);
  bl = [target(bw, bh), target(bw, bh)];
  wd = [target(Math.max(1, bw >> 2), Math.max(1, bh >> 2)), target(Math.max(1, bw >> 2), Math.max(1, bh >> 2))];
  torch.r = SIZES[opts.size] * Math.min(W, H);
  if (old.length) {
    // The plate stretches into the new size; nothing written is lost.
    quad(acc[0], P.copy); bind(0, old[oi].tex, P.copy.u.uSrc); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    old.forEach(drop);
    torch.x *= sx; torch.y *= sy;
  } else preExpose();
  render();
  wake();
}

/* ---------- input ---------- */
const at = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (r.bottom - e.clientY) * H / r.height]; };
// A move queues one segment with its own duration in seconds.
function torchTo(p, ms = performance.now()) {
  if (writing()) segs.push([torch.x, torch.y, p[0], p[1], clamp((ms - torch.ms) / 1000, 0.001, 0.25)]);
  torch.x = p[0]; torch.y = p[1]; torch.ms = ms;
}
function lift() { torch.preview = false; }
stage.addEventListener('pointerdown', e => {
  if (e.button > 0 || press) return;
  try { stage.setPointerCapture(e.pointerId); } catch { /* capture is optional */ }
  lift();
  const p = at(e);
  torch.x = p[0]; torch.y = p[1]; torch.ms = e.timeStamp;
  press = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: performance.now(), kind: 'press' };
  segs.push([p[0], p[1], p[0], p[1], 0.016]);
  poke();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  if (press.kind !== 'drag' && Math.hypot(e.clientX - press.x0, e.clientY - press.y0) > 8) press.kind = 'drag';
  // Coalesced moves keep fast strokes smooth; an empty list falls back to the event.
  const list = e.getCoalescedEvents?.();
  for (const c of list?.length ? list : [e]) torchTo(at(c), c.timeStamp);
  poke();
});
const end = e => {
  if (!press || (e && e.pointerId !== press.id)) return;
  // A tap blinks the torch on for a moment.
  if (press.kind === 'press') tapUntil = t + 0.14;
  press = null;
  poke();
};
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);
const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] };
stage.addEventListener('keydown', e => {
  const mv = ARROWS[e.key];
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    lift(); keyOn = true;
    torch.ms = performance.now();
    segs.push([torch.x, torch.y, torch.x, torch.y, 0.016]);
    poke();
  } else if (mv) {
    e.preventDefault();
    lift();
    const d = torch.r * 0.2;
    torchTo([clamp(torch.x + mv[0] * d, 0, W), clamp(torch.y + mv[1] * d, 0, H)]);
    poke();
  }
});
stage.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') { keyOn = false; poke(); } });
stage.addEventListener('blur', () => { keyOn = false; poke(); });

/* ---------- bar ---------- */
function popover(box, btn) {
  const set = on => { box.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!box.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
const fadeEl = document.getElementById('fade');
fadeEl.value = String(opts.fade);
fadeEl.addEventListener('input', () => { opts.fade = +fadeEl.value; save('fade', opts.fade); poke(); });
choices(document.getElementById('tint'), v => { opts.tint = v; save('tint', v); render(); poke(); }).set(opts.tint);
choices(document.getElementById('size'), v => { opts.size = v; save('size', v); torch.r = SIZES[v] * Math.min(W, H); render(); poke(); }).set(opts.size);
// Flash charges the whole sheet; the light itself lasts an instant.
document.getElementById('flash').addEventListener('click', () => {
  if (!acc.length) return;
  lift(); clearUntil = -1;
  fillPass(0.32);
  flash = reduce ? 0.3 : 1;
  lastCharge = t;
  poke();
});
// Clear fades the plate out fast, then empties it.
document.getElementById('clear').addEventListener('click', () => { lift(); clearUntil = t + 0.6; poke(); });

/* ---------- start ---------- */
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => { rung = 0; resize(true); });
resize();
gl.finish();
ready = true;
markReady();
requestAnimationFrame(() => canvas.classList.add('on'));
whenVisible(stage, v => {
  visible = v;
  if (v) wake();
  else if (raf) { cancelAnimationFrame(raf); raf = 0; }
});
// The preview pool clicks off a moment after the intro.
Promise.race([introDone, wait(9000)]).then(() => wait(700)).then(() => { lift(); poke(); });
wake();
</script>
</body>
</html>
