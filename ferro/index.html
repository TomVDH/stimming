<!doctype html>
<html lang="en">

<style>
/* Ferrofluid: the dish at full width under the shared header. */
:root { --stage: oklch(0.185 0.006 265); }

  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);

<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/ferro.svg)"></span><span class="intro-name">Ferrofluid</span><span class="intro-sub">Stimming No. 09</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--ferro pool" id="pool" tabindex="0" role="application" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight Space Escape D" aria-label="A dish of ferrofluid. The pointer holds a magnet above it; pressing strengthens the field and lifts drops up to it. Arrow keys move the magnet, Space toggles a strong field, Escape lifts it away, D lets a drop fall.">
      <p class="fail" hidden>Ferrofluid needs WebGL, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="actions">
        <button class="chip" id="drip" type="button" aria-keyshortcuts="D">Drip</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div class="fine"><dt>Hover</dt><dd>move the magnet</dd></div>
        <div class="touch"><dt>Drag</dt><dd>move the magnet</dd></div>
        <div><dt>Press</dt><dd>lift drops</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>strong field</dd></div>
        <div class="fine"><dt><kbd>Esc</kbd></dt><dd>lift away</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Ferrofluid</h1><div class="vignette" hidden></div></section>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import { initPage, sound } from '../shared/stim.js';
initPage({ id: 'ferro' });
const panel = document.getElementById('pool');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; wake(); });
const TAU = Math.PI * 2, S3 = Math.sqrt(3) / 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));
// Small screens get a coarser mesh and larger spikes.
const small = Math.min(innerWidth, innerHeight) < 700;

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 14, LEAD = 0.004, HUMV = 0.065;
let ac = null, out = null, noise = null, askedAt = -1e9, voices = 0, crackNext = 0, restT = 0;
let humG = null, humF = null, humAt = -1, humTone = -1;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.08 * voices);

function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (err) { return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;
    out = ac.createGain();
    out.gain.value = 0.55;
    out.connect(comp);
    comp.connect(ac.destination);
    // One second of white noise feeds every burst.
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // The hum: a buzzing fundamental and a beating octave, lowpassed.
    const o1 = ac.createOscillator(), o2 = ac.createOscillator(), g1 = ac.createGain(), g2 = ac.createGain();
    const lp = ac.createBiquadFilter();
    o1.type = 'sawtooth';
    o1.frequency.value = 50;
    o2.frequency.value = 100.6;
    g1.gain.value = 0.5;
    g2.gain.value = 0.8;
    lp.type = 'lowpass';
    lp.frequency.value = 150;
    lp.Q.value = 0.9;
    humG = ac.createGain();
    humG.gain.value = 0;
    o1.connect(g1).connect(lp);
    o2.connect(g2).connect(lp);
    lp.connect(humG).connect(out);
    o1.start();
    o2.start();
    humF = lp.frequency;
  }
  if (ac.state !== 'running') { askedAt = performance.now(); ac.resume()?.catch(() => {}); }
}
// A context still waking queues sounds for a moment.
function live() {
  if (!sound.on || !ac || ac.state === 'closed') return null;
  return ac.state === 'running' || performance.now() - askedAt < 250 ? ac : null;
}
function track(src, ...tails) {
  voices++;
  src.onended = () => { voices--; tails.forEach(n => n.disconnect()); };
}
// Once the field is gone, the context sleeps until the next gesture.
function rest() {
  clearTimeout(restT);
  if (!ac || ac.state !== 'running') return;
  restT = setTimeout(() => {
    if (!raf && Fs.x < 0.01 && ac.state === 'running') ac.suspend()?.catch(() => {});
  }, 1500);
}
const GESTURE_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter', 'd', 'D']);
function unlock(e) {
  if (!sound.on || (e.type === 'keydown' && !GESTURE_KEYS.has(e.key))) return;
  // A touch counts as a gesture only once the finger lifts.
  if (!ac && e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
  audio();
}
// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// Field strength sets the hum's level and brightness.
function hum(v, bright) {
  if (!humG) return;
  const lv = live() ? v : 0;
  if (Math.abs(lv - humAt) < 0.004 && Math.abs(bright - humTone) < 0.02) return;
  humAt = lv;
  humTone = bright;
  const t = ac.currentTime;
  humG.gain.cancelScheduledValues(t);
  humG.gain.setTargetAtTime(lv * HUMV, t, 0.12);
  humF.setTargetAtTime(150 + 450 * bright, t, 0.2);
}
// A wet bead: a falling sine blip over a soft noise tick.
function crackle(amp) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t0 = a.currentTime + LEAD, t = Math.max(t0, crackNext);
  // A burst of new spikes thins to a patter.
  if (t - t0 > 0.07) return;
  crackNext = t + 0.018 + Math.random() * 0.03;
  const g = level() * amp * jit(0.25), f = 1250 * jit(0.3);
  const o = a.createOscillator(), og = a.createGain();
  o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(f * 0.4, t + 0.035);
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(0.06 * g, t + 0.002);
  og.gain.setTargetAtTime(0, t + 0.002, 0.01);
  o.connect(og).connect(out);
  o.start(t);
  o.stop(t + 0.07);
  const src = a.createBufferSource(), bp = a.createBiquadFilter(), ng = a.createGain();
  src.buffer = noise;
  bp.type = 'bandpass';
  bp.frequency.value = 2400 * jit(0.25);
  bp.Q.value = 1.3;
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(0.09 * g, t + 0.0006);
  ng.gain.setTargetAtTime(0, t + 0.0006, 0.004);
  src.connect(bp).connect(ng).connect(out);
  src.start(t, Math.random() * 0.9, 0.025);
  track(o, og, bp, ng);
}
// A wet blip: one sine glides between two pitches.
function bloop(f0, f1, dur, amp) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD, g = level() * amp;
  const o = a.createOscillator(), og = a.createGain();
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(g, t + 0.003);
  og.gain.setTargetAtTime(0, t + 0.003, dur * 0.4);
  o.connect(og).connect(out);
  o.start(t);
  o.stop(t + dur * 2.5 + 0.02);
  track(o, og);
}
// A spike throws a bead: an upward slurp over a wet click.
const slurp = () => { bloop(260 * jit(0.15), 760 * jit(0.1), 0.07, 0.07); crackle(0.5); };
// A bead pinches off the hanging blob.
const pinch = () => bloop(520 * jit(0.1), 980, 0.045, 0.05);
// Two beads merge: a low blop, deeper for big beads.
const blop = r => { const f = clamp(380 * (RSPIT / r), 160, 700) * jit(0.08); bloop(f, f * 0.6, 0.06, 0.06); };
// A bead lands in the pool: a rising plip.
function plip(r, sp) {
  const f = clamp(620 * (RSPIT / r) ** 0.8, 260, 1300) * jit(0.1);
  bloop(f * 0.6, f * 1.8, 0.05, 0.05 + 0.05 * clamp(sp / 3));
}

/* ---------- the field and the spike lattice ---------- */
// The dish's inner radius is 1; the fluid rests at y = 0.
const RIN = 1, K = 9, KW = 2 * K + 1, RHO = 0.7;
// Lattice spacing, hover spike height, mesh vertices per spacing.
const LAM = small ? 0.16 : 0.15, A0 = LAM * 1.05, MESH_N = small ? 10 : 14;
// Field falloff, spike threshold, hover and pressed strengths.
const SIG2 = 0.42 ** 2, FC = 0.36, HOVER = 1, STRONG = 2;
// Crowding radius in lattice units; lean falloff and maximum.
const CS2 = 3.2 ** 2, SIGL = 0.3, LEANMAX = 0.22;
const mag = { x: 0, z: 0, present: false, pressed: false, locked: false, via: '' };
const Fs = { x: 0, v: 0 };
const E = { x: 0, z: 0, vx: 0, vz: 0, ax: 0, az: 0 }, L = { x: 0, z: 0, vx: 0, vz: 0, ax: 0, az: 0 };
let crowdNow = 0, idleAmt = 0, stirT = 0, tNow = 0, amax = 0;

// One cell per lattice point, axial coordinates within K rings.
const NC = 1 + 3 * K * (K + 1);
const CU = new Float32Array(NC), CV = new Float32Array(NC), CR = new Float32Array(NC), CE = new Float32Array(NC);
const CF = new Float32Array(NC), WA = new Float32Array(NC), WS = new Float32Array(NC), PH = new Float32Array(NC);
const A = new Float32Array(NC), VA = new Float32Array(NC), SX = new Float32Array(NC), SZ = new Float32Array(NC);
const VSX = new Float32Array(NC), VSZ = new Float32Array(NC), COFF = new Int32Array(NC), FORM = new Uint8Array(NC);
const CD = new Float32Array(KW * KW * 4), CIDX = new Int16Array(KW * KW).fill(-1);
let nc = 0;
for (let j = -K; j <= K; j++) for (let i = -K; i <= K; i++) {
  if (Math.abs(i + j) > K) continue;
  CU[nc] = i + j / 2;
  CV[nc] = j * S3;
  CR[nc] = Math.hypot(CU[nc], CV[nc]);
  CE[nc] = Math.exp(-(CR[nc] ** 2) / CS2);
  // Cells near the texture edge never rise.
  CF[nc] = smooth(7.6, 5.6, CR[nc]);
  COFF[nc] = ((j + K) * KW + i + K) * 4;
  CIDX[(j + K) * KW + i + K] = nc;
  // Each spike springs at its own slightly different rate.
  WA[nc] = jit(0.15);
  WS[nc] = jit(0.18);
  PH[nc] = Math.random() * TAU;
  nc++;
}

function spring2(s, tx, tz, w, z, h) {
  s.ax = w * w * (tx - s.x) - 2 * z * w * s.vx;
  s.az = w * w * (tz - s.z) - 2 * z * w * s.vz;
  s.vx += s.ax * h;
  s.vz += s.az * h;
  s.x += s.vx * h;
  s.z += s.vz * h;
}
// Spikes swell, sway and melt on their own springs.
function cellsStep(h, F, crowd, atten, mx, mz, kx, kz) {
  const wr = reduce ? 22 : 10, zr = reduce ? 1 : 0.32, wf = reduce ? 18 : 6.5, zf = reduce ? 1 : 0.8;
  const ws = reduce ? 20 : 13, zs = reduce ? 1 : 0.16;
  let busy = false, top = 0;
  for (let k = 0; k < nc; k++) {
    const w = (1 - crowd * CE[k]) * LAM, x = L.x + CU[k] * w, z = L.z + CV[k] * w;
    const dx = x - E.x, dz = z - E.z;
    // The field falls off like a dipole's; spikes need a threshold.
    const f = F / (1 + (dx * dx + dz * dz) / SIG2) ** 1.5;
    let at = 0;
    if (f > FC) {
      at = A0 * ((f - FC) / (1 - FC)) ** 0.7 * atten * CF[k] * smooth(0.95, 0.74, Math.hypot(x, z));
      // The idle ripple runs outward through the lattice.
      if (idleAmt) at *= 1 + 0.1 * idleAmt * Math.sin(tNow * 2.3 - CR[k] * 1.1 + PH[k] * 0.35);
    }
    const up = at > A[k], om = (up ? wr : wf) * WA[k], ze = up ? zr : zf;
    VA[k] += (om * om * (at - A[k]) - 2 * ze * om * VA[k]) * h;
    A[k] += VA[k] * h;
    if (at === 0 && Math.abs(A[k]) < 1e-5 && Math.abs(VA[k]) < 1e-4) { A[k] = 0; VA[k] = 0; }
    // Spikes lean toward the magnet, most at middle distance.
    const lx = mx - x, lz = mz - z, lr = Math.hypot(lx, lz);
    let tx = 0, tz = 0;
    if (lr > 1e-5) {
      const q = lr / SIGL, m = (2 * LEANMAX * q) / (1 + q * q) / lr;
      tx = lx * m;
      tz = lz * m;
    }
    if (A[k] < 1e-4 && at === 0) {
      SX[k] = tx; SZ[k] = tz; VSX[k] = VSZ[k] = 0;
    } else {
      // The lattice's acceleration swings the tips the other way.
      const os = ws * WS[k];
      VSX[k] += (os * os * (tx - SX[k]) - 2 * zs * os * VSX[k] - kx) * h;
      VSZ[k] += (os * os * (tz - SZ[k]) - 2 * zs * os * VSZ[k] - kz) * h;
      SX[k] += VSX[k] * h;
      SZ[k] += VSZ[k] * h;
      if (Math.abs(tx - SX[k]) + Math.abs(tz - SZ[k]) > 2e-3 || Math.abs(VSX[k]) + Math.abs(VSZ[k]) > 2e-2) busy = true;
    }
    if (Math.abs(at - A[k]) > 1e-4 || Math.abs(VA[k]) > 1e-3) busy = true;
    if (A[k] > top) top = A[k];
    // A spike crossing half height makes a wet click.
    if (!FORM[k]) {
      if (A[k] > 0.45 * A0 && VA[k] > 0) { FORM[k] = 1; crackle(clamp(VA[k] / (A0 * 6), 0.15, 1)); }
    } else if (A[k] < 0.2 * A0) FORM[k] = 0;
  }
  amax = top;
  return busy;
}

/* ---------- the pool: a shallow-water heightfield ---------- */
const G = small ? 96 : 128, DX = (2 * RIN) / G;
const H = new Float32Array(G * G), V = new Float32Array(G * G), P = new Float32Array(G * G), PHI = new Float32Array(G * G);
let IN, NL, NR, NU, ND, GXW, GZW, ACC, FO, FI, NIN = 0, pOn = false;
function simInit() {
  const ins = new Uint8Array(G * G), at = i => -RIN + (i + 0.5) * DX, list = [];
  for (let z = 0; z < G; z++) for (let x = 0; x < G; x++) {
    if (Math.hypot(at(x), at(z)) < RIN) { ins[z * G + x] = 1; list.push(z * G + x); }
  }
  NIN = list.length;
  IN = Int32Array.from(list);
  NL = new Int32Array(NIN); NR = new Int32Array(NIN); NU = new Int32Array(NIN); ND = new Int32Array(NIN);
  GXW = new Float32Array(NIN); GZW = new Float32Array(NIN); ACC = new Float32Array(NIN);
  // Wall neighbours point back at the cell: no flow through the wall.
  for (let m = 0; m < NIN; m++) {
    const k = IN[m], x = k % G, z = (k / G) | 0;
    NL[m] = x > 0 && ins[k - 1] ? k - 1 : k;
    NR[m] = x < G - 1 && ins[k + 1] ? k + 1 : k;
    NU[m] = z > 0 && ins[k - G] ? k - G : k;
    ND[m] = z < G - 1 && ins[k + G] ? k + G : k;
    GXW[m] = at(x);
    GZW[m] = at(z);
  }
  // Wall cells copy their nearest fluid cell, so sampling stays smooth.
  const fo = [], fi = [];
  for (let z = 0; z < G; z++) for (let x = 0; x < G; x++) {
    const k = z * G + x;
    if (ins[k] || Math.hypot(at(x), at(z)) > RIN + 3 * DX) continue;
    let best = -1, bd = Infinity;
    for (let b = -4; b <= 4; b++) for (let a = -4; a <= 4; a++) {
      const xx = x + a, zz = z + b;
      if (xx < 0 || zz < 0 || xx >= G || zz >= G || !ins[zz * G + xx]) continue;
      if (a * a + b * b < bd) { bd = a * a + b * b; best = zz * G + xx; }
    }
    if (best >= 0) { fo.push(k); fi.push(best); }
  }
  FO = Int32Array.from(fo);
  FI = Int32Array.from(fi);
}
// The pull is a pressure head: a tight mound, a broad swell.
function pressure(F) {
  if (F < 1e-4) {
    if (pOn) { P.fill(0); pOn = false; }
    return;
  }
  pOn = true;
  const hm = 0.05 * F, hb = 0.018 * F, ex = E.x, ez = E.z;
  for (let m = 0; m < NIN; m++) {
    const dx = GXW[m] - ex, dz = GZW[m] - ez, d2 = dx * dx + dz * dz;
    P[IN[m]] = hm * Math.exp(-d2 / 0.073) + hb * Math.exp(-d2 / 0.38);
  }
}
// Waves carry the pool toward the pull; volume is conserved.
function simulate(dt) {
  const n = Math.max(1, Math.ceil(dt * 180 - 1e-6)), h = dt / n;
  const c2 = 1.21 / (DX * DX), nu = 0.0035 / (DX * DX), damp = 1 - (reduce ? 9 : 2.4) * h;
  let top = 0;
  for (let s = 0; s < n; s++) {
    for (let m = 0; m < NIN; m++) { const k = IN[m]; PHI[k] = H[k] - P[k]; }
    for (let m = 0; m < NIN; m++) {
      const k = IN[m], a = NL[m], b = NR[m], c = NU[m], d = ND[m];
      ACC[m] = c2 * (PHI[a] + PHI[b] + PHI[c] + PHI[d] - 4 * PHI[k]) + nu * (V[a] + V[b] + V[c] + V[d] - 4 * V[k]);
    }
    top = 0;
    for (let m = 0; m < NIN; m++) {
      const k = IN[m], v = (V[k] + ACC[m] * h) * damp;
      V[k] = v;
      H[k] += v * h;
      if (v > top) top = v; else if (-v > top) top = -v;
    }
  }
  for (let m = 0; m < FO.length; m++) H[FO[m]] = H[FI[m]];
  return top;
}

/* ---------- drops: beads that leap, hang, merge and splash ---------- */
// Gravity, hang height under the magnet, pull strength.
const GRAV = 5.5, YA = 0.56, KP = 18;
// Bead cap, beads per press, thrown size, drip size.
const NDROP = 24, SPITS = 6, RSPIT = 0.04, RDRIP = 0.07;
const drops = [], SPT = new Float32Array(NC).fill(-9);
const spit = { left: 0, next: 0, was: false };
let pullX = 0, pullY = YA, pullZ = 0, pullF = 0, crownK = -1;

// Pool height at a point, bilinear, as the shader reads it.
function bulkAt(x, z) {
  const gx = clamp((x * 0.5 + 0.5) * G - 0.5, 0, G - 1.001), gz = clamp((z * 0.5 + 0.5) * G - 0.5, 0, G - 1.001);
  const i = gx | 0, j = gz | 0, fx = gx - i, fz = gz - j, k = j * G + i;
  return (H[k] * (1 - fx) + H[k + 1] * fx) * (1 - fz) + (H[k + G] * (1 - fx) + H[k + G + 1] * fx) * fz;
}
// The nearest spike's height at a point; crownK keeps its cell.
function crownAt(x, z) {
  crownK = -1;
  if (amax < 1e-4) return 0;
  const bu = (x - L.x) / LAM, bv = (z - L.z) / LAM;
  let u = bu, v = bv;
  // Two passes undo the crowding near the centre.
  for (let it = 0; it < 2; it++) {
    const s = 1 - crowdNow * Math.exp(-(u * u + v * v) / CS2);
    u = bu / s;
    v = bv / s;
  }
  const fj = v / S3, fi = u - 0.5 * fj, fk = -fi - fj;
  let ri = Math.round(fi), rj = Math.round(fj);
  const rk = Math.round(fk), di = Math.abs(ri - fi), dj = Math.abs(rj - fj), dk = Math.abs(rk - fk);
  if (di > dj && di > dk) ri = -rj - rk;
  else if (dj > dk) rj = -ri - rk;
  if (Math.abs(ri) > K || Math.abs(rj) > K) return 0;
  const k = CIDX[(rj + K) * KW + ri + K];
  if (k < 0 || A[k] <= 0) return 0;
  const q = Math.hypot(u - CU[k], v - CV[k]) / RHO;
  if (q >= 1) return 0;
  crownK = k;
  const b = 1 - q * q;
  return A[k] * b * b * b;
}

    // The frame b, a, c is right-handed, so the winding holds.
    const hx = Math.abs(ay) > 0.9 ? 1 : 0, hy = 1 - hx;
    let bx = hy * az, by = -hx * az, bz = hx * ay - hy * ax;
    const bl = Math.hypot(bx, by, bz);
    bx /= bl; by /= bl; bz /= bl;
    const cx = by * az - bz * ay, cy = bz * ax - bx * az, cz = bx * ay - by * ax;
    M[o] = bx * kq * r; M[o + 1] = by * kq * r; M[o + 2] = bz * kq * r; M[o + 3] = 0;
    M[o + 4] = ax * kp * r; M[o + 5] = ay * kp * r; M[o + 6] = az * kp * r; M[o + 7] = 0;
    M[o + 8] = cx * kq * r; M[o + 9] = cy * kq * r; M[o + 10] = cz * kq * r; M[o + 11] = 0;
    M[o + 12] = d.x; M[o + 13] = d.y; M[o + 14] = d.z; M[o + 15] = 1;
  });
  dropMesh.count = drops.length;
  dropMesh.instanceMatrix.needsUpdate = true;
}

/* ---------- one loop, only while something moves ---------- */
let raf = 0, last = 0, quiet = 0, onScreen = true, slow = 0;
function wake() {
  quiet = 0;
  // The next hum update applies even if the level looks unchanged.
  humAt = -1;
  if (!raf && ready && onScreen && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(ms) {
  raf = 0;
  const raw = Math.max(0, (ms - last) / 1000), dt = Math.min(raw, 1 / 30);
  last = ms;
  // Sustained slow frames drop the pixel ratio to 1.
  if (!lowDpr) {
    slow = raw > 0.03 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 20) { lowDpr = true; dispatchEvent(new Event('perf-low')); }
  }
  const busy = step(dt);
  draw();
  quiet = busy ? 0 : quiet + 1;
  if (quiet < 10) {
    if (onScreen && !document.hidden) raf = requestAnimationFrame(frame);
  } else if (Fs.x < 0.01) rest();
  else if (humG && humAt > 0 && live()) {
    // A steady field settles to a quieter hum.
    humG.gain.setTargetAtTime(humAt * HUMV * 0.45, ac.currentTime + 1.2, 1.5);
  }
}

/* ---------- input ---------- */
let ptrId = -1, resumeAt = 0;
function aimAt(e) {
  const r = panel.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, 1 - ((e.clientY - r.top) / r.height) * 2);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(plane, hitV)) return false;
  mag.x = hitV.x;
  mag.z = hitV.z;
  return true;
}
function stir() {
  stirT = tNow;
  wake();
}
panel.addEventListener('pointermove', e => {
  if (!ready || (e.pointerType === 'touch' && e.pointerId !== ptrId)) return;
  if (!aimAt(e)) return;
  mag.via = 'pointer';
  mag.present = true;
  // After a first gesture, hovering wakes a sleeping context.
  if (ac && sound.on && ac.state === 'suspended' && e.timeStamp - resumeAt > 500) { resumeAt = e.timeStamp; audio(); }
  stir();
});
panel.addEventListener('pointerdown', e => {
  if (!ready || (e.pointerType === 'mouse' && e.button !== 0)) return;
  aimAt(e);
  mag.via = 'pointer';
  mag.present = true;
  mag.pressed = true;
  ptrId = e.pointerId;
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  stir();
});
function release(e) {
  if (e.pointerId !== ptrId) return;
  ptrId = -1;
  mag.pressed = false;
  const r = panel.getBoundingClientRect();
  const over = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  // A lifted finger takes the magnet with it.
  if (e.pointerType === 'touch' || !over) mag.present = false;
  stir();
}
panel.addEventListener('pointerup', release);
panel.addEventListener('pointercancel', release);
panel.addEventListener('lostpointercapture', release);
panel.addEventListener('pointerleave', e => {
  if (e.pointerType === 'touch' || mag.pressed || mag.via !== 'pointer') return;
  mag.present = false;
  stir();
});
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented || !ready) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  if (ARROWS[e.key]) {
    e.preventDefault();
    keys.add(e.key);
    if (mag.via !== 'pointer' || !mag.present) { mag.via = 'key'; mag.present = true; }
    stir();
  } else if (e.key === ' ') {
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (e.repeat) return;
    if (!mag.present) { mag.via = 'key'; mag.present = true; }
    mag.locked = !mag.locked;
    stir();
  } else if (e.key === 'Escape') {
    mag.present = mag.locked = false;
    keys.clear();
    stir();
  } else if (e.key === 'd' || e.key === 'D') {
    if (!e.repeat) drip();
  }
});
document.getElementById('drip').addEventListener('click', drip);
addEventListener('keyup', e => { keys.delete(e.key); });
addEventListener('blur', () => keys.clear());
sound.onChange(on => {
  if (on) { audio(); wake(); }
  else if (ac) ac.suspend()?.catch(() => {});
});
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(panel);
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

/* ---------- start: WebGL setup in idle slices ---------- */
function failed() {
  panel.querySelector('.fail').hidden = false;
}
async function start() {
  let RoomEnvironment;
  try {
    THREE = await import('three');
    ({ RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js'));
  } catch (err) {
    console.error(err);
    return failed();
  }
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (err) {
    console.error(err);
    return failed();
  }
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.setClearColor(0x121316);
  const canvas = renderer.domElement;
  canvas.setAttribute('aria-hidden', 'true');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(27, 16 / 9, 0.1, 100);
  ray = new THREE.Raycaster();
  plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  ndc = new THREE.Vector2();
  hitV = new THREE.Vector3();
  tmp = new THREE.Vector3();
  await idle();

  // The room's light panels give every spike a crisp reflection.
  const room = new RoomEnvironment();
  // Dark walls make it a studio, so the black reads as black.
  room.traverse(o => {
    if (!o.isMesh) return;
    if (o.material.isMeshStandardMaterial) {
      o.material.color.setScalar(0.06);
      // The clutter boxes would block the low panels.
      if (o.material.side !== THREE.BackSide) o.visible = false;
    }
    // The side panel dims; the one the mirror faces goes.
    else if (o.position.x > 10) o.material.color.setScalar(4);
    else if (o.position.z < -10) o.visible = false;
  });
  const glow = (w, h, d, v, x, y, z, ry = 0) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial());
    m.material.color.setScalar(v);
    m.position.set(x, y, z);
    m.rotation.y = ry;
    room.add(m);
  };
  // Long strips behind the dish draw a line across the mirror.
  // One sits in view from each camera height.
  // Each strip sits at one camera elevation: 55 or 68 degrees.
  glow(26, 0.2, 0.2, 4, 0, 17.1, -12);
  glow(30, 0.26, 0.26, 4, 0, 24.8, -10);
  // Low panels light the steep flanks, not the flat pool.
  for (let k = 0; k < 9; k++) {
    const a = (k / 9) * TAU + 0.2;
    glow(2.2, 3.2, 0.1, k % 3 ? 4 : 6.5, Math.sin(a) * 12.5, 1.9, Math.cos(a) * 12.5, a);
  }
  // No extra blur: bright panels would bloom across the mirror.
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(room, 0).texture;
  room.dispose();
  pm.dispose();
  // A soft spot pools light on the dish and sparks each spike.
  const key = new THREE.SpotLight(0xfff4ea, 9, 0, 0.36, 1, 0);
  key.position.set(-1.7, 7, 2.6);
  key.target.position.set(0, 0, 0);
  // A cool back light catches the far flanks.
  const back = new THREE.DirectionalLight(0xdde6ff, 1.6);
  back.position.set(3, 2.2, -3.2);
  scene.add(key, key.target, back);

  const table = new THREE.Mesh(
    new THREE.CircleGeometry(40, 64),
    new THREE.MeshStandardMaterial({ color: 0x17181c, roughness: 0.9, metalness: 0, envMapIntensity: 0.25 }),
  );
  table.rotation.x = -Math.PI / 2;
  table.position.y = -0.13;
  scene.add(table);
  // A dark satin dish: straight inner wall, rounded rim.
  const prof = [[0.999, -0.13], [0.999, 0.058], [1.004, 0.071], [1.015, 0.08], [1.032, 0.085], [1.058, 0.085],
    [1.076, 0.08], [1.087, 0.069], [1.092, 0.052], [1.098, -0.13]].map(([x, y]) => new THREE.Vector2(x, y));
  const dish = new THREE.Mesh(
    new THREE.LatheGeometry(prof, 160),
    new THREE.MeshPhysicalMaterial({
      color: 0x2a2c32, metalness: 0.4, roughness: 0.32, clearcoat: 0.3, clearcoatRoughness: 0.25, side: THREE.DoubleSide,
    }),
  );
  scene.add(dish);
  await idle();

  simInit();
  cellTex = new THREE.DataTexture(CD, KW, KW, THREE.RGBAFormat, THREE.FloatType);
  bulkTex = new THREE.DataTexture(H, G, G, THREE.RedFormat, THREE.FloatType);
  for (const t of [cellTex, bulkTex]) { t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; }
  U = {
    uCells: { value: cellTex }, uBulk: { value: bulkTex }, uL: { value: new THREE.Vector2() },
    uLam: { value: LAM }, uCrowd: { value: 0 }, uG: { value: G }, uRclip: { value: RIN + 0.02 },
    uEps: { value: 0.35 / MESH_N }, uAmax: { value: 0 }, uRin: { value: RIN + 0.003 },
  };
  // Deep black with a clear coat and a faint thin-film sheen.
  const INK = {
    color: 0x030304, metalness: 0, roughness: 0.07, ior: 1.6, specularIntensity: 1,
    clearcoat: 0.6, clearcoatRoughness: 0.05,
    iridescence: 0.15, iridescenceIOR: 1.32, iridescenceThicknessRange: [260, 560],
    envMapIntensity: 2,
  };
  const ink = new THREE.MeshPhysicalMaterial(INK);
  ink.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, U);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\n' + VERT)
      .replace('#include <beginnormal_vertex>', 'vec3 fPos;\nvec3 objectNormal;\nferro(position.xy, fPos, objectNormal);')
      .replace('#include <begin_vertex>', 'vec3 transformed = fPos;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec2 vXZ;\nvarying float vSheen;\nuniform float uRin;')
      .replace('void main() {', 'void main() {\n\tif (dot(vXZ, vXZ) > uRin * uRin) discard;')
      .replace('#include <lights_physical_fragment>',
        '#include <lights_physical_fragment>\n#ifdef USE_IRIDESCENCE\n\tmaterial.iridescenceThickness = mix(260.0, 560.0, vSheen);\n#endif');
  };
  ink.customProgramCacheKey = () => 'ferro-ink';
  const fluid = new THREE.Mesh(buildPool(MESH_N), ink);
  fluid.frustumCulled = false;
  scene.add(fluid);
  // Loose beads share the fluid's finish.
  dropMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 28, 18), new THREE.MeshPhysicalMaterial(INK), NDROP);
  dropMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  dropMesh.frustumCulled = false;
  dropMesh.count = 0;
  scene.add(dropMesh);

  panel.prepend(canvas);
  fitRenderer(renderer, panel, 1.5, (w, h) => {
    fitCamera(w, h);
    if (ready) { draw(); wake(); }
  }, 1.4e6);
  if (!panel.clientWidth) fitCamera(16, 9);
  await idle();
  // Async compile keeps the shader build off the main thread.
  await renderer.compileAsync(scene, camera);
  ready = true;
  // The page opens with a magnet resting over the middle.
  if (!mag.via) { mag.via = 'intro'; mag.present = true; mag.x = 0; mag.z = 0.05; }
  draw();
  requestAnimationFrame(() => canvas.classList.add('on'));
  stir();
}
start().catch(err => { console.error(err); failed(); });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
</body>
