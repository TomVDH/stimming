<style>

:root { --stage: oklch(0.185 0.006 265); }

  position: absolute; inset: 0; display: block; width: 100%; height: 100%;

<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/ferro.svg)"></span><span class="intro-name">Ferrofluid</span><span class="intro-sub">Stimming No. 09</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--ferro pool" id="pool" tabindex="0" role="application" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight Space Escape D - =" aria-label="A dish of ferrofluid. The pointer holds a faint glow above it, which acts as a magnet; scrolling sets the field strength, and holding charges the field and lifts drops up to it. Arrow keys move the glow, minus and equals set the strength, Space toggles a full field, Escape lifts it away, D lets a drop fall.">
      <p class="fail" hidden>Ferrofluid needs WebGL, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" role="group" aria-label="Fluid">
        <button class="chip" type="button" data-value="ink" aria-pressed="true">Ink</button>
        <button class="chip" type="button" data-value="alien" aria-pressed="false">Alien</button>
        <button class="chip" type="button" data-value="magma" aria-pressed="false">Magma</button>
        <button class="chip" type="button" data-value="oil" aria-pressed="false">Oil</button>
      </div>
      <div class="actions">
        <button class="chip" id="drip" type="button" aria-keyshortcuts="D">Drip</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div class="fine"><dt>Hover</dt><dd>move the glow</dd></div>
        <div class="touch"><dt>Drag</dt><dd>move the glow</dd></div>
        <div class="fine"><dt>Scroll</dt><dd>field strength</dd></div>
        <div><dt>Hold</dt><dd>charge, lift drops</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>full field</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Ferrofluid</h1><div class="vignette" hidden></div></section>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import { initPage, sound, oklchRgb, choices } from '../shared/stim.js';
initPage({ id: 'ferro' });
const panel = document.getElementById('pool');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; wake(); });
const TAU = Math.PI * 2, S3 = Math.sqrt(3) / 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

const small = Math.min(innerWidth, innerHeight) < 700;

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 14, LEAD = 0.004, HUMV = 0.065;

let humG = null, humF = null, humAt = -1, humTone = -1;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.08 * voices);

function audio() {

    const AC = window.AudioContext || window.webkitAudioContext;

    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;

    comp.connect(ac.destination);

    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);

    o2.frequency.value = 100.6;
    g1.gain.value = 0.5;
    g2.gain.value = 0.8;
    lp.type = 'lowpass';
    lp.frequency.value = 150;
    lp.Q.value = 0.9;
    humG = ac.createGain();
    humG.gain.value = 0;
    o1.connect(g1).connect(lp);
    o2.connect(g2).connect(lp);

// A context still waking queues sounds for a moment.

}
function track(src, ...tails) {

}
// Once the field is gone, the context sleeps until the next gesture.
function rest() {
  clearTimeout(restT);
  if (!ac || ac.state !== 'running') return;
  restT = setTimeout(() => {
    if (!raf && Fs.x < 0.01 && ac.state === 'running') ac.suspend()?.catch(() => {});
  }, 1500);
}
const GESTURE_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter', 'd', 'D', '-', '=', '+']);
function unlock(e) {
  if (!sound.on || (e.type === 'keydown' && !GESTURE_KEYS.has(e.key))) return;

  if (!ac && e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
  audio();
}
// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// Field strength sets the hum's level and brightness.
function hum(v, bright) {
  if (!humG) return;
  const lv = live() ? v : 0;
  if (Math.abs(lv - humAt) < 0.004 && Math.abs(bright - humTone) < 0.02) return;
  humAt = lv;
  humTone = bright;
  const t = ac.currentTime;
  humG.gain.cancelScheduledValues(t);
  humG.gain.setTargetAtTime(lv * HUMV, t, 0.12);
  humF.setTargetAtTime(150 + 450 * bright, t, 0.2);
}
// A wet bead: a falling sine blip over a soft noise tick.
function crackle(amp) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t0 = a.currentTime + LEAD, t = Math.max(t0, crackNext);
  // A burst of new spikes thins to a patter.
  if (t - t0 > 0.07) return;
  crackNext = t + 0.018 + Math.random() * 0.03;
  const g = level() * amp * jit(0.25), f = 1250 * jit(0.3);
  const o = a.createOscillator(), og = a.createGain();
  o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(f * 0.4, t + 0.035);
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(0.06 * g, t + 0.002);
  og.gain.setTargetAtTime(0, t + 0.002, 0.01);
  o.connect(og).connect(out);
  o.start(t);
  o.stop(t + 0.07);
  const src = a.createBufferSource(), bp = a.createBiquadFilter(), ng = a.createGain();
  src.buffer = noise;
  bp.type = 'bandpass';
  bp.frequency.value = 2400 * jit(0.25);
  bp.Q.value = 1.3;
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(0.09 * g, t + 0.0006);
  ng.gain.setTargetAtTime(0, t + 0.0006, 0.004);
  src.connect(bp).connect(ng).connect(out);
  src.start(t, Math.random() * 0.9, 0.025);
  track(o, og, bp, ng);
}
// A wet blip: one sine glides between two pitches.
function bloop(f0, f1, dur, amp) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD, g = level() * amp;
  const o = a.createOscillator(), og = a.createGain();
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(g, t + 0.003);
  og.gain.setTargetAtTime(0, t + 0.003, dur * 0.4);

  o.start(t);
  o.stop(t + dur * 2.5 + 0.02);
  track(o, og);

// A spike throws a bead: an upward slurp over a wet click.
const slurp = () => { bloop(260 * jit(0.15), 760 * jit(0.1), 0.07, 0.07); crackle(0.5); };
// A bead pinches off the hanging blob.
const pinch = () => bloop(520 * jit(0.1), 980, 0.045, 0.05);
// Two beads merge: a low blop, deeper for big beads.
const blop = r => { const f = clamp(380 * (RSPIT / r), 160, 700) * jit(0.08); bloop(f, f * 0.6, 0.06, 0.06); };
// A bead lands in the pool: a rising plip.
function plip(r, sp) {
  const f = clamp(620 * (RSPIT / r) ** 0.8, 260, 1300) * jit(0.1);
  bloop(f * 0.6, f * 1.8, 0.05, 0.05 + 0.05 * clamp(sp / 3));
}

/* ---------- the field and the spike lattice ---------- */
// The dish's inner radius is 1; the fluid rests at y = 0.
const RIN = 1, K = 9, KW = 2 * K + 1, RHO = 0.7;
// Lattice spacing, hover spike height, mesh vertices per spacing.
const LAM = small ? 0.16 : 0.15, A0 = LAM * 1.05, MESH_N = small ? 10 : 14;
// Field falloff, spike threshold, hover and pressed strengths.
const SIG2 = 0.42 ** 2, FC = 0.36, HOVER = 1, STRONG = 2;
// Crowding radius in lattice units; lean falloff and maximum.
const CS2 = 3.2 ** 2, SIGL = 0.3, LEANMAX = 0.22;
// The scroll dial sets the resting field; a hold charges it to STRONG.
const DMIN = 0.5, DMAX = 1.7, CHARGE_UP = 2.6, CHARGE_DOWN = 6;
// pen holds the stylus pressure while pressed, else -1.
const mag = { x: 0, z: 0, present: false, pressed: false, locked: false, via: '', dial: HOVER, charge: 0, pen: -1 };
const Fs = { x: 0, v: 0 };
// E is the field envelope; it follows the magnet on a spring.
// L is the window centre, always a node of the fixed world lattice.
const E = { x: 0, z: 0, vx: 0, vz: 0, ax: 0, az: 0 }, L = { x: 0, z: 0, i: 0, j: 0 };
// Crowding radius in world units, squared.
const CW2 = CS2 * LAM * LAM;
let crowdNow = 0, idleAmt = 0, stirT = 0, tNow = 0, amax = 0;

// One cell per lattice point, axial coordinates within K rings.
const NC = 1 + 3 * K * (K + 1);
const CU = new Float32Array(NC), CV = new Float32Array(NC), CR = new Float32Array(NC);
const CI = new Int16Array(NC), CJ = new Int16Array(NC), SRC = new Int16Array(NC);
const CF = new Float32Array(NC), WA = new Float32Array(NC), WS = new Float32Array(NC), PH = new Float32Array(NC);
const A = new Float32Array(NC), VA = new Float32Array(NC), SX = new Float32Array(NC), SZ = new Float32Array(NC);
const VSX = new Float32Array(NC), VSZ = new Float32Array(NC), COFF = new Int32Array(NC), FORM = new Uint8Array(NC);
// Each cell's crowded world position and crowding weight.
const NX = new Float32Array(NC), NZ = new Float32Array(NC), CE = new Float32Array(NC);
const CD = new Float32Array(KW * KW * 4), CIDX = new Int16Array(KW * KW).fill(-1);
let nc = 0;
for (let j = -K; j <= K; j++) for (let i = -K; i <= K; i++) {
  if (Math.abs(i + j) > K) continue;
  CI[nc] = i;
  CJ[nc] = j;
  CU[nc] = i + j / 2;
  CV[nc] = j * S3;
  CR[nc] = Math.hypot(CU[nc], CV[nc]);

  CF[nc] = smooth(7.6, 5.6, CR[nc]);

  CIDX[(j + K) * KW + i + K] = nc;

  WA[nc] = jit(0.15);
  WS[nc] = jit(0.18);
  PH[nc] = Math.random() * TAU;
  nc++;
}

// Spikes stand on fixed world nodes; the window steps whole cells.
// Cell state moves with the step, so no spike slides.
const SHIFT = [[A, 0], [VA, 0], [SX, 0], [SZ, 0], [VSX, 0], [VSZ, 0], [FORM, 0], [NX, 0], [NZ, 0], [CE, 0],
  [WA, () => jit(0.15)], [WS, () => jit(0.18)], [PH, () => Math.random() * TAU]];
function anchor(x, z) {
  const fj = z / (S3 * LAM), fi = x / LAM - 0.5 * fj, fk = -fi - fj;
  let ri = Math.round(fi), rj = Math.round(fj);
  const rk = Math.round(fk), di0 = Math.abs(ri - fi), dj0 = Math.abs(rj - fj), dk0 = Math.abs(rk - fk);
  if (di0 > dj0 && di0 > dk0) ri = -rj - rk;
  else if (dj0 > dk0) rj = -ri - rk;

  if (!di && !dj) return;
  // The window holds until the envelope is well past the cell edge.
  if (Math.hypot(x - L.x, z - L.z) < 0.62 * LAM) return;
  for (let k = 0; k < nc; k++) {
    const i = CI[k] + di, j = CJ[k] + dj;
    SRC[k] = Math.abs(i) <= K && Math.abs(j) <= K ? CIDX[(j + K) * KW + i + K] : -1;
  }
  for (const [arr, fill] of SHIFT) {
    const old = arr.slice();
    for (let k = 0; k < nc; k++) arr[k] = SRC[k] >= 0 ? old[SRC[k]] : fill ? fill() : 0;
  }
  // SPT stores times; a new cell has never thrown.
  const spt = SPT.slice();
  for (let k = 0; k < nc; k++) SPT[k] = SRC[k] >= 0 ? spt[SRC[k]] : -9;

  for (const br of bridges) for (const e of [br.a, br.b]) {
    if (e.kind !== 'tip' || e.k < 0) continue;
    const i = CI[e.k] - di, j = CJ[e.k] - dj;
    e.k = Math.abs(i) <= K && Math.abs(j) <= K ? CIDX[(j + K) * KW + i + K] : -1;

  L.j = rj;

function spring2(s, tx, tz, w, z, h) {
  s.ax = w * w * (tx - s.x) - 2 * z * w * s.vx;
  s.az = w * w * (tz - s.z) - 2 * z * w * s.vz;
  s.vx += s.ax * h;
  s.vz += s.az * h;
  s.x += s.vx * h;
  s.z += s.vz * h;

// Spikes swell, sway and melt on their own springs.
function cellsStep(h, F, crowd, atten, mx, mz) {

  const ws = reduce ? 20 : 13, zs = reduce ? 1 : 0.16;

    const bx = L.x + CU[k] * LAM - E.x, bz = L.z + CV[k] * LAM - E.z, b2 = bx * bx + bz * bz;
    const ce = Math.exp(-b2 / CW2), s = 1 - crowd * ce, dx = bx * s, dz = bz * s, x = E.x + dx, z = E.z + dz;

    NZ[k] = z;

    const f = F / (1 + (dx * dx + dz * dz) / SIG2) ** 1.5;

      VSZ[k] += (os * os * (tz - SZ[k]) - 2 * zs * os * VSZ[k]) * h;
      SX[k] += VSX[k] * h;
      SZ[k] += VSZ[k] * h;

    }
    if (Math.abs(at - A[k]) > 1e-4 || Math.abs(VA[k]) > 1e-3) busy = true;
    if (A[k] > top) top = A[k];

    if (!FORM[k]) {

/* ---------- the pool: a shallow-water heightfield ---------- */
const G = small ? 96 : 128, DX = (2 * RIN) / G;
const H = new Float32Array(G * G), V = new Float32Array(G * G), P = new Float32Array(G * G), PHI = new Float32Array(G * G);

function simInit() {

    GZW[m] = at(z);

  const fo = [], fi = [];
  for (let z = 0; z < G; z++) for (let x = 0; x < G; x++) {
    const k = z * G + x;
    if (ins[k] || Math.hypot(at(x), at(z)) > RIN + 3 * DX) continue;

      if (a * a + b * b < bd) { bd = a * a + b * b; best = zz * G + xx; }

}
// The pull is a pressure head: a tight mound, a broad swell.
function pressure(F) {
  if (F < 1e-4) {

    return;
  }

  const hm = 0.05 * F, hb = 0.018 * F, ex = E.x, ez = E.z;
  for (let m = 0; m < NIN; m++) {

    P[IN[m]] = hm * Math.exp(-d2 / 0.073) + hb * Math.exp(-d2 / 0.38);

}

  ink: { base: [0.07, 0.003, 270], glow: [0.86, 0.09, 215], inner: 0, irid: 0, rough: 0.07, light: 1 },
  alien: { base: [0.05, 0.02, 165], glow: [0.86, 0.23, 150], inner: 0.9, irid: 0, rough: 0.05, light: 0.3 },
  magma: { base: [0.04, 0.01, 35], glow: [0.72, 0.2, 45], inner: 2.2, irid: 0, rough: 0.08, light: 0.08 },
  oil: { base: [0.08, 0.006, 280], glow: [0.93, 0.02, 250], inner: 0, irid: 1, rough: 0.05, light: 1 },
};
const FLUID_KEY = 'stimming.ferro.fluid';
let fluidNow = 'ink', GLU = null, lightK = 1;
const inks = [];
try { const v = localStorage.getItem(FLUID_KEY); if (FLUIDS[v]) fluidNow = v; } catch (err) { /* storage is optional */ }
// Light from inside: thin tips and grazing rims glow brightest.
function innerGlow(shader, tip) {
  Object.assign(shader.uniforms, GLU);
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', '#include <common>\nuniform float uInner;\nuniform vec3 uInnerCol;')
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
\tfloat tipG = ${tip}, ndv = abs(dot(normal, normalize(vViewPosition)));
\ttotalEmissiveRadiance += uInnerCol * uInner * (0.004 + 1.5 * pow(tipG, 2.5) + 0.25 * pow(1.0 - ndv, 7.0));`);
}
// One fluid part with the inner glow and its own program.
function inkPart(params, tip, key) {
  const m = new THREE.MeshPhysicalMaterial(params);
  m.onBeforeCompile = shader => innerGlow(shader, tip);
  m.customProgramCacheKey = () => key;
  inks.push(m);
  return m;
}
function setFluid(name) {
  fluidNow = FLUIDS[name] ? name : 'ink';
  if (!glow) return;
  const f = FLUIDS[fluidNow], col = new THREE.Color().setRGB(...oklchRgb(...f.glow), THREE.SRGBColorSpace);
  for (const m of inks) {
    m.color.setRGB(...oklchRgb(...f.base), THREE.SRGBColorSpace);
    m.roughness = f.rough;
    m.iridescence = f.irid;
    m.iridescenceIOR = 2;
    m.iridescenceThicknessRange = [200, 700];
  }
  GLU.uInner.value = f.inner;
  lightK = f.light;
  GLU.uInnerCol.value.copy(col);
  // The glow, its light and the groove take the fluid's hue.
  glow.sprite.material.color.copy(col);
  glow.light.color.copy(col);
  groove.material.color.copy(col).multiplyScalar(0.55);
  if (ready) { draw(); wake(); }
}
const fluidPick = choices(document.querySelector('.choices'), v => {
  setFluid(v);
  try { localStorage.setItem(FLUID_KEY, fluidNow); } catch (err) { /* storage is optional */ }
});
fluidPick.set(fluidNow);

/* ---------- start: WebGL setup in idle slices ---------- */
function failed() {
  panel.querySelector('.fail').hidden = false;
}
async function start() {
  let RoomEnvironment;
  try {
    THREE = await import('three');
    ({ RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js'));
  } catch (err) {
    console.error(err);
    return failed();
  }
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (err) {
    console.error(err);
    return failed();
  }
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.setClearColor(0x121316);
  const canvas = renderer.domElement;
  canvas.setAttribute('aria-hidden', 'true');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(27, 16 / 9, 0.1, 100);
  ray = new THREE.Raycaster();
  plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  ndc = new THREE.Vector2();
  hitV = new THREE.Vector3();
  tmp = new THREE.Vector3();
  await idle();

  // The room's light panels give every spike a crisp reflection.
  const room = new RoomEnvironment();
  // Dark walls make it a studio, so the black reads as black.
  room.traverse(o => {
    if (!o.isMesh) return;
    if (o.material.isMeshStandardMaterial) {
      o.material.color.setScalar(0.06);
      // The clutter boxes would block the low panels.
      if (o.material.side !== THREE.BackSide) o.visible = false;
    }
    // The side panel dims; the one the mirror faces goes.
    else if (o.position.x > 10) o.material.color.setScalar(4);
    else if (o.position.z < -10) o.visible = false;
  });
  const panelBox = (w, h, d, v, x, y, z, ry = 0) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial());
    m.material.color.setScalar(v);
    m.position.set(x, y, z);
    m.rotation.y = ry;
    room.add(m);
  };
  // Long strips behind the dish draw a line across the mirror.
  // One sits in view from each camera height.
  // Each strip sits at one camera elevation: 32 or 45 degrees.
  panelBox(26, 0.2, 0.2, 4, 0, 11.1, -17.8);
  panelBox(30, 0.26, 0.26, 4, 0, 18.4, -18.4);
  // Low panels light the steep flanks, not the flat pool.
  for (let k = 0; k < 9; k++) {
    const a = (k / 9) * TAU + 0.2;
    panelBox(2.2, 3.2, 0.1, k % 3 ? 4 : 6.5, Math.sin(a) * 12.5, 1.9, Math.cos(a) * 12.5, a);
  }
  // Two panels carry the pole colours into the spike streaks.
  room.children.slice(-9).forEach((m, k) => {
    if (k === 2) m.material.color.setRGB(...oklchRgb(...WARM), THREE.SRGBColorSpace).multiplyScalar(6);
    if (k === 7) m.material.color.setRGB(...oklchRgb(...COOL), THREE.SRGBColorSpace).multiplyScalar(6);
  });
  // No extra blur: bright panels would bloom across the mirror.
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(room, 0).texture;
  room.dispose();
  pm.dispose();
  // A soft spot pools light on the dish and sparks each spike.
  const key = new THREE.SpotLight(0xfff4ea, 9, 0, 0.36, 1, 0);
  key.position.set(-1.7, 7, 2.6);
  key.target.position.set(0, 0, 0);
  // A cool back light catches the far flanks.
  const back = new THREE.DirectionalLight(0xdde6ff, 1.6);
  back.position.set(3, 2.2, -3.2);
  scene.add(key, key.target, back);

  const table = new THREE.Mesh(
    new THREE.CircleGeometry(40, 64),
    new THREE.MeshStandardMaterial({ color: 0x101114, roughness: 0.9, metalness: 0, envMapIntensity: 0.25 }),
  );
  table.rotation.x = -Math.PI / 2;
  table.position.y = PLINTH_Y - 0.09;
  scene.add(table);
  // A chamfered steel plinth carries the dish.
  const lathe = pts => new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), 160);
  const py = PLINTH_Y, pr = PLINTH_R;
  const plinth = new THREE.Mesh(
    lathe([[0, py - 0.09], [pr - 0.03, py - 0.09], [pr, py - 0.06], [pr, py - 0.025], [pr - 0.025, py], [0, py]]),
    new THREE.MeshPhysicalMaterial({
      color: new THREE.Color().setRGB(...oklchRgb(0.24, 0.01, 265), THREE.SRGBColorSpace),
      metalness: 0.6, roughness: 0.42, clearcoat: 0.15, clearcoatRoughness: 0.4, side: THREE.DoubleSide,
    }),
  );
  scene.add(plinth);
  // A cut groove rings the plinth top and carries the glow's hue.
  groove = new THREE.Mesh(new THREE.RingGeometry(pr - 0.085, pr - 0.072, 160), new THREE.MeshBasicMaterial());
  groove.rotation.x = -Math.PI / 2;
  groove.position.y = py + 0.0008;
  scene.add(groove);
  // A thin glass petri dish: straight wall, rounded lip, flat floor.
  const glass = new THREE.MeshPhysicalMaterial({
    color: 0x1c2028, metalness: 0, roughness: 0.04, ior: 1.5, specularIntensity: 1, envMapIntensity: 1.6,
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
  });
  glass.onBeforeCompile = shader => {
    // Glass shows through face on and mirrors at grazing angles.
    shader.fragmentShader = shader.fragmentShader.replace('#include <normal_fragment_maps>',
      '#include <normal_fragment_maps>\n\tdiffuseColor.a = mix(0.06, 0.92, pow(1.0 - abs(dot(normal, normalize(vViewPosition))), 3.0));');
  };
  glass.customProgramCacheKey = () => 'ferro-glass';
  const dish = new THREE.Mesh(lathe([[0, py], [1.024, py], [1.03, py + 0.006], [1.03, 0.062], [1.027, 0.071],
    [1.0195, 0.0755], [1.0065, 0.0725], [1.0005, 0.064], [0.9995, FLOOR_Y], [0, FLOOR_Y]]), glass);
  dish.renderOrder = 1;
  scene.add(dish);
  await idle();

  simInit();
  cellTex = new THREE.DataTexture(CD, KW, KW, THREE.RGBAFormat, THREE.FloatType);
  bulkTex = new THREE.DataTexture(H, G, G, THREE.RedFormat, THREE.FloatType);
  for (const t of [cellTex, bulkTex]) { t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; }
  U = {
    uCells: { value: cellTex }, uBulk: { value: bulkTex }, uL: { value: new THREE.Vector2() }, uC: { value: new THREE.Vector2() },
    uLam: { value: LAM }, uCrowd: { value: 0 }, uG: { value: G }, uRclip: { value: RIN + 0.02 },
    uEps: { value: 0.35 / MESH_N }, uAmax: { value: 0 }, uRin: { value: RIN + 0.003 },
  };
  GLU = { uInner: { value: 0 }, uInnerCol: { value: new THREE.Color() } };
  // Deep black with a clear coat: pure ink, no film sheen.
  const INK = {
    color: 0x030304, metalness: 0, roughness: 0.07, ior: 1.6, specularIntensity: 1,
    clearcoat: 0.6, clearcoatRoughness: 0.05, envMapIntensity: 2,
  };
  const ink = new THREE.MeshPhysicalMaterial(INK);
  inks.push(ink);
  ink.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, U);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\n' + VERT)
      .replace('#include <beginnormal_vertex>', 'vec3 fPos;\nvec3 objectNormal;\nferro(position.xy, fPos, objectNormal);')
      .replace('#include <begin_vertex>', 'vec3 transformed = fPos;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec2 vXZ;\nuniform float uRin;')
      .replace('#include <common>', '#include <common>\nvarying float vTip;')
      .replace('void main() {', 'void main() {\n\tif (dot(vXZ, vXZ) > uRin * uRin) discard;');
    innerGlow(shader, 'vTip');
  };
  ink.customProgramCacheKey = () => 'ferro-ink';
  const fluid = new THREE.Mesh(buildPool(MESH_N), ink);
  fluid.frustumCulled = false;
  scene.add(fluid);
  // The fluid's side shows through the glass wall.
  const body = new THREE.Mesh(new THREE.CylinderGeometry(RIN, RIN, 0.012 - FLOOR_Y, 160, 1, true), inkPart(INK, '0.0', 'ferro-body'));
  body.position.y = (0.012 + FLOOR_Y) / 2;
  scene.add(body);
  // Loose beads share the fluid's finish.
  dropMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 28, 18), inkPart(INK, '0.55', 'ferro-drop'), NDROP);
  dropMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  dropMesh.frustumCulled = false;
  dropMesh.count = 0;
  scene.add(dropMesh);
  // Necks: one tube per bridge, two while a snapped neck recoils.
  const ring = 18, segs = 28, gp = [], gi = [];
  for (let j = 0; j <= segs; j++) for (let i = 0; i <= ring; i++) {
    const a = (i / ring) * TAU;
    gp.push(Math.cos(a), j / segs, Math.sin(a));
  }
  // Wound to face outward.
  for (let j = 0; j < segs; j++) for (let i = 0; i < ring; i++) {
    const a = j * (ring + 1) + i, b = a + 1, c = a + ring + 1, d = c + 1;
    gi.push(a, b, c, b, d, c);
  }
  const ng = new THREE.BufferGeometry();
  ng.setAttribute('position', new THREE.Float32BufferAttribute(gp, 3));
  ng.setIndex(gi);
  NA = new THREE.InstancedBufferAttribute(new Float32Array(NBR * 2 * 4), 4).setUsage(THREE.DynamicDrawUsage);
  NB2 = new THREE.InstancedBufferAttribute(new Float32Array(NBR * 2 * 4), 4).setUsage(THREE.DynamicDrawUsage);
  NN = new THREE.InstancedBufferAttribute(new Float32Array(NBR * 2 * 2), 2).setUsage(THREE.DynamicDrawUsage);
  ng.setAttribute('iA', NA);
  ng.setAttribute('iB', NB2);
  ng.setAttribute('iN', NN);
  const neckInk = new THREE.MeshPhysicalMaterial(INK);
  inks.push(neckInk);
  neckInk.onBeforeCompile = shader => {
    innerGlow(shader, '0.8');
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\n' + NECK)
      .replace('#include <beginnormal_vertex>', 'vec3 nPos;\nvec3 objectNormal;\nneck(position, nPos, objectNormal);')
      .replace('#include <begin_vertex>', 'vec3 transformed = nPos;');
  };
  neckInk.customProgramCacheKey = () => 'ferro-neck';
  neckMesh = new THREE.InstancedMesh(ng, neckInk, NBR * 2);
  neckMesh.frustumCulled = false;
  neckMesh.count = 0;
  scene.add(neckMesh);
  glow = buildGlow();
  scene.add(glow.sprite, glow.light);
  setFluid(fluidNow);

  panel.prepend(canvas);
  fitRenderer(renderer, panel, 1.5, (w, h) => {
    fitCamera(w, h);
    if (ready) { draw(); wake(); }
  }, 1.4e6);
  if (!panel.clientWidth) fitCamera(16, 9);
  await idle();
  // Async compile keeps the shader build off the main thread.
  await renderer.compileAsync(scene, camera);
  ready = true;
  // The page opens with a magnet resting over the middle.
  if (!mag.via) { mag.via = 'intro'; mag.present = true; mag.x = 0; mag.z = 0.05; }
  draw();
  requestAnimationFrame(() => canvas.classList.add('on'));
  stir();
}
start().catch(err => { console.error(err); failed(); });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
</body>
