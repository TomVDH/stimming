<script type="module">

/* ---------- sound: synthesised, started by the first gesture ---------- */

// The dish's inner radius is 1; the fluid rests at y = 0.
const RIN = 1, K = 9, KW = 2 * K + 1, RHO = 0.7;

const CS2 = 3.2 ** 2, SIGL = 0.3, LEANMAX = 0.22;

function spring2(s, tx, tz, w, z, h) {

  const ink = new THREE.MeshPhysicalMaterial({
    color: 0x030304, metalness: 0, roughness: 0.07, ior: 1.6, specularIntensity: 1,
    clearcoat: 0.6, clearcoatRoughness: 0.05,
    iridescence: 0.15, iridescenceIOR: 1.32, iridescenceThicknessRange: [260, 560],
    envMapIntensity: 2,
  });
  ink.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, U);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\n' + VERT)
      .replace('#include <beginnormal_vertex>', 'vec3 fPos;\nvec3 objectNormal;\nferro(position.xy, fPos, objectNormal);')
      .replace('#include <begin_vertex>', 'vec3 transformed = fPos;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec2 vXZ;\nvarying float vSheen;\nuniform float uRin;')
      .replace('void main() {', 'void main() {\n\tif (dot(vXZ, vXZ) > uRin * uRin) discard;')
      .replace('#include <lights_physical_fragment>',
        '#include <lights_physical_fragment>\n#ifdef USE_IRIDESCENCE\n\tmaterial.iridescenceThickness = mix(260.0, 560.0, vSheen);\n#endif');
  };
  ink.customProgramCacheKey = () => 'ferro-ink';
  const fluid = new THREE.Mesh(buildPool(MESH_N), ink);
  fluid.frustumCulled = false;
  scene.add(fluid);

  panel.prepend(canvas);
  fitRenderer(renderer, panel, 1.5, (w, h) => {
    fitCamera(w, h);
    if (ready) { draw(); wake(); }
  }, 1.4e6);
  if (!panel.clientWidth) fitCamera(16, 9);
  await idle();
  // Async compile keeps the shader build off the main thread.
  await renderer.compileAsync(scene, camera);
  ready = true;
  // The page opens with a magnet resting over the middle.
  if (!mag.via) { mag.via = 'intro'; mag.present = true; mag.x = 0; mag.z = 0.05; }
  draw();
  requestAnimationFrame(() => canvas.classList.add('on'));
  stir();
}
start().catch(err => { console.error(err); failed(); });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
