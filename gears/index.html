<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gear train</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Gear train: one planetary gearset seen from above. */
:root { --stage: oklch(0.17 0.02 260); }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; cursor: grab; }
.stage canvas.held { cursor: grabbing; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Gear train</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--gears" id="stage" tabindex="0" role="application" aria-label="A planetary gearset: a sun gear, four planets on an arm, and a ring gear. Drag round the centre to turn it; flick to let it coast. One part is held still: 1 holds the ring, 2 the sun, 3 the arm. Arrow keys turn it.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Gear train needs canvas drawing, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" role="group" aria-label="Hold still">
        <button class="chip" type="button" data-value="ring" aria-pressed="true" aria-keyshortcuts="1">Hold ring</button>
        <button class="chip" type="button" data-value="sun" aria-pressed="false" aria-keyshortcuts="2">Hold sun</button>
        <button class="chip" type="button" data-value="arm" aria-pressed="false" aria-keyshortcuts="3">Hold arm</button>
      </div>
      <div class="actions">
        <button class="chip" id="reset" type="button" aria-disabled="true">Reset</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag</dt><dd>turn</dd></div>
        <div><dt>Flick</dt><dd>coast</dd></div>
        <div class="fine"><dt><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></dt><dd>hold</dd></div>
        <div class="fine"><dt><kbd>Arrows</kbd></dt><dd>turn</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Gear train</h1><div class="vignette" hidden></div></section>
</div>

<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
<script type="module">
import { initPage, audioKit, choices, fitCanvas, reduced } from '../shared/stim.js';
initPage({ id: 'gears' });

const stage = document.getElementById('stage'), canvas = stage.querySelector('canvas');
const ctx = canvas.getContext('2d');
if (!ctx) { stage.querySelector('.fail').hidden = false; throw new Error('no canvas'); }
const resetBtn = document.getElementById('reset');
const TAU = Math.PI * 2;

/* ---------- gearset ---------- */
// Tooth counts mesh: ring = sun + 2 planets; four planets space evenly.
const ZS = 24, ZP = 18, ZR = 60, PLANETS = 4;
// Angles of sun, arm and ring; the planets follow from these.
const st = { sun: 0, arm: 0, ring: 0 };
let hold = 'ring';
// Each hold setting turns one part and lets one part follow.
const INPUT = { ring: 'sun', sun: 'ring', arm: 'sun' };
// The free part follows the input; the held part stays put.
function solve() {
  if (hold === 'arm') st.ring = st.arm - (st.sun - st.arm) * ZS / ZR;
  else st.arm = (st.ring * ZR + st.sun * ZS) / (ZR + ZS);
}
const planetSpin = () => st.arm - (st.sun - st.arm) * ZS / ZP;

/* ---------- drawing ---------- */
let size = { w: 1, h: 1, dpr: 1 }, m = 4;
function fit() {
  size = fitCanvas(canvas, { maxDpr: 2, budget: 2.4e6 });
  // The ring's rim fits the shorter side with a margin.
  m = (Math.min(size.w, size.h) * 0.44) / (ZR / 2 + 5.5);
  draw();
}
// One tooth outline per gear; internal gears point their teeth inward.
function toothed(z, r, inward = false) {
  const p = TAU / z, add = inward ? -m : m, ded = inward ? 1.25 * m : -1.25 * m;
  const path = new Path2D();
  for (let i = 0; i < z; i++) {
    const a = i * p;
    const pts = [[r + ded, a - 0.27 * p], [r + add, a - 0.12 * p], [r + add, a + 0.12 * p], [r + ded, a + 0.27 * p]];
    pts.forEach(([rr, aa], j) => (i === 0 && j === 0 ? path.moveTo : path.lineTo).call(path, rr * Math.cos(aa), rr * Math.sin(aa)));
  }
  path.closePath();
  return path;
}
let shapes = null;
function build() {
  const rs = (m * ZS) / 2, rp = (m * ZP) / 2, rr = (m * ZR) / 2;
  const ring = new Path2D();
  ring.arc(0, 0, rr + 5.5 * m, 0, TAU);
  ring.addPath(toothed(ZR, rr, true));
  shapes = { rs, rp, rr, sun: toothed(ZS, rs), planet: toothed(ZP, rp), ring };
}
// Colour by role: the input glows brass, the follower steel, the held part sleeps.
const LOOK = {
  input: ['oklch(0.9 0.12 85)', 'oklch(0.62 0.14 55)'],
  follow: ['oklch(0.88 0.04 230)', 'oklch(0.5 0.06 250)'],
  held: ['oklch(0.42 0.015 260)', 'oklch(0.26 0.015 265)'],
  planet: ['oklch(0.84 0.05 200)', 'oklch(0.48 0.07 220)'],
};
function roleOf(part) { return part === hold ? 'held' : part === INPUT[hold] ? 'input' : 'follow'; }
function metal(r, [a, b]) {
  const g = ctx.createLinearGradient(-r, -r, r, r);
  g.addColorStop(0, a); g.addColorStop(1, b);
  return g;
}
function shine(path, r) {
  const g = ctx.createRadialGradient(-r * 0.4, -r * 0.5, 0, -r * 0.4, -r * 0.5, r * 1.3);
  g.addColorStop(0, 'rgba(255,255,255,0.32)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fill(path, 'evenodd');
}
function bore(r) {
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
  ctx.fillStyle = 'oklch(0.14 0.015 265)'; ctx.fill();
}
function drawGear(path, r, angle, look, holeR) {
  ctx.save();
  ctx.rotate(angle);
  ctx.fillStyle = metal(r, look);
  ctx.fill(path, 'evenodd');
  shine(path, r);
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.stroke(path);
  if (holeR) bore(holeR);
  ctx.restore();
}
function draw() {
  if (!shapes) build();
  const { w, h, dpr } = size;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.translate(w / 2, h / 2);
  const { rs, rp, rr } = shapes, c = rs + rp;
  // The ring, outermost.
  drawGear(shapes.ring, rr + 5.5 * m, st.ring, LOOK[roleOf('ring')]);
  // A bolt on the ring shows its turn.
  ctx.save(); ctx.rotate(st.ring);
  ctx.beginPath(); ctx.arc(rr + 3 * m, 0, 1.1 * m, 0, TAU); ctx.fillStyle = 'oklch(0.14 0.015 265)'; ctx.fill();
  ctx.restore();
  // The arm sits under the planets.
  ctx.save(); ctx.rotate(st.arm);
  ctx.fillStyle = metal(c, LOOK[roleOf('arm')]);
  for (let k = 0; k < PLANETS; k++) {
    ctx.save(); ctx.rotate((k * TAU) / PLANETS);
    ctx.beginPath(); ctx.roundRect(0, -1.6 * m, c, 3.2 * m, 1.6 * m); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  // Planets ride the arm and spin against the sun.
  const spin = planetSpin();
  for (let k = 0; k < PLANETS; k++) {
    const phi = st.arm + (k * TAU) / PLANETS;
    ctx.save(); ctx.translate(c * Math.cos(phi), c * Math.sin(phi));
    drawGear(shapes.planet, rp, spin + (k * TAU) / PLANETS + Math.PI + TAU / ZP / 2, LOOK.planet, 1.6 * m);
    ctx.restore();
  }
  // The sun, centre.
  drawGear(shapes.sun, rs, st.sun, LOOK[roleOf('sun')], 2.2 * m);
  // A hub mark shows which way the sun faces.
  ctx.save(); ctx.rotate(st.sun);
  ctx.fillStyle = 'oklch(0.14 0.015 265)';
  ctx.fillRect(2.4 * m, -0.6 * m, 4 * m, 1.2 * m);
  ctx.restore();
}

/* ---------- sound ---------- */
// Each tooth that passes clicks; pitch rises with speed.
const kit = audioKit({ gain: 0.5, keys: new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', '1', '2', '3']) });
let lastTooth = 0, lastClick = 0;
function click(speed) {
  const ac = kit.live(); if (!ac || !kit.noise) return;
  const now = performance.now();
  if (now - lastClick < 33) return;
  lastClick = now;
  const src = ac.createBufferSource(); src.buffer = kit.noise;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 9;
  bp.frequency.value = 1400 + Math.min(4200, Math.abs(speed) * 260);
  const g = ac.createGain(), t = ac.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
  src.connect(bp); bp.connect(g); g.connect(kit.out);
  src.start(t, Math.random() * 0.5, 0.06);
}
function tick(speed) {
  const tooth = Math.floor(st[INPUT[hold]] / (TAU / ZS));
  if (tooth !== lastTooth) { lastTooth = tooth; click(speed); }
}

/* ---------- motion ---------- */
let omega = 0, raf = 0, prevT = 0, dragging = false;
function turn(d) {
  st[INPUT[hold]] += d;
  solve();
  resetBtn.setAttribute('aria-disabled', 'false');
}
function frame(t) {
  const dt = Math.min(0.05, (t - (prevT || t)) / 1000);
  prevT = t;
  if (!dragging) {
    turn(omega * dt);
    // Friction lets a flick coast and settle.
    omega *= Math.exp(-dt * 1.4);
  }
  tick(omega);
  draw();
  if (dragging || Math.abs(omega) > 0.02) raf = requestAnimationFrame(frame);
  else { raf = 0; omega = 0; prevT = 0; kit.rest(() => !raf); }
}
const wake = () => { if (!raf) raf = requestAnimationFrame(frame); };

// Dragging round the centre turns the input; the last moves set the flick.
let lastA = 0, lastT = 0;
const angleAt = e => { const r = canvas.getBoundingClientRect(); return Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2); };
canvas.addEventListener('pointerdown', e => {
  dragging = true; canvas.classList.add('held'); canvas.setPointerCapture(e.pointerId);
  lastA = angleAt(e); lastT = performance.now(); omega = 0; wake();
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const a = angleAt(e), now = performance.now();
  let d = a - lastA;
  if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
  turn(d);
  const dt = Math.max(1, now - lastT) / 1000;
  omega = omega * 0.6 + (d / dt) * 0.4;
  lastA = a; lastT = now;
});
const release = () => {
  if (!dragging) return;
  dragging = false; canvas.classList.remove('held');
  // Reduced motion stops on release instead of coasting.
  if (reduced() || performance.now() - lastT > 80) omega = 0;
  wake();
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

const hold3 = choices(document.querySelector('.choices'), v => { hold = v; solve(); draw(); });
stage.addEventListener('keydown', e => {
  const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
  if (step) { e.preventDefault(); omega += step * (reduced() ? 0 : 2.4); if (reduced()) turn(step * (TAU / ZS)); wake(); draw(); return; }
  const pick = { 1: 'ring', 2: 'sun', 3: 'arm' }[e.key];
  if (pick) { hold3.set(pick); hold = pick; solve(); draw(); }
});
resetBtn.addEventListener('click', () => {
  st.sun = st.arm = st.ring = 0; omega = 0;
  resetBtn.setAttribute('aria-disabled', 'true');
  draw();
});

new ResizeObserver(() => { shapes = null; fit(); }).observe(stage);
fit();
</script>
</body>
</html>
