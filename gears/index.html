<title>Gear train</title>
<meta name="claude:viewport-fit-sides" content="cover">

main { display: grid; gap: 14px; min-width: 0; }

.stage {

  let best = null, bs = Infinity, near = null, nd = Infinity;
  for (let i = i0 - 2; i <= i0 + 2; i++) for (let j = j0 - 2; j <= j0 + 2; j++) {
    const [px, py] = pegXY(i, j), d = Math.hypot(px - x, py - y);
    if (d > RAD) continue;
    if (d < nd && inWindow(i, j)) { nd = d; near = [px, py]; }
    const c = evalPeg(g, i, j);
    if (!c) continue;
    const sc = d - (c.drive ? 34 : 0) - (c.mesh ? 16 : 0);
    if (sc < bs) { bs = sc; best = c; }
  }
  return { best, near };
}
let dirty = false;
const history = [];
function setDirty(v) {
  dirty = v;
  resetB.setAttribute('aria-disabled', String(!v));
}
function settle(g, c, dur) {
  mount(g, c.i, c.j);
  history.push(g);
  slide(g, c.x, c.y, 1, dur, easeBack, () => place(g, boardLayer));
  seat(c.x, N_(g));
  if (c.mesh) setTimeout(() => tick(c.x, N_(g), 0), 40);
  setDirty(true);
}
function toTray(g, dur = 0.42) {
  if (g.peg) unmount(g);
  const i = history.indexOf(g);
  if (i >= 0) history.splice(i, 1);
  const [x, y] = slots[g.slot];
  place(g, dragLayer);
  slide(g, x, y, trayScale, dur, easeOut, () => place(g, trayLayer));
}
// Enter, or a tap on a tray gear: find the best peg on the train.
function autoPlace(g) {
  let best = null, bs = Infinity;
  for (let i = -B.ni; i <= B.ni; i++) for (let j = -B.nj; j <= B.nj; j++) {
    const c = evalPeg(g, i, j);
    if (!c) continue;
    const sc = (c.drive ? 0 : c.mesh ? 4000 : 8000) + Math.hypot(c.x - B.cx, c.y - B.cy);
    if (sc < bs) { bs = sc; best = c; }
  }
  if (!best) { refuse(g.dx); nudge(g); return false; }
  place(g, dragLayer);
  settle(g, best, 0.5);
  return true;
}
function nudge(g) {
  const x = g.dx, y = g.dy, s = g.ds;
  slide(g, x + 9, y, s, 0.08, easeOut, () => slide(g, x, y, s, 0.3, easeBack));
}

/* ---------- the loop: runs only while something moves ---------- */
let raf = 0, last = 0, onScreen = true, frames = 0;
function wake() {
  if (!raf && ready && onScreen && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(ms) {
  raf = 0;
  const dt = Math.min(Math.max(0, (ms - last) / 1000), 1 / 30);
  last = ms;
  let busy = stepDriver(dt);
  busy = stepDrag(dt) || busy;
  busy = stepAnims(dt) || busy;
  teethTick();
  render();
  const hand = [...ptrs.values()].some(p => p.mode === 'crank') || keyDir;
  creak(hand ? 0.075 * sstep(0.15, 1.4, Math.abs(omega)) * (1 - 0.6 * sstep(5, 11, Math.abs(omega))) : 0);
  if (hand && creakLvl > 0) busy = true;
  if (++frames === 2) { bgSvg.classList.add('on'); fgSvg.classList.add('on'); }
  if (busy && onScreen && !document.hidden) raf = requestAnimationFrame(frame);
  else { creak(0); rest(); }
}

/* ---------- input ---------- */
const ptrs = new Map();
function toWorld(e) {
  const r = stage.getBoundingClientRect();
  return [((e.clientX - r.left) / r.width) * VW, ((e.clientY - r.top) / r.height) * VH];
}
function pick(x, y) {
  let best = null, bd = 1.0;
  for (const g of gears) {
    if (g.held || (g.anim && !g.peg)) continue;
    let d;
    if (g.peg) d = Math.hypot(x - g.x, y - g.y) / (g.G.ra + (g.driver ? 10 : 2));
    else {
      const [sx, sy] = slots[g.slot], cw = wideLayout ? (T.x1 - T.x0) / 2 - 18 : (T.x1 - T.x0) / 6 - 6;
      d = Math.abs(x - sx) < cw / 2 && Math.abs(y - sy) < cw / 2 ? 0.99 * Math.hypot(x - sx, y - sy) / cw : 2;
    }
    if (d < bd) { bd = d; best = g; }
  }
  return best;
}
stage.addEventListener('pointerdown', e => {
  if (!ready || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const [x, y] = toWorld(e), g = pick(x, y);
  if (!g) return;
  if (g.driver && [...ptrs.values()].some(p => p.mode === 'crank')) return;
  try { stage.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  if (g.driver) {
    ptrs.set(e.pointerId, { mode: 'crank', a: Math.atan2(y - g.y, x - g.x), hist: [[performance.now(), theta]] });
    omega = 0;
  } else ptrs.set(e.pointerId, { mode: 'press', g, x0: x, y0: y, x, y, cx: e.clientX, cy: e.clientY });
  stage.classList.add('held');
  wake();
});
stage.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  const [x, y] = toWorld(e);
  if (!p) {
    if (e.pointerType === 'mouse' && ready) stage.classList.toggle('over', !!pick(x, y));
    return;
  }
  if (p.mode === 'crank') {
    const r = Math.hypot(x - driver.x, y - driver.y);
    if (r < 16) return;
    const a = Math.atan2(y - driver.y, x - driver.x), d = wrapPi(a - p.a);
    p.a = a;
    turn(d);
    if (blocked && Math.abs(d) > 0.004) clack(driver.x);
    const now = performance.now();
    p.hist.push([now, theta]);
    while (p.hist.length > 2 && now - p.hist[0][0] > 160) p.hist.shift();
  } else {
    p.x = x;
    p.y = y;
    if (p.mode === 'press' && Math.hypot(e.clientX - p.cx, e.clientY - p.cy) > 6) startDrag(p);
    if (p.mode === 'drag') aim(p);
  }
  wake();
});
function startDrag(p) {
  const g = p.g;
  p.mode = 'drag';
  p.from = g.peg ? [...g.peg] : null;
  if (g.peg) {
    const i = history.indexOf(g);
    if (i >= 0) history.splice(i, 1);
    unmount(g);
    setDirty(true);
  }
  g.anim = null;
  g.held = true;
  p.off = [g.dx - p.x0, g.dy - p.y0];
  p.s0 = g.ds;
  place(g, dragLayer);
  lift(g.dx);
}
// The dragged gear finds the best peg near it and leans toward it.
function aim(p) {
  const g = p.g, k = g.ds / p.s0, cx = p.x + p.off[0] * k, cy = p.y + p.off[1] * k;
  p.cx0 = cx; p.cy0 = cy;
  if (inTray(p.x, p.y) || p.x < B.x0 || p.x > B.x1 || p.y < B.y0 || p.y > B.y1) { p.target = null; p.home = true; ghostState = null; return; }
  p.home = false;
  const { best, near } = bestPeg(g, cx, cy);
  p.target = best;
  if (best) ghostState = { x: best.x, y: best.y, r: g.G.r, kind: best.drive ? 'drive' : best.mesh ? 'mesh' : 'free' };
  else ghostState = near ? { x: near[0], y: near[1], r: g.G.r, kind: 'bad' } : null;
}
function stepDrag(dt) {
  let busy = false;
  for (const p of ptrs.values()) {
    if (p.mode !== 'drag') continue;
    const g = p.g, ts = p.home ? trayScale * 1.12 : 1.04;
    g.ds += (ts - g.ds) * Math.min(1, dt * (reduce ? 30 : 14));
    if (Math.abs(ts - g.ds) > 0.001) busy = true;
    const k = g.ds / p.s0;
    let x = p.x + p.off[0] * k, y = p.y + p.off[1] * k;
    // A meshing peg pulls the gear a little and turns its teeth to suit.
    if (p.target) {
      const pull = p.target.mesh ? 0.3 : 0.15;
      x = lerp(x, p.target.x, pull);
      y = lerp(y, p.target.y, pull);
      if (p.target.mesh) {
        const nb = gears.filter(h => h.peg && h !== g && relation(g, p.target.x, p.target.y, h) === 1);
        const anchor = nb.find(h => h.k) || nb[0];
        if (anchor) {
          const want = meshAngle(g, p.target.x, p.target.y, anchor), dA = want - g.a;
          if (Math.abs(dA) > 1e-4) { g.a += dA * Math.min(1, dt * 16); busy = true; }
        }
      }
    }
    if (Math.abs(x - g.dx) > 0.05 || Math.abs(y - g.dy) > 0.05) {
      g.dx = lerp(g.dx, x, Math.min(1, dt * 30));
      g.dy = lerp(g.dy, y, Math.min(1, dt * 30));
      busy = true;
    }
    if (p.target || omega) busy = true;
  }
  return busy;
}
function release(e) {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  ptrs.delete(e.pointerId);
  if (!ptrs.size) stage.classList.remove('held');
  if (p.mode === 'crank') {
    omega = reduce ? clamp(handOmega(p, performance.now()), -4, 4) : handOmega(p, performance.now());
  } else if (p.mode === 'press') {
    if (!p.g.peg && e.type === 'pointerup') autoPlace(p.g);
  } else drop(p);
  wake();
}
function drop(p) {
  const g = p.g;
  g.held = false;
  ghostState = null;
  if (p.home) { toTray(g); return; }
  if (p.target) {
    const c = evalPeg(g, p.target.i, p.target.j);
    if (c) { settle(g, c, 0.12); return; }
  }
  // Refused: the gear slides back to where it came from.
  refuse(g.dx);
  const back = p.from && evalPeg(g, p.from[0], p.from[1]);
  if (back) settle(g, back, 0.38);
  else toTray(g);
}
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => stage.addEventListener(t, release));
stage.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') stage.classList.remove('over'); });
stage.addEventListener('contextmenu', e => e.preventDefault());

// Space spins the way the pawl allows.
function spin() {
  if (!ready) return;
  let dir = 1;
  const P = pawl.gear;
  if (P && P.k) dir = Math.sign(P.k * pawl.free);
  omega = clamp(omega + dir * (reduce ? 3.5 : 9.5), -W_MAX, W_MAX);
  if (jam) clack(driver.x);
  wake();
}
function preset(animate) {
  omega = 0;
  for (const g of gears) if (!g.driver && g.peg) { g.peg = null; }
  history.length = 0;
  rebuild();
  for (const [N, i, j] of PRESET) {
    const g = gears.find(h => N_(h) === N);
    mount(g, i, j);
    g.snap = animate ? g.snap : 0;
    g.snapV = 0;
  }
  for (const g of gears) {
    g.held = false;
    const [x, y, s] = homeOf(g);
    if (animate) {
      place(g, dragLayer);
      slide(g, x, y, s, 0.55, easeOut, () => place(g, g.peg ? boardLayer : trayLayer));
    } else {
      g.dx = x; g.dy = y; g.ds = s; g.anim = null;
      place(g, g.peg ? boardLayer : trayLayer);
    }
  }
  setDirty(false);
}
const spinB = document.getElementById('spin'), resetB = document.getElementById('reset');
spinB.addEventListener('click', spin);
resetB.addEventListener('click', () => { if (dirty) { preset(true); wake(); } });
const ARROW = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 };
const held = new Set();
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const k = e.key;
  if (ARROW[k]) {
    e.preventDefault();
    held.add(k);
    keyDir = Math.sign([...held].reduce((s, q) => s + ARROW[q], 0));
    wake();
  } else if (k === ' ') {
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (!e.repeat) spin();
  } else if (k === 'r' || k === 'R') {
    if (!e.repeat && ready) { preset(true); wake(); }
  } else if (k === 'Enter') {
    if (e.target.closest?.('button, a') || e.repeat || !ready) return;
    const g = gears.find(h => !h.driver && !h.peg && !h.held && !h.anim);
    if (g) autoPlace(g);
  } else if (k === 'Backspace' || k === 'Delete') {
    if (e.repeat || !ready) return;
    e.preventDefault();
    const g = history.length ? history[history.length - 1] : mounted().filter(h => !h.driver).pop();
    if (g) { toTray(g); setDirty(true); }
  }
});
addEventListener('keyup', e => {
  if (!ARROW[e.key]) return;
  held.delete(e.key);
  keyDir = Math.sign([...held].reduce((s, q) => s + ARROW[q], 0));
});
addEventListener('blur', () => { held.clear(); keyDir = 0; });
const sndB = document.getElementById('snd');
const showSound = () => sndB.setAttribute('aria-pressed', String(soundOn));
showSound();
sndB.addEventListener('click', () => {
  soundOn = !soundOn;
  showSound();
  try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (err) { /* storage is optional */ }
  if (soundOn) audio();
  else if (ac) { creak(0); ac.suspend()?.catch(() => {}); }
});

/* ---------- start ---------- */
// A layout change keeps every gear whose peg still fits.
function relayout() {
  const was = wideLayout;
  layout();
  drawBoard();
  buildPawl();
  for (const g of gears) if (g.peg) [g.x, g.y] = pegXY(...g.peg);
  for (const g of gears) {
    if (g.peg && !g.driver) {
      const keep = evalPeg(g, ...g.peg);
      if (!keep) { g.peg = null; }
    }
  }
  rebuild();
  for (const g of gears) {
    if (g.held) continue;
    g.anim = null;
    [g.dx, g.dy, g.ds] = homeOf(g);
    place(g, g.peg ? boardLayer : trayLayer);
  }
  pawlEls.last = NaN;
  render();
  return was !== wideLayout;
}
function boot() {
  if (!window.SVGSVGElement || !fgSvg.createSVGTransform) {
    stage.querySelector('.fail').hidden = false;
    return;
  }
  makeGears();
  layout();
  driver.peg = [...DRIVER_PEG];
  [driver.x, driver.y] = pegXY(...DRIVER_PEG);
  drawBoard();
  buildPawl();
  preset(false);
  ready = true;
  render();
  requestAnimationFrame(() => requestAnimationFrame(() => { bgSvg.classList.add('on'); fgSvg.classList.add('on'); }));
  let lastW = 0, lastH = 0;
  new ResizeObserver(() => {
    const r = stage.getBoundingClientRect();
    if (Math.abs(r.width - lastW) < 0.5 && Math.abs(r.height - lastH) < 0.5) return;
    lastW = r.width; lastH = r.height;
    relayout();
  }).observe(stage);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(stage);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
}
boot();
