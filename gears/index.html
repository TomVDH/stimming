<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gear train</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Gear train: one planetary gearset seen from above. */
:root { --stage: oklch(0.17 0.02 260); }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; cursor: grab; }
.stage canvas.held { cursor: grabbing; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Gear train</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--gears" id="stage" tabindex="0" role="application" aria-label="A planetary gearset: a sun gear, four planets on an arm, and a ring gear. Drag round the centre to turn it; flick to let it coast. One part is held still: 1 holds the ring, 2 the sun, 3 the arm. Arrow keys turn it.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Gear train needs canvas drawing, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" role="group" aria-label="Hold still">
        <button class="chip" type="button" data-value="ring" aria-pressed="true" aria-keyshortcuts="1">Hold ring</button>
        <button class="chip" type="button" data-value="sun" aria-pressed="false" aria-keyshortcuts="2">Hold sun</button>
        <button class="chip" type="button" data-value="arm" aria-pressed="false" aria-keyshortcuts="3">Hold arm</button>
      </div>
      <div class="actions">
        <button class="chip" id="reset" type="button" aria-disabled="true">Reset</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag</dt><dd>turn</dd></div>
        <div><dt>Flick</dt><dd>coast</dd></div>
        <div class="fine"><dt><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></dt><dd>hold</dd></div>
        <div class="fine"><dt><kbd>Arrows</kbd></dt><dd>turn</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Gear train</h1><div class="vignette" hidden></div></section>
</div>

<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
<script type="module">
import { initPage, audioKit, choices, fitCanvas, reduced } from '../shared/stim.js';
initPage({ id: 'gears' });

const stage = document.getElementById('stage'), canvas = stage.querySelector('canvas');
const ctx = canvas.getContext('2d');
if (!ctx) { stage.querySelector('.fail').hidden = false; throw new Error('no canvas'); }
const resetBtn = document.getElementById('reset');
const TAU = Math.PI * 2;

/* ---------- gearset ---------- */
// Tooth counts mesh: ring = sun + 2 planets; four planets space evenly.
const ZS = 24, ZP = 18, ZR = 60, PLANETS = 4;
// Angles of sun, arm and ring; the planets follow from these.
const st = { sun: 0, arm: 0, ring: 0 };
let hold = 'ring';
// Each hold setting turns one part and lets one part follow.
const INPUT = { ring: 'sun', sun: 'ring', arm: 'sun' };
// The free part follows the input; the held part stays put.
function solve() {
  if (hold === 'arm') st.ring = st.arm - (st.sun - st.arm) * ZS / ZR;
  else st.arm = (st.ring * ZR + st.sun * ZS) / (ZR + ZS);
}
const planetSpin = () => st.arm - (st.sun - st.arm) * ZS / ZP;

/* ---------- drawing ---------- */
let size = { w: 1, h: 1, dpr: 1 }, m = 4;
function fit() {
  size = fitCanvas(canvas, { maxDpr: 2, budget: 2.6e6 });
  // The ring's rim fits the shorter side with a margin.
  m = (Math.min(size.w, size.h) * 0.45) / (ZR / 2 + 6);
  shapes = null;
  draw();
}
const at = (r, a) => [r * Math.cos(a), r * Math.sin(a)];
// Curved flanks and a rounded tip on every tooth; internal teeth point inward.
function teeth(path, z, r, inward) {
  const p = TAU / z, tip = inward ? r - m : r + m, root = inward ? r + 1.25 * m : r - 1.25 * m;
  for (let i = 0; i < z; i++) {
    const a = i * p;
    const s = at(root, a - 0.5 * p);
    if (i === 0) path.moveTo(...s); else path.lineTo(...s);
    path.lineTo(...at(root, a - 0.3 * p));
    path.quadraticCurveTo(...at(r, a - 0.22 * p), ...at(tip, a - 0.12 * p));
    path.quadraticCurveTo(...at(tip + (inward ? -0.18 : 0.18) * m, a), ...at(tip, a + 0.12 * p));
    path.quadraticCurveTo(...at(r, a + 0.22 * p), ...at(root, a + 0.3 * p));
  }
  path.closePath();
}
function circle(path, x, y, r) { path.moveTo(x + r, y); path.arc(x, y, r, 0, TAU); }
// A bore with a key slot, punched through the centre.
function bore(path, r) {
  path.moveTo(r, -0.22 * r);
  path.arc(0, 0, r, -0.22, TAU - 0.22);
  path.lineTo(r * 1.32, 0.22 * r); path.lineTo(r * 1.32, -0.22 * r); path.closePath();
}
let shapes = null;
function build() {
  const rs = (m * ZS) / 2, rp = (m * ZP) / 2, rr = (m * ZR) / 2;
  const sun = new Path2D(); teeth(sun, ZS, rs, false); bore(sun, 2.2 * m);
  for (let k = 0; k < 6; k++) circle(sun, ...at(rs * 0.56, (k * TAU) / 6), rs * 0.14);
  const planet = new Path2D(); teeth(planet, ZP, rp, false); circle(planet, 0, 0, 1.7 * m);
  for (let k = 0; k < 3; k++) circle(planet, ...at(rp * 0.52, (k * TAU) / 3 + 0.5), rp * 0.2);
  const ring = new Path2D(); circle(ring, 0, 0, rr + 6 * m); teeth(ring, ZR, rr, true);
  // The arm is one plate: a hub and four lobes out to the planet pins.
  const c = rs + rp, arm = new Path2D();
  for (let k = 0; k < PLANETS; k++) {
    const a = (k * TAU) / PLANETS, [x, y] = at(c, a), [nx, ny] = at(2.1 * m, a + Math.PI / 2);
    arm.moveTo(nx, ny); arm.lineTo(x + nx, y + ny); arm.arc(x, y, 2.1 * m, a + Math.PI / 2, a - Math.PI / 2, true); arm.lineTo(-nx, -ny); arm.closePath();
  }
  circle(arm, 0, 0, 4.4 * m);
  shapes = { rs, rp, rr, c, sun, planet, ring, arm };
}
// Colour by role: the input glows brass, the follower steel, the held part sleeps.
const LOOK = {
  input: ['oklch(0.92 0.11 88)', 'oklch(0.72 0.15 65)', 'oklch(0.48 0.12 45)'],
  follow: ['oklch(0.93 0.025 230)', 'oklch(0.7 0.04 240)', 'oklch(0.42 0.045 255)'],
  held: ['oklch(0.5 0.015 260)', 'oklch(0.36 0.015 262)', 'oklch(0.24 0.012 265)'],
  planet: ['oklch(0.9 0.04 205)', 'oklch(0.66 0.06 215)', 'oklch(0.4 0.06 230)'],
};
const roleOf = part => (part === hold ? 'held' : part === INPUT[hold] ? 'input' : 'follow');
// The light sits top left and stays put while the metal turns under it.
function metal(path, x, y, r, [hi, mid, lo]) {
  const base = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  base.addColorStop(0, hi); base.addColorStop(0.5, mid); base.addColorStop(1, lo);
  ctx.fillStyle = base; ctx.fill(path, 'evenodd');
  // Brushed sheen: two soft streaks along the light's axis.
  ctx.save(); ctx.clip(path, 'evenodd');
  const sheen = ctx.createConicGradient(-Math.PI / 4, x, y);
  [[0, 0.22], [0.06, 0], [0.44, 0], [0.5, 0.14], [0.56, 0], [0.94, 0], [1, 0.22]].forEach(([o, a]) => sheen.addColorStop(o, `rgba(255,255,255,${a})`));
  ctx.fillStyle = sheen; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  const lit = ctx.createRadialGradient(x - r * 0.35, y - r * 0.45, 0, x - r * 0.35, y - r * 0.45, r * 1.25);
  lit.addColorStop(0, 'rgba(255,255,255,0.22)'); lit.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = lit; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  ctx.restore();
  // A bevel: lit on the top-left edges, shaded on the bottom-right.
  const edge = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  edge.addColorStop(0, 'rgba(255,255,255,0.55)'); edge.addColorStop(0.5, 'rgba(255,255,255,0.08)'); edge.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.lineWidth = Math.max(1, m * 0.28); ctx.lineJoin = 'round'; ctx.strokeStyle = edge; ctx.stroke(path);
}
// A machined groove: dark ring with a lit lip just inside it.
function groove(x, y, r) {
  ctx.lineWidth = Math.max(1, m * 0.22);
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r - ctx.lineWidth, Math.PI, TAU * 0.75); ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.stroke();
}
const placed = (path, x, y, a) => { const p = new Path2D(); p.addPath(path, new DOMMatrix().translate(x, y).rotate((a * 180) / Math.PI)); return p; };
function hex(x, y, r, a) {
  const p = new Path2D();
  for (let k = 0; k < 6; k++) { const [px, py] = at(r, a + (k * TAU) / 6); k ? p.lineTo(x + px, y + py) : p.moveTo(x + px, y + py); }
  p.closePath();
  return p;
}
let shake = { part: null, t: 0 };
function draw() {
  if (!shapes) build();
  const { w, h, dpr } = size;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const ox = w / 2, oy = h / 2, { rs, rp, rr, c } = shapes;
  // A freshly held part shudders as its lock bites.
  const jolt = part => (shake.part === part && shake.t > 0 ? Math.sin(shake.t * 60) * shake.t * 0.6 * m : 0);
  // Ring with a bolt circle on its rim.
  const rx = ox + jolt('ring'), ry = oy;
  metal(placed(shapes.ring, rx, ry, st.ring), rx, ry, rr + 6 * m, LOOK[roleOf('ring')]);
  groove(rx, ry, rr + 3.1 * m);
  for (let k = 0; k < 12; k++) {
    const [bx, by] = at(rr + 4.4 * m, st.ring + (k * TAU) / 12 + TAU / 24);
    metal(hex(rx + bx, ry + by, 0.95 * m, st.ring + k), rx + bx, ry + by, 1 * m, ['oklch(0.82 0.01 250)', 'oklch(0.6 0.01 255)', 'oklch(0.38 0.01 260)']);
  }
  // Arm under the planets, with a cap on each pin.
  const ax = ox + jolt('arm'), ay = oy;
  metal(placed(shapes.arm, ax, ay, st.arm), ax, ay, c + 2 * m, LOOK[roleOf('arm')]);
  // Planets spin against the sun as the arm carries them.
  const spin = planetSpin();
  for (let k = 0; k < PLANETS; k++) {
    const [px, py] = at(c, st.arm + (k * TAU) / PLANETS);
    metal(placed(shapes.planet, ax + px, ay + py, spin + (k * TAU) / PLANETS + Math.PI + TAU / ZP / 2), ax + px, ay + py, rp + m, LOOK.planet);
    groove(ax + px, ay + py, rp * 0.82);
    const pin = new Path2D(); circle(pin, ax + px, ay + py, 1.25 * m);
    metal(pin, ax + px, ay + py, 1.3 * m, LOOK[roleOf('arm')]);
  }
  // Sun at the centre.
  const sx = ox + jolt('sun'), sy = oy;
  metal(placed(shapes.sun, sx, sy, st.sun), sx, sy, rs + m, LOOK[roleOf('sun')]);
  groove(sx, sy, rs * 0.82);
}

/* ---------- sound ---------- */
const kit = audioKit({ gain: 0.5, keys: new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', '1', '2', '3']) });
let lastTooth = 0, lastClick = 0;
// A filtered noise burst: bright for ticks, low and long for clunks.
function burst(freq, q, peak, len) {
  const ac = kit.live(); if (!ac || !kit.noise) return;
  const src = ac.createBufferSource(); src.buffer = kit.noise;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q; bp.frequency.value = freq;
  const g = ac.createGain(), t = ac.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  src.connect(bp); bp.connect(g); g.connect(kit.out);
  src.start(t, Math.random() * 0.5, len + 0.02);
}
function tick(speed) {
  const tooth = Math.round(st[INPUT[hold]] / (TAU / ZS));
  if (tooth === lastTooth) return;
  lastTooth = tooth;
  const now = performance.now();
  if (now - lastClick < 33) return;
  lastClick = now;
  burst(1400 + Math.min(4200, Math.abs(speed) * 260), 9, 0.45, 0.045);
}
const clunk = () => { burst(170, 2.2, 0.9, 0.2); burst(900, 6, 0.3, 0.06); };
// The mesh whine rises with speed and fades out as the gears slow.
let whine = null;
function hum(speed) {
  const ac = kit.live();
  if (!ac) { if (whine) { whine.g.gain.value = 0; } return; }
  if (!whine) {
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; f.type = 'bandpass'; f.Q.value = 4; g.gain.value = 0;
    o.connect(f); f.connect(g); g.connect(kit.out); o.start();
    whine = { o, f, g };
  }
  const s = Math.abs(speed), t = ac.currentTime;
  const hz = 60 + s * 55;
  whine.o.frequency.setTargetAtTime(hz, t, 0.05);
  whine.f.frequency.setTargetAtTime(hz * 3, t, 0.05);
  whine.g.gain.setTargetAtTime(Math.min(0.09, Math.max(0, s - 1.5) * 0.012), t, 0.08);
}

/* ---------- motion ---------- */
let omega = 0, raf = 0, prevT = 0, dragging = false;
const PITCH = TAU / ZS;
function turn(d) {
  st[INPUT[hold]] += d;
  solve();
  resetBtn.setAttribute('aria-disabled', 'false');
}
function frame(t) {
  const dt = Math.min(0.05, (t - (prevT || t)) / 1000);
  prevT = t;
  let settled = false;
  if (!dragging) {
    // Friction lets a flick coast; near rest a detent pulls to the next tooth.
    omega *= Math.exp(-dt * 1.3);
    if (Math.abs(omega) < 1.2) {
      const a = st[INPUT[hold]], off = Math.round(a / PITCH) * PITCH - a;
      omega += off * 90 * dt;
      omega *= Math.exp(-dt * 9);
      if (Math.abs(off) < 0.002 && Math.abs(omega) < 0.05) { turn(off); omega = 0; settled = true; }
    }
    turn(omega * dt);
  }
  if (shake.t > 0) shake.t = Math.max(0, shake.t - dt);
  tick(omega);
  hum(dragging || !settled ? omega : 0);
  draw();
  if (dragging || !settled || shake.t > 0) raf = requestAnimationFrame(frame);
  else { raf = 0; prevT = 0; hum(0); burst(600, 4, 0.25, 0.05); kit.rest(() => !raf); }
}
const wake = () => { if (!raf) raf = requestAnimationFrame(frame); };

// Dragging round the centre turns the input; the last moves set the flick.
let lastA = 0, lastT = 0;
const angleAt = e => { const r = canvas.getBoundingClientRect(); return Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2); };
canvas.addEventListener('pointerdown', e => {
  dragging = true; canvas.classList.add('held'); canvas.setPointerCapture(e.pointerId);
  lastA = angleAt(e); lastT = performance.now(); omega = 0; wake();
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const a = angleAt(e), now = performance.now();
  let d = a - lastA;
  if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
  turn(d);
  omega = omega * 0.6 + (d / (Math.max(1, now - lastT) / 1000)) * 0.4;
  lastA = a; lastT = now;
});
const release = () => {
  if (!dragging) return;
  dragging = false; canvas.classList.remove('held');
  // Reduced motion stops on release instead of coasting.
  if (reduced() || performance.now() - lastT > 80) omega = 0;
  wake();
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

function setHold(v) {
  if (v === hold) return;
  hold = v; solve();
  lastTooth = Math.round(st[INPUT[hold]] / PITCH);
  shake = { part: v, t: reduced() ? 0 : 0.28 };
  clunk(); wake(); draw();
}
const hold3 = choices(document.querySelector('.choices'), setHold);
stage.addEventListener('keydown', e => {
  const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
  if (step) { e.preventDefault(); if (reduced()) turn(step * PITCH); else omega += step * 2.4; wake(); return; }
  const pick = { 1: 'ring', 2: 'sun', 3: 'arm' }[e.key];
  if (pick) { hold3.set(pick); setHold(pick); }
});
resetBtn.addEventListener('click', () => {
  st.sun = st.arm = st.ring = 0; omega = 0;
  resetBtn.setAttribute('aria-disabled', 'true');
  draw();
});

new ResizeObserver(fit).observe(stage);
fit();
</script>
</body>
</html>
