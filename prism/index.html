function render() {

  }

  c.setTransform(1, 0, 0, 1, 0, 0);

  c.setTransform(pr, 0, 0, pr, 0, 0);
  for (const i of DRAW) if (i) body(pieces[i], i);
  beams();
  c.setTransform(pr, 0, 0, pr, 0, 0);

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 10, LEAD = 0.004;
let ac = null, out = null, noise = null, askedAt = -1e9, voices = 0, tickNext = 0, restT = 0, toneT = 0, tone = null;

// Busy moments soften each voice; the compressor catches the rest.

const GESTURE_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'q', 'Q', 'e', 'E', 'Tab', ' ', 'Enter']);
function unlock(e) {

// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// One sine with a beating octave shimmer sings while light moves.

  lp.frequency.value = 2000;
  lp.Q.value = 0.3;

  sp2.connect(lp);

let moved = 0, movedAt = 0, moveX = 0;
function voiceTrack() {
  const a = live();

}
// A faint glass tick marks each 15 degree detent.
function tick(x) {

  const t = now + LEAD, p = a.createStereoPanner ? a.createStereoPanner() : a.createGain();

  g.gain.exponentialRampToValueAtTime(1e-4, t + 0.045);

  f.Q.value = 1.4;
  ng.gain.setValueAtTime(v * 0.6, t);
  ng.gain.exponentialRampToValueAtTime(1e-4, t + 0.012);

/* ---------- motion: placing, turning, detents ---------- */
const SNAP = 15 * D2R, DET = 1.6 * D2R;
function changed(p, amt) {
  geomDirty = true;
  moved += amt;
  moveX = p.x;
  if (pristine) { pristine = false; showChip(); }
  wake();
}
function setRot(p, raw) {
  const m = Math.round(raw / SNAP) * SNAP, on = Math.abs(raw - m) < DET, r = on ? m : raw;
  const key = on ? Math.round(wrapA(m) / SNAP) : null;
  if (on && p.snap !== key) tick(p.x);

function moveTo(p, x, y) {
  const m = 0.03 * S, nx = clamp(x, m, W - m), ny = clamp(y, m, H - m), d = Math.hypot(nx - p.x, ny - p.y) / S;
  p.x = nx;
  p.y = ny;

let sel = -1, ringA = 0, turnA = 0, turnUntil = 0, tween = null, coarse = matchMedia('(pointer: coarse)').matches;
function turning() { turnUntil = performance.now() + 700; }
function select(i) {
  if (i === sel) return;
  sel = i;
  ringA = reduce ? 1 : 0;
  turnA = 0;
  wake();
}
function showChip() { resetB.setAttribute('aria-disabled', String(pristine)); }
function applyLayout() {
  LAYOUT[tall ? 'tall' : 'wide'].forEach(([u, v, a], i) => { const p = pieces[i]; p.u = u; p.v = v; p.rot = a * D2R; p.snap = null; });
  geomDirty = true;
}
function reset() {
  if (pristine || !ready) return;
  const to = LAYOUT[tall ? 'tall' : 'wide'];

/* ---------- one loop, only while something moves ---------- */
let raf = 0, last = 0, onScreen = true;
function wake() {

}
function frame(ms) {

  last = ms;

  if (turnA !== want) { turnA = reduce ? want : clamp(turnA + (want ? dt / 0.12 : -dt / 0.35)); busy = true; }

/* ---------- input ---------- */
let rect = null;
addEventListener('scroll', () => { rect = null; }, { passive: true });
function local(e) {

}
function inside(p, x, y, pad) {

}
const onRing = (p, x, y, band) => Math.abs(Math.hypot(x - p.x, y - p.y) - ringR(p)) < band;
const ptrs = new Map();
let drag = null, twist = null, tapDown = null;
function startDrag(i, x, y, id, turn, shift) {

}
function startTwist() {
  const [a, b] = [...ptrs.values()];
  let i = drag ? drag.i : sel;
  if (i < 0) i = pick(b.x, b.y, 18);
  drag = null;
  if (i < 0) return;
  select(i);
  const p = pieces[i];
  twist = { i, raw: p.rot, aPrev: Math.atan2(b.y - a.y, b.x - a.x), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, px: p.x, py: p.y };

panel.addEventListener('pointerdown', e => {

['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => panel.addEventListener(t, lift));
panel.addEventListener('contextmenu', e => e.preventDefault());
panel.addEventListener('keydown', e => {

const ARROWS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };

/* ---------- size and start ---------- */
function fit() {

  if (nw !== cw || nh !== ch || !bgC.width) {

    ch = canvas.height = bgC.height = nh;

    glowC.width = Math.ceil(cw / 3);
    glowC.height = Math.ceil(ch / 3);

    glow2C.height = Math.ceil(glowC.height / 2);

function failed() {

}
function boot() {

}
boot();
