<html lang="en">

<style>
/* Prism: one beam and one prism on a black table, at full width. */
:root { --stage: oklch(0.1 0.008 272); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
/* The light canvas adds onto the table under it. */
.stage canvas.light { mix-blend-mode: plus-lighter; }
/* The halo spills edge light onto the page around the stage. */
body { overflow-x: clip; }
.halo { position: absolute; left: 0; top: 0; pointer-events: none; }
/* The add chips sit together as one strip. */
/* Add opens a tray of pieces above the bar. */
.adder { position: relative; }
#addBtn { display: inline-flex; align-items: center; gap: 6px; }
#addBtn svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; }
.add {
  position: absolute; left: 0; bottom: calc(100% + 10px); z-index: 20; display: flex; gap: 6px; padding: 8px;
  background: oklch(0.19 0.012 275 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.add .chip.icon svg .solid { fill: currentColor; stroke: none; }
/* The remove button is a solid disc with a cut cross. */
.drop {
  position: absolute; left: -13px; top: -13px; z-index: 1; width: 26px; height: 26px; padding: 0;
  color: var(--fg); background: none; border: 0; border-radius: 50%; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: color 0.15s ease;
}
.drop:hover { color: oklch(0.72 0.19 28); }
.drop svg { display: block; width: 100%; height: 100%; animation: drop-in 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.drop .disc { fill: currentColor; }
.drop .cut { fill: none; stroke: var(--stage); stroke-width: 2.6; stroke-linecap: square; }
/* A blurred ring of glass frames each sensor picture. */
.pips { position: absolute; inset: 0; pointer-events: none; }
.pips i {
  position: absolute; left: 0; top: 0; border-radius: 50%;
  -webkit-backdrop-filter: blur(14px) brightness(0.55); backdrop-filter: blur(14px) brightness(0.55);
  -webkit-mask: radial-gradient(closest-side, transparent var(--hole), #000 calc(var(--hole) + 1%), #000 70%, transparent 100%);

}
@keyframes drop-in { from { transform: scale(0.3); } to { transform: none; } }
@media (pointer: coarse) { .drop { left: -18px; top: -18px; width: 36px; height: 36px; } }
@media (prefers-reduced-motion: reduce) { .stage canvas, .drop { transition: none; } .drop svg { animation: none; } }

<script type="module">

// The last entry is white.
// LINC holds linear light per wavelength.
// Each LINC channel sums to one.

  const g = (x, m, s1, s2) => { const t = (x - m) / (x < m ? s1 : s2); return Math.exp(-0.5 * t * t); };

    const Y = 0.821 * g(n, 568.8, 46.9, 40.5) + 0.286 * g(n, 530.9, 16.3, 31.1);
    const Z = 1.217 * g(n, 437, 11.8, 36) + 0.681 * g(n, 459, 26, 13.8);

const SPEC = {
  source: { w: 0.11, h: 0.05 },
  prism: { side: 0.2 },
  lens: { a: 0.12, t: 0.08 },
  dlens: { a: 0.12, tc: 0.016, rl: 0.2 },
  mirror: { len: 0.24, th: 0.02 },
  convex: { a: 0.12, rc: 0.34, th: 0.024 },
  concave: { a: 0.12, rc: 0.34, th: 0.024 },
  sensor: { len: 0.2, th: 0.028 },

const NAMES = { prism: 'prism', lens: 'convex lens', dlens: 'concave lens', mirror: 'flat mirror', convex: 'convex mirror', concave: 'concave mirror', sensor: 'sensor pad' };

const curved = p => p.kind === 'convex' || p.kind === 'concave';
const make = (kind, extra = {}) => ({
  kind, ...SPEC[kind], u: 0.5, v: 0.5, rot: 0, k: 1, x: 0, y: 0, r: 0, g: {}, snap: null, z: 1, z0: 1, zp: 1, base: false, dying: false, ...extra,

function corners(p, hw, hh) {

// Each edge gets a unit normal that points out of the shape.

panel.addEventListener('pointerdown', e => {

panel.addEventListener('contextmenu', e => e.preventDefault());
// The remove button keeps its press away from the table.
dropB.addEventListener('pointerdown', e => e.stopPropagation());
dropB.addEventListener('mousedown', e => e.preventDefault());
dropB.addEventListener('click', e => {
  e.stopPropagation();
  remove(sel);
  panel.focus({ preventScroll: true });
});
panel.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || e.metaKey || e.ctrlKey || e.altKey || !ready) return;

  const n = pieces.length, next = sel < 0 ? (e.shiftKey ? n - 1 : 0) : sel + (e.shiftKey ? -1 : 1);

panel.addEventListener('blur', e => { if (!ptrs.size && !panel.contains(e.relatedTarget)) select(-1); });
// The wheel over a piece resizes it.
panel.addEventListener('wheel', e => {
  if (!ready) return;
  const [x, y] = at(e), i = pick(x, y, 6);

  e.preventDefault();

const ARROWS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
addEventListener('keydown', e => {

  if (sel < 0) select(0);
  const p = pieces[sel];
  if (grow) setSize(p, p.k * (grow > 0 ? 1.08 : 1 / 1.08));
  else if (arrow) {
    const st = (e.shiftKey ? 0.06 : 0.015) * S;
    moveTo(p, p.x + arrow[0] * st, p.y + arrow[1] * st);

lightB.addEventListener('click', () => {

  wake();
});
lookB.addEventListener('click', () => {

  try { localStorage.setItem('stimming.prism.wire', wire ? '1' : '0'); } catch (err) {}
  wake();

// The add tray opens on hover or tap and closes after a pick.
const adder = document.querySelector('.adder'), addBtn = document.getElementById('addBtn');
const openTray = on => { adder.classList.toggle('is-open', on); addBtn.setAttribute('aria-expanded', String(on)); };
addBtn.addEventListener('click', () => openTray(!adder.classList.contains('is-open')));
document.addEventListener('pointerdown', e => { if (!adder.contains(e.target)) openTray(false); });
addEventListener('keydown', e => { if (e.key === 'Escape') openTray(false); });
addBs.forEach(b => b.addEventListener('click', () => {
  if (b.getAttribute('aria-disabled') === 'true') return;
  addPiece(b.dataset.kind);
  openTray(false);
  panel.focus({ preventScroll: true });
}));
clearB.addEventListener('click', clearAll);
resetB.addEventListener('click', reset);
sound.onChange(on => {
  if (on) audio();
  else if (ac) { hush(); ac.suspend()?.catch(() => {}); }
});

/* ---------- size and start ---------- */
// safeB is the strip of stage the inset bar covers.
function measureBar() {
  const first = barEl?.firstElementChild;
  safeB = first ? clamp(panel.getBoundingClientRect().bottom - first.getBoundingClientRect().top, 0, H * 0.4) : 0;
}
function fit(force) {
  const w = panel.clientWidth, h = panel.clientHeight;
  if (!w || !h) return;
  rect = null;
  const p = Math.min(devicePixelRatio || 1, lowDpr ? 1 : 2, Math.sqrt(2.2e6 / (w * h)));
  const nw = Math.floor(w * p), nh = Math.floor(h * p);
  if (w !== W || h !== H) { W = w; H = h; S = Math.min(w, h); geomDirty = true; }
  measureBar();

  if (force === true || nw !== cw || nh !== ch || !bgC.width) {
    cw = canvas.width = bgC.width = overC.width = nw;
    ch = canvas.height = bgC.height = overC.height = nh;
    // Smoke runs at half size; the light blurs it anyway.
    dustC.width = Math.ceil(nw / 2);
    dustC.height = Math.ceil(nh / 2);

    buildDust();

function failed() {

function boot() {

  let fitT = 0;
  new ResizeObserver(() => { clearTimeout(fitT); fitT = setTimeout(fit, 140); }).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(panel);

boot();
