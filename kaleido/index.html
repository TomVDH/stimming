<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaleidoscope</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Kaleidoscope: the barrel view at full width under the shared header. */
:root { --stage: #000; }
.stage { cursor: grab; }
.stage.held { cursor: grabbing; }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
/* Number chips keep an even width. */
.choices .chip { justify-content: center; min-width: 38px; }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/kaleido.svg)"></span><span class="intro-name">Kaleidoscope</span><span class="intro-sub">Stimming No. 08</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--kaleido" id="stage" tabindex="0" role="application" aria-label="A kaleidoscope full of coloured glass. Drag to turn the barrel or flick to spin it; arrow keys turn it and Space shakes the glass.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Kaleidoscope needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" role="group" aria-label="Mirror sectors">
        <button class="chip" type="button" data-n="6" aria-pressed="true">6</button>
        <button class="chip" type="button" data-n="8" aria-pressed="false">8</button>
        <button class="chip" type="button" data-n="12" aria-pressed="false">12</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag</dt><dd>turn</dd></div>
        <div><dt>Flick</dt><dd>spin</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>shake</dd></div>
        <div class="fine"><dt><kbd>Arrows</kbd></dt><dd>turn</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Kaleidoscope</h1><div class="vignette" hidden></div></section>
</div>

<script type="module">
import { initPage, sound } from '../shared/stim.js';
initPage({ id: 'kaleido' });
const panel = document.getElementById('stage'), canvas = panel.querySelector('canvas');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; });
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));
const nextFrame = () => new Promise(r => requestAnimationFrame(r));

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
function lin(L, C, h) {

    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,

const enc = v => (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055);

const STAGE = linear(0.19, 0.012, 275);
const LIGHT = linear(0.975, 0.022, 82).map(v => v * 1.3);

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 14, LEAD = 0.004;
let ac = null, out = null, noise = null, askedAt = -1e9, voices = 0, clinkNext = 0, tickNext = 0, restT = 0;

// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.07 * voices);

function audio() {

    const AC = window.AudioContext || window.webkitAudioContext;

    comp.threshold.value = -14; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;

    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);

  voices++;

// Once the glass settles, the context sleeps until the next gesture.
function rest() {
  clearTimeout(restT);

// Each voice pans with its place in the cell.

  ng.gain.linearRampToValueAtTime(g, t + 0.0005);
  ng.gain.setTargetAtTime(0, t + 0.0005, tau);

// Inharmonic partials ring like a small struck chip.

    const o = a.createOscillator(), og = a.createGain();
    o.frequency.value = f0 * r * jit(0.006);

    og.gain.setTargetAtTime(0, t + 0.0015, decays[k]);

// Smaller pieces ring higher; the barrel wall sounds duller.

  if (t - t0 > 0.05) return;

// The barrel's detent: a faint dry tick.
function tick(sp) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < tickNext) return;
  tickNext = t + 0.032;

  o.frequency.value = 610 * jit(0.04);
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(0.014 * g, t + 0.001);
  og.gain.setTargetAtTime(0, t + 0.001, 0.006);

  o.start(t);
  o.stop(t + 0.05);

// Units are drum radii; y runs up; gravity pulls down the screen.
const DT = 1 / 120, GRAV = 7, MARGIN = 0.012, SLOP = 0.003, BETA = 0.22, ITER = 8, PITER = 3;
const MU = 0.26, MU_WALL = 0.45, E = 0.3, E_WALL = 0.22, BOUNCE = 0.35, WALL = 63;

let nC = 0, simT = 0, spinW = 0, drumW = 0, asleep = false, restClock = 0, holdN = 0;
const warm = new Map();
let wPn = new Float64Array(512), wPt = new Float64Array(512);
// One manifold buffer: up to two points.
const M = { nx: 0, ny: 0, px: [0, 0], py: [0, 0], pen: [0, 0], f: [0, 0] };

const circ = (r, x = 0, y = 0) => ({ t: 0, x, y, r, cx: 0, cy: 0, br: 0, bx: 0, by: 0, wx: 0, wy: 0 });
function poly(pts) {
  const n = pts.length / 2;
  return { t: 1, n, v: Float64Array.from(pts), nm: new Float64Array(2 * n), wv: new Float64Array(2 * n), wn: new Float64Array(2 * n), cx: 0, cy: 0, br: 0, bx: 0, by: 0 };

// Mass, centre and inertia come from the shapes at unit density.

      for (let i = 0; i < s.n; i++) { v[2 * i] -= mx; v[2 * i + 1] -= my; ax += v[2 * i]; ay += v[2 * i + 1]; }

/* narrow phase: normals point from the first shape to the second */

      if (pass === 'multiply') b.paint();
      else b.shine();
    }
  }
}

/* ---------- WebGL: two mirrors, a lens and a dark stage ---------- */
const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const FS = `#version 300 es
precision highp float;
uniform sampler2D uCell;
uniform vec3 uView, uStage, uLight;
uniform vec2 uN;
uniform vec2 uApex;
uniform float uTheta, uRho, uMix, uLod;
out vec4 o;
const float TAU = 6.28318531;
float hash(vec2 p) {
  vec3 q = fract(p.xyx * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
vec3 cell(vec2 s, float lod) {
  return pow(textureLod(uCell, vec2(0.5 + 0.5 * s.x, 0.5 - 0.5 * s.y), lod).rgb, vec3(2.2));
}
// Two mirrors fold every view angle into one wedge of the cell.
vec3 kaleido(vec2 q, float r, float n) {
  float w = TAU / n, b = mod(atan(q.y, q.x) - uTheta, TAU);
  float k = floor(b / w), f = mod(b, 2.0 * w);
  f = f > w ? 2.0 * w - f : f;
  float a = f + uTheta;
  vec2 v = vec2(cos(a), sin(a)) * r * uRho, s = uApex + v;
  // Red bends least and blue most, more toward the rim.
  float ca = 0.012 * r * r;
  vec3 c = vec3(cell(s + v * ca, uLod).r, cell(s, uLod).g, cell(s - v * ca, uLod).b);
  // The frosted diffuser turns with the barrel.
  vec2 d = mat2(cos(uTheta), -sin(uTheta), sin(uTheta), cos(uTheta)) * s;
  float frost = 0.91 + 0.07 * vnoise(d * 5.0) + 0.03 * vnoise(d * 23.0 + 7.0);
  vec3 light = uLight * frost * (1.1 - 0.2 * dot(s, s));
  // Glass edges brighten on one side and shade the other.
  vec2 o = vec2(0.6, 0.8) * 5.0 / float(textureSize(uCell, 0).x);
  float bev = dot(cell(s + o, uLod) - cell(s - o, uLod), vec3(0.3, 0.55, 0.15));
  vec3 col = c * light * (1.0 + 0.45 * clamp(bev, -0.6, 0.6));
  // Bright openings bleed light over the dark rims.
  vec3 g = cell(s, uLod + 4.0);
  col += light * max(g - 0.45, 0.0) * 0.5;
  // Each mirror bounce loses a little light.
  return col * pow(0.97, min(k, n - k));
}
vec3 srgb(vec3 c) {
  c = clamp(c, 0.0, 1.0);
  return mix(12.92 * c, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}
void main() {
  vec2 q = (gl_FragCoord.xy - uView.xy) / uView.z;
  float r = length(q);
  vec3 col = vec3(0.0);
  if (r < 1.03) {
    // Toward the rim the glass splits light: red reaches out, blue pulls in.
    float ab = 0.035 * smoothstep(0.55, 1.0, r);
    vec2 qr = q * (1.0 - ab), qb = q * (1.0 + ab);
    vec3 k = vec3(kaleido(qr, length(qr), uN.y).r, kaleido(q, r, uN.y).g, kaleido(qb, length(qb), uN.y).b);
    if (uMix < 1.0) k = mix(vec3(kaleido(qr, length(qr), uN.x).r, kaleido(q, r, uN.x).g, kaleido(qb, length(qb), uN.x).b), k, uMix);
    float l = dot(k, vec3(0.2126, 0.7152, 0.0722));
    k = max(mix(vec3(l), k, 1.15), 0.0);
    k = 1.0 - exp(-k * 1.25);
    // Each channel tapers to black on its own radius, so the fade fringes.
    vec3 rc = r * vec3(0.975, 1.0, 1.025);
    vec3 fade = 1.0 - smoothstep(vec3(0.6), vec3(1.0), rc);
    k *= fade * fade;
    col = k;
  }
  o = vec4(srgb(col) + (hash(gl_FragCoord.xy) - 0.5) / 255.0, 1.0);
}`;

let gl = null, prog = null, U = {}, vao = null, tex = null, texSize = 0;
function compile() {
  const sh = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  };
  const p = gl.createProgram(), v = sh(gl.VERTEX_SHADER, VS), f = sh(gl.FRAGMENT_SHADER, FS);
  gl.attachShader(p, v);
  gl.attachShader(p, f);
  gl.linkProgram(p);
  return { p, v, f };
}
async function initGL() {
  gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
  if (!gl) throw new Error('WebGL 2 unavailable');
  const par = gl.getExtension('KHR_parallel_shader_compile');
  prog = compile();
  // Polling lets the driver link off the main thread.
  if (par) while (!gl.isContextLost() && !gl.getProgramParameter(prog.p, par.COMPLETION_STATUS_KHR)) await nextFrame();
  if (!gl.getProgramParameter(prog.p, gl.LINK_STATUS)) throw new Error(gl.getShaderInfoLog(prog.f) || gl.getShaderInfoLog(prog.v) || gl.getProgramInfoLog(prog.p) || 'link failed');
  for (const n of ['uCell', 'uView', 'uStage', 'uLight', 'uN', 'uApex', 'uTheta', 'uRho', 'uMix', 'uLod']) U[n] = gl.getUniformLocation(prog.p, n);
  gl.useProgram(prog.p);
  gl.uniform1i(U.uCell, 0);
  gl.uniform3fv(U.uStage, STAGE);
  gl.uniform3fv(U.uLight, LIGHT);
  vao = gl.createVertexArray();
  texSize = 0;
  tex = null;
}
function makeTex(S) {
  if (tex) gl.deleteTexture(tex);
  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texStorage2D(gl.TEXTURE_2D, Math.floor(Math.log2(S)) + 1, gl.RGBA8, S, S);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  texSize = S;
}
function upload() {
  if (texSize !== cell.width) makeTex(cell.width);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, cell);
  gl.generateMipmap(gl.TEXTURE_2D);
}

/* ---------- layout ---------- */
// The mirrors look toward the heap and never past the wall.
const RHO = 0.6, REACH = 0.36, APEX = [0, -REACH], AIM = [0, -REACH];
function aimApex() {
  let sx = 0, sy = 0, sm = 0;
  for (const b of bodies) { const m = 1 / b.im; sx += b.x * m; sy += b.y * m; sm += m; }
  const d = Math.hypot(sx, sy) || 1;
  AIM[0] = (sx / d) * REACH;
  AIM[1] = (sy / d) * REACH;
}
let W = 0, H = 0, RV = 1, pr = 1, cellDirty = true, rect = null;
function fit() {
  const w = panel.clientWidth, h = panel.clientHeight;
  if (!w || !h) return;
  W = w; H = h; rect = null;
  RV = 0.475 * Math.min(w, h);
  const p = Math.min(devicePixelRatio || 1, lowDpr ? 1 : 2, Math.sqrt(1.4e6 / (w * h)));
  const cw = Math.round(w * p), ch = Math.round(h * p);
  pr = cw / w;
  // The cell holds about one texel per screen pixel.
  const need = (2 * RV * pr) / RHO, S = lowDpr ? 512 : need > 900 ? 1024 : need > 620 ? 768 : 512;
  if (cell.width !== S) { cell.width = cell.height = S; cellDirty = true; }
  const grew = canvas.width !== cw || canvas.height !== ch;
  if (grew) { canvas.width = cw; canvas.height = ch; }
  if (ready && (grew || cellDirty)) render();
}

/* ---------- drawing ---------- */
let theta = 0, nOld = 6, nNew = 6, mixT = 1;
function render() {
  if (cellDirty) { drawCell(); upload(); cellDirty = false; }
  const cw = canvas.width, ch = canvas.height;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, cw, ch);
  gl.useProgram(prog.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform3f(U.uView, cw / 2, ch / 2, RV * pr);
  gl.uniform2f(U.uN, nOld, nNew);
  gl.uniform1f(U.uTheta, theta);
  gl.uniform1f(U.uRho, RHO);
  gl.uniform2fv(U.uApex, APEX);
  const m = mixT * mixT * (3 - 2 * mixT);
  gl.uniform1f(U.uMix, m);
  gl.uniform1f(U.uLod, Math.max(0, Math.log2((cell.width * 0.5 * RHO) / (RV * pr))));
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------- one loop, only while something moves ---------- */
let raf = 0, last = 0, onScreen = true, ready = false, lowDpr = false, slow = 0, frames = 0, acc = 0;
let spin = 0, turnQ = 0, tickAcc = 0, drag = null;
const held = new Map();
const DETENT = TAU / 40;
function wake() {
  if (!raf && ready && onScreen && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(now) {
  raf = 0;
  if (!ready) return;
  const raw = Math.max(0, (now - last) / 1000), dt = Math.min(raw, 1 / 20);
  last = now;
  // Sustained slow frames drop the pixel ratio and the cell size.
  if (!lowDpr && ++frames > 30) {
    slow = raw > 0.026 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 30) { lowDpr = true; fit(); }
  }
  // The barrel turns by hand, by key, or under its own inertia.
  let turn = turnQ;
  turnQ = 0;
  if (!drag) {
    let dir = 0;
    for (const v of held.values()) dir += v;
    if (dir) spin += (clamp(dir, -1, 1) * (reduce ? 1.3 : 2.3) - spin) * (1 - Math.exp(-dt / 0.2));
    else {
      // Air drag and a little bearing friction slow the barrel.
      spin *= Math.exp(-dt / (reduce ? 0.4 : 1.1));
      spin -= Math.sign(spin) * Math.min(Math.abs(spin), 0.3 * dt);
      if (Math.abs(spin) < 0.02) spin = 0;
    }
    turn += spin * dt;
  }
  theta = (theta + turn) % (TAU * 64);
  const wNow = dt > 0 ? turn / dt : 0;
  spinW = drag ? lerp(spinW, wNow, 0.5) : wNow;
  if (Math.abs(spinW) < 1e-3) spinW = 0;
  if (spinW) { asleep = false; restClock = 0; }
  tickAcc += turn;
  while (Math.abs(tickAcc) >= DETENT) { tickAcc -= Math.sign(tickAcc) * DETENT; tick(Math.abs(spinW)); }
  if (!asleep) {
    acc += dt;
    let n = 0;
    while (acc >= DT && n < 4) { step(); acc -= DT; n++; }
    if (n === 4) acc = 0;
    cellDirty = true;
  }
  if (mixT < 1) mixT = Math.min(1, mixT + dt / 0.5);
  // The apex drifts slowly after the heap's centre.
  if (!asleep) aimApex();
  const ka = 1 - Math.exp(-dt / 0.6), gap = Math.hypot(AIM[0] - APEX[0], AIM[1] - APEX[1]);
  APEX[0] += (AIM[0] - APEX[0]) * ka;
  APEX[1] += (AIM[1] - APEX[1]) * ka;
  render();
  if (frames === 2) canvas.classList.add('on');
  const busy = !asleep || spin !== 0 || spinW !== 0 || turnQ !== 0 || held.size > 0 || mixT < 1 || gap > 2e-4;
  if (busy && onScreen && !document.hidden) raf = requestAnimationFrame(frame);
  else rest();
}

/* ---------- input ---------- */
addEventListener('scroll', () => { rect = null; }, { passive: true });
// Pointer position from the view centre, in CSS pixels, y up.
function local(e) {
  const r = rect || (rect = panel.getBoundingClientRect());
  return [e.clientX - r.left - W / 2, r.top + H / 2 - e.clientY];
}
// Near the centre, a sideways drag turns the barrel's top edge.
function turnBy(x, y, dx, dy) {
  const r2 = x * x + y * y, rmin = 0.35 * RV, k = Math.min(1, Math.sqrt(r2) / rmin);
  return (x * dy - y * dx) / Math.max(r2, rmin * rmin) - ((1 - k) * dx) / rmin;
}
panel.addEventListener('pointerdown', e => {
  if (!ready || drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  const [x, y] = local(e);
  // A hand on the barrel stops its spin.
  spin = 0;
  drag = { id: e.pointerId, x, y, t: e.timeStamp, last: e.timeStamp, est: 0 };
  panel.classList.add('held');
  wake();
});
panel.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const list = e.getCoalescedEvents?.() || [];
  for (const c of list.length ? list : [e]) {
    const [x, y] = local(c), d = turnBy(drag.x, drag.y, x - drag.x, y - drag.y);
    turnQ += d;
    drag.est = lerp(drag.est, d / Math.max(0.004, (c.timeStamp - drag.t) / 1000), 0.35);
    drag.x = x; drag.y = y; drag.t = c.timeStamp;
    if (d) drag.last = c.timeStamp;
  }
  wake();
});
// A quick release keeps the barrel spinning.
const lift = e => {
  if (!drag || e.pointerId !== drag.id) return;
  const fresh = e.timeStamp - drag.last < 90 && Math.abs(drag.est) > 0.3;
  spin = fresh ? clamp(drag.est, -7, 7) : 0;
  drag = null;
  panel.classList.remove('held');
  wake();
};
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => panel.addEventListener(t, lift));
panel.addEventListener('contextmenu', e => e.preventDefault());

// A gentle shake jostles every piece upward.
function shake() {
  if (!ready) return;
  const k = reduce ? 0.6 : 1;
  for (const b of bodies) {
    b.vx += rand(-1, 1) * 0.7 * k;
    b.vy += rand(0.5, 1.4) * k;
    b.w += rand(-1, 1) * 4 * k;
  }
  asleep = false;
  restClock = 0;
  wake();
}
const ARROWS = { ArrowLeft: 1, ArrowUp: 1, ArrowRight: -1, ArrowDown: -1 };
let shookAt = -1e9;
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const k = e.key;
  if (ARROWS[k]) {
    e.preventDefault();
    if (!ready) return;
    if (!held.has(k) && !drag) spin += ARROWS[k] * 0.5;
    held.set(k, ARROWS[k]);
    wake();
  } else if (k === ' ') {
    // Buttons and links keep Space for themselves.
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (e.repeat && e.timeStamp - shookAt < 280) return;
    shookAt = e.timeStamp;
    shake();
  }
});
addEventListener('keyup', e => { held.delete(e.key); });
addEventListener('blur', () => held.clear());

const chips = [...document.querySelectorAll('.chip[data-n]')];
function setN(n) {
  if (n === nNew) return;
  nOld = mixT < 0.5 ? nOld : nNew;
  nNew = n;
  mixT = reduce ? 1 : 0;
  chips.forEach(c => c.setAttribute('aria-pressed', String(+c.dataset.n === n)));
  if (ready) { if (raf) return; render(); wake(); }
}
chips.forEach(c => c.addEventListener('click', () => setN(+c.dataset.n)));
sound.onChange(on => {
  if (on) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});

/* ---------- start: shaders link while the glass settles ---------- */
function failed() {
  ready = false;
  canvas.hidden = true;
  panel.querySelector('.fail').hidden = false;
  chips.forEach(c => { c.disabled = true; });
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; cancelAnimationFrame(raf); raf = 0; });
canvas.addEventListener('webglcontextrestored', async () => {
  try {
    await initGL();
    cellDirty = true;
    ready = true;
    render();
    wake();
  } catch (err) { console.error(err); failed(); }
});
async function boot() {
  cell = document.createElement('canvas');
  cell.width = cell.height = 512;
  cx = cell.getContext('2d', { alpha: false });
  GRAIN = grainTile();
  await idle();
  build();
  fit();
  const gate = initGL();
  gate.catch(() => {});
  // Five seconds of settling run in idle slices.
  for (let k = 0; k < 10 && !asleep; k++) {
    for (let i = 0; i < 60 && !asleep; i++) step();
    await idle();
  }
  try { await gate; } catch (err) { console.error(err); failed(); return; }
  // The first view looks down into the heap.
  const intro = reduce ? 0 : 0.9;
  theta = -Math.PI / 2 - Math.PI / nNew - intro * 1.6;
  aimApex();
  APEX[0] = AIM[0];
  APEX[1] = AIM[1];
  ready = true;
  cellDirty = true;
  fit();
  render();
  requestAnimationFrame(() => canvas.classList.add('on'));
  new ResizeObserver(fit).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(panel);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
  spin = intro;
  wake();
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
