<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.02 60); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Zena</title>
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">
<style>
/* Zena: a faux drone sim over a dusk field. */
:root { --stage: oklch(0.2 0.02 60); }
.stage--drone canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none; cursor: crosshair;
}
.stage--drone canvas.on { opacity: 1; }
/* The two spring sticks: a ring where the press began, a knob at the stick. */
.stick { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 1; }
.stick.on { opacity: 1; }
.stick::before {
  content: ""; position: absolute; left: calc(var(--r) * -1); top: calc(var(--r) * -1);
  width: calc(var(--r) * 2); height: calc(var(--r) * 2); border-radius: 50%;
  border: 1.5px solid oklch(1 0 0 / .34); background: oklch(0.15 0.01 275 / .16);
}
.stick i {
  position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; border-radius: 50%;
  background: oklch(0.95 0.02 80); transform: translate(var(--kx, 0px), var(--ky, 0px));
}
@media (prefers-reduced-motion: reduce) { .stage--drone canvas, .stick { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Zena</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--drone" id="stage" tabindex="0" role="application" aria-label="A heavy-lift drone on a landing pad in a field at dusk. Drag to fly it, right-drag or W and S to climb, A and D to turn, arrow keys to fly. A gamepad flies it with two sticks.">
      <p class="fail" hidden>Zena needs WebGL, which this browser has turned off.</p>
      <div class="stick" id="s-cyc"><i></i></div>
      <div class="stick" id="s-col"><i></i></div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Zena</h1>
  </section>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
