<!doctype html>

  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}

<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Smoke ring cannon</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--vortex" id="stage" tabindex="0" role="application" aria-label="Smoke rings fly through haze and flare as they cross a laser sheet. Click or tap to fire a ring toward that point.">
      <p class="fail" hidden>Smoke ring cannon needs WebGL 2 with float render targets, which this browser does not give.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">

  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, whenVisible, fitCanvas, onQuality, oklchLinear, reduced, onReducedChange, audioKit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const stage = document.getElementById('stage');
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- bar ---------- */
// The handlers bind once the GL exists.
const act = { sheet() {}, pair() {}, collide() {}, clear() {}, laser() {}, reset() {} };
const LASER = { green: [0.87, 0.29, 142], red: [0.63, 0.25, 29], blue: [0.55, 0.24, 264] };
const ui = initPage({ id: 'vortex', bar: {
  choice: { label: 'Sheet', value: 'across', options: [
    { value: 'across', label: 'Across' }, { value: 'along', label: 'Along' }, { value: 'scan', label: 'Scan' },
  ], onPick: v => act.sheet(v) },
  slider: { label: 'Haze', min: 0, max: 1, step: 0.01, value: 0.5, onInput: v => { haze = v; still(); } },
  actions: [
    { verb: 'pair', label: 'Pair', key: 'P', onPress: () => act.pair() },
    { verb: 'collide', label: 'Collide', key: 'C', onPress: () => act.collide() },
    { verb: 'clear', key: 'X', onPress: () => act.clear() },
  ],
  settings: [
    { type: 'choice', id: 'laser', label: 'Laser', value: 'green', persist: true,
      options: [{ value: 'green', label: 'Green' }, { value: 'red', label: 'Red' }, { value: 'blue', label: 'Blue' }], onPick: v => act.laser(v) },
    { type: 'choice', id: 'smoke', label: 'Smoke', value: 'light', persist: true,
      options: [{ value: 'light', label: 'Light' }, { value: 'dense', label: 'Dense' }], onPick: v => { smoke = v; still(); } },
    { type: 'slider', id: 'breakup', label: 'Breakup', min: 0, max: 1, step: 0.01, value: 0.5, persist: true, onInput: v => { breakup = v; } },
  ],
  reset: () => act.reset(),
  quality: true,
  keys: [['click', 'fire'], ['drag', 'aim'], ['hold', 'charge'], ['space', 'pair']],
} });
let sheetMode = 'across', haze = ui.slider?.value ?? 0.5;
let laser = ui.setting('laser')?.value ?? 'green', smoke = ui.setting('smoke')?.value ?? 'light';
let breakup = ui.setting('breakup')?.value ?? 0.5;

let markReady;
const glReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, glReady]) });

/* ---------- K7: vortex filaments ---------- */
// Each ring is a closed filament of N nodes with circulation G and core radius a.
// Every node moves with the regularized Biot-Savart velocity of all filaments.
const N = 32, SLOTS = 8, INV4PI = 1 / (4 * Math.PI);
// Core spread rate, circulation life and entrainment growth, per second.
const NU = 1.2e-4, TAU_G = 8, GROW = 0.035;
const rings = Array.from({ length: SLOTS }, () => ({
  on: false, p: new Float64Array(N * 3), q: new Float64Array(N * 3), v: new Float64Array(N * 3),
  G: 0, G0: 0, a: 0.04, a0: 0.04, age: 0, R0: 0.18, m: 6, ph: 0, amp: 0, born: 0,
}));
// Induced velocity at (x, y, z); src picks the node array, 'p' or 'q'.
function induced(x, y, z, src, out, only = null) {
  let ux = 0, uy = 0, uz = 0;
  for (const r of only ? [only] : rings) {
    if (!r.on) continue;
    const P = r[src], k = r.G * INV4PI, a2 = r.a * r.a;
    let x0 = P[(N - 1) * 3], y0 = P[(N - 1) * 3 + 1], z0 = P[(N - 1) * 3 + 2];
    for (let i = 0; i < N; i++) {
      const x1 = P[i * 3], y1 = P[i * 3 + 1], z1 = P[i * 3 + 2];
      const dx = x1 - x0, dy = y1 - y0, dz = z1 - z0;
      const rx = x - (x0 + x1) * 0.5, ry = y - (y0 + y1) * 0.5, rz = z - (z0 + z1) * 0.5;
      const d2 = rx * rx + ry * ry + rz * rz + a2, f = k / (d2 * Math.sqrt(d2));
      ux += (dy * rz - dz * ry) * f;
      uy += (dz * rx - dx * rz) * f;
      uz += (dx * ry - dy * rx) * f;
      x0 = x1; y0 = y1; z0 = z1;
    }
  }
  out[0] = ux; out[1] = uy; out[2] = uz;
}
const tmp = [0, 0, 0];
function velocities(src) {
  for (const r of rings) {
    if (!r.on) continue;
    const P = r[src];
    for (let i = 0; i < N; i++) {
      induced(P[i * 3], P[i * 3 + 1], P[i * 3 + 2], src, tmp);
      r.v[i * 3] = tmp[0]; r.v[i * 3 + 1] = tmp[1]; r.v[i * 3 + 2] = tmp[2];
    }
  }
}
// The centroid and the travel normal of a ring.
function frameOf(r) {
  const P = r.p, c = [0, 0, 0], n = [0, 0, 0];
  for (let i = 0; i < N; i++) { c[0] += P[i * 3]; c[1] += P[i * 3 + 1]; c[2] += P[i * 3 + 2]; }
  c[0] /= N; c[1] /= N; c[2] /= N;
  for (let i = 0; i < N; i++) {
    const j = (i + 1) % N;
    const ax = P[i * 3] - c[0], ay = P[i * 3 + 1] - c[1], az = P[i * 3 + 2] - c[2];
    const bx = P[j * 3] - c[0], by = P[j * 3 + 1] - c[1], bz = P[j * 3 + 2] - c[2];
    n[0] += ay * bz - az * by; n[1] += az * bx - ax * bz; n[2] += ax * by - ay * bx;
  }
  const l = Math.hypot(n[0], n[1], n[2]) || 1;
  return { c, n: [n[0] / l, n[1] / l, n[2] / l] };
}
// One midpoint step for every live ring.
function filamentStep(dt) {
  velocities('p');
  for (const r of rings) if (r.on) for (let i = 0; i < N * 3; i++) r.q[i] = r.p[i] + r.v[i] * dt * 0.5;
  velocities('q');
  for (const r of rings) {
    if (!r.on) continue;
    for (let i = 0; i < N * 3; i++) r.p[i] += r.v[i] * dt;
    r.age += dt;
    r.a = Math.sqrt(r.a0 * r.a0 + 4 * NU * r.age);
    // Lobes grow from the seeded wave; big lobes kill the ring fast.
    const sigma = 0.35 + 0.9 * breakup;
    const amp = Math.min(r.R0 * 0.4, r.amp * Math.exp(sigma * r.age));
    const life = r.dying ? 0.45 : amp > r.R0 * 0.22 ? 1.1 : TAU_G;
    r.G *= Math.exp(-dt / life);
    const { c, n } = frameOf(r);
    const g = 1 + GROW * dt, da = amp * sigma * dt;
    for (let i = 0; i < N; i++) {
      const o = i * 3;
      let rx = r.p[o] - c[0], ry = r.p[o + 1] - c[1], rz = r.p[o + 2] - c[2];
      const ax = (rx * n[0] + ry * n[1] + rz * n[2]);
      // The in-plane radial direction of this node.
      let px = rx - ax * n[0], py = ry - ax * n[1], pz = rz - ax * n[2];
      const pl = Math.hypot(px, py, pz) || 1;
      px /= pl; py /= pl; pz /= pl;
      const w = r.m * TAU * i / N + r.ph, s = Math.sin(w) * da, k = Math.cos(w) * da * 0.6;
      r.p[o] = c[0] + rx * g + px * s + n[0] * k;
      r.p[o + 1] = c[1] + ry * g + py * s + n[1] * k;
      r.p[o + 2] = c[2] + rz * g + pz * s + n[2] * k;
    }
    r.c = c;
    r.n = n;
    if (r.G < r.G0 * 0.12 || Math.hypot(c[0], c[1], c[2]) > 4.5 || r.age > 16) kill(r);
  }
  meet();
}
// Head-on cores that come within 2a end both rings in tendrils.
// Filaments cannot reconnect, so this stands in for the split.
function meet() {
  for (let i = 0; i < SLOTS; i++) for (let j = i + 1; j < SLOTS; j++) {
    const A = rings[i], B = rings[j];
    if (!A.on || !B.on || (A.dying && B.dying)) continue;
    if (A.n[0] * B.n[0] + A.n[1] * B.n[1] + A.n[2] * B.n[2] > -0.3) continue;
    const lim = 4 * Math.max(A.a, B.a) ** 2;
    let hit = false;
    for (let a = 0; a < N && !hit; a++) for (let b = 0; b < N; b++) {
      const dx = A.p[a * 3] - B.p[b * 3], dy = A.p[a * 3 + 1] - B.p[b * 3 + 1], dz = A.p[a * 3 + 2] - B.p[b * 3 + 2];
      if (dx * dx + dy * dy + dz * dz < lim) { hit = true; break; }
    }
    if (hit) A.dying = B.dying = true;
  }
}
/* ---------- end K7 ---------- */

/* ---------- slots ---------- */
// A slot holds one ring and its smoke; the smoke fades after the ring dies.
const slot = Array.from({ length: SLOTS }, () => ({ fade: 0, dead: -1, born: -1 }));
let simTime = 0;
function kill(r) {
  r.on = false;
  r.G = 0;
  const s = slot[rings.indexOf(r)];
  s.dead = simTime;
  s.burst = !!r.dying;
}
function freeSlot() {
  let best = 0, oldest = Infinity;
  for (let k = 0; k < SLOTS; k++) {
    if (!rings[k].on && slot[k].fade <= 0) return k;
    if (slot[k].born < oldest) { oldest = slot[k].born; best = k; }
  }
  // All slots busy: the oldest ring and its smoke give way.
  rings[best].on = false;
  rings[best].G = 0;
  Object.assign(slot[best], { fade: 0, dead: -1 });
  return best;
}
const basis = d => {
  const up = Math.abs(d[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
  let e1 = [d[1] * up[2] - d[2] * up[1], d[2] * up[0] - d[0] * up[2], d[0] * up[1] - d[1] * up[0]];
  const l = Math.hypot(...e1);
  e1 = e1.map(v => v / l);
  const e2 = [d[1] * e1[2] - d[2] * e1[1], d[2] * e1[0] - d[0] * e1[2], d[0] * e1[1] - d[1] * e1[0]];
  return { e1, e2 };
};
// Seeded random keeps the pre-roll the same on every load.
let seedN = 9173;
const rnd = () => (seedN = (seedN * 16807) % 2147483647) / 2147483647;
// Fire one ring from `from` along `dir`; U is its start speed.
function fire({ from, dir, R = 0.18, U = 0.9 }) {
  const k = freeSlot(), r = rings[k];
  const l = Math.hypot(...dir), d = dir.map(v => v / l), { e1, e2 } = basis(d);
  const C = from.map((v, i) => v + d[i] * 0.04);
  r.m = 5 + Math.floor(rnd() * 4);
  r.ph = rnd() * TAU;
  r.amp = R * 0.006;
  for (let i = 0; i < N; i++) {
    const t = TAU * i / N, rr = R * (1 + 0.012 * Math.sin(r.m * t + r.ph));
    for (let j = 0; j < 3; j++) r.p[i * 3 + j] = C[j] + rr * (Math.cos(t) * e1[j] + Math.sin(t) * e2[j]);
  }
  r.a0 = r.a = R * 0.24;
  r.R0 = R;
  r.age = 0;
  r.dying = false;
  r.side = null;
  // Calibrate circulation: unit G gives speed U1 along d.
  r.on = true;
  r.G = 1;
  induced(r.p[0], r.p[1], r.p[2], 'p', tmp, r);
  const U1 = tmp[0] * d[0] + tmp[1] * d[1] + tmp[2] * d[2];
  r.G = r.G0 = U / Math.max(1e-4, U1);
  r.c = C;
  r.n = d;
  slot[k].fade = 1;
  slot[k].dead = -1;
  slot[k].born = simTime;
  seedSmoke(k, C, d, e1, e2, R, r.a);
  return k;
}

/* ---------- scene ---------- */
// The launch axis is +x; the muzzle sits just inside the frame's left edge.
const MUZZLE = [-1.22, -0.06, 0], SHEET_X = 0.42;
// Each slot holds PER particles in ROWS rows of 64.
const ROWS = 128, PER = ROWS * 64;
const SHEETS = {
  // Across leans 24 degrees, so the camera sees it nearly edge on.
  across: { n: [Math.cos(0.42), 0, Math.sin(0.42)], h: 0.42 * Math.cos(0.42), lens: [0.42, 1.75, 0], fan: [0, -1, 0], half: 0.6 },
  along: { n: [0, 0, 1], h: 0, lens: [0.25, 1.75, 0], fan: [0, -1, 0], half: 0.72 },
};
const cam = { eye: [0, 0, 0], R: [1, 0, 0], U: [0, 1, 0], F: [0, 0, -1], tan: 0.4, aspect: 1, portrait: false };
const norm = v => { const l = Math.hypot(...v); return v.map(x => x / l); };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
// Wide frames look from the front left; tall frames roll so rings rise.
function aimCamera(W, H) {
  const portrait = W / H < 0.85;
  const T = portrait ? [0.3, -0.02, 0] : [0.18, 0.02, 0];
  const yaw = 28 * Math.PI / 180, pitch = 9 * Math.PI / 180, dist = portrait ? 3.5 : 3.3;
  const eye = [T[0] - Math.sin(yaw) * Math.cos(pitch) * dist, T[1] + Math.sin(pitch) * dist, T[2] + Math.cos(yaw) * Math.cos(pitch) * dist];
  const F = norm(T.map((v, i) => v - eye[i]));
  let R = norm(cross(F, [0, 1, 0])), U = cross(R, F);
  if (portrait) [R, U] = [U.map(v => -v), R];
  Object.assign(cam, { eye, R, U, F, aspect: W / H, portrait, tan: Math.tan((portrait ? 60 : 46) * Math.PI / 360) });
}
// A screen point to a world ray direction.
function rayAt(cx, cy) {
  const r = canvas.getBoundingClientRect();
  const nx = ((cx - r.left) / r.width) * 2 - 1, ny = 1 - ((cy - r.top) / r.height) * 2;
  return norm([0, 1, 2].map(i => cam.F[i] + nx * cam.tan * cam.aspect * cam.R[i] + ny * cam.tan * cam.U[i]));
}

/* ---------- shaders ---------- */
const TRI = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const HEAD = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
`;
// Henyey-Greenstein phase, normalized to 1 at g = 0.
const PHASE = `
float hg(float c, float g) {
  float d = 1.0 + g * g - 2.0 * g * c;
  return (1.0 - g * g) / (d * sqrt(d));
}`;
const NOISE = `
float h31(vec3 p) {
  p = fract(p * vec3(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yxz + 33.33);
  return fract((p.x + p.y) * p.z);
}
float vnoise(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1, 0, 0)), f.x), mix(h31(i + vec3(0, 1, 0)), h31(i + vec3(1, 1, 0)), f.x), f.y),
    mix(mix(h31(i + vec3(0, 0, 1)), h31(i + vec3(1, 0, 1)), f.x), mix(h31(i + vec3(0, 1, 1)), h31(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm(vec3 p) { return 0.55 * vnoise(p) + 0.3 * vnoise(p * 2.1 + 3.7) + 0.15 * vnoise(p * 4.3 + 9.1); }
// Laser speckle: exponential intensity on a fine lattice, interpolated.
float sx(vec3 i) { return -log(max(h31(i), 1e-3)); }
float speckle(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(sx(i), sx(i + vec3(1, 0, 0)), f.x), mix(sx(i + vec3(0, 1, 0)), sx(i + vec3(1, 1, 0)), f.x), f.y),
    mix(mix(sx(i + vec3(0, 0, 1)), sx(i + vec3(1, 0, 1)), f.x), mix(sx(i + vec3(0, 1, 1)), sx(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}`;
// Sheet uniforms are shared by the haze and the smoke.
const SHEET = `
uniform vec3 uN, uLens, uFan, uLaser;
uniform float uH, uFanCos;
float fanMask(vec3 vl) { return smoothstep(uFanCos - 0.025, uFanCos + 0.025, dot(vl, uFan)); }
`;

// The room: a dark gradient, a backlight shaft in fbm haze, and the laser sheet.
const HAZE_FS = HEAD + PHASE + NOISE + SHEET + `
in vec2 vUv;
out vec4 o;
uniform vec3 uEye, uR, uU, uF, uBackDir, uBack, uRoom;
uniform vec2 uTan;
uniform float uHaze, uTime, uW;
uniform vec4 uPuff;
void main() {
  vec2 ndc = vUv * 2.0 - 1.0;
  vec3 d = normalize(uF + ndc.x * uTan.x * uR + ndc.y * uTan.y * uU);
  vec3 col = uRoom * (0.75 + 0.35 * d.y);
  vec3 drift = vec3(uTime * 0.03, uTime * 0.012, -uTime * 0.02);
  // The backlight shaft: the ray's closest point to the shaft axis.
  vec3 S0 = vec3(-2.6, 2.1, -1.5), w0 = uEye - S0;
  float b = dot(d, uBackDir), dq = dot(d, w0), e = dot(uBackDir, w0), den = max(1.0 - b * b, 1e-4);
  float t = max((b * e - dq) / den, 0.0), s = e + t * b;
  float dist = length(w0 + t * d - s * uBackDir);
  float shaft = exp(-dist * dist / 0.6) * smoothstep(0.3, 2.0, s);
  float n = fbm((uEye + t * d) * 0.9 + drift);
  col += uBack * shaft * hg(dot(uBackDir, -d), 0.55) * (0.2 + 1.1 * n * n) * uHaze * 0.06;
  // Faint haze everywhere, so the dark is never flat.
  col += uBack * (0.004 + 0.006 * fbm(d * 3.0 + drift)) * uHaze;
  // A charge swells the haze at the muzzle.
  if (uPuff.w > 0.0) {
    vec3 m = uPuff.xyz - uEye;
    float pd = length(m - dot(m, d) * d), pr = 0.07 + 0.12 * uPuff.w;
    col += uBack * uPuff.w * exp(-pd * pd / (pr * pr)) * (0.6 + 0.6 * fbm(uPuff.xyz * 6.0 + drift * 4.0)) * 0.22;
  }
  // The laser sheet: the ray meets its plane once.
  float dn = dot(d, uN);
  float th = (uH - dot(uEye, uN)) / dn;
  if (abs(dn) > 1e-4 && th > 0.0) {
    vec3 q = uEye + th * d, v = q - uLens;
    float r = length(v);
    vec3 vl = v / r;
    float thick = min(uW * 1.77 / abs(dn), 0.2);
    float dens = 0.45 + 0.8 * fbm(q * 1.6 + drift * 2.0);
    float sp = speckle(q * 260.0 + vec3(0.0, uTime * 0.6, 0.0));
    float lit = fanMask(vl) * thick * dens * (0.45 + 0.55 * sp) * hg(dot(vl, -d), 0.5) / (r * r + 0.15);
    col += uLaser * lit * uHaze * 0.9;
  }
  o = vec4(col, 1.0);
}`;

/* smoke particles */
// The state texture is 64 wide; each slot owns ROWS rows.
const ADVECT_FS = HEAD + `
in vec2 vUv;
out vec4 o;

  for (let i = 1; i < blooms.length; i++) {
    bind(q, 'uSrc', 0, blooms[i - 1]);
    gl.uniform2f(q.u.uTexel, 1 / blooms[i - 1].w, 1 / blooms[i - 1].h);
    draw(blooms[i]);
  }
  q = P.up;
  gl.useProgram(q.p);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = blooms.length - 2; i >= 0; i--) {
    bind(q, 'uSrc', 0, blooms[i + 1]);
    gl.uniform2f(q.u.uTexel, 0.5 / blooms[i + 1].w, 0.5 / blooms[i + 1].h);
    draw(blooms[i]);
  }
  gl.disable(gl.BLEND);
  q = P.grade;
  gl.useProgram(q.p);
  bind(q, 'uScene', 0, scene);
  bind(q, 'uBloom', 1, blooms[0]);
  gl.uniform1f(q.u.uBloomK, 0.6);
  gl.uniform1f(q.u.uTime, time);
  draw(null);
}

// The aim ring grows with charge and pulses while held.
function ghost(f, H) {
  const q = P.ghost, c = chargeNow(), { e1, e2 } = basis(aimDir);
  gl.useProgram(q.p);
  camUniforms(q);
  gl.uniform2f(q.u.uFoc, f / cam.aspect, f);
  gl.uniform1f(q.u.uPx, 0.5 * H * f);
  gl.uniform3fv(q.u.uC, MUZZLE.map((v, i) => v + aimDir[i] * 0.05));
  gl.uniform3fv(q.u.uE1, e1);
  gl.uniform3fv(q.u.uE2, e2);
  gl.uniform1f(q.u.uRad, ringR(c));
  gl.uniform1f(q.u.uA, 0.05 + 0.08 * c * (0.75 + 0.25 * Math.sin(time * 14)));
  gl.drawArrays(gl.POINTS, 0, 72);
}

/* ---------- frame loop ---------- */
let raf = 0, last = 0, lastDraw = 0, visible = true, lastInput = performance.now();
const queue = [];
// Rings, smoke or a queued fire keep the sim stepping at full rate.
const simBusy = () => queue.length > 0 || rings.some(r => r.on) || slot.some(s => s.fade > 0);
// Haze drifts for 60 s after the last input, then eases still over 2 s.
const driftSpeed = (now = performance.now()) => (reduced() ? 0 : clamp((62000 - (now - lastInput)) / 2000));
const busy = () => visible && (!!ptr || simBusy() || driftSpeed() > 0);
function wake() { if (!raf && visible && P) { last = lastDraw = performance.now(); raf = requestAnimationFrame(frame); } }
function touch() { lastInput = performance.now(); wake(); }
function frame(now) {
  raf = 0;
  const lively = !!ptr || simBusy();
  // Drift alone runs at 30 fps.
  if (!lively && now - lastDraw < 31) { raf = requestAnimationFrame(frame); return; }
  const dt = Math.min(1 / 30, (now - last) / 1000);
  last = lastDraw = now;
  try {
    time += dt;
    driftT += dt * driftSpeed(now);
    if (simBusy()) step(reduced() ? dt * 0.6 : dt);
    render();
    sfx.room(rings.some(r => r.on));
  } finally {
    if (busy()) raf = requestAnimationFrame(frame);
    else { sfx.room(false); sfx.rest(); }
  }
}
function still() { if (P) render(); }
const later = (dt, fn) => { queue.push({ t: simTime + dt, fn }); queue.sort((a, b) => a.t - b.t); };

/* ---------- firing ---------- */
// The aim is the pointer's ray, met with the plane z = 0.
function aimAt(cx, cy) {
  const d = rayAt(cx, cy), e = cam.eye;
  let dir = [1, 0, 0];
  if (Math.abs(d[2]) > 1e-4) {
    const t = -e[2] / d[2];
    if (t > 0) dir = norm([0, 1, 2].map(i => e[i] + d[i] * t - MUZZLE[i]));
  }
  // The cannon turns 50 degrees at most from its axis.
  const lim = Math.cos(50 * Math.PI / 180);
  if (dir[0] < lim) {
    const side = Math.hypot(dir[1], dir[2]) || 1, s = Math.sin(50 * Math.PI / 180);
    dir = [lim, dir[1] / side * s, dir[2] / side * s];
  }
  return dir;
}
const jitter = (v, k) => v * (1 + (Math.random() * 2 - 1) * k);
// Charge makes a wider, faster ring.
const ringR = c => 0.16 + 0.12 * c, ringU = c => 0.85 + 0.55 * c;
function shoot(dir, c = 0, from = MUZZLE) {
  fire({ from, dir, R: jitter(ringR(c), 0.06), U: jitter(ringU(c), 0.06) });
  sfx.thup(c, from.map((v, i) => v + dir[i] * 0.1));
  touch();
}
// Two rings on one axis: the rear one catches up and passes through.
act.pair = () => {
  const dir = norm([1, (Math.random() - 0.5) * 0.08, (Math.random() - 0.5) * 0.06]);
  shoot(dir, 0.1);
  later(0.42, () => shoot(dir, 0.1));
};
// Two rings meet head on, inside the sheet.
act.collide = () => {
  const far = [2 * SHEET_X - MUZZLE[0], MUZZLE[1], 0];
  shoot([1, 0, 0], 0.15);
  shoot([-1, 0, 0], 0.15, far);
};
act.clear = () => {
  queue.length = 0;
  rings.forEach(r => { if (r.on) kill(r); });
  touch();
};
act.sheet = v => { sheetMode = v; touch(); still(); };
act.laser = v => { laser = LASER[v] ? v : 'green'; still(); };
act.reset = () => {
  act.clear();
  ui.choice?.set('across');
  sheetMode = 'across';
  ui.slider?.set(0.5);
  haze = 0.5;
};

/* ---------- pointer ---------- */
// A press becomes a drag after 8 px, or a hold after 260 ms.
// A drag aims; a hold charges; release fires along the aim.
let ptr = null, holdTo = 0, aimDir = [1, 0, 0];
const chargeNow = () => (ptr?.held ? clamp((performance.now() - ptr.th) / 1200) : 0);
function down(e) {
  if (ptr || e.button > 0) return;
  try { canvas.setPointerCapture(e.pointerId); } catch { /* A synthetic pointer has no capture. */ }
  ptr = { id: e.pointerId, x0: e.clientX, y0: e.clientY, drag: false, held: false, th: 0 };
  aimDir = aimAt(e.clientX, e.clientY);
  holdTo = setTimeout(() => { if (ptr && !ptr.drag) { ptr.held = true; ptr.th = performance.now(); } }, 260);
  touch();
}
function move(e) {
  if (!ptr || e.pointerId !== ptr.id) return;
  if (!ptr.drag && Math.hypot(e.clientX - ptr.x0, e.clientY - ptr.y0) > 8) ptr.drag = true;
  aimDir = aimAt(e.clientX, e.clientY);
}
// A cancel or a lost capture ends the gesture without a fire.
function up(e) {
  if (!ptr || (e && e.pointerId !== ptr.id)) return;
  clearTimeout(holdTo);
  const c = chargeNow();
  ptr = null;
  if (e?.type === 'pointerup') shoot(aimDir, c);
  else touch();
}

/* ---------- sound ---------- */
// Web Audio voices on the shared kit: muted by default, gesture start, sleep.
const kit = audioKit({ keys: new Set([' ']) });
// Screen x of a world point, from -1 to 1, for panning.
function panOf(p) {
  const q = p.map((v, i) => v - cam.eye[i]);
  const z = q[0] * cam.F[0] + q[1] * cam.F[1] + q[2] * cam.F[2];
  const x = (q[0] * cam.R[0] + q[1] * cam.R[1] + q[2] * cam.R[2]) / (Math.max(0.1, z) * cam.tan * cam.aspect);
  return clamp(x, -1, 1) * 0.8;
}
const sfx = (() => {
  let bed = null;
  const vary = k => 1 + (Math.random() * 2 - 1) * k;
  const db = d => 10 ** (d / 20);
  function panner(ac, p) {
    const n = ac.createStereoPanner();
    n.pan.value = panOf(p);
    n.connect(kit.out);
    return n;
  }
  return {
    rest() { kit.rest(() => !busy()); },
    // A soft thup: a falling sine body and a puff of band-passed air.
    thup(c, p) {
      const ac = kit.live();
      if (!ac) return;
      const t = ac.currentTime + 0.004, f = (104 - 38 * c) * vary(0.08), lv = db((Math.random() * 2 - 1) * 2);
      const out = panner(ac, p);
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(f * 1.9, t);
      o.frequency.exponentialRampToValueAtTime(f, t + 0.06);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.85 * lv * (0.75 + 0.4 * c), t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24 + 0.12 * c);
      o.connect(g).connect(out);
      o.start(t);
      o.stop(t + 0.42);
      const n = ac.createBufferSource(), bp = ac.createBiquadFilter(), ng = ac.createGain();
      n.buffer = kit.noise;
      bp.type = 'bandpass';
      bp.frequency.value = (440 - 140 * c) * vary(0.12);
      bp.Q.value = 0.8;
      ng.gain.setValueAtTime(0.0001, t);
      ng.gain.exponentialRampToValueAtTime(0.5 * lv, t + 0.006);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      n.connect(bp).connect(ng).connect(out);
      n.start(t, Math.random() * 0.6);
      n.stop(t + 0.2);
    },
    // A faint glassy tick as a ring crosses the sheet.
    tick(p) {
      const ac = kit.live();
      if (!ac) return;
      const t = ac.currentTime + 0.004, f = 2900 * vary(0.12), lv = 0.05 * db((Math.random() * 2 - 1) * 2);
      const out = panner(ac, p);
      [[1, 1], [2.76, 0.35]].forEach(([m, a]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = f * m;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(lv * a, t + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2 / m);
        o.connect(g).connect(out);
        o.start(t);
        o.stop(t + 0.25);
      });
    },
    // Low room noise under the rings, at about -40 dB.
    room(on) {
      const ac = kit.live();
      if (!ac) return;
      if (!bed && on) {
        const n = ac.createBufferSource(), lp = ac.createBiquadFilter(), g = ac.createGain();
        n.buffer = kit.noise;
        n.loop = true;
        lp.type = 'lowpass';
        lp.frequency.value = 300;
        g.gain.value = 0;
        n.connect(lp).connect(g).connect(kit.out);
        n.start();
        bed = g;
      }
      if (bed && bed.on !== on) {
        bed.gain.setTargetAtTime(on ? 0.035 : 0, ac.currentTime, on ? 0.4 : 0.6);
        bed.on = on;
      }
    },
  };
})();

/* ---------- first frame ---------- */
// Two rings, pre-rolled: one flares in the sheet, one beyond it breaks up.
function preroll() {
  seedN = 9173;
  fire({ from: MUZZLE, dir: [1, 0.16, -0.05], R: 0.2, U: 0.95 });
  for (let i = 0; i < 66; i++) step(1 / 60);
  const b = rings[fire({ from: MUZZLE, dir: [1, -0.05, 0.02], R: 0.17, U: 0.95 })], s = SHEETS.across;
  // Step until the second ring's centre reaches the sheet.
  for (let i = 0; i < 240 && b.on && b.c[0] * s.n[0] + b.c[2] * s.n[2] < s.h; i++) step(1 / 60);
}

/* ---------- boot ---------- */
try {
  await initGL();
  layout();
  preroll();
  render();
  gl.finish();
  canvas.classList.add('on');
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  ui.hideControls?.();
  markReady();
  throw err;
}
markReady();
wake();

canvas.addEventListener('pointerdown', down);
canvas.addEventListener('pointermove', move);
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
canvas.addEventListener('lostpointercapture', up);
stage.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat) return;
  e.preventDefault();
  act.pair();
});

new ResizeObserver(() => { layout(); still(); }).observe(stage);
onReducedChange(() => { touch(); still(); });
onQuality(() => { layout(); still(); });
// A hidden tab stops the loop and the sim clock with it.
whenVisible(stage, v => {
  visible = v;
  if (!v) { cancelAnimationFrame(raf); raf = 0; return; }
  if (busy()) wake(); else still();
});
</script>
</body>
</html>
