<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.14 0.02 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coast and meteor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Coast and meteor: a cove at dusk under a falling meteor. */
:root { --stage: oklch(0.14 0.02 265); }
.stage--meteor canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--meteor canvas.on { opacity: 1; }
.stage--meteor { cursor: crosshair; }
.stage--meteor.look { cursor: grabbing; }
@media (prefers-reduced-motion: reduce) { .stage--meteor canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Coast and meteor</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--meteor" id="stage" tabindex="0" role="application" aria-label="A pebble cove at dusk, a dark headland on one side. Press the sky to bring a meteor in; drag to look around.">
      <p class="fail" hidden>Coast and meteor needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Coast and meteor</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createNoise2D } from 'simplex-noise';
import { gsap } from 'gsap';
import { initPage, whenVisible, pixelRatio, onQuality, linFit, reduced, onReducedChange, quality } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

// The handlers bind once the scene exists.
const act = { dusk() {}, cliff() {}, letterbox() {}, shower() {} };
let sizePick = 'fireball';
const ui = initPage({ id: 'meteor', bar: {
  choice: { label: 'Size', value: 'fireball', options: [
    { value: 'pebble', label: 'Pebble', key: '1' },
    { value: 'fireball', label: 'Fireball', key: '2' },
    { value: 'impact', label: 'Impact', key: '3' },
  ], onPick: v => { sizePick = v; } },
  slider: { label: 'Dusk', min: 0, max: 1, step: 0.01, value: 0.3, onInput: v => act.dusk(v) },
  actions: [{ verb: 'shower', onPress: () => act.shower() }],
  settings: [
    { type: 'toggle', id: 'letterbox', label: 'Letterbox', value: false, persist: true, onToggle: v => act.letterbox(v) },
    { type: 'choice', id: 'cliff', label: 'Cliff', value: 'left', persist: true,
      options: [{ value: 'left', label: 'Left' }, { value: 'right', label: 'Right' }], onPick: v => act.cliff(v) },
  ],
  quality: true,
  keys: [['click', 'meteor'], ['drag', 'look around'], ['space', 'shower']],
} });

// Seeded random keeps the cove the same on every load.
let seed = 1977;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 20000);
camera.rotation.order = 'YXZ';
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;

/* ---------- dusk palettes ---------- */
// Three keyframes along the Dusk slider: last light, blue hour, night.
// Each colour is OKLCH; the shaders get linear RGB.
const DUSK = [
  { zen: [0.44, 0.085, 255], mid: [0.6, 0.075, 330], band: [0.84, 0.15, 60], anti: [0.56, 0.05, 295], stars: 0, sun: -1.5, exp: 1.0 },
  { zen: [0.28, 0.08, 262], mid: [0.4, 0.075, 320], band: [0.62, 0.15, 48], anti: [0.33, 0.05, 280], stars: 0.45, sun: -6, exp: 1.2 },
  { zen: [0.17, 0.05, 264], mid: [0.19, 0.045, 275], band: [0.27, 0.055, 32], anti: [0.18, 0.045, 266], stars: 1, sun: -13, exp: 1.9 },
];
const DK = DUSK.map(k => ({ ...k, zen: linFit(...k.zen), mid: linFit(...k.mid), band: linFit(...k.band), anti: linFit(...k.anti) }));
// The sun sets out to sea, on the side away from the headland.
const SUN_AZ = 0.32;

/* ---------- uniforms ---------- */
const HB = { x0: -900, z0: -1500, w: 1800, d: 1800, n: 512 };
const U = {
  uTime: { value: 0 },
  uZen: { value: new THREE.Vector3() }, uMid: { value: new THREE.Vector3() },
  uBand: { value: new THREE.Vector3() }, uAnti: { value: new THREE.Vector3() },
  uGround: { value: new THREE.Vector3() },
  uSun: { value: new THREE.Vector3(SUN_AZ, -0.03, -1).normalize() },
  uStars: { value: 0 },
  uHaze: { value: 0.00011 },
  uHazeH: { value: 260 },
  tHeight: { value: null },
  uHB: { value: new THREE.Vector4(HB.x0, HB.z0, 1 / HB.w, 1 / HB.d) },
  // Mean sea level: drop, trough front, return crest, return height.
  uLevel: { value: new THREE.Vector4(0, 0, 0, 0) },
  // The one moving light: position and intensity, then its colour.
  uFireball: { value: new THREE.Vector4(0, 1000, -3000, 0) },
  uFireCol: { value: new THREE.Vector3(1, 1, 1) },
  // Shadow march steps; the ladder halves them.
  uShSteps: { value: 16 },
  // The impact: site xyz, flash strength; and the flash colour.
  uImpact: { value: new THREE.Vector4(0, 0, -11000, 0) },
  uImpCol: { value: new THREE.Vector3(1, 1, 1) },
  // The shock ring on the sea: radius, width, strength.
  uShock: { value: new THREE.Vector4(0, 300, 0, 0) },
  // Glare dims the stars.
  uGlare: { value: 0 },
  // Wet ground: the high-water mark, and how dry it is (0 wet, 1 dry).
  uWet: { value: new THREE.Vector2(0.3, 1) },
};

/* ---------- K2: noise ---------- */
// Lifted from Fireworks, which lifted it from Night viaduct, Port.
const K2_NOISE = /* glsl */`
float k2hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float k2noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(k2hash(i), k2hash(i + vec2(1, 0)), u.x), mix(k2hash(i + vec2(0, 1)), k2hash(i + vec2(1, 1)), u.x), u.y);
}
float k2fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * k2noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s;
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: sky ---------- */
// Dusk palettes replace Fireworks' night: zenith, a mid band, the afterglow.
// The stars keep Fireworks' grid; the Dusk slider brings them in.
const K2_SKY = /* glsl */`
uniform vec3 uZen, uMid, uBand, uAnti, uSun;
uniform float uStars;
uniform vec4 uFireball, uImpact;
uniform vec3 uFireCol, uImpCol;
uniform float uGlare;
// The flash dome over the impact bearing: a dome on the horizon, a halo, a wash.
vec3 impactGlow(vec3 dir) {
  if (uImpact.w < 1e-4) return vec3(0.0);
  vec3 v = uImpact.xyz - cameraPosition;
  vec2 D = normalize(v.xz);
  float a = acos(clamp(dot(normalize(dir.xz + vec2(1e-5)), D), -1.0, 1.0));
  float up = max(dir.y, 0.0);
  float dome = exp(-a * a * 16.0) * exp(-up * 7.0);
  float halo = exp(-a * a * 2.2) * exp(-up * 2.5);
  float wash = 0.02 * exp(-up * 1.2);
  return uImpCol * uImpact.w * (1.3 * dome + 0.22 * halo + wash);
}
// Glow that a view ray collects in the air round the meteor.
// It replaces Fireworks' burstGlow: one light, not eight.
vec3 fireGlow(vec3 dir) {
  if (uFireball.w < 1e-4) return vec3(0.0);
  vec3 v = normalize(uFireball.xyz - cameraPosition);
  float c = dot(dir, v) - 1.0;
  // A tight core, a halo, a wide lift, and a flash over the whole sky.
  float g = 0.08 * exp(c * 400.0) + 0.04 * exp(c * 40.0) + 0.02 * exp(c * 4.0) + 0.006 * exp(-max(dir.y, 0.0) * 2.0);
  return uFireCol * uFireball.w * g;
}
float k2stars(vec3 dir) {
  vec2 q = vec2(atan(dir.x, -dir.z) * 260.0, dir.y * 260.0);
  vec2 i = floor(q), f = fract(q) - 0.5;
  float h = k2hash(i);
  // About one cell in two hundred holds a star.
  float on = step(0.995, h);
  vec2 o = vec2(k2hash(i + 7.1), k2hash(i + 3.3)) - 0.5;
  return on * exp(-dot(f - o * 0.6, f - o * 0.6) * 60.0) * (0.02 + 0.05 * k2hash(i + 1.7));
}
// The dusk sky with no stars; haze and light reuse it.
vec3 duskGlow(vec3 dir) {
  float up = max(dir.y, 0.0);
  float az = dot(normalize(dir.xz + vec2(1e-5)), normalize(uSun.xz));
  float sw = pow(0.5 + 0.5 * az, 3.0);
  vec3 hor = mix(uAnti, uBand, sw);
  vec3 mid = mix(uAnti, uMid, sw);
  vec3 col = mix(uZen, mid, exp(-up * 3.2));
  col = mix(col, hor, exp(-up * 11.0));
  // The afterglow hugs the horizon above the set sun.
  col += uBand * 0.8 * pow(sw, 8.0) * exp(-up * 28.0);
  return col;
}
vec3 k2sky(vec3 dir) {
  vec3 col = duskGlow(dir);
  col += vec3(0.85, 0.9, 1.0) * k2stars(dir) * 2.5 * uStars * (1.0 - uGlare) * smoothstep(0.03, 0.25, dir.y);
  return col + fireGlow(dir) + impactGlow(dir);
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: haze ---------- */
// Height haze along the view ray; the dusk sky near the horizon colours it.
const K2_HAZE = /* glsl */`
uniform float uHaze;
uniform float uHazeH;
float k2hazeAmount(vec3 P) {
  vec3 v = P - cameraPosition;
  float dist = length(v);
  float k = 1.0 / uHazeH;
  float h0 = max(cameraPosition.y, 0.0), h1 = max(P.y, 0.0), dh = h1 - h0;
  // Exponential height fog integrated along the ray.
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);
  return 1.0 - exp(-dist * uHaze * max(avg, 0.0));
}
vec3 k2hazeColor(vec3 dir) { return duskGlow(normalize(vec3(dir.x, 0.04, dir.z))) * 0.9 + fireGlow(dir) * 0.8 + impactGlow(dir) * 0.7; }
vec3 k2haze(vec3 c, vec3 P) {
  return mix(c, k2hazeColor(normalize(P - cameraPosition)), k2hazeAmount(P));
}`;
/* ---------- end K2 ---------- */

/* ---------- ground light and height ---------- */
// Sky light on a surface, plus the afterglow on faces turned to the sunset.
// hAt reads the baked height field; outside it lies deep seabed.
const WORLD_GLSL = /* glsl */`
uniform float uTime;
uniform vec3 uGround;
uniform sampler2D tHeight;
uniform vec4 uHB, uLevel, uShock;
uniform vec2 uWet;
vec3 skyLight(vec3 N) {
  vec3 up = uZen * 0.55 + uMid * 0.25 + uAnti * 0.2;
  vec3 amb = mix(uGround, up, 0.5 + 0.5 * N.y);
  vec3 L = normalize(vec3(uSun.x, 0.22, uSun.z));
  return amb + uBand * 0.45 * max(dot(N, L), 0.0);
}
float hAt(vec2 xz) {
  vec2 uv = (xz - uHB.xy) * uHB.zw;
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) return -30.0;
  return texture2D(tHeight, uv).r;
}
uniform float uShSteps;
// March the height field from P along D: 1 is clear, 0 is blocked.
// Steps grow so any step count reaches about 1.5 km.
float march(vec3 P, vec3 D, float steps, float t0, out float tHit) {
  float o = 1.0, t = t0, r = pow(500.0, 1.0 / steps);
  tHit = 0.0;
  for (int i = 0; i < 18; i++) {
    if (float(i) >= steps) break;
    vec3 Q = P + D * t;
    float k = clamp((Q.y - hAt(Q.xz)) / (0.03 * t), 0.0, 1.0);
    if (k < o) { o = k; tHit = t; }
    if (o < 0.01 || Q.y > 140.0) break;
    t *= r;
  }
  return o;
}
// The meteor's light at P, with the soft shadow of the land between.
vec3 fireLight(vec3 P, vec3 Ng, out vec3 L) {
  L = normalize(uFireball.xyz - P);
  if (uFireball.w < 1e-3) return vec3(0.0);
  float th;
  return uFireCol * uFireball.w * march(P + Ng * 0.4, L, uShSteps, 3.0, th);
}
// Mean water level. s runs seaward from the waterline.
// The trough front comes in from the sea: water seaward of it has dropped.
// Behind the returning crest the sea stands at its old level again.
float level(vec2 xz) {
  float s = -xz.y;
  float drop = uLevel.x * smoothstep(uLevel.y - 400.0, uLevel.y + 400.0, s);
  drop *= 1.0 - smoothstep(uLevel.z - 150.0, uLevel.z + 150.0, s);
  float c = cosh((s - uLevel.z) / 110.0);
  return -drop + uLevel.w / (c * c);
}
// The shock ring on the sea at xz: 1 at the crisp front, trailing off behind.
float shockAt(vec2 xz) {
  float rd = length(xz - uImpact.xz) - uShock.x;
  return uShock.z * smoothstep(0.0, -uShock.y * 0.15, rd) * exp(min(rd, 0.0) / (uShock.y * 1.5));
}`;
const HEAD = `${K2_NOISE}\n${K2_SKY}\n${K2_HAZE}\n${WORLD_GLSL}`;

/* ---------- sky dome ---------- */
const sky = new THREE.Mesh(new THREE.SphereGeometry(15000, 48, 24), new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false,
  vertexShader: /* glsl */`varying vec3 vP; void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`varying vec3 vP; ${HEAD} void main() { gl_FragColor = vec4(k2sky(normalize(vP - cameraPosition)), 1.0); }`,
}));
sky.renderOrder = -1;
scene.add(sky);

/* ---------- terrain: beach, headland and seabed ---------- */
// One height function makes the mesh and the shadow texture.
const noise = createNoise2D(rnd);
// 1 puts the headland on the left, -1 on the right.
let cliffSide = 1;
function terrainH(x, z) {
  // u runs from the cove toward the headland side.
  const u = -cliffSide * x;
  // The waterline curves seaward at both ends of the cove.
  const s = z + x * x / 2600;
  let h;
  if (s >= 0) {
    // A steep pebble bank, a berm, then low hills inland.
    h = 0.075 * Math.min(s, 22) + 0.03 * Math.max(0, s - 22) + 34 * sm(70, 420, s) * (0.6 + 0.4 * noise(x * 0.004, 2.1));
  } else {
    const d = -s;
    h = Math.max(-26, -0.05 * Math.min(d, 40) - 0.045 * Math.max(0, d - 40));
    // Reefs of ridged rock on the bed; the draw-back bares them.
    const r = 1 - Math.abs(noise(x * 0.018, z * 0.018));
    h += 1.3 * sm(0.8, 0.97, r) * (0.5 + 0.5 * noise(x * 0.07, z * 0.07 + 5)) * sm(10, 40, d) * (1 - sm(260, 420, d));
  }
  h += 0.12 * noise(x * 0.05, z * 0.05);
  // The headland: a ridge that runs out to sea and narrows to a tip.
  const out = -z;
  const ur = 190 + 0.05 * out + 25 * noise(out * 0.003, 4.4);
  const w = 130 - 55 * sm(0, 650, out);
  const H = (56 + 20 * noise(out * 0.004, 8.8)) * (1 - sm(560, 720, out));
  const prof = d => Math.sqrt(Math.max(0, 1 - d ** 4));
  const d0 = Math.abs(u - ur) / w + 0.12 * noise(z * 0.012, u * 0.012) + 0.05 * noise(z * 0.05, u * 0.05);
  // A second wobble keyed to height breaks the wall into ledges and buttresses.
  const dd = d0 + 0.04 * noise(z * 0.035 + 11, prof(d0) * 2.5);
  const p = prof(dd);
  const rid = 1 - Math.abs(noise(x * 0.02, z * 0.02));
  // Past its edge the profile runs down to the deep bed.
  const head = (H + 30) * p - 30 + 7 * rid * rid * p;
  return Math.max(h, head);
}
// The grid bunches up near the camera and the headland.
const TX = 420, TZ = 420;
function terrainGeometry() {
  const pos = new Float32Array((TX + 1) * (TZ + 1) * 3), idx = [];
  let k = 0;
  for (let j = 0; j <= TZ; j++) {
    const c = (j / TZ) * 2 - 1;
    const z = c < 0 ? 18 + 382 * (-c) ** 1.7 : 18 - 1518 * c ** 1.7;
    for (let i = 0; i <= TX; i++) {
      const a = (i / TX) * 2 - 1;
      const x = Math.sign(a) * 1500 * Math.abs(a) ** 1.6;
      pos[k++] = x; pos[k++] = terrainH(x, z); pos[k++] = z;
    }
  }
  for (let j = 0; j < TZ; j++) for (let i = 0; i < TX; i++) {
    const a = j * (TX + 1) + i, b = a + TX + 1;
    idx.push(a, a + 1, b, a + 1, b + 1, b);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
// The height field baked into a texture, for the sea and the shadow march.
let heightTex = null;
function bakeHeight() {
  const n = HB.n, data = new Uint16Array(n * n);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const x = HB.x0 + HB.w * (i + 0.5) / n, z = HB.z0 + HB.d * (j + 0.5) / n;
    data[j * n + i] = THREE.DataUtils.toHalfFloat(terrainH(x, z));
  }
  const t = new THREE.DataTexture(data, n, n, THREE.RedFormat, THREE.HalfFloatType);
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.needsUpdate = true;
  heightTex?.dispose();
  heightTex = t;
  U.tHeight.value = t;
}
const land = new THREE.Mesh(terrainGeometry(), new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: /* glsl */`varying vec3 vP; varying vec3 vN;
  void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; vN = normal; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`varying vec3 vP; varying vec3 vN; ${HEAD}
  void main() {
    vec3 N = normalize(vN);
    vec3 v = vP - cameraPosition;
    float dist = length(v);
    vec3 V = v / dist;
    float slope = 1.0 - N.y;
    // Pebbles: cells about 8 cm across, gone by 40 m.
    vec2 q = vP.xz * 12.0, iq = floor(q), fq = fract(q), id = iq, rr = vec2(0.0);
    float F = 9.0;
    for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
      vec2 g = vec2(x, y), o = vec2(k2hash(iq + g), k2hash(iq + g + 3.7));
      vec2 r = g + o - fq;
      float d = dot(r, r);
      if (d < F) { F = d; id = iq + g; rr = r; }
    }
    float near = 1.0 - smoothstep(8.0, 40.0, dist);
    float tone = k2hash(id * 1.37);
    vec3 peb = mix(vec3(0.15, 0.14, 0.13), vec3(0.32, 0.3, 0.27), tone) * (1.0 - 0.6 * smoothstep(0.35, 0.8, sqrt(F)));
    vec3 beach = mix(vec3(0.2, 0.19, 0.17), peb, near);
    // Each pebble is a small dome; its normal tips away from the cell centre.
    N = normalize(N - vec3(rr.x, 0.0, rr.y) * 0.55 * near * (1.0 - smoothstep(2.0, 4.0, vP.y)));
    // Rock on the cliff faces, dark turf on the headland's top.
    float n = k2fbm(vP.xz * 0.05 + vP.y * 0.03);
    // Bedding planes run level across the cliff.
    float strata = k2noise(vec2((vP.x + vP.z) * 0.02, vP.y * 0.45));
    vec3 rock = vec3(0.11, 0.105, 0.1) * (0.6 + 0.5 * n) * (0.7 + 0.6 * strata);

// Bloom on a float target; only bright sources cross the threshold.
// This toy runs it at half size; rung 3 of the ladder drops it to a third.
function makeBloom(strength, radius, threshold) {
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), strength, radius, threshold);
  const full = bloom.setSize.bind(bloom);
  bloom.setSize = (w, h) => { const m = rung >= 3 ? 0.33 : quality() === 'high' ? 0.7 : 0.5; full(Math.max(1, w * m), Math.max(1, h * m)); };
  // The stock blur has sigma equal to its radius: a near box, so bright stars bloom square.
  // A sigma of radius / 2.5 gives each layer a round falloff.
  for (const m of bloom.separableBlurMaterials) {
    const r = m.defines.KERNEL_RADIUS, sg = r / 2.5;
    m.uniforms.gaussianCoefficients.value = Array.from({ length: r }, (_, i) => Math.exp(-0.5 * i * i / (sg * sg)));
  }
  // Bilinear upsampling of the small mips draws square feathers.
  // A cubic B-spline read of each mip keeps the glow round.
  const cm = bloom.compositeMaterial;
  cm.fragmentShader = cm.fragmentShader
    .replace('void main() {', /* glsl */`vec4 bsw(float v) {
      vec4 n = vec4(1.0, 2.0, 3.0, 4.0) - v, s = n * n * n;
      float x = s.x, y = s.y - 4.0 * s.x, z = s.z - 4.0 * s.y + 6.0 * s.x;
      return vec4(x, y, z, 6.0 - x - y - z) / 6.0;
    }
    vec4 bic(sampler2D t, vec2 uv) {
      vec2 ts = vec2(textureSize(t, 0)), p = uv * ts - 0.5, fp = fract(p);
      p -= fp;
      vec4 xc = bsw(fp.x), yc = bsw(fp.y);
      vec4 c = p.xxyy + vec2(-0.5, 1.5).xyxy, w = vec4(xc.xz + xc.yw, yc.xz + yc.yw);
      vec4 o = (c + vec4(xc.yw, yc.yw) / w) / ts.xxyy;
      float sx = w.x / (w.x + w.y), sy = w.z / (w.z + w.w);
      return mix(mix(texture2D(t, o.yw), texture2D(t, o.xw), sx), mix(texture2D(t, o.yz), texture2D(t, o.xz), sx), sy);
    }
    void main() {`)
    .replace(/texture2D\(blurTexture([1-5]), vUv\)/g, 'bic(blurTexture$1, vUv)');
  cm.needsUpdate = true;
  return bloom;
}

// Linear grade before tone mapping: haze lift, vignette, fixed grain.

    uniforms: {
      tDiffuse: { value: null },
      uRes: { value: new THREE.Vector2(1, 1) },
      uTint: { value: new THREE.Vector3(...tint) },

      uVigIn: { value: vigIn },

    varying vec2 vUv;
    // An integer hash per pixel; float hashes draw faint stripes here.
    float h(vec2 p) {

/* ---------- events: each Size is a timeline on the sim clock ---------- */
// gsap.timeline({ paused: true }) runs only through tl.time(simT - t0).
// Each timeline leaves the global timeline, so GSAP's ticker stays idle.
const rad = THREE.MathUtils.degToRad;

const longOn = () => events.some(e => e.long);

// A Pebble: a short streak, a soft flash, gone in about a second.
function pebble(S, E) {

  const T = 0.6 + rnd() * 0.5;

// A Fireball: it enters low from behind the headland on a shallow path.
// Its light swings the headland's shadow across the bay toward the tap.
// It brightens, breaks up, bursts, and leaves a glowing train.
const FB_T = 4.2, FB_LEN = 25;

  TU.uTr.value.set(1.6 * Math.exp(-a / 5) * Math.min(1, a / 0.2), 0.4 * sm(1, 4, a) * (1 - sm(9, 20, a)), 14 + 5 * a, 0);
}

// An Impact: the impactor dives from the tap to the horizon on that bearing.
// Beyond the horizon: flash, dome, shock ring, ejecta, steam; then the sea
// pulls back from the cove, pauses, and returns as one breaking swell.
const IM_HIT = 3.0, IM_LEN = 48, IM_DIST = 11000;
const WHITE = [1, 0.97, 0.9], ORANGE = linFit(0.72, 0.17, 50), EMBERS = linFit(0.42, 0.14, 35);
let expBase = 1;
function impact(d) {
  const az = azOf(d), el = clamp(elOf(d), rad(4), rad(60));
  const site = camera.position.clone().add(dirOf(az, 0).multiplyScalar(IM_DIST));
  site.y = 0;
  const E = site.clone().setY(400);
  const S = camera.position.clone().addScaledVector(dirOf(az + (rnd() - 0.5) * rad(8), el), 5000);
  const st = { p: 0, g: 0, I: 0, F: 0, cool: 0, drop: 0, front: 6000, crest: 3500, w: 0, ringR: 0, ringS: 0, domeR: 0, domeA: 0, stH: 0, stA: 0, stG: 0, dry: 1, hw: 0.3 };
  const ev = { kind: 'impact', S, E, site, t0: simT, sd: rnd() * 100, st, long: true, len: IM_LEN };
  const R = reduced();
  ev.tl = paused()
    // The entry: a hard, bright streak, fastest at the end.
    .to(st, { p: 1, duration: IM_HIT, ease: 'power2.in' }, 0)
    .to(st, { g: 1, duration: 0.3 }, 0)
    .to(st, { I: 1.4, duration: IM_HIT, ease: 'power3.in' }, 0)
    .call(() => breakup(ev, IM_HIT, 60), null, IM_HIT * 0.7)
    // The flash: up in 0.4 s (200 ms on reduced motion), white to orange to embers.
    .to(st, { F: 1, duration: R ? 0.2 : 0.4, ease: 'power2.out' }, IM_HIT)
    .to(st, { F: 0.12, duration: 3.5, ease: 'power2.out' }, IM_HIT + 0.4)
    .to(st, { F: 0, duration: 30, ease: 'power1.out' }, IM_HIT + 4)
    .to(st, { cool: 1, duration: 2.5, ease: 'power1.in' }, IM_HIT + 0.3)
    .to(st, { cool: 2, duration: 8, ease: 'power1.inOut' }, IM_HIT + 3)
    .call(() => ejecta(ev), null, IM_HIT)
    // The condensation dome: grown and gone in 1.5 s.
    .to(st, { domeR: 2600, duration: 1.5, ease: 'power3.out' }, IM_HIT)
    .to(st, { domeA: 0.9, duration: 0.25 }, IM_HIT)
    .to(st, { domeA: 0, duration: 1.1, ease: 'power1.in' }, IM_HIT + 0.4)
    // The shock ring crosses 12 km of sea in 6.5 s, then dies in the cove.
    .to(st, { ringS: 1, duration: 0.3 }, IM_HIT + 0.2)
    .to(st, { ringR: IM_DIST + 900, duration: 6.5, ease: 'none' }, IM_HIT + 0.2)
    .to(st, { ringS: 0, duration: 1.6, ease: 'power1.in' }, IM_HIT + 5.4)
    // The steam column stands up over 12 s and thins away by the end.
    .to(st, { stG: 1, duration: 12, ease: 'power1.out' }, IM_HIT + 0.5)
    .to(st, { stH: 3200, duration: 14, ease: 'power1.out' }, IM_HIT + 0.5)
    .to(st, { stA: 0.85, duration: 3 }, IM_HIT + 0.5)
    .to(st, { stA: 0, duration: 12, ease: 'power1.in' }, IM_LEN - 13)
    // The draw-back: the trough comes in from the sea and drains the cove.
    .to(st, { drop: 4.6, duration: 4, ease: 'power1.inOut' }, IM_HIT + 2)
    .to(st, { front: -350, duration: 11, ease: 'power1.inOut' }, IM_HIT + 2)
    .to(st, { dry: 0, duration: 0.5 }, IM_HIT + 2)
    .to(st, { dry: 0.45, duration: 9, ease: 'power1.in' }, IM_HIT + 11)
    // The return: a crest that grows as it shoals, floods the bank, then drains.
    .to(st, { w: 1.2, duration: 2 }, IM_HIT + 19)
    .to(st, { crest: -70, duration: 10, ease: 'power1.out' }, IM_HIT + 19)
    .to(st, { w: 2.6, duration: 8, ease: 'power1.in' }, IM_HIT + 21)
    .to(st, { dry: 0, duration: 1 }, IM_HIT + 27)
    .to(st, { hw: 2.3, duration: 1 }, IM_HIT + 27)
    .to(st, { w: 0, duration: 5, ease: 'power1.out' }, IM_HIT + 29.5)
    .to(st, { drop: 0, duration: 3 }, IM_HIT + 30)
    // Wet stones keep a sheen, then dry over 10 s.
    .to(st, { dry: 1, duration: 10, ease: 'power1.in' }, IM_HIT + 34.5)
    .to(st, { hw: 0.3, duration: 10 }, IM_HIT + 34.5);
  ev.frame = age => {
    // The sea, the ring, the dome and the steam read the state every frame.
    U.uLevel.value.set(st.drop, st.front, st.crest, st.w);
    U.uShock.value.set(st.ringR, 320, st.ringS, 0);
    U.uWet.value.set(st.hw, st.dry);
    U.uImpact.value.set(site.x, site.y, site.z, 1.3 * st.F);
    const c = st.cool < 1 ? black.set(...WHITE).lerp(tmp3.set(...ORANGE), st.cool) : black.set(...ORANGE).lerp(tmp3.set(...EMBERS), st.cool - 1);
    U.uImpCol.value.copy(c);
    U.uGlare.value = clamp(st.F * 3.0);
    renderer.toneMappingExposure = expBase * (1 + 0.2 * st.F);
    dome.visible = st.domeA > 0.002;
    dome.position.copy(site);
    dome.scale.setScalar(Math.max(1, st.domeR));
    DU.uDome.value = st.domeA;
    steam.visible = st.stA > 0.002;
    PU.uSteam.value.set(st.stA, st.stH, 420 + 160 * st.stG, st.stG);
    if (age < IM_HIT) {
      const f = flick(age, ev.sd), head = along(ev, st.p);
      return { head, tail: along(ev, Math.max(0, st.p - 0.3)), gain: st.g * (8 + 14 * st.I) * f, width: 3.4,
        light: { pos: head, I: st.I * f, col: black.set(...WHITE).lerp(tmp3.set(...HEAD_C), 0.5).clone() } };
    }
    // After the hit, the fireball at the site is the light; it cools with the flash.
    return { head: E, tail: E, gain: 0, width: 1,
      light: { pos: site.clone().setY(900), I: 0.4 * st.F, col: c.clone() } };
  };
  // Everything the impact drives returns to rest when it ends.
  ev.end = () => {
    U.uLevel.value.set(0, 0, 0, 0); U.uShock.value.set(0, 320, 0, 0); U.uWet.value.set(0.3, 1);
    U.uImpact.value.w = 0; U.uGlare.value = 0; renderer.toneMappingExposure = expBase;
    dome.visible = steam.visible = false;
  };
  return ev;
}
// Ejecta: a fountain of K6 stars thrown up over the horizon from the site.
function ejecta(ev) {
  for (let i = 0; i < 90; i++) {
    const a = rnd() * Math.PI * 2, tilt = rnd() * rnd() * 0.45, sp = 220 + rnd() * 330;
    vel3.set(Math.cos(a) * Math.sin(tilt), Math.cos(tilt), Math.sin(a) * Math.sin(tilt)).multiplyScalar(sp);
    writeStar(tmp3.copy(ev.site).setY(150), ev.t0 + IM_HIT + rnd() * 0.6, vel3, 0.12, rnd() < 0.3 ? 2 : 1, 4 + rnd() * 5, 1.0, 1.0 + 0.6 * rnd(), 2, 0.4, 1);
  }
}

// Start an event of the picked Size, or queue it behind a long one.
function start(kind, d) {
  const ev = kind === 'pebble' ? pebbleAt(d) : kind === 'impact' ? impact(d) : fireball(d);
  ev.tl.time(0);
  events.push(ev);
  wake();
}
function onTap(d) {
  const kind = sizePick;
  if (kind === 'pebble' || !longOn()) return start(kind, d);
  // One tap waits behind a long event; later taps still answer, as Pebbles.
  if (!queued) queued = { kind, d };
  else start('pebble', d);
}
// A Shower: a dozen Pebbles over 20 s, all fleeing one radiant.
function shower() {
  const R = dirOf(-cliffSide * rad(15) + (rnd() - 0.5) * 0.4, rad(45 + rnd() * 15));
  const tl = paused();
  for (let i = 0; i < 12; i++) {
    tl.call(() => {
      for (let n = 0; n < 8; n++) {
        const u = new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).cross(R).normalize();
        const a1 = rad(12 + rnd() * 35), a2 = a1 + rad(6 + rnd() * 6);
        const dS = R.clone().multiplyScalar(Math.cos(a1)).addScaledVector(u, Math.sin(a1));
        const dE = R.clone().multiplyScalar(Math.cos(a2)).addScaledVector(u, Math.sin(a2));
        if (dE.y < 0.05) continue;
        const ev = pebble(camera.position.clone().addScaledVector(dS, 3900), camera.position.clone().addScaledVector(dE, 3800));
        ev.tl.time(0);
        events.push(ev);
        return;
      }
    }, null, i * 1.6 + rnd() * 1.4);
  }
  events.push({ kind: 'shower', t0: simT, tl, len: 20, long: false, frame: null });
  wake();
}
// Advance every event to the sim clock, then feed the light, meteors and train.
const black = new THREE.Vector3();
function stepEvents() {
  let best = null, n = 0;
  for (const ev of events) {
    const age = simT - ev.t0;
    ev.tl.time(Math.min(age, ev.tl.duration()));
    if (!ev.frame || age > ev.len) continue;
    const f = ev.frame(age);
    if (n < MAXM && f.gain > 1e-3) {
      aMH.setXYZW(n, f.head.x, f.head.y, f.head.z, f.gain);
      aMT.setXYZW(n, f.tail.x, f.tail.y, f.tail.z, f.width);
      n++;
    }
    if (f.light && (!best || f.light.I > best.I)) best = f.light;
  }
  for (const ev of events) if (simT - ev.t0 > ev.len) ev.end?.();
  events = events.filter(ev => simT - ev.t0 <= ev.len);
  metGeo.instanceCount = n;
  aMH.needsUpdate = aMT.needsUpdate = true;
  if (cliffNext && !events.length) applyCliff();
  if (queued && !longOn()) { const q = queued; queued = null; start(q.kind, q.d); }
  const F = U.uFireball.value;
  if (best && best.I > 1e-3) {
    F.set(best.pos.x, best.pos.y, best.pos.z, best.I);
    // The light cools from green-white toward orange as the wake takes over.
    if (best.col) U.uFireCol.value.copy(best.col);
    else U.uFireCol.value.set(...HEAD_C).lerp(black.set(...TAIL_C), best.mix);
  } else F.w = 0;
  trainFrame();
}
/* ---------- end events ---------- */

/* ---------- frame and draw ---------- */
let size = { w: 1, h: 1, dpr: 1 };
// The camera stands on the pebble bank; drag turns the head.
const look = { yaw: 0, pitch: 0 };
let letterbox = false;
function frame() {
  const portrait = size.w < size.h;
  camera.fov = portrait ? 62 : 40;
  camera.aspect = size.w / size.h;
  // The horizon sits 47 % down in landscape, 45 % in portrait.
  const hf = portrait ? 0.45 : 0.47;
  const pitch = -Math.atan((1 - 2 * hf) * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  // Portrait turns toward the headland, so it still frames the shot.
  const yaw = cliffSide * (portrait ? 0.2 : 0.06);
  camera.position.set(0, terrainH(0, 18) + 1.6, 18);
  camera.rotation.set(pitch + look.pitch, yaw + look.yaw, 0);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  // The bars crop toward 2.39:1, never more than 15 % a side.
  grade.uniforms.uBox.value = letterbox ? Math.min(0.15, Math.max(0, (1 - size.w / (2.39 * size.h)) / 2)) : 0;
}
function resize() {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  // Rung 1 drops the pixel ratio, rung 2 halves the marches, rung 3 shrinks bloom.
  size = { w, h, dpr: pixelRatio(w, h, { maxDpr: 1.5, budget: 1.6e6, low: rung >= 1 }) };
  renderer.setPixelRatio(size.dpr);
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  SU.uSteps.value = rung >= 2 ? 10 : 18;
  U.uShSteps.value = rung >= 2 ? 8 : 16;
  grade.uniforms.uRes.value.set(w * size.dpr, h * size.dpr);
  starMat.uniforms.uRes.value.set(w * size.dpr, h * size.dpr);
  starMat.uniforms.uDpr.value = size.dpr;
  frame();
  draw();
}
// A page that loads hidden may get no visibility event before input.
let visible = !document.hidden;
function draw() {
  if (!visible) return;
  commitStars();
  composer.render();
}

/* Frame loop: full rate while dragging, 30 fps while the waves drift, then sleep. */
// QA can shorten the sleep with ?sleep=<ms>.
const SLEEP = +new URLSearchParams(location.search).get('sleep') || 60000;
let raf = 0, lastT = 0, lastDraw = 0, lastInput = performance.now(), pace = reduced() ? 0 : 1, simT = 0;
const busy = () => !!press || events.length > 0 || !!queued || !!trainEv || simT < lastDeath;
function tick(now) {
  raf = 0;
  if (!visible || document.hidden) { lastT = 0; return; }
  const dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0;
  lastT = now;
  // Ambient drift eases out over 2 s once idle, and stays off in reduced motion.
  const awake = !reduced() && now - lastInput < SLEEP;
  pace = awake ? Math.min(1, pace + dt / 2) : Math.max(0, pace - dt / 2);
  const lively = busy();
  try {
    // The waves run on the sim clock, slowed by the pace.
    simT += dt * (lively ? 1 : pace);
    U.uTime.value = simT;
    if (lively || now - lastDraw >= 31) {
      stepEvents();
      draw();
      watch(now, lively);
      lastDraw = now;
    }
  } finally {
    if (visible && (lively || pace > 0)) raf = requestAnimationFrame(tick);
    else { lastT = 0; draw(); }
  }
}
function wake() {
  lastInput = performance.now();
  if (!raf && visible && !document.hidden) raf = requestAnimationFrame(tick);
}
/* Performance ladder: slow frames step quality down a rung, never back up. */
let watchFrom = 0, watchN = 0, watchSum = 0, prevDraw = 0;
function watch(now, lively) {
  const gap = now - prevDraw;
  prevDraw = now;
  if (gap > 200) { watchFrom = now; watchN = watchSum = 0; return; }
  if (!watchFrom) watchFrom = now;
  if (now - watchFrom < 4000) return;
  watchN++; watchSum += gap;
  if (watchN < 2 || now - watchFrom < 6000) return;
  if (watchSum / watchN > (lively ? 1000 / 38 : 1000 / 22) && rung < 3) { rung++; resize(); }
  watchFrom = now - 4000; watchN = watchSum = 0;
}
whenVisible(stage, vis => {
  visible = vis;
  if (!vis) { cancelAnimationFrame(raf); raf = 0; lastT = 0; return; }
  draw();
  wake();
});
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
onReducedChange(on => { starMat.uniforms.uSteady.value = on ? 1 : 0; wake(); });

/* Pointer: a drag looks around; a tap brings a meteor there. */
// A press turns into a drag after 8 px, or a hold after 260 ms.
let press = null;
const LOOK = { yaw: 0.6, pitch: 0.16 };
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  // Capture can fail for a pointer the browser no longer tracks.
  try { stage.setPointerCapture(e.pointerId); } catch {}
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, at: performance.now(), drag: false, yaw: look.yaw, pitch: look.pitch };
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  const dx = e.clientX - press.x, dy = e.clientY - press.y;
  if (!press.drag && Math.hypot(dx, dy) > 8) { press.drag = true; stage.classList.add('look'); }
  if (!press.drag) return;
  // The view follows the pointer, about one field of view per stage width.
  const k = THREE.MathUtils.degToRad(camera.fov) / size.h;
  look.yaw = clamp(press.yaw + dx * k, -LOOK.yaw, LOOK.yaw);
  look.pitch = clamp(press.pitch + dy * k, -LOOK.pitch * 0.5, LOOK.pitch);
  frame();
  wake();
});
const endPress = e => {
  if (!press || e.pointerId !== press.id) return;
  const tap = e.type === 'pointerup' && !press.drag;
  press = null;
  if (tap) {
    const r = stage.getBoundingClientRect();
    const ndc = new THREE.Vector3(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1, 0.5);
    onTap(ndc.unproject(camera).sub(camera.position).normalize());
  }
  stage.classList.remove('look');
  wake();
};
stage.addEventListener('pointerup', endPress);
stage.addEventListener('pointercancel', endPress);
stage.addEventListener('lostpointercapture', endPress);
// Space starts a shower.
stage.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  act.shower();
});

/* ---------- settings ---------- */
act.dusk = v => { setDusk(v); draw(); wake(); };
act.shower = () => shower();
act.letterbox = v => { letterbox = v; frame(); draw(); };
// A new cliff side waits until no event is in flight.
let cliffNext = null;
act.cliff = v => { cliffNext = v; if (!events.length) applyCliff(); };
function applyCliff() {
  cliffSide = cliffNext === 'right' ? -1 : 1;
  cliffNext = null;
  land.geometry.dispose();
  land.geometry = terrainGeometry();
  bakeHeight();
  setDusk(dusk);
  frame();
  draw();
}

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
// A ?dusk=<0..1> query sets the start, for stills.
const qDusk = new URLSearchParams(location.search).get('dusk');
cliffSide = ui.setting('cliff')?.value === 'right' ? -1 : 1;
letterbox = !!ui.setting('letterbox')?.value;
if (cliffSide < 0) { land.geometry.dispose(); land.geometry = terrainGeometry(); }
bakeHeight();
if (qDusk !== null) ui.slider.set(clamp(+qDusk));
setDusk(ui.slider.value ?? 0.3);
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  markReady();
  wake();
}, () => { canvas.classList.add('on'); markReady(); });
</script>
</body>
</html>
