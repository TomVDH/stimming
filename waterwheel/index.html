<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.12 0.012 45); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Water wheel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./shaders.js">
<link rel="modulepreload" href="./render.js">
<link rel="modulepreload" href="./sim.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm">
<style>
/* Water wheel: pour water; it runs down the flumes and turns three wheels. */
:root { --stage: oklch(0.12 0.012 45); }
.stage--waterwheel { background: var(--stage); cursor: crosshair; }
.stage--waterwheel canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--waterwheel canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--waterwheel canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Water wheel</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--waterwheel" id="stage" tabindex="0" role="application" aria-label="Three wooden water wheels in a cascade, fed by flumes. Hold on the stage to pour water from above; drag to move the stream. Hold Space to pour into the head flume.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Water wheel</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
