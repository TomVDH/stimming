<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<style>html { background: oklch(0.12 0.02 70); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tornado lab</title>
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
/* Tornado lab: one hero tornado up close, on a continuous F-scale slider. */
:root {
  --ink: oklch(0.94 0.01 80);
  --dim: oklch(0.7 0.02 80);
  --panel: oklch(0.14 0.015 70 / 0.82);
  --line: oklch(0.4 0.02 70 / 0.6);
  --accent: oklch(0.8 0.13 80);
}
* { box-sizing: border-box; }
body { margin: 0; background: oklch(0.12 0.02 70); color: var(--ink); font: 14px/1.3 Gabarito, system-ui, sans-serif; overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
.panel {
  position: fixed; left: 16px; bottom: 16px; width: min(340px, calc(100vw - 32px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; backdrop-filter: blur(6px);
}
.panel h1 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
.f { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.f output { font-size: 40px; font-weight: 800; line-height: 1; color: var(--accent); min-width: 3.2ch; font-variant-numeric: tabular-nums; }
.f span { color: var(--dim); }
.row { display: grid; grid-template-columns: 82px 1fr 44px; align-items: center; gap: 8px; margin: 4px 0; }
.row label { color: var(--dim); }
.row output { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input#f { height: 28px; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
button { font: inherit; color: var(--ink); background: oklch(0.22 0.02 70); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent); color: oklch(0.15 0.02 70); border-color: transparent; }
.fps { position: fixed; right: 16px; top: 12px; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.panel.min .knobs { display: none; }
.fail { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); }
.fail[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="One tornado up close over a wheat plain. The F-scale slider grows it from a thin rope to a wide wedge."></canvas>
<div class="panel" id="panel">
  <h1>Tornado lab</h1>
  <div class="f"><output id="fOut">F2.0</output><span id="fName">cone</span></div>
  <input id="f" type="range" min="0" max="5" step="0.01" value="2" aria-label="F-scale">
  <div class="btns">
    <button id="morph" aria-pressed="false">Morph</button>
    <button id="pause" aria-pressed="false">Pause</button>
    <button id="knobsBtn" aria-pressed="true">Knobs</button>
  </div>
  <div class="knobs">
    <div class="row"><label for="spin">Spin</label><input id="spin" type="range" min="0" max="3" step="0.01" value="1"><output></output></div>
    <div class="row"><label for="amp">Turbulence</label><input id="amp" type="range" min="0" max="1.5" step="0.01" value="0.7"><output></output></div>
    <div class="row"><label for="deb">Debris</label><input id="deb" type="range" min="0" max="2" step="0.01" value="1"><output></output></div>
    <div class="row"><label for="dist">Distance ×</label><input id="dist" type="range" min="0.4" max="2.5" step="0.01" value="1"><output></output></div>
    <div class="row"><label for="lens">Lens mm</label><input id="lens" type="range" min="24" max="85" step="1" value="50"><output></output></div>
    <div class="row"><label for="tod">Time</label><input id="tod" type="range" min="12" max="21" step="0.05" value="20"><output></output></div>
    <div class="row"><label for="az">Sun dir °</label><input id="az" type="range" min="-180" max="180" step="1" value="60"><output></output></div>
    <div class="row"><label for="steps">Steps</label><input id="steps" type="range" min="24" max="160" step="1" value="60"><output></output></div>
    <div class="row"><label for="res">Resolution</label><input id="res" type="range" min="0.3" max="1" step="0.05" value="0.5"><output></output></div>
  </div>
</div>
<div class="fps" id="fps"></div>
<p class="fail" hidden>The tornado lab needs WebGL 2.</p>
<script type="module" src="lab.js"></script>
</body>
</html>
