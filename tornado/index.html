<!doctype html>

<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.12 0.02 70); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tornado alley</title>
<script>
// Dev stays on for now: the page adds ?dev to its own address.
// Remove this script to hide the Dev panel again.
(() => {
  const q = new URLSearchParams(location.search);
  if (q.has('dev')) return;
  q.set('dev', '');
  history.replaceState(null, '', location.pathname + '?' + q.toString().replace('dev=', 'dev') + location.hash);
})();
</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">

}
</script>

<style>
/* Tornado alley: a wide, still shot of the plains under a supercell. */
:root { --stage: oklch(0.12 0.02 70); }
.stage--tornado canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--tornado canvas.on { opacity: 1; }
.stage--tornado { cursor: crosshair; }
@media (prefers-reduced-motion: reduce) { .stage--tornado canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Tornado alley</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--tornado" id="stage" tabindex="0" role="application" aria-label="A wide, still view of flat wheat fields under a huge storm cloud. A straight road runs to the horizon past telephone poles and a far farm. Click the plain to touch down a tornado. Keys 0 to 5 set its F-scale.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Tornado alley</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="main.js"></script>
</body>
