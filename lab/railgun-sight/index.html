<style>
  @font-face { font-family: "Iosevka Term Slab"; font-weight: 500; font-display: swap; src: url(../../shared/fonts/IosevkaTermSlab-Medium.woff2) format("woff2"); }
  @font-face { font-family: "Iosevka Term Slab"; font-weight: 700; font-display: swap; src: url(../../shared/fonts/IosevkaTermSlab-Bold.woff2) format("woff2"); }
  :root {
    --bg: oklch(0.16 0.012 275);
    --surface: oklch(0.195 0.014 275);
    --line: oklch(0.29 0.016 275);
    --fg: oklch(0.94 0.008 275);
    --muted: oklch(0.64 0.02 275);
    --focus: oklch(0.84 0.13 205);
    --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --slab: "Iosevka Term Slab", ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
  body { padding: 12px 16px 32px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; }
  h1 { margin: 0 8px 0 0; font-size: 15px; font-weight: 700; letter-spacing: 0.01em; }
  h1 span { color: var(--muted); font-weight: 500; }
  .group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .group + .group { padding-left: 10px; border-left: 1px solid var(--line); }
  button {
    font: inherit; font-size: 13px; color: var(--muted); background: transparent; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px 5px;
  }
  button:hover { color: var(--fg); border-color: var(--muted); }
  button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
  button:disabled { opacity: 0.35; pointer-events: none; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button kbd { font: 500 11px var(--slab); color: var(--muted); margin-right: 5px; }
  .wrap { position: relative; margin: 0 auto; }
  .frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #000; border-radius: 6px; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .frame svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .frame svg text { font-family: var(--sans); }
  .frame svg .slab { font-family: var(--slab); }
  .note { max-width: 860px; margin: 14px auto 0; color: var(--muted); }
  .note h2 { margin: 0 0 4px; color: var(--fg); font-size: 15px; font-weight: 700; }
  .note p { margin: 0 0 6px; }
  .note dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 8px 0 0; }
  .note dt { color: var(--fg); }
  .note dd { margin: 0; }
  .ref { display: grid; gap: 10px; }
  .ref figure { margin: 0; }
  .ref img { width: 100%; display: block; border-radius: 6px; }
  .ref figcaption { color: var(--muted); font-size: 12px; margin-top: 4px; }
  @media (max-width: 640px) { .group + .group { border-left: 0; padding-left: 0; } h1 { width: 100%; } }
</style>
</head>

const VIEW = { desk: { w: 1280, h: 800, fov: 22 }, phone: { w: 375, h: 812, fov: 35.2 } };
const STATES = ['tracking', 'charging', 'full', 'fired', 'hit'];
const LIGHTS = ['dusk', 'night'];
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f1 = v => v.toFixed(1);
const P = (x, y) => `${x.toFixed(1)},${y.toFixed(1)}`;
// Degrees and arcminutes, the instrument's own unit.
const dms = deg => { const d = Math.floor(deg), m = Math.round((deg - d) * 60); return m === 60 ? `${d + 1}°00′` : `${d}°${String(m).padStart(2, '0')}′`; };
const hn = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const vn = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hn(i), hn(i + 1), u) * 2 - 1; };

// The scene's numbers for one still.
function model(view, light, state, t) {
  const v = VIEW[view], m = META[`${view}-${light}-${state}`];
  const fpx = (v.h / 2) / Math.tan(v.fov * Math.PI / 360);
  const lvl = state === 'tracking' || state === 'hit' ? 0 : state === 'charging' ? m.charged : 1;
  const T = lerp(11.5, 8.5, state === 'charging' ? m.charged : 1) + 0.3;
  const age = m.shot ? m.shot.age : 0;
  const left = state === 'fired' ? Math.max(0, T - age - (t % 4)) : state === 'hit' ? 0 : T;
  return {
    W: v.w, H: v.h, phone: view === 'phone', state, light, t,
    rock: { x: m.rock.x, y: m.rock.y, r: Math.max(6, m.rock.R / m.rock.D * fpx) },
    bore: { x: m.bore.x, y: m.bore.y }, muzzle: m.muzzle,
    km: m.rock.D / 1000, vc: Math.max(0, m.closing),
    // At rest the gun is not laid; the error is the rock's offset from the bore.
    err: state === 'tracking' ? Math.atan(Math.hypot(m.rock.x - m.bore.x, m.rock.y - m.bore.y) / fpx) * 180 / Math.PI : m.aim.err * 180 / Math.PI,
    lvl, T, left, age,
    fired: state === 'fired', hit: state === 'hit', live: state !== 'hit',
  };
}

/* ---------- directions ---------- */
// Each direction draws an SVG string over the still.

// Cinema: the charge is the aspect ratio. The bars close to a slit.
function cinema(s) {
  const { W, H, phone, rock, bore } = s, k = phone ? 0.78 : 1;
  const ink = 'oklch(0.9 0.012 80)', dim = 'oklch(0.62 0.012 80)', bar = 'oklch(0.07 0.004 60)';
  const b0 = phone ? (H - W * 1.3) / 2 : (H - W / 2.39) / 2;
  const slit = Math.max(Math.abs(rock.y - H / 2), Math.abs(bore.y - H / 2)) + rock.r + 24 * k;
  let b = lerp(b0, H / 2 - slit, Math.pow(s.lvl, 1.4));
  if (s.fired) b = 0;
  const top = b, bot = H - b;
  let o = `<rect x="0" y="0" width="${W}" height="${top}" fill="${bar}"/><rect x="0" y="${bot}" width="${W}" height="${H - bot}" fill="${bar}"/>`;
  const fs = 15 * k, gap = 28 * k;
  // The bore: one hairline across the frame with a gap.
  if (!s.fired) {
    const a = s.lvl >= 1 ? 0.95 : 0.55;
    o += `<g stroke="${ink}" stroke-width="1" opacity="${a}"><line x1="0" y1="${bore.y}" x2="${bore.x - gap}" y2="${bore.y}"/><line x1="${bore.x + gap}" y1="${bore.y}" x2="${W}" y2="${bore.y}"/><line x1="${bore.x}" y1="${bore.y + 7 * k}" x2="${bore.x}" y2="${bore.y + 15 * k}"/></g>`;
  }
  // The rock: four brackets, or a cross where it was.
  if (s.live) {
    const r = rock.r + 9 * k, L = 9 * k;
    let br = '';
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      const x = rock.x + sx * r, y = rock.y + sy * r;
      br += `M${P(x, y - sy * L)}L${P(x, y)}L${P(x - sx * L, y)}`;
    }
    o += `<path d="${br}" fill="none" stroke="${ink}" stroke-width="1.2" opacity="0.9"/>`;
    if (!s.fired) o += `<line x1="${rock.x}" y1="${rock.y}" x2="${bore.x}" y2="${bore.y}" stroke="${ink}" stroke-width="1" stroke-dasharray="1 5" opacity="0.7"/>`;
  }
  // Captions sit in the bars, like subtitles.
  const cap = (y, txt, col = ink, size = fs, w = 500, ls = 0.04) => `<text x="${W / 2}" y="${y}" fill="${col}" font-size="${size}" font-weight="${w}" text-anchor="middle" letter-spacing="${ls}em">${txt}</text>`;
  const by = bot + Math.min(H - bot, 120 * k) / 2 + 5 * k;
  const ty = Math.max(top / 2 + 5 * k, 22 * k);
  const sep = '<tspan fill="' + dim + '">  ·  </tspan>';
  if (s.state === 'tracking') {
    o += cap(by - (phone ? 10 : 0), phone ? `${f1(s.km)} km${sep}${Math.round(s.vc)} m/s` : `${f1(s.km)} km${sep}closing ${Math.round(s.vc)} m/s${sep}off ${dms(s.err)}`);
    if (phone) o += cap(by + 14, `off ${dms(s.err)}`, dim, fs * 0.85);
    o += cap(ty, 'hold to charge', dim, fs * 0.8, 500, 0.14);
  } else if (s.state === 'charging' || s.state === 'full') {
    const full = s.state === 'full';
    o += cap(Math.min(by, H - 40 * k), `${f1(s.km)} km${sep}${Math.round(s.vc)} m/s${sep}off ${dms(s.err)}`);
    o += cap(Math.max(ty, 36 * k), full ? 'ready' : `${Math.round(s.lvl * 100)} %`, full ? 'oklch(0.95 0.03 85)' : dim, full ? fs * 1.05 : fs * 0.9, full ? 700 : 500, 0.3);
    if (!full) o += cap(Math.min(by, H - 40 * k) + 22 * k, `release to fire  ·  ${f1(s.T)} s to strike`, dim, fs * 0.8, 500, 0.08);
    else o += cap(Math.min(by, H - 40 * k) + 22 * k, `release  ·  ${f1(s.T)} s to strike`, dim, fs * 0.8, 500, 0.08);
  } else if (s.fired) {
    o += `<rect x="0" y="${H - 64 * k}" width="${W}" height="${64 * k}" fill="url(#cfade)"/>`;
    o += `<defs><linearGradient id="cfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bar}" stop-opacity="0"/><stop offset="1" stop-color="${bar}" stop-opacity="0.7"/></linearGradient></defs>`;
    o += cap(H - 22 * k, `fired  ·  ${f1(s.left)} s`, ink, fs * 1.05, 600, 0.12);
  } else {
    o += cap(by, `struck at ${f1(s.km)} km`, ink, fs * 1.1, 600, 0.08);
    o += cap(ty, `${f1(s.T)} s flight  ·  off ${dms(s.err)}`, dim, fs * 0.8, 500, 0.08);
  }
  return o;
}

// Astrolabe: brass engraving on glass. The limb is the charge, the alidade the aim.
function astrolabe(s) {
  const { W, H, phone, rock, bore, t } = s, k = phone ? 0.72 : 1;
  const brass = 'oklch(0.84 0.075 80)', lit = 'oklch(0.95 0.09 88)', faint = 'oklch(0.84 0.075 80 / 0.45)';
  const C = bore, R = phone ? W * 0.44 : H * 0.42;
  let o = `<defs><path id="ta" d="M${P(C.x - R - 22 * k, C.y)}A${R + 22 * k},${R + 22 * k} 0 0 1 ${P(C.x + R + 22 * k, C.y)}"/><path id="tb" d="M${P(C.x - R - 32 * k, C.y)}A${R + 32 * k},${R + 32 * k} 0 0 0 ${P(C.x + R + 32 * k, C.y)}"/></defs>`;
  // The limb: 120 ticks; lit ticks show the charge, or the time left after the shot.
  const frac = s.fired ? s.left / s.T : s.lvl;
  let dim = '', on = '';
  for (let i = 0; i < 120; i++) {
    const a = -Math.PI / 2 + i / 120 * Math.PI * 2, long = i % 10 === 0, len = (long ? 13 : i % 5 === 0 ? 8 : 5) * k;
    const c = Math.cos(a), sn = Math.sin(a), seg = `M${P(C.x + c * R, C.y + sn * R)}L${P(C.x + c * (R + len), C.y + sn * (R + len))}`;
    if (i / 120 < frac) on += seg; else dim += seg;
  }
  o += `<circle cx="${C.x}" cy="${C.y}" r="${R}" fill="none" stroke="${brass}" stroke-width="1" opacity="0.8"/>`;
  if (s.lvl >= 1 && !s.fired) o += `<circle cx="${C.x}" cy="${C.y}" r="${R + 17 * k}" fill="none" stroke="${lit}" stroke-width="1" opacity="${0.6 + 0.3 * Math.sin(t * 4)}"/>`;
  o += `<path d="${dim}" stroke="${faint}" stroke-width="1"/><path d="${on}" stroke="${lit}" stroke-width="1.6"/>`;
  // Engraved legends on the limb.
  const fs = 12 * k;
  const upper = s.hit ? `struck  ·  ${f1(s.km)} km  ·  ${f1(s.T)} s` : `range ${f1(s.km)} km  ·  closing ${Math.round(s.vc)} m/s`;
  const lower = s.fired ? `loosed  ·  ${f1(s.left)} s to strike` : s.hit ? `off ${dms(s.err)} at the shot` : s.lvl >= 1 ? 'full  ·  release' : s.lvl > 0 ? `charge ${Math.round(s.lvl * 100)}` : 'at rest';
  o += `<text class="slab" font-size="${fs}" fill="${brass}" letter-spacing="0.22em"><textPath href="#ta" startOffset="50%" text-anchor="middle">${upper.toUpperCase()}</textPath></text>`;
  if (!phone) o += `<text class="slab" font-size="${fs}" fill="${brass}" letter-spacing="0.22em" dy="${fs * 0.4}"><textPath href="#tb" startOffset="50%" text-anchor="middle">${lower.toUpperCase()}</textPath></text>`;
  else o += `<text class="slab" x="${W / 2}" y="${H - 96}" font-size="${fs}" fill="${brass}" text-anchor="middle" letter-spacing="0.22em">${lower.toUpperCase()}</text>`;
  // The pin at the centre: the bore.
  o += `<circle cx="${C.x}" cy="${C.y}" r="${4 * k}" fill="none" stroke="${brass}" stroke-width="1"/><circle cx="${C.x}" cy="${C.y}" r="1.2" fill="${brass}"/>`;
  const dx = rock.x - C.x, dy = rock.y - C.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  // The alidade: a rule across the limb, turned to the rock, with sight vanes.
  const a1 = { x: C.x - ux * R, y: C.y - uy * R }, a2 = { x: C.x + ux * R, y: C.y + uy * R };
  const vane = (p, s2) => `<rect x="${-3 * k}" y="${-7 * k}" width="${6 * k}" height="${14 * k}" fill="none" stroke="${s2}" stroke-width="1" transform="translate(${P(p.x, p.y)}) rotate(${Math.atan2(uy, ux) * 180 / Math.PI})"/>`;
  const alC = s.fired ? lit : brass;
  o += `<line x1="${a1.x}" y1="${a1.y}" x2="${a2.x}" y2="${a2.y}" stroke="${alC}" stroke-width="${s.fired ? 1.4 : 0.8}" opacity="${s.fired ? 1 : 0.55}"/>` + vane(a1, alC) + vane(a2, alC);
  if (s.live) {
    // The rete: the rock's circle about the pin.
    o += `<circle cx="${C.x}" cy="${C.y}" r="${d}" fill="none" stroke="${faint}" stroke-width="1" stroke-dasharray="2 6"/>`;
    // The star pointer: a flame from the limb to the rock.
    const tip = { x: rock.x - ux * (rock.r + 8 * k), y: rock.y - uy * (rock.r + 8 * k) };
    const inside = d < R;
    const base = inside ? { x: C.x + ux * Math.max(d + rock.r + 60 * k, R), y: C.y + uy * Math.max(d + rock.r + 60 * k, R) } : { x: C.x + ux * (R - 4), y: C.y + uy * (R - 4) };
    const tipIn = inside ? { x: rock.x + ux * (rock.r + 8 * k), y: rock.y + uy * (rock.r + 8 * k) } : tip;
    const nx = -uy * 4 * k, ny = ux * 4 * k;
    o += `<path d="M${P(base.x + nx, base.y + ny)}Q${P((base.x + tipIn.x) / 2 + nx * 2.2, (base.y + tipIn.y) / 2 + ny * 2.2)} ${P(tipIn.x, tipIn.y)}Q${P((base.x + tipIn.x) / 2 + nx * 0.4, (base.y + tipIn.y) / 2 + ny * 0.4)} ${P(base.x - nx, base.y - ny)}Z" fill="${brass}" opacity="0.85"/>`;
    o += `<circle cx="${rock.x}" cy="${rock.y}" r="${rock.r + 8 * k}" fill="none" stroke="${brass}" stroke-width="1"/>`;
    // Ephemeris: the rock's next places, dots toward the pin.
    for (let i = 1; i <= 5; i++) {
      const q = i / 6, x = lerp(rock.x, C.x, q), y = lerp(rock.y, C.y, q);
      if (Math.hypot(x - rock.x, y - rock.y) > rock.r + 14 * k) o += `<circle cx="${x}" cy="${y}" r="${1.6 - i * 0.15}" fill="${brass}" opacity="${0.9 - i * 0.12}"/>`;
    }
    // The aim error, engraved by the alidade's far vane.
    o += `<text class="slab" x="${a2.x + ux * 20 * k}" y="${a2.y + uy * 20 * k + 4}" font-size="${fs}" fill="${brass}" text-anchor="${ux > 0 ? 'start' : 'end'}" letter-spacing="0.12em">${dms(s.err)}</text>`;
  } else {
    // The struck star: eight points where the rock was.
    let st = '';
    for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, rr = (i % 2 ? 5 : i % 4 ? 12 : 22) * k; st += `${i ? 'L' : 'M'}${P(rock.x + Math.cos(a) * rr, rock.y + Math.sin(a) * rr)}`; }
    o += `<path d="${st}Z" fill="none" stroke="${lit}" stroke-width="1.2"/>`;
  }
  return `<g style="filter: drop-shadow(0 0 1.6px oklch(0.12 0.02 60 / 0.75))">${o}</g>`;
}

// Drum: a strip recorder. The pen writes the charge; the shot and the hit are spikes.
function drum(s) {
  const { W, H, phone, rock, bore, t } = s, k = phone ? 0.8 : 1;
  const pen = 'oklch(0.7 0.19 30)', ink = 'oklch(0.9 0.015 80)', dim = 'oklch(0.66 0.015 80)', grid = 'oklch(0.9 0.015 80 / 0.1)';
  const bh = phone ? 210 : 150, y0 = H - bh, x0 = 16, x1 = W - 16, px = phone ? W * 0.74 : W * 0.76;
  const pps = phone ? 7 : 14;
  let o = `<rect x="0" y="${y0}" width="${W}" height="${bh}" fill="oklch(0.09 0.008 60 / 0.78)"/>`;
  // The paper grid: rows fixed, columns moving with time.
  let g = '';
  for (let y = y0 + 12; y < H - 6; y += 12) g += `M${x0},${y}H${x1}`;
  const off = (t * pps) % 24;
  for (let x = px - off; x > x0; x -= 24) g += `M${P(x, y0 + 8)}V${H - 8}`;
  o += `<path d="${g}" stroke="${grid}" stroke-width="1"/>`;
  // Two channels: charge above, range below.
  const cTop = y0 + 22 * k, cBot = y0 + bh * 0.62, rY = y0 + bh * 0.8;
  const fireAgo = s.fired ? s.age : s.hit ? s.age : -1;
  const lvlAt = ago => {
    if (s.state === 'tracking' || ago < 0) return 0;
    if (s.state === 'charging') return ago < 9 ? s.lvl * Math.pow(1 - ago / 9, 0.8) : 0;
    const a = fireAgo > 0 ? ago - fireAgo : ago;
    if (fireAgo > 0 && ago < fireAgo) return 0;
    return a < 13 ? Math.min(1, (13 - a) / 10) : 0;
  };
  let tr = '', rg = '';
  for (let x = px; x >= x0 + 70 * k; x -= 2) {
    const ago = (px - x) / pps, l = lvlAt(ago), tt = t - ago;
    const jit = (vn(tt * 9) * 0.6 + vn(tt * 23 + 4) * 0.4) * (2 + 18 * l * l) * k;
    const y = clamp(lerp(cBot, cTop, l) + jit, y0 + 6, cBot + 10);
    tr += `${x === px ? 'M' : 'L'}${P(x, y)}`;
    rg += `${x === px ? 'M' : 'L'}${P(x, rY + vn(tt * 0.5) * 1.5)}`;
  }
  o += `<path d="${rg}" fill="none" stroke="${dim}" stroke-width="1"/>`;
  o += `<path d="${tr}" fill="none" stroke="${pen}" stroke-width="1.4" stroke-linejoin="round"/>`;
  const fs = 11 * k;
  // Spikes: the shot runs off the top; the hit kicks down.
  if (fireAgo > 0) {
    const fx = px - fireAgo * pps;
    if (fx > x0 + 70 * k) {
      o += `<path d="M${P(fx, cBot)}L${P(fx, y0 - 26 * k)}" stroke="${pen}" stroke-width="1.6"/><text class="slab" x="${fx + 5}" y="${y0 - 16 * k}" font-size="${fs}" fill="${pen}" letter-spacing="0.12em">FIRE</text>`;
      if (s.hit) {
        o += `<path d="M${P(px, cBot - 4)}L${P(px, H - 10)}" stroke="${pen}" stroke-width="1.6"/>`;
        o += `<path d="M${P(fx, y0 + bh * 0.7)}H${px}" stroke="${ink}" stroke-width="1" marker-start="url(#ar)"/><text class="slab" x="${(fx + px) / 2}" y="${y0 + bh * 0.7 - 5}" font-size="${fs}" fill="${ink}" text-anchor="middle" letter-spacing="0.1em">${f1(s.age)} S</text>`;
      }
    }
  }
  // Channel names, the time scale and the pen head.
  o += `<text class="slab" x="${x0 + 4}" y="${cTop + 4}" font-size="${fs}" fill="${dim}" letter-spacing="0.12em">CHARGE</text>`;
  o += `<text class="slab" x="${x0 + 4}" y="${rY + 4}" font-size="${fs}" fill="${dim}" letter-spacing="0.12em">RANGE</text>`;
  for (const sec of phone ? [10, 20, 30] : [10, 20, 30, 40, 50]) { const x = px - sec * pps; if (x > x0 + 120 * k) o += `<text class="slab" x="${x}" y="${H - 6}" font-size="${fs * 0.9}" fill="${dim}" text-anchor="middle">−${sec}s</text>`; }
  o += `<rect x="${px - 1}" y="${y0 + 4}" width="2" height="${bh - 8}" fill="${ink}" opacity="0.25"/>`;
  const lv = s.fired || s.hit ? 0 : s.lvl;
  o += `<circle cx="${px}" cy="${lerp(cBot, cTop, lv)}" r="3" fill="${pen}"/>`;
  // Readouts right of the pen.
  const rx = px + 16 * k;
  const head = s.hit ? 'STRUCK' : s.fired ? `${f1(s.left)} S` : s.lvl >= 1 ? 'FULL' : s.lvl > 0 ? `${Math.round(s.lvl * 100)} %` : 'REST';
  o += `<text class="slab" x="${rx}" y="${cTop + 10 * k}" font-size="${(phone ? 18 : 24)}" font-weight="700" fill="${s.lvl >= 1 || s.fired || s.hit ? pen : ink}">${head}</text>`;
  o += `<text class="slab" x="${rx}" y="${rY + 4}" font-size="${fs * 1.15}" fill="${ink}">${f1(s.km)} KM</text>`;
  o += `<text class="slab" x="${rx}" y="${rY + 20 * k}" font-size="${fs}" fill="${dim}">${s.hit ? 'STOPPED' : `−${Math.round(s.vc)} M/S`}</text>`;
  o += `<defs><marker id="ar" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M8,0L0,4L8,8" fill="none" stroke="${ink}"/></marker></defs>`;
  // On the view: a plumb line from the rock to the paper.
  if (s.live) {
    o += `<g style="filter: drop-shadow(0 0 1.4px oklch(0.1 0.01 60 / 0.8))">`;
    o += `<circle cx="${rock.x}" cy="${rock.y}" r="${rock.r + 7 * k}" fill="none" stroke="${pen}" stroke-width="1.3"/>`;
    o += `<path d="M${P(rock.x, rock.y + rock.r + 7 * k)}V${y0}" stroke="${pen}" stroke-width="1" stroke-dasharray="3 4"/>`;
    o += `<path d="M${P(bore.x - 10 * k, bore.y)}H${bore.x + 10 * k}M${P(bore.x, bore.y - 4 * k)}V${bore.y + 4 * k}" stroke="${ink}" stroke-width="1.2"/>`;
    o += `<path d="M${P(rock.x, rock.y)}L${P(bore.x, bore.y)}" stroke="${ink}" stroke-width="1" stroke-dasharray="1 4" opacity="0.8"/>`;
    const mx = (rock.x + bore.x) / 2, my = (rock.y + bore.y) / 2;
    o += `<text class="slab" x="${mx + 10 * k}" y="${my - 8 * k}" font-size="${fs * 1.05}" fill="${ink}" letter-spacing="0.08em">${dms(s.err)}</text>`;
    o += `</g>`;
  } else {
    o += `<g style="filter: drop-shadow(0 0 1.4px oklch(0.1 0.01 60 / 0.8))"><path d="M${P(rock.x - 9, rock.y - 9)}L${P(rock.x + 9, rock.y + 9)}M${P(rock.x + 9, rock.y - 9)}L${P(rock.x - 9, rock.y + 9)}" stroke="${pen}" stroke-width="1.6"/><path d="M${P(rock.x, rock.y + 12)}V${y0}" stroke="${pen}" stroke-width="1" stroke-dasharray="3 4"/></g>`;
  }
  return o;
}

// Pane: light thrown onto the cabin glass. A runway of rungs leads up the bore.
function pane(s) {
  const { W, H, phone, rock, bore, t } = s, k = phone ? 0.75 : 1;
  const lt = 'oklch(0.96 0.035 75)', warm = 'oklch(0.86 0.1 65)';
  const sx = bore.x, sy = H + 10, hw = (phone ? 110 : 150);
  let g = '', tx2 = '';
  // The runway: two rails that meet at the bore, beaded with light.
  // Beads light from the gun outward as the charge climbs.
  const n = 22, lit = s.fired ? n : Math.round(s.lvl * n);
  g += `<path d="M${P(sx - hw, sy)}L${P(bore.x, bore.y)}L${P(sx + hw, sy)}" fill="none" stroke="${lt}" stroke-width="1" opacity="0.45"/>`;
  for (let i = 0; i < n; i++) {
    let q = 1 - Math.pow(1 - i / n, 2.4);
    // After the shot the beads stream up the rails.
    if (s.fired) q = 1 - Math.pow(1 - ((i + t * 3) % n) / n, 2.4);
    const y = lerp(sy, bore.y, q), w = hw * (1 - q), on = i < lit, r = (on ? 3.2 : 1.8) * (1 - q * 0.7) * k + 0.6;
    for (const sd of [-1, 1]) g += `<circle cx="${sx + sd * w}" cy="${y}" r="${r}" fill="${on ? lt : warm}" opacity="${on ? 0.95 : 0.3}"/>`;
  }
  // The node at the bore: a ring that breathes at full.
  const nr = (s.lvl >= 1 && !s.fired ? 9 + 2 * Math.sin(t * 5) : 7) * k;
  g += `<circle cx="${bore.x}" cy="${bore.y}" r="${nr}" fill="none" stroke="${lt}" stroke-width="1.3"/>`;
  const fs = (phone ? 13 : 16);
  if (s.live) {
    // The rock: a soft ring and a slow arc.
    const rr = rock.r + 10 * k, a0 = t * 0.8;
    g += `<circle cx="${rock.x}" cy="${rock.y}" r="${rr}" fill="none" stroke="${lt}" stroke-width="1" opacity="0.6"/>`;
    g += `<path d="M${P(rock.x + Math.cos(a0) * (rr + 5), rock.y + Math.sin(a0) * (rr + 5))}A${rr + 5},${rr + 5} 0 0 1 ${P(rock.x + Math.cos(a0 + 1.6) * (rr + 5), rock.y + Math.sin(a0 + 1.6) * (rr + 5))}" fill="none" stroke="${lt}" stroke-width="2"/>`;
    // The aim error: a short arc from the rock's edge to the node.
    g += `<path d="M${P(rock.x, rock.y)}L${P(bore.x, bore.y)}" stroke="${warm}" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>`;
    // The tag floats beside the rock.
    const left = rock.x > W * 0.55, tx = rock.x + (left ? -1 : 1) * (rr + 22 * k), an = left ? 'end' : 'start';
    const ty = phone ? rock.y - rr - 64 : rock.y - 18;
    const tX = phone ? clamp(rock.x, 112, W - 112) : tx, tA = phone ? 'middle' : an;
    tx2 += `<text x="${tX}" y="${ty}" font-size="${fs * 2.6}" font-weight="300" fill="${lt}" text-anchor="${tA}" letter-spacing="-0.02em">${f1(s.km)}<tspan font-size="${fs}" font-weight="500" dx="4">km</tspan></text>`;
    tx2 += `<text x="${tX}" y="${ty + fs * 1.5}" font-size="${fs}" fill="${lt}" text-anchor="${tA}" opacity="0.85">closing ${Math.round(s.vc)} m/s  ·  off ${dms(s.err)}</text>`;
    const st = s.fired ? `${f1(s.left)} s to strike` : s.lvl >= 1 ? 'full  ·  let go' : s.lvl > 0 ? `charge ${Math.round(s.lvl * 100)} %` : `${f1(s.T)} s flight at full`;
    tx2 += `<text x="${tX}" y="${ty + fs * 2.9}" font-size="${fs}" font-weight="700" fill="${warm}" text-anchor="${tA}">${st}</text>`;
  } else {
    g += `<circle cx="${rock.x}" cy="${rock.y}" r="${(36 + 10 * Math.sin(t * 2)) * k}" fill="none" stroke="${lt}" stroke-width="1" opacity="0.5"/>`;
    tx2 += `<text x="${rock.x}" y="${rock.y - 56 * k}" font-size="${fs * 2.2}" font-weight="300" fill="${lt}" text-anchor="middle">struck</text>`;
    tx2 += `<text x="${rock.x}" y="${rock.y - 56 * k + fs * 1.5}" font-size="${fs}" fill="${lt}" text-anchor="middle" opacity="0.85">${f1(s.km)} km  ·  ${f1(s.T)} s</text>`;
  }
  // Light on glass: a bloom, a sharp pass, and a ghost from the pane's back face.
  const fog = s.fired ? `<radialGradient id="fog" cx="50%" cy="70%" r="60%"><stop offset="0" stop-color="oklch(0.95 0.02 80)" stop-opacity="0.16"/><stop offset="1" stop-color="oklch(0.95 0.02 80)" stop-opacity="0"/></radialGradient>` : '';
  return `<defs><filter id="bl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.2"/></filter><linearGradient id="glare" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="white" stop-opacity="0"/><stop offset="0.42" stop-color="white" stop-opacity="0.05"/><stop offset="0.5" stop-color="white" stop-opacity="0"/></linearGradient>${fog}</defs>`
    + `<rect width="${W}" height="${H}" fill="url(#glare)"/>` + (s.fired ? `<rect width="${W}" height="${H}" fill="url(#fog)"/>` : '')
    + `<g transform="translate(${5 * k},${7 * k})" opacity="0.12">${g}</g>`
    + `<g filter="url(#bl)" opacity="0.7">${g}</g>`
    + `<g style="filter: drop-shadow(0 0 1px oklch(0.15 0.03 60 / 0.6))">${g}</g>`
    + `<g style="filter: drop-shadow(0 0 1.5px oklch(0.12 0.03 60 / 0.85)) drop-shadow(0 0 7px oklch(0.12 0.03 60 / 0.45))">${tx2}</g>`;
}

// Numeral: the range in giant outline type. The charge fills the figure.
function numeral(s) {
  const { W, H, phone, rock, bore, t } = s, k = phone ? 0.8 : 1;
  const ink = 'oklch(0.95 0.02 80)', dim = 'oklch(0.86 0.02 80 / 0.75)', hot = 'oklch(0.86 0.13 60)';
  const fsz = phone ? 132 : 250, ax = phone ? W / 2 : W - 44, ay = phone ? 210 : H - 64, an = phone ? 'middle' : 'end';
  const big = s.fired ? f1(s.left) : s.hit ? '0.0' : f1(s.km);
  const fill = s.fired || s.hit ? 1 : s.lvl;
  const gh = fsz * 0.74, top = ay - gh;
  // The outline shows only above the fill; the font's inner contours stay hidden.
  const cut = fill > 0 ? ay - gh * fill : H;
  let o = `<defs><clipPath id="nf"><rect x="0" y="${cut - 2}" width="${W}" height="${H}"/></clipPath><clipPath id="nu"><rect x="0" y="0" width="${W}" height="${cut}"/></clipPath></defs>`;
  const txt = (extra) => `<text x="${ax}" y="${ay}" font-size="${fsz}" font-weight="800" text-anchor="${an}" letter-spacing="-0.035em" ${extra}>${big}</text>`;
  o += `<g clip-path="url(#nu)">${txt(`fill="none" stroke="${ink}" stroke-width="1.3" opacity="0.85"`)}</g>`;
  if (fill > 0) o += `<g clip-path="url(#nf)">${txt(`fill="${s.fired ? hot : ink}" opacity="${s.lvl >= 1 && !s.fired && !s.hit ? 0.72 + 0.12 * Math.sin(t * 4) : 0.8}"`)}</g>`;
  // The unit and the small lines sit on the figure's shoulder.
  const fs = 13 * k, lx = phone ? W / 2 : ax, la = an;
  const unit = s.fired ? 'seconds to strike' : s.hit ? `struck at ${f1(s.km)} km` : 'kilometres';
  o += `<text class="slab" x="${lx}" y="${top - 16 * k}" font-size="${fs}" fill="${ink}" text-anchor="${la}" letter-spacing="0.2em">${unit.toUpperCase()}</text>`;
  const sub = s.hit ? `${f1(s.T)} S FLIGHT  ·  OFF ${dms(s.err)}` : s.fired ? `FIRED AT ${f1(s.km)} KM` : `CLOSING ${Math.round(s.vc)} M/S  ·  OFF ${dms(s.err)}  ·  ${s.lvl >= 1 ? 'FULL' : s.lvl > 0 ? 'CHARGE ' + Math.round(s.lvl * 100) : 'REST'}`;
  o += `<text class="slab" x="${lx}" y="${ay + 26 * k}" font-size="${fs}" fill="${dim}" text-anchor="${la}" letter-spacing="0.14em">${sub}</text>`;
  // The rock: a thin ring and a leader to the figure.
  if (s.live) {
    const r = rock.r + 8 * k, ex = phone ? W / 2 : ax - fsz * 1.7, ey = phone ? ay + 40 * k : top - 34 * k;
    const ux = ex - rock.x, uy = ey - rock.y, d = Math.hypot(ux, uy) || 1;
    o += `<circle cx="${rock.x}" cy="${rock.y}" r="${r}" fill="none" stroke="${ink}" stroke-width="1.2"/>`;
    o += `<path d="M${P(rock.x + ux / d * r, rock.y + uy / d * r)}L${P(ex, ey)}" stroke="${ink}" stroke-width="1" opacity="0.6"/>`;
    o += `<path d="M${P(bore.x, bore.y - 6 * k)}L${P(bore.x + 6 * k, bore.y)}L${P(bore.x, bore.y + 6 * k)}L${P(bore.x - 6 * k, bore.y)}Z" fill="none" stroke="${ink}" stroke-width="1.2"/>`;
  } else {
    o += `<circle cx="${rock.x}" cy="${rock.y}" r="${(30 + 4 * Math.sin(t * 3)) * k}" fill="none" stroke="${ink}" stroke-width="1" stroke-dasharray="2 5"/>`;
  }
  return `<g style="filter: drop-shadow(0 0 2px oklch(0.12 0.02 60 / 0.6))">${o}</g>`;
}

const q = new URLSearchParams(location.search);
const st = {
  dir: DIRS.find(d => d.id === q.get('d')) ? q.get('d') : 'cinema',
  state: STATES.includes(q.get('s')) ? q.get('s') : 'full',
  light: LIGHTS.includes(q.get('l')) ? q.get('l') : 'dusk',
  view: q.get('v') === 'phone' ? 'phone' : 'desk',
  anim: !q.has('still') && !matchMedia('(prefers-reduced-motion: reduce)').matches,
};
const $ = id => document.getElementById(id);
const wrap = $('wrap'), frame = $('frame'), bg = $('bg'), ov = $('ov'), note = $('note');

function buttons(el, items, key, keys) {
  el.innerHTML = '';
  items.forEach((it, i) => {
    const b = document.createElement('button');
    b.innerHTML = (keys ? `<kbd>${keys[i]}</kbd>` : '') + it.name;
    b.onclick = () => { st[key] = it.id; sync(); };
    b.dataset.id = it.id;
    el.append(b);
  });
}
const cap = w => w[0].toUpperCase() + w.slice(1);
buttons($('dirs'), DIRS, 'dir', DIRS.map((d, i) => i + 1));
buttons($('states'), STATES.map(id => ({ id, name: cap(id) })), 'state');
buttons($('lights'), LIGHTS.map(id => ({ id, name: cap(id) })), 'light');
buttons($('views'), [{ id: 'desk', name: '1280 × 800' }, { id: 'phone', name: '375 × 812' }], 'view');
$('anim').onclick = () => { st.anim = !st.anim; sync(); };

const t0 = performance.now();
function draw() {
  const d = DIRS.find(x => x.id === st.dir);
  if (d.ref) return;
  const t = st.anim ? (performance.now() - t0) / 1000 : 1.3;
  const s = model(st.view, st.light, st.state, t);
  ov.setAttribute('viewBox', `0 0 ${s.W} ${s.H}`);
  ov.innerHTML = d.draw(s);
}

function fit() {
  const d = DIRS.find(x => x.id === st.dir);
  if (d.ref) { wrap.style.width = wrap.style.height = ''; return; }
  const v = VIEW[st.view];
  const avW = document.documentElement.clientWidth - 32, avH = Math.max(320, innerHeight - wrap.getBoundingClientRect().top - 16);
  const k = Math.min(1, avW / v.w, st.view === 'phone' ? Math.max(avH / v.h, 0.6) : avH / v.h);
  frame.style.width = v.w + 'px'; frame.style.height = v.h + 'px';
  frame.style.transform = `scale(${k})`;
  wrap.style.width = v.w * k + 'px'; wrap.style.height = v.h * k + 'px';
}

function sync() {
  const d = DIRS.find(x => x.id === st.dir);
  for (const [el, key] of [[$('dirs'), 'dir'], [$('states'), 'state'], [$('lights'), 'light'], [$('views'), 'view']]) {
    for (const b of el.children) { b.setAttribute('aria-pressed', String(b.dataset.id === st[key])); b.disabled = !!d.ref && key !== 'dir' && key !== 'view'; }
  }
  $('anim').setAttribute('aria-pressed', String(st.anim));
  const u = new URLSearchParams({ d: st.dir, s: st.state, l: st.light, v: st.view });
  history.replaceState(null, '', '?' + u);
  if (d.ref) {
    wrap.hidden = true;
    const v = st.view;
    note.innerHTML = `<h2>${d.title}</h2><p>${d.idea}</p><div class="ref"><figure><img src="stills/ref-${v}-sight.jpg" alt="The shipped Sight at dusk, charging" style="max-width:${v === 'phone' ? 375 : 1280}px"><figcaption>Shipped Sight, dusk, charging</figcaption></figure><figure><img src="stills/ref-${v}-wide.jpg" alt="The wide shot at dusk, charging" style="max-width:${v === 'phone' ? 375 : 1280}px"><figcaption>The wide shot, same moment</figcaption></figure></div>`;
    return;
  }
  wrap.hidden = false;
  bg.src = `stills/${st.view}-${st.light}-${st.state}.jpg`;
  note.innerHTML = `<h2>${d.title}</h2><p>${d.idea}</p><dl>${d.reads.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>`;
  fit();
  draw();
}

// Keys: 1 to 6 pick a direction; arrows step the state; L light; P screen.
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = +e.key;
  if (n >= 1 && n <= DIRS.length) st.dir = DIRS[n - 1].id;
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') st.state = STATES[(STATES.indexOf(st.state) + (e.key === 'ArrowRight' ? 1 : STATES.length - 1)) % STATES.length];
  else if (e.key === 'l' || e.key === 'L') st.light = st.light === 'dusk' ? 'night' : 'dusk';
  else if (e.key === 'p' || e.key === 'P') st.view = st.view === 'desk' ? 'phone' : 'desk';
  else return;
  e.preventDefault();
  sync();
});
addEventListener('resize', fit);

// Motion runs at 30 fps while shown; a hidden tab or Still mode draws nothing.
let last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (!st.anim || document.hidden || now - last < 33) return;
  last = now;
  draw();
}
requestAnimationFrame(loop);

// Warm the cache: every still for this screen.
for (const l of LIGHTS) for (const s of STATES) { const i = new Image(); i.src = `stills/${st.view}-${l}-${s}.jpg`; }
sync();
</script>
