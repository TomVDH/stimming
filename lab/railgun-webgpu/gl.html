<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Motes · WebGL2</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080c; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .meter { position: fixed; left: 10px; bottom: 8px; font: 12px/1.3 ui-monospace, monospace; color: #c8d0e0; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js"
  }
}
</script>
</head>
<body>
<script type="module">
// Variant A: Railgun as it ships.
// three.js 0.170 on WebGL2; the CPU steps every mote; Points draw them.
import * as THREE from 'three';
import { N, A0, AX, UP, SIDE, L, G, PULL, DRAG, SOFT2, CAM, DUST, ICE, substeps, run } from './motes.js';

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
// An opaque clear: the motes add colour and leave alpha alone.
scene.background = new THREE.Color(0x07080c);
const camera = new THREE.PerspectiveCamera(CAM.fov, 1, 10, 20000);
camera.position.set(...CAM.pos);
camera.lookAt(...CAM.at);

// The barrel: a plain cylinder for reference.
const ax = new THREE.Vector3(...AX), a0 = new THREE.Vector3(...A0);
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(9, 12, L, 24), new THREE.MeshBasicMaterial({ color: 0x1c1f28 }));
barrel.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), ax);
barrel.position.copy(a0).addScaledVector(ax, L / 2);
scene.add(barrel);

const pos = new Float32Array(N * 3), vel = new Float32Array(N * 3), meta = new Float32Array(N * 4);
const geo = new THREE.BufferGeometry();
const aPos = new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage);
const aT = new THREE.BufferAttribute(meta, 4).setUsage(THREE.DynamicDrawUsage);
geo.setAttribute('position', aPos);
geo.setAttribute('aT', aT);

// The same shader Railgun uses for its motes.
const mat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uDpr: { value: 1 }, uAx0: { value: a0 }, uAxD: { value: ax }, uDust: { value: new THREE.Vector3(...DUST) }, uIce: { value: new THREE.Vector3(...ICE) } },
  transparent: true, depthWrite: false,
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
  blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
  vertexShader: /* glsl */`
  attribute vec4 aT;
  uniform float uTime, uDpr;
  uniform vec3 uAx0, uAxD, uDust, uIce;
  varying vec3 vCol;
  float h1(float x) { return fract(sin(x * 12.9898) * 43758.5453); }
  void main() {
    float t = uTime - aT.x, life = aT.y;
    if (t < 0.0 || t > life) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; vCol = vec3(0.0); return; }
    gl_Position = projectionMatrix * viewMatrix * vec4(position, 1.0);
    float seed = aT.z, lum = h1(seed + 7.0);
    float pop = step(0.875, h1(seed + 31.0)) * exp(-t * 5.0);
    float vis = smoothstep(0.0, 0.3, t) * (1.0 - smoothstep(life - 1.2, life, t));
    gl_PointSize = uDpr * (2.2 + 2.0 * pow(lum, 6.0)) * (1.0 + 2.0 * pop);
    vec3 d = position - uAx0;
    float r = length(d - uAxD * dot(d, uAxD));
    vCol = mix(uDust * 0.7, uIce * 2.6, 1.0 - smoothstep(40.0, 220.0, r)) * (0.5 + 2.8 * pow(lum, 5.0)) * (1.0 + 6.0 * pop) * vis;
  }`,
  fragmentShader: /* glsl */`
  varying vec3 vCol;
  void main() {
    float d = length(gl_PointCoord - 0.5) * 2.0, a = max(1.0 - d, 0.0);
    gl_FragColor = vec4(vCol * a * a, 0.0);
  }`,
});
const motes = new THREE.Points(geo, mat);
motes.frustumCulled = false;
scene.add(motes);

// Spawn rule from Railgun's spawnMote at full charge.
function spawn(i, t) {
  const a = 180 + Math.random() * (L - 220), th = Math.random() * Math.PI * 2, r0 = 120 + 280 * Math.random();
  const c = Math.cos(th), s = Math.sin(th);
  const ex = SIDE[0] * c + UP[0] * s, ey = SIDE[1] * c + UP[1] * s, ez = SIDE[2] * c + UP[2] * s;
  const j = i * 3;
  pos[j] = A0[0] + AX[0] * a + ex * r0; pos[j + 1] = A0[1] + AX[1] * a + ey * r0; pos[j + 2] = A0[2] + AX[2] * a + ez * r0;
  // Tangent: AX cross e, times a random sign and the orbit speed.
  const k = (Math.random() < 0.5 ? -1 : 1) * Math.sqrt(G) * (0.5 + 0.5 * Math.random()), out = -20 * Math.random();
  vel[j] = (AX[1] * ez - AX[2] * ey) * k + ex * out;
  vel[j + 1] = (AX[2] * ex - AX[0] * ez) * k + ey * out;
  vel[j + 2] = (AX[0] * ey - AX[1] * ex) * k + ez * out;
  meta.set([t, 4 + 4 * Math.random(), Math.random() * 100, 0], i * 4);
}
// Stagger first births so deaths spread out.
for (let i = 0; i < N; i++) spawn(i, -Math.random() * 6);

// Railgun's stepMotes, plus a respawn for the dead.
function step(t, dt) {
  const { n, h } = substeps(dt), drag = Math.exp(-DRAG * h);
  const ox = A0[0], oy = A0[1], oz = A0[2], ax0 = AX[0], ay = AX[1], az = AX[2];
  let born = false;
  for (let i = 0; i < N; i++) {
    if (t - meta[i * 4] > meta[i * 4 + 1]) { spawn(i, t); born = true; }
  }
  for (let k = 0; k < n; k++) {
    for (let i = 0; i < N; i++) {
      const j = i * 3;
      let dx = pos[j] - ox, dy = pos[j + 1] - oy, dz = pos[j + 2] - oz;
      const s = dx * ax0 + dy * ay + dz * az, sc = Math.min(Math.max(s, 150), L + 60);
      dx -= ax0 * sc; dy -= ay * sc; dz -= az * sc;
      const f = -G / (dx * dx + dy * dy + dz * dz + SOFT2);
      let vx = vel[j] + (dx * f + ax0 * PULL) * h, vy = vel[j + 1] + (dy * f + ay * PULL) * h, vz = vel[j + 2] + (dz * f + az * PULL) * h;
      vx *= drag; vy *= drag; vz *= drag;
      vel[j] = vx; vel[j + 1] = vy; vel[j + 2] = vz;
      pos[j] += vx * h; pos[j + 1] += vy * h; pos[j + 2] += vz * h;
    }
  }
  aPos.needsUpdate = true;
  if (born) aT.needsUpdate = true;
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const gl = renderer.getContext(), px = new Uint8Array(4);
let t = 0;
function work(dt) {
  t += dt;
  step(t, dt);
  mat.uniforms.uTime.value = t;
  renderer.render(scene, camera);
}
// A one-pixel read waits for the GPU to finish.
const idle = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
run('WebGL2 · CPU step', work, idle);
</script>
</body>
</html>
