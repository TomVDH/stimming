<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Series brand lab</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=Gabarito:wght@400..900&display=swap">
<style>
/* The menu tokens and type, copied from the root index. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --focus: oklch(0.84 0.13 205);
  --shadow: oklch(0.07 0.01 260);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "Iosevka Term Slab Nerd Font", "Iosevka Term Slab", ui-monospace, monospace;
  color-scheme: dark;
}
@font-face { font-family: "Iosevka Term Slab Nerd Font"; font-weight: 400; font-display: swap; src: local("IosevkaTermSlabNerdFont-Regular"), url(../shared/fonts/IosevkaTermSlab-Regular.woff2) format("woff2"); }
@font-face { font-family: "Iosevka Term Slab Nerd Font"; font-weight: 500; font-display: swap; src: local("IosevkaTermSlabNerdFont-Medium"), url(../shared/fonts/IosevkaTermSlab-Medium.woff2) format("woff2"); }
@font-face { font-family: "Iosevka Term Slab Nerd Font"; font-weight: 700; font-display: swap; src: local("IosevkaTermSlabNerdFont-Bold"), url(../shared/fonts/IosevkaTermSlab-Bold.woff2) format("woff2"); }
@font-face { font-family: "Iosevka Term Slab Nerd Font"; font-weight: 800; font-display: swap; src: local("IosevkaTermSlabNerdFont-ExtraBold"), url(../shared/fonts/IosevkaTermSlab-ExtraBold.woff2) format("woff2"); }
@font-face { font-family: "Iosevka Term Slab"; font-weight: 500; font-display: swap; src: url(../shared/fonts/IosevkaTermSlab-Medium.woff2) format("woff2"); }
* { box-sizing: border-box; }
.defs { position: absolute; width: 0; height: 0; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 500 16px/1.3 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: clip; padding: 0 16px; }

/* The lab switch: one row for the label, one for the iconlet. */
.pick { position: sticky; top: 0; z-index: 20; display: grid; gap: 8px; justify-items: center; padding: 12px 0; margin: 0 -16px; background: color-mix(in oklch, var(--bg) 90%, transparent); backdrop-filter: blur(10px); }
.pick div { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.pick button { font: 500 13px/1 var(--mono); color: var(--muted); background: none; border: 1px solid oklch(0.32 0.02 275); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.pick button[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
.pick button:focus-visible, a.toy:focus-visible, .idx button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

/* The menu head: wordmark and tagline, as the menu draws them. */
.top { display: grid; justify-items: center; padding: clamp(32px, 6vw, 72px) 0 clamp(28px, 5vw, 48px); }
.title { margin: 0; display: flex; align-items: baseline; gap: 0.01em; font: 400 clamp(48px, 9vw, 104px)/1 "B612", var(--sans); letter-spacing: -0.02em; user-select: none; }
.title .l { display: inline-block; color: var(--fg); font-weight: var(--w); }
.tagline {
  margin: 10px 0 0; max-width: 46ch; text-align: center; text-wrap: balance;
  font: 500 clamp(14px, 1.6vw, 18px)/1.45 var(--mono); color: var(--muted);
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* A tile, as the menu draws it. */
.shelf { position: relative; display: flex; flex-wrap: wrap; gap: clamp(16px, 2.6vw, 28px) clamp(12px, 2.4vw, 28px); max-width: calc(5 * 150px + 4 * 28px); margin: 0 auto 120px; padding: 0; list-style: none; }
.shelf > li { width: clamp(96px, 26vw, 150px); transition: opacity 0.35s, filter 0.35s; }
.toy { display: grid; justify-items: center; gap: 10px; color: inherit; text-decoration: none; text-align: center; }
.obj { position: relative; width: 100%; aspect-ratio: 1; display: grid; place-items: center; isolation: isolate; }
.obj svg.art { width: 70%; height: 70%; overflow: visible; }
.name { font: 500 13px/1.2 "Iosevka Term Slab", ui-monospace, monospace; letter-spacing: 0.06em; text-transform: uppercase; }
.name .beta, .name .alpha { margin-left: 0.5em; color: var(--muted); }
.name i { font-style: normal; opacity: 0.4; }
@media (max-width: 560px) { .name { font-size: 12px; } }

/* The iconlet: a small brut block pinned to the tile. */
.obj .ic { position: absolute; top: 1%; right: 3%; width: 23%; rotate: 6deg; transition: rotate 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), scale 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); }
a.toy:hover .ic, .shelf.lit li.on .ic { rotate: -6deg; scale: 1.15; }

/* Constellation, as on the menu. */
.shelf.lit > li:not(.on):not(.web) { opacity: 0.26; filter: saturate(0.3); }
.shelf > li[data-series] .obj::before {
  content: ""; position: absolute; z-index: -1; inset: 4%; border-radius: 50%; opacity: 0; transition: opacity 0.35s;
  background: radial-gradient(closest-side, color-mix(in oklch, var(--series) 42%, transparent), transparent);
}
.shelf.lit > li.on .obj::before { opacity: 1; }
.shelf > li.web { position: absolute; inset: 0; width: auto; pointer-events: none; z-index: 3; }
.web svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.web path { fill: none; stroke: var(--series); stroke-width: 1.2; opacity: 0.75; filter: drop-shadow(0 0 4px var(--series)); }
.web circle { fill: var(--series); }
.web .tag { position: absolute; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
.shelf.lit .web .tag { opacity: 1; }

/* ---------- F. Wordmark: the series name, set like the title. ---------- */
[data-d="f"] .tag { translate: -50% -100%; display: flex; align-items: flex-end; gap: 10px; white-space: nowrap; }
[data-d="f"] .tag .wm { display: flex; align-items: baseline; font: 400 34px/0.9 "B612", var(--sans); letter-spacing: -0.02em; }
[data-d="f"] .tag .wm span { display: inline-block; color: var(--c); transition: color 0.9s ease; }
[data-d="f"] .tag .wm span.set { color: var(--fg); }
[data-d="f"] .tag .ct { font: 500 13px/1 var(--mono); color: var(--muted); padding-bottom: 3px; }
[data-d="f"] .tag svg { width: 30px; height: 30px; }

/* ---------- G. Sheen: lowercase slab with the tagline's colour sweep. ---------- */
[data-d="g"] .tag { translate: -50% -100%; display: grid; justify-items: center; gap: 2px; white-space: nowrap; padding-bottom: 4px; }
[data-d="g"] .tag .en {
  font: 700 22px/1 var(--mono); letter-spacing: 0.01em; color: transparent; -webkit-background-clip: text; background-clip: text;
  background-image: linear-gradient(100deg, var(--fg) 30%, var(--series) 42%, var(--c2) 50%, var(--series) 58%, var(--fg) 70%);
  background-size: 320% 100%; background-position: 100% 0; animation: sheen 1.6s ease-out forwards;
}
[data-d="g"] .tag .nl { font: 400 14px/1.2 var(--mono); color: var(--muted); }
[data-d="g"] .tag .nl b { font-weight: 500; color: color-mix(in oklch, var(--series) 70%, var(--fg)); }
@keyframes sheen { to { background-position: 0% 0; } }

/* ---------- H. Terminal: a path prompt in the slab, a cursor that blinks. ---------- */
[data-d="h"] .tag {
  translate: -50% -100%; white-space: nowrap; display: flex; align-items: center; gap: 0.6ch; padding: 8px 12px 8px 10px;
  font: 500 15px/1 var(--mono); background: oklch(0.12 0.012 275); box-shadow: inset 0 0 0 1px oklch(0.3 0.02 275), 4px 4px 0 var(--shadow);
}
[data-d="h"] .tag svg { width: 18px; height: 18px; }
[data-d="h"] .tag .p { color: var(--muted); }
[data-d="h"] .tag .k { color: var(--series); font-weight: 700; }
[data-d="h"] .tag .n { color: var(--fg); }
[data-d="h"] .tag .cur { width: 0.62em; height: 1.05em; background: var(--series); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- I. Brut chip: an angled block with a hard shadow, like the icons. ---------- */
[data-d="i"] .tag { translate: -50% -100%; filter: drop-shadow(5px 5px 0 var(--shadow)); }
[data-d="i"] .tag .chip {
  display: flex; align-items: center; gap: 8px; white-space: nowrap; padding: 9px 20px 9px 12px;
  clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  background: var(--series); color: oklch(0.16 0.03 275); font: 800 14px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
}
[data-d="i"] .tag .chip svg { width: 22px; height: 22px; filter: drop-shadow(0 0 0 transparent); }
[data-d="i"] .tag .chip em { font-style: normal; font-weight: 500; opacity: 0.6; letter-spacing: 0.02em; }

/* ---------- J. Index: a row of series under the tagline; tiles and chips light each other. ---------- */
.idx { display: none; justify-content: center; gap: clamp(10px, 3vw, 26px); flex-wrap: wrap; margin: 0 auto 44px; }
[data-d="j"] .idx { display: flex; }
.idx button {
  display: flex; align-items: center; gap: 10px; padding: 6px 4px; background: none; border: 0; cursor: pointer;
  font: 500 15px/1 var(--mono); color: var(--muted); transition: color 0.3s;
}
.idx button svg { width: 26px; height: 26px; transition: rotate 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), scale 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); }
.idx button sup { font-size: 11px; color: oklch(0.45 0.02 275); }
.idx button .u { background: linear-gradient(var(--series), var(--series)) 0 100% / 0 2px no-repeat; padding-bottom: 4px; transition: background-size 0.35s ease; }
.idx button.on { color: var(--fg); }
.idx button.on svg { rotate: -8deg; scale: 1.18; }
.idx button.on .u { background-size: 100% 2px; }
[data-d="j"] .tag { display: none; }

/* ---------- Iconlet sheet. ---------- */
.sheet { display: none; max-width: 980px; margin: 0 auto 120px; gap: 40px; }
[data-d="icons"] .sheet { display: grid; }
[data-d="icons"] .shelf, [data-d="icons"] .idx { display: none; }
.sheet h2 { margin: 0 0 14px; font: 700 18px/1 var(--mono); }
.sheet .set { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
.sheet figure { margin: 0; display: grid; justify-items: center; gap: 12px; padding: 18px 8px 14px; border-radius: 10px; background: oklch(0.19 0.012 275); }
.sheet figure .big { width: 72px; height: 72px; }
.sheet figure .row { display: flex; align-items: center; gap: 12px; }
.sheet figure .row svg:nth-child(1) { width: 32px; height: 32px; }
.sheet figure .row svg:nth-child(2) { width: 20px; height: 20px; }
.sheet figcaption { font: 500 13px/1.2 var(--mono); color: var(--muted); text-align: center; }
.sheet figcaption b { display: block; color: var(--fg); font-weight: 700; margin-bottom: 2px; }
@media (max-width: 640px) { .sheet .set { grid-template-columns: repeat(2, 1fr); } }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* Still mode skips every transition, so a capture shows the end state. */
.still *, .still *::before { transition: none !important; animation-duration: 0s !important; animation-delay: 0s !important; }
</style>
<body>
<nav class="pick" aria-label="Lab">
  <div id="dirs">
    <button data-d="f">F Wordmark</button>
    <button data-d="g">G Sheen</button>
    <button data-d="h">H Terminal</button>
    <button data-d="i">I Brut chip</button>
    <button data-d="j">J Index</button>
    <button data-d="icons">Iconlets</button>
  </div>
  <div id="sets">
    <button data-i="1">1</button><button data-i="2">2</button><button data-i="3">3</button><button data-i="4">4</button><button data-i="5">5</button>
  </div>
</nav>
<div id="v">
  <header class="top"></header>
  <div class="idx" aria-label="Series"></div>
  <ul class="shelf" aria-label="Lab"></ul>
  <section class="sheet"></section>
</div>
<script type="module">
// The lab borrows the menu head and the Lab shelf, then tries series treatments on them.
const html = await fetch('../index.html').then(r => r.text());
const doc = new DOMParser().parseFromString(html, 'text/html');
const [toys, series] = await Promise.all(['../toys.json', '../series.json'].map(u => fetch(u).then(r => r.json())));
const NS = 'http://www.w3.org/2000/svg';
const defs = doc.querySelector('svg.defs');
if (defs) document.body.prepend(document.importNode(defs, true));

// Second light per series, for sheens and wordmark flashes.
const C2 = { science: 'oklch(0.86 0.15 88)', belgian: 'oklch(0.6 0.21 28)' };
const SH = 'oklch(0.07 0.01 260)';

// Iconlets: each has a silhouette for the hard shadow, then its coloured parts.
const hex = (cx, cy, r, rot = -Math.PI / 2) => Array.from({ length: 6 }, (_, k) => {
  const a = rot + k * Math.PI / 3;
  return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`;
}).join(' ');
const P = (pts, fill) => `<polygon points="${pts}" fill="${fill}"/>`;
const D = (d, fill) => `<path d="${d}" fill="${fill}"/>`;
const TAILS = 'M11 20L7 32L11 30L13 33L16 22Z M23 20L27 32L23 30L21 33L18 22Z';
const ICONS = {
  science: {
    1: { name: 'Flask', sil: D('M12 3H21V11L29 30H4L12 11Z', SH), parts:
      D('M12 3H21V11L29 30H4L12 11Z', 'oklch(0.32 0.05 255)') + D('M8.2 20H24.8L29 30H4Z', 'oklch(0.66 0.19 255)') +
      D('M11 3H22V6H11Z', 'oklch(0.88 0.04 255)') + D('M15 14h3v3h-3z M18.5 9h2v2h-2z M13 23h3v3h-3z', 'oklch(0.9 0.13 88)') },
    2: { name: 'Rosette', sil: D(TAILS, SH) + P(hex(17, 13, 11), SH), parts:
      D(TAILS, 'oklch(0.5 0.19 262)') + P(hex(17, 13, 11), 'oklch(0.84 0.15 88)') + P(hex(17, 13, 7), 'oklch(0.62 0.2 262)') + P(hex(17, 13, 2.6), 'oklch(0.9 0.1 88)') },
    3: { name: 'Spark', sil: D('M4 4H29V29H4Z', SH), parts:
      D('M4 4H29V29H4Z', 'oklch(0.24 0.07 265)') + D('M19.5 6L10 18.5H16.2L13 28L24 14H17.6Z', 'oklch(0.93 0.09 215)') + D('M4 4H29V6H4Z', 'oklch(0.62 0.2 262)') },
    4: { name: 'Beaker', sil: D('M6 10H27V30H6Z M12 3h4v4h-4z M18 1h3v3h-3z', SH), parts:
      D('M6 10H27V30H6Z', 'oklch(0.3 0.04 255)') + D('M6 18H27V30H6Z', 'oklch(0.72 0.16 200)') + D('M4 10H29V13H4Z', 'oklch(0.88 0.04 255)') +
      D('M12 3h4v4h-4z M18 1h3v3h-3z M11 21h3v3h-3z M19 24h3v3h-3z', 'oklch(0.9 0.1 200)') },
    5: { name: 'Prize star', sil: D(TAILS, SH) + P('17,1 29,13 17,25 5,13', SH) + D('M8.5 4.5H25.5V21.5H8.5Z', SH), parts:
      D(TAILS, 'oklch(0.5 0.19 262)') + D('M8.5 4.5H25.5V21.5H8.5Z', 'oklch(0.62 0.2 262)') + P('17,1 29,13 17,25 5,13', 'oklch(0.7 0.18 262)') + D('M13 9H21V17H13Z', 'oklch(0.86 0.15 88)') },
  },
  belgian: {
    1: { name: 'Tricolour', sil: D('M8 5H31L27 28H4Z', SH), parts:
      D('M8 5H15.7L11.7 28H4Z', 'oklch(0.22 0.01 260)') + D('M15.7 5H23.3L19.3 28H11.7Z', 'oklch(0.88 0.17 95)') + D('M23.3 5H31L27 28H19.3Z', 'oklch(0.58 0.21 28)') },
    2: { name: 'Hex bands', sil: P(hex(17, 16, 13), SH), parts:
      P('5.7,9.5 13.2,5.2 13.2,26.8 5.7,22.5', 'oklch(0.22 0.01 260)') + P('13.2,5.2 17,3 20.8,5.2 20.8,26.8 17,29 13.2,26.8', 'oklch(0.88 0.17 95)') + P('20.8,5.2 28.3,9.5 28.3,22.5 20.8,26.8', 'oklch(0.58 0.21 28)') },
    3: { name: 'Stepped gable', sil: P('4,31 30,31 30,21 27,21 27,16 24,16 24,11 21,11 21,4 13,4 13,11 10,11 10,16 7,16 7,21 4,21', SH), parts:
      P('4,31 30,31 30,21 27,21 27,16 24,16 24,11 21,11 21,4 13,4 13,11 10,11 10,16 7,16 7,21 4,21', 'oklch(0.5 0.13 32)') +
      D('M15 13h4v6h-4z', 'oklch(0.88 0.16 88)') + D('M15 24h4v7h-4z', 'oklch(0.26 0.04 30)') + D('M13 4h8v2h-8z', 'oklch(0.66 0.12 40)') },
    4: { name: 'Frietzak', sil: D('M6 12H28L19.5 33H14.5Z M8 5h3v8H8z M12 2h3v11h-3z M16 3h3v10h-3z M20 1h3v12h-3z M24 5h3v8h-3z', SH), parts:
      D('M8 5h3v8H8z M12 2h3v11h-3z M16 3h3v10h-3z M20 1h3v12h-3z M24 5h3v8h-3z', 'oklch(0.86 0.15 88)') +
      D('M6 12H28L19.5 33H14.5Z', 'oklch(0.95 0.015 90)') + D('M7.6 16H26.4L25.2 19H8.8Z', 'oklch(0.58 0.21 28)') + D('M10 11h6v3h-6z', 'oklch(0.97 0.03 95)') },
    5: { name: 'Steps', sil: D('M3 21H12V14H21V7H31V31H3Z', SH), parts:
      D('M3 21H12V31H3Z', 'oklch(0.24 0.01 260)') + D('M12 14H21V31H12Z', 'oklch(0.88 0.17 95)') + D('M21 7H31V31H21Z', 'oklch(0.58 0.21 28)') + D('M3 21H31V22H3Z', 'oklch(1 0 0 / 0.08)') },
  },
};
const iconlet = (key, n, cls = '') => {
  const ic = ICONS[key][n];
  return `<svg class="${cls}" viewBox="0 0 35 36" aria-hidden="true"><g transform="translate(2.5 2.5)">${ic.sil}</g>${ic.parts}</svg>`;
};

// State comes from the URL, so a still can name its own direction.
const q = new URLSearchParams(location.search);
let dir = q.get('d') || 'f', set = q.get('i') || '1';
const v = document.getElementById('v');

// The head: the menu's own wordmark and tagline.
const top = v.querySelector('.top');
const title = doc.querySelector('#title'), tagline = doc.querySelector('.tagline');
if (title) top.append(document.importNode(title, true));
if (tagline) top.append(document.importNode(tagline, true));

// The Lab shelf, every tile, with links made safe for the lab.
const shelf = v.querySelector('.shelf');
doc.querySelectorAll('.lab .shelf > li').forEach(src => {
  const li = document.importNode(src, true);
  const a = li.querySelector('a.toy');
  if (!a) return;
  const id = a.id;
  a.removeAttribute('id');
  a.href = '../' + src.querySelector('a.toy').getAttribute('href');
  li.dataset.id = id;
  const key = toys[id]?.series;
  if (key && series[key]) { li.dataset.series = key; li.style.setProperty('--series', series[key].color); }
  shelf.append(li);
});
const web = Object.assign(document.createElement('li'), { className: 'web' });
web.setAttribute('aria-hidden', 'true');
const svg = document.createElementNS(NS, 'svg');
const tag = Object.assign(document.createElement('div'), { className: 'tag' });
web.append(svg, tag);
shelf.append(web);
const idx = v.querySelector('.idx');

// Badges follow the chosen iconlet set.
function badges() {
  shelf.querySelectorAll('.ic').forEach(x => x.remove());
  shelf.querySelectorAll('li[data-series] .obj').forEach(obj => {
    obj.insertAdjacentHTML('beforeend', iconlet(obj.closest('li').dataset.series, set, 'ic'));
  });
  idx.replaceChildren(...Object.keys(series).map(key => {
    const b = document.createElement('button');
    b.dataset.series = key;
    b.style.setProperty('--series', series[key].color);
    const n = shelf.querySelectorAll(`li[data-series="${key}"]`).length;
    b.innerHTML = iconlet(key, set) + `<span class="u"></span><sup>${n}</sup>`;
    b.querySelector('.u').textContent = series[key].name.toLowerCase();
    return b;
  }));
}

// The label for each direction.
const LABEL = {
  f(key, s, n) {
    const wm = document.createElement('span');
    wm.className = 'wm';
    // Letters take the menu's mixed weights and slight tilts, then settle white.
    const W = [800, 500, 900, 600, 700, 400, 800, 600];
    [...s.name].forEach((ch, i) => {
      const sp = document.createElement('span');
      sp.textContent = ch === ' ' ? ' ' : ch;
      sp.style.fontWeight = W[i % W.length];
      sp.style.rotate = `${((i * 37) % 9 - 4) * 0.9}deg`;
      sp.style.setProperty('--c', i % 2 ? C2[key] : s.color);
      wm.append(sp);
      if (!held) setTimeout(() => sp.classList.add('set'), 260 + i * 70);
    });
    const ct = Object.assign(document.createElement('span'), { className: 'ct', textContent: `${n} toys` });
    tag.innerHTML = iconlet(key, set);
    tag.append(wm, ct);
  },
  g(key, s, n) {
    tag.innerHTML = '<span class="en"></span><span class="nl"></span>';
    tag.style.setProperty('--c2', C2[key]);
    tag.querySelector('.en').textContent = s.name.toLowerCase();
    tag.querySelector('.nl').innerHTML = `<b></b> ${n} toys`;
    tag.querySelector('.nl b').textContent = s.nl.toLowerCase();
  },
  h(key, s, n) {
    tag.innerHTML = iconlet(key, set) + '<span class="p">~/stimming/</span><span class="k"></span><span class="n"></span><span class="cur"></span>';
    tag.querySelector('.k').textContent = s.name.toLowerCase().replace(/ /g, '-');
    tag.querySelector('.n').textContent = ` ${n}`;
  },
  i(key, s, n) {
    tag.innerHTML = `<div class="chip">${iconlet(key, set)}<span></span><em></em></div>`;
    tag.querySelector('.chip span').textContent = s.name;
    tag.querySelector('.chip em').textContent = `${n}`;
  },
  j() { tag.replaceChildren(); },
};

let current = null;
function light(key, from) {
  if (key === current) return;
  current = key;
  shelf.classList.toggle('lit', !!key);
  idx.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.series === key));
  if (!key) return;
  const s = series[key];
  shelf.style.setProperty('--series', s.color);
  tag.style.setProperty('--series', s.color);
  const on = [...shelf.children].filter(x => x.dataset.series === key);
  [...shelf.children].forEach(x => x.classList.toggle('on', x.dataset.series === key));
  const bb = shelf.getBoundingClientRect();
  const mid = x => { const r = x.querySelector('.obj').getBoundingClientRect(); return [r.left - bb.left + r.width / 2, r.top - bb.top + r.height / 2]; };
  const pts = on.map(mid);
  svg.setAttribute('viewBox', `0 0 ${bb.width} ${bb.height}`);
  svg.innerHTML = `<path d="M${pts.map(p => p.map(n => n.toFixed(1)).join(' ')).join('L')}"/>` + pts.map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"/>`).join('');
  const path = svg.querySelector('path'), L = path.getTotalLength();
  path.animate([{ strokeDasharray: L, strokeDashoffset: L }, { strokeDasharray: L, strokeDashoffset: 0 }], { duration: held ? 0 : 600, easing: 'ease-out', fill: 'forwards' });
  LABEL[dir](key, s, on.length);
  const anchor = from || on[0];
  const [x] = mid(anchor);
  const t = anchor.querySelector('.obj').getBoundingClientRect().top - bb.top;
  tag.style.left = `${x.toFixed(1)}px`;
  tag.style.top = `${(t - 4).toFixed(1)}px`;
}
const tileOf = e => e.target.closest('.shelf > li');
// A still names its tile in the URL; the pointer then does not clear it.
const held = q.has('hover');
document.documentElement.classList.toggle('still', held);
shelf.addEventListener('pointerover', e => { if (!held && e.pointerType !== 'touch') { const li = tileOf(e); light(li?.dataset.series || null, li); } });
shelf.addEventListener('pointerleave', () => { if (!held) light(null); });
shelf.addEventListener('focusin', e => { const li = tileOf(e); light(li?.dataset.series || null, li); });
idx.addEventListener('pointerover', e => { const b = e.target.closest('button'); if (b) light(b.dataset.series); });
idx.addEventListener('pointerleave', () => { if (!held) light(null); });
idx.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { current = null; light(b.dataset.series); } });

// The iconlet sheet: five per series, big and at tile size.
function sheet() {
  const box = v.querySelector('.sheet');
  box.innerHTML = '';
  for (const key of Object.keys(series)) {
    const sec = document.createElement('div');
    const h = document.createElement('h2'); h.textContent = series[key].name.toLowerCase();
    const grid = Object.assign(document.createElement('div'), { className: 'set' });
    for (const n of [1, 2, 3, 4, 5]) {
      const f = document.createElement('figure');
      f.innerHTML = iconlet(key, n, 'big') + `<div class="row">${iconlet(key, n)}${iconlet(key, n)}</div><figcaption><b>${n}</b></figcaption>`;
      f.querySelector('figcaption').append(ICONS[key][n].name);
      grid.append(f);
    }
    sec.append(h, grid);
    box.append(sec);
  }
}

function render() {
  v.dataset.d = dir;
  document.querySelectorAll('#dirs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.d === dir)));
  document.querySelectorAll('#sets button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.i === set)));
  history.replaceState(null, '', `?d=${dir}&i=${set}` + (held ? `&hover=${q.get('hover')}` : ''));
  badges();
  sheet();
  current = null;
  light(null);
  // A named tile lights on load, for stills.
  const pre = q.get('hover');
  if (pre && dir !== 'icons') {
    const li = shelf.querySelector(`li[data-id="${CSS.escape(pre)}"]`);
    if (li) setTimeout(() => {
      scrollTo(0, li.getBoundingClientRect().top + scrollY - innerHeight * 0.42);
      light(li.dataset.series, li);
    }, 350);
  }
}
document.getElementById('dirs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { dir = b.dataset.d; render(); } });
document.getElementById('sets').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { set = b.dataset.i; render(); } });
render();
</script>
</body>
</html>
