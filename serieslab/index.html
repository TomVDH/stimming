<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Series lab</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
/* The menu tokens, copied from the root index. */
:root {
  --bg: oklch(0.16 0.012 275);
  --fg: oklch(0.95 0.008 275);
  --muted: oklch(0.6 0.02 275);
  --focus: oklch(0.84 0.13 205);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --tile: clamp(104px, 28vw, 150px);
  color-scheme: dark;
}
@font-face { font-family: "Iosevka Term Slab"; font-weight: 500; font-display: swap; src: url(../shared/fonts/IosevkaTermSlab-Medium.woff2) format("woff2"); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 500 16px/1.3 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: clip; }
.defs { position: absolute; width: 0; height: 0; }

/* The direction switch. */
.pick { position: sticky; top: 0; z-index: 9; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding: 14px 16px; background: color-mix(in oklch, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
.pick button { font: 600 14px/1 var(--sans); color: var(--muted); background: none; border: 1px solid oklch(0.32 0.02 275); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
.pick button[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
.pick button:focus-visible, a.toy:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

main { max-width: 1240px; margin: 0 auto; padding: 24px 16px 120px; }

/* A tile, as the menu draws it. */
.row { list-style: none; margin: 0; padding: 0; display: flex; gap: 28px; }
.row > li { flex: none; width: var(--tile); scroll-snap-align: start; }
.toy { display: grid; justify-items: center; gap: 10px; color: inherit; text-decoration: none; text-align: center; }
.obj { position: relative; width: 100%; aspect-ratio: 1; display: grid; place-items: center; }
.obj svg { width: 70%; height: 70%; overflow: visible; }
.name { font: 500 13px/1.2 "Iosevka Term Slab", ui-monospace, monospace; letter-spacing: 0.06em; text-transform: uppercase; }
.name .beta, .name .alpha { display: none; }

/* Each series owns two lights. */
.s-science { --c: oklch(0.74 0.14 250); --c2: oklch(0.86 0.15 88); --deep: oklch(0.3 0.09 258); }
.s-belgian { --c: oklch(0.8 0.15 72); --c2: oklch(0.6 0.21 28); --deep: oklch(0.32 0.08 60); }
.series { position: relative; }
.series h2 { margin: 0; font-family: var(--sans); }
.series .nl { color: var(--muted); }
.series .ct { color: var(--muted); font-size: 14px; }
.badge { display: block; }

/* ---------- A. Wing: a pool of the series light, a title that bleeds off the edge. ---------- */
[data-dir="a"] .series { padding: clamp(28px, 6vw, 64px) 0 clamp(48px, 7vw, 80px); margin-bottom: 24px; isolation: isolate; }
[data-dir="a"] .series::before {
  content: ""; position: absolute; z-index: -1; inset: -30% -40vw; pointer-events: none;
  background:
    radial-gradient(26% 34% at 42% 64%, color-mix(in oklch, var(--c) 30%, transparent), transparent),
    radial-gradient(18% 24% at 60% 70%, color-mix(in oklch, var(--c2) 14%, transparent), transparent);
}
[data-dir="a"] .series::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: clamp(78px, 9vw, 96px); height: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, color-mix(in oklch, var(--c) 70%, transparent) 30%, transparent 85%);
}
[data-dir="a"] .head { display: flex; align-items: flex-end; gap: 18px; margin: 0 0 calc(-0.28 * clamp(64px, 12vw, 156px)) -0.05em; }
[data-dir="a"] h2 {
  font-weight: 850; font-size: clamp(64px, 12vw, 156px); line-height: 0.82; letter-spacing: -0.045em; white-space: nowrap;
  background: linear-gradient(180deg, color-mix(in oklch, var(--c) 80%, white) 10%, color-mix(in oklch, var(--c) 30%, transparent) 78%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
[data-dir="a"] .meta { display: grid; gap: 4px; padding-bottom: 0.6em; }
[data-dir="a"] .badge { width: 30px; }
[data-dir="a"] .row { position: relative; padding-left: clamp(0px, 6vw, 72px); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
@media (max-width: 640px) { [data-dir="a"] .head { flex-wrap: wrap; margin-bottom: 10px; } [data-dir="a"] .meta { grid-auto-flow: column; align-items: center; gap: 10px; padding: 0 0 0 0.06em; } }
[data-dir="a"] .obj svg { -webkit-box-reflect: below 6px linear-gradient(transparent 62%, rgb(255 255 255 / 0.16)); }

/* ---------- B. Spine: a crate of records, the name runs up a lit spine. ---------- */
[data-dir="b"] .series { display: grid; grid-template-columns: auto 1fr; gap: clamp(20px, 4vw, 44px); margin: 0 auto 64px; max-width: 1180px; }
[data-dir="b"] .head {
  position: relative; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 14px;
  width: 58px; padding: 14px 0; border-radius: 3px;
  background: linear-gradient(180deg, color-mix(in oklch, var(--c) 34%, var(--bg)), var(--deep) 55%, color-mix(in oklch, var(--deep) 40%, var(--bg)));
  box-shadow: inset 1px 0 0 color-mix(in oklch, var(--c) 70%, transparent), 6px 6px 0 oklch(0.07 0.01 260);
}
[data-dir="b"] .s-belgian .head { box-shadow: inset 3px 0 0 oklch(0.2 0.01 260), inset 6px 0 0 oklch(0.88 0.17 95), inset 9px 0 0 oklch(0.58 0.21 28), 6px 6px 0 oklch(0.07 0.01 260); }
[data-dir="b"] .s-science .head { box-shadow: inset 4px 0 0 var(--c2), 6px 6px 0 oklch(0.07 0.01 260); }
[data-dir="b"] h2 { writing-mode: vertical-rl; rotate: 180deg; font-weight: 700; font-size: 25px; letter-spacing: 0.01em; align-self: start; }
[data-dir="b"] .badge { width: 26px; }
[data-dir="b"] .nl, [data-dir="b"] .ct { display: none; }
[data-dir="b"] .spine-ct { font: 700 13px/1 var(--sans); color: color-mix(in oklch, var(--c) 70%, white); }
[data-dir="b"] .row { align-self: center; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 6px 4px 10px; }

/* ---------- C. Marquee: the name, outlined and enormous, slides behind the row. ---------- */
[data-dir="c"] .series { padding: clamp(40px, 7vw, 84px) 0; overflow: hidden; margin-inline: -16px; }
[data-dir="c"] .head { position: absolute; inset: 50% 0 auto; translate: 0 -62%; pointer-events: none; }
[data-dir="c"] h2 {
  display: inline-block; white-space: nowrap; font-weight: 900; font-size: clamp(110px, 20vw, 260px); line-height: 1; letter-spacing: -0.04em;
  color: color-mix(in oklch, var(--c) 7%, transparent); -webkit-text-stroke: 1.4px color-mix(in oklch, var(--c) 60%, transparent);
  will-change: transform;
}
[data-dir="c"] h2 .sep { display: inline-block; width: 0.26em; vertical-align: 0.12em; margin: 0 0.18em; opacity: 0.32; }
[data-dir="c"] .meta { display: none; }
[data-dir="c"] .row { position: relative; justify-content: center; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 0 16px; scroll-snap-type: x mandatory; }
[data-dir="c"] .row::-webkit-scrollbar { display: none; }
[data-dir="c"] .caption { position: relative; display: flex; justify-content: center; gap: 10px; align-items: center; margin-top: 22px; color: var(--muted); font-size: 15px; }
[data-dir="c"] .caption b { color: var(--fg); font-weight: 600; }
[data-dir="c"] .caption img { width: 20px; }

/* ---------- D. Ribbon: one band in the series colours threads every tile. ---------- */
[data-dir="d"] .series { margin: 0 auto 72px; max-width: 1100px; }
[data-dir="d"] .head { display: flex; align-items: center; gap: 12px; margin: 0 0 6px; }
[data-dir="d"] h2 { font-weight: 700; font-size: clamp(26px, 3.4vw, 34px); letter-spacing: -0.01em; }
[data-dir="d"] .badge { width: 26px; }
[data-dir="d"] .meta { display: flex; gap: 12px; align-items: baseline; }
[data-dir="d"] .scroller { overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; }
[data-dir="d"] .scroller::-webkit-scrollbar { display: none; }
[data-dir="d"] .track { position: relative; width: max-content; padding: 26px 8px 8px; }
[data-dir="d"] .ribbon { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
[data-dir="d"] .ribbon path { fill: none; stroke-linecap: round; }
[data-dir="d"] .row { position: relative; }
[data-dir="d"] .row .obj svg { filter: drop-shadow(0 10px 18px oklch(0.05 0.01 260 / 0.7)); }

/* ---------- E. Constellation: no headings; one tile lights its whole series. ---------- */
[data-dir="e"] .mixed { position: relative; max-width: calc(5 * 150px + 4 * 28px); margin: 24px auto 0; }
[data-dir="e"] .mixed .row { flex-wrap: wrap; justify-content: center; row-gap: 26px; }
[data-dir="e"] .obj .badge { position: absolute; top: 2%; right: 4%; width: 21%; rotate: 8deg; transition: rotate 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), scale 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); }
[data-dir="e"] li { transition: opacity 0.35s, filter 0.35s; }
[data-dir="e"] .obj::before {
  content: ""; position: absolute; inset: 4%; border-radius: 50%; opacity: 0; transition: opacity 0.35s;
  background: radial-gradient(closest-side, color-mix(in oklch, var(--c) 42%, transparent), transparent);
}
[data-dir="e"] .mixed.lit li:not(.on) { opacity: 0.28; filter: saturate(0.3); }
[data-dir="e"] .mixed.lit li.on .obj::before { opacity: 1; }
[data-dir="e"] .mixed.lit li.on .badge { rotate: -6deg; scale: 1.15; }
[data-dir="e"] .web { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
[data-dir="e"] .web path { fill: none; stroke: var(--c); stroke-width: 1.2; opacity: 0.75; filter: drop-shadow(0 0 4px var(--c)); }
[data-dir="e"] .web circle { fill: var(--c); }
[data-dir="e"] .tag {
  position: absolute; z-index: 2; pointer-events: none; translate: -50% 0; white-space: nowrap;
  display: flex; gap: 8px; align-items: center; padding: 7px 12px 7px 9px; border-radius: 999px;
  font: 600 14px/1 var(--sans); background: color-mix(in oklch, var(--c) 18%, var(--bg)); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--c) 55%, transparent);
  opacity: 0; transition: opacity 0.25s;
}
[data-dir="e"] .tag img { width: 18px; }
[data-dir="e"] .tag span { color: var(--muted); font-weight: 500; }
[data-dir="e"] .mixed.lit .tag { opacity: 1; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<body>
<nav class="pick" aria-label="Direction">
  <button data-d="a">A Wing</button>
  <button data-d="b">B Spine</button>
  <button data-d="c">C Marquee</button>
  <button data-d="d">D Ribbon</button>
  <button data-d="e">E Constellation</button>
</nav>
<main id="v"></main>
<script type="module">
// The lab borrows real tiles and defs from the menu, then lays them out per direction.
const html = await fetch('../index.html').then(r => r.text());
const doc = new DOMParser().parseFromString(html, 'text/html');
const [toys, series] = await Promise.all(['../toys.json', '../series.json'].map(u => fetch(u).then(r => r.json())));
const defs = doc.querySelector('svg.defs');
if (defs) document.body.prepend(document.importNode(defs, true));

// A tile is the menu's own li, with its links made safe for the lab.
const tile = id => {
  const a = doc.querySelector(`a.toy#${CSS.escape(id)}`);
  if (!a) return null;
  const li = document.createElement('li');
  const c = document.importNode(a, true);
  c.removeAttribute('id');
  c.href = '../' + a.getAttribute('href');
  li.append(c);
  li.dataset.id = id;
  return li;
};
const members = key => Object.keys(toys).filter(id => toys[id].series === key && doc.getElementById(id));
const badge = key => Object.assign(document.createElement('img'), { className: 'badge', src: '../' + series[key].badge, alt: '' });
const count = n => `${n} toys`;

const v = document.getElementById('v');
const params = new URLSearchParams(location.search);
let dir = params.get('d') || 'a';
let cleanup = () => {};

// One series block: the head, then the row.
const block = (key, extra) => {
  const ids = members(key);
  const s = document.createElement('section');
  s.className = `series s-${key}`;
  s.innerHTML = `<div class="head"><h2></h2><div class="meta"><span class="nl"></span><span class="ct"></span></div></div>`;
  s.querySelector('h2').textContent = series[key].name;
  s.querySelector('.nl').textContent = series[key].nl;
  s.querySelector('.ct').textContent = count(ids.length);
  const row = document.createElement('ul');
  row.className = 'row';
  ids.forEach(id => { const t = tile(id); if (t) row.append(t); });
  s.append(row);
  extra?.(s, row, ids);
  return s;
};

const BUILD = {
  a(key) {
    return block(key, s => s.querySelector('.meta').prepend(badge(key)));
  },
  b(key) {
    return block(key, (s, row, ids) => {
      const head = s.querySelector('.head');
      head.prepend(badge(key));
      const ct = Object.assign(document.createElement('span'), { className: 'spine-ct', textContent: ids.length });
      head.append(ct);
    });
  },
  c(key) {
    return block(key, (s, row, ids) => {
      const h = s.querySelector('h2'), name = series[key].name, nl = series[key].nl;
      h.textContent = '';
      // The name repeats with its Dutch twin, joined by the badge.
      for (let i = 0; i < 4; i++) {
        h.append(i % 2 ? nl : name);
        const sep = badge(key); sep.className = 'sep'; h.append(sep);
      }
      const cap = document.createElement('p');
      cap.className = 'caption';
      cap.append(badge(key));
      const b = document.createElement('b'); b.textContent = name;
      const n = document.createElement('span'); n.textContent = `${nl}, ${count(ids.length)}`;
      cap.append(b, n);
      s.append(cap);
    });
  },
  d(key) {
    return block(key, (s, row) => {
      s.querySelector('.head').prepend(badge(key));
      const scroller = document.createElement('div'); scroller.className = 'scroller';
      const track = document.createElement('div'); track.className = 'track';
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.classList.add('ribbon');
      track.append(svg, row); scroller.append(track); s.append(scroller);
    });
  },
};

// Ribbon: a wave through each tile centre, drawn in the series colours.
const STRIPES = {
  science: [['oklch(0.55 0.19 262)', 14, 0], ['oklch(0.86 0.15 88)', 3, 0]],
  belgian: [['oklch(0.22 0.01 260)', 5, -5], ['oklch(0.88 0.17 95)', 5, 0], ['oklch(0.58 0.21 28)', 5, 5]],
};
function ribbons(animate) {
  v.querySelectorAll('.series').forEach(s => {
    const key = s.classList.contains('s-science') ? 'science' : 'belgian';
    const track = s.querySelector('.track'), svg = s.querySelector('.ribbon');
    const tb = track.getBoundingClientRect();
    const pts = [...s.querySelectorAll('.obj')].map((o, i) => {
      const r = o.getBoundingClientRect();
      return [r.left - tb.left + r.width / 2, r.top - tb.top + r.height * (i % 2 ? 0.72 : 0.36)];
    });
    if (!pts.length) return;
    const first = [pts[0][0] - 120, pts[0][1] + 30], last = [pts.at(-1)[0] + 120, pts.at(-1)[1] - 30];
    const all = [first, ...pts, last];
    svg.setAttribute('viewBox', `0 0 ${tb.width} ${tb.height}`);
    svg.innerHTML = '';
    STRIPES[key].forEach(([col, w, off]) => {
      let d = `M${all[0][0]} ${all[0][1] + off}`;
      for (let i = 1; i < all.length; i++) {
        const [x0, y0] = all[i - 1], [x1, y1] = all[i], mx = (x0 + x1) / 2;
        d += ` C${mx} ${y0 + off} ${mx} ${y1 + off} ${x1} ${y1 + off}`;
      }
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', d); p.style.stroke = col; p.style.strokeWidth = w;
      svg.append(p);
      if (animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const L = p.getTotalLength();
        p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
        p.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: 1400, easing: 'cubic-bezier(0.6, 0, 0.2, 1)', fill: 'forwards' });
      }
    });
  });
}

// Constellation: one mixed grid; a series tile lights its siblings.
function constellation() {
  const box = document.createElement('div'); box.className = 'mixed';
  const row = document.createElement('ul'); row.className = 'row';
  const order = ['bismuth', 'subway', 'bread', 'flametest', 'ulam', 'frietkot', 'washline', 'rubens', 'motorway', 'fireworks', 'lichtenberg', 'beer', 'dijkstra', 'chocolate', 'vortex', 'canal'];
  order.forEach(id => {
    const t = tile(id); if (!t) return;
    const key = toys[id]?.series;
    if (key) { t.classList.add(`s-${key}`); t.dataset.series = key; t.querySelector('.obj').append(badge(key)); }
    row.append(t);
  });
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.classList.add('web');
  const tag = document.createElement('div'); tag.className = 'tag';
  box.append(svg, row, tag);
  v.append(box);
  const light = li => {
    const key = li?.dataset.series;
    if (!key) { box.classList.remove('lit'); svg.innerHTML = ''; return; }
    box.classList.add('lit');
    box.className = `mixed lit s-${key}`;
    const bb = box.getBoundingClientRect();
    const on = [...row.children].filter(x => x.dataset.series === key);
    row.querySelectorAll('li').forEach(x => x.classList.toggle('on', x.dataset.series === key));
    const c = on.map(x => { const r = x.querySelector('.obj').getBoundingClientRect(); return [r.left - bb.left + r.width / 2, r.top - bb.top + r.height / 2]; });
    const me = li.querySelector('.obj').getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${bb.width} ${bb.height}`);
    // The path visits the members in reading order.
    svg.innerHTML = `<path d="M${c.map(p => p.join(' ')).join('L')}"/>` + c.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3"/>`).join('');
    const path = svg.querySelector('path'), L = path.getTotalLength();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches)
      path.animate([{ strokeDasharray: `${L}`, strokeDashoffset: L }, { strokeDasharray: `${L}`, strokeDashoffset: 0 }], { duration: 600, easing: 'ease-out', fill: 'forwards' });
    tag.innerHTML = '';
    tag.append(badge(key), series[key].name);
    const sp = document.createElement('span'); sp.textContent = count(on.length); tag.append(sp);
    tag.style.left = `${me.left - bb.left + me.width / 2}px`;
    tag.style.top = `${me.top - bb.top - 26}px`;
  };
  row.addEventListener('pointerover', e => light(e.target.closest('li')));
  row.addEventListener('pointerleave', () => light(null));
  row.addEventListener('focusin', e => light(e.target.closest('li')));
  row.addEventListener('focusout', () => light(null));
  return () => {};
}

// Marquee: the outlined names slide with page scroll; no idle frames.
function marquee() {
  const hs = [...v.querySelectorAll('h2')];
  let raf = 0;
  const move = () => {
    raf = 0;
    hs.forEach((h, i) => {
      const r = h.closest('.series').getBoundingClientRect();
      const t = (r.top + r.height / 2 - innerHeight / 2) / innerHeight;
      h.style.transform = `translateX(${(i % 2 ? -1 : 1) * t * 24 - 1}%)`;
    });
  };
  const on = () => { if (!raf) raf = requestAnimationFrame(move); };
  addEventListener('scroll', on, { passive: true });
  addEventListener('resize', on);
  move();
  return () => { removeEventListener('scroll', on); removeEventListener('resize', on); };
}

function render() {
  cleanup();
  cleanup = () => {};
  v.dataset.dir = dir;
  v.innerHTML = '';
  document.querySelectorAll('.pick button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.d === dir)));
  if (dir === 'e') { cleanup = constellation(); return; }
  ['science', 'belgian'].forEach(k => v.append(BUILD[dir](k)));
  if (dir === 'c') cleanup = marquee();
  if (dir === 'd') {
    const r = () => ribbons(false);
    requestAnimationFrame(() => ribbons(true));
    addEventListener('resize', r);
    cleanup = () => removeEventListener('resize', r);
  }
}
document.querySelector('.pick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  dir = b.dataset.d;
  history.replaceState(null, '', `?d=${dir}`);
  render();
});
render();
</script>
</body>
</html>
