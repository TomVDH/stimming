<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Category icons lab</title>
<meta name="color-scheme" content="dark">
<style>
@font-face { font-family: "Iosevka Term Slab"; font-weight: 500; font-display: swap; src: url(../shared/fonts/IosevkaTermSlab-Medium.woff2) format("woff2"); }
:root { --bg: oklch(0.16 0.012 275); --fg: oklch(0.95 0.008 275); --muted: oklch(0.6 0.02 275); --line: oklch(0.28 0.015 275); --mono: "Iosevka Term Slab", ui-monospace, monospace; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--mono); }
body { padding: 0 16px 60px; }
/* The style switch stays on top while the sheet scrolls. */
.top { position: sticky; top: 0; z-index: 5; display: grid; gap: 8px; justify-items: center; padding: 14px 0 12px; margin: 0 -16px; background: color-mix(in oklch, var(--bg) 92%, transparent); backdrop-filter: blur(8px); }
h1 { margin: 0; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; }
.styles { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.styles button { font: 500 12px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: none; border: 1px solid oklch(0.32 0.02 275); border-radius: 999px; padding: 8px 13px; cursor: pointer; }
.styles button[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
.styles button:focus-visible, .cell:focus-visible { outline: 2px solid oklch(0.84 0.13 205); outline-offset: 3px; }
.hint { color: var(--muted); font-size: 12px; }
/* A row per category, a column per motif. */
.sheet { display: grid; grid-template-columns: 140px repeat(3, minmax(150px, 1fr)); max-width: 900px; margin: 0 auto; border-top: 1px solid var(--line); }
.sheet > * { border-bottom: 1px solid var(--line); padding: 14px 10px; }
.cat { display: grid; align-content: center; gap: 2px; }
.cat b { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c); }
.cat small { color: var(--muted); }
.cell { display: grid; justify-items: center; gap: 8px; cursor: pointer; border-radius: 10px; transition: background 0.2s; }
.cell:hover { background: oklch(0.2 0.012 275); }
.cell.pick { background: color-mix(in oklch, var(--c) 16%, transparent); outline: 1px solid var(--c); outline-offset: -1px; }
.cell em { font-style: normal; font-size: 11px; color: var(--muted); }
.sizes { display: flex; align-items: flex-end; gap: 12px; }
.sizes svg:nth-child(1) { width: 76px; height: 76px; }
.sizes svg:nth-child(2) { width: 32px; height: 32px; }
.sizes svg:nth-child(3) { width: 20px; height: 20px; }
.hdr { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c); }
.hdr svg { width: 22px; height: 22px; flex: none; }
.hdr::after { content: ""; flex: 1; height: 1px; background: color-mix(in oklch, var(--c) 35%, transparent); }
/* Line style: every glyph shape becomes an outline. */
svg.line .g * { fill: none !important; stroke: var(--ink) !important; stroke-width: 1.7 !important; stroke-linejoin: round; opacity: 1 !important; }
.out { max-width: 900px; margin: 22px auto 0; }
.out code { display: block; padding: 10px 12px; background: oklch(0.12 0.01 275); border: 1px solid var(--line); border-radius: 8px; color: var(--muted); white-space: pre-wrap; }
@media (max-width: 680px) { .sheet { grid-template-columns: 96px repeat(3, 140px); overflow-x: auto; } }
</style>
<body>
<div class="top">
  <h1>Category icons · hex</h1>
  <div class="styles" role="group" aria-label="Glyph style">
    <button type="button" data-s="solid">Solid</button>
    <button type="button" data-s="duo">Duotone</button>
    <button type="button" data-s="line">Line</button>
    <button type="button" data-s="pixel">Pixel</button>
  </div>
  <div class="hint">Three motifs per category. Tap one to pick it; the style switch applies to all.</div>
</div>
<div class="sheet" id="sheet"></div>
<div class="out"><code id="out">{}</code></div>
<script type="module">
const CATS = [
  ['poke', 'Poke & pop', 'Prutsen', 'oklch(0.8 0.12 230)'],
  ['goo', 'Goo', 'Smurrie', 'oklch(0.82 0.19 135)'],
  ['light', 'Light & glass', 'Licht', 'oklch(0.86 0.12 195)'],
  ['science', 'Science fair', 'Wetenschapsbeurs', 'oklch(0.74 0.14 250)'],
  ['dark', 'After dark', 'Na donker', 'oklch(0.74 0.14 295)'],
  ['odd', 'Odd one out', 'Raar', 'oklch(0.84 0.16 330)'],
  ['belgian', 'Belgian', 'Belgisch', 'oklch(0.8 0.15 72)'],
  ['maths', 'Maths class', 'Wiskundeles', 'oklch(0.74 0.18 345)'],
];
const SHADOW = 'oklch(0.07 0.01 260)', INK = 'oklch(0.16 0.012 275)';

// Motifs draw in a 24 x 24 box. `f` fills, `hi` lights, `cut` cuts details out.
const M = {
  poke: [
    ['Bubble wrap', (f, hi, cut) => `<circle cx="7" cy="7" r="4.8" fill="${f}"/><circle cx="17" cy="7" r="4.8" fill="${f}"/><circle cx="7" cy="17" r="4.8" fill="${f}"/><path d="M12.6 17.6L15 13.4L17.2 16.4L19.6 13L21.4 17.4L19 21.4L16.4 19.2L14 21.6Z" fill="${f}"/><path d="M5 5.2a2.6 2.6 0 0 1 2.6-1.4M15 5.2a2.6 2.6 0 0 1 2.6-1.4M5 15.2a2.6 2.6 0 0 1 2.6-1.4" stroke="${hi}" stroke-width="1.4" fill="none" stroke-linecap="round"/>`],
    ['Big button', (f, hi, cut) => `<path d="M2 15H22V19H2Z" fill="${f}"/><path d="M5 9a7 4 0 0 1 14 0V15H5Z" fill="${f}"/><path d="M7.5 9.5a4.5 2.4 0 0 1 4.6-2.4" stroke="${hi}" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M12 1.5V4.5M7 2.8L8.3 5.2M17 2.8L15.7 5.2" stroke="${f}" stroke-width="1.6" stroke-linecap="round"/>`],
    ['Poking finger', (f, hi, cut) => `<path d="M9 2.5a2 2 0 0 1 4 0V10.5L18.5 11.6a2.4 2.4 0 0 1 2 2.6L19.6 20.5A2.6 2.6 0 0 1 17 22.5H10.6A2.6 2.6 0 0 1 8.4 21.3L4.2 14.4a1.8 1.8 0 0 1 2.8-2.2L9 14Z" fill="${f}"/><path d="M13 14.5V18M16 14.8V18" stroke="${cut}" stroke-width="1.3" stroke-linecap="round"/><path d="M10 3.6V8" stroke="${hi}" stroke-width="1.3" stroke-linecap="round"/>`],
  ],
  goo: [
    ['Drip', (f, hi, cut) => `<path d="M3 3H21V10.5L18.6 13V18.4L16.2 21.4L13.8 18.4V14.4L11.4 16.8L9 14.4V12.2L6.4 14.6L3 11.4Z" fill="${f}"/><path d="M5.5 5.5H12" stroke="${hi}" stroke-width="1.8" stroke-linecap="round"/><circle cx="16.2" cy="16.6" r="1" fill="${hi}"/>`],
    ['Slime blob', (f, hi, cut) => `<path d="M4 20C2 20 1.5 17.5 3 16C2 13 4 9 7 8C8 4 13 2.5 16 5C19.5 5 22 9 21 13C23 15 22.5 20 19.5 20Z" fill="${f}"/><circle cx="9.5" cy="13" r="2.2" fill="${cut}"/><circle cx="15.5" cy="12.5" r="2.2" fill="${cut}"/><circle cx="10.1" cy="12.4" r="0.8" fill="${hi}"/><circle cx="16.1" cy="11.9" r="0.8" fill="${hi}"/><path d="M8 7.5a3.5 3.5 0 0 1 3-2.4" stroke="${hi}" stroke-width="1.4" fill="none" stroke-linecap="round"/>`],
    ['Blobs rising', (f, hi, cut) => `<ellipse cx="9" cy="17" rx="6.5" ry="5" fill="${f}"/><ellipse cx="16.5" cy="7.5" rx="5" ry="4.2" fill="${f}"/><circle cx="18" cy="16.5" r="2.4" fill="${f}"/><path d="M5.5 15a3.6 2.6 0 0 1 3-2M13.6 6.2a2.6 2 0 0 1 2.4-1.4" stroke="${hi}" stroke-width="1.4" fill="none" stroke-linecap="round"/>`],
  ],
  light: [
    ['Prism', (f, hi, cut) => `<path d="M1.5 13.5L8 12.4" stroke="${hi}" stroke-width="1.8" stroke-linecap="round"/><path d="M10 3L17.5 20.5H2.5Z" fill="${f}"/><path d="M16 11L23 7.5V10Z" fill="oklch(0.68 0.22 28)"/><path d="M16.4 12L23 11V13.6Z" fill="oklch(0.9 0.17 95)"/><path d="M16.8 13L23 14.6V17.2Z" fill="oklch(0.62 0.2 255)"/>`],
    ['Bulb', (f, hi, cut) => `<path d="M12 2a7 7 0 0 1 4.2 12.6V17H7.8V14.6A7 7 0 0 1 12 2Z" fill="${f}"/><path d="M8.5 18.5H15.5V20.2H8.5ZM9.5 21.2H14.5V22.6H9.5Z" fill="${f}"/><path d="M10 13.5L10.8 9L12 11L13.2 9L14 13.5" stroke="${cut}" stroke-width="1.2" fill="none" stroke-linejoin="round"/><path d="M8.4 6.5a4.2 4.2 0 0 1 2.6-2.4" stroke="${hi}" stroke-width="1.4" fill="none" stroke-linecap="round"/>`],
    ['Glint', (f, hi, cut) => `<path d="M12 1L14 10L23 12L14 14L12 23L10 14L1 12L10 10Z" fill="${f}"/><path d="M19 2.5L19.8 4.6L22 5.4L19.8 6.2L19 8.4L18.2 6.2L16 5.4L18.2 4.6Z" fill="${f}"/><circle cx="12" cy="12" r="2.4" fill="${hi}"/>`],
  ],
  science: [
    ['Flask', (f, hi, cut) => `<path d="M8.6 2H15.4V3.8H14.4V9L20.8 19.8V22H3.2V19.8L9.6 9V3.8H8.6Z" fill="${f}"/><path d="M6.6 15.6H17.4L19.6 19.6V20.4H4.4V19.6Z" fill="${cut}" opacity="0.35"/><circle cx="10" cy="17.8" r="1.1" fill="${hi}"/><circle cx="13.4" cy="16.6" r="0.8" fill="${hi}"/><circle cx="12" cy="12.6" r="0.7" fill="${hi}"/>`],
    ['Atom', (f, hi, cut) => `<g fill="none" stroke="${f}" stroke-width="1.9"><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-60 12 12)"/></g><circle cx="12" cy="12" r="2.6" fill="${f}"/><circle cx="21.4" cy="12" r="1.4" fill="${hi}"/>`],
    ['Rosette', (f, hi, cut) => `<path d="M7 13L3.5 22.5L7.5 20.5L9.5 23.5L12 15ZM17 13L20.5 22.5L16.5 20.5L14.5 23.5L12 15Z" fill="${f}"/><path d="M12 1L14 3.2L16.9 2.4L17.5 5.3L20.4 6.1L19.5 8.9L21.6 11L19.5 13.1L20.4 15.9L17.5 16.7L16.9 19.6L14 18.8L12 21L10 18.8L7.1 19.6L6.5 16.7L3.6 15.9L4.5 13.1L2.4 11L4.5 8.9L3.6 6.1L6.5 5.3L7.1 2.4L10 3.2Z" fill="${f}"/><circle cx="12" cy="11" r="4.4" fill="${cut}" opacity="0.4"/><path d="M10 11L11.5 12.5L14.3 9.6" stroke="${hi}" stroke-width="1.6" fill="none"/>`],
  ],
  dark: [
    ['Moon and window', (f, hi, cut) => `<path d="M12.5 2.5A9 9 0 1 0 21 16A7.6 7.6 0 0 1 12.5 2.5Z" fill="${f}"/><path d="M14.5 13H21V21H14.5Z" fill="${cut}" opacity="0.5"/><path d="M15.8 14.3H19.7V19.7H15.8Z" fill="oklch(0.88 0.15 85)"/>`],
    ['Eyes in the dark', (f, hi, cut) => `<path d="M1.5 12C4 6.5 9 6.5 11 12C9 17.5 4 17.5 1.5 12ZM13 12C15 6.5 20 6.5 22.5 12C20 17.5 15 17.5 13 12Z" fill="${f}"/><path d="M6.3 9.5V14.5M17.7 9.5V14.5" stroke="${cut}" stroke-width="2.4" stroke-linecap="round"/><circle cx="7.6" cy="10.4" r="0.9" fill="${hi}"/><circle cx="19" cy="10.4" r="0.9" fill="${hi}"/>`],
    ['Constellation', (f, hi, cut) => `<path d="M3 18L8 9L14 13L20 4" stroke="${f}" stroke-width="1.2" fill="none" opacity="0.7"/><path d="M8 9L10 20" stroke="${f}" stroke-width="1.2" opacity="0.7"/><g fill="${f}"><path d="M3 15.5L3.8 17.2L5.5 18L3.8 18.8L3 20.5L2.2 18.8L.5 18L2.2 17.2Z"/><path d="M8 6L9 8L11 9L9 10L8 12L7 10L5 9L7 8Z"/><circle cx="14" cy="13" r="1.6"/><circle cx="10" cy="20" r="1.4"/><path d="M20 .8L21.3 2.7L23.2 4L21.3 5.3L20 7.2L18.7 5.3L16.8 4L18.7 2.7Z"/></g><circle cx="20" cy="4" r="0.9" fill="${hi}"/>`],
  ],
  odd: [
    ['Asterisk', (f, hi, cut) => `<g transform="rotate(14 12 12)"><path d="M10.4 2H13.6V9.2L19.8 5.6L21.4 8.4L15.2 12L21.4 15.6L19.8 18.4L13.6 14.8V22H10.4V14.8L4.2 18.4L2.6 15.6L8.8 12L2.6 8.4L4.2 5.6L10.4 9.2Z" fill="${f}"/></g><circle cx="12" cy="12" r="2" fill="${hi}"/>`],
    ['Googly eye', (f, hi, cut) => `<circle cx="12" cy="12" r="10" fill="${f}"/><circle cx="14.6" cy="15" r="4.6" fill="${cut}"/><circle cx="16" cy="13.6" r="1.2" fill="${hi}"/>`],
    ['Question', (f, hi, cut) => `<g transform="rotate(-12 12 12)"><path d="M6.5 8a5.5 5.5 0 1 1 8.4 4.7C13.4 13.6 13 14.4 13 16H10C10 13.4 10.8 12 12.6 10.8A2.6 2.6 0 1 0 9.4 8Z" fill="${f}"/><circle cx="11.5" cy="20" r="2" fill="${f}"/></g><path d="M18.5 3L21 1.5M19.5 6.5L22.5 6.5" stroke="${hi}" stroke-width="1.4" stroke-linecap="round"/>`],
  ],
  belgian: [
    ['Waffle', (f, hi, cut) => `<g transform="rotate(-8 12 12)"><path d="M3 3H21V21H3Z" fill="${f}"/><path d="M9 3V21M15 3V21M3 9H21M3 15H21" stroke="${cut}" stroke-width="1.6" opacity="0.5"/><path d="M4.5 4.5h3M10.5 10.5h3M16.5 16.5h3" stroke="${hi}" stroke-width="1.4" stroke-linecap="round"/></g>`],
    ['Fries', (f, hi, cut) => `<path d="M7 9.5L5.6 2.4L8 2L9.4 9.5ZM10.4 9.5V1.2H12.8V9.5ZM13.8 9.5L15.4 2.2L17.8 2.6L16.4 9.5Z" fill="${f}" opacity="0.85"/><path d="M4 9H20L17 22.5H7Z" fill="${f}"/><path d="M6.5 13H17.5" stroke="${cut}" stroke-width="1.4" opacity="0.5"/><path d="M14 16.5l1 1.5M15.5 15l1 1.5" stroke="${hi}" stroke-width="1.2" stroke-linecap="round"/>`],
    ['Atom balls', (f, hi, cut) => `<path d="M12 3L4 12L12 21L20 12ZM12 3V21M4 12H20" stroke="${f}" stroke-width="1.8" fill="none"/><g fill="${f}"><circle cx="12" cy="3" r="2.4"/><circle cx="4" cy="12" r="2.4"/><circle cx="20" cy="12" r="2.4"/><circle cx="12" cy="21" r="2.4"/><circle cx="12" cy="12" r="2.8"/></g><circle cx="11.2" cy="11.2" r="0.9" fill="${hi}"/>`],
  ],
  maths: [
    ['Graph', (f, hi, cut) => `<path d="M3 3V21H21" stroke="${f}" stroke-width="2.2" fill="none" stroke-linecap="square"/><path d="M5.5 17L9.5 9L13 14L19 4.5" stroke="${f}" stroke-width="2.6" fill="none" stroke-linejoin="miter"/><circle cx="19" cy="4.5" r="1.8" fill="${hi}"/>`],
    ['Pi', (f, hi, cut) => `<path d="M3 5.5Q3.5 3 7 3H21.5V6.5H17.5V17.5Q17.5 19.5 19.5 19.5H21.5V22H17.5Q14 22 14 18V6.5H10.5V16Q10.5 22 5 22V19Q7 19 7 16V6.5H6Q5 6.5 4.8 7.2Z" fill="${f}"/><path d="M12 4.5H19.5" stroke="${hi}" stroke-width="1.1" stroke-linecap="round"/>`],
    ['Spiral', (f, hi, cut) => `<path d="M12 12h3v3h-6v-6h9v9h-12v-12h15v15h-18" stroke="${f}" stroke-width="2" fill="none" stroke-linejoin="miter" transform="translate(-1 -1)"/><circle cx="11" cy="11" r="1.6" fill="${hi}"/>`],
  ],
};

// One hex for every icon: the flat colour block with a hard offset shadow.
const HEX = 'M20 2L36 11V29L20 38L4 29V11Z';
const light = c => `color-mix(in oklch, ${c} 45%, white)`;
const draw = (cat, i, c, style) => {
  const fn = M[cat][i][1];
  const glyph = style === 'duo' ? fn(INK, light(c), c) : fn(INK, INK, c);
  return `<svg viewBox="0 0 40 40" class="${style === 'line' ? 'line' : ''}" style="--ink:${INK}"><path d="${HEX}" fill="${SHADOW}" transform="translate(2.5 1.5)"/><path d="${HEX}" fill="${c}"/><g class="g" transform="translate(8.6 8.6) scale(0.95)">${glyph}</g></svg>`;
};

// Pixel style: the solid glyph sampled onto a 12 x 12 grid of squares.
const pixelCache = new Map();
async function pixel(cat, i, c) {
  const key = cat + i;
  if (!pixelCache.has(key)) {
    const src = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48">${M[cat][i][1]('#000', '#000', '#fff')}</svg>`;
    const img = new Image();
    img.src = 'data:image/svg+xml,' + encodeURIComponent(src);
    await img.decode();
    const cv = Object.assign(document.createElement('canvas'), { width: 12, height: 12 });
    const g = cv.getContext('2d');
    g.drawImage(img, 0, 0, 12, 12);
    const px = g.getImageData(0, 0, 12, 12).data;
    let rects = '';
    for (let y = 0; y < 12; y++) for (let x = 0; x < 12; x++) {
      const o = (y * 12 + x) * 4;
      if (px[o + 3] > 110 && px[o] < 128) rects += `M${x * 2} ${y * 2}h2v2h-2z`;
    }
    pixelCache.set(key, rects);
  }
  return `<svg viewBox="0 0 40 40"><path d="${HEX}" fill="${SHADOW}" transform="translate(2.5 1.5)"/><path d="${HEX}" fill="${c}"/><path transform="translate(8.6 8.6) scale(0.95)" d="${pixelCache.get(key)}" fill="${INK}"/></svg>`;
}

const sheet = document.getElementById('sheet'), out = document.getElementById('out');
let state = { style: 'solid', picks: {} };
try { state = { ...state, ...JSON.parse(localStorage.getItem('stimming.serieslab.hex')) }; } catch (e) {}

async function render() {
  const frag = document.createDocumentFragment();
  for (const [k, name, nl, c] of CATS) {
    const head = document.createElement('div');
    head.className = 'cat';
    head.style.setProperty('--c', c);
    head.innerHTML = `<b>${name}</b><small>${nl}</small>`;
    frag.append(head);
    for (let i = 0; i < 3; i++) {
      const svg = state.style === 'pixel' ? await pixel(k, i, c) : draw(k, i, c, state.style);
      const cell = document.createElement('div');
      cell.className = 'cell' + (state.picks[k] === i ? ' pick' : '');
      cell.tabIndex = 0;
      cell.style.setProperty('--c', c);
      cell.innerHTML = `<div class="sizes">${svg}${svg}${svg}</div><em>${M[k][i][0]}</em><div class="hdr">${svg}${name}</div>`;
      const pick = () => { state.picks[k] = state.picks[k] === i ? null : i; save(); render(); };
      cell.addEventListener('click', pick);
      cell.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      frag.append(cell);
    }
  }
  sheet.replaceChildren(frag);
  document.querySelectorAll('.styles button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === state.style));
  const picks = Object.fromEntries(Object.entries(state.picks).filter(([, v]) => Number.isInteger(v)).map(([k, v]) => [k, M[k][v][0]]));
  out.textContent = JSON.stringify({ style: state.style, picks });
}
function save() { try { localStorage.setItem('stimming.serieslab.hex', JSON.stringify(state)); } catch (e) {} }
document.querySelectorAll('.styles button').forEach(b => b.addEventListener('click', () => { state.style = b.dataset.s; save(); render(); }));
render();
</script>
</body>
</html>
