<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Category icons lab</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
:root { --bg: oklch(0.16 0.012 275); --fg: oklch(0.95 0.008 275); --muted: oklch(0.6 0.02 275); --line: oklch(0.26 0.015 275); }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 "Gabarito", system-ui, sans-serif; }
body { padding: 24px 16px 60px; }
h1 { margin: 0; font-size: 20px; font-weight: 800; text-align: center; }
.lede { margin: 4px auto 26px; text-align: center; color: var(--muted); }
/* A row per category: three motifs, each large, small and in a divider. */
.row { display: grid; grid-template-columns: 150px repeat(3, minmax(0, 1fr)); gap: 14px; max-width: 980px; margin: 0 auto; padding: 18px 0; border-top: 1px solid var(--line); align-items: center; }
.cat b { display: block; font-size: 16px; font-weight: 800; color: var(--c); }
.cat small { color: var(--muted); }
.cell { display: grid; justify-items: center; gap: 10px; padding: 14px 8px; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
.cell:hover { background: oklch(0.2 0.012 275); }
.cell.pick { background: color-mix(in oklch, var(--c) 14%, transparent); outline: 1.5px solid var(--c); outline-offset: -1.5px; }
.cell:focus-visible { outline: 2px solid oklch(0.84 0.13 205); outline-offset: 2px; }
.cell em { font-style: normal; font-size: 12px; color: var(--muted); }
.big { display: flex; align-items: flex-end; gap: 14px; }
.big svg:nth-child(1) { width: 96px; height: 96px; }
.big svg:nth-child(2) { width: 40px; height: 40px; }
.big svg:nth-child(3) { width: 24px; height: 24px; }
.dv { display: flex; align-items: center; gap: 10px; width: 100%; font-weight: 800; font-size: 16px; }
.dv svg { width: 30px; height: 30px; flex: none; }
.dv::after { content: ""; flex: 1; height: 1px; background: color-mix(in oklch, var(--c) 35%, transparent); }
.out { max-width: 980px; margin: 24px auto 0; }
.out code { display: block; padding: 10px 12px; background: oklch(0.12 0.01 275); border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
@media (max-width: 720px) { .row { grid-template-columns: 1fr 1fr 1fr; } .cat { grid-column: 1 / -1; } .big svg:nth-child(1) { width: 72px; height: 72px; } }
</style>
<body>
<h1>Category icons</h1>
<p class="lede">Outline hex, solid glyph cut with negative space. Three motifs each; tap to pick.</p>
<div id="sheet"></div>
<div class="out"><code id="out">{}</code></div>
<script type="module">
const CATS = [
  ['poke', 'Poke & pop', 'Prutsen', 'oklch(0.8 0.13 230)'],
  ['goo', 'Goo', 'Smurrie', 'oklch(0.84 0.2 135)'],
  ['light', 'Light & glass', 'Licht', 'oklch(0.87 0.12 195)'],
  ['science', 'Science fair', 'Wetenschapsbeurs', 'oklch(0.74 0.15 250)'],
  ['dark', 'After dark', 'Na donker', 'oklch(0.76 0.15 295)'],
  ['odd', 'Odd one out', 'Raar', 'oklch(0.84 0.17 330)'],
];

import { M, icon } from './icons.js';

const sheet = document.getElementById('sheet'), out = document.getElementById('out');
let picks = {};
try { picks = JSON.parse(localStorage.getItem('stimming.serieslab.icons3')) || {}; } catch (e) {}
function render() {
  sheet.replaceChildren();
  for (const [k, name, nl, c] of CATS) {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.setProperty('--c', c);
    row.innerHTML = `<div class="cat"><b>${name}</b><small>${nl}</small></div>`;
    M[k].forEach(([label, m], i) => {
      const cell = document.createElement('div');
      cell.className = 'cell' + (picks[k] === label ? ' pick' : '');
      cell.tabIndex = 0;
      cell.innerHTML = `<div class="big">${icon(m, c)}${icon(m, c)}${icon(m, c)}</div><em>${label}</em><div class="dv">${icon(m, c)}${name}</div>`;
      const pick = () => { picks[k] = picks[k] === label ? undefined : label; try { localStorage.setItem('stimming.serieslab.icons3', JSON.stringify(picks)); } catch (e) {} render(); };
      cell.addEventListener('click', pick);
      cell.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      row.append(cell);
    });
    sheet.append(row);
  }
  out.textContent = JSON.stringify(Object.fromEntries(Object.entries(picks).filter(([, v]) => v)));
}
render();
</script>
</body>
</html>
