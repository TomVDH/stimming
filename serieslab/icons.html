<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Category icons lab</title>
<meta name="color-scheme" content="dark">
<style>
@font-face { font-family: "Iosevka Term Slab"; font-weight: 500; font-display: swap; src: url(../shared/fonts/IosevkaTermSlab-Medium.woff2) format("woff2"); }
@font-face { font-family: "Iosevka Term Slab"; font-weight: 700; font-display: swap; src: url(../shared/fonts/IosevkaTermSlab-Bold.woff2) format("woff2"); }
:root { --bg: oklch(0.16 0.012 275); --fg: oklch(0.95 0.008 275); --muted: oklch(0.6 0.02 275); --line: oklch(0.28 0.015 275); --mono: "Iosevka Term Slab", ui-monospace, monospace; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--mono); }
body { padding: 20px 16px 60px; }
h1 { margin: 0 0 4px; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; text-align: center; }
p.lede { margin: 0 auto 22px; max-width: 60ch; text-align: center; color: var(--muted); }
/* One table: a row per category, a column per direction. */
.sheet { display: grid; max-width: 1240px; grid-template-columns: 140px repeat(5, minmax(128px, 1fr)); max-width: 1100px; margin: 0 auto; border-top: 1px solid var(--line); }
.sheet > * { border-bottom: 1px solid var(--line); padding: 16px 10px; }
.head { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-align: center; align-self: end; }
.cat { display: grid; align-content: center; gap: 2px; }
.cat b { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c); }
.cat small { color: var(--muted); }
/* Each cell: the icon large, then at header and tile sizes, then in a header. */
.cell { display: grid; justify-items: center; gap: 10px; cursor: pointer; border-radius: 10px; transition: background 0.2s; }
.cell:hover { background: oklch(0.2 0.012 275); }
.cell.pick { background: color-mix(in oklch, var(--c) 16%, transparent); outline: 1px solid var(--c); outline-offset: -1px; }
.sizes { display: flex; align-items: flex-end; gap: 12px; }
.sizes svg:nth-child(1) { width: 72px; height: 72px; }
.sizes svg:nth-child(2) { width: 32px; height: 32px; }
.sizes svg:nth-child(3) { width: 20px; height: 20px; }
.hdr { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c); }
.hdr svg { width: 22px; height: 22px; flex: none; }
.hdr::after { content: ""; flex: 1; height: 1px; background: color-mix(in oklch, var(--c) 35%, transparent); }
.out { max-width: 1100px; margin: 22px auto 0; display: grid; gap: 8px; }
.out code { display: block; padding: 10px 12px; background: oklch(0.12 0.01 275); border: 1px solid var(--line); border-radius: 8px; color: var(--muted); white-space: pre-wrap; }
@media (max-width: 760px) { .sheet { grid-template-columns: 110px repeat(5, 140px); overflow-x: auto; } }
</style>
<body>
<h1>Category icons</h1>
<p class="lede">Hex, round 2: four richer takes beside round 1. Tap a cell to pick it; the picks show below as JSON.</p>
<div class="sheet" id="sheet"></div>
<div class="out"><code id="out">{}</code></div>
<script type="module">
// The categories, their colours and their Flemish names.
const CATS = [
  ['poke', 'Poke & pop', 'Prutsen', 'oklch(0.8 0.12 230)'],
  ['goo', 'Goo', 'Smurrie', 'oklch(0.82 0.19 135)'],
  ['light', 'Light & glass', 'Licht', 'oklch(0.86 0.12 195)'],
  ['science', 'Science fair', 'Wetenschapsbeurs', 'oklch(0.74 0.14 250)'],
  ['dark', 'After dark', 'Na donker', 'oklch(0.74 0.14 295)'],
  ['odd', 'Odd one out', 'Raar', 'oklch(0.84 0.16 330)'],
  ['belgian', 'Belgian', 'Belgisch', 'oklch(0.8 0.15 72)'],
  ['maths', 'Maths class', 'Wiskundeles', 'oklch(0.74 0.18 345)'],
];
const SHADOW = 'oklch(0.07 0.01 260)', INK = 'oklch(0.16 0.012 275)', WHITE = 'oklch(0.97 0.01 90)';

// Each glyph is drawn in a 24 x 24 box.
// `f` fills the glyph, `hi` lights it, `ink` cuts details out of it.
const GLYPH = {
  // Bubble wrap: three domes with a glint, one popped flat.
  poke: (f, hi, ink) => `<circle cx="7" cy="7" r="4.8" fill="${f}"/><circle cx="17" cy="7" r="4.8" fill="${f}"/><circle cx="7" cy="17" r="4.8" fill="${f}"/>
    <path d="M5 5.2a2.6 2.6 0 0 1 2.6-1.4M15 5.2a2.6 2.6 0 0 1 2.6-1.4M5 15.2a2.6 2.6 0 0 1 2.6-1.4" stroke="${hi}" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M12.6 17.6L15 13.4L17.2 16.4L19.6 13L21.4 17.4L19 21.4L16.4 19.2L14 21.6Z" fill="${f}"/>`,
  // A slime drip with a wet highlight.
  goo: (f, hi, ink) => `<path d="M3 3H21V10.5L18.6 13V18.4L16.2 21.4L13.8 18.4V14.4L11.4 16.8L9 14.4V12.2L6.4 14.6L3 11.4Z" fill="${f}"/><path d="M5.5 5.5H12" stroke="${hi}" stroke-width="1.8" stroke-linecap="round"/><circle cx="16.2" cy="16.6" r="1" fill="${hi}"/>`,
  // A prism splitting one white ray into three colours.
  light: (f, hi, ink) => `<path d="M1.5 13.5L8 12.4" stroke="${hi}" stroke-width="1.8" stroke-linecap="round"/><path d="M10 3L17.5 20.5H2.5Z" fill="${f}"/><path d="M10 3L13 10L10 20.5H2.5Z" fill="${hi}" opacity="0.45"/>
    <path d="M16 11L23 7.5V10Z" fill="oklch(0.68 0.22 28)"/><path d="M16.4 12L23 11V13.6Z" fill="oklch(0.9 0.17 95)"/><path d="M16.8 13L23 14.6V17.2Z" fill="oklch(0.62 0.2 255)"/>`,
  // A flask with bubbling liquid.
  science: (f, hi, ink) => `<path d="M8.6 2H15.4V3.8H14.4V9L20.8 19.8V22H3.2V19.8L9.6 9V3.8H8.6Z" fill="${f}"/><path d="M6.6 15.6H17.4L19.6 19.6V20.4H4.4V19.6Z" fill="${ink}" opacity="0.35"/>
    <circle cx="10" cy="17.8" r="1.1" fill="${hi}"/><circle cx="13.4" cy="16.6" r="0.8" fill="${hi}"/><circle cx="12" cy="12.6" r="0.7" fill="${hi}"/>`,
  // A crescent moon over a small lit window.
  dark: (f, hi, ink) => `<path d="M12.5 2.5A9 9 0 1 0 21 16A7.6 7.6 0 0 1 12.5 2.5Z" fill="${f}"/><path d="M14.5 13H21V21H14.5Z" fill="${ink}" opacity="0.4"/><path d="M15.8 14.3H19.7V19.7H15.8Z" fill="oklch(0.88 0.15 85)"/><path d="M17.75 14.3V19.7M15.8 17H19.7" stroke="${ink}" stroke-width="0.8" opacity="0.6"/>`,
  // A tilted asterisk with one arm out of step.
  odd: (f, hi, ink) => `<g transform="rotate(14 12 12)"><path d="M10.4 2H13.6V9.2L19.8 5.6L21.4 8.4L15.2 12L21.4 15.6L19.8 18.4L13.6 14.8V22H10.4V14.8L4.2 18.4L2.6 15.6L8.8 12L2.6 8.4L4.2 5.6L10.4 9.2Z" fill="${f}"/></g><circle cx="12" cy="12" r="2" fill="${hi}"/>`,
  // A Belgian waffle with a dusting of sugar.
  belgian: (f, hi, ink) => `<g transform="rotate(-8 12 12)"><path d="M3 3H21V21H3Z" fill="${f}"/><path d="M9 3V21M15 3V21M3 9H21M3 15H21" stroke="${ink}" stroke-width="1.6" opacity="0.45"/><path d="M4.5 4.5h3M10.5 10.5h3M16.5 16.5h3M10.5 4.5h1.5" stroke="${hi}" stroke-width="1.4" stroke-linecap="round"/></g>`,
  // A plotted line climbing a grid.
  maths: (f, hi, ink) => `<path d="M3 3V21H21" stroke="${f}" stroke-width="2.2" fill="none" stroke-linecap="square"/><path d="M8 3V19M13 3V19M18 3V19M5 7H21M5 12H21M5 16H21" stroke="${f}" stroke-width="0.6" opacity="0.5"/><path d="M5.5 17L9.5 9L13 14L19 4.5" stroke="${hi}" stroke-width="2.6" fill="none" stroke-linejoin="miter"/><circle cx="19" cy="4.5" r="1.8" fill="${hi}"/>`,
};

// The hex outline, flat top and bottom faces, in a 40 x 40 box.
const HEX = 'M20 2L36 11V29L20 38L4 29V11Z';
const dark = c => `color-mix(in oklch, ${c} 62%, black)`;
const light = c => `color-mix(in oklch, ${c} 55%, white)`;

// Five hex directions: round 1 for reference, then four richer takes.
const DIRS = {
  // Round 1: a flat colour hex with an ink glyph.
  flat: (k, c) => `<svg viewBox="0 0 40 40"><path d="${HEX}" fill="${SHADOW}" transform="translate(2.5 1.5)"/><path d="${HEX}" fill="${c}"/><g transform="translate(8.5 8.5) scale(0.96)">${GLYPH[k](INK, INK, c)}</g></svg>`,
  // E · Enamel pin: a dark rim, a colour field, a white glyph with an ink drop.
  pin: (k, c) => `<svg viewBox="0 0 40 40"><path d="${HEX}" fill="${SHADOW}" transform="translate(2.5 1.5)"/><path d="${HEX}" fill="${INK}" stroke="${c}" stroke-width="2.4"/><path d="M20 5.6L33 13V27L20 34.4L7 27V13Z" fill="${c}" opacity="0.18"/>
    <g transform="translate(9.6 10.6) scale(0.88)">${GLYPH[k](SHADOW, SHADOW, SHADOW)}</g><g transform="translate(8.6 9.6) scale(0.88)">${GLYPH[k](WHITE, c, INK)}</g></svg>`,
  // F · Iso block: a hex prism, top face lit, two side faces shaded.
  iso: (k, c) => `<svg viewBox="0 0 40 40"><path d="M4 13L20 4L36 13V27L20 36L4 27Z" fill="${SHADOW}" transform="translate(2 2)"/><path d="M4 13V27L20 36V22Z" fill="${dark(c)}"/><path d="M36 13V27L20 36V22Z" fill="color-mix(in oklch, ${c} 78%, black)"/><path d="M4 13L20 4L36 13L20 22Z" fill="${c}"/>
    <g transform="translate(20 13) scale(0.62) matrix(0.94 0.54 -0.94 0.54 0 0) translate(-12 -12)">${GLYPH[k](INK, light(c), c)}</g></svg>`,
  // G · Faceted gem: the hex cut into a lit and a shaded half.
  gem: (k, c) => `<svg viewBox="0 0 40 40"><path d="${HEX}" fill="${SHADOW}" transform="translate(2.5 1.5)"/><path d="${HEX}" fill="${dark(c)}"/><path d="M20 2L36 11V29L20 20Z M4 11L20 2V20L4 29Z" fill="${c}"/><path d="M20 2L36 11L20 20L4 11Z" fill="${light(c)}" opacity="0.45"/>
    <g transform="translate(9.5 10) scale(0.88)">${GLYPH[k](SHADOW, SHADOW, SHADOW)}</g><g transform="translate(8.5 9) scale(0.88)">${GLYPH[k](INK, WHITE, c)}</g></svg>`,
  // H · Ring: a thick colour outline, the glyph in full colour inside.
  ring: (k, c) => `<svg viewBox="0 0 40 40"><path d="${HEX}" fill="none" stroke="${SHADOW}" stroke-width="3.6" transform="translate(2 1.5)"/><path d="${HEX}" fill="${INK}" stroke="${c}" stroke-width="3.6"/>
    <g transform="translate(9 9.5) scale(0.9)">${GLYPH[k](c, WHITE, INK)}</g></svg>`,
};
const NAMES = { flat: 'Round 1 · Flat hex', pin: 'E · Enamel pin', iso: 'F · Iso block', gem: 'G · Faceted gem', ring: 'H · Ring' };

const sheet = document.getElementById('sheet'), out = document.getElementById('out');
let picks = {};
try { picks = JSON.parse(localStorage.getItem('stimming.serieslab.icons')) || {}; } catch (e) {}
sheet.insertAdjacentHTML('beforeend', '<div></div>' + Object.values(NAMES).map(n => `<div class="head">${n}</div>`).join(''));
for (const [k, name, nl, c] of CATS) {
  sheet.insertAdjacentHTML('beforeend', `<div class="cat" style="--c:${c}"><b>${name}</b><small>${nl}</small></div>`);
  for (const d of Object.keys(DIRS)) {
    const svg = DIRS[d](k, c);
    const cell = document.createElement('div');
    cell.className = 'cell' + (picks[k] === d ? ' pick' : '');
    cell.style.setProperty('--c', c);
    cell.dataset.k = k;
    cell.dataset.d = d;
    cell.innerHTML = `<div class="sizes">${svg}${svg}${svg}</div><div class="hdr">${svg}${name}</div>`;
    cell.addEventListener('click', () => {
      picks[k] = picks[k] === d ? undefined : d;
      sheet.querySelectorAll(`.cell[data-k="${k}"]`).forEach(x => x.classList.toggle('pick', picks[k] === x.dataset.d));
      show();
    });
    sheet.append(cell);
  }
}
function show() {
  const clean = Object.fromEntries(Object.entries(picks).filter(([, v]) => v));
  out.textContent = JSON.stringify(clean);
  try { localStorage.setItem('stimming.serieslab.icons', JSON.stringify(clean)); } catch (e) {}
}
show();
</script>
</body>
</html>
