<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Series dividers lab</title>
<meta name="color-scheme" content="dark">
<style>
html, body { margin: 0; background: oklch(0.16 0.012 275); }
/* The real menu runs in the frame, so every icon and hover still works. */
iframe { display: block; width: 100%; border: 0; }
/* The round switch: one divider style at a time, on the same menu. */
.rounds { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 12px 16px; background: color-mix(in oklch, oklch(0.16 0.012 275) 92%, transparent); backdrop-filter: blur(8px); }
.rounds button { font: 600 13px/1 "Gabarito", system-ui, sans-serif; color: oklch(0.6 0.02 275); background: none; border: 1px solid oklch(0.32 0.02 275); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
.rounds button[aria-pressed="true"] { color: oklch(0.16 0.012 275); background: oklch(0.95 0.008 275); border-color: oklch(0.95 0.008 275); }
.rounds button:focus-visible { outline: 2px solid oklch(0.84 0.13 205); outline-offset: 3px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<body>
<div class="rounds" role="group" aria-label="Divider style">
  <button type="button" data-r="5">5 · Demure</button>
  <button type="button" data-r="1">1 · Personality</button>
  <button type="button" data-r="2">2 · Big outline</button>
  <button type="button" data-r="3">3 · Sticker</button>
  <button type="button" data-r="4">4 · Ticker band</button>
</div>
<script type="module">
// The categories: key, name, Flemish name, colour, and the toys on the main shelf.
const CATS = [
  ['poke', 'Poke & pop', 'Prutsen', 'oklch(0.8 0.13 230)', ['pop', 'fidget', 'pins', 'eyes', 'domino', 'magnet', 'soap', 'balloons']],
  ['goo', 'Goo', 'Smurrie', 'oklch(0.84 0.2 135)', ['putty', 'ferro', 'lava', 'ink', 'morpher', 'bubbles']],
  ['light', 'Light & glass', 'Licht', 'oklch(0.87 0.12 195)', ['prism', 'kaleido', 'glass', 'rain', 'neon', 'fire', 'pool']],
  ['science', 'Science fair', 'Wetenschapsbeurs', 'oklch(0.74 0.15 250)', ['chladni', 'pendulum', 'scope', 'chamber', 'vortex', 'walker']],
  ['dark', 'After dark', 'Na donker', 'oklch(0.76 0.15 295)', ['galaxy', 'trails', 'sonar', 'window', 'windmap', 'tvtree']],
  ['odd', 'Odd one out', 'Raar', 'oklch(0.84 0.17 330)', ['shadyos']],
];
const SHADOW = 'oklch(0.07 0.01 260)', INK = 'oklch(0.17 0.014 275)';

// Each glyph sits on a 24 x 24 grid; one ink colour, one highlight colour.
const GLYPH = {
  // Bubble wrap: three domes with glints, the fourth popped flat.
  poke: hi => `<circle cx="7" cy="7" r="5" fill="${INK}"/><circle cx="17" cy="7" r="5" fill="${INK}"/><circle cx="7" cy="17" r="5" fill="${INK}"/>
    <path d="M4.6 5.6a2.8 2.8 0 0 1 2.4-1.8M14.6 5.6a2.8 2.8 0 0 1 2.4-1.8M4.6 15.6a2.8 2.8 0 0 1 2.4-1.8" stroke="${hi}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M12.4 17.4L14.8 13L17 15.8L19.6 12.6L21.6 17L19.2 21.6L16.6 19.4L14 21.8Z" fill="${INK}"/>`,
  // A slime blob with two eyes, mid-wobble.
  goo: hi => `<path d="M3.6 20.5C1.6 20.5 1.2 17.6 2.8 16.2C2 13 4 9.2 7.2 8.2C8.2 4.2 13.4 2.6 16.4 5.2C20 5.4 22.4 9.4 21.2 13.2C23.2 15.4 22.6 20.5 19.4 20.5Z" fill="${INK}"/>
    <ellipse cx="9.4" cy="13.4" rx="2.3" ry="2.6" fill="${hi}"/><ellipse cx="15.4" cy="12.8" rx="2.3" ry="2.6" fill="${hi}"/><circle cx="9.9" cy="14" r="1.1" fill="${INK}"/><circle cx="15.9" cy="13.4" r="1.1" fill="${INK}"/>`,
  // A prism throwing one white ray into three colours.
  light: hi => `<path d="M0.8 14.2L8 12.6" stroke="${INK}" stroke-width="2" stroke-linecap="round"/><path d="M10 2.6L18 21H2Z" fill="${INK}"/><path d="M10 7.4L14.4 17.8H5.6Z" fill="${hi}" opacity="0.35"/>
    <path d="M16.2 10.8L23.6 7.4V10.2Z" fill="oklch(0.66 0.23 28)"/><path d="M16.6 11.9L23.6 11V13.8Z" fill="oklch(0.9 0.18 95)"/><path d="M17 13L23.6 14.6V17.4Z" fill="oklch(0.6 0.21 258)"/>`,
  // A flask with three bubbles rising.
  science: hi => `<path d="M8.4 1.8H15.6V3.8H14.6V8.8L21 19.6V22.2H3V19.6L9.4 8.8V3.8H8.4Z" fill="${INK}"/><path d="M6.4 15.2H17.6L19.8 19.2V20.2H4.2V19.2Z" fill="${hi}" opacity="0.5"/>
    <circle cx="10" cy="17.6" r="1.2" fill="${INK}"/><circle cx="13.8" cy="16.6" r="0.9" fill="${INK}"/><circle cx="12.4" cy="12.4" r="0.9" fill="${hi}"/>`,
  // A crescent moon and a four-point star.
  dark: hi => `<path d="M13.4 2.2A9.6 9.6 0 1 0 21.8 16.6A8 8 0 0 1 13.4 2.2Z" fill="${INK}"/><path d="M18.6 2.4L19.6 5L22.2 6L19.6 7L18.6 9.6L17.6 7L15 6L17.6 5Z" fill="${INK}"/><circle cx="9" cy="15" r="1.3" fill="${hi}" opacity="0.6"/><circle cx="11.6" cy="19" r="0.8" fill="${hi}" opacity="0.6"/>`,
  // A tilted asterisk with a lit centre.
  odd: hi => `<g transform="rotate(14 12 12)"><path d="M10.3 1.6H13.7V9.1L20.2 5.3L21.9 8.3L15.4 12L21.9 15.7L20.2 18.7L13.7 14.9V22.4H10.3V14.9L3.8 18.7L2.1 15.7L8.6 12L2.1 8.3L3.8 5.3L10.3 9.1Z" fill="${INK}"/></g><circle cx="12" cy="12" r="2.2" fill="${hi}"/>`,
};

// Demure glyphs: plain solid shapes on a 24 x 24 grid, filled in one colour.
const SOLID = {
  // Bubble wrap: three domes and one popped ring.
  poke: f => `<circle cx="7" cy="7" r="4.6" fill="${f}"/><circle cx="17" cy="7" r="4.6" fill="${f}"/><circle cx="7" cy="17" r="4.6" fill="${f}"/><circle cx="17" cy="17" r="3.6" fill="none" stroke="${f}" stroke-width="2"/>`,
  // A single drop over a small puddle.
  goo: f => `<path d="M12 1.8C12 1.8 5 10 5 14.4a7 7 0 0 0 14 0C19 10 12 1.8 12 1.8Z" fill="${f}"/><path d="M3 22.2H21" stroke="${f}" stroke-width="2.2" stroke-linecap="round"/>`,
  // A prism and its three rays.
  light: f => `<path d="M9.5 3L17 20H2Z" fill="${f}"/><path d="M17.4 10.4L23 7.6M17.8 12.6L23 12.6M17.4 14.8L23 17.6" stroke="${f}" stroke-width="2" stroke-linecap="round"/>`,
  // A flask.
  science: f => `<path d="M8.6 1.8H15.4V3.8H14.4V8.8L20.8 19.8V22.2H3.2V19.8L9.6 8.8V3.8H8.6Z" fill="${f}"/>`,
  // A crescent and one small star.
  dark: f => `<path d="M13.2 2.2A9.6 9.6 0 1 0 21.8 16.6A8 8 0 0 1 13.2 2.2Z" fill="${f}"/><path d="M19 2.6L19.9 4.9L22.2 5.8L19.9 6.7L19 9L18.1 6.7L15.8 5.8L18.1 4.9Z" fill="${f}"/>`,
  // The asterisk Tom picked.
  odd: f => `<g transform="rotate(14 12 12)"><path d="M10.3 1.6H13.7V9.1L20.2 5.3L21.9 8.3L15.4 12L21.9 15.7L20.2 18.7L13.7 14.9V22.4H10.3V14.9L3.8 18.7L2.1 15.7L8.6 12L2.1 8.3L3.8 5.3L10.3 9.1Z" fill="${f}"/></g>`,
};
// The demure hex: a thin outline in the colour, the glyph filled in the same colour.
const hexLine = (k, c) => `<svg class="demure" viewBox="0 0 42 42" aria-hidden="true"><path d="M21 3L37 12V30L21 39L5 30V12Z" fill="color-mix(in oklch, ${c} 8%, transparent)" stroke="${c}" stroke-width="2" stroke-linejoin="round"/><g transform="translate(11.4 11.4) scale(0.8)">${SOLID[k](c)}</g></svg>`;

// The hex: a hard shadow, a colour face, a lit top rim and a shaded foot.
const HEX = 'M20 2L36 11V29L20 38L4 29V11Z';
const hexIcon = (k, c) => `<svg viewBox="0 0 42 42" aria-hidden="true"><path d="${HEX}" fill="${SHADOW}" transform="translate(3 2.5)"/><path d="${HEX}" fill="${c}"/>
  <path d="M4.8 11.5L20 2.9L35.2 11.5" stroke="color-mix(in oklch, ${c} 45%, white)" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
  <path d="M35.2 28.5L20 37.1L4.8 28.5" stroke="color-mix(in oklch, ${c} 60%, black)" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
  <g transform="translate(8 8)">${GLYPH[k](`color-mix(in oklch, ${c} 35%, white)`)}</g></svg>`;

// Splits a word into letter spans, so each letter can lean on its own.
const letters = s => [...s].map((ch, i) => ch === ' ' ? '<i class="sp"> </i>' : `<b style="--i:${i}">${ch === '&' ? '&amp;' : ch}</b>`).join('');

const CSS = `
.dv { --c: white; position: relative; display: flex; align-items: center; gap: 14px; margin: 0 0 22px; width: 100%; }
.dv svg { width: 46px; height: 46px; flex: none; transition: rotate 0.4s cubic-bezier(.3,1.6,.5,1); }
.dv:hover svg { rotate: -12deg; }
.dv .meta { font: 700 13px/1 "Gabarito", system-ui, sans-serif; letter-spacing: 0.04em; color: var(--muted); white-space: nowrap; }
.dv .rule { flex: 1; height: 2px; min-width: 24px; background: repeating-linear-gradient(90deg, color-mix(in oklch, var(--c) 55%, transparent) 0 8px, transparent 8px 14px); }
.wm { display: inline-flex; align-items: baseline; color: var(--c); font: 900 clamp(28px, 5.2vw, 46px)/1 "Gabarito", system-ui, sans-serif; letter-spacing: -0.02em; white-space: nowrap; }
.wm b { display: inline-block; font-weight: inherit; }
.wm .sp { display: inline-block; width: 0.42em; }

/* Poke & pop: puffy letters that sit at odd angles and pop on hover. */
.wm--poke b { color: color-mix(in oklch, var(--c) 30%, white); -webkit-text-stroke: 0.09em var(--c); paint-order: stroke fill; text-shadow: 0 0.08em 0 color-mix(in oklch, var(--c) 55%, black); rotate: calc((mod(var(--i), 3) - 1) * 6deg); translate: 0 calc((mod(var(--i), 2) - 0.5) * 0.08em); transition: scale 0.25s cubic-bezier(.3,1.8,.5,1); }
.dv:hover .wm--poke b:nth-child(odd) { scale: 1.18; }

/* Goo: heavy letters that drip. */
.wm--goo { position: relative; letter-spacing: -0.05em; filter: drop-shadow(0 0.06em 0 color-mix(in oklch, var(--c) 50%, black)); }
.wm--goo b { position: relative; }
.wm--goo b::after { content: ""; position: absolute; left: calc(30% + var(--i) * 9%); top: 82%; width: 0.16em; height: calc(0.22em + var(--i) * 0.07em); background: var(--c); border-radius: 0 0 0.1em 0.1em; animation: drip 3.2s ease-in-out calc(var(--i) * -0.7s) infinite alternate; }
@keyframes drip { from { transform: scaleY(0.4); transform-origin: top; } to { transform: scaleY(1.25); transform-origin: top; } }

/* Light & glass: white type split into colour fringes, like a prism. */
.wm--light { color: oklch(0.98 0.01 90); font-family: "B612", sans-serif; font-weight: 700; letter-spacing: 0.02em; text-shadow: -0.05em 0 oklch(0.66 0.23 28 / 0.85), 0.05em 0 oklch(0.6 0.21 258 / 0.85), 0 0 0.4em color-mix(in oklch, var(--c) 70%, transparent); }

/* Science fair: a slab stamp, struck at an angle. */
.wm--science { font: 900 clamp(22px, 4vw, 34px)/1 "Gabarito", system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.22em 0.5em 0.18em; border: 0.11em double var(--c); rotate: -3deg; background: color-mix(in oklch, var(--c) 10%, transparent); }

/* After dark: a neon tube with one tired letter. */
.wm--dark { color: color-mix(in oklch, var(--c) 30%, white); font-weight: 500; font-style: italic; letter-spacing: 0.01em; text-shadow: 0 0 0.06em white, 0 0 0.25em var(--c), 0 0 0.6em var(--c), 0 0 1.2em color-mix(in oklch, var(--c) 60%, transparent); }
.wm--dark b:nth-child(3) { animation: tired 4.5s steps(1) infinite; }
@keyframes tired { 0%, 62%, 66%, 70%, 100% { opacity: 1; } 64%, 68% { opacity: 0.25; text-shadow: none; } }

/* Odd one out: a ransom note, no two letters alike. */
.wm--odd b { padding: 0.04em 0.07em; margin: 0 0.02em; rotate: calc((mod(var(--i) * 7, 5) - 2) * 4deg); }
.wm--odd b:nth-child(4n+1) { font-family: "B612", sans-serif; font-weight: 700; background: var(--c); color: oklch(0.17 0.014 275); }
.wm--odd b:nth-child(4n+2) { font-family: "Gabarito", sans-serif; font-weight: 500; font-size: 0.8em; color: var(--c); border: 0.06em solid var(--c); }
.wm--odd b:nth-child(4n+3) { font-weight: 400; font-style: italic; font-size: 1.12em; color: oklch(0.95 0.008 275); }
.wm--odd b:nth-child(4n) { background: oklch(0.95 0.008 275); color: oklch(0.17 0.014 275); font-size: 0.9em; }

/* Round 2: one huge outlined word; the icon sits over its first letter. */
html[data-r="2"] .dv { gap: 0; margin-bottom: 18px; }
html[data-r="2"] .dv svg { width: 54px; height: 54px; position: relative; z-index: 1; margin-right: -14px; }
html[data-r="2"] .wm { all: unset; font: 900 clamp(40px, 8vw, 84px)/0.9 "Gabarito", system-ui, sans-serif; letter-spacing: -0.04em; color: transparent; -webkit-text-stroke: 2px var(--c); white-space: nowrap; }
html[data-r="2"] .wm b, html[data-r="2"] .wm i { all: unset; }
html[data-r="2"] .wm b::after { display: none; }
html[data-r="2"] .dv .rule { display: none; }
html[data-r="2"] .dv .meta { margin-left: auto; align-self: flex-end; padding-bottom: 6px; }
/* Round 3: the name on a tilted colour sticker with a hard shadow. */
html[data-r="3"] .wm { all: unset; display: inline-block; padding: 0.2em 0.5em 0.24em; font: 900 clamp(22px, 3.6vw, 32px)/1 "Gabarito", system-ui, sans-serif; letter-spacing: -0.01em; color: oklch(0.17 0.014 275); background: var(--c); box-shadow: 0.18em 0.18em 0 oklch(0.07 0.01 260); rotate: -2.5deg; white-space: nowrap; }
html[data-r="3"] .wm b, html[data-r="3"] .wm i { all: unset; }
html[data-r="3"] .wm b::after { display: none; }
html[data-r="3"] .dv .rule { background: color-mix(in oklch, var(--c) 40%, transparent); height: 2px; }
/* Round 4: a full-width band in the category colour, the name running along it. */
html[data-r="4"] .dv { gap: 0; padding: 0; background: color-mix(in oklch, var(--c) 16%, transparent); border-block: 2px solid var(--c); overflow: hidden; }
html[data-r="4"] .dv svg { width: 50px; height: 50px; margin: 6px 12px 6px 10px; position: relative; z-index: 1; }
html[data-r="4"] .wm { all: unset; flex: 1; overflow: hidden; white-space: nowrap; font: 900 clamp(22px, 3.4vw, 30px)/1 "Gabarito", system-ui, sans-serif; letter-spacing: 0.01em; text-transform: uppercase; color: var(--c); mask: linear-gradient(90deg, transparent, #000 4%, #000 92%, transparent); }
html[data-r="4"] .wm b, html[data-r="4"] .wm i { all: unset; }
html[data-r="4"] .wm b::after { display: none; }
html[data-r="4"] .wm .run { display: inline-block; animation: run 26s linear infinite; }
html[data-r="4"] .wm .run span { padding-right: 0.9em; }
html[data-r="4"] .wm .run span:nth-child(even) { color: transparent; -webkit-text-stroke: 1.5px var(--c); }
@keyframes run { to { transform: translateX(-50%); } }
html[data-r="4"] .dv .rule { display: none; }
html[data-r="4"] .dv .meta { padding: 0 14px; color: var(--c); }
html:not([data-r="4"]) .wm .run { display: none; }
html[data-r="4"] .wm > b, html[data-r="4"] .wm > i { display: none; }
/* Round 5, demure: an outline hex, the name in plain heavy type, a quiet rule. */
html:not([data-r="5"]) .dv svg.demure { display: none; }
html[data-r="5"] .dv svg:not(.demure) { display: none; }
html[data-r="5"] .dv { gap: 12px; margin-bottom: 20px; }
html[data-r="5"] .dv svg.demure { width: 34px; height: 34px; }
html[data-r="5"] .dv:hover svg.demure { rotate: 30deg; }
html[data-r="5"] .wm { all: unset; font: 800 clamp(20px, 2.6vw, 26px)/1 "Gabarito", system-ui, sans-serif; letter-spacing: -0.01em; color: var(--fg); white-space: nowrap; }
html[data-r="5"] .wm b, html[data-r="5"] .wm i { all: unset; }
html[data-r="5"] .wm b::after, html[data-r="5"] .wm .run { display: none; }
html[data-r="5"] .dv .rule { height: 1px; background: color-mix(in oklch, var(--c) 35%, transparent); }
html[data-r="5"] .dv .meta { font-weight: 600; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { html[data-r="4"] .wm .run { animation: none; } }
@media (prefers-reduced-motion: reduce) { .wm b, .wm b::after, .dv svg { animation: none !important; transition: none !important; } }
@media (max-width: 560px) { .dv { flex-wrap: wrap; gap: 8px 12px; } .dv .rule { flex-basis: 100%; order: 3; } .dv svg { width: 38px; height: 38px; } }

.sec { width: 100%; max-width: calc(6 * 150px + 5 * 28px); justify-self: center; }
.sec + .sec { margin-top: clamp(36px, 6vw, 64px); }
.sec .shelf { max-width: none; margin: 0; }
.shelf > li { opacity: 1 !important; transform: none !important; }`;

const frame = Object.assign(document.createElement('iframe'), { src: '../index.html', title: 'Menu' });
document.body.append(frame);
await new Promise(r => frame.addEventListener('load', r, { once: true }));
const d = frame.contentDocument;
d.head.append(Object.assign(d.createElement('style'), { textContent: CSS }));
const shelf = d.querySelector('main > .shelf'), tiles = [...shelf.children];
const byId = new Map(tiles.map(li => [li.querySelector('a.toy')?.id, li]));
const placed = new Set();
for (const [k, name, nl, c, ids] of CATS) {
  const sec = d.createElement('section');
  sec.className = 'sec';
  const n = ids.filter(id => byId.has(id)).length;
  sec.innerHTML = `<div class="dv" style="--c:${c}">${hexLine(k, c)}${hexIcon(k, c)}<span class="wm wm--${k}" aria-label="${name}">${letters(name)}<span class="run" aria-hidden="true">${Array(12).fill(`<span>${name.replace('&', '&amp;')}</span>`).join('')}</span></span><span class="rule"></span><span class="meta">${nl} · ${n}</span></div>`;
  const ul = Object.assign(d.createElement('ul'), { className: 'shelf' });
  for (const id of ids) if (byId.has(id)) { ul.append(byId.get(id)); placed.add(id); }
  sec.append(ul);
  shelf.before(sec);
}
// Anything not placed stays in the old shelf, so nothing goes missing.
shelf.hidden = ![...byId.keys()].some(id => !placed.has(id));
const fit = () => { frame.style.height = d.documentElement.scrollHeight + 'px'; };
const setRound = r => {
  d.documentElement.dataset.r = r;
  document.querySelectorAll('.rounds button').forEach(b => b.setAttribute('aria-pressed', b.dataset.r === r));
  try { localStorage.setItem('stimming.serieslab.round', r); } catch (e) {}
  requestAnimationFrame(fit);
};
document.querySelectorAll('.rounds button').forEach(b => b.addEventListener('click', () => setRound(b.dataset.r)));
let saved = '5';
try { saved = localStorage.getItem('stimming.serieslab.round') || '5'; } catch (e) {}
setRound(new URLSearchParams(location.search).get('r') || saved);
new ResizeObserver(fit).observe(d.documentElement);
fit();
</script>
</body>
</html>
