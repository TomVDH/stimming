<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Depth icon</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
@font-face { font-family: "Iosevka Term Slab"; font-weight: 500; font-display: swap; src: url(../shared/fonts/IosevkaTermSlab-Medium.woff2) format("woff2"); }
:root { --bg: oklch(0.16 0.012 275); --fg: oklch(0.95 0.008 275); --muted: oklch(0.6 0.02 275); --mono: "Iosevka Term Slab", ui-monospace, monospace; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: "Gabarito", system-ui, sans-serif; }
main { box-sizing: border-box; max-width: 900px; margin: 0 auto; padding: clamp(28px, 6vw, 72px) 16px 80px; display: grid; justify-items: center; gap: clamp(36px, 6vw, 64px); }
/* The icon at three sizes: to play with, as a tile, and as it sits in a divider. */
.sizes { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: clamp(24px, 6vw, 64px); }
.sizes span.icon { flex: none; }
/* The two pictures the shader reads. */
.maps { display: grid; grid-template-columns: repeat(2, minmax(0, 220px)); gap: 20px; }
.maps figure { margin: 0; display: grid; gap: 8px; justify-items: center; }
.maps img { display: block; width: 100%; border-radius: 12px; }
figcaption { font: 500 11px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
</style>
<body>
<main>
  <div class="sizes">
    <span class="icon" style="width: min(72vw, 320px); height: min(72vw, 320px)"></span>
    <span class="icon" style="width: 128px; height: 128px"></span>
    <span class="icon" style="width: 64px; height: 64px"></span>
  </div>
  <div class="maps">
    <figure><img id="col" alt="The colour picture"><figcaption>Colour</figcaption></figure>
    <figure><img id="dep" alt="The depth map: white is near"><figcaption>Depth</figcaption></figure>
  </div>
</main>
<script type="module">
import { vista, mountDepth } from '../shared/series/depth.js';
import { shotIcon, tiltShots } from '../shared/series/shots.js';

const scene = vista();
const uri = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
document.getElementById('col').src = uri(scene.color);
document.getElementById('dep').src = uri(scene.depth);
for (const host of document.querySelectorAll('.icon')) {
  // Where WebGL2 is missing, the layered icon stands in.
  if (!(await mountDepth(host, scene))) host.innerHTML = shotIcon('vistas', 'Vista', {});
}
tiltShots(document);
</script>
</body>
</html>
