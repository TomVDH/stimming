<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Series categories proposal</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<style>
@font-face { font-family: "Iosevka Term Slab"; font-weight: 500; font-display: swap; src: url(../shared/fonts/IosevkaTermSlab-Medium.woff2) format("woff2"); }
:root { --bg: oklch(0.16 0.012 275); --fg: oklch(0.95 0.008 275); --muted: oklch(0.6 0.02 275); --mono: "Iosevka Term Slab", ui-monospace, monospace; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Gabarito", system-ui, sans-serif; }
/* The real menu runs in the frame, so every icon and hover still works. */
iframe { display: block; width: 100%; border: 0; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; padding: 12px 16px; background: color-mix(in oklch, var(--bg) 92%, transparent); backdrop-filter: blur(8px); }
.bar span { font: 500 11px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.bar button { font: 600 13px/1 "Gabarito", system-ui, sans-serif; color: var(--muted); background: none; border: 1px solid oklch(0.32 0.02 275); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
.bar button[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
.bar button:focus-visible { outline: 2px solid oklch(0.84 0.13 205); outline-offset: 3px; }
/* The count table: each series and its toys on each shelf. */
table { margin: 8px auto 4px; border-collapse: collapse; font: 500 12px/1.3 var(--mono); letter-spacing: 0.04em; }
td, th { padding: 4px 14px; text-align: left; }
th { color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; font-size: 10px; }
td:nth-child(n+2), th:nth-child(n+2) { text-align: right; }
td i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: var(--c); }
td em { font-style: normal; color: var(--muted); }
</style>
<body>
<div class="bar" role="group" aria-label="Shelf"><span>Shelf</span>
  <button type="button" data-v="main">Main shelf</button>
  <button type="button" data-v="lab">Lab</button>
</div>
<table id="counts"></table>
<script type="module">
import { shotIcon } from '../shared/series/shots.js';
import { PROPOSED, ORDER, seriesOf } from './proposal.js';

// The frame's own styles cover the Lab; the main shelf needs the same rules.
const CSS = `
.sec { --c: var(--muted); display: grid; grid-template-columns: repeat(auto-fill, clamp(96px, 26vw, 150px)); justify-content: center; gap: clamp(16px, 2.6vw, 28px) clamp(12px, 2.4vw, 28px); width: 100%; max-width: calc(6 * 150px + 5 * 28px); justify-self: center; }
.lab .sec { max-width: calc(5 * 150px + 4 * 28px); }
.sec + .sec { margin-top: clamp(20px, 3.4vw, 40px); }
.sec > .shelf { display: contents; }
.sec-hd .ct { font: 500 12px/1 "Iosevka Term Slab", ui-monospace, monospace; letter-spacing: 0.06em; color: var(--muted); margin-left: 2px; }
`;

const series = { ...(await fetch('../series.json').then(r => r.json())), ...PROPOSED };
const frame = document.createElement('iframe');
frame.title = 'Menu';
document.body.append(frame);
const fit = d => { const end = Math.max(...[...d.body.children].map(el => el.getBoundingClientRect().bottom)); frame.style.height = Math.ceil(end + 32) + 'px'; };

async function show(view) {
  document.querySelectorAll('.bar button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === view));
  try { localStorage.setItem('stimming.serieslab.catview', view); } catch (e) {}
  frame.src = view === 'lab' ? '../index.html?lab' : '../index.html';
  await new Promise(r => frame.addEventListener('load', r, { once: true }));
  const d = frame.contentDocument;
  // The menu sorts its own Lab first; this page waits, then sorts again.
  for (let i = 0; i < 40 && d.documentElement.dataset.sections; i++) await new Promise(r => setTimeout(r, 50));
  d.head.append(Object.assign(d.createElement('style'), { textContent: CSS }));
  const home = d.querySelector(view === 'lab' ? '.lab' : 'main');
  const tiles = [...d.querySelectorAll(view === 'lab' ? '.lab .shelf > li' : 'main > .shelf > li')];
  const old = [...d.querySelectorAll(view === 'lab' ? '.lab .sec, .lab > .shelf' : 'main > .shelf')];
  const groups = new Map(ORDER.map(k => [k, []]));
  const rest = [];
  for (const li of tiles) (groups.get(seriesOf(li.querySelector('a.toy')?.id)) || rest).push(li);
  const before = old[0];
  const add = (label, c, head, list) => {
    const sec = d.createElement('section');
    sec.className = 'sec';
    if (c) sec.style.setProperty('--c', c);
    sec.setAttribute('aria-label', label);
    const ul = Object.assign(d.createElement('ul'), { className: 'shelf' });
    ul.append(...list);
    sec.innerHTML = head;
    sec.append(ul);
    before.before(sec);
  };
  for (const [k, list] of groups) {
    if (!list.length) continue;
    const s = series[k];
    add(s.name, s.color, `<h2 class="sec-hd"><span class="at">${shotIcon(k, s.icon, { tilt: 'Dutch', frame: 'Hex ring', line: 'Series', c: s.color })}<span>${s.name.replace('&', '&amp;')}</span><span class="ct">${list.length}</span></span></h2>`, list);
  }
  if (rest.length) add('Other toys', null, '', rest);
  old.forEach(el => el.remove());
  new ResizeObserver(() => fit(d)).observe(d.documentElement);
  fit(d);
}

// The count table: how many toys each series holds on each shelf.
const MAIN = new Set(['morpher', 'pop', 'fidget', 'domino', 'pins', 'galaxy', 'prism', 'kaleido', 'ferro', 'neon', 'magnet', 'soap', 'glass', 'chladni', 'pendulum', 'pool', 'putty', 'scope', 'walker', 'fire', 'rain', 'tvtree', 'balloons', 'bubbles', 'lava', 'eyes', 'sonar', 'trails', 'shadyos', 'window', 'chamber', 'ink', 'windmap', 'vortex', 'dijkstra', 'fireworks', 'launch', 'frietkot', 'railgun', 'trainride', 'foghorn']);
const { SORT } = await import('./proposal.js');
document.getElementById('counts').innerHTML = `<tr><th>Series</th><th>Main</th><th>Lab</th></tr>` + ORDER.map(k => {
  const m = SORT[k].filter(id => MAIN.has(id)).length;
  return `<tr><td style="--c:${series[k].color}"><i></i>${series[k].name.replace('&', '&amp;')}${PROPOSED[k] ? ' <em>new</em>' : ''}</td><td>${m || '<em>0</em>'}</td><td>${SORT[k].length - m || '<em>0</em>'}</td></tr>`;
}).join('');

document.querySelectorAll('.bar button').forEach(b => b.addEventListener('click', () => show(b.dataset.v)));
let saved = 'main';
try { saved = localStorage.getItem('stimming.serieslab.catview') || 'main'; } catch (e) {}
const asked = new URLSearchParams(location.search).get('v');
show(asked === 'lab' || asked === 'main' ? asked : saved);
</script>
</body>
</html>
