<body>

      <p class="fail" hidden>Calaeno needs WebGL 2, which this browser has turned off.</p>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FLARE, flareSlots, flareAt } from '../shared/flare.js';
import { GRADE } from '../shared/grade.js';
import { initPage, whenVisible, reduced, onReducedChange } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import { detail } from '../shared/detail.js';
import { AIR, AIR_U, setTime } from './air.js';
import { bakeVol, makeTrail } from './trail.js';
// The cloud noise is Window seat's own: its deck is ported below.
import { bakeNoise } from '../window/noise3d.js';
import { CRAFT, makeCraft, makeEscort } from './craft.js';

const rad = THREE.MathUtils.degToRad, deg = THREE.MathUtils.radToDeg, clamp = THREE.MathUtils.clamp, sstep = THREE.MathUtils.smoothstep;
const q = new URLSearchParams(location.search);
const store = {
  get(k) { try { return localStorage.getItem(`stimming.calaeno.${k}`); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(`stimming.calaeno.${k}`, String(v)); } catch { /* storage off */ } },
};

/* ---------- views: four fixed pictures ---------- */
// Each place is in the craft's own frame: metres right, up and back.
// eye is the camera; aim is where it looks; lens is degrees across the frame's short side.
// sun is the point the sun stands behind, as the camera sees it.
// alt holds the heights of the wisps, the heaps and the scud; 0 turns a layer off.
// fill is how much of the heap layer is cloud.
// cloud is the raymarched volume: its base, its tallest top, its share of cloud; null turns it off.
// A fourth number sets one deck unit in metres: small for a narrow view from far below.
// mid is a thin middle layer: its base and top in metres. No view sets it yet:
// the march's steps are too long for so thin a sheet, and it shows as stipple.
// sites are the cloud mountains: metres right, metres back, reach, height share.
// The volume draws behind the craft; a corridor in it keeps every sight line clear.
const VIEWS = {
  // From the ground, far below and behind: the contrails cross the sun.
  // Its cloud stands above the craft, so the craft stays in front of it.
  below: { label: 'Below', eye: [3545, -17998, 11606], aim: [0, 0, 900], lens: 15, sun: [1100, 0, 2900], alt: [31000, 0, 6000], fill: 0, cloud: [21000, 22700, 0.5, 1000] },
  // Level with the craft, off its left bow: it rides over cloud towers.
  flank: { label: 'Flank', eye: [-9000, 700, -3800], aim: [0, -200, 1000], lens: 20, sun: [9000, 3400, 2500], alt: [30000, 0, 0], fill: 0, cloud: [3000, 24000, 0.5], sites: [[40000, -8000, 21000, 1], [62000, 34000, 27000, 0.9], [26000, 44000, 15000, 0.7], [24000, -30000, 13000, 0.8]] },
  // Ahead and well under: the craft comes on, the sun high behind it.
  sunward: { label: 'Head-on', eye: [1500, -4400, -12500], aim: [0, 300, 900], lens: 13, sun: [-3200, 5600, 24000], alt: [30000, 0, 0], fill: 0, cloud: [3000, 25000, 0.5], sites: [[-9500, 16000, 7500, 1], [10500, 20000, 6500, 1], [-3000, 70000, 30000, 0.9]] },
  // High behind the left wing: the craft and its contrails over the deck.
  above: { label: 'Above', eye: [-3800, 5600, 7200], aim: [0, 0, 1200], lens: 26, sun: [9000, 16000, -20000], alt: [31000, 0, 0], fill: 0, cloud: [2500, 22500, 0.55], sites: [[-16000, -28000, 13000, 1], [25000, -36000, 17000, 0.9], [-34000, 6000, 12000, 0.7]] },
};
const SUN0 = 0.36;
// The hour: 0 is full day, 1 is night.
const timeStart = q.has('time') ? +q.get('time') : store.get('time') !== null ? +store.get('time') : 0;
const viewStart = q.get('view') ?? store.get('view');
const state = {
  sun: SUN0, time: clamp(Number.isFinite(timeStart) ? timeStart : 0, 0, 1),
  view: viewStart in VIEWS ? viewStart : 'below',
  craft: 'alcyone',
  lens: 1, expo: 1, bloom: 1, flare: 1, rays: 1.6, wisps: 0.55, heaps: 0.8, scud: 0.6, flow: 0.5,
};

/* ---------- bar ---------- */
// The pictures are fixed: no hand turns or zooms the camera.
const CRAFT_OPTIONS = [{ value: 'alcyone', label: 'Alcyone' }, { value: 'calaeno', label: 'Calaeno' }, { value: 'merope', label: 'Merope' }];
const ui = initPage({ id: 'calaeno', silent: true, bar: {
  choice: {
    label: 'View', value: state.view, display: 'segments',
    options: Object.entries(VIEWS).map(([value, v]) => ({ value, label: v.label })),
    onPick: v => { state.view = v; store.set('view', v); layout(); wake(); },
  },
  // Time runs from full day through gold and dusk to a moonlit night.
  slider: { label: 'Time', min: 0, max: 1, step: 0.002, value: state.time, onInput: v => { state.time = v; store.set('time', v); layout(); wake(); } },
  settings: [
    // Alcyone leads (Tom, 2026-11-16); Calaeno follows Tom's top view.
    { type: 'choice', id: 'craft', label: 'Craft', display: 'segments', value: 'alcyone', persist: true, options: CRAFT_OPTIONS, onPick: v => { state.craft = v; pick(); wake(); } },
  ],
  dev: [
    // Sun shift slides the key light sideways across the picture.
    { type: 'slider', id: 'sunshift', label: 'Sun shift', min: 0, max: 1, step: 0.002, value: SUN0, onInput: v => { state.sun = v; layout(); wake(); } },
    { type: 'slider', id: 'lens', label: 'Lens', min: 0.3, max: 3, step: 0.02, value: 1, onInput: v => { state.lens = v; wake(); } },
    { type: 'slider', id: 'rays', label: 'Sun rays', min: 0, max: 3, step: 0.05, value: 1.6, onInput: v => { state.rays = v; wake(); } },
    { type: 'slider', id: 'wisps', label: 'High wisps', min: 0, max: 1, step: 0.02, value: 0.55, onInput: v => { state.wisps = v; wake(); } },
    { type: 'slider', id: 'heaps', label: 'Mid heaps', min: 0, max: 1, step: 0.02, value: 0.8, onInput: v => { state.heaps = v; wake(); } },
    { type: 'slider', id: 'scud', label: 'Near scud', min: 0, max: 1, step: 0.02, value: 0.6, onInput: v => { state.scud = v; wake(); } },
    { type: 'slider', id: 'flow', label: 'Contrail flow', min: 0, max: 2, step: 0.05, value: 0.5, onInput: v => { state.flow = v; wake(); } },
    { type: 'slider', id: 'expo', label: 'Exposure', min: 0.3, max: 3, step: 0.05, value: 1, onInput: v => { state.expo = v; wake(); } },
    { type: 'slider', id: 'bloom', label: 'Bloom', min: 0, max: 3, step: 0.05, value: 1, onInput: v => { state.bloom = v; wake(); } },
    { type: 'slider', id: 'flare', label: 'Flare', min: 0, max: 2, step: 0.05, value: 1, onInput: v => { state.flare = v; wake(); } },
  ],
  quality: true,
} });
const craftStart = q.get('craft') ?? ui.setting('craft')?.value;
if (craftStart in CRAFT) state.craft = craftStart;

const stage = document.getElementById('stage');
let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; ui.hideControls(); markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(15, 1, 40, 500000);
camera.rotation.order = 'YXZ';

/* ---------- sun rays: contrail and craft shadows in the air ---------- */
// Source: railgun/index.html, "sun rays: cloud shadows in the low air".
// Each shadow is its caster pushed away from the sun.
// The view ray's length in lit air sets the rays' light.
const SHAFT_N = 12, SHAFT_TR = 7;
const SHAFT_U = {
  // Strength, the dust layer's top in metres, the ray's reach in metres.
  uShaft: { value: new THREE.Vector3(1.6, 30000, 160000) },
  // Ellipsoids: centre and across radius; uOccV holds each upright radius.
  uOcc: { value: Array.from({ length: SHAFT_N }, () => new THREE.Vector4()) }, uOccV: { value: new Float32Array(SHAFT_N) }, uOccN: { value: 0 },
  // The contrails as one chain: each point and its radius.
  uTr: { value: Array.from({ length: SHAFT_TR }, () => new THREE.Vector4()) }, uTrN: { value: 0 },
};
const SHAFT_GLSL = /* glsl */`
uniform vec3 uShaft;
uniform vec4 uOcc[${SHAFT_N}];
uniform float uOccV[${SHAFT_N}];
uniform int uOccN;
uniform vec4 uTr[${SHAFT_TR}];
uniform int uTrN;
// The ray's length inside the dust layer, from t0 to t1.
float shM(vec3 ro, vec3 rd, float t0, float t1) {
  if (rd.y > 1e-5) t1 = min(t1, (uShaft.y - ro.y) / rd.y);
  return max(t1 - t0, 0.0);
}
// Clip the span iv to the part where a + b t is below zero.
vec2 shSide(vec2 iv, float a, float b) {
  if (abs(b) < 1e-6) return a < 0.0 ? iv : vec2(1.0, 0.0);
  float tz = -a / b;
  return b > 0.0 ? vec2(iv.x, min(iv.y, tz)) : vec2(max(iv.x, tz), iv.y);
}
// Skylight fills a shadow far behind its caster.
float shFade(float x) { return exp(-max(x, 0.0) / 110000.0); }
// It returns the ray's lit share, 0 to 1, and its layer depth.
vec2 shafts(vec3 ro, vec3 rd, float L) {
  vec3 s = uSun;
  float all_ = shM(ro, rd, 0.0, L), dark = 0.0;
  for (int i = 0; i < ${SHAFT_N}; i++) {
    if (i >= uOccN) break;
    // Squash y so the ellipsoid turns into a sphere.
    float q = uOcc[i].w / uOccV[i];
    vec3 o = ro - uOcc[i].xyz, d = rd, sq = s;
    o.y *= q; d.y *= q; sq.y *= q; sq = normalize(sq);
    // Seen down the sunlight, the shadow is a disc.
    // A wider disc with a soft edge stands in for the penumbra.
    vec3 op = o - sq * dot(o, sq), dp = d - sq * dot(d, sq);
    float r = uOcc[i].w, rs = 1.5 * r;
    float A = dot(dp, dp), B = dot(op, dp), C = dot(op, op) - rs * rs, D = B * B - A * C;
    if (D <= 0.0 || A < 1e-9) continue;
    float w = smoothstep(rs, 0.4 * r, sqrt(max(dot(op, op) - B * B / A, 0.0)));
    D = sqrt(D);
    vec2 iv = vec2(max((-B - D) / A, 0.0), min((-B + D) / A, L));
    // Only the side away from the sun lies in shadow.
    iv = shSide(iv, dot(o, sq), dot(d, sq));
    dark += shM(ro, rd, iv.x, iv.y) * w * shFade(-dot(o + d * 0.5 * (iv.x + iv.y), sq));
  }
  for (int i = 0; i < ${SHAFT_TR - 1}; i++) {
    if (i >= uTrN - 1) break;
    // One piece of the contrail cone, as a slab of its mean radius.
    vec3 a0 = uTr[i].xyz, a1 = uTr[i + 1].xyz, r = ro - a0;
    vec3 u = (a1 - a0) - s * dot(a1 - a0, s);
    float len = length(u);
    if (len < 1.0) continue;
    u /= len;
    vec3 rp = r - s * dot(r, s), dp = rd - s * dot(rd, s);
    vec3 w0 = rp - u * dot(rp, u), w1 = dp - u * dot(dp, u);
    float rad = 0.5 * (uTr[i].w + uTr[i + 1].w), rs = 1.5 * rad;
    float A = dot(w1, w1), B = dot(w0, w1), C = dot(w0, w0) - rs * rs, D = B * B - A * C;
    if (D <= 0.0 || A < 1e-9) continue;
    float w = smoothstep(rs, 0.4 * rad, sqrt(max(dot(w0, w0) - B * B / A, 0.0)));
    D = sqrt(D);
    vec2 iv = vec2(max((-B - D) / A, 0.0), min((-B + D) / A, L));
    // Keep to the piece's own stretch.
    float ga = dot(rp, u), gb = dot(dp, u);
    iv = shSide(iv, ga - len, gb);
    iv = shSide(iv, -ga, -gb);
    iv = shSide(iv, dot(r - 0.5 * (a1 - a0), s), dot(rd, s));
    dark += shM(ro, rd, iv.x, iv.y) * w * shFade(-dot(r - 0.5 * (a1 - a0) + rd * 0.5 * (iv.x + iv.y), s));
  }
  return vec2(1.0 - min(dark / max(all_, 1.0), 1.0), all_);
}
// Shadow bands dim the sky; lit dust adds a sunward glow.
vec3 shaftSky(vec3 c, vec3 rd, float L) {
  if (uShaft.x < 0.001) return c;
  vec2 sh = shafts(cameraPosition, rd, L);
  float cs = dot(rd, uSun), g = 0.62;
  float ph = (1.0 - g * g) / pow(1.0 + g * g - 2.0 * g * cs, 1.5) * 0.08 + 0.05;
  float dk = 1.1 * (1.0 - sh.x);
  // A long path through lit dust stops adding light.
  float lit = 1.0 - exp(-sh.y * sh.x / 40000.0);
  // Shade loses the warm sunlight first: it turns cool, then dim.
  float k = min(dk * uShaft.x, 0.85);
  return mix(c, c * vec3(0.5, 0.58, 0.74), k) + uGlowC * ph * lit * 0.4 * uShaft.x;
}`;

/* ---------- sky: flat cloud layers at set heights ---------- */
// Each layer is a level sheet in the world, so every view sees it in true perspective.
// The eye rides with the craft: a layer drifts back, and a nearer one drifts faster.
// Wisps and heaps draw behind the craft; scud draws in front.
// The three high views trade the heaps for the raymarched volume below.
const VIEW_U = { uProjInv: { value: new THREE.Matrix4() }, uCamW: { value: new THREE.Matrix4() } };
const CLOUD_U = {
  uWisps: { value: 0.55 }, uHeaps: { value: 0.8 }, uScud: { value: 0.6 }, uOct: { value: 5 },
  // The three heights, and the heap layer's share of cloud.
  uAlt: { value: new THREE.Vector3(26000, 23000, 6000) }, uFill: { value: 0.2 },
  uDriftA: { value: new THREE.Vector2() }, uDriftB: { value: new THREE.Vector2() }, uDriftC: { value: new THREE.Vector2() },
};
// The cloud volume's picture, drawn at part size; uVolOn is 0 without it.
const VOLPIC_U = { uVolPic: { value: null }, uVolOn: { value: 0 }, uVolPx: { value: new THREE.Vector2(1, 1) } };
const VIEW_GLSL = /* glsl */`
varying vec2 vUv;
uniform mat4 uProjInv, uCamW;
uniform float uWisps, uHeaps, uScud, uFill;
uniform vec3 uAlt;
uniform vec2 uDriftA, uDriftB, uDriftC;
uniform int uOct;
vec3 viewDir() {
  vec4 h = uProjInv * vec4(vUv * 2.0 - 1.0, 1.0, 1.0);
  return normalize((uCamW * vec4(h.xyz / h.w, 0.0)).xyz);
}
// Where the view ray meets a level sheet at height h, in metres.
// w is the sheet's weight there: 0 when the ray misses it, less far away.
vec2 sheet(vec3 d, float h, out float w) {
  float dy = abs(d.y) < 1e-4 ? 1e-4 : d.y;
  float t = (h - cameraPosition.y) / dy;
  w = h > 0.0 && t > 0.0 ? exp(-t / 110000.0) : 0.0;
  return cameraPosition.xz + d.xz * t;
}`;
const QUAD_VERT = /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.999, 1.0); }`;
const SKY_U = { ...AIR_U, ...SHAFT_U, ...VIEW_U, ...CLOUD_U, ...VOLPIC_U };
const sky = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: SKY_U, depthTest: false, depthWrite: false,
  vertexShader: QUAD_VERT,
  fragmentShader: /* glsl */`
  ${AIR}
  ${VIEW_GLSL}
  ${SHAFT_GLSL}
  uniform sampler2D uVolPic;
  uniform float uVolOn;
  uniform vec2 uVolPx;
  // The highest layer: thin, combed ice wisps.
  vec4 wisps(vec3 d, float sd) {
    float fade;
    vec2 p = sheet(d, uAlt.x, fade) / 1900.0 + uDriftA;
    if (fade <= 0.0 || uWisps <= 0.0) return vec4(0.0);
    vec2 w = vec2(0.82, 0.57);
    // Long cells down the wind; a slow warp curls their ends.
    vec2 s = vec2(dot(p, w) * 0.5, dot(p, vec2(-w.y, w.x)) * 3.4);
    s += 0.55 * vec2(skFbm(p * 1.3 + 3.1 + uTime * 0.004, 3), skFbm(p * 1.3 - 7.7, 3));
    float n = skFbm(s, uOct);
    // Wisps gather in a few fields, with clear blue between.
    float field = smoothstep(0.3, 0.52, skFbm(p * 0.35 + 11.0, 2));
    float th = mix(0.74, 0.46, uWisps);
    float den = smoothstep(th, th + 0.28, n) * field * fade;
    vec3 col = vec3(0.92, 0.95, 1.0) * (uShadeC * 0.5 + uSunC * (0.42 + 0.25 * pow(sd, 12.0) + 0.6 * pow(sd, 120.0)));
    return vec4(col, den * 0.7);
  }
  // The middle layer: small heaps, white toward the sun, blue in the shade.
  vec4 heaps(vec3 d, float sd) {
    float fade;
    vec2 p = sheet(d, uAlt.y, fade) / 800.0 + uDriftB;
    if (fade <= 0.0 || uHeaps <= 0.0) return vec4(0.0);
    // The heaps boil slowly as they pass.
    vec2 s = p + 0.4 * vec2(skFbm(p * 0.7 + uTime * 0.012, 3), skFbm(p * 0.7 + 5.2 - uTime * 0.009, 3));
    float n = skFbm(s, uOct);
    // uFill opens the fields from loose patches to a near-full deck.
    float lo = 0.3 - 0.26 * uFill;
    float field = smoothstep(lo, lo + 0.2, skFbm(p * 0.2 + 31.0, 2));
    float den = smoothstep(0.56 - 0.1 * uFill, 0.63 - 0.1 * uFill, n) * field;
    if (den <= 0.0) return vec4(0.0);
    // Thinner cloud a short step toward the sun means this side is lit.
    vec2 to = normalize(uSun.xz + 1e-4);
    float lit = clamp((n - skFbm(s + to * 0.14, 3)) * 5.0 + 0.5, 0.0, 1.0);
    vec3 col = mix(uShadeC * 0.78, uSunC * 0.7 + uShadeC * 0.3, lit) + uSunC * 0.5 * pow(sd, 60.0);
    // Far heaps sink into the haze at the rim.
    col = mix(caAirC(vec3(d.x, 0.0, d.z)), col, fade);
    return vec4(col, den * uHeaps * smoothstep(0.0, 0.25, fade));
  }
  void main() {
    vec3 d = viewDir();
    float sd = max(dot(d, uSun), 0.0);
    vec3 c = caSky(d);
    // Under the rim lies the sea, dark blue through haze.
    if (d.y < 0.0) c = mix(caAirC(vec3(d.x, 0.0, d.z)) * 0.85, uSeaC, smoothstep(0.0, -0.22, d.y));
    // A pale band of haze marks the rim.
    c = mix(c, caAirC(vec3(d.x, 0.0, d.z)) * 1.05, 0.5 * exp(-abs(d.y) * 22.0));
    // Stars come out with the dusk.
    if (uStars > 0.0 && d.y > 0.0) c += skStarField(d, uTime) * uStars * 0.6;
    // The disc: half a degree across. The rim hides it once it sets.
    c += uSunC * uDisc * (1.0 - smoothstep(0.0042, 0.0052, length(d - uSun))) * step(0.0, d.y);
    vec4 wi = wisps(d, sd);
    c = mix(c, wi.rgb, wi.a);
    vec4 he = heaps(d, sd);
    c = mix(c, he.rgb, he.a);
    // The cloud volume lies over the sea and the far sky.
    // Five taps smooth the grain of its march.
    if (uVolOn > 0.5) {
      vec2 o = uVolPx * 1.3;
      vec4 cl = texture2D(uVolPic, vUv) * 0.36 + (texture2D(uVolPic, vUv + vec2(o.x, o.y)) + texture2D(uVolPic, vUv + vec2(-o.x, o.y)) + texture2D(uVolPic, vUv + vec2(o.x, -o.y)) + texture2D(uVolPic, vUv - vec2(o.x, o.y))) * 0.16;
      c = c * (1.0 - cl.a) + cl.rgb;
    }
    c = shaftSky(c, d, uShaft.z);
    gl_FragColor = vec4(c, 1.0);
  }`,
}));

    // Coverage: a full core, a ragged rim, a clear gap behind the tail, a long fade.
    float cov = (1.0 - smoothstep(0.25, 1.0, abs(s))) * mix(1.0, 0.62, smoothstep(0.05, 0.5, age)) * smoothstep(0.006, 0.03, age) * (1.0 - smoothstep(0.3, 1.0, age));
    float d = c01(rmp(textureLod(uVol, q, 0.0).r, 1.0 - cov, 1.0) * 3.0);
    // Fine cells carve the rim into small lobes; old smoke frays.
    float e = textureLod(uVol, q * 3.1, 0.0).g;
    d = rmp(d, (1.0 - e) * mix(0.5, 0.85, smoothstep(0.3, 1.0, age)), 1.0);
    float al = 1.0 - exp(-d * 3.4 * mix(1.0, 0.3, smoothstep(0.05, 0.7, age)) * (0.35 + h));
    if (al < 0.003) discard;
    // The side toward the sun is lit; the far side sits in the smoke's own shade.
    float cs = dot(normalize(vWP - cameraPosition), uSun);
    float ph = 0.5 * hg(cs, 0.6) + 0.5 * hg(cs, -0.2);
    float tl = d * 2.6 * (1.0 - s * dot(normalize(vSide), uSun));
    vec3 Ls = uSunC * (exp(-tl) * 0.8 + exp(-tl * 0.18) * 0.2) * ph * 1.25;
    vec3 La = mix(uHorC, uZenC, 0.5) * 0.3 * (1.0 - 0.6 * d) + uShadeC * 0.2;
    gl_FragColor = vec4(caAir(vec3(0.93) * (Ls + La), vWP, 1.0) * al, al);
  }`,
});
const ribbons = escorts.map(() => {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(RIB_N * 6), side = new Float32Array(RIB_N * 6), emit = new Float32Array(RIB_N * 2);
  const aT = new Float32Array(RIB_N * 4), idx = [];
  for (let k = 0; k < RIB_N; k++) {
    aT.set([k / (RIB_N - 1), -1, k / (RIB_N - 1), 1], k * 4);
    if (k < RIB_N - 1) idx.push(k * 2, k * 2 + 1, k * 2 + 2, k * 2 + 1, k * 2 + 3, k * 2 + 2);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('aSide', new THREE.BufferAttribute(side, 3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('aE', new THREE.BufferAttribute(emit, 1).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('aT', new THREE.BufferAttribute(aT, 2));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, ribbonMat);
  m.frustumCulled = false; m.renderOrder = 2.2;
  scene.add(m);
  return { g, pos, side, emit };
});
const ribPts = Array.from({ length: RIB_N }, () => new THREE.Vector3()), ribSide = new THREE.Vector3();
function pick() {
  craft = fleet[state.craft];
  for (const [id, c] of Object.entries(fleet)) c.group.visible = id === state.craft;
  trails.forEach((t, i) => { t.mesh.visible = i < craft.heads.length; });
}

/* ---------- post ---------- */
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
// Only the sun and the brightest ice bloom.
const bloom = new UnrealBloomPass(new THREE.Vector2(4, 4), 0.3, 0.7, 1.6);
composer.addPass(bloom);
const FIN = { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(1, 1) }, uTime: AIR_U.uTime, uSunUV: { value: new THREE.Vector2() }, uSunVis: { value: 0 }, uFlareC: { value: new THREE.Vector3() } };
// The pass takes a material, so it reads FIN itself and not a copy.
composer.addPass(new ShaderPass(new THREE.ShaderMaterial({
  uniforms: FIN,
  vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform sampler2D tDiffuse; uniform vec2 uRes, uSunUV; uniform vec3 uFlareC; uniform float uTime, uSunVis;
  uniform vec4 uFlP[12], uFlC[12];
  varying vec2 vUv;
  ${FLARE}
  ${GRADE}
  void main() {
    float asp = uRes.x / uRes.y;
    vec3 c = texture2D(tDiffuse, vUv).rgb;
    if (uSunVis > 0.0) c += flFlare(vUv, uSunUV, asp, uFlareC, 1.0, vec3(0.2, 0.0, 0.35)) * uSunVis;
    // Each lit strobe throws a small flare: a soft veil and faint ghosts.
    // No streak: Tom cut the anamorphic line (2026-11-16).
    for (int i = 0; i < 12; i++) {
      if (uFlP[i].z <= 0.0) continue;
      c += flFlare(vUv, uFlP[i].xy, asp, uFlC[i].rgb, uFlP[i].w, vec3(0.3, 0.0, 0.12)) * uFlP[i].z;
    }
    // A hard grade: deeper shade, richer blue.
    c = pow(max(c, 0.0), vec3(1.18)) * 1.12;
    c = mix(vec3(gdLuma(c)), c, 1.2);
    c = gdGrade(c, vUv, asp, gl_FragCoord.xy + floor(uTime * 24.0) * vec2(37.0, 17.0), vec3(0.001, 0.001, 0.003), 0.42, 0.45, 0.03);
    gl_FragColor = vec4(c, 1.0);
  }`,
})));
composer.addPass(new OutputPass());
// Twelve flare slots for the strobes; the final pass reads them.
const slots = flareSlots(12);
FIN.uFlP = { value: slots.pos }; FIN.uFlC = { value: slots.col };

/* ---------- size and detail ---------- */
// March steps and sun steps at Low, Standard and High.
// A thin contrail needs fewer steps than the rock's train.
const STEPS = [[20, 2], [30, 3], [40, 3]];
const D = detail({ maxDpr: 2, budget: 1.6e6, onChange: () => resize() });
let stageW = 1, stageH = 1, dprNow = 1;
function resize() {
  const r = stage.getBoundingClientRect();
  stageW = Math.max(1, r.width); stageH = Math.max(1, r.height);
  dprNow = D.dpr(stageW, stageH);
  renderer.setPixelRatio(dprNow);
  renderer.setSize(stageW, stageH, false);
  composer.setPixelRatio(dprNow);
  composer.setSize(stageW, stageH);
  FIN.uRes.value.set(stageW * dprNow, stageH * dprNow);
  const [steps, sunSteps] = STEPS[D.level];
  for (const t of trails) { t.u.uSteps.value = steps; t.u.uLSteps.value = sunSteps; }
  CLOUD_U.uOct.value = D.level > 0 ? 5 : 3;
  // The cloud volume: its share of the canvas size, its steps, its sun steps.
  const [share, cs, cl] = [[0.35, 32, 3], [0.5, 46, 4], [0.5, 64, 5]][D.level];
  const vw = Math.max(2, Math.round(stageW * dprNow * share)), vh = Math.max(2, Math.round(stageH * dprNow * share));
  for (const rt of [volPic, ...volAcc]) rt.setSize(vw, vh);
  volFresh = true;
  VOLPIC_U.uVolPx.value.set(1 / volPic.width, 1 / volPic.height);
  VOL_U.uClSteps.value = cs; VOL_U.uClSun.value = cl;
  camera.aspect = stageW / stageH;
  camera.updateProjectionMatrix();
  wake();
}
new ResizeObserver(resize).observe(stage);

/* ---------- layout: the chosen view ---------- */
const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3(), tmp3 = new THREE.Vector3(), inv = new THREE.Matrix4();
const base = { yaw: 0, pitch: 0, lens: 15 };
let hourExpo = 1;
function layout() {
  const v = VIEWS[state.view];
  place(v.eye, camera.position);
  // The camera looks at its aim point; the bob rides on top.
  place(v.aim, tmp).sub(camera.position).normalize();
  base.yaw = Math.atan2(-tmp.x, -tmp.z); base.pitch = Math.asin(tmp.y); base.lens = v.lens;
  // The key light stands behind its anchor by day; Sun shift moves it sideways.
  place(v.sun, tmp).sub(camera.position).normalize();
  tmp2.crossVectors(tmp, UP).normalize();
  tmp.addScaledVector(tmp2, 0.15 * (state.sun - SUN0)).normalize();
  // The hour sets the whole air from that place.
  hourExpo = setTime(state.time, tmp);
  FIN.uFlareC.value.copy(AIR_U.uSunC.value).multiplyScalar(0.16);
  CLOUD_U.uAlt.value.set(...v.alt);
  CLOUD_U.uFill.value = v.fill;
  VOLPIC_U.uVolOn.value = v.cloud ? 1 : 0;
  volFresh = true;
  // The top sets how far the towers lift over the domes; more fill lowers the cover threshold.
  if (v.cloud) {
    const unit = v.cloud[3] ?? DECK_M;
    VOL_U.uUnit.value = unit;
    VOL_U.uCl.value.set(v.cloud[0], Math.max(0, (v.cloud[1] - v.cloud[0]) / unit - 1.45), 0.62 - 0.32 * v.cloud[2]);
    if (v.mid) VOL_U.uMid.value.set((v.mid[0] - v.cloud[0]) / unit, (v.mid[1] - v.cloud[0]) / unit);
    else VOL_U.uMid.value.set(0, 0);
    VOL_U.uCraft.value.copy(POS);
    VOL_U.uAwayXZ.value.set(AWAY.x, AWAY.z);
    VOL_U.uSite.value.forEach((u, i) => {
      const st = v.sites?.[i];
      if (!st) return u.set(0, 0, 0, 0);
      place([st[0], 0, st[1]], tmp);
      u.set(tmp.x / unit, tmp.z / unit, st[2] / unit, st[3]);
    });
  }
}

// An escort's place at time t in the craft's frame: metres right, up and back.
// It holds station with a wobble; now and then it flies one patrol loop.
// It returns how hard it is turning, 0 to 1.
const eNow = [0, 0, 0], eOld = [0, 0, 0], eNew = [0, 0, 0];
function escortAt(i, t, out) {
  const [across, back, up] = WING[i], ph = i * 1.7, side = Math.sign(across);
  out[0] = across * craft.span + 60 * Math.sin(t * 0.21 + ph) + 25 * Math.sin(t * 0.53 + 2 * ph);
  out[1] = up + 40 * Math.sin(t * 0.17 + 1 + ph);
  out[2] = back + 90 * Math.sin(t * 0.13 + 2 + ph);
  // Each escort leaves on its own clock: out, ahead, round behind, and home.
  const s = ((t + 19 * i) % (74 + 13 * i)) / 38;
  if (s >= 1) return 0;
  const e = s * s * (3 - 2 * s), a = 2 * Math.PI * e;
  out[0] += side * 1500 * (1 - Math.cos(a)) / 2;
  out[1] += 520 * Math.sin(Math.PI * e) ** 2;
  out[2] -= 2200 * Math.sin(a);
  return Math.sin(Math.PI * s);
}

// Lays escort i's ribbon: its past places, each carried back on the wind.
function layRibbon(i, t) {
  const { g, pos, side, emit } = ribbons[i];
  for (let k = 0; k < RIB_N; k++) {
    // Samples crowd near the escort, where the path bends most on screen.
    const age = (k / (RIB_N - 1)) ** 1.6 * RIB_T;
    escortAt(i, t - age, eOld);
    place(eOld, ribPts[k]).addScaledVector(AWAY, 30 + CRUISE * age);
    // Each puff keeps the second it was made: the noise reads it.
    emit[k * 2] = emit[k * 2 + 1] = (t - age) % 4096 + i * 37;
  }
  for (let k = 0; k < RIB_N; k++) {
    const p = ribPts[k], a = k / (RIB_N - 1);
    // The ribbon faces the eye: its width lies across the path and the view.
    tmp2.subVectors(ribPts[Math.min(k + 1, RIB_N - 1)], ribPts[Math.max(k - 1, 0)]);
    tmp3.subVectors(p, camera.position);
    tmp.crossVectors(tmp2, tmp3).normalize();
    // The width keeps its side from sample to sample, so a loop never combs.
    if (k > 0) { if (tmp.dot(ribSide) < 0) tmp.negate(); tmp.lerp(ribSide, 0.6).normalize(); }
    ribSide.copy(tmp);
    side[k * 6] = side[k * 6 + 3] = tmp.x; side[k * 6 + 1] = side[k * 6 + 4] = tmp.y; side[k * 6 + 2] = side[k * 6 + 5] = tmp.z;
    tmp.multiplyScalar(5 + 190 * a ** 0.8);
    pos[k * 6] = p.x - tmp.x; pos[k * 6 + 1] = p.y - tmp.y; pos[k * 6 + 2] = p.z - tmp.z;
    pos[k * 6 + 3] = p.x + tmp.x; pos[k * 6 + 4] = p.y + tmp.y; pos[k * 6 + 5] = p.z + tmp.z;
  }
  g.attributes.position.needsUpdate = g.attributes.aSide.needsUpdate = g.attributes.aE.needsUpdate = true;
}

function pose(t) {
  const g = craft.group;
  // A slow, heavy roll.
  g.rotation.set(0, 0, rad(3) + 0.012 * Math.sin(t * 0.11));
  g.updateMatrixWorld(true);
  // Each contrail starts behind its engine's propeller.
  // A stretch of clear air lies between the blades and the first smoke.
  craft.heads.forEach((h, i) => trails[i].lay(tmp.copy(h).applyMatrix4(g.matrixWorld).addScaledVector(AWAY, 0.63 * TRAIL.rad + 85), AWAY));
  // The escorts hold station off both wings and drift a little.
  escorts.forEach((e, i) => {
    // Its speed and its turn come from its path: a step back and a step on.
    const H = 0.25;
    escortAt(i, t, eNow);
    escortAt(i, t - H, eOld); escortAt(i, t + H, eNew);
    const vr = (eNew[0] - eOld[0]) / (2 * H), vu = (eNew[1] - eOld[1]) / (2 * H), vb = (eNew[2] - eOld[2]) / (2 * H);
    const ar = (eNew[0] - 2 * eNow[0] + eOld[0]) / (H * H);
    place(eNow, e.group.position);
    // The nose follows the path; the wings bank into each turn.
    const yaw = Math.atan2(vr, CRUISE - vb), pitch = Math.atan2(vu, CRUISE);
    const roll = clamp(-Math.atan(ar / 9.8) * 0.85, -1.25, 1.25) + 0.1 * Math.sin(t * 0.31 + i * 1.7);
    e.group.rotation.set(pitch, -yaw, roll);
    e.group.updateMatrixWorld(true);
    layRibbon(i, t);
  });
  // The rays' casters: the craft as discs, the contrails as one chain.
  const S = SHAFT_U;
  craft.casters.forEach(([x, y, z, r, v], i) => {
    tmp.set(x, y, z).applyMatrix4(g.matrixWorld);
    S.uOcc.value[i].set(tmp.x, tmp.y, tmp.z, r); S.uOccV.value[i] = v;
  });
  S.uOccN.value = craft.casters.length;
  let m = 0;
  for (let x = 300; m < SHAFT_TR; m++, x = x * 1.9 + 1500) {
    tmp.copy(POS).addScaledVector(AWAY, x);
    S.uTr.value[m].set(tmp.x, tmp.y, tmp.z, 0.7 * (craft.spread + TRAIL.k * x));
  }
  S.uTrN.value = m;
}

/* ---------- camera: fixed, with a gentle bob ---------- */
function aim(t) {
  // The lens is across the frame's short side.
  const short = clamp(base.lens * state.lens, 2, 80);
  const vfov = camera.aspect >= 1 ? short : deg(2 * Math.atan(Math.tan(rad(short) / 2) / camera.aspect));
  if (Math.abs(camera.fov - vfov) > 1e-3) { camera.fov = vfov; camera.updateProjectionMatrix(); }
  // The bob of a long lens held by hand.
  const k = reduced() ? 0 : rad(short) * 0.011;
  const by = k * (Math.sin(t * 0.31 + 2) + 0.4 * Math.sin(t * 0.73)), bp = k * (Math.sin(t * 0.37) + 0.45 * Math.sin(t * 0.83 + 1));
  camera.rotation.set(base.pitch + bp, base.yaw + by, k * 0.35 * Math.sin(t * 0.21 + 4));
  camera.updateMatrixWorld(true);
  uPx.value = dprNow * Math.min(stageW, stageH) / 640 * Math.sqrt(clamp(16 / short, 0.6, 4));
}

// How much of the sun the craft and the contrails hide, 0 to 1.
const fwd = new THREE.Vector3(), vp = new THREE.Matrix4(), uv2 = [0, 0];
function sunCover() {
  const sun = AIR_U.uSun.value, eye = camera.position;
  inv.copy(craft.group.matrixWorld).invert();
  const o = tmp.copy(eye).applyMatrix4(inv), d = tmp2.copy(sun).transformDirection(inv);
  let hull = 0;
  if (Math.abs(d.y) > 1e-4) {
    const t = -o.y / d.y, x = o.x + d.x * t, z = o.z + d.z * t;
    // Five rays across the disc soften the edge.
    const r = 0.0046 * t * 0.75;
    if (t > 0) for (const [dx, dz] of [[0, 0], [r, 0], [-r, 0], [0, r], [0, -r]]) hull += craft.shade(x + dx, z + dz) ? 0.2 : 0;
  }
  let ice = 0;
  for (let i = 0; i < craft.heads.length; i++) ice = Math.max(ice, trails[i].cover(eye, sun));
  return 1 - (1 - hull) * (1 - 0.96 * ice);
}

/* ---------- frame ---------- */
let simT = 40, vis = 0;
function frame(dt) {
  simT += dt;
  AIR_U.uTime.value = simT;
  // The billows flow out of the engines and down the contrails.
  for (const t of trails) t.u.uFlow.value = simT * state.flow;
  pose(simT);
  aim(simT);
  VIEW_U.uProjInv.value.copy(camera.projectionMatrixInverse);
  VIEW_U.uCamW.value.copy(camera.matrixWorld);
  CLOUD_U.uWisps.value = state.wisps; CLOUD_U.uHeaps.value = state.heaps; CLOUD_U.uScud.value = state.scud;
  // Each layer drifts back against the heading; nearer layers go faster and a little askew.
  CLOUD_U.uDriftA.value.set(AWAY.x, AWAY.z).multiplyScalar(simT * 0.019);
  CLOUD_U.uDriftB.value.set(AWAY.x * 0.94 - AWAY.z * 0.34, AWAY.z * 0.94 + AWAY.x * 0.34).multiplyScalar(simT * 0.08);
  CLOUD_U.uDriftC.value.set(AWAY.x * 0.9 + AWAY.z * 0.44, AWAY.z * 0.9 - AWAY.x * 0.44).multiplyScalar(simT * 0.07);
  SHAFT_U.uShaft.value.x = state.rays;
  // The flare shows while the sun is in frame and clear.
  const sun = AIR_U.uSun.value;
  const sn = tmp3.copy(sun).multiplyScalar(1000).add(camera.position).project(camera);
  const front = sun.dot(camera.getWorldDirection(fwd)) > 0;
  const edge = Math.max(Math.abs(sn.x), Math.abs(sn.y));
  const want = front ? (1 - sstep(edge, 0.95, 1.2)) * (1 - sunCover()) : 0;
  // With the key light out of the frame, the sky goes deeper.
  const deep = front ? sstep(edge, 1.05, 1.6) : 1;
  AIR_U.uDeep.value += (deep - AIR_U.uDeep.value) * (dt ? Math.min(1, dt * 2.5) : 1);
  vis = dt ? vis + (want - vis) * Math.min(1, dt * 6) : want;
  FIN.uSunUV.value.set(sn.x * 0.5 + 0.5, sn.y * 0.5 + 0.5);
  FIN.uSunVis.value = vis * state.flare;
  // Each strobe that is lit this frame takes a flare slot.
  slots.clear();
  vp.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  const lit = (list, m) => {
    for (const st of list) {
      if ((simT / st.period + st.phase) % 1 >= st.duty) continue;
      tmp.copy(st.p).applyMatrix4(m);
      if (flareAt(vp.elements, tmp.x, tmp.y, tmp.z, uv2)) slots.add(uv2[0], uv2[1], 0.26 * state.flare * (1 + 0.6 * AIR_U.uNight.value), st.size, st.col[0] / 9, st.col[1] / 9, st.col[2] / 9, 1);
    }
  };
  lit(craft.strobes, craft.group.matrixWorld);
  for (const e of escorts) lit(e.strobes, e.group.matrixWorld);
  bloom.strength = 0.3 * state.bloom;
  renderer.toneMappingExposure = state.expo * hourExpo;
  // The deck slides back as the craft flies on, slowly.
  VOL_U.uClDrift.value.set(-AWAY.x, -AWAY.z).multiplyScalar(simT * 0.012);
  VOL_U.uFocal.value = volPic.height / (2 * Math.tan(rad(camera.fov) / 2));
  // A still picture has no later frames, so it takes its mean at once.
  if (VOLPIC_U.uVolOn.value > 0.5) for (let n = dt ? 1 : 14; n > 0; n--) marchClouds();
  composer.render();
}

/* ---------- loop ---------- */
let raf = 0, visible = true, last = 0;
function loop(now) {
  raf = 0;
  if (!visible) return;
  const run = !reduced();
  const raw = run && last ? (now - last) / 1000 : 0, dt = Math.min(0.1, raw);
  last = now;
  // The watch gets the true gap: it skips a throttled tab's long frames.
  if (run) D.frame(raw);
  frame(dt);
  // Reduced motion draws one still, then waits for a control.
  if (run) raf = requestAnimationFrame(loop);
  else last = 0;
}
function wake() { if (!raf && visible) raf = requestAnimationFrame(loop); }
whenVisible(stage, on => { visible = on; if (on) wake(); });
onReducedChange(() => wake());

/* ---------- ready ---------- */
pick();
layout();
resize();
if (q.has('debug')) window.__ca = { state, VIEWS, VOL_U, frame, layout, pick, renderer, D };
// The intro holds until shaders compile and the first frame draws.
renderer.compileAsync(scene, camera).then(() => {
  frame(0);
  canvas.classList.add('on');
  markReady();
  wake();
}, () => { canvas.classList.add('on'); markReady(); });
</script>
</body>
</html>
