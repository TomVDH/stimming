<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<style>html { background: oklch(0.14 0.014 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ten seconds: ascent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<style>
/* Act 2 dev page: the whole flight on hull cameras, scrubbable. */
:root { --stage: oklch(0.06 0.01 265); }
.stage--ascent canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
.stage--ascent .clock {
  position: absolute; left: 50%; top: 16px; transform: translateX(-50%); z-index: 1; margin: 0;
  font: 700 10px/1 var(--slab, ui-monospace, monospace); letter-spacing: 0.14em; text-transform: uppercase;
  color: oklch(0.94 0.008 275 / 0.7); pointer-events: none; white-space: nowrap; font-variant-numeric: tabular-nums;
}
@media (max-width: 640px) { .stage--ascent .clock { top: auto; bottom: 64px; } }
</style>
</head>
<body>
<div class="wrap">
  <main>
    <div class="stage stage--ascent" id="stage" tabindex="0" role="application" aria-label="The rocket's flight from max-q to deep space, on cameras fixed to its hull.">
      <p class="fail" hidden>This page needs WebGL 2, which this browser has turned off.</p>
      <p class="clock" aria-live="off"></p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Ten seconds: ascent</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FLARE } from '../shared/flare.js';
import { GRADE } from '../shared/grade.js';
import { initPage, whenVisible, pixelRatio, onQuality, reduced } from '../shared/stim.js';
import { EV, flightAt, posAt, sunDir, sunLight } from './ascent/flight.js';
import { makeSpace } from './ascent/space.js';
import { makeRocket } from './ascent/rocket.js';
import { CAMS, CAM_IDS, cutAt, mountPose } from './ascent/cams.js';

const q = new URLSearchParams(location.search);
const state = { t: Math.min(EV.end, Math.max(0, +(q.get('t') ?? 0) || 0)), playing: !q.has('t'), cam: 'auto', dawn: 0.4 };

const ui = initPage({ id: 'launch', silent: true, bar: {
  choice: {
    label: 'Camera', value: 'auto', display: 'stepper',
    options: [{ value: 'auto', label: 'Auto' }, ...CAM_IDS.map(id => ({ value: id, label: CAMS[id].label }))],
    onPick: v => { state.cam = v; wake(); },
  },
  slider: { label: 'Flight', min: 0, max: EV.end, step: 0.1, value: state.t, onInput: v => { state.t = v; wake(); } },
  actions: [
    { verb: 'restart', label: 'Restart', onPress: () => { state.t = 0; state.playing = true; syncPlay(); wake(); } },
    { verb: 'pause', label: 'Pause', onPress: () => { state.playing = !state.playing; syncPlay(); wake(); } },
  ],
  settings: [
    // Dawn moves the sun at the pad from 9 to 1 degrees under the horizon.
    { type: 'slider', id: 'dawn', label: 'Dawn', min: 0, max: 1, step: 0.01, value: 0.4, onInput: v => { state.dawn = v; envAt = -1; wake(); } },
  ],
  quality: true,
  keys: [['space', 'pause'], ['← →', 'skip 5 s'], ['1–8', 'camera']],
} });
// The shell gives no label setter; the chip's label span holds the verb.
const pauseLabel = [...document.querySelectorAll('.s2-chip .s2-label')].find(l => l.textContent === 'Pause');
function syncPlay() { if (pauseLabel) pauseLabel.textContent = state.playing ? 'Pause' : 'Play'; }

const stage = document.getElementById('stage');
const clock = stage.querySelector('.clock');

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  throw err;
}
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.insertBefore(renderer.domElement, stage.firstChild);

/* ---------- backdrop: drawn first into its own target ---------- */
const space = makeSpace();
const quad = mat => { const m = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat); m.frustumCulled = false; return m; };
const bgScene = new THREE.Scene();
bgScene.add(quad(space.mat));
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bgRT = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, depthBuffer: false });

/* ---------- foreground: metres, centred on the camera ---------- */
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(60, 1, 0.1, 8000);
scene.add(cam);
const backdrop = quad(new THREE.ShaderMaterial({
  uniforms: { tBg: { value: bgRT.texture } }, depthTest: false, depthWrite: false, toneMapped: false,
  vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.999, 1.0); }`,
  fragmentShader: /* glsl */`uniform sampler2D tBg; varying vec2 vUv; void main() { gl_FragColor = texture2D(tBg, vUv); }`,
}));
backdrop.renderOrder = -1000;
scene.add(backdrop);

const sun = new THREE.DirectionalLight(0xffffff, 5.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 600 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0x6688cc, 0x112233, 1.2);
scene.add(hemi);

const R = makeRocket(scene);

/* ---------- sky for reflections, rebuilt as the light changes ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
const envU = { uUp: { value: new THREE.Vector3(0, 1, 0) }, uT: { value: new THREE.Color() }, uB: { value: new THREE.Color() }, uH: { value: new THREE.Color() } };
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, uniforms: envU,
  vertexShader: /* glsl */`varying vec3 vD; void main() { vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`uniform vec3 uUp, uT, uB, uH; varying vec3 vD; void main() { float y = dot(normalize(vD), uUp); vec3 c = mix(uB, uT, smoothstep(-0.15, 0.25, y)); c += uH * exp(-abs(y + 0.05) * 14.0) * 0.6; gl_FragColor = vec4(c, 1.0); }`,
})));
let envRT = null, envAt = -1;
function buildEnv(f, lit) {
  const day = Math.max(lit[0], lit[1], lit[2]);
  const thin = THREE.MathUtils.smoothstep(f.h, 15, 80);
  envU.uUp.value.set(f.up[0], f.up[1], f.up[2]);
  envU.uT.value.setRGB(0.08, 0.14, 0.32).multiplyScalar((1 - thin) * (0.15 + 0.85 * day));
  envU.uB.value.setRGB(0.1, 0.18, 0.32).multiplyScalar(0.1 + 0.9 * day);
  envU.uH.value.setRGB(0.9, 0.5, 0.3).multiplyScalar(((1 - thin) * 0.6 + 0.2) * (0.03 + 0.97 * day));
  envRT?.dispose();
  envRT = pmrem.fromScene(envScene, 0.02);
  scene.environment = envRT.texture;
}

/* ---------- post ---------- */
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType }));
composer.addPass(new RenderPass(scene, cam));
// Only flames and the sun bloom; sunlit paint stays clean.
const bloom = new UnrealBloomPass(new THREE.Vector2(4, 4), 0.4, 0.4, 5.0);
composer.addPass(bloom);
const FIN = { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(1, 1) }, uTime: { value: 0 }, uSunUV: { value: new THREE.Vector2() }, uSunVis: { value: 0 }, uSunC: { value: new THREE.Color() } };
composer.addPass(new ShaderPass({
  uniforms: FIN,
  vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform sampler2D tDiffuse; uniform vec2 uRes, uSunUV; uniform vec3 uSunC; uniform float uTime, uSunVis;
  varying vec2 vUv;
  ${FLARE}
  ${GRADE}
  void main() {
    float asp = uRes.x / uRes.y;
    // A slight chromatic split toward the corners, as in a small lens.
    vec2 off = (vUv - 0.5) * 0.0018;
    vec3 c = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);
    if (uSunVis > 0.0) c += flFlare(vUv, uSunUV, asp, uSunC, 1.0, vec3(0.6, 0.55, 0.35)) * uSunVis;
    c = gdGrade(c, vUv, asp, gl_FragCoord.xy + floor(uTime * 24.0) * vec2(37.0, 17.0), vec3(0.002, 0.002, 0.004), 0.35, 0.5, 0.05);
    gl_FragColor = vec4(c, 1.0);
  }`,
}));
composer.addPass(new OutputPass());

/* ---------- size ---------- */
function resize() {
  const r = stage.getBoundingClientRect();
  const W = Math.max(1, r.width), H = Math.max(1, r.height);
  const dpr = pixelRatio(W, H, { maxDpr: 2, budget: 2.2e6 });
  renderer.setPixelRatio(dpr);
  renderer.setSize(W, H, false);
  composer.setPixelRatio(dpr);
  composer.setSize(W, H);
  bgRT.setSize(Math.round(W * dpr), Math.round(H * dpr));
  FIN.uRes.value.set(W * dpr, H * dpr);
  cam.aspect = W / H;
  cam.updateProjectionMatrix();
  wake();
}
new ResizeObserver(resize).observe(stage);
onQuality(() => resize());

/* ---------- the sky's other bodies ---------- */
// The Moon sits beyond the Earth as seen on the way out, a little aside.
const outDir = new THREE.Vector3(...posAt(EV.end)).normalize();
const moonAt = outDir.clone().negate().applyAxisAngle(new THREE.Vector3(0, 0, 1), 0.42).add(new THREE.Vector3(0, 0, 0.12)).normalize().multiplyScalar(384400);
space.U.uMoon.value.set(moonAt.x, moonAt.y, moonAt.z, 1737);
const planet = (x, y, z, w) => { const v = new THREE.Vector3(x, y, z).normalize(); return new THREE.Vector4(v.x, v.y, v.z, w); };
space.U.uPlanet.value = [planet(-0.2, -0.95, 0.12, 2.2), planet(-0.9, 0.35, -0.1, 1.1), planet(0.3, -0.6, -0.3, 0.5)];

/* ---------- frame ---------- */
const qr = new THREE.Quaternion(), m3 = new THREE.Matrix4();
const X = new THREE.Vector3(), Y = new THREE.Vector3(), Z = new THREE.Vector3();
const shakeQ = new THREE.Quaternion(), eul = new THREE.Euler();
const sunArr = [0, 0, 0], lit = [0, 0, 0], sunV = new THREE.Vector3(), tmp = new THREE.Vector3();
// Exposure by phase: dark dawn air, then hard sunlight in space.
const EXPO = [[0, 7], [40, 5], [60, 2.0], [90, 1.0], [140, 1.1], [170, 0.85], [EV.far, 0.8], [EV.end, 1.0]];
const expoAt = t => { for (let i = 1; i < EXPO.length; i++) if (t <= EXPO[i][0]) { const [t0, a] = EXPO[i - 1], [t1, b] = EXPO[i]; return a + (b - a) * (t - t0) / (t1 - t0); } return EXPO[EXPO.length - 1][1]; };
let lastId = '';

function frame(t, wall) {
  const f = flightAt(t);
  // The rocket's attitude: y along the axis, z across the orbit plane.
  Y.set(f.axis[0], f.axis[1], f.axis[2]);
  Z.set(0, 0, 1).addScaledVector(Y, -Y.z).normalize();
  X.crossVectors(Y, Z);
  qr.setFromRotationMatrix(m3.makeBasis(X, Y, Z));
  R.rocket.quaternion.copy(qr);
  // The camera: the director's cut, or the chosen mount.
  let id = state.cam === 'auto' ? cutAt(t) : state.cam;
  if (CAMS[id].stage === 1 && t >= EV.sep) id = 'upper';
  if (CAMS[id].stage === 2 && t >= EV.probeSep + 3) id = 'probe';
  const mp = mountPose(id);
  // Each mount rides its own body: first stage, upper stage or probe.
  R.pose(t);
  const holder = [R.lower, R.upper, R.probe][CAMS[id].stage - 1];
  R.rocket.position.set(0, 0, 0);
  R.rocket.updateMatrixWorld(true);
  const eyeW = holder.localToWorld(mp.pos.clone());
  R.rocket.position.copy(eyeW).negate();
  R.rocket.updateMatrixWorld(true);
  const holdQ = holder.getWorldQuaternion(new THREE.Quaternion());
  // Shake grows with thrust and with dynamic pressure.
  const sh = reduced() ? 0 : f.thrust1 * (0.25 + 1.2 * f.q) + f.thrust2 * 0.08;
  eul.set(Math.sin(wall * 37.0) * 0.0012 * sh + Math.sin(wall * 61.0) * 0.0008 * sh, Math.sin(wall * 43.0 + 1.0) * 0.0012 * sh, 0);
  cam.quaternion.copy(holdQ).multiply(mp.q).multiply(shakeQ.setFromEuler(eul));
  cam.position.set(0, 0, 0);
  if (cam.fov !== mp.fov) { cam.fov = mp.fov; cam.updateProjectionMatrix(); }
  cam.updateMatrixWorld();
  // Light: the sun and what the air leaves of it at the rocket.
  sunDir(9 - 8 * state.dawn, sunArr);
  sunV.set(sunArr[0], sunArr[1], sunArr[2]);
  sunLight(f.p, sunArr, lit);
  sun.color.setRGB(lit[0], lit[1], lit[2]);
  sun.intensity = 5.5;
  const day = Math.max(lit[0], lit[1], lit[2]);
  const thin = THREE.MathUtils.smoothstep(f.h, 15, 80);
  hemi.position.set(f.up[0], f.up[1], f.up[2]);
  hemi.color.setRGB(0.25, 0.35, 0.6).multiplyScalar((1 - thin) * (0.08 + 0.92 * day) + 0.01);
  hemi.groundColor.setRGB(0.1, 0.2, 0.35).multiplyScalar(0.05 + 0.95 * day * (1 - THREE.MathUtils.smoothstep(f.h, 2000, 60000)));
  if (envAt < 0 || Math.abs(t - envAt) > 2) { buildEnv(f, lit); envAt = t; }
  // The flame keeps its screen brightness while exposure rides the dark sky.
  R.update(f, t, lit, sunV, cam.position, 1.6 / expoAt(t));
  // The shadow box follows the probe once it flies alone, at finer grain.
  const alone = t > EV.probeSep;
  const mid = alone ? R.probe.getWorldPosition(tmp) : tmp.set(0, 30, 0).applyMatrix4(R.rocket.matrixWorld);
  const box = alone ? 9 : 45;
  if (sun.shadow.camera.right !== box) { Object.assign(sun.shadow.camera, { left: -box, right: box, top: box, bottom: -box }); sun.shadow.camera.updateProjectionMatrix(); }
  sun.target.position.copy(mid);
  sun.position.copy(mid).addScaledVector(sunV, 300);
  // The backdrop shares the view, in kilometres.
  const U = space.U;
  U.uProjInv.value.copy(cam.projectionMatrixInverse);
  U.uCamWorld.value.copy(cam.matrixWorld);
  U.uEye.value.set(f.p[0], f.p[1], f.p[2]);
  U.uSun.value.copy(sunV);
  U.uTime.value = t;
  // The long coast turns cosmic: the Milky Way and the stars come up.
  U.uCosmos.value = THREE.MathUtils.smoothstep(t, EV.deployEnd, EV.end - 40);
  renderer.toneMappingExposure = expoAt(t);
  // The sun's flare shows only while the sun is in frame.
  const sn = tmp.copy(sunV).multiplyScalar(1000).project(cam);
  const front = sunV.dot(new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion)) > 0;
  const edge = Math.max(Math.abs(sn.x), Math.abs(sn.y));
  FIN.uSunUV.value.set(sn.x * 0.5 + 0.5, sn.y * 0.5 + 0.5);
  FIN.uSunVis.value = front ? (1 - THREE.MathUtils.smoothstep(edge, 0.95, 1.15)) * day : 0;
  FIN.uSunC.value.setRGB(lit[0], lit[1], lit[2]).multiplyScalar(1.2);
  FIN.uTime.value = wall;
  renderer.setRenderTarget(bgRT);
  renderer.render(bgScene, quadCam);
  renderer.setRenderTarget(null);
  composer.render();
  // The clock: flight time, height or distance, camera.
  if (id !== lastId || Math.floor(t * 4) !== Math.floor((t - 0.05) * 4)) {
    const dist = f.h < 2000 ? `${f.h.toFixed(f.h < 10 ? 1 : 0)} km` : `${Math.round(f.r / 1000).toLocaleString('en')} 000 km out`;
    clock.textContent = `T+${Math.floor(t + 8).toString().padStart(3, '0')} · ${dist} · ${CAMS[id].label}`;
    lastId = id;
  }
}

/* ---------- loop ---------- */
let raf = 0, visible = true, last = 0, sliderAt = 0;
function loop(now) {
  raf = 0;
  if (!visible) return;
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
  last = now;
  if (state.playing && !reduced()) {
    state.t = Math.min(EV.end, state.t + dt);
    if (state.t >= EV.end) { state.playing = false; syncPlay(); }
    if (now - sliderAt > 250) { ui.slider?.set(state.t); sliderAt = now; }
  }
  frame(state.t, now / 1000);
  if (state.playing && !reduced()) raf = requestAnimationFrame(loop);
  else last = 0;
}
function wake() { if (!raf && visible) raf = requestAnimationFrame(loop); }
whenVisible(stage, on => { visible = on; if (on) wake(); });

addEventListener('keydown', e => {
  if (e.target.closest?.('input, textarea')) return;
  if (e.key === ' ') { e.preventDefault(); state.playing = !state.playing; syncPlay(); wake(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    state.t = Math.min(EV.end, Math.max(0, state.t + (e.key === 'ArrowRight' ? 5 : -5)));
    ui.slider?.set(state.t); wake();
  } else if (/^[1-8]$/.test(e.key)) {
    const v = ['auto', ...CAM_IDS][+e.key - 1];
    state.cam = v; ui.choice?.set(v); wake();
  }
});

resize();
syncPlay();
if (q.has('debug')) window.__as = { R, scene, frame, state, renderer, flightAt, still(t, c = 'auto') { state.cam = c; state.t = t; state.playing = false; frame(t, t); return renderer.domElement; } };
</script>
</body>
</html>
