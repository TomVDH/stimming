<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.14 0.014 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

.stage--launch canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--launch canvas.on { opacity: 1; }

@media (prefers-reduced-motion: reduce) { .stage--launch canvas { transition: none; } }

<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Marsh launch</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--launch" id="stage" tabindex="0" role="application" aria-label="A reed marsh before dawn. A rocket waits on the far shore. Drag to look around.">
      <p class="fail" hidden>Marsh launch needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Marsh launch</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createNoise2D } from 'simplex-noise';
import { gsap } from 'gsap';
import { initPage, whenVisible, pixelRatio, onQuality, linFit, reduced, onReducedChange, quality } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

/* ---------- settings ---------- */
const store = {
  get(k) { try { return localStorage.getItem(`stimming.launch.${k}`); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(`stimming.launch.${k}`, String(v)); } catch { /* storage off */ } },
};
// Distance to the pad in metres; the roar delay follows it.
const DIST = { near: 1200, mid: 2000, far: 3400 };
const opts = {
  kind: ['small', 'medium', 'heavy'].includes(store.get('kind')) ? store.get('kind') : 'medium',
  dawn: Number.isFinite(+store.get('dawn')) && store.get('dawn') !== null ? Math.min(1, Math.max(0, +store.get('dawn'))) : 0.4,
};

/* ---------- bar ---------- */
const act = { launch() {} };
const ui = initPage({ id: 'launch', silent: true, bar: {
  choice: {
    label: 'Rocket', value: opts.kind,
    options: [{ value: 'small', label: 'Small' }, { value: 'medium', label: 'Medium' }, { value: 'heavy', label: 'Heavy' }],
    onPick: v => { opts.kind = v; store.set('kind', v); },
  },
  // Dawn moves the sun from 9 to 1 degrees under the horizon.
  slider: { label: 'Dawn', min: 0, max: 1, step: 0.005, value: opts.dawn, onInput: v => { opts.dawn = v; store.set('dawn', v); setDawn(); } },
  actions: [{ verb: 'launch', label: 'Launch', onPress: () => act.launch() }],
  settings: [
    { type: 'choice', id: 'distance', label: 'Distance', value: 'mid', persist: true,
      options: [{ value: 'near', label: 'Near' }, { value: 'mid', label: 'Mid' }, { value: 'far', label: 'Far' }],
      onPick: v => setDistance(v) },
    { type: 'toggle', id: 'letterbox', label: 'Letterbox', value: false, persist: true, onToggle: on => setBox(on) },
  ],
  quality: true,
  keys: [['click', 'launch'], ['drag', 'look around'], ['space', 'launch']],
} });

const stage = document.getElementById('stage');
let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

// Seeded random keeps the marsh the same on every load.
let seed = 5511;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; ui.hideControls(); markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 80000);
// The eye stands on a low dike above the reeds.
const EYE = 4;
camera.position.set(0, EYE, 0);
camera.rotation.order = 'YXZ';
// Layer 1 holds what the water mirrors.
const MIRROR = 1;
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;

/* ---------- uniforms ---------- */
const U = {
  uTime: { value: 0 },
  uSun: { value: new THREE.Vector3(0, -0.1, -1) },
  uDawn: { value: 0.5 },
  uAmb: { value: new THREE.Vector3() },
  uGlowC: { value: new THREE.Vector3() },
  uHaze: { value: 0.0005 },
  uHazeH: { value: 22 },
  uSway: { value: 1 },
  uShore: { value: -2000 },
  // The flame: world position and strength; its colour.
  uFlame: { value: new THREE.Vector4(0, 0, -2000, 0) },
  uFlameC: { value: new THREE.Vector3(1, 0.5, 0.18) },
  // The Earth's shadow line in km of real altitude.
  uShadowH: { value: 35 },
  // Thick air round a low flame glows; thin air high up does not.
  uAir: { value: 1 },
};

/* ---------- dawn: sky, sun and the Earth's shadow line ---------- */
// The sun sits ahead and to the left; the climb bends right, into dark sky.
const SUN_AZ = new THREE.Vector2(-0.4, -0.92).normalize();
// Sky colours, shared by the GPU sky and the CPU ambient.
const SKY = {
  zen: [0.018, 0.04, 0.13], low: [0.05, 0.055, 0.085], rose: [0.24, 0.075, 0.09],
  amber: [1.5, 0.34, 0.03], ember: [0.9, 0.16, 0.02], belt: [0.18, 0.08, 0.12],
};
const v3 = a => `vec3(${a.map(x => x.toFixed(4)).join(', ')})`;
// Air above this height (km) is sunlit with the sun δ degrees down.
const R_EARTH = 6371;
function shadowH(deg) { return R_EARTH * (1 / Math.cos(THREE.MathUtils.degToRad(deg)) - 1); }
let depression = 6;
// Brightness of the whole sky, 0 at δ = 9 and 1 at δ = 1.
const skyB = t => 0.06 + 0.94 * t * t;
function dawn(deg) {
  depression = deg;
  const t = THREE.MathUtils.clamp((9 - deg) / 8, 0, 1);
  const r = THREE.MathUtils.degToRad(deg);
  U.uSun.value.set(SUN_AZ.x * Math.cos(r), -Math.sin(r), SUN_AZ.y * Math.cos(r));
  U.uDawn.value = t;
  // Ambient: the zenith and the low band; glow: the sun-side horizon.
  const B = skyB(t);
  U.uAmb.value.set(...SKY.zen.map((z, i) => B * (z * (0.6 + 0.6 * t) + SKY.low[i] * 0.45)));
  const glow = SKY.amber.map((a, i) => a + (SKY.ember[i] - a) * (1 - t));
  U.uGlowC.value.set(...glow.map(g => B * g * 0.35));
  // The eye opens up in the dark; the grade still keeps it a dawn.
  renderer.toneMappingExposure = 2.1 - 1.25 * t;
  U.uShadowH.value = shadowH(deg);
  return U.uShadowH.value;
}
const setDawn = () => { dawn(9 - 8 * opts.dawn); draw(); };

/* ---------- K2: noise ---------- */
// Lifted from Fireworks, which lifted it from Night viaduct's Port.
const K2_NOISE = /* glsl */`
float k2hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float k2noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(k2hash(i), k2hash(i + vec2(1, 0)), u.x), mix(k2hash(i + vec2(0, 1)), k2hash(i + vec2(1, 1)), u.x), u.y);
}
float k2fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * k2noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s;
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: sky ---------- */
// The night sky becomes a dawn sky here: a sun below the horizon.
// Kept from Fireworks: k2stars. New: the glow, the rose band and the Earth's shadow.
const K2_SKY = /* glsl */`
uniform vec3 uSun;
uniform float uDawn;
uniform vec4 uFlame;
uniform vec3 uFlameC;
uniform float uAir;
// Air round the flame glows; a view ray collects it.
vec3 flameGlow(vec3 dir) {
  if (uFlame.w < 0.001) return vec3(0.0);
  vec3 v = uFlame.xyz - cameraPosition;
  float c = dot(dir, normalize(v)) - 1.0;
  float low = exp(-max(dir.y, 0.0) * 9.0);
  return uFlameC * uFlame.w * uAir * (0.06 * exp(c * 900.0) + 0.02 * exp(c * 60.0) + 0.012 * exp(c * 6.0) * low);
}
float k2stars(vec3 dir) {
  vec2 q = vec2(atan(dir.x, -dir.z) * 260.0, dir.y * 260.0);
  vec2 i = floor(q), f = fract(q) - 0.5;
  float h = k2hash(i);
  // About one cell in two hundred holds a star.
  float on = step(0.995, h);
  vec2 o = vec2(k2hash(i + 7.1), k2hash(i + 3.3)) - 0.5;
  return on * exp(-dot(f - o * 0.6, f - o * 0.6) * 60.0) * (0.02 + 0.05 * k2hash(i + 1.7));
}
vec3 k2sky(vec3 dir) {
  float t = uDawn, up = max(dir.y, 0.0);
  vec2 sh = normalize(uSun.xz), dh = normalize(dir.xz + vec2(1e-5));
  float cs = dot(dh, sh);
  // A broad lobe toward the sun, and a tight one round its azimuth.
  float near = pow(cs * 0.5 + 0.5, 4.0), tight = pow(max(cs, 0.0), 8.0);
  vec3 col = ${v3(SKY.zen)} * (0.6 + 0.6 * t);
  col += ${v3(SKY.low)} * exp(-up * 5.0);
  col += ${v3(SKY.rose)} * near * exp(-up * 6.0) * (0.4 + 0.6 * t);
  // The dark sky keeps a thin ember line; a bright one a wide amber glow.
  vec3 glow = mix(${v3(SKY.ember)}, ${v3(SKY.amber)}, t);
  col += glow * (0.3 * near + 0.9 * tight) * exp(-up * (30.0 - 16.0 * t));
  // Opposite the sun: the Earth's shadow, with the pink belt above it.
  float anti = pow(max(-cs, 0.0), 2.0);
  col *= 1.0 - 0.35 * anti * exp(-up * 12.0) * t;
  col += ${v3(SKY.belt)} * anti * exp(-pow((up - 0.12) / 0.07, 2.0)) * t;
  col *= 0.06 + 0.94 * t * t;
  float dark = (1.0 - t) * (1.0 - t);
  return col + vec3(0.85, 0.9, 1.0) * k2stars(dir) * smoothstep(0.03, 0.25, dir.y) * dark * 1.5 + flameGlow(dir);
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: haze ---------- */
// Height haze along the view ray; its colour is the low sky ahead.
// Fireworks' burst glow is cut here.
const K2_HAZE = /* glsl */`
uniform float uHaze;
uniform float uHazeH;
float k2hazeAmount(vec3 P) {
  vec3 v = P - cameraPosition;
  float dist = length(v);
  float k = 1.0 / uHazeH;
  float h0 = max(cameraPosition.y, 0.0), h1 = max(P.y, 0.0), dh = h1 - h0;
  // Exponential height fog integrated along the ray.
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);
  return 1.0 - exp(-dist * uHaze * max(avg, 0.0));
}
vec3 k2hazeColor(vec3 dir) { return k2sky(normalize(vec3(dir.x, 0.015, dir.z))) * 0.9; }
vec3 k2haze(vec3 c, vec3 P) {
  return mix(c, k2hazeColor(normalize(P - cameraPosition)), k2hazeAmount(P));
}`;
/* ---------- end K2 ---------- */

/* ---------- marsh map: the pool and the channels ---------- */
// The same water map runs on the CPU (placement) and the GPU (shading).
// Each channel: centre z, amplitude, frequency, phase, half width.
const CH = [[-125, 8, 0.011, 0.5, 8], [-300, 14, 0.006, 2.1, 14], [-720, 24, 0.0032, 4.0, 26]];
const POOL = [4, -38, 34, 20];
const chZ = (c, x) => c[0] + c[1] * Math.sin(x * c[2] + c[3]) + 0.4 * c[1] * Math.sin(x * c[2] * 2.3 + c[3] * 1.7);
const chW = (c, x) => c[4] * (1 + 0.3 * Math.sin(x * c[2] * 3 + c[3]));
const poolR = th => 1 + 0.16 * Math.sin(3 * th + 1) + 0.09 * Math.sin(5 * th + 2);
// Signed distance to open water in metres; below zero is water.
function wet(x, z) {
  const dx = (x - POOL[0]) / POOL[2], dz = (z - POOL[1]) / POOL[3];
  let d = (Math.hypot(dx, dz) - poolR(Math.atan2(dz, dx))) * POOL[3];
  for (const c of CH) d = Math.min(d, Math.abs(z - chZ(c, x)) - chW(c, x));
  return d;
}
const f4 = x => x.toFixed(4);
const MAP_GLSL = /* glsl */`
uniform float uShore;
float wet(vec2 p) {
  vec2 q = (p - vec2(${POOL[0]}.0, ${POOL[1]}.0)) / vec2(${POOL[2]}.0, ${POOL[3]}.0);
  float th = atan(q.y, q.x);
  float d = (length(q) - (1.0 + 0.16 * sin(3.0 * th + 1.0) + 0.09 * sin(5.0 * th + 2.0))) * ${POOL[3]}.0;
  ${CH.map(c => `d = min(d, abs(p.y - (${f4(c[0])} + ${f4(c[1])} * sin(p.x * ${f4(c[2])} + ${f4(c[3])}) + ${f4(0.4 * c[1])} * sin(p.x * ${f4(c[2] * 2.3)} + ${f4(c[3] * 1.7)}))) - ${f4(c[4])} * (1.0 + 0.3 * sin(p.x * ${f4(c[2] * 3)} + ${f4(c[3])})));`).join('\n  ')}
  return d;
}`;
/* ---------- end marsh map ---------- */
const HEAD = `${K2_NOISE}\n${K2_SKY}\n${K2_HAZE}\n${MAP_GLSL}`;

/* ---------- sky dome ---------- */
const sky = new THREE.Mesh(new THREE.SphereGeometry(20000, 48, 24), new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false,
  vertexShader: /* glsl */`varying vec3 vP; void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`varying vec3 vP; ${HEAD} void main() { gl_FragColor = vec4(k2sky(normalize(vP - cameraPosition)), 1.0); }`,
}));
sky.renderOrder = -1;
scene.add(sky);

/* ---------- ground: water, mud and the far flats ---------- */
// Mirror: a camera under y = 0 sees only the MIRROR layer.
const mirrorCam = new THREE.PerspectiveCamera();
mirrorCam.layers.set(MIRROR);
const mirrorRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
const texM = new THREE.Matrix4();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(16000, 9000).rotateX(-Math.PI / 2).translate(0, 0, -4400), new THREE.ShaderMaterial({
  uniforms: { ...U, tMirror: { value: mirrorRT.texture }, uTexM: { value: texM } },
  vertexShader: /* glsl */`uniform mat4 uTexM; varying vec3 vP; varying vec4 vM;
  void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; vM = uTexM * vec4(vP, 1.0); gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`uniform sampler2D tMirror; uniform float uTime; uniform vec3 uAmb, uGlowC; varying vec3 vP; varying vec4 vM; ${HEAD}
  void main() {
    vec3 v = normalize(vP - cameraPosition);
    vec2 p = vP.xz;
    float dist = length(p - cameraPosition.xz);
    // Past the last channel the reeds stop: flats of mud and shallow pools.
    float flats = smoothstep(-790.0, -840.0, p.y);
    float pools = smoothstep(0.48, 0.56, k2fbm(p * vec2(0.004, 0.012) + 3.1));
    // A lagoon lies in front of the far shore.
    float lagoon = smoothstep(uShore + 140.0, uShore + 110.0, p.y) * step(uShore, p.y);
    float d = wet(p);
    float aa = max(fwidth(d), 0.05);
    float water = max(1.0 - smoothstep(-aa, aa, d), flats * max(pools, lagoon));
    if (p.y < uShore) water = 0.0;
    // Still water: a faint breath of ripple only.
    float n = k2noise(p * vec2(0.08, 0.25) + uTime * vec2(0.02, 0.05)) - 0.5;
    vec3 nrm = normalize(vec3(n * 0.006, 1.0, n * 0.004));
    vec3 r = reflect(v, nrm);
    float fres = 0.02 + 0.98 * pow(1.0 - max(dot(-v, nrm), 0.0), 5.0);
    // Nine taps smear each light into a streak, longer where the view grazes.
    vec2 uv = vM.xy / vM.w + vec2(n * 0.002, n * 0.004);
    float len = 0.0008 + 0.004 * smoothstep(60.0, 1500.0, dist);
    vec4 m = vec4(0.0);
    float ws = 0.0;
    for (int i = -4; i <= 4; i++) {
      float fi = float(i), w = exp(-fi * fi / 8.0);
      m += texture2D(tMirror, uv + vec2(0.0, fi * len)) * w;
      ws += w;
    }
    m /= ws;
    vec3 wcol = vec3(0.003, 0.004, 0.005) * uAmb * 10.0 + (k2sky(r) * (1.0 - m.a) + m.rgb) * fres;
    // Mud and reed litter: dark, with a little sky on the wet bits.
    float grain = k2noise(p * 0.6) * 0.5 + k2noise(p * 3.1) * 0.5;
    vec3 mud = uAmb * (0.12 + 0.08 * grain) + uGlowC * 0.02 * flats;
    vec3 c = mix(mud, wcol, water);
    gl_FragColor = vec4(k2haze(c, vP), 1.0);
  }`,
}));
scene.add(ground);
const bias = new THREE.Matrix4().set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);
const tgt = new THREE.Vector3(), fwd = new THREE.Vector3();
function renderMirror() {
  camera.updateMatrixWorld();
  camera.getWorldDirection(fwd);
  tgt.copy(camera.position).add(fwd);
  mirrorCam.position.set(camera.position.x, -camera.position.y, camera.position.z);
  mirrorCam.up.set(0, -1, 0);
  mirrorCam.lookAt(tgt.x, -tgt.y, tgt.z);
  mirrorCam.fov = camera.fov; mirrorCam.aspect = camera.aspect;
  mirrorCam.near = camera.near; mirrorCam.far = camera.far;
  mirrorCam.updateProjectionMatrix();
  mirrorCam.updateMatrixWorld();
  texM.copy(bias).multiply(mirrorCam.projectionMatrix).multiply(mirrorCam.matrixWorldInverse);
  renderer.setRenderTarget(mirrorRT);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  renderer.render(scene, mirrorCam);
  renderer.setRenderTarget(null);
}

/* ---------- reed shading ---------- */
// Dark stems take the sky's ambient and glow at the edges toward the sun.
const REED_GLSL = /* glsl */`
uniform vec3 uAmb, uGlowC;
uniform float uSway;
// A gust field: long rolling waves with a little noise on top.
vec2 gust(vec2 p, float t) {
  float w = sin(p.x * 0.05 + p.y * 0.02 - t * 1.1) * 0.6 + sin(p.x * 0.13 - p.y * 0.07 - t * 1.9) * 0.3;
  w += (k2noise(p * 0.04 + vec2(t * 0.3, 0.0)) - 0.5) * 0.8;
  return vec2(0.9, 0.35) * w * uSway;
}
vec3 reedLight(vec3 P, float head, float tone, float edge) {
  vec3 V = normalize(P - cameraPosition);
  float toward = pow(max(dot(normalize(V.xz), normalize(uSun.xz)), 0.0), 3.0);
  // Stems and leaves stay near-black; plumes are pale straw.
  vec3 alb = mix(mix(vec3(0.09, 0.075, 0.055), vec3(0.14, 0.11, 0.075), tone), vec3(0.32, 0.26, 0.19), head);
  vec3 c = alb * uAmb * 1.3;
  // Backlight: thin edges and plume hairs glow toward the dawn.
  c += uGlowC * toward * (0.003 + head * (0.025 + 0.16 * edge * edge));
  // The flame rims the stems and plumes that stand against it.
  vec3 F = normalize(uFlame.xyz - P);
  float face = pow(max(dot(V, F), 0.0), 5.0);
  c += uFlameC * uFlame.w * (0.0003 + face * (0.002 + head * (0.006 + 0.03 * edge * edge))) * (0.3 + 0.7 * uAir);
  return k2haze(c, P);
}`;
/* ---------- end reed shading ---------- */

/* ---------- reeds: instanced stalks with plumes and leaves ---------- */
// One instance is a stalk, three leaves and a plume, each a camera-facing ribbon.
// aG: x = t along the piece, y = side, z = piece (0 stalk, 1 to 3 leaves, 4 plume).
function reedGeometry() {
  const g = [], idx = [];
  const piece = (k, n) => {
    const base = g.length / 3;
    for (let i = 0; i <= n; i++) for (const s of [-1, 1]) g.push(i / n, s, k);
    for (let i = 0; i < n; i++) { const a = base + i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  };
  piece(0, 10); piece(1, 6); piece(2, 6); piece(3, 6); piece(4, 10);
  const geo = new THREE.InstancedBufferGeometry();

function wake() {
  lastInput = performance.now();
  if (!raf && visible && !document.hidden) raf = requestAnimationFrame(tick);
}
/* Performance ladder: slow frames step quality down a rung, never back up. */
let watchFrom = 0, watchN = 0, watchSum = 0, prevDraw = 0;
function watch(now, lively) {
  const gap = now - prevDraw;
  prevDraw = now;
  if (gap > 200) { watchFrom = now; watchN = watchSum = 0; return; }
  if (!watchFrom) watchFrom = now;
  if (now - watchFrom < 4000) return;
  watchN++; watchSum += gap;
  if (watchN < 2 || now - watchFrom < 6000) return;
  if (watchSum / watchN > (lively ? 1000 / 38 : 1000 / 22) && rung < 3) { rung++; resize(); }
  watchFrom = now - 4000; watchN = watchSum = 0;
}
whenVisible(stage, vis => {
  visible = vis;
  if (!vis) { cancelAnimationFrame(raf); raf = 0; lastT = 0; return; }
  draw();
  wake();
});
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
onReducedChange(on => { starMat.uniforms.uSteady.value = on ? 1 : 0; PU.uShear.value = on ? 0 : 1; wake(); });

/* Pointer: a press turns into a look drag after 8 px; a short release is a tap. */
let press = null;
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture(e.pointerId);
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, yaw: lookTo.yaw, pitch: lookTo.pitch, at: performance.now(), drag: false };
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  const dx = e.clientX - press.x, dy = e.clientY - press.y;
  if (!press.drag && Math.hypot(dx, dy) > 8) { press.drag = true; stage.classList.add('held'); }
  if (!press.drag) return;
  // One stage height of travel turns the view by the lens angle.
  const k = THREE.MathUtils.degToRad(camera.fov) / size.h;
  lookTo.yaw = THREE.MathUtils.clamp(press.yaw + dx * k, -0.32, 0.32);
  lookTo.pitch = THREE.MathUtils.clamp(press.pitch + dy * k, -0.2, 0.5);
});
const end = e => {
  if (!press || e.pointerId !== press.id) return;
  const tap = e.type === 'pointerup' && !press.drag && performance.now() - press.at < 260;
  const r = stage.getBoundingClientRect(), ndcX = ((press.x - r.left) / r.width) * 2 - 1;
  press = null;
  stage.classList.remove('held');
  if (tap) start(ndcX);
  wake();
};
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);
// Space launches; the shell ignores it while a sheet has focus.
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat || e.target.closest?.('input, button, .s2-sheet')) return;
  e.preventDefault();
  if (flight) { follow = !follow; wake(); } else act.launch();
});

function setDistance(v) { buildShore(DIST[v] ?? DIST.mid); draw(); }
function setBox(on) { grade.uniforms.uBox.value = on ? 1 : 0; draw(); }

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
dawn(9 - 8 * opts.dawn);
buildBanks();
buildShore(DIST[ui.setting('distance').value] ?? DIST.mid);
setBox(ui.setting('letterbox').value);
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  markReady();
  wake();
}, () => { canvas.classList.add('on'); markReady(); });
</script>
</body>
</html>
