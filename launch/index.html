<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.14 0.014 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marsh launch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Marsh launch: a reed marsh before dawn. */
:root { --stage: oklch(0.12 0.03 265); }
.stage--launch canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--launch canvas.on { opacity: 1; }
.stage--launch.held canvas { cursor: grabbing; }
@media (prefers-reduced-motion: reduce) { .stage--launch canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Marsh launch</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--launch" id="stage" tabindex="0" role="application" aria-label="A reed marsh before dawn. A rocket waits on the far shore. Drag to look around.">
      <p class="fail" hidden>Marsh launch needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Marsh launch</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehShader } from 'three/addons/shaders/BokehShader2.js';
import { createNoise2D } from 'simplex-noise';
import { gsap } from 'gsap';
import { initPage, whenVisible, pixelRatio, onQuality, linFit, reduced, onReducedChange, quality, audioKit, sound } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

/* ---------- settings ---------- */
const store = {
  get(k) { try { return localStorage.getItem(`stimming.launch.${k}`); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(`stimming.launch.${k}`, String(v)); } catch { /* storage off */ } },
};
// Distance to the pad in metres; the roar delay follows it.
const DIST = { near: 1200, mid: 2000, far: 3400 };
// The pad stands at the far distance; the roar takes ten seconds to arrive.
const PAD = DIST.far;
const opts = {
  kind: ['small', 'medium', 'heavy'].includes(store.get('kind')) ? store.get('kind') : 'medium',
  dawn: Number.isFinite(+store.get('dawn')) && store.get('dawn') !== null ? Math.min(1, Math.max(0, +store.get('dawn'))) : 0.4,
};

/* ---------- bar ---------- */
const act = { launch() {} };
const ui = initPage({ id: 'launch', bar: {
  choice: {
    label: 'Rocket', value: opts.kind,
    options: [{ value: 'small', label: 'Small' }, { value: 'medium', label: 'Medium' }, { value: 'heavy', label: 'Heavy' }],
    onPick: v => { opts.kind = v; store.set('kind', v); },
  },
  // Dawn moves the sun from 9 to 1 degrees under the horizon.
  slider: { label: 'Dawn', min: 0, max: 1, step: 0.005, value: opts.dawn, onInput: v => { opts.dawn = v; store.set('dawn', v); setDawn(); } },
  actions: [{ verb: 'launch', label: 'Launch', onPress: () => act.launch() }],
  settings: [
    { type: 'toggle', id: 'letterbox', label: 'Letterbox', value: false, persist: true, onToggle: on => setBox(on) },
    // Bokeh on three.js's BokehShader2: a round or a five-blade disc.
    { type: 'choice', id: 'shape', label: 'Bokeh', value: 'round', persist: true,
      options: [{ value: 'round', label: 'Round' }, { value: 'pentagon', label: 'Pentagon' }],
      onPick: () => setLens() },
    // Fine control for the near reeds: blur size, focus (far left is auto), highlight discs.
    { type: 'slider', id: 'aperture', label: 'Aperture', min: 0, max: 3, step: 0.05, value: 1, persist: true, onInput: () => draw() },
    { type: 'slider', id: 'focus', label: 'Focus', min: 0, max: 1, step: 0.01, value: 0, persist: true, onInput: () => wake() },
    { type: 'slider', id: 'glow', label: 'Highlights', min: 0, max: 2, step: 0.05, value: 1, persist: true, onInput: () => draw() },
  ],
  quality: true,
  keys: [['click', 'launch'], ['click', 'zoom in or out'], ['drag', 'look around']],
} });

const stage = document.getElementById('stage');
let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

// Seeded random keeps the marsh the same on every load.
let seed = 5511;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; ui.hideControls(); markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const canvas = renderer.domElement;
stage.prepend(canvas);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 80000);
// The eye stands on a low dike above the reeds.
const EYE = 5.5;
camera.position.set(0, EYE, 0);
camera.rotation.order = 'YXZ';
// Layer 1 holds what the water mirrors.
const MIRROR = 1;
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;

/* ---------- uniforms ---------- */
const U = {
  uTime: { value: 0 },
  uSun: { value: new THREE.Vector3(0, -0.1, -1) },
  uDawn: { value: 0.5 },
  uAmb: { value: new THREE.Vector3() },
  uGlowC: { value: new THREE.Vector3() },
  uHaze: { value: 0.0005 },
  uHazeH: { value: 22 },
  uSway: { value: 1 },
  uShore: { value: -2000 },
  // The flame: world position and strength; its colour.
  uFlame: { value: new THREE.Vector4(0, 0, -2000, 0) },
  uFlameC: { value: new THREE.Vector3(1, 0.5, 0.18) },
  // The Earth's shadow line in km of real altitude.
  uShadowH: { value: 35 },
  // The sound front: pad x, pad z, radius, strength.
  uFront: { value: new THREE.Vector4(0, 0, 0, 0) },
  // Thick air round a low flame glows; thin air high up does not.
  uAir: { value: 1 },
  // Night: 0 at 9° of depression, 1 at 18°; the flame carries the light.
  uNight: { value: 0 },
  // Wisps: a random offset per load, and how much sky they cover.
  uWisp: { value: new THREE.Vector3(Math.random() * 200, Math.random() * 200, 0.3 + Math.random() * 0.7) },
};

/* ---------- dawn: sky, sun and the Earth's shadow line ---------- */
// The sun sits ahead and to the left; the climb bends right, into dark sky.
const SUN_AZ = new THREE.Vector2(-0.4, -0.92).normalize();
// Sky colours, shared by the GPU sky and the CPU ambient.
const SKY = {
  zen: [0.018, 0.04, 0.13], low: [0.05, 0.055, 0.085], rose: [0.24, 0.075, 0.09],
  amber: [1.5, 0.34, 0.03], ember: [0.9, 0.16, 0.02], belt: [0.18, 0.08, 0.12],
};
const v3 = a => `vec3(${a.map(x => x.toFixed(4)).join(', ')})`;
// Air above this height (km) is sunlit with the sun δ degrees down.
const R_EARTH = 6371;
function shadowH(deg) { return R_EARTH * (1 / Math.cos(THREE.MathUtils.degToRad(deg)) - 1); }
let depression = 6;
// Brightness of the whole sky, 0 at δ = 9 and 1 at δ = 1.
const skyB = t => 0.06 + 0.94 * t * t;
function dawn(deg) {
  depression = deg;
  const t = THREE.MathUtils.clamp((9 - deg) / 8, 0, 1);
  // Past 9° the dawn is gone: the sky and the ambient fall toward night.
  const n = THREE.MathUtils.clamp((deg - 9) / 9, 0, 1);
  const r = THREE.MathUtils.degToRad(deg);
  U.uSun.value.set(SUN_AZ.x * Math.cos(r), -Math.sin(r), SUN_AZ.y * Math.cos(r));
  U.uDawn.value = t;
  U.uNight.value = n;
  // Ambient: the zenith and the low band; glow: the sun-side horizon.
  const B = skyB(t) * (1 - 0.8 * n);
  U.uAmb.value.set(...SKY.zen.map((z, i) => B * (z * (0.6 + 0.6 * t) + SKY.low[i] * 0.45)));
  const glow = SKY.amber.map((a, i) => a + (SKY.ember[i] - a) * (1 - t));
  U.uGlowC.value.set(...glow.map(g => B * g * 0.35 * (1 - 0.7 * n)));
  // The eye opens up in the dark; the grade still keeps it a dawn.
  renderer.toneMappingExposure = 2.1 - 1.25 * t + 0.3 * n;
  U.uShadowH.value = shadowH(deg);
  return U.uShadowH.value;
}
// The slider runs from full night (18° down) to the last of the dawn (1°).
const dawnDeg = v => 1 + 17 * Math.pow(1 - v, 1.3);
const setDawn = () => { dawn(dawnDeg(opts.dawn)); draw(); };

/* ---------- K2: noise ---------- */
// Lifted from Fireworks, which lifted it from Night viaduct's Port.
const K2_NOISE = /* glsl */`
float k2hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float k2noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(k2hash(i), k2hash(i + vec2(1, 0)), u.x), mix(k2hash(i + vec2(0, 1)), k2hash(i + vec2(1, 1)), u.x), u.y);
}
float k2fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * k2noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s;
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: sky ---------- */
// The night sky becomes a dawn sky here: a sun below the horizon.
// Kept from Fireworks: k2stars. New: the glow, the rose band and the Earth's shadow.
const K2_SKY = /* glsl */`
uniform vec3 uSun;
uniform float uDawn;
uniform vec4 uFlame;
uniform vec3 uFlameC;
uniform float uAir;
uniform float uNight;
uniform vec3 uWisp;
// Wisps: thin streaks of high cloud on a sheet 7 km up.
// Unlit they are grey shapes; near dawn their undersides catch the glow.
vec3 wisps(vec3 dir, vec3 col, float t, float cs) {
  if (dir.y < 0.015 || uWisp.z < 0.01) return col;
  vec2 p = dir.xz / dir.y * 7.0;
  float n = k2noise(vec2(p.x * 0.045, p.y * 0.3) + uWisp.xy) * 0.6 + k2noise(vec2(p.x * 0.16, p.y * 1.3) + uWisp.yx) * 0.4;
  float d = smoothstep(0.78 - 0.08 * uWisp.z, 0.95, n) * smoothstep(0.015, 0.07, dir.y) * (1.0 - smoothstep(0.25, 0.45, dir.y));
  if (d < 0.002) return col;
  vec3 glowC = mix(vec3(0.55, 0.3, 0.32), vec3(1.0, 0.55, 0.35), pow(max(cs, 0.0), 3.0));
  vec3 cloud = mix(col * 0.85 + vec3(0.002, 0.002, 0.004), glowC * (0.05 + 0.5 * t * t), smoothstep(0.2, 0.9, t) * (0.35 + 0.65 * max(cs, 0.0)));
  return mix(col, cloud, d * 0.5);
}
// Air round the flame glows; a view ray collects it.
vec3 flameGlow(vec3 dir) {
  if (uFlame.w < 0.001) return vec3(0.0);
  vec3 v = uFlame.xyz - cameraPosition;
  float c = dot(dir, normalize(v)) - 1.0;
  float low = exp(-max(dir.y, 0.0) * 9.0);
  return uFlameC * uFlame.w * uAir * (1.0 + 0.4 * uNight) * (0.06 * exp(c * 900.0) + 0.02 * exp(c * 60.0) + 0.012 * exp(c * 6.0) * low);
}
float k2stars(vec3 dir) {
  vec2 q = vec2(atan(dir.x, -dir.z) * 260.0, dir.y * 260.0);
  vec2 i = floor(q), f = fract(q) - 0.5;
  float h = k2hash(i);
  // About one cell in two hundred holds a star.
  float on = step(0.995, h);
  vec2 o = vec2(k2hash(i + 7.1), k2hash(i + 3.3)) - 0.5;
  return on * exp(-dot(f - o * 0.6, f - o * 0.6) * 60.0) * (0.02 + 0.05 * k2hash(i + 1.7));
}
vec3 k2sky(vec3 dir) {
  float t = uDawn, up = max(dir.y, 0.0);
  vec2 sh = normalize(uSun.xz), dh = normalize(dir.xz + vec2(1e-5));
  float cs = dot(dh, sh);
  // A broad lobe toward the sun, and a tight one round its azimuth.
  float near = pow(cs * 0.5 + 0.5, 4.0), tight = pow(max(cs, 0.0), 8.0);
  vec3 col = ${v3(SKY.zen)} * (0.6 + 0.6 * t);
  col += ${v3(SKY.low)} * exp(-up * 5.0);
  col += ${v3(SKY.rose)} * near * exp(-up * 6.0) * (0.4 + 0.6 * t);
  // The dark sky keeps a thin ember line; a bright one a wide amber glow.
  vec3 glow = mix(${v3(SKY.ember)}, ${v3(SKY.amber)}, t);
  col += glow * (0.3 * near + 0.9 * tight) * exp(-up * (30.0 - 16.0 * t));
  // Opposite the sun: the Earth's shadow, with the pink belt above it.
  float anti = pow(max(-cs, 0.0), 2.0);
  col *= 1.0 - 0.35 * anti * exp(-up * 12.0) * t;
  col += ${v3(SKY.belt)} * anti * exp(-pow((up - 0.12) / 0.07, 2.0)) * t;
  col *= 0.06 + 0.94 * t * t;
  // Night: the ember line goes out, the sky falls to near black, the stars come up.
  col *= 1.0 - 0.8 * uNight;
  float dark = (1.0 - t) * (1.0 - t) * (1.0 + 2.0 * uNight);
  col += vec3(0.85, 0.9, 1.0) * k2stars(dir) * smoothstep(0.03, 0.25, dir.y) * dark * 1.5;
  return wisps(dir, col, t, cs) + flameGlow(dir);
}`;
/* ---------- end K2 ---------- */

/* ---------- K2: haze ---------- */
// Height haze along the view ray; its colour is the low sky ahead.
// Fireworks' burst glow is cut here.
const K2_HAZE = /* glsl */`
uniform float uHaze;
uniform float uHazeH;
float k2hazeAmount(vec3 P) {
  vec3 v = P - cameraPosition;
  float dist = length(v);
  float k = 1.0 / uHazeH;
  float h0 = max(cameraPosition.y, 0.0), h1 = max(P.y, 0.0), dh = h1 - h0;
  // Exponential height fog integrated along the ray.
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);
  return 1.0 - exp(-dist * uHaze * max(avg, 0.0));
}
vec3 k2hazeColor(vec3 dir) { return k2sky(normalize(vec3(dir.x, 0.015, dir.z))) * 0.9; }
vec3 k2haze(vec3 c, vec3 P) {
  return mix(c, k2hazeColor(normalize(P - cameraPosition)), k2hazeAmount(P));
}`;
/* ---------- end K2 ---------- */

/* ---------- marsh map: the pool and the channels ---------- */
// The same water map runs on the CPU (placement) and the GPU (shading).
// Each channel: centre z, amplitude, frequency, phase, half width.
const CH = [[-125, 8, 0.011, 0.5, 8], [-300, 14, 0.006, 2.1, 14], [-480, 18, 0.004, 1.2, 16], [-720, 24, 0.0032, 4.0, 26], [-1100, 30, 0.0025, 2.6, 34]];
const POOL = [4, -38, 34, 20];
const chZ = (c, x) => c[0] + c[1] * Math.sin(x * c[2] + c[3]) + 0.4 * c[1] * Math.sin(x * c[2] * 2.3 + c[3] * 1.7);
const chW = (c, x) => c[4] * (1 + 0.3 * Math.sin(x * c[2] * 3 + c[3]));
const poolR = th => 1 + 0.16 * Math.sin(3 * th + 1) + 0.09 * Math.sin(5 * th + 2);
// Signed distance to open water in metres; below zero is water.
function wet(x, z) {
  const dx = (x - POOL[0]) / POOL[2], dz = (z - POOL[1]) / POOL[3];
  let d = (Math.hypot(dx, dz) - poolR(Math.atan2(dz, dx))) * POOL[3];
  for (const c of CH) d = Math.min(d, Math.abs(z - chZ(c, x)) - chW(c, x));
  return d;
}
const f4 = x => x.toFixed(4);
const MAP_GLSL = /* glsl */`
uniform float uShore;
float wet(vec2 p) {
  vec2 q = (p - vec2(${POOL[0]}.0, ${POOL[1]}.0)) / vec2(${POOL[2]}.0, ${POOL[3]}.0);
  float th = atan(q.y, q.x);
  float d = (length(q) - (1.0 + 0.16 * sin(3.0 * th + 1.0) + 0.09 * sin(5.0 * th + 2.0))) * ${POOL[3]}.0;
  ${CH.map(c => `d = min(d, abs(p.y - (${f4(c[0])} + ${f4(c[1])} * sin(p.x * ${f4(c[2])} + ${f4(c[3])}) + ${f4(0.4 * c[1])} * sin(p.x * ${f4(c[2] * 2.3)} + ${f4(c[3] * 1.7)}))) - ${f4(c[4])} * (1.0 + 0.3 * sin(p.x * ${f4(c[2] * 3)} + ${f4(c[3])})));`).join('\n  ')}
  return d;
}`;
/* ---------- end marsh map ---------- */
const HEAD = `${K2_NOISE}\n${K2_SKY}\n${K2_HAZE}\n${MAP_GLSL}`;

/* ---------- sky dome ---------- */
const sky = new THREE.Mesh(new THREE.SphereGeometry(20000, 48, 24), new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false,
  vertexShader: /* glsl */`varying vec3 vP; void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`varying vec3 vP; ${HEAD} void main() { gl_FragColor = vec4(k2sky(normalize(vP - cameraPosition)), 1.0); }`,
}));
sky.renderOrder = -1;
scene.add(sky);

/* ---------- ground: water, mud and the far flats ---------- */
// Mirror: a camera under y = 0 sees only the MIRROR layer.
const mirrorCam = new THREE.PerspectiveCamera();
mirrorCam.layers.set(MIRROR);
const mirrorRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
const texM = new THREE.Matrix4();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200000, 120000).rotateX(-Math.PI / 2).translate(0, 0, -59000), new THREE.ShaderMaterial({
  uniforms: { ...U, tMirror: { value: mirrorRT.texture }, uTexM: { value: texM } },
  vertexShader: /* glsl */`uniform mat4 uTexM; varying vec3 vP; varying vec4 vM;
  void main() { vP = (modelMatrix * vec4(position, 1.0)).xyz; vM = uTexM * vec4(vP, 1.0); gl_Position = projectionMatrix * viewMatrix * vec4(vP, 1.0); }`,
  fragmentShader: /* glsl */`uniform sampler2D tMirror; uniform float uTime; uniform vec3 uAmb, uGlowC; varying vec3 vP; varying vec4 vM; ${HEAD}
  void main() {
    vec3 v = normalize(vP - cameraPosition);
    vec2 p = vP.xz;
    float dist = length(p - cameraPosition.xz);
    // Past the last channel the reeds stop: flats of mud and shallow pools.
    float flats = smoothstep(-790.0, -840.0, p.y);
    float pools = smoothstep(0.48, 0.56, k2fbm(p * vec2(0.004, 0.012) + 3.1));
    // A lagoon lies in front of the far shore.
    float lagoon = smoothstep(uShore + 140.0, uShore + 110.0, p.y) * step(uShore, p.y);
    float d = wet(p);
    float aa = max(fwidth(d), 0.05);
    float water = max(1.0 - smoothstep(-aa, aa, d), flats * max(pools, lagoon));
    if (p.y < uShore) water = 0.0;
    // Still water: a faint breath of ripple only.
    float n = k2noise(p * vec2(0.08, 0.25) + uTime * vec2(0.02, 0.05)) - 0.5;
    vec3 nrm = normalize(vec3(n * 0.006, 1.0, n * 0.004));
    vec3 r = reflect(v, nrm);
    float fres = 0.02 + 0.98 * pow(1.0 - max(dot(-v, nrm), 0.0), 5.0);
    // Nine taps smear each light into a streak, longer where the view grazes.
    vec2 uv = vM.xy / vM.w + vec2(n * 0.002, n * 0.004);
    float len = 0.0008 + 0.004 * smoothstep(60.0, 1500.0, dist);
    vec4 m = vec4(0.0);
    float ws = 0.0;
    for (int i = -4; i <= 4; i++) {
      float fi = float(i), w = exp(-fi * fi / 8.0);
      m += texture2D(tMirror, uv + vec2(0.0, fi * len)) * w;
      ws += w;
    }
    m /= ws;
    vec3 wcol = vec3(0.003, 0.004, 0.005) * uAmb * 10.0 + (k2sky(r) * (1.0 - m.a) + m.rgb) * fres;
    // Mud and reed litter: dark, with a little sky on the wet bits.
    float grain = k2noise(p * 0.6) * 0.5 + k2noise(p * 3.1) * 0.5;
    vec3 mud = uAmb * (0.12 + 0.08 * grain) + uGlowC * 0.02 * flats;
    vec3 c = mix(mud, wcol, water);
    gl_FragColor = vec4(k2haze(c, vP), 1.0);
  }`,
}));
scene.add(ground);
const bias = new THREE.Matrix4().set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);
const tgt = new THREE.Vector3(), fwd = new THREE.Vector3();
function renderMirror() {
  camera.updateMatrixWorld();
  camera.getWorldDirection(fwd);
  tgt.copy(camera.position).add(fwd);
  mirrorCam.position.set(camera.position.x, -camera.position.y, camera.position.z);
  mirrorCam.up.set(0, -1, 0);

}
// The flame's glow goes in the post pass as an orb.
const orbList = () => (flight && U.uFlame.value.w > 0.01 ? [{ pos: tmpB.set(U.uFlame.value.x, U.uFlame.value.y, U.uFlame.value.z), color: [1, 0.6, 0.3], size: 0.4 + 0.4 * U.uAir.value + flight.flash * 2.5, k: U.uFlame.value.w * (0.12 + 0.3 * U.uAir.value) }] : []);
// The horizon sits low: the climb needs a tall sky.
function frame() {
  const portrait = size.w < size.h;
  placeGantry(padX());
  // A wide lens takes in the whole sweep of the marsh; the horizon sits on the lower third.
  const fov = portrait ? 66 : 50;
  camera.aspect = size.w / size.h;
  const hf = portrait ? 0.76 : 0.7;
  // The launch zoom narrows the lens; the horizon holds its place in the frame.
  camera.fov = fov * cam.zoom;
  baseUp = Math.atan((2 * hf - 1) * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  // A hand on the camera: a slow, tiny wobble while the scene is awake.
  // The launch adds a shake that dies away as the rocket climbs.
  const wk = reduced() ? 0 : pace * (1 + (flight ? flight.shake : 0) * 2.2), t = simT;
  const wy = wk * (0.0026 * Math.sin(t * 0.61) + 0.0012 * Math.sin(t * 1.73 + 1.3) + 0.0005 * Math.sin(t * 4.9 + 0.3));
  const wp = wk * (0.002 * Math.sin(t * 0.83 + 0.4) + 0.001 * Math.sin(t * 2.11) + 0.0005 * Math.sin(t * 6.3 + 2.1));
  const wr = wk * (0.0014 * Math.sin(t * 0.47 + 2.0) + 0.0004 * Math.sin(t * 3.7));
  camera.rotation.set(baseUp + look.pitch + auto.pitch + wp, look.yaw + auto.yaw + wy, wr);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
}
function resize() {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  // Rung 1 of the ladder drops the pixel ratio; rung 2 shrinks the mirror.
  size = { w, h, dpr: pixelRatio(w, h, { maxDpr: 1.5, budget: 1.6e6, low: rung >= 1 }) };
  renderer.setPixelRatio(size.dpr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(size.dpr);
  composer.setSize(w, h);
  makeSceneRT(Math.round(w * size.dpr), Math.round(h * size.dpr));
  const m = rung >= 2 ? 0.35 : quality() === 'high' ? 0.75 : 0.5;
  mirrorRT.setSize(Math.max(1, Math.round(w * size.dpr * m)), Math.max(1, Math.round(h * size.dpr * m)));
  grade.uniforms.uRes.value.set(w * size.dpr, h * size.dpr);
  dofPass.uniforms.textureWidth.value = w * size.dpr;
  dofPass.uniforms.textureHeight.value = h * size.dpr;
  dofTaps();
  birdMesh.material.uniforms.uPx.value = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / h;
  dofK = 80 * h * size.dpr / 800;
  dofCap = 13 * h * size.dpr / 800;
  starMat.uniforms.uRes.value.set(w * size.dpr, h * size.dpr);
  starMat.uniforms.uDpr.value = size.dpr;
  // Rung 3 thins the reeds.
  plantReeds(rung >= 3 ? 3000 : quality() === 'high' ? 6000 : 4500);
  plantFar(rung >= 3 ? 4000 : quality() === 'high' ? 12000 : 9000);
  frame();
  draw();
}
// A page that loads hidden may get no visibility event before input.
let visible = !document.hidden;
let grainTick = 0, drawN = 0;
let compiled = false, lastSimDraw = 0;
function draw() {
  // Nothing draws before the shaders compile behind the intro.
  if (!visible || !compiled) return;
  drawN++;
  commitStars();
  commitPuffs();
  updateGround(Math.min(0.1, simT - lastSimDraw));
  lastSimDraw = simT;
  renderMirror();
  // The scene, with depth, into sceneRT; the post chain starts from there.
  renderer.setRenderTarget(sceneRT);
  renderer.setClearColor(0x000000, 1);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  placeOrbs(orbPass, orbList());
  // Focus sits at the pad, or where the Focus slider puts it.
  const du = dofPass.uniforms;
  du.focalDepth.value = 1 / focusD;
  // A longer lens has a shallower field: the blur grows with the square of the zoom.
  const zk = 1 / Math.pow(cam.zoom, 2);
  const ap = ui.setting('aperture').value;
  // The focus hunt opens the near blur only; the distance never softens.
  du.uK.value = dofK * zk * ap * (1 + cam.hunt * 1.5);
  du.uCapPx.value = dofCap * Math.sqrt(zk) * Math.max(0.2, Math.sqrt(ap)) * (1 + cam.hunt * 0.5);
  du.maxblur.value = du.uCapPx.value / dofPass.material.defines.RINGS;
  du.gain.value = 2 * ui.setting('glow').value;
  // The grain reseeds every second drawn frame: alive, not fizzing.
  if (!reduced() && (++grainTick & 1)) grade.uniforms.uSeed.value = (grade.uniforms.uSeed.value % 997) + 1;
  composer.render();
}

/* Frame loop: 30 fps, idle or not; it sleeps 60 s after the last input. */
// QA can shorten the sleep with ?sleep=<ms>.
const SLEEP = +new URLSearchParams(location.search).get('sleep') || 60000;
// One film frame in ms; nap holds a drifting wait.
const FRAME = 1000 / 30;
let nap = 0;
let raf = 0, lastT = 0, lastDraw = 0, lastInput = performance.now(), pace = reduced() ? 0 : 1, simT = 0;
const busy = () => !!press || !!flight || gFluid.live || gsap.isTweening(cam) || Math.abs(focusTo - focusD) > 2e-5 || birds.some(b => b.up && b.a > 0.01) || simT < lastDeath || Math.abs(auto.pitch) + Math.abs(auto.yaw) > 1e-3 || Math.abs(lookTo.yaw - look.yaw) + Math.abs(lookTo.pitch - look.pitch) > 1e-4;
function tick(now) {
  raf = 0;
  if (!visible || document.hidden) { lastT = 0; return; }
  const dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0;
  lastT = now;
  // Ambient sway eases out over 2 s once idle; reduced motion holds it still.
  // A flight in the air keeps the scene awake.
  const awake = !reduced() && (!!flight || now - lastInput < SLEEP);
  pace = awake ? Math.min(1, pace + dt / 2) : Math.max(0, pace - dt / 2);
  const lively = busy();
  try {
    simT += dt;
    U.uTime.value = simT;
    U.uSway.value = pace;
    if (flight) flyTo(flight);
    aimFollow(dt);
    easeLook(dt);
    autofocus(dt);
    // The film runs at 30 frames a second: every second tick of a 60 Hz screen.
    if (now - lastDraw >= FRAME - 2) {
      frame();
      draw();
      watch(now, lively);
      // Step the clock by whole film frames, so 60 Hz screens hold an even cadence.
      lastDraw = now - lastDraw > FRAME * 3 ? now : lastDraw + FRAME;
    }
  } finally {
    soundBed();
    if (visible && lively) raf = requestAnimationFrame(tick);
    // While drifting, wait for the next film frame before asking for one.
    else if (visible && pace > 0) { raf = -1; nap = setTimeout(() => { nap = 0; raf = requestAnimationFrame(tick); }, Math.max(0, lastDraw + FRAME - 18 - performance.now())); }
    else { lastT = 0; draw(); kit.rest(() => !busy() && !pending()); }
  }
}
function wake() {
  lastInput = performance.now();
  // Input cuts a drifting wait short.
  if (nap) { clearTimeout(nap); nap = 0; raf = 0; }
  if (!raf && visible && !document.hidden) raf = requestAnimationFrame(tick);
}
/* Performance ladder: slow frames step quality down a rung, never back up. */
let watchFrom = 0, watchN = 0, watchSum = 0, prevDraw = 0;
function watch(now, lively) {
  const gap = now - prevDraw;
  prevDraw = now;
  if (gap > 200) { watchFrom = now; watchN = watchSum = 0; return; }
  if (!watchFrom) watchFrom = now;
  if (now - watchFrom < 4000) return;
  watchN++; watchSum += gap;
  if (watchN < 2 || now - watchFrom < 6000) return;
  // Frames come every 33 ms by design; past 50 is slow.
  if (watchSum / watchN > (lively ? 50 : 90) && rung < 3) { rung++; resize(); }
  watchFrom = now - 4000; watchN = watchSum = 0;
}
whenVisible(stage, vis => {
  visible = vis;
  // A hidden tab cancels pending sounds; on return the roar picks up from the timeline.
  if (!vis) {
    cancelAnimationFrame(raf); clearTimeout(nap); raf = 0; nap = 0; lastT = 0; stopAll();
    if (bed) bed.g.gain.value = 0;
    kit.ac?.suspend()?.catch(() => {});
    return;
  }
  if (flight) roar(flight, Math.max(0, simT - flight.start - delayOf(flight)));
  draw();
  wake();
});
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
onReducedChange(on => { starMat.uniforms.uSteady.value = on ? 1 : 0; PU.uShear.value = on ? 0 : 1; wake(); });

/* Pointer: a press turns into a look drag after 8 px; a short release is a tap. */
let press = null;
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  stage.setPointerCapture(e.pointerId);
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, yaw: lookTo.yaw, pitch: lookTo.pitch, at: performance.now(), drag: false };
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  const dx = e.clientX - press.x, dy = e.clientY - press.y;
  if (!press.drag && Math.hypot(dx, dy) > 8) { press.drag = true; stage.classList.add('held'); }
  if (!press.drag) return;
  // One stage height of travel turns the view by the lens angle.
  const k = THREE.MathUtils.degToRad(camera.fov) / size.h;
  lookTo.yaw = THREE.MathUtils.clamp(press.yaw + dx * k, -0.32, 0.32);
  lookTo.pitch = THREE.MathUtils.clamp(press.pitch + dy * k, -0.2, 0.5);
});
const end = e => {
  if (!press || e.pointerId !== press.id) return;
  const tap = e.type === 'pointerup' && !press.drag && performance.now() - press.at < 260;
  press = null;
  stage.classList.remove('held');
  if (tap) start();
  wake();
};
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
stage.addEventListener('lostpointercapture', end);
// Space launches; the shell ignores it while a sheet has focus.
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat || e.target.closest?.('input, button, .s2-sheet')) return;
  e.preventDefault();
  if (flight) snapZoom(!zoomed); else act.launch();
});

function setBox(on) { grade.uniforms.uBox.value = on ? 1 : 0; draw(); }
function setLens() {
  dofPass.uniforms.pentagon.value = ui.setting('shape').value === 'pentagon';
  draw();
}

/* QA hooks: Dawn, the sim clock, a jump along a flight. Not for the UI. */
window.__qa = {
  dawn(v) { opts.dawn = v; setDawn(); draw(); },
  simT: () => simT,
  draws: () => drawN,
  flightT: () => (flight ? simT - flight.start - PRE : null),
  // Jump the flight to T+t seconds: the clock, the timeline and the trail catch up.
  jump(t) { if (!flight) return; const te = Math.max(0, t + PRE); simT = flight.start + te; flight.lastSim = simT; frame(); draw(); },
};

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
dawn(dawnDeg(opts.dawn));
buildBanks();
buildShore(PAD);
setBox(ui.setting('letterbox').value);
setLens();
resize();
renderer.compileAsync(scene, camera).then(() => {
  compiled = true;
  draw();
  canvas.classList.add('on');
  markReady();
  wake();
}, () => { compiled = true; draw(); canvas.classList.add('on'); markReady(); });
</script>
</body>
</html>
