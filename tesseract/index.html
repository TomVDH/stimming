<html lang="en">

<title>Tesseract</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Tesseract: the stage at full width under the shared header. */
/* A deep ink field; the purple shell stage is too close to the far ramp. */
:root { --stage: oklch(0.19 0.045 250); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%; cursor: grab;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
.stage.held canvas { cursor: grabbing; }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }

/* ---------- the slice rail: depth in W, a notch for each vertex level ---------- */
/* Top is near in W, bottom is far. */
.stage--tesseract {
  --rail: oklch(0.38 0.02 275);
  --cut: oklch(0.86 0.15 72);
}
.rail {
  position: absolute; z-index: 1; right: 6px; top: 22px; bottom: 76px; width: 52px;
  cursor: ns-resize; touch-action: none; -webkit-tap-highlight-color: transparent;
  opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0s linear 0.3s;
}
.rail.on { opacity: 1; visibility: visible; transition: opacity 0.3s ease; }
.rail:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 4px; }
.rail .track { position: absolute; top: 0; bottom: 0; right: 18px; width: 2px; background: var(--rail); }
.rail .notch {
  position: absolute; right: 0; top: 0; height: 2px; width: var(--len, 10px); margin-top: -1px;
  background: var(--rail); transition: background-color 0.15s ease;
}
.rail .notch.hot { background: var(--cut); }
/* The needle is a solid bar with a cut gap where it crosses the track. */
.rail .needle {
  position: absolute; right: -12px; top: 0; width: 34px; height: 5px; margin-top: -2.5px;
  background: var(--cut); pointer-events: none;
  -webkit-mask: linear-gradient(to left, #000 0 9px, transparent 9px 17px, #000 17px);
  mask: linear-gradient(to left, #000 0 9px, transparent 9px 17px, #000 17px);
}
@media (prefers-reduced-motion: reduce) { .rail, .rail.on { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true" data-done>
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/tesseract.svg)"></span><span class="intro-name">Tesseract</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--tesseract" id="stage" tabindex="0" role="application" aria-label="Tesseract, a four-dimensional cube. Drag to turn it; Shift-drag or a two-finger drag turns it through the fourth dimension. Arrow keys turn it, Shift with arrows through the fourth dimension. Double-click or Space sets it square again. I turns it inside out; S shows a 3D slice, and the rail or the wheel sets its depth.">
      <p class="fail" hidden>Tesseract needs WebGL, which this browser has turned off.</p>
      <div class="rail" id="rail" role="slider" tabindex="-1" aria-orientation="vertical" aria-label="Slice depth" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
        <div class="track"><span class="needle"></span></div>
      </div>
    </div>
    <div class="bar">
      <div class="choices" role="group" aria-label="Shape">
        <button class="chip" type="button" data-value="0" aria-pressed="true">Hypercube</button>
        <button class="chip" type="button" data-value="1" aria-pressed="false">24-cell</button>
        <button class="chip" type="button" data-value="2" aria-pressed="false">16-cell</button>
      </div>
      <div class="actions">
        <button class="chip" id="evert" type="button" aria-keyshortcuts="I">Inside out</button>
        <button class="chip" id="slice" type="button" aria-pressed="false" aria-keyshortcuts="S">Slice</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag</dt><dd>turn</dd></div>
        <div class="fine"><dt><kbd>Shift</kbd> drag</dt><dd>fourth dimension</dd></div>
        <div class="touch"><dt>Two fingers</dt><dd>fourth dimension</dd></div>
        <div><dt><span class="fine">Double-click</span><span class="touch">Double-tap</span></dt><dd>square up</dd></div>
        <div><dt>Drag the rail</dt><dd>slice depth</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Tesseract</h1><div class="vignette" hidden></div></section>
</div>

let tickAt = -1e9;

      }
    }
  }
  g.setDrawRange(0, m);
  g.attributes.position.needsUpdate = g.attributes.normal.needsUpdate = true;
}

/* ---------- the rail: a notch for each vertex level in W ---------- */
const rail = document.getElementById('rail'), railTrack = rail.querySelector('.track'), needle = rail.querySelector('.needle');
const notches = Array.from({ length: NV }, () => {
  const n = document.createElement('span');
  n.className = 'notch';
  n.hidden = true;
  railTrack.append(n);
  return n;
});
const lvU = new Float64Array(NV), lvN = new Uint8Array(NV), lvTmp = new Float64Array(NV);
let nLv = 0, shownDep = -1, railDep = -1;
function drawRail() {
  if (cut <= 0.002) { railDep = -1; return; }
  // A level gathers the shown vertices that share one depth in W.
  const span = wHi - wLo || 1;
  let n = 0;
  for (let k = 0; k < NV; k++) {
    if (k < 16 ? fade < 0.05 : mu === 0 || apex < 0.05) continue;
    lvTmp[n++] = (Wv[k] - wLo) / span;
  }
  const vals = lvTmp.subarray(0, n).sort();
  nLv = 0;
  for (let q = 0; q < n; q++) {
    if (nLv && vals[q] - lvU[nLv - 1] < 0.006) { lvN[nLv - 1]++; continue; }
    lvU[nLv] = vals[q];
    lvN[nLv++] = 1;
  }
  for (let q = 0; q < NV; q++) {
    const el = notches[q];
    if (q >= nLv) { el.hidden = true; continue; }
    el.hidden = false;
    el.style.top = `${((1 - lvU[q]) * 100).toFixed(2)}%`;
    // More vertices on one level make a longer notch.
    el.style.setProperty('--len', `${Math.min(30, 8 + 3 * lvN[q])}px`);
    el.classList.toggle('hot', Math.abs(lvU[q] - dep) < 0.012);
  }
  needle.style.top = `${((1 - dep) * 100).toFixed(2)}%`;
  // Only a depth the user moves ticks as it passes a level.
  if (railDep >= 0 && sweepAmt === 0 && railDep !== dep) {
    const a = Math.min(railDep, dep), b = Math.max(railDep, dep);
    for (let q = 0; q < nLv; q++) if (lvU[q] > a && lvU[q] <= b) { tick(q); break; }
  }
  railDep = dep;
  const v = Math.round(dep * 100);
  if (v !== shownDep) { shownDep = v; rail.setAttribute('aria-valuenow', String(v)); }
}

/* ---------- theme ---------- */
const probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
function cssRGB(str) {
  probe.fillStyle = '#000';
  probe.fillStyle = str;
  probe.fillRect(0, 0, 1, 1);
  const d = probe.getImageData(0, 0, 1, 1).data;
  return [d[0] / 255, d[1] / 255, d[2] / 255];
}
// Far in W sinks toward the ink stage; near in W stands out.
// Wire and panes share this ramp: colour always means depth in W.
const RAMP = [[0.5, 0.16, 300], [0.72, 0.14, 222], [0.92, 0.12, 165]];
// Each wire band shifts the ramp: lit is lighter, shade is much darker.
const BAND = { L: [0.06, 0.7], S: [-0.08, 1], D: [-0.32, 0.95] };
// The slice is one hot colour in three flat tones, and a dark inside.
const CUT = [[0.86, 0.15, 72], [0.73, 0.19, 46], [0.55, 0.18, 30], [0.27, 0.07, 28]];
function theme() {
  if (!renderer) return;
  const [r, g, b] = cssRGB(getComputedStyle(stage).backgroundColor);
  renderer.setClearColor(new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace));
  RAMP.forEach(([L, C, h], i) => {
    for (const [b, [dl, dc]] of Object.entries(BAND)) wireU[`u${b}${i}`].value.setRGB(...srgb([clamp(L + dl, 0, 0.97), C * dc, h]));
    paneU[`uP${i}`].value.setRGB(...srgb([L, C, h]));
  });
  ['uLit', 'uSide', 'uShade', 'uIn'].forEach((u, i) => sliceU[u].value.setRGB(...srgb(CUT[i])));
  // Stacked panes add up, so each stays faint.
  paneU.uAlpha.value = 0.1;
  paneU.uRim.value = 0.22;
  if (ready) draw();
}

/* ---------- one loop, only while something moves ---------- */
let raf = 0, last = 0, onScreen = true, slow = 0, idleT = 0;
function wake() {
  clearTimeout(idleT);
  if (!raf && ready && onScreen && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(ms) {
  raf = 0;
  const raw = Math.max(0, (ms - last) / 1000), dt = Math.min(raw, 1 / 30);
  last = ms;
  // Sustained slow frames drop the pixel ratio to 1.
  if (!lowDpr) {
    slow = raw > 0.03 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 20) { lowDpr = true; dispatchEvent(new Event('perf-low')); }
  }
  if (step(dt)) dirty = true;
  if (dirty) { draw(); dirty = false; }
  nap();
  const busy = ptrs.size || snap || evert || mu !== shape || idleAmt > 0 || om.some(Boolean)
    || cut !== (slicing ? 1 : 0) || dep !== depGoal || railHeld;
  if (busy) {
    if (onScreen && !document.hidden) raf = requestAnimationFrame(frame);
    return;
  }
  // At rest, a timer brings the idle drift back.
  if (!reduce) idleT = setTimeout(wake, Math.max(0, lastIn + IDLE_WAIT - performance.now()) + 30);
  setTimeout(nap, 2400);
}

/* ---------- input ---------- */
const local = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
function centre() {
  let x = 0, y = 0;
  for (const p of ptrs.values()) { x += p[0]; y += p[1]; }
  return [x / ptrs.size, y / ptrs.size];
}
stage.addEventListener('pointerdown', e => {
  if (!ready || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const q = local(e);
  ptrs.set(e.pointerId, q);
  try { stage.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  [cx, cy] = centre();
  trail = [];
  // A grab catches the spin, and stops a turn inside out.
  om.fill(0);
  evert = null;
  touch();
  stage.classList.add('held');
  if (ptrs.size === 1) {
    if (e.timeStamp - tapT < 340 && Math.hypot(q[0] - tapX, q[1] - tapY) < 30) { tapT = -1e9; snapHome(); }
    downT = e.timeStamp; downX = q[0]; downY = q[1]; moved = false;
  } else moved = true;
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const q = local(e);
  ptrs.set(e.pointerId, q);
  const [nx, ny] = centre(), dx = nx - cx, dy = ny - cy;
  cx = nx; cy = ny;
  if (!moved && Math.hypot(q[0] - downX, q[1] - downY) > 5) moved = true;
  if (!moved || (!dx && !dy)) return;
  snap = null;
  // Dragging across the object's radius turns it about a radian.
  const k = 1 / (0.42 * Math.min(stage.clientWidth, stage.clientHeight)), four = ptrs.size > 1 || e.shiftKey;
  const px = four ? 3 : 1, py = four ? 4 : 2, ax = -dx * k, ay = dy * k;
  turn(px, ax);
  turn(py, ay);
  trail.push([e.timeStamp, px, ax, py, ay]);
  while (trail.length && e.timeStamp - trail[0][0] > 110) trail.shift();

  dirty = true;
  wake();
});
// Release keeps the last 100 ms of pointer speed: a flick spins.
function letGo(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  touch();
  if (ptrs.size) { [cx, cy] = centre(); trail = []; return; }
  stage.classList.remove('held');
  const end = trail[trail.length - 1];
  if (e.type !== 'pointercancel' && end && e.timeStamp - end[0] < 70) {
    const span = Math.max(0.03, (end[0] - trail[0][0]) / 1000 + 1 / 60);
    for (const [, px, ax, py, ay] of trail) { om[px] += ax / span; om[py] += ay / span; }
    for (let p = 0; p < 6; p++) om[p] = clamp(om[p], -8, 8);
    armed = om.some(Boolean);
  }
  trail = [];
  if (!moved && e.timeStamp - downT < 300) { tapT = e.timeStamp; tapX = downX; tapY = downY; }

}
stage.addEventListener('pointerup', letGo);
stage.addEventListener('pointercancel', letGo);
stage.addEventListener('lostpointercapture', letGo);

// Arrows flick it; Shift flicks it through the fourth dimension.
// I turns it inside out; S shows the slice.
const ARROWS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const k = e.key;
  if (ARROWS[k]) {
    e.preventDefault();
    if (!ready) return;
    const [dx, dy] = ARROWS[k], kick = reduce ? 0.7 : 1.1, cap = 3.2;
    if (dx) { const p = e.shiftKey ? 3 : 1; om[p] = clamp(om[p] - dx * kick, -cap, cap); }
    if (dy) { const p = e.shiftKey ? 4 : 2; om[p] = clamp(om[p] + dy * kick, -cap, cap); }
    snap = null;
    evert = null;
    armed = true;
    touch();
    wake();
  } else if ((k === ' ' || k === 'Enter') && e.target === stage) {
    e.preventDefault();
    if (!e.repeat) snapHome();
  } else if ((k === 'i' || k === 'I') && !e.repeat) insideOut();
  else if ((k === 's' || k === 'S') && !e.repeat && ready) setSlice(!slicing);
});
// The rail and the wheel set the slice depth.
const railU = e => {
  const r = railTrack.getBoundingClientRect();
  return clamp(1 - (e.clientY - r.top) / r.height, DEP_LO, DEP_HI);
};
function setDepth(u) {
  depGoal = clamp(u, DEP_LO, DEP_HI);
  sweepAmt = 0;
  touch();
  wake();
}
rail.addEventListener('pointerdown', e => {
  e.stopPropagation();
  if (!slicing || (e.pointerType === 'mouse' && e.button !== 0)) return;
  try { rail.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }

  setDepth(railU(e));
});
rail.addEventListener('pointermove', e => { if (railHeld) setDepth(railU(e)); });
const railUp = () => { if (!railHeld) return; railHeld = false; touch(); wake(); };
rail.addEventListener('pointerup', railUp);
rail.addEventListener('pointercancel', railUp);
rail.addEventListener('lostpointercapture', railUp);
// Up is near in W; Page keys jump to the next vertex level.
rail.addEventListener('keydown', e => {
  const k = e.key;
  let u = null;
  if (k === 'ArrowUp' || k === 'ArrowRight') u = depGoal + (e.shiftKey ? 0.1 : 0.02);
  else if (k === 'ArrowDown' || k === 'ArrowLeft') u = depGoal - (e.shiftKey ? 0.1 : 0.02);
  else if (k === 'Home') u = DEP_HI;
  else if (k === 'End') u = DEP_LO;
  else if (k === 'PageUp') { u = DEP_HI; for (let q = 0; q < nLv; q++) if (lvU[q] > depGoal + 0.013) { u = lvU[q]; break; } }
  else if (k === 'PageDown') { u = DEP_LO; for (let q = nLv - 1; q >= 0; q--) if (lvU[q] < depGoal - 0.013) { u = lvU[q]; break; } }
  if (u === null) return;
  e.preventDefault();
  e.stopPropagation();
  setDepth(u);
});
stage.addEventListener('wheel', e => {
  if (!slicing || !ready) return;
  e.preventDefault();
  const px = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
  setDepth(depGoal - px * 0.0015);
}, { passive: false });
const sliceB = document.getElementById('slice');
choices(document.querySelector('.bar .choices'), v => setShape(Number(v)));
document.getElementById('evert').addEventListener('click', insideOut);
sliceB.addEventListener('click', () => { if (ready) setSlice(!slicing); });
sound.onChange(on => {
  if (on) audio();
  else ac?.suspend()?.catch(() => {});
});
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(stage);
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

/* ---------- start: WebGL setup in idle slices ---------- */
function failed() {
  stage.querySelector('.fail').hidden = false;
}
// Tubes and balls take their place and size from instance attributes.
// TUBE picks the tube body; without it the mesh is a ball.
const WIRE_VS = `
#ifdef TUBE
attribute vec4 aA;
attribute vec4 aB;
attribute vec2 aT;
#else
attribute vec4 aS;
attribute float aW;
#endif
varying vec3 vN;
varying float vT;
void main() {
#ifdef TUBE
  vec3 ax = aB.xyz - aA.xyz;
  ax /= max(length(ax), 1e-6);
  vec3 e1 = normalize(cross(abs(ax.y) < 0.9 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0), ax));
  vec3 e2 = cross(e1, ax);
  float h = position.y + 0.5;
  vec3 p = mix(aA.xyz, aB.xyz, h) + (e1 * position.x + e2 * position.z) * mix(aA.w, aB.w, h);
  vN = e1 * normal.x + e2 * normal.z;
  vT = mix(aT.x, aT.y, h);
#else
  vec3 p = position * aS.w + aS.xyz;
  vN = normal;
  vT = aW;
#endif
  gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
}`;
// The wire takes the slice's language: three flat bands, no gloss.
// Each band has its own depth ramp; the band edge is antialiased.
const WIRE_FS = `
uniform vec3 uKey;
uniform float uDim;
uniform vec3 uL0; uniform vec3 uL1; uniform vec3 uL2;
uniform vec3 uS0; uniform vec3 uS1; uniform vec3 uS2;
uniform vec3 uD0; uniform vec3 uD1; uniform vec3 uD2;
varying vec3 vN;
varying float vT;
vec3 ramp(vec3 a, vec3 b, vec3 c) { return vT < 0.5 ? mix(a, b, vT * 2.0) : mix(b, c, vT * 2.0 - 1.0); }
void main() {
  float d = dot(normalize(vN), uKey), fw = fwidth(d);
  float lit = smoothstep(0.45 - fw, 0.45 + fw, d), side = smoothstep(-0.15 - fw, -0.15 + fw, d);
  vec3 c = mix(ramp(uD0, uD1, uD2), mix(ramp(uS0, uS1, uS2), ramp(uL0, uL1, uL2), lit), side);
  gl_FragColor = vec4(c * uDim, 1.0);
}`;
function instanced(base, attrs) {
  const g = new THREE.InstancedBufferGeometry();
  g.setIndex(base.index);
  g.setAttribute('position', base.attributes.position);
  g.setAttribute('normal', base.attributes.normal);
  for (const [name, size, n] of attrs) {
    g.setAttribute(name, new THREE.InstancedBufferAttribute(new Float32Array(n * size), size).setUsage(THREE.DynamicDrawUsage));
  }
  g.instanceCount = 0;
  return g;
}
const PANE_VS = `
attribute float wt;
attribute float kind;
varying vec3 vP;
varying vec3 vN;
varying float vW;
varying float vK;
void main() {
  vP = position; vN = normal; vW = wt; vK = kind;
  gl_Position = projectionMatrix * viewMatrix * vec4(position, 1.0);
}`;
// Glass: a faint tint of the depth ramp, firmer at grazing angles.
const PANE_FS = `
uniform vec3 uMix;
uniform float uAlpha;
uniform float uRim;
uniform vec3 uP0;
uniform vec3 uP1;
uniform vec3 uP2;
varying vec3 vP;
varying vec3 vN;
varying float vW;
varying float vK;
void main() {
  float m = vK < 0.5 ? uMix.x : vK < 1.5 ? uMix.y : uMix.z;
  vec3 v = normalize(cameraPosition - vP);
  vec3 n = normalize(vN);
  float nv = dot(n, v);
  if (nv < 0.0) { n = -n; nv = -nv; }
  float f = pow(1.0 - nv, 4.0);
  float a = m * (uAlpha + uRim * f);
  vec3 c = vW < 0.5 ? mix(uP0, uP1, vW * 2.0) : mix(uP1, uP2, vW * 2.0 - 1.0);
  gl_FragColor = vec4(c * a, a);
}`;
const SLICE_VS = `
varying vec3 vN;
void main() {
  vN = normal;
  gl_Position = projectionMatrix * viewMatrix * vec4(position, 1.0);
}`;
// The slice is a stencil: each face takes one flat tone.
// Through a cut gap the hollow inside shows one dark tone.
const SLICE_FS = `
uniform vec3 uKey;
uniform vec3 uLit;
uniform vec3 uSide;
uniform vec3 uShade;
uniform vec3 uIn;
uniform float uAmt;
varying vec3 vN;
void main() {
  float d = dot(normalize(vN), uKey);
  vec3 c = d > 0.45 ? uLit : d > -0.15 ? uSide : uShade;
  if (!gl_FrontFacing) c = uIn;
  gl_FragColor = vec4(c * uAmt, uAmt);
}`;
async function start() {
  try {
    THREE = await import('three');
  } catch (err) {
    console.error(err);
    return failed();
  }
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (err) {
    console.error(err);
    return failed();
  }
  const canvas = renderer.domElement;
  canvas.setAttribute('aria-hidden', 'true');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(30, 16 / 9, 0.1, 50);
  await idle();

  // The key light sits up and to the left, behind the viewer.
  const keyDir = new THREE.Vector3(-2.4, 4, 3.2).normalize();
  dim = { value: 1 };
  wireU = { uKey: { value: keyDir }, uDim: dim };
  for (const b of 'LSD') for (let i = 0; i < 3; i++) wireU[`u${b}${i}`] = { value: new THREE.Color() };
  const wire = defines => new THREE.ShaderMaterial({ uniforms: wireU, vertexShader: WIRE_VS, fragmentShader: WIRE_FS, defines });
  const small = Math.min(innerWidth, innerHeight) < 700;
  tubes = new THREE.Mesh(
    instanced(new THREE.CylinderGeometry(1, 1, 1, small ? 20 : 30, 1, true), [['aA', 4, NE], ['aB', 4, NE], ['aT', 2, NE]]),
    wire({ TUBE: '' }),
  );
  balls = new THREE.Mesh(
    instanced(new THREE.SphereGeometry(1, small ? 28 : 40, small ? 18 : 26), [['aS', 4, NV], ['aW', 1, NV]]),
    wire({}),
  );
  tubes.frustumCulled = balls.frustumCulled = false;

  paneU = {
    uMix: { value: new THREE.Vector3(1, 0, 0) },
    uAlpha: { value: 0.1 }, uRim: { value: 0.22 },
    uP0: { value: new THREE.Color() }, uP1: { value: new THREE.Color() }, uP2: { value: new THREE.Color() },
  };
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(paneP, 3).setUsage(THREE.DynamicDrawUsage));
  pg.setAttribute('normal', new THREE.BufferAttribute(paneN, 3).setUsage(THREE.DynamicDrawUsage));
  pg.setAttribute('wt', new THREE.BufferAttribute(paneW, 1).setUsage(THREE.DynamicDrawUsage));
  pg.setAttribute('kind', new THREE.BufferAttribute(paneK, 1));
  pg.setIndex(new THREE.BufferAttribute(paneI, 1).setUsage(THREE.DynamicDrawUsage));
  // Premultiplied blending lets the highlight add light without dimming it.
  const premul = { blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor };
  panes = new THREE.Mesh(pg, new THREE.ShaderMaterial({
    uniforms: paneU, vertexShader: PANE_VS, fragmentShader: PANE_FS,
    transparent: true, depthWrite: false, side: THREE.DoubleSide, ...premul,
  }));

  panes.renderOrder = 1;

  sliceU = {
    uKey: { value: keyDir }, uAmt: { value: 0 },
    uLit: { value: new THREE.Color() }, uSide: { value: new THREE.Color() }, uShade: { value: new THREE.Color() },
    uIn: { value: new THREE.Color() },
  };
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(sliceP, 3).setUsage(THREE.DynamicDrawUsage));
  sg.setAttribute('normal', new THREE.BufferAttribute(sliceN, 3).setUsage(THREE.DynamicDrawUsage));
  sg.setDrawRange(0, 0);
  // The shown slice is opaque and writes depth.
  // The wire behind it stays hidden.
  slice = new THREE.Mesh(sg, new THREE.ShaderMaterial({
    uniforms: sliceU, vertexShader: SLICE_VS, fragmentShader: SLICE_FS, side: THREE.DoubleSide, ...premul,
  }));
  slice.frustumCulled = false;
  slice.visible = false;
  scene.add(tubes, balls, slice, panes);
  theme();

  stage.prepend(canvas);
  fitRenderer(renderer, stage, 2, (w, h) => {
    fit(w, h);
    if (ready) { draw(); wake(); }
  }, 2.4e6);
  if (!camera.position.z) fit(16, 9);
  await idle();
  // Async compile keeps the shader build off the main thread.
  await renderer.compileAsync(scene, camera);
  ready = true;
  draw();
  requestAnimationFrame(() => canvas.classList.add('on'));
  wake();
}
start().catch(err => { console.error(err); failed(); });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
