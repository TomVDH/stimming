    instanced(new THREE.CylinderGeometry(1, 1, 1, small ? 16 : 22, 1, true), [['aA', 4, NE], ['aB', 4, NE], ['aT', 2, NE]]),
    patch(lacquer(), 'tube'),
  );
  balls = new THREE.Mesh(
    instanced(new THREE.SphereGeometry(1, small ? 22 : 30, small ? 14 : 20), [['aS', 4, NV], ['aW', 1, NV]]),
    patch(lacquer(), 'ball'),
  );
  tubes.frustumCulled = balls.frustumCulled = false;

  paneU = {
    uKey: { value: new THREE.Vector3().copy(key.position).normalize() },
    uMix: { value: new THREE.Vector2(1, 0) },
    uAlpha: { value: 0.07 }, uRim: { value: 0.3 }, uSheen: { value: 0.4 },
  };
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(paneP, 3).setUsage(THREE.DynamicDrawUsage));
  pg.setAttribute('normal', new THREE.BufferAttribute(paneN, 3).setUsage(THREE.DynamicDrawUsage));
  pg.setAttribute('tint', new THREE.BufferAttribute(paneC, 3));
  pg.setAttribute('kind', new THREE.BufferAttribute(paneK, 1));
  pg.setIndex(new THREE.BufferAttribute(paneI, 1).setUsage(THREE.DynamicDrawUsage));
  // Premultiplied blending lets the sheen add light without dimming it.
  panes = new THREE.Mesh(pg, new THREE.ShaderMaterial({
    uniforms: paneU, vertexShader: PANE_VS, fragmentShader: PANE_FS,
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  }));
  panes.frustumCulled = false;
  panes.renderOrder = 1;
  scene.add(tubes, balls, panes);
  theme();

  stage.prepend(canvas);
  fitRenderer(renderer, stage, 1.5, (w, h) => {
    fit(w, h);
    if (ready) { draw(); wake(); }
  }, 1.4e6);
  if (!camera.position.z) fit(16, 9);
  await idle();
  // Async compile keeps the physical-material build off the main thread.
  await renderer.compileAsync(scene, camera);
  ready = true;
  draw();
  requestAnimationFrame(() => canvas.classList.add('on'));
  wake();
}
start().catch(err => { console.error(err); failed(); });
</script>
</body>
</html>
