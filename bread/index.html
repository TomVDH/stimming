<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.1 0.015 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Broodautomaat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Broodautomaat: a bread machine glows alone by a dark village road. */
:root { --stage: oklch(0.08 0.015 265); }
.stage--bread canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--bread canvas.on { opacity: 1; }
.stage--bread { cursor: grab; }
.stage--bread.held { cursor: grabbing; }
/* Letterbox bars clip the canvas to 2.39 to 1. */
.stage--bread[data-letterbox] canvas { clip-path: inset(var(--box, 0px) 0); }
@media (prefers-reduced-motion: reduce) { .stage--bread canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Broodautomaat</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--bread" id="stage" tabindex="0" role="application" aria-label="A bread vending machine glows alone by a dark village road at night. Drop a coin to buy a loaf.">
      <p class="fail" hidden>Broodautomaat needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Broodautomaat</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { initPage, whenVisible, pixelRatio, onQuality, linFit, reduced, onReducedChange, quality } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const stage = document.getElementById('stage');
// The bar handlers bind once the scene exists.
const act = { coin() {}, car() {}, tube() {}, rain() {}, tilt() {}, moths() {}, letterbox() {}, reset() {}, view() {} };
const QS = new URLSearchParams(location.search);
const ui = initPage({ id: 'bread', silent: true, bar: {
  slider: { label: 'Tube', min: 0, max: 1, step: 0.01, value: 0.25, onInput: v => act.tube(v) },
  actions: [
    { verb: 'coin', label: 'Coin', key: 'C', onPress: () => act.coin() },
    { verb: 'add', noun: 'Car', key: 'V', onPress: () => act.car() },
  ],
  settings: [
    { type: 'choice', id: 'view', label: 'View', value: 'road', persist: true, onPick: v => act.view(v),
      options: [{ value: 'road', label: 'Road' }, { value: 'edge', label: 'Village edge' }] },
    { type: 'toggle', id: 'rain', label: 'Rain', value: false, persist: true, onToggle: on => act.rain(on) },
    { type: 'slider', id: 'tilt', label: 'Tilt-shift', min: 0, max: 1, step: 0.01, value: 0.6, persist: true, onInput: v => act.tilt(v) },
    { type: 'slider', id: 'moths', label: 'Moths', min: 0, max: 1, step: 0.01, value: 0.5, persist: true, onInput: v => act.moths(v) },
    { type: 'toggle', id: 'letterbox', label: 'Letterbox', value: false, persist: true, onToggle: on => act.letterbox(on) },
  ],
  reset: () => act.reset(),
  quality: true,
  keys: [['click', 'the machine: buy'], ['click', 'open hatch: take'], ['space', 'coin'], ['drag', 'look']],
} });

// Seeded random keeps the land the same on every load.
let seed = 4021;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; ui.hideControls?.(); markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const canvas = renderer.domElement;
stage.prepend(canvas);
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 3600);
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;
// Linear RGB from OKLCH, scaled by a power.
const lin = (L, C, h, k = 1) => new THREE.Color(...linFit(L, C, h).map(c => c * k));

/* ---------- colours ---------- */
// The tube is cool white with a green cast; the bread light is warm.
const TUBE = lin(0.97, 0.035, 160);
const WARM = lin(0.84, 0.13, 62);
const SKYGLOW = lin(0.42, 0.08, 52);
const NIGHT = lin(0.12, 0.03, 265);
scene.fog = new THREE.FogExp2(lin(0.15, 0.03, 40).getHex(), 0.0026);

/* ---------- sky ---------- */
// One sphere: deep blue overhead, a sodium skyglow low on the horizon.
// A thin cloud band catches the town glow from below.
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uGlow: { value: SKYGLOW }, uNight: { value: NIGHT } },
  vertexShader: /* glsl */`varying vec3 vDir; void main() { vDir = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: /* glsl */`
  uniform vec3 uGlow, uNight; varying vec3 vDir;
  float h21(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
  float vn(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
  float fbm(vec2 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * vn(p); p = p * 2.03 + 7.1; a *= 0.5; } return s; }
  void main() {
    vec3 d = normalize(vDir);
    float el = d.y, az = atan(d.x, -d.z);
    // The town glow sits right of centre, behind the machine.
    float town = exp(-pow((az - 0.35) / 0.9, 2.0));
    vec3 c = uNight * (0.35 + 0.65 * smoothstep(0.6, 0.0, el));
    c += uGlow * exp(-max(el, 0.0) * 14.0) * (0.25 + 0.75 * town) * 0.55;
    // Low cloud: a band of fbm, lit from below by the same glow.
    float band = smoothstep(0.02, 0.07, el) * smoothstep(0.24, 0.1, el);
    float cl = smoothstep(0.42, 0.75, fbm(vec2(az * 3.2, el * 22.0)));
    c = mix(c, uGlow * (0.06 + 0.16 * town) + uNight * 0.2, cl * band * 0.85);
    // Stars: sparse hashed points, hidden behind cloud and glow.
    vec2 sp = vec2(az * 520.0, el * 520.0);
    float s = h21(floor(sp));
    float star = step(0.9988, s) * smoothstep(0.3, 0.0, length(fract(sp) - 0.5)) * smoothstep(0.1, 0.3, el) * (1.0 - cl * band);
    c += vec3(0.75, 0.8, 1.0) * star * (0.4 + 1.2 * h21(floor(sp) + 3.1));
    gl_FragColor = vec4(c, 1.0);
  }`,
}));
sky.renderOrder = -1;
scene.add(sky);

/* ---------- land ---------- */
// A value-noise texture breaks up the fields and the asphalt.
function noiseTex(n, k) {
  const d = new Uint8Array(n * n * 4);
  for (let i = 0; i < n * n; i++) {
    const v = 1 - k + k * rnd();
    d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = Math.round(v * 255); d[i * 4 + 3] = 255;
  }
  const t = new THREE.DataTexture(d, n, n);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true;
  t.needsUpdate = true;
  return t;
}
const fieldTex = noiseTex(128, 0.6); fieldTex.repeat.set(220, 220);
const field = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: lin(0.26, 0.03, 120), map: fieldTex, roughness: 1 }));
field.position.y = -0.03;
field.receiveShadow = true;
scene.add(field);

// The road runs straight away from the eye, along -z, to the horizon.
const ROAD = { x0: -3.0, x1: 3.0, len: 1800 };
const asphaltTex = noiseTex(256, 0.35); asphaltTex.repeat.set(4, 240);
const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD.x1 - ROAD.x0, ROAD.len).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: lin(0.24, 0.006, 260), map: asphaltTex, roughness: 0.55 }));
road.position.z = -ROAD.len / 2 + 30;
road.receiveShadow = true;
scene.add(road);
// Worn white edge lines and a dashed centre line catch the light, and later the rain.
const lineMat = new THREE.MeshStandardMaterial({ color: lin(0.78, 0.01, 90), roughness: 0.7 });
{
  const parts = [];
  for (const x of [ROAD.x0 + 0.25, ROAD.x1 - 0.25]) parts.push(new THREE.PlaneGeometry(0.12, ROAD.len).rotateX(-Math.PI / 2).translate(x, 0, -ROAD.len / 2 + 30));
  // Dashes of 3 m with 9 m gaps, as on Flemish country roads.
  for (let z = 20; z > -600; z -= 12) parts.push(new THREE.PlaneGeometry(0.1, 3).rotateX(-Math.PI / 2).translate(0, 0, z));
  const l = new THREE.Mesh(mergeGeometries(parts), lineMat);
  l.position.y = 0.004;
  l.receiveShadow = true;
  scene.add(l);
}

/* ---------- far land ---------- */
// Silhouettes against the skyglow: poplars, hedges and a Flemish village.
const inkMat = new THREE.MeshBasicMaterial({ color: lin(0.07, 0.012, 265), fog: false });
// The village sits deeper in the haze, so its ink is a shade lighter.
const villMat = new THREE.MeshBasicMaterial({ color: lin(0.1, 0.018, 35), fog: false });
// A roof prism: a triangle of width w and height rh, extruded to depth d.
// Gable-front roofs face the eye; eave-front roofs run along the street.
function roof(w, rh, d, gable) {
  const s = new THREE.Shape();
  const a = gable ? w : d;
  s.moveTo(-a / 2, 0); s.lineTo(a / 2, 0); s.lineTo(0, rh); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: gable ? d : w, bevelEnabled: false });
  return gable ? g.translate(0, 0, -d / 2) : g.rotateY(Math.PI / 2).translate(-w / 2, 0, 0);
}
const VZ = -1100;
const windows = [];
{
  const parts = [];
  // A row of poplars crosses the fields left of the road.
  for (let i = 0; i < 9; i++) {
    const x = -58 - i * 12 - rnd() * 3, z = -440 - i * 2, h = 16 + rnd() * 5;
    parts.push(new THREE.SphereGeometry(1, 12, 12).scale(1.6 + rnd() * 0.6, h / 2, 1.6).translate(x, h / 2 + 1, z));
  }
  // Low hedges and tree clumps along the horizon, clear of the village.
  for (let i = 0; i < 18; i++) {
    const a = -1.2 + i * 0.16 + rnd() * 0.05, r = 700 + rnd() * 300, h = 8 + rnd() * 10;
    if (Math.abs(a) < 0.16) continue;
    parts.push(new THREE.SphereGeometry(1, 20, 8).scale(10 + rnd() * 18, h * 0.8, 8).translate(Math.sin(a) * r, 0, -Math.cos(a) * r));
  }
  scene.add(new THREE.Mesh(mergeGeometries(parts.map(g => (g.index ? g.toNonIndexed() : g))), inkMat));
}
{
  // The village: brick rows with steep roofs where the road ends.
  const parts = [];
  for (const [row, z0, n] of [[0, VZ, 18], [1, VZ - 30, 12]]) {
    let x = -96 + rnd() * 6;
    for (let i = 0; i < n; i++) {
      const w = 6 + rnd() * 3.5, h = (row ? 6 : 5) + rnd() * 3, d = 10, gable = rnd() < 0.45;
      const rh = gable ? w * 0.75 : d * 0.55;
      // The road runs on through the village; no house stands on it.
      if (Math.abs(x + w / 2) < 6) x += 12;
      const cx = x + w / 2, cz = z0 + rnd() * 6;
      parts.push(new THREE.BoxGeometry(w, h, d).translate(cx, h / 2, cz));
      parts.push(roof(w, rh, d, gable).translate(cx, h, cz));
      // A few windows are lit; one in eight glows television blue.
      if (!row) for (const wy of [1.6, h - 1.8]) {
        if (rnd() < 0.42) windows.push([cx + (rnd() - 0.5) * (w - 2.4), wy, cz + d / 2 + 0.05, rnd() < 0.12]);
      }
      x += w + (rnd() < 0.25 ? 3 + rnd() * 6 : 0.1);
    }
  }
  // The church: a brick tower with corner pinnacles, a needle spire and a long nave.
  const cx = -24, cz = VZ - 22;
  parts.push(new THREE.BoxGeometry(10, 40, 10).translate(cx, 20, cz));
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) parts.push(new THREE.ConeGeometry(0.9, 6, 4).translate(cx + sx * 4.4, 43, cz + sz * 4.4));
  parts.push(new THREE.ConeGeometry(5.2, 32, 4).rotateY(Math.PI / 4).translate(cx, 56, cz));
  parts.push(new THREE.BoxGeometry(16, 17, 40).translate(cx, 8.5, cz - 25));
  parts.push(roof(16, 11, 40, true).translate(cx, 17, cz - 25));
  scene.add(new THREE.Mesh(mergeGeometries(parts.map(g => (g.index ? g.toNonIndexed() : g))), villMat));
  // The church clock is lit, a pale disc high on the tower.
  const clock = new THREE.Mesh(new THREE.CircleGeometry(1.4, 24), new THREE.MeshBasicMaterial({ color: lin(0.9, 0.05, 85, 1.5), fog: false }));
  clock.position.set(cx, 32, cz + 5.05);
  scene.add(clock);
}
/* ---------- the horizon ---------- */
// The Flemish horizon is never empty: farms, willow lines, pylons and turbines.
const beacons = [];
{
  const parts = [];
  // Rows of pollard willows and alders mark the field edges.
  for (const [x0, x1, z] of [[-420, -150, -300], [60, 380, -360], [-260, -40, -640], [140, 520, -700], [-700, -300, -980], [300, 760, -1250]]) {
    for (let x = x0; x < x1; x += 4 + rnd() * 5) {
      const h = 2.6 + rnd() * 2.2;
      parts.push(new THREE.SphereGeometry(1, 10, 6).scale(2.4 + rnd() * 1.6, h, 2.4).translate(x, h * 0.8, z + rnd() * 4));
    }
  }
  // Farms: a long barn, a house and a few trees; most have a lit window.
  for (const [x, z, flip] of [[-250, -560, 1], [190, -470, -1], [430, -820, 1], [-520, -880, -1], [120, -1600, 1], [-330, -1450, 1]]) {
    parts.push(new THREE.BoxGeometry(26, 8, 12).translate(x, 4, z));
    parts.push(roof(12, 7, 26, false).rotateY(Math.PI / 2).translate(x, 8, z));
    parts.push(new THREE.BoxGeometry(9, 6, 9).translate(x + flip * 20, 3, z + 4));
    parts.push(roof(9, 6, 9, true).translate(x + flip * 20, 6, z + 4));
    for (let t = 0; t < 3; t++) {
      const h = 10 + rnd() * 6;
      parts.push(new THREE.SphereGeometry(1, 10, 8).scale(5 + rnd() * 3, h / 2, 5).translate(x - flip * (18 + t * 7), h / 2, z - 6 + rnd() * 8));
    }
    if (rnd() < 0.8) windows.push([x + flip * 20 + 1.5, 2.6, z + 8.6, false]);
  }
  // The next village over, far left: one spire and a low row.
  parts.push(new THREE.BoxGeometry(8, 30, 8).translate(-760, 15, -2300));
  parts.push(new THREE.ConeGeometry(4.5, 26, 4).rotateY(Math.PI / 4).translate(-760, 43, -2300));
  parts.push(new THREE.BoxGeometry(120, 8, 20).translate(-720, 4, -2280));
  // A high-voltage line crosses the land on lattice pylons.
  const wire = [];
  const PYL = [[-900, -820], [-560, -900], [-220, -980], [700, -1150], [1040, -1230]];
  const tips = PYL.map(([x, z]) => {
    parts.push(new THREE.CylinderGeometry(1.2, 4.5, 44, 4).rotateY(Math.PI / 4).translate(x, 22, z));
    parts.push(new THREE.BoxGeometry(20, 1.2, 1.2).translate(x, 32, z));
    parts.push(new THREE.BoxGeometry(14, 1.2, 1.2).translate(x, 39, z));
    parts.push(new THREE.ConeGeometry(1.4, 6, 4).translate(x, 47, z));
    return [[x - 10, 32, z], [x + 10, 32, z], [x - 7, 39, z], [x + 7, 39, z]];
  });
  // Each span sags as a catenary, here a parabola in twelve steps.
  for (let i = 0; i < tips.length - 1; i++) {
    if (PYL[i + 1][0] - PYL[i][0] > 500) continue;
    for (let k = 0; k < 4; k++) {
      const a = tips[i][k], b = tips[i + 1][k];
      for (let s = 0; s < 12; s++) {
        const p = t => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t - 9 * 4 * t * (1 - t), a[2] + (b[2] - a[2]) * t];
        wire.push(...p(s / 12), ...p((s + 1) / 12));
      }
    }
  }
  const wg = new THREE.BufferGeometry();
  wg.setAttribute('position', new THREE.Float32BufferAttribute(wire, 3));
  scene.add(new THREE.LineSegments(wg, new THREE.LineBasicMaterial({ color: inkMat.color, fog: false })));
  // Wind turbines stand far off on the right, each with a red beacon.
  for (const [x, z, a] of [[520, -2500, 0.3], [700, -2700, 1.4], [880, -2450, 2.2], [1100, -2600, 0.9]]) {
    parts.push(new THREE.CylinderGeometry(1.4, 2.6, 92, 10).translate(x, 46, z));
    parts.push(new THREE.BoxGeometry(4, 4, 9).translate(x, 93, z));
    for (let b = 0; b < 3; b++) {
      const ang = a + (b * Math.PI * 2) / 3;
      parts.push(new THREE.BoxGeometry(1.6, 46, 0.6).translate(0, 23, 0).rotateZ(ang).translate(x, 93, z + 4.6));
    }
    const beacon = new THREE.Mesh(new THREE.SphereGeometry(1.3, 8, 6), new THREE.MeshBasicMaterial({ color: lin(0.62, 0.24, 28, 8), fog: false }));
    beacon.position.set(x, 96, z);
    scene.add(beacon);
    beacons.push(beacon);
  }
  scene.add(new THREE.Mesh(mergeGeometries(parts.map(g => (g.index ? g.toNonIndexed() : g))), inkMat));
}

// Lit windows: tiny warm squares; bloom makes them points of light.
const farMat = new THREE.MeshBasicMaterial({ color: WARM.clone().multiplyScalar(5), fog: false });
const tvMat = new THREE.MeshBasicMaterial({ color: lin(0.7, 0.12, 250, 4), fog: false });
for (const [x, y, z, tv] of windows) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 1.3), tv ? tvMat : farMat);
  m.position.set(x, y, z);
  scene.add(m);
}
// Sodium lamps run down the road and into the village.
const sodiumMat = new THREE.MeshBasicMaterial({ color: lin(0.8, 0.16, 58, 14), fog: false });
for (const [x, z, r] of [[ROAD.x1 + 1.2, -420, 0.3], [ROAD.x1 + 1.2, -900, 0.5], [ROAD.x0 - 1.2, VZ + 30, 0.6], [ROAD.x1 + 1.2, VZ - 20, 0.6]]) {
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), sodiumMat);
  lamp.position.set(x, 6, z);
  scene.add(lamp);
}

/* ---------- the stop ---------- */
// The machine stands alone on a small concrete pad on the far verge.
const STOP = new THREE.Group();
// setView() places it; on the road it faces the road three-quarter on.
scene.add(STOP);
const concrete = new THREE.MeshStandardMaterial({ color: lin(0.55, 0.008, 80), map: noiseTex(64, 0.25), roughness: 0.92 });
const enamel = new THREE.MeshStandardMaterial({ color: lin(0.86, 0.02, 95), roughness: 0.4, metalness: 0.05 });
const steel = new THREE.MeshStandardMaterial({ color: lin(0.72, 0.008, 250), roughness: 0.3, metalness: 0.8 });
const trim = new THREE.MeshStandardMaterial({ color: lin(0.24, 0.01, 260), roughness: 0.5, metalness: 0.4 });
const cast = m => { m.castShadow = true; m.receiveShadow = true; return m; };
const box = (w, h, d, mat, x, y, z, r = 0, parent = STOP) => {
  const g = r ? new RoundedBoxGeometry(w, h, d, 2, r) : new THREE.BoxGeometry(w, h, d);
  const m = cast(new THREE.Mesh(g, mat));
  m.position.set(x, y, z);
  parent.add(m);
  return m;
};
box(1.6, 0.12, 1.4, concrete, 0, 0.06, 0.2);

/* the cabinet */
// A tall narrow cabinet; a column of small doors sits left of centre.
// Each door opens on one tier of the carousel behind it.
const M = { w: 0.86, h: 1.92, d: 0.72, front: 0.36, y0: 0.12 };
const TIERS = 8, TIER_H = 0.17;
const COL = { x0: -0.37, x1: -0.03, y0: 0.4 };
COL.y1 = COL.y0 + TIERS * TIER_H;
{
  const { w, h, d, y0 } = M, cz = M.front - d / 2, fz = M.front - 0.02;

/* ---------- K2: bloom ---------- */
// Lifted from Canal at dusk: bloom on a float target; only bright sources cross the threshold.
function makeBloom(strength, radius, threshold) {
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), strength, radius, threshold);
  const full = bloom.setSize.bind(bloom);
  // Full size on High, 0.7 on Standard, half on the ladder's rung 2.
  bloom.setSize = (w, h) => { const m = rung >= 2 ? 0.5 : quality() === 'high' ? 1 : 0.7; full(Math.max(1, w * m), Math.max(1, h * m)); };
  // A sigma of radius / 2.5 gives each blur layer a round falloff.
  for (const m of bloom.separableBlurMaterials) {
    const r = m.defines.KERNEL_RADIUS, sg = r / 2.5;
    m.uniforms.gaussianCoefficients.value = Array.from({ length: r }, (_, i) => Math.exp(-0.5 * i * i / (sg * sg)));
  }
  return bloom;
}
/* ---------- end K2 ---------- */

/* ---------- K2: grade ---------- */
// Lifted from Canal at dusk: linear grade before tone mapping, vignette, fixed grain.
function makeGrade({ tint, vig, vigIn, grain }) {
  return new ShaderPass({
    uniforms: {
      tDiffuse: { value: null },
      uRes: { value: new THREE.Vector2(1, 1) },
      uTint: { value: new THREE.Vector3(...tint) },
      uVig: { value: vig },
      uVigIn: { value: vigIn },
      uGrain: { value: grain },
    },
    vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform vec2 uRes;
    uniform vec3 uTint;
    uniform float uVig, uVigIn, uGrain;
    varying vec2 vUv;
    // An integer hash per pixel; float hashes draw faint stripes here.
    float h(vec2 p) {
      uvec2 q = uvec2(p);
      uint n = (q.x * 1597334677u) ^ (q.y * 3812015801u);
      n *= 1597334677u; n ^= n >> 16; n *= 2246822519u; n ^= n >> 13;
      return float(n) / 4294967295.0;
    }
    void main() {
      vec3 c = texture2D(tDiffuse, vUv).rgb + uTint;
      vec2 q = (vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
      c *= 1.0 - uVig * smoothstep(uVigIn, 1.1, length(q));
      float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c *= 1.0 + (h(gl_FragCoord.xy) - 0.5) * uGrain * (0.6 + 0.4 * smoothstep(0.0, 0.3, lum)) * 2.0;
      gl_FragColor = vec4(max(c, 0.0), 1.0);
    }`,
  });
}
/* ---------- end K2 ---------- */

/* ---------- tilt-shift ---------- */
// A sharp band through the machine; blur grows above and below it.
// Bright taps weigh more, so out-of-focus lights open into discs.
const tilt = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null },
    uRes: { value: new THREE.Vector2(1, 1) },
    uFocus: { value: 0.35 },
    uBand: { value: 0.12 },
    uAmt: { value: 0.6 },
  },
  vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uFocus, uBand, uAmt; varying vec2 vUv;
  void main() {
    float d = abs(vUv.y - uFocus);
    // The radius in pixels; it scales with the canvas height.
    float r = uAmt * smoothstep(uBand, uBand + 0.4, d) * uRes.y * 0.012;
    vec3 c = texture2D(tDiffuse, vUv).rgb;
    if (r < 0.4) { gl_FragColor = vec4(c, 1.0); return; }
    vec3 acc = c; float wsum = 1.0;
    // A per-pixel turn of the spiral trades the tap pattern for fine noise.
    float j = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) * 6.2832;
    // A golden-angle spiral of 20 taps fills a disc evenly.
    for (int i = 1; i <= 20; i++) {
      float fi = float(i), a = fi * 2.39996 + j, rr = sqrt(fi / 20.0) * r;
      vec3 s = texture2D(tDiffuse, vUv + vec2(cos(a), sin(a)) * rr / uRes).rgb;
      float w = 1.0 + 2.5 * smoothstep(0.6, 3.0, dot(s, vec3(0.2126, 0.7152, 0.0722)));
      acc += s * w; wsum += w;
    }
    gl_FragColor = vec4(acc / wsum, 1.0);
  }`,
});

/* ---------- flare ---------- */
// The flare follows Buoy Business: veil, orb, anamorphic streak and ghosts.
// It is lifted from Beach walker's POST_FS, without the depth test.
const flare = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null },
    uSun: { value: new THREE.Vector2(0.5, 0.5) },
    uAspect: { value: 1 },
    uCol: { value: new THREE.Vector3(...TUBE.toArray()) },
    uGain: { value: 0.14 },
  },
  vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform sampler2D tDiffuse; uniform vec2 uSun; uniform float uAspect, uGain; uniform vec3 uCol; varying vec2 vUv;
  void main() {
    vec3 base = texture2D(tDiffuse, vUv).rgb;
    vec2 d = vUv - uSun;
    float ax = d.x * uAspect, ay = d.y;
    // A wide veil and a soft orb, squashed sideways.
    float r = length(vec2(ax * 0.6, ay));
    vec3 add = uCol * (0.02 * exp(-r * 1.5) + 0.06 * exp(-r * 5.0) + 0.3 * exp(-r * 22.0));
    // Three nested bands: a soft core, a wide sheath and a broad haze.
    float line = 0.4 * exp(-abs(ay) * 130.0) + 0.12 * exp(-abs(ay) * 20.0) + 0.03 * exp(-abs(ay) * 4.0);
    add += mix(uCol, vec3(0.55, 0.72, 1.0), 0.45) * line * exp(-abs(ax) / 1.1);
    // Ghosts sit on the line from the source through the frame centre.
    vec2 toC = vec2(0.5) - uSun;
    vec3 gs[4];
    gs[0] = vec3(0.7, 0.05, 0.9); gs[1] = vec3(1.4, 0.09, 0.6); gs[2] = vec3(2.2, 0.15, 0.4); gs[3] = vec3(-0.45, 0.03, 0.5);
    for (int i = 0; i < 4; i++) {
      vec2 g = (vUv - (uSun + toC * gs[i].x)) * vec2(uAspect, 1.0);
      float gr = length(g) / gs[i].y;
      add += mix(uCol, uCol * vec3(1.0, 0.5, 0.2), 0.4) * exp(-gr * gr) * gs[i].z * 0.1;
    }
    add *= uGain;
    // Screen blend on the bright end: the flare washes, never clips.
    gl_FragColor = vec4(base + add * (1.0 - clamp(base, 0.0, 1.0)), 1.0);
  }`,
});

/* ---------- post chain ---------- */
const POST = { bloom: [0.3, 0.45, 1.1], tint: [0.0006, 0.0007, 0.0012], vig: 0.6, vigIn: 0.35, grain: 0.035 };
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(tilt);
composer.addPass(makeBloom(...POST.bloom));
composer.addPass(flare);
const grade = makeGrade(POST);
composer.addPass(grade);
composer.addPass(new OutputPass());

/* ---------- camera and size ---------- */
let size = { w: 1, h: 1, dpr: 1 };
// A dead-level eye on the road; a shifted lens drops the horizon low.
// A long lens flattens the land, as in Beach walker.
const SHOT = {
  road: {
    wide: { pos: [0.9, 1.15, 0], yaw: -0.06, vfov: 12.5, horizon: 0.64 },
    tall: { pos: [4.0, 1.15, -12], yaw: -0.012, vfov: 22, horizon: 0.58 },
  },
  // Dead frontal on the blind gable, centred: a deadpan frame.
  edge: {
    wide: { pos: [9.1, 1.2, -16], yaw: 0, vfov: 36, horizon: 0.79 },
    tall: { pos: [9.1, 1.2, -12], yaw: 0, vfov: 46, horizon: 0.72 },
  },
};
// Look offsets from a drag; they ease toward the target.
const look = { yaw: 0, pitch: 0, ty: 0, tp: 0 };
const TUBE_W = new THREE.Vector3(), probe = new THREE.Vector3();
let focal = 1;
function frame() {
  const portrait = size.w < size.h, S = SHOT[view][portrait ? 'tall' : 'wide'];
  const w = size.w, h = size.h;
  const hy = h * S.horizon + look.pitch * h;
  focal = h / (2 * Math.tan((S.vfov * Math.PI) / 360));
  const half = Math.max(hy, h - hy);
  camera.fov = (2 * Math.atan(half / focal) * 180) / Math.PI;
  camera.aspect = w / (2 * half);
  camera.setViewOffset(w, 2 * half, 0, half - hy, w, h);
  camera.position.set(...S.pos);
  camera.rotation.set(0, S.yaw + look.yaw, 0, 'YXZ');
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  mothMat.uniforms.uPx.value = focal * size.dpr;
  steamMat.uniforms.uPx.value = focal * size.dpr;
  // The sharp band follows the machine's centre on screen.
  probe.copy(STOP.localToWorld(new THREE.Vector3(0, 1.2, M.front))).project(camera);
  tilt.uniforms.uFocus.value = probe.y * 0.5 + 0.5;
  tilt.uniforms.uBand.value = portrait ? 0.07 : 0.1;
  // The flare sits on the tube.
  TUBE_W.copy(STOP.localToWorld(TUBE_POS.clone())).project(camera);
  flare.uniforms.uSun.value.set(TUBE_W.x * 0.5 + 0.5, TUBE_W.y * 0.5 + 0.5);
  flare.uniforms.uAspect.value = w / h;
}
function resize() {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  size = { w, h, dpr: pixelRatio(w, h, { maxDpr: 1.5, budget: 1.8e6, low: rung >= 1 }) };
  renderer.setPixelRatio(size.dpr);
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  const W = w * size.dpr, H = h * size.dpr;
  grade.uniforms.uRes.value.set(W, H);
  tilt.uniforms.uRes.value.set(W, H);
  stage.style.setProperty('--box', `${Math.max(0, (h - w / 2.39) / 2)}px`);
  frame();
  draw();
}
/* ---------- frame loop ---------- */
// Full rate while something moves; the loop sleeps when all is still.
// Moths and the tube add ambient drift in Task 3.
let visible = !document.hidden, raf = 0, lastT = 0, lastInput = performance.now();
const anims = new Set();
// One tween: fn gets progress 0 to 1; done runs once at the end.
function anim(dur, fn, done) {
  const a = { t: 0, dur: Math.max(0.001, dur), fn, done };
  anims.add(a);
  wake();
  return a;
}
const after = (s, fn) => anim(s, () => {}, fn);
function draw() {
  if (!visible) return;
  composer.render();
}
function tick(now) {
  raf = 0;
  if (!visible || document.hidden) { lastT = 0; return; }
  const dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0;
  lastT = now;
  try {
    for (const a of [...anims]) {
      a.t += dt;
      const k = Math.min(1, a.t / a.dur);
      a.fn(k);
      if (k >= 1) { anims.delete(a); a.done?.(); }
    }
    stepSteam(dt);
    stepLook(dt);
    frame();
    draw();
  } finally {
    if (visible && (anims.size || steam.on > 0.001 || lookBusy())) raf = requestAnimationFrame(tick);
    else lastT = 0;
  }
}
function wake() {
  lastInput = performance.now();
  if (!raf && visible && !document.hidden) raf = requestAnimationFrame(tick);
}
whenVisible(stage, vis => {
  visible = vis;
  if (!vis) { cancelAnimationFrame(raf); raf = 0; lastT = 0; return; }
  draw();
  wake();
});
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
onReducedChange(() => wake());

/* ---------- easing ---------- */
const clamp01 = x => Math.max(0, Math.min(1, x));
const inOut = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const inQuad = k => k * k;
// A motor stop: an eased turn that runs 2 % past and settles back.
const motor = k => (reduced() ? inOut(k) : inOut(clamp01(k / 0.82)) + 0.02 * Math.sin(Math.PI * clamp01((k - 0.62) / 0.38)));
// A sprung swing: it overshoots once and settles.
const spring = k => (reduced() ? inOut(k) : 1 - Math.exp(-6 * k) * Math.cos(9 * k) * (1 - k));

/* ---------- the hatch glow and steam ---------- */
// A warm lamp waits at the open door; zero intensity keeps the shader count fixed.
const hotLight = new THREE.PointLight(WARM, 0, 2.6, 2);
STOP.add(hotLight);
// The hot loaf swaps to its own glowing crust.
const hotCrust = crust.clone();
hotCrust.emissiveIntensity = 0.1;
// Steam: soft puffs rise from the open compartment and curl as they cool.
const STEAM_N = 48;
const steamGeo = new THREE.BufferGeometry();
{
  const seed = new Float32Array(STEAM_N);
  for (let i = 0; i < STEAM_N; i++) seed[i] = i / STEAM_N + rnd() * 0.02;
  steamGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(STEAM_N * 3), 3));
  steamGeo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
}
const steamMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 }, uAmt: { value: 0 }, uOrigin: { value: new THREE.Vector3() }, uPx: { value: 1 }, uWarm: { value: WARM }, uCool: { value: TUBE } },
  vertexShader: /* glsl */`
  attribute float aSeed; uniform float uTime, uAmt, uPx; uniform vec3 uOrigin;
  varying float vLife, vA;
  void main() {
    // Each puff lives 2.4 s; the seed staggers them.
    float life = fract(uTime / 2.4 + aSeed);
    float s = aSeed * 61.0;
    vec3 p = uOrigin + vec3(sin(s + life * 4.0) * 0.05 * life, life * 0.55, 0.05 + life * 0.08 + cos(s * 1.3 + life * 3.0) * 0.03 * life);
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    gl_Position = projectionMatrix * mv;
    gl_PointSize = uPx * (0.03 + 0.11 * life) / -mv.z;
    vLife = life;
    vA = uAmt * smoothstep(0.0, 0.12, life) * (1.0 - life);
  }`,
  fragmentShader: /* glsl */`
  uniform vec3 uWarm, uCool; varying float vLife, vA;
  void main() {
    float d = length(gl_PointCoord - 0.5);
    float a = smoothstep(0.5, 0.0, d) * vA;
    // Warm at the hatch, cool white higher up in the tube light.
    gl_FragColor = vec4(mix(uWarm * 1.4, uCool, smoothstep(0.1, 0.6, vLife)) * a * 0.34, 1.0);
  }`,
});
const steamPts = new THREE.Points(steamGeo, steamMat);
steamPts.frustumCulled = false;
STOP.add(steamPts);
const steam = { on: 0, goal: 0, t: 0 };
function stepSteam(dt) {
  steam.on += (steam.goal - steam.on) * (1 - Math.exp(-dt * 2.2));
  if (steam.on < 0.001 && !steam.goal) return;
  steam.t += dt * (reduced() ? 0.4 : 1);
  steamMat.uniforms.uTime.value = steam.t;
  steamMat.uniforms.uAmt.value = steam.on;
}

/* ---------- coin, carousel and hatch ---------- */
// One loaf per sale: coin, turn, unlock, swing. The buyer takes it, the door shuts.
const STEP = (Math.PI * 2) / DRUM.sectors;
const machine = { state: 'idle', cell: null, door: null };
const coinAction = () => ui.action('coin');
const greenLamp = readyLamp.material.color.clone(), redLamp = lin(0.6, 0.22, 28, 5);
// The ready lamp turns red when the drum is empty.
function stock() {
  const left = cells.some(c => c.full);
  readyLamp.material.color.copy(left ? greenLamp : redLamp);
  const a = coinAction();
  if (a) a.disabled = !left || machine.state !== 'idle';
  return left;
}
// The coin glint: a bright fleck at the slot; bloom turns it into a spark.
const glint = glowPlate(0.02, 0.02, lin(0.95, 0.08, 85), 30, COIN.x + 0.03, COIN.y + 0.04, M.front + 0.05);
glint.visible = false;
const priceWin = STOP.children.find(m => m.isMesh && m.geometry.parameters?.width === 0.14);
function coin() {
  if (machine.state !== 'idle' || !stock()) return;
  const full = cells.filter(c => c.full);
  const cell = full[Math.floor(Math.random() * full.length)];
  machine.state = 'busy';
  stock();
  // The coin drops: a glint, then the price window blinks twice.
  glint.visible = true;
  anim(0.3, k => { glint.scale.setScalar(1 + 2 * Math.sin(Math.PI * k)); glint.position.y = COIN.y + 0.04 - 0.05 * k; }, () => { glint.visible = false; });
  if (priceWin) anim(0.6, k => { priceWin.visible = Math.floor(k * 4) % 2 === 0; }, () => { priceWin.visible = true; });
  // The motor turns the whole stack the short way round, always forward.
  after(0.45, () => {
    const from = drum.rotation.y, target = -cell.sector * STEP;
    let delta = (((target - from) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    if (delta < 0.2) delta += Math.PI * 2;
    anim(0.7 + delta * 0.45, k => {
      drum.rotation.y = from + delta * motor(k);
      readyLamp.visible = Math.floor(k * 10) % 2 === 0;
    }, () => {
      drum.rotation.y = target;
      readyLamp.visible = true;
      openDoor(cell);
    });
  });
}
function openDoor(cell) {
  const door = doors[cell.tier];
  machine.cell = cell;
  machine.door = door;
  // The tier's button lights; the latch lets go; the door swings out.
  buttons[cell.tier].material.color.multiplyScalar(4);
  cell.loaf.material = hotCrust;
  hotLight.position.set(DRUM.x, COL.y0 + (cell.tier + 0.5) * TIER_H, M.front + 0.12);
  steamMat.uniforms.uOrigin.value.set(DRUM.x, COL.y0 + cell.tier * TIER_H + 0.1, M.front + 0.02);
  after(0.15, () => {
    anim(1.1, k => {
      door.pivot.rotation.y = -1.85 * spring(k);
      hotLight.intensity = 3.2 * clamp01(k * 2);
      hotCrust.emissiveIntensity = 0.1 + 1.6 * clamp01(k * 1.5);
    }, () => { machine.state = 'open'; });
    steam.goal = 1;
  });
}
function take() {
  if (machine.state !== 'open') return;
  const { cell, door } = machine;
  machine.state = 'busy';
  // The loaf slides out toward the buyer and is gone.
  const z0 = cell.loaf.position.z;
  anim(0.4, k => { cell.loaf.position.z = z0 + 0.35 * inQuad(k); cell.loaf.scale.setScalar(1 - inQuad(k)); }, () => {
    cell.loaf.visible = false;
    cell.loaf.position.z = z0;
    cell.loaf.scale.set(0.95, 1, 0.9);
    cell.loaf.material = crust;
    cell.full = false;
  });
  steam.goal = 0;
  // The door swings shut and bounces once on its latch.
  after(0.45, () => {
    const from = door.pivot.rotation.y;
    anim(0.38, k => { door.pivot.rotation.y = from * (1 - inQuad(k)); hotLight.intensity = 3.2 * (1 - k); }, () => {
      anim(0.18, k => { door.pivot.rotation.y = -0.06 * Math.sin(Math.PI * k); }, () => {
        door.pivot.rotation.y = 0;
        buttons[cell.tier].material.color.multiplyScalar(0.25);
        hotCrust.emissiveIntensity = 0.1;
        machine.state = 'idle';
        machine.cell = machine.door = null;
        stock();
      });
    });
  });
}
// Reset closes any open door and restocks the drum, one tier at a time.
function restock() {
  if (machine.state === 'busy') return;
  if (machine.state === 'open') {
    machine.door.pivot.rotation.y = 0;
    buttons[machine.cell.tier].material.color.multiplyScalar(0.25);
    machine.cell.loaf.material = crust;
    hotLight.intensity = 0;
    steam.goal = 0;
    machine.state = 'idle';
    machine.cell = machine.door = null;
  }
  for (let t = 0; t < TIERS; t++) {
    after(0.08 * t, () => {
      for (const c of cells) if (c.tier === t && !c.full) { c.full = true; c.loaf.visible = true; }
      buttons[t].material.color.multiplyScalar(3);
      after(0.12, () => buttons[t].material.color.multiplyScalar(1 / 3));
    });
  }
  after(0.08 * TIERS + 0.2, stock);
}
drum.rotation.y = 0;

/* ---------- picking ---------- */
// A tap on the machine buys a loaf, or takes the one in the open hatch.
// The machine is small in the long lens, so a tap near it counts too.
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), box3 = new THREE.Box3(), corner = new THREE.Vector3();
const cabinet = STOP.children.filter(m => m.isMesh);
function nearMachine(px, py, r) {
  box3.setFromCenterAndSize(new THREE.Vector3(0, M.y0 + (M.h + HOOD.R) / 2, M.front - M.d / 2), new THREE.Vector3(M.w, M.h + HOOD.R, M.d));
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i < 8; i++) {
    corner.set(i & 1 ? box3.max.x : box3.min.x, i & 2 ? box3.max.y : box3.min.y, i & 4 ? box3.max.z : box3.min.z);
    STOP.localToWorld(corner).project(camera);
    const sx = (corner.x * 0.5 + 0.5) * r.width, sy = (0.5 - corner.y * 0.5) * r.height;
    x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
  }
  const pad = Math.max(18, (x1 - x0) * 0.25);
  return px > x0 - pad && px < x1 + pad && py > y0 - pad && py < y1 + pad;
}
function tapAt(cx, cy) {
  const r = stage.getBoundingClientRect(), px = cx - r.left, py = cy - r.top;
  ndc.set((px / r.width) * 2 - 1, -(py / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(STOP, true).length > 0 || nearMachine(px, py, r);
  if (!hit) return;
  if (machine.state === 'open') take(); else coin();
}

/* ---------- pointer ---------- */
// A press turns into a drag after 8 px, or a hold after 260 ms.
let press = null;
const lookBusy = () => !!press || Math.abs(look.ty - look.yaw) + Math.abs(look.tp - look.pitch) > 1e-4;
function stepLook(dt) {
  const k = 1 - Math.exp(-dt * (reduced() ? 6 : 10));
  look.yaw += (look.ty - look.yaw) * k;
  look.pitch += (look.tp - look.pitch) * k;
}
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  // Capture can fail for a pointer the browser no longer tracks.
  try { stage.setPointerCapture(e.pointerId); } catch { /* capture is optional */ }
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, at: performance.now(), drag: false, yaw: look.ty, pitch: look.tp };
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  if (!press.drag && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { press.drag = true; stage.classList.add('held'); }
  if (!press.drag) return;
  // A drag looks round a little; the long lens makes small turns big.
  const s = 0.12 / Math.max(size.w, size.h);
  look.ty = Math.max(-0.08, Math.min(0.08, press.yaw - (e.clientX - press.x) * s));
  look.tp = Math.max(-0.12, Math.min(0.12, press.pitch + ((e.clientY - press.y) / size.h) * 0.25));
  wake();
});
const endPress = e => {
  if (!press || e.pointerId !== press.id) return;
  press = null;
  stage.classList.remove('held');
  wake();
};
stage.addEventListener('pointerup', e => {
  if (press && e.pointerId === press.id && !press.drag && performance.now() - press.at < 260) tapAt(e.clientX, e.clientY);
  endPress(e);
});
stage.addEventListener('pointercancel', endPress);
stage.addEventListener('lostpointercapture', endPress);
// Space buys a loaf, or takes the one waiting, when the stage has focus.
stage.addEventListener('keydown', e => {
  if (e.key !== ' ' || e.repeat) return;
  e.preventDefault();
  if (machine.state === 'open') take(); else coin();
});

/* ---------- bar ---------- */
act.coin = () => (machine.state === 'open' ? take() : coin());
act.reset = () => restock();
act.tilt = v => { tilt.uniforms.uAmt.value = v; draw(); };
act.letterbox = on => { stage.toggleAttribute('data-letterbox', on); };
act.view = v => { setView(v); frame(); draw(); };
setView(QS.get('view') || ui.setting('view')?.value || 'road');
act.tilt(ui.setting('tilt')?.value ?? 0.6);
act.letterbox(!!ui.setting('letterbox')?.value);
stock();

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  wake();
  canvas.classList.add('on');
  markReady();
}, () => { canvas.classList.add('on'); markReady(); });
</script>
