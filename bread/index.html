<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.1 0.015 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Broodautomaat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Broodautomaat: a bread machine glows alone by a dark village road. */
:root { --stage: oklch(0.08 0.015 265); }
.stage--bread canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--bread canvas.on { opacity: 1; }
.stage--bread { cursor: grab; }
.stage--bread.held { cursor: grabbing; }
/* Letterbox bars clip the canvas to 2.39 to 1. */
.stage--bread[data-letterbox] canvas { clip-path: inset(var(--box, 0px) 0); }
@media (prefers-reduced-motion: reduce) { .stage--bread canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Broodautomaat</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--bread" id="stage" tabindex="0" role="application" aria-label="A bread vending machine glows alone by a dark village road at night. Drop a coin to buy a loaf.">
      <p class="fail" hidden>Broodautomaat needs WebGL 2, which this browser has turned off.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Broodautomaat</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { initPage, whenVisible, pixelRatio, onQuality, linFit, reduced, onReducedChange, quality } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const stage = document.getElementById('stage');
// The bar handlers bind once the scene exists.
const act = { coin() {}, car() {}, tube() {}, rain() {}, tilt() {}, moths() {}, letterbox() {}, reset() {} };
const QS = new URLSearchParams(location.search);
const ui = initPage({ id: 'bread', silent: true, bar: {
  slider: { label: 'Tube', min: 0, max: 1, step: 0.01, value: 0.25, onInput: v => act.tube(v) },
  actions: [
    { verb: 'coin', label: 'Coin', key: 'Space', onPress: () => act.coin() },
    { verb: 'add', noun: 'Car', key: 'C', onPress: () => act.car() },
  ],
  settings: [
    { type: 'toggle', id: 'rain', label: 'Rain', value: false, persist: true, onToggle: on => act.rain(on) },
    { type: 'slider', id: 'tilt', label: 'Tilt-shift', min: 0, max: 1, step: 0.01, value: 0.6, persist: true, onInput: v => act.tilt(v) },
    { type: 'slider', id: 'moths', label: 'Moths', min: 0, max: 1, step: 0.01, value: 0.5, persist: true, onInput: v => act.moths(v) },
    { type: 'toggle', id: 'letterbox', label: 'Letterbox', value: false, persist: true, onToggle: on => act.letterbox(on) },
  ],
  reset: () => act.reset(),
  quality: true,
  keys: [['click', 'coin slot'], ['click', 'tube'], ['click', 'open hatch'], ['drag', 'look']],
} });

// Seeded random keeps the land the same on every load.
let seed = 4021;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let markReady;
const sceneReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, sceneReady]) });

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false; ui.hideControls?.(); markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const canvas = renderer.domElement;
stage.prepend(canvas);
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 3000);
// The performance ladder's rung; slow frames raise it, never lower it.
let rung = 0;
// Linear RGB from OKLCH, scaled by a power.
const lin = (L, C, h, k = 1) => new THREE.Color(...linFit(L, C, h).map(c => c * k));

/* ---------- colours ---------- */
// The tube is cool white with a green cast; the bread light is warm.
const TUBE = lin(0.97, 0.035, 160);
const WARM = lin(0.84, 0.13, 62);
const SKYGLOW = lin(0.42, 0.08, 52);
const NIGHT = lin(0.12, 0.03, 265);
scene.fog = new THREE.FogExp2(lin(0.15, 0.03, 40).getHex(), 0.0026);

/* ---------- sky ---------- */
// One sphere: deep blue overhead, a sodium skyglow low on the horizon.
// A thin cloud band catches the town glow from below.
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uGlow: { value: SKYGLOW }, uNight: { value: NIGHT } },
  vertexShader: /* glsl */`varying vec3 vDir; void main() { vDir = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: /* glsl */`
  uniform vec3 uGlow, uNight; varying vec3 vDir;
  float h21(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
  float vn(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
  float fbm(vec2 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * vn(p); p = p * 2.03 + 7.1; a *= 0.5; } return s; }
  void main() {
    vec3 d = normalize(vDir);
    float el = d.y, az = atan(d.x, -d.z);
    // The town glow sits right of centre, behind the machine.
    float town = exp(-pow((az - 0.35) / 0.9, 2.0));
    vec3 c = uNight * (0.35 + 0.65 * smoothstep(0.6, 0.0, el));
    c += uGlow * exp(-max(el, 0.0) * 14.0) * (0.25 + 0.75 * town) * 0.55;
    // Low cloud: a band of fbm, lit from below by the same glow.
    float band = smoothstep(0.02, 0.07, el) * smoothstep(0.24, 0.1, el);
    float cl = smoothstep(0.42, 0.75, fbm(vec2(az * 3.2, el * 22.0)));
    c = mix(c, uGlow * (0.06 + 0.16 * town) + uNight * 0.2, cl * band * 0.85);
    // Stars: sparse hashed points, hidden behind cloud and glow.
    vec2 sp = vec2(az * 520.0, el * 520.0);
    float s = h21(floor(sp));
    float star = step(0.9988, s) * smoothstep(0.3, 0.0, length(fract(sp) - 0.5)) * smoothstep(0.1, 0.3, el) * (1.0 - cl * band);
    c += vec3(0.75, 0.8, 1.0) * star * (0.4 + 1.2 * h21(floor(sp) + 3.1));
    gl_FragColor = vec4(c, 1.0);
  }`,
}));
sky.renderOrder = -1;
scene.add(sky);

/* ---------- land ---------- */
// A value-noise texture breaks up the fields and the asphalt.
function noiseTex(n, k) {
  const d = new Uint8Array(n * n * 4);
  for (let i = 0; i < n * n; i++) {
    const v = 1 - k + k * rnd();
    d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = Math.round(v * 255); d[i * 4 + 3] = 255;
  }
  const t = new THREE.DataTexture(d, n, n);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true;
  t.needsUpdate = true;
  return t;
}
const fieldTex = noiseTex(128, 0.6); fieldTex.repeat.set(220, 220);
const field = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: lin(0.26, 0.03, 120), map: fieldTex, roughness: 1 }));
field.position.y = -0.03;
field.receiveShadow = true;
scene.add(field);

// The road runs straight away from the eye, along -z, to the horizon.
const ROAD = { x0: -3.0, x1: 3.0, len: 1800 };
const asphaltTex = noiseTex(256, 0.35); asphaltTex.repeat.set(4, 240);
const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD.x1 - ROAD.x0, ROAD.len).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: lin(0.24, 0.006, 260), map: asphaltTex, roughness: 0.55 }));
road.position.z = -ROAD.len / 2 + 30;
road.receiveShadow = true;
scene.add(road);
// Worn white edge lines and a dashed centre line catch the light, and later the rain.
const lineMat = new THREE.MeshStandardMaterial({ color: lin(0.78, 0.01, 90), roughness: 0.7 });
{
  const parts = [];
  for (const x of [ROAD.x0 + 0.25, ROAD.x1 - 0.25]) parts.push(new THREE.PlaneGeometry(0.12, ROAD.len).rotateX(-Math.PI / 2).translate(x, 0, -ROAD.len / 2 + 30));
  // Dashes of 3 m with 9 m gaps, as on Flemish country roads.
  for (let z = 20; z > -600; z -= 12) parts.push(new THREE.PlaneGeometry(0.1, 3).rotateX(-Math.PI / 2).translate(0, 0, z));
  const l = new THREE.Mesh(mergeGeometries(parts), lineMat);
  l.position.y = 0.004;
  l.receiveShadow = true;
  scene.add(l);
}

/* ---------- far land ---------- */
// Silhouettes against the skyglow: poplars, hedges and a Flemish village.
const inkMat = new THREE.MeshBasicMaterial({ color: lin(0.07, 0.012, 265), fog: false });
// The village sits deeper in the haze, so its ink is a shade lighter.
const villMat = new THREE.MeshBasicMaterial({ color: lin(0.1, 0.018, 35), fog: false });
// A roof prism: a triangle of width w and height rh, extruded to depth d.
// Gable-front roofs face the eye; eave-front roofs run along the street.
function roof(w, rh, d, gable) {
  const s = new THREE.Shape();
  const a = gable ? w : d;
  s.moveTo(-a / 2, 0); s.lineTo(a / 2, 0); s.lineTo(0, rh); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: gable ? d : w, bevelEnabled: false });
  return gable ? g.translate(0, 0, -d / 2) : g.rotateY(Math.PI / 2).translate(-w / 2, 0, 0);
}
const VZ = -1100;
const windows = [];
{
  const parts = [];
  // A row of poplars crosses the fields left of the road.
  for (let i = 0; i < 9; i++) {
    const x = -58 - i * 12 - rnd() * 3, z = -440 - i * 2, h = 16 + rnd() * 5;
    parts.push(new THREE.SphereGeometry(1, 12, 12).scale(1.6 + rnd() * 0.6, h / 2, 1.6).translate(x, h / 2 + 1, z));
  }
  // Low hedges and tree clumps along the horizon, clear of the village.
  for (let i = 0; i < 18; i++) {
    const a = -1.2 + i * 0.16 + rnd() * 0.05, r = 700 + rnd() * 300, h = 8 + rnd() * 10;
    if (Math.abs(a) < 0.16) continue;
    parts.push(new THREE.SphereGeometry(1, 20, 8).scale(10 + rnd() * 18, h * 0.8, 8).translate(Math.sin(a) * r, 0, -Math.cos(a) * r));
  }
  scene.add(new THREE.Mesh(mergeGeometries(parts.map(g => (g.index ? g.toNonIndexed() : g))), inkMat));
}
{
  // The village: brick rows with steep roofs where the road ends.
  const parts = [];
  for (const [row, z0, n] of [[0, VZ, 18], [1, VZ - 30, 12]]) {
    let x = -96 + rnd() * 6;
    for (let i = 0; i < n; i++) {
      const w = 6 + rnd() * 3.5, h = (row ? 6 : 5) + rnd() * 3, d = 10, gable = rnd() < 0.45;
      const rh = gable ? w * 0.75 : d * 0.55;
      // The road runs on through the village; no house stands on it.
      if (Math.abs(x + w / 2) < 6) x += 12;
      const cx = x + w / 2, cz = z0 + rnd() * 6;
      parts.push(new THREE.BoxGeometry(w, h, d).translate(cx, h / 2, cz));
      parts.push(roof(w, rh, d, gable).translate(cx, h, cz));
      // A few windows are lit; one in eight glows television blue.
      if (!row) for (const wy of [1.6, h - 1.8]) {
        if (rnd() < 0.42) windows.push([cx + (rnd() - 0.5) * (w - 2.4), wy, cz + d / 2 + 0.05, rnd() < 0.12]);
      }
      x += w + (rnd() < 0.25 ? 3 + rnd() * 6 : 0.1);
    }
  }
  // The church: a brick tower with corner pinnacles, a needle spire and a long nave.
  const cx = -24, cz = VZ - 22;
  parts.push(new THREE.BoxGeometry(10, 40, 10).translate(cx, 20, cz));
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) parts.push(new THREE.ConeGeometry(0.9, 6, 4).translate(cx + sx * 4.4, 43, cz + sz * 4.4));
  parts.push(new THREE.ConeGeometry(5.2, 32, 4).rotateY(Math.PI / 4).translate(cx, 56, cz));
  parts.push(new THREE.BoxGeometry(16, 17, 40).translate(cx, 8.5, cz - 25));
  parts.push(roof(16, 11, 40, true).translate(cx, 17, cz - 25));
  scene.add(new THREE.Mesh(mergeGeometries(parts.map(g => (g.index ? g.toNonIndexed() : g))), villMat));
  // The church clock is lit, a pale disc high on the tower.
  const clock = new THREE.Mesh(new THREE.CircleGeometry(1.4, 24), new THREE.MeshBasicMaterial({ color: lin(0.9, 0.05, 85, 1.5), fog: false }));
  clock.position.set(cx, 32, cz + 5.05);
  scene.add(clock);
}
// Lit windows: tiny warm squares; bloom makes them points of light.
const farMat = new THREE.MeshBasicMaterial({ color: WARM.clone().multiplyScalar(5), fog: false });
const tvMat = new THREE.MeshBasicMaterial({ color: lin(0.7, 0.12, 250, 4), fog: false });
for (const [x, y, z, tv] of windows) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 1.3), tv ? tvMat : farMat);
  m.position.set(x, y, z);
  scene.add(m);
}
// Sodium lamps run down the road and into the village.
const sodiumMat = new THREE.MeshBasicMaterial({ color: lin(0.8, 0.16, 58, 14), fog: false });
for (const [x, z, r] of [[ROAD.x1 + 1.2, -420, 0.3], [ROAD.x1 + 1.2, -900, 0.5], [ROAD.x0 - 1.2, VZ + 30, 0.6], [ROAD.x1 + 1.2, VZ - 20, 0.6]]) {
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), sodiumMat);
  lamp.position.set(x, 6, z);
  scene.add(lamp);
}

/* ---------- the stop ---------- */
// The machine stands alone on a small concrete pad on the far verge.
const STOP = new THREE.Group();
// It faces the road at an angle, so the eye sees it three-quarter on.
STOP.position.set(ROAD.x1 + 2.3, 0, -36);
STOP.rotation.y = -0.45;
scene.add(STOP);
const concrete = new THREE.MeshStandardMaterial({ color: lin(0.55, 0.008, 80), map: noiseTex(64, 0.25), roughness: 0.92 });
const enamel = new THREE.MeshStandardMaterial({ color: lin(0.86, 0.02, 95), roughness: 0.4, metalness: 0.05 });
const steel = new THREE.MeshStandardMaterial({ color: lin(0.72, 0.008, 250), roughness: 0.3, metalness: 0.8 });
const trim = new THREE.MeshStandardMaterial({ color: lin(0.24, 0.01, 260), roughness: 0.5, metalness: 0.4 });
const cast = m => { m.castShadow = true; m.receiveShadow = true; return m; };
const box = (w, h, d, mat, x, y, z, r = 0, parent = STOP) => {
  const g = r ? new RoundedBoxGeometry(w, h, d, 2, r) : new THREE.BoxGeometry(w, h, d);
  const m = cast(new THREE.Mesh(g, mat));
  m.position.set(x, y, z);
  parent.add(m);
  return m;
};
box(1.6, 0.12, 1.4, concrete, 0, 0.06, 0.2);

/* the cabinet */
// A tall narrow cabinet; a column of small doors sits left of centre.
// Each door opens on one tier of the carousel behind it.
const M = { w: 0.86, h: 1.92, d: 0.72, front: 0.36, y0: 0.12 };
const TIERS = 8, TIER_H = 0.17;
const COL = { x0: -0.37, x1: -0.03, y0: 0.4 };
COL.y1 = COL.y0 + TIERS * TIER_H;
{
  const { w, h, d, y0 } = M, cz = M.front - d / 2, fz = M.front - 0.02;
  // Back, sides and top as one shell, open at the door column.
  box(w, h, 0.04, enamel, 0, y0 + h / 2, cz - d / 2 + 0.02);
  box(0.04, h, d, enamel, -w / 2 + 0.02, y0 + h / 2, cz, 0.015);
  box(0.04, h, d, enamel, w / 2 - 0.02, y0 + h / 2, cz, 0.015);
  box(w, 0.04, d, enamel, 0, y0 + h - 0.02, cz);
  // The front panel, built round the door column.
  box(COL.x0 + w / 2, h, 0.04, enamel, (-w / 2 + COL.x0) / 2, y0 + h / 2, fz);
  box(w / 2 - COL.x1, h, 0.04, enamel, (COL.x1 + w / 2) / 2, y0 + h / 2, fz);
  box(COL.x1 - COL.x0, COL.y0 - y0, 0.04, enamel, (COL.x0 + COL.x1) / 2, (y0 + COL.y0) / 2, fz);
  box(COL.x1 - COL.x0, y0 + h - COL.y1, 0.04, enamel, (COL.x0 + COL.x1) / 2, (COL.y1 + y0 + h) / 2, fz);
  // A dark plinth keeps the cabinet off the wet concrete.
  box(w - 0.04, 0.1, d - 0.04, trim, 0, y0 + 0.05, cz);
}

/* coin unit */
// Right of the doors: a price window, a coin slot, a green ready lamp and a return cup.
const COIN = { x: 0.2, y: 1.18 };
const glowPlate = (w, h, col, k, x, y, z = M.front + 0.025) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(k) }));
  m.position.set(x, y, z);
  STOP.add(m);
  return m;
};
box(0.24, 0.5, 0.04, steel, COIN.x, COIN.y, M.front + 0.0, 0.01);
glowPlate(0.14, 0.05, lin(0.8, 0.17, 60), 3, COIN.x, COIN.y + 0.16);
const readyLamp = glowPlate(0.024, 0.024, lin(0.82, 0.2, 145), 5, COIN.x - 0.06, COIN.y + 0.05);
box(0.06, 0.1, 0.03, trim, COIN.x + 0.03, COIN.y + 0.04, M.front + 0.025, 0.006);
glowPlate(0.008, 0.06, lin(0.6, 0.02, 250), 0.8, COIN.x + 0.03, COIN.y + 0.04, M.front + 0.042);
box(0.1, 0.06, 0.05, trim, COIN.x, COIN.y - 0.16, M.front + 0.03, 0.01);
// One small lit button sits beside each door.
const buttons = [];
for (let t = 0; t < TIERS; t++) {
  buttons.push(glowPlate(0.03, 0.03, lin(0.9, 0.02, 230), 1.4, COL.x1 + 0.04, COL.y0 + (t + 0.5) * TIER_H));
}

/* ---------- the carousel ---------- */
// Eight tiers of eight compartments turn on one vertical axis behind the doors.
// One loaf sits in each compartment.
const DRUM = { sectors: 8, r: 0.27, x: (COL.x0 + COL.x1) / 2, z: M.front - 0.32 };
const drum = new THREE.Group();
drum.position.set(DRUM.x, COL.y0, DRUM.z);
STOP.add(drum);
const shelfMat = new THREE.MeshStandardMaterial({ color: lin(0.78, 0.01, 230), roughness: 0.3, metalness: 0.7 });
const cellMat = new THREE.MeshStandardMaterial({ color: lin(0.5, 0.01, 230), emissive: lin(0.9, 0.02, 230), emissiveIntensity: 0.06, roughness: 0.7 });
const crust = new THREE.MeshStandardMaterial({ color: lin(0.55, 0.12, 60), emissive: WARM, emissiveIntensity: 0.1, roughness: 0.6 });
const cells = [];
{
  const { sectors, r } = DRUM, step = (Math.PI * 2) / sectors;
  for (let t = 0; t <= TIERS; t++) {
    const disc = cast(new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.012, 32), shelfMat));
    disc.position.y = t * TIER_H;
    drum.add(disc);
  }
  for (let t = 0; t < TIERS; t++) {
    const y = t * TIER_H;
    for (let s = 0; s < sectors; s++) {
      const cell = new THREE.Group();
      cell.rotation.y = s * step;
      drum.add(cell);
      // Dividers between compartments; the back glows faint cool white.
      const wall = new THREE.Mesh(new THREE.BoxGeometry(0.006, TIER_H - 0.012, r - 0.06), shelfMat);
      wall.position.set(0, y + TIER_H / 2, (r + 0.06) / 2);
      wall.rotation.y = step / 2;
      cell.add(wall);
      const back = new THREE.Mesh(new THREE.PlaneGeometry(0.1, TIER_H - 0.012), cellMat);
      back.position.set(0, y + TIER_H / 2, 0.07);
      cell.add(back);
      // The loaf: a squashed capsule lying across the compartment.
      const loaf = cast(new THREE.Mesh(new THREE.CapsuleGeometry(0.05, 0.08, 6, 12), crust));
      loaf.rotation.z = Math.PI / 2;
      loaf.scale.set(0.95, 1, 0.9);
      loaf.position.set(0, y + 0.055, r * 0.6);
      cell.add(loaf);
      cells.push({ tier: t, sector: s, loaf, full: true });
    }
  }
  const core = cast(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, TIERS * TIER_H, 12), steel));
  core.position.y = (TIERS * TIER_H) / 2;
  drum.add(core);
}
drum.rotation.y = 0.12;

/* the doors */
// One small door per tier: a steel frame round a glass pane, hinged on the left.
const glassMat = new THREE.MeshStandardMaterial({ color: lin(0.4, 0.01, 220), roughness: 0.05, metalness: 0.3, transparent: true, opacity: 0.18, depthWrite: false });
const doors = [];
{
  const w = COL.x1 - COL.x0, h = TIER_H - 0.012, f = 0.022;
  const frameGeo = mergeGeometries([
    new THREE.BoxGeometry(w, f, 0.016).translate(w / 2, (h - f) / 2, 0),
    new THREE.BoxGeometry(w, f, 0.016).translate(w / 2, -(h - f) / 2, 0),
    new THREE.BoxGeometry(f, h, 0.016).translate(f / 2, 0, 0),
    new THREE.BoxGeometry(f, h, 0.016).translate(w - f / 2, 0, 0),
    // The pull: a short bar near the free edge.
    new THREE.BoxGeometry(0.012, h * 0.5, 0.02).translate(w - 0.04, 0, 0.016),
  ]);
  for (let t = 0; t < TIERS; t++) {
    const pivot = new THREE.Group();
    pivot.position.set(COL.x0, COL.y0 + (t + 0.5) * TIER_H, M.front);
    STOP.add(pivot);
    pivot.add(cast(new THREE.Mesh(frameGeo, steel)));
    const pane = new THREE.Mesh(new THREE.PlaneGeometry(w - f * 2, h - f * 2), glassMat);
    pane.position.x = w / 2;
    pivot.add(pane);
    doors.push({ tier: t, pivot, open: 0 });
  }
}

/* ---------- the hood ---------- */
// A curved yellow lightbox crowns the cabinet and carries the plain word.
const HOOD = { R: 0.3, over: 0.12, w: M.w + 0.06 };
HOOD.y = M.y0 + M.h;
HOOD.cz = M.front + HOOD.over - HOOD.R;
const hoodTex = (() => {
  // The canvas runs round the arc in x and along the hood in y.
  const c = document.createElement('canvas');
  c.width = 256; c.height = 1024;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 256, 0);
  grad.addColorStop(0, '#ff9f00'); grad.addColorStop(0.5, '#ffc400'); grad.addColorStop(1, '#e08a00');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 1024);
  g.save();
  g.translate(96, 512);
  g.rotate(Math.PI / 2);
  g.fillStyle = '#1e1204';
  g.font = '900 84px Gabarito, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('BROODAUTOMAAT', 0, 0);
  g.restore();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
})();
const hoodMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: hoodTex, emissiveIntensity: 0.75, roughness: 0.3, side: THREE.DoubleSide });
const hoodCap = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: lin(0.86, 0.17, 88), emissiveIntensity: 0.6, roughness: 0.3 });
{
  const { R, w, y, cz } = HOOD;
  // The arc runs from the front lip up to the crown.
  const arc = new THREE.Mesh(new THREE.CylinderGeometry(R, R, w, 40, 1, true, 0, Math.PI / 2).rotateZ(Math.PI / 2), hoodMat);
  arc.position.set(0, y, cz);
  STOP.add(arc);
  // A flat crown runs back from the arc to the rear of the cabinet.
  const back = cz - (M.front - M.d);
  const crown = new THREE.Mesh(new THREE.PlaneGeometry(w, back).rotateX(-Math.PI / 2), hoodCap);
  crown.position.set(0, y + R, cz - back / 2);
  STOP.add(crown);
  // Two end caps close the hood.
  const s = new THREE.Shape();
  s.moveTo(-back, 0); s.lineTo(R, 0); s.absarc(0, 0, R, 0, Math.PI / 2, false); s.lineTo(-back, R); s.closePath();
  for (const side of [-1, 1]) {
    const cap = new THREE.Mesh(new THREE.ShapeGeometry(s, 12).rotateY(-Math.PI / 2), hoodCap);
    cap.position.set(side * w / 2, y, cz);
    cap.material.side = THREE.DoubleSide;
    STOP.add(cap);
  }
}

/* ---------- the tube ---------- */
// One bare fluorescent tube under the hood's front lip.
const TUBE_POS = new THREE.Vector3(0, HOOD.y - 0.03, M.front + 0.1);
const tubeMat = new THREE.MeshBasicMaterial({ color: TUBE.clone().multiplyScalar(9) });
const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.013, 0.76, 12).rotateZ(Math.PI / 2), tubeMat);
tube.position.copy(TUBE_POS);
STOP.add(tube);
// The end caps stay dark grey; a dying tube glows orange there.
for (const s of [-1, 1]) {
  const c = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.017, 0.04, 10).rotateZ(Math.PI / 2), trim);
  c.position.set(TUBE_POS.x + s * 0.4, TUBE_POS.y, TUBE_POS.z);
  STOP.add(c);
}
// The area light: long and thin, aimed down the doors and out over the pad.
const tubeLight = new THREE.RectAreaLight(TUBE, 26, 0.76, 0.06);
tubeLight.position.copy(TUBE_POS).add(new THREE.Vector3(0, -0.02, 0));
STOP.add(tubeLight);
tubeLight.lookAt(STOP.localToWorld(new THREE.Vector3(0, 0, 1.8)));
// The hood throws a warm yellow wash forward and down.
const hoodLight = new THREE.RectAreaLight(lin(0.86, 0.17, 88), 7, HOOD.w, 0.24);
hoodLight.position.set(0, HOOD.y + 0.12, M.front + HOOD.over + 0.02);
STOP.add(hoodLight);
hoodLight.lookAt(STOP.localToWorld(new THREE.Vector3(0, 0.3, 3)));
// Inside the carousel, a cool white lamp lights the loaves.
const drumLight = new THREE.PointLight(lin(0.95, 0.02, 230), 0.9, 1.4, 2);
drumLight.position.set(DRUM.x, COL.y1 - 0.05, DRUM.z + 0.05);
STOP.add(drumLight);
// A short point light fills the cabinet and pad, and casts the machine's shadow.
const tubeFill = new THREE.PointLight(TUBE, 2.2, 7, 2);
tubeFill.position.copy(TUBE_POS).add(new THREE.Vector3(0, -0.05, 0.12));
tubeFill.castShadow = true;
tubeFill.shadow.mapSize.set(512, 512);
tubeFill.shadow.bias = -0.002;
tubeFill.shadow.radius = 6;
STOP.add(tubeFill);
// The moon: a faint blue sky light over everything.
scene.add(new THREE.HemisphereLight(lin(0.45, 0.04, 255), lin(0.12, 0.02, 120), 0.3));
// A low moon behind the camera rims the road with cold light.
// It hangs low down the road, so the asphalt shines toward the eye.
const moon = new THREE.DirectionalLight(lin(0.7, 0.04, 250), 0.22);
moon.position.set(-20, 18, -200);
scene.add(moon);

/* ---------- moths ---------- */
// Soft points round the tube; the flight comes in Task 3.
const MOTHS = 24;
const mothGeo = new THREE.BufferGeometry();
{
  const p = new Float32Array(MOTHS * 3);
  for (let i = 0; i < MOTHS; i++) {
    const a = rnd() * Math.PI * 2, r = 0.12 + rnd() * 0.55;
    p.set([TUBE_POS.x + Math.cos(a) * r * 1.1, TUBE_POS.y - 0.05 + (rnd() - 0.4) * 0.7, TUBE_POS.z + Math.sin(a) * r * 0.5 + 0.2], i * 3);
  }
  mothGeo.setAttribute('position', new THREE.BufferAttribute(p, 3));
}
const mothMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uCol: { value: TUBE.clone().multiplyScalar(2.2) }, uPx: { value: 1 } },
  vertexShader: /* glsl */`uniform float uPx; void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = uPx * 0.035 / -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: /* glsl */`uniform vec3 uCol; void main() { vec2 q = gl_PointCoord - 0.5; float d = length(q * vec2(1.0, 1.8)); gl_FragColor = vec4(uCol * smoothstep(0.5, 0.1, d), 1.0); }`,
});
const moths = new THREE.Points(mothGeo, mothMat);
STOP.add(moths);

/* ---------- K2: bloom ---------- */
// Lifted from Canal at dusk: bloom on a float target; only bright sources cross the threshold.
function makeBloom(strength, radius, threshold) {
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), strength, radius, threshold);
  const full = bloom.setSize.bind(bloom);
  // Full size on High, 0.7 on Standard, half on the ladder's rung 2.
  bloom.setSize = (w, h) => { const m = rung >= 2 ? 0.5 : quality() === 'high' ? 1 : 0.7; full(Math.max(1, w * m), Math.max(1, h * m)); };
  // A sigma of radius / 2.5 gives each blur layer a round falloff.
  for (const m of bloom.separableBlurMaterials) {
    const r = m.defines.KERNEL_RADIUS, sg = r / 2.5;
    m.uniforms.gaussianCoefficients.value = Array.from({ length: r }, (_, i) => Math.exp(-0.5 * i * i / (sg * sg)));
  }
  return bloom;
}
/* ---------- end K2 ---------- */

/* ---------- K2: grade ---------- */
// Lifted from Canal at dusk: linear grade before tone mapping, vignette, fixed grain.
function makeGrade({ tint, vig, vigIn, grain }) {
  return new ShaderPass({
    uniforms: {
      tDiffuse: { value: null },
      uRes: { value: new THREE.Vector2(1, 1) },
      uTint: { value: new THREE.Vector3(...tint) },
      uVig: { value: vig },
      uVigIn: { value: vigIn },
      uGrain: { value: grain },
    },
    vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform vec2 uRes;
    uniform vec3 uTint;
    uniform float uVig, uVigIn, uGrain;
    varying vec2 vUv;
    // An integer hash per pixel; float hashes draw faint stripes here.
    float h(vec2 p) {
      uvec2 q = uvec2(p);
      uint n = (q.x * 1597334677u) ^ (q.y * 3812015801u);
      n *= 1597334677u; n ^= n >> 16; n *= 2246822519u; n ^= n >> 13;
      return float(n) / 4294967295.0;
    }
    void main() {
      vec3 c = texture2D(tDiffuse, vUv).rgb + uTint;
      vec2 q = (vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
      c *= 1.0 - uVig * smoothstep(uVigIn, 1.1, length(q));
      float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c *= 1.0 + (h(gl_FragCoord.xy) - 0.5) * uGrain * (0.6 + 0.4 * smoothstep(0.0, 0.3, lum)) * 2.0;
      gl_FragColor = vec4(max(c, 0.0), 1.0);
    }`,
  });
}
/* ---------- end K2 ---------- */

/* ---------- tilt-shift ---------- */
// A sharp band through the machine; blur grows above and below it.
// Bright taps weigh more, so out-of-focus lights open into discs.
const tilt = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null },
    uRes: { value: new THREE.Vector2(1, 1) },
    uFocus: { value: 0.35 },
    uBand: { value: 0.12 },
    uAmt: { value: 0.6 },
  },
  vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uFocus, uBand, uAmt; varying vec2 vUv;
  void main() {
    float d = abs(vUv.y - uFocus);
    // The radius in pixels; it scales with the canvas height.
    float r = uAmt * smoothstep(uBand, uBand + 0.4, d) * uRes.y * 0.012;
    vec3 c = texture2D(tDiffuse, vUv).rgb;
    if (r < 0.4) { gl_FragColor = vec4(c, 1.0); return; }
    vec3 acc = c; float wsum = 1.0;
    // A per-pixel turn of the spiral trades the tap pattern for fine noise.
    float j = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) * 6.2832;
    // A golden-angle spiral of 20 taps fills a disc evenly.
    for (int i = 1; i <= 20; i++) {
      float fi = float(i), a = fi * 2.39996 + j, rr = sqrt(fi / 20.0) * r;
      vec3 s = texture2D(tDiffuse, vUv + vec2(cos(a), sin(a)) * rr / uRes).rgb;
      float w = 1.0 + 2.5 * smoothstep(0.6, 3.0, dot(s, vec3(0.2126, 0.7152, 0.0722)));
      acc += s * w; wsum += w;
    }
    gl_FragColor = vec4(acc / wsum, 1.0);
  }`,
});

/* ---------- flare ---------- */
// The flare follows Buoy Business: veil, orb, anamorphic streak and ghosts.
// It is lifted from Beach walker's POST_FS, without the depth test.
const flare = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null },
    uSun: { value: new THREE.Vector2(0.5, 0.5) },
    uAspect: { value: 1 },
    uCol: { value: new THREE.Vector3(...TUBE.toArray()) },
    uGain: { value: 0.14 },
  },
  vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform sampler2D tDiffuse; uniform vec2 uSun; uniform float uAspect, uGain; uniform vec3 uCol; varying vec2 vUv;
  void main() {
    vec3 base = texture2D(tDiffuse, vUv).rgb;
    vec2 d = vUv - uSun;
    float ax = d.x * uAspect, ay = d.y;
    // A wide veil and a soft orb, squashed sideways.
    float r = length(vec2(ax * 0.6, ay));
    vec3 add = uCol * (0.02 * exp(-r * 1.5) + 0.06 * exp(-r * 5.0) + 0.3 * exp(-r * 22.0));
    // Three nested bands: a soft core, a wide sheath and a broad haze.
    float line = 0.4 * exp(-abs(ay) * 130.0) + 0.12 * exp(-abs(ay) * 20.0) + 0.03 * exp(-abs(ay) * 4.0);
    add += mix(uCol, vec3(0.55, 0.72, 1.0), 0.45) * line * exp(-abs(ax) / 1.1);
    // Ghosts sit on the line from the source through the frame centre.
    vec2 toC = vec2(0.5) - uSun;
    vec3 gs[4];
    gs[0] = vec3(0.7, 0.05, 0.9); gs[1] = vec3(1.4, 0.09, 0.6); gs[2] = vec3(2.2, 0.15, 0.4); gs[3] = vec3(-0.45, 0.03, 0.5);
    for (int i = 0; i < 4; i++) {
      vec2 g = (vUv - (uSun + toC * gs[i].x)) * vec2(uAspect, 1.0);
      float gr = length(g) / gs[i].y;
      add += mix(uCol, uCol * vec3(1.0, 0.5, 0.2), 0.4) * exp(-gr * gr) * gs[i].z * 0.1;
    }
    add *= uGain;
    // Screen blend on the bright end: the flare washes, never clips.
    gl_FragColor = vec4(base + add * (1.0 - clamp(base, 0.0, 1.0)), 1.0);
  }`,
});

/* ---------- post chain ---------- */
const POST = { bloom: [0.3, 0.45, 1.1], tint: [0.0006, 0.0007, 0.0012], vig: 0.6, vigIn: 0.35, grain: 0.035 };
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(tilt);
composer.addPass(makeBloom(...POST.bloom));
composer.addPass(flare);
const grade = makeGrade(POST);
composer.addPass(grade);
composer.addPass(new OutputPass());

/* ---------- camera and size ---------- */
let size = { w: 1, h: 1, dpr: 1 };
// Look offsets from a drag; they ease toward the target.
const look = { yaw: 0, pitch: 0, ty: 0, tp: 0 };
// A dead-level eye on the road; a shifted lens drops the horizon low.
// A long lens flattens the land, as in Beach walker.
const SHOT = {
  wide: { pos: [0.9, 1.15, 0], yaw: -0.06, vfov: 12.5, horizon: 0.64 },
  tall: { pos: [4.0, 1.15, -12], yaw: -0.012, vfov: 22, horizon: 0.58 },
};
const TUBE_W = new THREE.Vector3(), probe = new THREE.Vector3();
let focal = 1;
function frame() {
  const portrait = size.w < size.h, S = portrait ? SHOT.tall : SHOT.wide;
  const w = size.w, h = size.h;
  const hy = h * S.horizon + look.pitch * h;
  focal = h / (2 * Math.tan((S.vfov * Math.PI) / 360));
  const half = Math.max(hy, h - hy);
  camera.fov = (2 * Math.atan(half / focal) * 180) / Math.PI;
  camera.aspect = w / (2 * half);
  camera.setViewOffset(w, 2 * half, 0, half - hy, w, h);
  camera.position.set(...S.pos);
  camera.rotation.set(0, S.yaw + look.yaw, 0, 'YXZ');
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  mothMat.uniforms.uPx.value = focal * size.dpr;
  // The sharp band follows the machine's centre on screen.
  probe.copy(STOP.localToWorld(new THREE.Vector3(0, 1.2, M.front))).project(camera);
  tilt.uniforms.uFocus.value = probe.y * 0.5 + 0.5;
  tilt.uniforms.uBand.value = portrait ? 0.07 : 0.1;
  // The flare sits on the tube.
  TUBE_W.copy(STOP.localToWorld(TUBE_POS.clone())).project(camera);
  flare.uniforms.uSun.value.set(TUBE_W.x * 0.5 + 0.5, TUBE_W.y * 0.5 + 0.5);
  flare.uniforms.uAspect.value = w / h;
}
function resize() {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  size = { w, h, dpr: pixelRatio(w, h, { maxDpr: 1.5, budget: 1.8e6, low: rung >= 1 }) };
  renderer.setPixelRatio(size.dpr);
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  const W = w * size.dpr, H = h * size.dpr;
  grade.uniforms.uRes.value.set(W, H);
  tilt.uniforms.uRes.value.set(W, H);
  stage.style.setProperty('--box', `${Math.max(0, (h - w / 2.39) / 2)}px`);
  frame();
  draw();
}
let visible = !document.hidden;
function draw() {
  if (!visible) return;
  composer.render();
}
whenVisible(stage, vis => { visible = vis; if (vis) draw(); });
new ResizeObserver(() => resize()).observe(stage);
onQuality(() => resize());
onReducedChange(() => draw());

/* ---------- bar ---------- */
// Blockout: the look only. Motion and sound come in later tasks.
act.tilt = v => { tilt.uniforms.uAmt.value = v; draw(); };
act.letterbox = on => { stage.toggleAttribute('data-letterbox', on); };
act.tilt(ui.setting('tilt')?.value ?? 0.6);
act.letterbox(!!ui.setting('letterbox')?.value);

/* ---------- ready ---------- */
// The intro holds until shaders compile and the first frame draws.
resize();
renderer.compileAsync(scene, camera).then(() => {
  draw();
  canvas.classList.add('on');
  markReady();
}, () => { canvas.classList.add('on'); markReady(); });
</script>
</body>
