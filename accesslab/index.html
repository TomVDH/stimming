<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Toy desk</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<link rel="stylesheet" href="../shared/intro.css">
<link rel="stylesheet" href="desk.css">
<!-- The desk: one toy at a time; Icon, Feedback and Intro as tabs. Template: TEMPLATE.md. -->
<main>
  <!-- The rail: a sticky left column from 1440 px; inline below that. -->
  <aside class="rail">
    <div class="top"><h1 id="title">Toy desk</h1><nav class="bar" id="links" aria-label="Pages"></nav></div>
    <div class="bar" id="filter" aria-label="Filter"></div>
    <div class="strip" id="strip" aria-label="Items"></div>
    <div class="bar" id="nav"></div>
    <header class="head" id="head"></header>
    <div class="bar tabs" id="tabs" role="tablist"></div>
  </aside>
  <section class="panel" id="panel"></section>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module">
import { injectSprite } from './glyphs.js';
injectSprite();
await import('./desk.js');
</script>
</html>
