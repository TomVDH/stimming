<style>
/* Iosevka weights from the repo, as the intro loads them. */
@font-face { font-family: "Iosevka Term Slab Nerd Font"; font-weight: 400; font-display: swap; src: url(../shared/fonts/IosevkaTermSlab-Regular.woff2) format("woff2"); }
@font-face { font-family: "Iosevka Term Slab Nerd Font"; font-weight: 500; font-display: swap; src: url(../shared/fonts/IosevkaTermSlab-Medium.woff2) format("woff2"); }
@font-face { font-family: "Iosevka Term Slab Nerd Font"; font-weight: 700; font-display: swap; src: url(../shared/fonts/IosevkaTermSlab-Bold.woff2) format("woff2"); }
@font-face { font-family: "Iosevka Term Slab Nerd Font"; font-weight: 800; font-display: swap; src: url(../shared/fonts/IosevkaTermSlab-ExtraBold.woff2) format("woff2"); }
.trials { display: grid; gap: 34px; }
.pair { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.b612 { font-family: "B612", var(--sans); }
.iosevka { font-family: "Iosevka Term Slab Nerd Font", ui-monospace, monospace; }

/* The menu's title, as index.html sets it. GSAP drives each letter. */
.title {
  margin: 0; display: flex; align-items: baseline; gap: 0.01em;
  font-size: clamp(48px, 9vw, 104px); line-height: 1; letter-spacing: -0.02em;
  cursor: default; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
/* A touched letter flashes its own colour, then fades back to white. */
.title .l { display: inline-block; color: color-mix(in oklch, var(--c) calc(var(--p, 0) * 100%), var(--fg)); font-weight: var(--w); }

/* The toy page header's mark, as shared/stim.css sets it. */
.brand { display: inline-flex; align-items: center; gap: 8px; margin: -6px -8px -6px -4px; padding: 6px 8px 6px 4px; color: var(--fg); text-decoration: none; border-radius: 10px; }
.brand .back { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.333s steps(10, end), stroke 0.2s steps(6, end); }
.brand:hover .back, .brand:focus-visible .back { transform: translateX(-3px); stroke: var(--fg); }
.mark { display: inline-flex; align-items: baseline; gap: 0.01em; font-size: 22px; line-height: 1; letter-spacing: -0.02em; }
.mark span { display: inline-block; color: var(--fg); font-weight: var(--w); transform: translateY(var(--y)) rotate(var(--r)); }
.brand:hover .mark span, .brand:focus-visible .mark span {
  animation: stim-wave 0.9s steps(1, end) both;
  animation-delay: calc(var(--i) * 33.333ms);
}
@keyframes stim-wave {
  0.00% { transform: translateY(calc(var(--y) + -0.0000em)) rotate(calc(var(--r) * 1.0000)); color: color-mix(in oklch, var(--c) 0.0%, var(--fg)); }
  3.70% { transform: translateY(calc(var(--y) + -0.1353em)) rotate(calc(var(--r) * -0.1597)); color: color-mix(in oklch, var(--c) 48.3%, var(--fg)); }
  7.41% { transform: translateY(calc(var(--y) + -0.2268em)) rotate(calc(var(--r) * -0.9439)); color: color-mix(in oklch, var(--c) 81.0%, var(--fg)); }
  11.11% { transform: translateY(calc(var(--y) + -0.2804em)) rotate(calc(var(--r) * -1.4033)); color: color-mix(in oklch, var(--c) 100.0%, var(--fg)); }
  14.81% { transform: translateY(calc(var(--y) + -0.3039em)) rotate(calc(var(--r) * -1.6051)); color: color-mix(in oklch, var(--c) 100.0%, var(--fg)); }
  18.52% { transform: translateY(calc(var(--y) + -0.3065em)) rotate(calc(var(--r) * -1.6271)); color: color-mix(in oklch, var(--c) 100.0%, var(--fg)); }
  22.22% { transform: translateY(calc(var(--y) + -0.2976em)) rotate(calc(var(--r) * -1.5507)); color: color-mix(in oklch, var(--c) 100.0%, var(--fg)); }
  25.93% { transform: translateY(calc(var(--y) + -0.2862em)) rotate(calc(var(--r) * -1.4528)); color: color-mix(in oklch, var(--c) 100.0%, var(--fg)); }
  29.63% { transform: translateY(calc(var(--y) + -0.2801em)) rotate(calc(var(--r) * -1.4005)); color: color-mix(in oklch, var(--c) 100.0%, var(--fg)); }
  33.33% { transform: translateY(calc(var(--y) + -0.1385em)) rotate(calc(var(--r) * -0.3387)); color: color-mix(in oklch, var(--c) 100.0%, var(--fg)); }
  37.04% { transform: translateY(calc(var(--y) + -0.0292em)) rotate(calc(var(--r) * 0.4811)); color: color-mix(in oklch, var(--c) 100.0%, var(--fg)); }
  40.74% { transform: translateY(calc(var(--y) + 0.0360em)) rotate(calc(var(--r) * 0.9702)); color: color-mix(in oklch, var(--c) 100.0%, var(--fg)); }
  44.44% { transform: translateY(calc(var(--y) + 0.0659em)) rotate(calc(var(--r) * 1.1943)); color: color-mix(in oklch, var(--c) 100.0%, var(--fg)); }
  48.15% { transform: translateY(calc(var(--y) + 0.0708em)) rotate(calc(var(--r) * 1.2306)); color: color-mix(in oklch, var(--c) 100.0%, var(--fg)); }
  51.85% { transform: translateY(calc(var(--y) + 0.0614em)) rotate(calc(var(--r) * 1.1605)); color: color-mix(in oklch, var(--c) 100.0%, var(--fg)); }
  55.56% { transform: translateY(calc(var(--y) + 0.0482em)) rotate(calc(var(--r) * 1.0615)); color: color-mix(in oklch, var(--c) 100.0%, var(--fg)); }
  59.26% { transform: translateY(calc(var(--y) + 0.0403em)) rotate(calc(var(--r) * 1.0020)); color: color-mix(in oklch, var(--c) 100.0%, var(--fg)); }
  62.96% { transform: translateY(calc(var(--y) + 0.0276em)) rotate(calc(var(--r) * 1.0000)); color: color-mix(in oklch, var(--c) 69.0%, var(--fg)); }
  66.67% { transform: translateY(calc(var(--y) + 0.0154em)) rotate(calc(var(--r) * 1.0000)); color: color-mix(in oklch, var(--c) 38.6%, var(--fg)); }
  70.37% { transform: translateY(calc(var(--y) + 0.0066em)) rotate(calc(var(--r) * 1.0000)); color: color-mix(in oklch, var(--c) 16.5%, var(--fg)); }
  74.07% { transform: translateY(calc(var(--y) + 0.0008em)) rotate(calc(var(--r) * 1.0000)); color: color-mix(in oklch, var(--c) 2.0%, var(--fg)); }
  77.78% { transform: translateY(calc(var(--y) + -0.0025em)) rotate(calc(var(--r) * 1.0000)); color: color-mix(in oklch, var(--c) 0.0%, var(--fg)); }
  81.48% { transform: translateY(calc(var(--y) + -0.0038em)) rotate(calc(var(--r) * 1.0000)); color: color-mix(in oklch, var(--c) 0.0%, var(--fg)); }
  85.19% { transform: translateY(calc(var(--y) + -0.0037em)) rotate(calc(var(--r) * 1.0000)); color: color-mix(in oklch, var(--c) 0.0%, var(--fg)); }
  88.89% { transform: translateY(calc(var(--y) + -0.0028em)) rotate(calc(var(--r) * 1.0000)); color: color-mix(in oklch, var(--c) 0.0%, var(--fg)); }
  92.59% { transform: translateY(calc(var(--y) + -0.0015em)) rotate(calc(var(--r) * 1.0000)); color: color-mix(in oklch, var(--c) 0.0%, var(--fg)); }
  96.30% { transform: translateY(calc(var(--y) + -0.0004em)) rotate(calc(var(--r) * 1.0000)); color: color-mix(in oklch, var(--c) 0.0%, var(--fg)); }
  100.00% { transform: translateY(calc(var(--y) + 0.0000em)) rotate(calc(var(--r) * 1.0000)); color: color-mix(in oklch, var(--c) 0.0%, var(--fg)); }
}

@media (prefers-reduced-motion: reduce) { .brand .back { transition: none; } .brand:hover .mark span, .brand:focus-visible .mark span { animation: none; } }
</style>
<main>
  <div class="top"><h1>Type trials</h1><nav class="bar" aria-label="Pages"><a class="w" href="./">Toy desk</a><span class="sl">/</span><a class="w" href="access.html">Access kit</a></nav></div>
  <div class="trials" id="trials"></div>
</main>
<script type="module">
import { gsap } from 'gsap';
// The wordmark's letters, as shared/stim.js MARK holds them: letter, colour, weight, tilt, lift.
const MARK = [
  ['S', '0.72 0.22 328', 800, -8, 0.02], ['t', '0.68 0.2 300', 500, 6, -0.04], ['i', '0.74 0.16 250', 900, -3, 0.03],
  ['m', '0.82 0.13 205', 600, 4, -0.02], ['m', '0.84 0.16 150', 700, -5, 0.04], ['i', '0.88 0.16 110', 400, 7, -0.05],
  ['n', '0.86 0.16 84', 800, -4, 0.01], ['g', '0.74 0.2 28', 600, 3, -0.03],
];
const title = face => `<h2 class="title ${face}" aria-label="Stimming">${MARK.map(([ch, c, w]) => `<span class="l" style="--c: oklch(${c}); --w: ${w}">${ch}</span>`).join('')}</h2>`;
const BACK = '<svg class="back" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>';
const brand = face => `<a class="brand" href="#" aria-label="Back to Stimming">${BACK}<span class="mark ${face}" aria-hidden="true">${MARK.map(([ch, c, w, r, y], i) => `<span style="--i: ${i}; --c: oklch(${c}); --w: ${w}; --r: ${r}deg; --y: ${y}em">${ch}</span>`).join('')}</span></a>`;
document.getElementById('trials').innerHTML = [
  ['Menu title · B612, today · touch a letter, click a gap', title('b612')],
  ['Menu title · Iosevka Term Slab', title('iosevka')],
  ['Toy page header · B612, today · hover', brand('b612')],
  ['Toy page header · Iosevka Term Slab', brand('iosevka')],
].map(([l, m]) => `<section class="pair"><p class="hd">${l}</p>${m}</section>`).join('');
document.querySelectorAll('.brand').forEach(a => a.addEventListener('click', e => e.preventDefault()));

// The menu title's motion, word for word from index.html, once per title.
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
for (const host of document.querySelectorAll('.title')) {
  // Each title letter rests askew and has its own fidget.
  const letters = [...host.querySelectorAll('.l')];
  const REST = [[-8, 2], [6, -4], [-3, 3], [4, -2], [-5, 4], [7, -5], [-4, 1], [3, -3]];
  const weights = letters.map(l => +l.style.getPropertyValue('--w'));
  letters.forEach((l, i) => gsap.set(l, { rotation: REST[i][0], y: REST[i][1], transformOrigin: '50% 70%', '--p': 0 }));
  const hop = (l, [r, y], h) => gsap.timeline()
    .to(l, { y: y - h, duration: 0.22, ease: 'power2.out' })
    .to(l, { y, duration: 0.75, ease: 'bounce.out' });
  const moves = [
    // S spins once.
    l => gsap.timeline().to(l, { rotation: '+=360', duration: 0.9, ease: 'power3.out' }),
    // t wobbles on its foot.
    (l, [r]) => gsap.timeline()
      .to(l, { rotation: r + 18, duration: 0.12, ease: 'power2.out' })
      .to(l, { rotation: r, duration: 1.1, ease: 'elastic.out(1.2, 0.25)' }),
    (l, rest) => hop(l, rest, 22),
    // The first m squashes flat.
    l => gsap.timeline()
      .to(l, { scaleY: 0.55, scaleX: 1.3, transformOrigin: '50% 100%', duration: 0.14, ease: 'power2.out' })
      .to(l, { scaleY: 1, scaleX: 1, duration: 0.9, ease: 'elastic.out(1, 0.3)' }),
    // The second m swings from its top.
    (l, [r]) => gsap.timeline()
      .to(l, { rotation: r + 28, transformOrigin: '50% 0%', duration: 0.18, ease: 'power2.out' })
      .to(l, { rotation: r, duration: 1.4, ease: 'elastic.out(1, 0.2)' }),
    (l, rest) => hop(l, rest, 30),
    // n turns over in depth.
    l => gsap.timeline().to(l, { rotationY: '+=360', transformPerspective: 400, duration: 0.8, ease: 'power2.inOut' }),
    // g bounces and leans back.
    (l, [r, y]) => gsap.timeline()
      .to(l, { y: y - 14, rotation: r - 12, duration: 0.2, ease: 'power2.out' })
      .to(l, { y, rotation: r, duration: 0.8, ease: 'elastic.out(1, 0.35)' }),
  ];
  const busy = [];
  function fidget(i) {
    if (reduce || busy[i]?.isActive()) return;
    const l = letters[i], w = weights[i];
    // Heavy letters deflate; light letters puff up.
    busy[i] = moves[i](l, REST[i])
      .to(l, { '--w': w >= 800 ? 400 : 900, duration: 0.15, ease: 'power2.out' }, 0)
      .to(l, { '--w': w, duration: 0.6, ease: 'power2.inOut' }, 0.15)
      .to(l, { '--p': 1, duration: 0.12, ease: 'power2.out' }, 0)
      .to(l, { '--p': 0, duration: 1, ease: 'power2.in' }, 0.3);
  }
  letters.forEach((l, i) => {
    l.addEventListener('pointerenter', () => fidget(i));
    l.addEventListener('pointerdown', () => fidget(i));
  });
  // A click on the gaps sends a wave through the word.
  host.addEventListener('click', e => {
    if (e.target.classList.contains('l')) return;
    letters.forEach((l, i) => gsap.delayedCall(i * 0.06, () => fidget(i)));
  });
  if (!reduce) {
    // The letters drop in once the fonts are in, as on the menu.
    document.fonts.ready.then(() => gsap.from(letters, { y: -48, opacity: 0, duration: 1, ease: 'elastic.out(1, 0.5)', stagger: 0.05 }));
    // Now and then one letter fidgets by itself.
    const idle = () => {
      if (!document.hidden) fidget(Math.floor(Math.random() * letters.length));
      setTimeout(idle, 6000 + Math.random() * 6000);
    };
    setTimeout(idle, 4000);
  }
}
</script>
</html>
