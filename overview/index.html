<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Stimming overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
@font-face { font-family: "Iosevka Term Slab"; font-weight: 500; font-display: swap; src: url(../shared/fonts/IosevkaTermSlab-Medium.woff2) format("woff2"); }

:root {
  --bg: oklch(0.155 0.014 285);
  --panel: oklch(0.19 0.016 285);
  --panel-2: oklch(0.215 0.018 285);
  --line: oklch(0.27 0.018 285);
  --ink: oklch(0.94 0.008 285);
  --muted: oklch(0.67 0.02 285);
  --faint: oklch(0.48 0.02 285);
  --done: oklch(0.82 0.15 155);
  --beta: oklch(0.83 0.14 80);
  --alpha: oklch(0.76 0.14 300);
  --v2: oklch(0.8 0.12 230);
  --tom: oklch(0.8 0.15 40);
  --mono: "Iosevka Term Slab", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 Gabarito, system-ui, sans-serif; padding: 40px 16px 80px; }
.wrap { max-width: 1240px; margin: 0 auto; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 34px; line-height: 1.1; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--muted); font-weight: 500; }
.asof, .label, .id, th { font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; }
.asof { color: var(--faint); }

.counts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; margin: 28px 0 48px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.count { background: var(--panel); padding: 14px 16px 12px; }
.count b { display: block; font-size: 30px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
.count b small { font-size: 15px; color: var(--muted); font-weight: 500; }
.count .label { color: var(--muted); display: block; margin-top: 8px; }

h2 { font-size: 21px; font-weight: 800; margin: 0; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; cursor: pointer; }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }
.chip i { font-style: normal; opacity: 0.6; margin-left: 4px; }

table { width: 100%; border-collapse: collapse; }
th { color: var(--faint); font-weight: 500; text-align: left; padding: 0 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid color-mix(in oklch, var(--line) 60%, transparent); vertical-align: middle; }
tbody tr:hover td { background: var(--panel); }
tr.shelf-row td { padding: 22px 10px 8px; border-bottom: 1px solid var(--line); background: none !important; }
tr.shelf-row .label { color: var(--muted); }
.num { font-family: var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; width: 40px; }
.toy { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sw { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--faint); }
.toy .nm { font-weight: 600; }
.toy .nl { color: var(--muted); }
.pill { display: inline-block; font: 500 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 7px; border-radius: 5px; white-space: nowrap; }
.pill.done { color: var(--done); background: color-mix(in oklch, var(--done) 14%, transparent); }
.pill.beta { color: var(--beta); background: color-mix(in oklch, var(--beta) 14%, transparent); }
.pill.alpha { color: var(--alpha); background: color-mix(in oklch, var(--alpha) 14%, transparent); }
.pill.lab { color: var(--muted); background: var(--panel-2); }
.pill.main { color: var(--ink); background: var(--panel-2); }
.pill.off { color: var(--tom); background: color-mix(in oklch, var(--tom) 12%, transparent); }
.dash { color: var(--faint); }
.ser { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--muted); }
.ser::before { content: ""; width: 7px; height: 7px; transform: rotate(45deg); background: var(--c); }
.bar { font: 500 11px/1 var(--mono); letter-spacing: 0.06em; }
.bar.v2 { color: var(--v2); }
.bar.v1 { color: var(--faint); }
.cls { color: var(--muted); font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; }
.status { color: var(--muted); }
.status .id { color: var(--faint); margin-left: 6px; letter-spacing: 0.04em; text-transform: none; }

.ideas { margin-top: 56px; }
.grid { columns: 3 340px; column-gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 8px; break-inside: avoid; margin-bottom: 14px; }
.card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.card h3 .label { color: var(--faint); font-weight: 500; }
.card.tom { border-color: color-mix(in oklch, var(--tom) 45%, var(--line)); }
.card.tom h3 { color: var(--tom); }
.card.wide { margin-top: 0; }
ul.rows { list-style: none; margin: 0; padding: 0; }
ul.rows li { display: grid; grid-template-columns: 9.5em 1fr auto; gap: 0 10px; align-items: baseline; padding: 5px 0; border-top: 1px solid color-mix(in oklch, var(--line) 55%, transparent); font-size: 13.5px; }
ul.rows li:first-child { border-top: 0; }
ul.rows .t { font-weight: 600; }
ul.rows .d { color: var(--muted); overflow-wrap: anywhere; }
ul.rows .id { color: var(--faint); letter-spacing: 0.02em; text-transform: none; font-size: 10.5px; white-space: nowrap; }
.prog { display: flex; align-items: center; gap: 8px; align-self: center; }
.prog .track { flex: 1; height: 4px; border-radius: 2px; background: var(--panel-2); overflow: hidden; }
.prog .fill { display: block; height: 100%; background: var(--v2); }
.prog .n { font: 500 10.5px/1 var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px 24px; }
.pool h4 { margin: 0 0 6px; font: 500 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.pool h4 i { font-style: normal; color: var(--faint); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tags span { font-size: 13px; color: var(--muted); background: var(--panel-2); border-radius: 5px; padding: 3px 7px; }
.err { color: var(--tom); }

@media (max-width: 760px) {
  body { padding-top: 28px; }
  .counts { grid-template-columns: repeat(3, 1fr); }
  .count { padding: 10px 12px; }
  .count b { font-size: 22px; }
  .count .label { font-size: 10px; letter-spacing: 0.06em; }
  h1 { font-size: 28px; }
  thead { display: none; }
  table, tbody { display: block; }
  tbody tr:not(.shelf-row) { display: grid; grid-template-columns: 26px auto auto 1fr auto; gap: 5px 12px; padding: 10px 0; border-bottom: 1px solid color-mix(in oklch, var(--line) 60%, transparent); }
  tbody tr.shelf-row { display: block; }
  tbody tr.shelf-row td { display: block; padding-left: 0; }
  tbody tr:not(.shelf-row) td { padding: 0; border: 0; background: none !important; }
  td.num { grid-row: 1; grid-column: 1; width: auto; }
  td.c-toy { grid-row: 1; grid-column: 2 / 5; min-width: 0; }
  td.c-stage { grid-row: 1; grid-column: 5; text-align: right; }
  td.c-ser { grid-row: 2; grid-column: 2; }
  td.c-bar { grid-row: 2; grid-column: 3; }
  td.c-cls { grid-row: 2; grid-column: 4; }
  td.c-status { grid-row: 3; grid-column: 2 / -1; font-size: 13.5px; }
  .toy { flex-wrap: wrap; row-gap: 0; }
  ul.rows li { grid-template-columns: 1fr auto; row-gap: 2px; }
  ul.rows .t { grid-column: 1 !important; grid-row: 1; }
  ul.rows .id { grid-column: 2; grid-row: 1; }
  ul.rows .d, .prog { grid-column: 1 / -1; grid-row: 2; }
}
</style>
</head>

  'Lab experiments': ['Kelvin dropper', 'Ripple tank', 'BZ reaction', 'Hot ice', 'Leidenfrost drops', "Jacob's ladder", 'Lotus leaf', 'Bell jar', 'Stress fringes', 'Radiometer', 'Cartesian diver', 'Stir vortex', 'Candle jar', 'Elephant foam'],
  'Data and maths': ['Galton board', 'Sorting sounds', 'Epicycles', 'Rule 30 loom', 'Voronoi mosaic', 'Desire paths', 'Terminator', 'Pi walk', 'Contour map', 'Seismograph', 'Buffon needles', 'Daylight ribbon', 'Butterfly seed', 'Birthday room', 'Benford wells', 'Traffic wave', 'Earth breathes'],
  'Cinematic dioramas': ['Desert eclipse', 'Fjord aurora', 'Deep vent', 'Tide pool', 'Wheat storm', 'Calving', 'Observatory', 'Lantern lake', 'Lighthouse storm', 'Haboob', 'Avalanche ridge', 'Rice terraces', 'Lava coast', 'Fog horn', 'Spillway'],
  'Fidget': ['Peel', 'Calm jar', 'Rain stick', 'Pea pod', 'Worry stone', 'Geoboard', 'Abacus', 'Detent dial', 'Velcro', 'Ice tray', 'Bead board', 'Chalk and sponge', 'Spark wheel', 'Worry beads', 'Toggle wall', 'Doorstop twang'],
  'Physics loops': ['Water wheel', 'Chain fountain', 'Hourglass', 'Coin ledge', 'Block tower', 'Jelly stack', "Newton's cradle", 'Drinking bird', 'Rattleback', 'Wrecking ball', 'Bottle flip', 'Silk drop', 'Plate spinning', 'Clackers', 'Tablecloth yank', 'Coin funnel', 'Tetherball'],
  'Quiet and rich': ['Incense smoke', 'Slime mould', 'Chromatography', 'Dichroic glass', 'Glowing tide', 'Leaf shadows', 'Jellyfish tank', 'Breath mirror', 'Opal turn', 'Moire veils', 'Night bloom', 'Beetle shell'],
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const idTag = id => id ? `<span class="id">${esc(id)}</span>` : '';

// The menu holds the shelves; data-done marks Tom's sign-off.
function readMenu(html) {
  const lab = html.indexOf('<section class="lab"');
  const out = new Map();
  const re = /<li([^>]*)>\s*<a class="toy[^"]*" id="([^"]+)"/g;
  for (let m; (m = re.exec(html));) {
    out.set(m[2], { shelf: lab >= 0 && m.index > lab ? 'lab' : 'main', done: /data-done/.test(m[1]) });
  }
  return out;
}

async function load() {
  const get = (u, t) => fetch(u, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(u); return t ? r.text() : r.json(); });
  const [toys, series, menu] = await Promise.all([get('../toys.json'), get('../series.json'), get('../index.html', true)]);
  return { toys, series, menu: readMenu(menu) };
}

function rows({ toys, series, menu }) {
  const all = { ...toys, ...EXTRA };
  const list = Object.entries(all).map(([id, t]) => {
    const m = menu.get(id);
    const [v2, bean, status] = TOY[id] ?? [null, null, ''];
    return { id, ...t, shelf: m ? m.shelf : 'off', done: !!m?.done, v2, bean, status };
  });
  const order = { main: 0, lab: 1, off: 2 };
  list.sort((a, b) => order[a.shelf] - order[b.shelf] || (a.number ?? 999) - (b.number ?? 999) || a.name.localeCompare(b.name));
  return list;
}

function stagePill(t) {
  if (t.done) return '<span class="pill done">Signed off</span>';
  if (t.stage) return `<span class="pill ${esc(t.stage)}">${esc(t.stage)}</span>`;
  return '<span class="dash">·</span>';
}

const SHELF = { main: ['Main shelf', 'main'], lab: ['Lab', 'lab'], off: ['Off menu', 'off'] };

function renderToys(list, series, filter) {
  let html = '', last = null;
  for (const t of list) {
    if (filter !== 'all' && t.shelf !== filter) continue;
    if (t.shelf !== last) {
      const n = list.filter(x => x.shelf === t.shelf).length;
      html += `<tr class="shelf-row"><td colspan="7"><span class="label">${SHELF[t.shelf][0]} · ${n}</span></td></tr>`;
      last = t.shelf;
    }
    const s = t.series && series[t.series];
    const sw = t.accent ? `style="background:${esc(t.accent)}"` : '';
    html += `<tr>
      <td class="num">${t.number ?? ''}</td>
      <td class="c-toy"><a class="toy" href="../${esc(t.id)}/"><span class="sw" ${sw}></span><span class="nm">${esc(t.name)}</span>${t.nl && t.nl !== t.name ? `<span class="nl">${esc(t.nl)}</span>` : ''}</a></td>
      <td class="c-stage">${stagePill(t)}</td>
      <td class="c-ser">${s ? `<span class="ser" style="--c:${esc(s.color)}">${esc(s.name)}</span>` : ''}</td>
      <td class="c-bar"><span class="bar ${t.v2 ? 'v2' : 'v1'}">${t.v2 == null ? '' : t.v2 ? 'v2' : 'v1'}</span></td>
      <td class="c-cls">${t.legacy ? '<span class="cls">Classic</span>' : ''}</td>
      <td class="c-status"><span class="status">${esc(t.status)}</span></td>
    </tr>`;
  }
  $('#toys').innerHTML = html;
}

function card(title, items, opts = {}) {
  const lis = items.map(opts.row).join('');
  return `<div class="card ${opts.cls ?? ''}"><h3>${esc(title)}<span class="label">${items.length}</span></h3><ul class="rows">${lis}</ul></div>`;
}

const rowTD = ([t, d, id]) => `<li><span class="t">${esc(t)}</span><span class="d">${esc(d)}</span>${idTag(id)}</li>`;
const rowPlan = ([t, d, f]) => `<li><span class="t">${esc(t)}</span><span class="d">${esc(d)}</span><span class="id">${esc(f.replace('docs/plans/', ''))}</span></li>`;
const rowBean = ([t, id, a, b, next]) => `<li title="Next: ${esc(next)}"><span class="t">${esc(t)}</span><span class="prog"><span class="track"><span class="fill" style="width:${Math.round(a / b * 100)}%"></span></span><span class="n">${a}/${b}</span></span>${idTag(id)}</li>`;
const rowWG = ([t, id]) => `<li><span class="t" style="grid-column: 1 / 3">${esc(t)}</span>${idTag(id)}</li>`;
const rowOI = ([t, d]) => `<li><span class="t">${esc(t)}</span><span class="d">${esc(d)}</span><span class="id"></span></li>`;

function renderIdeas(list) {
  const v1 = list.filter(t => t.v2 === 0).map(t => t.name);
  const site = SITE.map(r => r[2] === 'stimming-80dc' ? [r[0], `${v1.length} toys left: ${v1.join(', ')}`, r[2]] : r);
  const poolN = Object.values(POOL).flat().length;
  $('#ideas').innerHTML = [
    card('Waiting on Tom', WAITING, { row: rowTD, cls: 'tom' }),
    card('Diegetic proposals waiting', DIEGETIC, { row: rowTD, cls: 'tom' }),
    card('Open toy beans', BEANS, { row: rowBean }),
    card('Site and shell', site, { row: rowTD }),
    card('Planned, not built', PLANNED, { row: rowPlan }),
    card('WebGPU', WEBGPU, { row: rowWG }),
    card('Open items', OPEN_ITEMS, { row: rowOI }),
  ].join('');
  $('#pool').innerHTML = `<div class="card wide"><h3>Idea pool<span class="label">${poolN} · docs/toy-ideas.md</span></h3><div class="pool">${
    Object.entries(POOL).map(([k, v]) => `<div><h4>${esc(k)} <i>${v.length}</i></h4><div class="tags">${v.map(n => `<span>${esc(n)}</span>`).join('')}</div></div>`).join('')
  }</div></div>`;
  return { poolN };
}

function renderCounts(list, poolN) {
  const n = s => list.filter(t => t.shelf === s).length;
  const tiles = [
    [list.length, 'Toys built'],
    [n('main'), 'Main shelf'],
    [n('lab'), 'Lab'],
    [n('off'), 'Off menu'],
    [list.filter(t => t.done).length, 'Signed off'],
    [`${list.filter(t => t.v2).length}<small>/${list.length}</small>`, 'On Bar v2'],
    [list.filter(t => t.legacy).length, 'Classic builds'],
    [WAITING.length + DIEGETIC.length, 'Waiting on Tom'],
    [BEANS.length, 'Open toy beans'],
    [PLANNED.length + poolN, 'Ideas not built'],
  ];
  $('#counts').innerHTML = tiles.map(([v, l]) => `<div class="count"><b>${v}</b><span class="label">${l}</span></div>`).join('');
}

function renderFilters(list, series) {
  const opts = [['all', 'All', list.length], ['main', 'Main', 0], ['lab', 'Lab', 0], ['off', 'Off menu', 0]]
    .map(o => (o[0] === 'all' ? o : [o[0], o[1], list.filter(t => t.shelf === o[0]).length]));
  const box = $('#filters');
  box.innerHTML = opts.map(([k, l, c]) => `<button class="chip" data-f="${k}" aria-pressed="${k === 'all'}">${l}<i>${c}</i></button>`).join('');
  box.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    renderToys(list, series, b.dataset.f);
  });
}

try {
  const data = await load();
  const list = rows(data);
  renderFilters(list, data.series);
  renderToys(list, data.series, 'all');
  const { poolN } = renderIdeas(list);
  renderCounts(list, poolN);
} catch (err) {
  $('#toys').innerHTML = `<tr><td class="err">Could not read the site files: ${esc(err.message)}</td></tr>`;
}
</script>
</body>
</html>
