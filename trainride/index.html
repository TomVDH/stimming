<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.1 0.01 260); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Train Ride</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Train Ride: a night valley through one carriage window. */
:root { --stage: oklch(0.1 0.01 260); }
.stage--trainride { cursor: grab; touch-action: none; }
.stage--trainride.dragging { cursor: grabbing; }
.stage--trainride canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--trainride canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--trainride canvas { transition: none; } }
/* Settings opens a column of tweaks at the right edge. */
.adder { position: relative; }
.add {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px;
  background: oklch(0.19 0.012 260 / 0.94); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}
.adder.is-open .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .adder:hover .add { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
.sets .group { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--muted); }
.sets .group .choices { gap: 4px; flex-wrap: nowrap; }
.sets .group .chip { padding: 4px 9px; }
#setBtn svg { stroke-linecap: round; }
/* Settings and the (i) sit together at the right edge. */
.edge { display: flex; align-items: center; gap: 8px; margin-left: auto; }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Train Ride</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--trainride" id="stage" tabindex="0" role="application" aria-label="A night valley seen through a carriage window on a high viaduct. Rain runs back along the glass as the train goes. Drag to look along the valley.">
      <p class="fail" hidden>Train Ride needs WebGL2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" id="mode" role="group" aria-label="Weather">
        <button class="chip" type="button" data-value="clear" aria-pressed="false">Clear</button>
        <button class="chip" type="button" data-value="rain" aria-pressed="true">Rain</button>
        <button class="chip" type="button" data-value="fogged" aria-pressed="false">Fogged</button>
      </div>
      <label class="slider"><span>Speed</span><input type="range" id="speed" min="0" max="1" step="0.01" value="0.6" aria-label="Speed: standing to fast"></label>
      <div class="edge">
        <div class="adder" id="setter">
          <button class="chip icon" id="setBtn" type="button" aria-expanded="false" aria-controls="sets" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
          <div class="add sets" id="sets" role="group" aria-label="Settings"></div>
        </div>
        <dl class="how" aria-label="How to play">
          <div><dt>Drag</dt><dd>look along the valley</dd></div>
          <div class="fine"><dt><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></dt><dd>weather</dd></div>
        </dl>
      </div>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Train Ride</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { initPage, choices, whenVisible, reduced, onReducedChange, quality, pixelRatio, qualitySetting, onQuality, audioKit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });
initPage({ id: 'trainride' });

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.trainride.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.trainride.${k}`, String(v)); } catch { /* storage is optional */ } };
const opts = {
  mode: saved('mode') || 'rain',
  speed: saved('speed') != null ? +saved('speed') : 0.6,
};
// The Speed slider maps to cruise speed in metres per second.
const cruise = v => v * 45;

/* ---------- scene ---------- */
// Train Ride: a night valley seen through one carriage window on a high viaduct.
// The outside renders to a target; one glass shader frames, fogs and wets it.
function build({ THREE }) {
let seed = 4242;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const range = (a, b) => a + (b - a) * rnd();

/* ---------- outside: the valley ---------- */
const out = new THREE.Scene();
const outCam = new THREE.PerspectiveCamera(50, 1, 0.5, 30000);
const outRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const NG = 16, NL = 6, TILE = 9000, LAMP_GAP = 28;

const NOISE = /* glsl */`
float hash1(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
vec2 hash2(vec2 p) { return vec2(hash1(p), hash1(p + 17.17)); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash1(i), hash1(i + vec2(1, 0)), u.x), mix(hash1(i + vec2(0, 1)), hash1(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }`;

// The river winds along the valley floor; the land rises on both sides.
const LAND = /* glsl */`
float riverZ(float x) { return -560.0 + 130.0 * sin(x / 760.0) + 60.0 * sin(x / 270.0 + 1.3); }
float land(vec2 xz) {
  float u = xz.y - riverZ(xz.x);
  float h = -128.0;
  // Near side: a steep slope up to just under the viaduct.
  h += 112.0 * smoothstep(30.0, 470.0, u);
  // Far side: terraces of hills, then a high ridge.
  float far = smoothstep(-40.0, -1100.0, u);
  h += (150.0 + 120.0 * fbm(xz * 0.0011)) * pow(far, 1.3);
  h += 420.0 * smoothstep(-1700.0, -3900.0, u) * (0.6 + 0.7 * fbm(vec2(xz.x * 0.0007, 3.0)));
  h += (fbm(xz * 0.006) - 0.5) * 40.0 * smoothstep(20.0, 160.0, abs(u));
  // The river bed is flat and a little below the banks.
  h = mix(h, -131.0, smoothstep(34.0, 16.0, abs(u)));
  return h;
}`;

const OUTU = {
  uTime: { value: 0 },
  uMoon: { value: new THREE.Vector3(0.3, 0.14, -0.94).normalize() },
  uGP: { value: Array.from({ length: NG }, () => new THREE.Vector4()) },
  uGC: { value: Array.from({ length: NG }, () => new THREE.Vector4()) },
  uLP: { value: Array.from({ length: NL }, () => new THREE.Vector4()) },
  uCamX: { value: 0 },
  uScale: { value: 1 },
  uSmear: { value: 0 },
  uRain: { value: 1 },
  uSpeed: { value: 0 },
  uView: { value: new THREE.Vector2(1, 1) },
};

// Height haze, thicker low in the valley, warm near the towns.
const HAZE = /* glsl */`
uniform vec3 uMoon;
vec3 skyCol(vec3 d) {
  float up = max(d.y, 0.0);
  vec3 c = vec3(0.004, 0.006, 0.013) + vec3(0.02, 0.03, 0.05) * exp(-up * 9.0);
  float m = max(dot(d, uMoon), 0.0);
  c += vec3(0.25, 0.3, 0.38) * (pow(m, 200.0) * 0.4 + pow(m, 10.0) * 0.05);
  // A far town warms the sky low on the left.
  c += vec3(0.5, 0.22, 0.07) * 0.05 * exp(-up * 22.0) * pow(max(dot(normalize(d.xz), normalize(vec2(-0.7, -1.0))), 0.0), 6.0);
  return c;
}
float hazeAmt(vec3 P) {
  vec3 v = P - cameraPosition;
  float dist = length(v);
  float k = 1.0 / 90.0, h0 = cameraPosition.y + 140.0, h1 = max(P.y + 140.0, 0.0), dh = h1 - h0;
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);
  // A thin mist lies on the valley floor, under the town lights.
  float mist = smoothstep(-70.0, -125.0, P.y) * smoothstep(100.0, 500.0, dist) * 0.1;
  return clamp(1.0 - exp(-dist * 0.0004 * avg - dist * 0.00001) + mist, 0.0, 1.0);
}
uniform vec4 uGP[${NG}];
uniform vec4 uGC[${NG}];
// Haze takes the sky colour, warmed over each town.
vec3 hazeCol(vec3 d, vec3 P) {
  vec3 c = skyCol(normalize(vec3(d.x, max(d.y, 0.0) * 0.4 + 0.02, d.z))) * 0.7;
  for (int i = 0; i < ${NG}; i++) c += uGC[i].rgb * uGP[i].w * 0.3 * exp(-length(P.xz - uGP[i].xz) / 110.0);
  return c;
}`;

/* Sky dome with moonlit cloud. */
{
  const m = new THREE.Mesh(new THREE.SphereGeometry(20000, 48, 24), new THREE.ShaderMaterial({
    uniforms: OUTU, side: THREE.BackSide, depthWrite: false,
    vertexShader: /* glsl */`varying vec3 vP; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: /* glsl */`
    varying vec3 vP;
    uniform float uTime;
    ${NOISE}
    ${HAZE}
    void main() {
      vec3 d = normalize(vP - cameraPosition);
      vec3 c = skyCol(d);
      // The moon: a soft disc behind thin cloud.
      float m = dot(d, uMoon);
      c += vec3(0.9, 0.92, 1.0) * smoothstep(0.99982, 0.9999, m) * 1.1;
      if (d.y > 0.0) {
        vec2 p = d.xz / (d.y + 0.08) * 3.0 + vec2(uTime * 0.01, 0.0);
        float cl = smoothstep(0.42, 0.8, fbm(p * 0.6 + fbm(p * 1.3) * 0.8));
        float lit = pow(max(m, 0.0), 7.0);
        vec3 cc = vec3(0.01, 0.013, 0.022) + vec3(0.6, 0.64, 0.75) * lit * (0.5 + 0.8 * (1.0 - cl));
        c = mix(c, cc, cl * 0.92 * smoothstep(0.0, 0.08, d.y));
      }
      gl_FragColor = vec4(c, 1.0);
    }`,
  }));
  m.renderOrder = -1;
  m.frustumCulled = false;
  out.add(m);
}

/* Terrain: a grid that follows the camera in steps, so the land never swims. */
const terrain = new THREE.Mesh(new THREE.PlaneGeometry(12000, 7000, 360, 260).rotateX(-Math.PI / 2).translate(0, 0, -3300), new THREE.ShaderMaterial({
  uniforms: OUTU,
  vertexShader: /* glsl */`
  varying vec3 vP;
  ${NOISE}
  ${LAND}
  void main() {
    vec4 w = modelMatrix * vec4(position, 1.0);
    w.y = land(w.xz);
    vP = w.xyz;
    gl_Position = projectionMatrix * viewMatrix * w;
  }`,
  fragmentShader: /* glsl */`
  varying vec3 vP;
  uniform float uTime;
  ${NOISE}
  ${LAND}
  ${HAZE}
  void main() {
    float e = 2.0;
    vec3 N = normalize(vec3(land(vP.xz - vec2(e, 0.0)) - land(vP.xz + vec2(e, 0.0)), 2.0 * e, land(vP.xz - vec2(0.0, e)) - land(vP.xz + vec2(0.0, e))));
    vec3 V = normalize(cameraPosition - vP);
    float dist = length(cameraPosition - vP);
    float u = vP.z - riverZ(vP.x);
    // Forest darkens the slopes; fields stay a little paler.
    float forest = smoothstep(0.45, 0.6, fbm(vP.xz * 0.004));
    vec3 alb = mix(vec3(0.07, 0.075, 0.07), vec3(0.025, 0.035, 0.03), forest);
    vec3 c = alb * (vec3(0.3, 0.34, 0.42) * max(dot(N, uMoon), 0.0) * 0.7 + vec3(0.01, 0.013, 0.02));
    // Town glow pools: each bright source lights the ground round it.
    vec3 pool = vec3(0.0);
    for (int i = 0; i < ${NG}; i++) {
      vec3 L = uGP[i].xyz - vP;
      float d = length(L);
      pool += uGC[i].rgb * uGP[i].w * 500.0 / (d * d + 2500.0);
    }
    c += alb * pool;
    // Water: the river mirrors the moonlit sky and throws glint columns.
    float water = smoothstep(26.0, 18.0, abs(u));
    if (water > 0.0) {
      float r0 = vnoise(vec2(vP.x * 0.08, vP.z * 0.5 + uTime * 0.6));
      float r1 = vnoise(vec2(vP.x * 0.3, vP.z * 1.6 - uTime * 0.8));
      vec3 Nw = normalize(vec3((r0 - 0.5) * 0.08 + (r1 - 0.5) * 0.08, 1.0, (vnoise(vec2(vP.x * 0.08 + 3.0, vP.z * 0.5)) - 0.5) * 0.2 + (r1 - 0.5) * 0.3));
      vec3 R = reflect(-V, Nw);
      float F = 0.02 + 0.98 * pow(1.0 - max(dot(Nw, V), 0.0), 5.0);
      vec3 wc = skyCol(R) * F * 1.4 + vec3(0.5, 0.55, 0.65) * pow(max(dot(R, uMoon), 0.0), 60.0) * 0.5;
      vec3 right = normalize(cross(V, vec3(0.0, 1.0, 0.0)));
      vec3 R0 = reflect(-V, vec3(0.0, 1.0, 0.0));
      float dn = vnoise(vec2(vP.x * 0.05, vP.z * 0.6 + uTime * 0.5));
      float tilt = (dn - 0.5) * 0.4;
      for (int i = 0; i < ${NG}; i++) {
        vec3 L = uGP[i].xyz - vP;
        float dl = length(L);
        vec3 err = R0 - L / dl;
        float ex = dot(err, right), ey = err.y;
        float mm = exp(-pow((tilt - ey * 0.5) / 0.03, 2.0));
        float fall = ey > 0.0 ? exp(-ey / 0.25) : exp(-pow(ey / 0.02, 2.0));
        float sx = max(0.003, 3.0 / dl);
        wc += uGC[i].rgb * uGP[i].w * mm * fall * exp(-ex * ex / (sx * sx)) * 0.9;
      }
      // The moon lays its own broken column on the water.
      vec3 errM = R0 - uMoon;
      float mm = exp(-pow((tilt - errM.y * 0.5) / 0.03, 2.0)) * exp(-pow(dot(errM, right) / 0.02, 2.0));
      wc += vec3(0.7, 0.75, 0.85) * mm * 0.7;
      c = mix(c, wc, water);
    }
    float f = hazeAmt(vP);
    gl_FragColor = vec4(mix(c, hazeCol(-V, vP), f), 1.0);
  }`,
}));
terrain.frustumCulled = false;
out.add(terrain);

/* Town lights: a fixed tile of sources, wrapped round the camera on the GPU. */
const glints = [];
{
  const pos = [], col = [], size = [];
  const SOD = [1.0, 0.55, 0.2], WARM = [1.0, 0.75, 0.45], WHITE = [0.85, 0.92, 1.0];
  const riverZ = x => -560 + 130 * Math.sin(x / 760) + 60 * Math.sin(x / 270 + 1.3);
  // Villages cluster on the banks and the lower far slope.
  for (let v = 0; v < 15; v++) {
    const cx = (v + rnd() * 0.6) * TILE / 15, side = rnd() < 0.65 ? -1 : 1;
    const cz = riverZ(cx) + side * range(60, 260) - (side < 0 ? range(0, 500) : 0);
    const n = 30 + (rnd() * 60 | 0);
    for (let k = 0; k < n; k++) {
      const x = cx + range(-160, 160) * Math.sqrt(rnd()), z = cz + range(-90, 90) * Math.sqrt(rnd());
      const c = rnd() < 0.6 ? WARM : rnd() < 0.7 ? SOD : WHITE;
      pos.push(x, 3 + rnd() * 6, z); col.push(...c.map(q => q * range(1.6, 3.4))); size.push(range(30, 60));
    }
    glints.push({ x: cx, z: cz, col: WARM, k: range(0.7, 1.3) });
  }
  // A road climbs the far slope with lamps in a line.
  for (let x = 0; x < TILE; x += 42) {
    const z = riverZ(x) - 380 - 150 * Math.sin(x / 1300);
    pos.push(x, 4, z); col.push(...SOD.map(q => q * 2.0)); size.push(34);
  }
  // Lone farms scatter everywhere.
  for (let k = 0; k < 420; k++) {
    const x = rnd() * TILE, z = riverZ(x) - range(-300, 3400);
    pos.push(x, 4, z); col.push(...WARM.map(q => q * range(1.2, 3.2))); size.push(range(22, 40));
  }
  // A bridge over the river, lamps along both rails, every tile.
  for (const bx of [2300, 6900]) for (let k = -6; k <= 6; k++) {
    const z = riverZ(bx) + k * 8;
    pos.push(bx - 6, 8, z, bx + 6, 8, z); col.push(...WHITE.map(q => q * 2.4), ...WHITE.map(q => q * 2.4)); size.push(36, 36);
    if (k === 0) glints.push({ x: bx, z, col: WHITE, k: 1.6 });
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('size', new THREE.Float32BufferAttribute(size, 1));
  const p = new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: OUTU,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
    attribute vec3 color;
    attribute float size;
    uniform float uScale;
    uniform float uCamX;
    uniform float uTime;
    varying vec3 vC;
    varying vec3 vP;
    ${NOISE}
    ${LAND}
    void main() {
      vec3 w = position;
      w.x = uCamX + mod(w.x - uCamX + ${TILE / 2}.0, ${TILE}.0) - ${TILE / 2}.0;
      w.y += land(w.xz);
      vP = w; vC = color;
      // Distant lights shimmer a little in the valley air.
      vC *= 0.85 + 0.15 * sin(uTime * 3.0 + position.x * 0.37 + position.z * 0.11);
      vec4 mv = viewMatrix * vec4(w, 1.0);
      gl_PointSize = clamp(size * 7.0 * uScale / -mv.z, 2.5, 28.0);
      gl_Position = projectionMatrix * mv;
    }`,
    fragmentShader: /* glsl */`
    varying vec3 vC;
    varying vec3 vP;
    ${HAZE}
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float a = exp(-dot(c, c) * 22.0);
      // A cap keeps tight clusters from blowing the bloom into blocks.
      gl_FragColor = vec4(min(vC * a * (1.0 - hazeAmt(vP) * 0.6), vec3(4.0)), 1.0);
    }`,
  }));
  p.frustumCulled = false;
  p.renderOrder = 2;
  out.add(p);
}
glints.slice(0, NG).forEach((g, i) => OUTU.uGC.value[i].set(...g.col, 0));

// The carriage's lit panes throw warm light out onto the rain and the parapet.
const TRAIN = /* glsl */`
uniform float uCamX;
float trainLight(vec3 P) {
  // Panes repeat every 2.4 m along the train; each is 1.5 m wide.
  float f = abs(fract((P.x - uCamX) / 2.4 + 0.5) - 0.5) * 2.4;
  float d = max(-P.z, 0.0);
  // With distance the pane edges blur into a band.
  float pane = mix(smoothstep(0.85, 0.65, f), 0.62, smoothstep(0.0, 9.0, d) * 0.7);
  float band = smoothstep(0.6 + d * 0.7, 0.3 + d * 0.4, abs(P.y - 0.05));
  return pane * band / (1.0 + d * d * 0.3);
}`;

/* The viaduct: a parapet below the window, posts and lamps that strobe past. */
const parapet = new THREE.Mesh(new THREE.BoxGeometry(400, 1.0, 0.4).translate(0, -2.1, -4.0), new THREE.ShaderMaterial({
  uniforms: OUTU,
  vertexShader: /* glsl */`varying vec3 vP; varying vec3 vN; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; vN = normal; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: /* glsl */`
  varying vec3 vP;
  varying vec3 vN;
  uniform vec4 uLP[${NL}];
  ${TRAIN}
  void main() {
    vec3 c = vec3(0.004, 0.005, 0.007) + vec3(1.0, 0.66, 0.36) * trainLight(vP) * 0.05;
    for (int i = 0; i < ${NL}; i++) {
      vec3 L = uLP[i].xyz - vP;
      float d = length(L);

  for (let i = 0; i < LAMPS; i++) {
    const sx = (lampX[i] - camX) * wall, sy = 0.55 * wall;
    const k = Math.exp(-Math.max(0, Math.abs(sx) - W.uHalf.value.x) * 3) * (Math.abs(sx) < 2.5 ? 1 : 0);
    hits.push([sx, sy, k]);
  }
  hits.sort((a, b) => b[2] - a[2]);
  for (let i = 0; i < 3; i++) W.uLamp.value[i].set(...(hits[i] || [0, 0, 0]));
  OUTU.uSmear.value = speed / 40;
  OUTU.uSpeed.value = speed;
  W.uSpeed.value = speed;
}
function update(dt, pace) {
  // The train rolls at speed while awake and slows to a stop when idle.
  speed += (target * pace - speed) * Math.min(1, dt * 1.5);
  if (pace === 0 && speed < 0.05) speed = 0;
  camX += speed * dt;
  time += dt;
  flow += dt * (0.25 + speed / 14);
  OUTU.uTime.value = time;
  W.uTime.value = time;
  W.uFlow.value = flow;
  mk = Math.min(1, mk + dt * 0.8);
  W.uRain.value += (mode.rain - W.uRain.value) * Math.min(1, dt * 2);
  W.uFog.value += (mode.fog - W.uFog.value) * Math.min(1, dt * 1.2);
  OUTU.uRain.value = W.uRain.value;
  if (!drag) look += (lookT - look) * Math.min(1, dt * 6);
  place();
}
place();
return {
  scene, camera, frame, update,
  get speed() { return speed; },
  get camX() { return camX; },
  get rain() { return W.uRain.value; },
  setSpeed(v) { target = v; },
  outside: [out, outCam],
  before(r) {
    r.setRenderTarget(outRT);
    r.render(out, outCam);
    r.setRenderTarget(null);
  },
  drag(dx, dy, on) { drag = on; if (on) { lookT = Math.max(-0.7, Math.min(0.7, lookT + dx * 1.4)); look = lookT; } },
  // A moving train draws at full rate; the sleep still stops it.
  lively: () => drag || speed > 0.5 || Math.abs(look - lookT) > 0.002 || mk < 1,
  setMode(v, now) { mode = MODES[v] || MODES.rain; mk = now ? 1 : 0; if (now) { W.uRain.value = mode.rain; W.uFog.value = mode.fog; OUTU.uRain.value = mode.rain; } },
  post: { bloom: [0.7, 0.55, 0.8], tint: [0.0008, 0.0007, 0.0009], vig: 0.45, vigIn: 0.45, grain: 0.03 },
};
}

/* ---------- end scene ---------- */

const stage = document.getElementById('stage');
const canvas = document.createElement('canvas');
canvas.setAttribute('aria-hidden', 'true');
stage.prepend(canvas);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  markReady();
  throw err;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const S = build({ THREE });

/* Post chain: render, half-resolution bloom, grade, output. */
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(S.scene, S.camera));
const [bS, bR, bT] = S.post.bloom;
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), bS, bR, bT);
// The bloom runs at half resolution.
const bloomSize = bloom.setSize.bind(bloom);
bloom.setSize = (w, h) => bloomSize(Math.max(1, w / 2), Math.max(1, h / 2));
composer.addPass(bloom);

// The grade adds a tint, a vignette and fixed grain.
const grade = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null },
    uRes: { value: new THREE.Vector2(1, 1) },
    uTint: { value: new THREE.Vector3(...S.post.tint) },
    uVig: { value: S.post.vig },
    uVigIn: { value: S.post.vigIn },
    uGrain: { value: S.post.grain },
  },
  vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform sampler2D tDiffuse;
  uniform vec2 uRes;
  uniform vec3 uTint;
  uniform float uVig, uVigIn, uGrain;
  varying vec2 vUv;
  // Interleaved gradient noise: fine grain with no banding.
  float h(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
  void main() {
    vec3 c = texture2D(tDiffuse, vUv).rgb + uTint;
    float asp = uRes.x / uRes.y;
    vec2 q = (vUv - 0.5) * vec2(asp, 1.0);
    c *= 1.0 - uVig * smoothstep(uVigIn, 1.1, length(q));
    float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
    c *= 1.0 + (h(vUv * uRes) - 0.5) * uGrain * (0.6 + 0.4 * smoothstep(0.0, 0.3, lum)) * 2.0;
    gl_FragColor = vec4(max(c, 0.0), 1.0);
  }`,
});
composer.addPass(grade);
composer.addPass(new OutputPass());

/* ---------- size ---------- */
// Slow frames step down one rung: High to Standard, Standard to 1x.
let rung = 0, size = { w: 1, h: 1, dpr: 1 };
function resize(force = false) {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  const dpr = pixelRatio(w, h, { maxDpr: 2, budget: 2.6e6, low: rung > 0 });
  if (!force && w === size.w && h === size.h && dpr === size.dpr) return;
  size = { w, h, dpr };
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
  grade.uniforms.uRes.value.set(w * dpr, h * dpr);
  S.frame(w, h, dpr);
  if (ready) draw();
}
let runT = 0, avg = 1 / 60, slowT = 0;
function watchdog(dt) {
  if (!dt || rung) return;
  runT += dt;
  avg += (dt - avg) * 0.1;
  if (runT < 4) return;
  slowT = avg > 1 / 38 ? slowT + dt : 0;
  if (slowT > 2) { rung = 1; resize(true); }
}

/* ---------- sound ---------- */
// Rain hisses on the glass, the bogies rumble, and each rail joint clacks.
const kit = audioKit({ gain: 0.6, noiseSeconds: 2 });
const JOINT = 25, BOGIE = [0, 2.6, 16, 18.6];
let V = null, joint = null, dropBudget = 0;
function loopNoise(ac, type, f, q) {
  const src = ac.createBufferSource(); src.buffer = kit.noise; src.loop = true;
  const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = ac.createGain(); g.gain.value = 0;
  src.connect(fl).connect(g).connect(kit.out);
  src.start(0, Math.random() * kit.noise.duration);
  return { fl, g };
}
function voices() {
  const ac = kit.live();
  if (!ac || !kit.noise) return null;
  V ||= { rain: loopNoise(ac, 'bandpass', 4200, 0.5), rumble: loopNoise(ac, 'lowpass', 150, 0.7) };
  return V;
}
function burst(ac, at, { f, q, dur, level, type = 'bandpass' }) {
  const src = ac.createBufferSource(); src.buffer = kit.noise;
  const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = ac.createGain();
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(level, at + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0005, at + dur);
  src.connect(fl).connect(g).connect(kit.out);
  src.start(at, Math.random() * (kit.noise.duration - dur - 0.05), dur + 0.02);
}
// One wheel on one joint: a click of steel and a low thump.
function clack(ac, at, level) {
  burst(ac, at, { f: 1100 + Math.random() * 500, q: 1.4, dur: 0.035, level: level * 0.35 });
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(95, at); o.frequency.exponentialRampToValueAtTime(48, at + 0.09);
  g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(level * 0.5, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0005, at + 0.12);
  o.connect(g).connect(kit.out);
  o.start(at); o.stop(at + 0.14);
}
function voice(dt) {
  const v = voices();
  if (!v) return;
  const ac = kit.ac, now = ac.currentTime, sp = S.speed, k = Math.min(1, sp / 30);
  v.rain.g.gain.setTargetAtTime(0.05 * S.rain, now, 0.2);
  v.rumble.g.gain.setTargetAtTime(0.32 * Math.pow(k, 0.8), now, 0.2);
  v.rumble.fl.frequency.setTargetAtTime(110 + 90 * k, now, 0.3);
  // Single drops tick on the pane at a rate set by the rain.
  dropBudget = Math.min(4, dropBudget + dt * 9 * S.rain);
  while (dropBudget >= 1) {
    dropBudget--;
    if (Math.random() < 0.6) burst(ac, now + Math.random() * 0.05, { f: 2400 + Math.random() * 4000, q: 2, dur: 0.008 + Math.random() * 0.01, level: 0.05 + 0.06 * Math.random() });
  }
  // Each bogie wheel crosses the joint in turn; the gap shrinks with speed.
  const j = Math.floor(S.camX / JOINT);
  if (joint !== null && j !== joint && sp > 2) for (const b of BOGIE) clack(ac, now + b / sp, 0.25 + 0.5 * k);
  joint = j;
}
function hush() {
  if (!V || !kit.ac) return;
  const now = kit.ac.currentTime;
  V.rain.g.gain.setTargetAtTime(0, now, 0.15);
  V.rumble.g.gain.setTargetAtTime(0, now, 0.15);
}

/* ---------- loop ---------- */
// Full rate in an event, 30 fps while drifting, then sleep.
// QA can shorten the sleep with ?sleep=<ms>.
const SLEEP = +new URLSearchParams(location.search).get('sleep') || 60000;
let raf = 0, lastT = 0, lastDraw = 0, lastInput = performance.now(), pace = reduced() ? 0 : 1, visible = true, ready = false;
function draw() {
  S.before(renderer);
  composer.render();
}
function loop(now) {
  raf = 0;
  if (!visible) return;
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000);
  lastT = now;
  // Ambient motion eases out over 2 s once idle; reduced motion keeps it off.
  const awake = !reduced() && now - lastInput < SLEEP;
  pace = awake ? Math.min(1, pace + dt / 2) : Math.max(0, pace - dt / 2);
  const lively = S.lively();
  if (!lively && pace === 0) { S.update(0, 0); draw(); hush(); kit.rest(() => !raf); return; }
  if (lively || now - lastDraw >= 31) {
    // A drift frame covers the gap since the last draw, never more than 0.1 s.
    const step = lively ? dt : Math.min(0.1, Math.max(dt, (now - lastDraw) / 1000));
    S.update(step, pace);
    voice(step);
    draw();
    if (lively) watchdog(dt);
    lastDraw = now;
  }
  raf = requestAnimationFrame(loop);
}
function wake() {
  lastInput = performance.now();
  if (ready && visible && !raf) { lastT = lastDraw = performance.now(); raf = requestAnimationFrame(loop); }
}

/* ---------- input ---------- */
// A drag looks along the valley.
let press = null;
stage.addEventListener('pointerdown', e => {
  if (e.button > 0 || press) return;
  try { stage.setPointerCapture(e.pointerId); } catch { /* capture is optional */ }
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, lx: e.clientX, moved: false };
  wake();
});
stage.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  if (!press.moved && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { press.moved = true; stage.classList.add('dragging'); }
  if (press.moved) { S.drag((e.clientX - press.lx) / size.w, 0, true); wake(); }
  press.lx = e.clientX;
});
function endPress(e) {
  if (!press || e.pointerId !== press.id) return;
  if (press.moved) S.drag(0, 0, false);
  stage.classList.remove('dragging');
  press = null;
  wake();
}
stage.addEventListener('pointerup', endPress);
stage.addEventListener('pointercancel', endPress);

/* ---------- bar ---------- */
function popover(box, btn) {
  const set = on => { box.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', String(on)); };
  btn.addEventListener('click', () => set(!box.classList.contains('is-open')));
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
}
popover(document.getElementById('setter'), document.getElementById('setBtn'));
// Settings holds the site-wide Quality choice.
qualitySetting(document.getElementById('sets'));
onQuality(() => { rung = 0; resize(true); wake(); });

// The scene eases to the new weather.
const modes = choices(document.getElementById('mode'), v => { opts.mode = v; save('mode', v); S.setMode(v); wake(); });
modes.set(opts.mode);
S.setMode(opts.mode, true);
const speedEl = document.getElementById('speed');
speedEl.value = String(opts.speed);
S.setSpeed(cruise(opts.speed));
speedEl.addEventListener('input', () => { opts.speed = +speedEl.value; save('speed', opts.speed); S.setSpeed(cruise(opts.speed)); wake(); });
const KEYS = { Digit1: 'clear', Digit2: 'rain', Digit3: 'fogged' };
addEventListener('keydown', e => {
  if (e.target.closest?.('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (KEYS[e.code]) { modes.set(KEYS[e.code], true); return; }
});

/* ---------- start ---------- */
onReducedChange(() => wake());
whenVisible(stage, v => {
  visible = v;
  if (v) { if (ready) draw(); wake(); } else { cancelAnimationFrame(raf); raf = 0; lastT = 0; hush(); }
});
new ResizeObserver(() => resize()).observe(stage);
// Compile first, then draw the first composed frame inside the intro.
(async () => {
  resize(true);
  // Both scenes compile in parallel where the driver allows it.
  // A hidden tab never polls the compile, so a timeout caps the wait.
  if (renderer.extensions.has('KHR_parallel_shader_compile')) {
    await Promise.race([Promise.all([renderer.compileAsync(...S.outside), renderer.compileAsync(S.scene, S.camera)]), wait(4000)]);
  } else { renderer.compile(...S.outside); renderer.compile(S.scene, S.camera); }
  draw();
  // One finished frame folds the shader work into the intro.
  renderer.getContext().finish();
  ready = true;
  markReady();
  requestAnimationFrame(() => canvas.classList.add('on'));
  wake();
})().catch(err => { console.error(err); stage.querySelector('.fail').hidden = false; markReady(); });
</script>
</body>
</html>
