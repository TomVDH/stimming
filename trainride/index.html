<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Train Ride: a mountain valley through one carriage window. */
:root { --stage: oklch(0.1 0.01 260); }
.stage--trainride { cursor: grab; touch-action: none; }
.stage--trainride.dragging { cursor: grabbing; }
/* The line: a slim strip that shows the route and scrubs along it. */
.tr-line {
  position: absolute; left: 50%; bottom: 58px; z-index: 6; transform: translateX(-50%);
  width: min(620px, calc(100% - 32px)); padding: 8px 14px 10px; border-radius: 12px;
  background: oklch(0.16 0.01 260 / 0.82); backdrop-filter: blur(10px);
  color: oklch(0.92 0.01 260); font: 500 12px/1.3 Gabarito, system-ui, sans-serif;
  cursor: default; touch-action: none; user-select: none; -webkit-user-select: none;
}
.tr-line[hidden] { display: none; }
.tr-line-top { display: flex; justify-content: space-between; gap: 12px; }
.tr-line-top b { font-weight: 600; }
.tr-line-top span { opacity: 0.7; font-variant-numeric: tabular-nums; }
.tr-line-track { position: relative; height: 26px; margin-top: 4px; cursor: ew-resize; }
.tr-line-track::before { content: ''; position: absolute; left: 0; right: 0; top: 12px; height: 2px; border-radius: 1px; background: oklch(0.55 0.01 260); }
.tr-line-track i { position: absolute; top: 9px; width: 2px; height: 8px; margin-left: -1px; border-radius: 1px; background: oklch(0.7 0.01 260); }
.tr-line-track i[data-k="1"] { top: 6px; height: 14px; background: oklch(0.92 0.01 260); }
.tr-line-track i[data-k="2"] { top: 10px; height: 6px; background: oklch(0.55 0.01 260); }
.tr-line-track u { position: absolute; top: 5px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: oklch(0.86 0.13 85); box-shadow: 0 0 0 3px oklch(0.16 0.01 260); }
.tr-line-dev { display: flex; align-items: center; gap: 8px; margin-top: 6px; opacity: 0.85; }
.tr-line-dev input[type="range"] { flex: 1; }
.stage--trainride canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--trainride canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--trainride canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Train Ride</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--trainride" id="stage" tabindex="0" role="application" aria-label="A mountain valley by night or by day, seen through a carriage window on a high viaduct. Rain runs back along the glass as the train goes. Drag to lean and peer along the valley; scroll or pinch to lean against the glass.">
      <p class="fail" hidden>Train Ride needs WebGL2, which this browser has turned off.</p>
    </div>

    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",

    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",

  }
}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { initPage, whenVisible, reduced, onReducedChange, quality, pixelRatio, onQuality, audioKit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import { GLASS_RAIN } from '../shared/glassrain.js';
import { BOKEH } from '../shared/bokeh.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.trainride.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.trainride.${k}`, String(v)); } catch { /* storage is optional */ } };
const opts = {
  // The ride opens clear; Drift then moves the weather on by itself.
  mode: 'clear',
  drift: saved('drift') !== '0',
  express: saved('express') === '1',
  wet: saved('wet') || '1',
  speed: saved('speed') != null ? +saved('speed') : 0.6,
  time: saved('time') || 'night',
};
// QA can open a look with ?time=, ?mode= and ?x=; these are not saved.
const qs = new URLSearchParams(location.search);
if (qs.get('time')) opts.time = qs.get('time');
if (qs.get('mode')) opts.mode = qs.get('mode');
// The Speed slider maps to cruise speed in metres per second.
const cruise = v => v * 45;

/* ---------- scene ---------- */
// Train Ride: a mountain valley seen through one carriage window on a high viaduct.
// The outside renders to a target; one glass shader frames, fogs and wets it.
function build({ THREE }) {
let seed = 4242;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const range = (a, b) => a + (b - a) * rnd();

/* ---------- outside: the valley ---------- */
const out = new THREE.Scene();
const outCam = new THREE.PerspectiveCamera(50, 1, 1, 40000);
const outRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
// Catenary masts stand every 50 m between the tracks.
const NG = 16, NL = 6, LAMP_GAP = 50;
const { L: TILE, NT, b: TB } = ROUTE.meta;
const S0 = name => ROUTE.meta.stations.find(st => st[0] === name)[1];
// Three stretches: Lake Zurich, the Linth plain, the Walensee.
// Each weight is 0 to 1; the three always sum to 1.
const sstep = (a, b, t) => { t = Math.min(1, Math.max(0, (t - a) / (b - a))); return t * t * (3 - 2 * t); };
const SEG = [S0('Pfäffikon SZ'), S0('Altendorf') + 600, S0('Ziegelbrücke'), S0('Weesen') + 800];
const seg = x => {
  const s = ((x % TILE) + TILE) % TILE;
  const z = 1 - sstep(SEG[0], SEG[1], s) + sstep(TILE - 3000, TILE, s);
  const w = sstep(SEG[2], SEG[3], s) * (1 - sstep(TILE - 3000, TILE, s));
  return { z, l: Math.max(0, 1 - z - w), w };
};
// Route map rows: t runs left of the line, denser near it.
const jOf = t => (-8 + Math.sqrt(64 + 4 * TB * (Math.min(Math.max(t, -400), 18400) + 400))) / (2 * TB);
const townAt = (x, t) => {
  const i = Math.floor((((x % TILE) + TILE) % TILE) / TILE * ROUTE.w) % ROUTE.w, j = Math.round(jOf(t));
  return ROUTE.f[(j * ROUTE.w + i) * 2 + 1] / 250;
};
const f8 = v => v.toFixed(8);
const TAU = Math.PI * 2;

const NOISE = /* glsl */`
float hash1(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
vec2 hash2(vec2 p) { return vec2(hash1(p), hash1(p + 17.17)); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash1(i), hash1(i + vec2(1, 0)), u.x), mix(hash1(i + vec2(0, 1)), hash1(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
// Gradient noise, about -0.6 to 0.6, with no grid lines.
float gnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec2 ga = hash2(i) * 2.0 - 1.0, gb = hash2(i + vec2(1.0, 0.0)) * 2.0 - 1.0;
  vec2 gc = hash2(i + vec2(0.0, 1.0)) * 2.0 - 1.0, gd = hash2(i + vec2(1.0, 1.0)) * 2.0 - 1.0;
  return mix(mix(dot(ga, f), dot(gb, f - vec2(1.0, 0.0)), u.x), mix(dot(gc, f - vec2(0.0, 1.0)), dot(gd, f - vec2(1.0, 1.0)), u.x), u.y);
}
// Ridged noise: sharp crests and eroded flanks.
float ridged(vec2 p, int oct) {
  float s = 0.0, a = 0.5, w = 1.0;
  for (int i = 0; i < 7; i++) {
    if (i >= oct) break;
    float n = max(1.0 - abs(gnoise(p) * 1.8), 0.0);
    n *= n;
    s += a * n * w;
    w = clamp(n * 1.6, 0.0, 1.0);
    p = mat2(1.6, -1.2, 1.2, 1.6) * p + 7.3;
    a *= 0.5;
  }
  return s;
}`;

// Real ground from the route map: heights relative to the eye, a lake flag, town density.
const LAND = /* glsl */`
uniform sampler2D tH, tF, tS, tLk, tR, tN, tFd;
vec2 rt(vec2 xz) {
  float t = clamp(-xz.y, -400.0, 18400.0);
  float j = (-8.0 + sqrt(64.0 + ${f8(4 * TB)} * (t + 400.0))) / ${f8(2 * TB)};
  return vec2(xz.x / ${f8(TILE)}, (j + 0.5) / ${NT}.0);
}
vec3 seg(float x) {
  float s = mod(x, ${f8(TILE)});
  float z = 1.0 - smoothstep(${f8(SEG[0])}, ${f8(SEG[1])}, s) + smoothstep(${f8(TILE - 3000)}, ${f8(TILE)}, s);
  float w = smoothstep(${f8(SEG[2])}, ${f8(SEG[3])}, s) * (1.0 - smoothstep(${f8(TILE - 3000)}, ${f8(TILE)}, s));
  return vec3(z, clamp(1.0 - z - w, 0.0, 1.0), w);
}
float wet(vec2 xz) { return textureLod(tF, rt(xz), 0.0).r; }
float town(vec2 xz) { return textureLod(tF, rt(xz), 0.0).g; }
// Distance outside the water in metres; negative on the water.
// Beside the line a distance map of the lake outlines gives the near shore to about a metre.
// Past 760 m, and on the far shore, the coarse lake flag stands in.
float shoreK(float t) { return ${ROUTE.sh ? 'smoothstep(0.0, 6.0, t) * (1.0 - smoothstep(690.0, 760.0, t))' : '0.0'}; }
float shoreN(vec2 xz) { return (textureLod(tS, vec2(xz.x / ${f8(TILE)}, -xz.y / 768.0), 0.0).r * 255.0 - 128.0) * 0.25; }
float shore(vec2 xz) {
  float k = shoreK(-xz.y);
  if (k >= 1.0) return shoreN(xz);
  float old = (0.5 - wet(xz)) * 30.0;
  return k <= 0.0 ? old : mix(old, shoreN(xz), k);
}
// oct above 4 adds relief finer than the 13 m elevation grid.
// Cubic B-spline height: four bilinear taps.
// Bilinear heights crease along the grid; the cubic keeps slopes smooth.
float hCubicT(sampler2D tx, vec2 uv, vec2 sz) {
  vec2 tc = uv * sz - 0.5, f = fract(tc);
  tc -= f;
  vec2 f2 = f * f, f3 = f2 * f;
  vec2 w0 = (1.0 - 3.0 * f + 3.0 * f2 - f3) / 6.0, w1 = (4.0 - 6.0 * f2 + 3.0 * f3) / 6.0;
  vec2 w2 = (1.0 + 3.0 * f + 3.0 * f2 - 3.0 * f3) / 6.0, w3 = f3 / 6.0;
  vec2 s0 = w0 + w1, s1 = w2 + w3;
  vec2 p0 = (tc - 0.5 + w1 / s0) / sz, p1 = (tc + 1.5 + w3 / s1) / sz;
  return s0.y * (s0.x * textureLod(tx, p0, 0.0).r + s1.x * textureLod(tx, vec2(p1.x, p0.y), 0.0).r)
       + s1.y * (s0.x * textureLod(tx, vec2(p0.x, p1.y), 0.0).r + s1.x * textureLod(tx, p1, 0.0).r);
}
float hCubic(vec2 uv) { return hCubicT(tH, uv, vec2(${ROUTE.w}.0, ${ROUTE.ht}.0)); }
// Bilinear height: cheap, for shadow and mirror marches.
float landC(vec2 xz) { return textureLod(tH, rt(xz), 0.0).r; }
float landO(vec2 xz, int oct) {
  vec2 uv = rt(xz);
  float h = hCubic(uv);
  if (oct > 4) {
    float d = (1.0 - textureLod(tF, uv, 0.0).r) * smoothstep(20.0, 80.0, -xz.y);
    h += (gnoise(xz * 0.03) * 2.0 + gnoise(xz * 0.11) * 0.6) * d;
  }
  // Beside the line the fine map takes over: swissALTI3D at 2 m, baked by tools/near.py.
  // It fades in over the first 10 m and out from 690 m; the mirror's coarse march (oct 3) skips it.
  ${ROUTE.nr ? `float tn = -xz.y, kn = oct > 3 ? smoothstep(0.0, 10.0, tn) * (1.0 - smoothstep(690.0, 760.0, tn)) : 0.0;
  if (kn > 0.0) h = mix(h, hCubicT(tN, vec2(xz.x / ${f8(TILE)}, tn / 768.0), vec2(${ROUTE.nw}.0, ${ROUTE.nr.length / ROUTE.nw}.0)), kn);` : ''}
  // Zurich HB's track field: the land keeps below the deck, then climbs away behind it.
  float dY = mod(xz.x + ${f8(TILE / 2)}, ${f8(TILE)}) - ${f8(TILE / 2)};
  if (dY > -300.0 && dY < 2120.0) h = min(h, -3.2 + max(-xz.y - 90.0 + 62.0 * smoothstep(950.0, 2050.0, dY), 0.0) * 0.6);
  // Near shore: the lake lies flat inside its outline, and the bank rises gently from it.
  // The mirror's coarse march (oct 3) skips this.
  float k = oct > 3 ? shoreK(-xz.y) : 0.0;
  if (k > 0.0) {
    float sd = shoreN(xz);
    if (sd < 14.0) {
      float lk = textureLod(tLk, vec2(xz.x / ${f8(TILE)}, 0.5), 0.0).r;
      h = mix(h, mix(max(h, lk + clamp(sd, 0.0, 12.0) * 0.12), lk, smoothstep(2.0, 0.0, sd)), k);
    }
  }
  return h;
}
float land(vec2 xz) { return landO(xz, 7); }
// Metres to the edge of the nearest mapped road; below zero is on the road.
// The road map (tools/roads.py) covers the 500 m beside the line.
float roadD(vec2 xz) {
  float t = -xz.y;
  if (t < 0.0 || t > 500.0) return 20.0;
  return textureLod(tR, vec2(xz.x / ${f8(TILE)}, t / 512.0), 0.0).r * 25.5 - 4.0;
}`;
// A power line wanders beside the line on timber poles; roadZ and roadW place it.
const ROAD = /* glsl */`
float roadZ(float x) { return -(68.0 + 24.0 * sin(x * 0.0011) + 9.0 * sin(x * 0.0047 + 1.3)); }
// The road runs in some 1300 m stretches; it narrows to nothing at each end.
float roadW(float x) {
  float f = fract(x / 1300.0);
  return step(0.45, hash1(vec2(floor(x / 1300.0), 3.0))) * smoothstep(0.0, 0.04, f) * smoothstep(1.0, 0.96, f);
}`;

// Land colour, normal, sky cover and shore distance at a ground point.
// Light and view change none of these, so the tiles bake them once per texel; no frame runs this.
const LANDMAT = /* glsl */`
uniform vec2 uBG[${NG}];
// Farm parcels from the federal map (tools/fields.py), 4 km out on the lake side.
// It paints the parcel's crop into alb and returns the map's cover.
float fieldMap(vec2 xz, float dist, inout vec3 alb) {
  ${ROUTE.fd ? '' : 'return 0.0;'}
  float t = -xz.y;
  if (t < 0.0 || t > 4090.0) return 0.0;
  vec2 sz = vec2(${ROUTE.fw || 1}.0, 512.0), uv = vec2(xz.x / ${f8(TILE)}, t / 4096.0);
  // Edge distance, bilinear: zero on a parcel's outline, 8 m and more inside.
  float d = textureLod(tFd, uv, 0.0).g * 63.75;
  // Near an edge the lookup steps inward, so the parcel's outline stays smooth.
  vec2 lu = uv;
  if (d < 6.0) {
    vec2 dx = vec2(1.0 / sz.x, 0.0), dy = vec2(0.0, 1.0 / sz.y);
    vec2 g = vec2((textureLod(tFd, uv + dx, 0.0).g - textureLod(tFd, uv - dx, 0.0).g) / ${f8(2 * TILE / 8192)},
                  (textureLod(tFd, uv + dy, 0.0).g - textureLod(tFd, uv - dy, 0.0).g) / 16.0);
    if (dot(g, g) > 1e-8) lu += normalize(g) * (6.0 - d) / vec2(${f8(TILE)}, 4096.0);
  }
  vec3 px = texelFetch(tFd, ivec2(mod(floor(lu.x * sz.x), sz.x), clamp(int(lu.y * sz.y), 0, 511)), 0).rgb * 255.0 + 0.5;
  float cls = floor(px.r / 16.0), sd = mod(floor(px.r), 16.0) / 16.0, a = floor(px.b) / 256.0 * 3.14159;
  float k = 1.0 - smoothstep(3600.0, 4000.0, t);
  if (cls < 0.5) return k;
  // The parcel's frame: q.x runs along its long side, q.y across it.
  vec2 dr = vec2(cos(a), -sin(a)), q = vec2(dot(xz, dr), dot(xz, vec2(dr.y, -dr.x)));
  // Rows fade before they reach a texel's width.
  float fr = 1.0 - smoothstep(0.25, 0.7, fwidth(q.y / 3.0));
  float row = abs(fract(q.y / 3.0) - 0.5) * 2.0;
  vec3 earth = vec3(0.13, 0.1, 0.065), c = alb;
  // Meadows: a third freshly mown and pale, the rest in tones by regrowth.
  if (cls < 1.5) c = sd < 0.3 ? vec3(0.21, 0.215, 0.1) * (1.0 - 0.06 * row * fr) : alb * (0.78 + 0.5 * sd);
  else if (cls < 2.5) c = mix(alb, vec3(0.19, 0.185, 0.09), 0.45 + 0.3 * sd);
  else if (cls < 3.5) c = alb * (0.84 + 0.12 * sd) * (0.94 + 0.12 * vnoise(xz * 0.06));
  else if (cls < 4.5) c = vec3(0.2, 0.165, 0.09) * (0.9 + 0.2 * sd);
  else if (cls < 5.5) c = vec3(0.065, 0.16, 0.035) * (1.0 - 0.12 * row * fr);
  else if (cls < 6.5) c = (sd < 0.55 ? vec3(0.25, 0.23, 0.09) : sd < 0.85 ? vec3(0.13, 0.17, 0.06) : vec3(0.21, 0.18, 0.095)) * (1.0 - 0.12 * row * fr);
  else if (cls < 7.5) c = sd < 0.3 ? vec3(0.3, 0.27, 0.05) : vec3(0.17, 0.19, 0.06);
  else if (cls < 8.5) c = mix(earth, vec3(0.08, 0.14, 0.04), (0.3 + 0.4 * sd) * mix(0.5, row, fr));
  else if (cls < 9.5) c = mix(vec3(0.09, 0.125, 0.035), vec3(0.12, 0.1, 0.065), mix(0.6, 0.4 + row * 0.4, fr));
  else if (cls < 10.5) {
    // Orchard trees stand in rows on grass.
    vec2 o = abs(fract(q / vec2(9.0, 8.0)) - 0.5) * 2.0;
    float tf = 1.0 - smoothstep(0.2, 0.6, length(fwidth(q / vec2(9.0, 8.0))));
    c = mix(alb, vec3(0.05, 0.08, 0.03), mix(0.3, step(length(o), 0.55), tf));
  }
  else if (cls < 11.5) c = mix(earth, vec3(0.07, 0.1, 0.04), mix(0.5, row, fr));
  else if (cls < 12.5) c = vec3(0.42, 0.43, 0.42) * (0.85 + 0.15 * mix(0.5, row, fr));
  else c = vec3(0.05, 0.085, 0.03);
  // A narrow grass margin parts neighbouring parcels.
  float fw = fwidth(t);
  c = mix(alb * 0.92, c, smoothstep(0.3, 1.6 + fw, d));
  alb = mix(alb, c, k * 0.85 * smoothstep(110.0, 300.0, dist));
  return k;
}
void landMat(vec2 xz, out vec3 albO, out vec3 NO, out float aoO, out float glowO, out float wdO) {
  float hY = land(xz);
  // The eye's distance when the point passes nearest: its offset from the line, and a little more.
  float dist = max(-xz.y, 4.0) * 1.08;
  float wd = shore(xz);
  vec3 sg = seg(xz.x);
  // Height above the lakes, near enough.
  float hh = hY + 20.0;
  // Far triangles are wide; their interpolated normals give rock patches triangle edges.
  // Past 600 m the normal comes from the height map at this pixel instead.
  // The normal comes from the cubic height map at each pixel, so no triangle shows.
  float ne = clamp(dist * 0.004, 2.0, 40.0), nh0 = landO(xz, 4);
  vec3 N = normalize(vec3(nh0 - landO(xz + vec2(ne, 0.0), 4), ne, nh0 - landO(xz + vec2(0.0, ne), 4)));
  // Close land gets fine relief from noise.
  float near = smoothstep(1400.0, 250.0, dist);
  if (near > 0.0) N = normalize(N + vec3(gnoise(xz * 0.04), 0.0, gnoise(xz * 0.04 + 9.0)) * 0.15 * near);
  float slope = 1.0 - N.y;
  float n1 = fbm(xz * 0.002);
  // Meadow: lush in the valley, browner up high.
  // Pixar-lite: clean, saturated meadow greens in broad soft bands.
  // Soft sage to warm meadow, in wide calm bands.

  float urb = smoothstep(0.5, 0.9, vm) * step(4.0, wd) * smoothstep(0.14, 0.06, slope) * smoothstep(5000.0, 3500.0, mod(xz.x, ${f8(TILE)}));

/* Land tiles: the land's colour and normal, baked into textures that scroll with the train. */
// Five tiles, each four times coarser and wider than the last: [texel in metres, columns, rows].
// A tile spans columns * texel along the line, centred on the eye, and rows * texel out from the line.
// Columns wrap: as the train moves, only the columns that come into reach are baked.
const CAS = [[0.125, 2048, 512], [0.5, 2048, 512], [2, 2048, 512], [8, 2048, 512], [32, 2048, 576]];

tiles.forEach((t, k) => { OUTU['tA' + k] = { value: t.a.texture }; OUTU['tB' + k] = { value: t.b.texture }; });

const tileTap = (k, v) => { const [s, W, H] = CAS[k], sc = `vec2(${f8(1 / (W * s))}, ${f8(1 / (H * s))})`; return `a${v} = textureGrad(tA${k}, p * ${sc}, gx * ${sc}, gy * ${sc}); b${v} = textureGrad(tB${k}, p * ${sc}, gx * ${sc}, gy * ${sc});`; };

${CAS.map((c, k) => `uniform sampler2D tA${k}, tB${k};`).join('\n')}

  vec2 p = vec2(xz.x, -xz.y), gx = dFdx(p), gy = dFdy(p);

// Light, sky and haze for night and day; uDay blends the two.
const HAZE = /* glsl */`
uniform vec3 uMoon, uSun;
uniform float uDay, uRain;
uniform vec4 uGP[${NG}];
uniform vec4 uGC[${NG}];
// Day light: the sun and the blue sky; rain greys both.
vec3 sunC() { return vec3(1.0, 0.95, 0.86) * 3.2 * (1.0 - 0.85 * uRain); }
vec3 skyA(float ny) { return mix(vec3(0.25, 0.4, 0.75) * 0.55, vec3(0.45, 0.48, 0.52) * 0.75, uRain) * (0.55 + 0.45 * ny); }

  float up = max(d.y, 0.0);
  // Night: deep blue, a glow round the moon, a far town low on the left.
  vec3 n = vec3(0.004, 0.006, 0.013) + vec3(0.02, 0.03, 0.05) * exp(-up * 9.0);
  float m = max(dot(d, uMoon), 0.0);
  n += vec3(0.25, 0.3, 0.38) * (pow(m, 200.0) * 0.4 + pow(m, 10.0) * 0.05);
  n += vec3(0.5, 0.22, 0.07) * 0.05 * exp(-up * 22.0) * pow(max(dot(normalize(d.xz + 1e-4), normalize(vec2(-0.7, -1.0))), 0.0), 6.0);

  float s = max(dot(d, uSun), 0.0);
  vec3 dc = mix(vec3(0.55, 0.68, 0.88), vec3(0.08, 0.22, 0.6), pow(up, 0.4)) * 1.1;
  dc += vec3(1.0, 0.88, 0.7) * (pow(s, 6.0) * 0.18 + pow(s, 60.0) * 0.5);
  dc = mix(dc, vec3(0.42, 0.45, 0.5) * (0.75 + 0.35 * up), uRain * 0.85);
  return mix(n, dc, uDay);

float hazeAmt(vec3 P) {
  float dist = length(P - cameraPosition);
  // Night: valley haze with a 90 m scale height, and mist on the water.
  float k = 1.0 / 90.0, h0 = cameraPosition.y + 50.0, h1 = max(P.y + 50.0, 0.0), dh = h1 - h0;
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);

  float night = clamp(1.0 - exp(-dist * 0.0004 * avg - dist * (0.00001 + 0.00003 * uRain)) + mist, 0.0, 1.0);

  float kd = 1.0 / 1500.0, g0 = cameraPosition.y + 40.0, g1 = max(P.y + 40.0, 0.0), dg = g1 - g0;

// Haze takes the horizon colour: warmed over each town at night, lit by the sun by day.
vec3 hazeCol(vec3 d, vec3 P) {
  vec3 hz = skyCol(normalize(vec3(d.x, max(d.y, 0.0) * 0.4 + 0.02, d.z)));
  vec3 n = hz * 0.7;
  if (uDay < 0.99) for (int i = 0; i < ${NG}; i++) n += uGC[i].rgb * uGP[i].w * 0.3 * exp(-length(P.xz - uGP[i].xz) / 110.0);

/* Sky dome: stars and moonlit cloud by night, cumulus by day. */

const sky = (() => {

  // The plan view: straight down on the built scene, from a set height.
  const topOn = box.querySelector('[data-top]'), alt = box.querySelector('[data-alt]'), altH = box.querySelector('[data-h]');
  const setTop = () => { S.top(topOn.checked, +alt.value); altH.textContent = `${alt.value} m`; wake(); };
  topOn.addEventListener('change', setTop);
  alt.addEventListener('input', setTop);
  if (qs.has('top')) { topOn.checked = true; if (+qs.get('top')) alt.value = qs.get('top'); setTop(); }
  // The sound mixer: one row per layer, to set each by ear. Levels save in this browser.
  const NAMES = { master: 'All sound', bed: 'Running noise', whine: 'Whine', depart: 'Air and doors', arrive: 'Squeal, jolt, air', points: 'Points clatter', joints: 'Rail joint', pass: 'Passing train', knock: 'Pass knock', thud: 'Bass thud', latch: 'Door knock', door: 'Door muffle' };
  const mx = document.createElement('div');
  mx.style.cssText = 'position:fixed;left:16px;bottom:64px;z-index:50;width:min(330px,calc(100vw - 32px));max-height:calc(100vh - 220px);overflow:auto;padding:8px 10px;border-radius:10px;background:oklch(0.16 0.01 260 / 0.9);backdrop-filter:blur(8px);color:oklch(0.92 0.01 260);font:500 12px/1.5 Gabarito,system-ui,sans-serif';
  const btn = 'font:inherit;color:inherit;background:oklch(0.26 0.01 260);border:0;border-radius:5px;padding:1px 7px;cursor:pointer';
  mx.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>Sound mix</b><span><button data-fold style="${btn}">Hide</button></span></div><div data-body>`
    + Object.keys(MIX).map(k => `<div data-row="${k}" style="display:grid;grid-template-columns:104px 1fr 34px auto auto;gap:6px;align-items:center"><span>${NAMES[k]}</span><input type="range" min="0" max="${k === 'door' ? 1 : 2.5}" step="0.05" value="${MIX[k]}"><span data-v>${(+MIX[k]).toFixed(2)}</span>${k === 'master' || k === 'door' ? '<span></span><span></span>' : `<button data-m style="${btn}">M</button><button data-s style="${btn}">S</button>`}</div>`).join('')
    + `<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:6px">${[['depart', 'Departure'], ['arrive', 'Arrival'], ['latch', 'Door knock'], ['doorT', 'Door open/shut'], ['points', 'Points'], ['joints', 'Joint'], ['pass', 'Passing train']].map(([k, n]) => `<button data-play="${k}" style="${btn}">▶ ${n}</button>`).join('')}</div>`
    + `<div style="display:flex;gap:5px;margin-top:6px"><button data-reset style="${btn}">Reset</button><button data-copy style="${btn}">Copy levels</button></div><div data-now style="margin-top:6px;opacity:0.75"></div><textarea data-out readonly rows="2" style="width:100%;margin-top:4px;font:11px ui-monospace,monospace;background:oklch(0.12 0.01 260);color:inherit;border:0;border-radius:5px;display:none"></textarea></div>`;
  document.body.append(mx);
  const body = mx.querySelector('[data-body]'), outT = mx.querySelector('[data-out]');
  const putMix = () => { try { localStorage.setItem(MIXKEY, JSON.stringify(MIX)); } catch { /* storage is optional */ } applyMix(); };
  const paint = () => mx.querySelectorAll('[data-row]').forEach(r => {
    const k = r.dataset.row;
    r.querySelector('input').value = MIX[k];
    r.querySelector('[data-v]').textContent = (+MIX[k]).toFixed(2);
    const m = r.querySelector('[data-m]'), so = r.querySelector('[data-s]');
    if (m) m.style.background = MUTE.has(k) ? 'oklch(0.55 0.16 25)' : 'oklch(0.26 0.01 260)';
    if (so) so.style.background = SOLO.has(k) ? 'oklch(0.7 0.14 90)' : 'oklch(0.26 0.01 260)';
  });
  mx.addEventListener('input', e => { const r = e.target.closest('[data-row]'); if (!r) return; MIX[r.dataset.row] = +e.target.value; paint(); putMix(); });
  mx.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const r = b.closest('[data-row]'), k = r?.dataset.row;
    if (b.dataset.fold !== undefined) { const h = body.style.display === 'none'; body.style.display = h ? '' : 'none'; b.textContent = h ? 'Hide' : 'Show'; return; }
    if (b.dataset.m !== undefined) { MUTE.has(k) ? MUTE.delete(k) : MUTE.add(k); }
    if (b.dataset.s !== undefined) { SOLO.has(k) ? SOLO.delete(k) : SOLO.add(k); }
    if (b.dataset.reset !== undefined) { for (const n of Object.keys(MIX)) MIX[n] = 1; MUTE.clear(); SOLO.clear(); DOOR.hold = false; }
    if (b.dataset.copy !== undefined) { outT.style.display = ''; outT.value = JSON.stringify(MIX); outT.select(); navigator.clipboard?.writeText(outT.value).catch(() => {}); }
    // The one-shots play at once; they need the sound on and the clips loaded.
    const ac = kit.live();
    if (b.dataset.play && ac && clips) {
      const p = b.dataset.play;
      if (p === 'depart') cut(ac, clips.away, 0, 3.4, 1.0, 'depart', 0.2, 0.5);
      if (p === 'arrive') cut(ac, clips.stop, ARR0, 48.0, 0.8, 'arrive', 0.6, 0.6);
      if (p === 'latch') shot(ac, clips.thump, 0.14, 0, 0.005, 1.8, 'latch');
      if (p === 'doorT') { DOOR.hold = true; door(ac, !DOOR.open); }
      if (p === 'points') shot(ac, clips.points, 0.8, 0, 0.03, 1, 'points');
      if (p === 'joints') shot(ac, clips.joints, 0.55, 0, 0.03, 1, 'joints');
      if (p === 'pass') passBy(ac, 1.2, 3.5);
    }
    paint(); putMix(); wake();
  });
  const nowT = mx.querySelector('[data-now]');
  setInterval(() => { nowT.textContent = kit.live() ? (clips ? window.__rec || 'waiting for the first frame' : 'loading the clips') : 'Sound is off: turn it on, top right.'; }, 300);
}

/* ---------- start ---------- */
onReducedChange(() => wake());
whenVisible(stage, v => {
  visible = v;
  if (v) { if (ready) draw(); wake(); } else { cancelAnimationFrame(raf); raf = 0; lastT = 0; hush(); }
});
new ResizeObserver(() => resize()).observe(stage);
// Compile first, then draw the first composed frame inside the intro.
(async () => {
  resize(true);
  // Both scenes compile in parallel where the driver allows it.
  // A hidden tab never polls the compile, so a timeout caps the wait.
  if (renderer.extensions.has('KHR_parallel_shader_compile')) {
    await Promise.race([Promise.all([renderer.compileAsync(...S.outside), renderer.compileAsync(S.scene, S.camera)]), wait(4000)]);
  } else { renderer.compile(...S.outside); renderer.compile(S.scene, S.camera); }
  draw();
  // One finished frame folds the shader work into the intro.
  renderer.getContext().finish();
  ready = true;
  markReady();
  requestAnimationFrame(() => canvas.classList.add('on'));
  wake();
})().catch(err => { console.error(err); stage.querySelector('.fail').hidden = false; markReady(); });
</script>
</body>
</html>
