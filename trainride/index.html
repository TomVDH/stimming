.stage--trainride.dragging { cursor: grabbing; }
.stage--trainride canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--trainride canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--trainride canvas { transition: none; } }

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",

  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { initPage, whenVisible, reduced, onReducedChange, quality, pixelRatio, onQuality, audioKit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import { GLASS_RAIN } from '../shared/glassrain.js';
import { BOKEH } from '../shared/bokeh.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.trainride.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.trainride.${k}`, String(v)); } catch { /* storage is optional */ } };
const opts = {
  // The ride opens clear; Drift then moves the weather on by itself.
  mode: 'clear',
  drift: saved('drift') !== '0',
  express: saved('express') === '1',
  wet: saved('wet') || '1',
  speed: saved('speed') != null ? +saved('speed') : 0.6,
  time: saved('time') || 'night',
};
// QA can open a look with ?time=, ?mode= and ?x=; these are not saved.
const qs = new URLSearchParams(location.search);
if (qs.get('time')) opts.time = qs.get('time');
if (qs.get('mode')) opts.mode = qs.get('mode');
// The Speed slider maps to cruise speed in metres per second.
const cruise = v => v * 45;

/* ---------- scene ---------- */
// Train Ride: a mountain valley seen through one carriage window on a high viaduct.
// The outside renders to a target; one glass shader frames, fogs and wets it.
function build({ THREE }) {
let seed = 4242;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const range = (a, b) => a + (b - a) * rnd();

/* ---------- outside: the valley ---------- */
const out = new THREE.Scene();
const outCam = new THREE.PerspectiveCamera(50, 1, 1, 40000);
const outRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
// Catenary masts stand every 50 m between the tracks.
const NG = 16, NL = 6, LAMP_GAP = 50;
const { L: TILE, NT, b: TB } = ROUTE.meta;
const S0 = name => ROUTE.meta.stations.find(st => st[0] === name)[1];
// Three stretches: Lake Zurich, the Linth plain, the Walensee.
// Each weight is 0 to 1; the three always sum to 1.
const sstep = (a, b, t) => { t = Math.min(1, Math.max(0, (t - a) / (b - a))); return t * t * (3 - 2 * t); };
const SEG = [S0('Pfäffikon SZ'), S0('Altendorf') + 600, S0('Ziegelbrücke'), S0('Weesen') + 800];
const seg = x => {
  const s = ((x % TILE) + TILE) % TILE;
  const z = 1 - sstep(SEG[0], SEG[1], s) + sstep(TILE - 3000, TILE, s);
  const w = sstep(SEG[2], SEG[3], s) * (1 - sstep(TILE - 3000, TILE, s));
  return { z, l: Math.max(0, 1 - z - w), w };
};
// Route map rows: t runs left of the line, denser near it.
const jOf = t => (-8 + Math.sqrt(64 + 4 * TB * (Math.min(Math.max(t, -400), 18400) + 400))) / (2 * TB);
const townAt = (x, t) => {
  const i = Math.floor((((x % TILE) + TILE) % TILE) / TILE * ROUTE.w) % ROUTE.w, j = Math.round(jOf(t));
  return ROUTE.f[(j * ROUTE.w + i) * 2 + 1] / 250;
};
const f8 = v => v.toFixed(8);
const TAU = Math.PI * 2;

const NOISE = /* glsl */`
float hash1(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
vec2 hash2(vec2 p) { return vec2(hash1(p), hash1(p + 17.17)); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash1(i), hash1(i + vec2(1, 0)), u.x), mix(hash1(i + vec2(0, 1)), hash1(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
// Gradient noise, about -0.6 to 0.6, with no grid lines.
float gnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec2 ga = hash2(i) * 2.0 - 1.0, gb = hash2(i + vec2(1.0, 0.0)) * 2.0 - 1.0;
  vec2 gc = hash2(i + vec2(0.0, 1.0)) * 2.0 - 1.0, gd = hash2(i + vec2(1.0, 1.0)) * 2.0 - 1.0;
  return mix(mix(dot(ga, f), dot(gb, f - vec2(1.0, 0.0)), u.x), mix(dot(gc, f - vec2(0.0, 1.0)), dot(gd, f - vec2(1.0, 1.0)), u.x), u.y);
}
// Ridged noise: sharp crests and eroded flanks.
float ridged(vec2 p, int oct) {
  float s = 0.0, a = 0.5, w = 1.0;
  for (int i = 0; i < 7; i++) {
    if (i >= oct) break;
    float n = max(1.0 - abs(gnoise(p) * 1.8), 0.0);
    n *= n;
    s += a * n * w;
    w = clamp(n * 1.6, 0.0, 1.0);
    p = mat2(1.6, -1.2, 1.2, 1.6) * p + 7.3;
    a *= 0.5;
  }
  return s;
}`;

// Real ground from the route map: heights relative to the eye, a lake flag, town density.
const LAND = /* glsl */`
uniform sampler2D tH, tF;
vec2 rt(vec2 xz) {
  float t = clamp(-xz.y, -400.0, 18400.0);
  float j = (-8.0 + sqrt(64.0 + ${f8(4 * TB)} * (t + 400.0))) / ${f8(2 * TB)};
  return vec2(xz.x / ${f8(TILE)}, (j + 0.5) / ${NT}.0);
}
vec3 seg(float x) {
  float s = mod(x, ${f8(TILE)});
  float z = 1.0 - smoothstep(${f8(SEG[0])}, ${f8(SEG[1])}, s) + smoothstep(${f8(TILE - 3000)}, ${f8(TILE)}, s);
  float w = smoothstep(${f8(SEG[2])}, ${f8(SEG[3])}, s) * (1.0 - smoothstep(${f8(TILE - 3000)}, ${f8(TILE)}, s));
  return vec3(z, clamp(1.0 - z - w, 0.0, 1.0), w);
}
float wet(vec2 xz) { return textureLod(tF, rt(xz), 0.0).r; }
float town(vec2 xz) { return textureLod(tF, rt(xz), 0.0).g; }
// Distance outside the water, roughly in metres; negative on the water.
float shore(vec2 xz) { return (0.5 - wet(xz)) * 30.0; }
// oct above 4 adds relief finer than the 13 m elevation grid.
// Cubic B-spline height: four bilinear taps.
// Bilinear heights crease along the grid; the cubic keeps slopes smooth.
float hCubic(vec2 uv) {
  vec2 sz = vec2(${ROUTE.w}.0, ${ROUTE.ht}.0);
  vec2 tc = uv * sz - 0.5, f = fract(tc);
  tc -= f;
  vec2 f2 = f * f, f3 = f2 * f;
  vec2 w0 = (1.0 - 3.0 * f + 3.0 * f2 - f3) / 6.0, w1 = (4.0 - 6.0 * f2 + 3.0 * f3) / 6.0;
  vec2 w2 = (1.0 + 3.0 * f + 3.0 * f2 - 3.0 * f3) / 6.0, w3 = f3 / 6.0;
  vec2 s0 = w0 + w1, s1 = w2 + w3;
  vec2 p0 = (tc - 0.5 + w1 / s0) / sz, p1 = (tc + 1.5 + w3 / s1) / sz;
  return s0.y * (s0.x * textureLod(tH, p0, 0.0).r + s1.x * textureLod(tH, vec2(p1.x, p0.y), 0.0).r)
       + s1.y * (s0.x * textureLod(tH, vec2(p0.x, p1.y), 0.0).r + s1.x * textureLod(tH, p1, 0.0).r);
}
// Bilinear height: cheap, for shadow and mirror marches.
float landC(vec2 xz) { return textureLod(tH, rt(xz), 0.0).r; }
float landO(vec2 xz, int oct) {
  vec2 uv = rt(xz);
  float h = hCubic(uv);
  if (oct > 4) {
    float d = (1.0 - textureLod(tF, uv, 0.0).r) * smoothstep(20.0, 80.0, -xz.y);
    h += (gnoise(xz * 0.03) * 2.0 + gnoise(xz * 0.11) * 0.6) * d;
  }
  return h;
}
float land(vec2 xz) { return landO(xz, 7); }`;
// The road wanders beside the line; land, trees and poles all read it.
const ROAD = /* glsl */`
float roadZ(float x) { return -(68.0 + 24.0 * sin(x * 0.0011) + 9.0 * sin(x * 0.0047 + 1.3)); }
// The road runs in some 1300 m stretches; it narrows to nothing at each end.
float roadW(float x) {
  float f = fract(x / 1300.0);
  return step(0.45, hash1(vec2(floor(x / 1300.0), 3.0))) * smoothstep(0.0, 0.04, f) * smoothstep(1.0, 0.96, f);
}`;

// The route map: half-float heights, and a lake flag with town density.
const tH = new THREE.DataTexture(ROUTE.h, ROUTE.w, ROUTE.ht, THREE.RedFormat, THREE.HalfFloatType);
const tF = new THREE.DataTexture(ROUTE.f, ROUTE.w, ROUTE.ht, THREE.RGFormat, THREE.UnsignedByteType);
for (const t of [tH, tF]) { t.wrapS = THREE.RepeatWrapping; t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true; }
const OUTU = {
  tH: { value: tH },
  tF: { value: tF },
  uTime: { value: 0 },
  uMoon: { value: new THREE.Vector3(0.3, 0.2, -0.93).normalize() },
  // The sun stands beyond the window, low on the left, so it shines into the cabin.
  uSun: { value: new THREE.Vector3(-0.6, 0.36, -0.72).normalize() },
  uDay: { value: 0 },
  uGP: { value: Array.from({ length: NG }, () => new THREE.Vector4()) },
  uGC: { value: Array.from({ length: NG }, () => new THREE.Vector4()) },
  uLP: { value: Array.from({ length: NL }, () => new THREE.Vector4()) },
  uCamX: { value: 0 },
  uScale: { value: 1 },
  uSmear: { value: 0 },
  uRain: { value: 1 },
  // uPour is the rain in the air; above 1 it thickens the streaks.
  uPour: { value: 1 },
  uSpeed: { value: 0 },
  uView: { value: new THREE.Vector2(1, 1) },
  // x is the nearest platform's centre; y is its half length, 0 when none is near.
  uStn: { value: new THREE.Vector2() },
  tSign: { value: null },
  tSect: { value: null },
  // uHall is 1 under the Zurich HB hall; uIsl is 1 where an island platform stands behind.
  uHall: { value: 0 },
  uIsl: { value: 0 },
  // uOpp: the oncoming train's front x, its length, 1 while it runs, its smear in metres.
  uOpp: { value: new THREE.Vector4(0, 200, 0, 0) },
};

// Light, sky and haze for night and day; uDay blends the two.
const HAZE = /* glsl */`
uniform vec3 uMoon, uSun;
uniform float uDay, uRain;
uniform vec4 uGP[${NG}];
uniform vec4 uGC[${NG}];
// Day light: the sun and the blue sky; rain greys both.
vec3 sunC() { return vec3(1.0, 0.95, 0.86) * 3.2 * (1.0 - 0.85 * uRain); }
vec3 skyA(float ny) { return mix(vec3(0.25, 0.4, 0.75) * 0.55, vec3(0.45, 0.48, 0.52) * 0.75, uRain) * (0.55 + 0.45 * ny); }
vec3 skyCol(vec3 d) {
  float up = max(d.y, 0.0);
  // Night: deep blue, a glow round the moon, a far town low on the left.
  vec3 n = vec3(0.004, 0.006, 0.013) + vec3(0.02, 0.03, 0.05) * exp(-up * 9.0);
  float m = max(dot(d, uMoon), 0.0);
  n += vec3(0.25, 0.3, 0.38) * (pow(m, 200.0) * 0.4 + pow(m, 10.0) * 0.05);
  n += vec3(0.5, 0.22, 0.07) * 0.05 * exp(-up * 22.0) * pow(max(dot(normalize(d.xz + 1e-4), normalize(vec2(-0.7, -1.0))), 0.0), 6.0);
  // Day: pale at the horizon, deep blue overhead, bright round the sun.
  float s = max(dot(d, uSun), 0.0);
  vec3 dc = mix(vec3(0.55, 0.68, 0.88), vec3(0.08, 0.22, 0.6), pow(up, 0.4)) * 1.1;
  dc += vec3(1.0, 0.88, 0.7) * (pow(s, 6.0) * 0.18 + pow(s, 60.0) * 0.5);
  dc = mix(dc, vec3(0.42, 0.45, 0.5) * (0.75 + 0.35 * up), uRain * 0.85);
  return mix(n, dc, uDay);
}
float hazeAmt(vec3 P) {
  float dist = length(P - cameraPosition);
  // Night: valley haze with a 90 m scale height, and mist on the water.
  float k = 1.0 / 90.0, h0 = cameraPosition.y + 50.0, h1 = max(P.y + 50.0, 0.0), dh = h1 - h0;
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);
  float mist = smoothstep(0.0, -38.0, P.y) * smoothstep(100.0, 500.0, dist) * 0.1;
  float night = clamp(1.0 - exp(-dist * 0.0004 * avg - dist * (0.00001 + 0.00003 * uRain)) + mist, 0.0, 1.0);
  // Day: thin blue air with a 1.5 km scale height; rain thickens it.
  float kd = 1.0 / 1500.0, g0 = cameraPosition.y + 40.0, g1 = max(P.y + 40.0, 0.0), dg = g1 - g0;
  float avd = abs(dg) < 1.0 ? exp(-g0 * kd) : (exp(-g0 * kd) - exp(-g1 * kd)) / (dg * kd);
  float day = 1.0 - exp(-dist * (0.00005 + 0.00016 * uRain) * avd);
  return mix(night, day, uDay);
}
// Haze takes the horizon colour: warmed over each town at night, lit by the sun by day.
vec3 hazeCol(vec3 d, vec3 P) {
  vec3 hz = skyCol(normalize(vec3(d.x, max(d.y, 0.0) * 0.4 + 0.02, d.z)));
  vec3 n = hz * 0.7;
  if (uDay < 0.99) for (int i = 0; i < ${NG}; i++) n += uGC[i].rgb * uGP[i].w * 0.3 * exp(-length(P.xz - uGP[i].xz) / 110.0);
  vec3 dy = hz * 0.92 + vec3(1.0, 0.9, 0.75) * pow(max(dot(d, uSun), 0.0), 8.0) * 0.25 * (1.0 - uRain);
  return mix(n, dy, uDay);
}`;

/* Sky dome: stars and moonlit cloud by night, cumulus by day. */
// The dome follows the camera, so a long ride never leaves it.
const sky = (() => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(20000, 48, 24), new THREE.ShaderMaterial({
    uniforms: OUTU, side: THREE.BackSide, depthWrite: false,
    vertexShader: /* glsl */`varying vec3 vP; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: /* glsl */`
    varying vec3 vP;
    uniform float uTime;
    ${NOISE}
    ${HAZE}
    // Cloud density from a warped field on a flat sky plane.
    float cloud(vec2 p) { return fbm(p * 0.5 + fbm(p * 1.1) * 0.7); }
    void main() {
      vec3 d = normalize(vP - cameraPosition);
      vec3 c = skyCol(d);
      float night = 1.0 - uDay, m = dot(d, uMoon);
      // Stars: one in a few hundred cells of a sphere grid.
      if (night > 0.0 && d.y > 0.0) {
        vec3 sp = d * 260.0, ci = floor(sp), cf = fract(sp) - 0.5;
        float hs = hash1(ci.xy + ci.z * 7.31);
        float st = smoothstep(0.986, 1.0, hs) * exp(-dot(cf, cf) * 40.0);
        c += vec3(0.8, 0.86, 1.0) * st * night * (1.0 - 0.95 * uRain) * smoothstep(0.03, 0.25, d.y) * (0.8 + 0.2 * sin(uTime * 2.0 + hs * 90.0));
      }
      // The moon: a soft disc.
      c += vec3(0.9, 0.92, 1.0) * smoothstep(0.99982, 0.9999, m) * 1.1 * night;
      if (d.y > 0.0) {
        vec2 p = d.xz / (d.y + 0.06) * 2.2 + vec2(uTime * 0.006, 0.0);
        float base = cloud(p);
        // Rain closes the sky; day has more cloud than night.
        float cov = mix(mix(0.56, 0.47, uDay), 0.24, uRain);
        float cl = smoothstep(cov, cov + 0.2, base);
        // Day: tops lit toward the sun, grey bellies.
        vec2 ps = p + normalize(uSun.xz + 1e-4) * 0.12;
        float lit = clamp(0.55 + (base - cloud(ps)) * 5.0, 0.0, 1.0);
        vec3 dayC = mix(vec3(0.42, 0.48, 0.6), vec3(1.3, 1.26, 1.18), lit);
        dayC = mix(dayC, vec3(0.36, 0.38, 0.42), uRain * 0.8);
        // Night: dark cloud with a silver edge near the moon.
        float lm = pow(max(m, 0.0), 7.0);
        vec3 nightC = vec3(0.008, 0.01, 0.017) + vec3(0.5, 0.54, 0.65) * lm * (0.4 + 0.8 * (1.0 - cl));
        // Far cloud sinks into the haze at the horizon.
        c = mix(c, mix(nightC, dayC, uDay), cl * 0.95 * smoothstep(0.0, 0.12, d.y));
      }
      gl_FragColor = vec4(c, 1.0);
    }`,
  }));
  m.renderOrder = -1;
  m.frustumCulled = false;
  out.add(m);
  return m;
})();

/* Terrain: rows widen and thin with distance, out to 18 km. */
// Each row snaps to its own spacing, so the land never swims.
const terrain = (() => {
  const N = 420, M = 360, Z0 = 2, Z1 = 18000;
  const pos = new Float32Array((N + 1) * (M + 1) * 3);
  let k = 0;
  for (let j = 0; j <= M; j++) {
    const t = j / M, z = -(Z0 + 380 * t + (Z1 - Z0 - 380) * t ** 3);
    const dx = 2 * (150 - z * 1.7) / N;
    // position holds the column index, the row's z and the row's spacing.
    for (let i = 0; i <= N; i++) { pos[k++] = i - N / 2; pos[k++] = z; pos[k++] = dx; }
  }
  const idx = new Uint32Array(N * M * 6);
  k = 0;
  for (let j = 0; j < M; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i, b = a + N + 1;
    idx.set([a, a + 1, b, a + 1, b + 1, b], k);
    k += 6;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
})();
const land = new THREE.Mesh(terrain, new THREE.ShaderMaterial({
  uniforms: OUTU,
  vertexShader: /* glsl */`
  uniform float uCamX, uDay;
  uniform vec3 uSun;
  varying vec3 vP, vN;
  ${NOISE}
  ${LAND}
  void main() {
    float dx = position.z;
    vec3 w = vec3((floor(uCamX / dx) + position.x) * dx, 0.0, position.y);
    w.y = land(w.xz);
    // Far rows sit up to 30 m apart; a cliff between two rows would show as teeth.
    // Five taps over the row's footprint turn that step into an even slope.
    if (dx > 6.0) {
      float a = dx * 0.5, b = dx * 0.9;
      w.y = w.y * 0.4 + 0.15 * (land(w.xz + vec2(a, 0.0)) + land(w.xz - vec2(a, 0.0)) + land(w.xz + vec2(0.0, b)) + land(w.xz - vec2(0.0, b)));
    }
    float e = max(dx * 0.5, 1.0);

  const geo = joinParts([
    [new THREE.BoxGeometry(0.12, 1.2, 0.12).translate(0, 0.5, 0), 0],

}
{
  // Round bales in white wrap, in loose groups on the flat meadow.
  const BP = 2000, n = PW * 16, d = new Float32Array(n * 4);

  vec4 place(vec4 a) {

  const geo = joinParts([[new THREE.CylinderGeometry(0.66, 0.66, 1.25, 16).rotateZ(Math.PI / 2).translate(0, 0.6, 0), 0]]);
  propMesh(geo, bales, /* glsl */`
  void main() {

{

  vec4 place(vec4 a) {

  const geo = joinParts([
    [new THREE.CylinderGeometry(0.11, 0.15, 9.6, 6).translate(0, 4.6, 0), 0],

  void main() {

  void main() {

  const SEGS = 16, P = [], N = [], T = [];

  varying float vA;
  void main() {

// The carriage's lit panes throw warm light out onto the rain and the parapet.
// They fade by day.
const TRAIN = /* glsl */`
uniform float uCamX;
const vec3 LAMPC = vec3(1.0, 0.8, 0.58);
float trainLight(vec3 P) {
  // Panes repeat every 2.4 m along the train; each is 1.5 m wide.
  float f = abs(fract((P.x - uCamX) / 2.4 + 0.5) - 0.5) * 2.4;
  float d = max(-P.z, 0.0);
  // With distance the pane edges blur into a band.
  float pane = mix(smoothstep(0.85, 0.65, f), 0.62, smoothstep(0.0, 9.0, d) * 0.7);
  float band = smoothstep(0.6 + d * 0.7, 0.3 + d * 0.4, abs(P.y - 0.05));
  return pane * band / (1.0 + d * d * 0.3);
}`;

/* The viaduct: a concrete parapet below the window. */

  ${HAZE}
  uniform vec2 uStn;
  void main() {

    vec3 c = vec3(0.004, 0.005, 0.007) + vec3(1.0, 0.66, 0.36) * trainLight(vP) * 0.05;
    for (int i = 0; i < ${NL}; i++) {

    float joint = (1.0 - smoothstep(0.0, 0.02 + uSmear * 0.5, j)) * 0.04 / (0.04 + uSmear);
    vec3 alb = vec3(0.3, 0.29, 0.27) * (0.85 + 0.3 * vnoise(vec2(vP.x * 0.4, vP.y * 9.0))) * (1.0 - 0.6 * joint);

}));
parapet.frustumCulled = false;
// The parapet stays out: the line now runs on an embankment beside a second track.

/* Lamp posts every 28 m: a steel post, a slim head, an LED bar and its beam. */
// Each part is a quad that the shader smears by the train speed.
// uSmear is the travel in metres during one frame's shutter.
const LAMPS = 9;
const lampX = new Float32Array(LAMPS), lampK = new Float32Array(LAMPS).fill(1);
const lampAttrs = [];
const QF = /* glsl */`
uniform float uSmear;
varying vec2 vL;
varying vec3 vW;
varying float vK;
${TRAIN}
${HAZE}`;
function strip(geo, w, cy, add, order, frag) {
  const g = new THREE.InstancedBufferGeometry().copy(geo);
  g.instanceCount = LAMPS;
  for (const [name, arr] of [['aX', lampX], ['aK', lampK]]) {
    const a = new THREE.InstancedBufferAttribute(arr, 1).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute(name, a);
    lampAttrs.push(a);
  }
  const m = new THREE.Mesh(g, new THREE.ShaderMaterial({
    uniforms: OUTU,
    transparent: true, depthWrite: false, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending,
    vertexShader: /* glsl */`
    attribute float aX, aK;
    uniform float uSmear;
    varying vec2 vL;
    varying vec3 vW;
    varying float vK;
    void main() {

      // The local quad is 1 m wide; it stretches by the smear.
      p.x *= ${w.toFixed(3)} + uSmear;
      vL = vec2(p.x, p.y - ${cy.toFixed(3)});
      vK = aK;
      vec4 w = modelMatrix * vec4(p + vec3(aX, 0.0, 0.0), 1.0);
      vW = w.xyz;
      gl_Position = projectionMatrix * viewMatrix * w;

    fragmentShader: QF + frag,

  m.renderOrder = order;

// A box shape convolved with the motion box: a trapezoid of cover.
const COVER = w => /* glsl */`clamp((${w} + uSmear + 0.001 - abs(vL.x) * 2.0) / (2.0 * uSmear + 0.002), 0.0, 1.0) * min(1.0, ${w} / (uSmear + 0.001))`;
strip(new THREE.PlaneGeometry(1, 7.4).translate(0, 1.1, -2.8), 0.34, 1.1, false, 3, /* glsl */`
void main() {

  float cov = pow(${COVER('0.34')}, 0.55);

  float fl = mix(smoothstep(0.1, 0.14, abs(vL.x)), 0.5, smoothstep(0.02, 0.15, uSmear));
  float k = max(vK, 0.0);
  vec3 cn = vec3(0.003, 0.003, 0.004) + vec3(1.0, 0.66, 0.36) * trainLight(vW) * 0.03;
  cn += LAMPC * k * 0.06 * exp(-max(0.1 - vW.y, 0.0) * 1.5) * step(vW.y, 0.23);
  vec3 N = normalize(vec3(clamp(vL.x / (0.17 + uSmear * 0.5), -1.0, 1.0), 0.0, 1.0));

  vec3 cd = vec3(0.05, 0.052, 0.055) * (sunC() * max(dot(N, uSun), 0.0) + skyA(0.0) * 0.8);

void main() {

  float cov = ${COVER('0.5')} * (1.0 - smoothstep(0.034, 0.044, abs(vL.y))) * step(-0.5, vK);
  // The lower lip catches its own glow; by day the top catches the sun.

  vec3 cd = vec3(0.08, 0.085, 0.09) * (sunC() * uSun.y * smoothstep(-0.02, 0.03, vL.y) + skyA(0.5));

strip(new THREE.PlaneGeometry(1, 2.2).translate(0, -1.0, -2.68), 3.2, -1.0, true, 4, /* glsl */`

  float y = 0.1 - vW.y;
  float spread = 0.2 + y * 0.42, sx2 = spread * spread + uSmear * uSmear * 0.12;
  float beam = exp(-vL.x * vL.x / sx2) * spread / sqrt(sx2);

  beam *= smoothstep(1.6 + uSmear * 0.5, 1.1 + uSmear * 0.5, abs(vL.x));

strip(new THREE.PlaneGeometry(1, 1.0).translate(0, 0.1, -2.67), 1.6, 0.1, true, 4, /* glsl */`
void main() {
  // The LED bar under the head: a thin hot line with a soft halo.
  float dx = max(abs(vL.x) - 0.22 - uSmear * 0.5, 0.0), dy = vL.y;
  float core = exp(-dx * dx / 0.0003 - dy * dy / 0.0001);
  float r2 = dx * dx + dy * dy;
  float halo = (exp(-r2 / 0.02) * 0.12 + exp(-r2 / 0.12) * 0.02) * smoothstep(0.5, 0.35, abs(dy)) * smoothstep(0.8, 0.6, dx);

/* Station platforms: a wet slab, a canopy on columns, masts, a fence, benches and the name signs. */
// One platform moves to whichever station is nearest.
// Its parts sit in platform space: x = 0 is the station's centre.
const PL = 320, CAN = 70, SIGNS = 7;
// Station light at night: two LED strips under the canopy, then masts on the open ends.
const STNL = /* glsl */`
uniform vec2 uStn;
uniform float uHall, uIsl;
const vec3 STNC = vec3(0.84, 0.92, 1.0);
const vec3 HALLC = vec3(1.0, 0.9, 0.76);
const vec3 MASTC = vec3(1.0, 0.82, 0.6);
// x is along the platform from its centre.
float canopyAt(float x) { return smoothstep(${CAN + 2}.0, ${CAN - 4}.0, abs(x)); }
vec3 stnLight(vec3 P, vec3 N) {
  if (uStn.y <= 0.0 || uDay > 0.999) return vec3(0.0);
  float x = P.x - uStn.x;
  // Under the hall roof, a field of lamps gives even, warm light.
  if (uHall > 0.5) return HALLC * 0.8 * (0.3 + 0.7 * max(N.y, 0.0)) * smoothstep(215.0, 190.0, abs(x)) * (1.0 - uDay);
  vec3 c = vec3(0.0);
  // The canopy strips run along z = -3.6 and z = -8.4, under the roof.
  // An island platform adds two more strips behind.
  float inC = canopyAt(x);
  for (int i = 0; i < 4; i++) {
    if (i > 1 && uIsl < 0.5) break;
    vec3 L = vec3(0.0, 1.32 - P.y, (i == 0 ? -3.6 : i == 1 ? -8.4 : i == 2 ? -16.6 : -20.6) - P.z);
    float d2 = dot(L, L);
    c += STNC * 3.5 * inC * max(dot(N, L * inversesqrt(d2)) * 0.8 + 0.2, 0.0) / (d2 + 1.5);
  }
  // Beyond the canopy, a mast every 24 m lights the open platform.
  float mx = (floor(x / 24.0) + 0.5) * 24.0;
  for (int i = -1; i <= 1; i++) {
    float lx = mx + float(i) * 24.0;
    if (abs(lx) < ${CAN}.0 || abs(lx) > ${PL / 2}.0) continue;
    vec3 L = vec3(lx - x, 2.3 - P.y, -6.0 - P.z);
    float d2 = dot(L, L);
    c += MASTC * 5.0 * max(dot(N, L * inversesqrt(d2)) * 0.8 + 0.2, 0.0) / (d2 + 1.5);
  }
  return c * (1.0 - uDay);
}`;
const worldVS = /* glsl */`
varying vec3 vP;
varying vec3 vN;
void main() {
  mat4 m = modelMatrix;
  #ifdef USE_INSTANCING
  m = m * instanceMatrix;
  #endif
  vec4 w = m * vec4(position, 1.0);
  vP = w.xyz;
  vN = normalize(mat3(m) * normal);
  gl_Position = projectionMatrix * viewMatrix * w;
}`;
// A lit solid: the fragment sets alb (and may add glow) from vP and N.
const solid = body => new THREE.ShaderMaterial({
  uniforms: OUTU,
  vertexShader: worldVS,
  fragmentShader: /* glsl */`
  varying vec3 vP;
  varying vec3 vN;
  uniform vec4 uLP[${NL}];
  uniform float uSmear, uTime;
  ${NOISE}
  ${TRAIN}
  ${HAZE}
  ${STNL}
  void main() {
    vec3 N = normalize(vN);
    vec3 V = normalize(vP - cameraPosition);
    float x = vP.x - uStn.x;
    vec3 alb = vec3(0.1), glow = vec3(0.0);
    float shade = 1.0;
    ${body}
    vec3 night = vec3(0.008, 0.009, 0.012) + vec3(1.0, 0.66, 0.36) * trainLight(vP) * 0.06 + stnLight(vP, N);
    for (int i = 0; i < ${NL}; i++) {
      vec3 L = uLP[i].xyz - vP;
      float d = length(L);
      night += LAMPC * uLP[i].w * 3.0 / (d * d + 1.0) * max(dot(N, L / d) * 0.8 + 0.2, 0.0);
    }
    // Station day light, Pixar-lite: a wrapped sun and a strong sky fill with a warm bounce.
    float wrapS = clamp((dot(N, uSun) + 0.3) / 1.3, 0.0, 1.0);
    vec3 day = sunC() * wrapS * wrapS * shade + skyA(N.y) * 1.15 + sunC() * vec3(0.08, 0.07, 0.055);
    gl_FragColor = vec4(alb * mix(night, day, uDay) + glow, 1.0);
  }`,
});
const platform = new THREE.Group();
out.add(platform);
// The slab: coping, a white safety line, a tactile strip, then wet asphalt.
platform.add(new THREE.Mesh(new THREE.BoxGeometry(PL, 0.6, 9.8).translate(0, -2.2, -6.2), solid(/* glsl */`
  float dz = -1.3 - vP.z;

    float j = (0.5 - abs(fract(x) - 0.5));

    stn.textContent = `${n} ${d < 50 ? '' : `${(d / 1000).toFixed(1)} km`}`;
    vel.textContent = `${Math.round(S.speed * 3.6)} km/h`;
  };
  setInterval(show, 200);
  show();
}

/* ---------- start ---------- */
onReducedChange(() => wake());
whenVisible(stage, v => {
  visible = v;
  if (v) { if (ready) draw(); wake(); } else { cancelAnimationFrame(raf); raf = 0; lastT = 0; hush(); }
});
new ResizeObserver(() => resize()).observe(stage);
// Compile first, then draw the first composed frame inside the intro.
(async () => {
  resize(true);
  // Both scenes compile in parallel where the driver allows it.
  // A hidden tab never polls the compile, so a timeout caps the wait.
  if (renderer.extensions.has('KHR_parallel_shader_compile')) {
    await Promise.race([Promise.all([renderer.compileAsync(...S.outside), renderer.compileAsync(S.scene, S.camera)]), wait(4000)]);
  } else { renderer.compile(...S.outside); renderer.compile(S.scene, S.camera); }
  draw();
  // One finished frame folds the shader work into the intro.
  renderer.getContext().finish();
  ready = true;
  markReady();
  requestAnimationFrame(() => canvas.classList.add('on'));
  wake();
})().catch(err => { console.error(err); stage.querySelector('.fail').hidden = false; markReady(); });
</script>
</body>
</html>
