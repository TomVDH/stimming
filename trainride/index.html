.stage--trainride { cursor: grab; touch-action: none; }
.stage--trainride.dragging { cursor: grabbing; }
.stage--trainride canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease;
}
.stage--trainride canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--trainride canvas { transition: none; } }

<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Train Ride</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--trainride" id="stage" tabindex="0" role="application" aria-label="A mountain valley by night or by day, seen through a carriage window on a high viaduct. Rain runs back along the glass as the train goes. Drag to lean and peer along the valley; scroll or pinch to lean against the glass.">
      <p class="fail" hidden>Train Ride needs WebGL2, which this browser has turned off.</p>
    </div>
  </main>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { initPage, whenVisible, reduced, onReducedChange, quality, pixelRatio, onQuality, audioKit } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
import { GLASS_RAIN } from '../shared/glassrain.js';
import { BOKEH } from '../shared/bokeh.js';

const wait = ms => new Promise(r => setTimeout(r, ms));
let markReady;
const firstFrame = new Promise(r => (markReady = r));
// The intro holds until the page, the font and the first frame are ready.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, Promise.race([firstFrame, wait(6000)])]) });

/* ---------- settings ---------- */
// Settings persist per browser; storage is optional.
const saved = k => { try { return localStorage.getItem(`stimming.trainride.${k}`); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(`stimming.trainride.${k}`, String(v)); } catch { /* storage is optional */ } };
const opts = {
  // The weather is new on every load: rain most often, clear least.
  mode: ['drizzle', 'rain', 'rain', 'downpour', 'mist', 'fog', 'clear'][Math.floor(Math.random() * 7)],
  drift: saved('drift') !== '0',
  express: saved('express') === '1',
  wet: saved('wet') || '1',
  speed: saved('speed') != null ? +saved('speed') : 0.6,
  time: saved('time') || 'night',
};
// QA can open a look with ?time=, ?mode= and ?x=; these are not saved.
const qs = new URLSearchParams(location.search);
if (qs.get('time')) opts.time = qs.get('time');
if (qs.get('mode')) opts.mode = qs.get('mode');
// The Speed slider maps to cruise speed in metres per second.
const cruise = v => v * 45;

/* ---------- scene ---------- */
// Train Ride: a mountain valley seen through one carriage window on a high viaduct.
// The outside renders to a target; one glass shader frames, fogs and wets it.
function build({ THREE }) {
let seed = 4242;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const range = (a, b) => a + (b - a) * rnd();

/* ---------- outside: the valley ---------- */
const out = new THREE.Scene();
const outCam = new THREE.PerspectiveCamera(50, 1, 1, 40000);
const outRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const NG = 16, NL = 6, LAMP_GAP = 28;
const { L: TILE, NT, b: TB } = ROUTE.meta;
const S0 = name => ROUTE.meta.stations.find(st => st[0] === name)[1];
// Three stretches: Lake Zurich, the Linth plain, the Walensee.
// Each weight is 0 to 1; the three always sum to 1.
const sstep = (a, b, t) => { t = Math.min(1, Math.max(0, (t - a) / (b - a))); return t * t * (3 - 2 * t); };
const SEG = [S0('Pfäffikon SZ'), S0('Altendorf') + 600, S0('Ziegelbrücke'), S0('Weesen') + 800];
const seg = x => {
  const s = ((x % TILE) + TILE) % TILE;
  const z = 1 - sstep(SEG[0], SEG[1], s) + sstep(TILE - 3000, TILE, s);
  const w = sstep(SEG[2], SEG[3], s) * (1 - sstep(TILE - 3000, TILE, s));
  return { z, l: Math.max(0, 1 - z - w), w };
};
// Route map rows: t runs left of the line, denser near it.
const jOf = t => (-8 + Math.sqrt(64 + 4 * TB * (Math.min(Math.max(t, -400), 18400) + 400))) / (2 * TB);
const townAt = (x, t) => {
  const i = Math.floor((((x % TILE) + TILE) % TILE) / TILE * ROUTE.w) % ROUTE.w, j = Math.round(jOf(t));
  return ROUTE.f[(j * ROUTE.w + i) * 2 + 1] / 250;
};
const f8 = v => v.toFixed(8);
const TAU = Math.PI * 2;

const NOISE = /* glsl */`
float hash1(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
vec2 hash2(vec2 p) { return vec2(hash1(p), hash1(p + 17.17)); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash1(i), hash1(i + vec2(1, 0)), u.x), mix(hash1(i + vec2(0, 1)), hash1(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
// Gradient noise, about -0.6 to 0.6, with no grid lines.
float gnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec2 ga = hash2(i) * 2.0 - 1.0, gb = hash2(i + vec2(1.0, 0.0)) * 2.0 - 1.0;
  vec2 gc = hash2(i + vec2(0.0, 1.0)) * 2.0 - 1.0, gd = hash2(i + vec2(1.0, 1.0)) * 2.0 - 1.0;
  return mix(mix(dot(ga, f), dot(gb, f - vec2(1.0, 0.0)), u.x), mix(dot(gc, f - vec2(0.0, 1.0)), dot(gd, f - vec2(1.0, 1.0)), u.x), u.y);
}
// Ridged noise: sharp crests and eroded flanks.
float ridged(vec2 p, int oct) {
  float s = 0.0, a = 0.5, w = 1.0;
  for (int i = 0; i < 7; i++) {
    if (i >= oct) break;
    float n = max(1.0 - abs(gnoise(p) * 1.8), 0.0);
    n *= n;
    s += a * n * w;
    w = clamp(n * 1.6, 0.0, 1.0);
    p = mat2(1.6, -1.2, 1.2, 1.6) * p + 7.3;
    a *= 0.5;
  }
  return s;
}`;

// Real ground from the route map: heights relative to the eye, a lake flag, town density.
const LAND = /* glsl */`
uniform sampler2D tH, tF;
vec2 rt(vec2 xz) {
  float t = clamp(-xz.y, -400.0, 18400.0);
  float j = (-8.0 + sqrt(64.0 + ${f8(4 * TB)} * (t + 400.0))) / ${f8(2 * TB)};
  return vec2(xz.x / ${f8(TILE)}, (j + 0.5) / ${NT}.0);
}
vec3 seg(float x) {
  float s = mod(x, ${f8(TILE)});
  float z = 1.0 - smoothstep(${f8(SEG[0])}, ${f8(SEG[1])}, s) + smoothstep(${f8(TILE - 3000)}, ${f8(TILE)}, s);
  float w = smoothstep(${f8(SEG[2])}, ${f8(SEG[3])}, s) * (1.0 - smoothstep(${f8(TILE - 3000)}, ${f8(TILE)}, s));
  return vec3(z, clamp(1.0 - z - w, 0.0, 1.0), w);
}
float wet(vec2 xz) { return textureLod(tF, rt(xz), 0.0).r; }
float town(vec2 xz) { return textureLod(tF, rt(xz), 0.0).g; }
// Distance outside the water, roughly in metres; negative on the water.
float shore(vec2 xz) { return (0.5 - wet(xz)) * 30.0; }
// oct above 4 adds relief finer than the 13 m elevation grid.
float landO(vec2 xz, int oct) {
  vec2 uv = rt(xz);
  float h = textureLod(tH, uv, 0.0).r;
  if (oct > 4) {
    float d = (1.0 - textureLod(tF, uv, 0.0).r) * smoothstep(20.0, 80.0, -xz.y);
    h += (gnoise(xz * 0.03) * 2.0 + gnoise(xz * 0.11) * 0.6) * d;
  }
  return h;
}
float land(vec2 xz) { return landO(xz, 7); }`;

// The route map: half-float heights, and a lake flag with town density.
const tH = new THREE.DataTexture(ROUTE.h, ROUTE.w, ROUTE.ht, THREE.RedFormat, THREE.HalfFloatType);
const tF = new THREE.DataTexture(ROUTE.f, ROUTE.w, ROUTE.ht, THREE.RGFormat, THREE.UnsignedByteType);
for (const t of [tH, tF]) { t.wrapS = THREE.RepeatWrapping; t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true; }
const OUTU = {
  tH: { value: tH },
  tF: { value: tF },
  uTime: { value: 0 },
  uMoon: { value: new THREE.Vector3(0.3, 0.2, -0.93).normalize() },
  uSun: { value: new THREE.Vector3(-0.55, 0.5, 0.67).normalize() },
  uDay: { value: 0 },
  uGP: { value: Array.from({ length: NG }, () => new THREE.Vector4()) },
  uGC: { value: Array.from({ length: NG }, () => new THREE.Vector4()) },
  uLP: { value: Array.from({ length: NL }, () => new THREE.Vector4()) },
  uCamX: { value: 0 },
  uScale: { value: 1 },
  uSmear: { value: 0 },
  uRain: { value: 1 },
  // uPour is the rain in the air; above 1 it thickens the streaks.
  uPour: { value: 1 },
  uSpeed: { value: 0 },
  uView: { value: new THREE.Vector2(1, 1) },
  // x is the nearest platform's centre; y is its half length, 0 when none is near.
  uStn: { value: new THREE.Vector2() },
  tSign: { value: null },
  tSect: { value: null },
  // uHall is 1 under the Zurich HB hall; uIsl is 1 where an island platform stands behind.
  uHall: { value: 0 },
  uIsl: { value: 0 },
};

// Light, sky and haze for night and day; uDay blends the two.
const HAZE = /* glsl */`
uniform vec3 uMoon, uSun;
uniform float uDay, uRain;
uniform vec4 uGP[${NG}];
uniform vec4 uGC[${NG}];
// Day light: the sun and the blue sky; rain greys both.
vec3 sunC() { return vec3(1.0, 0.95, 0.86) * 3.2 * (1.0 - 0.85 * uRain); }
vec3 skyA(float ny) { return mix(vec3(0.25, 0.4, 0.75) * 0.55, vec3(0.45, 0.48, 0.52) * 0.75, uRain) * (0.55 + 0.45 * ny); }
vec3 skyCol(vec3 d) {
  float up = max(d.y, 0.0);
  // Night: deep blue, a glow round the moon, a far town low on the left.
  vec3 n = vec3(0.004, 0.006, 0.013) + vec3(0.02, 0.03, 0.05) * exp(-up * 9.0);
  float m = max(dot(d, uMoon), 0.0);
  n += vec3(0.25, 0.3, 0.38) * (pow(m, 200.0) * 0.4 + pow(m, 10.0) * 0.05);
  n += vec3(0.5, 0.22, 0.07) * 0.05 * exp(-up * 22.0) * pow(max(dot(normalize(d.xz + 1e-4), normalize(vec2(-0.7, -1.0))), 0.0), 6.0);
  // Day: pale at the horizon, deep blue overhead, bright round the sun.
  float s = max(dot(d, uSun), 0.0);
  vec3 dc = mix(vec3(0.55, 0.68, 0.88), vec3(0.08, 0.22, 0.6), pow(up, 0.4)) * 1.1;
  dc += vec3(1.0, 0.88, 0.7) * (pow(s, 6.0) * 0.18 + pow(s, 60.0) * 0.5);
  dc = mix(dc, vec3(0.42, 0.45, 0.5) * (0.75 + 0.35 * up), uRain * 0.85);
  return mix(n, dc, uDay);
}
float hazeAmt(vec3 P) {
  float dist = length(P - cameraPosition);
  // Night: valley haze with a 90 m scale height, and mist on the water.
  float k = 1.0 / 90.0, h0 = cameraPosition.y + 50.0, h1 = max(P.y + 50.0, 0.0), dh = h1 - h0;
  float avg = abs(dh) < 0.01 ? exp(-h0 * k) : (exp(-h0 * k) - exp(-h1 * k)) / (dh * k);
  float mist = smoothstep(0.0, -38.0, P.y) * smoothstep(100.0, 500.0, dist) * 0.1;
  float night = clamp(1.0 - exp(-dist * 0.0004 * avg - dist * (0.00001 + 0.00003 * uRain)) + mist, 0.0, 1.0);
  // Day: thin blue air with a 1.5 km scale height; rain thickens it.
  float kd = 1.0 / 1500.0, g0 = cameraPosition.y + 40.0, g1 = max(P.y + 40.0, 0.0), dg = g1 - g0;
  float avd = abs(dg) < 1.0 ? exp(-g0 * kd) : (exp(-g0 * kd) - exp(-g1 * kd)) / (dg * kd);
  float day = 1.0 - exp(-dist * (0.00005 + 0.00016 * uRain) * avd);
  return mix(night, day, uDay);
}
// Haze takes the horizon colour: warmed over each town at night, lit by the sun by day.
vec3 hazeCol(vec3 d, vec3 P) {
  vec3 hz = skyCol(normalize(vec3(d.x, max(d.y, 0.0) * 0.4 + 0.02, d.z)));
  vec3 n = hz * 0.7;
  if (uDay < 0.99) for (int i = 0; i < ${NG}; i++) n += uGC[i].rgb * uGP[i].w * 0.3 * exp(-length(P.xz - uGP[i].xz) / 110.0);
  vec3 dy = hz * 0.92 + vec3(1.0, 0.9, 0.75) * pow(max(dot(d, uSun), 0.0), 8.0) * 0.25 * (1.0 - uRain);
  return mix(n, dy, uDay);
}`;

/* Sky dome: stars and moonlit cloud by night, cumulus by day. */
// The dome follows the camera, so a long ride never leaves it.
const sky = (() => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(20000, 48, 24), new THREE.ShaderMaterial({
    uniforms: OUTU, side: THREE.BackSide, depthWrite: false,
    vertexShader: /* glsl */`varying vec3 vP; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: /* glsl */`
    varying vec3 vP;
    uniform float uTime;
    ${NOISE}
    ${HAZE}
    // Cloud density from a warped field on a flat sky plane.
    float cloud(vec2 p) { return fbm(p * 0.5 + fbm(p * 1.1) * 0.7); }
    void main() {
      vec3 d = normalize(vP - cameraPosition);
      vec3 c = skyCol(d);
      float night = 1.0 - uDay, m = dot(d, uMoon);
      // Stars: one in a few hundred cells of a sphere grid.
      if (night > 0.0 && d.y > 0.0) {
        vec3 sp = d * 260.0, ci = floor(sp), cf = fract(sp) - 0.5;
        float hs = hash1(ci.xy + ci.z * 7.31);
        float st = smoothstep(0.986, 1.0, hs) * exp(-dot(cf, cf) * 40.0);
        c += vec3(0.8, 0.86, 1.0) * st * night * (1.0 - 0.95 * uRain) * smoothstep(0.03, 0.25, d.y) * (0.8 + 0.2 * sin(uTime * 2.0 + hs * 90.0));
      }
      // The moon: a soft disc.
      c += vec3(0.9, 0.92, 1.0) * smoothstep(0.99982, 0.9999, m) * 1.1 * night;
      if (d.y > 0.0) {
        vec2 p = d.xz / (d.y + 0.06) * 2.2 + vec2(uTime * 0.006, 0.0);
        float base = cloud(p);
        // Rain closes the sky; day has more cloud than night.
        float cov = mix(mix(0.56, 0.47, uDay), 0.24, uRain);
        float cl = smoothstep(cov, cov + 0.2, base);
        // Day: tops lit toward the sun, grey bellies.
        vec2 ps = p + normalize(uSun.xz + 1e-4) * 0.12;
        float lit = clamp(0.55 + (base - cloud(ps)) * 5.0, 0.0, 1.0);
        vec3 dayC = mix(vec3(0.42, 0.48, 0.6), vec3(1.3, 1.26, 1.18), lit);
        dayC = mix(dayC, vec3(0.36, 0.38, 0.42), uRain * 0.8);
        // Night: dark cloud with a silver edge near the moon.
        float lm = pow(max(m, 0.0), 7.0);
        vec3 nightC = vec3(0.008, 0.01, 0.017) + vec3(0.5, 0.54, 0.65) * lm * (0.4 + 0.8 * (1.0 - cl));
        // Far cloud sinks into the haze at the horizon.
        c = mix(c, mix(nightC, dayC, uDay), cl * 0.95 * smoothstep(0.0, 0.12, d.y));
      }
      gl_FragColor = vec4(c, 1.0);
    }`,
  }));
  m.renderOrder = -1;
  m.frustumCulled = false;
  out.add(m);
  return m;
})();

/* Terrain: rows widen and thin with distance, out to 18 km. */
// Each row snaps to its own spacing, so the land never swims.
const terrain = (() => {
  const N = 420, M = 360, Z0 = 2, Z1 = 18000;
  const pos = new Float32Array((N + 1) * (M + 1) * 3);
  let k = 0;
  for (let j = 0; j <= M; j++) {
    const t = j / M, z = -(Z0 + 380 * t + (Z1 - Z0 - 380) * t ** 3);
    const dx = 2 * (150 - z * 1.7) / N;
    // position holds the column index, the row's z and the row's spacing.
    for (let i = 0; i <= N; i++) { pos[k++] = i - N / 2; pos[k++] = z; pos[k++] = dx; }
  }
  const idx = new Uint32Array(N * M * 6);
  k = 0;
  for (let j = 0; j < M; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i, b = a + N + 1;
    idx.set([a, a + 1, b, a + 1, b + 1, b], k);
    k += 6;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
})();
const land = new THREE.Mesh(terrain, new THREE.ShaderMaterial({
  uniforms: OUTU,
  vertexShader: /* glsl */`
  uniform float uCamX, uDay;
  uniform vec3 uSun;
  varying vec3 vP, vN;
  varying float vSh;
  ${NOISE}
  ${LAND}
  void main() {
    float dx = position.z;
    vec3 w = vec3((floor(uCamX / dx) + position.x) * dx, 0.0, position.y);
    w.y = land(w.xz);
    float e = max(dx * 0.5, 1.0);
    vN = normalize(vec3(w.y - land(w.xz + vec2(e, 0.0)), e, w.y - land(w.xz + vec2(0.0, e))));
    // By day a short march toward the sun gives soft terrain shadows.
    vSh = 1.0;
    if (uDay > 0.01) {
      float t = 20.0;
      for (int i = 0; i < 11; i++) {
        vec3 q = w + uSun * t;
        vSh = min(vSh, clamp(6.0 * (q.y - landO(q.xz, 4)) / t + 0.5, 0.0, 1.0));
        t *= 1.75;
      }
    }
    vP = w;
    gl_Position = projectionMatrix * viewMatrix * vec4(w, 1.0);
  }`,
  fragmentShader: /* glsl */`
  varying vec3 vP, vN;
  varying float vSh;
  uniform float uTime;
  ${NOISE}
  ${LAND}
  ${HAZE}
  void main() {
    vec3 V = normalize(cameraPosition - vP);
    float dist = length(cameraPosition - vP);
    float wd = shore(vP.xz);
    vec3 sg = seg(vP.x);
    // Height above the lakes, near enough.
    float hh = vP.y + 20.0;
    vec3 N = normalize(vN);
    // Close land gets fine relief from noise.
    float near = smoothstep(1400.0, 250.0, dist);
    if (near > 0.0) N = normalize(N + vec3(gnoise(vP.xz * 0.07), 0.0, gnoise(vP.xz * 0.07 + 9.0)) * 0.5 * near);
    float slope = 1.0 - N.y;
    float n1 = fbm(vP.xz * 0.002);
    // Meadow: lush in the valley, browner up high.
    vec3 alb = mix(vec3(0.07, 0.15, 0.03), vec3(0.13, 0.16, 0.045), fbm(vP.xz * 0.0017 + 3.0));
    alb = mix(alb, vec3(0.12, 0.115, 0.06), smoothstep(1100.0, 1500.0, hh + (n1 - 0.5) * 300.0));
    // Grass texture close by; it fades before it can shimmer.
    float grain = vnoise(vP.xz * 0.9) * (1.0 - smoothstep(0.3, 0.8, length(fwidth(vP.xz * 0.9))));
    alb *= (0.8 + 0.4 * vnoise(vP.xz * 0.05)) * (0.85 + 0.3 * grain);
    // Farms: a patchwork of fields on the flat floor.
    float flatL = smoothstep(0.06, 0.015, slope) * smoothstep(90.0, 30.0, hh) * smoothstep(7000.0, 2500.0, dist) * step(4.0, wd);
    if (flatL > 0.0) {
      // Strips in staggered rows, so the fields never form a grid.

      if (t > 40) light(ps + Math.cos(a) * d, -t, pick(), range(1.4, 3.2), range(24, 50));

  for (let i = 0; i < 6000; i++) {

      // Express runs through every station without stopping.
      { type: 'toggle', id: 'express', label: 'Express', value: opts.express, onToggle: on => { opts.express = on; save('express', on ? '1' : '0'); S.setExpress(on); wake(); } },
      { type: 'choice', id: 'wet', label: 'Wet glass', value: opts.wet, options: [{ value: '0.5', label: 'Less' }, { value: '1', label: 'Some' }, { value: '1.4', label: 'More' }], onPick: v => { opts.wet = v; save('wet', v); S.setWet(+v); wake(); } },
    ],
    quality: true,
    keys: [['drag', 'lean and peer'], ['scroll', 'lean to the glass'], ['W', 'next weather'], ['E', 'express']],
  },
});
onQuality(() => { rung = 0; resize(true); wake(); });
S.setWet(+opts.wet);
S.setExpress(opts.express);
S.setMode(opts.mode, true);
S.setSpeed(cruise(opts.speed));
S.setTime(opts.time, true);
// Drift: the weather steps to a neighbour every two to five minutes.
const time0 = () => performance.now() / 1000;
const driftGap = () => 120 + Math.random() * 180;
let driftAt = time0() + driftGap();
setInterval(() => {
  if (!opts.drift || document.hidden || time0() < driftAt) return;
  const i = WEATHER.findIndex(w => w[0] === opts.mode);
  const j = Math.max(0, Math.min(WEATHER.length - 1, i + (Math.random() < 0.5 ? -1 : 1)));
  ui.choice?.set(WEATHER[j][0]);
  setWeather(WEATHER[j][0]);
}, 5000);
addEventListener('keydown', e => {
  if (e.target.closest?.('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'KeyW') {
    const i = WEATHER.findIndex(w => w[0] === opts.mode);
    const v = WEATHER[(i + 1) % WEATHER.length][0];
    ui.choice?.set(v);
    setWeather(v);
  }
  if (e.code === 'KeyE') { const on = !opts.express; opts.express = on; save('express', on ? '1' : '0'); ui.setting('express')?.set(on); S.setExpress(on); wake(); }
  if (e.code === 'KeyT') { const v = opts.time === 'day' ? 'night' : 'day'; ui.setting('time')?.set(v); setTime(v); }
});

/* ---------- start ---------- */
onReducedChange(() => wake());
whenVisible(stage, v => {
  visible = v;
  if (v) { if (ready) draw(); wake(); } else { cancelAnimationFrame(raf); raf = 0; lastT = 0; hush(); }
});
new ResizeObserver(() => resize()).observe(stage);
// Compile first, then draw the first composed frame inside the intro.
(async () => {
  resize(true);
  // Both scenes compile in parallel where the driver allows it.
  // A hidden tab never polls the compile, so a timeout caps the wait.
  if (renderer.extensions.has('KHR_parallel_shader_compile')) {
    await Promise.race([Promise.all([renderer.compileAsync(...S.outside), renderer.compileAsync(S.scene, S.camera)]), wait(4000)]);
  } else { renderer.compile(...S.outside); renderer.compile(S.scene, S.camera); }
  draw();
  // One finished frame folds the shader work into the intro.
  renderer.getContext().finish();
  ready = true;
  markReady();
  requestAnimationFrame(() => canvas.classList.add('on'));
  wake();
})().catch(err => { console.error(err); stage.querySelector('.fail').hidden = false; markReady(); });
</script>
</body>
</html>
