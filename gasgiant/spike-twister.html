<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alien twister bake</title>
<style>
/* Gas giant spike: one alien twister, marched at bake quality, in three lights. */
html, body { margin: 0; background: #050a0b; color: #cfe3df; font: 13px/1.3 system-ui, sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }
.note { position: fixed; left: 12px; top: 10px; opacity: 0.7; }
</style>
</head>
<body>
<canvas id="c" aria-label="Three renders of one alien twister"></canvas>
<div class="note" id="note">Baking...</div>
<script type="module">
import { TRI_VS, program, linked } from '../shared/gl.js';

// The twister in its own frame, in km: y up from the void's floor, the eye on +z.
// Three panels: light from above on the sun's side, light from behind for the rim, a flash.
const FS = /* glsl */`#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;
uniform vec2 uRes;
uniform float uT;
const float H = 24.0, PI = 3.14159265;
float h13(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
float vn3(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h13(i), h13(i + vec3(1, 0, 0)), f.x), mix(h13(i + vec3(0, 1, 0)), h13(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(h13(i + vec3(0, 0, 1)), h13(i + vec3(1, 0, 1)), f.x), mix(h13(i + vec3(0, 1, 1)), h13(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm(vec3 p, int oct) {
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 6; i++) { if (i >= oct) break; s += a * vn3(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= 0.5; }
  return s;
}
// The axis leans in a slow S, so the column reads as one huge body bending in the wind.
vec2 axisAt(float y) { float f = y / H; return vec2(4.2 * sin(f * 3.0 + 0.3) * f, 2.4 * sin(f * 3.8 + 1.2) * f); }
// The radius in km: a thin rope at the floor widens steadily into the ceiling's flare.
float radAt(float y) {
  float f = clamp(y / H, 0.0, 1.0);
  return 0.55 + 2.4 * pow(f, 1.6) + 2.2 * exp(-f * 16.0) + 6.0 * pow(smoothstep(0.7, 1.0, f), 2.0);
}
// The density at p, 0 to 1.
float dens(vec3 p, int oct) {
  if (p.y < 0.0 || p.y > H) return 0.0;
  vec2 q = p.xz - axisAt(p.y);
  float r = length(q), R = radAt(p.y);
  if (r > R * 1.7 + 0.8) return 0.0;
  float f = p.y / H;
  // The wall turns and climbs: the angle twists with height, so the bands spiral up.
  float a = atan(q.y, q.x) - uT * 2.0 * PI - f * 6.0;
  vec3 c = vec3(cos(a) * 1.4, sin(a) * 1.4, p.y * 0.3 - uT * 2.4);
  float n = fbm(c * 1.7 + vec3(0.0, 0.0, r * 0.4), oct);
  // Two helical ridges wind up the column.
  float hel = 0.5 + 0.5 * cos(2.0 * a + p.y * 0.9);
  // Collars spiral up the column, so they sweep instead of ringing it.
  // The angle term keeps the phase continuous across the atan seam.
  float ph = (p.y / 2.6 - uT * 2.0) * 2.0 * PI + a + 1.4 * sin(a + p.y * 0.25) + n * 4.0;
  float bands = smoothstep(0.35, 0.95, 0.5 + 0.5 * sin(ph));
  float edge = R * (0.62 + 0.5 * n + 0.32 * hel + 0.26 * bands) - r;
  float d = smoothstep(0.0, 0.5 + 0.6 * f, edge);
  // The skirt at the floor is torn and dusty; the flare frays into the ceiling.
  float skirt = 1.0 - smoothstep(0.02, 0.16, f);
  d *= mix(1.0, smoothstep(0.35, 0.75, n + 0.2 * hel), skirt * 0.8);
  d *= mix(1.0, smoothstep(0.3, 0.7, n), smoothstep(0.75, 1.0, f) * 0.7);
  // Collars and ridges are denser, so they stand out in the light.
  return d * (0.6 + 0.5 * n + 0.35 * bands + 0.2 * hel);
}
// Henyey-Greenstein, two lobes: a strong forward one for the rim, a soft back one.
float hg(float mu, float g) { float g2 = g * g; return (1.0 - g2) / (4.0 * PI * pow(1.0 + g2 - 2.0 * g * mu, 1.5)); }
float phase(float mu) { return mix(hg(mu, 0.75), hg(mu, -0.2), 0.3) * 4.0 * PI; }
// The void around it: a lit ceiling haze, a dark floor, teal between.
vec3 voidAt(vec3 rd, vec3 L, float flash) {
  float u = rd.y * 0.5 + 0.5;
  vec3 c = mix(vec3(0.02, 0.06, 0.06), vec3(0.16, 0.3, 0.3), smoothstep(0.35, 0.75, u));
  return c + vec3(0.25, 0.4, 0.45) * pow(max(dot(rd, L), 0.0), 6.0) * 0.4 + vec3(0.5, 0.55, 0.9) * flash * 0.15;
}
// One panel: k picks the light.
vec3 panel(vec2 uv, int k) {
  // The light comes from above on the sun's side; panel 1 has it behind; panel 2 adds a flash.
  vec3 L = k == 1 ? normalize(vec3(-0.25, 0.35, -0.9)) : normalize(vec3(-0.85, 0.45, 0.3));
  vec3 Lc = vec3(0.85, 1.0, 0.95) * 1.1;
  float flash = k == 2 ? 1.0 : 0.0;
  vec3 F = vec3(-3.0, 9.0, 4.0);
  vec3 ro = vec3(0.0, 11.0, 46.0);
  vec3 rd = normalize(vec3((uv.x - 0.5) * 0.62 * uRes.x / 3.0 / uRes.y, (uv.y - 0.5) * 0.62, -1.0));
  rd = normalize(vec3(rd.x, rd.y + 0.02, rd.z));
  vec3 col = vec3(0.0);
  float T = 1.0;
  // The column fits in a 12 km cylinder round the axis: march only there.
  float t = 30.0, jit = h13(vec3(gl_FragCoord.xy, 3.0));
  t += 0.12 * jit;
  for (int i = 0; i < 420; i++) {
    vec3 p = ro + rd * t;
    if (t > 62.0 || T < 0.01) break;
    float d = dens(p, 6);
    if (d > 0.002) {
      // The light's depth toward L over eight taps.
      float od = 0.0, st = 0.25;
      vec3 q = p;
      for (int j = 0; j < 8; j++) { q += L * st; od += dens(q, 4) * st; st *= 1.45; }
      float f = p.y / H;
      // Tornado alley's funnel light: the lit side falls off into the body; little light reaches round.
      // The top is darker, under the ceiling's own shade.
      od = od * 5.0 + smoothstep(0.55, 1.0, f) * 1.5;
      float mu = dot(rd, L);
      vec3 sunL = Lc * (exp(-od) * phase(mu) + 0.15 * exp(-od * 0.25) * phase(mu * 0.5) + 0.03 * exp(-od * 0.1));
      // The shade side fills cool slate from the void, less deep in the body.
      vec2 qa = p.xz - axisAt(p.y);
      float depth = max(0.0, 1.0 - length(qa) / radAt(p.y));
      vec3 amb = mix(vec3(0.02, 0.045, 0.06), vec3(0.06, 0.09, 0.11), f) * exp(-depth * 1.6);
      // A flash lights the body from its side, with no shadow but its own depth.
      vec3 fq = F - p;
      float fl = flash * exp(-dot(fq, fq) / 40.0) * 3.5 * exp(-depth * 1.2);
      vec3 alb = mix(vec3(0.62, 0.78, 0.76), vec3(0.62, 0.56, 0.8), smoothstep(0.45, 1.0, f));
      vec3 Lp = alb * (sunL + amb + vec3(0.64, 0.74, 1.0) * fl);
      float a = 1.0 - exp(-d * 6.0 * 0.08);
      col += T * Lp * a;
      T *= 1.0 - a;
    }
    t += 0.08;
  }
  col += T * voidAt(rd, L, flash);
  return col;
}
void main() {
  vec2 px = gl_FragCoord.xy / uRes;
  int k = int(px.x * 3.0);
  vec2 uv = vec2(fract(px.x * 3.0), px.y);
  vec3 c = panel(uv, k);
  // A soft film curve, then sRGB.
  c = c / (1.0 + c) * 1.15;
  c = pow(max(c, 0.0), vec3(1.0 / 2.2));
  // A thin gap between the panels.
  c *= smoothstep(0.0, 0.004, abs(fract(px.x * 3.0) - 0.0)) * smoothstep(0.0, 0.004, abs(fract(px.x * 3.0) - 1.0));
  o = vec4(c, 1.0);
}`;

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
// ?s=0.5 bakes at half size, for quick looks.
const SC = Number(new URLSearchParams(location.search).get('s') || 1);
const W = Math.round(1500 * SC), Hh = Math.round(1000 * SC);
canvas.width = W; canvas.height = Hh;
const P = (await linked(gl, { t: program(gl, TRI_VS, FS) })).t;
gl.viewport(0, 0, W, Hh);
gl.useProgram(P.p);
gl.uniform2f(P.u.uRes, W, Hh);
gl.uniform1f(P.u.uT, Number(new URLSearchParams(location.search).get('t') || 0));
gl.bindVertexArray(gl.createVertexArray());
const t0 = performance.now();
// The bake runs in tiles, one per frame, so no draw trips the driver's timeout.
gl.enable(gl.SCISSOR_TEST);
const N = 10, px = new Uint8Array(4);
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
  gl.scissor(Math.floor(i * W / N), Math.floor(j * Hh / N), Math.ceil(W / N), Math.ceil(Hh / N));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  await new Promise(r => setTimeout(r, 0));
}
gl.disable(gl.SCISSOR_TEST);
window.__done = true;
document.getElementById('note').textContent = `Alien twister, 24 km, three lights: from above, from behind, a flash. Bake ${Math.round(performance.now() - t0)} ms.`;
</script>
</body>
</html>
