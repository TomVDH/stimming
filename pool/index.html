<!doctype html>
<html lang="en">

<title>Caustic pool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Caustic pool: thick water seen from above, by day or by night. */
:root { --stage: oklch(0.32 0.07 222); }
:root[data-time="night"] { --stage: oklch(0.22 0.05 232); }
/* On the water the fail line keeps a pale tone. */
.fail { color: oklch(0.92 0.02 210); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
/* Each chip carries a small solid stencil of its thing. */
.chip .ic { width: 15px; height: 15px; flex: none; fill: currentColor; }
/* Cut mode aims with a crosshair. */
:root[data-mode="cut"] .stage { cursor: crosshair; }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
</style>

<body>
<div class="intro" aria-hidden="true">

  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Caustic pool</h1><div class="vignette" hidden></div></section>

<script type="module">
import { initPage, sound, audioKit, choices } from '../shared/stim.js';
initPage({ id: 'pool' });
const panel = document.getElementById('stage'), canvas = panel.querySelector('canvas');
const nightB = document.getElementById('night'), clearB = document.getElementById('clear'), poolB = document.getElementById('pool');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; wake(); });
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));
const nextFrame = () => new Promise(r => requestAnimationFrame(r));
const rng = s => () => {
  s = (s + 0x6d2b79f5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const norm3 = v => { const l = Math.hypot(...v); return v.map(x => x / l); };
// Storage is optional; private windows can refuse it.
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (err) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (err) { /* storage is optional */ } },
};

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
function lin(L, C, h) {
  const a = C * Math.cos(h * D2R), b = C * Math.sin(h * D2R);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
  ];
}
// Chroma shrinks until the colour fits sRGB.
function linear(L, C, h) {
  let c = lin(L, C, h);
  for (let i = 0; i < 24 && (Math.min(...c) < -1e-4 || Math.max(...c) > 1.0001); i++) c = lin(L, (C *= 0.9), h);
  return c.map(v => clamp(v));
}
const mul = (c, k) => c.map(v => v * k);
const PAL = {
  SUN: mul(linear(0.97, 0.045, 80), 2.6),
  ZEN: linear(0.7, 0.11, 238),
  HOR: linear(0.9, 0.075, 58),
  HALO: linear(0.95, 0.09, 75),
  AMB: mul(linear(0.84, 0.07, 215), 0.62),
  // Pale water white for droplets and foam; each pool brings its own tiles.
  TW: linear(0.88, 0.045, 205),
  SCAT: mul(linear(0.66, 0.13, 196), 0.55),
  // The floaters share one sun-yellow accent.
  ACC: linear(0.9, 0.18, 100),
  // Night: a cool moon, a deep sky and two warm-white pool lamps.
  MOON: mul(linear(0.86, 0.035, 245), 0.24),
  AMBN: mul(linear(0.5, 0.06, 262), 0.06),
  NZEN: linear(0.12, 0.035, 270),
  NHOR: linear(0.25, 0.05, 248),
  MOONH: linear(0.5, 0.04, 240),
  STAR: mul(linear(0.97, 0.03, 85), 9),
  LAMPC: mul(linear(0.9, 0.11, 192), 3.4),
  WGLOW: mul(linear(0.62, 0.13, 200), 0.95),
  LENS: linear(0.88, 0.015, 220),
  RIMC: linear(0.74, 0.01, 250),
  // A beach ball: coral, white, cobalt, sun yellow and teal.
  BAR: linear(0.64, 0.21, 30),
  BAW: linear(0.96, 0.01, 95),
  BAB: linear(0.5, 0.19, 262),
  BAY: linear(0.88, 0.17, 95),
  BAT: linear(0.72, 0.13, 182),
  // Cast iron, a ground steel face and an orange enamel bell.
  IRON: linear(0.26, 0.012, 255),
  STEEL: linear(0.6, 0.014, 245),
  BELL: linear(0.7, 0.19, 45),
};
const f5 = v => v.toFixed(5);
const v3 = c => `vec3(${c.map(f5).join(', ')})`;

/* ---------- the pool: world units, y up, z toward the viewer ---------- */
const TILT = 20 * D2R, FOVY = 22 * D2R, PX = 1, HD = 0.045, RIM = 0.075, WAVE_C = 0.5;
let DEPTH = 0.45;
// Thick water: waves step slower, damp harder and lose fine detail first.
const C2 = 1.5, NU = 0.16, DAMP_RATE = 1.1, CELL_SPEED = Math.sqrt(C2 / 4);
let PZ = 0.62, NX = 256, NZ = 144, CELL = 2 / 256, SIMN = 256, aspect = 0, TILE = 2 / 28, SIM_HZ = 105, damp = 0.99;
// The sun stands high over the far left corner.
// At night the moon takes its place.
const SUN_DIR = norm3([-0.42, 1, -0.55]);
// Still water keeps a faint frozen relief.
// The relief keeps caustics on the floor.
const AMP0 = 0.6, SWELL_T = 2.7;
// Dispersion is several times real water's, so the fringes show.
const DISP = 0.025;
/* ---------- pools: a shape, a depth and a palette each ---------- */
// Colours are OKLCH: two tiles, grout, ground, coping and coping joints.
// The ground is concrete, sandstone or lawn.
// Fixed pools keep their own proportions; ar is depth over width.
const POOLS = {
  lane: { name: 'Lane', shape: 0, depth: 0.45, ar: 0, tiles: [[0.88, 0.045, 205], [0.44, 0.17, 262]], grout: [0.3, 0.06, 255], deck: [0.7, 0.012, 85], cope: [0.9, 0.012, 90], joint: [0.6, 0.012, 85] },
  plunge: { name: 'Plunge', shape: 1, depth: 0.7, ar: 1, tiles: [[0.93, 0.015, 95], [0.3, 0.05, 265]], grout: [0.52, 0.03, 260], deck: [0.7, 0.045, 68], cope: [0.88, 0.022, 82], joint: [0.58, 0.04, 66] },
  lagoon: { name: 'Lagoon', shape: 2, depth: 0.38, ar: 0.72, tiles: [[0.86, 0.09, 165], [0.56, 0.12, 178]], grout: [0.32, 0.06, 185], deck: [0.54, 0.1, 138], cope: [0.84, 0.03, 80], joint: [0.64, 0.03, 76] },
};
const POOL_IDS = Object.keys(POOLS), POOL_KEY = 'stimming.pool.pool';
let poolId = POOLS[store.get(POOL_KEY)] ? store.get(POOL_KEY) : 'lane', shape = POOLS[poolId].shape;
DEPTH = POOLS[poolId].depth;
const smin2 = (a, b, k) => { const h = clamp(0.5 + (0.5 * (b - a)) / k); return lerp(b, a, h) - k * h * (1 - h); };
// Signed distance to the pool edge on the water plane: negative inside.
// The shader keeps a copy of this function.
function poolSd(x, z) {
  if (shape === 0) {
    const dx = Math.abs(x) - PX, dz = Math.abs(z) - PZ;
    return Math.hypot(Math.max(dx, 0), Math.max(dz, 0)) + Math.min(Math.max(dx, dz), 0);
  }
  if (shape === 1) return Math.hypot(x, z) - PX;
  // A bean: two round lobes, joined smooth, with a bite from the near side.
  const qx = x / PX, qz = z / PX;
  const d = smin2(Math.hypot(qx + 0.42, qz + 0.08) - 0.58, Math.hypot(qx - 0.5, qz - 0.12) - 0.48, 0.3);
  return -smin2(-d, Math.hypot(qx, qz - 0.85) - 0.42, 0.2) * PX;
}
function poolGrad(x, z) {
  const e = 0.002, gx = poolSd(x + e, z) - poolSd(x - e, z), gz = poolSd(x, z + e) - poolSd(x, z - e), l = Math.hypot(gx, gz) || 1;
  return [gx / l, gz / l];
}
// Moves a point inside the pool by at least margin m.
function inPool(x, z, m) {
  for (let i = 0; i < 4; i++) {
    const d = poolSd(x, z);
    if (d <= -m) break;
    const [gx, gz] = poolGrad(x, z);
    x -= gx * (d + m);
    z -= gz * (d + m);
  }
  return [x, z];
}
// Finds where the field crosses level v along a ray from the centre.
function edgeAlong(dx, dz, v) {
  let a = 0, b = 3;
  for (let i = 0; i < 30; i++) { const m = (a + b) / 2; if (poolSd(dx * m, dz * m) < v) a = m; else b = m; }
  return a;
}
function refract(I, N, eta) {
  const d = N[0] * I[0] + N[1] * I[1] + N[2] * I[2], k = 1 - eta * eta * (1 - d * d);
  return I.map((v, i) => v * eta - N[i] * (eta * d + Math.sqrt(k)));
}
// Sunlight bends at a calm surface and runs down into the water.
const RL = refract(mul(SUN_DIR, -1), [0, 1, 0], 0.75);
// The camera orbits the pool: yaw turns it, tilt leans it from straight down.
const TILT_MIN = 6 * D2R, TILT_MAX = 50 * D2R;
const cam = { p: [0, 0, 0], f: [0, 0, 0], r: [1, 0, 0], u: [0, 0, 0], tx: 1, ty: 1, yaw: 0, tilt: TILT, dist: 5, tz: 0, zoom: 1 };
const ZOOM_MIN = 0.4, ZOOM_MAX = 1.5;
function place(A, dist, tz, yaw = cam.yaw) {
  const c = Math.cos(cam.tilt), s = Math.sin(cam.tilt), cy = Math.cos(yaw), sy = Math.sin(yaw);
  // The target sits tz toward the viewer from the pool centre.
  cam.p = [(tz + dist * s) * sy, dist * c, (tz + dist * s) * cy];
  cam.f = [-s * sy, -c, -s * cy];
  cam.r = [cy, 0, -sy];
  cam.u = [-c * sy, s, -c * cy];
  cam.ty = Math.tan(FOVY / 2);
  cam.tx = cam.ty * A;
  cam.dist = dist;
  cam.tz = tz;
}
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
function project(x, y, z) {
  const d = [x - cam.p[0], y - cam.p[1], z - cam.p[2]], zc = dot3(d, cam.f);
  return [dot3(d, cam.r) / (zc * cam.tx), dot3(d, cam.u) / (zc * cam.ty)];
}
// The camera frames the pool and its rim to fill the stage.
function fitCam(A, pz, yaw = cam.yaw) {
  let dist = 5, tz = 0, xm = 1, y0 = -1, y1 = 1;
  const X = PX + RIM, Z = pz + RIM;
  const pts = shape === 0 ? [[-X, -Z], [X, -Z], [X, Z], [-X, Z]] : outline;
  for (let i = 0; i < 60; i++) {
    place(A, dist, tz, yaw);
    xm = 0; y0 = 1e9; y1 = -1e9;
    for (const [x, z] of pts) {
      const q = project(x, HD, z);
      xm = Math.max(xm, Math.abs(q[0]));
      y0 = Math.min(y0, q[1]);
      y1 = Math.max(y1, q[1]);
    }
    dist *= Math.max(xm, (y1 - y0) / 2);
    tz -= ((y0 + y1) / 2) * pz * 0.6;
  }
  place(A, dist, tz, yaw);
  return { w: xm, h: (y1 - y0) / 2 };
}
// The front view sets the distance; a turn keeps it, so the view stays close.
function frameCam(A) {
  fitCam(A, PZ, 0);
  place(A, cam.dist * cam.zoom, cam.tz, cam.yaw);
}
const petals = [], objs = [];
let petalScale = 1, outline = [], lampZ = [-0.62, 0.62];
function layoutPool(A) {
  aspect = A;
  let pz = PX * POOLS[poolId].ar;
  // The lane pool takes its shape from the front view.
  if (shape === 0) {
    pz = PX / (A * Math.cos(cam.tilt));
    for (let i = 0; i < 14; i++) {
      const r = fitCam(A, pz, 0);
      pz *= (r.w / r.h) ** 0.8;
    }
  }
  // Square cells keep ripples round.
  const long = Math.max(PX, pz), oz = PZ;
  NX = Math.round((SIMN * PX) / long);
  NZ = Math.round((SIMN * pz) / long);
  PZ = (PX * NZ) / NX;
  CELL = (2 * PX) / NX;
  SIM_HZ = WAVE_C / (CELL_SPEED * CELL);
  damp = Math.exp(-DAMP_RATE / SIM_HZ);
  TILE = (2 * PX) / Math.round((2 * PX) / 0.1);
  petalScale = A < 0.9 ? 1.3 : 1;
  // The rim outline frames the camera; the lamps sit on the end walls.
  outline = Array.from({ length: 32 }, (_, i) => {
    const a = (i / 32) * TAU, r = edgeAlong(Math.cos(a), Math.sin(a), RIM);
    return [Math.cos(a) * r, Math.sin(a) * r];
  });
  lampZ = [-edgeAlong(0, -1, 0), edgeAlong(0, 1, 0)];
  frameCam(A);
  for (const p of petals) {
    p.z = (p.z * PZ) / oz;
    p.L = p.L0 * petalScale;
    p.Wd = p.W0 * petalScale;
    [p.x, p.z] = inPool(p.x, p.z, 0.1);
  }
  for (const o of objs) { o.z = (o.z * PZ) / oz; [o.x, o.z] = inPool(o.x, o.z, 0.1); }
}

/* ---------- the frozen relief: a few long, shallow crossing waves ---------- */
const WAVES = [[14, 0.15, 0.036], [79, 0.115, 0.03], [141, 0.17, 0.04], [205, 0.13, 0.033], [262, 0.1, 0.027], [326, 0.16, 0.038]]
  .map(([deg, lam, c], i) => {
    const k = TAU / lam;
    return { dx: Math.cos(deg * D2R), dz: Math.sin(deg * D2R), k, w: k * c, amp: 2.1 / (k * k), ph: i * 2.399 };
  });

/* ---------- sound: synthesised through the shell's audio kit ---------- */
const MAXV = 16, LEAD = 0.004;
const GESTURE_KEYS = new Set([' ', 'Enter', 'r', 'R', 'n', 'N', 'c', 'C', 'x', 'X', 'p', 'P', '1', '2', '3', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
const kit = audioKit({ gain: 0.55, keys: GESTURE_KEYS });
let voices = 0, plopNext = 0, tickNext = 0, slapNext = 0, gurgleNext = 0, lapG = null, patG = null;
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.07 * voices);
// The beds start with the first live context.
function live() {
  const a = kit.live();
  if (a && !lapG) bed(a);
  return a;
}
function track(src, ...tails) {
  voices++;
  src.onended = () => { voices--; tails.forEach(n => n.disconnect()); };
}
// Each voice pans with its place on the water.
function bus(a, x) {
  const p = a.createStereoPanner ? a.createStereoPanner() : a.createGain();
  if (p.pan) p.pan.value = clamp(x, -1, 1) * 0.7;
  p.connect(kit.out);
  return p;
}
function burst(a, dst, t, type, f, q, g, tau, len) {
  const src = a.createBufferSource(), fl = a.createBiquadFilter(), ng = a.createGain();
  src.buffer = kit.noise;
  fl.type = type;
  fl.frequency.value = f;
  fl.Q.value = q;
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(g, t + 0.004);
  ng.gain.setTargetAtTime(0, t + 0.004, tau);
  src.connect(fl).connect(ng).connect(dst);
  src.onended = () => { fl.disconnect(); ng.disconnect(); };
  src.start(t, Math.random() * 0.3, len);
  return fl;
}
function tone(a, dst, t, f0, f1, ramp, g, tau, len, type = 'sine') {
  const o = a.createOscillator(), og = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + ramp);
  og.gain.setValueAtTime(0, t);
  og.gain.linearRampToValueAtTime(g, t + 0.004);
  og.gain.setTargetAtTime(0, t + 0.006, tau);
  o.connect(og).connect(dst);
  o.start(t);
  o.stop(t + len);
  return { o, og };
}
// A plop: a bubble's rising ring, with spray for bigger drops.
// Bigger drops ring lower and longer.
function plop(x, s) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
