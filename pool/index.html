<!doctype html>
<html lang="en">
<head>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}/* The how-to line is as quiet as the home link. */
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 28px; }

<title>Caustic pool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: header row, the pool panel at full width, one chip row. */
:root {
  --bg: oklch(0.16 0.012 275);
  --surface: oklch(0.195 0.014 275);
  --line: oklch(0.29 0.016 275);
  --fg: oklch(0.94 0.008 275);
  --muted: oklch(0.64 0.02 275);
  --focus: oklch(0.84 0.13 205);
  --pick: oklch(0.7 0.18 320 / 0.35);
  --water: oklch(0.5 0.08 215);
  --sans: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font: 500 14px/1.35 var(--sans);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
::selection { background: var(--pick); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: clamp(20px, 3.4vw, 40px); }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.tools { display: flex; align-items: center; gap: 8px; }
.home { font-size: 14px; color: var(--muted); text-decoration: none; border-radius: 4px; transition: color 0.2s ease; }
.home:hover { color: var(--fg); }
/* The sound toggle sits as quietly as the home link. */
.snd {
  display: grid; place-items: center; width: 28px; height: 28px; margin-block: -4px; padding: 0;
  color: var(--muted); background: none; border: 0; border-radius: 6px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: color 0.2s ease;
}
.snd:hover { color: var(--fg); }

  width: 18px; height: 18px; fill: none; stroke: currentColor;

}
.snd[aria-pressed="true"] .off, .snd[aria-pressed="false"] .on { display: none; }
@media (pointer: coarse) { .snd { width: 40px; height: 40px; margin-block: -10px; } }
main { display: grid; gap: 14px; min-width: 0; }
/* The pool is 16:9, 4:5 on phones. */
.stage {
  position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: max(320px, calc(100svh - 176px));
  border-radius: 18px; overflow: hidden; background: var(--water);

}

  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
/* On the water the line keeps a pale tone. */
.fail {
  position: absolute; inset: 0; margin: 0; padding: 16px; display: grid; place-items: center; text-align: center;
  font-size: 14px; color: oklch(0.92 0.02 210);
}
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; cursor: pointer;
  font: inherit; font-size: 13px; color: var(--muted);
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  -webkit-tap-highlight-color: transparent;

<body>

<div class="wrap">
  <header>
    <h1>Caustic pool</h1>
    <div class="tools">
      <button class="snd" id="snd" type="button" aria-label="Sound" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 8h2.6l3.9-3.2v10.4L5.6 12H3z"/>
          <path class="on" d="M12.8 8.1a3 3 0 0 1 0 3.8M15.1 6.1a6 6 0 0 1 0 7.8"/>
          <path class="off" d="M13.2 8l4 4M17.2 8l-4 4"/>
        </svg>
      </button>
      <a class="home" href="../index.html">Stimming</a>
    </div>
  </header>
  <main>
    <div class="stage" id="stage" tabindex="0" role="application" aria-label="A sunlit pool seen from above. Tap to drop a stone and drag to trail a finger through the water. Space splashes, R toggles rain, and arrow keys draw a wake.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Caustic pool needs WebGL 2 with float textures, which this browser lacks.</p>
    </div>
    <div class="foot">
      <div class="ctl">
        <button class="chip" id="rain" type="button" aria-keyshortcuts="R" aria-pressed="false">Rain</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>drop</dd></div>
        <div><dt>Drag</dt><dd>wake</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>splash</dd></div>
        <div class="fine"><dt><kbd>R</kbd></dt><dd>rain</dd></div>
      </dl>
    </div>
  </main>
</div>

/* ---------- the swell: a few slow crossing waves ---------- */
const WAVES = [[14, 0.15, 0.036], [79, 0.115, 0.03], [141, 0.17, 0.04], [205, 0.13, 0.033], [262, 0.1, 0.027], [326, 0.16, 0.038]]

/* ---------- sound: synthesised, started by the first gesture ---------- */
const SKEY = 'stimming.pool.sound', MAXV = 14, LEAD = 0.004;
let soundOn = true;
try { soundOn = localStorage.getItem(SKEY) !== '0'; } catch (err) { /* storage is optional */ }
let ac = null, out = null, noise = null, askedAt = -1e9, voices = 0, plopNext = 0, tickNext = 0, slapNext = 0;

const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.07 * voices);

    const AC = window.AudioContext || window.webkitAudioContext;

    comp.connect(ac.destination);

    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  const w = panel.clientWidth, h = panel.clientHeight;
  if (!w || !h) return;
  rect = null;
  W = w;
  H = h;
  const p = Math.min(devicePixelRatio || 1, 2, lowDpr ? 1 : 2, Math.sqrt(1.4e6 / (w * h)));
  const cw = Math.round(w * p), ch = Math.round(h * p);
  if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
  if (!ready) return;
  // A new shape rebuilds the pool; a small change only reframes it.
  if (Math.abs(w / h / aspect - 1) > 0.02) { layoutPool(w / h); allocPool(); }
  else { fitCam(w / h, PZ); camUniforms(); }
  if (running) render(0);
}

/* ---------- input ---------- */
let rect = null;
addEventListener('scroll', () => { rect = null; }, { passive: true });
function local(e) {
  const r = rect || (rect = panel.getBoundingClientRect());
  return [e.clientX - r.left, e.clientY - r.top];
}
// A stage point lands on the water plane, or on the deck.
function toWater(px, py) {
  const nx = (px / W) * 2 - 1, ny = 1 - (py / H) * 2;
  const d = [nx * cam.tx, cam.f[1] + ny * cam.ty * cam.u[1], cam.f[2] + ny * cam.ty * cam.u[2]];
  const tq = (HD - cam.p[1]) / d[1], t0 = -cam.p[1] / d[1];
  const qx = cam.p[0] + d[0] * tq, qz = cam.p[2] + d[2] * tq;
  return { x: inX(cam.p[0] + d[0] * t0), z: inZ(cam.p[2] + d[2] * t0), inside: Math.abs(qx) < PX + 0.01 && Math.abs(qz) < PZ + 0.01 };
}
const fingers = new Map();
panel.addEventListener('pointerdown', e => {
  if (!ready || (e.pointerType === 'mouse' && e.button !== 0)) return;
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  const w = toWater(...local(e));
  fingers.set(e.pointerId, { x: w.x, z: w.z, in: w.inside, t: e.timeStamp });
  if (w.inside) stone(w.x, w.z, rand(0.35, 0.6));
  wake();
});
panel.addEventListener('pointermove', e => {
  const f = fingers.get(e.pointerId);
  if (!f) return;
  const list = e.getCoalescedEvents?.() || [];
  for (const c of list.length ? list : [e]) {
    const w = toWater(...local(c));
    if (f.in && w.inside) drag(f.x, f.z, w.x, w.z, Math.max(0.004, (c.timeStamp - f.t) / 1000));
    f.in = w.inside;
    f.x = w.x;
    f.z = w.z;
    f.t = c.timeStamp;
  }
});
const lift = e => fingers.delete(e.pointerId);
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => panel.addEventListener(t, lift));
panel.addEventListener('contextmenu', e => e.preventDefault());
rainB.addEventListener('click', () => setRain(!raining));
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const k = e.key;
  if (k === 'r' || k === 'R') { if (!e.repeat) setRain(!raining); }
  else if (k === ' ') {
    // Buttons and links keep Space for themselves.
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (!e.repeat && ready) splash();
  } else if (k.startsWith('Arrow')) {
    e.preventDefault();
    if (ready && !e.repeat) sweep(k);
  }
});
const showSound = () => sndB.setAttribute('aria-pressed', String(soundOn));
showSound();
sndB.addEventListener('click', () => {
  soundOn = !soundOn;
  showSound();
  try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (err) { /* storage is optional */ }
  if (soundOn) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});

/* ---------- start: shaders link while the page settles ---------- */
function failed() {
  ready = false;
  sync();
  canvas.hidden = true;
  panel.querySelector('.fail').hidden = false;
  rainB.disabled = true;
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; fence = null; sync(); });
canvas.addEventListener('webglcontextrestored', async () => {
  try {
    await initGL();
    allocPool();
    ready = true;
    sync();
  } catch (err) { failed(); }
});
async function boot() {
  await idle();
  fit();
  if (!W) { W = 1160; H = 652; }
  try { await initGL(); } catch (err) {
    if (err.message !== 'unsupported') console.error(err);
    failed();
    return;
  }
  layoutPool(W / H);
  seedPetals();
  allocPool();
  ready = true;
  new ResizeObserver(fit).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; sync(); }).observe(panel);
  document.addEventListener('visibilitychange', sync);
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
</body>
</html>
