<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plasma globe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Plasma globe: a globe in a dark room under the shared header. */
:root { --stage: oklch(0.13 0.02 290); }
/* On the dark room the fail line keeps a pale tone. */
.fail { color: oklch(0.74 0.02 285); }
.stage canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Plasma globe</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--plasma" id="stage" tabindex="0" role="application" aria-label="A plasma globe on a dark base. Touch or click the glass to pull an arc, and tap it for a crackle. Arrow keys move a touch point, Space crackles and Escape lets go.">
      <canvas aria-hidden="true"></canvas>
      <p class="fail" hidden>Plasma globe needs WebGL 2, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" role="group" aria-label="Palette">
        <button class="chip" type="button" data-pal="violet" aria-pressed="true">Violet</button>
        <button class="chip" type="button" data-pal="ice" aria-pressed="false">Ice</button>
        <button class="chip" type="button" data-pal="ember" aria-pressed="false">Ember</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Touch the glass</dt><dd>pull an arc</dd></div>
        <div><dt><span class="fine">Click</span><span class="touch">Tap</span></dt><dd>crackle</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>crackle</dd></div>
        <div class="fine"><dt><kbd>Arrows</kbd></dt><dd>move the touch</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name"><h1 class="display" id="toy-name">Plasma globe</h1><div class="vignette" hidden></div></section>
</div>

<script type="module">
import { initPage, sound } from '../shared/stim.js';
initPage({ id: 'plasma' });
const panel = document.getElementById('stage'), canvas = panel.querySelector('canvas');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RM.matches;
RM.addEventListener?.('change', e => { reduce = e.matches; wake(); });
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const randn = () => (Math.random() + Math.random() + Math.random() - 1.5) * 2;
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));
const nextFrame = () => new Promise(r => requestAnimationFrame(r));

/* ---------- colour: OKLCH in, linear sRGB out ---------- */
function lin(L, C, h) {
  const a = C * Math.cos(h * D2R), b = C * Math.sin(h * D2R);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
  ];
}
// Chroma shrinks until the colour fits sRGB.
function linear(L, C, h) {
  let c = lin(L, C, h);
  for (let i = 0; i < 24 && (Math.min(...c) < -1e-4 || Math.max(...c) > 1.0001); i++) c = lin(L, (C *= 0.9), h);
  return c.map(v => clamp(v));
}
// Each palette holds glow hues, a tip, a hot core and a room.
const PAL = {
  violet: { glows: [[0.6, 0.28, 338], [0.57, 0.27, 302], [0.57, 0.25, 270]], tip: [0.6, 0.22, 262], core: [0.95, 0.06, 345], room: [0.115, 0.022, 292] },
  ice: { glows: [[0.72, 0.15, 222], [0.64, 0.2, 252], [0.8, 0.12, 196]], tip: [0.64, 0.19, 268], core: [0.97, 0.035, 215], room: [0.115, 0.02, 250] },
  ember: { glows: [[0.64, 0.22, 36], [0.58, 0.23, 22], [0.74, 0.18, 58]], tip: [0.56, 0.22, 16], core: [0.96, 0.07, 82], room: [0.115, 0.018, 38] },
};
const palCols = name => {
  const p = PAL[name];
  return { glows: p.glows.map(c => linear(...c)), tip: linear(...p.tip), core: linear(...p.core), room: linear(...p.room) };
};
const copyPal = p => ({ glows: p.glows.map(c => c.slice()), tip: p.tip.slice(), core: p.core.slice(), room: p.room.slice() });
let palName = 'violet', palFrom = palCols('violet'), palTo = palFrom, palK = 1;
const pal = copyPal(palFrom);
pal.glow = [0, 0, 0];
function mixPal() {
  const e = sstep(0, 1, palK);
  for (let c = 0; c < 3; c++) {
    for (let i = 0; i < 3; i++) pal.glows[i][c] = lerp(palFrom.glows[i][c], palTo.glows[i][c], e);
    pal.tip[c] = lerp(palFrom.tip[c], palTo.tip[c], e);
    pal.core[c] = lerp(palFrom.core[c], palTo.core[c], e);
    pal.room[c] = lerp(palFrom.room[c], palTo.room[c], e);
    pal.glow[c] = (pal.glows[0][c] + pal.glows[1][c] + pal.glows[2][c]) / 3;
  }
}
mixPal();

/* ---------- noise: smooth gradient noise in two dimensions ---------- */
const PERM = new Uint8Array(512), GX = new Float32Array(256), GY = new Float32Array(256);
{
  const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
  for (let i = 0; i < 256; i++) { const a = (i / 256) * TAU; GX[i] = Math.cos(a); GY[i] = Math.sin(a); }
}
function noise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, X = ix & 255, Y = iy & 255;
  const a = PERM[PERM[X] + Y], b = PERM[PERM[X + 1] + Y], c = PERM[PERM[X] + Y + 1], d = PERM[PERM[X + 1] + Y + 1];
  const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10), v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  const ga = GX[a] * fx + GY[a] * fy, gb = GX[b] * (fx - 1) + GY[b] * fy;
  const gc = GX[c] * fx + GY[c] * (fy - 1), gd = GX[d] * (fx - 1) + GY[d] * (fy - 1);
  return 1.4 * lerp(lerp(ga, gb, u), lerp(gc, gd, u), v);
}

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 10, LEAD = 0.004;
let ac = null, out = null, noiseBuf = null, askedAt = -1e9, voices = 0, hum = null, humAt = 0, humWas = -1;
const crNext = { amb: 0, hold: 0, snap: 0, burst: 0 };
const crGap = { amb: 0.22, hold: 0.06, snap: 0.05, burst: 0.12 };
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.08 * voices);

function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (err) { return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;
    out = ac.createGain();
    out.gain.value = 0.55;
    out.connect(comp);
    comp.connect(ac.destination);
    // Two seconds of white noise feed the buzz and every crackle.
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    buildHum();
  }
  // Off screen, the globe stays silent until it returns.
  if (!visible) { ac.suspend()?.catch(() => {}); return; }
  if (ac.state !== 'running') { askedAt = performance.now(); ac.resume()?.catch(() => {}); }
}
// A context still waking queues sounds for a moment.
function live() {
  if (!sound.on || !ac || ac.state === 'closed') return null;
  return ac.state === 'running' || performance.now() - askedAt < 250 ? ac : null;
}
function track(src, ...tails) {
  voices++;
  src.onended = () => { voices--; tails.forEach(n => n.disconnect()); };
}
const GESTURE_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter']);
function unlock(e) {
  if (!sound.on || (e.type === 'keydown' && !GESTURE_KEYS.has(e.key))) return;
  // A touch counts as a gesture only once the finger lifts.
  if (!ac && e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
  audio();
}
// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// The mains hum stacks 50 Hz harmonics under a low-pass.
// The 100 Hz harmonic is the strongest.
function buildHum() {
  const N = 16, re = new Float32Array(N), im = new Float32Array(N);
  [0, 0.3, 1, 0.3, 0.55, 0.14, 0.26, 0.06, 0.12, 0.04, 0.07, 0, 0.035, 0, 0.02, 0].forEach((v, i) => { im[i] = v; });

  const gain = v => { const g = ac.createGain(); g.gain.value = v; return g; };
  const o1 = ac.createOscillator(), o2 = ac.createOscillator();
  o1.setPeriodicWave(wave);
  o2.setPeriodicWave(wave);
  o1.frequency.value = 50;
  // A slightly detuned twin makes the hum beat slowly.
  o2.frequency.value = 50.17;
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 360;
  lp.Q.value = 0.9;
  const hg = gain(0);
  o1.connect(lp);
  o2.connect(gain(0.45)).connect(lp);
  lp.connect(hg).connect(out);
  // The corona buzz is band-passed noise pulsing at 100 Hz.
  const ns = ac.createBufferSource();
  ns.buffer = noiseBuf;
  ns.loop = true;
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 2600;
  bp.Q.value = 0.6;
  const am = gain(0.5), mod = ac.createOscillator(), bz = gain(0);
  mod.frequency.value = 100;
  mod.connect(gain(0.5)).connect(am.gain);
  ns.connect(bp).connect(am).connect(bz).connect(out);
  [o1, o2, mod, ns].forEach(n => n.start());

}
// The hum swells and brightens while the glass is touched.
function humLevel(k, now) {
  const a = live();
  if (!a || !hum || (now - humAt < 90 && Math.abs(k - humWas) < 0.15)) return;
  humAt = now;
  humWas = k;
  const t = a.currentTime;
  hum.hg.gain.setTargetAtTime(0.06 + 0.05 * k, t, 0.14);
  hum.lp.frequency.setTargetAtTime(360 + 700 * k, t, 0.18);
  hum.bz.gain.setTargetAtTime(0.026 * k, t, 0.1);
}
// A crackle: sparse noise grains, each a click with a tiny tail.
function crackle(x, size, kind) {
  const a = live();
  if (!a || voices >= MAXV) return;
  const t = a.currentTime + LEAD;
  if (t < crNext[kind]) return;
  crNext[kind] = t + crGap[kind] * jit(0.3);
  const sr = a.sampleRate, len = Math.ceil(sr * (0.03 + 0.24 * size));
  const buf = a.createBuffer(1, len, sr), d = buf.getChannelData(0);
  for (let n = Math.round((3 + size * 28) * jit(0.3)), g = 0; g < n; g++) {
    const at = Math.floor(len * 0.92 * Math.random() ** 1.6), gl = Math.max(4, Math.floor(sr * rand(0.0003, 0.0022)));
    const amp = (0.25 + 0.75 * Math.random() ** 2) * (Math.random() < 0.5 ? -1 : 1);
    for (let i = 0; i < gl && at + i < len; i++) d[at + i] += amp * (Math.random() * 2 - 1) * Math.exp(-i / (gl * 0.3));
    d[at] += amp * 0.9;

  const src = a.createBufferSource(), hp = a.createBiquadFilter(), bp = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf;

  hp.frequency.value = 1300 * jit(0.1);
  bp.type = 'bandpass';
  bp.frequency.value = rand(2800, 5400);
  bp.Q.value = 0.7;
  g.gain.value = level() * (0.2 + 0.28 * size) * jit(0.12);

  if (a.createStereoPanner) {
    pan = a.createStereoPanner();
    pan.pan.value = clamp(x * 1.6 - 0.8, -0.8, 0.8);
    pan.connect(out);
    end = pan;
  }
  src.connect(hp).connect(bp).connect(g).connect(end);
  src.start(t);
  track(src, hp, bp, g, ...(pan ? [pan] : []));
}

/* ---------- the camera, shared by the shader and the input ---------- */
// The globe has radius 1 and sits on the base.
const RE = 0.1, RIN = 0.972, YTOP = -0.78;
const C = { px: 0, py: 0, pz: 0, fx: 0, fy: 0, fz: 0, ux: 0, uy: 0, uz: 0, s: 1, a: 1, gx: 0, gy: 0, gr: 1 };
let W = 0, H = 0, cw = 1, ch = 1;
function setCamera() {
  const el = 8.5 * D2R, dist = 7.4, ty = -0.32;
  C.py = ty + dist * Math.sin(el);
  C.pz = dist * Math.cos(el);
  C.fy = -Math.sin(el);
  C.fz = -Math.cos(el);
  C.uy = Math.cos(el);
  C.uz = -Math.sin(el);
  C.a = W / H;
  C.s = Math.max(1.5, 1.24 / C.a) / dist;
  proj(0, 0, 0, 0);
  C.gx = PX[0];
  C.gy = PY[0];
  C.gr = (ch * 0.5) / C.s / Math.sqrt(C.py * C.py + C.pz * C.pz - 1);
}
// Projection scratch: canvas pixels, y up, and pixels per unit.
const NP = 40, PX = new Float32Array(NP), PY = new Float32Array(NP), PK = new Float32Array(NP);
const SX = new Float32Array(NP), SY = new Float32Array(NP), SZ = new Float32Array(NP);
function proj(x, y, z, i) {

  PY[i] = (0.5 + (0.5 * (vy * C.uy + vz * C.uz) * inv) / C.s) * ch;
  PK[i] = (ch * 0.5 * inv) / C.s;

// Finds the glass point under a stage position, or the nearest rim.
function globeAt(x, y, margin) {
  const u = (x / W) * 2 - 1, v = 1 - (y / H) * 2;
  let dx = u * C.s * C.a, dy = C.fy + C.uy * v * C.s, dz = C.fz + C.uz * v * C.s;
  const l = Math.hypot(dx, dy, dz);
  dx /= l; dy /= l; dz /= l;
  const b = C.py * dy + C.pz * dz, c = C.py * C.py + C.pz * C.pz - 1, h = b * b - c;
  let t = -b, hx, hy, hz;
  if (h >= 0) t -= Math.sqrt(h);
  hx = dx * t;
  hy = C.py + dy * t;
  hz = C.pz + dz * t;
  const r = Math.hypot(hx, hy, hz);
  if (h < 0 && r - 1 > margin) return null;
  hx /= r; hy /= r; hz /= r;
  // The collar hides the bottom of the glass.
  if (hy < -0.72) {

    const k = Math.sqrt((1 - 0.72 * 0.72) / Math.max(1e-6, hx * hx + hz * hz));

/* ---------- filaments ---------- */
let T = rand(0, 500), flash = 0, Lint = 1;
const fils = [], touches = new Map(), ghosts = [];
const B1 = new Float32Array(3), B2 = new Float32Array(3);
// Two axes across a direction.
function perp(x, y, z) {
  let ax = -z, ay = 0, az = x, l = Math.hypot(ax, az);

function randomDir(f) {
  let x, y, z, l;
  do { x = randn(); y = randn(); z = randn(); l = Math.hypot(x, y, z); } while (l < 1e-3 || y / l < -0.5);

function makeForks(f) {

function makeFils(n) {
  fils.length = 0;

    const y = 0.9 - 1.4 * ((i + 0.5) / n), r = Math.sqrt(1 - y * y), a = i * 2.39996;
    const f = { ux: r * Math.cos(a), uy: y, uz: r * Math.sin(a), vx: 0, vy: 0, vz: 0, seed: rand(0, 200), h: Math.random(), life: rand(2, 9), grow: 1, delay: 0, flare: 0, I: 1, k: 0, kT: 0, tx: 0, ty: 0, tz: 1, tseed: 0, hold: 0, touch: null, forks: [], col: [0, 0, 0], tipCol: [0, 0, 0] };

// A filament strikes anew from the electrode toward a new spot.
function restrike(f, near) {

    perp(f.ux, f.uy, f.uz);
    const a = rand(0, TAU), s = rand(0.35, 0.75);

    f.uy += (B1[1] * Math.cos(a) + B2[1] * Math.sin(a)) * s;
    f.uz += (B1[2] * Math.cos(a) + B2[2] * Math.sin(a)) * s;

    f.delay = rand(0, 0.08);

  crackle(x, 1, 'burst');

/* ---------- touches ---------- */
function touchStart(id, d, x) {
  if (touches.size >= 5 || touches.has(id)) return;
  const t = { id, dx: d[0], dy: d[1], dz: d[2], sx: d[0], sy: d[1], sz: d[2], hold: 0, str: 0, seed: rand(0, 200), fils: [], crk: rand(0.05, 0.15), x };
  const free = fils.filter(f => !f.touch);
  const want = Math.min(Math.random() < 0.2 ? 1 : Math.random() < 0.5 ? 2 : 3, Math.max(1, free.length - 3), free.length);
  free.sort((a, b) => b.ux * d[0] + b.uy * d[1] + b.uz * d[2] - (a.ux * d[0] + a.uy * d[1] + a.uz * d[2]));

    f.touch = t;
    f.kT = 1;
    f.tseed = t.seed;
    f.tx = t.sx; f.ty = t.sy; f.tz = t.sz;
    if (f.grow < 1) { f.grow = 1; f.delay = 0; }
    t.fils.push(f);

function touchMove(id, d, x) {
  const t = touches.get(id);
  if (!t) return;
  t.dx = d[0]; t.dy = d[1]; t.dz = d[2];
  t.x = x;
  wake();
}
function touchEnd(id) {
  const t = touches.get(id);
  if (!t) return;
  for (const f of t.fils) { f.touch = null; f.kT = 0; }
  touches.delete(id);
  ghosts.push(t);
  wake();

/* ---------- one step of the globe ---------- */
function step(dt, now) {
  const amb = reduce ? 0 : 1;
  let busy = false;
  T += dt * amb;
  if (palK < 1) { palK = reduce ? 1 : Math.min(1, palK + dt / 0.45); mixPal(); busy = true; }

  if (!lowDpr && ++frames > 30) {
    slow = raw > 0.024 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 40) { lowDpr = true; fit(); }
  }
  const busy = step(dt, now);
  build();
  render();
  if (++drawn === 2) canvas.classList.add('on');
  // Reduced motion freezes the drift, so the loop rests once input settles.
  if (!reduce || busy || drawn < 3) raf = requestAnimationFrame(frame);
}
// Off screen or hidden, the globe pauses and goes quiet.
function sync() {
  const v = ready && onScreen && !document.hidden;
  if (v === visible) return;
  visible = v;
  if (v) {
    wake();
    if (sound.on && ac && ac.state !== 'running') audio();
  } else {
    cancelAnimationFrame(raf);
    raf = 0;
    if (ac && ac.state === 'running') ac.suspend()?.catch(() => {});
  }
}

/* ---------- input ---------- */
let rect = null;
addEventListener('scroll', () => { rect = null; }, { passive: true });
function local(e) {
  const r = rect || (rect = panel.getBoundingClientRect());
  return [e.clientX - r.left, e.clientY - r.top];
}
const downs = new Map();
panel.addEventListener('pointerdown', e => {
  if (!ready || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const [x, y] = local(e);
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  downs.set(e.pointerId, { x, y, t: e.timeStamp, moved: 0 });
  const d = globeAt(x, y, 0.03);
  if (d) touchStart(e.pointerId, d, x / W);
});
panel.addEventListener('pointermove', e => {
  const s = downs.get(e.pointerId);
  if (!s) return;
  const [x, y] = local(e);
  s.moved = Math.max(s.moved, Math.hypot(x - s.x, y - s.y));
  if (touches.has(e.pointerId)) {
    // A finger slid well off the glass lets the arc go.
    const d = globeAt(x, y, 0.35);
    if (d) touchMove(e.pointerId, d, x / W);
    else touchEnd(e.pointerId);
  } else {
    const d = globeAt(x, y, 0);
    if (d) touchStart(e.pointerId, d, x / W);
  }
});
function lift(e) {
  const s = downs.get(e.pointerId);
  if (!s) return;
  downs.delete(e.pointerId);
  touchEnd(e.pointerId);
  if (e.type === 'pointerup' && e.timeStamp - s.t < 260 && s.moved < 12) burst(s.x / W);
}
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => panel.addEventListener(t, lift));
panel.addEventListener('contextmenu', e => e.preventDefault());

// Arrow keys steer a virtual fingertip over the front of the glass.
const aim = { az: 0, el: 0.2 };
const ARROWS = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
function aimDir() {
  return [Math.sin(aim.az) * Math.cos(aim.el), Math.sin(aim.el), Math.cos(aim.az) * Math.cos(aim.el)];
}
function aimX() {
  const d = aimDir();
  proj(d[0], d[1], d[2], 0);
  return PX[0] / cw;
}
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const k = e.key;
  if (k === ' ') {
    // Buttons and links keep Space for themselves.
    if (e.target.closest?.('button, a')) return;
    e.preventDefault();
    if (!e.repeat && ready) burst(aimX());
  } else if (ARROWS[k]) {
    e.preventDefault();
    if (!ready) return;
    if (touches.has('key')) {
      aim.az = clamp(aim.az + ARROWS[k][0] * 0.14, -1.25, 1.25);
      aim.el = clamp(aim.el + ARROWS[k][1] * 0.12, -0.55, 1.15);
      touchMove('key', aimDir(), aimX());
    } else touchStart('key', aimDir(), aimX());
  } else if (k === 'Escape' && touches.has('key')) {
    e.preventDefault();
    touchEnd('key');
  }
});

const chips = [...document.querySelectorAll('.chip[data-pal]')];
function setPal(name) {
  if (name === palName) return;
  palFrom = copyPal(pal);
  palTo = palCols(name);
  palName = name;
  palK = reduce ? 1 : 0;
  mixPal();
  chips.forEach(c => c.setAttribute('aria-pressed', String(c.dataset.pal === name)));
  for (const f of fils) f.flare = Math.max(f.flare, 0.35);
  crackle(0.5, 0.25, 'amb');
  wake();
}
chips.forEach(c => c.addEventListener('click', () => setPal(c.dataset.pal)));
sound.onChange(on => {
  if (on) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});

/* ---------- start: shaders link while the filaments settle ---------- */
function failed() {
  ready = false;
  sync();
  canvas.hidden = true;
  const p = panel.querySelector('.fail');
  if (noFloat) p.textContent = 'Plasma globe needs WebGL 2 float targets, which this browser lacks.';
  p.hidden = false;
  chips.forEach(c => { c.disabled = true; });
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); ready = false; sync(); });
canvas.addEventListener('webglcontextrestored', async () => {
  try {
    await initGL();
    allocTargets();
    ready = true;
    sync();
  } catch (err) { console.error(err); failed(); }
});
async function boot() {
  await idle();
  fit();
  if (!W) { W = 1160; H = 652; canvas.width = cw = 1160; canvas.height = ch = 652; setCamera(); }
  makeFils(W < 640 ? 9 : 11);
  const gate = initGL();
  gate.catch(() => {});
  // A few seconds of drift have already run.
  for (let i = 0; i < 90; i++) step(1 / 30, 0);
  try { await gate; } catch (err) { console.error(err); failed(); return; }
  allocTargets();
  ready = true;
  new ResizeObserver(fit).observe(panel);
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; sync(); }).observe(panel);
  document.addEventListener('visibilitychange', sync);
}
if (document.readyState === 'complete') boot();
else addEventListener('load', boot, { once: true });
</script>
<script type="module">
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
</script>
