<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.08 0.02 255); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Milk crown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./event.js">
<link rel="modulepreload" href="./scene.js">
<link rel="modulepreload" href="./sound.js">
<link rel="modulepreload" href="../shared/gl.js">
<link rel="modulepreload" href="../shared/glow.js">
<link rel="modulepreload" href="../shared/grade.js">
<style>
/* Milk crown: a drop into milk in slow motion, a crown, a jet. */
:root { --stage: oklch(0.08 0.02 255); }
.stage--milkcrown { background: var(--stage); cursor: ew-resize; }
.stage--milkcrown canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--milkcrown canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--milkcrown canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Milk crown</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--milkcrown" id="stage" tabindex="0" role="application" aria-label="A white drop falls into a pool of milk in slow motion, in front of a studio backdrop. A thin crown rises round the crater, with a bead on every point; then a jet shoots up from the centre and pinches off a droplet. Click to release a drop. Drag left or right to scrub the moment frame by frame, or press the arrow keys to step one frame.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2 with float targets.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Milk crown</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
