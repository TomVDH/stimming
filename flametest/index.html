<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.11 0.012 270); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flame test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">

<style>
/* Flame test: a burner flame, a prism and a plate of emission lines. */
:root { --stage: oklch(0.11 0.012 270); }
.stage--flametest canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--flametest canvas.on { opacity: 1; }
.stage--flametest { cursor: crosshair; }
.stage--flametest.blow { cursor: grabbing; }
@media (prefers-reduced-motion: reduce) { .stage--flametest canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Flame test</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--flametest" id="stage" tabindex="0" role="application" aria-label="A burner flame and a prism. Click to flick a pinch of salt into the flame; hold to keep feeding it; drag to blow. The prism splits the flame's light into the salt's emission lines.">
      <p class="fail" hidden>Flame test needs WebGL 2 with float render targets, which this browser does not give.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Flame test</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<script type="module">
import { initPage, whenVisible, fitCanvas, onQuality, linFit, css, reduced } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';

const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- salts ---------- */
// Lines: [nm, weight]. Bands: [nm, weight, width in nm].
// Weights come from flame spectra, then tuning by eye.
const SALTS = [
  { id: 'li', label: 'Lithium', col: [0.56, 0.21, 24], tau: 2.5,
    lines: [[670.8, 1], [610.4, 0.25], [460.3, 0.08]] },
  { id: 'na', label: 'Sodium', col: [0.82, 0.17, 80], tau: 6,
    lines: [[589.0, 1], [589.6, 0.5]] },
  { id: 'k', label: 'Potassium', col: [0.68, 0.12, 310], tau: 2.5,
    lines: [[766.5, 0.8], [769.9, 0.5], [404.4, 0.35], [404.7, 0.2]] },
  { id: 'cu', label: 'Copper', col: [0.74, 0.15, 170], tau: 2.5,
    lines: [[510.5, 0.5], [515.3, 0.6], [521.8, 0.7], [428, 0.35, 6], [435, 0.4, 6], [443, 0.35, 6], [452, 0.3, 6], [488, 0.3, 5], [498, 0.35, 5], [535, 0.4, 14]] },
  { id: 'sr', label: 'Strontium', col: [0.6, 0.21, 28], tau: 2.5,
    lines: [[460.7, 0.3], [606, 0.6, 8], [646, 0.7, 6], [659, 0.8, 5], [668, 0.9, 6], [682, 0.6, 6], [636, 0.4, 5], [674, 0.5, 4]] },
  { id: 'ca', label: 'Calcium', col: [0.66, 0.17, 45], tau: 2.5,
    lines: [[422.7, 0.5], [554, 0.6, 8], [602, 0.5, 6], [622, 1, 7], [646, 0.35, 6]] },
  { id: 'ba', label: 'Barium', col: [0.86, 0.13, 125], tau: 2.5,
    lines: [[553.5, 1], [455.4, 0.2], [493.4, 0.2], [487, 0.3, 5], [513, 0.5, 6], [524, 0.55, 6], [534, 0.45, 6]] },
];
// The gas flame's own light: CH and the C2 Swan bands.
const GAS_LINES = [[431.4, 0.5, 1.5], [473.7, 0.2, 3], [516.5, 0.35, 3], [563.5, 0.15, 3]];
const NA = SALTS.findIndex(s => s.id === 'na');
const MAXL = 48;

/* ---------- colour of one wavelength ---------- */
// The CIE 1931 multi-lobe fit, copied from Prism.
// The result is linear sRGB, peak channel one, dim edges lifted.
const g3 = (x, m, s1, s2) => { const t = (x - m) / (x < m ? s1 : s2); return Math.exp(-0.5 * t * t); };
function spectral(n) {
  const X = 1.056 * g3(n, 599.8, 37.9, 31) + 0.362 * g3(n, 442, 16, 26.7) - 0.065 * g3(n, 501.1, 20.4, 26.2);
  const Y = 0.821 * g3(n, 568.8, 46.9, 40.5) + 0.286 * g3(n, 530.9, 16.3, 31.1);
  const Z = 1.217 * g3(n, 437, 11.8, 36) + 0.681 * g3(n, 459, 26, 13.8);
  const c = [3.2406 * X - 1.5372 * Y - 0.4986 * Z, -0.9689 * X + 1.8758 * Y + 0.0415 * Z, 0.0557 * X - 0.204 * Y + 1.057 * Z].map(v => Math.max(0, v));
  const m = Math.max(...c, 1e-5), b = 0.7 + 0.3 * clamp(Y * 1.3);
  // The fit's far tails turn green, so the edges hold red and violet.
  const r = clamp((n - 690) / 30), v = clamp((415 - n) / 20);
  const sm = x => x * x * (3 - 2 * x), R = [1, 0, 0], V = [0.55, 0, 1];
  return c.map((x, i) => lerp(lerp(x / m, R[i], sm(r)), V[i], sm(v)) * b);
}
SALTS.forEach(s => { s.lin = linFit(...s.col); s.lines.forEach(l => { l.rgb = spectral(l[0]); }); });
GAS_LINES.forEach(l => { l.rgb = spectral(l[0]); });
const GAS = linFit(0.5, 0.14, 265);
const SOOT = linFit(0.8, 0.16, 68);

/* ---------- state ---------- */
// amt is the salt in the flame; shown chases it, so lines swell in.
const amt = new Float32Array(SALTS.length), shown = new Float32Array(SALTS.length);
let salt = 0, air = 0.75, cobalt = 0, grating = 0, gratingTo = 0, trace = 1;
let feeding = false, feedAt = null, feedAcc = 0, puffE = 0, puffV = 0, lean = 0, leanTo = 0, time = 0;

const act = { flick() {}, shuffle() {}, reset() {}, air() {} };
const ui = initPage({ id: 'flametest', bar: {
  choice: { label: 'Salt', value: 'li', display: 'stepper',
    options: SALTS.map((s, i) => ({ value: s.id, label: s.label, dot: css(s.col), key: String(i + 1) })),
    onPick: v => { salt = SALTS.findIndex(s => s.id === v); act.flick(); } },
  slider: { label: 'Air', min: 0, max: 1, step: 0.01, value: air, onInput: v => act.air(v) },
  actions: [{ verb: 'flick', onPress: () => act.flick() }, { verb: 'shuffle', onPress: () => act.shuffle() }],
  settings: [
    { type: 'toggle', id: 'cobalt', label: 'Cobalt glass', value: false, persist: true, onToggle: v => { cobalt = v ? 1 : 0; live(); } },
    { type: 'choice', id: 'spectro', label: 'Spectrometer', value: 'prism', persist: true,
      options: [{ value: 'prism', label: 'Prism' }, { value: 'grating', label: 'Grating' }], onPick: v => { gratingTo = v === 'grating' ? 1 : 0; live(); } },
    { type: 'toggle', id: 'trace', label: 'Trace sodium', value: true, persist: true, onToggle: v => { trace = v ? 1 : 0; live(); } },
  ],
  reset: () => act.reset(),
  quality: true,
  // Touch screens have no number keys, so that entry drops.
  keys: [['click', 'flick'], ['hold', 'feed'], ['drag', 'blow'], ['1-7', 'salt']].filter(k => k[0] !== '1-7' || !matchMedia('(pointer: coarse)').matches),
} });
{
  const v = k => ui.setting(k)?.value;
  cobalt = v('cobalt') ? 1 : 0;
  grating = gratingTo = v('spectro') === 'grating' ? 1 : 0;
  trace = v('trace') === false ? 0 : 1;
}

let markReady;
const glReady = new Promise(r => { markReady = r; });
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready, glReady]) });

/* ---------- shaders ---------- */
const TRI = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const HEAD = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
out vec4 o;
`;
const NOISE = `
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; }
  return s;
}
`;
// The scene: flame, beam, wedge, fan and plate, in device pixels.
const SCENE_FS = HEAD + NOISE + `
uniform vec2 uRes;
uniform float uS, uTime, uDpr;
uniform vec3 uBase;         // flame base x, y, height
uniform vec3 uTint, uGas, uSoot, uBeam;
uniform float uSalt, uPuff, uAir, uLean, uCobalt, uGrating, uSootK, uMix2, uFanY;
uniform vec3 uTint2;
uniform vec3 uWedge;        // centre x, y, half side
uniform vec2 uIn, uOut;     // beam entry and exit on the wedge
uniform vec4 uPlate;        // x0, y0, x1, y1
uniform int uN;
uniform vec4 uLX[${MAXL}];  // plate x, sigma px, intensity, spare
uniform vec3 uLC[${MAXL}];

float g3(float x, float m, float s1, float s2) { float t = (x - m) / (x < m ? s1 : s2); return exp(-0.5 * t * t); }
vec3 spectral(float n) {
  float X = 1.056 * g3(n, 599.8, 37.9, 31.0) + 0.362 * g3(n, 442.0, 16.0, 26.7) - 0.065 * g3(n, 501.1, 20.4, 26.2);
  float Y = 0.821 * g3(n, 568.8, 46.9, 40.5) + 0.286 * g3(n, 530.9, 16.3, 31.1);
  float Z = 1.217 * g3(n, 437.0, 11.8, 36.0) + 0.681 * g3(n, 459.0, 26.0, 13.8);
  vec3 c = max(vec3(3.2406 * X - 1.5372 * Y - 0.4986 * Z, -0.9689 * X + 1.8758 * Y + 0.0415 * Z, 0.0557 * X - 0.204 * Y + 1.057 * Z), 0.0);
  c /= max(max(c.r, c.g), c.b) + 1e-5;
  // The fit's far tails turn green, so the edges hold red and violet.
  c = mix(c, vec3(1.0, 0.0, 0.0), smoothstep(690.0, 720.0, n));
  c = mix(c, vec3(0.55, 0.0, 1.0), smoothstep(415.0, 395.0, n));
  return c * (0.45 + 0.55 * clamp(Y * 1.3, 0.0, 1.0));
}
// Plate x to wavelength: a prism squeezes red, a grating spaces evenly.
float plateLam(float x) {
  float t = clamp((uPlate.z - x) / (uPlate.z - uPlate.x), 0.0, 1.0);
  float a = 1.0 / (780.0 * 780.0), b = 1.0 / (390.0 * 390.0);
  return mix(mix(1.0 / sqrt(a + t * (b - a)), 780.0 - 390.0 * t, 0.5), 780.0 - 390.0 * t, uGrating);
}
// A hot body near 1,500 K, normalised at 700 nm.
float planck(float n) {
  float l = n * 1e-9, l7 = 700e-9;
  return pow(l7 / l, 5.0) * (exp(1.4388e-2 / (l7 * 1500.0)) - 1.0) / (exp(1.4388e-2 / (l * 1500.0)) - 1.0);
}
// Cobalt glass takes out the yellow, 560 to 620 nm.
float cobaltT(float n) { return 1.0 - uCobalt * 0.94 * exp(-pow((n - 590.0) / 28.0, 2.0)); }
float sdTri(vec2 p, float r) {
  const float k = 1.7320508;
  p.x = abs(p.x) - r;
  p.y = p.y + r / k;
  if (p.x + k * p.y > 0.0) p = vec2(p.x - k * p.y, -k * p.x - p.y) / 2.0;
  p.x -= clamp(p.x, -2.0 * r, 0.0);
  return -length(p) * sign(p.y);
}
float segDist(vec2 p, vec2 a, vec2 b, out float s) {
  vec2 ab = b - a;
  s = clamp(dot(p - a, ab) / dot(ab, ab), 0.0, 1.0);
  return length(p - a - ab * s);
}

vec3 flame(vec2 p, float t) {
  vec2 q = (p - uBase.xy) / uBase.z;
  float y = q.y;
  if (y < -0.1 || y > 1.7) return vec3(0.0);
  float x = q.x - uLean * y * y * 0.35;
  float soot = uSootK;
  // Moving noise makes the tongues; a soot flame wanders more.
  float n1 = fbm(vec2(x * 4.0, y * 2.6 - t * 2.1));
  float n2 = fbm(vec2(x * 7.0 + 3.1, y * 5.0 - t * 3.3));
  x += (n1 - 0.5) * (0.16 + 0.12 * soot) * y + sin(t * 1.3 + y * 2.0) * 0.025 * y * y;
  float L = mix(1.3, 0.92, uAir) * (1.0 + 0.28 * uPuff);
  float yn = (y + (n2 - 0.5) * 0.22 * y) / L;
  float r = 0.22 * (1.0 + 0.45 * uPuff) * pow(clamp(yn, 0.0, 1.0), 0.35) * pow(clamp(1.0 - yn, 0.0, 1.0), 1.25) + 0.004;
  float d = abs(x) / r;
  // The mantle is a filled body; its path length gives the brightness.
  float body = sqrt(max(1.0 - d * d, 0.0)) * smoothstep(0.0, 0.06, yn) * (1.0 - smoothstep(0.55, 1.0, yn));
  // Noise tears the upper flame into tongues.
  float n3 = fbm(vec2(x * 9.0 - 1.3, y * 6.0 - t * 4.2));
  body *= mix(1.0, smoothstep(0.25, 0.75, n3 + 0.45 - yn * 0.5), smoothstep(0.25, 0.8, yn));
  float halo = exp(-max(d - 1.0, 0.0) * 2.5) * 0.08 * smoothstep(0.0, 0.1, yn) * (1.0 - smoothstep(0.5, 1.1, yn));
  body *= 0.55 + 0.9 * fbm(vec2(x * 6.0 + 7.0, y * 3.5 - t * 2.7));
  float m2 = smoothstep(0.3, 0.7, fbm(vec2(x * 5.0 - 2.0, y * 2.2 - t * 1.6)) + uMix2 - 0.5) * step(0.001, uMix2);
  vec3 tint = mix(uTint, uTint2, m2);
  vec3 mantle = uGas * (0.12 + 0.1 * uAir) * (1.0 - uSalt) + tint * uSalt * 1.25 + uSoot * soot * 2.0 * smoothstep(0.08, 0.35, yn);
  vec3 c = mantle * (body + halo) * (1.0 + 0.6 * uPuff);
  // The inner cone: a thin bright shell of CH and C2 light.
  float ch = mix(0.04, 0.3, uAir);
  float yc = y / ch;
  if (yc > 0.0 && yc < 1.0) {
    float rc = 0.075 * pow(1.0 - yc, 0.6) * (0.4 + 0.6 * uAir);
    float shell = exp(-pow((abs(q.x) - rc) / 0.012, 2.0)) + 0.35 * smoothstep(rc, 0.0, abs(q.x));
    c += vec3(0.25, 0.55, 1.6) * shell * uAir * smoothstep(1.0, 0.75, yc) * 1.4;
  }
  // The nozzle glows where the gas first burns.
  c += uGas * 1.5 * exp(-dot(q - vec2(0.0, 0.0), q) / 0.0012);
  return c;
}

void main() {
  vec2 p = gl_FragCoord.xy;
  float t = uTime, S = uS;
  vec3 c = vec3(0.0);
  vec3 fl = uBeam * 0.7;

  // The room: dark, lit only by the flame.
  vec2 qf = (p - uBase.xy - vec2(0.0, 0.35 * uBase.z)) / S;
  c += fl * 0.06 * exp(-dot(qf, qf) * 7.0);
  // A soft pool of light under the flame, with no floor edge.
  vec2 qp = (p - uBase.xy + vec2(0.0, 0.01 * S)) / (S * vec2(0.2, 0.035));
  c += fl * 0.12 * exp(-dot(qp, qp));

  vec3 f = flame(p, t);
  // Cobalt glass mutes the flame's yellow and red.
  f *= mix(vec3(1.0), vec3(0.42, 0.32, 1.15), uCobalt);
  c += f;

  // The beam: the flame's light, from its waist to the wedge.
  float s;
  vec2 fw = uBase.xy + vec2(0.0, 0.38 * uBase.z);
  float db = segDist(p, fw, uIn, s);
  float bw = S * 0.007;
  float haze = 0.7 + 0.3 * fbm(p / S * 7.0 + vec2(t * 0.06, 0.0));
  c += uBeam * exp(-pow(db / bw, 2.0)) * smoothstep(0.08, 0.35, s) * 0.55 * haze;
  c += uBeam * exp(-pow(db / (bw * 5.0), 2.0)) * smoothstep(0.08, 0.5, s) * 0.06;

  // The wedge: an outline with lit edges, and the beam inside it.
  vec2 wp = p - uWedge.xy;
  float dt = sdTri(vec2(wp.x, -wp.y), uWedge.z);
  float edge = exp(-pow(dt / (1.1 * uDpr), 2.0));
  float lit = 0.5 + 0.5 * clamp(dot(normalize(wp + 1e-4), normalize(fw - uWedge.xy)), -1.0, 1.0);
  c += edge * (vec3(0.05, 0.06, 0.08) + fl * 0.25 * lit);
  if (dt < 0.0) {
    c += vec3(0.008, 0.01, 0.014);
    float di = segDist(p, uIn, uOut, s);
    c += uBeam * exp(-pow(di / bw, 2.0)) * 0.45;
  }
  c += uBeam * 0.8 * exp(-dot(p - uIn, p - uIn) / (bw * bw * 3.0));

  // The fan: each line is a sheet from the exit point to the plate.
  float k = (p.y - uOut.y) / (uFanY - uOut.y);
  if (k > 0.0 && k < 1.0 && dt > 0.0) {
    float X = uOut.x + (p.x - uOut.x) / max(k, 1e-3);
    float w0 = S * 0.004 * (1.0 - k) / max(k, 0.02);
    float hz = 0.55 + 0.45 * fbm(p / S * 5.0 + vec2(0.0, t * 0.04));
    vec3 sh = vec3(0.0);
    for (int i = 0; i < ${MAXL}; i++) {
      if (i >= uN) break;
      float sg = uLX[i].y + w0;
      sh += uLC[i] * uLX[i].z * exp(-0.5 * pow((X - uLX[i].x) / sg, 2.0)) * sqrt(uLX[i].y / sg);
    }
    // The soot glow fans out as a continuous rainbow.
    float soot = uSootK;
    if (soot > 0.001 && X > uPlate.x && X < uPlate.z) {
      float n = plateLam(X);
      sh += spectral(n) * planck(n) * soot * 0.05 * cobaltT(n);
    }
    c += sh * hz * (0.25 + 0.6 * k * k);
  }

  // The plate: a dark strip that only shows lines.
  if (p.x > uPlate.x - 2.0 * S && p.x < uPlate.z + 2.0 * S) {
    vec2 pc = vec2(clamp(p.x, uPlate.x, uPlate.z), clamp(p.y, uPlate.y, uPlate.w));
    float out_ = length(p - pc);
    float inside = 1.0 - smoothstep(0.0, uDpr, out_);
    vec3 pl = vec3(0.002, 0.0022, 0.003);
    float v = smoothstep(uPlate.y, uPlate.y + 3.0 * uDpr, p.y) * smoothstep(uPlate.w, uPlate.w - 3.0 * uDpr, p.y);
    vec3 ln = vec3(0.0);
    for (int i = 0; i < ${MAXL}; i++) {
      if (i >= uN) break;
      float e = exp(-0.5 * pow((p.x - uLX[i].x) / uLX[i].y, 2.0)) * uLX[i].z;
      ln += uLC[i] * e * 3.2 + vec3(e * e * 0.6);
    }
    float soot = uSootK;
    if (soot > 0.001) {
      float n = plateLam(p.x);
      ln += spectral(n) * planck(n) * soot * 0.6 * cobaltT(n);
    }
    c += (pl + ln * v) * inside;
    // A thin rim, lit faintly by what lands on it.
    vec2 bh = 0.5 * (uPlate.zw - uPlate.xy), bq = abs(p - 0.5 * (uPlate.xy + uPlate.zw)) - bh;
    float box = length(max(bq, 0.0)) + min(max(bq.x, bq.y), 0.0);
    float rim = exp(-pow(box / (0.8 * uDpr), 2.0));
    c += rim * (vec3(0.03, 0.033, 0.045) + ln * 0.05);
    // Ticks every 50 nm, under the plate.
    float below = p.y - uPlate.w;
    if (below > 2.0 * uDpr && below < 9.0 * uDpr) {
      for (int j = 0; j < 8; j++) {
        float n = 400.0 + 50.0 * float(j);
        float a = 1.0 / (780.0 * 780.0), b = 1.0 / (390.0 * 390.0);
        float tt = mix(0.5 * ((1.0 / (n * n) - a) / (b - a) + (780.0 - n) / 390.0), (780.0 - n) / 390.0, uGrating);
        float tx = mix(uPlate.z, uPlate.x, tt);
        float len = (j % 2 == 0) ? 9.0 : 5.5;
        c += vec3(0.07, 0.075, 0.09) * exp(-pow((p.x - tx) / (0.6 * uDpr), 2.0)) * step(below, len * uDpr);
      }
    }
  }
  o = vec4(c, 1.0);
}`;

  }
  gl.useProgram(P.pt.p);
  gl.uniform2f(P.pt.u.uRes, W, H);
  gl.bindVertexArray(ptVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, ptBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, gData, 0, n * 6);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene.fb);
  gl.viewport(0, 0, W, H);
  gl.drawArrays(gl.POINTS, 0, n);
  gl.disable(gl.BLEND);
  gl.bindVertexArray(triVao);
}

/* ---------- actions ---------- */
// A pinch is about 14 grains; tapping the flame itself lands them at once.
function flick(i = salt, at = spatula(), pinch = 0.9) {
  launch(i, at[0], at[1], reduced() ? 8 : 14, pinch);
  live();
}
act.flick = () => flick();
act.shuffle = () => {
  const a = Math.floor(Math.random() * SALTS.length);
  let b = Math.floor(Math.random() * (SALTS.length - 1));
  if (b >= a) b++;
  flick(a, spatula(), 0.8);
  const [x, y] = spatula();
  flick(b, [x + 0.68 * G.base[2], y], 0.8);
};
act.air = v => { air = v; live(); };
act.reset = () => {
  amt.fill(0);
  shown.fill(0);
  air = 0.75;
  ui.slider.set(air);
  salt = 0;
  ui.choice.set('li');
  amt[0] = shown[0] = 1;
  grains.length = 0;
  puffE = puffV = 0;
  live();
};

/* ---------- pointer ---------- */
// A press becomes a drag after 8 px, or a hold after 260 ms.
// A release that is neither is a tap.
let ptr = null, holdTo = 0;
// Client pixels to device pixels, from the bottom left.
function toGL(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return [(cx - r.left) * (canvas.width / r.width), (r.bottom - cy) * (canvas.height / r.height)];
}
function down(e) {
  if (ptr || e.button > 0) return;
  try { canvas.setPointerCapture(e.pointerId); } catch { /* A synthetic pointer has no capture. */ }
  ptr = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, cx: e.clientX, cy: e.clientY, t: performance.now(), mode: 'press' };
  holdTo = setTimeout(() => {
    if (ptr?.mode !== 'press') return;
    ptr.mode = 'hold';
    feeding = true;
    feedAt = toGL(ptr.cx, ptr.cy);
    live();
  }, 260);
  live();
}
function move(e) {
  if (!ptr || e.pointerId !== ptr.id) return;
  const now = performance.now(), dt = Math.max(0.008, (now - ptr.t) / 1000);
  if (ptr.mode === 'press' && Math.hypot(e.clientX - ptr.x0, e.clientY - ptr.y0) > 8) {
    clearTimeout(holdTo);
    ptr.mode = 'drag';
    stage.classList.add('blow');
  }
  if (ptr.mode === 'drag') {
    // The drag's speed leans the flame, in flame heights per second.
    const v = (e.clientX - ptr.x) / dt / (G.base[2] / G.dpr);
    leanTo = clamp(leanTo + v * 0.05 * (reduced() ? 0.5 : 1), -1.2, 1.2);
    live();
  }
  if (ptr.mode === 'hold') feedAt = toGL(e.clientX, e.clientY);
  ptr.x = ptr.cx = e.clientX;
  ptr.cy = e.clientY;
  ptr.t = now;
}
function up(e) {
  if (!ptr || (e && e.pointerId !== ptr.id)) return;
  clearTimeout(holdTo);
  const m = ptr.mode;
  ptr = null;
  feeding = false;
  feedAt = null;
  stage.classList.remove('blow');
  if (m === 'press' && e?.type === 'pointerup') flick(salt, toGL(e.clientX, e.clientY));
  live();
}

/* ---------- boot ---------- */
try {
  await initGL();
  layout();
  alloc();
  // The first frame burns: a pinch of Lithium is already lit.
  amt[0] = shown[0] = 1;
  time = 3.7;
  render();
  gl.finish();
  canvas.classList.add('on');
} catch (err) {
  stage.querySelector('.fail').hidden = false;
  ui.hideControls?.();
  markReady();
  throw err;
}
markReady();
wake();

canvas.addEventListener('pointerdown', down);
canvas.addEventListener('pointermove', move);
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
canvas.addEventListener('lostpointercapture', up);
// Space flicks on a press and feeds while held, on keyboards only.
let spaceAt = 0, spaceTo = 0;
stage.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat) return;
  e.preventDefault();
  spaceAt = performance.now();
  flick();
  spaceTo = setTimeout(() => { feeding = true; live(); }, 260);
});
stage.addEventListener('keyup', e => {
  if (e.code !== 'Space' || !spaceAt) return;
  clearTimeout(spaceTo);
  spaceAt = 0;
  feeding = false;
  live();
});

new ResizeObserver(() => { layout(); if (P) render(); }).observe(stage);
onQuality(() => { layout(); if (P) render(); });
// A hidden tab stops the loop and the sim clock with it.
whenVisible(stage, v => {
  visible = v;
  if (!v) { cancelAnimationFrame(raf); raf = 0; return; }
  wake();
});
</script>
</body>
</html>
