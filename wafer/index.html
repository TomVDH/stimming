<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.1 0.01 285); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wafer hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="./main.js">
<style>
/* Wafer hunt: a whole wafer under a microscope lamp, fifteen doodles hidden in it. */
:root { --stage: oklch(0.1 0.01 285); }
.stage--wafer { background: var(--stage); cursor: grab; }
.stage--wafer.grab { cursor: grabbing; }
.stage--wafer canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--wafer canvas.on { opacity: 1; }
/* The readout and the name of the last doodle share one line at the top centre. */
.stage--wafer .hud, .stage--wafer .toast {
  position: absolute; left: 50%; transform: translateX(-50%); top: 52px; z-index: 1;
  margin: 0; font: 500 11px/1 var(--slab, ui-monospace, monospace); letter-spacing: 0.07em;
  color: oklch(0.94 0.008 275 / 0.7); text-shadow: var(--halo, 0 0 3px #000); white-space: nowrap; pointer-events: none;
}
.stage--wafer .toast { color: oklch(0.9 0.1 85); opacity: 0; transition: opacity 0.4s ease; }
.stage--wafer .toast.on { opacity: 1; }
@media (max-width: 640px) { .stage--wafer .hud, .stage--wafer .toast { top: 100px; } }
@media (prefers-reduced-motion: reduce) { .stage--wafer canvas, .stage--wafer .toast { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Wafer hunt</span></div></div>
</div>

<div class="wrap">
  <main>
    <div class="stage stage--wafer" id="stage" tabindex="0" role="application" aria-label="A wafer of microchips hides fifteen tiny doodles. Drag to pan, scroll or pinch to zoom, click a doodle to mark it.">
      <canvas></canvas>
      <p class="hud" aria-hidden="true"></p>
      <p class="toast" role="status"></p>
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Wafer hunt</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
