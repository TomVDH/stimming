<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pin art</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Pin art: a chrome pin screen on a dark panel. */
:root { --stage: oklch(0.21 0.008 265); }
.stage--pins { -webkit-touch-callout: none; }
.board canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.board canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .board canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-grain"></div>
  <div class="intro-mark"><span class="intro-text">Pin art</span><span class="intro-flash">Pin art</span></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--pins board" id="board" tabindex="0" role="application" aria-label="Pin screen. Press and drag to push pins forward; hold to push deeper. Arrow keys move the press point, Space presses, S shakes the pins flat.">
      <p class="fail" hidden>Pin art needs WebGL, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="actions">
        <button class="chip" id="shake" type="button" aria-keyshortcuts="S">Shake</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag</dt><dd>push pins</dd></div>
        <div><dt>Hold</dt><dd>push deeper</dd></div>
        <div class="fine"><dt><kbd>Space</kbd></dt><dd>press</dd></div>
        <div class="fine"><dt><kbd>S</kbd></dt><dd>shake flat</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Pin art</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import { initPage, sound, reduced, onReducedChange } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
initPage({ id: 'pins' });

const panel = document.getElementById('board');
let reduce = reduced();
onReducedChange(v => { reduce = v; });
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 40, LEAD = 0.004;
// Grains refill at RATE per second, up to BURST at once.
const RATE = 240, BURST = 24;
let ac = null, out = null, noise = null, askedAt = -1e9, voices = 0, restT = 0;
let tokens = BURST, shimAcc = 0, fine = [], clack = [];
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.04 * voices);

// One struck pin: a resonant click over two inharmonic partials.

}
// A context still waking queues sounds for a moment.
function live() {

}
function track(src, ...tails) {

}
// Once the pins settle, the context sleeps until the next gesture.
function rest() {

  }, 1500);
}
const GESTURE_KEYS = new Set(['s', 'S', ' ', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
function unlock(e) {

// Touchend is the gesture iOS needs.

// Each grain is one buffered tick; tokens and voices cap the rate.

  track(src, g);

// Sliding pins shimmer; grain density follows how many move.

  shimAcc += Math.min(150, 3.4 * movers ** 0.7) * dt;
  const amp = 0.05 + 0.2 * clamp(speed / 24), t0 = a.currentTime + LEAD;

// Landing pins clack; a crowded frame plays a few, slightly louder.
function clatter(n, vmax, vsum, dt) {

  k.buffer = noise;

  lp.frequency.value = 170;
  lp.Q.value = 1.2;

  kg.gain.linearRampToValueAtTime(0.9 * level(), t + 0.004);
  kg.gain.setTargetAtTime(0, t + 0.004, 0.035);

  bp.frequency.setValueAtTime(5200, t);
  bp.frequency.linearRampToValueAtTime(7800, t + span);
  sg.gain.setValueAtTime(0, t);
  sg.gain.linearRampToValueAtTime(0.06 * level(), t + 0.05);
  sg.gain.setTargetAtTime(0, t + span, 0.12);

  s.start(t, Math.random() * 0.5);

/* ---------- the grid: hex rows, one pin pitch apart ---------- */
const MAXN = 2600, TARGET = 2000, ROW = Math.sqrt(3) / 2;
// Heights are in pin pitches; at rest a little shaft shows.
const HMAX = 7, L0 = 0.3, HEAD_Z = 0.22;
// The frame: inner margin, border width, front lip.
const MARGIN = 0.8, BORDER = 2.1, LIP = 1, BEV = 0.2;
let cols = 0, rows = 0, N = 0, halfW = 0, halfH = 0;
const PX = new Float32Array(MAXN), PY = new Float32Array(MAXN);
const H = new Float32Array(MAXN), V = new Float32Array(MAXN), T = new Float32Array(MAXN), HP = new Float32Array(MAXN);
// Per pin for the shader: occlusion, then neighbours' mean head height.
const SH = new Float32Array(MAXN * 2).fill(1);
const NB = new Int16Array(MAXN * 6), due = new Float64Array(MAXN), mode = new Uint8Array(MAXN), act = new Uint8Array(MAXN);
const SPRING = 0, FALL = 1, WAIT_FALL = 2, FADE = 3, WAIT_RISE = 4;

// Even rows sit a quarter pitch left, odd rows a quarter right.
const shift = r => (r & 1 ? 0.25 : -0.25);
// Nearest pin of a given grid, or -1 off the board.
function nearestIn(x, y, nc, nr) {
  const r = Math.round(((nr - 1) * ROW / 2 - y) / ROW);

    mode[i] = SPRING;

/* ---------- the opening relief: a hand pressed in from behind ---------- */
// Digits in palm widths: base x, base y, lean, length, radius, depth.
const DIGITS = [

  [-0.1, 0.38, 2, 0.86, 0.105, 3.3],
  [0.12, 0.36, -5, 0.78, 0.1, 3.1],
  [0.32, 0.28, -14, 0.6, 0.09, 2.8],
  [-0.4, -0.16, 52, 0.62, 0.125, 3],

// A rounded cross-section, like flesh pressed against pins.
const dome = q => (q < 1 ? (1 - q * q) ** 0.55 : 0);

/* ---------- pins: friction holds them, a spring settles them ---------- */

/* ---------- shake: the pins drop back in a sweeping wave ---------- */
let joltAt = -9, flip = 1;
// The frame rattles sideways and dies out in about half a second.

/* ---------- rendering ---------- */
let THREE = null, renderer = null, scene = null, camera = null, board = null, mark = null;

    const w = panel.clientWidth, h = panel.clientHeight;
    if (!w || !h) return;
    renderer.setPixelRatio(Math.min(devicePixelRatio, lowDpr ? 1 : cap, Math.sqrt(budget / (w * h))));
    renderer.setSize(w, h, false);
    onSize(w, h);
  };
  new ResizeObserver(apply).observe(panel);
  addEventListener('perf-low', apply);
  apply();
}
// Counter-clockwise rounded rectangle from half sizes.
function rounded(p, w, h, r) {
  p.moveTo(-w + r, -h);
  p.lineTo(w - r, -h);
  p.absarc(w - r, -h + r, r, -Math.PI / 2, 0);
  p.lineTo(w, h - r);
  p.absarc(w - r, h - r, r, 0, Math.PI / 2);
  p.lineTo(-w + r, h);
  p.absarc(-w + r, h - r, r, Math.PI / 2, Math.PI);
  p.lineTo(-w, -h + r);
  p.absarc(-w + r, -h + r, r, Math.PI, Math.PI * 1.5);
  return p;
}
// Pins take their grid spots; the frame and plate refit around them.
function place() {
  const M = shafts.instanceMatrix.array;
  for (let i = 0; i < N; i++) { M[i * 16 + 12] = PX[i]; M[i * 16 + 13] = PY[i]; }
  shafts.instanceMatrix.needsUpdate = true;
  shafts.count = heads.count = N;
  hAttr.needsUpdate = sAttr.needsUpdate = true;
  const iw = halfW + MARGIN, ih = halfH + MARGIN, shape = rounded(new THREE.Shape(), iw + BORDER, ih + BORDER, 1.5);
  // The bevel narrows the hole, so it starts a bevel wider.
  shape.holes.push(rounded(new THREE.Path(), iw + BEV, ih + BEV, 0.6));
  const g = new THREE.ExtrudeGeometry(shape, {
    depth: LIP + 0.6 - 2 * BEV, bevelEnabled: true, bevelThickness: BEV, bevelSize: BEV, bevelSegments: 3, curveSegments: 10,
  });
  g.translate(0, 0, BEV - 0.6);
  frameMesh.geometry.dispose();
  frameMesh.geometry = g;
  plate.geometry.dispose();
  plate.geometry = new THREE.PlaneGeometry(2 * iw + 0.6, 2 * ih + 0.6);
}
function aimCam(d, ty) {
  camera.position.set(0, ty + d * Math.sin(EL), d * Math.cos(EL));
  camera.lookAt(0, ty, 0);
  camera.updateMatrixWorld();
}
function bounds(pts) {
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of pts) {
    tmp.copy(p).project(camera);
    x0 = Math.min(x0, tmp.x); x1 = Math.max(x1, tmp.x);
    y0 = Math.min(y0, tmp.y); y1 = Math.max(y1, tmp.y);
  }
  return [x0, x1, y0, y1];
}
// The grid follows the panel's shape; the camera backs off until the frame fits.
function fit(w, h) {
  const A = (w / h) * 0.92;
  let nr = Math.round(Math.sqrt(TARGET / (A * ROW))), nc = Math.round(TARGET / nr);
  nc = clamp(nc, 16, 72);
  nr = clamp(nr, 16, 72);
  while (nc * nr > MAXN) nr--;
  if (!N || Math.abs(nc - cols) > 1 || Math.abs(nr - rows) > 1) build(nc, nr);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const fw = halfW + MARGIN + BORDER + BEV, fh = halfH + MARGIN + BORDER + BEV, pts = [];
  for (const sx of [-1, 1]) {
    for (const sy of [-1, 1]) for (const z of [-0.6, LIP]) pts.push(new THREE.Vector3(sx * fw, sy * fh, z));
    pts.push(new THREE.Vector3(sx * halfW, -halfH, L0 + HMAX + HEAD_Z));
  }
  let d = 150, ty = 0;
  for (let it = 0; it < 4; it++) {
    let lo = 20, hi = 3000;
    for (let k = 0; k < 30; k++) {
      d = (lo + hi) / 2;
      aimCam(d, ty);
      const [x0, x1, y0, y1] = bounds(pts);
      if (Math.max(-x0, x1) <= 0.95 && y1 - y0 <= 1.86) hi = d; else lo = d;
    }
    d = hi;
    aimCam(d, ty);
    // Recentre: an NDC offset becomes a shift along the board.
    const [, , y0, y1] = bounds(pts);
    ty += (((y0 + y1) / 2) * d * Math.tan((FOV * Math.PI) / 360)) / Math.cos(EL);
  }
  aimCam(d, ty);
  camera.near = Math.max(1, d - 90);
  camera.far = d + 90;
  camera.updateProjectionMatrix();
}
function draw(dirty = true) {
  if (dirty) hAttr.needsUpdate = sAttr.needsUpdate = true;
  board.position.x = jolt();
  mark.visible = kbd;
  if (kbd) {
    const j = nearest(kb.x, kb.y);
    mark.position.set(kb.x, kb.y, L0 + HEAD_Z + 0.3 + (j >= 0 ? H[j] : 0));
    mark.scale.setScalar(brushes.has('key') ? 0.86 : 1);
  }
  renderer.render(scene, camera);
}

/* ---------- one loop, only while something moves ---------- */
let raf = 0, last = 0, acc = 0, quiet = 0, onScreen = true, slow = 0;
function wake() {
  quiet = 0;
  if (!raf && ready && onScreen && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(ms) {
  raf = 0;
  const raw = Math.max(0, (ms - last) / 1000), dt = Math.min(raw, 1 / 30);
  last = ms;
  // Sustained slow frames drop the pixel ratio to 1.
  if (!lowDpr) {
    slow = raw > 0.03 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 20) { lowDpr = true; dispatchEvent(new Event('perf-low')); }
  }
  steer(dt);
  sculpt(dt);
  HP.set(H.subarray(0, N));
  acc += dt;
  const n = Math.min(8, Math.floor(acc / STEP));
  acc = n === 8 ? 0 : acc - n * STEP;
  impN = impSum = impMax = 0;
  for (let k = 0; k < n; k++) integrate();
  let movers = 0, sp = 0, awake = 0;
  for (let i = 0; i < N; i++) {
    const s = Math.abs(H[i] - HP[i]);
    if (s > 0.6 * dt) { movers++; sp += s; }
    awake += act[i];
  }
  const dirty = movers > 0 || awake > 0;
  if (dirty) shade();
  tokens = Math.min(BURST, tokens + RATE * dt);
  shimmer(movers, movers && dt ? sp / movers / dt : 0, dt);
  clatter(impN, impMax, impSum, dt);
  draw(dirty);
  const busy = awake || brushes.size || kb.keys.size || simT - joltAt < 0.6;
  quiet = busy ? 0 : quiet + 1;
  if (quiet < 4) {
    if (onScreen && !document.hidden) raf = requestAnimationFrame(frame);
  } else rest();
}

/* ---------- input ---------- */
function force(e) {
  // Mouse buttons report 0.5; pens and some screens report real force.
  const p = e.pressure;
  return e.pointerType === 'mouse' || !p || p === 0.5 ? 1 : clamp(0.35 + 1.3 * p, 0.35, 1.65);
}
function rayAt(e) {
  const r = panel.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, 1 - ((e.clientY - r.top) / r.height) * 2);
  ray.setFromCamera(ndc, camera);
  return ray.ray;
}
// Where a ray meets the plate.
function onPlate(rr) {
  const o = rr.origin, d = rr.direction, t = -o.z / d.z;
  return [o.x + d.x * t - board.position.x, o.y + d.y * t];
}
// Where a ray first touches the pin heads, marching down from the top.
function onPins(rr) {
  const o = rr.origin, d = rr.direction, top = L0 + HMAX + HEAD_Z + 0.5;
  for (let k = 0; k <= 48; k++) {
    const z = top * (1 - k / 48), t = (z - o.z) / d.z, x = o.x + d.x * t - board.position.x, y = o.y + d.y * t;
    const j = nearest(x, y);
    if (j >= 0 && z <= L0 + HEAD_Z + H[j]) return [x, y];
  }
  return onPlate(rr);
}
// The press lands on the pin you see, then follows the pointer without drifting.
panel.addEventListener('pointerdown', e => {
  if (!ready || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const rr = rayAt(e), [px, py] = onPlate(rr), [sx, sy] = onPins(rr);
  const b = press(e.pointerId, sx, sy, force(e), e.pointerType === 'touch' ? R_TOUCH : R_MOUSE);
  b.ox = sx - px;
  b.oy = sy - py;
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
});
panel.addEventListener('pointermove', e => {
  const b = brushes.get(e.pointerId);
  if (!b) return;
  const [px, py] = onPlate(rayAt(e));
  b.x = px + b.ox;
  b.y = py + b.oy;
  b.p = force(e);
  wake();
});
function lift(e) { if (brushes.delete(e.pointerId)) wake(); }
panel.addEventListener('pointerup', lift);
panel.addEventListener('pointercancel', lift);
panel.addEventListener('lostpointercapture', lift);
panel.addEventListener('contextmenu', e => e.preventDefault());

// Keyboard: a press point steered by arrows, Space pushes.
const kb = { x: 0, y: 0, keys: new Map() };
const DIRS = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
function moveKb(dx, dy) {
  kb.x = clamp(kb.x + dx, -halfW, halfW);
  kb.y = clamp(kb.y + dy, -halfH, halfH);
  const b = brushes.get('key');
  if (b) { b.x = kb.x; b.y = kb.y; }
}
// A tap steps one pitch; holding glides after a short pause.
function steer(dt) {
  if (!kb.keys.size) return;
  const now = performance.now();
  let dx = 0, dy = 0;
  for (const [k, t] of kb.keys) if (now - t > 160) { dx += DIRS[k][0]; dy += DIRS[k][1]; }
  if (!dx && !dy) return;
  const s = (15 * dt) / Math.hypot(dx, dy);
  moveKb(dx * s, dy * s);
}
// The aim ring shows only for keyboard focus.
panel.addEventListener('focus', () => { kbd = panel.matches(':focus-visible'); if (ready) draw(false); });
panel.addEventListener('blur', () => {
  kbd = false;
  kb.keys.clear();
  brushes.delete('key');
  if (ready) { draw(false); wake(); }
});
panel.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || !ready) return;
  const k = e.key;
  if (DIRS[k]) {
    e.preventDefault();
    kbd = true;
    if (!e.repeat && !kb.keys.has(k)) { kb.keys.set(k, performance.now()); moveKb(...DIRS[k]); }
    wake();
  } else if (k === ' ') {
    e.preventDefault();
    kbd = true;
    if (!e.repeat && !brushes.has('key')) press('key', kb.x, kb.y, 1, R_MOUSE);
    wake();
  }
});
panel.addEventListener('keyup', e => {
  if (DIRS[e.key]) { kb.keys.delete(e.key); wake(); }
  else if (e.key === ' ' && brushes.delete('key')) wake();
});
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  if ((e.key === 's' || e.key === 'S') && !e.repeat) shake();
});
document.getElementById('shake').addEventListener('click', shake);
sound.onChange(on => {
  if (on) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(panel);
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

/* ---------- start: WebGL setup in idle slices ---------- */
function failed() {
  panel.querySelector('.fail').hidden = false;
}
// Nearer pins catch more of the front lamp.
const LAMP = 'mix(0.7, 1.14, smoothstep(0.0, 5.0, pinH))';
// Shafts stretch from the plate to the head; pinH is the push.
function patchShaft(s) {
  s.vertexShader = 'attribute float pinH;\nattribute vec2 pinS;\nvarying vec2 vS;\nvarying float vZ;\n' + s.vertexShader.replace(
    '#include <begin_vertex>',
    `#include <begin_vertex>\ntransformed.z *= ${(L0 + 0.06).toFixed(3)} + pinH;\nvS = vec2(pinS.x * ${LAMP}, pinS.y);\nvZ = transformed.z;`,
  );
  // Shaft feet below the neighbours' heads sit in shadow.
  s.fragmentShader = 'varying vec2 vS;\nvarying float vZ;\n' + s.fragmentShader.replace(
    '#include <opaque_fragment>',
    'outgoingLight *= vS.x * mix(0.2, 1.0, smoothstep(vS.y - 1.6, vS.y + 0.5, vZ));\n#include <opaque_fragment>',
  );
}
// Heads ride on top of the shaft.
function patchHead(s) {
  s.vertexShader = 'attribute float pinH;\nattribute vec2 pinS;\nvarying float vAO;\n' + s.vertexShader.replace(
    '#include <begin_vertex>',
    `#include <begin_vertex>\ntransformed.z += ${L0.toFixed(3)} + pinH;\nvAO = pinS.x * ${LAMP};`,
  );
  s.fragmentShader = 'varying float vAO;\n' + s.fragmentShader.replace(
    '#include <opaque_fragment>',
    'outgoingLight *= vAO;\n#include <opaque_fragment>',
  );
}
async function start() {
  let RoomEnvironment;
  try {
    THREE = await import('three');
    ({ RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js'));
  } catch (err) {
    console.error(err);
    return failed();
  }
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (err) {
    console.error(err);
    return failed();
  }
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.setClearColor(0x000000, 0);
  const canvas = renderer.domElement;
  canvas.setAttribute('aria-hidden', 'true');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 16 / 9, 1, 2000);
  ray = new THREE.Raycaster();
  ndc = new THREE.Vector2();
  tmp = new THREE.Vector3();
  await idle();

  // A dim wall behind the viewer gives the chrome dark centres and bright rims.
  const room = new RoomEnvironment();
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(24, 22), new THREE.MeshBasicMaterial({ color: 0x1a1c21 }));
  wall.position.set(0, 9, 14.4);
  wall.rotation.y = Math.PI;
  room.add(wall);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(room, 0.03).texture;
  room.dispose();
  pm.dispose();
  // The key light sits up and left in front; nearer pins catch more.
  const key = new THREE.SpotLight(0xfff4e8, 3000, 0, 0.75, 0.9, 1.6);
  key.position.set(-28, 52, 64);
  scene.add(key, key.target);
  await idle();

  board = new THREE.Group();
  scene.add(board);
  plate = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshStandardMaterial({ color: 0x0e1013, metalness: 0.3, roughness: 0.78 }),
  );
  frameMesh = new THREE.Mesh(
    new THREE.BufferGeometry(),
    new THREE.MeshStandardMaterial({ color: 0x30343b, metalness: 0.45, roughness: 0.5 }),
  );
  board.add(plate, frameMesh);

  // Slim brushed-steel shafts, one unit long before stretching.
  const small = Math.min(innerWidth, innerHeight) < 700;
  const shaftGeo = new THREE.CylinderGeometry(0.07, 0.07, 1, 6, 1, true).translate(0, 0.5, 0).rotateX(Math.PI / 2);
  // Domed chrome heads with a narrow rim, turned on a lathe.
  const prof = [[0.1, -0.04], [0.44, -0.04], [0.45, -0.01], [0.45, 0.02]];
  for (let k = 1; k <= 6; k++) { const a = (k / 6) * (Math.PI / 2); prof.push([0.44 * Math.cos(a), 0.03 + (HEAD_Z - 0.03) * Math.sin(a)]); }
  const headGeo = new THREE.LatheGeometry(prof.map(([r, z]) => new THREE.Vector2(r, z)), small ? 12 : 18).rotateX(Math.PI / 2);
  hAttr = new THREE.InstancedBufferAttribute(H, 1).setUsage(THREE.DynamicDrawUsage);
  sAttr = new THREE.InstancedBufferAttribute(SH, 2).setUsage(THREE.DynamicDrawUsage);
  for (const g of [shaftGeo, headGeo]) { g.setAttribute('pinH', hAttr); g.setAttribute('pinS', sAttr); }
  const steel = new THREE.MeshStandardMaterial({ color: 0xb4b8bf, metalness: 1, roughness: 0.36 });
  const chrome = new THREE.MeshStandardMaterial({ color: 0xe6e8ec, metalness: 1, roughness: 0.09 });
  steel.onBeforeCompile = patchShaft;
  chrome.onBeforeCompile = patchHead;
  shafts = new THREE.InstancedMesh(shaftGeo, steel, MAXN);
  heads = new THREE.InstancedMesh(headGeo, chrome, MAXN);
  // Both meshes share one set of grid spots.
  heads.instanceMatrix = shafts.instanceMatrix;
  for (const m of [shafts, heads]) m.frustumCulled = false;
  board.add(shafts, heads);
  // The keyboard aim ring keeps the dark-theme focus colour on the board.
  mark = new THREE.Mesh(
    new THREE.RingGeometry(R_MOUSE - 0.22, R_MOUSE, 64),
    new THREE.MeshBasicMaterial({ color: 0x40e2f3, toneMapped: false, depthTest: false, depthWrite: false, transparent: true }),
  );
  mark.renderOrder = 2;
  mark.visible = false;
  board.add(mark);

  panel.prepend(canvas);
  fitRenderer(renderer, panel, 1.5, (w, h) => {
    fit(w, h);
    if (ready) { draw(); wake(); }
  }, 1.4e6);
  // A panel with no size yet still gets a grid.
  if (!N) fit(16, 9);
  kb.x = -0.5 * halfW;
  await idle();
  intro();
  // Async compile keeps the shader build off the main thread.
  await renderer.compileAsync(scene, camera);
  ready = true;
  draw();
  requestAnimationFrame(() => { canvas.classList.add('on'); wake(); });
}
start().catch(err => { console.error(err); failed(); });
</script>
</body>
