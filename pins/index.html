<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.16 0.012 275); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pin art</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<style>
/* Pin art: a chrome pin screen on a dark panel. */
:root { --stage: oklch(0.21 0.008 265); }
.stage--pins { -webkit-touch-callout: none; }
.board canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.board canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .board canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-emblem" style="--emblem: url(../shared/emblems/pins.svg)"></span><span class="intro-name">Pin art</span><span class="intro-sub">Stimming No. 05</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--pins board" id="board" tabindex="0" role="application" aria-label="Pin screen. Press and drag to push pins; hold to push deeper. Shuffle presses a new object from behind. Type a word to press its letters from behind; Backspace lifts the last letter. Arrow keys move the press point, Space presses, Enter flips the board, Escape shakes the pins flat.">
      <p class="fail" hidden>Pin art needs WebGL, which this browser has turned off.</p>
    </div>
    <div class="bar">
      <div class="choices" role="group" aria-label="Finish">
        <button class="chip" type="button" data-value="chrome" aria-pressed="true">Chrome</button>
        <button class="chip" type="button" data-value="anodised" aria-pressed="false">Anodised</button>
      </div>
      <div class="actions">
        <button class="chip" id="shuffle" type="button">Shuffle</button>
        <button class="chip" id="flip" type="button" aria-keyshortcuts="Enter">Flip</button>
        <button class="chip" id="shake" type="button" aria-keyshortcuts="Escape">Shake</button>
      </div>
      <dl class="how" aria-label="How to play">
        <div><dt>Drag</dt><dd>push, hold deeper</dd></div>
        <div class="fine"><dt>Type</dt><dd>press a word</dd></div>
        <div class="fine"><dt><kbd>Enter</kbd></dt><dd>flip</dd></div>
        <div class="fine"><dt><kbd>Esc</kbd></dt><dd>shake flat</dd></div>
      </dl>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Pin art</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import { initPage, sound, reduced, onReducedChange, oklchRgb, choices } from '../shared/stim.js';
import { intro as playIntro } from '../shared/intro.js';
// The intro holds until the page and its font have loaded.
const loaded = new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
playIntro({ ready: Promise.all([loaded, document.fonts.ready]) });
initPage({ id: 'pins' });

const panel = document.getElementById('board');
let reduce = reduced();
onReducedChange(v => { reduce = v; });
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const idle = () => new Promise(r => ('requestIdleCallback' in window ? requestIdleCallback(() => r(), { timeout: 800 }) : setTimeout(r, 50)));

/* ---------- sound: synthesised, started by the first gesture ---------- */
const MAXV = 40, LEAD = 0.004;
// Grains refill at RATE per second, up to BURST at once.
const RATE = 240, BURST = 24;
let ac = null, out = null, noise = null, askedAt = -1e9, voices = 0, restT = 0;
let tokens = BURST, shimAcc = 0, fine = [], clack = [];
const jit = x => 1 + (Math.random() * 2 - 1) * x;
// Busy moments soften each voice; the compressor catches the rest.
const level = () => 1 / (1 + 0.04 * voices);

// One struck pin: a resonant click over two inharmonic partials.
function strike(f, ring, mix) {
  const sr = ac.sampleRate, len = Math.floor(sr * 0.045), buf = ac.createBuffer(1, len, sr), d = buf.getChannelData(0);
  const fc = Math.min(f * 2.2, sr * 0.42), w = (TAU * fc) / sr, r = Math.exp((-Math.PI * fc) / (4 * sr));
  const a1 = 2 * r * Math.cos(w), a2 = -r * r, ke = Math.exp(-1 / (sr * 0.0006));
  let y1 = 0, y2 = 0, e = 1, top = 1e-9;
  for (let n = 0; n < len; n++) {
    const y = (Math.random() * 2 - 1) * e + a1 * y1 + a2 * y2;
    y2 = y1; y1 = y; e *= ke;
    d[n] = y;
    top = Math.max(top, Math.abs(y));
  }
  // Partial ratios follow a free steel bar: 1 and 2.76.
  const w1 = (TAU * f) / sr, w2 = (TAU * f * 2.76 * jit(0.02)) / sr;
  const k1 = Math.exp(-1 / (sr * ring)), k2 = Math.exp(-1 / (sr * ring * 0.5));
  let e1 = mix, e2 = mix * 0.6, peak = 1e-9;
  for (let n = 0; n < len; n++) {
    d[n] = d[n] / top + e1 * Math.sin(w1 * n) + e2 * Math.sin(w2 * n);
    e1 *= k1; e2 *= k2;
    peak = Math.max(peak, Math.abs(d[n]));
  }
  for (let n = 0; n < len; n++) d[n] *= (0.95 / peak) * Math.min(1, (len - n) / (len * 0.1));
  return buf;
}
function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (err) { return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.12;
    out = ac.createGain();
    out.gain.value = 0.55;
    out.connect(comp);
    comp.connect(ac.destination);
    // One second of white noise feeds the knock and the sizzle.
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // Fine ticks for sliding pins; lower clacks for landing ones.
    fine = Array.from({ length: 8 }, () => strike(3600 * jit(0.25), 0.006 * jit(0.3), 0.45));
    clack = Array.from({ length: 8 }, () => strike(2100 * jit(0.2), 0.014 * jit(0.3), 0.7));
  }

}
// A context still waking queues sounds for a moment.
function live() {
  if (!sound.on || !ac || ac.state === 'closed') return null;
  return ac.state === 'running' || performance.now() - askedAt < 250 ? ac : null;
}
function track(src, ...tails) {
  voices++;
  src.onended = () => { voices--; tails.forEach(n => n.disconnect()); };
}
// Once the pins settle, the context sleeps until the next gesture.
function rest() {
  clearTimeout(restT);
  if (!ac || ac.state !== 'running') return;
  restT = setTimeout(() => {
    if (!raf && !brushes.size && ac.state === 'running') ac.suspend()?.catch(() => {});
  }, 1500);
}
// Typed characters count as gestures, as do these named keys.
const GESTURE_KEYS = new Set(['Enter', 'Backspace', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
function unlock(e) {
  if (!sound.on || (e.type === 'keydown' && e.key.length !== 1 && !GESTURE_KEYS.has(e.key))) return;
  // A touch counts as a gesture only once the finger lifts.
  if (!ac && e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
  audio();
}
// Touchend is the gesture iOS needs.
['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));

// Each grain is one buffered tick; tokens and voices cap the rate.
function grain(a, set, amp, t, rate) {
  if (voices >= MAXV || tokens < 1) return;
  tokens--;
  const src = a.createBufferSource(), g = a.createGain();
  src.buffer = set[(Math.random() * set.length) | 0];
  src.playbackRate.value = rate * jit(0.1);
  g.gain.value = amp * level();
  src.connect(g).connect(out);
  src.start(t);
  track(src, g);
}
// Sliding pins shimmer; grain density follows how many move.
function shimmer(movers, speed, dt) {
  const a = live();
  if (!a || !movers) { shimAcc = 0; return; }
  shimAcc += Math.min(150, 3.4 * movers ** 0.7) * dt;
  const amp = 0.05 + 0.2 * clamp(speed / 24), t0 = a.currentTime + LEAD;
  for (; shimAcc >= 1; shimAcc--) grain(a, fine, amp * jit(0.5), t0 + Math.random() * dt, 1);
}
// Landing pins clack; a crowded frame plays a few, slightly louder.
function clatter(n, vmax, vsum, dt) {
  const a = live();
  if (!a || !n) return;
  const m = Math.min(n, 10), boost = 1 + 0.12 * Math.log2(n / m), vm = vsum / n, t0 = a.currentTime + LEAD;
  for (let k = 0; k < m; k++) {
    const q = clamp(lerp(vm, vmax, Math.random() ** 2) / 36);
    // Lighter landings ring a little higher.
    grain(a, clack, (0.05 + 0.45 * q ** 1.3) * boost, t0 + Math.random() * dt, 1.25 - 0.3 * q);
  }
}
// A dull knock of the frame.
function knock(a, t, amp) {
  const k = a.createBufferSource(), lp = a.createBiquadFilter(), kg = a.createGain();
  k.buffer = noise;
  lp.type = 'lowpass';
  lp.frequency.value = 170;
  lp.Q.value = 1.2;
  kg.gain.setValueAtTime(0, t);
  kg.gain.linearRampToValueAtTime(amp * level(), t + 0.004);
  kg.gain.setTargetAtTime(0, t + 0.004, 0.035);
  k.connect(lp).connect(kg).connect(out);
  k.start(t, Math.random() * 0.5, 0.25);
  track(k, lp, kg);
}
// A turn: air swept past the frame, rising, then falling.
function whoosh(span) {
  const a = live();
  if (!a) return;
  const t = a.currentTime + LEAD;
  const s = a.createBufferSource(), bp = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noise;
  s.loop = true;
  bp.type = 'bandpass';
  bp.Q.value = 1.4;
  bp.frequency.setValueAtTime(260, t);
  bp.frequency.exponentialRampToValueAtTime(1500, t + span * 0.5);
  bp.frequency.exponentialRampToValueAtTime(380, t + span);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.3 * level(), t + span * 0.5);
  g.gain.linearRampToValueAtTime(0, t + span);
  s.connect(bp).connect(g).connect(out);
  s.start(t, Math.random() * 0.5);
  s.stop(t + span + 0.05);
  track(s, bp, g);
}
// A landing: the frame knocks and every loose pin clacks once.
function thud() {
  const a = live();
  if (!a) return;
  knock(a, a.currentTime + LEAD, 1.1);
  clatter(40, 26, 40 * 16, 0.05);
}
// A shake: a dull knock of the frame, then a bright sizzle.
function rattle(span) {
  const a = live();
  if (!a) return;
  const t = a.currentTime + LEAD;
  knock(a, t, 0.9);
  // The sizzle brightens as the wave crosses the board.
  const s = a.createBufferSource(), bp = a.createBiquadFilter(), sg = a.createGain();
  s.buffer = noise;
  s.loop = true;
  bp.type = 'bandpass';
  bp.Q.value = 0.8;
  bp.frequency.setValueAtTime(5200, t);
  bp.frequency.linearRampToValueAtTime(7800, t + span);
  sg.gain.setValueAtTime(0, t);
  sg.gain.linearRampToValueAtTime(0.06 * level(), t + 0.05);
  sg.gain.setTargetAtTime(0, t + span, 0.12);
  s.connect(bp).connect(sg).connect(out);
  s.start(t, Math.random() * 0.5);
  s.stop(t + span + 0.8);
  track(s, bp, sg);
}

/* ---------- the grid: hex rows, one pin pitch apart ---------- */
const MAXN = 2600, TARGET = 2000, ROW = Math.sqrt(3) / 2;
// Heights are in pin pitches; at rest a little shaft shows.
const HMAX = 7, L0 = 0.3, HEAD_Z = 0.22;
// The frame: inner margin, border width, front lip.
const MARGIN = 0.8, BORDER = 2.1, LIP = 1, BEV = 0.2;
// Notch slot width and cap; the frame colour as OKLCH.
const NOTCH_W = 0.16, NOTCH_MAX = 160, FRAME_OKLCH = [0.7, 0.19, 45];
let cols = 0, rows = 0, N = 0, halfW = 0, halfH = 0;
const PX = new Float32Array(MAXN), PY = new Float32Array(MAXN);
const H = new Float32Array(MAXN), V = new Float32Array(MAXN), T = new Float32Array(MAXN), HP = new Float32Array(MAXN);
// B holds relief from the hand and the brushes.
// X holds relief from the typed letters.
const B = new Float32Array(MAXN), X = new Float32Array(MAXN);
// Per pin for the shader: occlusion, then neighbours' mean head height.
const SH = new Float32Array(MAXN * 2).fill(1);
const NB = new Int16Array(MAXN * 6), due = new Float64Array(MAXN), mode = new Uint8Array(MAXN), act = new Uint8Array(MAXN);
const SPRING = 0, FALL = 1, WAIT_FALL = 2, FADE = 3, WAIT_RISE = 4;
// Side 1 is the back: pins pushed out at the front sink in here.
const uSide = { value: 0 };
// Anodised heads take a thin-film hue that shifts with height.
const uAnod = { value: 0 }, uRamp = { value: [] };
// Ramp stops as OKLCH, from flat to RAMP_TOP pitches out.
const RAMP_TOP = 5;
const RAMP = [[0.86, 0.14, 72], [0.62, 0.19, 352], [0.52, 0.2, 296], [0.64, 0.17, 252], [0.8, 0.12, 196], [0.86, 0.15, 124]];
const disp = i => (uSide.value ? HMAX - H[i] : H[i]);

// Even rows sit a quarter pitch left, odd rows a quarter right.
const shift = r => (r & 1 ? 0.25 : -0.25);
// Nearest pin of a given grid, or -1 off the board.
function nearestIn(x, y, nc, nr) {
  const r = Math.round(((nr - 1) * ROW / 2 - y) / ROW);
  if (r < 0 || r >= nr) return -1;
  const c = Math.round(x + (nc - 1) / 2 - shift(r));
  return c < 0 || c >= nc ? -1 : r * nc + c;
}
const nearest = (x, y) => nearestIn(x, y, cols, rows);
function build(nc, nr) {

  const oc = cols, or = rows, old = N ? B.slice(0, N) : null;
  cols = nc; rows = nr; N = nc * nr;
  halfW = (nc - 1) / 2 + 0.25;

    const i = r * nc + c;
    PX[i] = c - (nc - 1) / 2 + shift(r);
    PY[i] = halfH - r * ROW;
    const j = old ? nearestIn(PX[i], PY[i], oc, or) : -1;
    T[i] = H[i] = B[i] = j >= 0 ? old[j] : 0;
    X[i] = V[i] = 0;
    mode[i] = SPRING;
    act[i] = 0;

  // Six neighbours per pin; -1 past the edge.
  for (let r = 0; r < nr; r++) for (let c = 0; c < nc; c++) {
    const i = r * nc + c, k = i * 6, o = r & 1 ? 0 : -1;
    NB[k] = c > 0 ? i - 1 : -1;
    NB[k + 1] = c < nc - 1 ? i + 1 : -1;
    for (let s = 0; s < 4; s++) {
      const rr = r + (s < 2 ? -1 : 1), cc = c + o + (s & 1);
      NB[k + 2 + s] = rr >= 0 && rr < nr && cc >= 0 && cc < nc ? rr * nc + cc : -1;
    }
  }
  // The word sets again to fit the new grid.
  if (word || ground || relief) {
    ink();
    for (let i = 0; i < N; i++) T[i] = H[i] = target(i);
  }
  shade();
  place();
}
// Neighbours standing proud shade a pin and the foot of its shaft.
// A flipped board reads every pin from the back.
function shade() {
  const f = uSide.value ? -1 : 1, o = uSide.value ? HMAX : 0;
  for (let i = 0; i < N; i++) {
    let occ = 0, sum = 0, n = 0;
    for (let k = i * 6, e = k + 6; k < e; k++) {
      const j = NB[k];
      if (j < 0) continue;
      const d = f * (H[j] - H[i]) - 0.15;
      if (d > 0) occ += d;
      sum += o + f * H[j];
      n++;
    }
    SH[i * 2] = Math.max(0.34, 1 / (1 + 0.11 * occ));
    SH[i * 2 + 1] = L0 + sum / n;
  }

/* ---------- the opening relief: a hand pressed in from behind ---------- */
// Digits in palm widths: base x, base y, lean, length, radius, depth.
const DIGITS = [
  [-0.31, 0.34, 9, 0.74, 0.1, 3.1],
  [-0.1, 0.38, 2, 0.86, 0.105, 3.3],
  [0.12, 0.36, -5, 0.78, 0.1, 3.1],
  [0.32, 0.28, -14, 0.6, 0.09, 2.8],
  [-0.4, -0.16, 52, 0.62, 0.125, 3],

// A rounded cross-section, like flesh pressed against pins.
const dome = q => (q < 1 ? (1 - q * q) ** 0.55 : 0);
// Distance to a segment, and how far along it the nearest point lies.
function seg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, t = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1));

function hand(u, v) {

/* ---------- the relief library: objects Shuffle presses in ---------- */
// A flat object: full depth inside, a rounded bevel e wide at the edge.
const slab = (d, dep, e) => (d < 0 ? dep * Math.min(1, -d / e) ** 0.5 : 0);
// Signed distance to a box of half sizes bx, by.
function box(px, py, bx, by) {

// A face seen from the front, egg-shaped and wider at the brow.

  h += 0.5 * dome(cap(u, v, -0.3, 0.29, 0.3, 0.29, 0) / 0.1);

// A dinner fork: handle, neck, head and four tines.
function fork(u, v, e) {

  d = Math.min(d, box(u, v - 0.24, 0.27, 0.1) - 0.04);

// A spur gear: eight chunky teeth on a rim, a sunken web, a hub and bore.

  const span = 1.88 - padN, mid = (padN - 0.06) / 2;
  let d = 150, ty = 0;
  for (let it = 0; it < 4; it++) {
    let lo = 20, hi = 3000;
    for (let k = 0; k < 30; k++) {
      d = (lo + hi) / 2;
      aimCam(d, ty);
      const [x0, x1, y0, y1] = bounds(pts);
      if (Math.max(-x0, x1) <= 0.95 && y1 - y0 <= span) hi = d; else lo = d;
    }
    d = hi;
    aimCam(d, ty);
    // Recentre: an NDC offset becomes a shift along the board.
    const [, , y0, y1] = bounds(pts);
    ty += (((y0 + y1) / 2 - mid) * d * Math.tan((FOV * Math.PI) / 360)) / Math.cos(EL);
  }
  rig.d = d;
  rig.ty = ty;
  pose();
  camera.near = Math.max(1, d - 90);
  camera.far = d * ZOOM_MAX + 90;
  camera.updateProjectionMatrix();
}
const pose = () => aimCam(rig.d * rig.zoom, rig.ty, rig.yaw, rig.pitch);
// The rig eases toward its targets; true while it still moves.
function ease(dt) {
  const k = 1 - Math.exp(-dt / 0.16);
  const gap = Math.abs(rig.tyaw - rig.yaw) + Math.abs(rig.tpitch - rig.pitch) + Math.abs(rig.tzoom - rig.zoom);

  rig.yaw += (rig.tyaw - rig.yaw) * k;
  rig.pitch += (rig.tpitch - rig.pitch) * k;
  rig.zoom += (rig.tzoom - rig.zoom) * k;
  pose();
  return true;
}
function draw(dirty = true) {
  if (dirty) hAttr.needsUpdate = sAttr.needsUpdate = true;
  board.position.x = jolt();
  mark.visible = kbd;
  if (kbd) {
    const j = nearest(kb.x, kb.y);
    mark.position.set(kb.x, kb.y, L0 + HEAD_Z + 0.3 + (j >= 0 ? disp(j) : 0));
    mark.scale.setScalar(brushes.has('key') ? 0.86 : 1);
  }
  renderer.render(scene, camera);
}

/* ---------- one loop, only while something moves ---------- */
let raf = 0, last = 0, acc = 0, quiet = 0, onScreen = true, slow = 0;
function wake() {
  quiet = 0;
  if (!raf && ready && onScreen && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
}
function frame(ms) {
  raf = 0;
  const raw = Math.max(0, (ms - last) / 1000), dt = Math.min(raw, 1 / 30);
  last = ms;
  // Sustained slow frames drop the pixel ratio to 1.
  if (!lowDpr) {
    slow = raw > 0.03 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 20) { lowDpr = true; dispatchEvent(new Event('perf-low')); }
  }
  steer(dt);
  const swaying = ease(dt);
  spin(dt);
  sculpt(dt);
  HP.set(H.subarray(0, N));
  acc += dt;
  const n = Math.min(8, Math.floor(acc / STEP));
  acc = n === 8 ? 0 : acc - n * STEP;
  impN = impSum = impMax = 0;
  for (let k = 0; k < n; k++) integrate();

  for (let i = 0; i < N; i++) {
    const s = Math.abs(H[i] - HP[i]);

    awake += act[i];
  }
  const dirty = movers > 0 || awake > 0;

  tokens = Math.min(BURST, tokens + RATE * dt);
  shimmer(movers, movers && dt ? sp / movers / dt : 0, dt);
  clatter(impN, impMax, impSum, dt);

/* ---------- input ---------- */
function force(e) {
  // Mouse buttons report 0.5; pens and some screens report real force.
  const p = e.pressure;

}
function rayAt(e) {
  const r = panel.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, 1 - ((e.clientY - r.top) / r.height) * 2);
  ray.setFromCamera(ndc, camera);

}
// Where a ray meets the plate, in the board's own terms.
function onPlate(rr) {
  const o = rr.origin, d = rr.direction, t = -o.z / d.z;
  return [(o.x + d.x * t - board.position.x) * board.scale.x, o.y + d.y * t];
}
// Where a ray first touches the pin heads, marching down from the top.
function onPins(rr) {
  const o = rr.origin, d = rr.direction, top = L0 + HMAX + HEAD_Z + 0.5;
  for (let k = 0; k <= 48; k++) {
    const z = top * (1 - k / 48), t = (z - o.z) / d.z, x = (o.x + d.x * t - board.position.x) * board.scale.x, y = o.y + d.y * t;
    const j = nearest(x, y);
    if (j >= 0 && z <= L0 + HEAD_Z + disp(j)) return [x, y];

// The press lands on the pin you see, then follows the pointer without drifting.
panel.addEventListener('pointerdown', e => {
  if (!ready || flipT >= 0 || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const rr = rayAt(e), [px, py] = onPlate(rr), [sx, sy] = onPins(rr);
  const b = press(e.pointerId, sx, sy, force(e), e.pointerType === 'touch' ? R_TOUCH : R_MOUSE);
  b.ox = sx - px;
  b.oy = sy - py;
  try { panel.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
});
panel.addEventListener('pointermove', e => {
  const b = brushes.get(e.pointerId);
  if (!b) return;
  const [px, py] = onPlate(rayAt(e));
  b.x = px + b.ox;
  b.y = py + b.oy;
  b.p = force(e);
  wake();
});
function lift(e) { if (brushes.delete(e.pointerId)) wake(); }
// A mouse over the board sways the camera a little; a press holds it still.
panel.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || reduce || brushes.size || !ready) return;
  const r = panel.getBoundingClientRect();
  rig.tyaw = clamp(((e.clientX - r.left) / r.width) * 2 - 1, -1, 1) * WOBBLE_YAW;
  rig.tpitch = clamp(1 - ((e.clientY - r.top) / r.height) * 2, -1, 1) * WOBBLE_PITCH;
  wake();
});
panel.addEventListener('pointerleave', () => { rig.tyaw = rig.tpitch = 0; wake(); });
// Wheel or pinch backs the camera off; at a limit the page scrolls on.
panel.addEventListener('wheel', e => {
  if (!ready) return;
  const z = clamp(rig.tzoom * Math.exp(e.deltaY * (e.ctrlKey ? 0.006 : 0.0015)), 1, ZOOM_MAX);
  if (Math.abs(z - rig.tzoom) < 1e-4) return;
  e.preventDefault();
  rig.tzoom = z;
  wake();
}, { passive: false });
panel.addEventListener('pointerup', lift);
panel.addEventListener('pointercancel', lift);
panel.addEventListener('lostpointercapture', lift);
panel.addEventListener('contextmenu', e => e.preventDefault());

// Keyboard: a press point steered by arrows, Space pushes.
const kb = { x: 0, y: 0, keys: new Map() };
const DIRS = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
// Arrows follow the screen, so the mirrored back turns x around.
function moveKb(dx, dy) {
  kb.x = clamp(kb.x + dx * (board ? board.scale.x : 1), -halfW, halfW);
  kb.y = clamp(kb.y + dy, -halfH, halfH);
  const b = brushes.get('key');
  if (b) { b.x = kb.x; b.y = kb.y; }
}
// A tap steps one pitch; holding glides after a short pause.
function steer(dt) {
  if (!kb.keys.size) return;
  const now = performance.now();
  let dx = 0, dy = 0;
  for (const [k, t] of kb.keys) if (now - t > 160) { dx += DIRS[k][0]; dy += DIRS[k][1]; }
  if (!dx && !dy) return;
  const s = (15 * dt) / Math.hypot(dx, dy);
  moveKb(dx * s, dy * s);
}
// The aim ring shows only for keyboard focus.
panel.addEventListener('focus', () => { kbd = panel.matches(':focus-visible'); if (ready) draw(false); });
panel.addEventListener('blur', () => {
  kbd = false;
  kb.keys.clear();
  brushes.delete('key');
  if (ready) { draw(false); wake(); }
});
panel.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || !ready) return;
  const k = e.key;
  if (DIRS[k]) {
    e.preventDefault();
    kbd = true;
    if (!e.repeat && !kb.keys.has(k)) { kb.keys.set(k, performance.now()); moveKb(...DIRS[k]); }
    wake();
  } else if (k === ' ') {
    e.preventDefault();
    kbd = true;
    if (!e.repeat && !brushes.has('key') && flipT < 0) press('key', kb.x, kb.y, 1, R_MOUSE);
    wake();
  }
});
panel.addEventListener('keyup', e => {
  if (DIRS[e.key]) { kb.keys.delete(e.key); wake(); }
  else if (e.key === ' ' && brushes.delete('key')) wake();
});
// Typing presses letters; Enter flips; Escape shakes flat.
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  const t = e.target;
  if (t.closest?.('input, textarea, select, [contenteditable]')) return;
  const k = e.key;
  if (k === 'Escape') {
    // Escape inside the how-to tip only closes the tip.
    if (!e.repeat && !t.closest?.('.how-tip')) shake();
  } else if (k === 'Enter') {
    // A focused button or link keeps its own Enter.
    if (t.closest?.('button, a, summary')) return;
    e.preventDefault();
    if (!e.repeat) flipBoard();
  } else if (k === 'Backspace') {
    e.preventDefault();
    backKey();
  } else if (GLYPH.test(k)) {

  }

document.getElementById('shake').addEventListener('click', shake);
document.getElementById('flip').addEventListener('click', flipBoard);
document.getElementById('shuffle').addEventListener('click', shuffle);
// The finish choice is remembered between visits.
const FINISH_KEY = 'stimming.pins.finish';
function setFinish(v) {
  uAnod.value = v === 'anodised' ? 1 : 0;
  try { localStorage.setItem(FINISH_KEY, v); } catch (err) { /* storage is optional */ }
  if (ready) draw(false);
}
const finish = choices(document.querySelector('.choices'), setFinish);
try { if (localStorage.getItem(FINISH_KEY) === 'anodised') { finish.set('anodised'); uAnod.value = 1; } } catch (err) { /* storage is optional */ }
sound.onChange(on => {
  if (on) audio();
  else if (ac) ac.suspend()?.catch(() => {});
});
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) wake(); }).observe(panel);
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

/* ---------- start: WebGL setup in idle slices ---------- */
// Reads the --focus token as OKLCH; a fixed cyan backs it up.
function focusRgb() {
  const v = getComputedStyle(document.documentElement).getPropertyValue('--focus');
  const m = v.match(/oklch\(\s*([\d.]+)(%?)\s+([\d.]+)\s+([\d.]+)/);
  return m ? oklchRgb(parseFloat(m[1]) / (m[2] ? 100 : 1), +m[3], +m[4]) : oklchRgb(0.84, 0.13, 205);
}
function failed() {
  panel.querySelector('.fail').hidden = false;
}
// Nearer pins catch more of the front lamp.
const LAMP = 'mix(0.7, 1.14, smoothstep(0.0, 5.0, pinP))';
// pinP is how far a pin stands out of the face in view.
// Back pins stand out by the rest of their travel.
const pinP = back => `float pinP = ${back ? `mix(${HMAX.toFixed(1)} - pinH, pinH, uSide)` : `mix(pinH, ${HMAX.toFixed(1)} - pinH, uSide)`};`;
const ATTRS = 'uniform float uSide;\nattribute float pinH;\nattribute vec2 pinS;\n';
// Shafts stretch from the plate to the head; pinH is the push.
const patchShaft = back => s => {
  s.uniforms.uSide = uSide;
  s.vertexShader = ATTRS + 'varying vec2 vS;\nvarying float vZ;\n' + s.vertexShader.replace(
    '#include <begin_vertex>',
    `#include <begin_vertex>\n${pinP(back)}\ntransformed.z *= ${(L0 + 0.06).toFixed(3)} + pinP;\n`
      + (back ? 'vS = vec2(0.8, -100.0);' : `vS = vec2(pinS.x * ${LAMP}, pinS.y);`) + '\nvZ = transformed.z;',
  );

  s.fragmentShader = 'varying vec2 vS;\nvarying float vZ;\n' + s.fragmentShader.replace(
    '#include <opaque_fragment>',
    'outgoingLight *= vS.x * mix(0.2, 1.0, smoothstep(vS.y - 1.6, vS.y + 0.5, vZ));\n#include <opaque_fragment>',
  );
};
// The thin-film ramp blends its stops by how far a pin stands out.
const ANOD = `uniform float uAnod;
uniform vec3 uRamp[${RAMP.length}];
vec3 anod(float p) {
  float t = clamp(p / ${RAMP_TOP.toFixed(1)}, 0.0, 1.0) * ${(RAMP.length - 1).toFixed(1)};
  vec3 c = uRamp[0];
  for (int k = 0; k < ${RAMP.length - 1}; k++) c = mix(c, uRamp[k + 1], clamp(t - float(k), 0.0, 1.0));
  return c;
}
`;
// Front heads ride on the shaft; back heads hang below the plate.
const patchHead = back => s => {
  s.uniforms.uSide = uSide;
  s.uniforms.uAnod = uAnod;
  s.uniforms.uRamp = uRamp;
  s.vertexShader = ATTRS + 'varying float vAO;\nvarying float vP;\n' + s.vertexShader.replace(
    '#include <begin_vertex>',
    `#include <begin_vertex>\n${pinP(back)}\ntransformed.z ${back ? '-=' : '+='} ${L0.toFixed(3)} + pinP;\nvP = pinP;\nvAO = ${back ? '0.8' : `pinS.x * ${LAMP}`};`,
  );
  s.fragmentShader = `varying float vAO;\nvarying float vP;\n${ANOD}` + s.fragmentShader.replace(
    '#include <opaque_fragment>',
    'outgoingLight *= vAO;\n#include <opaque_fragment>',
  ).replace(
    '#include <color_fragment>',

// A copy mirrored through the plate, with its winding put right.
function mirrorZ(g) {
  g = g.clone().scale(1, 1, -1);
  const ix = g.index.array;
  for (let i = 0; i < ix.length; i += 3) { const t = ix[i + 1]; ix[i + 1] = ix[i + 2]; ix[i + 2] = t; }
  return g;
}
async function start() {
  let RoomEnvironment;
  try {
    THREE = await import('three');
    ({ RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js'));
  } catch (err) {
    console.error(err);
    return failed();
  }
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (err) {
    console.error(err);
    return failed();
  }

  renderer.setClearColor(0x000000, 0);
  const canvas = renderer.domElement;
  canvas.setAttribute('aria-hidden', 'true');

  camera = new THREE.PerspectiveCamera(FOV, 16 / 9, 1, 2000);
  ray = new THREE.Raycaster();
  ndc = new THREE.Vector2();
  tmp = new THREE.Vector3();
  await idle();

  // A dim wall behind the viewer gives the chrome dark centres and bright rims.
  const room = new RoomEnvironment();
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(24, 22), new THREE.MeshBasicMaterial({ color: 0x1a1c21 }));
  wall.position.set(0, 9, 14.4);
  wall.rotation.y = Math.PI;
  room.add(wall);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(room, 0.03).texture;
  room.dispose();
  pm.dispose();
  // The key light sits up and left in front; nearer pins catch more.
  scene.environmentIntensity = 0.72;
  const key = new THREE.SpotLight(0xfff4e8, 1700, 0, 0.75, 0.9, 1.6);
  key.position.set(-28, 52, 64);
  scene.add(key, key.target);
  await idle();

  board = new THREE.Group();
  scene.add(board);
  plate = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshStandardMaterial({ color: 0x0e1013, metalness: 0.3, roughness: 0.78 }),
  );
  // The frame is a jig powder-coated in safety orange.
  const [or, og, ob] = oklchRgb(...FRAME_OKLCH);
  frameMesh = new THREE.Mesh(
    new THREE.BufferGeometry(),
    new THREE.MeshStandardMaterial({ color: new THREE.Color().setRGB(or, og, ob, THREE.SRGBColorSpace), metalness: 0.05, roughness: 0.55 }),
  );
  // Notches are cut gaps, so they show the dark of the slot.
  notches = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0x0b0c0f }), NOTCH_MAX);
  notches.frustumCulled = false;
  board.add(plate, frameMesh, notches);

  // Slim brushed-steel shafts, one unit long before stretching.
  const small = Math.min(innerWidth, innerHeight) < 700;
  const shaftGeo = new THREE.CylinderGeometry(0.07, 0.07, 1, 6, 1, true).translate(0, 0.5, 0).rotateX(Math.PI / 2);
  // Domed chrome heads with a narrow rim, turned on a lathe.
  const prof = [[0.1, -0.04], [0.44, -0.04], [0.45, -0.01], [0.45, 0.02]];
  for (let k = 1; k <= 6; k++) { const a = (k / 6) * (Math.PI / 2); prof.push([0.44 * Math.cos(a), 0.03 + (HEAD_Z - 0.03) * Math.sin(a)]); }
  const headGeo = new THREE.LatheGeometry(prof.map(([r, z]) => new THREE.Vector2(r, z)), small ? 12 : 18).rotateX(Math.PI / 2);
  // The back pins are mirror copies; they show only mid-turn.
  const shaftGeoB = mirrorZ(shaftGeo), headGeoB = mirrorZ(headGeo);
  hAttr = new THREE.InstancedBufferAttribute(H, 1).setUsage(THREE.DynamicDrawUsage);
  sAttr = new THREE.InstancedBufferAttribute(SH, 2).setUsage(THREE.DynamicDrawUsage);
  for (const g of [shaftGeo, headGeo, shaftGeoB, headGeoB]) { g.setAttribute('pinH', hAttr); g.setAttribute('pinS', sAttr); }
  uRamp.value = RAMP.map(c => new THREE.Color().setRGB(...oklchRgb(...c), THREE.SRGBColorSpace));
  const metal = (color, roughness, patch, key) => {
    const m = new THREE.MeshStandardMaterial({ color, metalness: 1, roughness });
    m.onBeforeCompile = patch;
    // Each variant needs its own program.
    m.customProgramCacheKey = () => key;
    return m;
  };
  shafts = new THREE.InstancedMesh(shaftGeo, metal(0xb4b8bf, 0.36, patchShaft(false), 'shaft'), MAXN);
  heads = new THREE.InstancedMesh(headGeo, metal(0xe6e8ec, 0.09, patchHead(false), 'head'), MAXN);
  shaftsB = new THREE.InstancedMesh(shaftGeoB, metal(0xb4b8bf, 0.36, patchShaft(true), 'shaft-back'), MAXN);
  headsB = new THREE.InstancedMesh(headGeoB, metal(0xe6e8ec, 0.09, patchHead(true), 'head-back'), MAXN);
  // All four meshes share one set of grid spots.
  heads.instanceMatrix = shaftsB.instanceMatrix = headsB.instanceMatrix = shafts.instanceMatrix;
  for (const m of [shafts, heads, shaftsB, headsB]) m.frustumCulled = false;
  board.add(shafts, heads, shaftsB, headsB);
  // The keyboard aim ring takes the --focus token colour.
  const [fr, fg, fb] = focusRgb();
  mark = new THREE.Mesh(
    new THREE.RingGeometry(R_MOUSE - 0.22, R_MOUSE, 64),
    new THREE.MeshBasicMaterial({
      color: new THREE.Color().setRGB(fr, fg, fb, THREE.SRGBColorSpace),
      toneMapped: false, depthTest: false, depthWrite: false, transparent: true,
    }),
  );
  mark.renderOrder = 2;
  mark.visible = false;
  board.add(mark);

  panel.prepend(canvas);
  fitRenderer(renderer, panel, 1.5, (w, h) => {
    fit(w, h);
    if (ready) { draw(); wake(); }
  }, 1.4e6);
  // A panel with no size yet still gets a grid.
  if (!N) fit(16, 9);
  kb.x = -0.5 * halfW;
  await idle();
  intro();
  // Async compile keeps the shader build off the main thread.
  // The back pins compile now, so the first flip does not stall.
  backs(true);
  await renderer.compileAsync(scene, camera);
  backs(false);
  ready = true;
  draw();
  requestAnimationFrame(() => { canvas.classList.add('on'); wake(); });
}
start().catch(err => { console.error(err); failed(); });
</script>
