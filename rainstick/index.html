<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html { background: oklch(0.1 0.012 265); }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rain stick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../shared/stim.css">
<link rel="stylesheet" href="../shared/intro.css">
<!-- Staged loading: the importmap comes first, then every module downloads in parallel. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "culori": "https://cdn.jsdelivr.net/npm/culori@4.0.1/+esm",
    "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>
<link rel="modulepreload" href="../shared/stim.js">
<link rel="modulepreload" href="../shared/intro.js">
<link rel="modulepreload" href="../shared/gl.js">
<link rel="modulepreload" href="./main.js">
<link rel="modulepreload" href="./sim.js">
<link rel="modulepreload" href="./draw.js">
<link rel="modulepreload" href="./voice.js">
<style>
/* Rain stick: a glass tube of beads and pins on a dark stage. */
:root { --stage: oklch(0.1 0.012 265); }
.stage--rainstick { background: var(--stage); cursor: grab; }
.stage--rainstick.is-turning { cursor: grabbing; }
.stage--rainstick canvas {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity 0.8s ease; touch-action: none;
}
.stage--rainstick canvas.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .stage--rainstick canvas { transition: none; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true">
  <div class="intro-mark"><div class="intro-text"><span class="intro-name">Rain stick</span><span class="intro-sub">Stimming Lab</span></div></div>
</div>

<div class="wrap">
  <header data-shell></header>
  <main>
    <div class="stage stage--rainstick" id="stage" tabindex="0" role="application" aria-label="A glass rain stick full of beads and brass pins. Drag to turn the tube; the beads run down through the pins, and each pin clicks and lights when a bead strikes it. Click to shake the tube. Press F to turn it over. Press the left or right arrow to tilt it.">
      <p class="fail" hidden>This toy cannot run in this browser. It needs WebGL 2.</p>
    </div>
  </main>
  <section class="about" aria-labelledby="toy-name">
    <h1 class="display" id="toy-name">Rain stick</h1>
    <div class="vignette" hidden></div>
  </section>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
